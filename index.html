n  - **MAC / HMAC** (симметричный подход)\n  - **Цифровую подпись** (асимметричный подход)"], "terms": [{"ru": "AAA", "en": "Authentication, Authorization, Accounting", "df": "**MFA** — многофакторная аутентификация"}], "summary": ["AAA: Authentication, Authorization, Accounting", "Факторы: знание(пароль), владение(токен), биометрия", "OTP: одноразовый пароль; TOTP=по времени(30с)", "HOTP=по счётчику; защита от replay attack", "Сертификатная: X.509 + подпись challenge закр. ключом", "mTLS: взаимная аутентификация обеих сторон", "MAC/HMAC: код аутентификации для проверки данных"]}, {"n": 66, "title": "IPSec.", "paragraphs": ["**IPSec** (Internet Protocol Security, RFC 4301–4309) — стандарт защиты IP-трафика на **сетевом уровне**.", "**Что обеспечивает:**\n- **Конфиденциальность** (шифрование)\n- **Целостность**\n- **Аутентификацию** источника\n- **Защиту от replay-атак**", "**Два режима работы:**", "**1. Транспортный режим (Transport Mode):**\n- Шифруется **только полезная нагрузка** IP-пакета\n- Исходный IP-заголовок остаётся\n- Для связи **конечных узлов** (host-to-host)", "**2. Туннельный режим (Tunnel Mode):**\n- Шифруется **весь IP-пакет**, добавляется **новый** IP-заголовок\n- Для **VPN-шлюзов** (gateway-to-gateway)", "**Два протокола IPSec:**", "**1. AH (Authentication Header) — протокол 51:**\n- Целостность + аутентификация\n- **Без шифрования**\n- Редко используется отдельно", "**2. ESP (Encapsulating Security Payload) — протокол 50:**\n- **Шифрование** + целостность + аутентификация\n- **Основной** протокол на практике", "**IKE (Internet Key Exchange):**\n- Протокол согласования ключей\n- Версии: IKEv1 и **IKEv2** (современная)\n- **Два этапа:**\n  1. **ISAKMP SA** — защищённый канал для управления\n  2. **IPSec SA** — параметры шифрования трафика", "**SA (Security Association):**\n- **Однонаправленный** контракт защиты\n- Содержит: алгоритмы, ключи, параметры\n- Хранятся в базах:\n  - **SAD** (Security Association Database) — активные SA\n  - **SPD** (Security Policy Database) — политики", "**Алгоритмы:**\n- Шифрование: AES-CBC, AES-GCM\n- Аутентификация: HMAC-SHA-256\n- Обмен ключами: **Diffie-Hellman**"], "terms": [{"ru": "AH", "en": "Authentication Header", "df": "без шифрования"}, {"ru": "ESP", "en": "Encapsulating Security Payload", "df": "со шифрованием"}], "summary": ["IPSec: защита на сетевом уровне (IP), RFC 4301-4309", "Транспортный реж: шифр. только payload IP-пакета", "Туннельный реж: шифр. весь IP-пакет + новый загол.", "AH(прот.51): целостность без шифрования", "ESP(прот.50): шифрование + целостность (основной)", "IKE(v1/v2): согласование ключей, 2 этапа", "SA: однонаправленный контракт (алгоритмы+ключи)"]}, {"n": 67, "title": "SSL / TLS.", "paragraphs": ["**TLS** (Transport Layer Security) — протокол защиты данных поверх TCP.\n- **Преемник SSL** (SSL устарел и скомпрометирован)\n- Актуальная версия: **TLS 1.3** (RFC 8446)\n- TLS 1.0 / 1.1 — устарели", "**Что обеспечивает TLS:**\n- **Аутентификация** сервера (опционально — клиента) через сертификаты **X.509**\n- **Согласование** алгоритмов шифрования\n- **Обмен ключами**\n- **Конфиденциальность + целостность** данных", "**Два подпротокола:**", "**1. Handshake Protocol (рукопожатие):**\n- Аутентификация и согласование сессионных ключей\n- В TLS 1.3 — только **ECDHE / DHE** → обеспечивается **PFS**", "**2. Record Protocol:**\n- Фрагментация данных\n- Вычисление MAC\n- Шифрование данных приложения", "**Рукопожатие TLS 1.3 (упрощённо):**\n1. **Client Hello** — поддерживаемые алгоритмы, случайное число\n2. **Server Hello** — выбранный набор, сертификат, подпись, Finished\n3. **Client Finished** — клиент завершает рукопожатие\n- Всего **1-RTT** (один круговой обход)\n- **0-RTT** — для возобновления сессии без задержек", "**Cipher Suite (набор шифров) в TLS 1.3:**\n- **AEAD** (Authenticated Encryption with Associated Data):\n  - AES-GCM\n  - ChaCha20-Poly1305\n- Хэш: SHA-256 / SHA-384", "**PFS (Perfect Forward Secrecy):**\n- Компрометация долгосрочного ключа **не раскрывает** прошлых сессий\n- Достигается эфемерным Diffie-Hellman (ECDHE / DHE)", "**Применение TLS:**\n- HTTPS, SMTPS, IMAPS, FTPS\n- SSL VPN (OpenVPN)"], "terms": [], "summary": ["TLS 1.3 (RFC 8446): актуальная версия; SSL устарел", "Handshake: аутентиф. + согласование ключей (1-RTT)", "Record Protocol: шифрование данных приложения", "PFS: ECDHE/DHE, компромет. ключа не раскрывает прошлое", "Cipher suite TLS1.3: AEAD(AES-GCM/ChaCha20)+SHA", "0-RTT: быстрое восстановление сессии без доп. RTT", "Применение: HTTPS(443), SMTPS, IMAPS, FTPS"]}, {"n": 68, "title": "Протокол Диффи-Хеллмана.", "paragraphs": ["**DH (Diffie-Hellman, 1976)** — первый протокол **открытого обмена ключами**:\n- Позволяет двум сторонам получить **общий секретный ключ** через **незащищённый канал**\n- Никто из подслушивающих не может вычислить ключ", "**Основа стойкости:** сложность задачи **дискретного логарифмирования** (Discrete Logarithm Problem).", "**Алгоритм:**", "**Публичные параметры** (известны всем):\n- Большое простое число **p**\n- **Примитивный корень g** по модулю p", "**Шаги:**\n1. **Алиса** выбирает случайное **a**, вычисляет **A = g^a mod p**, отправляет A Бобу\n2. **Боб** выбирает случайное **b**, вычисляет **B = g^b mod p**, отправляет B Алисе\n3. **Алиса**: K = B^a mod p = g^(ab) mod p\n4. **Боб**: K = A^b mod p = g^(ab) mod p\n5. Оба получают **одинаковый общий ключ K**", "Подслушивающий знает g, p, A, B — но не может вычислить ab без решения задачи дискретного логарифма.", "**Уязвимость базового DH:**\n- **Не аутентифицирует** стороны\n- Уязвим к **MITM** (Man-in-the-Middle): атакующий подменяет A и B\n- **Решения**:\n  - Подпись параметров сертификатом\n  - **STS** (Station-to-Station) — аутентифицированный вариант", "**Варианты:**\n- **ECDH** (Elliptic Curve DH) — на эллиптических кривых, **меньший размер ключа**\n- **ECDHE** (Ephemeral) — **случайные** ключи на каждую сессию → обеспечивает **PFS**", "**Применение:** IKE (IPSec), TLS, SSH.", "**Стойкость:**\n- DH 2048 бит ≈ 112 бит симметричного ключа\n- ECDH 256 бит ≈ 128 бит симметричного"], "terms": [], "summary": ["DH(1976): обмен ключами по открытому каналу", "Параметры: простое p, генератор g - публичны", "A=g^a mod p, B=g^b mod p -> K=g^(ab) mod p", "Безопасность: сложность дискретного логарифмирования", "Уязвимость: нет аутентификации -> MITM атака", "ECDH: эллиптич. кривые, короче ключ при той же стойк.", "DH-2048бит~112бит симм.; ECDH-256бит~128бит симм."]}, {"n": 69, "title": "Отечественные (российские) стандарты.", "paragraphs": ["**Симметричное шифрование:**", "**1. Магма (ГОСТ 28147-89, обновлён в ГОСТ Р 34.12-2015):**\n- Размер блока: **64 бита**\n- Размер ключа: **256 бит**\n- **32 раунда**\n- Архитектура: **сеть Фейстеля** (Feistel network)", "**2. Кузнечик (Grasshopper, ГОСТ Р 34.12-2015):**\n- Размер блока: **128 бит**\n- Размер ключа: **256 бит**\n- **10 раундов**\n- Архитектура: **SPN** (Substitution-Permutation Network)", "**Режимы работы** (ГОСТ Р 34.13-2015): ECB, CTR, OFB, CBC, CFB, **CTR-ACPKM**.", "**Хэш-функция: Стрибог (Streebog, ГОСТ Р 34.11-2012)**\n- Выход: **256 или 512 бит**\n- Заменил устаревший ГОСТ Р 34.11-94", "**Электронная подпись: ГОСТ Р 34.10-2012**\n- На основе **эллиптических кривых**\n- Размеры: 256 и 512 бит\n- Аналог зарубежного **ECDSA**", "**Обязательное применение в России:**\n- Государственные информационные системы\n- Обработка персональных данных (**ФЗ-152**)\n- Банковский сектор\n- Электронный документооборот", "**Реализации (СКЗИ):**\n- **КриптоПро CSP** (совместим с Microsoft CryptoAPI)\n- **ViPNet**\n- **Signal-COM**", "**Регулирование:**\n- **СКЗИ** (Средство Криптографической Защиты Информации) — сертифицированное ПО / устройство\n- Регулятор: **ФСБ России** (приказы)\n- Классы защиты (по возрастанию стойкости): КС1, КС2, КС3, КВ, КА", "**Процесс стандартизации:**\n1. **ТК 26** (Технический комитет 26) — разработка проекта\n2. Публичное обсуждение\n3. Утверждение **Росстандартом**"], "terms": [], "summary": ["Магма: 64-бит блок,256-бит ключ,32 раунда,Фейстель", "Кузнечик: 128-бит блок,256-бит ключ,10 раундов,SPN", "Стрибог(ГОСТ 34.11-2012): хэш 256/512 бит", "ГОСТ 34.10-2012: ЭП на эллиптич. кривых(256/512)", "Обязательно в госсистемах, ФЗ-152, банки", "СКЗИ: КриптоПро CSP, ViPNet; классы КС1...КА3", "Стандартизация: ТК 26 -> обсуждение -> Росстандарт"]}, {"n": 70, "title": "Зарубежные стандарты.", "paragraphs": ["**Главный регулятор:** **NIST** (National Institute of Standards and Technology, США).", "**Симметричное шифрование:**", "**1. DES (Data Encryption Standard, 1977):**\n- 56-битный ключ\n- **Устарел** (взломан за 22 часа в 1999)", "**2. 3DES (Triple DES):**\n- 168-битный ключ (эффективно ~112 бит из-за **meet-in-the-middle**)\n- **Выведен NIST в 2023**", "**3. AES (Advanced Encryption Standard, FIPS 197, 2001):**\n- Алгоритм **Rijndael** (победитель открытого конкурса)\n- Блок: **128 бит**, ключ: **128 / 192 / 256 бит**\n- Архитектура: **SPN** (Substitution-Permutation Network)\n- **Современный мировой стандарт**", "**Хэш-функции:**", "**1. SHA-1:**\n- 160 бит\n- В 2017 году найдены коллизии (атака **SHAttered**)\n- **Устарел**", "**2. SHA-2 (FIPS 180-4):**\n- Семейство: **SHA-256, SHA-384, SHA-512**\n- **Действующий стандарт**", "**3. SHA-3 (FIPS 202, 2015):**\n- На основе алгоритма **Keccak**\n- **Губчатая конструкция** (**Sponge Construction**)\n- Не подвержен атакам на конструкцию Меркла-Дамгарда (как у SHA-2)", "**Электронная подпись (DSS, FIPS 186):**\n- **DSA** — Digital Signature Algorithm (исключён в FIPS 186-5)\n- **RSA-подпись** — PKCS#1\n- **ECDSA** — Elliptic Curve DSA\n- **EdDSA** — современный (Ed25519), рекомендован FIPS 186-5 (2023)", "**Процесс стандартизации NIST:**\n1. **Открытый конкурс** (как у AES и SHA-3)\n2. **Публичное рецензирование** международными экспертами\n3. **Отбор** победителя\n4. **Публикация FIPS** (Federal Information Processing Standard)", "**Другие регуляторы:**\n- **ETSI** (European Telecommunications Standards Institute) — Европа\n- **BSI** (Bundesamt für Sicherheit in der Informationstechnik) — Германия"], "terms": [{"ru": "FIPS", "en": "Federal Information Processing Standard", "df": "федеральный стандарт США"}, {"ru": "SPN", "en": "Substitution-Permutation Network", "df": "архитектура AES и Кузнечика"}], "summary": ["DES(1977): 56бит, устарел; 3DES: до 168бит, выведен", "AES(2001,Rijndael): 128бит блок, 128/192/256 ключ,SPN", "SHA-1(160бит,скомпром.2017); SHA-2(256/512,действ.)", "SHA-3(Keccak): губчатая конструкция(sponge), FIPS 202", "DSS(FIPS 186): DSA,RSA-подпись,ECDSA,EdDSA(Ed25519)", "NIST: открытый конкурс -> рецензирование -> FIPS", "В ЕС: ETSI и BSI(Германия) - аналоги NIST"]}], "quizzes": [{"type": "mcq", "topic": "Вопрос 56", "q": "Какие три свойства составляют классическую триаду информационной безопасности (CIA)?", "opts": ["Конфиденциальность, целостность, доступность", "Конфиденциальность, идентификация, авторизация", "Целостность, аутентификация, доступность", "Шифрование, целостность, аудит"], "ans": 0, "expl": "Классическая триада ИБ — CIA: конфиденциальность (Confidentiality), целостность (Integrity), доступность (Availability)."}, {"type": "tf", "topic": "Вопрос 56", "q": "Формула оценки риска: Risk = Probability × Impact.", "ans": true, "expl": "Риск (risk) — вероятность реализации угрозы с учётом её последствий: Risk = Probability × Impact."}, {"type": "mcq", "topic": "Вопрос 57", "q": "Какая атака заполняет таблицу полуоткрытых TCP-соединений?", "opts": ["UDP flood", "HTTP flood", "SYN flood", "Smurf"], "ans": 2, "expl": "SYN flood — заполнение таблицы полуоткрытых соединений."}, {"type": "tf", "topic": "Вопрос 57", "q": "Сетевой червь (worm), в отличие от вируса, распространяется по сети автономно, без участия пользователя.", "ans": true, "expl": "Сетевой червь (worm) — самовоспроизводящаяся программа, распространяющаяся по сети автономно, без участия пользователя. Вирус требует участия пользователя."}, {"type": "mcq", "topic": "Вопрос 58", "q": "Какая модель упра function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}

function kwColor(s){
  // Bold **...** → orange
  s = s.replace(/\*\*(.+?)\*\*/g, '<span class="kw kw-concept">$1</span>');
  // English in parens
  s = s.replace(/\(([A-Za-z][A-Za-z0-9\s\/\.\-\+,&;:]+?)\)/g, function(m, inner){
    return '(<span class="kw kw-en">'+inner+'</span>)';
  });
  // Protocols
  PROTOS.forEach(p => {
    const re = new RegExp('(?<![\\wА-Яа-яёЁ])(' + p.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&') + ')(?![\\wА-Яа-яёЁ])','g');
    s = s.replace(re, '<span class="kw kw-proto">$1</span>');
  });
  // Standards
  STDS.forEach(st => {
    const re = new RegExp('(?<![\\wА-Яа-яёЁ])(' + st.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&') + ')(?![\\wА-Яа-яёЁ])','g');
    s = s.replace(re, '<span class="kw kw-std">$1</span>');
  });
  // Abbreviations
  ABBRS.forEach(ab => {
    const re = new RegExp('(?<![\\wА-Яа-яёЁ"\\/])(' + ab.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&') + ')(?![\\wА-Яа-яёЁ])','g');
    s = s.replace(re, '<span class="kw kw-abbr">$1</span>');
  });
  return s;
}

function colorize(text){
  // Split into lines and process markdown lists
  const lines = text.split('\n');
  let html = '';
  let inUl = false, inSub = false;
  for (const raw of lines) {
    const line = raw.trimEnd();
    const subMatch = line.match(/^\s{2,}-\s+(.*)/);
    const topMatch = line.match(/^-\s+(.*)/);
    if (subMatch) {
      if (!inSub) { html += '<ul class="md-sub">'; inSub = true; }
      html += '<li>' + kwColor(esc(subMatch[1])) + '</li>';
    } else if (topMatch) {
      if (inSub) { html += '</ul>'; inSub = false; }
      if (!inUl) { html += '<ul class="md-list">'; inUl = true; }
      html += '<li>' + kwColor(esc(topMatch[1])) + '</li>';
    } else {
      if (inSub) { html += '</ul>'; inSub = false; }
      if (inUl) { html += '</ul>'; inUl = false; }
      html += kwColor(esc(line)) + ' ';
    }
  }
  if (inSub) html += '</ul>';
  if (inUl) html += '</ul>';
  return html.trim();
}

let view='home', topicIdx=-1;
const reviewSeen={};
let quizQs=[],quizIdx=0,quizScore=0,quizAnswered=false,quizResults=[],matchState={};

function init(){renderSidebar();renderHome()}

function renderSidebar(){
  const nav=document.getElementById('navList');
  let h=`<div class="nav-item ${view==='home'?'active':''}" onclick="goHome()">
    <div class="nav-num" style="background:var(--purple);color:#000">&#9776;</div>
    <div class="nav-text">Главная</div></div>`;
  TOPICS.forEach((t,i)=>{
    h+=`<div class="nav-item ${topicIdx===i&&view!=='home'?'active':''}" onclick="selectTopic(${i})">
      <div class="nav-num">T${t.id}</div>
      <div class="nav-text">${t.name.substring(0,38)}${t.name.length>38?'…':''}</div></div>`;
  });
  nav.innerHTML=h;
}

function goHome(){view='home';topicIdx=-1;renderSidebar();renderHome();closeSidebar();}

function renderHome(){
  document.getElementById('topTitle').textContent='Главная';
  document.getElementById('topRight').innerHTML='';
  let total=TOPICS.reduce((s,t)=>s+t.questions.length,0);
  let h=`<div class="home-title">Кандидатский экзамен — Блок 3</div>
    <div class="home-sub">Системы, сети и устройства телекоммуникаций · ${total} вопросов · 8 тем</div>
    <div class="topics-grid">`;
  TOPICS.forEach((t,i)=>{
    h+=`<div class="topic-card" onclick="selectTopic(${i})">
      <div class="topic-card-num">Тема ${t.id}</div>
      <div class="topic-card-name">${esc(t.name)}</div>
      <div class="topic-card-info"><span>&#128196; ${t.questions.length} вопр.</span><span>&#9997; ${t.quizzes.length} тест.</span></div>
      <div class="topic-card-btns">
        <button class="tc-btn primary" onclick="event.stopPropagation();selectTopic(${i},'review')">Обзор</button>
        <button class="tc-btn" onclick="event.stopPropagation();selectTopic(${i},'quiz')">Тест</button>
      </div></div>`;
  });
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}

function selectTopic(i,mode){
  topicIdx=i;view=mode||'review';
  if(!reviewSeen[TOPICS[i].id])reviewSeen[TOPICS[i].id]=new Set();
  renderSidebar();
  if(view==='review')renderReview();else startQuiz();
  closeSidebar();
}

function renderReview(){
  const t=TOPICS[topicIdx];
  document.getElementById('topTitle').textContent=`Тема ${t.id} · ${t.name}`;
  document.getElementById('topRight').innerHTML=`
    <button class="btn-sm active-tab" onclick="switchMode('review')">Обзор</button>
    <button class="btn-sm" onclick="switchMode('quiz')">Тест</button>
    <button class="btn-sm" onclick="goHome()">&#8962;</button>`;

  let h=`<div class="back-btn" onclick="goHome()">&#8592; Все темы</div>
    <div class="expand-bar">
      <button class="btn-sm" onclick="toggleAll(true)">&#9660; Раскрыть все</button>
      <button class="btn-sm" onclick="toggleAll(false)">&#9650; Свернуть все</button>
    </div>`;

  t.questions.forEach((q,qi)=>{
    reviewSeen[t.id].add(qi);
    const ansHTML=q.paragraphs.map(p=>{
      const t=p.trimStart();
      if(/^<(svg|figure|img|table|h2|h3|h4|pre|div|ul|ol|blockquote)\b/i.test(t)) return p;
      return `<p>${colorize(p)}</p>`;
    }).join('');
    const termsHTML=q.terms.map(tm=>`
      <div class="t-card">
        <div class="t-ru">${esc(tm.ru)}</div>
        <div class="t-en">${esc(tm.en)}</div>
        <div class="t-df">${esc(tm.df)}</div>
      </div>`).join('');

    h+=`<div class="q-item">
      <div class="q-hdr" onclick="toggleQ(this)">
        <div class="q-badge">В${q.n}</div>
        <div class="q-ttl">${esc(q.title)}</div>
        <button class="copy-btn" onclick="event.stopPropagation();copyQ(this)">Копировать вопрос</button>
        <div class="q-chev">&#9660;</div>
      </div>
      <div class="q-body">
        <div class="a-section">
          <div class="a-label">Ответ<button class="copy-btn" onclick="copyAns(this)">Копировать</button></div>
          <div class="a-text">${ansHTML}</div>
        </div>
        ${q.terms.length?`<div class="a-section">
          <div class="a-label">Терминология<button class="copy-btn" onclick="copyAns(this)">Копировать</button></div>
          <div class="t-grid">${termsHTML}</div>
        </div>`:''}
        ${q.summary&&q.summary.length?`<div class="a-section">
          <div class="sum-box">
            <div class="sum-title">Записать на бумагу<button class="copy-btn" onclick="copySum(this)">Копировать</button></div>
            <ul class="sum-list">${q.summary.map(b=>'<li class="sum-item">'+colorize(b)+'</li>').join('')}</ul>
          </div>
        </div>`:''}
        ${renderInlineQuiz(t, q.n, qi)}
      </div></div>`;
  });

  document.getElementById('content').innerHTML=h;
  document.getElementById('mainArea').scrollTo({top:0});
  updateProgress();
}

function copyAns(btn){
  const sec=btn.closest('.a-section');
  const el=sec.querySelector('.a-text')||sec.querySelector('.t-grid');
  navigator.clipboard.writeText(el.innerText).then(()=>{
    btn.textContent='Скопировано!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Копировать';btn.classList.remove('copied')},1500);
  });
}
function copyQ(btn){
  const hdr=btn.closest('.q-hdr');
  const txt=hdr.querySelector('.q-badge').innerText+'. '+hdr.querySelector('.q-ttl').innerText;
  navigator.clipboard.writeText(txt).then(()=>{
    btn.textContent='Скопировано!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Копировать вопрос';btn.classList.remove('copied')},1500);
  });
}
function copySum(btn){
  const txt=btn.closest('.sum-box').querySelector('.sum-list').innerText;
  navigator.clipboard.writeText(txt).then(()=>{
    btn.textContent='Скопировано!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Копировать';btn.classList.remove('copied')},1500);
  });
}
function toggleQ(el){
  const b=el.nextElementSibling,c=el.querySelector('.q-chev');
  const o=b.classList.contains('visible');
  b.classList.toggle('visible',!o);c.classList.toggle('open',!o);
}
function toggleAll(open){
  document.querySelectorAll('.q-body').forEach(b=>b.classList.toggle('visible',open));
  document.querySelectorAll('.q-chev').forEach(c=>c.classList.toggle('open',open));
}

// ─── INLINE QUIZ (per question) ───
function renderInlineQuiz(topic, qn, qi) {
  const prefix = `Вопрос ${qn}`;
  const qs = topic.quizzes.filter(q => q.topic === prefix);
  if (!qs.length) return '';
  const id = `iq_${topic.id}_${qi}`;
  let h = `<div class="a-section iq-section"><div class="iq-box"><div class="iq-title">Проверь себя (${qs.length})</div>`;
  qs.forEach((q, i) => {
    const uid = `${id}_${i}`;
    if (q.type === 'mcq') {
      const letters = 'ABCD';
      h += `<div class="iq-item" id="${uid}"><div class="iq-q">${esc(q.q)}</div><div class="iq-opts">`;
      q.opts.forEach((o, oi) => {
        h += `<div class="iq-opt" onclick="iqMCQ('${uid}',${oi},${q.ans})" id="${uid}_o${oi}"><div class="iq-ltr">${letters[oi]}</div><div>${esc(o)}</div></div>`;
      });
      h += `</div><div class="iq-fb" id="${uid}_fb">${esc(q.expl)}</div></div>`;
    } else if (q.type === 'tf') {
      h += `<div class="iq-item" id="${uid}"><div class="iq-q">${esc(q.q)}</div><div class="iq-tf">`;
      h += `<button class="iq-tf-btn" id="${uid}_t" onclick="iqTF('${uid}',true,${q.ans})">&#10004; Верно</button>`;
      h += `<button class="iq-tf-btn" id="${uid}_f" onclick="iqTF('${uid}',false,${q.ans})">&#10008; Неверно</button>`;
      h += `</div><div class="iq-fb" id="${uid}_fb">${esc(q.expl)}</div></div>`;
    } else if (q.type === 'match') {
      // Render match as a simpler "review pairs" display for inline
      h += `<div class="iq-item"><div class="iq-q">${esc(q.q)}</div>`;
      h += `<div class="t-grid">`;
      q.pairs.forEach(p => {
        h += `<div class="t-card"><div class="t-ru">${esc(p.l)}</div><div class="t-en">${esc(p.r)}</div></div>`;
      });
      h += `</div></div>`;
    }
  });
  h += `</div></div>`;
  return h;
}

function iqMCQ(uid, picked, correct) {
  const item = document.getElementById(uid);
  if (item.dataset.done) return;
  item.dataset.done = '1';
  item.querySelectorAll('.iq-opt').forEach(el => el.classList.add('iq-dis'));
  document.getElementById(`${uid}_o${picked}`).classList.add(picked === correct ? 'iq-ok' : 'iq-no');
  if (picked !== correct) document.getElementById(`${uid}_o${correct}`).classList.add('iq-ok');
  const fb = document.getElementById(`${uid}_fb`);
  fb.classList.add('show', picked === correct ? 'iq-fb-ok' : 'iq-fb-no');
}

function iqTF(uid, picked, correct) {
  const item = document.getElementById(uid);
  if (item.dataset.done) return;
  item.dataset.done = '1';
  document.querySelectorAll(`#${uid} .iq-tf-btn`).forEach(b => b.classList.add('iq-dis'));
  const clickedBtn = document.getElementById(`${uid}_${picked ? 't' : 'f'}`);
  const correctBtn = document.getElementById(`${uid}_${correct ? 't' : 'f'}`);
  clickedBtn.classList.add(picked === correct ? 'iq-ok' : 'iq-no');
  if (picked !== correct) correctBtn.classList.add('iq-ok');
  const fb = document.getElementById(`${uid}_fb`);
  fb.classList.add('show', picked === correct ? 'iq-fb-ok' : 'iq-fb-no');
}

// ─── QUIZ ───
function startQuiz(){
  const t=TOPICS[topicIdx];quizQs=[...t.quizzes];shuffle(quizQs);
  quizIdx=0;quizScore=0;quizResults=[];quizAnswered=false;matchState={};renderQuizUI();
}

function renderQuizUI(){
  const t=TOPICS[topicIdx];
  document.getElementById('topTitle').textContent=`Тема ${t.id} · Тест`;
  document.getElementById('topRight').innerHTML=`
    <button class="btn-sm" onclick="switchMode('review')">Обзор</button>
    <button class="btn-sm active-tab" onclick="switchMode('quiz')">Тест</button>
    <button class="btn-sm" onclick="goHome()">&#8962;</button>`;
  if(!quizQs.length){document.getElementById('content').innerHTML=`<div class="res-card"><div class="res-title">Нет тестов</div><button class="btn-q btn-q-p" onclick="switchMode('review')">К обзору</button></div>`;return;}
  if(quizIdx>=quizQs.length){renderQuizResults();return;}
  const q=quizQs[quizIdx];
  const bg={mcq:'badge-mcq',tf:'badge-tf',match:'badge-match',fill:'badge-fill'};
  const lb={mcq:'Выбор',tf:'Верно/Неверно',match:'Сопоставление',fill:'Заполнить'};
  let body='';
  if(q.type==='mcq'){
    body='<div class="options">';
    'ABCD'.split('').forEach((l,oi)=>{if(oi<q.opts.length)body+=`<div class="option" onclick="selMCQ(${oi})" id="opt${oi}"><div class="o-letter">${l}</div><div class="o-text">${esc(q.opts[oi])}</div></div>`;});
    body+='</div>';
  }else if(q.type==='tf'){
    body=`<div class="tf-options"><button class="tf-btn" id="tfT" onclick="selTF(true)">&#10004; Верно</button><button class="tf-btn" id="tfF" onclick="selTF(false)">&#10008; Неверно</button></div>`;
  }else if(q.type==='match'){
    matchState={left:null,matched:[],pairs:q.pairs};
    const sr=[...q.pairs].map((p,i)=>({...p,oi:i}));shuffle(sr);matchState.sr=sr;
    body=`<div class="match-container"><div class="match-col"><h4>Термин</h4>${q.pairs.map((p,i)=>`<div class="match-item" id="ml${i}" onclick="selML(${i})">${esc(p.l)}</div>`).join('')}</div><div class="match-col"><h4>Перевод</h4>${sr.map((p,i)=>`<div class="match-item" id="mr${i}" onclick="selMR(${i})">${esc(p.r)}</div>`).join('')}</div></div>`;
  }else if(q.type==='fill'){
    body=`<div class="fill-wrap"><input class="fill-input" id="fillIn" placeholder="Ответ..." onkeypress="if(event.key==='Enter')chkFill()"><button class="btn-q btn-q-p" onclick="chkFill()">Проверить</button></div>`;
  }
  document.getElementById('content').innerHTML=`<div class="quiz-card"><span class="qt-badge ${bg[q.type]}">${lb[q.type]}</span><div style="color:var(--muted);font-size:.78rem;margin-bottom:10px">${esc(q.topic)}</div><div class="q-text">${esc(q.q)}</div>${body}<div class="feedback" id="fb"></div><div class="quiz-nav"><div class="quiz-progress">${quizIdx+1}/${quizQs.length}</div><button class="btn-q btn-q-p" id="nxtBtn" onclick="nxtQ()" disabled>&#8594; Далее</button></div></div>`;
  quizAnswered=false;document.getElementById('mainArea').scrollTo({top:0});
}

function selMCQ(i){if(quizAnswered)return;quizAnswered=true;const q=quizQs[quizIdx],ok=i===q.ans;if(ok)quizScore++;quizResults.push({q:q.q,ok,expl:q.expl});document.querySelectorAll('.option').forEach(e=>e.classList.add('disabled'));document.getElementById('opt'+i).classList.add(ok?'correct':'incorrect');if(!ok)document.getElementById('opt'+q.ans).classList.add('correct');showFB(ok,q.expl);}
function selTF(v){if(quizAnswered)return;quizAnswered=true;const q=quizQs[quizIdx],ok=v===q.ans;if(ok)quizScore++;quizResults.push({q:q.q,ok,expl:q.expl});document.querySelectorAll('.tf-btn').forEach(b=>b.classList.add('disabled'));document.getElementById(v?'tfT':'tfF').classList.add(ok?'correct':'incorrect');if(!ok)document.getElementById(q.ans?'tfT':'tfF').classList.add('correct');showFB(ok,q.expl);}
function selML(i){if(matchState.matched.includes(i))return;document.querySelectorAll('.match-col:first-child .match-item').forEach(e=>e.classList.remove('active'));document.getElementById('ml'+i).classList.add('active');matchState.left=i;}
function selMR(ri){if(matchState.left===null)return;const sr=matchState.sr[ri];if(document.getElementById('mr'+ri).classList.contains('matched-correct'))return;const li=matchState.left,ok=matchState.pairs[li].r===sr.r;document.getElementById('ml'+li).classList.remove('active');if(ok){document.getElementById('ml'+li).classList.add('matched-correct');document.getElementById('mr'+ri).classList.add('matched-correct');matchState.matched.push(li);}else{document.getElementById('ml'+li).classList.add('matched-wrong');document.getElementById('mr'+ri).classList.add('matched-wrong');setTimeout(()=>{document.getElementById('ml'+li).classList.remove('matched-wrong');document.getElementById('mr'+ri).classList.remove('matched-wrong');},700);}matchState.left=null;if(matchState.matched.length===matchState.pairs.length){quizAnswered=true;quizScore++;quizResults.push({q:quizQs[quizIdx].q,ok:true,expl:quizQs[quizIdx].expl});showFB(true,quizQs[quizIdx].expl);}}
function chkFill(){if(quizAnswered)return;quizAnswered=true;const q=quizQs[quizIdx],inp=document.getElementById('fillIn'),v=inp.value.trim(),ok=v.toLowerCase().replace(/[^a-zа-яё0-9]/gi,'')===q.ans.toLowerCase().replace(/[^a-zа-яё0-9]/gi,'');if(ok)quizScore++;quizResults.push({q:q.q,ok,expl:q.expl});inp.classList.add(ok?'correct':'incorrect');inp.disabled=true;showFB(ok,q.expl+(ok?'':` Ответ: ${q.ans}`));}
function showFB(ok,expl){const fb=document.getElementById('fb');fb.className=`feedback show ${ok?'correct-fb':'incorrect-fb'}`;fb.innerHTML=`<div class="fb-title">${ok?'&#10004; Правильно!':'&#10008; Неправильно'}</div>${esc(expl)}`;document.getElementById('nxtBtn').disabled=false;}
function nxtQ(){quizIdx++;quizIdx>=quizQs.length?renderQuizResults():renderQuizUI();}

function renderQuizResults(){
  const t=TOPICS[topicIdx],pct=quizQs.length?Math.round(quizScore/quizQs.length*100):0,wrong=quizQs.length-quizScore;
  let rv=quizResults.map(r=>`<div style="padding:8px 12px;border-radius:8px;margin-bottom:5px;font-size:.84rem;background:${r.ok?'rgba(63,185,80,.06)':'rgba(255,123,114,.05)'};border:1px solid ${r.ok?'rgba(63,185,80,.2)':'rgba(255,123,114,.15)'}"><span>${r.ok?'&#10004;':'&#10008;'}</span> <b>${esc(r.q)}</b><div style="color:var(--muted);font-size:.8rem">${esc(r.expl)}</div></div>`).join('');
  document.getElementById('content').innerHTML=`<div class="res-card"><div class="sc-circle"><div class="sc-num">${pct}%</div><div class="sc-tot">${quizScore}/${quizQs.length}</div></div><div class="res-title">${pct>=80?'Отлично!':pct>=60?'Хорошо':'Повторите'}</div><div class="res-sub">Тема ${t.id}: ${esc(t.name)}</div><div class="res-grid"><div class="res-item"><div class="res-n" style="color:var(--green)">${quizScore}</div><div class="res-l">Верно</div></div><div class="res-item"><div class="res-n" style="color:var(--red)">${wrong}</div><div class="res-l">Ошибок</div></div><div class="res-item"><div class="res-n" style="color:var(--accent)">${pct}%</div><div class="res-l">Итог</div></div></div><div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px"><button class="btn-q btn-q-p" onclick="startQuiz()">&#8635; Заново</button><button class="btn-q btn-q-s" onclick="switchMode('review')">Обзор</button><button class="btn-q btn-q-s" onclick="goHome()">&#8962; Домой</button></div><div style="text-align:left">${rv}</div></div>`;
  document.getElementById('mainArea').scrollTo({top:0});
}

function switchMode(m){view=m;renderSidebar();m==='review'?renderReview():startQuiz();}
function updateProgress(){let total=TOPICS.reduce((s,t)=>s+t.questions.length,0),seen=0;for(const k in reviewSeen)seen+=reviewSeen[k].size;document.getElementById('miniProgress').style.width=(total?seen/total*100:0)+'%';document.getElementById('sidebarInfo').textContent=`${seen}/${total} просмотрено`;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();document.getElementById('searchInput').focus();document.getElementById('searchInput').select();return;}
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='Escape')goHome();
});

// ─── SIDEBAR (mobile drawer) ───
function toggleSidebar(){
  document.querySelector('.sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}
function closeSidebar(){
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

// ─── SEARCH ───
let prevView=null, prevTopicIdx=-1, searchTimer=null, currentQuery='';

function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

function highlight(text,q){
  if(!q||!text)return esc(text||'');
  const lower=text.toLowerCase(), ql=q.toLowerCase();
  let out='', i=0;
  while(i<text.length){
    const m=lower.indexOf(ql,i);
    if(m<0){out+=esc(text.slice(i));break;}
    out+=esc(text.slice(i,m))+'<mark>'+esc(text.slice(m,m+ql.length))+'</mark>';
    i=m+ql.length;
  }
  return out;
}

function snippet(text,q,ctx){
  ctx=ctx||80;
  if(!text)return '';
  const lower=text.toLowerCase(), ql=q.toLowerCase();
  const i=lower.indexOf(ql);
  if(i<0)return esc(text.slice(0,160))+(text.length>160?'…':'');
  const s=Math.max(0,i-ctx), e=Math.min(text.length,i+ql.length+ctx);
  return (s>0?'…':'')+highlight(text.slice(s,e),q)+(e<text.length?'…':'');
}

function stripTags(s){return (s||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();}

function onSearch(v){
  clearTimeout(searchTimer);
  const q=v.trim();
  document.getElementById('searchClear').classList.toggle('show', q.length>0);
  searchTimer=setTimeout(()=>{
    if(q.length===0){
      if(view==='search'){
        currentQuery='';
        if(prevView==='review'&&prevTopicIdx>=0){topicIdx=prevTopicIdx;view='review';renderSidebar();renderReview();}
        else{goHome();}
      }
      return;
    }
    if(view!=='search'){prevView=view;prevTopicIdx=topicIdx;view='search';renderSidebar();}
    currentQuery=q;
    renderSearch(q);
  },180);
}

function clearSearch(){
  const inp=document.getElementById('searchInput');
  inp.value='';
  onSearch('');
  inp.focus();
}

function renderSearch(q){
  document.getElementById('topTitle').textContent=`Поиск: «${q}»`;
  document.getElementById('topRight').innerHTML=`<button class="btn-sm" onclick="goHome()">&#8962;</button>`;
  const ql=q.toLowerCase();
  const results=[];
  TOPICS.forEach((t,ti)=>{
    t.questions.forEach((qq,qi)=>{
      const inTitle=qq.title.toLowerCase().includes(ql);
      const allAns=stripTags((qq.paragraphs||[]).join(' '));
      const inAns=allAns.toLowerCase().includes(ql);
      const termHit=(qq.terms||[]).find(tm=>((tm.ru||'')+' '+(tm.en||'')+' '+(tm.df||'')).toLowerCase().includes(ql));
      const allSum=(qq.summary||[]).join(' ');
      const inSum=allSum.toLowerCase().includes(ql);
      if(inTitle||inAns||termHit||inSum){
        let snipText='', snipLabel='';
        if(inAns){snipText=allAns;snipLabel='ответ';}
        else if(inSum){snipText=allSum;snipLabel='шпаргалка';}
        else if(termHit){snipText=`${termHit.ru} (${termHit.en}) — ${termHit.df}`;snipLabel='термин';}
        results.push({ti,qi,topic:t,q:qq,snipText,snipLabel});
      }
    });
  });
  let h=`<div class="sr-header">${results.length===0?'Ничего не найдено':`Найдено: ${results.length} ${results.length===1?'результат':results.length<5?'результата':'результатов'}`}</div>`;
  if(results.length===0){
    h+=`<div class="sr-empty">По запросу «${esc(q)}» ничего не найдено.<br>Попробуйте другие ключевые слова.</div>`;
  }else{
    h+='<div class="sr-list">';
    results.forEach(r=>{
      h+=`<div class="sr-item" onclick="openSearchResult(${r.ti},${r.qi})">
        <div class="sr-topic">Тема ${r.topic.id} · Вопрос ${r.q.n}${r.snipLabel?' · '+r.snipLabel:''}</div>
        <div class="sr-title">${highlight(r.q.title,q)}</div>
        ${r.snipText?`<div class="sr-snippet">${snippet(r.snipText,q)}</div>`:''}
      </div>`;
    });
    h+='</div>';
  }
  document.getElementById('content').innerHTML=h;
  document.getElementById('mainArea').scrollTo({top:0});
}

function openSearchResult(ti,qi){
  document.getElementById('searchInput').value='';
  document.getElementById('searchClear').classList.remove('show');
  currentQuery='';
  topicIdx=ti;view='review';
  if(!reviewSeen[TOPICS[ti].id])reviewSeen[TOPICS[ti].id]=new Set();
  renderSidebar();renderReview();
  closeSidebar();
  setTimeout(()=>{
    const items=document.querySelectorAll('.q-item');
    const item=items[qi];
    if(item){
      const body=item.querySelector('.q-body');
      const chev=item.querySelector('.q-chev');
      body.classList.add('visible');
      chev.classList.add('open');
      item.classList.add('flash');
      item.scrollIntoView({behavior:'smooth',block:'start'});
      setTimeout(()=>item.classList.remove('flash'),1700);
    }
  },60);
}

init();
</script>
