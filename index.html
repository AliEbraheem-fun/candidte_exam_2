аршрутизатор отправляет ошибку отправителю\n- В **IPv6** маршрутизаторам фрагментировать запрещено. Отправитель сам определяет минимальный MTU вдоль всего пути с помощью **Path MTU Discovery** и отправляет пакеты подходящего размера"], "terms": [{"ru": "Объединение сетей", "en": "internetworking", "df": "связывание разнородных сетей в единую систему"}, {"ru": "Туннелирование", "en": "tunneling", "df": "инкапсуляция пакета одного протокола внутрь другого"}, {"ru": "MTU", "en": "Maximum Transmission Unit", "df": "максимальный размер пакета, допустимый в данной сети"}, {"ru": "Фрагментация", "en": "fragmentation", "df": "разбиение пакета на части при превышении MTU"}, {"ru": "DF", "en": "Don't Fragment", "df": "флаг в IPv4, запрещающий фрагментацию"}], "summary": ["Объединение сетей: повторитель L1, мост L2, маршрутизатор L3", "Туннелирование: инкапсуляция протокола внутрь другого", "Примеры: 6in4 (IPv6 через IPv4), VPN, Mobile IP", "MTU = макс. размер пакета в канале; фрагментация при превышении", "IPv4: фрагментация маршрутизаторами, сборка получателем", "IPv6: фрагментация только отправителем (Path MTU Discovery)", "Флаг DF запрещает фрагментацию в IPv4"]}, {"n": 39, "title": "Протокол IPv4. Формат IP-пакета. Схема IP-маршрутизации. Маски. Фрагментация IP-пакетов.", "paragraphs": ["**IPv4** (Internet Protocol version 4) — основной протокол сетевого уровня Интернета. Он отвечает за адресацию узлов и доставку пакетов от отправителя к получателю через маршрутизаторы.", "**1. Формат IP-пакета** (заголовок IPv4, минимум 20 байт):\n- **Version** (4 бита) — версия протокола (4 для IPv4)\n- **IHL** (Internet Header Length, 4 бита) — длина заголовка в 32-битных словах (обычно 5 = 20 байт)\n- **ToS/DSCP** (8 бит) — тип обслуживания, используется для QoS (маркировка приоритета, см. Q37)\n- **Total Length** (16 бит) — полная длина пакета в байтах (заголовок + данные), максимум 65 535 байт\n- **Identification** (16 бит) — идентификатор пакета, одинаковый для всех его фрагментов\n- **Flags** (3 бита): **DF** (Don't Fragment — запрет фрагментации) и **MF** (More Fragments — есть ещё фрагменты)\n- **Fragment Offset** (13 бит) — смещение данного фрагмента от начала исходного пакета (в единицах по 8 байт)\n- **TTL** (Time to Live, 8 бит) — счётчик переходов: уменьшается на 1 на каждом маршрутизаторе, при 0 пакет уничтожается. Защищает от бесконечного зацикливания\n- **Protocol** (8 бит) — какой протокол внутри: 6 = TCP, 17 = UDP, 1 = ICMP\n- **Header Checksum** (16 бит) — контрольная сумма только заголовка (пересчитывается на каждом маршрутизаторе, т.к. TTL меняется)\n- **Source и Destination Address** — IP-адреса отправителя и получателя, по **32 бита** каждый (например, 192.168.1.1)", "**2. Схема IP-маршрутизации и маски:**\n- IP-адрес делится на две части: **адрес сети** (network) и **адрес хоста** (host). **Маска подсети** (subnet mask) определяет, где проходит граница — например, маска 255.255.255.0 означает, что первые 24 бита — сеть, последние 8 — хост\n- **CIDR** (Classless Inter-Domain Routing — бесклассовая адресация) заменил старую классовую систему (классы A, B, C). Вместо фиксированных границ используется произвольная длина префикса: например, 10.0.0.0/24 означает 24 бита для сети\n- Маршрутизатор выбирает маршрут по принципу **longest prefix match** — из всех подходящих записей в таблице выбирается самая специфичная (с самым длинным совпадающим префиксом)", "**3. Фрагментация IP-пакетов:**\n- Если пакет больше **MTU** (Maximum Transmission Unit) следующей сети, маршрутизатор разбивает его на фрагменты\n- Все фрагменты получают одинаковое поле **Identification**, чтобы получатель мог их собрать. У всех фрагментов, кроме последнего, установлен флаг **MF**. Поле **Fragment Offset** указывает позицию каждого фрагмента\n- Сборка фрагментов выполняется только получателем, а не промежуточными маршрутизаторами\n- Флаг **DF** запрещает фрагментацию — если пакет не проходит, маршрутизатор отправляет отправителю сообщение об ошибке (ICMP). Это используется в **Path MTU Discovery**"], "terms": [{"ru": "IPv4", "en": "Internet Protocol version 4", "df": "основной протокол сетевого уровня с 32-битными адресами"}, {"ru": "IHL", "en": "Internet Header Length", "df": "длина заголовка в 32-битных словах"}, {"ru": "TTL", "en": "Time to Live", "df": "счётчик переходов, защита от зацикливания"}, {"ru": "Маска подсети", "en": "subnet mask", "df": "определяет границу между адресом сети и хоста"}, {"ru": "CIDR", "en": "Classless Inter-Domain Routing", "df": "бесклассовая адресация с произвольной длиной префикса /N"}, {"ru": "MTU", "en": "Maximum Transmission Unit", "df": "максимальный размер пакета в данной сети"}, {"ru": "DF", "en": "Don't Fragment", "df": "флаг запрета фрагментации"}, {"ru": "MF", "en": "More Fragments", "df": "флаг: за этим фрагментом следуют ещё"}], "summary": ["IPv4 заголовок: Version, IHL, ToS, Total Length, TTL, Protocol", "Адреса: Source + Destination по 32 бита каждый", "CIDR: бесклассовая адресация /N, longest prefix match", "Фрагментация: Identification одинаково у всех фрагментов", "MF=1 у всех кроме последнего; Offset в единицах по 8 байт", "Fragment Offset — 13 бит; TTL — 8 бит; Total Length — 16 бит"]}, {"n": 40, "title": "Протокол IPv6. Управляющие протоколы Интернета. Коммутация меток и MPLS.", "paragraphs": ["**1. Протокол IPv6:**\n- IPv6 создан для замены IPv4, у которого закончились адреса. Адрес IPv6 имеет длину **128 бит** (вместо 32 у IPv4), что даёт практически неограниченное количество адресов\n- Заголовок IPv6 имеет **фиксированную длину 40 байт** (в IPv4 длина переменная). Основные поля: **Version** (6), **Traffic Class** (приоритет, аналог ToS/DSCP), **Flow Label** (20 бит — метка потока для идентификации связанных пакетов), **Payload Length** (длина данных), **Next Header** (какой протокол или расширенный заголовок следующий), **Hop Limit** (аналог TTL), адреса отправителя и получателя (по 128 бит)\n- Ключевые отличия от IPv4: нет контрольной суммы заголовка (экономит время на маршрутизаторах), нет фрагментации маршрутизаторами (только отправитель), дополнительные функции реализуются через цепочку **расширенных заголовков** (extension headers)", "**2. Управляющие протоколы Интернета:**\n- **ICMP** (Internet Control Message Protocol) — протокол диагностики и сообщений об ошибках. Используется командами **ping** (проверка доступности) и **traceroute** (определение маршрута)\n- **ARP** (Address Resolution Protocol) — определяет MAC-адрес устройства по его IP-адресу в локальной сети. Работает только в IPv4\n- **DHCP** (Dynamic Host Configuration Protocol) — автоматически назначает IP-адрес, маску, шлюз и DNS-сервер устройствам при подключении к сети\n- **ICMPv6** — версия ICMP для IPv6, включает в себя **NDP** (Neighbor Discovery Protocol — протокол обнаружения соседей), который заменяет ARP и часть функций DHCP в IPv6", "**3. Коммутация меток и MPLS:**\n- **MPLS** (Multiprotocol Label Switching) — технология, ускоряющая передачу пакетов. Вместо анализа IP-адреса на каждом маршрутизаторе пакеты пересылаются по короткой **метке** (label, 20 бит), вставленной между канальным и IP-заголовком\n- На входе в MPLS-сеть пограничный маршрутизатор **LER** (Label Edge Router) анализирует IP-адрес и присваивает метку. Внутри сети транзитные маршрутизаторы **LSR** (Label Switching Router) просто заменяют метку и пересылают пакет — это быстрее, чем анализ IP\n- Путь пакета через MPLS-сеть называется **LSP** (Label Switched Path). MPLS используется для **Traffic Engineering** (управление распределением трафика по каналам) и для построения **VPN** (виртуальных частных сетей)"], "terms": [{"ru": "ICMP", "en": "Internet Control Message Protocol", "df": "протокол диагностики и ошибок (ping, traceroute)"}, {"ru": "ARP", "en": "Address Resolution Protocol", "df": "определение MAC-адреса по IP-адресу"}, {"ru": "DHCP", "en": "Dynamic Host Configuration Protocol", "df": "автоматическое назначение IP-адресов"}, {"ru": "NDP", "en": "Neighbor Discovery Protocol", "df": "обнаружение соседей в IPv6, заменяет ARP"}, {"ru": "MPLS", "en": "Multiprotocol Label Switching", "df": "коммутация пакетов по меткам вместо IP-адресов"}, {"ru": "LER", "en": "Label Edge Router", "df": "пограничный маршрутизатор, присваивает метку на входе в MPLS"}, {"ru": "LSR", "en": "Label Switching Router", "df": "транзитный маршрутизатор, пересылает по метке"}, {"ru": "LSP", "en": "Label Switched Path", "df": "путь пакета через MPLS-сеть"}], "summary": ["IPv6: адрес 128 бит; заголовок 40 байт фиксированный", "Поля: Flow Label (20 бит), Next Header, Hop Limit", "Нет контрольной суммы заголовка, нет фрагментации роутером", "ICMP: диагностика; ICMPv6 включает NDP (замена ARP)", "ARP: IP→MAC; DHCP: назначение IP-адресов", "MPLS: метка 20 бит между IP и L2; LER→LSR→LER по LSP", "MPLS: Traffic Engineering и VPN"]}, {"n": 41, "title": "Протокол внутреннего шлюза OSPF. Протокол внешнего шлюза BGP. Многоадресная рассылка в Интернете. Мобильный IP.", "paragraphs": ["Маршрутизация в Интернете делится на два уровня: внутри автономной системы (AS) и между автономными системами. Дополнительно рассматриваются многоадресная рассылка и мобильный IP.", "**1. OSPF** (Open Shortest Path First) — внутренний протокол маршрутизации (**IGP** — Interior Gateway Protocol):\n- Алгоритм **Link State**: каждый маршрутизатор знает полную топологию сети и строит кратчайшие пути алгоритмом **Дейкстры**\n- Для масштабирования крупных сетей OSPF делит AS на **зоны** (areas). **Area 0** — магистральная зона (backbone), через которую связаны все остальные зоны\n- **ABR** (Area Border Router) — маршрутизатор, соединяющий две зоны. **ASBR** (Autonomous System Boundary Router) — маршрутизатор на границе с другой AS\n- Поддерживает **ECMP** (Equal-Cost Multi-Path) — балансировку трафика по нескольким равноценным маршрутам, а также аутентификацию обновлений", "**2. BGP** (Border Gateway Protocol) — внешний протокол маршрутизации (**EGP** — Exterior Gateway Protocol):\n- Тип алгоритма — **path-vector**: каждый маршрут содержит полный список AS на пути (**AS_PATH**), что позволяет обнаруживать и предотвращать петли\n- BGP-сессии работают поверх **TCP** (порт 179) — надёжная доставка обновлений\n- **eBGP** (external BGP) — сессии между разными AS; **iBGP** (internal BGP) — сессии внутри одной AS\n- Выбор маршрута по **политикам** через атрибуты: **LOCAL_PREF** (предпочтение внутри AS), **MED** (подсказка соседней AS), **COMMUNITY** (группировка маршрутов)", "**3. Многоадресная рассылка в Интернете:**\n- **IGMP** (Internet Group Management Protocol) — хосты сообщают локальному маршрутизатору о подписке на multicast-группу\n- **PIM-DM** (Protocol Independent Multicast, Dense Mode) — для плотных сетей: заливка во все стороны, затем обрезка ветвей без получателей\n- **PIM-SM** (Sparse Mode) — для редких получателей: трафик идёт только запросившим, через общую **точку рандеву** (**RP** — Rendezvous Point)", "**4. Мобильный IP:**\n- У мобильного устройства есть постоянный **домашний адрес** (home address) в домашней сети\n- Перемещаясь в чужую сеть, устройство получает временный **care-of address** и регистрирует его у **домашнего агента** (home agent)\n- Пакеты на домашний адрес перехватывает домашний агент и **туннелирует** их (IP-в-IP инкапсуляция) на care-of address\n- **Mobile IPv6** добавляет **Route Optimization** — отправитель может доставлять пакеты напрямую мобильному устройству, минуя домашнего агента. Это решает проблему «треугольной маршрутизации»"], "terms": [{"ru": "OSPF", "en": "Open Shortest Path First", "df": "протокол внутренней маршрутизации на основе Link State"}, {"ru": "IGP", "en": "Interior Gateway Protocol", "df": "протокол маршрутизации внутри автономной системы"}, {"ru": "ABR", "en": "Area Border Router", "df": "маршрутизатор OSPF на границе двух зон"}, {"ru": "ECMP", "en": "Equal-Cost Multi-Path", "df": "балансировка по нескольким равноценным маршрутам"}, {"ru": "BGP", "en": "Border Gateway Protocol", "df": "протокол маршрутизации между автономными системами"}], "summary": ["OSPF: IGP, Link State, иерархия зон, Area 0 — магистраль", "ABR соединяет зоны; ASBR — внешние AS; поддержка ECMP", "BGP: EGP, path-vector, TCP порт 179, атрибут AS_PATH", "iBGP внутри AS, eBGP между AS; LOCAL_PREF, MED, COMMUNITY", "PIM-SM: точка рандеву; PIM-DM: заливка + отсечение", "Mobile IPv6: Route Optimization — прямая доставка без туннеля"]}], "quizzes": [{"type": "mcq", "topic": "Вопрос 30", "q": "Какой принцип лежит в основе работы маршрутизаторов при коммутации пакетов с ожиданием (store-and-forward)?", "opts": ["Маршрутизатор полностью принимает пакет, сохраняет в буфере, проверяет и затем передаёт дальше", "Маршрутизатор передаёт пакет сразу по мере поступления битов без буферизации", "Маршрутизатор отправляет пакет на все порты одновременно", "Маршрутизатор передаёт только заголовок, а данные идут напрямую"], "ans": 0, "expl": "Store-and-forward означает, что маршрутизатор полностью принимает пакет, сохраняет его в буфере, проверяет целостность и корректность заголовка и только затем передаёт на следующий узел."}, {"type": "tf", "topic": "Вопрос 30", "q": "В дейтаграммной сети каждый пакет снабжается полным адресом получателя и маршрутизируется независимо.", "ans": true, "expl": "Верно. В дейтаграммной сети каждый пакет снабжается полным адресом получателя и маршрутизируется независимо на основе текущих таблиц маршрутизации."}, {"type": "mcq", "topic": "Вопрос 30", "q": "На каком типе сервиса построен Интернет (IP)?", "opts": ["Сервис с виртуальными каналами", "Дейтаграммный сервис (без установления соединения)", "Коммутация каналов", "Сервис с гарантированной доставкой"], "ans": 1, "expl": "Интернет (IP) построен на дейтаграммном сервисе (без установления соединения)."}, {"type": "mcq", "topic": "Вопрос 31", "q": "Какие технологии являются примерами реализации виртуальных каналов?", "opts": ["ATM, Frame Relay, MPLS", "Ethernet, Wi-Fi, Bluetooth", "HTTP, FTP, SMTP", "TCP, UDP, SCTP"], "ans": 0, "expl": "Примеры технологий на основе виртуальных каналов: ATM, Frame Relay, MPLS."}, {"type": "tf", "topic": "Вопрос 31", "q": "В сетях виртуальных каналов при отказе маршрутизатора все проходящие через него VC разрушаются.", "ans": true, "expl": "Верно. Сети виртуальных каналов уязвимы к отказам промежуточных узлов — при отказе маршрутизатора все проходящие через него VC разрушаются."}, {"type": "mcq", "topic": "Вопрос 31", "q": "Сколько фаз имеет установка виртуального канала?", "opts": ["Две: установка и передача данных", "Три: установка, передача данных, разрыв", "Четыре: обнаружение, установка, передача, разрыв", "Одна: передача данных"], "ans": 1, "expl": "Установка виртуального канала проходит три фазы: установка (маршрут выбирается, ресурсы резервируются, VCI назначаются), передача данных и разрыв (ресурсы освобождаются)."}, {"type": "mcq", "topic": "Вопрос 32", "q": "Какова сложность алгоритма Дейкстры с использованием приоритетной очереди?", "opts": ["O(N²)", "O(N log N)", "O((N+E) log N)", "O(N³)"], "ans": 2, "expl": "Алгоритм Дейкстры работает за O(N²) или O((N+E) log N) с приоритетной очередью."}, {"type": "tf", "topic": "Вопрос 32", "q": "При заливке (flooding) маршрутизатор пересылает пакет только на один выбранный интерфейс.", "ans": false, "expl": "Неверно. При заливке маршрутизатор пересылает пакет на все интерфейсы, кроме входного."}, {"type": "mcq", "topic": "Вопрос 33", "q": "Какая проблема характерна для маршрутизации по вектору расстояний (Distance Vector)?", "opts": ["Проблема заливки (flooding problem)", "Проблема счёта до бесконечности (count-to-infinity)", "Проблема фрагментации пакетов", "Проблема петель на канальном уровне"], "ans": 1, "expl": "Недостаток Distance Vector — «проблема счёта до бесконечности», решаемая split horizon и poison reverse."}, {"type": "tf", "topic": "Вопрос 33", "q": "Протоколы OSPF и IS-IS основаны на маршрутизации с учётом состояния линий (Link State).", "ans": true, "expl": "Верно. Протоколы OSPF и IS-IS основаны на LS (Link State)."}, {"type": "mcq", "topic": "Вопрос 34", "q": "Что такое Reverse Path Forwarding (RPF)?", "opts": ["Пересылка пакета только если он пришёл с интерфейса кратчайшего пути к источнику", "Отправка пакета обратно отправителю", "Построение обратного маршрута от получателя к отправителю", "Фрагментация пакета по обратному пути"], "ans": 0, "expl": "RPF: пересылка только если пакет пришёл с интерфейса кратчайшего пути к источнику."}, {"type": "tf", "topic": "Вопрос 34", "q": "Произвольная маршрутизация (anycast) доставляет пакет всем узлам с одинаковым адресом.", "ans": false, "expl": "Неверно. Anycast — доставка ближайшему из узлов с одинаковым адресом, а не всем."}, {"type": "mcq", "topic": "Вопрос 35", "q": "Какой протокол является реактивным протоколом маршрутизации в ad hoc-сетях?", "opts": ["DSDV", "AODV", "ZRP", "OSPF"], "ans": 1, "expl": "AODV — реактивный протокол, строит маршруты по требованию через RREQ/RREP."}, {"type": "tf", "topic": "Вопрос 35", "q": "В Mobile IP домашний агент туннелирует пакеты иностранному агенту.", "ans": true, "expl": "Верно. Домашний агент туннелирует пакеты иностранному агенту."}, {"type": "mcq", "topic": "Вопрос 36", "q": "Какой алгоритм формирования трафика допускает всплески в пределах накопленного запаса?", "opts": ["Алгоритм «дырявого ведра» (leaky bucket)", "Алгоритм «маркерного ведра» (token bucket)", "Алгоритм RED", "Алгоритм AIMD"], "ans": 1, "expl": "Token bucket допускает всплески в пределах накопленного запаса, в отличие от leaky bucket с постоянной скоростью."}, {"type": "tf", "topic": "Вопрос 36", "q": "RED (Random Early Detection) — это алгоритм упреждающего случайного сброса пакетов.", "ans": true, "expl": "Верно. RED — упреждающий случайный сброс пакетов при приближении к переполнению буферов."}, {"type": "mcq", "topic": "Вопрос 37", "q": "Какая архитектура QoS резервирует ресурсы для отдельных потоков с помощью протокола RSVP?", "opts": ["DiffServ", "IntServ", "MPLS", "WFQ"], "ans": 1, "expl": "IntServ (Integrated Services) — QoS с гарантиями для отдельных потоков через RSVP. Плохо масштабируется."}, {"type": "mcq", "topic": "Вопрос 38", "q": "Какое утверждение верно о фрагментации в IPv6?", "opts": ["Фрагментация выполняется маршрутизаторами", "Фрагментация маршрутизаторами запрещена; отправитель определяет MTU пути", "Фрагментация не поддерживается вообще", "Фрагментация выполняется получателем"], "ans": 1, "expl": "В IPv6 фрагментация маршрутизаторами запрещена; отправитель определяет MTU пути (Path MTU Discovery)."}, {"type": "mcq", "topic": "Вопрос 39", "q": "Какой принцип используется маршрутизатором для выбора записи в таблице маршрутизации IPv4?", "opts": ["First match", "Longest prefix match", "Random match", "Shortest prefix match"], "ans": 1, "expl": "Маршрутизатор применяет маску подсети к адресу назначения и выбирает запись по принципу longest prefix match."}, {"type": "tf", "topic": "Вопрос 39", "q": "Поле Fragment Offset в IPv4 измеряется в единицах по 8 байт.", "ans": true, "expl": "Верно. Fragment Offset — смещение в единицах по 8 байт."}, {"type": "mcq", "topic": "Вопрос 40", "q": "Какова длина адреса в IPv6?", "opts": ["32 бита", "64 бита", "128 бит", "256 бит"], "ans": 2, "expl": "IPv6: адрес 128 бит, заголовок 40 байт фиксированной длины."}, {"type": "tf", "topic": "Вопрос 40", "q": "В MPLS метка имеет размер 20 бит и вставляется между IP- и канальным заголовком.", "ans": true, "expl": "Верно. Между IP- и канальным заголовком вставляется метка (20 бит)."}, {"type": "mcq", "topic": "Вопрос 41", "q": "По какому протоколу и порту устанавливаются BGP-сессии?", "opts": ["UDP, порт 53", "TCP, порт 179", "TCP, порт 80", "UDP, порт 520"], "ans": 1, "expl": "BGP-сессии устанавливаются по TCP (порт 179)."}, {"type": "tf", "topic": "Вопрос 41", "q": "В OSPF Area 0 является магистральной зоной.", "ans": true, "expl": "Верно. OSPF поддерживает иерархию зон, Area 0 — магистральная."}, {"type": "match", "topic": "Темы 30–41", "q": "Сопоставьте протокол/алгоритм с его описанием.", "pairs": [{"left": "Алгоритм Дейкстры", "right": "Поиск кратчайших путей от одного источника"}, {"left": "AODV", "right": "Реактивный протокол маршрутизации в ad hoc-сетях"}, {"left": "BGP", "right": "Протокол внешней маршрутизации (path-vector)"}, {"left": "Token bucket", "right": "Формирование трафика с допуском всплесков"}, {"left": "IGMP", "right": "Протокол управления членством в группах"}], "expl": "Дейкстра — кратчайшие пути; AODV — реактивный протокол ad hoc; BGP — внешняя маршрутизация (path-vector); Token bucket — допускает всплески; IGMP — членство в multicast-группах."}]}, {"id": 6, "name": "Транспортный уровень сетевого стека", "questions": [{"n": 42, "title": "Транспортный сервис. Сокеты Беркли.", "paragraphs": ["**Транспортный уровень** обеспечивает связь между процессами на разных хостах (**end-to-end**).", "**Два протокола:**\n- **TCP** — надёжный, с соединением\n- **UDP** — ненадёжный, без соединения", "**Порт** (16 бит) — идентификатор процесса. Адрес = (IP, порт). Это решает задачу **мультиплексирования** (несколько процессов на одном IP).", "**Сокеты Беркли (Berkeley Sockets)** — стандартный **API** для сетевого программирования (Berkeley UNIX, 1983). Сокет — это «розетка»: программа читает и пишет в неё, как в файл.", "**TCP-сервер:** `socket()` → `bind()` → `listen()` → `accept()` → `recv()` / `send()` → `close()`\n**TCP-клиент:** `socket()` → `connect()` → `send()` / `recv()` → `close()`", "**Что делает каждый вызов:**\n- **`socket()`** — создаёт сокет. Указываются: семейство (IPv4 / IPv6), тип (TCP = `SOCK_STREAM`, UDP = `SOCK_DGRAM`)\n- **`bind()`** — привязывает сокет к локальному (IP, порту)\n- **`listen()`** — переводит в режим прослушивания\n- **`accept()`** — **блокирующий** вызов: ждёт клиента, возвращает **новый** сокет для разговора с ним\n- **`connect()`** — клиент подключается к серверу (TCP-рукопожатие)\n- **`send()` / `recv()`** — обмен данными\n- **`close()`** — закрыть соединение (FIN)", "**UDP** — без соединения: только `socket()` + `bind()` + `sendto()` / `recvfrom()` (адрес получателя указывается в каждом вызове).", "**Блокирующий vs неблокирующий режим:**\n- **Блокирующий (blocking)** — `recv()` **ждёт**, пока придут данные; поток программы «замораживается». Простой код, но один поток обслуживает только одного клиента.\n- **Неблокирующий (non-blocking)** — `recv()` возвращается **сразу**: либо с данными, либо с ошибкой `EWOULDBLOCK`. Программа может в это время делать что-то другое.", "**Проблема масштабирования:** сервер с тысячами клиентов не может позволить себе тысячи потоков.", "**Решение — I/O multiplexing** (мультиплексирование ввода-вывода): один поток следит сразу за многими сокетами и реагирует только на те, где **есть события** (данные пришли, можно писать).", "**Системные вызовы для multiplexing:**\n- **`select()`** — старый, переносимый. Лимит ~1024 сокетов, линейный перебор → медленный\n- **`poll()`** — без лимита на число сокетов, но всё ещё линейный перебор\n- **`epoll()`** — Linux, **событийный** (возвращает только готовые сокеты), масштабируется на миллионы соединений. Аналоги: **kqueue** (BSD/macOS), **IOCP** (Windows)"], "terms": [{"ru": "Port", "en": "порт", "df": "16-битный идентификатор процесса"}, {"ru": "Socket", "en": "сокет", "df": "программный интерфейс; пара (IP, порт)"}, {"ru": "Multiplexing", "en": "мультиплексирование", "df": "несколько потоков через один канал"}], "summary": ["Транспортный уровень: end-to-end между процессами", "TCP = надёжный, с соединением; UDP = ненадёжный, без", "Порт = 16 бит; мультиплексирование через порты", "TCP-сервер: socket→bind→listen→accept→recv/send→close", "TCP-клиент: socket→connect→send/recv→close", "UDP: sendto()/recvfrom(); select()/poll()/epoll()"]}, {"n": 43, "title": "Базовые элементы транспортных протоколов.", "paragraphs": ["Чтобы транспортный протокол (например, TCP) мог надёжно передавать данные между процессами, он должен решать несколько задач: адресация, установка и разрыв соединения, контроль ошибок, управление потоком, мультиплексирование и восстановление после сбоев.", "**1. Адресация (Addressing)**", "Сетевой уровень доставляет пакет до **хоста** (по IP). Транспортный уровень должен дальше доставить его до конкретного **процесса**.", "- Идентификатор процесса — **порт** (он же **TSAP**, Transport Service Access Point)\n- Полный адрес = пара **(IP, порт)** — называется **сокет (socket)**\n- **Well-known ports** (0–1023) закреплены за стандартными службами: HTTP = 80, HTTPS = 443, DNS = 53, SSH = 22", "**2. Установка соединения (Connection Establishment)**", "Перед передачей данных стороны должны согласовать параметры (начальные номера, размер окна). В TCP используется **трёхстороннее рукопожатие (three-way handshake)**:", "1. Клиент → **SYN** (со случайным **ISN**, Initial Sequence Number, клиента)\n2. Сервер → **SYN + ACK** (со своим случайным ISN сервера)\n3. Клиент → **ACK**", "Случайные ISN защищают от старых дубликатов и подделки соединения.", "**3. Разрыв соединения (Connection Release)**", "TCP — дуплексный, поэтому каждое направление закрывается **отдельно**. Отсюда четыре шага:", "**FIN → ACK → FIN → ACK**", "Сторона, отправившая FIN, больше не шлёт данные, но ещё может их принимать.", "**4. Контроль ошибок (Error Control)**", "Сеть может терять, повреждать и переставлять пакеты. TCP справляется через комбинацию механизмов:", "- **Checksum** — обнаружение повреждений данных\n- **Sequence numbers** — нумерация байтов для восстановления порядка и отбрасывания дубликатов\n- **ACK** — подтверждения получения\n- **RTO** (Retransmission Timeout) — если ACK не пришёл за время RTO, сегмент посылается заново", "**5. Управление потоком (Flow Control)**", "Защищает **медленного получателя** от быстрого отправителя (≠ контроль перегрузки, который защищает сеть в целом).", "- В заголовке TCP есть поле **Window Size**: получатель сообщает, сколько байт он ещё может принять в свой буфер\n- Отправитель не превышает этот размер", "**6. Мультиплексирование / демультиплексирование**", "- **Мультиплексирование (multiplexing)**: несколько процессов используют один сетевой интерфейс через разные порты\n- **Демультиплексирование (demultiplexing)**: при получении сегмента ОС по номеру порта направляет его нужному процессу", "**7. Восстановление после сбоев (Crash Recovery)**", "Сложная задача: если сервер упал и перезагрузился, клиент не знает, был ли обработан последний запрос. Возможные исходы — «выполнено 0 раз», «выполнено 1 раз», «выполнено ≥1 раз». Полное решение требует **stable storage** (журнала на диске)."], "terms": [{"ru": "TSAP", "en": "Transport Service Access Point", "df": "точка доступа транспортного уровня (порт)"}, {"ru": "ISN", "en": "Initial Sequence Number", "df": "начальный номер последовательности"}, {"ru": "RTO", "en": "Retransmission Timeout", "df": "таймер повторной передачи"}], "summary": ["Well-known ports: 0-1023; TSAP = точка доступа (порт)", "Установка: SYN→SYN+ACK→ACK; случайные ISN", "Разрыв: FIN→ACK→FIN→ACK (4 шага)", "Контроль ошибок: checksum, нумерация, ACK, повтор по RTO", "Flow control: Window Size = доступный буфер получателя", "Восстановление при сбоях требует stable storage"]}, {"n": 44, "title": "Контроль перегрузки. Беспроводные соединения.", "paragraphs": ["**Что такое перегрузка**", "**Перегрузка (congestion)** возникает, когда в сеть приходит больше пакетов, чем маршрутизаторы успевают обработать. Очереди в буферах растут, задержки увеличиваются, а при переполнении пакеты начинают **теряться**.", "Важно различать две задачи:\n- **Flow Control** (управление потоком) — защищает **медленного получателя** от быстрого отправителя\n- **Congestion Control** (контроль перегрузки) — защищает **сеть в целом** от слишком быстрых отправителей", "Обе задачи TCP решает одновременно через два окна: **rwnd** (от получателя) и **cwnd** (свой собственный). Отправитель в каждый момент может послать **min(cwnd, rwnd)** байт без подтверждения.", "**Как TCP обнаруживает перегрузку**", "TCP считает, что **потеря пакета = перегрузка**. Сигналы о потере:\n- Истечение таймера **RTO** (Retransmission Timeout)\n- **Три дублирующих ACK** подряд (сигнал fast retransmit)", "**Главная идея: окно перегрузки cwnd**", "**cwnd (congestion window)** — сколько байт отправитель «разрешает себе» держать в сети одновременно. Оно подстраивается динамически: растёт, пока всё хорошо, и уменьшается при потере.", "**1. Slow Start (медленный старт)**", "- cwnd начинается с **1 MSS** (Maximum Segment Size — максимальный размер TCP-сегмента)\n- За каждый полученный ACK cwnd увеличивается на 1 MSS → **экспоненциальный рост** (×2 за RTT)\n- Продолжается до порога **ssthresh** (slow start threshold)", "Название обманчиво: рост на самом деле быстрый. «Медленный» он только по сравнению со старыми протоколами, которые сразу отправляли максимум.", "**2. Congestion Avoidance (предотвращение перегрузки)**", "Когда cwnd достигает ssthresh, TCP переключается на **линейный рост**:\n- cwnd увеличивается на **+1 MSS за RTT**\n- Идея: приближаемся к пределу полосы осторожно", "**3. Что происходит при потере**", "- **ssthresh = cwnd / 2** (запоминаем половину как новый порог)\n- **cwnd = 1 MSS** (или = ssthresh в Fast Recovery) → возврат к медленному старту\n- TCP снова экспоненциально разгоняется до ssthresh, затем линейно", "**AIMD: справедливость**", "Поведение TCP описывается формулой **AIMD** (Additive Increase, Multiplicative Decrease):\n- **Additive Increase** — линейный рост (+1 MSS за RTT)\n- **Multiplicative Decrease** — деление пополам при потере", "AIMD математически обеспечивает **справедливое распределение полосы** между несколькими TCP-потоками: при одновременной работе они сходятся к равным долям.", "**Эффективная скорость** ≈ min(cwnd, rwnd) / RTT.", "**Проблема беспроводных соединений**", "TCP был спроектирован для **проводных** сетей, где потери почти всегда означают перегрузку. В беспроводных сетях (Wi-Fi, мобильные) всё иначе:", "- Потери вызваны **помехами, замираниями, сменой базовой станции**, а не перегрузкой\n- TCP видит потерю → **ошибочно** считает это перегрузкой → уменьшает cwnd → падает скорость\n- Результат: низкая утилизация канала даже при хорошей полосе", "**Решения:**\n- **Explicit Loss Notification (ELN)** — базовая станция явно сообщает: «это потеря из-за помех, не уменьшай cwnd»\n- **TCP Westwood** — оценивает **реальную** пропускную способность по частоте ACK и уменьшает cwnd не вдвое, а пропорционально оценке\n- **SNOOP** — базовая станция кэширует TCP-сегменты и повторно их передаёт по беспроводному участку, скрывая потери от отправителя"], "terms": [{"ru": "cwnd", "en": "congestion window", "df": "окно перегрузки"}, {"ru": "rwnd", "en": "receive window", "df": "окно получателя"}, {"ru": "ssthresh", "en": "slow start threshold", "df": "порог медленного старта"}, {"ru": "RTT", "en": "Round-Trip Time", "df": "время кругового обхода"}, {"ru": "MSS", "en": "Maximum Segment Size", "df": "максимальный размер TCP-сегмента"}], "summary": ["cwnd = окно перегрузки; медленный старт: экспоненциальный рост", "После ssthresh — линейный рост (congestion avoidance)", "AIMD: потеря → cwnd/2; успех → +1 MSS за RTT", "Эффективная скорость ≈ min(cwnd, rwnd) / RTT", "Беспроводные сети: потери от помех ≠ перегрузка", "TCP ошибочно режет cwnd; решения: ELN, Westwood, SNOOP"]}, {"n": 45, "title": "UDP. RPC. Транспорт реального времени.", "paragraphs": ["**UDP** (User Datagram Protocol) — простой протокол **без соединения**.", "**Заголовок UDP** (всего 8 байт):\n- Порт источника (2 байта)\n- Порт назначения (2 байта)\n- Длина (2 байта)\n- Контрольная сумма (2 байта)", "**Свойства:**\n- Без надёжности и упорядоченности\n- Без контроля перегрузки\n- **Низкие накладные расходы** и задержки", "**Применение:** DNS, DHCP, потоковое видео, VoIP, онлайн-игры.", "**RPC** (Remote Procedure Call) — вызов функции на удалённом сервере, как локальной.", "**Как работает RPC:**\n1. Клиент вызывает функцию через локальный **stub** (заглушку)\n2. Stub упаковывает параметры (**marshalling**) и шлёт серверу\n3. Серверный stub распаковывает (**unmarshalling**) и вызывает реальную функцию\n4. Результат возвращается тем же путём", "**Проблемы RPC:**\n- Семантика при сбоях (выполнилось ли?)\n- Передача указателей (адресные пространства разные)\n- Различия в типах данных между платформами", "**RTP** (Real-time Transport Protocol) — для аудио/видео в реальном времени, поверх UDP.", "**Поля RTP:**\n- **Sequence Number** — порядок пакетов\n- **Timestamp** — синхронизация воспроизведения\n- **SSRC** (Synchronization Source) — идентификатор источника\n- **Payload Type** — тип кодека", "**RTCP** (RTP Control Protocol) — контрольный протокол для статистики качества (потери, джиттер).", "**SRTP** — защищённый RTP с шифрованием."], "terms": [{"ru": "RPC", "en": "Remote Procedure Call", "df": "вызов удалённой процедуры"}], "summary": ["UDP заголовок: 8 байт (srcPort, dstPort, length, checksum)", "UDP: нет надёжности, порядка, контроля перегрузки", "Применение UDP: DNS, DHCP, потоковое мультимедиа", "RPC: stub маршализирует параметры → сеть → демаршализация", "RTP поверх UDP: sequence number, timestamp, SSRC", "RTCP: статистика качества; SRTP: шифрование"]}, {"n": 46, "title": "Протокол TCP.", "paragraphs": ["**TCP** (Transmission Control Protocol) — надёжный, дуплексный, ориентированный на **байтовый поток**.", "**Соединение** идентифицируется четвёркой:\n(IP источника, порт источника, IP назначения, порт назначения).", "**Заголовок TCP** (минимум 20 байт):\n- Порт источника / порт назначения (по 16 бит)\n- **Sequence Number** (32 бит) — номер первого байта в сегменте\n- **Acknowledgment Number** (32 бит) — следующий ожидаемый байт\n- Data Offset — длина заголовка\n- **Флаги**: URG, ACK, PSH, RST, **SYN**, **FIN**, ECE, CWR\n- **Window Size** (16 бит) — свободное место в буфере получателя\n- Checksum, Urgent Pointer\n- Опции: **MSS**, **SACK**, Window Scale, Timestamps", "**Установка соединения** (three-way handshake):\nSYN → SYN + ACK → ACK", "**Разрыв соединения:**\nFIN → ACK → FIN → ACK, затем состояние **TIME_WAIT** (длительность 2·**MSL**, чтобы исчезли дубликаты).", "**Состояния (конечный автомат) TCP:**\nCLOSED → LISTEN → SYN_SENT → SYN_RCVD → ESTABLISHED → FIN_WAIT_1 → FIN_WAIT_2 → CLOSE_WAIT → CLOSING → LAST_ACK → TIME_WAIT.", "**Скользящее окно (Sliding Window):**\n- Отправитель может послать до **min(cwnd, rwnd)** байт без подтверждения\n- **Накопительные** ACK подтверждают все байты до указанного\n- **SACK** (Selective Acknowledgment) — выборочное подтверждение", "**Таймеры TCP:**\n- **RTO** — алгоритм Якобсона: SRTT + 4·RTTVAR\n- **Persist timer** — при нулевом окне получателя\n- **Keepalive timer** — проверка живого соединения", "**Контроль перегрузки:**\n- **Slow start** — экспоненциальный рост cwnd\n- **Congestion avoidance** — линейный рост\n- **Fast retransmit** — повтор после 3 дублирующих ACK\n- **Fast recovery** — пропуск slow start (TCP Reno, Cubic)"], "terms": [{"ru": "SACK", "en": "Selective Acknowledgment", "df": "выборочное подтверждение"}, {"ru": "MSL", "en": "Maximum Segment Lifetime", "df": "максимальное время жизни сегмента"}], "summary": ["TCP заголовок мин. 20 байт; SeqNum + AckNum по 32 бита", "Флаги: URG, ACK, PSH, RST, SYN, FIN; Window Size 16 бит", "Опции: MSS, SACK, Window Scale, Timestamps", "TIME_WAIT = 2·MSL; 11 состояний конечного автомата", "Скользящее окно: min(cwnd, rwnd); SACK — выборочный ACK", "RTO = SRTT + 4·RTTVAR (алгоритм Якобсона)", "Fast retransmit: 3 дубликата ACK; fast recovery (Reno/Cubic)"]}, {"n": 47, "title": "Сети, устойчивые к задержкам (DTN). Bundle.", "paragraphs": ["**DTN** (Delay-Tolerant Network) — сеть для сред **без постоянной связи** между источником и получателем.", "**Применение:**\n- Межпланетные коммуникации (спутники, марсоходы)\n- Сенсорные сети\n- Военные / тактические сети\n- Удалённые регионы без интернета", "**Принцип Store-Carry-Forward («хранить — нести — передавать»):**\n1. Узел получает сообщение\n2. **Хранит** его в постоянной памяти\n3. **Несёт** до встречи со следующим узлом\n4. **Передаёт** дальше при появлении связи", "**Bundle Protocol** (RFC 5050, обновлён в RFC 9171) работает как **overlay** поверх TCP/UDP.", "**Bundle (бандл)** — единица передачи в DTN:\n- **Первичный блок**: **EID** (адрес), время жизни, класс обслуживания\n- Дополнительные блоки: данные, метаданные", "**Custody Transfer:**\n- Промежуточный узел берёт **ответственность** за бандл\n- Источник может удалить свою копию\n- Повышает надёжность доставки"], "terms": [{"ru": "DTN", "en": "Delay-Tolerant Network", "df": "сеть, устойчивая к задержкам и разрывам"}, {"ru": "EID", "en": "Endpoint Identifier", "df": "адрес узла в DTN"}], "summary": ["DTN: нет постоянного сквозного пути (межпланетные, сенсорные)", "Принцип store-and-carry-and-forward: хранить до следующего узла", "Bundle protocol: overlay поверх TCP/UDP", "Бандл = первичный блок (EID, TTL, класс) + доп. блоки", "Custody transfer: промежуточный узел берёт ответственность", "Стандарты: RFC 5050 (BPv6), RFC 9171 (BPv7)"]}], "quizzes": [{"type": "mcq", "topic": "Вопрос 42", "q": "Какие два основных транспортных сервиса предоставляет транспортный уровень?", "opts": ["TCP (надёжный, с соединением) и UDP (ненадёжный, без соединения)", "HTTP и FTP", "IP и ICMP", "OSPF и BGP"], "ans": 0, "expl": "Два сервиса транспортного уровня: TCP (надёжный, с соединением) и UDP (ненадёжный, без соединения)."}, {"type": "mcq", "topic": "Вопрос 42", "q": "Какова последовательность вызовов сокетов Беркли для TCP-сервера?", "opts": ["socket() → connect() → send()/recv() → close()", "socket() → bind() → listen() → accept() → recv()/send() → close()", "socket() → sendto()/recvfrom() → close()", "bind() → socket() → accept() → listen() → close()"], "ans": 1, "expl": "TCP-сервер: socket() → bind() → listen() → accept() → recv()/send() → close()."}, {"type": "tf", "topic": "Вопрос 42", "q": "Порт — это 32-битный идентификатор процесса на транспортном уровне.", "ans": false, "expl": "Неверно. Порт — это 16-битный идентификатор процесса."}, {"type": "mcq", "topic": "Вопрос 43", "q": "Какова процедура установки TCP-соединения?", "opts": ["SYN → ACK → FIN", "SYN → SYN+ACK → ACK (трёхстороннее рукопожатие)", "FIN → ACK → FIN → ACK", "SYN → RST → ACK"], "ans": 1, "expl": "Установка TCP-соединения: трёхстороннее рукопожатие (SYN → SYN+ACK → ACK) с случайными ISN."}, {"type": "tf", "topic": "Вопрос 43", "q": "Разрыв TCP-соединения выполняется в четыре шага: FIN → ACK → FIN → ACK.", "ans": true, "expl": "Верно. Разрыв: четырёхшаговый (FIN → ACK → FIN → ACK)."}, {"type": "mcq", "topic": "Вопрос 43", "q": "Какой диапазон портов относится к well-known ports?", "opts": ["0–65535", "0–1023", "1024–49151", "49152–65535"], "ans": 1, "expl": "Well-known ports: 0–1023."}, {"type": "mcq", "topic": "Вопрос 44", "q": "Как растёт окно перегрузки (cwnd) в фазе медленного старта TCP?", "opts": ["Линейно", "Экспоненциально", "Логарифмически", "Не растёт"], "ans": 1, "expl": "Медленный старт: cwnd растёт экспоненциально до ssthresh."}, {"type": "tf", "topic": "Вопрос 44", "q": "При алгоритме AIMD в случае потери пакета cwnd делится на 2.", "ans": true, "expl": "Верно. AIMD: при потере cwnd делится на 2; при успехе — +1 MSS за RTT."}, {"type": "mcq", "topic": "Вопрос 44", "q": "Почему TCP плохо работает в беспроводных сетях?", "opts": ["Беспроводные сети не поддерживают TCP", "TCP ошибочно уменьшает cwnd из-за потерь от помех, а не перегрузки", "Беспроводные сети слишком быстрые для TCP", "TCP не поддерживает мультиплексирование в беспроводных сетях"], "ans": 1, "expl": "Высокий уровень ошибок из-за помех (не перегрузки). TCP ошибочно уменьшает cwnd. Решения: Explicit Loss Notification, TCP Westwood, SNOOP."}, {"type": "mcq", "topic": "Вопрос 45", "q": "Каков размер каждого поля заголовка UDP?", "opts": ["4 байта", "2 байта", "8 байт", "1 байт"], "ans": 1, "expl": "Заголовок UDP: порт источника, порт назначения, длина, контрольная сумма — по 2 байта каждое."}, {"type": "tf", "topic": "Вопрос 45", "q": "Протокол RTP работает поверх UDP и добавляет sequence number, timestamp, SSRC и payload type.", "ans": true, "expl": "Верно. RTP работает поверх UDP, добавляет sequence number, timestamp, SSRC, payload type."}, {"type": "mcq", "topic": "Вопрос 45", "q": "Что делает клиентский stub при RPC?", "opts": ["Маршализирует параметры для передачи на удалённый хост", "Выполняет процедуру локально", "Устанавливает TCP-соединение", "Шифрует данные"], "ans": 0, "expl": "Клиентский stub маршализирует параметры; серверный — демаршализирует и вызывает процедуру."}, {"type": "mcq", "topic": "Вопрос 46", "q": "Каков минимальный размер заголовка TCP?", "opts": ["8 байт", "16 байт", "20 байт", "40 байт"], "ans": 2, "expl": "Заголовок TCP имеет минимальный размер 20 байт."}, {"type": "tf", "topic": "Вопрос 46", "q": "В TCP fast retransmit выполняется после получения 3 дублирующих ACK.", "ans": true, "expl": "Верно. Fast retransmit — повторная передача после 3 дублирующих ACK."}, {"type": "mcq", "topic": "Вопрос 46", "q": "Какое состояние TCP-соединения наступает после разрыва и длится 2·MSL?", "opts": ["CLOSE_WAIT", "FIN_WAIT_1", "TIME_WAIT", "LAST_ACK"], "ans": 2, "expl": "TIME_WAIT — состояние ожидания исчезновения дубликатов, длится 2·MSL."}, {"type": "mcq", "topic": "Вопрос 47", "q": "Какой принцип лежит в основе DTN (Delay-Tolerant Networks)?", "opts": ["Store-and-forward", "Store-and-carry-and-forward", "Cut-through switching", "Circuit switching"], "ans": 1, "expl": "DTN использует принцип store-and-carry-and-forward: узел хранит сообщение до появления следующего узла."}, {"type": "tf", "topic": "Вопрос 47", "q": "Механизм custody transfer в DTN означает, что промежуточный узел принимает ответственность за бандл.", "ans": true, "expl": "Верно. Custody transfer — промежуточный узел принимает ответственность за доставку бандла."}, {"type": "match", "topic": "Темы 42–47", "q": "Сопоставьте термин с его определением.", "pairs": [{"left": "ISN", "right": "Начальный порядковый номер TCP"}, {"left": "SACK", "right": "Выборочное подтверждение сегментов"}, {"left": "RPC", "right": "Вызов удалённой процедуры"}, {"left": "EID", "right": "Адрес узла в DTN"}, {"left": "cwnd", "right": "Окно перегрузки TCP"}], "expl": "ISN — начальный порядковый номер; SACK — выборочное подтверждение; RPC — вызов удалённой процедуры; EID — Endpoint Identifier в DTN; cwnd — congestion window."}]}, {"id": 7, "name": "Прикладной уровень сетевого стека", "questions": [{"n": 48, "title": "DNS.", "paragraphs": ["**DNS** (Domain Name System) — распределённая иерархическая база данных. Преобразует доменные имена в IP-адреса и обратно.", "Пример: `example.com` → `93.184.216.34`.", "**Иерархия серверов:**\n- **Корневые серверы** (root, 13 «логических») — вершина иерархии\n- **TLD-серверы** (Top-Level Domain): `.com`, `.ru`, `.org`\n- **Авторитативные серверы** (authoritative) — хранят данные конкретных доменов", "Пространство имён разбито на **зоны** (zones); каждой управляет один сервер.", "**Два типа запросов:**\n- **Рекурсивный (recursive)** — сервер сам ищет ответ и возвращает результат клиенту\n- **Итеративный (iterative)** — сервер возвращает ссылку на следующий сервер в цепочке", "**Записи ресурсов (Resource Records, RR):**\n- **A** — IPv4-адрес\n- **AAAA** — IPv6-адрес\n- **MX** — почтовый сервер домена\n- **CNAME** — псевдоним домена\n- **NS** — авторитативный сервер\n- **PTR** — обратное преобразование (IP → имя)\n- **SOA** — параметры зоны (Start of Authority)", "**Кэширование:**\n- Серверы хранят ответы в течение **TTL** (Time To Live)\n- Снижает нагрузку на корневые серверы", "**Транспорт:** UDP / TCP, **порт 53**.\nTCP используется для ответов > 512 байт и передачи зон (**AXFR**).", "**DNSSEC** (DNS Security Extensions) — расширение безопасности: цифровые подписи обеспечивают целостность и аутентичность записей."], "terms": [{"ru": "RR", "en": "Resource Record", "df": "запись ресурса в DNS"}, {"ru": "TTL", "en": "Time To Live", "df": "время жизни кэшированной записи"}, {"ru": "TLD", "en": "Top-Level Domain", "df": "домен верхнего уровня"}], "summary": ["DNS: порт 53, UDP (ответ<512B), TCP (>512B, AXFR)", "Записи: A(IPv4), AAAA(IPv6), MX(почта), CNAME(псевд.)", "NS(сервер имён), PTR(обратн.), SOA(начало зоны,TTL)", "Рекурсивный=сервер ищет сам; итеративный=ссылка", "Корневые серверы -> TLD -> авторитативные серверы", "DNSSEC: цифровые подписи для целостности записей"]}, {"n": 49, "title": "Архитектура электронной почты.", "paragraphs": ["**Три основных компонента:**\n- **UA** (User Agent) — клиентская программа (Outlook, Thunderbird)\n- **MTA** (Message Transfer Agent) — сервер, передающий письма по SMTP\n- **MDA** (Message Delivery Agent) — кладёт письмо в почтовый ящик получателя", "**Формат сообщения** (RFC 5322):\n- **Заголовок (header)** + пустая строка + **тело (body)**", "**Поля заголовка:**\n- **From, To, Cc, Bcc** — отправитель и получатели\n- **Subject** — тема\n- **Date** — дата\n- **Message-ID** — уникальный идентификатор\n- **Received** — добавляется каждым MTA на пути (трассировка)", "**MIME** (Multipurpose Internet Mail Extensions):\n- Поддержка вложений и не-ASCII символов\n- Кодировка **Base64** — двоичные данные → ASCII", "**Путь письма:**\n1. UA отправителя → MTA отправителя (по SMTP)\n2. MTA → MTA получателя (по SMTP)\n3. MTA → MDA → почтовый ящик\n4. UA получателя забирает письмо (по POP3 или IMAP)", "**Хранение почты:** **mbox** или **Maildir**."], "terms": [{"ru": "UA", "en": "User Agent", "df": "почтовый клиент пользователя"}, {"ru": "MTA", "en": "Message Transfer Agent", "df": "сервер передачи почты"}, {"ru": "MDA", "en": "Message Delivery Agent", "df": "программа доставки в ящик"}], "summary": ["3 компонента: UA(клиент), MTA(передача), MDA(доставка)", "Формат RFC 5322: заголовок + пустая строка + тело", "Заголовки: From,To,Cc,Bcc,Subject,Date,Message-ID", "MIME (RFC 2045-2049): вложения, не-ASCII, Base64", "Каждый MTA добавляет поле Received (трассировка)", "Доставка в mbox/Maildir, чтение через POP3/IMAP"]}, {"n": 50, "title": "SMTP, POP3, IMAP.", "paragraphs": ["**SMTP** (Simple Mail Transfer Protocol, RFC 5321) — отправка и передача почты между серверами.\n- **Порт 25** — между серверами (MTA ↔ MTA)\n- **Порт 587** — отправка от клиента (с аутентификацией)\n- Команды: `EHLO`, `MAIL FROM`, `RCPT TO`, `DATA`, `QUIT`", "**POP3** (Post Office Protocol v3) — простое получение писем.\n- **Порт 110**\n- Скачивает письма и обычно **удаляет** их с сервера\n- Подходит для одного устройства", "**IMAP** (Internet Message Access Protocol) — продвинутое получение писем.\n- **Порт 143**\n- Письма **остаются на сервере**\n- Поддерживает папки, поиск, синхронизацию между устройствами", "**Схемы доставки:**", "**1. Простая (выделенный сервер):**\nКлиент → SMTP → сервер получателя → POP3/IMAP → клиент получателя.", "**2. С двумя посредниками:**\nОтправитель → посредник 1 (антиспам-шлюз) → посредник 2 → сервер получателя → клиент.", "**Защита соединений:**\n- **STARTTLS** — обновление открытого соединения до TLS\n- Защищённые порты: **SMTPS** (465), **IMAPS** (993), **POP3S** (995)"], "terms": [], "summary": ["SMTP: порт 25(межсервер), 587(клиент), TCP", "Команды: EHLO,MAIL FROM,RCPT TO,DATA,QUIT", "POP3: порт 110, скачивает и удаляет с сервера", "IMAP: порт 143, хранит на сервере, папки, поиск", "1 сервер: клиент->SMTP->сервер->POP3/IMAP->клиент", "2 посредника: антиспам-шлюзы между серверами", "STARTTLS: обновление до TLS; SMTPS/IMAPS/POP3S"]}, {"n": 51, "title": "WWW. HTTP.", "paragraphs": ["**WWW** (World Wide Web) — распределённая гипертекстовая система.", "**Три основных компонента:**\n- **URL** — адрес ресурса\n- **HTML** — формат страниц\n- **HTTP** — протокол передачи", "**Архитектура:** клиент-серверная. Браузер запрашивает ресурсы у веб-сервера.", "**Типы страниц:**\n- **Статические (static)** — готовые HTML-файлы, отдаются как есть\n- **Динамические серверные** — генерируются сервером (PHP, Node.js, Python)\n- **Динамические клиентские** — генерируются JavaScript в браузере (AJAX, SPA)", "**REST** (Representational State Transfer) — архитектурный стиль API на HTTP-методах:\n`GET`, `POST`, `PUT`, `DELETE`.", "**HTTP:**\n- Порт **80** (HTTP) / **443** (HTTPS)", "**Версии HTTP:**\n- **HTTP/1.0** — одно соединение на запрос\n- **HTTP/1.1** — постоянные соединения (persistent), конвейеризация\n- **HTTP/2** — мультиплексирование, сжатие заголовков (**HPACK**)\n- **HTTP/3** — поверх **QUIC** (UDP), решает проблему **HOL Blocking**", "**Структура запроса:** метод + URI + заголовки + тело.\n**Структура ответа:** код статуса + заголовки + тело.", "**Коды статуса:**\n- **2xx** — успех (200 OK)\n- **3xx** — перенаправление (301, 302)\n- **4xx** — ошибка клиента (404 Not Found)\n- **5xx** — ошибка сервера (500)", "**Веб-поиск:**\n- **Краулеры (crawlers)** обходят страницы\n- Строится **инвертированный индекс**\n- Ранжирование (например, **PageRank**)"], "terms": [{"ru": "URL", "en": "Uniform Resource Locator", "df": "адрес ресурса"}, {"ru": "HTML", "en": "HyperText Markup Language", "df": "язык разметки"}, {"ru": "HOL Blocking", "en": "Head-Of-Line", "df": "блокировка очереди из-за одного потерянного пакета"}], "summary": ["WWW = URI/URL + HTML + HTTP, клиент-серверная арх.", "Статич. стр. без изменений; динамич.=CGI/PHP/JS", "REST: GET,POST,PUT,DELETE поверх HTTP", "HTTP/1.1: persistent conn.; HTTP/2: мультиплексир.", "HTTP/3: QUIC(UDP), устраняет HOL blocking", "Порты: HTTP=80, HTTPS=443 (TLS)", "Поиск: краулеры + инвертир. индекс + PageRank"]}, {"n": 52, "title": "CDN. P2P.", "paragraphs": ["**Основной интернет-трафик:** потоковое видео, обмен файлами, веб-контент.", "**Серверная ферма (Server Farm):**\n- Кластер серверов за **балансировщиком нагрузки (load balancer)**\n- Повышает пропускную способность и отказоустойчивость", "**Веб-прокси (Web Proxy):**\n- Промежуточный сервер с кэшированием HTTP-ответов\n- Снижает нагрузку на исходный сервер и задержку для клиента", "**CDN** (Content Delivery Network) — сеть доставки контента.", "**Принцип работы CDN:**\n- Глобальная сеть **edge-серверов**, размещённых близко к пользователям\n- **DNS перенаправляет** пользователя на ближайший сервер\n- Контент **кэшируется** на edge-серверах", "**Примеры CDN:** Akamai, Cloudflare, Amazon CloudFront.", "**P2P** (Peer-to-Peer) — одноранговая (пиринговая) сеть.\n- Каждый узел одновременно **клиент и сервер**\n- Нет центрального сервера\n- **Масштабируемость**: пропускная способность растёт с числом участников", "**BitTorrent:**\n- Файл разбивается на **блоки (chunks)**\n- Блоки скачиваются параллельно от нескольких пиров\n- Поиск пиров:\n  - **Трекер (tracker)** — централизованный сервер со списком пиров\n  - **DHT** (Distributed Hash Table) — децентрализованный поиск"], "terms": [{"ru": "DHT", "en": "Distributed Hash Table", "df": "распределённая хэш-таблица"}], "summary": ["Серверная ферма: кластер + балансировщик нагрузки", "Веб-прокси: кэширование, снижение трафика/задерж.", "CDN: edge-серверы близко к пользователю, DNS-редир.", "Примеры CDN: Akamai, Cloudflare, Amazon CloudFront", "P2P: каждый узел=клиент+сервер, нет центра", "BitTorrent: файл->блоки, трекер/DHT ищет пиров", "P2P масштабируемо: пропускн. растёт с числом узлов"]}, {"n": 53, "title": "Цифровое аудио и видео.", "paragraphs": ["**Цифровой звук:**\n- **PCM** (Pulse Code Modulation) — базовый метод оцифровки\n- CD-качество: 44 100 Гц × 16 бит × 2 канала ≈ **1,4 Мбит/с**\n- Сжатие: **MP3, AAC, Opus**", "**Цифровое видео:**\n- Последовательность кадров (**frames**), 24–60 fps\n- Сжатие: **H.264, H.265 (HEVC), VP9, AV1**", "**Типы кадров:**\n- **I-кадр (Intra)** — ключевой, кодируется целиком\n- **P-кадр (Predicted)** — предсказан из предыдущего\n- **B-кадр (Bidirectional)** — предсказан из соседних (вперёд и назад)", "**Потоковая передача сохранённых файлов (Streaming Stored Media):**\n- Сервер передаёт файл, клиент воспроизводит начало, не дожидаясь полной загрузки\n- **ABR** (Adaptive Bitrate) — файл разбит на сегменты, **качество подстраивается под полосу**\n- Стандарты: **DASH** (MPEG-DASH), **HLS** (Apple)", "**Передача в реальном времени (Live Streaming):**\n- Низкая задержка важнее качества\n- **RTP** + **RTCP** для передачи и мониторинга", "**Конференции в реальном времени:**\n- **SIP** (Session Initiation Protocol) или H.323 — сигнализация (установка/разрыв сессии)\n- **WebRTC** — для браузеров, без плагинов", "**Проблемы и решения:**\n- **Джиттер (jitter)** — нестабильность задержки → компенсируется буфером\n- Потери пакетов → **FEC** (Forward Error Correction) или интерливинг"], "terms": [{"ru": "DASH", "en": "Dynamic Adaptive Streaming over HTTP", "df": "стандарт ABR"}], "summary": ["PCM: CD=44100Гц,16бит,2кан.=1.4Мбит/с; MP3,AAC,Opus", "Видеокодеки: H.264,H.265,VP9,AV1; I/P/B-кадры", "ABR: DASH,HLS - адаптивн. качество по полосе", "RTP: передача медиа с метками времени (realtime)", "RTCP: мониторинг качества RTP-сессий", "SIP/H.323: сигнализация; WebRTC: браузер. конфер.", "Джиттер(jitter)->буфер воспр.; потери->FEC"]}, {"n": 54, "title": "FTP.", "paragraphs": ["**FTP** (File Transfer Protocol, RFC 959) — протокол передачи файлов поверх TCP.", "**Особенность:** использует **два отдельных TCP-соединения**.", "**1. Управляющее соединение (Control Connection):**\n- **Порт 21**\n- Постоянное на время сессии\n- Передаёт текстовые команды и ответы", "**2. Соединение данных (Data Connection):**\n- Открывается **отдельно** для каждой передачи файла или листинга\n- Закрывается после передачи", "**Два режима работы:**", "**Активный режим (Active, `PORT`):**\n- Клиент сообщает свой порт\n- **Сервер** инициирует соединение данных к клиенту\n- Проблема: блокируется NAT и firewall", "**Пассивный режим (Passive, `PASV`):**\n- Сервер открывает порт и сообщает его клиенту\n- **Клиент** инициирует соединение данных\n- **Работает через NAT** — основной режим на практике", "**Основные команды:**\n- `USER`, `PASS` — аутентификация\n- `PWD`, `CWD` — текущая / смена директории\n- `LIST` — листинг файлов\n- **`RETR`** — скачать файл (retrieve)\n- **`STOR`** — загрузить файл (store)\n- `DELE` — удалить\n- `TYPE` — режим: `ASCII` / `BINARY`\n- `QUIT` — завершить", "**Ответы сервера** — трёхзначные коды:\n- **220** — готов\n- **331** — требуется пароль\n- **226** — передача завершена\n- **550** — файл недоступен", "**Защищённые варианты:**\n- **FTPS** — FTP + TLS (то же, но с шифрованием)\n- **SFTP** — отдельный протокол поверх SSH (**не связан** с FTP, несмотря на имя)"], "terms": [], "summary": ["FTP: 2 TCP-соединения: управл.(порт 21) + данные", "Активный: сервер->клиент (PORT); пассивн: клиент->серв (PASV)", "Пассивный режим нужен при NAT/firewall", "Команды: USER,PASS,LIST,RETR(скач),STOR(загр),QUIT", "TYPE: ASCII или BINARY; коды: 220,331,226,550", "FTPS=FTP+TLS; SFTP=отдельный протокол поверх SSH"]}, {"n": 55, "title": "ICMP. Ping. Traceroute.", "paragraphs": ["**ICMP** (Internet Control Message Protocol, RFC 792) — вспомогательный протокол сетевого уровня.", "**Назначение:** сигнализация об ошибках и диагностика. **Не переносит** данные пользователя.", "**Номер протокола в IP:** 1.", "**Структура сообщения:** Type + Code + Checksum + данные.", "**Основные типы сообщений:**\n- **Echo Request** (Type 8) и **Echo Reply** (Type 0) — используются в **ping**\n- **Destination Unreachable** (Type 3) — сеть / хост / порт недостижимы\n- **Time Exceeded** (Type 11) — TTL стал 0; используется в **traceroute**\n- **Redirect** (Type 5) — маршрутизатор сообщает о лучшем маршруте", "**Утилита ping:**\n- Шлёт серию **Echo Request** к целевому хосту\n- Измеряет **RTT** (Round-Trip Time) и процент потерь\n- Проверяет достижимость хоста", "**Утилита traceroute:**\n- Шлёт пакеты с **TTL = 1, 2, 3, ...**\n- Каждый маршрутизатор уменьшает TTL на 1\n- При **TTL = 0** маршрутизатор отбрасывает пакет и шлёт **Time Exceeded**\n- По ответам выявляется весь путь до цели\n- **Linux**: UDP-пакеты; **Windows**: ICMP Echo Request", "**ICMPv6** — аналог для IPv6 + протокол **NDP** (Neighbor Discovery Protocol), заменяющий ARP."], "terms": [{"ru": "TTL", "en": "Time To Live", "df": "поле IP-заголовка, ограничивающее число хопов"}, {"ru": "RTT", "en": "Round-Trip Time", "df": "время кругового обхода"}, {"ru": "NDP", "en": "Neighbor Discovery Protocol", "df": "обнаружение соседей в IPv6"}], "summary": ["ICMP: протокол диагностики, в IP (Protocol=1)", "Типы: Echo Req(8)/Reply(0), Dest.Unreach(3), TimeExc(11)", "ping: ICMP Echo Req->Reply, измеряет RTT и потери", "traceroute: TTL=1,2,3... -> Time Exceeded от роутеров", "Unix: UDP+TTL; Windows: ICMP Echo+TTL", "ICMPv6: + NDP (Neighbor Discovery Protocol)"]}], "quizzes": [{"type": "mcq", "topic": "Вопрос 48", "q": "На каком порту работает протокол DNS?", "opts": ["80", "53", "25", "443"], "ans": 1, "expl": "Протокол DNS работает по UDP/TCP на порту 53."}, {"type": "mcq", "topic": "Вопрос 48", "q": "Какой тип записи DNS используется для обратного преобразования адреса в имя?", "opts": ["A", "MX", "CNAME", "PTR"], "ans": 3, "expl": "PTR — запись обратного преобразования адреса в имя."}, {"type": "tf", "topic": "Вопрос 48", "q": "TCP используется в DNS при ответах размером более 512 байт и при передаче зон (AXFR).", "ans": true, "expl": "TCP используется при ответах размером более 512 байт и при передаче зон (AXFR)."}, {"type": "mcq", "topic": "Вопрос 49", "q": "Какой стандарт определяет формат сообщений электронной почты?", "opts": ["RFC 959", "RFC 5322", "RFC 792", "RFC 4301"], "ans": 1, "expl": "Формат сообщений электронной почты определён стандартом RFC 5322."}, {"type": "tf", "topic": "Вопрос 49", "q": "Агент доставки сообщений (MDA) передаёт сообщения между почтовыми серверами по протоколу SMTP.", "ans": false, "expl": "MTA (агент передачи сообщений) передаёт сообщения между серверами по SMTP. MDA осуществляет окончательную доставку в почтовый ящик пользователя."}, {"type": "mcq", "topic": "Вопрос 50", "q": "На каком порту работает SMTP для межсерверной связи?", "opts": ["587", "110", "25", "143"], "ans": 2, "expl": "SMTP работает по TCP на порту 25 для межсерверной связи и 587 для отправки клиентом."}, {"type": "tf", "topic": "Вопрос 50", "q": "Протокол IMAP хранит сообщения на сервере и поддерживает папки, частичную загрузку и поиск на сервере.", "ans": true, "expl": "IMAP — более мощный протокол, при котором сообщения хранятся на сервере; поддерживает папки, частичную загрузку, поиск на сервере и синхронизацию нескольких клиентов."}, {"type": "mcq", "topic": "Вопрос 51", "q": "Какой протокол лежит в основе HTTP/3?", "opts": ["TCP", "SCTP", "QUIC (UDP)", "DCCP"], "ans": 2, "expl": "HTTP/3 работает поверх протокола QUIC (UDP), устраняя блокировку очереди (HOL blocking)."}, {"type": "tf", "topic": "Вопрос 51", "q": "HTTP/2 использует мультиплексирование в рамках одного TCP-соединения и сжатие заголовков (HPACK).", "ans": true, "expl": "HTTP/2 использует мультиплексирование в рамках одного TCP-соединения и сжатие заголовков (HPACK)."}, {"type": "mcq", "topic": "Вопрос 52", "q": "Как CDN направляет пользователя к ближайшему серверу?", "opts": ["ARP-перенаправление", "DNS-перенаправление", "ICMP Redirect", "BGP-перенаправление"], "ans": 1, "expl": "CDN использует DNS-перенаправление: DNS-запрос пользователя разрешается в IP ближайшего узла CDN."}, {"type": "tf", "topic": "Вопрос 52", "q": "В BitTorrent трекер (tracker) или DHT обеспечивают поиск пиров.", "ans": true, "expl": "Трекер (tracker) или DHT (Distributed Hash Table) обеспечивают поиск пиров в BitTorrent."}, {"type": "mcq", "topic": "Вопрос 53", "q": "Какова частота дискретизации стандарта CD (PCM)?", "opts": ["22050 Гц", "48000 Гц", "44100 Гц", "96000 Гц"], "ans": 2, "expl": "Стандарт CD — 44100 Гц, 16 бит, 2 канала (1,4 Мбит/с)."}, {"type": "tf", "topic": "Вопрос 53", "q": "Джиттер (jitter) — это потеря пакетов при передаче медиаданных.", "ans": false, "expl": "Джиттер (jitter) — это вариация задержки, а не потеря пакетов. Он компенсируется буфером воспроизведения (playout buffer)."}, {"type": "mcq", "topic": "Вопрос 54", "q": "На какой порт устанавливается управляющее соединение FTP?", "opts": ["20", "21", "22", "23"], "ans": 1, "expl": "Управляющее соединение FTP устанавливается на порт 21 сервера."}, {"type": "tf", "topic": "Вопрос 54", "q": "В пассивном режиме FTP (PASV) сервер инициирует соединение данных к клиенту.", "ans": false, "expl": "В пассивном режиме (PASV) клиент сам подключается к серверу. В активном режиме сервер инициирует соединение данных с клиентом."}, {"type": "mcq", "topic": "Вопрос 55", "q": "Какой тип сообщения ICMP используется утилитой traceroute при истечении TTL?", "opts": ["Echo Reply (тип 0)", "Destination Unreachable (тип 3)", "Redirect (тип 5)", "Time Exceeded (тип 11)"], "ans": 3, "expl": "При TTL=0 маршрутизатор отбрасывает пакет и возвращает ICMP Time Exceeded (тип 11)."}, {"type": "match", "topic": "Тема 7 — Сопоставление", "q": "Сопоставьте протокол/технологию с их назначением:", "pairs": [["DNS", "Преобразование доменных имён в IP-адреса"], ["SMTP", "Передача почты между серверами (порт 25)"], ["IMAP", "Управление почтой на сервере (папки, поиск)"], ["RTP", "Передача медиаданных реального времени"], ["FTP", "Передача файлов (два TCP-соединения: порт 21 + данные)"], ["ICMP", "Сигнализация об ошибках и диагностика сети"]], "expl": "Каждый протокол имеет своё чёткое назначение в стеке TCP/IP."}]}, {"id": 8, "name": "Вопросы безопасности", "questions": [{"n": 56, "title": "Основы информационной безопасности.", "paragraphs": ["**Информационная безопасность (ИБ)** — защита информации от несанкционированного:\n- Доступа\n- Изменения\n- Уничтожения", "**Триада CIA** — три базовых свойства ИБ:\n- **C — Confidentiality (Конфиденциальность)** — доступ только для авторизованных\n- **I — Integrity (Целостность)** — защита от изменения\n- **A — Availability (Доступность)** — доступ по требованию для авторизованных", "**Безопасная система** — только авторизованные субъекты выполняют только авторизованные действия.", "**Ключевые понятия:**\n- **Угроза (Threat)** — потенциальная возможность нарушения безопасности (случайная или преднамеренная)\n- **Уязвимость (Vulnerability)** — слабость в системе, которой может воспользоваться угроза\n- **Атака (Attack)** — реализация угрозы\n- **Риск (Risk)** = Вероятность × Ущерб", "**Типы атак:**\n- **Пассивные** — перехват, прослушивание (без изменения)\n- **Активные** — модификация, DoS, подмена", "**Управление риском:**\n- Оценка → обработка (снижение / принятие / передача / избегание)", "**Базовые принципы:**\n- **Least Privilege** — минимальные привилегии (только необходимые права)\n- **Defense in Depth** — эшелонированная защита (несколько независимых рубежей)"], "terms": [], "summary": ["CIA: конфиденц.(Confidentiality), целостн.(Integrity), доступн.(Availability)", "Угроза(threat)->уязвимость(vulnerability)->атака(attack)", "Атаки: пассивные(перехват) и активные(модификация)", "Risk = Probability x Impact; управление рисками", "Least privilege: минимум прав для каждого субъекта", "Defense in depth: эшелонированная многоуровн. защита"]}, {"n": 57, "title": "Типы атак. Вредоносное ПО.", "paragraphs": ["**DoS** (Denial of Service) — атака отказа в обслуживании:\n- Цель — **исчерпать ресурсы** сервера (память, CPU, полоса)\n- **DDoS** — распределённая, с множества узлов (**ботнет**)\n- Примеры: **SYN flood**, UDP flood, HTTP flood, **Smurf** (ICMP-broadcast)", "**Перехват трафика (Sniffing):**\n- **Пассивное** чтение пакетов (Wireshark, открытый Wi-Fi)\n- Защита: шифрование (HTTPS, VPN)", "**Перенаправление трафика:**\n- **ARP-спуфинг** — подмена ARP-таблиц в локальной сети\n- **MITM** (Man-in-the-Middle) — атака «человек посередине»\n- **DNS-спуфинг**, **BGP-hijacking**", "**Вредоносное ПО (Malware):**", "**Вирус (Virus):**\n- Внедряется в файлы\n- Требует **запуска пользователем**", "**Червь (Worm):**\n- **Самораспространяется** по сети автоматически\n- Не нужны действия пользователя\n- Пример: **WannaCry**", "**Троян (Trojan Horse):**\n- Маскируется под легитимное ПО\n- **Не саморазмножается**\n- Часто открывает «чёрный ход» (backdoor)", "**Шпионское ПО (Spyware):**\n- Тайно собирает данные (пароли, история браузера)\n- **Кейлоггеры (keyloggers)** — перехват клавиатуры", "**Руткит (Rootkit):**\n- **Скрывает** присутствие вредоносного ПО\n- Модифицирует ядро или системные компоненты ОС"], "terms": [], "summary": ["DoS/DDoS: исчерпание ресурсов; ботнет для DDoS", "SYN flood, UDP flood, Smurf(ICMP-broadcast)", "Перехват: sniffing; перенапр: ARP-спуфинг, MITM", "Вирус: заражает файлы, нужен запуск пользователем", "Червь(worm): самораспростр., автономно (WannaCry)", "Троян: маскируется под легитимн. ПО, не размножается", "Spyware: сбор данных(keylogger); rootkit: скрытие"]}, {"n": 58, "title": "Методы защиты. Политика безопасности.", "paragraphs": ["**Классификация методов защиты:**", "**По характеру:**\n- **Технические** — криптография, МСЭ, антивирусы, IDS / IPS\n- **Организационные** — регламенты, обучение персонала\n- **Правовые** — законодательство (ФЗ-152, GDPR)\n- **Физические** — контроль доступа в помещения, охрана", "**По функции:**\n- **Превентивные** — МСЭ, шифрование, аутентификация\n- **Детективные** — IDS, аудит, журналы\n- **Корректирующие** — резервные копии, отклик на инциденты", "**Политика безопасности (Security Policy)** — формальный документ организации:\n- Перечень **защищаемых активов**\n- Модель угроз\n- Допустимый уровень риска\n- Правила и обязанности\n- Процедуры реагирования", "**Модели управления доступом:**", "**DAC** (Discretionary Access Control):\n- **Владелец** ресурса задаёт права\n- Используется в Linux, Windows (файловая система)", "**MAC** (Mandatory Access Control):\n- **Метки конфиденциальности** (secret, top secret)\n- Назначаются администратором\n- Используется в военных системах", "**RBAC** (Role-Based Access Control):\n- Права назначаются **ролям**\n- Пользователи получают роли\n- Удобно для больших организаций", "**Принципы:**\n- **Least Privilege** — минимальные привилегии\n- **Separation of Duties** — разделение обязанностей (критические действия требуют нескольких лиц)\n- **Default Deny** — запрещено всё, что явно не разрешено"], "terms": [], "summary": ["Методы ИБ: технич/организац/правовые/физические", "По функции: превентивные/детективные/корректирующие", "DAC: владелец задаёт права; MAC: метки конфиденц.", "RBAC: права назначаются ролям, не пользователям", "IDS/IPS: обнаружение/предотвращение вторжений", "Default deny: запрещено всё, что не разрешено", "Separation of duties: критич. действия - неск. лиц"]}, {"n": 59, "title": "Антивирусная защита.", "paragraphs": ["**Четыре основных метода обнаружения:**", "**1. Сканирование сигнатур (Signature Scanning):**\n- Сравнение файлов с **базой известных вирусов** (байтовые последовательности)\n- **Быстро и точно** для известных угроз\n- **Не обнаруживает**:\n  - **Zero-day** (новые атаки без сигнатуры)\n  - **Полиморфные вирусы** (меняют код)\n- Требует регулярного обновления базы", "**2. Контроль целостности (Integrity Checking):**\n- В «чистом» состоянии вычисляются **хэш-суммы** (SHA-256) важных файлов\n- Регулярная проверка: если хэш изменился → возможное заражение\n- **Не зависит** от сигнатур", "**3. Эвристический анализ (Heuristic Scanning):**\n- Поиск **подозрительных конструкций** в коде:\n  - Самомодификация\n  - Запись в MBR (главную загрузочную запись)\n  - Шифрование собственного кода\n- Обнаруживает неизвестные угрозы\n- Минус: возможны **ложные срабатывания**", "**4. Поведенческий анализ (Behavioral Analysis):**\n- Запуск программы в **песочнице (sandbox)** — изолированной среде\n- Мониторинг действий в реальном времени\n- Эффективен против **полиморфных** и **метаморфных** вирусов\n- Современные антивирусы дополняют этот метод **машинным обучением**"], "terms": [], "summary": ["Сигнатурное скан.: база байтовых последоват. вирусов", "Недостаток сигнатур: не видит zero-day и полиморфных", "Контроль целостности: хэши файлов (MD5,SHA-256)", "Эвристика: подозрит. конструкции в коде, ложн. сраб.", "Поведенч. анализ: песочница(sandbox), мониторинг", "Полиморфный: меняет код; метаморфный: переписывает"]}, {"n": 60, "title": "Межсетевые экраны. VPN.", "paragraphs": ["**Межсетевой экран (МСЭ, Firewall)** — система контроля трафика на основе правил.", "**Типы межсетевых экранов:**", "**1. Пакетный фильтр (Packet Filter):**\n- Анализирует **только заголовки** (IP, порты, флаги)\n- **Stateless** — не помнит контекст\n- Сетевой уровень\n- Быстрый, но грубый", "**2. Stateful Inspection:**\n- Отслеживает **состояние TCP-соединений** (таблица состояний)\n- Понимает контекст: «это ответ на разрешённый запрос»\n- Точнее пакетного фильтра", "**3. Прокси-МСЭ прикладного уровня:**\n- Терминирует соединение и анализирует **протокол приложения** (HTTP, DNS, SMTP)\n- Может фильтровать содержимое\n- Медленнее, но мощнее", "**4. NGFW (Next-Generation Firewall):**\n- Stateful + **DPI** (Deep Packet Inspection) + IPS + URL-фильтрация\n- Современный стандарт", "**Архитектура с DMZ:**\n- **DMZ** (Demilitarized Zone) — промежуточный сегмент\n- Между внешним и внутренним МСЭ\n- В ней размещаются публичные серверы (веб, почта, DNS)", "**VPN (Virtual Private Network)** — защищённый **туннель** поверх публичной сети.", "**Свойства VPN:**\n- **Шифрование** всего трафика → конфиденциальность\n- **Целостность** и аутентификация\n- Удалённый доступ к корпоративной сети", "**Типы VPN:**\n- **IPSec VPN** — на сетевом уровне\n- **SSL / TLS VPN** — через браузер (OpenVPN)\n- **L2TP / IPSec, PPTP** — устаревшие"], "terms": [{"ru": "DPI", "en": "Deep Packet Inspection", "df": "глубокая инспекция пакетов"}], "summary": ["Пакетный фильтр: заголовки IP/TCP, без состояния", "Stateful inspection: таблица состояний TCP-сессий", "Прокси прикладн. уровня: анализ HTTP/DNS/SMTP", "NGFW: stateful+DPI+IPS+URL-фильтрация", "DMZ: сегмент между внешн. и внутр. МСЭ", "VPN: IPSec(тунн./трансп.), SSL/TLS VPN, L2TP", "Туннель шифрует весь трафик через публичн. сеть"]}, {"n": 61, "title": "Прокси-серверы. IDS / IPS.", "paragraphs": ["**Прокси-сервер (Proxy Server)** — посредник между клиентом и целевым сервером.", "**Функции прокси:**\n- **Кэширование** ответов\n- **Контроль доступа** (URL-фильтрация, чёрные списки)\n- **Анонимизация** (скрытие реального IP клиента)\n- **SSL-инспекция** (проверка HTTPS-трафика)\n- **Балансировка нагрузки**\n- **Журналирование** трафика", "**Два типа прокси:**", "**1. Прокси прикладного уровня (ALG, Application Layer Gateway):**\n- Полностью разбирает протокол приложения (HTTP, FTP, SMTP)\n- Может **модифицировать содержимое**\n- Специфичен для каждого протокола", "**2. Прокси уровня соединений (Circuit-Level, SOCKS):**\n- Транспортный уровень\n- **Не анализирует** данные приложения, только пересылает\n- Универсален для любых протоколов\n- **SOCKS5** — поддерживает UDP и аутентификацию", "**IDS (Intrusion Detection System)** — **пассивная** система обнаружения вторжений.", "**Типы IDS:**\n- **NIDS** (Network IDS) — анализирует сетевой трафик\n- **HIDS** (Host IDS) — анализирует системные вызовы и журналы на хосте", "**Методы обнаружения:**\n- **Сигнатурный** — поиск известных шаблонов атак\n- **Аномальный (Anomaly Detection)** — отклонение от нормального поведения", "**IPS (Intrusion Prevention System)** — **активная** система предотвращения вторжений.\n- Работает в разрыве трафика (inline)\n- **Блокирует** атаки в реальном времени"], "terms": [{"ru": "ALG", "en": "Application Layer Gateway", "df": "прокси прикладного уровня"}], "summary": ["Прокси: кэширование, контроль, анонимизация, логи", "ALG(прикладн.): разбирает HTTP/FTP/SMTP полностью", "SOCKS(уровень соед.): не анализ. данные, SOCKS5+UDP", "IDS: пассивная, обнаруживает и оповещает", "IPS: активная, блокирует атаки в реальном времени", "NIDS(сетевой) vs HIDS(хостовый)", "Методы: сигнатурный(база) и аномальный(профиль)"]}, {"n": 62, "title": "Криптография. Симметричное и асимметричное шифрование.", "paragraphs": ["**Шифрование (Encryption)** — обратимое преобразование:\n**Plaintext** (открытый текст) → **Ciphertext** (шифртекст)\nс использованием **ключа**.", "**Симметричное шифрование (Symmetric):**\n- **Один ключ** для шифрования и дешифрования\n- **Быстрое** (в тысячи раз быстрее асимметричного)\n- **Проблема**: безопасная передача ключа", "**Примеры симметричных алгоритмов:**\n- **DES** (56 бит) — устарел\n- **3DES** — 168 бит (эффективно ~112)\n- **AES** (Advanced Encryption Standard) — 128 / 192 / 256 бит, **глобальный стандарт**\n- **ГОСТ Р 34.12-2015** — российский стандарт (**Магма** и **Кузнечик**)", "**Режимы шифрования:**\n- **ECB** (Electronic Codebook) — простейший, небезопасный\n- **CBC** (Cipher Block Chaining) — каждый блок зависит от предыдущего\n- **CTR** (Counter) — превращает блочный шифр в поточный\n- **GCM** (Galois/Counter Mode) — шифрование + аутентификация (**AEAD**)", "**Асимметричное шифрование (Public-Key):**\n- **Пара ключей**:\n  - **Public key (открытый)** — для шифрования, можно публиковать\n  - **Private key (закрытый)** — для дешифрования, держится в секрете\n- На порядки **медленнее** симметричного", "**Примеры асимметричных алгоритмов:**\n- **RSA** — на сложности **факторизации** больших чисел\n- **DH / DSA / ECDSA** — на **дискретном логарифмировании**\n- **ECC** (Elliptic Curve Cryptography) — на эллиптических кривых", "**Гибридная схема (на практике):**\n1. Случайный **сессионный ключ** шифруется асимметрично (RSA)\n2. Сами данные шифруются симметрично (AES) этим ключом", "**Односторонние функции (One-Way Functions):**\n- Легко вычисляются, но **практически необратимы**\n- С «люком» (**trapdoor**) — основа асимметричной криптографии", "**Криптоанализ (Cryptanalysis)** — методы взлома:\n- **Brute Force** — полный перебор ключей\n- Дифференциальный, линейный криптоанализ\n- Атаки на основе известного / выбранного открытого текста"], "terms": [], "summary": ["Симметр: 1 ключ, быстро; AES(128/192/256), ГОСТ", "Асимметр: пара ключей; RSA(факториз.), ECC(кривые)", "Асимметр. медленнее -> гибридная схема на практике", "Режимы: ECB,CBC,CTR,GCM (для блочн. шифров)", "Односторонняя функция: легко вычислить, нельзя обратить", "Криптоанализ: brute force, дифференц., линейный"]}, {"n": 63, "title": "Электронная подпись. Парадокс дней рождений.", "paragraphs": ["**ЭЦП (Digital Signature)** обеспечивает три свойства:\n- **Authenticity** — подтверждение отправителя\n- **Integrity** — защита от изменения\n- **Non-Repudiation** (неотрекаемость) — отправитель не может отрицать авторство", "**ЭЦП с симметричным ключом:**\n- Через **доверенного арбитра (trusted arbiter)**\n- Каждый участник делит ключ с арбитром\n- Арбитр — **узкое место** и единая точка отказа\n- Редко применяется на практике", "**ЭЦП с открытым ключом (основная):**", "**Подпись:**\n1. Вычисляется **хэш сообщения**\n2. Хэш шифруется **закрытым ключом** отправителя → получается подпись\n3. Подпись отправляется вместе с сообщением", "**Проверка:**\n1. Получатель расшифровывает подпись **открытым ключом** отправителя → ожидаемый хэш\n2. Получатель сам вычисляет хэш полученного сообщения\n3. Если хэши **совпадают** — подпись валидна", "**Алгоритмы подписи:** RSA-PSS, DSA, **ECDSA**, ГОСТ Р 34.10-2012.", "**Хэш-функция (Hash Function / Message Digest):**\n- Преобразует сообщение произвольной длины в значение **фиксированной длины** (128–512 бит)\n- **Требования:**\n  - **Однонаправленность** (one-way)\n  - **Устойчивость к коллизиям**", "**Стандарты хэш-функций:**\n- **MD5** — скомпрометирован\n- **SHA-1** — устарел\n- **SHA-2** (SHA-256, SHA-512) — действующий стандарт\n- **SHA-3** — современный (на основе Keccak)\n- **Стрибог** (ГОСТ Р 34.11-2012) — российский, 256 / 512 бит", "**Парадокс дней рождений (Birthday Paradox):**\n- Вероятностный феномен: коллизия в наборе случайных значений находится **намного быстрее**, чем кажется\n- Для хэша длиной **n бит** коллизия находится за **~2^(n/2)** операций (вместо 2^n)\n- **Следствие**: для реальной стойкости 128 бит нужен хэш минимум **256 бит**"], "terms": [], "summary": ["ЭЦП: аутентичность + целостность + неотрекаемость", "С откр. ключом: хэш сообщ. шифруется закр. ключом", "Алгоритмы: RSA-PSS, DSA, ECDSA, ГОСТ Р 34.10-2012", "Хэши: MD5(128,скомпр.), SHA-1(160,устарел), SHA-256+", "SHA-3(Keccak), Стрибог(ГОСТ,256/512 бит)", "Парадокс дней рождений: коллизия за ~2^(n/2) операций", "Поэтому хэш >= 256 бит (реальная стойкость 2^128)"]}, {"n": 64, "title": "Сертификаты X.509. PKI.", "paragraphs": ["**Сертификат открытого ключа (Public Key Certificate):**\n- **Связывает** открытый ключ с владельцем (имя, организация)\n- Подписан **удостоверяющим центром (CA)**\n- Позволяет проверить подлинность открытого ключа", "**Формат X.509** (стандарт ITU-T, используется в TLS / HTTPS):", "**Основные поля:**\n- Версия (v3)\n- **Серийный номер**\n- Алгоритм подписи\n- **Issuer** — кто выдал (CA)\n- **Validity** — срок действия\n- **Subject** — кому выдан (**DN** — Distinguished Name)\n- **Открытый ключ** субъекта", "**Расширения X.509 v3:**\n- **Subject Alternative Name (SAN)** — дополнительные имена\n- **Key Usage** — разрешённые применения ключа\n- **CRL Distribution Points** — где получить список отозванных\n- **OCSP** — URL для онлайн-проверки", "**CA (Certification Authority)** — удостоверяющий центр:\n- Выпускает сертификаты\n- Подписывает их своим закрытым ключом\n- Отзывает скомпрометированные\n- Проверяет подлинность владельца до выдачи", "**Проверка отзыва сертификата:**\n- **CRL** (Certificate Revocation List) — список отозванных, скачивается периодически\n- **OCSP** (Online Certificate Status Protocol) — проверка в реальном времени", "**PKI (Public Key Infrastructure)** — инфраструктура открытых ключей:\n- Совокупность **CA**, политик, стандартов и ПО\n- Управляет жизненным циклом сертификатов", "**Иерархия доверия:**\n- **Root CA** (корневой) — самоподписан, встроен в браузеры и ОС\n- → **Промежуточные CA** (Intermediate)\n- → **Конечные сертификаты** (End-entity)", "**Цепочка доверия (Chain of Trust):**\n- Каждый сертификат подписан вышестоящим CA\n- Браузер проверяет всю цепочку до Root CA"], "terms": [{"ru": "CA", "en": "Certification Authority", "df": "удостоверяющий центр"}, {"ru": "DN", "en": "Distinguished Name", "df": "уникальное имя в формате X.500"}], "summary": ["Сертификат X.509: откр. ключ + владелец + подпись CA", "Поля: версия,серийн.N,issuer,validity,subject,ключ", "CA: выпускает, подписывает, отзывает сертификаты", "CRL: список отозванных; OCSP: онлайн-проверка", "PKI: иерархия Root CA -> промежут. CA -> конечные", "Chain of trust: цепочка до самоподпис. корневого CA"]}, {"n": 65, "title": "Аутентификация. Авторизация. Аудит.", "paragraphs": ["**Три понятия (модель AAA):**\n- **Authentication (Аутентификация)** — кто ты? (проверка идентичности)\n- **Authorization (Авторизация)** — что ты можешь? (предоставление прав)\n- **Accounting / Audit (Аудит)** — что ты сделал? (регистрация действий)", "**Протоколы AAA:** **RADIUS**, **TACACS+**.", "**Три фактора аутентификации:**\n1. **Знание** (something you know) — пароль, PIN\n2. **Владение** (something you have) — токен, смарт-карта, телефон\n3. **Биометрия** (something you are) — отпечаток, лицо, голос", "**MFA (Multi-Factor Authentication)** — комбинация нескольких факторов.", "**OTP (One-Time Password)** — одноразовый пароль:\n- **HOTP** (RFC 4226) — на основе **счётчика** (counter-based)\n- **TOTP** (RFC 6238) — на основе **времени** (time-based, окно 30 секунд)\n- **S/Key** — хэш-цепочка\n- **Защищает от Replay Attack** (перехвата и повторного использования)", "**Аутентификация на основе сертификатов:**\n1. Клиент предъявляет сертификат **X.509**\n2. Сервер посылает случайный **challenge**\n3. Клиент подписывает его своим **закрытым ключом**\n4. Сервер проверяет подпись открытым ключом из сертификата\n- Применяется в **mTLS** (mutual TLS), IPSec, VPN, смарт-картах", "**Аутентификация информации (Data Origin Authentication):**\n- Подтверждение, что данные **от заявленного отправителя** и не изменены\n- Реализуется через:\
