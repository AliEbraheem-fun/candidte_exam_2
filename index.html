остаточный пакет называется **дейтаграммой**", "Каждый маршрутизатор сам решает, куда послать дейтаграмму дальше; разные пакеты одного потока могут идти разными путями", "Возможны потери, переупорядочение, дубликаты; модель называется **best effort** («как получится»)", "Маршрутизатор находит путь по **таблице маршрутизации**, правило выбора — **longest prefix match** (самое длинное совпадение префикса)", "Таблицы заполняются автоматически протоколами маршрутизации (OSPF, BGP)", "**Плюсы модели**: простота (нет состояния соединений), устойчивость к отказам, гибкость, масштабируемость", "**Минусы**: никаких гарантий (порядок, скорость, потери — забота транспортного уровня); каждый пакет тащит длинный адрес", "Главный пример — **IP**; исторически были IPX (Novell) и CLNP (OSI), но они проиграли"]}, {"n": 31, "title": "Реализация сервиса с установлением соединения. Сравнение сетей виртуальных каналов и дейтаграммных сетей.", "paragraphs": ["Реализация сервиса с установлением соединения на сетевом уровне чаще всего строится на базе **сетей виртуальных каналов** (Virtual Circuit Networks). В отличие от них, сервис без установления соединения использует **дейтаграммные сети** (Datagram Networks).", "<h3>Реализация сервиса с установлением соединения (виртуальные каналы)</h3>", "В сетях виртуальных каналов перед началом передачи данных источник обязательно должен настроить сквозной маршрут через промежуточные маршрутизаторы до получателя. Процесс передачи состоит из трёх фаз:", "- **Установление соединения:** пакет-запрос (Setup Request) идёт от источника к получателю. Маршрутизаторы на пути выбирают трассу, резервируют ресурсы (буферы, пропускную способность) и заносят записи в свои внутренние таблицы коммутации.\n- **Передача данных:** все пакеты сессии следуют по одному и тому же зарезервированному пути.\n- **Разрыв соединения:** пакет-разъединение очищает записи в таблицах маршрутизаторов и освобождает зарезервированные ресурсы.", "**Особенность адресации.** Пакеты данных не переносят полный адрес получателя. Вместо этого они содержат короткий идентификатор виртуального канала — **VCI** (Virtual Circuit Identifier). Маршрутизатор принимает пакет, смотрит на VCI и входящий порт, меняет VCI на новый (для следующего участка) и перенаправляет пакет в строго определённый выходной порт. Этот приём называется **label swapping** и лежит в основе **MPLS**.", "Исторические примеры таких сетей: **X.25**, **Frame Relay**, **ATM**, и современный **MPLS** в магистральных сетях операторов.", "<h3>Дейтаграммные сети (сервис без установления соединения)</h3>", "В дейтаграммных сетях (главный пример — сети **IP**) каждый пакет является абсолютно независимым фрагментом данных:", "- **Независимость пакетов:** предварительная настройка сети не требуется; каждый пакет содержит полный адрес назначения и адрес источника.\n- **Маршрутизация по адресу:** маршрутизаторы принимают пакет, анализируют адрес назначения по своей таблице маршрутизации и отправляют его на оптимальный (в данный момент) следующий узел.\n- **Динамический маршрут:** разные пакеты одного и того же сообщения могут быть отправлены по разным маршрутам из-за изменения топологии или загруженности сети.\n- **Реакция на отказы:** при выходе из строя маршрутизатора следующие пакеты автоматически пойдут в обход.", "<h3>Сравнение сетей виртуальных каналов и дейтаграммных сетей</h3>", "| Критерий сравнения | Виртуальные каналы (Connection-Oriented) | Дейтаграммные сети (Connectionless) |\n|---|---|---|\n| Установление соединения | обязательно перед отправкой данных | не требуется, передача начинается сразу |\n| Адрес в пакете | короткий номер виртуального канала (VCI) | полные адреса источника и получателя |\n| Выбор маршрута | один раз при создании канала | для каждого пакета индивидуально |\n| Состояние маршрутизаторов | хранят информацию о каждом соединении | хранят только таблицы направлений, не «знают» о сессиях |\n| Порядок доставки | пакеты гарантированно приходят в исходном порядке | возможно нарушение порядка, нужна сборка на приёмнике |\n| Реакция на отказы | канал рвётся, сессию нужно создавать заново | повреждённый узел обходится новыми пакетами по альтернативному пути |\n| Резервирование ресурсов | возможно (QoS, гарантия полосы) | затруднено (работа по принципу «best effort») |\n| Эффективность при коротких данных | низкая (избыточные затраты на setup/teardown) | высокая (идеально для быстрых одиночных запросов) |\n| Исторические примеры | ATM, X.25, Frame Relay; современный — MPLS | IP (Internet Protocol) |"], "terms": [{"ru": "Виртуальный канал", "en": "virtual circuit, VC", "df": "логический путь, установленный заранее для группы пакетов"}, {"ru": "VCI / VPI", "en": "Virtual Circuit / Path Identifier", "df": "короткие идентификаторы канала и пути в ATM"}, {"ru": "PVC / SVC", "en": "Permanent / Switched Virtual Circuit", "df": "постоянный/коммутируемый VC"}, {"ru": "ATM", "en": "Asynchronous Transfer Mode", "df": "технология на основе VC с ячейками фиксированного размера (53 байта)"}, {"ru": "MPLS", "en": "Multiprotocol Label Switching", "df": "коммутация по меткам, сочетает элементы VC и IP"}, {"ru": "QoS", "en": "Quality of Service", "df": "гарантии качества: задержка, пропускная способность, потери"}], "summary": ["Сервис с установлением соединения на сетевом уровне строится на **виртуальных каналах** (Virtual Circuit Networks); сервис без соединения — на **дейтаграммных сетях** (как IP)", "**Виртуальный канал** — перед передачей данных источник прокладывает сквозной маршрут через промежуточные маршрутизаторы до получателя", "**Три фазы передачи**:", "**Установление соединения** — пакет-запрос (Setup Request) идёт от источника к получателю; маршрутизаторы выбирают трассу, резервируют ресурсы и заносят записи в таблицы коммутации", "**Передача данных** — все пакеты сессии следуют по одному и тому же зарезервированному пути", "**Разрыв соединения** — пакет-разъединение очищает записи и освобождает ресурсы", "**Адресация в VC**: пакеты не несут полный адрес получателя; вместо него — короткий **VCI** (Virtual Circuit Identifier)", "Маршрутизатор смотрит на VCI и входящий порт, меняет VCI на новый и перенаправляет в строго определённый выходной порт — приём называется **label swapping**", "Примеры VC-сетей: **X.25, Frame Relay, ATM**; современный — **MPLS** в операторских магистралях", "**Дейтаграммная сеть** (IP): каждый пакет независим, несёт полный адрес назначения; настройка сети не нужна", "Маршрутизаторы анализируют адрес назначения по таблице маршрутизации и отправляют пакет на оптимальный следующий узел", "Разные пакеты одного сообщения могут пойти разными маршрутами", "**Сравнение VC vs дейтаграммы**:", "**Setup**: обязателен / не нужен; **адрес в пакете**: короткий VCI / полные адреса источника и назначения", "**Выбор маршрута**: один раз при создании канала / для каждого пакета", "**Состояние в маршрутизаторе**: запись на каждое соединение / только таблицы направлений", "**Порядок доставки**: гарантирован / возможно нарушение", "**Реакция на отказ узла**: канал рвётся, создаётся заново / пакеты автоматически обходят", "**Резервирование (QoS)**: возможно / затруднено (best-effort)", "**Эффективность на коротких данных**: низкая (накладные на setup) / высокая", "**Примеры**: ATM, X.25, Frame Relay, MPLS / IP"]}, {"n": 32, "title": "Алгоритмы маршрутизации: принцип оптимальности маршрута, алгоритм нахождения кратчайшего пути, заливка.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Маршрутизация** (routing) — процесс выбора путей для доставки пакетов от источника к получателю через сеть с несколькими промежуточными узлами. Цель — заполнить **таблицы пересылки** (FIB) маршрутизаторов так, чтобы доставка была быстрой, экономичной и устойчивой к отказам. Алгоритмы маршрутизации делятся на **неадаптивные** (static, заполняются вручную) и **адаптивные** (dynamic), которые в свою очередь делят на централизованные и распределённые, основанные на различных метриках: число хопов, задержка, доступная полоса, надёжность.", "<h3>Принцип оптимальности маршрута</h3>", "**Принцип оптимальности** (optimality principle), также известный как принцип Беллмана: если узел **B лежит на оптимальном пути из A в C**, то участок пути от **B до C тоже оптимален**. Иначе можно было бы заменить часть пути на ещё более короткую — противоречие.", "Прямое следствие: для каждого получателя D в сети существует **дерево кратчайших путей** (**sink tree**), корнем которого является D, а от каждого другого узла к нему ведёт единственный оптимальный путь. Это дерево не обязательно уникально (могут быть несколько равноценных путей — ECMP), но всегда существует. Все алгоритмы маршрутизации можно интерпретировать как **поиск sink tree** для каждого получателя.", "<h3>Алгоритм Дейкстры (Dijkstra, 1959)</h3>", "Классический алгоритм поиска кратчайших путей **от одного источника** ко всем остальным вершинам взвешенного графа с **неотрицательными весами рёбер**:", "1. Все вершины помечаются как «временные», расстояние до них = ∞, кроме источника s (расстояние = 0).\n2. Текущая рабочая вершина — s.\n3. Для каждой соседней с текущей временной вершины v: если dist(v) > dist(current) + w(current, v), обновить dist(v) и предшественника.\n4. Выбрать среди временных вершину с минимальным расстоянием — сделать её «постоянной» (она и есть текущая).\n5. Повторять, пока все вершины не станут постоянными.", "Сложность с двоичной кучей: O((V+E)·log V); с фибоначчиевой кучей: O(E + V·log V).", "**Применение**:\n- **OSPF** (Open Shortest Path First, RFC 2328) — каждый маршрутизатор по объявлениям LSA строит полный граф сети и запускает Дейкстру.\n- **IS-IS** (ISO 10589) — аналогично для оптического и операторского ядра.\n- **Bellman-Ford** — альтернатива для отрицательных весов и распределённого вычисления (используется в RIP).", "<h3>Заливка (flooding)</h3>", "**Flooding** — простейший алгоритм без знания топологии: маршрутизатор копирует пришедший пакет на **все исходящие интерфейсы, кроме того, с которого получил**. Гарантирует, что пакет дойдёт до всех узлов сети, причём **первая прибывшая копия** идёт по кратчайшему пути (поскольку других путей короче не существует).", "Проблема — экспоненциальное размножение пакетов. Защитные механизмы:\n- **TTL / Hop Limit** — счётчик, уменьшаемый на каждом узле; при 0 пакет уничтожается.\n- **Sequence number** — каждый источник нумерует свои пакеты; маршрутизатор помнит видимые номера и не пересылает повторы.\n- **Reverse-Path Forwarding** (RPF) — пакет пересылается только если он пришёл с интерфейса, который сам является кратчайшим путём к источнику (отбрасывает дубликаты).", "**Применения flooding**:\n- Распространение **LSA** в Link-State протоколах (OSPF, IS-IS).\n- Военные/тактические сети, где топология неизвестна, а надёжность важнее эффективности.\n- **Selective flooding** — заливка только в направлении приблизительно к назначению.\n- В Bluetooth Mesh — основной способ распространения сообщений.", "<h3>Метрики стоимости рёбер</h3>", "Веса рёбер могут отражать:\n- **Число хопов** (RIP) — простота, но не учитывает скорость каналов.\n- **Задержку** или **обратное значение пропускной способности** (OSPF default = 10⁸ / bw).\n- **Финансовую стоимость** (BGP MED).\n- **Текущую загрузку** — приводит к осцилляциям (Q36).", "<h3>Сравнение базовых алгоритмов</h3>", "| Алгоритм | Знание топологии | Вычисление | Использование |\n|---|---|---|---|\n| Static | вручную | нет | малые стабильные сети |\n| Flooding | не нужно | нет | LSA, экстренная доставка |\n| Дейкстра | полное (Link-State) | централизованное в каждом узле | OSPF, IS-IS |\n| Bellman-Ford | только соседи | распределённое | RIP, distance-vector |"], "terms": [{"ru": "Маршрутизация", "en": "routing", "df": "выбор пути пакета от отправителя к получателю"}, {"ru": "Принцип оптимальности", "en": "optimality principle", "df": "подпути оптимальных маршрутов тоже оптимальны"}, {"ru": "Sink tree", "en": "дерево кратчайших путей", "df": "дерево оптимальных путей от всех узлов к одному получателю"}, {"ru": "Алгоритм Дейкстры", "en": "Dijkstra's algorithm", "df": "алгоритм поиска кратчайших путей от одного источника на графе с неотрицательными весами"}, {"ru": "Заливка", "en": "flooding", "df": "рассылка пакета на все интерфейсы, кроме входящего"}, {"ru": "TTL / Hop Limit", "en": "Time to Live", "df": "счётчик переходов, ограничивающий время жизни пакета в сети"}, {"ru": "LSA", "en": "Link State Advertisement", "df": "объявление состояния линий"}, {"ru": "OSPF", "en": "Open Shortest Path First", "df": "протокол маршрутизации, использующий алгоритм Дейкстры"}, {"ru": "ECMP", "en": "Equal-Cost Multi-Path", "df": "балансировка по нескольким равноценным маршрутам"}], "summary": ["**Маршрутизация** = заполнение **FIB** так, чтобы доставка была быстрой и устойчивой", "Классификация: **неадаптивная** (static, вручную) vs **адаптивная** (dynamic); централизованная vs распределённая", "Метрики: число хопов, задержка, обратная полоса, надёжность, стоимость", "**Принцип оптимальности (Беллмана)**: если B на оптимальном пути из A в C, то участок B→C тоже оптимален", "Следствие: для каждого получателя D существует **дерево кратчайших путей (sink tree)** с корнем D", "ECMP — несколько равноценных путей; все алгоритмы маршрутизации = поиск sink tree", "**Алгоритм Дейкстры** (1959) — кратчайшие пути от одного источника, **неотрицательные веса**", "Шаги: dist=0 для s, ∞ для других; обновление соседей; выбор минимальной временной → постоянной", "Сложность: **O((V+E)·log V)** с двоичной кучей; O(E + V·log V) с фибоначчиевой", "Применение Дейкстры: **OSPF** (RFC 2328), **IS-IS** (ISO 10589)", "**Bellman-Ford** — альтернатива для отрицательных весов и распределённого вычисления (**RIP**)", "**Flooding (заливка)**: копировать пакет на все интерфейсы кроме входного — без знания топологии", "Заливка: первая копия идёт по кратчайшему пути; гарантирует доставку всем", "Защита от размножения: **TTL/Hop Limit**, **sequence number** (помнит видимые), **RPF** (Reverse-Path Forwarding)", "**RPF**: пересылать только если пакет пришёл с интерфейса, который сам — кратчайший путь к источнику", "Применения flooding: **распространение LSA** в OSPF/IS-IS, военные сети, Bluetooth Mesh, selective flooding", "Сравнение: static (вручную); flooding (без знания, для LSA); Дейкстра (полная топология, LS); Bellman-Ford (только соседи, DV)"]}, {"n": 33, "title": "Алгоритмы маршрутизации: маршрутизация по вектору расстояний, маршрутизация с учетом состояния линий, иерархическая маршрутизация.", "paragraphs": ["Сетевой уровень использует алгоритмы маршрутизации для определения оптимального пути передачи пакетов. Ниже разобраны три классических алгоритма из этого вопроса.", "<h3>Маршрутизация по вектору расстояний (Distance-Vector Routing)</h3>", "Алгоритм основан на поиске кратчайшего пути **Беллмана-Форда**. Каждый маршрутизатор ведёт таблицу с расстояниями до всех известных подсетей.", "- **Принцип работы:** маршрутизатор периодически отправляет копию своей таблицы только своим непосредственным соседям.\n- **Метрика:** обычно используется количество хопов (транзитных узлов) или задержка.\n- **Обновление:** получив таблицу от соседа, узел проверяет, можно ли улучшить свои маршруты через этого соседа. Если да, таблица обновляется.\n- **Проблема «счёта до бесконечности» (Count-to-Infinity):** при разрыве связи узлы могут бесконечно увеличивать метрику друг через друга. Для борьбы с этим используют ограничение максимального пути (например, 15 хопов в RIP) и метод **расщепления горизонта** (Split Horizon).\n- **Пример протокола:** RIP (Routing Information Protocol).", "<h3>Маршрутизация с учётом состояния линий (Link-State Routing)</h3>", "Этот подход решает проблемы дистанционно-векторных алгоритмов. Каждый маршрутизатор строит полную и точную карту всей сети.", "- **Принцип работы:** узел собирает данные о своих непосредственных линках (статус, скорость) и рассылает эту информацию всем узлам сети методом лавинной адресации (**Flooding**).\n- **Пакет состояния линка (LSP):** содержит идентификатор узла, список соседей и стоимость (метрику) каждого соединения.\n- **Расчёт пути:** собрав LSP от всех узлов, каждый маршрутизатор строит граф сети и рассчитывает кратчайшие пути с помощью алгоритма **Дейкстры**.\n- **Плюсы:** быстрая сходимость сети, отсутствие петель маршрутизации.\n- **Минусы:** требует больше оперативной памяти и ресурсов процессора.\n- **Пример протокола:** OSPF (Open Shortest Path First).", "<h3>Иерархическая маршрутизация (Hierarchical Routing)</h3>", "С ростом сети таблицы маршрутизации становятся слишком большими, что перегружает память и процессор устройств. Иерархическая маршрутизация решает проблему масштабирования.", "- **Принцип работы:** сеть делится на регионы (области, автономные системы).\n- **Внутренняя маршрутизация:** внутри своего региона маршрутизатор знает детальную топологию и каждый узел.\n- **Внешняя маршрутизация:** для отправки пакета в другой регион маршрутизатор знает только адрес пограничного шлюза. Внутренняя структура чужого региона от него скрыта.\n- **Плюс:** резкое сокращение размера таблиц маршрутизации и объёма служебного трафика.\n- **Минус:** возможен выбор не самого оптимального пути, так как маршрут оценивается укрупнённо, а не до конкретного хоста.\n- **Пример:** разделение OSPF на области (Area 0, Area 1) или глобальная маршрутизация в Интернете через **BGP**."], "terms": [{"ru": "Вектор расстояний", "en": "distance vector", "df": "подход, при котором маршрутизаторы обмениваются таблицами расстояний с соседями"}, {"ru": "Состояние линий", "en": "link state", "df": "подход, при котором каждый маршрутизатор знает полную карту сети"}, {"ru": "Счёт до бесконечности", "en": "count-to-infinity", "df": "медленная сходимость DV при отказе линии"}, {"ru": "LSA", "en": "Link State Advertisement", "df": "пакет с информацией о соседях и стоимостях линий"}, {"ru": "LSDB", "en": "Link State Database", "df": "база данных состояний линий у каждого маршрутизатора"}, {"ru": "OSPF", "en": "Open Shortest Path First", "df": "протокол маршрутизации на основе Link State"}, {"ru": "IS-IS", "en": "Intermediate System to IS", "df": "Link State протокол для операторских и магистральных сетей"}, {"ru": "AS", "en": "Autonomous System", "df": "автономная система, группа сетей под единым управлением"}, {"ru": "IGP / EGP", "en": "Interior / Exterior Gateway Protocol", "df": "внутренние / внешние протоколы маршрутизации"}, {"ru": "BGP", "en": "Border Gateway Protocol", "df": "протокол маршрутизации между автономными системами"}], "summary": ["Три классических алгоритма маршрутизации: **по вектору расстояний**, **по состоянию линий**, **иерархическая**", "**Маршрутизация по вектору расстояний (Distance-Vector)** — основана на алгоритме **Беллмана-Форда**", "**Принцип**: маршрутизатор периодически отправляет копию своей таблицы только непосредственным соседям", "**Метрика**: обычно количество хопов или задержка", "**Обновление**: получив таблицу от соседа, узел проверяет, можно ли улучшить свои маршруты через него", "**Проблема Count-to-Infinity**: при разрыве связи метрика растёт бесконечно через альтернативные пути", "Решения: ограничение максимального пути (15 хопов в RIP), **расщепление горизонта (Split Horizon)**", "**Пример протокола**: RIP (Routing Information Protocol)", "**Маршрутизация с учётом состояния линий (Link-State)** — каждый маршрутизатор строит полную карту всей сети", "**Принцип**: узел собирает данные о своих линках и рассылает их всем узлам методом **лавинной адресации (Flooding)**", "**Пакет LSP** (Link State Packet): идентификатор узла + список соседей + стоимость каждого соединения", "**Расчёт пути**: собрав LSP от всех, маршрутизатор строит граф и считает кратчайшие пути алгоритмом **Дейкстры**", "Плюсы: быстрая сходимость, нет петель; минусы: больше памяти и ресурсов CPU", "**Пример протокола**: OSPF (Open Shortest Path First)", "**Иерархическая маршрутизация** — решает проблему масштабирования таблиц на больших сетях", "**Принцип**: сеть делится на регионы (области, автономные системы)", "**Внутри региона** маршрутизатор знает детальную топологию; **за пределами** — только адрес пограничного шлюза", "**Плюс**: резкое сокращение размера таблиц и служебного трафика", "**Минус**: возможен неоптимальный путь, так как маршрут оценивается укрупнённо", "**Пример**: разделение OSPF на области (Area 0, Area 1) или маршрутизация в Интернете через **BGP**"]}, {"n": 34, "title": "Алгоритмы маршрутизации: широковещательная маршрутизация, многоадресная рассылка, произвольная маршрутизация.", "paragraphs": ["Сетевые технологии используют специальные методы продвижения пакетов, когда данные нужно доставить не одному получателю, а группе узлов или любому ближайшему серверу. Ниже разобраны три алгоритма из этого вопроса.", "<h3>Широковещательная маршрутизация (Broadcast)</h3>", "Цель алгоритма — доставить пакет от одного источника всем без исключения узлам сети.", "- **Передача копий:** источник отправляет отдельный пакет каждому узлу. Метод неэффективен, так как забивает каналы связи дубликатами.\n- **Лавинная маршрутизация** (Flooding): маршрутизатор дублирует входящий пакет на все порты, кроме того, с которого он пришёл. Чтобы сеть не зациклилась, пакеты снабжают счётчиком жизни (TTL) или уникальным ID.\n- **Reverse Path Forwarding (RPF):** маршрутизатор пересылает широковещательный пакет дальше только в том случае, если он пришёл по тому порту, который используется для отправки обычных пакетов к источнику этого бродкаста. Это исключает появление петель без хранения истории пакетов.\n- **Связующее дерево** (Spanning Tree): строится граф без петель, охватывающий все узлы. Пакеты копируются только вдоль ветвей этого дерева.", "<h3>Многоадресная рассылка (Multicast)</h3>", "Цель алгоритма — доставить пакет от одного источника определённой группе заинтересованных узлов.", "- **Принцип работы:** вместо отправки индивидуальных копий (Unicast) создаётся единый поток данных. Пакет копируется маршрутизаторами только в точках разветвления сети, где пути к участникам группы расходятся.\n- **Управление группой:** узлы динамически заявляют о своём желании вступить в группу или выйти из неё. Для этого на локальном уровне используется протокол **IGMP** (Internet Group Management Protocol).\n- **Деревья распределения:**\n  - **Дерево от источника** (Source-based tree): своё дерево для каждого отправителя (протокол **PIM-DM**).\n  - **Общее дерево** (Shared tree): единое дерево для всей группы с центром в «точке рандеву» (протокол **PIM-SM**).\n- **Применение:** стриминг видео, онлайн-трансляции, видеоконференции, раздача обновлений.", "<h3>Произвольная маршрутизация (Anycast)</h3>", "Цель алгоритма — доставить пакет от источника одному любому (обычно самому близкому) узлу из целевой группы.", "- **Принцип работы:** несколько физических серверов, расположенных в разных частях мира, настраиваются на использование одного и того же IP-адреса.\n- **Выбор пути:** маршрутизаторы воспринимают этот IP-адрес как один объект и используют стандартные протоколы (например, **BGP**) для поиска кратчайшего пути. В итоге пакет автоматически попадает на тот сервер, который находится ближе всего к отправителю с точки зрения сетевых метрик.\n- **Отказоустойчивость:** если ближайший Anycast-сервер падает, глобальные таблицы маршрутизации обновляются, и трафик пользователей автоматически перенаправляется на следующий ближайший живой сервер.\n- **Применение:** корневые **DNS**-серверы (Root DNS), геораспределённые сети доставки контента (**CDN**), защита от DDoS-атак."], "terms": [{"ru": "Broadcast", "en": "широковещание", "df": "доставка пакета всем узлам сети"}, {"ru": "Multicast", "en": "многоадресная рассылка", "df": "доставка пакета определённой группе получателей"}, {"ru": "Anycast", "en": "произвольная маршрутизация", "df": "доставка ближайшему из узлов с одинаковым адресом"}, {"ru": "RPF", "en": "Reverse Path Forwarding", "df": "пересылка только если пакет пришёл с кратчайшего пути к источнику"}, {"ru": "Остовное дерево", "en": "spanning tree", "df": "дерево, покрывающее все узлы без петель"}, {"ru": "SPT / RPT", "en": "Source-based / shared Rendezvous Point Tree", "df": "деревья multicast от источника или через RP"}, {"ru": "DVMRP", "en": "Distance Vector Multicast Routing Protocol", "df": "протокол multicast с RPF + pruning"}, {"ru": "PIM-SM / PIM-DM", "en": "Protocol Independent Multicast, Sparse / Dense Mode", "df": "современные multicast-протоколы"}, {"ru": "IGMP / MLD", "en": "Internet Group Management / Multicast Listener Discovery", "df": "управление подпиской хостов"}, {"ru": "SSM", "en": "Source-Specific Multicast", "df": "multicast с указанием источника"}, {"ru": "CDN", "en": "Content Delivery Network", "df": "сеть доставки контента, часто использующая anycast"}], "summary": ["Три специальных алгоритма доставки: **широковещательная (Broadcast)**, **многоадресная (Multicast)**, **произвольная (Anycast)**", "**Broadcast** — доставить пакет от одного источника **всем без исключения узлам** сети", "**Передача копий**: источник шлёт отдельный пакет каждому — неэффективно, забивает каналы дубликатами", "**Лавинная маршрутизация (Flooding)**: маршрутизатор дублирует входящий пакет на все порты, кроме входного; от зацикливания — счётчик TTL или уникальный ID", "**Reverse Path Forwarding (RPF)**: пересылать только если пакет пришёл с того порта, через который этот узел сам отправляет пакеты к источнику бродкаста", "**Связующее дерево (Spanning Tree)**: строится граф без петель, пакеты копируются только вдоль ветвей", "**Multicast** — доставить пакет от одного источника **определённой группе** заинтересованных узлов", "**Принцип**: единый поток данных; пакет копируется только в точках разветвления к участникам группы", "**Управление группой**: узлы динамически вступают/выходят, локальный протокол — **IGMP** (Internet Group Management Protocol)", "**Деревья распределения**:", "**Source-based tree** — своё дерево от каждого источника (протокол **PIM-DM**)", "**Shared tree** — единое дерево для всей группы с центром в «точке рандеву» (протокол **PIM-SM**)", "**Применение**: стриминг видео, видеоконференции, онлайн-трансляции, раздача обновлений", "**Anycast** — доставить пакет **одному любому (обычно ближайшему)** узлу из целевой группы", "**Принцип**: несколько физических серверов настраиваются на использование **одного и того же IP-адреса**", "**Выбор пути**: маршрутизаторы видят этот IP как один объект и через **BGP** находят кратчайший путь к ближайшему серверу", "**Отказоустойчивость**: если ближайший anycast-сервер падает, BGP-таблицы обновляются → трафик идёт к следующему", "**Применение**: корневые **DNS-серверы**, геораспределённые **CDN**, защита от DDoS-атак"]}, {"n": 35, "title": "Алгоритмы маршрутизации для мобильных хостов, маршрутизация в произвольных сетях.", "paragraphs": ["Этот вопрос рассматривает работу сетевого уровня в условиях, когда узлы сети постоянно перемещаются, меняя её топологию. Ниже разобраны особенности и протоколы для двух сценариев.", "<h3>Маршрутизация для мобильных хостов (Mobile Hosts Routing)</h3>", "Этот подход используется в традиционных сетях (например, в Интернете), где инфраструктура (базовые станции, маршрутизаторы) статична, но конечные пользователи (мобильные хосты) перемещаются между сетями.", "- **Проблема:** IP-адрес жёстко привязан к конкретной подсети. Если мобильный узел переходит в чужую сеть, он теряет связь, так как пакеты продолжают идти на его старый адрес.\n- **Базовая архитектура (Mobile IP):**\n  - **Домашний агент** (Home Agent, HA) — маршрутизатор в «родной» сети мобильного хоста.\n  - **Внешний агент** (Foreign Agent, FA) — маршрутизатор в гостевой сети, куда переместился хост.\n  - **Адрес заботы** (Care-of Address, CoA) — временный IP-адрес, получаемый хостом в гостевой сети.\n- **Алгоритм передачи данных:**\n  1. Мобильный хост регистрируется у внешнего агента и сообщает свой новый адрес (CoA) домашнему агенту.\n  2. Когда отправитель посылает пакет на постоянный IP-адрес хоста, пакет приходит к домашнему агенту.\n  3. Домашний агент перехватывает этот пакет и инкапсулирует его в новый пакет, направленный на CoA (метод **туннелирования** / инкапсуляции IP-в-IP).\n  4. Внешний агент извлекает исходный пакет из туннеля и передаёт его мобильному хосту.", "<h3>Маршрутизация в произвольных сетях (Ad hoc / MANET)</h3>", "**Ad hoc**-сети (**MANET** — Mobile Ad hoc Networks) — это беспроводные сети, в которых полностью отсутствует инфраструктура (нет базовых станций и фиксированных маршрутизаторов). Каждый мобильный узел одновременно является и хостом, и маршрутизатором, пересылая чужие пакеты. Из-за постоянного движения узлов топология сети непрерывно меняется. Алгоритмы маршрутизации делятся на три класса:", "<h4>А. Проактивные протоколы (Proactive / Table-driven)</h4>", "Узлы постоянно поддерживают актуальные таблицы маршрутизации ко всем остальным узлам, регулярно обмениваясь служебными пакетами (аналогично Link-State или Distance-Vector).", "- **Минус:** тратится огромный объём батареи и радиоэфира на обновление таблиц, даже если данные не передаются.\n- **Пример:** **DSDV** (Destination-Sequenced Distance-Vector), **OLSR** (Optimized Link State Routing).", "<h4>Б. Реактивные протоколы (Reactive / On-Demand)</h4>", "Маршрут ищется только тогда, когда нужно отправить данные.", "- **Принцип работы:** источник рассылает широковещательный запрос **Route Request (RREQ)**. Когда запрос доходит до получателя, тот отвечает пакетом **Route Reply (RREP)**, фиксируя цепочку промежуточных узлов.\n- **Плюс:** экономия ресурсов в режиме простоя.\n- **Минус:** задержка перед отправкой первого пакета (пока ищется маршрут).\n- **Пример:** **AODV** (Ad hoc On-Demand Distance Vector), **DSR** (Dynamic Source Routing).", "<h4>В. Гибридные протоколы (Hybrid)</h4>", "Сочетают оба подхода. Сеть делится на локальные зоны. Внутри зоны маршруты обновляются постоянно (проактивно), а для связи с узлами вне зоны поиск запускается по требованию (реактивно).", "- **Пример:** **ZRP** (Zone Routing Protocol)."], "terms": [{"ru": "Домашний агент", "en": "Home Agent, HA", "df": "маршрутизатор в «родной» сети мобильного хоста"}, {"ru": "Внешний агент", "en": "Foreign Agent, FA", "df": "маршрутизатор в гостевой сети, где сейчас находится хост"}, {"ru": "Адрес заботы", "en": "Care-of Address, CoA", "df": "временный IP, получаемый хостом в гостевой сети"}, {"ru": "Туннелирование", "en": "encapsulation", "df": "упаковка пакета в новый пакет: HA шлёт исходный пакет «обёрнутым» на CoA"}, {"ru": "MANET", "en": "Mobile Ad hoc Network", "df": "беспроводная сеть без инфраструктуры; каждый узел является и хостом, и маршрутизатором"}, {"ru": "Проактивные протоколы", "en": "table-driven", "df": "таблицы маршрутизации поддерживаются постоянно; пример — DSDV, OLSR"}, {"ru": "Реактивные протоколы", "en": "on-demand", "df": "маршрут ищется только при необходимости передачи; пример — AODV, DSR"}, {"ru": "RREQ / RREP", "en": "Route Request / Route Reply", "df": "служебные пакеты реактивных протоколов: запрос маршрута и ответ"}], "summary": ["Вопрос — про маршрутизацию в условиях, когда узлы перемещаются и топология меняется. Два сценария.", "**Маршрутизация для мобильных хостов** — инфраструктура (роутеры) статична, но пользователи переходят между сетями", "**Проблема**: IP-адрес жёстко привязан к подсети; при переходе в чужую сеть хост теряет связь, пакеты продолжают идти на старый адрес", "**Mobile IP — архитектура из трёх элементов**:", "**Домашний агент (Home Agent, HA)** — маршрутизатор в «родной» сети хоста", "**Внешний агент (Foreign Agent, FA)** — маршрутизатор в гостевой сети, куда переместился хост", "**Адрес заботы (Care-of Address, CoA)** — временный IP в гостевой сети", "**Алгоритм**: 1) хост сообщает CoA домашнему агенту; 2) пакеты от отправителей приходят на старый IP к HA; 3) HA инкапсулирует пакет (туннелирование IP-в-IP) и шлёт на CoA; 4) FA извлекает пакет и передаёт хосту", "**Маршрутизация в произвольных сетях (Ad hoc / MANET)** — беспроводные сети **без инфраструктуры**", "Каждый узел одновременно и хост, и маршрутизатор; пересылает чужие пакеты; топология непрерывно меняется", "Три класса алгоритмов:", "**А. Проактивные (table-driven)** — таблицы обновляются постоянно через служебный обмен (как LS / DV)", "Минус: большой расход батареи и эфира на обновления даже без передачи данных", "Пример: **DSDV**, **OLSR**", "**Б. Реактивные (on-demand)** — маршрут ищется только когда нужно передавать", "Принцип: источник рассылает **RREQ (Route Request)** → получатель отвечает **RREP (Route Reply)** по обратному пути", "Плюс: экономия в простое; минус: задержка перед первым пакетом", "Пример: **AODV**, **DSR**", "**В. Гибридные** — сеть делится на зоны; внутри зоны — проактивно, между зонами — реактивно", "Пример: **ZRP** (Zone Routing Protocol)"]}, {"n": 36, "title": "Подходы к борьбе с перегрузкой: управление доступом, регулирование трафика, сброс нагрузки. Маршрутизация с учетом состояния трафика.", "paragraphs": ["Управление перегрузкой (Congestion Control) на сетевом уровне необходимо, когда количество пакетов, отправляемых в сеть, превышает пропускную способность каналов связи или ёмкость буферов маршрутизаторов.", "<h3>Подходы к борьбе с перегрузкой</h3>", "Существует несколько классических «эшелонов» защиты от перегрузки, применяемых на разных временных интервалах — от превентивных мер до экстренного сброса.", "<h4>А. Управление доступом (Admission Control)</h4>", "Превентивный метод, используемый в сетях с установлением соединения (виртуальных каналах).", "- **Принцип работы:** когда узел запрашивает создание нового виртуального соединения, сеть анализирует текущую загрузку маршрутизаторов на предполагаемом пути.\n- **Действие:** если хотя бы один коммутатор на пути перегружен, в установлении соединения отказывается.\n- **Аналогия:** бронирование столов в ресторане — если мест нет, новых гостей на входе просто не пускают.", "<h4>Б. Регулирование трафика (Traffic Throttling)</h4>", "Метод реагирования в реальном времени: когда перегрузка уже начинает возникать, маршрутизаторы уведомляют источники о необходимости снизить скорость.", "- **Предупреждающие пакеты** (Choke Packets, отсекающие пакеты): маршрутизатор отправляет специальный служебный пакет обратно к источнику. Источник, получив его, обязан снизить объём генерируемого трафика на определённый процент.\n- **Явное уведомление** (ECN, Explicit Congestion Notification): маршрутизатор не создаёт новый пакет, а выставляет специальный бит в заголовке проходящего пакета данных. Получатель видит этот бит и при отправке подтверждения (ACK) на транспортном уровне просит источник замедлиться.", "<h4>В. Сброс нагрузки (Load Shedding)</h4>", "Радикальный «пожарный» метод, когда буферы маршрутизатора полностью переполнены и другие методы не помогли.", "- **Принцип работы:** маршрутизатор начинает принудительно удалять (сбрасывать) пакеты, которые он не успевает обработать.\n- **Политика сброса** (Drop Policies):\n  - **Wine (Вино):** удаляются новые пакеты; старые пакеты ценнее, так как на их передачу до текущего узла сеть уже потратила ресурсы — подходит для передачи файлов.\n  - **Milk (Молоко):** удаляются старые пакеты; свежие важнее, так как старая информация теряет актуальность — подходит для мультимедиа и real-time стриминга.\n- **Случайное раннее обнаружение** (RED, Random Early Detection): маршрутизатор сбрасывает пакеты случайным образом ещё до полного заполнения буфера, чтобы заставить TCP-источники плавно снизить скорость до наступления жёсткого кризиса.", "<h3>Маршрутизация с учётом состояния трафика (Traffic-Aware Routing)</h3>", "Классические алгоритмы (Дейкстры, Беллмана-Форда) используют статические метрики: количество хопов или фиксированную пропускную способность линий. Маршрутизация с учётом трафика делает метрику динамической.", "- **Принцип работы:** стоимость линии (метрика) рассчитывается на основе текущей задержки, длины очередей в буферах или загруженности канала. Маршруты постоянно перестраиваются в обход загруженных узлов.\n- **Проблема осцилляции (колебаний):**\n  1. Если путь А перегружен, алгоритм перенаправляет весь трафик на свободный путь Б.\n  2. Через мгновение путь Б намертво перегружается, а путь А становится абсолютно пустым.\n  3. Алгоритм резко переключает весь трафик обратно на А.\n  Результат: сеть начинает циклически «штормить», пакеты приходят с дикой задержкой, эффективность падает.\n- **Решение проблемы:**\n  - Использование **сглаживания метрик** (экспоненциальное скользящее среднее).\n  - Перенаправление только **части трафика** на альтернативные маршруты (многопутевая маршрутизация)."], "terms": [{"ru": "Перегрузка", "en": "congestion", "df": "ситуация, когда количество пакетов в сети превышает пропускную способность каналов или ёмкость буферов маршрутизаторов"}, {"ru": "Управление доступом", "en": "Admission Control", "df": "превентивный отказ в установлении новых виртуальных каналов, если сеть уже загружена"}, {"ru": "Регулирование трафика", "en": "Traffic Throttling", "df": "реактивное замедление источников при начинающейся перегрузке"}, {"ru": "Choke Packet", "en": "отсекающий пакет", "df": "служебный пакет, отправляемый маршрутизатором обратно к источнику с просьбой снизить скорость"}, {"ru": "ECN", "en": "Explicit Congestion Notification", "df": "бит в заголовке IP-пакета: маршрутизатор помечает им проходящие пакеты при начинающейся перегрузке"}, {"ru": "Сброс нагрузки", "en": "Load Shedding", "df": "принудительное отбрасывание пакетов при переполнении буферов"}, {"ru": "RED", "en": "Random Early Detection", "df": "упреждающий случайный сброс пакетов до полного переполнения буфера; помогает TCP плавно снизить скорость"}, {"ru": "Маршрутизация с учётом состояния трафика", "en": "Traffic-Aware Routing", "df": "динамические метрики маршрутизации, учитывающие текущую загрузку каналов"}, {"ru": "Осцилляция", "en": "oscillation", "df": "нестабильное переключение трафика между маршрутами; борется сглаживанием метрик и многопутевой маршрутизацией"}, {"ru": "AQM", "en": "Active Queue Management", "df": "активное управление очередями"}], "summary": ["**Перегрузка (Congestion)** — количество пакетов в сети превышает пропускную способность каналов или ёмкость буферов маршрутизаторов", "Несколько эшелонов защиты — от превентивных мер до экстренного сброса:", "**А. Управление доступом (Admission Control)** — превентивный метод в сетях с виртуальными каналами", "Принцип: при запросе нового соединения сеть смотрит загрузку маршрутизаторов на пути; если есть перегруженный — в установлении отказывается", "Аналогия: бронирование столов в ресторане — нет мест → новых гостей не пускают", "**Б. Регулирование трафика (Traffic Throttling)** — реактивный метод: маршрутизаторы просят источники замедлиться", "**Choke Packets** (отсекающие пакеты): маршрутизатор шлёт служебный пакет обратно к источнику с просьбой снизить трафик на N %", "**ECN (Explicit Congestion Notification)**: маршрутизатор выставляет бит в заголовке проходящего пакета; получатель через ACK просит источник замедлиться", "**В. Сброс нагрузки (Load Shedding)** — «пожарный» метод при полном переполнении буферов", "**Принцип**: маршрутизатор принудительно удаляет пакеты, которые не успевает обработать", "**Политика Wine**: удаляются новые пакеты (старые ценнее, на них уже потратили ресурсы) — для передачи файлов", "**Политика Milk**: удаляются старые пакеты (свежие ценнее, старые теряют актуальность) — для мультимедиа и реального времени", "**RED (Random Early Detection)**: случайный сброс пакетов **до полного заполнения буфера**, чтобы TCP плавно снизил скорость", "**Маршрутизация с учётом состояния трафика (Traffic-Aware Routing)** — динамические метрики вместо статических хопов", "**Принцип**: стоимость линии = задержка + длина очереди + загруженность; маршруты перестраиваются в обход узких мест", "**Проблема осцилляции**: 1) путь А перегружен → весь трафик переводится на Б; 2) Б тоже перегружается; 3) трафик возвращается на А → сеть «штормит»", "**Решение**: сглаживание метрик (экспоненциальное скользящее среднее), многопутевая маршрутизация (часть трафика, а не весь)"]}, {"n": 37, "title": "Требования приложений. Формирование трафика. Диспетчеризация пакетов. Управление доступом. Интегральное обслуживание. Дифференцированное обслуживание.", "paragraphs": ["Этот вопрос посвящён механизмам обеспечения **качества обслуживания** (Quality of Service, QoS) в сетях, необходимым для совместной и эффективной работы приложений с абсолютно разными требованиями к среде передачи.", "<h3>Требования приложений</h3>", "Различные типы сетевых приложений критичны к разным параметрам сети:", "- **Надёжность (потери данных):** файловый обмен (FTP), веб-страницы (HTTP) и электронная почта требуют **нулевых потерь**, но не чувствительны к задержкам. IP-телефония и видеостриминг могут легко пережить потерю 1–2 % пакетов.\n- **Задержка (delay, latency):** критична для интерактивных приложений реального времени (VoIP, видеоконференции, онлайн-игры). Допустимый порог для голоса — не более **150–200 мс**.\n- **Джиттер (jitter, колебание задержки):** разброс времени прибытия пакетов. Если один пакет идёт 20 мс, а следующий 200 мс, звук и видео будут заикаться. Критичен для мультимедиа-стриминга.\n- **Пропускная способность (bandwidth):** видео в 4K требует широкого и стабильного канала, тогда как текстовый мессенджер работает на минимальной скорости.", "<h3>Формирование трафика (Traffic Shaping)</h3>", "Технология сглаживания пульсаций пользовательского трафика на входе в сеть. Она заставляет хост отправлять данные с предсказуемой, равномерной скоростью.", "- **Алгоритм «Дырявое ведро» (Leaky Bucket):** пакеты от приложения попадают в буфер (ведро). Из нижней части буфера данные уходят в сеть с постоянной фиксированной скоростью. Если ведро переполняется, новые пакеты сбрасываются. Метод полностью ликвидирует пульсации.\n- **Алгоритм «Маркерное ведро» (Token Bucket):** в ведро с постоянной скоростью генерируются маркеры (токены). Пакет может уйти в сеть, только если «заберёт» с собой токен. Если накопилось много токенов, хост может отправить данные резким кратковременным всплеском (пульсацией). Это более гибкий алгоритм, сохраняющий динамику приложений.", "<h3>Диспетчеризация пакетов (Packet Scheduling)</h3>", "Когда в очереди маршрутизатора скапливаются пакеты разных приложений, диспетчер решает, какой пакет отправить в канал следующим.", "- **FIFO (First-In, First-Out):** классическая очередь. Кто первый пришёл, тот первый ушёл. Не обеспечивает никакого QoS.\n- **PQ (Priority Queueing):** жёсткая приоритизация. Очереди делятся на уровни (High, Medium, Low). Пакеты из низших очередей не будут отправлены до тех пор, пока полностью не опустеет высшая очередь.\n- **WFQ (Weighted Fair Queueing):** взвешенное справедливое обслуживание. Каждому типу трафика выделяется определённый процент полосы пропускания (например, 40 % — голос, 40 % — видео, 20 % — остальное). Потоки обслуживаются параллельно и не блокируют друг друга.", "<h3>Управление доступом (Admission Control)</h3>", "Процесс проверки сетевых ресурсов перед тем, как принять новый поток данных. Приложение сообщает сети свои требования (полосу, задержку). Маршрутизаторы на пути проверяют свои буферы и каналы. Если ресурсов недостаточно, сеть отклоняет запрос на обслуживание, чтобы не ухудшить качество связи для уже запущенных программ.", "<h3>Архитектуры обслуживания: IntServ и DiffServ</h3>", "Для глобального управления качеством в сетях разработаны две фундаментальные модели.", "<h4>Интегральное обслуживание (Integrated Services, IntServ)</h4>", "Модель с жёстким резервированием ресурсов по логике «для каждого потока отдельно».", "- **Принцип работы:** использует протокол сигнализации **RSVP**. Перед отправкой данных приложение резервирует полосу на каждом маршрутизаторе по всему пути следования. Маршрутизаторы помнят информацию о каждом активном звонке или сессии (stateful-подход).\n- **Плюс:** гарантированное качество обслуживания.\n- **Минус:** плохая масштабируемость. Мировые магистральные маршрутизаторы не могут хранить в памяти миллионы индивидуальных резервирований.", "<h4>Дифференцированное обслуживание (Differentiated Services, DiffServ)</h4>", "Современная масштабируемая модель на основе классификации трафика.", "- **Принцип работы:** на границе сети пакеты маркируются — в заголовок IP записывается код класса обслуживания (**DSCP** / ToS). Внутри сети магистральные маршрутизаторы не отслеживают отдельные потоки. Они смотрят только на код класса и обрабатывают пакет согласно правилам этого класса (**Per-Hop Behavior, PHB**).\n- **Примеры классов:** **Expedited Forwarding (EF)** — для голоса (минимальная задержка); **Assured Forwarding (AF)** — гарантированная доставка.\n- **Плюс:** отличная масштабируемость, не требует резервирования и хранения состояний.\n- **Минус:** предоставляет не абсолютные гарантии, а лишь относительный приоритет."], "terms": [{"ru": "QoS", "en": "Quality of Service", "df": "набор механизмов, обеспечивающих заданные показатели передачи (полоса, задержка, джиттер, потери)"}, {"ru": "Полоса пропускания", "en": "bandwidth", "df": "скорость канала; критична для видео и потокового вещания"}, {"ru": "Задержка", "en": "latency", "df": "время доставки пакета от отправителя до получателя; критична для VoIP, игр (порог ~150–200 мс)"}, {"ru": "Джиттер", "en": "jitter", "df": "колебание задержки между пакетами; критичен для аудио и видео"}, {"ru": "Формирование трафика", "en": "Traffic Shaping", "df": "сглаживание пульсаций трафика на входе в сеть"}, {"ru": "Дырявое ведро", "en": "Leaky Bucket", "df": "алгоритм shaping с фиксированной скоростью на выходе; полностью устраняет пульсации"}, {"ru": "Маркерное ведро", "en": "Token Bucket", "df": "алгоритм shaping с накоплением токенов; допускает короткие всплески"}, {"ru": "Диспетчеризация пакетов", "en": "Packet Scheduling", "df": "выбор маршрутизатором порядка отправки пакетов из очередей"}, {"ru": "FIFO", "en": "First-In, First-Out", "df": "простейшая очередь; без QoS"}, {"ru": "PQ", "en": "Priority Queueing", "df": "жёсткая приоритизация; низкие очереди ждут опустошения высоких"}, {"ru": "WFQ", "en": "Weighted Fair Queueing", "df": "взвешенное справедливое обслуживание; каждому классу заданный процент полосы"}, {"ru": "Управление доступом", "en": "Admission Control", "df": "проверка ресурсов перед допуском нового потока"}, {"ru": "IntServ", "en": "Integrated Services", "df": "модель QoS с резервированием для каждого потока через RSVP; не масштабируется"}, {"ru": "RSVP", "en": "Resource Reservation Protocol", "df": "протокол сигнализации IntServ для резервирования полосы на каждом маршрутизаторе пути"}, {"ru": "DiffServ", "en": "Differentiated Services", "df": "модель QoS на основе классов трафика; масштабируется без хранения состояний"}, {"ru": "DSCP", "en": "Differentiated Services Code Point", "df": "поле в заголовке IP, маркирующее класс обслуживания пакета"}, {"ru": "PHB", "en": "Per-Hop Behavior", "df": "правила обработки пакета на маршрутизаторе в зависимости от его DSCP"}, {"ru": "EF", "en": "Expedited Forwarding", "df": "класс DiffServ для трафика с минимальной задержкой (голос)"}, {"ru": "AF", "en": "Assured Forwarding", "df": "класс DiffServ с гарантированной минимальной полосой"}], "summary": ["**QoS (Quality of Service)** — механизмы, обеспечивающие совместную работу приложений с разными требованиями к сети", "**Требования приложений** по 4 параметрам:", "**Надёжность (потери)**: FTP/HTTP/email — 0 потерь; VoIP/видео — до 1–2 % потерь допустимо", "**Задержка**: критична для VoIP, видеоконференций, игр; для голоса не более **150–200 мс**", "**Джиттер** (колебание задержки): критичен для аудио и видео — иначе заикания", "**Пропускная способность**: 4K-видео — широкий канал; мессенджер — минимальный", "**Формирование трафика (Traffic Shaping)** — сглаживание пульсаций трафика на входе в сеть", "**Дырявое ведро (Leaky Bucket)**: пакеты накапливаются в буфере, уходят со строго постоянной скоростью; полностью убирает пульсации", "**Маркерное ведро (Token Bucket)**: токены копятся с постоянной скоростью, пакет идёт только если есть токен; **допускает короткие всплески**; гибче", "**Диспетчеризация пакетов (Packet Scheduling)** — порядок отправки пакетов из конкурирующих очередей", "**FIFO** — первым пришёл, первым ушёл; без QoS", "**PQ (Priority Queueing)** — жёсткие уровни (High/Medium/Low); низкие очереди ждут опустошения высоких", "**WFQ (Weighted Fair Queueing)** — каждому классу заданный процент полосы (например, 40 % голос / 40 % видео / 20 % остальное); потоки не блокируют друг друга", "**Управление доступом (Admission Control)** — проверка ресурсов перед допуском нового потока; недостаточно ресурсов → отказ", "**Две фундаментальные архитектуры QoS — IntServ и DiffServ**:", "**IntServ (Integrated Services)** — жёсткое резервирование ресурсов **для каждого потока отдельно** через **RSVP**", "Маршрутизаторы хранят состояние каждого потока (stateful); плюс — гарантированное QoS; минус — **не масштабируется** на миллионы потоков", "**DiffServ (Differentiated Services)** — классы трафика вместо потоков; масштабируется", "На границе сети пакеты маркируются полем **DSCP** в IP-заголовке; внутри сети маршрутизаторы обрабатывают по правилам класса (**Per-Hop Behavior, PHB**)", "Классы: **EF (Expedited Forwarding)** — для голоса (минимальная задержка); **AF (Assured Forwarding)** — гарантированная доставка", "Плюс DiffServ: отличная масштабируемость; минус: только относительный приоритет, не абсолютные гарантии"]}, {"n": 38, "title": "Объединение сетей. Различия сетей и способы объединения сетей. Туннелирование. Маршрутизация в объединённых сетях. Фрагментация пакетов.", "paragraphs": ["Этот вопрос рассматривает принципы построения **составных сетей** (internetworks), в которых отдельные независимые сети объединяются в единую глобальную систему. Главный пример — Интернет.", "<h3>Различия сетей и способы их объединения</h3>", "Разнородные сети (Ethernet, Wi-Fi, ATM, сотовые сети) сильно отличаются друг от друга на физическом и канальном уровнях.", "**Основные различия сетей:**", "- **Схемы адресации:** разная длина и форматы адресов (MAC-адреса, IP-адреса, телефонные номера).\n- **Максимальный размер пакета (MTU):** каждая технология имеет свой предел размера кадра.\n- **Качество обслуживания (QoS):** одни сети поддерживают жёсткие гарантии, другие работают по принципу best-effort.\n- **Механизмы управления перегрузкой и ошибками:** разные способы проверки контрольных сумм и восстановления данных.", "**Способы и устройства объединения сетей:**", "1. **Повторители (Repeaters) и концентраторы (Hubs):** объединяют сегменты на **физическом уровне**, просто регенерируя электрический сигнал.\n2. **Коммутаторы (Switches) и мосты (Bridges):** объединяют сети на **канальном уровне**. Пересылают кадры на основе MAC-адресов. Различия сетей на верхних уровнях они сгладить не могут.\n3. **Маршрутизаторы (Routers):** основной инструмент объединения на **сетевом уровне**. Они нейтрализуют различия канальных технологий, используя единый формат сетевого адреса (например, **IP**).\n4. **Шлюзы приложений (Gateways):** объединяют системы на **прикладном уровне**, полностью конвертируя форматы данных разных программных сред.", "<h3>Туннелирование (Tunneling)</h3>", "Метод соединения двух однородных сетей через промежуточную сеть с совершенно другой технологией.", "- **Принцип работы:** маршрутизатор на входе в промежуточную сеть берёт исходный пакет (например, IPv6) и полностью **инкапсулирует** (упаковывает) его в поле данных транспортного пакета транзитной сети (например, IPv4).\n- **Доставка:** транзитная сеть ведёт себя так, будто переносит обычные для неё данные. На выходе из туннеля принимающий маршрутизатор снимает внешние заголовки и восстанавливает оригинальный пакет в неизменном виде.\n- **Аналогия:** перевозка легкового автомобиля внутри грузового вагона поезда. Поезд «не знает», что везёт машину, он просто перемещает контейнер.", "<h3>Маршрутизация в объединённых сетях</h3>", "В крупных составных сетях маршрутизация строится по **двухуровневому иерархическому** принципу для снижения нагрузки на магистральное оборудование. Сеть делится на **автономные системы (AS)** — регионы под единым административным управлением.", "- **Внутренняя маршрутизация (Interior Gateway Protocols, IGP):** работает внутри одной AS. Маршрутизаторы знают детальную топологию своей зоны. Протоколы: **OSPF, RIP, IS-IS**.\n- **Внешняя маршрутизация (Exterior Gateway Protocols, EGP):** работает между разными AS. Связывает пограничные шлюзы. Маршруты строятся на основе **политик** (договоров между провайдерами, безопасности, стоимости), а не просто кратчайшего пути. Главный протокол Интернета — **BGP** (Border Gateway Protocol).", "<h3>Фрагментация пакетов (Packet Fragmentation)</h3>", "Каждая сеть характеризуется параметром **MTU** (Maximum Transmission Unit) — максимальным размером полезного блока данных, который можно передать в одном кадре канального уровня. Например, у Ethernet MTU равен **1500 байт**.", "- **Проблема:** маршрутизатор получает пакет размером 1500 байт, но следующий канал на пути (например, PPPoE или старая WAN-линия) имеет MTU всего 1400 байт. Пакет физически не помещается в канал.\n- **Решение (фрагментация):** маршрутизатор делит исходный большой пакет на несколько мелких частей — **фрагментов**. Каждый фрагмент снабжается собственным IP-заголовком.\n- **Служебные поля IP для фрагментации:**\n  - **Identification (идентификатор):** одинаковый у всех фрагментов одного пакета — чтобы получатель понял, что их надо собрать вместе.\n  - **Flags (флаги):** бит **DF (Don't Fragment)** — если 1, фрагментация запрещена (маршрутизатор сбросит пакет и вернёт ошибку ICMP); бит **MF (More Fragments)** — равен 1 у всех фрагментов, кроме самого последнего.\n  - **Fragment Offset (смещение фрагмента):** показывает позицию данных этого фрагмента относительно начала оригинального пакета (измеряется в **8-байтовых блоках**).\n- **Сборка:** по соображениям экономии ресурсов маршрутизаторов сборка фрагментов обратно в единый пакет происходит **только на конечном хосте-получателе**. Если в пути теряется хотя бы один фрагмент, весь исходный пакет считается утерянным и переотправляется заново транспортным уровнем."], "terms": [{"ru": "Объединение сетей", "en": "internetworking", "df": "построение единой логической сети из множества физически разнородных сетей"}, {"ru": "Повторитель / концентратор", "en": "Repeater / Hub", "df": "устройство физического уровня, регенерирует электрический сигнал"}, {"ru": "Мост / коммутатор", "en": "Bridge / Switch", "df": "устройство канального уровня, пересылает кадры по MAC-адресам"}, {"ru": "Маршрутизатор", "en": "Router", "df": "устройство сетевого уровня, объединяет разнородные сети через единый IP-протокол"}, {"ru": "Шлюз приложений", "en": "Gateway", "df": "устройство прикладного уровня, преобразует форматы данных между разными системами"}, {"ru": "MTU", "en": "Maximum Transmission Unit", "df": "максимальный размер пакета, допустимый в данной сети; в Ethernet — 1500 байт"}, {"ru": "Туннелирование", "en": "tunneling", "df": "инкапсуляция пакета одного протокола в пакет другого для прохождения через несовместимую транзитную сеть"}, {"ru": "Инкапсуляция", "en": "encapsulation", "df": "упаковка пакета в поле данных другого пакета"}, {"ru": "Автономная система", "en": "AS, Autonomous System", "df": "регион сети под единым административным управлением"}, {"ru": "IGP", "en": "Interior Gateway Protocol", "df": "протокол маршрутизации внутри одной AS (OSPF, RIP, IS-IS)"}, {"ru": "EGP", "en": "Exterior Gateway Protocol", "df": "протокол маршрутизации между разными AS; главный — BGP"}, {"ru": "BGP", "en": "Border Gateway Protocol", "df": "основной EGP-протокол Интернета; маршрутизация по политикам"}, {"ru": "Фрагментация", "en": "fragmentation", "df": "разбиение пакета на части при превышении MTU следующего канала"}, {"ru": "DF", "en": "Don't Fragment", "df": "флаг IP-заголовка, запрещающий фрагментацию; маршрутизатор отбросит пакет и вернёт ICMP-ошибку"}, {"ru": "MF", "en": "More Fragments", "df": "флаг IP-заголовка «есть ещё фрагменты»; равен 1 у всех фрагментов кроме последнего"}], "summary": ["**Объединение сетей (internetworking)** — построение единой системы из независимых разнородных сетей; главный пример — Интернет", "**Различия сетей**: схемы адресации; **максимальный размер пакета (MTU)**; качество обслуживания (QoS); механизмы управления перегрузкой и ошибками", "**Способы и устройства объединения** по уровням:", "1) **Повторители / концентраторы (Hubs)** — физический уровень, регенерируют сигнал", "2) **Коммутаторы / мосты (Switches/Bridges)** — канальный уровень, пересылают по MAC-адресам; верхние различия не сглаживают", "3) **Маршрутизаторы (Routers)** — сетевой уровень, **основной инструмент объединения**; нейтрализуют различия канальных технологий через единый IP", "4) **Шлюзы приложений (Gateways)** — прикладной уровень, конвертируют форматы данных разных программных сред", "**Туннелирование (Tunneling)** — соединение двух однородных сетей через промежуточную сеть с другой технологией", "**Принцип**: маршрутизатор на входе **инкапсулирует** исходный пакет в поле данных пакета транзитной сети; на выходе — извлекает обратно", "Аналогия: легковой автомобиль внутри грузового вагона поезда", "**Маршрутизация в объединённых сетях** строится **двухуровнево**; сеть делится на **автономные системы (AS)**", "**IGP (Interior Gateway Protocols)** — внутри AS; маршрутизаторы знают детальную топологию; протоколы **OSPF, RIP, IS-IS**", "**EGP (Exterior Gateway Protocols)** — между AS; маршруты выбираются по **политикам** (договоры провайдеров, безопасность, стоимость), не по кратчайшему пути; главный — **BGP**", "**Фрагментация пакетов (Packet Fragmentation)** — если исходный пакет > MTU следующего канала", "MTU = максимальный размер кадра канального уровня (у Ethernet — **1500 байт**)", "**Решение**: маршрутизатор делит пакет на **фрагменты**, каждый получает свой IP-заголовок", "**Служебные поля IP**:", "**Identification** — одинаковый ID у всех фрагментов одного пакета (для сборки на получателе)", "**DF (Don't Fragment)** — если 1, фрагментация запрещена, маршрутизатор отбросит пакет и вернёт ICMP-ошибку", "**MF (More Fragments)** — равен 1 у всех фрагментов, кроме самого последнего", "**Fragment Offset** — смещение данных от начала исходного пакета, **в единицах по 8 байт**", "**Сборка происходит только на конечном хосте-получателе** (для экономии ресурсов маршрутизаторов)", "Потеря хотя бы одного фрагмента → весь пакет считается утерянным и переотправляется транспортным уровнем"]}, {"n": 39, "title": "Протокол IPv4. Формат IP-пакета. Схема IP-маршрутизации. Маски. Фрагментация IP-пакетов.", "paragraphs": ["Этот вопрос посвящён основе современного Интернета — протоколу IPv4, принципам адресации, структуре данных и механизмам их продвижения.", "<h3>Протокол IPv4 и формат IP-пакета</h3>", "Протокол IPv4 осуществляет доставку дейтаграмм **без установления соединения** (best-effort). Размер заголовка IPv4 составляет от **20 до 60 байт** (в зависимости от наличия дополнительных опций).", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/5/54/Ipv4_header.svg\" alt=\"Структура заголовка IPv4\" loading=\"lazy\"><figcaption>Структура заголовка IPv4: Version, IHL, ToS, Total Length, Identification, Flags, Fragment Offset, TTL, Protocol, Header Checksum, адреса источника и назначения. <em>Источник: Wikimedia Commons, Mro, CC BY-SA 3.0.</em></figcaption></figure>", "**Структура заголовка IPv4:**", "- **Version (4 бита):** версия протокола. Равна 4.\n- **IHL (Internet Header Length, 4 бита):** длина заголовка в 32-битных словах. Минимальное значение — 5 (5 × 4 = **20 байт**).\n- **Type of Service (ToS / DSCP+ECN, 8 бит):** качество обслуживания. Используется для приоритизации трафика (QoS). См. подробнее ниже.\n- **Total Length (16 бит):** общая длина пакета (заголовок + данные) в байтах. Максимальный размер пакета — **65 535 байт**.\n- **Identification, Flags, Fragment Offset (всего 32 бита):** поля, используемые исключительно для фрагментации пакетов (см. ниже).\n- **TTL (Time to Live, 8 бит):** время жизни пакета. Каждый маршрутизатор на пути уменьшает это значение на 1. При TTL = 0 пакет уничтожается, а источнику отправляется сообщение **ICMP Time Exceeded**. Защищает сеть от бесконечного зацикливания пакетов.\n- **Protocol (8 бит):** указывает, какому протоколу верхнего (транспортного) уровня передать данные (например, **6 для TCP, 17 для UDP, 1 для ICMP**).\n- **Header Checksum (16 бит):** контрольная сумма заголовка. Пересчитывается на каждом маршрутизаторе, так как меняется TTL.\n- **Source IP Address (32 бита):** IP-адрес отправителя.\n- **Destination IP Address (32 бита):** IP-адрес получателя.\n- **Options (опции, переменная длина):** необязательное поле. Используется для отладки, записи маршрута или безопасности. Встречается редко.", "<h4>Подробнее: байт ToS / DSCP + ECN</h4>", "Восьмибитное поле сразу после IHL исторически называлось **ToS (Type of Service)** и задумывалось ещё в **RFC 791** (1981) как набор флагов для выбора маршрута: «минимальная задержка», «максимальная пропускная способность», «максимальная надёжность», «минимальная стоимость». На практике эти флаги почти никто не использовал, и в **1998 году RFC 2474** переопределил тот же байт под современные нужды. Сегодня он делится на две независимые части:", "| Биты | Поле | Назначение |\n|---|---|---|\n| 0–5 (старшие 6) | **DSCP** (Differentiated Services Code Point) | приоритет пакета — какой класс трафика, нужна ли низкая задержка |\n| 6–7 (младшие 2) | **ECN** (Explicit Congestion Notification) | предупреждение от маршрутизатора «я перегружен, замедлите передачу» |", "<h4>Что такое DSCP</h4>", "**DSCP** — это «ярлык приоритета» на пакете. Сетевой канал — общий ресурс, и пакеты разных приложений в нём смешиваются: тяжёлые потоки от торрентов, обычный веб-трафик, голосовые звонки, видеоконференции. Все они имеют разные требования к задержке и потерям (см. Q37): голосу важна низкая задержка, файловой загрузке — нет.", "Решение: на границе сети (на edge-маршрутизаторе или прямо в операционной системе хоста) пакет **маркируется** значением DSCP — 6 бит кода, означающего «к какому классу обслуживания этот пакет относится». Дальше внутри сети маршрутизаторы смотрят на этот код и **кладут пакет в разные очереди** с разным приоритетом: голосовые пакеты попадают в очередь с минимальной задержкой, файловые — в обычную, фоновая синхронизация — в самую медленную.", "Это и есть архитектура **DiffServ** (см. Q37). Главное: сама сеть **не помнит** про потоки и не делает резерв, она просто читает 6 бит из каждого пакета и обслуживает его соответственно.", "Самые важные значения DSCP:", "- **DSCP = 0 (Default / Best Effort, DF)** — обычный трафик, без приоритета. Так помечены HTTP, файловая загрузка и большинство веб-сервисов.\n- **EF (Expedited Forwarding, DSCP 101110₂ = 46₁₀)** — трафик с минимальной задержкой. Используется для голосовых вызовов (VoIP) и других real-time потоков.\n- **AF (Assured Forwarding, классы AF11 – AF43)** — трафик с гарантированной минимальной полосой и градациями вероятности отбрасывания. Используется для видео и важных бизнес-приложений.\n- **CS (Class Selector, CS0 – CS7)** — обратная совместимость со старой схемой IP Precedence.", "<h4>Что такое ECN</h4>", "**ECN** — это механизм, через который **сам маршрутизатор** может сказать отправителю «я начинаю задыхаться, пожалуйста, замедлись», не теряя при этом ни одного пакета.", "Зачем это нужно. Без ECN перегруженный маршрутизатор может только одно — **отбрасывать** пакеты, когда его буфер переполнен. Отправитель замечает потерю только косвенно: TCP видит, что какой-то ACK не пришёл, делает таймаут, переотправляет пакет и снижает скорость. Это работает, но дорого: пакет был доставлен почти полностью через всю сеть, а потом потерян в самом конце — впустую потрачена пропускная способность; плюс задержка из-за таймаута и повторной передачи.", "ECN заменяет эту схему. Когда маршрутизатор видит, что его очередь начинает заполняться, он **не отбрасывает** пакет, а **помечает** его (меняет два бита ECN на специальное значение «перегрузка»). Пакет идёт дальше получателю. Получатель видит метку и в следующем ACK сообщает отправителю — «маршрутизатор по пути жаловался на перегрузку». Отправитель плавно снижает скорость, как если бы случилась потеря — но потери в самом деле не было.", "Кодировки двух битов ECN:", "- **00 — Non-ECT** (Not ECN-Capable Transport): отправитель ECN **не поддерживает**. У маршрутизатора нет выбора — он может только дропать пакет при перегрузке.\n- **01 или 10 — ECT(0) / ECT(1)** (ECN-Capable Transport): отправитель и получатель поддерживают ECN. Маршрутизатор имеет право поменять эти биты на **11** вместо того чтобы отбросить пакет.\n- **11 — CE (Congestion Experienced)**: маршрутизатор пометил пакет — «я был перегружен». Получатель отразит это в ответном ACK (флаг ECE на транспортном уровне), и отправитель снизит скорость.", "Преимущество ECN: TCP-источник снижает скорость **без потери и переотправки пакета**. Это особенно ценно для каналов с большой задержкой (спутник, межконтинентальная связь) и для современных протоколов реального времени (DCTCP в дата-центрах, L4S — см. Q44).", "DSCP и ECN живут в одном байте, но **независимы**: один отвечает за **приоритет** пакета, другой — за **сигнал о перегрузке**. Один и тот же пакет может одновременно иметь DSCP = EF (голос) и ECN = ECT(0) (поддерживает уведомление о перегрузке).", "<h3>Схема IP-маршрутизации</h3>", "Маршрутизация выполняется на основе **таблицы маршрутизации**. При получении пакета маршрутизатор выполняет следующие шаги:", "1. **Проверка контрольной суммы:** если заголовок повреждён, пакет молча сбрасывается.\n2. **Уменьшение TTL:** значение TTL уменьшается на единицу. Если TTL = 0, пакет уничтожается, отправляется ICMP-ошибка.\n3. **Поиск совпадений:** маршрутизатор берёт IP-адрес назначения из пакета и последовательно применяет к нему маски из своей таблицы маршрутизации с помощью побитовой операции «И» (**AND**).\n4. **Правило Longest Match (наибольшее совпадение):** если адрес назначения подходит под несколько строк таблицы, выбирается строка с **самой длинной маской** (наиболее специфичный маршрут).\n5. **Продвижение (Forwarding):** пакет инкапсулируется в новый кадр канального уровня и отправляется на IP-адрес следующего хопа (**Next Hop**) через соответствующий физический интерфейс. Если совпадений нет, пакет идёт по маршруту по умолчанию (**Default Gateway — 0.0.0.0/0**).", "<h3>Маски подсети (Subnet Masks)</h3>", "IP-адрес состоит из двух частей: **адреса сети (Network ID)** и **адреса хоста (Host ID)**. **Маска подсети** определяет, где проходит эта граница.", "- **Принцип работы:** маска представляет собой 32-битное число, где **единицы стоят на позициях сетевой части**, а **нули — на позициях хостовой части**.\n- **CIDR-нотация (бесклассовая маршрутизация):** маску часто записывают как количество единичных бит после косой черты (префикс). Например:\n  - Префикс **/24** означает маску `255.255.255.0` (24 единицы, 8 нулей).\n  - Префикс **/26** означает маску `255.255.255.192` (26 единиц, 6 нулей).\n- **Расчёт:** чтобы узнать адрес сети, узел выполняет побитовое умножение: **IP-адрес AND Маска**.\n- **Пример:** для адреса `192.168.1.50` с маской /24 адрес сети будет `192.168.1.0`.", "<h3>Фрагментация IP-пакетов</h3>", "Если размер IP-пакета превышает максимальный размер кадра (**MTU**) исходящего физического канала, маршрутизатор делит его на части (**фрагменты**).", "**Как работают поля фрагментации:**", "1. **Identification (идентификатор):** все фрагменты, созданные из одного исходного пакета, получают **одинаковый уникальный ID**. По нему хост-получатель понимает, какие фрагменты нужно собирать вместе.\n2. **Flags (флаги, 3 бита):**\n   - Первый бит зарезервирован (всегда 0).\n   - Бит **DF (Don't Fragment):** если DF = 1, фрагментация запрещена. Маршрутизатор сбросит пакет и вернёт отправителю ошибку **ICMP Destination Unreachable (Fragmentation Needed)**.\n   - Бит **MF (More Fragments):** если MF = 1, за текущим фрагментом следуют другие. У самого последнего фрагмента пакета MF = 0.\n3. **Fragment Offset (смещение фрагмента, 13 бит):** показывает положение данных этого фрагмента относительно начала исходного пакета. Измеряется в **8-байтовых блоках** (поэтому размер данных в каждом фрагменте, кроме последнего, обязан быть кратен 8 байтам).", "**Пример фрагментации.** Исходный пакет размером **4000 байт** (20 байт заголовок + 3980 байт данные) должен пройти через сеть с MTU = 1500 байт:", "- **Фрагмент 1:** общий размер 1500 байт. Заголовок = 20 байт. Данные = 1480 байт (кратно 8). **MF = 1, Offset = 0** (1480 / 8 = 185).\n- **Фрагмент 2:** общий размер 1500 байт. Заголовок = 20 байт. Данные = 1480 байт (кратно 8). **MF = 1, Offset = 185** (следующие данные начнутся с 1480-го байта).\n- **Фрагмент 3:** общий размер 1040 байт. Заголовок = 20 байт. Данные = 1020 байт (остаток: 3980 − 1480 − 1480). **MF = 0** (это конец пакета), **Offset = 370** (185 + 185).", "Сборку фрагментов выполняет **исключительно конечный узел-получатель** (по полю Identification). Если в пути теряется хотя бы один фрагмент, весь исходный пакет считается утерянным."], "terms": [{"ru": "IPv4", "en": "Internet Protocol version 4", "df": "основной протокол сетевого уровня с 32-битными адресами; дейтаграммная доставка без установления соединения (best-effort)"}, {"ru": "IHL", "en": "Internet Header Length", "df": "длина заголовка в 32-битных словах; минимум 5 (= 20 байт)"}, {"ru": "DSCP", "en": "Differentiated Services Code Point", "df": "6 бит маркировки класса трафика для QoS (DiffServ)"}, {"ru": "ECN", "en": "Explicit Congestion Notification", "df": "2 бита; маршрутизатор может пометить пакет «перегрузка» вместо его отбрасывания"}, {"ru": "TTL", "en": "Time to Live", "df": "счётчик переходов в IP-заголовке; декрементируется на каждом маршрутизаторе; при 0 — пакет уничтожается, ICMP Time Exceeded"}, {"ru": "Default Gateway", "en": "`0.0.0.0/0`", "df": "маршрут по умолчанию, если в таблице нет точного совпадения"}, {"ru": "Маска подсети", "en": "subnet mask", "df": "32-битное число, отделяющее адрес сети от адреса хоста"}, {"ru": "CIDR", "en": "Classless Inter-Domain Routing", "df": "бесклассовая нотация `адрес/префикс` (например, `/24`)"}, {"ru": "DF", "en": "Don't Fragment", "df": "флаг запрета фрагментации; маршрутизатор отбросит пакет и вернёт ICMP-ошибку"}, {"ru": "MF", "en": "More Fragments", "df": "флаг: за этим фрагментом ещё есть другие; у последнего MF = 0"}, {"ru": "MTU", "en": "Maximum Transmission Unit", "df": "максимальный размер пакета в данной сети (Ethernet = 1500 байт)"}], "summary": ["**IPv4** — основа Интернета; **дейтаграммная доставка без установления соединения** (best-effort); 32-битные адреса", "**Заголовок IPv4 — от 20 до 60 байт** (в зависимости от опций)", "**Поля заголовка**: **Version** (4 бит, =4); **IHL** (4 бит, длина в 32-битных словах, min=5 → 20 байт)", "**ToS / DSCP+ECN** (8 бит) — QoS; **Total Length** (16 бит, max 65 535 байт)", "**Identification / Flags / Fragment Offset** (всего 32 бит) — поля для фрагментации", "**TTL** (8 бит) — каждый маршрутизатор уменьшает на 1; при 0 пакет уничтожается, шлётся **ICMP Time Exceeded**", "**Protocol** (8 бит) — следующий уровень: **6 = TCP, 17 = UDP, 1 = ICMP**", "**Header Checksum** (16 бит) — контрольная сумма заголовка; пересчитывается на каждом маршрутизаторе (меняется TTL)", "**Source/Destination IP Address** — по 32 бит; **Options** — необязательное поле, встречается редко", "**ToS-байт** делится на: **DSCP (6 бит)** — приоритет/класс трафика (DiffServ); **ECN (2 бита)** — сигнал перегрузки от маршрутизатора без потери пакета", "**Схема IP-маршрутизации** — 5 шагов:", "1) Проверка контрольной суммы (если повреждён — сбросить); 2) Уменьшение TTL (если 0 — ICMP-ошибка)", "3) Поиск совпадений — **AND** IP-адреса назначения с масками строк таблицы маршрутизации", "4) **Longest Match** — если подходит несколько строк, берётся с самой длинной маской", "5) Forwarding — пакет в новый кадр L2 → следующий узел (**Next Hop**); нет совпадений → **Default Gateway 0.0.0.0/0**", "**Маска подсети** — 32-битное число: единицы на позициях сетевой части, нули на позициях хостовой", "**CIDR-нотация**: префикс /N после косой черты. **/24** = `255.255.255.0` (24 единицы, 8 нулей); **/26** = `255.255.255.192`", "**Расчёт сети**: побитовое `IP AND Маска`. Пример: `192.168.1.50` с маской /24 → сеть `192.168.1.0`", "**Фрагментация IP-пакетов** — когда пакет > MTU следующего канала", "**Identification** — одинаковый ID у всех фрагментов одного исходного пакета", "**Flags**: первый бит резерв; **DF (Don't Fragment)** — если 1, фрагментация запрещена, ICMP «Fragmentation Needed»; **MF (More Fragments)** — 1 у всех кроме последнего", "**Fragment Offset** — смещение от начала исходного пакета **в единицах по 8 байт** (поэтому данные кратны 8)", "**Пример**: пакет 4000 байт через MTU 1500 → 3 фрагмента: 1480 байт + 1480 байт + 1020 байт; Offset: 0, 185, 370; MF: 1, 1, 0", "**Сборка только на конечном узле-получателе** по полю Identification"]}, {"n": 40, "title": "Протокол IPv6. Управляющие протоколы Интернета. Коммутация меток и MPLS.", "paragraphs": ["Этот вопрос охватывает три независимые, но взаимосвязанные темы сетевого уровня: современный протокол адресации, вспомогательные протоколы управления инфраструктурой и технологию скоростной коммутации магистрального трафика.", "<h3>Протокол IPv6 (Internet Protocol version 6)</h3>", "Протокол IPv6 разработан для полной замены IPv4, главным образом из-за исчерпания пула 32-битных адресов.", "- **Адресация:** размер адреса увеличен до **128 бит** (формат записи — 8 групп по 4 шестнадцатеричных цифры, например `2001:0db8:85a3:0000:0000:8a2e:0370:7334`). Это обеспечивает практически бесконечный запас адресов.\n- **Упрощённый заголовок:** базовый заголовок IPv6 имеет **фиксированную длину 40 байт**, несмотря на огромные адреса. Из него убрали редко используемые поля (например, контрольную сумму, так как ошибки проверяются на L2 и L4). Это снижает нагрузку на процессоры маршрутизаторов.\n- **Поля заголовка IPv6:**\n  - **Version (4 бит):** номер версии (равен 6).\n  - **Traffic Class (8 бит):** аналог поля ToS/DSCP в IPv4 для обеспечения качества обслуживания (QoS).\n  - **Flow Label (20 бит):** метка потока для приоритизации пакетов в реальном времени.\n  - **Payload Length (16 бит):** длина полезной нагрузки (данных), идущей за базовым заголовком.\n  - **Next Header (8 бит):** указывает тип следующего заголовка (например, TCP, UDP или дополнительный расширенный заголовок IPv6).\n  - **Hop Limit (8 бит):** аналог TTL в IPv4 — счётчик узлов для предотвращения зацикливания.\n- **Расширенные заголовки (Extension Headers):** все опции (фрагментация, безопасность IPSec, маршрутизация от источника) вынесены в отдельные заголовки, которые вставляются между базовым заголовком IPv6 и данными верхнего уровня.\n- **Упразднение фрагментации в пути:** в IPv6 маршрутизаторы больше **не фрагментируют пакеты**. Если пакет больше MTU канала, узел сбрасывает его и отправляет источнику сообщение **ICMPv6 Packet Too Big**. Хост сам обязан уменьшить размер отправляемых пакетов.", "<h3>Управляющие протоколы Интернета (Internet Control Protocols)</h3>", "Маршрутизаторы и хосты используют специальные вспомогательные протоколы для диагностики, конфигурации и управления сетевым взаимодействием.", "- **ICMP / ICMPv6 (Internet Control Message Protocol):** служит для передачи сообщений об ошибках и сетевой диагностики. На его основе работают утилиты `ping` (эхо-запрос/ответ) и `traceroute`. В IPv6 протокол ICMPv6 также взял на себя функции разрешения MAC-адресов.\n- **ARP (Address Resolution Protocol):** используется в сетях IPv4 для связывания логического IP-адреса с физическим MAC-адресом сетевой карты. Работает на основе широковещательных (Broadcast) запросов типа: «У кого IP 192.168.1.1? Сообщите свой MAC».\n- **NDP (Neighbor Discovery Protocol):** встроен в ICMPv6 и полностью заменяет собой ARP в сетях IPv6. Вместо перегружающего сеть бродкаста NDP использует эффективную многоадресную рассылку (Multicast) для поиска соседей, автоматической настройки IP-адресов (**SLAAC**) и обнаружения доступных маршрутизаторов.\n- **DHCP / DHCPv6 (Dynamic Host Configuration Protocol):** служит для автоматического назначения IP-адресов, масок подсети, шлюзов по умолчанию и DNS-серверов подключающимся клиентам.", "<h3>Коммутация меток и MPLS (Multi-Protocol Label Switching)</h3>", "**MPLS** — это технология ускоренной передачи данных, работающая на стыке канального и сетевого уровней (её часто называют протоколом **уровня L2.5**).", "- **Основная идея:** классический маршрутизатор при получении IP-пакета тратит время на долгий поиск совпадений в таблице маршрутизации по IP-адресу назначения. MPLS решает эту проблему: на входе в MPLS-сеть пакет снабжается короткой фиксированной **меткой**. Все промежуточные коммутаторы (**LSR — Label Switching Routers**) принимают решения о пересылке исключительно на основе значения этой метки, вообще не заглядывая в IP-заголовок.\n- **Формат заголовка MPLS (4 байта / 32 бита):**\n  1. **Label (20 бит):** значение самой метки (индекс для коммутации).\n  2. **TC / EXP (3 бита):** класс трафика для поддержки QoS (экспериментальные биты).\n  3. **S (1 бит):** Bottom of Stack (низ стека). В MPLS пакету можно присвоить несколько меток одновременно (стек меток). Если бит S = 1, это **последняя метка** в стеке (за ней идёт сам IP-пакет).\n  4. **TTL (8 бит):** время жизни пакета внутри MPLS-домена для предотвращения петель.\n- **Операции с метками:**\n  - **PUSH (наложение):** входной граничный маршрутизатор (**Ingress LER**) анализирует IP-адрес, определяет класс эквивалентности пересылки (**FEC**), добавляет MPLS-заголовок перед IP-пакетом и отправляет его в сеть.\n  - **SWAP (замена):** промежуточный коммутатор (LSR) смотрит на входящую метку в своей таблице (LFIB), меняет её на другую, привязанную к следующему хопу, и выталкивает пакет в нужный порт.\n  - **POP (снятие):** выходной граничный маршрутизатор (**Egress LER**) снимает метку и отправляет получателю чистый IP-пакет. На практике часто применяется оптимизация **PHP (Penultimate Hop Popping)**, когда последнюю метку снимает предпоследний маршрутизатор, чтобы разгрузить выходной узел.\n- **Главные плюсы MPLS:** создание скоростных виртуальных частных сетей (**L3VPN / L2VPN**) и гибкое управление распределением трафика в обход перегруженных магистральных каналов (**Traffic Engineering**)."], "terms": [{"ru": "IPv6", "en": "Internet Protocol version 6", "df": "преемник IPv4 с **128-битными адресами**; решает проблему исчерпания адресного пространства IPv4"}, {"ru": "ICMP / ICMPv6", "en": "Internet Control Message Protocol", "df": "служебный протокол для диагностики (ping, traceroute) и сообщений об ошибках"}, {"ru": "ARP", "en": "Address Resolution Protocol", "df": "определение MAC-адреса по IPv4-адресу через широковещательный запрос в LAN"}, {"ru": "NDP", "en": "Neighbor Discovery Protocol", "df": "встроен в ICMPv6, заменяет ARP; использует Multicast вместо Broadcast"}, {"ru": "SLAAC", "en": "Stateless Address Autoconfiguration", "df": "автоматическая настройка IPv6-адреса хостом без DHCP-сервера"}, {"ru": "DHCP / DHCPv6", "en": "Dynamic Host Configuration Protocol", "df": "автоматическое назначение IP-адреса, маски, шлюза, DNS-серверов"}, {"ru": "MPLS", "en": "Multi-Protocol Label Switching", "df": "технология коммутации на уровне L2.5 по меткам вместо IP-адресов"}, {"ru": "Метка MPLS", "en": "label", "df": "20-битный идентификатор для коммутации в MPLS-сети"}, {"ru": "Стек меток", "en": "label stack", "df": "несколько меток на одном пакете для иерархических сервисов"}, {"ru": "LSR", "en": "Lab
