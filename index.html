ры, на которых физически прописаны записи (A, MX и т. д.) для конкретного сайта; поддерживаются владельцем сайта, хостинг-провайдером или регистратором.\n- **Рекурсивные серверы / кэширующие резолверы (Recursive Resolvers):** серверы, к которым напрямую обращаются пользователи (DNS провайдера, публичные `8.8.8.8` от Google, `1.1.1.1` от Cloudflare). Они выполняют всю цепочку опроса серверов и кэшируют результаты на время, указанное в TTL записи.", "<h4>Схема работы рекурсивного DNS-запроса</h4>", "Когда компьютер пытается узнать IP-адрес хоста `wiki.yandex.ru`, происходит следующая цепочка:", "<pre>\n [ Пользователь ]\n        │\n 1. Где wiki.yandex.ru?\n        ▼\n [ Кэширующий резолвер ] ── 2. Где .ru? ─────────────────&gt; [ Корневой сервер (.) ]\n         │               &lt;─ 3. Иди на TLD-сервер .ru ───\n         │\n         ├── 4. Где yandex.ru? ──────────────&gt; [ TLD-сервер (.ru) ]\n         │   &lt;─ 5. Иди на NS yandex.ru ─────\n         │\n         └── 6. Где wiki.yandex.ru? ─────────&gt; [ Авторитативный NS yandex.ru ]\n             &lt;─ 7. IP-адрес: 5.255.255.5 ───\n        │\n 8. Вот IP: 5.255.255.5\n        ▼\n [ Пользователь ]\n</pre>", "<h4>Типы запросов</h4>", "- **Рекурсивный:** клиент просит сервер сделать всю работу за него и вернуть готовый ответ (пользователь → резолвер).\n- **Итеративный:** сервер выдаёт клиенту лучшую подсказку, которая у него есть на данный момент, отправляя его на следующий уровень иерархии (резолвер → корневые, TLD и авторитативные серверы)."], "terms": [{"ru": "Служба доменных имён", "en": "DNS — Domain Name System", "df": "распределённая иерархическая база соответствий «имя ↔ IP»"}, {"ru": "Доменное имя / Полное имя", "en": "FQDN — Fully Qualified Domain Name", "df": "полное имя с точкой в конце"}, {"ru": "Корневой домен", "en": "Root", "df": "невидимая точка после TLD"}, {"ru": "Домен верхнего уровня", "en": "TLD — Top-Level Domain): общие (gTLD: `.com`, `.org`) и национальные (ccTLD: `.ru`, `.cn`", "df": "**Запись ресурса** (RR — Resource Record) — текстовая запись в базе DNS"}, {"ru": "CNAME", "en": "Canonical Name", "df": "псевдоним домена"}, {"ru": "MX", "en": "Mail Exchanger", "df": "почтовый сервер с приоритетом"}, {"ru": "NS", "en": "Name Server", "df": "авторитативный сервер зоны"}, {"ru": "SOA", "en": "Start of Authority", "df": "главная запись зоны (первичный NS, e-mail админа, серийный номер, таймеры)"}, {"ru": "Время жизни записи", "en": "TTL — Time To Live", "df": "время кэширования записи у резолвера"}, {"ru": "Корневой сервер", "en": "Root Server", "df": "13 логических узлов на вершине иерархии, развёрнутые по anycast"}, {"ru": "Сервер TLD", "en": "TLD Server", "df": "отвечает за зону верхнего уровня"}, {"ru": "Авторитативный сервер", "en": "Authoritative Server", "df": "хранит официальные записи конкретного домена"}, {"ru": "Рекурсивный резолвер", "en": "Recursive Resolver / Caching Resolver", "df": "сервер, к которому обращается пользователь; выполняет цепочку запросов и кэширует ответы"}, {"ru": "Перенос зоны", "en": "Zone Transfer, AXFR/IXFR", "df": "синхронизация базы между серверами зоны по TCP/53"}], "summary": ["**1. Служба DNS (Domain Name System)**", "DNS — **распределённая база данных**, автоматически переводящая доменные имена (`google.com`) в IP-адреса (`142.250.74.46`) для маршрутизации на сетевом уровне", "**Иерархическая структура** — перевёрнутое дерево из доменов разных уровней", "**Корневой домен (Root)** — точка `.` в конце полного имени (обычно опускается)", "**Домены верхнего уровня (TLD)** — национальные (`.ru`, `.cn`) и общие (`.com`, `.org`, `.edu`)", "**Домены второго и последующих уровней** выдаются организациям и частным лицам (`yandex.ru`)", "**Транспорт**: прикладной уровень; основной — **UDP, порт 53** (короткие запрос/ответ); **TCP, порт 53** при ответе >512 байт или при синхронизации зон (Zone Transfer)", "**2. Записи ресурсов доменов (RR — Resource Records)**", "База DNS — текстовые записи стандартного формата, каждая описывает узел или свойство домена", "**A (Address)** — IPv4-адрес хоста; самая частая запись", "**AAAA (IPv6 Address)** — IPv6-адрес хоста", "**CNAME (Canonical Name)** — алиас на другой домен (`www.site.com` → `site.com`)", "**MX (Mail Exchanger)** — почтовый сервер для домена + числовой приоритет (меньше — выше)", "**NS (Name Server)** — авторитативные серверы имён, хранящие зону домена", "**TXT** — произвольный текст; используется для верификации владельца и защиты почты (SPF, DKIM, DMARC)", "**SOA (Start of Authority)** — главная запись зоны: первичный NS, контакты администратора, серийный номер, таймеры кэширования", "Каждая запись несёт **TTL** — время кэширования у резолвера", "**3. Серверы имён (Name Servers)**", "Ни один сервер не хранит всю базу DNS — сеть распределена по четырём типам серверов", "**Корневые серверы (Root Servers)** — вершина иерархии; 13 логических адресов `a–m.root-servers.net`, физически развёрнуты по **anycast**; знают адреса всех TLD", "**Серверы TLD** управляют конкретной зоной верхнего уровня (`.ru`, `.com`); знают адреса серверов сайтов внутри этой зоны", "**Авторитативные серверы (Authoritative)** — официально хранят записи (A, MX и т. д.) конкретного домена; их держит владелец, хостер или регистратор", "**Рекурсивные / кэширующие резолверы (Recursive Resolvers)** — к ним напрямую обращается пользователь (DNS провайдера, `8.8.8.8` Google, `1.1.1.1` Cloudflare); проходят всю цепочку и кэшируют ответ на TTL", "**Схема рекурсивного запроса для `wiki.yandex.ru`**: пользователь → резолвер → root (где `.ru`?) → TLD `.ru` (где `yandex.ru`?) → авторитатив `yandex.ru` (IP `wiki`) → ответ клиенту", "**Типы запросов**: **рекурсивный** — клиент просит готовый ответ (пользователь → резолвер); **итеративный** — сервер выдаёт подсказку на следующий уровень иерархии (резолвер → root/TLD/авторитатив)"]}, {"n": 49, "title": "Архитектура и службы электронной почты. Форматы сообщений. Пересылка и окончательная доставка сообщений.", "paragraphs": ["<h3>1. Архитектура и службы электронной почты</h3>", "Электронная почта (e-mail) — приложение прикладного уровня для асинхронного обмена текстовыми сообщениями и вложениями. Архитектура построена на трёх основных программных компонентах, каждый со своей чётко определённой ролью.", "- **Пользовательский агент (UA — User Agent):** клиентское приложение, с которым работает пользователь (Outlook, Thunderbird, веб-интерфейс Gmail). Отвечает за составление, чтение, редактирование и форматирование писем.\n- **Агент передачи почты (MTA — Mail Transfer Agent):** фоновое серверное ПО, маршрутизирующее, пересылающее и доставляющее почту по сети. MTA общаются друг с другом, перемещая сообщение из домена отправителя в домен получателя. Примеры: Postfix, Exim, Sendmail.\n- **Агент доставки в ящик (MDA — Mail Delivery Agent):** компонент, который берёт входящее письмо у локального MTA и физически записывает его в конкретный почтовый ящик пользователя (директорию «inbox») на сервере.", "<h3>2. Форматы сообщений</h3>", "Письмо состоит из двух частей: **конверта (Envelope)** — используется только маршрутизаторами и MTA для доставки — и **содержимого (Content)** — того, что видит пользователь. Формат содержимого определяется интернет-стандартами.", "<h4>RFC 5322 — стандарт интернет-сообщения</h4>", "Исходно определён в RFC 822; задаёт текстовую структуру, разбитую на две части пустой строкой.", "- **Заголовок (Header):** набор полей «ключ-значение». Стандартные: `From:`, `To:`, `Subject:`, `Date:`, а также системные `Message-ID:`, `Received:` (фиксирует каждый MTA, через который прошло письмо).\n- **Тело (Body):** собственно текст сообщения, предназначенный для получателя.", "<h4>MIME (Multipurpose Internet Mail Extensions — RFC 2045–2049)</h4>", "Исходный RFC 5322 поддерживал только 7-битный ASCII. **MIME** — надстройка над оригинальным форматом, позволяющая:", "- **Не-ASCII кодировки** — например, UTF-8 для кириллицы или арабских символов.\n- **Форматированный текст (HTML)** — стилизованное оформление писем.\n- **Вложения** — изображения, PDF, исполняемые файлы; двоичные данные кодируются в текст алгоритмами вроде **Base64**.\n- **Многочастные сообщения (multipart):** одно письмо содержит несколько версий контента (например, `text/plain` для старых клиентов и `text/html` для современных).", "<h3>3. Пересылка и окончательная доставка сообщений</h3>", "Жизненный цикл письма состоит из двух разных фаз: проталкивание (push) письма между серверами через интернет и вытягивание (pull) письма получателем на своё устройство.", "<pre>\n [ Пользовательский агент отправителя ]\n        │\n 1. Отправка по SMTP (порт 587 / 465)\n        ▼\n [ MTA отправителя ] ── 2. DNS-запрос (MX-запись) ───────&gt; [ DNS-сервер ]\n        │            &lt;─ 3. IP MTA получателя ──────────\n        │\n 4. Пересылка по SMTP (TCP, порт 25)\n        ▼\n [ MTA получателя ] ── 5. Локальная передача ──&gt; [ MDA ] ── 6. Запись в файл ──&gt; [ Ящик ]\n                                                                                    │\n                                                                                    │\n 7. Получение по IMAP (порт 143 / 993) &lt;────────────────────────────────────────────┘\n        ▼\n [ Пользовательский агент получателя ]\n</pre>", "<h4>Шаги 1 и 4 — Пересылка сообщения (SMTP)</h4>", "- **Протокол:** **SMTP (Simple Mail Transfer Protocol)** — **push-протокол**, используется исключительно для отправки и пересылки сообщений.\n- **Отправка от клиента:** UA отправителя соединяется со своим локальным MTA по SMTP (традиционно порт **587** или **465** с шифрованием).\n- **Маршрутизация:** MTA отправителя смотрит **MX-запись** в DNS для домена получателя (например, `gmail.com`). Получив IP, MTA отправителя устанавливает TCP-соединение с MTA получателя (обычно **порт 25**) и передаёт сообщение.", "<h4>Шаги 5 и 6 — Обработка на принимающем сервере</h4>", "- **MTA получателя** принимает письмо, проверяет существование целевого ящика и локально передаёт его **MDA**.\n- **MDA** записывает сообщение в хранилище сервера (типичные файловые форматы — **Maildir** или **mbox**); письмо лежит там до запроса пользователя.", "<h4>Шаг 7 — Окончательная доставка (IMAP vs POP3)</h4>", "Чтобы прочитать письмо, UA получателя должен **вытянуть** его из ящика на сервере по **pull-протоколу**.", "- **IMAP (Internet Message Access Protocol — порт 143 / SSL 993):** современный stateful-протокол. Все письма и структура папок остаются на сервере; клиент по запросу скачивает заголовки или целые письма. Действия (прочитано, перемещено, удалено) сразу синхронизируются с сервером — удобно для работы с нескольких устройств одновременно.\n- **POP3 (Post Office Protocol v3 — порт 110 / SSL 995):** устаревший stateless-протокол. По умолчанию подключается к серверу, скачивает все новые письма на локальный диск устройства и **удаляет** их с сервера. Сильно ограничивает работу с почтой одновременно с телефона и компьютера."], "terms": [{"ru": "Пользовательский агент", "en": "UA / MUA — User Agent / Mail User Agent", "df": "клиентская программа пользователя (Outlook, Thunderbird, Gmail web)"}, {"ru": "Агент передачи почты", "en": "MTA — Mail Transfer Agent", "df": "серверное ПО маршрутизации и пересылки писем (Postfix, Exim, Sendmail)"}, {"ru": "Агент доставки в ящик", "en": "MDA — Mail Delivery Agent", "df": "записывает входящее письмо в конкретный почтовый ящик на сервере"}, {"ru": "Конверт", "en": "Envelope", "df": "данные SMTP-уровня (`MAIL FROM`, `RCPT TO`) для маршрутизации"}, {"ru": "Содержимое", "en": "Content", "df": "заголовок + тело письма, видимые пользователю"}, {"ru": "Заголовок / Тело", "en": "Header / Body", "df": "две части содержимого сообщения"}, {"ru": "Идентификатор сообщения", "en": "Message-ID", "df": "уникальный системный заголовок письма"}, {"ru": "MIME", "en": "Multipurpose Internet Mail Extensions, RFC 2045–2049", "df": "расширение для не-ASCII текста, HTML, вложений и multipart"}, {"ru": "Многочастное сообщение", "en": "multipart", "df": "одно письмо с несколькими версиями контента (text/plain + text/html и т. п.)"}, {"ru": "SMTP", "en": "Simple Mail Transfer Protocol", "df": "push-протокол отправки и пересылки писем; порты **25** (MTA↔MTA), **587** / **465** (UA→MTA)"}, {"ru": "MX-запись", "en": "Mail Exchanger", "df": "DNS-запись с почтовым сервером домена получателя"}, {"ru": "IMAP", "en": "Internet Message Access Protocol", "df": "stateful pull-протокол; порты **143** / **993** (SSL)"}, {"ru": "POP3", "en": "Post Office Protocol v3", "df": "устаревший stateless pull-протокол; порты **110** / **995** (SSL)"}], "summary": ["**1. Архитектура и службы электронной почты**", "E-mail — приложение прикладного уровня для асинхронного обмена сообщениями и вложениями; три ключевых компонента", "**Пользовательский агент (UA — User Agent)** — клиент пользователя (Outlook, Thunderbird, веб-интерфейс Gmail); составляет, читает и форматирует письма", "**Агент передачи почты (MTA — Mail Transfer Agent)** — серверное ПО маршрутизации и пересылки между серверами (Postfix, Exim, Sendmail)", "**Агент доставки в ящик (MDA — Mail Delivery Agent)** — записывает входящее письмо в конкретный почтовый ящик (директорию inbox) на сервере", "**2. Форматы сообщений**", "Письмо = **конверт (Envelope)** — для маршрутизации MTA — + **содержимое (Content)** — заголовок и тело, видимые пользователю", "**RFC 5322** (старый RFC 822) — текстовый формат: **Header** (поля `From:`, `To:`, `Subject:`, `Date:`, `Message-ID:`, `Received:`) + пустая строка + **Body** (текст письма)", "**MIME (RFC 2045–2049)** — надстройка над RFC 5322 для не-ASCII и сложного контента", "MIME: не-ASCII кодировки (UTF-8), HTML-форматирование, вложения через **Base64**, **multipart** (несколько версий одного письма: text/plain + text/html)", "**3. Пересылка и окончательная доставка**", "Жизненный цикл письма: **push** между серверами + **pull** получателем", "**Шаги 1, 4 — пересылка по SMTP**: UA отправителя → локальный MTA (порт **587** или **465** с TLS); MTA смотрит **MX-запись** в DNS для домена получателя, по полученному IP открывает TCP-соединение к MTA получателя (порт **25**) и передаёт сообщение", "**Шаги 5, 6 — обработка на принимающем сервере**: MTA получателя проверяет существование ящика и передаёт письмо **MDA**, который записывает его в хранилище (**Maildir** или **mbox**)", "**Шаг 7 — окончательная доставка (pull)**: UA получателя забирает письма с сервера по pull-протоколу", "**IMAP (порт 143 / SSL 993)** — современный stateful: письма и папки остаются на сервере, действия (прочитано, перемещено, удалено) синхронизируются; удобно для нескольких устройств", "**POP3 (порт 110 / SSL 995)** — устаревший stateless: скачивает все новые письма на устройство и удаляет с сервера; неудобен для multi-device"]}, {"n": 50, "title": "SMTP, POP3, IMAP.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "Электронная почта обслуживается тремя ключевыми протоколами прикладного уровня: **SMTP** (Simple Mail Transfer Protocol) — для **передачи** почты от клиента к серверу и между серверами; **POP3** (Post Office Protocol v3) — простое **скачивание** писем с сервера; **IMAP** (Internet Message Access Protocol) — синхронизированное **управление** почтой на сервере с нескольких устройств. SMTP — «push»-протокол (отправитель толкает письмо), POP3/IMAP — «pull» (клиент забирает). Все три — текстовые, command-response, поверх TCP.", "<h3>SMTP — Simple Mail Transfer Protocol</h3>", "RFC 5321 (Extended SMTP, ESMTP — расширенная версия RFC 2821). Используется в двух ролях:", "- **Submission** (MUA → MSA): порт **587** (RFC 6409), обязательна аутентификация (SMTP AUTH с SASL: PLAIN/LOGIN/CRAM-MD5/OAUTHBEARER, поверх STARTTLS).\n- **Relay** (MTA → MTA): порт **25**, без обязательной аутентификации (но всё чаще обязательный TLS + SPF/DKIM/DMARC проверки).\n- Устаревший: порт **465** для прямого SMTPS (deprecated в RFC 2487, восстановлен в RFC 8314 как Submissions).", "Диалог SMTP (упрощённо):\n```\nS: 220 mail.example.com ESMTP Postfix\nC: EHLO client.example.com\nS: 250-mail.example.com Hello, [PIPELINING/SIZE/STARTTLS/AUTH PLAIN LOGIN/8BITMIME...]\nC: STARTTLS\nS: 220 Ready to start TLS\n... TLS handshake ...\nC: EHLO client.example.com\nC: AUTH PLAIN <base64-encoded credentials>\nS: 235 Authentication successful\nC: MAIL FROM:<alice@example.com>\nS: 250 OK\nC: RCPT TO:<bob@destination.com>\nS: 250 OK\nC: DATA\nS: 354 End data with <CR><LF>.<CR><LF>\nC: From: ...\nC: To: ...\nC: Subject: ...\nC: \nC: Hello, Bob!\nC: .\nS: 250 OK: queued as ABC123\nC: QUIT\nS: 221 Bye\n```", "Ключевые команды: `HELO/EHLO`, `STARTTLS`, `AUTH`, `MAIL FROM`, `RCPT TO`, `DATA`, `RSET`, `NOOP`, `QUIT`, `VRFY`, `EXPN` (последние две обычно отключены ради безопасности).", "Расширения ESMTP: `8BITMIME`, `SIZE`, `PIPELINING`, `CHUNKING/BDAT`, `STARTTLS`, `AUTH`, `DSN` (Delivery Status Notification), `SMTPUTF8` (международные адреса).", "Коды ответов:\n- **2xx** — успех (250 OK, 354 Start mail input).\n- **3xx** — промежуточный (требуется ввод).\n- **4xx** — временная ошибка, попробуйте позже (Greylisting часто возвращает 451).\n- **5xx** — постоянная ошибка (550 User unknown).", "<h3>POP3 — Post Office Protocol v3</h3>", "RFC 1939. Простейший «забрал-удалил». Порт **110** (TLS на 995 — POP3S, RFC 8314).", "Команды (минимальный набор):\n- `USER username`, `PASS password` (или `AUTH`, или `APOP`).\n- `STAT` — кол-во и общий размер сообщений.\n- `LIST [n]` — список сообщений.\n- `RETR n` — скачать сообщение.\n- `DELE n` — пометить на удаление.\n- `RSET` — отменить пометки.\n- `TOP n l` — заголовки и первые l строк.\n- `UIDL` — уникальные идентификаторы (для «leave on server»).\n- `QUIT` — переход в UPDATE-фазу, физическое удаление помеченных.", "Модель работы — три фазы: AUTHORIZATION → TRANSACTION → UPDATE. По умолчанию письма удаляются с сервера после скачивания, что плохо для multi-device.", "Минусы: нет папок, поиска, флагов прочтено/удалено, push-уведомлений. Сегодня вытесняется IMAP/JMAP.", "<h3>IMAP — Internet Message Access Protocol</h3>", "RFC 9051 (IMAP4rev2). Существенно сложнее POP3, но обеспечивает **серверное хранилище** и синхронизацию. Порт **143** (TLS на 993 — IMAPS).", "Возможности:\n- Письма остаются на сервере; клиент работает с ним как с **удалённой файловой системой**.\n- **Папки** (mailboxes/folders): INBOX, Sent, Drafts, Trash, пользовательские.\n- **Флаги**: `\\Seen`, `\\Answered`, `\\Flagged`, `\\Deleted`, `\\Draft`, custom keywords.\n- **Селективная загрузка**: скачать только заголовки или только нужную часть multipart (например, без вложения).\n- **Серверный поиск** (SEARCH FROM, SUBJECT, BODY, SINCE).\n- **IDLE** (RFC 2177) — push-уведомления, сервер сам шлёт обновления.\n- **CONDSTORE/QRESYNC** — эффективная синхронизация.\n- **MOVE** — атомарное перемещение между папками.\n- **Подключение нескольких устройств**, синхронное состояние.", "Команды (теги-команды-параметры):\n```\na001 LOGIN user pass\na002 SELECT INBOX\na003 FETCH 1:10 (UID FLAGS ENVELOPE BODY[HEADER])\na004 SEARCH UNSEEN\na005 STORE 5 +FLAGS (\\Seen)\na006 IDLE\n+ idling\n... server pushes EXISTS, EXPUNGE ...\nDONE\na007 LOGOUT\n```", "<h3>Сравнение протоколов</h3>", "| Свойство | POP3 | IMAP |\n|---|---|---|\n| Письма после скачивания | удаляются | остаются |\n| Папки | нет | да |\n| Поиск на сервере | нет | да |\n| Multi-device | плохо | хорошо |\n| Push (IDLE) | нет | да |\n| Состояние (флаги) | нет | да |\n| Сложность реализации | низкая | высокая |\n| Сетевой трафик | минимальный | больше |", "<h3>Схемы доставки</h3>", "1. **Прямая (одноуровневая)**: MUA → MSA → MTA получателя → MS → IMAP/POP3 → MUA получателя.\n2. **Через антиспам-шлюз**: добавляется промежуточный MTA на входе или выходе.\n3. **Корпоративная**: множество MTA, релеи, content gateway, шифрование, DLP.", "<h3>Защита соединений</h3>", "- **STARTTLS** (RFC 3207 для SMTP, RFC 2595 для IMAP/POP) — апгрейд открытого соединения до TLS.\n- **Implicit TLS** — сразу TLS на специальных портах: **Submissions 465**, **IMAPS 993**, **POP3S 995** (рекомендуется в RFC 8314).\n- **MTA-STS** и **DANE/TLSA** — принудительное использование TLS на MTA-уровне.", "<h3>Современные альтернативы</h3>", "- **JMAP** (RFC 8620, 2019) — JSON-RPC поверх HTTPS, объединяющее IMAP, контакты, календарь. Быстрее, проще, лучше для мобильных.\n- Web-интерфейсы Gmail/Outlook — собственные API, не IMAP."], "terms": [{"ru": "SMTP", "en": "RFC 5321", "df": "протокол отправки и ретрансляции почты"}, {"ru": "POP3", "en": "RFC 1939", "df": "простой протокол получения с удалением"}, {"ru": "IMAP / IMAP4rev2", "en": "RFC 9051", "df": "продвинутый протокол управления почтой на сервере"}, {"ru": "DSN", "en": "Delivery Status Notification", "df": "уведомление о статусе доставки"}], "summary": ["Три ключевых протокола: **SMTP** push (отправитель толкает); **POP3 и IMAP** pull (клиент забирает); все три текстовые, command-response, поверх TCP", "**SMTP** (RFC 5321, ESMTP) — две роли:", "**Submission** (MUA→MSA): **порт 587** (RFC 6409), обязательная **AUTH** (SASL: PLAIN/LOGIN/CRAM-MD5/OAUTHBEARER) под STARTTLS", "**Relay** (MTA→MTA): **порт 25**, без обязательной AUTH (но TLS + SPF/DKIM/DMARC); порт **465** = SMTPS/Submissions (RFC 8314)", "**Команды SMTP**: `EHLO`, `STARTTLS`, `AUTH`, **`MAIL FROM`**, **`RCPT TO`**, **`DATA`** (до `<CR><LF>.<CR><LF>`), `RSET`, `QUIT`; `VRFY`/`EXPN` отключают", "**Расширения ESMTP**: 8BITMIME, SIZE, PIPELINING, CHUNKING/BDAT, STARTTLS, AUTH, **DSN** (Delivery Status), SMTPUTF8", "**Коды**: **2xx** успех (250 OK, 354 Start data); 3xx промежуточный (331); **4xx** временно (451 greylisting); **5xx** постоянно (550 User unknown)", "**POP3** (RFC 1939) — простой «забрал-удалил»; **порт 110** (TLS на **995** — POP3S)", "**Команды POP3**: USER/PASS, STAT, LIST, **RETR n** (скачать), **DELE n** (на удаление), RSET, TOP, UIDL (UID для leave-on-server), QUIT", "Три фазы POP3: AUTHORIZATION → TRANSACTION → UPDATE; по умолчанию удаляет → плохо для multi-device", "Минусы POP3: нет папок, поиска, флагов, push; вытесняется IMAP/JMAP", "**IMAP** (RFC 9051 IMAP4rev2) — серверное хранение; **порт 143** (TLS на **993** — IMAPS)", "Возможности IMAP: **папки** (INBOX/Sent/Drafts/Trash), **флаги** (\\Seen/\\Answered/\\Flagged/\\Deleted/\\Draft), селективная загрузка частей MIME, серверный SEARCH", "**IDLE** (RFC 2177) — push-уведомления; **CONDSTORE/QRESYNC** — эффективная синхронизация; **MOVE** атомарный; multi-device синхронно", "Команды IMAP: tag + command — LOGIN, SELECT, **FETCH** (UID, FLAGS, ENVELOPE, BODY), SEARCH, **STORE** (+/-FLAGS), MOVE, IDLE, LOGOUT", "**Сравнение POP3 vs IMAP**: удаление/остаются; нет/есть папки; нет/есть search; плохо/хорошо для multi-device; нет/есть push; нет/есть флаги", "Защита: **STARTTLS** (RFC 3207 SMTP, RFC 2595 IMAP/POP) — апгрейд; **Implicit TLS** на 465/993/995; **MTA-STS** + **DANE** обязательные TLS", "**JMAP** (RFC 8620, 2019) — JSON-RPC поверх HTTPS, объединяет IMAP+контакты+календарь; быстрее, проще, для мобильных"]}, {"n": 51, "title": "WWW. HTTP.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**WWW** (World Wide Web) — глобальная распределённая гипертекстовая система, созданная Тимом Бернерсом-Ли в CERN (1989–1991) и ставшая «убийственным приложением» Интернета. WWW определяется тремя китами: **URI/URL** (унифицированная адресация ресурсов), **HTML** (язык разметки документов с гиперссылками) и **HTTP** (протокол передачи гипертекста). Современный Web эволюционировал от простых статических страниц к интерактивным приложениям (SPA), API (REST/GraphQL/gRPC-Web), мультимедиа-стримингу, и фактически стал универсальной платформой для большинства цифровых сервисов.", "<h3>Архитектура WWW</h3>", "Классическая **клиент-серверная** модель:\n- **Клиент** — **браузер** (Chrome, Firefox, Safari, Edge), реже мобильное приложение или CLI-инструмент (curl, wget). Запрашивает ресурсы по URL, отрисовывает HTML/CSS, исполняет JavaScript, обрабатывает события.\n- **Сервер** — веб-сервер (nginx, Apache, IIS, Caddy) либо application framework (Node.js, Django, Flask, Spring) принимает HTTP-запросы, отдаёт статику или генерирует динамический контент.\n- Между ними — Интернет с CDN, proxies, load balancers, WAF.", "**URL/URI** (RFC 3986): `scheme://[user:pass@]host[:port]/path?query#fragment`. Например: `https://example.com:443/blog/post?id=42#comments`.", "**HTML** (HyperText Markup Language) — текстовая декларативная разметка с тегами; современный HTML5 + CSS3 + JavaScript ES202x составляют веб-платформу.", "<h3>Типы веб-страниц</h3>", "- **Статические** — готовые HTML-файлы на диске, отдаются без обработки. Быстро, кешируется, идеально для контента.\n- **Серверно-генерируемые** (SSR — Server-Side Rendering) — PHP/Node/Python/Ruby формирует HTML под запрос (БД, шаблоны). Wordpress, классический Django.\n- **Клиентско-генерируемые** (CSR — Client-Side Rendering, SPA — Single-Page Application) — сервер отдаёт минимальный HTML и большой JS-бандл; всё рендерится в браузере по AJAX-запросам к API (React, Vue, Angular).\n- **Гибридные** (Next.js, Nuxt, SvelteKit) — SSR при первом запросе, SPA-навигация далее.\n- **PWA** (Progressive Web Apps) — веб-приложения с offline-режимом, push-уведомлениями.", "<h3>HTTP — Hypertext Transfer Protocol</h3>", "Текстовый stateless протокол запрос-ответ поверх TCP (HTTP/1.x, /2) или поверх QUIC (HTTP/3). Порты **80** (HTTP) / **443** (HTTPS).", "**Структура запроса**:\n```\nGET /index.html HTTP/1.1\nHost: example.com\nUser-Agent: Mozilla/5.0 ...\nAccept: text/html,application/xhtml+xml\nAccept-Language: ru,en\nAccept-Encoding: gzip, br\nCookie: session=abc123\n```", "**Структура ответа**:\n```\nHTTP/1.1 200 OK\nDate: Tue, 14 May 2026 12:00:00 GMT\nServer: nginx/1.24\nContent-Type: text/html; charset=UTF-8\nContent-Length: 1234\nSet-Cookie: session=abc123; Secure; HttpOnly\nCache-Control: max-age=3600", "<html>...</html>\n```", "**Методы**: GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS, TRACE, CONNECT (для туннелирования через прокси).", "**Коды статуса**:\n- **1xx** — информация (100 Continue, 101 Switching Protocols).\n- **2xx** — успех (200 OK, 201 Created, 204 No Content, 206 Partial Content).\n- **3xx** — перенаправление (301 Moved Permanently, 302 Found, 304 Not Modified, 307 Temporary Redirect, 308 Permanent Redirect).\n- **4xx** — ошибка клиента (400 Bad Request, 401 Unauthorized, 403 Forbidden, 404 Not Found, 408 Timeout, 429 Too Many Requests).\n- **5xx** — ошибка сервера (500 Internal Server Error, 502 Bad Gateway, 503 Service Unavailable, 504 Gateway Timeout).", "**Ключевые заголовки**: `Content-Type`, `Content-Length`, `Cache-Control`, `Cookie`/`Set-Cookie`, `Authorization`, `ETag`/`If-None-Match`, `Range`, `Accept-Encoding`, `Content-Encoding`, `User-Agent`, `Referer`, `Origin`, `Host`.", "<h3>Версии HTTP</h3>", "| Версия | Год | Транспорт | Ключевые особенности |\n|---|---|---|---|\n| HTTP/0.9 | 1991 | TCP | только GET, без заголовков |\n| HTTP/1.0 (RFC 1945) | 1996 | TCP | заголовки, статусы, новое соединение на каждый запрос |\n| HTTP/1.1 (RFC 7230–7235, 9110–9112) | 1997/2014/2022 | TCP | Keep-Alive (persistent), Host header (для virtual hosting), pipelining, chunked transfer, Range |\n| HTTP/2 (RFC 9113) | 2015 | TCP+TLS | бинарный фрейминг, мультиплексирование потоков, **HPACK** сжатие заголовков, Server Push |\n| HTTP/3 (RFC 9114) | 2022 | QUIC (UDP+TLS 1.3) | устраняет **HOL blocking** на уровне потоков, 0/1-RTT handshake, миграция соединения |", "**Head-of-Line (HOL) blocking** в HTTP/1.1 — pipelined запросы блокируются медленным ответом; в HTTP/2 — на TCP-уровне (потеря пакета блокирует все потоки); в HTTP/3 — устранён, так как QUIC мультиплексирует на уровне UDP-датаграмм.", "**Server Push** в HTTP/2 (на практике отключён в браузерах из-за неэффективности).", "<h3>REST и веб-API</h3>", "**REST** (Representational State Transfer, Roy Fielding 2000) — архитектурный стиль:\n- Ресурсы идентифицируются URL.\n- Состояние ресурса передаётся представлением (JSON, XML).\n- HTTP-методы — действия: GET (read), POST (create), PUT (update full), PATCH (partial), DELETE (remove).\n- **Stateless** — каждый запрос самодостаточен.\n- **Cacheable** — ответы могут кешироваться.\n- **HATEOAS** — гипермедиа как двигатель состояния (редко на практике).", "Альтернативы REST: **SOAP** (XML-based, тяжёлый), **gRPC** (бинарный, HTTP/2), **GraphQL** (Facebook 2015, query language), **JSON-RPC**.", "<h3>Cookies, сессии, аутентификация</h3>", "HTTP без состояния, поэтому сессии хранятся через:\n- **Cookies** (RFC 6265) — серверный `Set-Cookie`, клиент шлёт обратно `Cookie`. Атрибуты `Secure`, `HttpOnly`, `SameSite` для безопасности.\n- **JWT** — самоподписанные токены в заголовке Authorization.\n- **OAuth 2.0 / OIDC** — делегированная авторизация.\n- **Basic / Digest / Bearer / mTLS** — схемы аутентификации.", "<h3>Веб-поиск</h3>", "- **Краулеры (spiders)** обходят страницы по ссылкам, уважая `robots.txt`.\n- Строится **инвертированный индекс** (слово → список документов).\n- Ранжирование: **PageRank** (Brin & Page 1998) — оценка важности по графу ссылок; современные алгоритмы добавляют сотни сигналов и ML.\n- **SEO** (Search Engine Optimization) — практики повышения видимости.", "<h3>Современные дополнения веба</h3>", "- **WebSocket** (RFC 6455) — двусторонний канал поверх HTTP-апгрейда.\n- **Server-Sent Events** (SSE) — однонаправленный push.\n- **WebRTC** — браузерные P2P для видеоконференций.\n- **WebAssembly** (WASM) — низкоуровневый код в браузере, рядом с JS.\n- **HTTP/3** + **TLS 1.3** + **0-RTT** — максимально быстрый старт страницы."], "terms": [{"ru": "WWW", "en": "World Wide Web", "df": "глобальная гипертекстовая система"}, {"ru": "URI / URL / URN", "en": "Uniform Resource Identifier / Locator / Name", "df": "адрес ресурса"}, {"ru": "HTML", "en": "HyperText Markup Language", "df": "язык разметки"}, {"ru": "CSS", "en": "Cascading Style Sheets", "df": "таблицы стилей"}, {"ru": "HOL Blocking", "en": "Head-Of-Line", "df": "блокировка очереди из-за одного потерянного пакета"}, {"ru": "CORS", "en": "Cross-Origin Resource Sharing", "df": "политика разделения origin"}], "summary": ["**WWW** (Тим Бернерс-Ли, CERN, 1989-91) — три кита: **URI/URL** + **HTML** + **HTTP**", "Клиент-серверная архитектура: **браузер** ↔ Интернет (CDN/proxies/LB/WAF) ↔ **веб-сервер** (nginx, Apache, IIS, Caddy) / framework (Node/Django/Spring)", "**URL/URI** (RFC 3986): `scheme://[user:pass@]host[:port]/path?query#fragment`", "**HTML5 + CSS3 + JavaScript ES202x** — современная веб-платформа", "**Типы страниц**: **статические** (готовый HTML); **SSR** (Wordpress, Django); **CSR/SPA** (React/Vue/Angular, AJAX к API); **гибридные** (Next.js/Nuxt); **PWA**", "**HTTP** — текстовый stateless запрос-ответ; HTTP/1.x и /2 поверх **TCP**, HTTP/3 поверх **QUIC**; порты **HTTP=80, HTTPS=443**", "**Методы**: **GET**, **POST**, **PUT**, **DELETE**, PATCH, HEAD, OPTIONS, TRACE, CONNECT (туннелирование)", "**Коды**: **1xx** инфо (101 Switching); **2xx** успех (200 OK, 201 Created, 204, 206 Partial); **3xx** redirect (301/302/304/307/308)", "**4xx** клиент (**400** Bad Request, **401** Unauthorized, **403** Forbidden, **404** Not Found, **429** Too Many); **5xx** сервер (**500** Internal, **502** Bad Gateway, 503, 504)", "Заголовки: Content-Type, Content-Length, Cache-Control, **Cookie/Set-Cookie**, Authorization, **ETag/If-None-Match**, Range, Accept-Encoding, Host", "**Версии HTTP**: 0.9 (1991), **1.0** (RFC 1945, новое соед. на запрос), **1.1** (Keep-Alive, Host для virtual hosting, pipelining, chunked, Range)", "**HTTP/2** (RFC 9113, 2015) — TCP+TLS, бинарный фрейминг, **мультиплексирование потоков**, **HPACK** сжатие заголовков, Server Push (отключён)", "**HTTP/3** (RFC 9114, 2022) — поверх **QUIC** (UDP+TLS 1.3); устраняет **HOL blocking** на L4, **0/1-RTT** handshake, миграция соединения", "**REST** (Fielding 2000): ресурсы по URL, представления (JSON/XML), HTTP-методы как действия; stateless, cacheable, HATEOAS (редко)", "Альтернативы REST: **SOAP** (XML-based, тяжёлый), **gRPC** (бинарный, HTTP/2 + ProtoBuf), **GraphQL** (Facebook 2015), **JSON-RPC**", "**Cookies** (RFC 6265): Set-Cookie от сервера → Cookie от клиента; атрибуты **Secure**, **HttpOnly**, **SameSite**", "Аутентификация: **JWT** в Authorization; **OAuth 2.0 / OIDC**; Basic/Digest/Bearer/mTLS", "**Веб-поиск**: краулеры (по `robots.txt`) → **инвертированный индекс** → **PageRank** (Brin & Page 1998) + ML-сигналы", "Современные API браузера: **WebSocket** (RFC 6455), **SSE** (Server-Sent Events), **WebRTC** (P2P видео), **WebAssembly** (WASM); **CORS** для cross-origin"]}, {"n": 52, "title": "CDN. P2P.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "Современный Интернет передаёт огромные объёмы контента — потокового видео (Netflix, YouTube — более 60% трафика), обновлений ПО, веб-страниц с тяжёлыми ассетами, файлов. Доставлять всё это с одного «origin» сервера для миллионов клиентов по всему миру невозможно физически (полоса, задержка, отказоустойчивость). Решения — **CDN** (Content Delivery Network), где контент реплицируется на распределённую сеть **edge-серверов** ближе к пользователям, и **P2P** (Peer-to-Peer), где сами пользователи раздают контент друг другу. Обе технологии радикально снизили стоимость доставки и сделали возможным современный медиа-Интернет.", "<h3>Server Farm и Load Balancer</h3>", "Базовая ступень масштабирования — **серверная ферма**:\n- Кластер идентичных серверов, обслуживающих один сервис.\n- Перед ними — **load balancer** (NGINX, HAProxy, AWS ALB, F5 BIG-IP), распределяющий запросы по **алгоритмам**: Round Robin, Least Connections, Weighted, IP-Hash, Least Response Time.\n- **L4-балансировщик** (TCP/UDP уровень, например LVS) пересылает пакеты по 4-кортежу.\n- **L7-балансировщик** анализирует HTTP-заголовки, может маршрутизировать по URL/cookie, обрывать TLS.\n- **Health checks** автоматически выводят неработающие узлы.\n- Дополняется **горизонтальным шардингом** баз данных, **stateless**-приложениями, кешированием в Memcached/Redis.", "Серверная ферма решает масштаб **в одном дата-центре**, но не помогает с глобальной задержкой и пиковой нагрузкой.", "<h3>Web Proxy и кеширование</h3>", "**Веб-прокси** — промежуточный сервер между клиентами и Интернетом:\n- **Forward proxy** (Squid) — на стороне корпоративной сети, кеширует ответы для общих ресурсов, фильтрует трафик.\n- **Reverse proxy** (NGINX перед origin) — на стороне сервиса, кеширует ответы, разгружая origin.\n- **Cache-Control** заголовки (`max-age`, `s-maxage`, `public/private`, `no-store`) и **ETag/Last-Modified** для условных запросов определяют поведение кеша.", "<h3>CDN — Content Delivery Network</h3>", "**CDN** — глобальная иерархия кеширующих edge-серверов, размещённых в десятках/сотнях **PoP** (Points of Presence) по всему миру, обычно непосредственно на IXP и в дата-центрах операторов. Цели:\n- **Низкая задержка** доставки (физически ближе к пользователю).\n- **Высокая пропускная способность** (суммарно терабиты/с).\n- **Защита origin** от пиков и DDoS.\n- **Гибкость** (edge computing, A/B, security headers).", "Принцип:\n- Контент **реплицируется**/кешируется на edge.\n- При запросе клиента **DNS** (на основе геолокации и BGP-метрик) или **anycast** направляет к ближайшему PoP.\n- Edge либо отдаёт из кеша, либо запрашивает у origin и кеширует.\n- **Cache invalidation** через API CDN или короткие TTL.", "Архитектурно CDN бывают:\n- **Pull CDN** — кеширует по запросу (Cloudflare, default).\n- **Push CDN** — контент загружается заранее (для статичных сайтов, S3 + CloudFront).", "Примеры: **Akamai** (старейший, корпоративный), **Cloudflare** (массовый, anycast), **Amazon CloudFront**, **Google CDN**, **Fastly** (edge VCL/WASM), **Bunny.net**, **CDN77**, **Selectel** (РФ), **VK CDN**.", "CDN сегодня — **полноценная edge-платформа**: TLS termination, WAF, DDoS-mitigation, Image Optimization, video streaming (HLS/DASH с ABR — Q53), Edge Workers (Cloudflare Workers, AWS Lambda@Edge, Fastly Compute@Edge).", "<h3>P2P — одноранговые сети</h3>", "В **P2P** (Peer-to-Peer) архитектуре нет фиксированного сервера: каждый узел («пир», peer) одновременно — клиент и сервер, потребитель и поставщик ресурса. Свойства:\n- **Масштабируемость**: пропускная способность системы растёт с числом участников (каждый новый peer приносит свою upload-bandwidth).\n- **Отказоустойчивость**: исчезновение узлов не «убивает» систему.\n- **Цена**: владельцу контента не нужно платить за серверный трафик.\n- **Сложности**: NAT, изменчивость пиров (churn), доверие, поиск контента.", "Эволюция P2P:\n- **Napster** (1999) — центральный индекс + P2P-передача файлов. Закрыт по суду.\n- **Gnutella** (2000) — полностью децентрализованный поиск через flooding запросов.\n- **FastTrack** (Kazaa) — гибрид с supernodes.\n- **eDonkey/eMule** — хеш-идентификаторы.\n- **BitTorrent** (Bram Cohen 2001) — доминирующий, идея tit-for-tat и chunks.\n- **Skype** (исторически) — P2P-VoIP с supernodes.\n- **IPFS** (InterPlanetary File System) — content-addressable распределённое хранилище.\n- Современно: **WebTorrent** (для браузеров), **libp2p** (стек для блокчейнов), **Hypercore** (Beaker Browser).", "<h3>BitTorrent в деталях</h3>", "Идея:\n- Файл разбивается на **piece**'ы фиксированного размера (обычно 256 КБ – 2 МБ); каждый piece хешируется SHA-1; список хешей — в **.torrent**-файле или magnet-link.\n- **Tracker** (или DHT) ведёт список пиров для каждого торрента.\n- Клиент подключается к нескольким пирам параллельно, обменивается информацией о доступных pieces (bitfield), запрашивает недостающие.\n- Стратегия **rarest-first** — приоритет редким piece'ам; **tit-for-tat** — взаимные обмены; **optimistic unchoking** — пробные раздачи незнакомым пирам.", "Современные расширения:\n- **DHT** (Distributed Hash Table, Kademlia) — поиск пиров без центрального трекера.\n- **Peer Exchange (PEX)** — пиры обмениваются списками друг друга.\n- **Magnet-link** — URI с info-hash, не нужен .torrent-файл.\n- **uTP** — congestion-control с приоритетом для других соединений.\n- **WebSeed** (HTTP fallback).", "<h3>CDN vs P2P</h3>", "| Свойство | CDN | P2P |\n|---|---|---|\n| Управление | централизованное | распределённое |\n| Гарантии | SLA, надёжность | best-effort |\n| Стоимость для владельца | подписка | минимальная (сами пиры) |\n| Подходит для | live, premium video, веб | большие статические файлы, обновления |\n| Контроль контента | да | сложно |\n| Защита от пиратства | сильная | слабая |", "В реальности они **дополняют** друг друга: например, Spotify исторически комбинировал CDN и P2P для уменьшения нагрузки."], "terms": [{"ru": "CDN", "en": "Content Delivery Network", "df": "сеть доставки контента"}, {"ru": "Edge Server / PoP", "en": "Point of Presence", "df": "граничный сервер CDN"}, {"ru": "P2P", "en": "Peer-to-Peer", "df": "одноранговая (пиринговая) сеть"}, {"ru": "DHT", "en": "Distributed Hash Table", "df": "распределённая хэш-таблица для поиска пиров"}], "summary": ["**Server Farm** — кластер серверов + **Load Balancer** (NGINX/HAProxy/AWS ALB/F5)", "Алгоритмы LB: Round Robin, Least Connections, Weighted, IP-Hash, Least Response Time", "**L4-балансировщик** (TCP/UDP, LVS) — по 4-кортежу; **L7** — по HTTP-заголовкам, URL, cookie, TLS termination", "Health checks, шардинг БД, stateless apps, кэширование Memcached/Redis; ферма решает scale в одном ДЦ, не глобально", "**Web Proxy**: **Forward proxy** (Squid в корп. сети, фильтрация); **Reverse proxy** (NGINX перед origin, защита/кэш)", "**Cache-Control** (max-age, s-maxage, public/private, no-store) + **ETag/Last-Modified** — управление кэшем", "**CDN** (Content Delivery Network) — иерархия **edge-серверов** в десятках/сотнях **PoP** (Points of Presence), часто на IXP", "Цели CDN: низкая задержка, terabit-полоса, защита origin от пиков/DDoS, edge computing/A/B", "**Принцип**: контент реплицируется на edge; **DNS** (geo+BGP) или **anycast** направляет к ближайшему PoP; cache miss → origin", "**Pull CDN** (по запросу, default Cloudflare) vs **Push CDN** (заранее, S3 + CloudFront)", "Примеры: **Akamai** (старейший), **Cloudflare** (anycast), Amazon CloudFront, Google CDN, Fastly (VCL/WASM), Bunny.net, Selectel/VK CDN (РФ)", "Современный CDN = edge-платформа: TLS termination, **WAF**, DDoS-mitigation, Image Optimization, HLS/DASH streaming, **Edge Workers** (Cloudflare Workers, Lambda@Edge)", "**P2P** (Peer-to-Peer): каждый узел = клиент + сервер; пропускная способность **растёт с числом участников**; нет фиксированного сервера", "Свойства: масштабируемость, отказоустойчивость, бесплатно для владельца контента; сложности — NAT, churn (изменчивость), доверие, поиск", "Эволюция P2P: **Napster** (1999, центральный индекс) → **Gnutella** (flooding) → FastTrack (Kazaa, supernodes) → eDonkey/eMule → **BitTorrent** (Cohen 2001)", "**BitTorrent**: файл → **piece**ы (256 КБ – 2 МБ, SHA-1); .torrent или magnet → **tracker/DHT** → пиры → bitfield + запросы", "Стратегии: **rarest-first**, **tit-for-tat**, **optimistic unchoking** для незнакомцев", "Расширения: **DHT** (Kademlia, без трекера), Peer Exchange (PEX), **Magnet-link** (info-hash без .torrent), **uTP** (congestion-aware), WebSeed", "Современные P2P: **IPFS** (content-addressable), **WebTorrent**, **libp2p** (блокчейн), Hypercore", "**CDN vs P2P**: централизованное/распределённое; SLA/best-effort; подписка/бесплатно; live-video/большие файлы; контроль/слабый. Часто дополняют друг друга (Spotify исторически)"]}, {"n": 53, "title": "Цифровое аудио и видео.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "Цифровое **аудио и видео** — основа современного интернет-трафика (60–80% по объёму). Передача мультимедиа отличается от обычных данных требованиями: высокая пропускная способность, низкая задержка для интерактивных сценариев, устойчивость к потерям без повторной передачи (потерянный кадр уже не нужен через 100 мс), массовость аудитории (один live-стрим — миллионы зрителей). Это породило **специальные протоколы** (RTP, SRTP, WebRTC), **алгоритмы сжатия** (кодеки: H.264, H.265, AV1, AAC, Opus) и **методы доставки** (HLS, MPEG-DASH с ABR).", "<h3>Цифровое аудио</h3>", "- **PCM** (Pulse Code Modulation) — базовая дискретизация: частота дискретизации × разрядность × каналы.\n  - Телефонное качество: 8 000 Гц × 8 бит = 64 кбит/с (G.711).\n  - CD: 44 100 Гц × 16 бит × 2 = **1,411 Мбит/с**.\n  - Hi-Res: 96/192 кГц × 24 бит.\n- **Кодеки с потерями** (lossy):\n  - **MP3** (MPEG-1 Layer 3) — исторический стандарт, 96–320 кбит/с.\n  - **AAC** (Advanced Audio Coding) — в iTunes, YouTube, потоковом радио; лучше MP3 при той же скорости.\n  - **Opus** (RFC 6716) — оптимизирован под VoIP и стриминг, 6–512 кбит/с, переменный, разработан Xiph.Org. WebRTC, Discord, YouTube Live.\n  - **G.722 / G.729 / AMR / AMR-WB** — VoIP-кодеки в сотовой связи.\n- **Lossless**: FLAC, ALAC, WavPack — без потерь, сжатие ×0,5–0,7.", "<h3>Цифровое видео</h3>", "Видео — последовательность **кадров** (frames), обычно 24–60 fps. Сырое HD-видео 1920×1080 × 24 бит × 30 fps ≈ 1,5 Гбит/с — компрессия обязательна.", "**Кодеки**:\n- **H.264 / AVC** (MPEG-4 Part 10, 2003) — самый распространённый, поддерживается всеми устройствами; типичные битрейты 1–10 Мбит/с для HD.\n- **H.265 / HEVC** (2013) — в 2 раза эффективнее H.264, требует лицензий; используется в 4K-стриминге.\n- **VP9** (Google) — открытый аналог HEVC, YouTube.\n- **AV1** (AOMedia 2018) — открытый и без роялти, ещё на 30% эффективнее HEVC; Netflix, YouTube, Twitch.\n- **H.266 / VVC** (2020), **AV2** — поколения следующего уровня.", "**Типы кадров** в современных кодеках:\n- **I-кадр (Intra-coded)** — ключевой, кодируется самостоятельно (как JPEG); полностью восстановим без других кадров. Большой размер.\n- **P-кадр (Predicted)** — предсказан из предыдущего I/P; кодируются только различия.\n- **B-кадр (Bidirectional)** — предсказан из обоих соседей (предыдущего и следующего); самый компактный, но добавляет задержку.", "Группа кадров между двумя I-кадрами — **GOP** (Group of Pictures); короткие GOP лучше для seek, длинные — для эффективности сжатия.", "Контейнеры: **MP4** (ISOBMFF), **MKV**, **WebM**, **MPEG-TS** (для бродкаста), **FLV** (устарел).", "<h3>Потоковая передача сохранённых файлов (VoD)</h3>", "**Streaming stored media** — пользователь смотрит видео, не дожидаясь полной загрузки. Современные технологии — **ABR** (Adaptive Bitrate Streaming):\n- Видео разбивается на короткие **сегменты** (2–10 с) в нескольких качествах (например, 240p, 480p, 720p, 1080p, 4K).\n- **Манифест** (m3u8 для HLS, .mpd для DASH) описывает доступные варианты.\n- Клиент скачивает по HTTP/HTTPS и **динамически переключается** между качествами в зависимости от полосы, состояния буфера и CPU.", "Основные стандарты:\n- **HLS** (HTTP Live Streaming, Apple, RFC 8216) — манифест .m3u8, сегменты в .ts или fMP4.\n- **MPEG-DASH** (ISO/IEC 23009-1) — открытый, fMP4-сегменты, .mpd-манифест.\n- **CMAF** (Common Media Application Format) — общий формат сегментов для HLS и DASH.\n- **Low-Latency HLS / Low-Latency DASH** — короткие сегменты + chunked transfer для задержки 2–4 с.", "Эти протоколы работают по обычному HTTP/HTTPS → легко кешируются на CDN.", "<h3>Live streaming</h3>", "**Реальное живое вещание**:\n- **RTMP** (Adobe, исторически) — публикация от стримера на сервер, низкая задержка.\n- **WebRTC** — для интерактивных трансляций с задержкой < 1 с.\n- **SRT** (Secure Reliable Transport) — современная замена RTMP, ARQ + FEC, низкая задержка.\n- **RTP / RTCP** — для классических VoIP/Видеоконференций (Q45).\n- ABR-формы для массовой раздачи: **LL-HLS**, **LL-DASH** (2–4 с задержки).", "<h3>Конференции в реальном времени</h3>", "Двусторонняя интерактивная коммуникация (VoIP, видеозвонок):\n- **SIP** (RFC 3261) — сигнализация: установка/завершение сессии, согласование медиа-параметров через **SDP** (Session Description Protocol).\n- **H.323** — устаревшая альтернатива SIP, ещё используется в корпоративных системах видеоконференцсвязи.\n- **RTP/SRTP** — собственно медиапоток (Q45).\n- **STUN/TURN/ICE** — обход NAT.\n- **WebRTC** (W3C/IETF) — стандарт браузерных P2P-видеозвонков без плагинов: getUserMedia, RTCPeerConnection, RTCDataChannel; основа Zoom Web, Google Meet, Discord, многих корпоративных решений.\n- **IMS / VoLTE / VoNR** — операторские стандарты на базе SIP+RTP.", "<h3>Проблемы и решения</h3>", "- **Джиттер** (jitter) — нестабильность задержки → **jitter buffer** на приёмнике сглаживает; для интерактивного аудио буфер 30–100 мс.\n- **Потери пакетов** — нельзя ждать повтор, поэтому **FEC** (Forward Error Correction), **PLC** (Packet Loss Concealment — приёмник «придумывает» потерянное), **interleaving** разбивают пачки потерь.\n- **Эхо** — **AEC** (Acoustic Echo Cancellation).\n- **Подавление шума** — **NS** (Noise Suppression) и DNN-фильтры.\n- **Конкуренция за полосу** — ABR для VoD, congestion-aware кодеки (Opus с переменным битрейтом).\n- **Задержка end-to-end**: целевые значения для VoIP ≤ 150 мс (ITU-T G.114), видеоконференций ≤ 200 мс, live-стриминга 1–10 с (ABR), VoD — не критично.", "<h3>Цифровое ТВ и broadcast</h3>", "- **DVB-T/T2** (Европа), **ATSC** (США), **ISDB** (Япония), **DTMB** (Китай) — наземное цифровое ТВ.\n- **DVB-S/S2** — спутниковое.\n- **DVB-C/C2** — кабельное.\n- **IPTV** — операторская доставка ТВ через IP (часто multicast)."], "terms": [{"ru": "GOP", "en": "Group of Pictures", "df": "группа кадров между I-кадрами"}, {"ru": "ABR", "en": "Adaptive Bitrate Streaming", "df": "адаптивный битрейт"}, {"ru": "HLS", "en": "HTTP Live Streaming", "df": "стандарт Apple"}, {"ru": "MPEG-DASH", "en": "Dynamic Adaptive Streaming over HTTP", "df": "стандарт ABR ISO"}], "summary": ["Мультимедиа — **60-80% интернет-трафика**; требует низкой задержки, устойчивости к потерям без повтора, массовости", "**Цифровое аудио — PCM**: частота × разрядность × каналы", "Телефон: 8 кГц × 8 бит = **64 кбит/с** (G.711); CD: 44,1 кГц × 16 бит × 2 = **1,411 Мбит/с**; Hi-Res 96/192 кГц × 24 бит", "**Кодеки lossy**: **MP3** (96-320 кбит/с), **AAC** (iTunes/YouTube, лучше MP3); **Opus** (RFC 6716, Xiph, 6-512 кбит/с, WebRTC/Discord)", "VoIP: G.722, G.729, AMR/AMR-WB; lossless: FLAC, ALAC, WavPack (×0,5-0,7)", "**Цифровое видео**: сырое 1920×1080 × 24бит × 30fps ≈ 1,5 Гбит/с → компрессия обязательна", "**Кодеки**: **H.264/AVC** (MPEG-4 Part 10, 2003, 1-10 Мбит/с HD); **H.265/HEVC** (×2 эффективнее H.264, лицензии, 4K); **VP9** (Google open); **AV1** (AOMedia 2018, без роялти, +30%); H.266/VVC, AV2", "**Типы кадров**: **I** (Intra, ключевой, как JPEG); **P** (Predicted, разности от предыдущего); **B** (Bidirectional, из обоих соседей, компактный, +задержка)", "**GOP** (Group of Pictures) — группа между I-кадрами; короткий GOP лучше seek, длинный — сжатие", "Контейнеры: **MP4** (ISOBMFF), MKV, **WebM**, MPEG-TS (broadcast), FLV (устарел)", "**VoD streaming — ABR** (Adaptive Bitrate): видео разбивается на **сегменты 2-10 с** в нескольких качествах (240p..4K)", "**Манифест** (m3u8 для HLS, .mpd для DASH); клиент динамически переключает качество по полосе/буферу/CPU", "Стандарты: **HLS** (Apple, RFC 8216, .m3u8 + .ts/fMP4); **MPEG-DASH** (ISO/IEC 23009-1, fMP4); **CMAF** (общий формат)", "**LL-HLS / LL-DASH** — задержка 2-4 с через короткие сегменты + chunked transfer; работают по HTTP/HTTPS → кэшируются на CDN", "**Live**: **RTMP** (Adobe, исторически); **SRT** (ARQ+FEC); **WebRTC** (<1 с); RTP/RTCP", "**Конференции**: **SIP** (RFC 3261) сигнализация + **SDP** (Session Description Protocol); H.323 устаревший; RTP/SRTP — медиа", "**STUN/TURN/ICE** — обход NAT; **WebRTC** (W3C/IETF) — браузерный P2P: getUserMedia, RTCPeerConnection, RTCDataChannel; основа Zoom Web, Meet, Discord; IMS/VoLTE/VoNR — операторы", "**Проблемы и решения**: **джиттер** → **jitter buffer** 30-100 мс; **потери** → FEC, **PLC** (Packet Loss Concealment), interleaving; эхо → AEC; шум → NS/DNN", "Целевые задержки: VoIP ≤150 мс (G.114), видеоконф. ≤200 мс, live 1-10 с, VoD не критично", "**Цифровое ТВ**: DVB-T/T2 (Европа), ATSC (США), ISDB (Япония), DTMB (Китай); DVB-S/S2 (спутник), DVB-C (кабель); **IPTV** часто multicast"]}, {"n": 54, "title": "FTP.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**FTP** (File Transfer Protocol, RFC 959, 1985) — один из старейших протоколов прикладного уровня Интернета (предшественник HTTP), предназначенный для передачи файлов и навигации по файловой системе удалённого сервера. Архитектурная особенность — использование **двух TCP-соединений**: одного для команд (control channel) и отдельного для каждого файла или листинга (data channel). FTP исторически широко применялся для размещения веб-контента и зеркалирования архивов; сегодня вытеснен более безопасными SFTP/SCP и HTTPS-API, но всё ещё встречается в инфраструктуре, embedded-системах и legacy-системах. Знание FTP — обязательный академический материал из-за его архитектурной особенности (out-of-band signaling) и истории.", "<h3>Архитектура: двухканальная модель</h3>", "FTP использует две параллельные TCP-сессии:", "- **Control Connection** — управляющее соединение:\n  - **Порт 21** на сервере.\n  - Постоянное на время всей FTP-сессии.\n  - Текстовые команды (Telnet NVT, ASCII), четырёхбуквенные имена.\n  - Серверные ответы — трёхзначные коды + текст.\n- **Data Connection** — соединение данных:\n  - Открывается **отдельно** для **каждой** передачи файла, листинга директории, потоковой загрузки.\n  - Закрывается по окончании передачи.\n  - Порт зависит от режима (active / passive).", "Раздельность каналов исторически связана с поддержкой полудуплексных терминалов и упрощением парсинга, но создаёт проблемы с NAT и firewall.", "<h3>Активный и пассивный режимы</h3>", "**Active mode** (PORT):\n1. Клиент открывает локальный порт N и шлёт серверу команду `PORT 192,168,1,5,P1,P2` (адрес и порт N = P1×256 + P2).\n2. **Сервер** инициирует TCP-соединение с локального порта 20 к клиенту:N.\n3. Проблема: входящие соединения на клиента почти всегда блокируются NAT и firewall, поэтому active режим работает редко.", "**Passive mode** (PASV):\n1. Клиент шлёт команду `PASV`.\n2. Сервер открывает случайный порт и сообщает его клиенту в ответе `227 Entering Passive Mode (h1,h2,h3,h4,p1,p2)`.\n3. **Клиент** инициирует TCP-соединение к серверу.\n4. Работает через NAT клиента; стандарт на практике.\n5. **EPSV / EPRT** — расширения IPv6 (RFC 2428).", "<h3>Основные команды и ответы</h3>", "| Команда | Назначение |\n|---|---|\n| USER user / PASS pwd | аутентификация |\n| ACCT | дополнительная учётная запись (редко) |\n| PWD | print working directory |\n| CWD path | change working directory |\n| CDUP | подняться на уровень вверх |\n| LIST [path] | листинг (расширенный, человекочитаемый) |\n| NLST [path] | имена файлов |\n| MLSD / MLST | машиночитаемый листинг (RFC 3659) |\n| RETR file | retrieve — скачать файл |\n| STOR file | store — загрузить файл |\n| APPE file | append |\n| DELE file | удалить файл |\n| RNFR + RNTO | переименование |\n| MKD / RMD | создать / удалить директорию |\n| TYPE A / I | режим ASCII / Image (binary) |\n| MODE / STRU | редкие настройки |\n| PORT / PASV / EPSV | согласование data-channel |\n| REST n | resume — продолжить с offset |\n| ABOR | прервать текущую передачу |\n| STAT / NOOP | состояние / keepalive |\n| QUIT | завершить сессию |", "**Ответы сервера** — трёхзначные коды + текст; первая цифра — категория:\n- **1xx** — положительный предварительный (110, 125 Data connection already open).\n- **2xx** — успех (200 OK, 220 Service ready, 226 Closing data connection, transfer complete).\n- **3xx** — промежуточный (331 User OK, need password; 350 Requested file action pending).\n- **4xx** — временная ошибка (425 Can't open data connection; 450 File busy).\n- **5xx** — постоянная (530 Login incorrect; 550 File not found).", "<h3>Типы передачи</h3>", "- **ASCII (TYPE A)** — текст с конверсией line-endings между ОС (CRLF↔LF); сегодня почти всегда используется только I.\n- **Image / Binary (TYPE I)** — байт-в-байт; стандарт по умолчанию для всех файлов.", "<h3>Безопасность и преемники</h3>", "Базовый FTP **передаёт логин, пароль и данные в открытом виде** — фундаментальная проблема. Решения:", "- **FTPS** (FTP Secure / FTP over TLS, RFC 4217) — стандартный FTP с STARTTLS на control channel (`AUTH TLS`); существует «explicit» (порт 21 + STARTTLS) и «implicit» (порт 990 сразу TLS) варианты. Сохраняет двухканальную архитектуру и связанные проблемы с NAT.\n- **SFTP** (SSH File Transfer Protocol) — **отдельный протокол** поверх SSH, не имеет общего кода с FTP, несмотря на похожее имя. Один канал, всё шифровано, отлично работает через NAT. Стандартный выбор.\n- **SCP** — простой файловый transfer поверх SSH (устарел в пользу SFTP).\n- **HTTPS + REST/WebDAV** — для веб-API передачи.\n- **rsync over SSH** — для синхронизации больших каталогов.\n- **AWS S3 / Azure Blob / S3-compatible API** — облачное хранение.", "<h3>Аутентификация: anonymous FTP</h3>", "Исторически массово использовался **anonymous FTP**: имя пользователя `anonymous`, пароль — любой (обычно e-mail). На таких серверах хостились публичные архивы (программы, документация, ftp.gnu.org, ftp.debian.org). Сейчас почти полностью вытеснен HTTPS."], "terms": [{"ru": "FTP", "en": "RFC 959", "df": "протокол передачи файлов на TCP"}], "summary": ["**FTP** (File Transfer Protocol, RFC 959, 1985) — старейший прикладной протокол; передача файлов; вытеснен SFTP/HTTPS, но академически важен", "**Архитектурная особенность — два TCP-соединения** (out-of-band signaling)", "**Control Connection**: **порт 21** на сервере, постоянное на сессию, ASCII-команды (Telnet NVT), 4-буквенные имена", "**Data Connection**: открывается **отдельно для каждой передачи** (файл/листинг), закрывается по окончании", "Раздельность каналов создаёт **проблемы с NAT и firewall**", "**Active mode (PORT)**: клиент шлёт `PORT h1,h2,h3,h4,p1,p2`; **сервер инициирует соединение от порта 20** к клиенту:N", "Active не работает через NAT клиента (входящие блокируются firewall)", "**Passive mode (PASV)**: клиент шлёт `PASV` → сервер отвечает `227 Entering Passive Mode (h,p1,p2)` → **клиент инициирует** к серверу", "Passive работает через NAT клиента — стандарт на практике; **EPSV/EPRT** (RFC 2428) — расширения IPv6", "**Команды аутентификации**: `USER user`, `PASS pwd`, ACCT (редко)", "**Навигация**: `PWD`, `CWD path`, `CDUP`; `LIST [path]` (human-readable), `NLST` (имена), **`MLSD/MLST`** (машиночитаемый, RFC 3659)", "**Файловые операции**: **`RETR file`** (скачать), **`STOR file`** (загрузить), `APPE` (append), `DELE`, `RNFR + RNTO` (rename), MKD/RMD", "**`TYPE A`** — ASCII (с конверсией CRLF↔LF); **`TYPE I`** — Image/Binary (по умолчанию)", "**`REST n`** — resume с offset; `ABOR` — прервать; `STAT/NOOP`; `QUIT`", "**Коды ответов**: **1xx** preliminary (125 Data conn ready); **2xx** OK (220 Service, 226 Transfer complete); **3xx** intermediate (331 User OK, need pass)", "**4xx** temp (425, 450); **5xx** permanent (**530 Login incorrect**, **550 File not found**)", "Фундаментальная проблема: **логин/пароль/данные передаются в открытом виде**", "Решения: **FTPS** (FTP+TLS, RFC 4217) — `AUTH TLS` explicit (порт 21) или implicit (порт 990); сохраняет двухканальность", "**SFTP** — **отдельный протокол поверх SSH** (не FTP!); один канал, всё шифровано, дружит с NAT — стандартный выбор", "**SCP** (устарел), **HTTPS+REST/WebDAV**, **rsync over SSH**, AWS S3/Azure Blob; **anonymous FTP** (anonymous + email) — публичные архивы (ftp.gnu.org, ftp.debian.org), почти всё вытеснено HTTPS"]}, {"n": 55, "title": "ICMP. Ping. Traceroute.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**ICMP** (Internet Control Message Protocol, RFC 792) — вспомогательный протокол сетевого уровня, технически встроенный в IP, для **сигнализации об ошибках и диагностики**. ICMP не переносит пользовательский трафик; его сообщения используются маршрутизаторами и хостами для обратной связи о проблемах доставки и для активной проверки достижимости. На ICMP базируются классические диагностические утилиты **ping** и **traceroute** — первый инструмент любого сетевого инженера. В IPv6 функциональность расширена в **ICMPv6**, включающем **NDP** (Neighbor Discovery), который заменяет ARP, и **MLD** (multicast).", "<h3>Положение ICMP в стеке</h3>", "- **Протокол IP-номер 1** для IPv4 (значение в поле Protocol IP-заголовка).\n- **Протокол IP-номер 58** для IPv6 (ICMPv6).\n- Несмотря на работу прямо поверх IP, ICMP логически относится к сетевому уровню; некоторые источники считают его «частью» уровня сетевого.", "<h3>Формат сообщения ICMP</h3>", "| Поле | Длина | Назначение |\n|---|---|---|\n| Type | 8 бит | категория сообщения |\n| Code | 8 бит | подкатегория |\n| Checksum | 16 бит | контрольная сумма |\n| Rest of Header | 32 бит | зависит от типа (ID/Seq для echo и т. д.) |\n| Data | переменная | в сообщениях об ошибках — IP-заголовок + первые 8 байт исходного пакета |", "<h3>Основные типы ICMP (IPv4)</h3>", "**Сообщения об ошибках**:\n- **Type 3 — Destination Unreachable**: с кодами 0=Net Unreachable, 1=Host Unreachable, 3=Port Unreachable, 4=**Fragmentation Needed and DF set** (используется в PMTUD), 13=Communication Administratively Prohibited.\n- **Type 11 — Time Exceeded**: 0=TTL expired (используется traceroute), 1=Fragment reassembly timeout.\n- **Type 12 — Parameter Problem**: неверный заголовок.\n- **Type 5 — Redirect**: лучший маршрут известен (сегодня обычно отключают по безопасности).\n- **Type 4 — Source Quench**: устарел, не используется.", "**Запросы/ответы (диагностика)**:\n- **Type 8 / Type 0 — Echo Request / Echo Reply**: ping.\n- **Type 13 / Type 14 — Timestamp Request / Reply**.\n- **Type 17 / Type 18 — Address Mask Request / Reply** (устарели).\n- **Type 9 / Type 10 — Router Advertisement / Solicitation** (исторически; в IPv6 переработаны).", "<h3>Утилита ping</h3>", "Самый известный диагностический инструмент: проверяет достижимость хоста и измеряет RTT.", "Принцип:\n1. Источник шлёт **ICMP Echo Request (Type 8)** с произвольной payload и идентификатором/sequence-number.\n2. Целевой хост отвечает **ICMP Echo Reply (Type 0)** с той же payload и идентификатором.\n3. Источник измеряет время round-trip; формирует статистику серии пакетов.", "Параметры: число пакетов (`-c N`), размер payload (`-s N`), интервал (`-i N`), TTL (`-t N`), DF (`-M do` в Linux), интервал «зонда».", "Полезно для:\n- Проверки L3-доступности.\n- Измерения RTT и его флуктуаций (джиттера).\n- Выявления потерь и MTU (с `-M do`).\n- Path MTU Discovery вручную.", "Часть фаерволов блокирует ICMP, поэтому отсутствие ответа ≠ хост недоступен.", "<h3>Утилита traceroute / tracert</h3>", "Показывает **последовательность маршрутизаторов** на пути к целевому хосту.", "Принцип:\n1. Отправляются пакеты с возрастающим TTL: 1, 2, 3, …\n2. Маршрутизатор, у которого TTL после декремента становится 0, отбрасывает пакет и шлёт обратно **ICMP Time Exceeded (Type 11)**.\n3. По обратным сообщениям и их временам прихода реконструируется список хопов.\n4. Когда пакет достигает цели, она отвечает либо ICMP (если ping-зонд), либо ICMP Port Unreachable (если UDP на высокий порт), либо TCP-RST/SYN-ACK.", "Варианты реализации:\n- **Unix traceroute**: по умолчанию UDP с высокими портами (33434+); работает там, где ICMP echo блокируется, но требует ответа ICMP Port Unreachable.\n- **Windows tracert**: ICMP Echo Request с возрастающим TTL.\n- **TCP traceroute** (tcptraceroute, hping3): использует TCP SYN — проходит через большинство firewall'ов.\n- **mtr** (My TraceRoute) — гибрид ping+traceroute, непрерывно обновляет статистику.", "**Ограничения**:\n- Маршрутизаторы могут не отвечать ICMP (firewall, rate-limiting).\n- Асимметричные пути: traceroute показывает forward path; обратный путь может отличаться.\n- Тоннели MPLS могут «скрываться» (если LSR с TTL-pipe-режимом).\n- Anycast: разные пакеты могут попасть к разным узлам.", "<h3>ICMPv6</h3>", "**ICMPv6** (RFC 4443) — расширенная версия для IPv6, объединяющая в себе функции:\n- Сообщений об ошибках (Type 1–4): Destination Unreachable, Packet Too Big (вместо IPv4 Fragmentation Needed), Time Exceeded, Parameter Problem.\n- Запросов Echo (Type 128/129).\n- **NDP** (Neighbor Discovery Protocol, RFC 4861): Router Solicitation / Advertisement (Type 133/134), Neighbor Solicitation / Advertisement (Type 135/136), Redirect (Type 137) — заменяют ARP, ICMP Router Discovery, IGMP-redirect.\n- **MLD** (Multicast Listener Discovery, аналог IGMP, Type 130–132).", "ICMPv6 нельзя слишком агрессивно блокировать в firewall'ах: без NDP и Packet Too Big стек IPv6 ломается. Рекомендации — RFC 4890.", "<h3>Безопасность и злоупотребления</h3>", "- **Ping flood**, **Smurf attack** (ICMP echo на broadcast от подделанного адреса), **Ping of Death** — старые DoS-атаки.\n- **ICMP tunneling** — туннелирование данных в payload Echo для обхода firewall.\n- **Path MTU Discovery blackhole** — фаервол блокирует ICMP «Fragmentation Needed», и TCP-соединения с большими пакетами молча умирают.\n- Поэтому полное блокирование ICMP — плохая практика; нужно блокировать целево."], "terms": [{"ru": "ICMP", "en": "Internet Control Message Protocol, RFC 792", "df": "протокол управляющих сообщений"}, {"ru": "ICMPv6", "en": "RFC 4443", "df": "аналог для IPv6"}, {"ru": "RTT", "en": "Round-Trip Time", "df": "время кругового обхода"}, {"ru": "NDP", "en": "Neighbor Discovery Protocol", "df": "обнаружение соседей в IPv6"}, {"ru": "PMTUD", "en": "Path MTU Discovery", "df": "определение MTU по ICMP-сообщениям"}], "summary": ["**ICMP** (Internet Control Message Protocol, RFC 792) — вспомогательный протокол сетевого уровня для **сигнализации об ошибках и диагностики**", "Не переносит пользовательских данных; используется маршрутизаторами и хостами", "**Protocol number 1** для IPv4, **58** для IPv6 (ICMPv6); логически часть L3", "**Формат ICMP**: **Type** 8б + **Code** 8б + Checksum 16б + Rest of Header 32б + Data", "В сообщениях об ошибках Data содержит IP-заголовок + первые 8 байт исходного пакета (порты L4)", "**Сообщения об ошибках (IPv4)**: **Type 3 Destination Unreachable** (Code 0=Net, 1=Host, 3=Port, **4=Fragmentation Needed + DF**, 13=Admin Prohibited)", "**Type 11 Time Exceeded** (Code 0=TTL expired — основа traceroute; 1=Reassembly timeout)", "Type 12 Parameter Problem; Type 5 Redirect (обычно отключают по безопасности); Type 4 Source Quench (устарел)", "**Запросы/ответы**: **Type 8 Echo Request / Type 0 Echo Reply** (ping); Type 13/14 Timestamp; Type 17/18 Address Mask (устарели)", "**ping**: ICMP Echo Request (Type 8) → Echo Reply (Type 0); измеряет **RTT** и потери", "Параметры ping: `-c N` (число), `-s N` (размер), `-i N` (интервал), `-t N` (TTL), `-M do` (DF для PMTUD)", "Применение: L3-достижимость, RTT/джиттер, PMTUD вручную; firewall может блокировать ICMP → нет ответа ≠ хост недоступен", "**traceroute / tracert**: пакеты с возрастающим TTL=1,2,3...; роутер возвращает **ICMP Time Exceeded (Type 11)**", "По обратным сообщениям реконструируется список хопов; цель отвечает ICMP/ICMP-Port-Unreachable/TCP-RST", "**Unix traceroute**: UDP на высокие порты 33434+ (нужен ICMP Port Unreachable от цели)", "**Windows tracert**: ICMP Echo Request с возрастающим TTL; **tcptraceroute/hping3**: TCP SYN (проходит firewall); **mtr** — ping+traceroute непрерывно", "Ограничения: rate-limit/firewall на роутерах, асимметричные пути (forward path), MPLS-туннели скрываются, anycast → разные узлы", "**ICMPv6** (RFC 4443): Type 1-4 (Destination Unreachable, **Packet Too Big** вместо Frag Needed, Time Exceeded, Parameter Problem); Echo 128/129", "**NDP** (RFC 4861, Type 133-137): Router/Neighbor Solicitation/Advertisement, Redirect — заменяет ARP, ICMP Router Discovery; **MLD** Type 130-132 (аналог IGMP)", "ICMPv6 нельзя жёстко блокировать (без NDP/PTB IPv6 ломается, RFC 4890); атаки: **Ping flood**, **Smurf**, Ping of Death, ICMP tunneling, **PMTUD blackhole** (молчат большие пакеты)"]}], "quizzes": []}, {"id": 8, "name": "Вопросы безопасности", "questions": [{"n": 56, "title": "Основы информационной безопасности.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Информационная безопасность** (ИБ, information security) — комплексная дисциплина обеспечения **защиты информации и информационных систем** от случайных или преднамеренных нарушений конфиденциальности, целостности и доступности. ИБ охватывает технические, организационные, правовые, физические меры. Современная **кибербезопасность** (cybersecurity) — её часть, фокусирующаяся на цифровых системах и сетях. Базовый каркас обоих понятий — модель **CIA-триады**, дополняемая принципами управления рисками и эшелонированной защиты.", "<h3>Триада CIA</h3>", "- **C — Confidentiality (Конфиденциальность)** — информация доступна только тем, кто авторизован. Нарушения: утечки данных, перехват трафика, кража документов. Контрмеры: шифрование, контроль доступа, классификация информации.\n- **I — Integrity (Целостность)** — данные не были изменены неавторизованно. Нарушения: подмена платежей, фальсификация логов, mitm-инжекции. Контрмеры: цифровые подписи, MAC/HMAC, контрольные суммы.\n- **A — Availability (Доступность)** — информация и сервисы доступны авторизованным пользователям, когда это нужно. Нарушения: DDoS, разрушение хранилищ, отказы оборудования. Контрмеры: резервирование, бэкапы, защита от DDoS, мониторинг.", "Расширения:\n- **AAA** — Authentication, Authorization, Accounting (Q65).\n- **CIANA** — добавляет Non-repudiation, Authenticity.\n- **Privacy** (приватность) — отдельный аспект, связанный с обработкой персональных данных.", "<h3>Определение безопасной системы</h3>", "Формально: **только авторизованные субъекты выполняют только авторизованные действия над только разрешёнными объектами**. Любое отклонение — инцидент.", "<h3>Базовые понятия</h3>", "- **Актив** (asset) — то, что мы защищаем: данные, инфраструктура, репутация.\n- **Угроза** (threat) — потенциальная причина нежелательного события (хакер, стихия, инсайдер, ошибка). Бывает **намеренной** и **случайной**.\n- **Уязвимость** (vulnerability) — слабость, которой может воспользоваться угроза: непропатченный софт, слабый пароль, отсутствие сегментации.\n- **Атака** (attack) — реализация угрозы через уязвимость.\n- **Эксплойт** (exploit) — конкретное техническое средство реализации.\n- **Риск** (risk) = вероятность × ущерб; оценивается количественно или качественно.\n- **Воздействие / последствие** (impact) — потери от инцидента.\n- **Инцидент** — фактический случай нарушения ИБ.", "Модель **Threat × Vulnerability × Asset → Risk**. Управление = выявление, оценка, обработка.", "<h3>Типы атак</h3>", "По воздействию:\n- **Пассивные** — перехват, прослушивание (sniffing), traffic analysis. Не меняют данные, трудно обнаружить.\n- **Активные** — модификация, подмена (spoofing), MITM, DoS, инжекции.", "По вектору:\n- **Сетевые** (network) — на уровне передачи: DDoS, MITM, BGP-hijack.\n- **Прикладные** (application) — SQL-инъекции, XSS, RCE, deserialization.\n- **Физические** — кража носителей, side-channel.\n- **Социальная инженерия** — фишинг, vishing, претекстинг.\n- **Цепочка поставок** (supply chain) — компрометация через стороннее ПО или подрядчиков (SolarWinds).\n- **Insider** — со стороны сотрудников.", "По цели:\n- Хищение информации, шантаж (ransomware), нарушение работы, шпионаж, диверсия, репутационный ущерб.", "<h3>Управление риском</h3>", "Жизненный цикл (ISO 27005, NIST SP 800-30):\n1. **Идентификация активов и угроз**.\n2. **Оценка уязвимостей и риска** (количественная или качественная).\n3. **Обработка**:\n   - **Снижение** (mitigation) — внедрение контролей.\n   - **Принятие** (acceptance) — низкие риски.\n   - **Передача** (transfer) — страхование, аутсорсинг.\n   - **Избегание** (avoidance) — отказ от рискованной деятельности.\n4. **Мониторинг и пересмотр**.", "<h3>Базовые принципы безопасности</h3>", "- **Least Privilege** — субъекту даются только те права, которые необходимы для задачи.\n- **Defense in Depth** — несколько независимых эшелонов защиты (firewall + IDS + EDR + аудит).\n- **Fail-Safe Defaults** — по умолчанию запретить, явно разрешить (default deny).\n- **Separation of Duties** — критические операции требуют согласия нескольких лиц.\n- **Need to Know** — доступ только к строго необходимым данным.\n- **Open Design** (Kerckhoffs) — стойкость системы должна основываться на секретности ключа, а не алгоритма.\n- **Complete Mediation** — каждый доступ проверяется.\n- **Psychological Acceptability** — безопасность должна быть удобна, иначе её обходят.\n- **Economy of Mechanism** — простые системы безопаснее сложных.\n- **Zero Trust** — никому не доверять по умолчанию, всегда проверять.", "<h3>Жизненный цикл реагирования на инциденты</h3>", "Стандарт NIST SP 800-61:\n1. **Preparation** — план, обучение.\n2. **Detection & Analysis** — обнаружение SOC/SIEM, классификация.\n3. **Containment, Eradication, Recovery** — изоляция, удаление, восстановление.\n4. **Post-Incident Activity** — разбор, обновление процедур."], "terms": [], "summary": ["**Информационная безопасность** (ИБ) — комплексная защита информации/систем от нарушений конфиденциальности/целостности/доступности", "Технические + организационные + правовые + физические меры; **кибербезопасность** — её цифровая часть", "**Триада CIA**: **C — Confidentiality** (только авторизованные могут читать; шифрование, контроль доступа, классификация)", "**I — Integrity** (данные не изменены неавторизованно; цифровые подписи, MAC/HMAC, контрольные суммы)", "**A — Availability** (доступны, когда нужны; резервирование, бэкапы, защита от DDoS, мониторинг)", "Расширения: **AAA** (Authentication/Authorization/Accounting, Q65); **CIANA** (+Non-repudiation, Authenticity); **Privacy**", "Безопасная система = **только авторизованные субъекты выполняют только разрешённые действия над только разрешёнными объектами**", "**Базовые понятия**: **Asset** (актив, что защищаем); **Threat** (потенциальная причина, намеренная/случайная); **Vulnerability** (слабость)", "**Attack** (реализация), **Exploit** (техсредство), **Risk = Likelihood × Impact**, **Impact** (ущерб), **Incident** (фактический случай)", "Модель: Threat × Vulnerability × Asset → Risk; управление = выявление + оценка + обработка", "**Типы атак по воздействию**: **пассивные** (sniffing, traffic analysis, трудно обнаружить); **активные** (modification, spoofing, MITM, DoS, инъекции)", "По вектору: **сетевые** (DDoS, MITM, BGP-hijack); **прикладные** (SQLi, XSS, RCE, deserialization); физические (кража, side-channel); **социальная инженерия** (phishing); **supply chain** (SolarWinds); **insider**", "По цели: хищение, шантаж (ransomware), нарушение работы, шпионаж, диверсия, репутация", "**Управление риском** (ISO 27005, NIST SP 800-30): 1) идентификация активов/угроз; 2) оценка; 3) обработка; 4) мониторинг", "**Стратегии обработки**: **mitigation** (контроли), **acceptance** (низкий), **transfer** (страхование/аутсорс), **avoidance** (отказ)", "**Принципы**: **Least Privilege**, **Defense in Depth** (несколько эшелонов), **Default Deny** (Fail-Safe Defaults), **Separation of Duties**", "**Need to Know**, **Open Design / Kerckhoffs** (стойкость в ключе, не в алгоритме), Complete Mediation, Psychological Acceptability, Economy of Mechanism", "**Zero Trust** — никому не доверять, всегда проверять (NIST SP 800-207)", "**Реагирование на инциденты** (NIST SP 800-61): Preparation → Detection & Analysis → Containment/Eradication/Recovery → Post-Incident", "Стандарты: ISO 27001/27005, NIST SP 800-x; операционные: **SOC / SIEM / EDR / SOAR**"]}, {"n": 57, "title": "Типы атак. Вредоносное ПО.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "Кибератаки разнообразны по технике, цели и уровню стека, на котором происходят. Их полезно классифицировать по нескольким осям: **на что направлены** (доступность, конфиденциальность, целостность), **на каком уровне** (сеть, ОС, приложение, человек), **активны или пассивны**. Отдельная большая категория — **вредоносное ПО** (malware), включающее вирусы, черви, трояны, шпионы, ransomware, rootkit'ы, ботнеты и т. д. Знание классификаций критично для проектирования защиты — каждая категория требует своих контрмер.", "<h3>DoS / DDoS</h3>", "**DoS** (Denial of Service) — нарушение **доступности** сервиса. Атакующий исчерпывает ресурсы цели: CPU, память, полосу пропускания, сессии, файловые дескрипторы.", "**DDoS** (Distributed DoS) — атака с тысяч и миллионов узлов (**ботнет** из заражённых машин — Mirai, Bashlite). Современные ботнеты достигают пиков в десятки Тбит/с.", "Уровни DDoS:\n- **Volumetric (L3/L4)**:\n  - **UDP flood** — массовая отправка UDP-датаграмм.\n  - **ICMP flood** — отправка Echo Request.\n  - **Amplification / reflection** — Smurf (ICMP broadcast), DNS amplification, NTP, Memcached (×50 000), SSDP. Атакующий шлёт небольшие запросы с подделкой src-IP жертвы; «отражатели» шлют гигантские ответы.\n- **Protocol (L4)**:\n  - **SYN flood** — массовая отправка SYN без завершения handshake; сервер тратит ресурсы на полуоткрытые соединения. Защита — SYN cookies.\n  - **TCP RST/ACK flood**, fragmentation atks.\n  - **Ping of Death**, Teardrop — исторические.\n- **Application (L7)**:\n  - **HTTP flood / Slowloris** — медленное удержание открытых соединений.\n  - Сложные «бот-атаки» имитирующие пользователей.", "Защита: **scrubbing-центры** (Cloudflare, AWS Shield, Akamai), **anycast**, **rate limiting**, **BGP Flowspec**, **TCP SYN cookies**, **CAPTCHA**, фильтры WAF.", "<h3>Атаки на конфиденциальность</h3>", "- **Sniffing** (перехват трафика) — Wireshark, tcpdump, открытый Wi-Fi. Пассивно читает пакеты. Защита: шифрование (HTTPS, TLS, IPSec, VPN).\n- **Side-channel attacks** — атаки по побочным каналам: тайминги, потребление энергии, акустика, кэш-атаки (Spectre, Meltdown).\n- **Cold-boot / Evil maid** — физический доступ к устройству.", "<h3>Атаки на целостность и перенаправление трафика</h3>", "- **MITM** (Man-in-the-Middle) — атакующий вклинивается в соединение, может читать и менять данные.\n- **ARP-spoofing** — подмена записей ARP в LAN → перенаправление трафика на атакующего.\n- **DHCP-spoofing** — rogue DHCP-сервер.\n- **DNS-spoofing / cache poisoning** — Kaminsky-атака.\n- **BGP hijacking** — анонс чужого префикса в публичный BGP (печально известны случаи с Pakistan Telecom vs YouTube, 2008).\n- **DDoS на маршрутизацию** — отдельная категория.\n- **SSL stripping** — деградация HTTPS до HTTP.\n- **TLS downgrade / Logjam / POODLE / BEAST / Heartbleed / FREAK** — атаки на криптопротоколы.", "Защита: HTTPS с HSTS, DNSSEC, RPKI для BGP, 802.1X для LAN, мониторинг.", "<h3>Прикладные атаки</h3>", "- **SQL Injection** — внедрение SQL-команд через пользовательский ввод.\n- **XSS** (Cross-Site Scripting) — внедрение JavaScript в страницу другого пользователя.\n- **CSRF** (Cross-Site Request Forgery).\n- **SSRF** (Server-Side Request Forgery).\n- **RCE** (Remote Code Execution) — Log4Shell, Shellshock, Heartbleed.\n- **Buffer overflow / Use-after-free / Race conditions**.\n- **Path traversal**, **deserialization**, **XXE** (XML External Entity).\n- **OWASP Top 10** — каноническая классификация веб-уязвимостей.", "<h3>Социальная инженерия</h3>", "- **Фишинг** (phishing) — поддельные письма/сайты.\n- **Spear phishing** — целевой фишинг конкретного сотрудника.\n- **Vishing / Smishing** — голос / SMS.\n- **Pretexting** — выдача себя за службу.\n- **Watering hole** — заражение часто посещаемых жертвой сайтов.", "<h3>Вредоносное ПО (Malware)</h3>", "- **Virus** — внедряется в исполняемый файл; распространяется при запуске заражённого файла; требует действия пользователя.\n- **Worm** — самораспространяющийся, использует уязвимости сети (без действия пользователя). Примеры: **Morris worm** (1988), **Code Red**, **Slammer**, **Conficker**, **WannaCry** (2017, EternalBlue + ransomware).\n- **Trojan Horse** — маскируется под легитимное ПО; не саморазмножается; обычно открывает **backdoor**.\n- **Spyware** — тайный сбор данных: пароли, история, скриншоты. **Keylogger** — перехват клавиатуры.\n- **Adware** — навязчивая реклама.\n- **Rootkit** — скрывает присутствие; модифицирует ядро ОС, MBR, BIOS/UEFI (**bootkit**). Эфирно непроверяемые из заражённой системы.\n- **Bootkit / firmware malware** — уровни ниже ОС.\n- **Ransomware** — шифрует данные жертвы и требует выкуп: WannaCry, NotPetya, REvil, LockBit.\n- **Cryptominer** — скрытно использует CPU/GPU для майнинга криптовалют.\n- **Banking trojan** — Zeus, Emotet, TrickBot, Dridex.\n- **RAT** (Remote Access Trojan) — полный удалённый контроль.\n- **Botnet client** — узел DDoS-армии (Mirai, Mēris).\n- **Logic bomb** — срабатывает по условию.\n- **Fileless malware** — живёт только в памяти, в скриптах PowerShell/JS.\n- **APT** (Advanced Persistent Threat) — целенаправленные многомесячные операции спецслужб.", "Каналы заражения: phishing-вложения, malicious links, drive-by downloads, exploit kits, supply-chain (компрометация обновлений), USB, документы с макросами."], "terms": [{"ru": "MITM", "en": "Man-in-the-Middle", "df": "атака «человек посередине»"}, {"ru": "RAT", "en": "Remote Access Trojan", "df": "троян удалённого доступа"}, {"ru": "APT", "en": "Advanced Persistent Threat", "df": "продвинутая постоянная угроза"}], "summary": ["Атаки классифицируют по цели (CIA), уровню стека (сеть/ОС/прикл./человек), активности", "**DoS** — нарушение доступности; исчерпание ресурсов (CPU/память/полоса/сессии/FD)", "**DDoS** — с тысяч/миллионов узлов **ботнета** (Mirai, Bashlite); пики десятки Тбит/с", "**Volumetric L3/L4**: **UDP flood**, **ICMP flood**, **Amplification/Reflection** (Smurf, **DNS/NTP/Memcached** ×50000, SSDP)", "**Protocol L4**: **SYN flood** (полуоткрытые соединения, защита — **SYN cookies**); TCP RST/ACK; Ping of Death/Teardrop (исторические)", "**Application L7**: **HTTP flood**, **Slowloris** (медленное удержание); сложные бот-атаки имитирующие пользователей", "**Защита DDoS**: **scrubbing-центры** (Cloudflare, AWS Shield, Akamai), anycast, rate limiting, BGP Flowspec, **SYN cookies**, CAPTCHA, WAF", "**Конфиденциальность**: **Sniffing** (Wireshark, открытый Wi-Fi) → защита TLS/IPSec/VPN", "**S
