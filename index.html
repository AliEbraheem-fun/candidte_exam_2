тографии.","","**Зачем:** решает проблему распределения симметричного ключа.","","**Аналогия — краски:**","- Алиса и Боб договариваются о публичном цвете (жёлтый).","- Алиса смешивает с секретным красным → оранжевый → шлёт.","- Боб смешивает с секретным синим → зелёный → шлёт.","- Алиса: зелёный + красный; Боб: оранжевый + синий → **одинаковый цвет**.","- Подслушивающий видит жёлтый/оранжевый/зелёный, но не может «разделить» смесь.","","**Математика:**","1. **Публичные параметры:** большое простое p и g (генератор).","2. **Секретные числа:** Алиса выбирает a, Боб — b.","3. **Публичные ключи:** A = g^a mod p; B = g^b mod p. Обмениваются.","4. **Общий секрет:** Алиса: K = B^a mod p. Боб: K = A^b mod p. Одно и то же: K = g^(ab) mod p.","","**Безопасность:** основана на сложности **дискретного логарифма** — по g^a mod p найти a практически невозможно (для p в 2048+ бит).","","**Уязвимость — MITM:**","- Чистый DH **не защищён от атаки «человек посередине»**.","- Злоумышленник заменяет публичные ключи своими.","- **Решение:** аутентифицировать ключи цифровой подписью (так делает TLS).","","**ECDH (Elliptic Curve DH):**","- На эллиптических кривых.","- При той же стойкости — **короче ключи** (256 бит ECDH ≈ 3072 бит классического DH).","","**Эфемерный DH (DHE, ECDHE):**","- a и b **новые для каждой сессии**, потом удаляются.","- Обеспечивает **Forward Secrecy**.","","**Применение:** TLS 1.3 (обязательно), IPSec IKE, SSH, WireGuard, Signal.","","**Для устного:** DH не сам по себе — всегда с аутентификацией (сертификат). Иначе MITM."]},{"n":69,"title":"Отечественные стандарты: функция хеширования, шифры, электронная подпись. Процесс стандартизации, требования. Использование отечественных стандартизированных решений.","paragraphs":["В России существует набор собственных криптографических стандартов. Они разработаны для использования в государственных органах, банках и системах, где требуется лицензия ФСБ. Многие из них параллельны международным, но имеют свои особенности.","**Шифры (симметричное шифрование).**","**ГОСТ 28147-89.** Первый советский/российский блочный шифр. Ключ 256 бит, блок 64 бит. Основан на сети Фейстеля с 32 раундами. Использует S-блоки (таблицы подстановок), которые в оригинале были секретными — каждый сектор применял свои. Долго был основным российским стандартом. Сейчас считается устаревшим из-за короткого блока (64 бит — уязвим к атаке дней рождений).","**ГОСТ Р 34.12-2015 — «Магма».** Тот же ГОСТ 28147-89, но с фиксированным публичным набором S-блоков. Стандартизирован для совместимости.","**ГОСТ Р 34.12-2015 — «Кузнечик» (Grasshopper).** Современный блочный шифр. Блок 128 бит, ключ 256 бит. Подстановочно-перестановочная сеть (SPN) с 10 раундами. Назван в честь кузнечика из сказки Чуковского. Быстрее и безопаснее Магмы.","**ГОСТ Р 34.13-2015.** Стандарт режимов работы блочных шифров: ECB, CBC, OFB, CFB, CTR, MAC.","**Функция хеширования.**","**ГОСТ Р 34.11-94.** Первый российский стандарт хеширования. 256 бит. Сейчас устарел.","**ГОСТ Р 34.11-2012 — «Стрибог» (Streebog).** Современная хеш-функция. Выходы **256 или 512 бит**. Основана на конструкции Миягути-Пренеля. Назван в честь славянского бога ветра. Заменила старую ГОСТ Р 34.11-94. Используется в электронной подписи и протоколах.","**Электронная подпись.**","**ГОСТ Р 34.10-94.** Первый стандарт — на модульной арифметике (как DSA).","**ГОСТ Р 34.10-2001.** Переход на эллиптические кривые. Заменён в 2012 году.","**ГОСТ Р 34.10-2012.** Современный стандарт электронной подписи. Алгоритм на **эллиптических кривых**. Использует хеш-функцию Стрибог. Длина подписи 512 или 1024 бит (в зависимости от параметров кривой). Обязательна для квалифицированной электронной подписи в России.","**Обмен ключами.**","**VKO** (Выработка Ключа Общего). Российский аналог **Диффи-Хеллмана** на эллиптических кривых. Описан в Р 1323565.1.020-2020.","**Процесс стандартизации в России.** Стандартизация криптографии — государственная задача. Участвуют несколько организаций.","**Разработка.** Алгоритмы создаются в специализированных институтах (ФГУП НИИ «Квант», ФСБ, академические институты).","**Технический комитет ТК-26.** «Криптографическая защита информации» при Росстандарте. Обсуждает и готовит проекты стандартов.","**ФСБ России.** Силовая структура, отвечающая за государственную безопасность. Имеет исключительное право **лицензировать** деятельность по разработке и использованию средств криптографической защиты. Требует **сертификации** криптосредств в своей испытательной лаборатории.","**ФСТЭК России** (Федеральная служба по техническому и экспортному контролю). Отвечает за **техническую защиту** информации (не криптографическую). Выдаёт лицензии на разработку и эксплуатацию средств защиты от НСД (несанкционированного доступа).","**Росстандарт.** Утверждает ГОСТы.","**Требования к средствам криптографической защиты.**","**Сертификация.** Средство должно быть сертифицировано ФСБ. Сертификат подтверждает, что реализация соответствует стандартам и безопасна.","**Классы защиты.** Средства делятся на классы КС1, КС2, КС3, КВ1, КВ2, КА1 — по уровню угроз, против которых они эффективны.","**Лицензирование.** Организации, разрабатывающие или внедряющие криптосредства, должны иметь лицензию ФСБ.","**Использование только сертифицированных средств** в государственных информационных системах — обязательное требование законов.","**Использование отечественных стандартизированных решений.**","**Государственные информационные системы (ГИС).** По закону должны использовать сертифицированные средства криптографической защиты.","**Квалифицированная электронная подпись (ФЗ-63).** Обязательно на основе ГОСТ Р 34.10-2012. Нужна для подачи документов в госорганы, участия в госзакупках, сдачи налоговой отчётности.","**Банковские системы.** Центральный банк РФ требует применения ГОСТ в межбанковских системах, системе быстрых платежей (СБП).","**Защита персональных данных (ФЗ-152).** В госорганах и при обработке специальных категорий.","**Критическая информационная инфраструктура (ФЗ-187).** Требования к объектам КИИ: энергетика, транспорт, связь, оборона.","**Продукты с отечественной криптографией.**","**КриптоПро CSP** — криптопровайдер для Windows. Добавляет поддержку ГОСТ в систему. Самый распространённый в России.","**КриптоПро JCP** — реализация ГОСТ для Java.","**Signal-COM.** Криптопровайдер.","**ViPNet.** Программно-аппаратный комплекс для VPN на основе ГОСТ. Применяется во многих госорганах.","**Континент.** Отечественный межсетевой экран и VPN. Сертифицирован ФСБ и ФСТЭК.","**Dallas Lock, Secret Net.** Средства защиты от НСД."],"terms":[{"ru":"Кузнечик","en":"Grasshopper / Kuznyechik","df":"российский блочный шифр ГОСТ Р 34.12-2015 (блок 128 бит, ключ 256 бит)"},{"ru":"Магма","en":"Magma","df":"российский блочный шифр (обновлённый ГОСТ 28147-89)"},{"ru":"Стрибог","en":"Streebog","df":"российская хеш-функция ГОСТ Р 34.11-2012 (256 или 512 бит)"},{"ru":"ТК-26","en":"Technical Committee 26","df":"технический комитет «Криптографическая защита информации» при Росстандарте"},{"ru":"ФСБ","en":"FSB","df":"Федеральная служба безопасности — лицензирует и сертифицирует криптографию"},{"ru":"ФСТЭК","en":"FSTEC","df":"Федеральная служба по техническому и экспортному контролю"}],"summary":["","**Суть:** Россия имеет собственные криптографические ГОСТы для госорганов, банков, ЭП.","","**Шифры:**","- **ГОСТ 28147-89** — первый советский. 256 бит ключ, 64 бит блок. Устарел.","- **Магма (ГОСТ Р 34.12-2015)** — обновление 28147-89 с публичными S-блоками.","- **Кузнечик (ГОСТ Р 34.12-2015)** — современный. Блок **128 бит**, ключ **256 бит**. SPN-сеть, 10 раундов.","- **ГОСТ Р 34.13-2015** — режимы (ECB, CBC, CTR, OFB, CFB, MAC).","","**Хеш-функция:**","- **ГОСТ Р 34.11-94** — устарел.","- **Стрибог (ГОСТ Р 34.11-2012)** — современная. Выход **256 или 512 бит**. Основана на конструкции Миягути-Пренеля.","","**Электронная подпись:**","- **ГОСТ Р 34.10-94** — модульная арифметика, устарел.","- **ГОСТ Р 34.10-2001** — эллиптические кривые.","- **ГОСТ Р 34.10-2012** — современный. Эллиптические кривые + Стрибог. **Обязательно** для квалифицированной ЭП.","","**Обмен ключами:**","- **VKO (Выработка Ключа Общего)** — аналог Диффи-Хеллмана на кривых. Р 1323565.1.020-2020.","","**Процесс стандартизации в России:**","1. Разработка в **НИИ, ФСБ, академических институтах**.","2. **ТК-26** («Криптографическая защита информации» при Росстандарте) — обсуждает проекты.","3. **ФСБ** — лицензирует криптографию, сертифицирует средства.","4. **ФСТЭК** — регулирует техническую защиту (не крипто).","5. **Росстандарт** — утверждает ГОСТы.","","**Классы защиты:** КС1, КС2, КС3, КВ1, КВ2, КА1 — по уровню угроз.","","**Использование:**","- **ГИС** (госсистемы) — обязательно сертифицированные средства.","- **Квалифицированная ЭП (ФЗ-63)** — на основе ГОСТ Р 34.10-2012. Для госзакупок, налоговой.","- **Банки** — ЦБ РФ требует ГОСТ в межбанковских системах, СБП.","- **ФЗ-152 (ПДн)**, **ФЗ-187 (КИИ)**.","","**Продукты:**","- **КриптоПро CSP** — криптопровайдер для Windows (самый распространённый).","- **КриптоПро JCP** — для Java.","- **ViPNet** — VPN на ГОСТ.","- **Континент** — firewall + VPN.","","**Для устного:** Международные алгоритмы в госсфере запрещены — нужны сертифицированные ГОСТ."]},{"n":70,"title":"Зарубежные стандарты: функция хеширования, шифры, электронная подпись. Процесс стандартизации, требования.","paragraphs":["В мире существует несколько международных и национальных организаций, которые разрабатывают стандарты криптографии. Их алгоритмы используются в большинстве современных систем — TLS, IPSec, SSH, банковских картах.","**Основные стандартизирующие организации.**","**NIST (National Institute of Standards and Technology, США).** Самая влиятельная организация по криптографии в мире. Публикует стандарты **FIPS** (Federal Information Processing Standards) и **Special Publications (SP)**. Алгоритмы, принятые NIST, обычно становятся мировыми стандартами, потому что их используют сначала правительство США, а затем весь мир.","**ISO/IEC.** Международная организация по стандартизации. Объединяет национальные стандарты. Важный стандарт: **ISO/IEC 27001** (управление информационной безопасностью).","**IETF (Internet Engineering Task Force).** Публикует **RFC** — стандарты Интернета. TLS, IPSec, HTTPS, SSH — это RFC от IETF.","**IEEE.** Стандарты сетей: 802.11 (Wi-Fi с WPA/WPA2/WPA3), 802.1X (аутентификация в сетях).","**ETSI** (European Telecommunications Standards Institute). Европейские стандарты.","**ITU-T.** Международный союз электросвязи. Стандарт X.509 для сертификатов.","**Шифры (симметричное шифрование).**","**DES (Data Encryption Standard, 1977).** FIPS 46. Первый открытый мировой стандарт. Ключ 56 бит, блок 64 бит. Разработан IBM и одобрен NBS (предшественник NIST). Взломан в 1999 году (за 22 часа на специальном устройстве).","**3DES (Triple DES).** Применение DES трижды с двумя или тремя разными ключами. Работал, но медленный. Сейчас устарел.","**AES (Advanced Encryption Standard, 2001).** FIPS 197. Современный мировой стандарт. Блок 128 бит, ключи 128/192/256 бит. Выбран NIST после **открытого международного конкурса** (1997–2000). Победил алгоритм **Rijndael** бельгийских авторов (Йоан Дэмен и Винсент Рэймен). Используется везде: TLS, файловое шифрование, Wi-Fi WPA2/3, протоколы VPN.","**ChaCha20 (2008).** Современный поточный шифр от Дэниела Бернштейна. Быстрее AES на устройствах **без аппаратной поддержки AES** (многие мобильные). Используется в TLS 1.3 и WireGuard.","**Blowfish, Twofish.** Работы Брюса Шнайера. Twofish был одним из финалистов конкурса AES.","**Функции хеширования.**","**MD5 (1991).** Рональд Ривест. 128 бит. Сломан: найдены реальные коллизии. Не использовать в безопасности.","**SHA-1 (1995).** NSA/NIST. 160 бит. Устарел: в 2017 году Google продемонстрировал практическую коллизию (атака SHAttered).","**SHA-2 (2001).** FIPS 180-4. Семейство: SHA-224, SHA-256, SHA-384, SHA-512. Основной современный стандарт. Используется в TLS, цифровой подписи, Bitcoin.","**SHA-3 (2015).** FIPS 202. Новое семейство, выбрано через **открытый конкурс NIST** (2007–2012). Основано на алгоритме **Keccak** (авторы — те же, что разработали AES). Не замена SHA-2, а альтернатива на случай проблем. Совершенно другая внутренняя конструкция (губковая).","**BLAKE2, BLAKE3.** Современные быстрые хеш-функции, участвовали в конкурсе SHA-3.","**Асимметричная криптография и электронная подпись.**","**RSA (1977).** Ривест, Шамир, Адельман. Основан на сложности факторизации больших чисел. Используется для шифрования и подписи. Стандартизирован в PKCS #1 (RSA Laboratories) и RFC 8017.","**DSA (Digital Signature Algorithm, 1991).** FIPS 186. Стандарт электронной подписи от NIST. Основан на дискретном логарифме.","**ECDSA (Elliptic Curve DSA).** Версия DSA на эллиптических кривых. Используется в TLS, Bitcoin, документах с электронной подписью.","**EdDSA, Ed25519 (2011).** Современный алгоритм подписи на кривой Curve25519. Быстрее и безопаснее ECDSA в реализации. Используется в SSH (OpenSSH), Signal, мессенджерах.","**Обмен ключами.**","**Diffie-Hellman (DH).** Классический, 1976.","**ECDH.** На эллиптических кривых.","**Curve25519.** Популярная кривая от Д. Бернштейна. Используется в TLS 1.3, Signal, WireGuard.","**Протоколы и приложения.**","**TLS** (IETF RFC 8446 для TLS 1.3, RFC 5246 для 1.2) — защита соединений в Интернете.","**IPSec** (RFC 4301 и другие) — защита IP-трафика.","**Kerberos** (RFC 4120) — аутентификация в корпоративных сетях.","**OAuth 2.0** (RFC 6749) — авторизация.","**OpenID Connect** — аутентификация.","**X.509** (ITU-T X.509, RFC 5280) — формат сертификатов для PKI.","**Процесс стандартизации в мире.**","**Открытые конкурсы NIST.** Самый известный пример мирового подхода: **конкурс AES** (1997–2000) и **конкурс SHA-3** (2007–2012). Работают так:","**Этап 1.** NIST объявляет требования к алгоритму и открывает приём заявок от криптографов всего мира.","**Этап 2.** Получает десятки предложений от команд со всего мира.","**Этап 3.** Международное сообщество криптографов **публично анализирует** все предложения — ищет слабости, публикует атаки.","**Этап 4.** NIST отбирает финалистов. После дополнительного анализа выбирает победителя.","**Этап 5.** Стандартизация, публикация FIPS.","**Почему так работает.** Открытый процесс гарантирует, что любая слабость будет найдена публично до стандартизации. Это соответствует принципу Керкгоффса.","**Требования к стандартизируемым алгоритмам.**","**Стойкость (security).** Защита от всех известных атак в течение 30+ лет.","**Производительность (performance).** Быстрая работа на разном оборудовании.","**Гибкость (flexibility).** Поддержка разных режимов, длин ключей.","**Простота (simplicity).** Чем проще алгоритм, тем легче его анализировать и правильно реализовать.","**Открытость (openness).** Никаких секретных параметров. Никаких патентов, ограничивающих использование.","**Стандарты управления безопасностью.**","**ISO/IEC 27001.** Система управления информационной безопасностью (ISMS). Международная сертификация.","**ISO/IEC 27002.** Практические рекомендации к 27001.","**PCI DSS.** Payment Card Industry Data Security Standard. Для всех, кто обрабатывает платёжные карты (мерчанты, процессинговые компании). Создан консорциумом Visa, MasterCard и других.","**NIST Cybersecurity Framework (CSF).** Методология. Пять функций: Identify, Protect, Detect, Respond, Recover.","**GDPR** (General Data Protection Regulation, 2018). Европейский закон о защите персональных данных. Жёсткие требования и штрафы до 4% оборота компании.","**HIPAA.** Закон США о защите медицинской информации.","**Постквантовая криптография (Post-Quantum Cryptography).** Будущее угроза — квантовые компьютеры смогут легко взломать RSA, DH, ECC (алгоритм Шора). NIST провёл конкурс по выбору алгоритмов, устойчивых к квантовым компьютерам. Победители (июль 2022):","**CRYSTALS-Kyber** — обмен ключами.","**CRYSTALS-Dilithium** — подпись (основной стандарт).","**Falcon, SPHINCS+** — альтернативные стандарты подписи.","**Стандарты.** FIPS 203 (Kyber), FIPS 204 (Dilithium), FIPS 205 (SPHINCS+) опубликованы в 2024 году."],"terms":[{"ru":"NIST","en":"National Institute of Standards and Technology","df":"американская организация стандартизации; FIPS, SP"},{"ru":"FIPS","en":"Federal Information Processing Standards","df":"федеральные стандарты США (FIPS 197 = AES)"},{"ru":"AES","en":"Advanced Encryption Standard","df":"мировой стандарт симметричного шифрования (FIPS 197)"},{"ru":"SHA-2","en":"Secure Hash Algorithm 2","df":"основное современное семейство хеш-функций (SHA-256, SHA-512)"},{"ru":"PCI DSS","en":"Payment Card Industry Data Security Standard","df":"стандарт безопасности для платёжных карт"},{"ru":"Keccak","en":"Keccak","df":"алгоритм-победитель конкурса SHA-3"}],"summary":["","**Суть:** Мировые стандарты криптографии, принятые через открытые процессы.","","**Организации:**","- **NIST** (США) — FIPS и Special Publications. Самая влиятельная.","- **ISO/IEC** — международные стандарты (27001).","- **IETF** — RFC (TLS, IPSec, HTTPS).","- **IEEE** — сети (802.11).","- **ETSI** (Европа), **ITU-T** (X.509).","","**Шифры:**","- **DES** (1977, FIPS 46) — 56 бит, взломан в 1999.","- **3DES** — тройной DES, устарел.","- **AES** (2001, FIPS 197) — **мировой стандарт**. 128/192/256 бит. Выбран **открытым конкурсом NIST** (1997–2000), победил **Rijndael** (Бельгия).","- **ChaCha20** (2008, Бернштейн) — быстрый поточный, для мобильных.","","**Хеш-функции:**","- **MD5** — 128 бит, сломан.","- **SHA-1** — 160 бит, в 2017 Google продемонстрировал коллизию (SHAttered).","- **SHA-2** (FIPS 180-4) — SHA-224/256/384/512. **Основной стандарт**.","- **SHA-3** (2015, FIPS 202) — Keccak. Выбран **конкурсом NIST** (2007–2012). Альтернатива SHA-2.","- **BLAKE2, BLAKE3** — быстрые альтернативы.","","**Асимметрия и подпись:**","- **RSA** (1977) — факторизация. PKCS #1, RFC 8017.","- **DSA** (FIPS 186) — дискретный логарифм.","- **ECDSA** — DSA на кривых. Используется в TLS, Bitcoin.","- **Ed25519** (2011) — на Curve25519, быстрый. SSH, Signal.","","**Обмен ключами:** DH, **ECDH**, **Curve25519** (TLS 1.3, WireGuard, Signal).","","**Протоколы:**","- **TLS** (RFC 8446 — TLS 1.3).","- **IPSec** (RFC 4301).","- **Kerberos** (RFC 4120).","- **OAuth 2.0** (RFC 6749).","- **X.509** (RFC 5280).","","**Процесс стандартизации — открытые конкурсы NIST:**","1. NIST объявляет требования и приём заявок.","2. Десятки предложений от криптографов мира.","3. **Публичный анализ** — поиск слабостей всеми желающими.","4. Отбор финалистов.","5. Выбор победителя.","6. Публикация FIPS.","","**Почему открыто:** гарантирует, что слабости найдены до стандартизации. Принцип Керкгоффса.","","**Требования к алгоритмам:**","1. **Стойкость** — защита от атак на 30+ лет.","2. **Производительность** — скорость на разном железе.","3. **Гибкость** — разные режимы, длины ключей.","4. **Простота** — легче анализировать и реализовать.","5. **Открытость** — без патентов, без секретных параметров.","","**Управление безопасностью:**","- **ISO/IEC 27001** — ISMS.","- **ISO/IEC 27002** — рекомендации.","- **PCI DSS** — платёжные карты.","- **NIST CSF** — пять функций: Identify, Protect, Detect, Respond, Recover.","- **GDPR** (Европа, 2018) — персональные данные, штрафы до 4% оборота.","- **HIPAA** (США) — медицина.","","**Постквантовая криптография:**","- Квантовые компьютеры взломают RSA/DH/ECC (алгоритм Шора).","- Конкурс NIST 2016–2022. Победители:","- **CRYSTALS-Kyber** — обмен ключами (FIPS 203).","- **CRYSTALS-Dilithium** — подпись (FIPS 204).","- **Falcon, SPHINCS+** — альтернативные (FIPS 205).","","**Для устного:** AES и SHA-3 — примеры того, как открытые конкурсы дают надёжные стандарты."]}],"quizzes":[{"type":"mcq","topic":"Вопрос 56","q":"Какие три свойства составляют классическую триаду информационной безопасности (CIA)?","opts":["Конфиденциальность, целостность, доступность","Конфиденциальность, идентификация, авторизация","Целостность, аутентификация, доступность","Шифрование, целостность, аудит"],"ans":0,"expl":"Классическая триада ИБ — CIA: конфиденциальность (Confidentiality), целостность (Integrity), доступность (Availability)."},{"type":"tf","topic":"Вопрос 56","q":"Формула оценки риска: Risk = Probability × Impact.","ans":true,"expl":"Риск (risk) — вероятность реализации угрозы с учётом её последствий: Risk = Probability × Impact."},{"type":"mcq","topic":"Вопрос 57","q":"Какая атака заполняет таблицу полуоткрытых TCP-соединений?","opts":["UDP flood","HTTP flood","SYN flood","Smurf"],"ans":2,"expl":"SYN flood — заполнение таблицы полуоткрытых соединений."},{"type":"tf","topic":"Вопрос 57","q":"Сетевой червь (worm), в отличие от вируса, распространяется по сети автономно, без участия пользователя.","ans":true,"expl":"Сетевой червь (worm) — самовоспроизводящаяся программа, распространяющаяся по сети автономно, без участия пользователя. Вирус требует участия пользователя."},{"type":"mcq","topic":"Вопрос 58","q":"Какая модель управления доступом назначает права на основе ролей, а не пользователей?","opts":["DAC","MAC","RBAC","Default Deny"],"ans":2,"expl":"RBAC (Role-Based Access Control) — права назначаются ролям, а не пользователям."},{"type":"tf","topic":"Вопрос 58","q":"В модели MAC (Mandatory Access Control) владелец объекта сам задаёт права доступа.","ans":false,"expl":"В MAC политика задаётся администратором с использованием меток конфиденциальности. Владелец задаёт права в модели DAC (Discretionary Access Control)."},{"type":"mcq","topic":"Вопрос 59","q":"Какой метод антивирусной защиты запускает подозрительный код в изолированной среде (песочнице)?","opts":["Сканирование сигнатур","Контроль целостности","Эвристический анализ","Поведенческий анализ (sandboxing)"],"ans":3,"expl":"Отслеживание поведения программ (behavioral analysis, sandboxing) — запуск кода в изолированной среде (песочнице)."},{"type":"tf","topic":"Вопрос 59","q":"Сканирование сигнатур способно обнаруживать zero-day угрозы и полиморфные вирусы.","ans":fals function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}

function kwColor(s){
  // Bold **...** → orange
  s = s.replace(/\*\*(.+?)\*\*/g, '<span class="kw kw-concept">$1</span>');
  // English in parens
  s = s.replace(/\(([A-Za-z][A-Za-z0-9\s\/\.\-\+,&;:]+?)\)/g, function(m, inner){
    return '(<span class="kw kw-en">'+inner+'</span>)';
  });
  // Protocols
  PROTOS.forEach(p => {
    const re = new RegExp('(?<![\\wА-Яа-яёЁ])(' + p.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&') + ')(?![\\wА-Яа-яёЁ])','g');
    s = s.replace(re, '<span class="kw kw-proto">$1</span>');
  });
  // Standards
  STDS.forEach(st => {
    const re = new RegExp('(?<![\\wА-Яа-яёЁ])(' + st.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&') + ')(?![\\wА-Яа-яёЁ])','g');
    s = s.replace(re, '<span class="kw kw-std">$1</span>');
  });
  // Abbreviations
  ABBRS.forEach(ab => {
    const re = new RegExp('(?<![\\wА-Яа-яёЁ"\\/])(' + ab.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&') + ')(?![\\wА-Яа-яёЁ])','g');
    s = s.replace(re, '<span class="kw kw-abbr">$1</span>');
  });
  return s;
}

function renderShort(lines){
  let html=''; let inList=false;
  const closeList=()=>{ if(inList){ html+='</ul>'; inList=false; } };
  for(const raw of lines){
    const line=raw.replace(/\t/g,'  ');
    const trimmed=line.trim();
    if(trimmed===''){ closeList(); html+='<div class="sh-sp"></div>'; continue; }
    // Bullet line: starts with "- " or "* "
    const bulletMatch=trimmed.match(/^[-*]\s+(.*)$/);
    if(bulletMatch){
      if(!inList){ html+='<ul class="sh-ul">'; inList=true; }
      html+='<li class="sh-li">'+colorize(bulletMatch[1])+'</li>';
      continue;
    }
    // Numbered list: "1. " etc.
    const numMatch=trimmed.match(/^\d+\.\s+(.*)$/);
    if(numMatch){
      if(!inList){ html+='<ul class="sh-ul">'; inList=true; }
      html+='<li class="sh-li">'+colorize(numMatch[1])+'</li>';
      continue;
    }
    // Table row: starts with "|"
    if(trimmed.startsWith('|')){
      closeList();
      // Simple table passthrough — just render as code-ish text
      html+='<div class="sh-tbl">'+colorize(trimmed.replace(/\|/g,' │ '))+'</div>';
      continue;
    }
    // Header-like: starts with "**" (bold section)
    closeList();
    html+='<div class="sh-p">'+colorize(trimmed)+'</div>';
  }
  closeList();
  return html;
}

function colorize(text){
  // Split into lines and process markdown lists
  const lines = text.split('\n');
  let html = '';
  let inUl = false, inSub = false;
  for (const raw of lines) {
    const line = raw.trimEnd();
    const subMatch = line.match(/^\s{2,}-\s+(.*)/);
    const topMatch = line.match(/^-\s+(.*)/);
    if (subMatch) {
      if (!inSub) { html += '<ul class="md-sub">'; inSub = true; }
      html += '<li>' + kwColor(esc(subMatch[1])) + '</li>';
    } else if (topMatch) {
      if (inSub) { html += '</ul>'; inSub = false; }
      if (!inUl) { html += '<ul class="md-list">'; inUl = true; }
      html += '<li>' + kwColor(esc(topMatch[1])) + '</li>';
    } else {
      if (inSub) { html += '</ul>'; inSub = false; }
      if (inUl) { html += '</ul>'; inUl = false; }
      html += kwColor(esc(line)) + ' ';
    }
  }
  if (inSub) html += '</ul>';
  if (inUl) html += '</ul>';
  return html.trim();
}

let view='home', topicIdx=-1;
const reviewSeen={};
let quizQs=[],quizIdx=0,quizScore=0,quizAnswered=false,quizResults=[],matchState={};

function init(){renderSidebar();renderHome()}

function renderSidebar(){
  const nav=document.getElementById('navList');
  let h=`<div class="nav-item ${view==='home'?'active':''}" onclick="goHome()">
    <div class="nav-num" style="background:var(--purple);color:#000">&#9776;</div>
    <div class="nav-text">Главная</div></div>`;
  TOPICS.forEach((t,i)=>{
    h+=`<div class="nav-item ${topicIdx===i&&view!=='home'?'active':''}" onclick="selectTopic(${i})">
      <div class="nav-num">T${t.id}</div>
      <div class="nav-text">${t.name.substring(0,38)}${t.name.length>38?'…':''}</div></div>`;
  });
  nav.innerHTML=h;
}

function goHome(){view='home';topicIdx=-1;renderSidebar();renderHome();closeSidebar();}

function renderHome(){
  document.getElementById('topTitle').textContent='Главная';
  document.getElementById('topRight').innerHTML='';
  let total=TOPICS.reduce((s,t)=>s+t.questions.length,0);
  let h=`<div class="home-title">Кандидатский экзамен — Блок 3</div>
    <div class="home-sub">Системы, сети и устройства телекоммуникаций · ${total} вопросов · 8 тем</div>
    <div class="topics-grid">`;
  TOPICS.forEach((t,i)=>{
    h+=`<div class="topic-card" onclick="selectTopic(${i})">
      <div class="topic-card-num">Тема ${t.id}</div>
      <div class="topic-card-name">${esc(t.name)}</div>
      <div class="topic-card-info"><span>&#128196; ${t.questions.length} вопр.</span><span>&#9997; ${t.quizzes.length} тест.</span></div>
      <div class="topic-card-btns">
        <button class="tc-btn primary" onclick="event.stopPropagation();selectTopic(${i},'review')">Обзор</button>
        <button class="tc-btn" onclick="event.stopPropagation();selectTopic(${i},'quiz')">Тест</button>
      </div></div>`;
  });
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}

function selectTopic(i,mode){
  topicIdx=i;view=mode||'review';
  if(!reviewSeen[TOPICS[i].id])reviewSeen[TOPICS[i].id]=new Set();
  renderSidebar();
  if(view==='review')renderReview();else startQuiz();
  closeSidebar();
}

function renderReview(){
  const t=TOPICS[topicIdx];
  document.getElementById('topTitle').textContent=`Тема ${t.id} · ${t.name}`;
  document.getElementById('topRight').innerHTML=`
    <button class="btn-sm active-tab" onclick="switchMode('review')">Обзор</button>
    <button class="btn-sm" onclick="switchMode('quiz')">Тест</button>
    <button class="btn-sm" onclick="goHome()">&#8962;</button>`;

  let h=`<div class="back-btn" onclick="goHome()">&#8592; Все темы</div>
    <div class="expand-bar">
      <button class="btn-sm" onclick="toggleAll(true)">&#9660; Раскрыть все</button>
      <button class="btn-sm" onclick="toggleAll(false)">&#9650; Свернуть все</button>
    </div>`;

  t.questions.forEach((q,qi)=>{
    reviewSeen[t.id].add(qi);
    const ansHTML=q.paragraphs.map(p=>`<p>${colorize(p)}</p>`).join('');
    const termsHTML=q.terms.map(tm=>`
      <div class="t-card">
        <div class="t-ru">${esc(tm.ru)}</div>
        <div class="t-en">${esc(tm.en)}</div>
        <div class="t-df">${esc(tm.df)}</div>

    h+=`<div class="q-item">
      <div class="q-hdr" onclick="toggleQ(this)">
        <div class="q-badge">В${q.n}</div>
        <div class="q-ttl">${esc(q.title)}</div>
        <button class="copy-btn" onclick="event.stopPropagation();copyQ(this)">Копировать вопрос</button>
        <div class="q-chev">&#9660;</div>
      </div>
      <div class="q-body">
        <div class="a-section">
          <div class="a-label">Ответ<button class="copy-btn" onclick="copyAns(this)">Копировать</button></div>
          <div class="a-text">${ansHTML}</div>
        </div>
        ${q.terms.length?`<div class="a-section">
          <div class="a-label">Терминология<button class="copy-btn" onclick="copyAns(this)">Копировать</button></div>
          <div class="t-grid">${termsHTML}</div>
        </div>`:''}
        ${q.summary&&q.summary.length?`<div class="a-section">
          <div class="sum-box">
            <div class="sum-title">Краткий ответ (шпаргалка)<button class="copy-btn" onclick="copySum(this)">Копировать</button></div>
            <div class="sum-list">${renderShort(q.summary)}</div>

      </div></div>`;
  });

  document.getElementById('mainArea').scrollTo({top:0});
  updateProgress();
}

function copyAns(btn){
  const sec=btn.closest('.a-section');
  const el=sec.querySelector('.a-text')||sec.querySelector('.t-grid');
  navigator.clipboard.writeText(el.innerText).then(()=>{
    btn.textContent='Скопировано!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Копировать';btn.classList.remove('copied')},1500);
  });
}
function copyQ(btn){
  const hdr=btn.closest('.q-hdr');
  const txt=hdr.querySelector('.q-badge').innerText+'. '+hdr.querySelector('.q-ttl').innerText;
  navigator.clipboard.writeText(txt).then(()=>{
    btn.textContent='Скопировано!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Копировать вопрос';btn.classList.remove('copied')},1500);
  });
}
function copySum(btn){
  const txt=btn.closest('.sum-box').querySelector('.sum-list').innerText;
  navigator.clipboard.writeText(txt).then(()=>{
    btn.textContent='Скопировано!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Копировать';btn.classList.remove('copied')},1500);
  });
}
function toggleQ(el){
  const b=el.nextElementSibling,c=el.querySelector('.q-chev');
  const o=b.classList.contains('visible');
  b.classList.toggle('visible',!o);c.classList.toggle('open',!o);
}
function toggleAll(open){
  document.querySelectorAll('.q-body').forEach(b=>b.classList.toggle('visible',open));
  document.querySelectorAll('.q-chev').forEach(c=>c.classList.toggle('open',open));
}

// ─── INLINE QUIZ (per question) ───
function renderInlineQuiz(topic, qn, qi) {
  const prefix = `Вопрос ${qn}`;
  const qs = topic.quizzes.filter(q => q.topic === prefix);
  if (!qs.length) return '';
  const id = `iq_${topic.id}_${qi}`;
  let h = `<div class="a-section iq-section"><div class="iq-box"><div class="iq-title">Проверь себя (${qs.length})</div>`;
  qs.forEach((q, i) => {
    const uid = `${id}_${i}`;
    if (q.type === 'mcq') {
      const letters = 'ABCD';
      h += `<div class="iq-item" id="${uid}"><div class="iq-q">${esc(q.q)}</div><div class="iq-opts">`;
      q.opts.forEach((o, oi) => {
        h += `<div class="iq-opt" onclick="iqMCQ('${uid}',${oi},${q.ans})" id="${uid}_o${oi}"><div class="iq-ltr">${letters[oi]}</div><div>${esc(o)}</div></div>`;
      });
      h += `</div><div class="iq-fb" id="${uid}_fb">${esc(q.expl)}</div></div>`;
    } else if (q.type === 'tf') {
      h += `<div class="iq-item" id="${uid}"><div class="iq-q">${esc(q.q)}</div><div class="iq-tf">`;
      h += `<button class="iq-tf-btn" id="${uid}_t" onclick="iqTF('${uid}',true,${q.ans})">&#10004; Верно</button>`;
      h += `<button class="iq-tf-btn" id="${uid}_f" onclick="iqTF('${uid}',false,${q.ans})">&#10008; Неверно</button>`;
      h += `</div><div class="iq-fb" id="${uid}_fb">${esc(q.expl)}</div></div>`;
    } else if (q.type === 'match') {
      // Render match as a simpler "review pairs" display for inline
      h += `<div class="iq-item"><div class="iq-q">${esc(q.q)}</div>`;
      h += `<div class="t-grid">`;
      q.pairs.forEach(p => {
        h += `<div class="t-card"><div class="t-ru">${esc(p.l)}</div><div class="t-en">${esc(p.r)}</div></div>`;
      });
      h += `</div></div>`;
    }
  });
  h += `</div></div>`;
  return h;
}

function iqMCQ(uid, picked, correct) {
  const item = document.getElementById(uid);
  if (item.dataset.done) return;
  item.dataset.done = '1';
  item.querySelectorAll('.iq-opt').forEach(el => el.classList.add('iq-dis'));
  document.getElementById(`${uid}_o${picked}`).classList.add(picked === correct ? 'iq-ok' : 'iq-no');
  if (picked !== correct) document.getElementById(`${uid}_o${correct}`).classList.add('iq-ok');
  const fb = document.getElementById(`${uid}_fb`);
  fb.classList.add('show', picked === correct ? 'iq-fb-ok' : 'iq-fb-no');
}

function iqTF(uid, picked, correct) {
  const item = document.getElementById(uid);
  if (item.dataset.done) return;
  item.dataset.done = '1';
  document.querySelectorAll(`#${uid} .iq-tf-btn`).forEach(b => b.classList.add('iq-dis'));
  const clickedBtn = document.getElementById(`${uid}_${picked ? 't' : 'f'}`);
  const correctBtn = document.getElementById(`${uid}_${correct ? 't' : 'f'}`);
  clickedBtn.classList.add(picked === correct ? 'iq-ok' : 'iq-no');
  if (picked !== correct) correctBtn.classList.add('iq-ok');
  const fb = document.getElementById(`${uid}_fb`);
  fb.classList.add('show', picked === correct ? 'iq-fb-ok' : 'iq-fb-no');
}

// ─── QUIZ ───
function startQuiz(){
  const t=TOPICS[topicIdx];quizQs=[...t.quizzes];shuffle(quizQs);
  quizIdx=0;quizScore=0;quizResults=[];quizAnswered=false;matchState={};renderQuizUI();
}

function renderQuizUI(){
  const t=TOPICS[topicIdx];
  document.getElementById('topTitle').textContent=`Тема ${t.id} · Тест`;
  document.getElementById('topRight').innerHTML=`
    <button class="btn-sm" onclick="switchMode('review')">Обзор</button>
    <button class="btn-sm active-tab" onclick="switchMode('quiz')">Тест</button>
    <button class="btn-sm" onclick="goHome()">&#8962;</button>`;
  if(!quizQs.length){document.getElementById('content').innerHTML=`<div class="res-card"><div class="res-title">Нет тестов</div><button class="btn-q btn-q-p" onclick="switchMode('review')">К обзору</button></div>`;return;}
  if(quizIdx>=quizQs.length){renderQuizResults();return;}
  const q=quizQs[quizIdx];
  const bg={mcq:'badge-mcq',tf:'badge-tf',match:'badge-match',fill:'badge-fill'};
  const lb={mcq:'Выбор',tf:'Верно/Неверно',match:'Сопоставление',fill:'Заполнить'};
  let body='';
  if(q.type==='mcq'){
    body='<div class="options">';
    'ABCD'.split('').forEach((l,oi)=>{if(oi<q.opts.length)body+=`<div class="option" onclick="selMCQ(${oi})" id="opt${oi}"><div class="o-letter">${l}</div><div class="o-text">${esc(q.opts[oi])}</div></div>`;});
    body+='</div>';
  }else if(q.type==='tf'){
    body=`<div class="tf-options"><button class="tf-btn" id="tfT" onclick="selTF(true)">&#10004; Верно</button><button class="tf-btn" id="tfF" onclick="selTF(false)">&#10008; Неверно</button></div>`;
  }else if(q.type==='match'){
    matchState={left:null,matched:[],pairs:q.pairs};
    const sr=[...q.pairs].map((p,i)=>({...p,oi:i}));shuffle(sr);matchState.sr=sr;
    body=`<div class="match-container"><div class="match-col"><h4>Термин</h4>${q.pairs.map((p,i)=>`<div class="match-item" id="ml${i}" onclick="selML(${i})">${esc(p.l)}</div>`).join('')}</div><div class="match-col"><h4>Перевод</h4>${sr.map((p,i)=>`<div class="match-item" id="mr${i}" onclick="selMR(${i})">${esc(p.r)}</div>`).join('')}</div></div>`;
  }else if(q.type==='fill'){
    body=`<div class="fill-wrap"><input class="fill-input" id="fillIn" placeholder="Ответ..." onkeypress="if(event.key==='Enter')chkFill()"><button class="btn-q btn-q-p" onclick="chkFill()">Проверить</button></div>`;
  }
  document.getElementById('content').innerHTML=`<div class="quiz-card"><span class="qt-badge ${bg[q.type]}">${lb[q.type]}</span><div style="color:var(--muted);font-size:.78rem;margin-bottom:10px">${esc(q.topic)}</div><div class="q-text">${esc(q.q)}</div>${body}<div class="feedback" id="fb"></div><div class="quiz-nav"><div class="quiz-progress">${quizIdx+1}/${quizQs.length}</div><button class="btn-q btn-q-p" id="nxtBtn" onclick="nxtQ()" disabled>&#8594; Далее</button></div></div>`;
  quizAnswered=false;document.getElementById('mainArea').scrollTo({top:0});
}

function selMCQ(i){if(quizAnswered)return;quizAnswered=true;const q=quizQs[quizIdx],ok=i===q.ans;if(ok)quizScore++;quizResults.push({q:q.q,ok,expl:q.expl});document.querySelectorAll('.option').forEach(e=>e.classList.add('disabled'));document.getElementById('opt'+i).classList.add(ok?'correct':'incorrect');if(!ok)document.getElementById('opt'+q.ans).classList.add('correct');showFB(ok,q.expl);}
function selTF(v){if(quizAnswered)return;quizAnswered=true;const q=quizQs[quizIdx],ok=v===q.ans;if(ok)quizScore++;quizResults.push({q:q.q,ok,expl:q.expl});document.querySelectorAll('.tf-btn').forEach(b=>b.classList.add('disabled'));document.getElementById(v?'tfT':'tfF').classList.add(ok?'correct':'incorrect');if(!ok)document.getElementById(q.ans?'tfT':'tfF').classList.add('correct');showFB(ok,q.expl);}
function selML(i){if(matchState.matched.includes(i))return;document.querySelectorAll('.match-col:first-child .match-item').forEach(e=>e.classList.remove('active'));document.getElementById('ml'+i).classList.add('active');matchState.left=i;}
function selMR(ri){if(matchState.left===null)return;const sr=matchState.sr[ri];if(document.getElementById('mr'+ri).classList.contains('matched-correct'))return;const li=matchState.left,ok=matchState.pairs[li].r===sr.r;document.getElementById('ml'+li).classList.remove('active');if(ok){document.getElementById('ml'+li).classList.add('matched-correct');document.getElementById('mr'+ri).classList.add('matched-correct');matchState.matched.push(li);}else{document.getElementById('ml'+li).classList.add('matched-wrong');document.getElementById('mr'+ri).classList.add('matched-wrong');setTimeout(()=>{document.getElementById('ml'+li).classList.remove('matched-wrong');document.getElementById('mr'+ri).classList.remove('matched-wrong');},700);}matchState.left=null;if(matchState.matched.length===matchState.pairs.length){quizAnswered=true;quizScore++;quizResults.push({q:quizQs[quizIdx].q,ok:true,expl:quizQs[quizIdx].expl});showFB(true,quizQs[quizIdx].expl);}}
function chkFill(){if(quizAnswered)return;quizAnswered=true;const q=quizQs[quizIdx],inp=document.getElementById('fillIn'),v=inp.value.trim(),ok=v.toLowerCase().replace(/[^a-zа-яё0-9]/gi,'')===q.ans.toLowerCase().replace(/[^a-zа-яё0-9]/gi,'');if(ok)quizScore++;quizResults.push({q:q.q,ok,expl:q.expl});inp.classList.add(ok?'correct':'incorrect');inp.disabled=true;showFB(ok,q.expl+(ok?'':` Ответ: ${q.ans}`));}
function showFB(ok,expl){const fb=document.getElementById('fb');fb.className=`feedback show ${ok?'correct-fb':'incorrect-fb'}`;fb.innerHTML=`<div class="fb-title">${ok?'&#10004; Правильно!':'&#10008; Неправильно'}</div>${esc(expl)}`;document.getElementById('nxtBtn').disabled=false;}
function nxtQ(){quizIdx++;quizIdx>=quizQs.length?renderQuizResults():renderQuizUI();}

function renderQuizResults(){
  const t=TOPICS[topicIdx],pct=quizQs.length?Math.round(quizScore/quizQs.length*100):0,wrong=quizQs.length-quizScore;
  let rv=quizResults.map(r=>`<div style="padding:8px 12px;border-radius:8px;margin-bottom:5px;font-size:.84rem;background:${r.ok?'rgba(63,185,80,.06)':'rgba(255,123,114,.05)'};border:1px solid ${r.ok?'rgba(63,185,80,.2)':'rgba(255,123,114,.15)'}"><span>${r.ok?'&#10004;':'&#10008;'}</span> <b>${esc(r.q)}</b><div style="color:var(--muted);font-size:.8rem">${esc(r.expl)}</div></div>`).join('');
  document.getElementById('content').innerHTML=`<div class="res-card"><div class="sc-circle"><div class="sc-num">${pct}%</div><div class="sc-tot">${quizScore}/${quizQs.length}</div></div><div class="res-title">${pct>=80?'Отлично!':pct>=60?'Хорошо':'Повторите'}</div><div class="res-sub">Тема ${t.id}: ${esc(t.name)}</div><div class="res-grid"><div class="res-item"><div class="res-n" style="color:var(--green)">${quizScore}</div><div class="res-l">Верно</div></div><div class="res-item"><div class="res-n" style="color:var(--red)">${wrong}</div><div class="res-l">Ошибок</div></div><div class="res-item"><div class="res-n" style="color:var(--accent)">${pct}%</div><div class="res-l">Итог</div></div></div><div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px"><button class="btn-q btn-q-p" onclick="startQuiz()">&#8635; Заново</button><button class="btn-q btn-q-s" onclick="switchMode('review')">Обзор</button><button class="btn-q btn-q-s" onclick="goHome()">&#8962; Домой</button></div><div style="text-align:left">${rv}</div></div>`;
  document.getElementById('mainArea').scrollTo({top:0});
}

function switchMode(m){view=m;renderSidebar();m==='review'?renderReview():startQuiz();}
function updateProgress(){let total=TOPICS.reduce((s,t)=>s+t.questions.length,0),seen=0;for(const k in reviewSeen)seen+=reviewSeen[k].size;document.getElementById('miniProgress').style.width=(total?seen/total*100:0)+'%';document.getElementById('sidebarInfo').textContent=`${seen}/${total} просмотрено`;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();document.getElementById('searchInput').focus();document.getElementById('searchInput').select();return;}
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='Escape')goHome();
});

// ─── SIDEBAR (mobile drawer) ───
function toggleSidebar(){
  document.querySelector('.sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}
function closeSidebar(){
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

// ─── SEARCH ───
let prevView=null, prevTopicIdx=-1, searchTimer=null, currentQuery='';

function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

function highlight(text,q){
  if(!q||!text)return esc(text||'');
  const lower=text.toLowerCase(), ql=q.toLowerCase();
  let out='', i=0;
  while(i<text.length){
    const m=lower.indexOf(ql,i);
    if(m<0){out+=esc(text.slice(i));break;}
    out+=esc(text.slice(i,m))+'<mark>'+esc(text.slice(m,m+ql.length))+'</mark>';
    i=m+ql.length;
  }
  return out;
}

function snippet(text,q,ctx){
  ctx=ctx||80;
  if(!text)return '';
  const lower=text.toLowerCase(), ql=q.toLowerCase();
  const i=lower.indexOf(ql);
  if(i<0)return esc(text.slice(0,160))+(text.length>160?'…':'');
  const s=Math.max(0,i-ctx), e=Math.min(text.length,i+ql.length+ctx);
  return (s>0?'…':'')+highlight(text.slice(s,e),q)+(e<text.length?'…':'');
}

function onSearch(v){
  clearTimeout(searchTimer);
  const q=v.trim();
  document.getElementById('searchClear').classList.toggle('show', q.length>0);
  searchTimer=setTimeout(()=>{
    if(q.length===0){
      if(view==='search'){
        currentQuery='';
        if(prevView==='review'&&prevTopicIdx>=0){topicIdx=prevTopicIdx;view='review';renderSidebar();renderReview();}
        else{goHome();}
      }
      return;
    }
    if(view!=='search'){prevView=view;prevTopicIdx=topicIdx;view='search';renderSidebar();}
    currentQuery=q;
    renderSearch(q);
  },180);
}

function clearSearch(){
  const inp=document.getElementById('searchInput');
  inp.value='';
  onSearch('');
  inp.focus();
}

function renderSearch(q){
  document.getElementById('topTitle').textContent=`Поиск: «${q}»`;
  document.getElementById('topRight').innerHTML=`<button class="btn-sm" onclick="goHome()">&#8962;</button>`;
  const ql=q.toLowerCase();
  const results=[];
  TOPICS.forEach((t,ti)=>{
    t.questions.forEach((qq,qi)=>{
      const inTitle=qq.title.toLowerCase().includes(ql);
      const allAns=(qq.paragraphs||[]).join(' ');
      const inAns=allAns.toLowerCase().includes(ql);
      const termHit=(qq.terms||[]).find(tm=>((tm.ru||'')+' '+(tm.en||'')+' '+(tm.df||'')).toLowerCase().includes(ql));
      const allSum=(qq.summary||[]).join(' ');
      const inSum=allSum.toLowerCase().includes(ql);
      if(inTitle||inAns||termHit||inSum){
        let snipText='', snipLabel='';
        if(inAns){snipText=allAns;snipLabel='ответ';}
        else if(inSum){snipText=allSum;snipLabel='шпаргалка';}
        else if(termHit){snipText=`${termHit.ru} (${termHit.en}) — ${termHit.df}`;snipLabel='термин';}
        results.push({ti,qi,topic:t,q:qq,snipText,snipLabel});
      }
    });
  });
  let h=`<div class="sr-header">${results.length===0?'Ничего не найдено':`Найдено: ${results.length} ${results.length===1?'результат':results.length<5?'результата':'результатов'}`}</div>`;
  if(results.length===0){
    h+=`<div class="sr-empty">По запросу «${esc(q)}» ничего не найдено.<br>Попробуйте другие ключевые слова.</div>`;
  }else{
    h+='<div class="sr-list">';
    results.forEach(r=>{
      h+=`<div class="sr-item" onclick="openSearchResult(${r.ti},${r.qi})">
        <div class="sr-topic">Тема ${r.topic.id} · Вопрос ${r.q.n}${r.snipLabel?' · '+r.snipLabel:''}</div>
        <div class="sr-title">${highlight(r.q.title,q)}</div>
        ${r.snipText?`<div class="sr-snippet">${snippet(r.snipText,q)}</div>`:''}
      </div>`;
    });
    h+='</div>';
  }
  document.getElementById('content').innerHTML=h;
  document.getElementById('mainArea').scrollTo({top:0});
}

function openSearchResult(ti,qi){
  document.getElementById('searchInput').value='';
  document.getElementById('searchClear').classList.remove('show');
  currentQuery='';
  topicIdx=ti;view='review';
  if(!reviewSeen[TOPICS[ti].id])reviewSeen[TOPICS[ti].id]=new Set();
  renderSidebar();renderReview();
  closeSidebar();
  setTimeout(()=>{
    const items=document.querySelectorAll('.q-item');
    const item=items[qi];
    if(item){
      const body=item.querySelector('.q-body');
      const chev=item.querySelector('.q-chev');
      body.classList.add('visible');
      chev.classList.add('open');
      item.classList.add('flash');
      item.scrollIntoView({behavior:'smooth',block:'start'});
      setTimeout(()=>item.classList.remove('flash'),1700);
    }
  },60);
}

init();
</script>
