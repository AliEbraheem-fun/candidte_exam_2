азом. На стороне клиента существует **клиентский stub** (заглушка) — он выглядит как обычная функция, но вместо локального выполнения упаковывает параметры вызова в сетевое сообщение. Этот процесс называется **маршалинг** (marshalling). Сообщение передаётся по сети серверу. На стороне сервера **серверный stub** распаковывает параметры (демаршалинг), вызывает настоящую процедуру и отправляет результат обратно тем же путём.","Транспорт RPC может работать поверх как TCP, так и UDP. Для коротких идемпотентных операций (когда повторный вызов безопасен) UDP быстрее, так как не нужно устанавливать соединение.","**Семантика вызова** — важная проблема RPC. Если сервер получил запрос, выполнил его, но ответ потерялся, клиент повторит вызов. Возможны две семантики: **at-least-once** (хотя бы раз — операция может выполниться повторно, подходит для идемпотентных операций) и **at-most-once** (не более раза — сервер запоминает выполненные запросы и не повторяет их).","**Эволюция RPC:** Sun RPC (ONC RPC) стал одним из первых широко используемых стандартов. За ним последовали DCE RPC, затем XML-RPC и SOAP (на основе XML). Современный стандарт — **gRPC** от Google, работающий поверх HTTP/2 с сериализацией через Protocol Buffers.","**Транспортные протоколы реального масштаба времени.** Для передачи аудио и видео в реальном времени TCP не подходит: если пакет потерян, TCP будет ждать повторной передачи, а к этому моменту данные уже не нужны — момент воспроизведения прошёл. Поэтому используется **RTP** (Real-time Transport Protocol), работающий поверх UDP.","**Ключевые поля заголовка RTP.** **Timestamp** привязывает данные к моменту их создания, что позволяет приёмнику восстанавливать правильное время воспроизведения (playout timing). **Sequence Number** нужен для обнаружения потерь и восстановления порядка пакетов. **Payload Type** указывает тип кодека (например, G.711 для голоса или H.264 для видео). **SSRC** (Synchronization Source) уникально идентифицирует источник потока.","**RTCP** (RTP Control Protocol) — сопутствующий протокол, который передаёт отчёты о качестве связи: процент потерь пакетов, джиттер (вариация задержки), round-trip time. На основе этих данных приложение может адаптивно менять битрейт или переключать кодек.","**Связь тем.** RTP использует UDP, потому что повторная передача потерянного кадра бессмысленна — воспроизводить его уже поздно. RPC может использовать UDP для быстрых идемпотентных вызовов. Таким образом, UDP — общий фундамент для сценариев, где **латентность приоритетнее гарантий доставки**."],"terms":[{"ru":"RPC","en":"Remote Procedure Call","df":"вызов удалённой процедуры как локальной"},{"ru":"Маршалинг","en":"Marshalling","df":"упаковка параметров вызова в сетевое сообщение"},{"ru":"Джиттер","en":"Jitter","df":"вариация задержки между пакетами"},{"ru":"SSRC","en":"Synchronization Source","df":"уникальный идентификатор источника RTP-потока"}],"summary":["","**Суть:** UDP — минималистичный транспорт без соединения. Используется там, где скорость важнее надёжности.","","**UDP:**","- Заголовок **8 байт**: src port, dst port, length, checksum.","- Без соединения, без гарантий, без контроля перегрузки.","- Минимальные накладные расходы.","- Применение: **DNS, DHCP, видео, VoIP, игры**.","","**RPC (Remote Procedure Call):**","- Вызов удалённой функции как локальной.","- **Клиентский stub** упаковывает параметры (**marshalling**) → сеть → **серверный stub** распаковывает → вызов.","- Работает поверх TCP или UDP.","","**Семантика RPC:**","- **At-least-once** — хотя бы раз (для идемпотентных операций).","- **At-most-once** — не более раза (сервер помнит выполненные).","","**Эволюция RPC:** Sun RPC → DCE RPC → XML-RPC → **gRPC** (HTTP/2 + Protocol Buffers).","","**RTP (Real-time Transport Protocol):**","- Для аудио/видео в реальном времени.","- Работает **поверх UDP** (TCP не подходит — повторы создают задержку).","- Поля:","- **Timestamp** — синхронизация воспроизведения.","- **Sequence Number** — обнаружение потерь и порядок.","- **Payload Type** — кодек (G.711, H.264).","- **SSRC** — идентификатор источника.","","**RTCP (RTP Control Protocol):**","- Отчёты о качестве: потери, джиттер, RTT.","- Позволяет адаптировать битрейт.","","**Для устного:** RTP+UDP для realtime, TCP+HTTP для надёжной передачи."]},{"n":46,"title":"Протокол TCP. Сервис TCP. Заголовок TCP-сегмента. Установка и разрыв TCP-соединения. Модель управления TCP-соединением. Скользящее окно TCP. Управление таймерами в TCP. Контроль перегрузки.","paragraphs":["**TCP** (Transmission Control Protocol) — протокол транспортного уровня, обеспечивающий **надёжную, упорядоченную** передачу данных в виде **байтового потока**. В отличие от UDP, TCP гарантирует: данные дойдут, в правильном порядке, без дубликатов и без повреждений. Цена — большие накладные расходы и задержки.","**Сервис TCP.** TCP предоставляет приложению абстракцию **надёжного двунаправленного потока байтов**. Приложение пишет байты в сокет и читает из него, не заботясь о границах сегментов, потерях и порядке. TCP сам разбивает поток на сегменты, нумерует байты, подтверждает получение и повторяет потерянные. Каждое соединение идентифицируется четвёркой: IP отправителя, порт отправителя, IP получателя, порт получателя. Соединение является **полнодуплексным** — данные могут передаваться в обоих направлениях одновременно.","**Заголовок TCP-сегмента** занимает минимум **20 байт** (до 60 с опциями). Порты источника и назначения (по 16 бит) обеспечивают мультиплексирование. **Sequence Number** (32 бит) указывает номер первого байта данных в сегменте. **Acknowledgment Number** (32 бит) — номер следующего байта, который ожидает получатель. **Флаги** (SYN, ACK, FIN, RST, PSH, URG, ECE, CWR) управляют состоянием соединения. **Window Size** (16 бит) сообщает, сколько байт получатель готов принять. Среди **опций** наиболее важны: MSS (максимальный размер сегмента), SACK (выборочное подтверждение), Window Scale (масштабирование окна для быстрых каналов) и Timestamps (точное измерение RTT).","**Установка TCP-соединения** происходит через **трёхэтапное рукопожатие** (three-way handshake). На первом шаге клиент отправляет серверу сегмент с флагом SYN, в котором указывает свой начальный номер последовательности (ISN). Этим он сообщает: я хочу установить соединение и буду нумеровать байты начиная с этого числа. На втором шаге сервер отвечает сегментом с флагами SYN и ACK одновременно: флаг SYN несёт начальный номер сервера, а ACK подтверждает получение клиентского номера. На третьем шаге клиент отправляет сегмент с флагом ACK, подтверждая номер сервера. После этого соединение установлено (состояние ESTABLISHED). Три шага необходимы, потому что соединение двунаправленное: каждая сторона должна сообщить свой ISN и получить подтверждение.","**Разрыв TCP-соединения** происходит в четыре шага, потому что каждая сторона закрывает свой поток данных независимо. Сначала инициатор посылает сегмент с флагом FIN, сообщая, что больше не будет отправлять данные. Вторая сторона подтверждает это ACK-ом, но может продолжать отправлять свои данные. Когда и она заканчивает, она тоже посылает FIN, и инициатор подтверждает его ACK-ом. После последнего ACK инициатор переходит в состояние **TIME_WAIT** на **2·MSL**, чтобы все дубликаты старого соединения исчезли из сети.","**Модель управления TCP-соединением** описывается конечным автоматом с **11 состояниями**. Основные из них: **CLOSED** (начальное), **LISTEN** (сервер ожидает), **SYN_SENT** (клиент послал SYN), **SYN_RCVD** (сервер получил SYN), **ESTABLISHED** (соединение установлено, передача данных). При закрытии: **FIN_WAIT_1** и **FIN_WAIT_2** (активная сторона ждёт подтверждения и встречного FIN), **CLOSE_WAIT** (пассивная сторона получила FIN, но ещё не закрыла свой поток), **LAST_ACK** (ждёт последнего подтверждения), **TIME_WAIT** (ожидание исчезновения дубликатов), **CLOSING** (редкий случай одновременного закрытия обеими сторонами).","**Скользящее окно TCP (Sliding Window)** — механизм, обеспечивающий одновременно управление потоком и эффективную передачу. Отправитель может послать до **min(cwnd, rwnd)** байт, не дожидаясь подтверждения. **rwnd** (receive window) — сколько места в буфере получателя, это управление потоком. **cwnd** (congestion window) — сколько сеть может обработать, это контроль перегрузки. ACK в TCP являются **накопительными**: подтверждают все байты до указанного номера. Опция **SACK** (Selective ACK) позволяет получателю сообщить, какие блоки он уже получил, чтобы отправитель досылал только пропущенное.","**Управление таймерами в TCP.** **RTO** (Retransmission Timeout) — главный таймер. Если подтверждение не пришло за это время, сегмент передаётся заново. Вычисляется по алгоритму Якобсона: **SRTT + 4·RTTVAR**, где SRTT — сглаженное время кругового обхода, RTTVAR — его вариация. При каждом таймауте RTO удваивается (экспоненциальный откат). **Persist timer** срабатывает, когда получатель объявил нулевое окно: отправитель периодически посылает зондирующие сегменты, чтобы не попасть в тупик (если ACK с ненулевым окном потерялся). **Keepalive timer** проверяет, жив ли удалённый хост при длительном молчании.","**Контроль перегрузки в TCP.** TCP не заливает канал данными, а нащупывает доступную пропускную способность. **Slow Start** — cwnd растёт экспоненциально (удваивается каждый RTT) до порога ssthresh. **Congestion Avoidance** — после ssthresh cwnd растёт линейно (плюс один MSS за RTT). При потере по таймауту: ssthresh = cwnd/2, cwnd = 1 MSS, начинается slow start. При трёх дублирующих ACK: **Fast Retransmit** (немедленная повторная передача) и **Fast Recovery** (cwnd уменьшается вдвое, минуя slow start). **TCP Cubic** использует кубическую функцию роста для эффективной работы на каналах с большим bandwidth-delay product.","**Связь с другими темами.** TCP — фундамент для HTTP, FTP, SMTP и большинства прикладных протоколов. Для приложений реального времени TCP не подходит из-за задержек повторной передачи — там используют UDP с RTP."],"terms":[{"ru":"SACK","en":"Selective Acknowledgment","df":"выборочное подтверждение отдельных блоков данных"},{"ru":"MSL","en":"Maximum Segment Lifetime","df":"максимальное время жизни сегмента в сети"},{"ru":"MSS","en":"Maximum Segment Size","df":"максимальный размер данных в одном TCP-сегменте"},{"ru":"cwnd","en":"Congestion Window","df":"окно перегрузки — ограничение скорости со стороны сети"},{"ru":"rwnd","en":"Receive Window","df":"окно приёма — свободное место в буфере получателя"},{"ru":"ssthresh","en":"Slow Start Threshold","df":"порог перехода от экспоненциального к линейному росту окна"}],"summary":["","**Суть:** TCP — надёжный полнодуплексный байтовый поток с установлением соединения.","","**Сервис TCP:**","- Надёжный двунаправленный поток байтов.","- Соединение = (srcIP, srcPort, dstIP, dstPort).","- Полнодуплексный.","","**Заголовок TCP (20 байт минимум, до 60):**","- Порты src/dst (16+16).","- **Sequence Number** (32) — номер первого байта.","- **Acknowledgment Number** (32) — номер следующего ожидаемого.","- Data Offset.","- **Флаги:** SYN, ACK, FIN, RST, PSH, URG, ECE, CWR.","- **Window Size** (16) — свободное место у получателя.","- Checksum, Urgent Pointer.","- Опции: **MSS, SACK, Window Scale, Timestamps**.","","**Установка (three-way handshake):**","1. Клиент → **SYN** (свой ISN).","2. Сервер → **SYN+ACK** (свой ISN + ACK клиентского).","3. Клиент → **ACK**.","- Три шага, чтобы обе стороны согласовали ISN.","","**Разрыв:**","- FIN → ACK → FIN → ACK (4 сегмента).","- После последнего ACK — **TIME_WAIT** 2·MSL (чтобы дубликаты исчезли).","","**Модель управления — 11 состояний:**","- CLOSED → LISTEN → SYN_SENT/SYN_RCVD → **ESTABLISHED** → FIN_WAIT_1/2 → CLOSE_WAIT → LAST_ACK → TIME_WAIT → CLOSING.","","**Скользящее окно:**","- До **min(cwnd, rwnd)** байт в полёте.","- ACK накопительные: «я получил всё до N».","- **SACK** — выборочное подтверждение.","","**Таймеры:**","- **RTO** = **SRTT + 4·RTTVAR** (алгоритм Якобсона). При таймауте — удвоение.","- **Persist timer** — при нулевом окне, чтобы не застрять.","- **Keepalive** — проверка соединения при молчании.","","**Контроль перегрузки:**","- Slow Start (экспонент.) → Congestion Avoidance (линейно).","- Потеря по таймауту: cwnd=1, slow start.","- 3 дупл. ACK: Fast Retransmit + Fast Recovery (cwnd/2).","- TCP Cubic — кубический рост.","","**Для устного:** HTTP, FTP, SMTP работают поверх TCP."]},{"n":47,"title":"Сети, устойчивые к задержкам. Архитектура DTN. Протокол Bundle.","paragraphs":["Классические протоколы Интернета (TCP/IP) предполагают, что связь между узлами существует **непрерывно**, задержки малы, а потери редки. Но есть среды, где эти предположения не выполняются: межпланетные коммуникации (сигнал до Марса идёт от 4 до 24 минут в одну сторону), сети в зонах стихийных бедствий, сельские регионы без постоянного покрытия, подводные сенсоры, военные мобильные сети. В таких условиях TCP не работает — рукопожатие невозможно завершить за разумное время, а таймауты приводят к бесконечным повторным передачам. Для этого разработана архитектура **DTN** (Delay-Tolerant Networking).","**Архитектура DTN** строится на трёх ключевых принципах, которые отличают её от обычного Интернета.","**Первый принцип — store-and-forward с длительным хранением.** В отличие от обычных маршрутизаторов, которые хранят пакет доли секунды, узлы DTN могут хранить данные **часами, днями и даже неделями**, дожидаясь появления связи со следующим узлом. Данные записываются в **постоянную память** (не только оперативную), чтобы пережить перезагрузки и сбои.","**Второй принцип — прерывистая связь как норма.** DTN не пытается поддерживать соединение. Она изначально рассчитана на то, что связь между узлами может появляться и исчезать. Маршрутизация учитывает не только топологию, но и **расписание контактов** — когда какие узлы смогут связаться друг с другом.","**Третий принцип — отсутствие сквозного пути.** В обычной сети пакет проходит от отправителя к получателю за один сеанс. В DTN сквозного пути может не существовать ни в один момент времени — сообщение продвигается поэтапно, от узла к узлу, по мере появления возможностей для передачи.","**Протокол Bundle** (RFC 5050, обновлённый в RFC 9171 как BPv7) — основной протокол DTN. Он работает как **оверлейный уровень**, располагаясь поверх различных транспортных протоколов: TCP, UDP или специализированных, таких как **LTP** (Licklider Transmission Protocol) для космической связи. Основная единица передачи — не пакет и не сегмент, а **bundle** (связка).","**Структура bundle** состоит из набора **блоков**. **Primary Block** — обязательный заголовок, содержащий адреса отправителя и получателя в формате **EID** (Endpoint Identifier), время создания, время жизни (TTL) и приоритет доставки. **Payload Block** содержит собственно данные. **Extension Blocks** добавляют информацию о безопасности, целостности и маршрутных указаниях.","**Адресация EID** (Endpoint Identifier) использует схему, похожую на URI, например: dtn://mars-rover/camera или ipn:9.1. Это позволяет адресовать не только конкретные машины, но и группы узлов или сервисы.","**Custody Transfer** (передача ответственности) — ключевая особенность DTN. Когда промежуточный узел принимает bundle, он может взять на себя **ответственность за его доставку**. С этого момента предыдущему узлу не нужно хранить копию — ответственность перешла дальше по цепочке. Это принципиально отличается от TCP, где за доставку отвечает только исходный отправитель.","**Фрагментация** в DTN бывает двух видов. **Проактивная** — bundle разбивается заранее, если известно, что канал не позволит передать его целиком за один контакт. **Реактивная** — если связь оборвалась посередине передачи, уже переданная часть сохраняется и не передаётся повторно.","**Связь с другими темами.** DTN дополняет стек TCP/IP для сред, где он неприменим. TCP требует непрерывной связи и быстрых откликов для рукопожатия. UDP не имеет механизма надёжности. DTN с Bundle Protocol решает обе проблемы: обеспечивает надёжную доставку без постоянного соединения, используя хранение на промежуточных узлах и передачу ответственности."],"terms":[{"ru":"DTN","en":"Delay-Tolerant Networking","df":"архитектура сетей, устойчивых к большим задержкам и разрывам связи"},{"ru":"EID","en":"Endpoint Identifier","df":"URI-подобный адрес узла или сервиса в DTN"},{"ru":"Custody Transfer","en":"Передача ответственности","df":"промежуточный узел берёт на себя ответственность за доставку bundle"},{"ru":"LTP","en":"Licklider Transmission Protocol","df":"специализированный транспортный протокол для космических каналов"}],"summary":["","**Суть:** Сети для сред без постоянной связи (космос, катастрофы, подводные сенсоры).","","**Проблема:** TCP/IP предполагает непрерывную связь и малые задержки. Не работает, когда сигнал до Марса идёт 4–24 минуты.","","**Архитектура DTN — три принципа:**","","1. **Store-and-forward с длительным хранением:**","- Узлы хранят данные в **постоянной памяти** часами, днями, неделями.","- Ждут появления связи со следующим узлом.","","2. **Прерывистая связь как норма:**","- Маршрутизация учитывает **расписание контактов** (когда какие узлы будут на связи).","","3. **Нет сквозного пути:**","- Сообщение продвигается **поэтапно** от узла к узлу.","","**Протокол Bundle (RFC 5050, обновлён RFC 9171):**","- Оверлей поверх TCP/UDP/**LTP** (Licklider Transmission Protocol для космоса).","- Единица передачи — **bundle**.","- Блоки:","- **Primary Block** — заголовок (отправитель, получатель в формате **EID**, TTL).","- **Payload Block** — данные.","- **Extension Blocks** — безопасность, маршрут.","","**EID (Endpoint Identifier):** URI-подобный адрес (dtn://mars-rover/camera).","","**Custody Transfer:**","- Промежуточный узел берёт **ответственность** за доставку.","- Отправитель может удалить свою копию.","- Принципиальное отличие от TCP.","","**Фрагментация:**","- **Проактивная** — заранее, зная ограничения канала.","- **Реактивная** — при обрыве связи посередине.","","**Для устного:** DTN — не замена TCP/IP, а дополнение для сред, где TCP не работает."]}],"quizzes":[{"type":"mcq","topic":"Вопрос 42","q":"Какие два основных транспортных сервиса предоставляет транспортный уровень?","opts":["TCP (надёжный, с соединением) и UDP (ненадёжный, без соединения)","HTTP и FTP","IP и ICMP","OSPF и BGP"],"ans":0,"expl":"Два сервиса транспортного уровня: TCP (надёжный, с соединением) и UDP (ненадёжный, без соединения)."},{"type":"mcq","topic":"Вопрос 42","q":"Какова последовательность вызовов сокетов Беркли для TCP-сервера?","opts":["socket() → connect() → send()/recv() → close()","socket() → bind() → listen() → accept() → recv()/send() → close()","socket() → sendto()/recvfrom() → close()","bind() → socket() → accept() → listen() → close()"],"ans":1,"expl":"TCP-сервер: socket() → bind() → listen() → accept() → recv()/send() → close()."},{"type":"tf","topic":"Вопрос 42","q":"Порт — это 32-битный идентификатор процесса на транспортном уровне.","ans":false,"expl":"Неверно. Порт — это 16-битный идентификатор процесса."},{"type":"mcq","topic":"Вопрос 43","q":"Какова процедура установки TCP-соединения?","opts":["SYN → ACK → FIN","SYN → SYN+ACK → ACK (трёхстороннее рукопожатие)","FIN → ACK → FIN → ACK","SYN → RST → ACK"],"ans":1,"expl":"Установка TCP-соединения: трёхстороннее рукопожатие (SYN → SYN+ACK → ACK) с случайными ISN."},{"type":"tf","topic":"Вопрос 43","q":"Разрыв TCP-соединения выполняется в четыре шага: FIN → ACK → FIN → ACK.","ans":true,"expl":"Верно. Разрыв: четырёхшаговый (FIN → ACK → FIN → ACK)."},{"type":"mcq","topic":"Вопрос 43","q":"Какой диапазон портов относится к well-known ports?","opts":["0–65535","0–1023","1024–49151","49152–65535"],"ans":1,"expl":"Well-known ports: 0–1023."},{"type":"mcq","topic":"Вопрос 44","q":"Как растёт окно перегрузки (cwnd) в фазе медленного старта TCP?","opts":["Линейно","Экспоненциально","Логарифмически","Не растёт"],"ans":1,"expl":"Медленный старт: cwnd растёт экспоненциально до ssthresh."},{"type":"tf","topic":"Вопрос 44","q":"При алгоритме AIMD в случае потери пакета cwnd делится на 2.","ans":true,"expl":"Верно. AIMD: при потере cwnd делится на 2; при успехе — +1 MSS за RTT."},{"type":"mcq","topic":"Вопрос 44","q":"Почему TCP плохо работает в беспроводных сетях?","opts":["Беспроводные сети не поддерживают TCP","TCP ошибочно уменьшает cwnd из-за потерь от помех, а не перегрузки","Беспроводные сети слишком быстрые для TCP","TCP не поддерживает мультиплексирование в беспроводных сетях"],"ans":1,"expl":"Высокий уровень ошибок из-за помех (не перегрузки). TCP ошибочно уменьшает cwnd. Решения: Explicit Loss Notification, TCP Westwood, SNOOP."},{"type":"mcq","topic":"Вопрос 45","q":"Каков размер каждого поля заголовка UDP?","opts":["4 байта","2 байта","8 байт","1 байт"],"ans":1,"expl":"Заголовок UDP: порт источника, порт назначения, длина, контрольная сумма — по 2 байта каждое."},{"type":"tf","topic":"Вопрос 45","q":"Протокол RTP работает поверх UDP и добавляет sequence number, timestamp, SSRC и payload type.","ans":true,"expl":"Верно. RTP работает поверх UDP, добавляет sequence number, timestamp, SSRC, payload type."},{"type":"mcq","topic":"Вопрос 45","q":"Что делает клиентский stub при RPC?","opts":["Маршализирует параметры для передачи на удалённый хост","Выполняет процедуру локально","Устанавливает TCP-соединение","Шифрует данные"],"ans":0,"expl":"Клиентский stub маршализирует параметры; серверный — демаршализирует и вызывает процедуру."},{"type":"mcq","topic":"Вопрос 46","q":"Каков минимальный размер заголовка TCP?","opts":["8 байт","16 байт","20 байт","40 байт"],"ans":2,"expl":"Заголовок TCP имеет минимальный размер 20 байт."},{"type":"tf","topic":"Вопрос 46","q":"В TCP fast retransmit выполняется после получения 3 дублирующих ACK.","ans":true,"expl":"Верно. Fast retransmit — повторная передача после 3 дублирующих ACK."},{"type":"mcq","topic":"Вопрос 46","q":"Какое состояние TCP-соединения наступает после разрыва и длится 2·MSL?","opts":["CLOSE_WAIT","FIN_WAIT_1","TIME_WAIT","LAST_ACK"],"ans":2,"expl":"TIME_WAIT — состояние ожидания исчезновения дубликатов, длится 2·MSL."},{"type":"mcq","topic":"Вопрос 47","q":"Какой принцип лежит в основе DTN (Delay-Tolerant Networks)?","opts":["Store-and-forward","Store-and-carry-and-forward","Cut-through switching","Circuit switching"],"ans":1,"expl":"DTN использует принцип store-and-carry-and-forward: узел хранит сообщение до появления следующего узла."},{"type":"tf","topic":"Вопрос 47","q":"Механизм custody transfer в DTN означает, что промежуточный узел принимает ответственность за бандл.","ans":true,"expl":"Верно. Custody transfer — промежуточный узел принимает ответственность за доставку бандла."},{"type":"match","topic":"Темы 42–47","q":"Сопоставьте термин с его определением.","pairs":[{"left":"ISN","right":"Начальный порядковый номер TCP"},{"left":"SACK","right":"Выборочное подтверждение сегментов"},{"left":"RPC","right":"Вызов удалённой процедуры"},{"left":"EID","right":"Адрес узла в DTN"},{"left":"cwnd","right":"Окно перегрузки TCP"}],"expl":"ISN — начальный порядковый номер; SACK — выборочное подтверждение; RPC — вызов удалённой процедуры; EID — Endpoint Identifier в DTN; cwnd — congestion window."}]},{"id":7,"name":"Прикладной уровень сетевого стека","questions":[{"n":48,"title":"Служба DNS. Записи ресурсов доменов. Серверы имён.","paragraphs":["**Служба DNS** (Domain Name System) — распределённая иерархическая система, которая преобразует удобные для человека доменные имена (например, example.com) в IP-адреса (93.184.216.34), необходимые для маршрутизации пакетов. Без DNS пользователям пришлось бы запоминать числовые адреса каждого сайта. DNS работает по модели клиент-сервер, использует **порт 53** и может работать как поверх UDP (обычно), так и поверх TCP (для больших ответов и передачи зон).","**Иерархия пространства имён.** Доменное пространство организовано как дерево. На вершине находится **корень** (обозначается точкой). Ниже идут **домены верхнего уровня** (TLD): родовые (gTLD — .com, .org, .net) и страновые (ccTLD — .ru, .uk, .de). Ещё ниже — домены второго уровня (example.com), третьего (mail.example.com) и так далее. Каждый уровень управляется независимо.","**Зоны.** Пространство имён разбито на **зоны** (zones). Зона — это часть дерева, которая администрируется как единое целое одной организацией. Например, корневая зона, зона .ru, зона example.com. Важно: зона и домен — не одно и то же. Домен может содержать несколько зон, если поддомены делегированы другим администраторам.","**Серверы имён (Name Servers).** Каждая зона обслуживается одним или несколькими серверами имён, которые хранят её записи и отвечают на запросы. Существует четыре логических роли серверов имён.","**Корневые серверы (Root Servers)** — вершина иерархии DNS. Формально их 13 (обозначаются буквами A–M), но физически это сотни серверов по всему миру, работающих через **anycast** (все отвечают на один и тот же IP-адрес, пакет приходит к ближайшему). Корневые серверы знают только одно: где искать серверы TLD. Они не хранят записи конкретных доменов.","**Серверы TLD** обслуживают домены верхнего уровня. Например, серверы зоны .com знают, какие серверы имён отвечают за example.com, google.com и так далее. Они тоже не хранят конкретные записи доменов — только указатели на авторитетные серверы.","**Авторитетные серверы (Authoritative Name Servers)** — это серверы, которые хранят **фактические записи** для конкретной зоны и дают по ним окончательные ответы. Например, авторитетные серверы example.com знают IP-адрес этого сайта, его почтовый сервер, псевдонимы и прочее. Для надёжности у каждой зоны обычно несколько авторитетных серверов: один **первичный (master)** и несколько **вторичных (slave)**, которые периодически копируют данные с первичного через механизм **передачи зоны** (AXFR — полная передача, IXFR — инкрементальная, работают поверх TCP).","**Локальные серверы имён (резолверы)** не являются частью официальной иерархии, но играют ключевую роль. Это серверы, которые предоставляет интернет-провайдер или организация. Именно к ним обращается компьютер пользователя. Резолвер выполняет всю работу по поиску ответа: идёт к корневому серверу, затем к серверу TLD, затем к авторитетному серверу, и возвращает клиенту готовый ответ. Резолвер также активно кэширует ответы.","**Два типа запросов.** **Рекурсивный запрос** — клиент просит сервер найти ответ полностью. Сервер сам обходит иерархию и возвращает готовый результат. Так работает взаимодействие клиента с локальным резолвером. **Итеративный запрос** — сервер возвращает не ответ, а ссылку на следующий сервер, который может знать больше. Так работает взаимодействие между серверами имён: резолвер задаёт итеративные запросы корневому серверу, затем TLD, затем авторитетному.","**Записи ресурсов доменов (Resource Records, RR).** Каждая зона хранит набор записей разных типов. **A** — IPv4-адрес хоста. **AAAA** — IPv6-адрес. **MX** (Mail Exchange) — почтовый сервер для домена с приоритетом (чем меньше число, тем выше приоритет). **CNAME** (Canonical Name) — псевдоним, перенаправляющий одно имя на другое. **NS** (Name Server) — указывает авторитетный сервер имён для зоны; именно эти записи используются для **делегирования** зоны. **SOA** (Start of Authority) — параметры зоны: основной сервер, контактный адрес администратора, серийный номер (для отслеживания изменений), интервалы обновления. **TXT** — произвольный текст, используется для SPF, DKIM, DMARC и верификации домена. **PTR** — обратное преобразование IP-адреса в имя.","Каждая запись имеет поле **TTL** (Time To Live) — время в секундах, в течение которого запись можно хранить в кэше. Когда TTL истекает, резолвер должен запросить запись заново.","**Кэширование** — критически важный механизм. Без него каждый запрос проходил бы всю иерархию от корневых серверов. Локальный резолвер кэширует ответы на время TTL, что резко снижает нагрузку и ускоряет отклик. Отрицательные ответы (домен не существует, NXDOMAIN) тоже кэшируются.","**Безопасность DNS.** **DNSSEC** (DNS Security Extensions) — расширение, добавляющее цифровые подписи к записям. Позволяет резолверу проверить, что ответ не был подделан. Защищает от **DNS spoofing** (подмена ответов) и **cache poisoning** (отравление кэша). DNSSEC не шифрует запросы — он только гарантирует целостность. Для шифрования существуют **DNS over HTTPS (DoH)** и **DNS over TLS (DoT)**."],"terms":[{"ru":"RR","en":"Resource Record","df":"запись ресурса — единица хранения информации в DNS"},{"ru":"TLD","en":"Top-Level Domain","df":"домен верхнего уровня (.com, .ru, .org)"},{"ru":"Зона","en":"Zone","df":"часть пространства имён, администрируемая одной организацией"},{"ru":"AXFR","en":"Authoritative Zone Transfer","df":"полная передача зоны с master на slave по TCP"},{"ru":"TTL","en":"Time To Live","df":"время жизни записи в кэше (в секундах)"}],"summary":["","**Суть:** DNS преобразует имена (example.com) в IP-адреса.","","**Иерархия:**","- Корень → TLD (.com, .ru) → домены 2-го уровня → поддомены.","- Каждый уровень управляется независимо.","","**Зоны:** часть пространства имён под одним администрированием.","","**Серверы имён (4 роли):**","1. **Корневые** (13 логических через **anycast**, физически сотни) — знают серверы TLD.","2. **Серверы TLD** — знают авторитетные серверы доменов.","3. **Авторитетные** — хранят реальные записи; бывают **master** и **slave** (копирование через **AXFR**/IXFR).","4. **Локальные резолверы** — предоставляются провайдером, кэшируют.","","**Два типа запросов:**","- **Рекурсивный** (клиент → резолвер): найди мне ответ полностью.","- **Итеративный** (резолвер ↔ серверы): следуй по цепочке.","","**Записи ресурсов (RR):**","- **A** — IPv4-адрес.","- **AAAA** — IPv6.","- **MX** — почтовый сервер (с приоритетом).","- **CNAME** — псевдоним.","- **NS** — авторитетный сервер (делегирование).","- **SOA** — параметры зоны.","- **TXT** — произвольный текст (SPF, DKIM).","- **PTR** — обратное преобразование IP→имя.","","Каждая запись имеет **TTL** — время жизни в кэше.","","**Кэширование:** критически важно, снижает нагрузку. Отрицательные ответы (NXDOMAIN) тоже кэшируются.","","**Транспорт:** UDP порт 53 (обычно), TCP для больших ответов и передачи зон.","","**Безопасность:**","- **DNSSEC** — цифровые подписи записей (целостность).","- **DoH** (DNS over HTTPS), **DoT** (DNS over TLS) — шифрование запросов.","","**Для устного:** Без DNS Интернет не работал бы. anycast — как 13 корневых серверов обслуживают весь мир."]},{"n":49,"title":"Архитектура и службы электронной почты. Форматы сообщений. Пересылка и окончательная доставка сообщений.","paragraphs":["**Архитектура электронной почты** состоит из трёх основных компонентов. **User Agent (UA)** — клиентская программа, через которую пользователь читает и пишет письма (Outlook, Thunderbird, веб-интерфейс Gmail). **Mail Transfer Agent (MTA)** — почтовый сервер, который принимает, хранит и пересылает письма между серверами по протоколу SMTP. **Mail Delivery Agent (MDA)** — компонент, который помещает письмо в почтовый ящик получателя после того, как MTA его доставил.","**Службы электронной почты** включают: составление сообщений (composition), передачу (transfer) от отправителя к получателю через цепочку серверов, отчёты о доставке (reporting), отображение входящих сообщений (displaying), и управление почтовым ящиком (disposition) — сортировка, удаление, папки.","**Формат сообщения** определён стандартом RFC 5322. Сообщение состоит из двух частей, разделённых пустой строкой: **заголовка (header)** и **тела (body)**. Заголовок содержит структурированные поля: **From** (отправитель), **To** (получатель), **Cc** (копия), **Bcc** (скрытая копия), **Subject** (тема), **Date** (дата), **Message-ID** (уникальный идентификатор). Тело содержит текст сообщения.","Исходный стандарт поддерживает только 7-битный ASCII-текст. Для вложений, кириллицы, изображений и других бинарных данных используется расширение **MIME** (Multipurpose Internet Mail Extensions). MIME добавляет заголовки: **Content-Type** (тип данных, например text/plain или image/jpeg), **Content-Transfer-Encoding** (кодирование, обычно Base64 для бинарных данных или quoted-printable для текста), и **MIME-Version**. MIME позволяет создавать **multipart-сообщения** — письма из нескольких частей (текст + вложения).","**Пересылка сообщений** происходит следующим образом. Пользователь пишет письмо в своём UA и отправляет его. UA передаёт письмо по протоколу SMTP на MTA отправителя (почтовый сервер его домена). MTA отправителя смотрит домен получателя в адресе, делает DNS-запрос на **MX-запись** этого домена и узнаёт адрес MTA получателя. Затем устанавливает SMTP-соединение с MTA получателя и передаёт письмо. Если MTA получателя временно недоступен, MTA отправителя ставит письмо в очередь и повторяет попытки в течение нескольких дней.","**Окончательная доставка.** Когда MTA получателя принял письмо, MDA помещает его в почтовый ящик пользователя. Хранение может быть в формате **mbox** (все письма в одном файле) или **Maildir** (каждое письмо — отдельный файл в директории). После этого пользователь забирает письмо через свой UA, используя протокол **POP3** (скачивает и обычно удаляет с сервера) или **IMAP** (работает с письмами на сервере, не скачивая). Веб-интерфейс обращается к хранилищу напрямую.","**Связь с другими темами.** Почтовая система активно использует DNS (MX-записи для маршрутизации между серверами), TCP (SMTP, POP3, IMAP работают поверх TCP), и TLS (шифрование соединений через STARTTLS или выделенные порты)."],"terms":[{"ru":"UA","en":"User Agent","df":"клиентская программа для чтения и отправки почты"},{"ru":"MTA","en":"Mail Transfer Agent","df":"сервер, пересылающий почту между доменами по SMTP"},{"ru":"MDA","en":"Mail Delivery Agent","df":"компонент, помещающий письмо в почтовый ящик получателя"},{"ru":"MIME","en":"Multipurpose Internet Mail Extensions","df":"расширение для вложений, кириллицы и бинарных данных в почте"},{"ru":"MX","en":"Mail Exchange","df":"DNS-запись, указывающая почтовый сервер домена"}],"summary":["","**Суть:** Почтовая система = клиент + серверы пересылки + серверы доставки.","","**Компоненты:**","- **UA (User Agent)** — клиент (Outlook, Thunderbird, веб-интерфейс).","- **MTA (Mail Transfer Agent)** — сервер пересылки (Postfix, Exim), использует **SMTP**.","- **MDA (Mail Delivery Agent)** — кладёт письмо в ящик.","","**Службы:** composition (составление), transfer (передача), reporting (отчёты), displaying (показ), disposition (папки).","","**Формат сообщения (RFC 5322):**","- **Заголовок** + пустая строка + **тело**.","- Поля: **From, To, Cc, Bcc, Subject, Date, Message-ID**.","- Только 7-битный ASCII.","","**MIME (Multipurpose Internet Mail Extensions):**","- Расширение для вложений, кириллицы, бинарных данных.","- **Content-Type** — тип (text/plain, image/jpeg).","- **Content-Transfer-Encoding** — кодирование (Base64, quoted-printable).","- **Multipart** — несколько частей (текст + вложения).","","**Пересылка:**","1. UA отправляет в MTA отправителя (SMTP).","2. MTA смотрит MX-запись домена получателя в DNS.","3. MTA отправителя → MTA получателя (SMTP).","4. MTA кладёт в очередь и повторяет при недоступности.","","**Окончательная доставка:**","- MDA помещает в почтовый ящик (**mbox** или **Maildir**).","- Пользователь забирает через UA по **POP3** или **IMAP**.","","**Для устного:** MX-запись в DNS говорит, какой сервер принимает почту для домена."]},{"n":50,"title":"Электронная почта. Протоколы SMTP, POP, IMAP. Схемы с выделенным почтовым сервером и двумя почтовыми серверами-посредниками.","paragraphs":["**SMTP** (Simple Mail Transfer Protocol, RFC 5321) — протокол для **отправки и пересылки** почты. Работает на **порту 25** (между серверами) и **порту 587** (от клиента к серверу, с аутентификацией). SMTP использует TCP и работает в текстовом режиме: клиент и сервер обмениваются командами и ответами.","Типичная SMTP-сессия выглядит так. Клиент устанавливает TCP-соединение и получает от сервера приветствие (код 220). Клиент представляется командой **HELO** (или **EHLO** для расширенного SMTP). Затем указывает отправителя командой **MAIL FROM**, получателя командой **RCPT TO**, и передаёт тело письма командой **DATA**. Письмо заканчивается строкой, содержащей только точку. Сервер подтверждает приём кодом 250. Сессия завершается командой **QUIT**.","Важная особенность SMTP: это протокол **push** (проталкивания) — отправитель инициирует передачу. Поэтому SMTP не годится для получения почты пользователем — для этого нужны протоколы **pull** (вытягивания).","**POP3** (Post Office Protocol version 3) — простой протокол **получения** почты. Работает на **порту 110** (или 995 для POP3S с TLS). Принцип работы прост: клиент подключается, аутентифицируется (USER/PASS), получает список писем (LIST), скачивает нужные (RETR) и может удалить их с сервера (DELE). По умолчанию POP3 **скачивает и удаляет** — письма хранятся локально. Это хорошо работает, когда почту читают с одного устройства, но не подходит для доступа с нескольких устройств.","**IMAP** (Internet Message Access Protocol) — более продвинутый протокол получения почты. Работает на **порту 143** (или 993 для IMAPS с TLS). Ключевое отличие от POP3: письма **остаются на сервере**, а клиент работает с ними удалённо. IMAP поддерживает **папки** (folders) на сервере, **флаги** (прочитано, отвечено, важное), **поиск** на стороне сервера, и возможность скачать только заголовки или части письма. Это делает IMAP идеальным для доступа с нескольких устройств — состояние синхронизируется через сервер.","**Схема с выделенным почтовым сервером.** Это простейшая конфигурация. У получателя есть один почтовый сервер, который выполняет все функции: принимает входящую почту по SMTP, хранит её и отдаёт пользователю по POP3 или IMAP. Путь письма: UA отправителя передаёт письмо по SMTP на MTA отправителя. MTA отправителя находит MX-запись домена получателя и передаёт письмо по SMTP на единственный сервер получателя. Получатель забирает письмо по POP3 или IMAP.","**Схема с двумя почтовыми серверами-посредниками.** В крупных организациях и у провайдеров почта проходит через промежуточные серверы. Например, первый посредник — это **антиспам-шлюз** (relay), который фильтрует нежелательную почту, проверяет SPF/DKIM/DMARC и отсеивает вредоносные вложения. Если письмо прошло проверку, оно передаётся второму посреднику или напрямую на внутренний почтовый сервер. Второй посредник может выполнять маршрутизацию внутри организации (направлять письма на разные серверы для разных подразделений). Путь: UA → MTA отправителя → посредник 1 (фильтрация) → посредник 2 (маршрутизация) → MTA получателя → MDA → почтовый ящик.","**Защита соединений.** Все три протокола поддерживают шифрование. **STARTTLS** — команда, которая обновляет уже открытое соединение до TLS (используется на стандартных портах). Альтернатива — подключение сразу на защищённые порты: **465** (SMTPS), **993** (IMAPS), **995** (POP3S)."],"terms":[{"ru":"SMTP","en":"Simple Mail Transfer Protocol","df":"протокол отправки и пересылки почты (push)"},{"ru":"POP3","en":"Post Office Protocol v3","df":"простой протокол получения почты (скачать и удалить)"},{"ru":"IMAP","en":"Internet Message Access Protocol","df":"продвинутый протокол получения почты (письма на сервере)"},{"ru":"STARTTLS","en":"Start TLS","df":"команда для обновления открытого соединения до шифрованного TLS"}],"summary":["","**Суть:** Три основных протокола почты: SMTP для отправки, POP/IMAP для получения.","","**SMTP (Simple Mail Transfer Protocol, RFC 5321):**","- **Push** — отправитель проталкивает.","- Порты: **25** (сервер-сервер), **587** (клиент→сервер, с аутентификацией).","- Команды: **HELO/EHLO**, **MAIL FROM**, **RCPT TO**, **DATA**, **QUIT**.","- Текстовый протокол.","","**POP3 (Post Office Protocol v3):**","- **Pull** — клиент забирает.","- Порт **110** (или 995 для POP3S).","- По умолчанию **скачивает и удаляет**.","- Подходит для одного устройства.","- Команды: USER, PASS, LIST, RETR, DELE, QUIT.","","**IMAP (Internet Message Access Protocol):**","- Порт **143** (или 993 для IMAPS).","- Письма **остаются на сервере**.","- Поддерживает **папки, флаги** (прочитано, отвечено), поиск на сервере.","- Идеален для нескольких устройств.","","**Схема с выделенным почтовым сервером:**","- UA → MTA отправителя → MTA получателя → MDA → ящик → UA (POP/IMAP).","- Простейшая конфигурация.","","**Схема с двумя посредниками:**","- Добавляются промежуточные серверы в организации:","- **Антиспам-шлюз (relay)** — фильтрует, проверяет SPF/DKIM/DMARC.","- **Маршрутизатор внутри** — направляет на разные серверы по подразделениям.","- Путь: UA → MTA отправителя → **посредник 1 (антиспам)** → **посредник 2 (маршрутизация)** → MTA получателя → MDA → ящик.","","**Защита:**","- **STARTTLS** — обновление открытого соединения до TLS.","- Защищённые порты: **465** (SMTPS), **993** (IMAPS), **995** (POP3S).","","**Для устного:** SMTP отправляет, POP/IMAP получает. IMAP — современный выбор."]},{"n":51,"title":"Представление об архитектуре всемирной паутины (WWW). Веб-приложения. Динамические и статичные веб-страницы. Веб-поиск. Протокол HTTP.","paragraphs":["**Всемирная паутина (WWW)** — это распределённая гипертекстовая информационная система, работающая поверх Интернета. Паутина — это не синоним Интернета: Интернет — это глобальная сеть (инфраструктура), а WWW — одна из служб, работающих в этой сети (наряду с почтой, DNS и другими).","**Архитектура WWW** основана на трёх столпах. **URL** (Uniform Resource Locator) — уникальный адрес ресурса в сети, имеющий структуру: схема://хост:порт/путь?параметры. **HTML** (HyperText Markup Language) — язык разметки для создания страниц с гиперссылками. **HTTP** (HyperText Transfer Protocol) — протокол взаимодействия между клиентом (браузером) и сервером. Архитектура является **клиент-серверной**: браузер запрашивает ресурсы, сервер их отдаёт.","**Веб-приложения** — это программы, которые работают в браузере и взаимодействуют с сервером. В отличие от простых статических страниц, веб-приложения имеют сложную логику на стороне сервера и/или клиента. На стороне сервера используются технологии вроде PHP, Python, Node.js, Java. На стороне клиента — JavaScript и его фреймворки. Современные веб-приложения часто строятся по архитектуре **REST** (Representational State Transfer), где клиент и сервер обмениваются данными через HTTP-методы: GET (получить), POST (создать), PUT (обновить), DELETE (удалить).","**Статические веб-страницы** — это готовые HTML-файлы, которые хранятся на сервере и отдаются клиенту «как есть», без какой-либо обработки. Содержимое одинаково для всех пользователей и меняется только при ручном редактировании файла.","**Динамические веб-страницы** генерируются сервером «на лету» при каждом запросе. Содержимое может зависеть от параметров запроса, авторизации пользователя, данных из базы и других факторов. Технологии серверной генерации: CGI (Common Gateway Interface) — ранний механизм, запускающий отдельный процесс на каждый запрос; серверные скрипты (PHP, ASP); шаблонизаторы. На стороне клиента страница может обновляться динамически через **JavaScript** и **AJAX** (Asynchronous JavaScript and XML) — запросы к серверу без перезагрузки страницы.","**Веб-поиск.** Поисковые системы состоят из трёх компонентов. **Краулер (crawler, паук)** — программа, которая автоматически обходит страницы, переходя по ссылкам, и собирает их содержимое. На основе собранных данных строится **инвертированный индекс** — структура данных, которая для каждого слова хранит список страниц, где оно встречается. При запросе пользователя **ранжирование** определяет порядок результатов: исторически ключевым стал алгоритм **PageRank**, который оценивает важность страницы по количеству и качеству ссылок на неё.","**Протокол HTTP** работает поверх TCP на **порту 80** (HTTP) или **порту 443** (HTTPS — HTTP с TLS-шифрованием). HTTP следует модели **запрос-ответ**: клиент отправляет запрос, сервер возвращает ответ.","**Структура HTTP-запроса:** строка запроса (метод, URI, версия), заголовки (Host, User-Agent, Accept, Cookie и другие) и необязательное тело. **Структура ответа:** строка статуса (версия, код, пояснение), заголовки (Content-Type, Content-Length, Set-Cookie) и тело ответа.","**Коды статуса HTTP:** **1xx** — информационные. **2xx** — успех (200 OK, 201 Created). **3xx** — перенаправление (301 Moved Permanently, 302 Found). **4xx** — ошибка клиента (400 Bad Request, 403 Forbidden, 404 Not Found). **5xx** — ошибка сервера (500 Internal Server Error, 503 Service Unavailable).","**Версии HTTP.** **HTTP/1.0** открывал новое TCP-соединение на каждый запрос, что было крайне неэффективно. **HTTP/1.1** ввёл **постоянные соединения** (keep-alive) — несколько запросов по одному TCP-соединению, а также **pipelining** — отправку нескольких запросов, не дожидаясь ответа (на практике мало поддерживалось). **HTTP/2** использует **мультиплексирование** — множество параллельных потоков в одном TCP-соединении, бинарное кодирование вместо текстового, сжатие заголовков (HPACK) и **server push** (сервер может отправить ресурс до того, как клиент его запросил). **HTTP/3** заменяет TCP на **QUIC** (поверх UDP), устраняя проблему head-of-line blocking на транспортном уровне.","**Связь с другими темами.** HTTP работает поверх TCP (или QUIC в HTTP/3). DNS используется для разрешения имени хоста в URL. TLS обеспечивает шифрование в HTTPS. Кэширование и CDN оптимизируют доставку веб-контента."],"terms":[{"ru":"URL","en":"Uniform Resource Locator","df":"уникальный адрес ресурса в сети"},{"ru":"REST","en":"Representational State Transfer","df":"архитектурный стиль API на HTTP-методах"},{"ru":"CGI","en":"Common Gateway Interface","df":"ранний механизм запуска серверных скриптов по HTTP-запросу"},{"ru":"AJAX","en":"Asynchronous JavaScript and XML","df":"асинхронные запросы к серверу без перезагрузки страницы"},{"ru":"QUIC","en":"Quick UDP Internet Connections","df":"транспортный протокол HTTP/3, работающий поверх UDP"}],"summary":["","**Суть:** WWW — гипертекстовая система над Интернетом. Три столпа: URL, HTML, HTTP.","","**Архитектура WWW:**","- **URL** — адрес ресурса (схема://хост:порт/путь?параметры).","- **HTML** — разметка с гиперссылками.","- **HTTP** — протокол обмена.","- Модель **клиент-сервер**.","","**Статические страницы:** готовые HTML-файлы, отдаются как есть.","","**Динамические страницы:** генерируются сервером по запросу.","- **CGI** — ранний механизм (процесс на каждый запрос).","- **PHP, Python, Node.js** — серверные языки.","- **JavaScript + AJAX** — динамика на клиенте без перезагрузки.","","**Веб-приложения:**","- Сложная логика сервер/клиент.","- **REST API** — HTTP-методы (GET, POST, PUT, DELETE) для операций.","","**Веб-поиск:**","1. **Краулер (crawler, паук)** — обходит страницы по ссылкам.","2. **Инвертированный индекс** — по слову → список страниц.","3. **Ранжирование** — **PageRank** (ссылки как голоса).","","**HTTP:**","- Поверх TCP, порт **80** (HTTP) или **443** (HTTPS).","- Модель **запрос-ответ**.","","**Структура запроса:** метод + URI + заголовки (Host, User-Agent, Cookie) + тело.","**Структура ответа:** статус + заголовки + тело.","","**Коды статуса:**","- **1xx** — информационные.","- **2xx** — успех (200 OK).","- **3xx** — перенаправление (301, 302).","- **4xx** — ошибка клиента (400, 403, 404).","- **5xx** — ошибка сервера (500, 503).","","**Версии HTTP:**","- **HTTP/1.0** — новое соединение на каждый запрос.","- **HTTP/1.1** — **keep-alive** (постоянные соединения).","- **HTTP/2** — мультиплексирование, бинарный, сжатие заголовков, server push.","- **HTTP/3** — **QUIC** поверх UDP (решает head-of-line blocking).","","**Для устного:** HTTP/3 — первая версия, не работающая поверх TCP."]},{"n":52,"title":"Контент и интернет-трафик. Серверные фермы и веб-прокси. Сети доставки контента. Сети одноранговых узлов (пиринговые сети).","paragraphs":["**Контент и интернет-трафик.** Основную долю интернет-трафика сегодня составляет потоковое видео (Netflix, YouTube — более половины всего трафика), за ним следуют обмен файлами, веб-контент, социальные сети и игры. Объём трафика растёт экспоненциально, и главная инженерная задача — доставить контент пользователю быстро, надёжно и с минимальными затратами.","**Серверные фермы (Server Farms).** Один сервер не способен обслужить миллионы запросов. Решение — **кластер серверов** за **балансировщиком нагрузки** (load balancer). Балансировщик принимает входящие запросы и распределяет их между серверами по различным алгоритмам: round-robin (по кругу), least connections (серверу с наименьшим числом активных соединений), IP hash (привязка клиента к серверу по IP). Серверная ферма обеспечивает **горизонтальное масштабирование** (добавление серверов) и **отказоустойчивость** (выход одного сервера не останавливает работу).","**Веб-прокси (Web Proxy).** Прокси — это промежуточный сервер между клиентом и веб-сервером. **Прямой прокси** (forward proxy) работает на стороне клиента: все запросы проходят через него, он может кэшировать ответы, фильтровать контент и скрывать IP-адрес клиента. **Обратный прокси** (reverse proxy) работает на стороне сервера: принимает запросы от клиентов и перенаправляет их на внутренние серверы, обеспечивая балансировку нагрузки, кэширование и защиту. Кэширование на прокси снижает нагрузку на оригинальный сервер и ускоряет отклик для пользователя.","**Сети доставки контента (CDN).** CDN (Content Delivery Network) — глобальная сеть **edge-серверов** (пограничных серверов), размещённых в точках присутствия (PoP) по всему миру, как можно ближе к конечным пользователям. Когда пользователь запрашивает ресурс, CDN направляет его на ближайший edge-сервер. Это достигается через **DNS-перенаправление** (авторитетный DNS CDN возвращает IP ближайшего сервера) или **anycast-маршрутизацию**.","**Принцип работы CDN.** Оригинальный контент хранится на **origin-сервере** владельца. Edge-серверы кэшируют копии контента. При первом запросе edge-сервер получает контент от origin и сохраняет в кэш. Последующие запросы обслуживаются из кэша. CDN особенно эффективны для статического контента (изображения, видео, CSS, JavaScript). Примеры CDN: Akamai, Cloudflare, Amazon CloudFront.","**Сети одноранговых узлов (P2P, пиринговые сети).** В модели клиент-сервер вся нагрузка ложится на сервер. В P2P-сети каждый узел (peer) является одновременно **клиентом и сервером** — он и скачивает, и раздаёт данные. Чем больше пользователей, тем больше совокупная пропускная способность сети. Это делает P2P хорошо масштабируемой архитектурой.","**BitTorrent** — наиболее известный P2P-протокол. Файл разбивается на **блоки (chunks)**. Блоки скачиваются параллельно от нескольких узлов (peers). Для отслеживания, кто какие блоки имеет, используется **трекер** (или **DHT** — распределённая хеш-таблица, работающая без центрального сервера). Алгоритм **tit-for-tat** стимулирует раздачу: узел предпочитает отдавать блоки тем, кто активно раздаёт ему. Стратегия выбора блоков — **rarest first** (сначала самый редкий блок), чтобы обеспечить равномерное распределение всех блоков в сети.","**Связь тем.** Серверные фермы и CDN решают проблему масштабирования центрального сервера. P2P решает её иначе — распределяя нагрузку между самими пользователями. CDN использует DNS для перенаправления. Все три подхода дополняют друг друга в современной инфраструктуре."],"terms":[{"ru":"CDN","en":"Content Delivery Network","df":"сеть edge-серверов для быстрой доставки контента пользователям"},{"ru":"P2P","en":"Peer-to-Peer","df":"одноранговая сеть, где каждый узел и клиент, и сервер"},{"ru":"DHT","en":"Distributed Hash Table","df":"распределённая хеш-таблица для поиска узлов без трекера"},{"ru":"PoP","en":"Point of Presence","df":"точка присутствия CDN, где размещён edge-сервер"}],"summary":["","**Суть:** Масштабирование доставки контента через кластеры, прокси, CDN и P2P.","","**Трафик в Интернете:** видео (Netflix, YouTube — >50%), файлы, веб, соцсети, игры. Растёт экспоненциально.","","**Серверные фермы:**","- Кластер серверов за **балансировщиком нагрузки**.","- Алгоритмы: round-robin, least connections, IP hash.","- Горизонтальное масштабирование + отказоустойчивость.","","**Веб-прокси:**","- **Forward proxy** — на стороне клиента (корпоративный прокси).","- **Reverse proxy** — на стороне сервера (Nginx, HAProxy, Cloudflare).","- Функции: кэш, фильтрация, анонимность, логи.","","**CDN (Content Delivery Network):**","- **Edge-серверы** в точках присутствия (PoP) по всему миру.","- Пользователь получает контент от ближайшего сервера.","- **DNS-перенаправление** или **anycast**.","- Origin хранит оригинал; edge кэширует.","- Примеры: **Akamai, Cloudflare, Amazon CloudFront**.","","**P2P (Peer-to-Peer):**","- Каждый узел = **клиент + сервер**.","- Масштабируется с ростом пользователей (вклад в полосу).","","**BitTorrent:**","- Файл → **блоки (chunks)**.","- Параллельное скачивание от многих peer-ов.","- **Трекер** или **DHT** (распределённая хеш-таблица).","- **Tit-for-tat** — даёт блоки тем, кто активно отдаёт.","- **Rarest first** — сначала самый редкий блок.","","**Для устного:** Client-server vs CDN vs P2P — три подхода к масштабированию."]},{"n":53,"title":"Цифровой звук и видео. Потоковая передача сохранённых медиафайлов. Передача медиафайлов в реальном времени. Конференции в реальном времени.","paragraphs":["**Цифровой звук.** Звуковой сигнал оцифровывается методом **PCM** (Pulse Code Modulation — импульсно-кодовая модуляция): аналоговый сигнал **дискретизируется** (sampling) с определённой частотой и **квантуется** (quantization) — каждому отсчёту присваивается числовое значение. CD-качество: 44 100 отсчётов в секунду, 16 бит на отсчёт, 2 канала — это примерно 1.4 Мбит/с. Для снижения битрейта используются кодеки сжатия: **MP3** (MPEG-1 Audio Layer 3), **AAC** (Advanced Audio Coding), **Opus** (современный, хорош для VoIP). Сжатие с потерями использует свойства человеческого слуха — удаляет звуки, которые человек не воспринимает.","**Цифровое видео** — последовательность кадров (frames), обычно 24–60 в секунду. Без сжатия видео Full HD занимает огромную полосу. Сжатие использует **пространственную избыточность** (внутри кадра много похожих участков) и **временну́ю избыточность** (соседние кадры похожи). Стандарты сжатия: **H.264** (AVC), **H.265** (HEVC, вдвое эффективнее H.264), **VP9**, **AV1**.","**Типы кадров** в видеосжатии. **I-кадр** (Intra) — ключевой, кодируется целиком, как отдельная картинка. **P-кадр** (Predicted) — кодирует только отличия от предыдущего кадра. **B-кадр** (Bidirectional) — кодирует отличия как от предыдущего, так и от следующего кадра, обеспечивая максимальное сжатие.","**Потоковая передача сохранённых медиафайлов (Streaming Stored Media).** Файл хранится на сервере и передаётся клиенту постепенно. Клиент начинает воспроизведение **до** окончания загрузки. Для компенсации нестабильности сети используется **буфер воспроизведения** (playout buffer): клиент накапливает несколько секунд данных перед началом проигрывания. Современный подход — **адаптивный стриминг** (например, **DASH** — Dynamic Adaptive Streaming over HTTP): видео разбивается на короткие сегменты (обычно 2–10 секунд), каждый сегмент доступен в нескольких вариантах качества (битрейта). Клиент автоматически выбирает подходящее качество в зависимости от текущей пропускной способности.","**Передача медиафайлов в реальном времени (Live Streaming).** В отличие от воспроизведения записей, здесь контент генерируется в момент передачи. Задержка (latency) критически важна и должна быть минимальной. Используется **RTP** (Real-time Transport Protocol) поверх UDP для передачи данных и **RTCP** для обратной связи о качестве. Для веб-браузеров применяется **HLS** (HTTP Live Streaming) или **DASH** — они работают поверх HTTP/TCP, что проще для прохождения через файрволы, но вносят дополнительную задержку (обычно 5–30 секунд).","**Конференции в реальном времени** (видеозвонки, телефония) предъявляют самые жёсткие требования к задержке: допустимый порог — менее **150 мс** в одну сторону, иначе разговор становится неудобным. Для установки сеанса используются **сигнальные протоколы**: **SIP** (Session Initiation Protocol) — открытый стандарт, или **H.323** — более старый стандарт ITU. Сигнальный протокол отвечает за поиск абонента, согласование параметров (кодеки, адреса, порты) и управление сеансом (начало, завершение, удержание).","Сами медиаданные в конференциях передаются по **RTP** поверх UDP. Для прохождения через NAT используются серверы **STUN** (определение внешнего адреса) и **TURN** (релей трафика, если прямое соединение невозможно). Фреймворк **ICE** (Interactive Connectivity Establishment) автоматически выбирает лучший путь между участниками. В браузерах всё это реализуется через **WebRTC** — открытый стандарт для аудио/видеосвязи без плагинов.","**Проблемы и решения.** **Джиттер** (вариация задержки) компенсируется буфером воспроизведения. **Потеря пакетов** скрывается через **FEC** (Forward Error Correction — избыточное кодирование, позволяющее восстановить данные без повторной передачи) или через интерполяцию (воспроизведение предыдущего кадра/отсчёта). Повторная передача (как в TCP) обычно неприменима — к моменту доставки данные уже не нужны."],"terms":[{"ru":"PCM","en":"Pulse Code Modulation","df":"импульсно-кодовая модуляция — базовый метод оцифровки звука"},{"ru":"DASH","en":"Dynamic Adaptive Streaming over HTTP","df":"адаптивный стриминг с выбором качества по полосе"},{"ru":"SIP","en":"Session Initiation Protocol","df":"сигнальный протокол для установки голосовых и видеосеансов"},{"ru":"WebRTC","en":"Web Real-Time Communication","df":"стандарт для аудио/видеосвязи в браузере без плагинов"},{"ru":"FEC","en":"Forward Error Correction","df":"упреждающая коррекция ошибок без повторной передачи"}],"summary":["","**Суть:** Передача мультимедиа — разные требования к задержке и надёжности.","","**Цифровой звук:**","- **PCM (Pulse Code Modulation)** — дискретизация + квантование.","- CD: 44.1 кГц × 16 бит × 2 канала ≈ 1.4 Мбит/с.","- Кодеки: **MP3, AAC, Opus** (для VoIP).","","**Цифровое видео:**","- 24–60 кадров/с.","- Сжатие использует **пространственную** (внутри кадра) и **временную** (между кадрами) избыточность.","- Кодеки: **H.264 (AVC), H.265 (HEVC), VP9, AV1**.","","**Типы кадров:**","- **I-кадр (Intra)** — ключевой, целиком.","- **P-кадр (Predicted)** — отличия от предыдущего.","- **B-кадр (Bidirectional)** — отличия от обоих соседних.","","**Streaming Stored Media (сохранённые файлы):**","- Воспроизведение до окончания загрузки.","- **Playout buffer** компенсирует джиттер.","- **DASH** (Dynamic Adaptive Streaming over HTTP) — сегменты в разных качествах, клиент выбирает.","","**Live Streaming (реальное время):**","- Низкая задержка важнее качества.","- **RTP** + **RTCP** поверх UDP.","- Для веба — **HLS** или **DASH** (поверх HTTP, больше задержка).","","**Конференции:**","- Задержка < **150 мс** в одну сторону.","- **Сигнализация: SIP** (Session Initiation Protocol) или H.323.","- **Медиа: RTP** поверх UDP.","- **NAT traversal: STUN, TURN, ICE**.","- В браузере — **WebRTC**.","","**Проблемы:**","- **Джиттер** → playout buffer.","- **Потери** → **FEC** (восстановление без повтора) или интерполяция.","- Повтор как в TCP не работает — данные уже не нужны.","","**Для устного:** RTP поверх UDP — потому что повторная передача в TCP создаёт недопустимую задержку."]},{"n":54,"title":"Основные модули службы FTP. Управляющий сеанс и сеанс передачи данных. Команды взаимодействия FTP-клиента с FTP-сервером.","paragraphs":["**FTP** (File Transfer Protocol, RFC 959) — протокол передачи файлов, работающий поверх TCP. Несмотря на появление более современных альтернатив, FTP важен для понимания сетевых протоколов благодаря своей характерной особенности — разделению управления и данных на два отдельных соединения.","**Основные модули службы FTP.** На стороне клиента работают два модуля: **PI** (Protocol Interpreter, интерпретатор протокола) — отправляет команды серверу и обрабатывает ответы, и **DTP** (Data Transfer Process, процесс передачи данных) — непосредственно передаёт или принимает файлы. На стороне сервера — аналогичные модули: серверный PI принимает и обрабатывает команды, серверный DTP выполняет передачу данных. Дополнительно сервер имеет **файловую систему**, к которой DTP обращается для чтения или записи файлов.","**Управляющий сеанс (Control Connection)** устанавливается на **порту 21** сервера. Это постоянное TCP-соединение, которое существует на протяжении всей FTP-сессии. По нему передаются текстовые команды от клиента и числовые ответы от сервера. Управляющее соединение используется для аутентификации, навигации по директориям, задания параметров передачи и инициирования передачи файлов.","**Сеанс передачи данных (Data Connection)** открывается **отдельно** для каждой операции передачи — будь то скачивание файла, загрузка файла или получение списка директории. После завершения передачи соединение данных закрывается. Такое разделение позволяет продолжать управление (посылать команды) даже во время длительной передачи файла.","Соединение данных может устанавливаться в двух режимах. В **активном режиме** клиент командой **PORT** сообщает серверу свой IP-адрес и порт, на который готов принять соединение. Сервер инициирует TCP-соединение со своего порта 20 к указанному порту клиента. Проблема: если клиент находится за NAT или файрволом, входящее соединение от сервера может быть заблокировано.","В **пассивном режиме** клиент отправляет команду **PASV**. Сервер открывает порт на своей стороне и сообщает его клиенту. Клиент сам инициирует соединение к этому порту. Пассивный режим решает проблему NAT и файрволов, поэтому он стал стандартом в современном использовании FTP.","**Команды взаимодействия FTP-клиента с сервером.** Аутентификация: **USER** (имя пользователя), **PASS** (пароль). Навигация: **PWD** (показать текущую директорию), **CWD** (сменить директорию), **LIST** (получить содержимое директории). Передача файлов: **RETR** (скачать файл с сервера), **STOR** (загрузить файл на сервер), **DELE** (удалить файл). Режим передачи: **TYPE A** (ASCII, для текста) или **TYPE I** (Image/Binary, для бинарных данных). Управление соединением: **PORT** (активный режим), **PASV** (пассивный режим), **QUIT** (завершить сессию).","**Ответы сервера** — трёхзначные числовые коды с текстовым пояснением. **1xx** — положительный предварительный (110 — начало передачи). **2xx** — положительный завершающий (220 — сервер готов, 226 — передача завершена, 230 — аутентификация успешна). **3xx** — положительный промежуточный (331 — требуется пароль). **4xx** — временная ошибка (421 — сервис недоступен). **5xx** — постоянная ошибка (530 — не аутентифицирован, 550 — файл не найден).","**Защищённые варианты.** **FTPS** — FTP с добавлением TLS-шифрования (тот же протокол, но данные шифруются). **SFTP** — совершенно другой протокол, работающий поверх SSH (порт 22), не имеющий ничего общего с FTP, кроме назначения.","**Связь с другими темами.** FTP использует TCP для обоих соединений. Разделение на управляющее соединение и соединение данных — уникальная архитектура, не встречающаяся в HTTP или SMTP. Проблема NAT в активном режиме FTP — классический пример того, как NAT ломает протоколы, не рассчитанные на трансляцию адресов."],"terms":[{"ru":"PI","en":"Protocol Interpreter","df":"интерпретатор протокола — обрабатывает команды и ответы FTP"},{"ru":"DTP","en":"Data Transfer Process","df":"процесс передачи данных — непосредственно передаёт файлы"},{"ru":"Активный режим","en":"Active Mode (PORT)","df":"сервер инициирует соединение данных к клиенту"},{"ru":"Пассивный режим","en":"Passive Mode (PASV)","df":"клиент инициирует соединение данных к серверу"}],"summary":["","**Суть:** FTP — протокол передачи файлов с двумя раздельными соединениями.","","**Модули FTP:**","- На клиенте и сервере:","- **PI (Protocol Interpreter)** — обрабатывает команды.","- **DTP (Data Transfer Process)** — передаёт файлы.","- Сервер также имеет доступ к **файловой системе**.","","**Управляющее соединение (Control Connection):**","- Порт **21** сервера.","- **Постоянное** на всю сессию.","- Текстовые команды и ответы.","","**Соединение данных (Data Connection):**","- **Отдельное** для каждой передачи.","- Закрывается после операции.","","**Активный режим (PORT):**","- Клиент сообщает свой порт.","- **Сервер** инициирует соединение с порта 20.","- **Проблема:** NAT/файрволы блокируют входящее к клиенту.","","**Пассивный режим (PASV):**","- Сервер открывает порт, сообщает клиенту.","- **Клиент** инициирует соединение.","- Современный стандарт, решает проблему NAT.","","**Основные команды:**","- **USER, PASS** — аутентификация.","- **PWD, CWD** — директории.","- **LIST** — список файлов.","- **RETR** — скачать, **STOR** — загрузить, **DELE** — удалить.","- **TYPE A** — ASCII, **TYPE I** — бинарный.","- **PORT/PASV** — режим.","- **QUIT** — завершить.","","**Ответы сервера (3-значные коды):**","- **1xx** — предварительный (110 — начинается передача).","- **2xx** — успех (220 — готов, 226 — передача завершена, 230 — авторизация).","- **3xx** — требуется ещё (331 — пароль).","- **4xx** — временная ошибка (421).","- **5xx** — постоянная ошибка (530 — не авторизован, 550 — нет файла).","","**Защита:**","- **FTPS** — FTP + TLS.","- **SFTP** — совсем другой протокол (поверх SSH, порт 22).","","**Для устного:** Два соединения (контроль + данные) — уникальная черта FTP. Проблема с NAT → пассивный режим."]},{"n":55,"title":"Протокол ICMP. Утилиты traceroute и ping.","paragraphs":["**ICMP** (Internet Control Message Protocol, RFC 792) — вспомогательный протокол **сетевого уровня**, работающий непосредственно поверх IP (номер протокола 1 в заголовке IP). ICMP не переносит данные пользователя — его назначение в том, чтобы сообщать об ошибках при доставке пакетов и предоставлять инструменты диагностики сети.","**Структура ICMP-сообщения** состоит из четырёх полей: **Type** (тип сообщения, 8 бит), **Code** (уточняющий код, 8 бит), **Checksum** (контрольная сумма, 16 бит) и **данные** (зависят от типа). В данные обычно включается заголовок IP-пакета, вызвавшего ошибку, чтобы отправитель мог определить, какой именно пакет не был доставлен.","**Основные типы ICMP-сообщений.** **Echo Request** (Type 8) и **Echo Reply** (Type 0) — запрос и ответ эха, используются утилитой ping. **Destination Unreachable** (Type 3) — хост, сеть или порт недоступны; код уточняет причину (Code 0 — сеть недоступна, Code 1 — хост недоступен, Code 3 — порт недоступен). **Time Exceeded** (Type 11) — TTL пакета истёк (Code 0) или истекло время сборки фрагментов (Code 1). Именно этот тип используется утилитой traceroute. **Redirect** (Type 5) — маршрутизатор сообщает хосту, что существует более короткий маршрут.","**Утилита ping** — простейший инструмент диагностики сетевой доступности. Она отправляет серию сообщений **Echo Request** на целевой хост и ждёт ответов **Echo Reply**. По результатам ping показывает: **RTT** (Round-Trip Time — время прохождения запроса и ответа), процент потерь пакетов и статистику (минимальное, среднее, максимальное RTT). Если ответ не приходит, это может означать, что хост недоступен, но также что файрвол блокирует ICMP (многие серверы блокируют ping из соображений безопасности).","**Утилита traceroute** определяет маршрут (последовательность маршрутизаторов), по которому пакет проходит от отправителя до получателя. Принцип работы основан на поле **TTL** (Time To Live) в заголовке IP. Каждый маршрутизатор уменьшает TTL на единицу. Когда TTL достигает нуля, маршрутизатор отбрасывает пакет и отправляет отправителю сообщение **ICMP Time Exceeded**.","Traceroute отправляет серию пакетов с последовательно увеличивающимся TTL: первый пакет с TTL=1 (его отбросит первый маршрутизатор, вернув Time Exceeded с собственным IP-адресом), второй с TTL=2 (его отбросит второй маршрутизатор) и так далее. Когда пакет наконец достигнет цели, хост ответит (Echo Reply в случае ICMP-реализации, или ICMP Port Unreachable в Unix-реализации, которая использует UDP на заведомо закрытый порт). Обычно traceroute отправляет по 3 пакета на каждый TTL и показывает все три RTT, чтобы можно было оценить стабильность.","**ICMPv6** — аналог ICMP для IPv6, но с расширенными функциями. Помимо сообщений об ошибках и диагностики, ICMPv6 включает протокол **NDP** (Neighbor Discovery Protocol), который заменяет ARP из IPv4. NDP выполняет обнаружение соседей, определение адреса канального уровня, обнаружение маршрутизаторов и автоконфигурацию адресов.","**Связь с другими темами.** ICMP работает на сетевом уровне (поверх IP), но обслуживает протоколы всех уровней — любой протокол, отправляющий IP-пакеты, может получить ICMP-ошибку. Сообщение Destination Unreachable (Port Unreachable) используется в работе UDP. TTL, используемый traceroute, — это поле IP-заголовка, изучаемое на сетевом уровне."],"terms":[{"ru":"ICMP","en":"Internet Control Message Protocol","df":"протокол сигнализации об ошибках и диагностики сети"},{"ru":"TTL","en":"Time To Live","df":"поле IP-заголовка, уменьшаемое каждым маршрутизатором; при нуле пакет отбрасывается"},{"ru":"NDP","en":"Neighbor Discovery Protocol","df":"протокол обнаружения соседей в IPv6, замена ARP"},{"ru":"RTT","en":"Round-Trip Time","df":"время кругового обхода — от отправки запроса до получения ответа"}],"summary":["","**Суть:** ICMP — вспомогательный протокол для ошибок и диагностики.","","**ICMP (RFC 792):**","- **Сетевой уровень**, поверх IP (номер протокола 1).","- Не передаёт пользовательские данные.","- Сообщения об ошибках и диагностика.","","**Формат:** Type + Code + Checksum + данные (обычно фрагмент заголовка IP-пакета, вызвавшего ошибку).","","**Основные типы:**","- **Type 8 / Type 0** — Echo Request / Echo Reply (ping).","- **Type 3** — Destination Unreachable (Code 0 — сеть, 1 — хост, 3 — порт).","- **Type 11** — Time Exceeded (TTL истёк) — используется traceroute.","- **Type 5** — Redirect (маршрутизатор предлагает другой путь).","","**ping:**","- Шлёт **Echo Request**.","- Ждёт **Echo Reply**.","- Измеряет **RTT** (round-trip time).","- Показывает потери пакетов и статистику.","- Может быть заблокирован файрволами.","","**traceroute:**","- Использует поле **TTL**.","- Каждый маршрутизатор уменьшает TTL на 1. При TTL=0 отбрасывает и шлёт **ICMP Time Exceeded** с собственным IP.","- Traceroute шлёт пакеты с TTL=1, 2, 3, ... → получает ответы от каждого маршрутизатора на пути.","- По 3 пакета на каждый TTL — оценка стабильности.","- В Unix традиционно использует UDP на заведомо закрытый порт (получает Destination Unreachable); в Windows (tracert) — ICMP Echo.","","**ICMPv6:**","- Аналог для IPv6 с расширенными функциями.","- Включает **NDP** (Neighbor Discovery Protocol) — замена ARP.","","**Для устного:** Ping проверяет доступность, traceroute показывает путь."]}],"quizzes":[{"type":"mcq","topic":"Вопрос 48","q":"На каком порту работает протокол DNS?","opts":["80","53","25","443"],"ans":1,"expl":"Протокол DNS работает по UDP/TCP на порту 53."},{"type":"mcq","topic":"Вопрос 48","q":"Какой тип записи DNS используется для обратного преобразования адреса в имя?","opts":["A","MX","CNAME","PTR"],"ans":3,"expl":"PTR — запись обратного преобразования адреса в имя."},{"type":"tf","topic":"Вопрос 48","q":"TCP используется в DNS при ответах размером более 512 байт и при передаче зон (AXFR).","ans":true,"expl":"TCP используется при ответах размером более 512 байт и при передаче зон (AXFR)."},{"type":"mcq","topic":"Вопрос 49","q":"Какой стандарт определяет формат сообщений электронной почты?","opts":["RFC 959","RFC 5322","RFC 792","RFC 4301"],"ans":1,"expl":"Формат сообщений электронной почты определён стандартом RFC 5322."},{"type":"tf","topic":"Вопрос 49","q":"Агент доставки сообщений (MDA) передаёт сообщения между почтовыми серверами по протоколу SMTP.","ans":false,"expl":"MTA (агент передачи сообщений) передаёт сообщения между серверами по SMTP. MDA осуществляет окончательную доставку в почтовый ящик пользователя."},{"type":"mcq","topic":"Вопрос 50","q":"На каком порту работает SMTP для межсерверной связи?","opts":["587","110","25","143"],"ans":2,"expl":"SMTP работает по TCP на порту 25 для межсерверной связи и 587 для отправки клиентом."},{"type":"tf","topic":"Вопрос 50","q":"Протокол IMAP хранит сообщения на сервере и поддерживает папки, частичную загрузку и поиск на сервере.","ans":true,"expl":"IMAP — более мощный протокол, при котором сообщения хранятся на сервере; поддерживает папки, частичную загрузку, поиск на сервере и синхронизацию нескольких клиентов."},{"type":"mcq","topic":"Вопрос 51","q":"Какой протокол лежит в основе HTTP/3?","opts":["TCP","SCTP","QUIC (UDP)","DCCP"],"ans":2,"expl":"HTTP/3 работает поверх протокола QUIC (UDP), устраняя блокировку очереди (HOL blocking)."},{"type":"tf","topic":"Вопрос 51","q":"HTTP/2 использует мультиплексирование в рамках одного TCP-соединения и сжатие заголовков (HPACK).","ans":true,"expl":"HTTP/2 использует мультиплексирование в рамках одного TCP-соединения и сжатие заголовков (HPACK)."},{"type":"mcq","topic":"Вопрос 52","q":"Как CDN направляет пользователя к ближайшему серверу?","opts":["ARP-перенаправление","DNS-перенаправление","ICMP Redirect","BGP-перенаправление"],"ans":1,"expl":"CDN использует DNS-перенаправление: DNS-запрос пользователя разрешается в IP ближайшего узла CDN."},{"type":"tf","topic":"Вопрос 52","q":"В BitTorrent трекер (tracker) или DHT обеспечивают поиск пиров.","ans":true,"expl":"Трекер (tracker) или DHT (Distributed Hash Table) обеспечивают поиск пиров в BitTorrent."},{"type":"mcq","topic":"Вопрос 53","q":"Какова частота дискретизации стандарта CD (PCM)?","opts":["22050 Гц","48000 Гц","44100 Гц","96000 Гц"],"ans":2,"expl":"Стандарт CD — 44100 Гц, 16 бит, 2 канала (1,4 Мбит/с)."},{"type":"tf","topic":"Вопрос 53","q":"Джиттер (jitter) — это потеря пакетов при передаче медиаданных.","ans":false,"expl":"Джиттер (jitter) — это вариация задержки, а не потеря пакетов. Он компенсируется буфером воспроизведения (playout buffer)."},{"type":"mcq","topic":"Вопрос 54","q":"На какой порт устанавливается управляющее соединение FTP?","opts":["20","21","22","23"],"ans":1,"expl":"Управляющее соединение FTP устанавливается на порт 21 сервера."},{"type":"tf","topic":"Вопрос 54","q":"В пассивном режиме FTP (PASV) сервер инициирует соединение данных к клиенту.","ans":false,"expl":"В пассивном режиме (PASV) клиент сам подключается к серверу. В активном режиме сервер инициирует соединение данных с клиентом."},{"type":"mcq","topic":"Вопрос 55","q":"Какой тип сообщения ICMP используется утилитой traceroute при истечении TTL?","opts":["Echo Reply (тип 0)","Destination Unreachable (тип 3)","Redirect (тип 5)","Time Exceeded (тип 11)"],"ans":3,"expl":"При TTL=0 маршрутизатор отбрасывает пакет и возвращает ICMP Time Exceeded (тип 11)."},{"type":"match","topic":"Тема 7 — Сопоставление","q":"Сопоставьте протокол/технологию с их назначением:","pairs":[["DNS","Преобразование доменных имён в IP-адреса"],["SMTP","Передача почты между серверами (порт 25)"],["IMAP","Управление почтой на сервере (папки, поиск)"],["RTP","Передача медиаданных реального времени"],["FTP","Передача файлов (два TCP-соединения: порт 21 + данные)"],["ICMP","Сигнализация об ошибках и диагностика сети"]],"expl":"Каждый протокол имеет своё чёткое назначение в стеке TCP/IP."}]},{"id":8,"name":"Вопросы безопасности","questions":[{"n":56,"title":"Основные понятия информационной безопасности. Безопасная система, угроза, атака, риск.","paragraphs":["**Информационная безопасность** — это защита информации от угроз. Главная цель — сохранить три свойства, которые называют **триадой CIA**.","**1. Конфиденциальность (Confidentiality).** Информацию могут читать только те, кому она разрешена. Нарушение — утечка данных.","**2. Целостность (Integrity).** Информация не должна изменяться без разрешения. Нарушение — подмена данных.","**3. Доступность (Availability).** Информация должна быть доступна, когда нужна. Нарушение — атака отказа в обслуживании (DoS).","**Дополнительные свойства.** **Аутентичность** — проверка, что человек тот, за кого себя выдаёт. **Неотказуемость** (non-repudiation) — пользователь не может отрицать, что сделал действие.","**Безопасная система.** Это система, в которой сохраняются все три свойства CIA (и дополнительные при необходимости). Абсолютно безопасных систем не существует. Задача — сделать систему безопасной в разумной степени: стоимость защиты должна быть меньше, чем стоимость потерь при атаке.","**Угроза (threat)** — потенциальная опасность для информации. Это ещё не атака, а возможность её. Примеры угроз: существование вируса, наличие уязвимого сотрудника, возможность утечки через сеть. Угрозы классифицируют по источнику: **природные** (пожар, наводнение), **техногенные** (сбой оборудования, отключение питания), **антропогенные** (ошибки людей, злонамеренные действия).","**Уязвимость (vulnerability)** — слабое место в системе, которое может быть использовано для атаки. Например: устаревшее программное обеспечение с известной ошибкой, слабый пароль, отсутствие шифрования.","**Атака (attack)** — это реализация угрозы через уязвимость. Угроза — теоретическая возможность; атака — реальное действие. Атаки бывают **пассивные** (только наблюдение, например прослушка трафика) и **активные** (изменение данных или работы системы).","**Риск (risk)** — произведение вероятности атаки на величину ущерба. Формула: **Risk = Probability × Impact**. Это главная метрика для принятия решений. Не имеет смысла тратить миллион на защиту от атаки, которая нанесёт ущерб в тысячу рублей.","**Связь понятий.** Угроза существует всегда. Уязвимость может быть или не быть. Если угроза и уязвимость пересекаются — возможна атака. Вероятность атаки и её ущерб определяют риск.","**Принципы защиты.** **Глубокая защита** (defense in depth) — много уровней защиты, не один. **Минимум привилегий** (least privilege) — каждому пользователю только те права, которые нужны. **Разделение обязанностей** — критические действия требуют нескольких людей."],"terms":[{"ru":"CIA-триада","en":"CIA Triad","df":"конфиденциальность, целостность, доступность"},{"ru":"Угроза","en":"Threat","df":"потенциальная опасность для информации"},{"ru":"Уязвимость","en":"Vulnerability","df":"слабое место в системе, которое может быть использовано"},{"ru":"Атака","en":"Attack","df":"реализация угрозы через уязвимость"},{"ru":"Риск","en":"Risk","df":"произведение вероятности атаки на ущерб"}],"summary":["","**Суть:** Защита информации от угроз. Главная модель — триада CIA.","","**Триада CIA:**","- **Confidentiality (конфиденциальность)** — информацию читают только разрешённые.","- **Integrity (целостность)** — информация не меняется без разрешения.","- **Availability (доступность)** — доступ когда нужен.","","**Дополнительно:** **аутентичность** (подлинность), **неотказуемость** (non-repudiation).","","**Безопасная система:**","- Сохраняет свойства CIA.","- Абсолютная безопасность невозможна.","- Критерий: **стоимость защиты < стоимости потерь**.","","**Угроза (threat):**","- Потенциальная опасность.","- Природные (пожар), техногенные (сбой), **антропогенные** (ошибки людей или злой умысел).","","**Уязвимость (vulnerability):**","- Слабое место в системе.","- Примеры: устаревшее ПО, слабый пароль, отсутствие шифрования.","","**Атака (attack):**","- Реализация угрозы через уязвимость.","- **Пассивная** (прослушка) vs **активная** (изменение данных).","","**Риск (risk):**","- Формула: **Risk = Probability × Impact**.","- Главная метрика для принятия решений.","","**Принципы защиты:**","- **Defense in depth** — много уровней.","- **Least privilege** — минимум прав.","- **Разделение обязанностей** — критические действия нескольких людей.","","**Для устного:** CIA — фундамент всей ИБ."]},{"n":57,"title":"Типы и примеры атак: атаки отказа в обслуживании, перехват и перенаправление трафика, вредоносные программы, троянские программы, сетевые черви, вирусы, шпион
