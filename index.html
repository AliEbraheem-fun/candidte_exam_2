ide-channel**: тайминги, потребление энергии, акустика, кэш-атаки (**Spectre, Meltdown**); **Cold-boot/Evil maid**", "**MITM** — атакующий в соединении: чтение и модификация", "**ARP-spoofing** (подмена в LAN); **DHCP-spoofing** (rogue DHCP); **DNS cache poisoning** (Kaminsky)", "**BGP hijacking** — анонс чужого префикса (Pakistan Telecom vs YouTube 2008); **SSL stripping** (HTTPS → HTTP); **TLS downgrade**: POODLE, Logjam, BEAST, Heartbleed, FREAK", "Защита: HTTPS+HSTS, **DNSSEC**, **RPKI** для BGP, 802.1X для LAN, мониторинг", "**Прикладные атаки**: **SQL Injection**, **XSS** (Cross-Site Scripting), **CSRF**, **SSRF**, **RCE** (Log4Shell, Shellshock, Heartbleed)", "Buffer overflow, Use-after-free, race conditions, path traversal, deserialization, **XXE** (XML External Entity); **OWASP Top 10**", "**Социальная инженерия**: **phishing** (поддельные письма/сайты); **spear phishing** (целевой); **vishing/smishing** (голос/SMS); pretexting; **watering hole** (заражение посещаемых сайтов)", "**Malware — Virus**: внедряется в исполняемый файл, требует запуска", "**Worm** (червь): самораспространяющийся через уязвимости сети — Morris worm (1988), Code Red, Slammer, Conficker, **WannaCry** (2017, EternalBlue+ransomware)", "**Trojan**: маскируется под легитимное, не самораспространяется, открывает **backdoor**; **Spyware** (keylogger); **Adware**; **Rootkit** (скрывает себя, модифицирует ядро/MBR/UEFI=bootkit)", "**Ransomware** (WannaCry, NotPetya, REvil, LockBit); **Cryptominer**; **Banking trojan** (Zeus, Emotet, TrickBot); **RAT**; **Botnet client**; **Logic bomb**; **Fileless** (в RAM/PowerShell/JS); **APT** (Advanced Persistent Threat — спецслужбы)", "Каналы заражения: phishing-вложения, drive-by downloads, exploit kits, supply-chain, USB, документы с макросами"]}, {"n": 58, "title": "Методы защиты. Политика безопасности.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Методы защиты информации** — совокупность технических, организационных, правовых и физических мер, обеспечивающих CIA-свойства (Q56). Никакая отдельная мера не достаточна — поэтому в основе ИБ лежит принцип **defense in depth** (эшелонированная защита) и формализация мер в **политике безопасности** организации. Современные системы защиты строятся вокруг моделей **управления доступом** (DAC, MAC, RBAC, ABAC), **разделения обязанностей**, **минимальных привилегий** и **Zero Trust**.", "<h3>Классификация методов защиты</h3>", "**По характеру меры**:\n- **Технические**: криптография (TLS, IPSec), межсетевые экраны, IDS/IPS, антивирусы, EDR/XDR, SIEM, контроль доступа, MFA, токены, аппаратные ключи (HSM), резервное копирование, бэкапы.\n- **Организационные / административные**: политики, регламенты, инструкции, обучение и тренинги персонала, процедуры найма и увольнения, классификация информации, соглашения о неразглашении (NDA), управление инцидентами.\n- **Правовые**: законодательство и регуляторы — ФЗ-152 «О персональных данных» (РФ), ФЗ-187 о КИИ, ФЗ-149 об информации; GDPR (ЕС), HIPAA (США, медицина), PCI DSS (платёжные карты), ISO 27001.\n- **Физические**: контроль доступа в помещения (СКУД, биометрия, охрана), видеонаблюдение, защита от пожаров и затоплений, климат-контроль ЦОДов, экранирование от ПЭМИН, защищённые шкафы для серверов.", "**По функции** (NIST):\n- **Превентивные** (preventive) — предотвращают инциденты: шифрование, аутентификация, МСЭ, патчинг, обучение.\n- **Детективные** (detective) — выявляют инциденты: IDS, IPS, мониторинг, SIEM, аудит логов, EDR, threat hunting.\n- **Корректирующие** (corrective) — восстанавливают после инцидента: бэкапы, DRP/BCP, изоляция систем, антивирус.\n- **Сдерживающие** (deterrent) — психологически отпугивают: предупреждения, наказания.\n- **Компенсирующие** (compensating) — заменяют отсутствующие основные меры.", "<h3>Политика безопасности</h3>", "**Security Policy** — высокоуровневый формализованный документ (или набор), определяющий **что защищаем, от кого и как**. Обычно иерархия:\n1. **Корпоративная политика ИБ** (Information Security Policy) — общий курс.\n2. **Тематические политики**: парольная, BYOD, удалённой работы, использования интернета, классификации данных, шифрования.\n3. **Стандарты** — конкретные требования (например, минимальная длина пароля 12 символов).\n4. **Процедуры** — пошаговые инструкции.\n5. **Руководства** — рекомендации, не обязательные.", "Содержание корпоративной политики:\n- **Сфера применения** и охватываемые активы.\n- **Модель угроз** и допустимый уровень риска.\n- **Роли и обязанности**: CISO, владельцы информации, администраторы, пользователи.\n- **Принципы**: classification, least privilege, separation of duties, AUP (Acceptable Use Policy).\n- **Процедуры**: управление инцидентами, доступом, изменениями, бэкапами.\n- **Метрики и аудит**.", "Жизненный цикл: разработка → утверждение → внедрение → обучение → мониторинг → пересмотр (минимум раз в год).", "<h3>Модели управления доступом</h3>", "- **DAC** (Discretionary Access Control): владелец объекта сам решает, кому давать доступ. Реализуется через списки доступа (ACL) или права POSIX (rwx). Используется в Linux, Windows NTFS. Уязвим к **trojan horse** (вредоносная программа от имени пользователя получает все его права).\n- **MAC** (Mandatory Access Control): права назначает **только администратор** на основе **меток конфиденциальности** (Public, Internal, Confidential, Secret, Top Secret). Модель Белла-ЛаПадулы (для конфиденциальности): «no read up, no write down»; Бибы — для целостности: «no read down, no write up». Реализации: SELinux, AppArmor, Trusted Solaris, военные системы. Защищает от утечек, но менее гибкая.\n- **RBAC** (Role-Based Access Control, NIST RBAC): права назначаются **ролям** (admin, accountant, hr), пользователи получают роли. Поддерживает иерархию ролей и SoD-ограничения. Используется в корпоративных ERP, AD, Kubernetes, K8s.\n- **ABAC** (Attribute-Based Access Control): права вычисляются по атрибутам (пользователь, ресурс, время, локация, контекст) через политики на XACML. Самая гибкая, но сложная.\n- **PBAC** (Policy-Based Access Control) — обобщение ABAC через декларативные правила.\n- **ReBAC** (Relationship-Based Access Control) — Google Zanzibar.", "<h3>Базовые принципы защиты</h3>", "- **Least Privilege**: минимально необходимые права.\n- **Separation of Duties** (SoD): критические операции требуют нескольких людей (выпуск платежа: один создаёт, другой одобряет).\n- **Need to Know / Need to Use**: доступ только к необходимым данным.\n- **Default Deny / Whitelist**: разрешено только явно перечисленное.\n- **Fail-Safe Defaults**: при отказе системы — закрытое состояние.\n- **Defense in Depth**: несколько независимых рубежей (фаервол + IDS + EDR + аудит).\n- **Open Design** (Kerckhoffs): стойкость в ключах, не в секретности алгоритма.\n- **Complete Mediation**: каждое обращение проверяется.\n- **Psychological Acceptability**: безопасность должна быть удобной.\n- **Zero Trust**: никому не доверять без проверки (Forrester ZTA, NIST SP 800-207).", "<h3>Регуляторика и стандарты</h3>", "- **ISO/IEC 27001** — требования к ISMS (Information Security Management System).\n- **ISO/IEC 27002** — кодекс практик.\n- **NIST Cybersecurity Framework** (Identify, Protect, Detect, Respond, Recover).\n- **CIS Controls** (Top 18) — приоритезированные практические контроли.\n- **OWASP ASVS** — для веб-приложений.\n- **ФСТЭК России** — приказы для ИСПДн и КИИ, нормативные документы.\n- **ГОСТ Р 57580.1/2** — банковский сектор."], "terms": [{"ru": "AUP", "en": "Acceptable Use Policy", "df": "политика допустимого использования"}, {"ru": "ISMS", "en": "Information Security Management System, ISO 27001", "df": "**Превентивные / детективные / корректирующие меры**"}, {"ru": "ABAC", "en": "Attribute-Based", "df": "управление по атрибутам, XACML"}, {"ru": "ACL", "en": "Access Control List", "df": "список доступа"}], "summary": ["**Защита информации** = технические + организационные + правовые + физические меры; **Defense in Depth**", "**Технические**: криптография (TLS/IPSec), МСЭ, IDS/IPS, антивирусы, EDR/XDR, SIEM, MFA, HSM, бэкапы", "**Организационные**: политики, регламенты, обучение, найм/увольнение, классификация, NDA, управление инцидентами", "**Правовые**: **ФЗ-152** (персональные данные РФ), **ФЗ-187** (КИИ), ФЗ-149 (информация); **GDPR** (ЕС), **HIPAA** (медицина США), **PCI DSS** (карты), **ISO 27001**", "**Физические**: СКУД, биометрия, охрана, видеонаблюдение, защита от пожаров/затоплений, климат-контроль ЦОД, экранирование ПЭМИН", "**По функции (NIST)**: **превентивные** (шифрование/МСЭ/патчинг); **детективные** (IDS/SIEM/аудит/EDR/threat hunting); **корректирующие** (бэкапы/DRP/BCP/изоляция); сдерживающие; компенсирующие", "**Security Policy** — высокоуровневый документ «что защищаем, от кого, как»", "Иерархия: 1) **корпоративная политика ИБ**; 2) тематические (парольная, BYOD, удалёнка); 3) **стандарты** (12 символов в пароле); 4) **процедуры**; 5) руководства", "Содержание: сфера, модель угроз, роли (**CISO**, владельцы, админы), принципы (classification, **AUP**), процедуры, метрики, аудит", "Жизненный цикл: разработка → утверждение → внедрение → обучение → мониторинг → пересмотр (мин. раз в год)", "**Модели управления доступом — DAC** (Discretionary): владелец задаёт права (ACL, POSIX rwx; Linux/NTFS); уязвим к trojan horse", "**MAC** (Mandatory): только админ, **метки конфиденциальности** (Public/Internal/Confidential/Secret/Top Secret)", "Модели MAC: **Белла-ЛаПадулы** (конфиденц.: no read up, no write down); **Биба** (целостность: no read down, no write up); реализации SELinux, AppArmor, Trusted Solaris", "**RBAC** (Role-Based): права назначаются **ролям**, пользователи получают роли; иерархия + SoD; в ERP, AD, Kubernetes", "**ABAC** (Attribute-Based): права вычисляются по атрибутам (пользователь/ресурс/время/локация); XACML; самая гибкая", "**PBAC** (Policy-Based) — обобщение ABAC; **ReBAC** (Relationship-Based) — Google Zanzibar", "**Базовые принципы**: **Least Privilege**, **Separation of Duties** (один создаёт, другой одобряет платёж), **Need to Know**, **Default Deny / Whitelist**, **Fail-Safe Defaults**, **Defense in Depth**", "**Kerckhoffs** (стойкость в ключе), **Complete Mediation**, **Psychological Acceptability**, **Zero Trust** (NIST SP 800-207, Forrester)", "**Стандарты**: **ISO/IEC 27001** (ISMS), 27002 (практики); **NIST CSF** (Identify/Protect/Detect/Respond/Recover); **CIS Controls** (Top 18); **OWASP ASVS**; **ФСТЭК** (приказы ИСПДн/КИИ); **ГОСТ Р 57580.1/2** (банки)"]}, {"n": 59, "title": "Антивирусная защита.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Антивирусная защита** (antimalware) — комплекс программных средств для **обнаружения, предотвращения, удаления и нейтрализации вредоносного ПО**. С начала 1990-х превратилась из утилит проверки файлов в полноценные **endpoint security platforms** (EDR, XDR), сочетающие несколько методов обнаружения, защиту в реальном времени, контроль приложений, веб-фильтрацию, антифишинг, host-based firewall и DLP. Современная парадигма — **layered defense**: ни один метод не идеален, нужна комбинация.", "<h3>Сканирование сигнатур (Signature Scanning)</h3>", "Самый старый и базовый метод:\n- Антивирус хранит **базу сигнатур** — уникальных байтовых последовательностей известных вирусов, иногда дополненных хешами файлов (MD5, SHA-256), регулярными выражениями, контекстом.\n- При сканировании файл сравнивается с базой; совпадение — детект.\n- **Достоинства**: высокая точность, низкий false-positive rate, мгновенная работа.\n- **Недостатки**:\n  - Бессилен против **zero-day** (вирусов, ещё не попавших в базу).\n  - Не обнаруживает **полиморфные** (вирусы, меняющие свой код при каждом размножении за счёт шифрования с переменным ключом) и **метаморфные** (полностью переписывающие свои инструкции) вирусы.\n  - Требует постоянных обновлений базы.", "Формат сигнатур — открытые (ClamAV) и закрытые (коммерческие).", "<h3>Контроль целостности (Integrity Checking)</h3>", "- В «чистом» состоянии вычисляются **хеш-суммы** (MD5/SHA-256/SHA-3) системных и важных файлов и заносятся в защищённую базу (Tripwire, AIDE).\n- Регулярное сканирование сверяет текущие хеши с эталонными; расхождение = инцидент.\n- **Не зависит от знаний о конкретном вирусе** — обнаруживает любую модификацию.\n- Применение: **HIDS** (Host-based IDS), мониторинг integrity critical files (`/etc/passwd`, ключи, бинарники).\n- Проблема: легитимные обновления вызывают false-positive, нужно перевычислять хеши; не работает для файлов, которые регулярно меняются.", "<h3>Эвристический анализ (Heuristic Scanning)</h3>", "Поиск **подозрительных конструкций и поведения в коде** без точного знания о конкретном вирусе. Анализатор оценивает:\n- Самомодификацию (self-modifying code).\n- Запись в MBR / boot sector / системный реестр.\n- Использование подозрительных API (`CreateRemoteThread`, `WriteProcessMemory`).\n- Полиморфные движки.\n- Шифрование собственного кода.\n- Странные структуры исполняемых файлов (PE, ELF).\n- Подозрительные строки (URL, имена API).", "Может быть **статическим** (без запуска) и **динамическим** (с эмуляцией). Обнаруживает неизвестные угрозы, но даёт **больше false-positive** — требуется баланс. Современные эвристики используют машинное обучение на признаках файла.", "<h3>Поведенческий анализ (Behavioral Analysis)</h3>", "Программу запускают и наблюдают её действия:\n- **Sandbox** — изолированная виртуальная среда (Cuckoo, Joe Sandbox, AnyRun); файл исполняется, регистрируются системные вызовы, сетевые соединения, изменения в реестре и ФС.\n- **Real-time monitoring** на эндпойнте: процесс пишет в чужую память, шифрует много файлов подряд, выполняет код в `cmd.exe` от Office-приложения и т. п. — алерт и блокировка.\n- Эффективен против **полиморфных, метаморфных, zero-day, fileless malware**.\n- Совмещается с **ML/AI**, обучаемыми на больших корпусах поведения.", "<h3>Современные технологии и платформы</h3>", "- **EDR** (Endpoint Detection and Response) — продвинутый AV с телеметрией, threat hunting, isolated containment.\n- **XDR** (Extended Detection and Response) — корреляция событий с сетью, облаком, email.\n- **NGAV** (Next-Generation AV) — на основе ML, без сигнатур.\n- **AMSI** (Antimalware Scan Interface, Windows) — интерфейс для проверки динамического контента (PowerShell, JS, VBA).\n- **Cloud lookup** — отправка хешей в облако для онлайн-проверки.\n- **Application whitelisting** — обратный подход: разрешено только заранее одобренное (AppLocker, Windows Defender Application Control).\n- **HIPS** (Host Intrusion Prevention System) — поведенческая блокировка действий.\n- **Memory scanning** — анализ оперативной памяти на наличие угроз.\n- **Microsoft Defender for Endpoint**, **CrowdStrike Falcon**, **Kaspersky EDR**, **SentinelOne**, **ESET**, **Sophos Intercept X**, **Trend Micro Apex One** — флагманские продукты.", "<h3>Ограничения и обходы</h3>", "- **Packing / Crypters** — упаковщики затрудняют статический анализ.\n- **Anti-VM / Anti-sandbox** — malware проверяет, не в песочнице ли оно (наличие специфических процессов, mac-адресов, времени отклика мыши).\n- **Living-off-the-Land** (LotL) — использование легитимных инструментов Windows (`powershell`, `wmic`, `bitsadmin`) — антивирусу нечего «помечать».\n- **Fileless malware** — живёт только в RAM, ничего на диск не пишет.\n- **Supply chain** — заражение легитимного подписанного ПО (SolarWinds).\n- **Bypass через подмену драйверов / BYOVD** (Bring Your Own Vulnerable Driver) — отключение AV из ядра.", "Поэтому AV — необходимый, но не достаточный элемент; полная защита требует patching, MFA, network segmentation, обучения пользователей, регулярных бэкапов (offline для защиты от ransomware)."], "terms": [{"ru": "HIPS", "en": "Host Intrusion Prevention System", "df": "**AMSI** — интерфейс антивирусного сканирования в Windows"}], "summary": ["**Антивирус (antimalware)** — программные средства обнаружения/предотвращения/удаления вредоносного ПО", "Эволюция: AV → **EDR (Endpoint Detection and Response)** → **XDR (Extended)** — endpoint security platforms", "Современная парадигма — **layered defense**: ни один метод не идеален, нужна комбинация", "**Signature Scanning** — самый старый: база **уникальных байтовых последовательностей** + хеши (MD5, SHA-256)", "Плюсы сигнатур: высокая точность, низкий false-positive, быстро", "Минусы: бессилен против **zero-day**, **полиморфных** (шифруют код с переменным ключом), **метаморфных** (переписывают инструкции); требуют постоянных обновлений", "**Integrity Checking** (Tripwire, AIDE): эталонные **хеши** SHA-256 системных файлов в защищённой БД; расхождение = инцидент", "Плюсы: не зависит от знаний о вирусе, обнаруживает любую модификацию; минусы: легитимные обновления → false-positive; **HIDS**", "**Heuristic Analysis** — поиск **подозрительных конструкций**: самомодификация, запись в MBR/реестр, подозрительные API (**CreateRemoteThread**, **WriteProcessMemory**), полиморфные движки, шифрование своего кода, странные PE/ELF", "Эвристика бывает **статической** (без запуска) и **динамической** (с эмуляцией); обнаруживает unknown, но **больше false-positive**; современные — ML", "**Behavioral Analysis** — запуск в **sandbox** (Cuckoo, Joe Sandbox, AnyRun); фиксируются syscall, сетевые соединения, изменения ФС/реестра", "**Real-time monitoring** на эндпойнте: процесс пишет в чужую память, шифрует много файлов, выполняет код в cmd.exe из Office → алерт", "Поведенческий эффективен против polymorphic/metamorphic/zero-day/fileless; ML/AI на корпусах поведения", "**Современные технологии**: **EDR**, **XDR**, **NGAV** (без сигнатур, ML), **AMSI** (Antimalware Scan Interface, Windows для PowerShell/JS/VBA)", "**Cloud lookup** (хеши в облако), **Application whitelisting** (AppLocker, WDAC), **HIPS** (Host IPS), Memory scanning", "Продукты: **Microsoft Defender for Endpoint**, **CrowdStrike Falcon**, Kaspersky EDR, SentinelOne, ESET, Sophos Intercept X, Trend Micro Apex One", "**Обходы**: **Packing/Crypters** (упаковщики), **Anti-VM/Anti-sandbox** (детекция песочницы)", "**Living-off-the-Land (LotL)** — легитимные инструменты Windows (powershell, wmic, bitsadmin); **Fileless** (только в RAM)", "Supply chain (SolarWinds); **BYOVD** (Bring Your Own Vulnerable Driver) — отключение AV из ядра", "Поэтому AV — необходим, но не достаточен; нужны patching, MFA, сегментация, обучение, **offline-бэкапы** против ransomware"]}, {"n": 60, "title": "Межсетевые экраны. VPN.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Межсетевой экран** (МСЭ, firewall) — программно-аппаратный комплекс, контролирующий сетевой трафик между сегментами с разным уровнем доверия, **разрешая или блокируя** пакеты в соответствии с настроенными правилами. МСЭ — базовый периметровый контроль ИБ с конца 1980-х; современные NGFW сочетают пакетную фильтрацию с DPI, IPS, URL-фильтрацией, sandboxing и применением Identity-aware политик. **VPN** (Virtual Private Network) — технология построения логической защищённой сети через незащищённую (обычно Интернет) с помощью **шифрованных туннелей**.", "<h3>Поколения и типы МСЭ</h3>", "**1. Пакетный фильтр (Stateless Packet Filter)** — первое поколение (Cisco ACL, BSD ipfw):\n- Решение по каждому пакету независимо, по полям L3/L4: src/dst IP, протокол, src/dst port, флаги TCP.\n- Не помнит контекст соединений.\n- **Достоинства**: простота, скорость.\n- **Недостатки**: нельзя различать «входящий запрос» и «ответ»; уязвим к подделке пакетов; сложно настроить для протоколов с динамическими портами (FTP, SIP).", "**2. Stateful Inspection** — второе поколение (Check Point FW-1 1994, Linux iptables/conntrack, Cisco ASA):\n- Поддерживает **таблицу состояний** активных соединений (state table).\n- Пакет проверяется не только по правилам, но и принадлежности к разрешённому соединению.\n- Понимает TCP-handshake: SYN запускает новое соединение, последующий ACK — уже часть существующего.\n- Для UDP/ICMP — псевдо-состояния по таймауту.\n- Намного точнее, эффективнее, чем stateless.", "**3. Application-level Gateway / Proxy Firewall** — третье поколение:\n- Терминирует соединение на МСЭ, разбирает прикладной протокол (HTTP, FTP, SMTP, DNS, SIP).\n- Может фильтровать содержимое (URL, методы, заголовки, MIME-типы).\n- Часто **разрывает прямое соединение** между клиентом и сервером; пользователь общается с прокси.\n- Используется в корпоративных шлюзах (Squid, Microsoft TMG, Blue Coat).\n- Медленнее, но даёт глубокую видимость.", "**4. NGFW (Next-Generation Firewall)** — современный стандарт:\n- Stateful + **DPI** (Deep Packet Inspection) + **IPS** + URL-фильтрация + контроль приложений (App-ID Palo Alto) + Identity-aware (интеграция с AD/SSO) + sandbox + threat intelligence + **TLS inspection** (расшифровка для DPI).\n- Представители: Palo Alto, Fortinet, Cisco Firepower, Check Point, Sophos.", "**5. WAF (Web Application Firewall)** — отдельный класс L7-МСЭ для HTTP/HTTPS, защищающий от OWASP Top 10 (SQLi, XSS, …); ModSecurity, Cloudflare WAF.", "**6. Cloud-native / SASE / ZTNA** — современные облачные сетевые периметры (Zscaler, Cato, Cloudflare Zero Trust).", "<h3>Архитектура развёртывания</h3>", "- **Bastion host / Single-tier**: один МСЭ между внешней и внутренней сетью.\n- **Two-tier с DMZ**: два МСЭ; между ними — **демилитаризованная зона** (DMZ), где размещаются публичные сервисы (web, mail, DNS). Внутренняя сеть изолирована даже при компрометации DMZ-серверов.\n- **Multi-tier / Zero Trust**: сегментация на множество зон, микросегментация, SDN-политики.\n- **Host-based firewall** — на конечной машине (Windows Firewall, iptables, pf, ufw).", "<h3>Правила и политика</h3>", "Базовый принцип — **default deny** (всё, что явно не разрешено, запрещено). Правила — упорядоченные тройки (matching, action, log). Хорошие практики: разрешать только нужные порты, отдельные правила для входа/выхода, регулярный аудит, geo-IP блокировки, threat feeds.", "<h3>VPN — Virtual Private Network</h3>", "**VPN** — технология создания защищённого «виртуального провода» через незащищённую сеть. Свойства:\n- **Конфиденциальность**: шифрование трафика (AES-GCM, ChaCha20-Poly1305).\n- **Целостность и аутентификация**: HMAC, цифровые подписи.\n- **Защита от replay-атак**.\n- **Удалённый доступ** к корпоративным ресурсам.", "Сценарии:\n- **Remote Access VPN** — сотрудник из дома → корпоративная сеть.\n- **Site-to-Site VPN** — соединение нескольких офисов в единую сеть через Интернет.\n- **Personal VPN** — обход цензуры, защита в открытом Wi-Fi (NordVPN, Mullvad).", "<h3>Технологии VPN</h3>", "- **IPSec** (Q66) — L3-туннель, индустриальный стандарт; режимы Transport и Tunnel; ESP/AH; IKEv2 для согласования ключей. Идеально для Site-to-Site.\n- **TLS/SSL VPN**:\n  - **OpenVPN** — TLS поверх UDP/TCP; гибкий, кросс-платформенный.\n  - **SSTP** — Microsoft, TLS поверх TCP/443.\n  - **AnyConnect / Pulse / GlobalProtect** — корпоративные.\n- **WireGuard** (RFC 9092 эквивалент, in-kernel Linux) — современный минималистичный протокол: только Curve25519, ChaCha20-Poly1305, BLAKE2; малый код, быстрая UDP-обёртка. Заменяет OpenVPN/IPSec в новых проектах.\n- **L2TP/IPSec** — L2-туннель PPP в IPSec; устаревает.\n- **PPTP** — устарел, **не использовать** (взломан).\n- **GRE / GRE-over-IPSec** — туннели без встроенного шифрования (нужно IPSec поверх).\n- **MPLS L3VPN** — операторские «VPN», не шифруют, но изолируют (Q31, Q40).\n- **SD-WAN** — современная замена корпоративных VPN с динамическим выбором путей и QoS.", "<h3>Сравнение VPN</h3>", "| Протокол | Уровень | Шифрование | NAT-friendly | Скорость | Применение |\n|---|---|---|---|---|---|\n| IPSec (IKEv2) | L3 | AES-GCM | через NAT-T | высокая | Site-to-Site, корпоративный |\n| OpenVPN | L4 (TCP/UDP) | TLS | да | средняя | personal, удалённый доступ |\n| WireGuard | L3 (UDP) | ChaCha20 | да | очень высокая | современный, в т.ч. mobile |\n| L2TP/IPSec | L2+L3 | AES | через NAT-T | средняя | устаревший |\n| PPTP | L2 | MPPE | да | высокая | НЕ использовать |"], "terms": [{"ru": "WAF", "en": "Web Application Firewall", "df": "защита веб-приложений"}, {"ru": "DPI", "en": "Deep Packet Inspection", "df": "глубокая инспекция пакетов"}], "summary": ["**МСЭ (firewall)** — контроль трафика между сегментами с разным уровнем доверия; разрешить/блокировать по правилам", "**Поколения МСЭ**:", "**1. Stateless Packet Filter** (Cisco ACL, BSD ipfw): решение по каждому пакету независимо, по L3/L4 (IP/proto/port/flags); нет контекста; уязвим к подделке", "**2. Stateful Inspection** (Check Point FW-1 1994, **iptables/conntrack**, Cisco ASA): **таблица состояний** TCP/UDP/ICMP сессий; пакет проверяется на принадлежность установленному соединению", "**3. Application Gateway/Proxy Firewall**: терминирует соединение, разбирает прикл. протокол (HTTP/FTP/SMTP/DNS/SIP); фильтрация URL/методов/MIME; Squid, MS TMG", "**4. NGFW** (Palo Alto, Fortinet, Cisco Firepower, Check Point): stateful + **DPI** + IPS + URL-фильтрация + **App-ID** + Identity-aware + sandbox + **TLS inspection**", "**5. WAF** (Web Application Firewall): L7 для HTTPS, защита от **OWASP Top 10** (SQLi, XSS); ModSecurity, Cloudflare WAF", "**6. SASE/ZTNA**: облачные периметры (Zscaler, Cato, Cloudflare Zero Trust)", "**Архитектура развёртывания**: bastion host (один МСЭ); **Two-tier с DMZ** (два МСЭ, между ними публичные сервисы); multi-tier/Zero Trust (микросегментация, SDN); **host-based** (Windows Firewall, iptables, pf, ufw)", "**Правила**: **default deny** (всё неразрешённое запрещено); упорядоченные тройки (matching, action, log); geo-IP блокировки, threat feeds", "**VPN** — защищённый виртуальный канал через незащищённую сеть", "Свойства VPN: конфиденциальность (AES-GCM/ChaCha20-Poly1305), целостность+аутентификация (HMAC), защита от replay, удалённый доступ", "Сценарии: **Remote Access VPN** (сотрудник→корп. сеть); **Site-to-Site VPN** (офисы); **Personal VPN** (обход цензуры, защита в Wi-Fi)", "**Технологии VPN**: **IPSec** (Q66, L3, Transport/Tunnel; ESP/AH; IKEv2; стандарт Site-to-Site)", "**TLS/SSL VPN**: **OpenVPN** (TLS/UDP-TCP, кросс-платформа), **SSTP** (MS TLS/TCP 443), AnyConnect/Pulse/GlobalProtect (корпоративные)", "**WireGuard** (in-kernel Linux): только **Curve25519 + ChaCha20-Poly1305 + BLAKE2**; малый код, быстрая UDP-обёртка; заменяет OpenVPN/IPSec", "**L2TP/IPSec** (L2 в IPSec, устаревает); **PPTP** (взломан, не использовать); GRE/GRE-over-IPSec; **MPLS L3VPN** (не шифрует, изолирует); **SD-WAN**", "Сравнение: IPSec L3/AES-GCM/NAT-T/высокая; OpenVPN L4/TLS/да/средняя; WireGuard L3 UDP/ChaCha20/да/очень высокая; PPTP — **не использовать**"]}, {"n": 61, "title": "Прокси-серверы. IDS / IPS.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Прокси-сервер** (proxy) — промежуточный сетевой узел, через который проходят запросы клиента к целевому сервису. Прокси выполняет ряд функций: **кеширование, контроль доступа, фильтрация, анонимизация, балансировка нагрузки, инспекция TLS**. **IDS** (Intrusion Detection System) — пассивная система обнаружения вторжений, наблюдающая за трафиком и хостами и поднимающая алерты при подозрительной активности. **IPS** (Intrusion Prevention System) — активная версия, работающая **inline** и блокирующая атаки в реальном времени. Прокси, IDS и IPS вместе с МСЭ образуют **сетевой периметр** ИБ.", "<h3>Функции прокси-сервера</h3>", "- **Кеширование** HTTP-ответов (Squid в провайдерских сетях, корпоративных) → экономия полосы.\n- **Контроль доступа**: URL-фильтрация (категории: соцсети, развлечения, малварь), чёрные/белые списки, time-based policies, integration с AD.\n- **Анонимизация**: исходящий IP всех клиентов одинаков (NAT-эффект); transparent vs anonymous прокси.\n- **TLS-инспекция / SSL bumping**: прокси терминирует TLS клиента и устанавливает новое TLS-соединение к серверу; передаваемое содержимое доступно для DPI, антивируса, DLP. Требует установки корпоративного root CA на клиентах.\n- **DLP** (Data Loss Prevention): сканирование исходящего трафика на конфиденциальную информацию.\n- **Балансировка нагрузки** (reverse proxy) — распределение запросов между серверами.\n- **Журналирование**: компромисс между приватностью и расследованием инцидентов.\n- **Cookie / sessions / authentication aggregation** — SSO, OAuth.", "<h3>Forward vs Reverse Proxy</h3>", "- **Forward proxy** — на стороне клиента (корпорации, ISP); прозрачно или явно (proxy settings); защищает клиентов и контролирует выход в Интернет.\n- **Reverse proxy** — на стороне сервера; клиент думает, что общается напрямую с сервисом, а на самом деле — с прокси. Защищает origin, балансирует нагрузку, терминирует TLS, кеширует. Примеры: nginx, HAProxy, Cloudflare, AWS ALB.", "<h3>Типы прокси по уровню стека</h3>", "**1. Application-level (ALG, Application-Level Gateway)**:\n- Полный разбор прикладного протокола (HTTP, FTP, SMTP, DNS, SIP).\n- Может модифицировать содержимое (вставить headers, переписать URL, заблокировать слова).\n- Каждому протоколу — свой прокси.\n- Примеры: Squid (HTTP/HTTPS), Postfix relay, DNS resolver.", "**2. Circuit-level (SOCKS)**:\n- Транспортный уровень: пересылает TCP-соединение, не разбирая прикладной протокол.\n- Универсален.\n- **SOCKS4** — только TCP, IPv4.\n- **SOCKS5** (RFC 1928) — TCP + UDP, IPv6, аутентификация, разрешение DNS на стороне прокси.\n- Используется в Tor, прокси для desktop-приложений.", "**3. Прозрачный (Transparent) прокси**:\n- Перехватывает трафик без явной конфигурации клиента (через L3-redirect, WCCP, PBR).\n- Применяется ISP и в корпоративных сетях.", "<h3>IDS — Intrusion Detection System</h3>", "**Пассивная** система, наблюдающая за трафиком/действиями и поднимающая алерты при подозрительной активности. Не блокирует, только информирует.", "Типы:\n- **NIDS** (Network IDS) — анализирует сетевой трафик с зеркальных портов / TAP. Не на пути; меньше влияет на производительность; иногда пропускает зашифрованный трафик. Примеры: **Snort**, **Suricata**, **Zeek (Bro)**.\n- **HIDS** (Host IDS) — на конкретном хосте: системные вызовы, файлы, журналы, реестр. Видит происходящее даже в зашифрованных соединениях. Примеры: **OSSEC**, **Wazuh**, **Tripwire**, **AIDE**, **Auditd**.\n- **WIDS** (Wireless IDS) — для Wi-Fi: rogue AP, evil twin.\n- **DBIDS / Application IDS** — на уровне баз и приложений.", "Методы обнаружения:\n- **Signature-based / misuse detection** — поиск известных шаблонов атак (правила Snort/Suricata, YARA-правила). Точный, но не ловит новое.\n- **Anomaly-based** — статистическая или ML-модель «нормального поведения»; отклонения = алерт. Может ловить unknown attacks, но дает много false positives.\n- **Specification-based** — правила корректного поведения протокола; нарушение = инцидент.\n- **Heuristic / behavioral**.", "Архитектурно IDS включает: сенсор (сбор данных), анализатор (правила), хранилище, консоль управления, систему алертов (SIEM-интеграция).", "<h3>IPS — Intrusion Prevention System</h3>", "Расширение IDS, работающее **inline** на пути трафика (как маршрутизатор/мост): не просто сообщает, а **активно блокирует** обнаруженные атаки (DROP, RST, TCP reset, redirect to honeypot).", "Типы аналогичны IDS:\n- **NIPS** — сетевой.\n- **HIPS** — на хосте, блокирующий запрещённые действия (write to protected files, suspicious process creation).\n- **Wireless IPS** — для Wi-Fi.", "Реализации:\n- Snort/Suricata в inline-режиме (IPS mode).\n- **Палоалто / Fortinet / Check Point** — IPS встроен в NGFW.\n- **Microsoft Defender** имеет HIPS-возможности.", "Минусы IPS: false-positive могут заблокировать легитимный трафик; усложняет troubleshooting; ставит дополнительную точку отказа.", "<h3>IDS/IPS vs Firewall</h3>", "| Аспект | Firewall | IDS/IPS |\n|---|---|---|\n| Принятие решений | по правилам (порты, IP) | по содержимому, поведению |\n| Уровень анализа | L3/L4 (NGFW также L7) | L3–L7, behaviour |\n| Известные/неизвестные атаки | известные сценарии | sig + anomaly |\n| Inline | да | IPS — да, IDS — нет |", "<h3>SIEM, SOC, EDR/XDR</h3>", "IDS/IPS — часть более широкого пайплайна:\n- **SIEM** (Security Information and Event Management): сбор и корреляция логов (Splunk, Elastic SIEM, IBM QRadar, ArcSight).\n- **SOC** (Security Operations Center): люди + SIEM + playbooks.\n- **SOAR** (Security Orchestration, Automation, Response): автоматизация реакции.\n- **EDR / XDR** — расширенный мониторинг эндпойнтов."], "terms": [{"ru": "ALG", "en": "Application Layer Gateway", "df": "прокси прикладного уровня"}], "summary": ["**Прокси-сервер** — промежуточный узел; функции: кэширование, контроль, фильтрация, анонимизация, балансировка, **TLS-инспекция**", "**Forward proxy** (Squid) — на стороне клиента, корп. сеть/ISP; кэшировал HTTP, фильтрует URL по категориям", "**Reverse proxy** (NGINX перед origin, HAProxy, Cloudflare, AWS ALB) — на стороне сервера; защищает origin, балансирует, TLS termination, кэш", "**TLS-инспекция / SSL bumping**: прокси терминирует TLS клиента и устанавливает новое TLS к серверу; содержимое доступно DPI/AV/DLP; требует корпоративный root CA на клиентах", "**DLP** (Data Loss Prevention); SSO/OAuth-aggregation; журналирование (privacy vs расследование)", "**Типы по уровню**:", "**1. ALG** (Application-Level Gateway): полный разбор протокола (HTTP/FTP/SMTP/DNS/SIP); модификация контента; Squid, Postfix relay", "**2. Circuit-level (SOCKS)**: транспортный, пересылает TCP без разбора; SOCKS4 (TCP/IPv4), **SOCKS5** (RFC 1928, +UDP/IPv6/auth/DNS); Tor", "**3. Transparent**: перехватывает без явной настройки (L3-redirect, WCCP, PBR); ISP и корпоративные", "**IDS** (Intrusion Detection System) — **пассивная**, наблюдает и алертит, не блокирует", "**NIDS** (Network IDS) — анализ зеркальных портов/TAP; **Snort**, **Suricata**, **Zeek (Bro)**; меньше влияет на perf, пропускает зашифрованный", "**HIDS** (Host IDS) — на конкретном хосте: syscalls, файлы, журналы, реестр; видит зашифрованный; **OSSEC**, **Wazuh**, **Tripwire**, **AIDE**, **Auditd**", "**WIDS** (Wireless) — rogue AP, evil twin; DBIDS/Application IDS", "**Методы обнаружения**: **Signature-based** (правила Snort/Suricata/YARA, точно, не ловит новое); **Anomaly-based** (ML/статистика «нормы», ловит unknown но много FP); **Specification-based** (правила корректности протокола); behavioral/heuristic", "Архитектура IDS: сенсор → анализатор → хранилище → консоль → алерты (SIEM-интеграция)", "**IPS** (Intrusion Prevention) — **активная inline**, блокирует атаки (DROP, RST, redirect to honeypot)", "**NIPS** (сетевой), **HIPS** (на хосте, блокирует запрещённые действия), Wireless IPS", "Реализации IPS: Snort/Suricata inline; Palo Alto/Fortinet/Check Point (IPS в NGFW); Microsoft Defender (HIPS)", "Минусы IPS: FP могут заблокировать легитимный трафик; усложняет troubleshooting; точка отказа", "**IDS/IPS vs Firewall**: firewall — по правилам (порты/IP), IDS/IPS — по содержимому/поведению; firewall L3/L4 (NGFW L7); IPS inline, IDS — нет", "Экосистема: **SIEM** (Splunk, Elastic, QRadar, ArcSight); **SOC** (люди + SIEM + playbooks); **SOAR** (автоматизация); **EDR/XDR**"]}, {"n": 62, "title": "Криптография. Симметричное и асимметричное шифрование.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Криптография** (cryptography) — математическая дисциплина, обеспечивающая **конфиденциальность, целостность, аутентичность и неотказуемость** информации с помощью алгоритмов преобразования. Базовая операция — **шифрование** (encryption): обратимое преобразование открытого текста (plaintext) в шифртекст (ciphertext) с использованием **ключа** так, что без ключа восстановить исходный текст вычислительно невозможно. Современная криптография делится на два больших класса: **симметричную** (один общий ключ для шифрования и дешифрования) и **асимметричную** (пара открытого и закрытого ключей).", "Базовый принцип Керкхоффса: стойкость системы должна обеспечиваться **секретностью ключа, а не секретностью алгоритма**.", "<h3>Симметричное шифрование</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/2/27/Symmetric_key_encryption.svg\" alt=\"Симметричное шифрование с одним общим ключом\" loading=\"lazy\"><figcaption>Симметричное шифрование: один и тот же ключ K используется и для шифрования (E_K), и для дешифрования (D_K). <em>Источник: Wikimedia Commons, CC0.</em></figcaption></figure>", "**Свойства**:\n- Один **общий секретный ключ** для отправителя и получателя.\n- На 3–5 порядков **быстрее** асимметричных алгоритмов (миллиарды операций/с на современном CPU с AES-NI).\n- Главная проблема — **безопасный обмен ключом**: его надо как-то передать стороне, не раскрыв атакующему. Это обычно решает асимметричная криптография или **протокол Диффи-Хеллмана** (Q68).", "**Поточные шифры (stream ciphers)** — шифруют побитово/побайтово XOR с псевдослучайным потоком:\n- **RC4** — устарел, имеет уязвимости.\n- **ChaCha20** (RFC 8439) — современный стандарт, основа ChaCha20-Poly1305 AEAD (TLS 1.3, WireGuard).\n- **Salsa20** — предшественник.", "**Блочные шифры (block ciphers)** — обрабатывают блоки фиксированного размера:\n- **DES** (Data Encryption Standard, 1977) — 64-битный блок, **56-битный ключ**; устарел (взломан брутфорсом за часы).\n- **3DES** (Triple DES) — 56 × 3, эффективная стойкость ≈112 бит из-за meet-in-the-middle; выведен NIST в 2023.\n- **AES** (Advanced Encryption Standard, FIPS 197, 2001) — алгоритм **Rijndael**, блок 128 бит, ключи 128/192/256 бит. **SPN-структура** (Substitution-Permutation Network). Глобальный стандарт; аппаратно ускоряется инструкциями AES-NI.\n- **Camellia, Serpent, Twofish** — альтернативы.\n- **ГОСТ Р 34.12-2015**: **«Магма»** (64/256, сеть Фейстеля, эволюция ГОСТ 28147-89) и **«Кузнечик»** (Grasshopper, 128/256, SPN). Обязательны в РФ для гос. систем и ПДн.", "**Режимы блочного шифра** (превращают шифрование одного блока в шифрование длинного сообщения):\n- **ECB** (Electronic Codebook) — каждый блок независимо; **небезопасен** (видны паттерны), не использовать.\n- **CBC** (Cipher Block Chaining) — XOR с предыдущим шифроблоком; требует IV; не параллелится при шифровании.\n- **CTR** (Counter) — превращает блочный шифр в поточный, шифруя счётчик; полностью параллелен.\n- **CFB / OFB** — потоковые режимы.\n- **GCM** (Galois/Counter Mode) — CTR + аутентификационный хеш Поли1305-подобный; **AEAD** — одновременно шифрует и подписывает. Стандарт в TLS, IPSec.\n- **CCM** — CTR + CBC-MAC, AEAD, использован в Wi-Fi WPA2.\n- **XTS** — для дискового шифрования (BitLocker, LUKS).", "<h3>Асимметричное шифрование (Public-Key)</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/f/f9/Public_key_encryption.svg\" alt=\"Асимметричное (public-key) шифрование\" loading=\"lazy\"><figcaption>Асимметричное шифрование: открытый ключ известен всем, ими шифруют; закрытый ключ хранится в секрете, им дешифруют. <em>Источник: Wikimedia Commons, public domain.</em></figcaption></figure>", "Изобретение Диффи и Хеллмана (1976), затем RSA (Rivest, Shamir, Adleman, 1977) перевернуло криптографию: впервые стало возможно шифровать без предварительного обмена секретом.", "**Идея**: пара **(open, secret)** ключей с математическим свойством: то, что зашифровано открытым ключом, может расшифровать **только** закрытый, и наоборот для подписи. Открытый ключ публикуется; закрытый хранится в секрете.", "Используется на основе **трудных задач**:\n- **RSA** (Rivest-Shamir-Adleman): задача факторизации больших целых n = pq. Размеры 2048–4096 бит. Самый старый и широко используемый.\n- **DSA / DH** (Discrete Logarithm Problem): дискретное логарифмирование в мультипликативной группе ℤp*.\n- **ECDSA / ECDH / EdDSA / X25519 / Ed25519** (Elliptic Curve Cryptography): дискретный логарифм на эллиптических кривых. **Меньший размер ключа** при той же стойкости: 256 бит ECC ≈ 3072 бит RSA.\n- **Lattice-based / Code-based / Hash-based / Isogeny-based** — постквантовые алгоритмы (NIST PQC: ML-KEM, ML-DSA, SLH-DSA, FALCON).", "Минусы асимметричной криптографии — медленность; поэтому используется **гибридная схема**:", "1. Случайный **симметричный сессионный ключ** генерируется на клиенте.\n2. Этот ключ шифруется **асимметрично** открытым ключом сервера (RSA-OAEP) или согласуется через **DH/ECDH**.\n3. Сами данные шифруются **симметрично** этим ключом (AES-GCM, ChaCha20-Poly1305).", "Этот же шаблон лежит в основе TLS, S/MIME, PGP, Signal.", "<h3>Односторонние функции</h3>", "**One-way function** f такова, что вычислить y = f(x) легко, но обратное — практически невозможно. **Trapdoor one-way function** имеет «лазейку»: дополнительный ключ позволяет обращать функцию. Trapdoor — математический фундамент асимметричной криптографии (RSA, ECC).", "Хеш-функции (Q63) — тоже односторонние, но без trapdoor.", "<h3>Криптоанализ</h3>", "**Cryptanalysis** — наука о методах взлома шифров:\n- **Brute force** (полный перебор) — пробовать все ключи; ограничен сложностью 2<sup>k</sup>.\n- **Атака по известному открытому тексту** (known-plaintext).\n- **Атака по выбранному открытому тексту** (chosen-plaintext).\n- **Атака по выбранному шифртексту** (chosen-ciphertext).\n- **Дифференциальный криптоанализ** (Biham, Shamir) — для блочных шифров.\n- **Линейный криптоанализ** (Matsui).\n- **Алгебраические атаки**, **слайд-атаки**.\n- **Side-channel attacks**: тайминги, потребление энергии, акустика, кэш-атаки (Spectre/Meltdown), ошибки.\n- **Quantum**: алгоритм **Шора** ломает RSA/DH/ECC за полиномиальное время на достаточно большом квантовом компьютере; алгоритм Гровера даёт квадратичное ускорение брутфорса симметричных ключей.", "<h3>Постквантовая криптография</h3>", "Готовясь к квантовым компьютерам, NIST с 2016 проводит конкурс PQC; в 2024 утверждены первые стандарты:\n- **ML-KEM (Kyber)** — Key Encapsulation Mechanism.\n- **ML-DSA (Dilithium)**, **SLH-DSA (SPHINCS+)**, **FALCON** — цифровые подписи."], "terms": [{"ru": "AEAD", "en": "Authenticated Encryption with Associated Data", "df": "шифрование с аутентификацией"}, {"ru": "PQC", "en": "Post-Quantum Cryptography", "df": "Kyber, Dilithium, SPHINCS+"}], "summary": ["**Криптография** — мат. дисциплина для CIA + аутентичности + неотрекаемости через преобразования", "**Шифрование**: plaintext + key → ciphertext; без ключа восстановить вычислительно невозможно", "**Принцип Керкхоффса**: стойкость в **ключе**, не в секретности алгоритма", "**Симметричное**: **один общий ключ** для шифрования и дешифрования; на 3-5 порядков быстрее асимм. (AES-NI)", "Главная проблема — **безопасный обмен ключом** → решается асимметрией или **Диффи-Хеллманом** (Q68)", "**Поточные шифры**: XOR с PRNG-потоком — **RC4** (устарел), **ChaCha20** (RFC 8439, ChaCha20-Poly1305 в TLS 1.3/WireGuard), Salsa20", "**Блочные шифры**: фиксированный блок; **DES** (1977, 56 бит, устарел); **3DES** (~112 бит из-за meet-in-middle, выведен NIST 2023)", "**AES** (FIPS 197, 2001, **Rijndael**): блок **128 бит**, ключи 128/192/**256**; **SPN**; глобальный стандарт, аппаратно (AES-NI)", "Альтернативы: Camellia, Serpent, Twofish; **ГОСТ Р 34.12-2015**: **«Магма»** (64/256, Фейстель) и **«Кузнечик»** (128/256, SPN) — обязательны в РФ", "**Режимы блочного шифра**: **ECB** небезопасен (паттерны); **CBC** (XOR с предыдущим, IV, не параллелится); **CTR** (счётчик, параллелен)", "CFB/OFB (потоковые); **GCM** (CTR + Poly1305-аутентификация, **AEAD**, в TLS/IPSec); **CCM** (Wi-Fi WPA2); **XTS** (диск: BitLocker, LUKS)", "**Асимметричное** (Public-Key, Диффи-Хеллман 1976, RSA 1977): **пара (open, secret)**; открытый — публичен; закрытый — секрет", "**RSA** (Rivest-Shamir-Adleman): задача **факториз. n=pq**; 2048-4096 бит; самый старый", "**DSA/DH**: **дискретное логарифмирование** в ℤp*; **ECDSA/ECDH/EdDSA/X25519/Ed25519**: DLP на **эллиптических кривых** — 256 бит ECC ≈ 3072 бит RSA", "Постквантовые: lattice (ML-KEM Kyber, ML-DSA Dilithium), hash (SLH-DSA SPHINCS+), code, isogeny, FALCON", "Асимметрия медленнее → **гибридная схема**: сессионный симметричный ключ генерируется на клиенте → шифруется асимметрично (RSA-OAEP/ECDH) → данные шифруются симметрично (AES-GCM)", "Эта схема — основа **TLS, S/MIME, PGP, Signal**", "**Одностор. функции (one-way)**: f(x) легко, обратное — нет; **trapdoor** (лазейка) — асимметрия (RSA, ECC)", "**Криптоанализ**: brute force, known-plaintext, chosen-plaintext, chosen-ciphertext, **дифференциальный** (Biham-Shamir), **линейный** (Matsui), алгебраические, slide; **side-channel** (тайминги, мощность, кэш, Spectre/Meltdown)", "**Квантовая угроза**: алгоритм **Шора** ломает RSA/DH/ECC за полиномиальное время; **Гровер** — ×2 ускорение брутфорса симм.", "**PQC NIST 2024**: **ML-KEM** (FIPS 203), **ML-DSA** (FIPS 204), **SLH-DSA** (FIPS 205), **FALCON** (FN-DSA)"]}, {"n": 63, "title": "Электронная подпись. Парадокс дней рождений.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Электронная (цифровая) подпись** (Digital Signature, ЭП/ЭЦП) — криптографический механизм, обеспечивающий три фундаментальных свойства: **аутентичность** (подтверждение отправителя), **целостность** (защиту от модификации) и **неотрекаемость** (подписавший не может позже отрицать авторство — non-repudiation). Цифровая подпись юридически приравнена к собственноручной в большинстве правопорядков (РФ — ФЗ-63 «Об электронной подписи», ЕС — eIDAS, США — ESIGN Act). Технически ЭП основана на асимметричной криптографии (Q62) и хеш-функциях.", "<h3>ЭЦП с симметричным ключом</h3>", "Возможна в теории через **доверенного арбитра** (trusted arbiter):\n- Алиса и Боб имеют общие секретные ключи K_A и K_B с арбитром.\n- Алиса шифрует сообщение и ID для Боба под K_A и отправляет арбитру.\n- Арбитр расшифровывает, проверяет, перешифровывает под K_B и отправляет Бобу.\n- Арбитр сохраняет ленту обмена — это и есть «подпись».\nНедостатки очевидны: арбитр — единая точка отказа, узкое место и потенциальный inside-злоумышленник. На практике почти не применяется. **HMAC** (Q65) даёт некоторую аутентичность для двух сторон, но не non-repudiation.", "<h3>ЭЦП с открытым ключом — основная схема</h3>", "Принцип: **закрытый ключ есть только у владельца, и только он может произвести подпись, которую любой может проверить открытым ключом**.", "**Подпись** сообщения m:\n1. Вычисляется **хеш** h = H(m) (SHA-256, SHA-3, Стрибог).\n2. Хеш подписывается закрытым ключом: σ = Sign(sk, h).\n3. К сообщению прилагается σ.", "**Проверка**:\n1. Получатель вычисляет h' = H(m).\n2. Применяет Verify(pk, h', σ) → true/false.\n3. Если true — подпись валидна.", "Хеш используется потому, что напрямую подписывать длинное сообщение асимметричным алгоритмом неэффективно и небезопасно.", "**Алгоритмы**:\n- **RSA-PKCS#1 v1.5** — исторический; устарел из-за уязвимостей формата.\n- **RSA-PSS** (Probabilistic Signature Scheme) — современный безопасный RSA.\n- **DSA** (Digital Signature Algorithm, FIPS 186) — на дискретном логарифме; исключён в FIPS 186-5.\n- **ECDSA** (Elliptic Curve DSA) — на эллиптических кривых; компактные подписи. Использует P-256, P-384, secp256k1 (Bitcoin).\n- **EdDSA** (Ed25519, Ed448, RFC 8032) — современный, детерминистичный, без RNG-проблем. Рекомендован FIPS 186-5.\n- **ГОСТ Р 34.10-2012** — российский стандарт на ECC. Аналог ECDSA.\n- **PQC**: ML-DSA (Dilithium), SLH-DSA (SPHINCS+), FALCON — постквантовые.", "<h3>Хеш-функция (Message Digest)</h3>", "**Hash function** H: {0,1}* → {0,1}ⁿ — детерминированное отображение произвольных данных в фиксированную битовую строку (digest). Свойства, требуемые криптографически:\n- **Pre-image resistance** (однонаправленность): по h сложно найти m такое, что H(m) = h.\n- **Second pre-image resistance**: по m₁ сложно найти m₂ ≠ m₁ с H(m₁) = H(m₂).\n- **Collision resistance**: сложно найти **любую** пару m₁ ≠ m₂ с одинаковым хешем.", "**Стандарты**:\n- **MD5** (128 бит) — компрометирован, коллизии находят за секунды. Не использовать для безопасности (только для контрольных сумм).\n- **SHA-1** (160 бит) — компрометирован (SHAttered 2017, Google + CWI). Не использовать.\n- **SHA-2** (FIPS 180-4): SHA-224, **SHA-256**, SHA-384, **SHA-512**. Действующий стандарт.\n- **SHA-3** (FIPS 202, 2015) — на основе Keccak, **губчатая конструкция** (Sponge); не подвержен слабостям конструкции Меркла-Дамгарда.\n- **BLAKE2 / BLAKE3** — быстрые альтернативы.\n- **Стрибог** (ГОСТ Р 34.11-2012) — российский, 256/512 бит, заменил устаревший ГОСТ Р 34.11-94.", "Хеши применяются всюду: пароли (с salt и slow-функциями bcrypt/scrypt/Argon2), CRC-замены, Merkle trees (blockchain, IPFS), HMAC.", "<h3>Парадокс дней рождений</h3>", "**Birthday paradox** — вероятностный феномен: в группе из 23 человек вероятность совпадения дней рождения у двоих превышает 50%, хотя кажется, что нужно 365/2 человек.", "Формально: в множестве из N возможных значений, после k случайных выборок вероятность коллизии ≈ k²/(2N). Для P > 0,5 достаточно **k ≈ 1,177·√N**.", "Криптографическое следствие:\n- Для **n-битного хеша** (N = 2<sup>n</sup> возможных значений) **коллизия** находится **в среднем за 2<sup>n/2</sup> операций**.\n- Это атака «дней рождения» (birthday attack).", "Это означает:\n- **MD5** (128 бит) — теоретическая стойкость к коллизиям 2⁶⁴ ≈ 18·10¹⁸; на практике сломан более изящными методами.\n- **SHA-1** (160 бит) — 2⁸⁰; реально сломан за 2⁶³ операций.\n- **SHA-256** (256 бит) — 2¹²⁸ операций для коллизии, что эквивалентно 128-битной симметричной стойкости.\n- Чтобы обеспечить **128 бит** реальной криптостойкости к коллизиям, нужен хеш длиной **≥ 256 бит**.", "Это правило двукратного увеличения длины — фундаментальная инженерная нота при выборе хеш-алгоритмов.", "<h3>Дополнительные понятия</h3>", "- **HMAC** (Hash-based MAC, RFC 2104) — конструкция HMAC(K, m) = H((K ⊕ opad) ∥ H((K ⊕ ipad) ∥ m)), даёт целостность и аутентичность через симметричный ключ; используется в TLS, IPSec, JWT.\n- **KDF** (Key Derivation Function): HKDF, PBKDF2, scrypt, Argon2 — для выработки ключей из паролей или мастер-секрета.\n- **Trusted Timestamping** (RFC 3161) — подписи времени для доказательства существования документа на дату.\n- **Long-Term Validation** (LTV) для долговечных подписей (CAdES, XAdES, PAdES)."], "terms": [{"ru": "Стрибог", "en": "ГОСТ Р 34.11-2012", "df": "российская хеш-функция"}], "summary": ["**Электронная подпись (ЭП/ЭЦП)** — три свойства: **аутентичность** + **целостность** + **неотрекаемость** (non-repudiation)", "Юридически приравнена к собственноручной: **ФЗ-63** (РФ), eIDAS (ЕС), ESIGN Act (США)", "Технически — асимметричная криптография + хеш-функции", "**ЭЦП с симметричным ключом** через **доверенного арбитра** — на практике не применяется (точка отказа)", "**HMAC** даёт аутентичность для двух сторон, но **не non-repudiation**", "**ЭЦП с открытым ключом — основная схема**: закрытый ключ только у владельца, проверка любому открытым", "**Подпись** m: 1) h = H(m) (SHA-256/3, Стрибог); 2) σ = Sign(sk, h); 3) к m прилагается σ", "**Проверка**: 1) h' = H(m); 2) Verify(pk, h', σ) → true/false", "Хеш используется потому, что подписывать длинное напрямую неэффективно и небезопасно", "**Алгоритмы**: RSA-PKCS#1 v1.5 (устар.), **RSA-PSS** (совр.); DSA (исключён в FIPS 186-5); **ECDSA** (P-256/384, secp256k1 в Bitcoin); **EdDSA** (Ed25519, RFC 8032, детерминистичный)", "**ГОСТ Р 34.10-2012** (РФ, аналог ECDSA); **PQC**: ML-DSA, SLH-DSA, FALCON", "**Хеш-функция (digest)** H: {0,1}* → {0,1}ⁿ — детерминированное отображение в фикс. строку", "**Свойства**: **pre-image resistance** (по h не найти m); **second pre-image** (по m₁ не найти m₂); **collision resistance** (не найти ни одной пары)", "**Стандарты**: **MD5** (128, сломан — Wang 2004); **SHA-1** (160, сломан **SHAttered 2017** Google+CWI)", "**SHA-2** (FIPS 180-4): SHA-224/**256**/384/**512**; действующий стандарт; конструкция **Меркла-Дамгарда**", "**SHA-3** (FIPS 202, 2015, **Keccak**): **губчатая конструкция (Sponge)**; не подвержен слабостям M-D", "**BLAKE2/BLAKE3** — быстрые; **Стрибог** (ГОСТ Р 34.11-2012, 256/512)", "Применения хешей: пароли (с salt + bcrypt/scrypt/Argon2), Merkle trees (blockchain/IPFS), HMAC", "**Парадокс дней рождений**: в группе 23 человек вероятность совпадения > 50%; формально k²/(2N), для P>0,5 k ≈ 1,177·√N", "**Следствие**: для n-бит хеша **коллизия за 2<sup>n/2</sup>** операций — birthday attack", "Поэтому MD5 — 2⁶⁴ (сломан); SHA-1 — 2⁸⁰ (реально 2⁶³); **SHA-256 — 2¹²⁸** = эквивалент 128-битной симм. стойкости", "**Правило**: для 128 бит реальной криптостойкости нужен хеш **≥ 256 бит**", "**HMAC** (RFC 2104): HMAC(K,m) = H((K⊕opad)∥H((K⊕ipad)∥m)); TLS/IPSec/JWT", "**KDF**: HKDF, **PBKDF2**, scrypt, **Argon2** (slow для паролей); **Trusted Timestamping** (RFC 3161); **CAdES/XAdES/PAdES** для долговременных подписей"]}, {"n": 64, "title": "Сертификаты X.509. PKI.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Сертификат открытого ключа** (public key certificate) — подписанный документ, **связывающий открытый ключ с владельцем** (доменным именем, организацией или физическим лицом). Подпись ставит **удостоверяющий центр** (CA, Certification Authority), которому доверяет проверяющая сторона. Эта схема решает фундаментальную проблему public-key криптографии: «как я узнаю, что данный открытый ключ действительно принадлежит example.com, а не атакующему?». Стандарт **X.509** (ITU-T X.509, RFC 5280) описывает структуру сертификатов; вокруг него строится **PKI** (Public Key Infrastructure) — набор политик, процедур, ПО и людей, управляющих жизненным циклом сертификатов.", "<h3>Структура X.509</h3>", "Сертификат X.509 v3 закодирован в **ASN.1 DER**; для передачи часто оборачивается в Base64 (PEM-формат, `-----BEGIN CERTIFICATE-----`).", "Основные поля:\n- **Version** — обычно v3.\n- **Serial Number** — уникальный в пределах CA.\n- **Signature Algorithm** — алгоритм подписи CA (sha256WithRSAEncryption, ecdsa-with-SHA256).\n- **Issuer** — DN удостоверяющего центра, выпустившего сертификат.\n- **Validity** — `Not Before` и `Not After`; современные публичные TLS-сертификаты живут ≤ 398 дней, готовится переход к ≤ 90 дням.\n- **Subject** — кому выдан, в формате **DN** (Distinguished Name) X.500: CN, O, OU, C, L, ST.\n- **Subject Public Key Info** — алгоритм (rsaEncryption, ecPublicKey) и сам открытый ключ.\n- **Extensions** (X.509 v3) — расширения, наиболее важные:\n  - **Subject Alternative Name (SAN)** — список доменных имён, IP, e-mail; современные браузеры **игнорируют CN**, используют только SAN.\n  - **Key Usage** — разрешённые применения (Digital Signature, Key Encipherment, Cert Sign, CRL Sign).\n  - **Extended Key Usage** (EKU) — Server Auth, Client Auth, Code Signing, Email Protection, Time Stamping.\n  - **Basic Constraints** — `CA: TRUE/FALSE`, ограничение глубины цепочки.\n  - **Authority Key Identifier (AKI)** и **Subject Key Identifier (SKI)** — для построения цепочки.\n  - **CRL Distribution Points** — URL для списка отозванных.\n  - **Authority Information Access (AIA)** — URL OCSP-респондера и issuer cert.\n  - **Certificate Transparency (CT) SCTs** (RFC 6962) — обязательны для публичных TLS-сертификатов.\n- **Signature** — собственно подпись CA над предыдущими полями.", "Типы сертификатов по уровню валидации (для веб-сертификатов):\n- **DV** (Domain Validation) — проверка владения доменом; самый распространённый (Let's Encrypt, ZeroSSL).\n- **OV** (Organization Validation) — дополнительная проверка организации.\n- **EV** (Extended Validation) — строгая юридическая верификация; раньше показывался зелёным замком с названием в браузерах, сегодня визуально не отличается.\n- **Wildcard** `*.example.com` — на любые subdomains одного уровня.\n- **SAN** — множественные домены в одном сертификате.", "<h3>CA — Certification Authority</h3>", "**CA** — организация, которая выпускает сертификаты:\n- Хранит свой **закрытый корневой ключ** в защищённом HSM (offline для root, online для issuing).\n- Получает запросы CSR (Certificate Signing Request) от пользователей.\n- Проверяет подлинность владельца (DV: HTTP-01/DNS-01 ACME-challenge; OV/EV: документы).\n- Подписывает CSR своим закрытым ключом.\n- Поддерживает CRL и OCSP-респондеры.\n- Подчиняется требованиям CA/Browser Forum (Baseline Requirements).\n- Аудит по WebTrust / ETSI EN 319 411.", "Публичные CA: **Let's Encrypt** (ISRG), DigiCert, GlobalSign, Sectigo, GoDaddy. В РФ: «Криптопро», TaxCom, КонтурСертификат.", "**ACME** (RFC 8555) — протокол автоматического выпуска сертификатов (используется Let's Encrypt и certbot).", "<h3>Проверка статуса сертификата</h3>", "Сертификат может быть отозван до истечения срока (компрометация ключа, увольнение сотрудника):\n- **CRL** (Certificate Revocation List) — список серийных номеров отозванных сертификатов, подписанный CA; периодически публикуется (CDP — CRL Distribution Point); большой и медленно обновляется.\n- **OCSP** (Online Certificate Status Protocol, RFC 6960) — клиент шлёт запрос «жив ли cert с серийным N?» к OCSP-респондеру; ответ — Good / Revoked / Unknown. Реальное время, но создаёт privacy-issue (CA знает, какие сайты вы посещаете).\n- **OCSP Stapling** (RFC 6066): сервер сам периодически получает OCSP-ответ и **«приклеивает»** его к TLS-handshake; клиент не обращается к CA напрямую.\n- **CRLite / CRLSets** — компактные battery-friendly альтернативы (Mozilla, Chrome).\n- **Short-lived certificates** — современный тренд: сертификаты на 7–90 дней без revocation; «компенсируется» автоматизацией ACME.", "<h3>PKI — Public Key Infrastructure</h3>", "**PKI** — комплекс программных, аппаратных, организационных средств для управления жизненным циклом сертификатов: выпуск, распространение, отзыв, архивирование, восстановление ключей. Компоненты:\n- **Root CA** — корневой, самоподписанный, оффлайн.\n- **Intermediate / Issuing CAs** — выпускают конечные сертификаты; ограничивают «бласт-радиус» компрометации.\n- **RA** (Registration Authority) — проверяет личность заявителей.\n- **VA** (Validation Authority) — OCSP-респондеры, CRL.\n- **HSM** — хранит CA-ключи.\n- **Repository** — публикация сертификатов и CRL.", "**Иерархическая модель доверия**:\n- **Root CA** — самоподписан, его сертификат жёстко встроен в **trust store** браузеров и ОС (Mozilla NSS, Apple Keychain, Microsoft CertStore, Linux ca-certificates).\n- **Intermediate CA** подписан Root CA.\n- **End-entity** (server/user) подписан Intermediate.\n- Сервер при TLS-handshake отправляет цепочку сертификатов (без Root). Клиент строит **chain of trust** до доверенного корня.", "Альтернативные модели:\n- **Web of Trust** (PGP): нет иерархии, доверие через подписи друзей.\n- **Trust on First Use** (TOFU): SSH принимает ключ при первом подключении.\n- **DNSSEC + DANE / TLSA** (RFC 6698): сертификат привязан через DNS.", "<h3>Дополнительные технологии</h3>", "- **CT logs** (Certificate Transparency, RFC 6962) — публичные журналы всех выпущенных сертификатов; обязательны для публичных TLS. CT даёт прозрачность и помогает обнаружить mis-issued сертификаты.\n- **CAA records** (RFC 8659) — DNS-запись `example.com CAA \"letsencrypt.org\"` ограничивает, какие CA могут выпускать сертификаты для данного домена.\n- **HSTS / HPKP** — фиксация политики использования HTTPS (HPKP считается устаревшим).\n- **mTLS** — взаимная аутентификация по сертификатам (Q65).\n- **PKI для электронного документооборота** в РФ — Квалифицированные ЭП через аккредитованные УЦ (Минцифры реестр)."], "terms": [{"ru": "CA", "en": "Certification Authority", "df": "удостоверяющий центр"}, {"ru": "RA / VA", "en": "Registration / Validation Authority", "df": "регистрационный и проверяющий центр"}, {"ru": "HSM", "en": "Hardware Security Module", "df": "аппаратное хранилище ключей"}, {"ru": "CSR", "en": "Certificate Signing Request", "df": "запрос на сертификат"}, {"ru": "DN", "en": "Distinguished Name", "df": "уникальное имя в формате X.500"}, {"ru": "SAN", "en": "Subject Alternative Name", "df": "расширение с альтернативными именами"}, {"ru": "CRL", "en": "Certificate Revocation List", "df": "список отозванных сертификатов"}, {"ru": "CT", "en": "Certificate Transparency, RFC 6962", "df": "публичные логи сертификатов"}, {"ru": "CAA", "en": "Certification Authority Authorization", "df": "DNS-запись ограничения CA"}, {"ru": "ACME", "en": "RFC 8555", "df": "протокол автоматического выпуска (Let's Encrypt)"}], "summary": ["**Сертификат открытого ключа** — подписанный документ, связывающий **открытый ключ с владельцем** (домен/организация/лицо)", "Подпись ставит **удостоверяющий центр (CA)**, которому доверяет проверяющая сторона", "Решает проблему: «как узнать, что этот pk принадлежит example.com, а не атакующему?»", "Стандарт **X.509** (ITU-T, RFC 5280); **PKI** — инфраструктура управления жизненным циклом", "**Структура X.509 v3**: закодирован в **ASN.1 DER**, оборачивается в **PEM** Base64", "**Поля**: Version (v3); Serial Number (уникален в CA); Signature Algorithm (sha256WithRSAEncryption, ecdsa-with-SHA256); **Issuer** (DN CA)", "**Validity** (Not Before / Not After, публичные TLS ≤ 398 дней → переход к ≤90); **Subject** (DN: CN/O/OU/C/L/ST); **Subject Public Key Info**", "**Расширения v3**: **SAN** (Subject Alternative Name, **современные браузеры игнорируют CN!**); **Key Usage** (Digital Signature, Cert Sign, CRL Sign); **EKU** (Server Auth, Client Auth, Code Signing)", "**Basic Constraints** (CA: TRUE/FALSE, глубина); **AKI/SKI** (для цепочки); **CRL Distribution Points**; **AIA** (OCSP URL); **CT SCTs** (RFC 6962, обязательны)", "**Типы валидации (TLS)**: **DV** (Domain, Let's Encrypt/ZeroSSL); **OV** (Organization); **EV** (Extended, юридическая); **Wildcard** `*.example.com`; **SAN** (множественные домены)", "**CA** хранит закрытый root в **HSM** (offline для root, online для issuing); получает **CSR**; проверяет владение (DV: HTTP-01/DNS-01 **ACME**; OV/EV: документы); подписывает", "CA подчиняется **CA/Browser Forum Baseline Requirements**, аудит **WebTrust/ETSI EN 319 411**", "Публичные: **Let's Encrypt** (ISRG), DigiCert, GlobalSign, Sectigo, GoDaddy; РФ — «Криптопро», TaxCom, КонтурСертификат", "**ACME** (RFC 8555) — автоматический выпуск (Let's Encrypt, certbot)", "**Отзыв**: **CRL** (Certificate Revocation List, **CDP**, периодически, большой, медленно); **OCSP** (RFC 6960, real-time запрос, privacy-issue)", "**OCSP Stapling** (RFC 6066): сервер «приклеивает» OCSP-ответ к TLS handshake → клиент не идёт к CA; **CRLite/CRLSets** (Mozilla/Chrome); **short-lived certs** (7-90 дней без revocation)", "**PKI компоненты**: **Root CA** (самоподписан, offline); **Intermediate/Issuing CAs**; **RA** (Registration); **VA** (Validation, OCSP/CRL); **HSM**; **Repository**", "**Иерархическая модель**: Root CA встроен в **trust store** (Mozilla NSS, Apple Keychain, MS CertStore, ca-certificates); Intermediate подписан Root; end-entity подписан Intermediate; **chain of trust**", "Альтернативы: **Web of Trust** (PGP, без иерархии, подписи друзей); **TOFU** (SSH принимает при первом подключении); **DANE/TLSA** (RFC 6698, привязка через DNS + DNSSEC)", "Доп: **CT logs** (RFC 6962, прозрачность, обязательны для публичных TLS); **CAA records** (RFC 8659, DNS-ограничение каких CA можно); **mTLS** (Q65); РФ — Квалифицированные ЭП через аккредитованные УЦ Минцифры"]}, {"n": 65, "title": "Аутентификация. Авторизация. Аудит.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "Модель **AAA** (Authentication, Authorization, Accounting) — фундаментальная триада управления доступом в любой системе ИБ:\n- **Authentication** (аутентификация) — установление того, **кем** является субъект.\n- **Authorization** (авторизация) — что **разрешено** делать аутентифицированному субъекту.\n- **Accounting / Audit** (учёт/аудит) — регистрация действий для последующего анализа.", "Иногда сюда добавляют **Identification** (предъявление идентификатора, отличается от authentication как «логин» от «пароля») и **Non-repudiation** (неотрекаемость).", "<h3>Аутентификация</h3>", "**Три классических фактора**:\n1. **Знание** (something you know) — пароль, PIN, ответ на секретный вопрос.\n2. **Владение** (something you have) — токен, смарт-карта, аппаратный ключ (YubiKey), смартфон с приложением.\n3. **Биометрия** (something you are / do) — отпечаток, лицо, радужка, голос, динамика клавиатуры.", "Дополнительные «факторы»:\n4. **Местоположение** (somewhere you are) — гео-IP, корпоративная сеть.\n5. **Контекст** (something you do) — поведенческие признаки, behavioral biometrics.", "**MFA** (Multi-Factor Authentication) — комбинация нескольких **разнородных** факторов; защищает от компрометации одного из них.", "**Парольная аутентификация**:\n- Хранится **только хеш** пароля с уникальным **salt** через slow-функцию (bcrypt, scrypt, Argon2id, PBKDF2 с миллионами итераций).\n- Защита от перебора: rate limiting, lockout, CAPTCHA.\n- Современные best-practices NIST SP 800-63B: длина важнее сложности, чёрные списки слабых паролей, **отказ от обязательной периодической смены**, поощрение менеджеров паролей.\n- **Passwordless** — современный тренд: вход через биометрию + аппаратный ключ.", "**OTP (One-Time Password)** — одноразовые пароли:\n- **HOTP** (RFC 4226) — на основе счётчика: OTP = HMAC-SHA1(K, counter), показывается 6 цифр.\n- **TOTP** (RFC 6238) — на основе времени с шагом 30 с: OTP = HMAC-SHA1(K, T/30). Используется в Google Authenticator, Authy, Microsoft Authenticator.\n- **SMS OTP** — менее безопасен (SIM-swap, перехват SS7).\n- **Push-уведомления** в приложение — современный безопасный вариант.", "**Аппаратные ключи (FIDO2 / WebAuthn)**:\n- **U2F** (FIDO U2F) и **WebAuthn / FIDO2 / CTAP2** — стандарты для passwordless и второго фактора.\n- Аппаратные токены (YubiKey, Google Titan) — закрытый ключ хранится в защищённом чипе, никогда не покидает устройства.\n- Phishing-resistant: подписывают challenge с учётом домена.", "**Сертификатная аутентификация**:\n1. Сервер шлёт случайный challenge (TLS ClientHello / RANDOM).\n2. Клиент подписывает challenge своим закрытым ключом.\n3. Сервер проверяет подпись открытым ключом из X.509-сертификата клиента.\n- Используется в **mTLS** (mutual TLS), IPSec, IKEv2, VPN, smart-card логине в Windows (Kerberos PKINIT), банковских и государственных системах.", "**Kerberos** (RFC 4120) — классический протокол сетевой аутентификации с **TGT** (Ticket Granting Ticket) и **симметричной криптографией**; основа Windows Active Directory.", "**SSO** (Single Sign-On) — единый вход:\n- **SAML 2.0** — XML-based, корпоративный мир.\n- **OpenID Connect (OIDC)** — современный, на основе OAuth 2.0 + JWT, для web/mobile.\n- **OAuth 2.0** — делегированная авторизация (не аутентификация!), потоки Authorization Code, PKCE.", "<h3>Авторизация</h3>", "После аутентификации система решает, **что разрешено** субъекту. Модели:\n- **DAC / MAC / RBAC / ABAC / ReBAC** (Q58).\n- **Policy decision point (PDP)** и **policy enforcement point (PEP)** — архитектура XACML.\n- **Scope / claims в JWT** — современное микросервисное.\n- **POSIX permissions, ACL** на ФС.\n- **Capability-based security** — токены-«мандаты» (object capabilities), используется в seL4, gVisor.\n- **OPA / Cedar** — современные decoupled-движки авторизации.", "<h3>Аудит / Accounting</h3>", "- Все значимые события записываются в **журналы** (audit logs).\n- Стандарты: **Syslog** (RFC 5424), **CEF**, **LEEF**, **Windows Event Log**.\n- Хранятся защищённо (append-only, WORM, secure forwarding, удалённый sink), чтобы атакующий не мог стереть следы.\n- Анализируются в **SIEM** для корреляции и обнаружения инцидентов.\n- В сетевом контексте — **accounting** включает учёт трафика, длительности сессий, использования ресурсов для биллинга.", "<h3>Сетевые протоколы AAA</h3>", "- **RADIUS** (Remote Authentication Dial-In User Service, RFC 2865) — UDP/1812 (auth), 1813 (acc); шифрует только пароль; используется в Wi-Fi (802.1X / EAP), VPN, dial-up.\n- **TACACS+** (Cisco) — TCP/49; шифрует весь пакет; разделяет AAA на отдельные операции; популярен для управления сетевым оборудованием.\n- **Diameter** (RFC 6733) — преемник RADIUS, надёжный, TCP/SCTP, peer-to-peer; основа сигнализации в LTE/5G core.\n- **EAP** (Extensible Authentication Protocol, RFC 3748) — каркас для разных методов аутентификации: EAP-TLS, EAP-PEAP, EAP-TTLS, EAP-AKA (для SIM).", "<h3>Аутентификация информации</h3>", "**Data origin authentication** — подтверждение, что данные пришли от заявленного источника и не изменены:\n- **MAC** (Message Authentication Code) — общий ключ, симметрия (HMAC, CMAC, GMAC).\n- **Цифровая подпись** — асимметричная, плюс non-repudiation.\n- **AEAD** (Q62) — шифрование + аутентификация в одном.", "Защита от **replay-attack**: nonce, timestamp, sequence number, challenge-response."], "terms": [{"ru": "AAA", "en": "Authentication, Authorization, Accounting / Audit", "df": "модель управления доступом"}, {"ru": "SSO", "en": "Single Sign-On", "df": "единый вход"}], "summary": ["**AAA**: **Authentication** (кем является) + **Authorization** (что разрешено) + **Accounting/Audit** (регистрация)", "Дополнения: **Identification** (предъявление логина) и **Non-repudiation**", "**Три классических фактора аутентификации**: **знание** (пароль, PIN); **владение** (токен, смарт-карта, **YubiKey**, смартфон); **биометрия** (отпечаток, лицо, голос)", "Дополнительные: местоположение (geo-IP); контекст (behavioral biometrics)", "**MFA** — комбинация **разнородных** факторов; защищает от компрометации одного", "**Пароли**: хранится только **хеш + уникальный salt** через **slow-функции** (**bcrypt, scrypt, Argon2id, PBKDF2** с миллионами итераций)", "Защита: rate limiting, lockout, CAPTCHA; **NIST SP 800-63B**: длина важнее сложности, чёрные списки слабых, **отказ от обязательной смены**; passwordless — тренд", "**OTP**: **HOTP** (RFC 4226, на счётчике, OTP = HMAC-SHA1(K, counter)); **TOTP** (RFC 6238, время с шагом 30 с, **Google Authenticator/Authy/MS Authenticator**)", "**SMS OTP** — менее безопасен (SIM-swap, SS7); push в приложение — безопасно", "**Аппаратные ключи**: **FIDO U2F**, **WebAuthn/FIDO2/CTAP2** — passwordless и 2FA", "YubiKey, Google Titan: закрытый ключ в защищённом чипе, **phishing-resistant** (подписывают challenge с учётом домена)", "**Сертификатная**: сервер шлёт challenge → клиент подписывает закрытым ключом → сервер проверяет X.509 клиента; в **mTLS**, IPSec, IKEv2, VPN, Kerberos PKINIT (smart-card в Windows)", "**Kerberos** (RFC 4120): **TGT** (Ticket Granting Ticket) + симметричная криптография; основа Windows Active Directory", "**SSO**: **SAML 2.0** (XML, корпоративный); **OpenID Connect (OIDC)** (на OAuth 2.0 + JWT, web/mobile); **OAuth 2.0** (делегированная авторизация, **не аутентификация!**); потоки Authorization Code + PKCE", "**Авторизация — модели**: DAC/MAC/RBAC/**ABAC**/ReBAC (Q58); **PDP/PEP** (XACML); scope/claims в JWT; POSIX/ACL на ФС", "Capability-based security (seL4, gVisor); современные — **OPA**, **Cedar** (decoupled-движки)", "**Аудит/Accounting**: значимые события в audit logs; **Syslog** (RFC 5424), CEF, LEEF, Windows Event Log", "Хранятся **append-only/WORM**, удалённый sink; анализ в **SIEM**; accounting + учёт трафика/сессий/ресурсов для биллинга", "**Сетевые AAA-протоколы**: **RADIUS** (RFC 2865, UDP/1812 auth, 1813 acc, шифрует только пароль; Wi-Fi 802.1X/EAP, VPN)", "**TACACS+** (Cisco, TCP/49, шифрует весь пакет, AAA раздельно — сетевое оборудование); **Diameter** (RFC 6733, преемник RADIUS, TCP/SCTP, в LTE/5G core); **EAP** (RFC 3748, EAP-TLS/PEAP/TTLS/AKA)", "**Data origin authentication**: **MAC/HMAC** (симм., HMAC/CMAC/GMAC) vs **цифровая подпись** (асимм. + non-repudiation); **AEAD** (Q62)", "Защита от **replay**: nonce, timestamp, sequence number, challenge-response"]}, {"n": 66, "title": "IPSec.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**IPSec** (Internet Protocol Security) — семейство стандартов IETF (RFC 4301–4309, 7296), обеспечивающих **криптографическую защиту IP-трафика на сетевом уровне (L3)**. В отличие от TLS, который работает на транспортном уровне и шифрует трафик отдельных приложений, IPSec **прозрачен для приложений** и защищает абсолютно любой IP-пакет. Это делает IPSec предпочтительным для **site-to-site VPN** между офисами, **remote-access VPN** для сотрудников и для **обязательной защиты** всего трафика в IPv6 (где IPSec был спроектирован как часть стека).", "IPSec обеспечивает **конфиденциальность** (шифрование), **целостность**, **аутентификацию источника** и **защиту от replay-атак**.", "<h3>Режимы работы</h3>", "**Транспортный режим (Transport Mode)**:\n- Шифруется/аутентифицируется только **полезная нагрузка** оригинального IP-пакета.\n- Исходный IP-заголовок остаётся видимым.\n- Применяется в **host-to-host** сценариях: два хоста защищают связь между собой.", "**Туннельный режим (Tunnel Mode)**:\n- Весь оригинальный IP-пакет (включая заголовок) шифруется/аутентифицируется и инкапсулируется как полезная нагрузка нового IP-пакета с новыми «внешними» адресами шлюзов.\n- Применяется в **gateway-to-gateway** (site-to-site VPN) и **host-to-gateway** (remote access).", "<h3>Протоколы IPSec</h3>", "**AH** (Authentication Header, IP-протокол **51**):\n- Обеспечивает аутентификацию и целостность всего пакета (включая невменяемые поля IP).\n- **Без шифрования** — содержимое читаемо.\n- Несовместим с NAT (защищает IP-заголовок, NAT его меняет).\n- Сегодня почти не используется самостоятельно.", "**ESP** (Encapsulating Security Payload, IP-протокол **50**):\n- **Шифрование** полезной нагрузки (или всего пакета в tunnel mode).\n- Аутентификация и целостность через ICV (Integrity Check Value).\n- Replay-protection через sequence number.\n- Может работать в **NULL-encryption** + auth-only режиме (как AH, но дружит с NAT).\n- **Основной** протокол на практике.", "В ESP-пакете: SPI (Security Parameter Index) → Sequence Number → Payload → Padding → Pad Length → Next Header → ICV.", "<h3>Security Associations и базы данных</h3>", "**SA** (Security Association) — **однонаправленное** соглашение защиты между двумя сторонами; для двусторонней связи нужны две SA (одна на каждое направление).", "Каждая SA содержит:\n- Алгоритмы шифрования и аутентификации, ключи.\n- Sequence number и anti-replay window.\n- **SPI** (Security Parameter Index, 32 бита) — идентификатор SA.\n- IP-адреса участников.\n- Mode (transport/tunnel), lifetime.", "Базы данных:\n- **SAD** (Security Association Database) — активные SA, индексируются SPI, IP-адресом, протоколом.\n- **SPD** (Security Policy Database) — политика «какой трафик нужно защищать, как, через какую SA»; принимает решения «PROTECT / BYPASS / DISCARD».", "<h3>IKE — Internet Key Exchange</h3>", "**IKE** (RFC 7296 — IKEv2) — протокол **автоматического согласования параметров SA и обмена ключами**. Работает поверх UDP/500 (и UDP/4500 при NAT-T).", "Две версии:\n- **IKEv1** (RFC 2409) — устаревшая, сложная (Main / Aggressive Mode, Phase 1 + Phase 2).\n- **IKEv2** (RFC 7296) — современная: упрощённое сообщение из 4 пакетов IKE_SA_INIT + IKE_AUTH; перекладывает большую часть отказоустойчивости на DPD (Dead Peer Detection); обязательная **анти-DoS** через cookies; поддержка **MOBIKE** для смены IP клиента; **EAP-аутентификация** для remote access.", "Этапы IKEv2:\n1. **IKE_SA_INIT** — обмен Diffie-Hellman (ECDHE через X25519, secp256r1, MODP-группы) → общий шифрующий ключ → защищённый IKE-канал (**IKE SA**).\n2. **IKE_AUTH** — взаимная аутентификация (PSK / сертификаты / EAP) и создание первой **CHILD SA** (для пользовательского трафика).\n3. **CREATE_CHILD_SA** — создание дополнительных CHILD SA, rekey.\n4. **INFORMATIONAL** — служебные сообщения.", "<h3>Криптоалгоритмы (по RFC 8221, 8247)</h3>", "- **Шифрование**: AES-GCM-256, AES-CCM, ChaCha20-Poly1305. AES-CBC + HMAC устаревает.\n- **Целостность**: AES-GMAC, HMAC-SHA-256/384/512.\n- **DH-группы**: X25519, X448, secp256r1/384r1, MODP-3072 и выше; для постквантовой стойкости — гибридные комбинации.\n- **Аутентификация**: PSK, RSA, ECDSA, EdDSA, EAP.", "<h3>NAT-T (NAT Traversal)</h3>", "IPSec ESP несовместим с классическим NAT, потому что NAT меняет адреса/порты, но ESP не имеет UDP/TCP-заголовка. Решение — **NAT-T** (RFC 3947): ESP оборачивается в UDP/4500. IKE и сам сразу детектирует наличие NAT в IKE_SA_INIT и переходит на 4500.", "<h3>Применения IPSec</h3>", "- **Site-to-Site VPN** между офисами и дата-центрами.\n- **Remote Access VPN** (Windows AlwaysOn, strongSwan, OpenIKED).\n- **Защита маршрутизирующих протоколов** (OSPF, BGP, RIPng).\n- **Mobile IPv6** для шифрованных Binding Updates.\n- **Защита трафика контроллеров** в SDN.\n- В сотовых сетях — между gNB/eNB и core (S1/N3-интерфейсы).\n- **Group IPSec** (RFC 6407 GDOI) — для multicast.", "<h3>IPSec vs альтернативы</h3>", "| Критерий | IPSec | TLS / OpenVPN | WireGuard |\n|---|---|---|---|\n| Уровень OSI | L3 | L4–L7 | L3 (UDP) |\n| Прозрачность | да (для приложений) | нет (приложение знает) | да |\n| Сложность настройки | высокая | средняя | низкая |\n| Скорость | высокая | средняя | очень высокая |\n| Через NAT | требует NAT-T | хорошо | хорошо |\n| Алгоритмы | гибкий ассортимент | гибкий | строго фиксированный |\n| Размер кода | большой | большой | очень малый |"], "terms": [{"ru": "IPSec", "en": "RFC 4301", "df": "защита IP-трафика на сетевом уровне"}, {"ru": "AH", "en": "Authentication Header, протокол 51", "df": "без шифрования"}, {"ru": "ESP", "en": "Encapsulating Security Payload, протокол 50", "df": "со шифрованием"}, {"ru": "SA", "en": "Security Association", "df": "однонаправленный набор параметров защиты"}, {"ru": "SPI", "en": "Security Parameter Index", "df": "идентификатор SA в заголовке"}, {"ru": "SAD", "en": "Security Association Database", "df": "база активных SA"}, {"ru": "SPD", "en": "Security Policy Database", "df": "база политик"}, {"ru": "IKE / IKEv2", "en": "RFC 7296", "df": "протокол обмена ключами"}, {"ru": "DPD", "en": "Dead Peer Detection", "df": "обнаружение мёртвого партнёра"}, {"ru": "MOBIKE", "en": "RFC 4555", "df": "поддержка смены IP клиента"}, {"ru": "NAT-T", "en": "NAT Traversal, RFC 3947", "df": "обход NAT через UDP/4500"}], "summary": ["**IPSec** (RFC 4301-4309, 7296) — криптографическая защита **IP-трафика на L3**", "**Прозрачен для приложений** (в отличие от TLS на L4); защищает любой IP-пакет", "Применения: **site-to-site VPN**, **remote-access VPN**, обязательная защита IPv6", "Обеспечивает: конфиденциальность, целостность, аутентификацию источника, anti-replay", "**Transport Mode**: шифруется/аутентифицируется **только полезная нагрузка**; исходный IP-заголовок виден; host-to-host", "**Tunnel Mode**: **весь IP-пакет** (включая заголовок) шифруется и инкапсулируется в новый с адресами шлюзов; gateway-to-gateway, host-to-gateway", "**AH** (Authentication Header, **протокол 51**): аутентификация и целостность всего пакета, **без шифрования**; **несовместим с NAT** (защищает IP-заголовок)", "**ESP** (Encapsulating Security Payload, **протокол 50**): **шифрование + аутентификация** + anti-replay через sequence number; основной", "ESP-пакет: **SPI** (32 бит, идентификатор SA) → Sequence Number → Payload → Padding → Pad Length → Next Header → **ICV** (Integrity Check Value)", "**SA** (Security Association) — **однонаправленный** контракт защиты; двусторонняя связь = **две SA**", "Содержит: алгоритмы + ключи; sequence + anti-replay window; **SPI** 32 бит; IP-адреса; mode/lifetime", "**SAD** (Security Association Database) — активные SA, индекс по SPI; **SPD** (Security Policy Database) — «какой трафик защищать»: PROTECT/BYPASS/DISCARD", "**IKE** (Internet Key Exchange) — автоматическое согласование SA и обмен ключами; UDP/500 (UDP/4500 при NAT-T)", "**IKEv1** (RFC 2409, устар., Main/Aggressive + Phase 1/2); **IKEv2** (RFC 7296, упрощённо 4 пакета, обязательная anti-DoS cookies, **MOBIKE** для смены IP, EAP)", "**Этапы IKEv2**: 1) **IKE_SA_INIT** — Diffie-Hellman (X25519/secp256r1/MODP) → общий ключ → IKE SA; 2) **IKE_AUTH** — взаимная аутентификация (**PSK/сертификаты/EAP**) + первая **CHILD SA**", "3) CREATE_CHILD_SA (rekey); 4) INFORMATIONAL", "**Криптоалгоритмы** (RFC 8221, 8247): шифр — **AES-GCM-256, AES-CCM, ChaCha20-Poly1305** (AES-CBC+HMAC устаревает); целостность — AES-GMAC, HMAC-SHA-256/384/512", "DH-группы: X25519, X448, secp256r1/384r1, MODP-3072+; гибридные с PQC для постквантовости", "**NAT-T** (RFC 3947): ESP несовместим с классическим NAT →
