ак они выглядят в виде сигнала. У Ethernet это менялось много раз; для экзамена достаточно запомнить общие вехи:", "- **Изначально** — толстый и тонкий **коаксиальный кабель**, общий на всю сеть (10BASE5 и 10BASE2, 1980-е).\n- **С 1990-х** — **витая пара** (Cat5e/Cat6/Cat6a/...) до 100 метров; от 10 Мбит/с (10BASE-T) до 10 Гбит/с (10GBASE-T) по той же физической схеме «звезды» от коммутатора.\n- **Современные высокие скорости** — **оптоволокно**: одномодовое для длинных дистанций, многомодовое для коротких; на нём строятся каналы 25, 100, 400 и 800 Гбит/с в дата-центрах и магистралях.", "Топология тоже изменилась: раньше все компьютеры висели на одном общем кабеле («шина»), сейчас каждый компьютер подключается **отдельным проводом** к центральному коммутатору («звезда»). Старая шинная топология и порождала всю проблему коллизий, которую решает следующий подуровень.", "<h3>Протокол подуровня MAC — CSMA/CD</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/1/13/Ethernet_Type_II_Frame_format.svg\" alt=\"Формат кадра Ethernet II\" loading=\"lazy\"><figcaption>Формат кадра Ethernet II: преамбула, MAC-адреса назначения и источника, тип верхнего протокола (EtherType), полезная нагрузка и контрольная сумма. <em>Источник: Wikimedia Commons, public domain.</em></figcaption></figure>", "В классическом Ethernet все компьютеры разделяют один физический кабель, и нужны правила, как им по очереди говорить. Эти правила называются **CSMA/CD** (Carrier Sense Multiple Access with Collision Detection):", "1. Перед передачей компьютер **слушает** кабель.\n2. Если кабель свободен — начинает передавать кадр; если занят — ждёт, пока освободится.\n3. Во время передачи он продолжает слушать. Если кто-то ещё начал передавать одновременно (**коллизия**), оба сигнала смешиваются. Передающий это видит, **немедленно прекращает** передачу и шлёт короткий «глушащий» сигнал (jam).\n4. После коллизии ждёт случайное время и пробует снова. Каждая следующая неудача удваивает диапазон случайной задержки (**бинарный экспоненциальный откат**).", "Этот алгоритм нужен только тогда, когда несколько устройств действительно делят один общий кабель. В современных коммутируемых сетях он не используется (см. ниже).", "**Формат кадра Ethernet.** Каждый кадр состоит из:", "- **преамбулы** — короткой синхронизирующей последовательности, чтобы получатель «поймал» темп;\n- **MAC-адреса получателя** и **MAC-адреса отправителя** (по 6 байт каждый — уникальный идентификатор сетевой карты);\n- поля **EtherType** (2 байта) — указывает, какой протокол лежит выше: IPv4, IPv6, ARP и т. д.;\n- **полезной нагрузки** — от 46 до 1500 байт;\n- контрольной суммы **FCS** (CRC-32) — для проверки целостности.", "Минимальный размер кадра — 64 байта — не случаен. Он рассчитан так, чтобы передача длилась дольше, чем сигнал успеет дойти до самого дальнего узла сегмента и обратно. Иначе коллизию не успели бы обнаружить.", "<h3>Производительность Ethernet</h3>", "В классическом CSMA/CD-Ethernet чем больше станций и чем длиннее провод, тем чаще случаются коллизии и тем хуже эффективность. Грубая формула: **η ≈ 1 / (1 + 5·a)**, где `a` — отношение времени распространения сигнала до самой дальней точки к времени передачи кадра. Чем длиннее сегмент или короче кадр, тем больше a и тем меньше КПД.", "Когда скорости Ethernet начали расти (100 Мбит/с, 1 Гбит/с и выше), эта формула стала неудобной: чтобы оставить разумный КПД, пришлось бы делать сегменты всё короче и короче. Решение нашли простое — **отказаться от общего кабеля и коллизий вообще**, перейдя на коммутируемые сети. Сегодня в обычной офисной или домашней сети коллизий нет, эффективность близка к 100%, и КПД-формула актуальна только как историческое упражнение.", "<h3>Коммутируемые сети Ethernet</h3>", "Переход к коммутируемой сети поменял Ethernet в корне. Каждый компьютер подключается **отдельным кабелем** к одному порту коммутатора. На этом проводе передача идёт **в обоих направлениях одновременно** (полный дуплекс), и коллизий просто не бывает — никто кабель не делит.", "**Коммутатор** (switch) — это устройство, которое умеет **направлять кадр только в тот порт, за которым находится получатель**. Делает он это так:", "- Каждый раз, когда на любой из его портов приходит кадр от какого-то MAC-адреса, коммутатор запоминает: «этот MAC находится за этим портом». Записи копятся в специальной таблице (CAM) и устаревают через несколько минут. Этот механизм называется **обратное обучение** (backward learning).\n- Когда нужно переслать кадр, коммутатор смотрит таблицу. Если MAC получателя в ней есть — посылает кадр только на нужный порт. Если MAC ему ещё неизвестен (или это широковещательный кадр) — отправляет на все порты, кроме того, откуда пришёл (**flooding**); по ответу адресата коммутатор узнаёт его местоположение.", "Так из «общего кабеля» Ethernet превратился в нечто похожее на коммутируемую телефонную сеть: каждый разговор идёт по своему пути, не мешая другим. Старое «hub-устройство» (концентратор), которое тупо повторяло сигнал на все порты и тем самым воссоздавало общий кабель, сегодня практически не используется.", "Дополнительно в коммутируемых сетях работают несколько важных механизмов:", "- **STP** (Spanning Tree Protocol) автоматически отключает «лишние» провода, если в сети образуются петли между коммутаторами, — иначе пакеты бесконечно крутились бы по кругу.\n- **VLAN** позволяет разделить один физический коммутатор на несколько логически изолированных сетей."], "terms": [{"ru": "Ethernet", "en": "IEEE 802.3", "df": "семейство стандартов проводных локальных сетей; самый распространённый тип LAN"}, {"ru": "MAC-адрес", "en": "Media Access Control address", "df": "уникальный 6-байтовый идентификатор сетевой карты"}, {"ru": "Кадр Ethernet", "en": "Ethernet frame", "df": "единица передачи: преамбула + адреса + тип + данные + контрольная сумма"}, {"ru": "FCS", "en": "Frame Check Sequence", "df": "контрольная сумма (CRC-32) в конце кадра для проверки целостности"}, {"ru": "CSMA/CD", "en": "Collision Detection", "df": "правило доступа классического Ethernet: слушай → говори → при коллизии откатись и повтори"}, {"ru": "Коллизия", "en": "collision", "df": "одновременная передача двух станций по общему кабелю; смешанный сигнал теряется"}, {"ru": "Двоичный экспоненциальный откат", "en": "binary exponential backoff", "df": "алгоритм случайного ожидания после коллизии"}, {"ru": "Полный дуплекс", "en": "full duplex", "df": "одновременная передача в обоих направлениях по одному кабелю; в современном Ethernet норма"}, {"ru": "Концентратор / хаб", "en": "hub", "df": "старое устройство, повторяющее сигнал на все порты; воссоздаёт «общий кабель»"}, {"ru": "Коммутатор", "en": "switch", "df": "современное устройство, направляющее кадр только в нужный порт по MAC-адресу"}, {"ru": "Обратное обучение", "en": "backward learning", "df": "механизм, с помощью которого коммутатор запоминает, за каким портом стоит каждый MAC-адрес"}, {"ru": "STP", "en": "Spanning Tree Protocol", "df": "протокол, предотвращающий петли в коммутируемой сети"}, {"ru": "VLAN", "en": "Virtual LAN, IEEE 802.1Q", "df": "логическое разделение одного коммутатора на несколько изолированных сетей"}, {"ru": "Домен коллизий", "en": "collision domain", "df": "участок сети, где возможны коллизии; в коммутируемом Ethernet — один кабель к одному порту"}], "summary": ["**Ethernet** (IEEE 802.3, Меткалф/Xerox PARC, 1973) — самый распространённый стандарт проводных локальных сетей", "За 50 лет скорости выросли с 3 Мбит/с до сотен Гбит/с, но **формат кадра и базовые правила сохраняются** — поэтому старое и новое оборудование уживаются", "**Физический уровень** менялся трижды: коаксиальный кабель (общий на сеть, 1980-е) → витая пара до коммутатора (с 1990-х) → оптоволокно для высоких скоростей", "Топология: исторически — общий кабель «шина»; сейчас всегда — **звезда** вокруг коммутатора", "**Подуровень MAC** в классическом Ethernet использует **CSMA/CD**: слушай эфир → если свободен, передай → при коллизии прекрати, шли jam → ждать случайное время с удвоением окна", "**Кадр Ethernet** = преамбула + MAC получателя + MAC отправителя + EtherType (тип верхнего протокола) + полезная нагрузка 46–1500 байт + контрольная сумма CRC-32 (FCS)", "**EtherType**: 0x0800 = IPv4, 0x86DD = IPv6, 0x0806 = ARP, 0x8100 = VLAN-тег", "**Минимум кадра 64 байта** — нужен, чтобы передача длилась дольше времени распространения сигнала; иначе коллизию не успеть бы обнаружить", "**Производительность** классического CSMA/CD: **η ≈ 1/(1+5a)**, где a = время распространения / время передачи; чем длиннее сегмент и короче кадр, тем хуже КПД", "С ростом скоростей CSMA/CD стал неудобен — пришлось бы делать сегменты всё короче; решение: **отказаться от общего кабеля и коллизий вообще**", "**Коммутируемый Ethernet**: каждый компьютер — отдельный провод в порт коммутатора, **полный дуплекс**, коллизий нет, КПД ≈ 100%", "**Коммутатор** направляет кадр только в нужный порт; учится сам по принципу **обратного обучения** (запоминает «MAC X → порт k» из входящих кадров)", "Запись хранится в **CAM-таблице** с таймером старения (~5 минут); неизвестный или широковещательный адрес → **flooding** на все порты", "Старое устройство **хаб** (концентратор) просто повторяет сигнал на все порты, восстанавливая «общий кабель»; устарел, в современных сетях не используется", "**STP** автоматически отключает «лишние» провода, предотвращая петли между коммутаторами", "**VLAN** (802.1Q) — логическое разделение одного коммутатора на несколько изолированных сетей с помощью 4-байтового тега в кадре"]}, {"n": 24, "title": "Fast Ethernet. Gigabit Ethernet. 10-гигабитный Ethernet.", "paragraphs": ["<h3>Общая идея</h3>", "Этот вопрос — про **эволюцию скоростей Ethernet**. С 1995 года она выросла в десятки тысяч раз: от 100 Мбит/с до 400 Гбит/с. Однако сам Ethernet остался узнаваемым:", "- **Формат кадра и правила MAC** (см. Q23) сохранены без изменений во всех поколениях. Это позволяет старому и новому оборудованию работать вместе.\n- Меняются только две вещи: **что используется в качестве провода** (витая пара, оптоволокно, медные сборки в дата-центрах) и **режим работы** (от полудуплексного с борьбой за канал в первых версиях — к полному дуплексу без коллизий в современных).", "Главное, что нужно запомнить: с каждым следующим поколением CSMA/CD играет всё меньшую роль и наконец полностью исчезает в 10-Gigabit Ethernet. Все современные скорости работают только в **полном дуплексе** через коммутаторы.", "<h3>Fast Ethernet — 100 Мбит/с (1995)</h3>", "Первый большой скачок — в 10 раз быстрее классического Ethernet. Был принят в 1995 году как **IEEE 802.3u**. Самый массовый вариант — **100BASE-TX**: обычная витая пара (категории Cat5), две пары проводов из четырёх (одна на передачу, одна на приём), дальность до 100 метров. Это была эпоха офисных сетей конца 1990-х и 2000-х.", "Главные нововведения помимо скорости:", "- **Автосогласование скорости** (Auto-Negotiation) — когда вы втыкаете кабель, две стороны автоматически договариваются о максимальной общей скорости и режиме дуплекса. Поэтому 100-мегабитный компьютер прекрасно работает с 10-мегабитным концентратором.\n- Возможность работать как в полудуплексном режиме (с CSMA/CD, для совместимости со старым оборудованием), так и в полнодуплексном — что стало нормой.", "Был также вариант на оптоволокне (**100BASE-FX**) для более длинных дистанций — до пары километров.", "<h3>Gigabit Ethernet — 1 Гбит/с (1998–1999)</h3>", "Ещё в 10 раз быстрее. Стандарты появились в два этапа: сначала **IEEE 802.3z** для оптоволокна (1998), потом **IEEE 802.3ab** для витой пары (1999). Главный массовый вариант — **1000BASE-T** по тем же привычным проводам категории Cat5e, на 100 метров. Сегодня практически любой домашний или офисный роутер и компьютер поддерживают именно этот стандарт.", "Чтобы добиться гигабита по обычной витой паре, инженерам пришлось задействовать **все четыре пары одновременно**, причём в обе стороны (что само по себе — нетривиальная задача из-за «эха» от собственного сигнала). На каждой паре передаются не два, а пять уровней напряжения — это позволило упаковать больше битов в одну посылку без увеличения тактовой частоты.", "На этой скорости старый CSMA/CD теоретически ещё мог работать, но потребовал «костылей»: короткие кадры приходилось искусственно дополнять до минимальной длины, чтобы коллизию успевали обнаружить. На практике никто эти костыли не использует — гигабитный Ethernet везде ходит только в полнодуплексном режиме через коммутатор.", "<h3>10-гигабитный Ethernet (2002–2006)</h3>", "Ещё в 10 раз быстрее, и здесь произошёл **окончательный отказ от CSMA/CD**: стандарт **IEEE 802.3ae** (2002) поддерживает только полный дуплекс. Это закрывает историю Ethernet как технологии «общего кабеля» — теперь это всегда коммутируемая сеть.", "10-гигабитный Ethernet в основном живёт на оптоволокне. Главные варианты:", "- **На небольшие расстояния** в дата-центрах — многомодовое волокно, дальность от 30 до 300 метров;\n- **На длинные расстояния** — одномодовое волокно, до 10 км (а в особых версиях — до 40 и 80 км).", "В 2006 году появился и медный вариант **10GBASE-T** (стандарт **IEEE 802.3an**): по специальной витой паре **Cat6a** на тех же привычных 100 метрах. Но он энергозатратный (порядка 5 Вт на порт), поэтому массово в офисах не прижился.", "В дата-центрах для коротких соединений между серверами используют не оптику и не классическую витую пару, а **прямые медные сборки** (Direct Attach Copper, DAC) — толстый коаксиально-подобный кабель с уже припаянными разъёмами, длиной до 10 метров. Это дёшево и не требует оптических модулей.", "<h3>Что после 10G</h3>", "После 10G Ethernet продолжил расти: 25, 40, 100, 200, 400 Гбит/с — все это уже стандарты для дата-центров и операторов, не для офисов. Они тоже сохраняют исходный кадр Ethernet — просто бегут по нескольким параллельным оптическим каналам.", "<h3>Сравнение поколений</h3>", "| Поколение | Год | Главный носитель | Дальность по витой паре | CSMA/CD |\n|---|---|---|---|---|\n| Fast Ethernet (100 Мбит/с) | 1995 | витая пара Cat5 | 100 м | возможен, но обычно нет |\n| Gigabit Ethernet (1 Гбит/с) | 1998–1999 | витая пара Cat5e / оптика | 100 м | технически возможен, на практике нет |\n| 10-гигабитный Ethernet | 2002–2006 | в основном оптика, Cat6a для меди | 100 м | отменён, только full-duplex |"], "terms": [{"ru": "Fast Ethernet", "en": "IEEE 802.3u, 1995", "df": "Ethernet со скоростью 100 Мбит/с"}, {"ru": "Gigabit Ethernet", "en": "IEEE 802.3z/ab, 1998–1999", "df": "Ethernet со скоростью 1 Гбит/с"}, {"ru": "10-гигабитный Ethernet", "en": "IEEE 802.3ae/an, 2002–2006", "df": "10 Гбит/с; работает только в полном дуплексе"}, {"ru": "Автосогласование", "en": "Auto-Negotiation", "df": "автоматический выбор сторонами максимальной общей скорости и режима дуплекса"}, {"ru": "Полный дуплекс", "en": "full duplex", "df": "режим, в котором стороны могут передавать одновременно; норма для всех современных Ethernet"}, {"ru": "Полудуплекс", "en": "half duplex", "df": "режим с CSMA/CD, исторический; для 10G отменён"}, {"ru": "Витая пара", "en": "twisted pair", "df": "самый массовый тип проводки Ethernet; категории Cat5 / Cat5e / Cat6 / Cat6a по возрастанию скорости"}, {"ru": "Оптоволокно", "en": "optical fiber", "df": "основной носитель для высоких скоростей и длинных дистанций; одномодовое (длинное) и многомодовое (короткое)"}, {"ru": "DAC", "en": "Direct Attach Copper", "df": "короткие медные сборки с припаянными разъёмами для соединений внутри дата-центров"}], "summary": ["Вопрос — про **эволюцию скоростей Ethernet** с 1995 года: 100 Мбит/с → 1 Гбит/с → 10 Гбит/с (и дальше)", "**Формат кадра и правила MAC сохраняются во всех поколениях** — поэтому старое и новое оборудование совместимо", "Меняются только две вещи: **тип провода** и **режим работы** (от полудуплекса с CSMA/CD к полному дуплексу без коллизий)", "**Fast Ethernet** (IEEE 802.3u, 1995) — 100 Мбит/с; в 10 раз быстрее классического Ethernet", "Главный вариант — **100BASE-TX** по витой паре Cat5 (2 пары из 4), дальность 100 метров", "Появилось **автосогласование** (Auto-Negotiation): стороны сами договариваются о максимальной общей скорости и режиме дуплекса", "Был и оптический вариант 100BASE-FX для дистанций до пары километров", "**Gigabit Ethernet** (IEEE 802.3z для оптики 1998, **802.3ab для меди 1999**) — 1 Гбит/с", "**1000BASE-T** по витой паре Cat5e на 100 м — сегодня стандарт в любом офисе и доме", "Чтобы достичь 1 Гбит/с по меди, задействовали **все 4 пары одновременно** в обе стороны и 5 уровней напряжения вместо 2", "На 1 Гбит/с CSMA/CD теоретически возможен, но на практике никто его не использует — везде полный дуплекс через коммутатор", "**10-гигабитный Ethernet** (IEEE 802.3ae 2002, медный 802.3an 2006) — **окончательный отказ от CSMA/CD**, только полный дуплекс", "Живёт в основном на **оптоволокне**: многомодовое до 300 м в дата-центре, одномодовое до 10–80 км", "Медный 10GBASE-T по витой паре Cat6a на 100 м существует, но энергозатратен (~5 Вт/порт), массово не прижился", "Внутри дата-центра между серверами вместо оптики часто используют **DAC** — медные сборки с припаянными разъёмами до 10 м", "После 10G: 25/40/100/200/400 Гбит/с — параллельные оптические каналы, для дата-центров и операторов", "Запомнить: каждое следующее поколение в 10 раз быстрее, всё больше живёт в полном дуплексе, и CSMA/CD умирает к 10G"]}, {"n": 25, "title": "Стандарт 802.11: архитектура и стек протоколов, физический уровень, протокол подуровня управления доступом к среде, структура кадра, сервисы.", "paragraphs": ["<h3>Общая идея</h3>", "**IEEE 802.11**, известный под коммерческим названием **Wi-Fi**, — семейство стандартов беспроводных локальных сетей. Они описывают, как устройства общаются по радио в безлицензионных диапазонах 2,4 / 5 / 6 ГГц. Первый стандарт принят в 1997 году; современные поколения — Wi-Fi 6 (802.11ax) и Wi-Fi 7 (802.11be).", "Этот вопрос требует разобрать 802.11 по пяти составным частям: **архитектура**, **физический уровень**, **подуровень MAC** (доступ к среде), **формат кадра** и **сервисы** (услуги, которые сеть предоставляет станциям).", "<h3>Архитектура и стек протоколов</h3>", "В терминологии 802.11 любое устройство называется **станцией** (STA, Station). Станцией считается и ноутбук, и смартфон, и сама точка доступа.", "Сети 802.11 могут работать в двух режимах:", "- **Инфраструктурный режим** — наиболее частый. Существует выделенная **точка доступа** (AP, Access Point). Все клиенты ассоциируются с ней и общаются только через неё, даже если хотят что-то передать соседу. AP плюс её клиенты образуют **базовый набор служб BSS** (Basic Service Set), идентифицируемый MAC-адресом точки доступа (**BSSID**). Несколько BSS можно объединить общей проводной сетью (распределительная система, **DS** — Distribution System), и тогда получается **расширенный набор служб ESS** (Extended Service Set) — то, что вы видите как «единую Wi-Fi сеть» с одним именем **SSID** (Service Set Identifier). В ESS возможен **роуминг**: клиент при движении автоматически переключается между AP.\n- **Режим ad-hoc** (**IBSS**, Independent BSS) — точки доступа нет, станции общаются напрямую между собой. Применяется редко.", "Стек 802.11 описывает только два нижних уровня OSI: физический (PHY) и канальный, причём в нём дополнительно выделяют подуровень **MAC** (управление доступом к среде) и подуровень **LLC** (логическое управление линией, общий с другими стандартами 802). Над ним обычно сразу IP, дальше всё как в проводной сети.", "<h3>Физический уровень</h3>", "Физический уровень 802.11 эволюционировал вместе со скоростями. Ниже — главные ориентиры (детали поколений не обязательны, но 3–4 ключевые точки знать стоит):", "- **802.11a / 802.11g** (1999 / 2003) — введён **OFDM** (ортогональное частотное мультиплексирование); скорость до 54 Мбит/с.\n- **802.11n / Wi-Fi 4** (2009) — добавлен **MIMO** (несколько антенн с обеих сторон, передающих параллельные потоки); до 600 Мбит/с.\n- **802.11ac / Wi-Fi 5** (2013) — модуляция 256-QAM, **MU-MIMO** (точка доступа передаёт сразу нескольким клиентам).\n- **802.11ax / Wi-Fi 6** (2019) — модуляция 1024-QAM, новый механизм **OFDMA** (один радиоканал делится между несколькими клиентами по частоте), диапазон 6 ГГц.\n- **802.11be / Wi-Fi 7** (2024) — модуляция 4096-QAM, работа в нескольких диапазонах одновременно (**MLO**).", "Главные технические идеи, которые надо упомянуть на экзамене: **OFDM** (передача на множестве близких поднесущих с защитой от многолучевого распространения), **MIMO** (параллельные потоки через несколько антенн), **OFDMA** (деление одного канала между клиентами).", "<h3>Протокол подуровня MAC</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/1/1d/Csma_ca.svg\" alt=\"Алгоритм CSMA/CA в Wi-Fi\" loading=\"lazy\"><figcaption>Алгоритм CSMA/CA: слушать канал → подождать DIFS → случайный backoff → передать → получить ACK через SIFS. При неудаче — удвоить окно ожидания. <em>Источник: Wikimedia Commons, jjgarcia.tsc, Attribution.</em></figcaption></figure>", "Главный режим доступа — **DCF** (Distributed Coordination Function), построенный на **CSMA/CA** (Carrier Sense Multiple Access with Collision Avoidance). В отличие от проводного Ethernet, радиостанция не может слышать собственную передачу и поэтому не способна **обнаружить** коллизию — её нужно **предотвратить**. Алгоритм:", "1. Станция слушает эфир.\n2. Если канал свободен, она ждёт небольшой фиксированный промежуток **DIFS** (~34 мкс).\n3. Затем — случайное число микрослотов (**backoff**), чтобы две станции, ждавшие одновременно, не «прыгнули» в эфир в один и тот же момент.\n4. Передаёт кадр.\n5. Получатель через очень короткую паузу **SIFS** (~16 мкс) отправляет **подтверждение ACK**.\n6. Если отправитель не получил ACK — удваивает диапазон случайного ожидания (**бинарный экспоненциальный откат**) и пробует снова.", "Подтверждения **обязательны**, потому что без них отправитель никак не узнает, дошёл ли кадр.", "Дополнительные механизмы:", "- **NAV** (Network Allocation Vector) — «виртуальное прослушивание». В заголовке каждого кадра есть поле `Duration`, говорящее, сколько времени канал будет занят этим обменом. Все услышавшие станции запоминают это значение и молчат до его истечения.\n- **RTS/CTS** — опциональный 4-шаговый обмен (запрос на передачу → разрешение → данные → ACK) для борьбы с **проблемой скрытого узла** (см. Q22). Обычно включается только для длинных кадров.\n- **PCF** (Point Coordination Function) — альтернативный, бесконкурентный режим: точка доступа сама опрашивает клиентов по списку. На практике почти не применяется.\n- **QoS / WMM** — приоритизация трафика (голос > видео > обычные данные > фон), важна для звонков и видеоконференций.", "<h3>Структура кадра</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/5/53/802.11_MAC_Frame.svg\" alt=\"Формат кадра MAC IEEE 802.11\" loading=\"lazy\"><figcaption>Структура кадра MAC IEEE 802.11: 2-байтные Frame Control и Duration, четыре адресных поля по 6 байт (Address 4 присутствует только в WDS-режиме), Sequence Control, полезная нагрузка и контрольная сумма FCS. <em>Источник: Wikimedia Commons, CC BY-SA 4.0.</em></figcaption></figure>", "Кадры 802.11 бывают трёх типов, различающихся ролью:", "- **Управляющие** (Management) — обслуживание сети: **Beacon** (точка доступа раз в ~100 мс шлёт «маяк» с описанием сети), Probe Request/Response (поиск сетей клиентом), Association / Disassociation, Authentication.\n- **Контрольные** (Control) — короткие служебные: RTS, CTS, ACK.\n- **Данные** (Data) — несут полезную нагрузку пользователя.", "Все они имеют общий заголовок MAC. Структура полей кадра данных:", "| Поле | Размер | Назначение |\n|---|---|---|\n| **Frame Control** | 2 байта | тип / подтип кадра, флаги направления **ToDS / FromDS**, флаги фрагментации, защиты, питания |\n| **Duration / ID** | 2 байта | время в микросекундах, на которое канал будет занят этим обменом; нужно для механизма **NAV** |\n| **Address 1** | 6 байт | получатель на этом участке передачи (Receiver) |\n| **Address 2** | 6 байт | передатчик на этом участке (Transmitter) |\n| **Address 3** | 6 байт | конечный получатель **или** исходный отправитель (зависит от ToDS/FromDS) |\n| **Sequence Control** | 2 байта | номер последовательности и номер фрагмента кадра |\n| **Address 4** | 6 байт | присутствует только при обмене между двумя AP (`ToDS=FromDS=1`) |\n| **Payload** | 0–2304 байт | полезная нагрузка |\n| **FCS** | 4 байта | контрольная сумма (CRC-32) |", "**Главная особенность кадра 802.11 — четыре поля адресов** (в проводном Ethernet их только два). Они нужны потому, что кадр может проходить через точку доступа, и интерпретация адресов зависит от двух флагов в Frame Control — **ToDS** («идёт в проводную сеть») и **FromDS** («идёт из проводной сети»):", "| Сценарий | ToDS | FromDS | Address 1 | Address 2 | Address 3 | Address 4 |\n|---|---|---|---|---|---|---|\n| Внутри ad-hoc (без AP) | 0 | 0 | получатель | отправитель | BSSID | — |\n| От клиента → в проводную сеть | 1 | 0 | AP | клиент | конечный получатель | — |\n| Из проводной сети → клиенту | 0 | 1 | клиент | AP | исходный отправитель | — |\n| Между двумя AP (WDS / mesh) | 1 | 1 | следующая AP | предыдущая AP | конечный получатель | исходный отправитель |", "Таким образом, четыре адреса позволяют **различить четырёх возможных участников**: исходного отправителя, физического передатчика на текущем участке, физического получателя на текущем участке и конечного адресата.", "В современных поколениях (Wi-Fi 4 и выше) после Sequence Control добавляются опциональные поля **QoS Control** (2 байта, для приоритизации трафика) и **HT/VHT/HE Control** (4 байта, параметры MIMO/OFDMA).", "<h3>Сервисы 802.11</h3>", "Стандарт описывает девять сервисов — действий, которые сеть предоставляет станциям. Для экзамена удобно сгруппировать их в четыре блока:", "- **Аутентификация и ассоциация** — клиент сначала **аутентифицируется** (доказывает, что имеет право пользоваться сетью), затем **ассоциируется** с конкретной точкой доступа (становится её клиентом). При переходе между AP — **реассоциация**; при разрыве — **диссоциация** или **деаутентификация**.\n- **Передача данных** (MSDU delivery) — собственно доставка кадров.\n- **Конфиденциальность** (privacy / шифрование) — защита эфира от прослушивания. Поколения: **WEP** (старый, взломан, не использовать) → **WPA** → **WPA2** (на основе AES) → **WPA3** (защита от офлайн-словарных атак). Сегодня обязательный минимум — WPA2.\n- **Распределение и интеграция** (distribution, integration) — пересылка кадра внутри распределительной системы между точками доступа и связь Wi-Fi с проводной сетью через точку доступа в роли шлюза.", "Плюс служебные функции: **управление энергопотреблением** (клиент может «засыпать», а AP буферизует для него кадры) и **управление качеством обслуживания QoS**."], "terms": [{"ru": "Станция", "en": "STA, Station", "df": "любое 802.11-устройство (ноутбук, смартфон, AP)"}, {"ru": "Точка доступа", "en": "AP, Access Point", "df": "центральное устройство, через которое общаются клиенты в инфраструктурном режиме"}, {"ru": "BSS", "en": "Basic Service Set", "df": "точка доступа со своими клиентами; идентифицируется MAC-адресом AP (BSSID)"}, {"ru": "ESS", "en": "Extended Service Set", "df": "несколько BSS, объединённых общей проводной сетью; одна Wi-Fi-сеть с единым именем (SSID)"}, {"ru": "IBSS", "en": "Independent BSS", "df": "режим ad-hoc, без точки доступа"}, {"ru": "SSID", "en": "Service Set Identifier", "df": "имя Wi-Fi-сети, видимое пользователю"}, {"ru": "DS", "en": "Distribution System", "df": "проводная сеть, соединяющая точки доступа в ESS"}, {"ru": "CSMA/CA", "en": "Carrier Sense Multiple Access with Collision Avoidance", "df": "алгоритм доступа Wi-Fi: слушать → ждать → передать → получить ACK"}, {"ru": "DCF", "en": "Distributed Coordination Function", "df": "основной режим доступа в Wi-Fi, на основе CSMA/CA"}, {"ru": "NAV", "en": "Network Allocation Vector", "df": "«виртуальное прослушивание»: счётчик времени занятости канала по полю Duration в чужих кадрах"}, {"ru": "RTS / CTS", "en": "Request / Clear To Send", "df": "обмен «можно?»/«можно» для борьбы с проблемой скрытого узла"}, {"ru": "OFDM", "en": "Orthogonal Frequency Division Multiplexing", "df": "передача на множестве близких поднесущих; основа всех современных Wi-Fi PHY"}, {"ru": "MIMO", "en": "Multiple Input Multiple Output", "df": "несколько антенн с обеих сторон, параллельные потоки данных"}, {"ru": "MU-MIMO", "en": "Multi-User MIMO", "df": "одновременная передача точкой доступа нескольким клиентам"}], "summary": ["**IEEE 802.11 / Wi-Fi** — беспроводная локальная сеть в безлицензионных диапазонах 2,4 / 5 / 6 ГГц; первый стандарт 1997 года", "Вопрос требует разобрать 5 составных частей: архитектура, физический уровень, MAC, формат кадра, сервисы", "**Архитектура**: любое устройство — **станция** (STA); в **инфраструктурном режиме** общение идёт через **точку доступа** (AP)", "**BSS** = одна AP + её клиенты, идентифицируется MAC-адресом AP (BSSID)", "**ESS** = несколько BSS, объединённых общей проводной сетью (DS); пользователь видит как одну Wi-Fi-сеть с общим именем (**SSID**)", "В ESS возможен **роуминг** между AP при движении клиента; **ad-hoc** режим (IBSS) — без AP, редко используется", "Стек: 802.11 описывает только нижние 2 уровня OSI (PHY + MAC, плюс LLC); над ним обычно IP", "**Физический уровень** эволюционировал: 802.11a/g — OFDM, до 54 Мбит/с; 802.11n (Wi-Fi 4) — добавлен MIMO; 802.11ac (Wi-Fi 5) — MU-MIMO; 802.11ax (Wi-Fi 6) — OFDMA; Wi-Fi 7 — диапазон 6 ГГц, MLO", "Главные идеи PHY: **OFDM** (множество близких поднесущих), **MIMO** (параллельные потоки через несколько антенн), **OFDMA** (деление канала между клиентами)", "**Подуровень MAC** работает на **CSMA/CA**: радио не может слышать собственную передачу → коллизии не обнаруживаются, а избегаются заранее", "Алгоритм: слушать эфир → ждать **DIFS** → случайный **backoff** → передать → получатель шлёт **ACK** через **SIFS**; ACK обязателен", "При отсутствии ACK — удвоить окно ожидания (**бинарный экспоненциальный откат**) и повторить", "**NAV** — виртуальное прослушивание: поле Duration в кадре сообщает, на сколько канал занят; остальные молчат до истечения NAV", "**RTS/CTS** — опциональный обмен для решения проблемы скрытого узла (включается обычно только для длинных кадров)", "**Структура кадра**: главная особенность — **4 поля адресов по 6 байт** (в проводном Ethernet их только 2), потому что кадр может проходить через AP", "Также есть: Frame Control (тип/подтип, флаги ToDS/FromDS), Duration (для NAV), Sequence Control, Payload до 2304 байт, **FCS (CRC-32)**", "Три типа кадров: **Management** (Beacon, Probe, Auth, Assoc), **Control** (RTS, CTS, ACK), **Data** (полезная нагрузка)", "**Beacon** — кадр-«маяк», точка доступа рассылает раз в ~100 мс с информацией о сети", "**Сервисы 802.11**: аутентификация → ассоциация с AP; передача данных (MSDU delivery); конфиденциальность (WEP → WPA → WPA2 → WPA3); distribution + integration с проводной сетью", "Управление энергопотреблением: клиент может «засыпать», AP буферизует кадры до его пробуждения", "**Безопасность**: WEP сломан, WPA устарел, минимум сегодня — WPA2 на основе AES; современный — WPA3 (защита от офлайн-атак)"]}, {"n": 26, "title": "Широкополосные беспроводные сети. Сравнение стандарта 802.16 с 802.11 и 3G. Стандарт 802.16: архитектура и стек протоколов, физический уровень, протокол подуровня MAC, структура кадра.", "paragraphs": ["<h3>Общая идея</h3>", "**Широкополосные беспроводные сети** — это сети, предоставляющие интернет-доступ «по воздуху» на расстояниях, типичных для **городского масштаба** (километры, а не метры как у Wi-Fi). Они задумывались как радио-альтернатива проводным технологиям ADSL и кабельному интернету для домов и офисов, которые сложно или дорого подключить кабелем.", "Главный пример такого стандарта — **IEEE 802.16**, известный под коммерческим именем **WiMAX** (Worldwide Interoperability for Microwave Access). Одна базовая станция WiMAX покрывает зону радиусом примерно **5–30 км** и обслуживает сотни абонентов со скоростями в десятки и сотни Мбит/с.", "Исторически WiMAX конкурировал с **LTE** (стандарт сотовой связи 4G) — и проиграл, потому что операторы сотовой связи поддержали LTE как естественное развитие GSM/UMTS. Сегодня WiMAX используется только в нишевых сценариях. Для экзамена важна не его коммерческая судьба, а **архитектурные идеи**, которые делают его примечательным.", "<h3>Сравнение 802.16 с 802.11 и 3G</h3>", "Этот вопрос специально просит сравнить три технологии — у каждой свой масштаб и стиль работы:", "| Критерий | 802.11 (Wi-Fi) | 802.16 (WiMAX) | 3G (UMTS) |\n|---|---|---|---|\n| Назначение | LAN — этаж, квартира | MAN — район, город | WAN — сотовая связь и данные |\n| Радиус | ~100 м | 5–30 км | километры (сота) |\n| Кто управляет каналом | каждый клиент сам (CSMA/CA, борьба за эфир) | **базовая станция распределяет ресурсы** | базовая станция |\n| Качество обслуживания (QoS) | best effort | встроенные классы (голос/видео/данные) | встроенные классы |\n| Лицензирование частот | свободный диапазон | лицензируемый диапазон | лицензируемый |\n| Архитектура передачи | пакетная (Ethernet over Wi-Fi) | полностью пакетная (IP) | смешанная: каналы + пакеты |\n| Мобильность | роуминг между AP | хэндовер между станциями | развитая, иерархический core |", "Ключевые отличия по сравнению с **Wi-Fi**: WiMAX добивает гораздо дальше, работает на лицензированных частотах (нет помех от соседей), а доступ к каналу управляется централизованно — никаких коллизий и непредсказуемых задержек. С **3G** WiMAX роднит сотовая природа, но WiMAX с самого начала был **полностью пакетным** (всё через IP), тогда как 3G тащил наследство телефонных каналов.", "<h3>Архитектура и стек протоколов</h3>", "Структура сети 802.16 простая и сотовая:", "- **Базовая станция** (BS, Base Station) — мачта оператора. Управляет соседними клиентами, распределяет радиоресурсы, шифрует трафик.\n- **Абонентская станция** (SS, Subscriber Station, или CPE — клиентское оборудование) — стационарная коробка дома у пользователя или мобильное устройство.\n- BS подключается к **сетевому ядру оператора** через обычную проводную сеть; там расположены биллинг, аутентификация и выход в Интернет.", "Топология обычно **точка-многоточка** (Point-to-Multipoint, PMP) — одна базовая станция в центре, клиенты вокруг. В стандарте предусмотрен и **mesh**-режим, где абоненты могут пересылать трафик друг через друга, но на практике почти не используется.", "Стек состоит из двух уровней: **физический** (передача битов по радио) и **MAC**. MAC дополнительно делится на три подуровня: подуровень адаптации (упаковка IP, Ethernet или ATM-трафика), общий MAC-подуровень (управление соединениями и доступом) и подуровень безопасности (шифрование AES). Для экзамена этого разделения достаточно.", "<h3>Физический уровень</h3>", "В качестве модуляции WiMAX использует **OFDM** в фиксированной версии и **OFDMA** в мобильной (как и Wi-Fi 6 — деление одного канала между клиентами по частоте). Базовые принципы те же, что в Q11 и Q25.", "Две особенности, которые стоит упомянуть:", "- **Дуплексирование**: **TDD** (Time Division Duplex) — приём и передача чередуются во времени по одной частоте; либо **FDD** (Frequency Division Duplex) — приём и передача идут одновременно на двух разных частотах. WiMAX поддерживает оба; для асимметричного интернет-трафика (загрузка обычно больше отдачи) удобнее TDD.\n- **Адаптивная модуляция и кодирование** (AMC, Adaptive Modulation and Coding): базовая станция автоматически переключает абонента между модуляциями (BPSK, QPSK, 16-QAM, 64-QAM) в зависимости от качества его радиоканала. Близкому абоненту даётся более плотная модуляция и больше скорости; далёкому — более устойчивая, но медленнее.", "WiMAX был одним из первых широко распространённых стандартов с поддержкой **MIMO** — нескольких антенн с обеих сторон, что увеличивает пропускную способность.", "<h3>Подуровень MAC</h3>", "Это самая концептуально важная часть 802.16, и главное отличие от Wi-Fi. MAC в WiMAX:", "- **Централизованный**: ресурсы (время и поднесущие) распределяет базовая станция. Клиенты не борются за эфир — они получают расписание и передают строго в назначенные моменты. Поэтому **коллизий нет** (за исключением фазы первичного подключения).\n- **Ориентированный на соединение** (connection-oriented): прежде чем что-то передавать, абонент устанавливает с базовой станцией одно или несколько **логических соединений**, каждое со своим коротким идентификатором (Connection ID). У одного клиента могут быть отдельные соединения для VoIP, видеостриминга, скачивания файлов — каждое со своим качеством обслуживания.\n- **Встроенные классы QoS**. На каждое соединение назначается класс. Для экзамена достаточно помнить три основных:\n  - **UGS** — постоянная гарантированная скорость с фиксированным расписанием; для голоса (VoIP).\n  - **rtPS / ertPS** — переменная скорость с гарантированными задержками; для видеостриминга и VoIP с подавлением пауз.\n  - **nrtPS** — гарантированная **минимальная** скорость без жёстких задержек; для FTP.\n  - **BE** (Best Effort) — без гарантий; для веб-трафика.", "Перед тем как клиент впервые получит доступ к каналу, он проходит процедуру **начальной синхронизации** (initial ranging) — базовая станция точно подстраивает у него время передачи и мощность сигнала, чтобы он попадал в свой слот.", "Трафик в эфире **шифруется AES**; ключи распределяются по специальному протоколу управления ключами.", "<h3>Структура кадра</h3>", "В режиме TDD на одной частоте чередуются «вниз к клиентам» и «вверх от клиентов». Базовая станция формирует **кадр** длительностью обычно 5 мс, состоящий из следующих частей:", "| Часть кадра | Назначение |\n|---|---|\n| **Преамбула** | синхронизация — клиенты «ловят» начало кадра |\n| **FCH** (Frame Control Header) | служебная информация — где в кадре лежат карты ресурсов |\n| **DL-MAP** | «карта» нисходящей части — какому клиенту в какой части кадра базовая станция будет передавать |\n| **UL-MAP** | «карта» восходящей части — кому когда разрешено передавать BS-у |\n| **DL-burst** | сами данные от BS к клиентам |\n| **Защитный интервал** (TTG) | пауза для переключения с приёма на передачу |\n| **UL-burst** | данные от клиентов к BS, каждый — в своём назначенном «прямоугольнике» (время × поднесущие) |\n| **Защитный интервал** (RTG) | пауза перед следующим кадром |", "Ключевая идея кадра: **базовая станция в начале каждого 5-миллисекундного интервала объявляет, кому когда передавать**. Это и есть то самое централизованное распределение ресурсов, отличающее WiMAX от Wi-Fi.", "Внутри **DL-burst** и **UL-burst** трафик упакован в **MAC-PDU** — единицы данных подуровня MAC. Каждая PDU состоит из 6-байтового заголовка (тип, длина, идентификатор соединения CID, флаги шифрования), полезной нагрузки и опциональной контрольной суммы. Стандарт позволяет упаковывать несколько маленьких пакетов в один PDU (packing) и наоборот — разбивать большой пакет на фрагменты (fragmentation)."], "terms": [{"ru": "Широкополосный беспроводной доступ", "en": "BWA, Broadband Wireless Access", "df": "беспроводная альтернатива проводным технологиям интернет-доступа на расстояниях масштаба района или города"}, {"ru": "IEEE 802.16 / WiMAX", "en": "Worldwide Interoperability for Microwave Access", "df": "основной стандарт BWA; радиус соты 5–30 км"}, {"ru": "Базовая станция", "en": "BS, Base Station", "df": "мачта оператора, управляет соседними клиентами и распределяет радиоресурсы"}, {"ru": "Абонентская станция", "en": "SS, Subscriber Station, CPE", "df": "клиентское оборудование у пользователя"}, {"ru": "Точка-многоточка", "en": "PMP, Point-to-Multipoint", "df": "типовая топология WiMAX: одна BS в центре, клиенты вокруг"}, {"ru": "AMC", "en": "Adaptive Modulation and Coding", "df": "автоматический выбор модуляции для каждого клиента в зависимости от качества канала"}, {"ru": "CID", "en": "Connection ID", "df": "идентификатор соединения между клиентом и базовой станцией"}], "summary": ["**Широкополосные беспроводные сети** дают интернет «по воздуху» на километровых расстояниях — альтернатива проводным ADSL/кабельным сетям", "Главный пример — **IEEE 802.16 / WiMAX**: одна базовая станция покрывает зону **5–30 км**, обслуживает сотни абонентов", "Исторически конкурировал с **LTE** и проиграл; для экзамена важна не судьба, а архитектурные идеи", "**Сравнение с Wi-Fi**: WiMAX добивает гораздо дальше, работает на лицензируемых частотах, доступ к каналу управляется централизованно (нет коллизий)", "**Сравнение с 3G**: WiMAX с самого начала **полностью пакетный** (всё через IP); 3G тащил наследство телефонных каналов", "**Архитектура** простая и сотовая: **базовая станция (BS)** — мачта оператора; **абонентская станция (SS / CPE)** — оборудование у клиента", "Топология обычно **точка-многоточка** (PMP) — одна BS в центре, клиенты вокруг; есть и mesh-режим, но он редко используется", "Стек: физический уровень + MAC (с подуровнями адаптации, общего MAC и безопасности)", "**Физический уровень**: OFDM в фиксированной версии, **OFDMA** в мобильной (как Wi-Fi 6)", "**Дуплексирование TDD** (приём и передача чередуются во времени) или **FDD** (на двух разных частотах); TDD удобнее при асимметричном трафике", "**Адаптивная модуляция (AMC)**: BS выбирает модуляцию (BPSK → QPSK → 16-QAM → 64-QAM) для каждого клиента в зависимости от качества его канала; одним из первых стандартов с **MIMO**", "**Подуровень MAC** — главное отличие от Wi-Fi: **централизованный и connection-oriented**", "Базовая станция сама распределяет ресурсы между клиентами по расписанию → **коллизий нет**", "Прежде чем передавать, клиент устанавливает **логические соединения** с идентификаторами CID — отдельное для голоса, видео, файлов", "**Классы QoS** на каждое соединение: **UGS** (фикс. скорость, VoIP), **rtPS/ertPS** (видео), **nrtPS** (FTP), **BE** (веб)", "Перед первым доступом клиент проходит **начальную синхронизацию** (initial ranging) — точная настройка времени и мощности", "Шифрование **AES** обязательно", "**Структура кадра** (TDD, обычно 5 мс): преамбула → служебный заголовок FCH → **DL-MAP** и **UL-MAP** (карты «кому когда передавать») → DL-burst (от BS) → защитный интервал → UL-burst (от клиентов) → защитный интервал", "Ключевая идея кадра: BS в начале каждых 5 мс **объявляет расписание** — кому когда передавать"]}, {"n": 27, "title": "Архитектура Bluetooth: набор протоколов, уровень радиосвязи, уровень немодулированной передачи, структура кадра.", "paragraphs": ["<h3>Общая идея</h3>", "**Bluetooth** — стандарт беспроводной связи на коротких расстояниях (типично 1–10 метров) между **персональными устройствами**: смартфон и наушники, ноутбук и мышь, фитнес-браслет и часы. В терминологии стандартов это называется **WPAN** (Wireless Personal Area Network) — беспроводная персональная сеть. Стандарт изначально был выпущен компанией Ericsson в 1998 году как замена кабелям, и впоследствии оформлен в виде **IEEE 802.15.1**; современным развитием занимается ассоциация **Bluetooth SIG**.", "Все варианты Bluetooth работают в свободном диапазоне **2,4 ГГц** (так называемая ISM-полоса 2,400–2,485 ГГц — там же, где Wi-Fi и микроволновые печи). Сегодня существуют две ветки:", "- **Классический Bluetooth (BR/EDR)** — для аудио, гарнитур, передачи файлов; та технология, которой посвящён данный вопрос.\n- **Bluetooth Low Energy (BLE)** — современная маломощная ветка для IoT, носимой электроники, медицинских датчиков.", "<h3>Архитектура и топология</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/d/d9/Bluetooth_piconet_diagram.svg\" alt=\"Топология пикосети Bluetooth: один master и несколько slave-устройств\" loading=\"lazy\"><figcaption>Базовая топология Bluetooth — пикосеть: один master в центре управляет работой нескольких slave-устройств. <em>Источник: Wikimedia Commons, GFDL.</em></figcaption></figure>", "Базовая единица сети Bluetooth называется **пикосеть** (piconet). Это маленькая «звезда»:", "- **Один master** — устройство, которое управляет всей пикосетью. Оно задаёт расписание и тактовый сигнал, по которому работают все остальные.\n- **До семи активных slave** (ведомых) — устройства, общающиеся через master. Например, телефон-master может одновременно держать наушники, фитнес-браслет и беспроводную клавиатуру как slave.\n- Дополнительно ещё до 255 устройств могут быть в режиме «припаркованных» — они синхронизированы с master по времени, но не передают данных и почти не потребляют энергии.", "Если устройство одновременно состоит в двух пикосетях (в одной как master, в другой как slave), образуется **scatternet** — несколько связанных пикосетей. На практике scatternet встречается редко.", "В BLE те же роли называются **Central** (соответствует master) и **Peripheral** (соответствует slave); типичный сценарий — одна Central держит одну Peripheral.", "<h3>Набор протоколов (стек Bluetooth)</h3>", "Стек Bluetooth — типичный многоуровневый. Удобно читать его **снизу вверх**:", "| Уровень | Что делает |\n|---|---|\n| **Radio** | Передаёт и принимает радиосигнал на 2,4 ГГц (физический уровень) |\n| **Baseband** | Формирует кадры, управляет временными слотами и сменой частоты («скачками»); делает повторную передачу повреждённых пакетов |\n| **LMP** (Link Manager Protocol) | Настройка соединения: аутентификация, шифрование, согласование мощности и спящего режима |\n| **HCI** (Host Controller Interface) | Стандартный «разъём» между Bluetooth-чипом и операционной системой; **граница** «чип ↔ ОС» |\n| **L2CAP** (Logical Link Control and Adaptation Protocol) | Мультиплексирует разные приложения через одно соединение; режет большие сообщения на пакеты и собирает обратно |\n| **Профили приложений** | A2DP (стереозвук), HFP (гарнитуры), HID (мышь, клавиатура), OPP (файлы); это то, что вы «сопрягаете», когда соединяете наушники с телефоном |", "Ключевая идея — **граница HCI**: всё, что **ниже HCI**, реализовано в самом Bluetooth-чипе (Radio, Baseband, LMP); всё, что **выше HCI** (L2CAP, профили), — в операционной системе устройства. Это разделение позволяет одному и тому же Bluetooth-чипу работать в разных операционных системах.", "<h3>Уровень радиосвязи</h3>", "Bluetooth работает в диапазоне **2,4 ГГц**, который доступен без лицензии. Главная техническая идея уровня радиосвязи — **скачкообразная перестройка частоты** (FHSS, Frequency Hopping Spread Spectrum):", "- Полоса разделена на **79 каналов** шириной по 1 МГц.\n- Устройства Bluetooth **меняют рабочую частоту 1600 раз в секунду** по псевдослучайному расписанию, которое заранее знают и master, и все его slave.\n- Если на каком-то канале есть помехи (например, рядом работает Wi-Fi-роутер) — этот «скачок» теряется, но следующий уже будет на другой частоте и пройдёт нормально. Это делает Bluetooth устойчивым к помехам и одновременно безопасным от прослушивания: подслушать связь без знания расписания скачков очень сложно.", "Модуляция в классическом Bluetooth — **GFSK** (Gaussian Frequency Shift Keying), даёт скорость 1 Мбит/с. В расширенном режиме EDR применяются более сложные модуляции (DQPSK, 8-DPSK), что позволяет поднять скорость до 2 и 3 Мбит/с. Для экзамена достаточно знать: **GFSK — базовая модуляция Bluetooth**.", "По мощности устройства Bluetooth делятся на классы:", "- **Class 1** — до 100 мВт, дальность ~100 м (промышленные применения).\n- **Class 2** — около 2,5 мВт, дальность ~10 м (большинство смартфонов и гарнитур).\n- **Class 3** — около 1 мВт, дальность ~1 м (миниатюрные устройства).", "<h3>Уровень немодулированной передачи (Baseband)</h3>", "Baseband (буквально — «уровень низкочастотной передачи») управляет тем, **кто и когда** передаёт. Главные идеи:", "- Время разделено на **слоты по 625 микросекунд** (одна тысячная секунды).\n- В **чётных** слотах передаёт master, в **нечётных** — отвечает slave. Это разновидность TDD (Time Division Duplex): обмен по очереди в одной частотной полосе.\n- В каждом слоте используется одна частота из FHSS-расписания; в следующем слоте — следующая частота.\n- Пакет может занимать 1, 3 или 5 слотов (если данных много, передача не прерывается на смену частоты).", "Различают два типа логических соединений:", "- **SCO** (Synchronous Connection-Oriented) — синхронное соединение с фиксированными слотами; используется для **голоса** (стандартный канал 64 кбит/с). Если кадр потерялся — никаких повторов, потеря просто пропускается (в речи это даёт лёгкий щелчок, но не задержку).\n- **ACL** (Asynchronous Connectionless) — асинхронная передача **данных** с подтверждениями и повторами; master опрашивает slave-ы по очереди, в чётных слотах посылая запрос, и slave отвечает в следующем нечётном.", "<h3>Структура кадра</h3>", "Кадр Bluetooth (классический BR) имеет очень простую и узнаваемую структуру:", "| Поле | Длина | Назначение |\n|---|---|---|\n| **Access Code** | 72 бита | идентификатор пикосети, вычисляется из адреса master; «фильтр», по которому slave понимает, что кадр предназначен его сети |\n| **Header** | 54 бита (с защитой) | управляющая информация: номер slave (3 бита), тип пакета (4 бита), флаги подтверждения и нумерации, контрольная сумма заголовка |\n| **Payload** | 0–2745 бит | сама полезная нагрузка (опционально со своей CRC-16 и кодом коррекции ошибок) |", "Особенность кадра — **очень сильная защита заголовка**: 18 информационных битов заголовка передаются 54 битами (каждый бит повторяется трижды). Так сделано потому, что если получатель неправильно прочитал заголовок, он не сможет интерпретировать остальную часть кадра. Тройное повторение позволяет принять заголовок даже при плохом радиосигнале.", "Полезная нагрузка может быть до 2745 бит (≈340 байт) — это намного меньше Wi-Fi-кадра, но Bluetooth и не предназначен для больших передач. Зато минимальные кадры (например, для пультов и наушников) занимают всего один слот."], "terms": [{"ru": "Bluetooth", "en": "IEEE 802.15.1", "df": "стандарт беспроводной связи на коротких расстояниях между персональными устройствами"}, {"ru": "WPAN", "en": "Wireless Personal Area Network", "df": "беспроводная персональная сеть; класс сетей, в который входит Bluetooth"}, {"ru": "ISM-диапазон", "en": "Industrial, Scientific, Medical", "df": "свободный (нелицензируемый) радиодиапазон; Bluetooth работает в полосе 2,4 ГГц"}, {"ru": "BR / EDR", "en": "Basic Rate / Enhanced Data Rate", "df": "классический Bluetooth (1, 2 и 3 Мбит/с)"}, {"ru": "BLE", "en": "Bluetooth Low Energy", "df": "современная маломощная ветка для IoT"}, {"ru": "Пикосеть", "en": "piconet", "df": "базовая топология Bluetooth: один master + до 7 активных slave"}, {"ru": "Slave", "en": "ведомое", "df": "устройство, общающееся через master; в BLE — Peripheral"}, {"ru": "Scatternet", "en": "рассеянная сеть", "df": "объединение нескольких пикосетей через общее устройство"}, {"ru": "FHSS", "en": "Frequency Hopping Spread Spectrum", "df": "скачкообразная перестройка частоты; в Bluetooth 1600 раз в секунду по 79 каналам"}, {"ru": "GFSK", "en": "Gaussian Frequency Shift Keying", "df": "основная модуляция Bluetooth (1 Мбит/с)"}, {"ru": "TDD", "en": "Time Division Duplex", "df": "режим связи, при котором передача и приём чередуются по времени; в Bluetooth — слоты по 625 мкс"}, {"ru": "SCO", "en": "Synchronous Connection-Oriented", "df": "синхронное соединение для голоса с фиксированными слотами и без повторов"}, {"ru": "ACL", "en": "Asynchronous Connectionless", "df": "асинхронная передача данных с подтверждениями и повторами"}, {"ru": "LMP", "en": "Link Manager Protocol", "df": "управление соединением: аутентификация, шифрование, мощность, сон"}, {"ru": "HCI", "en": "Host Controller Interface", "df": "стандартная граница между Bluetooth-чипом и операционной системой"}, {"ru": "L2CAP", "en": "Logical Link Control and Adaptation Protocol", "df": "мультиплексирование и сборка пакетов для приложений"}, {"ru": "Профили", "en": "Bluetooth profiles", "df": "конкретные сценарии: A2DP (аудио), HFP (гарнитуры), HID (мышь/клавиатура), OPP (файлы)"}], "summary": ["**Bluetooth** (IEEE 802.15.1) — беспроводная связь на коротких расстояниях (1–10 м) между персональными устройствами", "Класс сетей — **WPAN** (беспроводные персональные сети); диапазон **2,4 ГГц ISM** (свободный, без лицензии)", "Изначально (Ericsson, 1998) — как замена кабелям; сейчас две ветки: **классический BR/EDR** (наушники, гарнитуры, файлы) и **BLE** (IoT, носимая электроника)", "**Архитектура — пикосеть** (piconet): один **master** в центре + до **7 активных slave**; ещё до 255 — «припаркованных» (синхронизированы, но не передают)", "Master задаёт расписание и тактовый сигнал; в BLE те же роли называются **Central** и **Peripheral**", "**Scatternet** — несколько пикосетей, связанных общим устройством; на практике редкость", "**Стек снизу вверх**: Radio → Baseband → LMP (управление соединением) → HCI (граница чип ↔ ОС) → L2CAP → профили приложений (A2DP-аудио, HFP-гарнитуры, HID-мышь/клавиатура, OPP-файлы)", "**Уровень радиосвязи**: главная идея — **FHSS** (Frequency Hopping Spread Spectrum)", "79 каналов по 1 МГц; рабочая частота меняется **1600 раз в секунду** по псевдослучайному расписанию", "Это даёт устойчивость к помехам (Wi-Fi, микроволновки) и затрудняет прослушивание", "Модуляция: **GFSK** (1 Мбит/с базовая); в EDR — DQPSK и 8-DPSK для скорости 2 и 3 Мбит/с", "Классы мощности: Class 1 (100 мВт, ~100 м), **Class 2** (2,5 мВт, ~10 м — массовый), Class 3 (1 мВт, ~1 м)", "**Baseband** управляет расписанием передачи: время делится на **слоты по 625 мкс**", "В **чётных слотах** передаёт master, в **нечётных** — slave (TDD); в каждом слоте — своя частота из FHSS", "Пакет может занимать 1, 3 или 5 слотов подряд", "**Два типа соединений**: **SCO** — голос (64 кбит/с, фиксированные слоты, без повторов) и **ACL** — данные (с подтверждениями и повторами)", "**Структура кадра**: **Access Code** (72 бит, идентификатор пикосети) + **Header** (54 бит, с тройной защитой) + **Payload** (0–2745 бит)", "Заголовок содержит: номер slave (3 бит), тип пакета (4 бит), флаги подтверждения/нумерации, контрольная сумма", "**Тройное повторение заголовка** — каждые 18 бит превращаются в 54 — нужно для надёжного приёма при плохом сигнале"]}, {"n": 28, "title": "RFID. Архитектура и физический уровень EPC Gen 2. Уровень идентификации метки EPC Gen 2. Форматы сообщения идентификации метки.", "paragraphs": ["<h3>Общая идея</h3>", "**RFID** (Radio Frequency Identification, радиочастотная идентификация) — технология, позволяющая считывать электронный идентификатор объекта на расстоянии, без проводов и без зрительного контакта. С её помощью работают карты-пропуска, бесконтактные ключи от автомобиля, противоугонные ярлыки в магазинах, метки в библиотечных книгах и складских коробках, чипы домашних животных, NFC-платежи через смартфон.", "Любая RFID-система устроена очень просто и состоит из двух частей:", "- **Считыватель** (reader) — устройство с антенной, которое излучает радиосигнал и слушает ответ.\n- **Метка** (tag) — маленький чип с антенной, несущий уникальный идентификатор. Метку прикрепляют к предмету.", "Метки бывают трёх типов в зависимости от наличия батареи:", "- **Пассивные** — нет своего источника питания. Метка получает энергию **из самого радиосигнала считывателя**. Дальность — до 10 метров, стоимость от нескольких центов. Это самый массовый тип: на товарах в магазинах, билетах, складских коробках.\n- **Активные** — со встроенной батареей и собственным передатчиком; дальность до сотен метров. Используются для отслеживания крупных грузов, контейнеров, оплаты проезда на платных дорогах.\n- **Полупассивные** — компромисс: батарея питает только чип, а ответ всё равно идёт пассивным способом. Дальность больше, чем у обычных пассивных.", "Также метки различают по рабочему диапазону частот: **LF** (низкие частоты, чипы животных и иммобилайзеры), **HF** (13,56 МГц — карты-пропуска и **NFC** в смартфонах), **UHF** (860–960 МГц — основная область торговли и логистики), **SHF** (2,4 ГГц — оплата на платных дорогах).", "Самый распространённый стандарт для UHF-логистики называется **EPC Gen 2** (Electronic Product Code Generation 2). Именно его архитектура и протоколы — предмет этого вопроса.", "<h3>Архитектура и физический уровень EPC Gen 2</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/6/66/RFID_tag_in_textile_label_disassembled.jpg\" alt=\"Разобранная пассивная UHF RFID-метка из текстильной этикетки: видны микрочип и антенна из алюминиевой фольги\" loading=\"lazy\"><figcaption>Пассивная UHF RFID-метка, извлечённая из текстильной этикетки футболки. Виден крошечный микрочип и антенна из алюминиевой фольги. Метка не имеет батареи. <em>Источник: Wikimedia Commons, CC BY-SA 4.0.</em></figcaption></figure>", "В EPC Gen 2 пассивная метка состоит из крошечной микросхемы и плоской антенны — её можно встроить в этикетку, наклейку или ярлык. Считыватель — это устройство с антенной (часто крупной), подключаемое к компьютеру, кассе или мобильному терминалу.", "Главная идея физического уровня — **прямой и обратный канал работают совершенно по-разному**:", "- **Прямой канал (от считывателя к метке)** — обычная радиопередача. Считыватель посылает несущий сигнал, на котором закодированы команды. Важная деталь: эта несущая **всегда присутствует**, потому что она же используется как **источник питания для метки** — метка «качает» энергию из радиоволны.\n- **Обратный канал (от метки к считывателю)** — намного хитрее. У метки нет передатчика как такового. Вместо того чтобы излучать собственный сигнал, она **изменяет свойства своей антенны**: то «отражает» радиоволну считывателя обратно, то «гасит» её. Считыватель видит, как меняется отражённый сигнал, и расшифровывает биты. Этот трюк называется **обратное рассеяние** (backscatter) и позволяет метке передавать данные, тратя ничтожное количество энергии.", "Скорости в EPC Gen 2 — десятки–сотни килобит в секунду; полезная нагрузка маленькая (несколько десятков байт), но скорость не главное — главное, что считыватель может опросить **сотни меток в секунду**.", "<h3>Уровень идентификации меток</h3>", "Главная проблема, которую решает этот уровень, — когда в поле считывателя сразу **много меток**. Например, ящик товара проезжает через ворота магазина, и нужно опросить 200 меток за секунду. Если все они ответят одновременно — будет каша, считыватель ничего не разберёт.", "EPC Gen 2 решает это с помощью **Q-протокола** — упрощённой схемы случайного доступа (см. слотированную ALOHA в Q22). Идея в шагах:", "1. Считыватель шлёт команду **«Query(Q)»** — «приготовиться, в этом раунде будет 2<sup>Q</sup> слотов».\n2. Каждая метка случайным образом выбирает себе номер слота от 0 до 2<sup>Q</sup>−1 и ждёт, когда её слот наступит.\n3. В своём слоте метка отвечает считывателю коротким случайным числом (это нужно, чтобы можно было её различать).\n4. Считыватель подтверждает приём, и тогда метка передаёт свой **EPC-идентификатор** + контрольную сумму.\n5. Если в одном слоте ответили сразу несколько меток (коллизия) — считыватель просто пропускает этот слот и идёт дальше. На следующем раунде он может **увеличить Q**, чтобы дать больше слотов, или уменьшить, если слоты остались пустыми.", "Так за несколько раундов считыватель получает идентификаторы всех меток, которые ему «видны». Дополнительно стандарт поддерживает команды **Read/Write** (для чтения и записи маленькой памяти метки) и **Kill** (для «убийства» метки на кассе — чтобы её нельзя было потом отследить за пределами магазина).", "<h3>Формат сообщения идентификации</h3>", "Основная единица идентификации — **EPC** (Electronic Product Code), обычно длиной **96 бит** (12 байт). Он структурирован по-разному в зависимости от того, что именно идентифицирует. Самая частая схема называется **SGTIN-96** (Serialized Global Trade Item Number) и состоит из трёх частей:", "| Часть EPC | Что значит |\n|---|---|\n| **Префикс компании** | идентификатор производителя (выдаётся ассоциацией GS1) |\n| **Код товара** | артикул конкретного изделия в линейке |\n| **Серийный номер** | уникальный номер этого конкретного экземпляра |", "Удобно думать так: обычный штрихкод EAN говорит «это пакет молока такого-то производителя». EPC говорит **«это вот именно этот конкретный пакет, со своим серийным номером»** — значит, его можно отслеживать индивидуально на всём пути от завода до полки и кассы.", "Помимо SGTIN существуют схемы для других объектов: SSCC (упаковки и паллеты), SGLN (места — конкретный склад или магазин), GRAI (возвратная тара). На экзамене достаточно знать о существовании этих схем и понимать структуру SGTIN.", "При фактическом обмене с меткой считыватель получает не один EPC, а небольшое сообщение, содержащее: служебное поле **PC** (Protocol Control, 16 бит — указывает длину EPC и другие параметры) + **сам EPC** + контрольную сумму **CRC-16**.", "<h3>Где это используется</h3>", "EPC Gen 2 поддерживается мировой ассоциацией **GS1**. Технология стала основой:", "- инвентаризации в крупной рознице (например, в Walmart, Zara — там товары на каждой вешалке отмечены RFID-метками);\n- управления цепочками поставок и автоматизированных складов;\n- маркировки лекарств и алкоголя, чтобы можно было проследить путь товара;\n- электронных билетов и пропусков на транспорт."], "terms": [{"ru": "RFID", "en": "Radio Frequency Identification, радиочастотная идентификация", "df": "технология бесконтактного считывания идентификатора объекта по радио"}, {"ru": "Метка", "en": "tag, transponder", "df": "чип с антенной, прикрепляемый к объекту и несущий идентификатор"}, {"ru": "Считыватель", "en": "reader, interrogator", "df": "устройство, опрашивающее метки"}, {"ru": "NFC", "en": "Near Field Communication", "df": "расширение HF RFID на 13,56 МГц для смартфонов и платёжных карт"}, {"ru": "EPC Gen 2", "en": "Electronic Product Code Generation 2", "df": "основной стандарт UHF RFID для логистики и торговли"}, {"ru": "EPC", "en": "Electronic Product Code", "df": "электронный код продукта; обычно 96 бит, уникально идентифицирует **конкретный экземпляр** товара"}, {"ru": "Обратное рассеяние", "en": "backscatter", "df": "способ передачи от метки к считывателю: метка не излучает сигнал сама, а изменяет отражение сигнала считывателя"}, {"ru": "SGTIN-96", "en": "Serialized Global Trade Item Number", "df": "основной формат EPC: префикс производителя + код товара + серийный номер"}, {"ru": "PC", "en": "Protocol Control", "df": "служебное поле в ответе метки (длина EPC и параметры)"}], "summary": ["**RFID** (Radio Frequency Identification) — бесконтактное считывание идентификатора объекта по радио", "Любая RFID-система состоит из двух частей: **считыватель** (с антенной) и **метка** (чип + антенна, прикрепляется к предмету)", "Три типа меток по наличию батареи: **пассивные** (без батареи, питание из сигнала считывателя, до 10 м, дёшево), **активные** (со своей батареей и передатчиком, сотни метров), **полупассивные**", "Частоты: LF (иммобилайзеры, чипы животных); **HF 13,56 МГц** (карты-пропуска, **NFC** в смартфонах); **UHF 860–960 МГц** (торговля и логистика); SHF 2,4 ГГц (платные дороги)", "Основной стандарт UHF — **EPC Gen 2** (Electronic Product Code Generation 2); поддерживается мировой ассоциацией **GS1**", "**Архитектура простая**: считыватель опрашивает поле, метки отвечают", "**Физический уровень — главная особенность: прямой и обратный канал работают по-разному**", "**Прямой канал (от считывателя)** — обычная радиопередача; несущая всегда работает, потому что **она же питает пассивную метку**", "**Обратный канал (от метки)** — метка не излучает сигнал сама, а **меняет отражение** сигнала считывателя (то отражает, то поглощает); это называется **обратное рассеяние** (backscatter)", "Это позволяет метке передавать данные, тратя ничтожно мало энергии", "**Уровень идентификации** — задача: опросить много меток одновременно без столкновений", "EPC Gen 2 использует **Q-протокол** на основе слотированной ALOHA", "Считыватель командой **Query(Q)** объявляет раунд из **2<sup>Q</sup> слотов**; каждая метка выбирает случайный слот", "В своём слоте метка шлёт случайный идентификатор; считыватель подтверждает, и метка передаёт сам **EPC + контрольную сумму**", "При коллизиях Q увеличивают, при пустых слотах — уменьшают", "Команды чтения/записи памяти метки и **Kill** (отключение метки на кассе)", "**Формат сообщения**: 96-битный **EPC** = префикс производителя + код товара + **серийный номер**", "Главная схема — **SGTIN-96** (Serialized Global Trade Item Number): идентифицирует не модель, а **конкретный экземпляр** товара (можно отследить именно этот предмет)", "В обмене с меткой: служебное поле **PC** + EPC + **CRC-16**", "Применения: магазинная инвентаризация, склады, маркировка лекарств, билеты, NFC-платежи"]}, {"n": 29, "title": "Коммутация на канальном уровне. Применение мостов. Повторители, концентраторы, мосты, коммутаторы, маршрутизаторы, шлюзы и виртуальные локальные сети.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Коммутация на канальном уровне** (Layer-2 switching, bridging) — пересылка кадров Ethernet/802.11 между сегментами одной локальной сети на основе **MAC-адресов**, без анализа верхних протоколов. В отличие от маршрутизации (L3, по IP), L2-коммутатор работает прозрачно для пользователей: устройства одного broadcast-домена не знают о его существовании, видят друг друга по тем же MAC-адресам и взаимно достижимы по ARP. Эта функция исторически развилась из устройств-**мостов** (bridges) 1980-х в современные **коммутаторы** (switches) — основу любой проводной LAN.", "<h3>Мосты, обратное обучение и STP</h3>", "**Мост** (bridge, IEEE 802.1D) принимает кадр на одном порту, проверяет его CRC, ищет MAC-адрес назначения в **таблице мостов** (CAM-table, MAC address table) и пересылает кадр в соответствующий порт. Если адрес неизвестен — кадр копируется на все порты, кроме входного (**flooding**). Если адрес broadcast/multicast — тоже flooding.", "**Алгоритм обратного обучения** (backward learning):\n- Кадр пришёл на порт k с MAC-адресом отправителя X → мост записывает «X ↔ порт k» в таблицу с таймером старения (обычно 300 с).\n- При устаревании запись удаляется.\n- Таблица строится автоматически и не требует ручной конфигурации.", "**Петли и STP**. Если у двух мостов есть два альтернативных пути, кадры начнут циркулировать вечно, ARP-«широковещание» рассылается лавинообразно, сеть «ложится». Решение — **Spanning Tree Protocol** (STP, IEEE 802.1D, Radia Perlman 1985):\n- Мосты обмениваются **BPDU** (Bridge Protocol Data Unit).\n- Выбирается **Root Bridge** — мост с наименьшим Bridge ID.\n- Каждый мост вычисляет кратчайший путь к Root и ставит соответствующий **Root Port**; на каждом сегменте выбирается **Designated Port**.\n- Остальные порты переводятся в **Blocking** — они блокируют пересылку, но слушают BPDU. Сеть превращается в покрывающее дерево.\n- Сходимость классического STP — 30–50 с; улучшенные **RSTP** (802.1w) сходятся за <1 с, **MSTP** (802.1s) поддерживает отдельное дерево для каждой группы VLAN.", "<h3>Сетевые устройства по уровням OSI</h3>", "| Устройство | OSI | Решение принимается по | Разделяет домены |\n|---|---|---|---|\n| Повторитель (repeater) | L1 | — (просто усиливает сигнал) | нет |\n| Концентратор (hub) | L1 | — (многопортовый повторитель) | один collision и broadcast домен |\n| Мост (bridge) / Коммутатор (switch) | L2 | MAC-адресу | разделяет collision; общий broadcast |\n| Маршрутизатор (router) | L3 | IP-адресу | разделяет broadcast |\n| L3-коммутатор | L3 | IP-адресу (аппаратно) | то же |\n| Шлюз (gateway) | L4–L7 | приложение/протокол | преобразует протоколы |", "- **Повторитель** (regenerator) — восстанавливает форму и амплитуду сигнала; продлевает дистанцию проводной линии (например, для длинного коаксиала). В современных сетях встроен в каждый коммутатор/трансивер.\n- **Концентратор** (hub) — устаревшее, многопортовый повторитель; все порты в одном collision-домене, обязательная полудуплексная работа с CSMA/CD.\n- **Коммутатор** (switch) — современный мост на десятки/сотни портов с аппаратной коммутацией (ASIC); каждый порт = отдельный collision-домен и full-duplex.\n- **Маршрутизатор** разделяет broadcast-домены: ARP, DHCP, NetBIOS не проходят между сетями без специальных relay-функций.\n- **Шлюз** (gateway) — общий термин для устройств, преобразующих протоколы или адреса (SIP-шлюз, NAT-шлюз, email-шлюз X.400↔SMTP).", "<h3>VLAN — виртуальные ЛВС</h3>", "**VLAN** (Virtual LAN, IEEE 802.1Q) — механизм логического разделения одного физического коммутатора (или серии связанных) на несколько изолированных сетей, каждая со своим **broadcast-доменом**. Устройства в разных VLAN не видят широковещательного трафика друг друга, и их соединение возможно только через маршрутизатор (или L3-коммутатор).", "**Тег 802.1Q** (4 байта, вставляется между Source MAC и EtherType):", "| Поле | Длина | Назначение |\n|---|---|---|\n| TPID (Tag Protocol Identifier) | 16 бит | всегда 0x8100, признак тегированного кадра |\n| PCP (Priority Code Point) | 3 бит | 8 уровней приоритета (CoS, 802.1p) |\n| DEI (Drop Eligible Indicator) | 1 бит | можно ли отбросить при перегрузке |\n| VID (VLAN ID) | 12 бит | номер VLAN, 0–4095 (0 и 4095 зарезервированы, 4094 используемых) |", "Типы портов:\n- **Access** — порт принадлежит одной VLAN; принимает и отдаёт нетегированные кадры, тег ставится/снимается коммутатором.\n- **Trunk** — порт между коммутаторами, переносит кадры нескольких VLAN, сохраняя теги.\n- **Native VLAN** — особая VLAN, кадры которой передаются по транку без тега.", "Дополнительные технологии:\n- **Q-in-Q (802.1ad)** — двойное тегирование для операторских сетей (VLAN провайдера поверх клиентского).\n- **VXLAN** (RFC 7348) — преодолевает ограничение 4094 VLAN через 24-битный VNI и инкапсуляцию L2-в-UDP; основа дата-центровых сетей и облаков.\n- **GVRP / MVRP** — протоколы динамического обмена информацией о VLAN.", "<h3>Алгоритм работы коммутатора (cut-through vs store-and-forward)</h3>", "- **Store-and-forward** — принять кадр целиком, проверить CRC, переслать. Гарантирует целостность, добавляет задержку.\n- **Cut-through** — начать пересылку сразу после прочтения адреса назначения; быстрее, но повреждённые кадры тоже пересылаются. Используется в дата-центрах с надёжной средой.\n- **Fragment-free** — гибрид: ждать первых 64 байт (чтобы исключить runt-кадры от коллизий), потом пересылать."], "terms": [{"ru": "Мост", "en": "bridge", "df": "устройство L2, соединяющее сегменты ЛВС по MAC-адресам"}, {"ru": "Коммутатор", "en": "switch", "df": "многопортовый мост (L2) с аппаратной обработкой"}, {"ru": "STP / RSTP / MSTP", "en": "Spanning Tree Protocol, IEEE 802.1D/w/s", "df": "протоколы остовного дерева"}, {"ru": "BPDU", "en": "Bridge Protocol Data Unit", "df": "служебный кадр STP"}, {"ru": "Повторитель", "en": "repeater", "df": "устройство L1 для регенерации сигнала"}, {"ru": "Концентратор", "en": "hub", "df": "многопортовый повторитель (L1)"}, {"ru": "Маршрутизатор", "en": "router", "df": "устройство L3, передаёт пакеты по IP-адресам"}, {"ru": "Шлюз", "en": "gateway", "df": "устройство L4–L7 для преобразования протоколов"}, {"ru": "VLAN", "en": "Virtual LAN, IEEE 802.1Q", "df": "виртуальная локальная сеть"}], "summary": ["**L2-коммутация (bridging)** — пересылка кадров Ethernet/802.11 между сегментами **по MAC-адресам**; прозрачно для устройств", "**Мост** (bridge, IEEE 802.1D): принимает кадр → проверяет CRC → ищет MAC в **CAM-таблице** → пересылает", "Неизвестный/broadcast/multicast → **flooding** (на все порты кроме входного)", "**Backward learning**: «MAC X → порт k» с **age timer ~300 с**; таблица автоматическая", "**Петли в избыточной топологии** → broadcast-шторм, сеть «ложится»", "**STP** (802.1D, **Perlman 1985**): мосты обмениваются **BPDU**, выбирают **Root Bridge** (минимальный Bridge ID)", "Порты: **Root Port** (к Root), **Designated Port** (на сегменте), **Blocking** (слушает BPDU)", "Сходимость STP 30–50 с; **RSTP** (802.1w) <1 с; **MSTP** (802.1s) — отдельное дерево на VLAN", "**Устройства по уровням OSI**:", "**L1**: **repeater** (регенерация сигнала), **hub** (многопортовый, один collision/broadcast домен, CSMA/CD полудуплекс)", "**L2**: **bridge/switch** — каждый порт отдельный collision domain, full-duplex; разделяет коллизии, общий broadcast", "**L3**: **router** — по IP-адресам, **разделяет broadcast-домены**; **L3-switch** — аппаратный L3 в ASIC", "**L4–L7**: **gateway** — преобразование протоколов (SIP↔H.323, SMTP↔X.400, NAT, email)", "**VLAN** (IEEE 802.1Q) — логическое деление коммутатора на изолированные сети с отдельными broadcast-доменами", "**Тег 802.1Q** (4 байта, между SA и EtherType): **TPID 0x8100** (16б) + **PCP** 3б (8 приоритетов CoS, 802.1p) + **DEI** 1б + **VID** 12б (0–4095, до 4094 рабочих)", "Типы портов: **Access** (одна VLAN, нетегированные); **Trunk** (между коммутаторами, теги сохраняются); **Native VLAN** — нетегированная на транке", "**Q-in-Q (802.1ad)** — двойное тегирование (operator+customer); **VXLAN** (RFC 7348) — 24-битный VNI, L2 поверх IP/UDP, для ДЦ/облаков", "Режимы коммутатора: **Store-and-forward** (CRC, потом forward), **Cut-through** (forward сразу после адреса), **Fragment-free** (первые 64 байта)"]}], "quizzes": []}, {"id": 5, "name": "Сетевой уровень", "questions": [{"n": 30, "title": "Проектирование сетевого уровня: Сервисы, предоставляемые транспортному уровню. Метод коммутации пакетов с ожиданием. Реализация сервиса без установления соединения.", "paragraphs": ["**Сетевой уровень** (Network Layer) отвечает за доставку пакетов данных между узлами в разных сетях. Ниже разобраны три ключевых аспекта его проектирования.", "<h3>Сервисы, предоставляемые транспортному уровню</h3>", "Сетевой уровень скрывает топологию и структуру сети от транспортного уровня. Он решает три главные задачи:", "- **Независимость от технологий:** транспортный уровень не должен знать тип сетевого оборудования (кабели, маршрутизаторы, беспроводные системы).\n- **Унификация адресации:** формат адресов одинаков для LAN и WAN (например, IPv4 / IPv6).\n- **Изоляция топологии:** изменение структуры сети не влияет на работу приложений.", "Конкретные услуги могут предоставляться в одной из двух парадигм:", "- **Без установления соединения** (connectionless): два примитива **SEND / RECEIVE**, никаких гарантий — пакет может потеряться, опоздать или прийти не по порядку. Аналогия — почтовая открытка. Используется в **Интернете (IP)**.\n- **С установлением соединения** (connection-oriented): примитивы **CONNECT / SEND / RECEIVE / DISCONNECT**, упорядоченная гарантированная доставка, иногда QoS. Аналогия — телефонный звонок. Используется в ATM, X.25, MPLS.", "В Интернете победила первая модель: сама сеть простая, а надёжность реализуется на транспортном уровне (TCP). Это принцип **end-to-end argument** — «всё, что можно решить на концах, должно решаться на концах».", "<h3>Метод коммутации пакетов с ожиданием</h3>", "Большинство современных сетей используют принцип **store-and-forward** для передачи данных:", "- **Принцип работы:** маршрутизатор принимает пакет целиком, проверяет его на ошибки (контрольная сумма), сохраняет в буфер и только потом отправляет дальше.\n- **Ожидание (Store):** пакет должен быть полностью записан в память узла перед обработкой.\n- **Продвижение (Forward):** поиск пути по таблице маршрутизации и отправка в нужный выходной порт.\n- **Плюс:** повреждённые пакеты отсекаются сразу и не засоряют каналы связи дальше.\n- **Минус:** возникает задержка из-за времени на буферизацию пакета на каждом узле.", "Это противоположно **коммутации каналов** (телефонии), где данные текут непрерывным потоком по заранее зарезервированной линии без буферизации.", "<h3>Реализация сервиса без установления соединения</h3>", "В таких сетях (главный пример — сети **IP**) пакеты называются **дейтаграммами** (datagram). Они передаются без предварительного уведомления получателя:", "- **Независимость пакетов:** каждый пакет содержит полный адрес получателя и продвигается по сети отдельно от других.\n- **Динамический маршрут:** два последовательных пакета от одного процесса могут пойти по разным путям.\n- **Отказоустойчивость:** если один маршрутизатор выходит из строя, следующие пакеты автоматически направляются в обход.\n- **Асимметрия доставки:** пакеты могут прийти к получателю в неправильном порядке или потеряться.\n- **Управление очередью:** при перегрузке маршрутизатор просто сбрасывает (удаляет) новые входящие пакеты. Восстановлением данных занимается транспортный уровень (например, TCP).", "Маршрутизатор находит путь по **таблице маршрутизации** — списку вида «диапазон IP-адресов → выходной порт + следующий узел». Выбор записи — по правилу **longest prefix match** (самое длинное совпадение префикса). Сами таблицы заполняются автоматически протоколами маршрутизации (OSPF, BGP — см. Q33, Q41)."], "terms": [{"ru": "Сетевой уровень", "en": "network layer, L3", "df": "третий уровень OSI; отвечает за доставку пакетов между двумя компьютерами через всю сеть"}, {"ru": "Маршрутизатор", "en": "router", "df": "устройство сетевого уровня, передающее пакеты между разными сетями"}, {"ru": "Дейтаграмма", "en": "datagram", "df": "независимый пакет, несущий полный адрес получателя"}, {"ru": "Сервис без соединения", "en": "connectionless service", "df": "модель, при которой пакеты передаются без предварительной установки соединения; основа Интернета"}, {"ru": "Сервис с соединением", "en": "connection-oriented service", "df": "модель с предварительной установкой логического пути (виртуальный канал)"}, {"ru": "Коммутация пакетов с ожиданием", "en": "store-and-forward", "df": "маршрутизатор полностью принимает пакет, потом передаёт дальше"}, {"ru": "Коммутация каналов", "en": "circuit switching", "df": "выделение непрерывного пути на время сеанса (как телефонная сеть)"}, {"ru": "Таблица маршрутизации", "en": "routing table", "df": "таблица в маршрутизаторе: диапазон IP-адресов → следующий узел"}, {"ru": "IP", "en": "Internet Protocol", "df": "основной сетевой протокол; реализует сервис без соединения"}], "summary": ["**Сетевой уровень (L3)** отвечает за доставку пакетов от одного компьютера к другому через всю сеть, как бы много промежуточных маршрутизаторов ни было", "Канальный уровень умеет связывать только соседние узлы; сетевой — дотягивается через целые цепочки сетей. Главный пример — протокол **IP**", "Адресация **логическая (IP-адрес)** — не зависит от того, по какому физическому проводу или Wi-Fi подключено устройство", "**Три принципа проектирования** (как сеть выглядит сверху): услуги независимы от физической технологии; топология маршрутизаторов скрыта; единая адресация на всю сеть", "**Сетевой уровень предлагает один из двух типов сервиса транспортному уровню:**", "**Без установления соединения (connectionless)** — два примитива **SEND/RECEIVE**, никаких гарантий, аналогия «открытка по почте»; модель Интернета (IP)", "**С установлением соединения (connection-oriented)** — примитивы **CONNECT/SEND/RECEIVE/DISCONNECT**, упорядоченная гарантированная доставка, иногда QoS, аналогия «телефонный звонок»; ATM, X.25, MPLS", "Принцип **end-to-end argument**: всё, что можно решить на концах сети (надёжность, упорядочение), должно решаться там (TCP) — поэтому сама сеть простая", "**Коммутация пакетов с ожиданием (store-and-forward)** — способ работы маршрутизатора:", "1) полностью принимает пакет → 2) проверяет контрольную сумму → 3) по таблице находит, куда отправить → 4) передаёт дальше", "Слово «ожидание» = маршрутизатор **дожидается конца пакета** прежде чем переслать", "Противоположность — **коммутация каналов** (телефония): данные текут непрерывным потоком по заранее зарезервированной линии", "Цена store-and-forward — небольшая задержка на каждом маршрутизаторе; плюсы — гибкость, обход аварий, разделение канала между пользователями", "**Сервис без установления соединения** (connectionless, модель Интернета):", "Никакой предварительной установки — отправляй сразу; каждый пакет несёт **полный адрес получателя** и обрабатывается независимо", "Такой самод
