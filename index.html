HF/13,56 МГц (NFC, метки EPC HF), UHF 860–960 МГц (логистика), SHF/2,45 ГГц. Тесно связана с концепцией **EPC** (Electronic Product Code) и **Интернета вещей** (IoT).", "<h3>Сенсорные сети</h3>", "<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 280\" role=\"img\" aria-label=\"Архитектура беспроводной сенсорной сети\"><rect x=\"0\" y=\"0\" width=\"640\" height=\"280\" fill=\"#1c2128\" rx=\"8\"/><text x=\"320\" y=\"26\" text-anchor=\"middle\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"16\" font-weight=\"700\">Wireless Sensor Network (WSN)</text><circle cx=\"80\" cy=\"100\" r=\"9\" fill=\"#3fb950\"/><circle cx=\"140\" cy=\"80\" r=\"9\" fill=\"#3fb950\"/><circle cx=\"100\" cy=\"170\" r=\"9\" fill=\"#3fb950\"/><circle cx=\"180\" cy=\"160\" r=\"9\" fill=\"#3fb950\"/><circle cx=\"220\" cy=\"100\" r=\"9\" fill=\"#3fb950\"/><circle cx=\"260\" cy=\"180\" r=\"9\" fill=\"#3fb950\"/><circle cx=\"320\" cy=\"80\" r=\"9\" fill=\"#3fb950\"/><circle cx=\"350\" cy=\"170\" r=\"9\" fill=\"#3fb950\"/><circle cx=\"400\" cy=\"120\" r=\"9\" fill=\"#3fb950\"/><line x1=\"80\" y1=\"100\" x2=\"140\" y2=\"80\" stroke=\"#3fb950\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/><line x1=\"140\" y1=\"80\" x2=\"220\" y2=\"100\" stroke=\"#3fb950\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/><line x1=\"100\" y1=\"170\" x2=\"180\" y2=\"160\" stroke=\"#3fb950\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/><line x1=\"180\" y1=\"160\" x2=\"260\" y2=\"180\" stroke=\"#3fb950\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/><line x1=\"220\" y1=\"100\" x2=\"320\" y2=\"80\" stroke=\"#3fb950\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/><line x1=\"260\" y1=\"180\" x2=\"350\" y2=\"170\" stroke=\"#3fb950\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/><line x1=\"320\" y1=\"80\" x2=\"400\" y2=\"120\" stroke=\"#3fb950\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/><line x1=\"350\" y1=\"170\" x2=\"400\" y2=\"120\" stroke=\"#3fb950\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/><line x1=\"400\" y1=\"120\" x2=\"500\" y2=\"140\" stroke=\"#e3b341\" stroke-width=\"2\"/><rect x=\"500\" y=\"120\" width=\"50\" height=\"40\" fill=\"#e3b341\" rx=\"4\"/><text x=\"525\" y=\"145\" text-anchor=\"middle\" fill=\"#0d1117\" font-family=\"sans-serif\" font-size=\"11\" font-weight=\"700\">sink</text><line x1=\"550\" y1=\"140\" x2=\"600\" y2=\"140\" stroke=\"#58a6ff\" stroke-width=\"1.5\"/><text x=\"595\" y=\"155\" text-anchor=\"end\" fill=\"#58a6ff\" font-family=\"sans-serif\" font-size=\"10\">→ Интернет</text><text x=\"200\" y=\"230\" text-anchor=\"middle\" fill=\"#7d8590\" font-family=\"sans-serif\" font-size=\"11\">множество маломощных узлов с датчиками,</text><text x=\"200\" y=\"245\" text-anchor=\"middle\" fill=\"#7d8590\" font-family=\"sans-serif\" font-size=\"11\">многошаговая (multi-hop) ретрансляция к sink-узлу</text></svg><figcaption>Беспроводная сенсорная сеть: данные с распределённых узлов многошагово ретранслируются к sink-узлу (шлюзу), который передаёт их во внешнюю сеть.</figcaption></figure>", "**Сенсорная сеть** (WSN, Wireless Sensor Network) — беспроводная самоорганизующаяся сеть из множества маломощных узлов («мотов»), каждый из которых снабжён датчиками (температуры, влажности, вибрации, движения), микроконтроллером, маломощным радиомодулем и батарейкой. Узлы передают измерения **многошаговой ретрансляцией** (multi-hop) к **sink-узлу** (шлюзу), который соединён с внешней сетью.", "Ключевые характеристики:\n- **Жёсткие ограничения по энергии** — основная метрика проектирования; узел должен работать годами от одной батарейки или собирать энергию из среды (energy harvesting).\n- **Низкая скорость** — десятки/сотни кбит/с, но пакеты маленькие (десятки байт).\n- **Самоорганизация** и устойчивость к выходу узлов из строя.", "Типичные технологии и стандарты: **IEEE 802.15.4** (физический и MAC), **Zigbee** (сетевой и прикладной поверх 802.15.4), **6LoWPAN** (IPv6 поверх 802.15.4), **LoRaWAN** и **NB-IoT** (для LPWAN — большой дальности и малых данных). Применения: мониторинг окружающей среды, точное земледелие, промышленный мониторинг (Industry 4.0), умный дом, военные системы наблюдения."], "terms": [{"ru": "ISP", "en": "Internet Service Provider", "df": "провайдер интернет-услуг; оператор, предоставляющий доступ в Интернет"}, {"ru": "IXP", "en": "Internet Exchange Point", "df": "точка обмена интернет-трафиком между провайдерами"}, {"ru": "AS", "en": "Autonomous System", "df": "автономная система; группа сетей под единым управлением с единой политикой маршрутизации"}, {"ru": "BGP", "en": "Border Gateway Protocol", "df": "протокол маршрутизации между автономными системами Интернета"}, {"ru": "Транзит", "en": "transit", "df": "платная услуга предоставления доступа ко всему Интернету через сеть оператора"}, {"ru": "Пиринг", "en": "peering", "df": "взаимный обмен трафиком между сетями, обычно без оплаты"}, {"ru": "ICANN", "en": "Internet Corporation for Assigned Names and Numbers", "df": "организация, координирующая адресное пространство и DNS Интернета"}, {"ru": "Сота / ячейка", "en": "cell", "df": "географическая зона, обслуживаемая одной базовой станцией сотовой сети"}, {"ru": "Базовая станция", "en": "base station, BS", "df": "стационарная радиостанция сотовой сети; BTS/NodeB/eNodeB/gNodeB в разных поколениях"}, {"ru": "Хэндовер", "en": "handover / handoff", "df": "переключение активного соединения мобильного устройства от одной базовой станции к другой"}, {"ru": "Роуминг", "en": "roaming", "df": "обслуживание абонента в сети другого оператора по соглашению"}, {"ru": "RAN", "en": "Radio Access Network", "df": "радиоподсистема сотовой сети"}, {"ru": "LTE", "en": "Long-Term Evolution", "df": "стандарт сетей 4G, полностью пакетная IP-архитектура"}, {"ru": "5G NR", "en": "New Radio", "df": "радиоинтерфейс пятого поколения сотовой связи"}, {"ru": "Точка доступа", "en": "access point, AP", "df": "устройство, обеспечивающее беспроводное подключение клиентов к проводной сети"}, {"ru": "BSS / ESS", "en": "Basic / Extended Service Set", "df": "базовый и расширенный набор обслуживания в 802.11"}, {"ru": "CSMA/CA", "en": "Carrier Sense Multiple Access with Collision Avoidance", "df": "метод доступа к беспроводной среде с обнаружением несущей и предотвращением коллизий"}, {"ru": "Скрытый узел", "en": "hidden terminal", "df": "проблема в радиосетях: два клиента не слышат друг друга, но оба слышат AP"}, {"ru": "WPA2 / WPA3", "en": "Wi-Fi Protected Access", "df": "стандарты шифрования и аутентификации Wi-Fi"}, {"ru": "RFID", "en": "Radio Frequency Identification", "df": "радиочастотная идентификация объектов с помощью меток"}, {"ru": "Пассивная RFID-метка", "en": "passive tag", "df": "метка без собственного питания, питающаяся от поля считывателя"}, {"ru": "Активная RFID-метка", "en": "active tag", "df": "метка с собственным источником питания и большой дальностью"}, {"ru": "EPC", "en": "Electronic Product Code", "df": "глобальный электронный код товара для RFID-маркировки"}, {"ru": "Сенсорная сеть", "en": "WSN, Wireless Sensor Network", "df": "беспроводная самоорганизующаяся сеть из маломощных узлов с датчиками"}, {"ru": "Sink-узел", "en": "sink node", "df": "шлюз сенсорной сети, собирающий данные с узлов и передающий во внешнюю сеть"}], "summary": ["Интернет: TCP/IP, ISP, IXP, ICANN управляет адресами", "Сотовая: ячейки + BS, хэндовер при перемещении", "1G=аналог, 2G=GSM, 3G=UMTS, 4G=LTE, 5G=<1мс", "Wi-Fi (802.11): 2.4/5/6 ГГц, CSMA/CA, точки доступа", "RFID: активные (своё питание) / пассивные (от считывателя)", "Сенсорные сети: Zigbee (802.15.4), LoRaWAN, sink-узел"]}, {"n": 6, "title": "Стандартизация сетей. Отечественные и зарубежные организации по стандартизации: телекоммуникации, сеть Интернет, вопросы безопасности.", "paragraphs": ["Стандартизация в телекоммуникациях обеспечивает совместимость оборудования и протоколов разных производителей и стран. Стандарты делятся на два типа:\n- **Де-юре** (de jure) — официально утверждённые органами стандартизации (ISO, ITU).\n- **Де-факто** (de facto) — сложившиеся через широкое практическое применение (Ethernet, TCP/IP).", "**1. Телекоммуникации — международные организации:**\n- **ITU** (International Telecommunication Union) — агентство ООН по телекоммуникациям.\n  - **ITU-T** — стандарты телефонных сетей и передачи данных (серии рекомендаций V, X, G, H).\n  - **ITU-R** — распределение радиочастотного спектра.\n- **ISO** (International Organization for Standardization) — разработала модель OSI, серию ISO/IEC 27000 (информационная безопасность).\n- **IEEE** (Institute of Electrical and Electronics Engineers) — стандарты локальных и беспроводных сетей:\n  - 802.3 (Ethernet), 802.11 (Wi-Fi), 802.15 (Bluetooth/Zigbee), 802.16 (WiMAX).", "**2. Интернет:**\n- **IETF** (Internet Engineering Task Force) — открытое сообщество инженеров, публикует стандарты в виде документов **RFC** (Request for Comments).\n  - **IAB** (Internet Architecture Board) — комитет внутри IETF, определяет архитектурные принципы Интернета и осуществляет надзор за функцией IANA.\n- **ICANN** (Internet Corporation for Assigned Names and Numbers) — независимая некоммерческая организация, управляет доменными именами и координирует систему DNS.\n  - **IANA** (Internet Assigned Numbers Authority) — функция внутри ICANN, управляет IP-адресами, номерами AS и параметрами протоколов по политикам IETF.\n- **W3C** (World Wide Web Consortium) — стандарты Веба (HTML, CSS, XML).", "**3. Безопасность:**\n- **ISO/IEC 27001, 27002** — системы управления информационной безопасностью (ISMS).\n- **NIST** (National Institute of Standards and Technology, США) — стандарты FIPS в области криптографии и кибербезопасности.\n- **ETSI** (European Telecommunications Standards Institute) — стандарты для европейского рынка (GSM, TISPAN).", "**4. Россия:**\n- **Росстандарт** — ГОСТ Р (национальные стандарты).\n- **Минцифры** — регулирование в сфере ИТ и связи.\n- **СОРМ** — технические требования к операторам связи для обеспечения оперативно-розыскных мероприятий."], "terms": [{"ru": "Стандарт де-юре", "en": "de jure standard", "df": "официально утверждённый стандарт уполномоченной организацией"}, {"ru": "Стандарт де-факто", "en": "de facto standard", "df": "стандарт, сложившийся в результате широкого применения без официального утверждения"}, {"ru": "ITU", "en": "International Telecommunication Union", "df": "Международный союз электросвязи; агентство ООН по телекоммуникациям"}, {"ru": "ISO", "en": "International Organization for Standardization", "df": "Международная организация по стандартизации"}, {"ru": "IEEE", "en": "Institute of Electrical and Electronics Engineers", "df": "Институт инженеров электротехники и электроники"}, {"ru": "IETF", "en": "Internet Engineering Task Force", "df": "организация, разрабатывающая интернет-стандарты в форме RFC"}, {"ru": "RFC", "en": "Request for Comments", "df": "документ с техническими спецификациями протоколов Интернета"}, {"ru": "NIST", "en": "National Institute of Standards and Technology", "df": "Национальный институт стандартов и технологий США"}, {"ru": "ETSI", "en": "European Telecommunications Standards Institute", "df": "Европейский институт телекоммуникационных стандартов"}], "summary": ["Де-юре (утверждённые) vs де-факто (сложившиеся: Ethernet)", "ITU (ООН): ITU-T = телефон (V,X,G,H), ITU-R = радиочастоты", "ISO = модель OSI, ISO/IEC 27000 (ИБ)", "IEEE: 802.3=Ethernet, 802.11=Wi-Fi, 802.15=Bluetooth", "IETF = интернет-стандарты (RFC), W3C = веб (HTML/CSS)", "NIST (США) = криптография/FIPS, ETSI (Европа) = GSM", "Россия: Росстандарт (ГОСТ Р), Минцифры, СОРМ"]}], "quizzes": [{"type": "mcq", "topic": "Вопрос 1", "q": "Какой тип сети охватывает масштаб города?", "opts": ["PAN", "LAN", "MAN", "WAN"], "ans": 2, "expl": "MAN (Metropolitan Area Network) охватывает город. PAN — метры, LAN — здание/кампус, WAN — сотни-тысячи км."}, {"type": "mcq", "topic": "Вопрос 1", "q": "Какая топология соединяет каждый узел с каждым?", "opts": ["Шина (bus)", "Звезда (star)", "Кольцо (ring)", "Полная сетка (full mesh)"], "ans": 3, "expl": "Полная сетка (full mesh) — топология, где каждый узел соединён с каждым другим."}, {"type": "mcq", "topic": "Вопрос 1", "q": "Какой стандарт соответствует технологии Wi-Fi?", "opts": ["802.3", "802.11", "802.15", "802.16"], "ans": 1, "expl": "Wi-Fi — это семейство стандартов IEEE 802.11."}, {"type": "mcq", "topic": "Вопрос 1", "q": "Какая технология НЕ относится к беспроводным сетям?", "opts": ["Bluetooth", "Zigbee", "GPON", "5G"], "ans": 2, "expl": "GPON — оптоволоконная (проводная) технология для домашних сетей. Bluetooth, Zigbee и 5G — беспроводные."}, {"type": "mcq", "topic": "Вопрос 1", "q": "Какие два основных подхода к передаче данных различают по технологии?", "opts": ["Аналоговый и цифровой", "Broadcast и packet switching", "Проводной и беспроводной", "Синхронный и асинхронный"], "ans": 1, "expl": "По технологии передачи сети делятся на broadcast (широковещательные) и packet switching (с коммутацией пакетов)."}, {"type": "mcq", "topic": "Вопрос 1", "q": "Какая технология НЕ характерна для корпоративных сетей?", "opts": ["Ethernet", "VPN", "Выделенные каналы", "Zigbee"], "ans": 3, "expl": "Корпоративные сети используют Ethernet, VPN, выделенные каналы и централизованное управление. Zigbee — технология для сенсорных/IoT-сетей."}, {"type": "tf", "topic": "Вопрос 1", "q": "DSL, кабельный Интернет и GPON — типичные технологии домашних сетей.", "ans": true, "expl": "Верно. Домашние сети используют DSL, кабельный Интернет, GPON + беспроводной маршрутизатор."}, {"type": "tf", "topic": "Вопрос 1", "q": "Беспроводные сети особенно важны там, где прокладка кабеля невозможна: склады, стройплощадки, удалённые регионы.", "ans": true, "expl": "Верно. Именно эти примеры приводятся: склады, стройплощадки, удалённые регионы."}, {"type": "tf", "topic": "Вопрос 1", "q": "Гибридная топология — это разновидность классификации сетей по масштабу.", "ans": false, "expl": "Неверно. Гибридная — это классификация по топологии, а не по масштабу. По масштабу: PAN, LAN, MAN, WAN."}, {"type": "tf", "topic": "Вопрос 1", "q": "Bluetooth относится к технологиям корпоративных сетей.", "ans": false, "expl": "Неверно. Bluetooth — беспроводная технология (наряду с Wi-Fi, Zigbee, 3G/4G/5G). Корпоративные сети: Ethernet, VPN, выделенные каналы."}, {"type": "match", "topic": "Вопрос 1", "q": "Сопоставьте тип сети с его характеристикой:", "pairs": [{"l": "Корпоративная", "r": "Ethernet, VPN, централизованное управление"}, {"l": "Домашняя", "r": "DSL, кабельный Интернет, GPON"}, {"l": "Беспроводная", "r": "Wi-Fi, Bluetooth, Zigbee, 3G/4G/5G"}, {"l": "По топологии", "r": "Шина, звезда, кольцо, полная сетка"}], "expl": "Каждый тип сети имеет свои характерные технологии и признаки классификации."}, {"type": "mcq", "topic": "Вопрос 2", "q": "Какова типичная скорость передачи данных в LAN?", "opts": ["1–10 Мбит/с", "100 Мбит/с – 100 Гбит/с", "1–10 Гбит/с только", "До 1 Мбит/с"], "ans": 1, "expl": "LAN: здание/кампус, скорости от 100 Мбит/с до 100 Гбит/с."}, {"type": "mcq", "topic": "Вопрос 2", "q": "Какое устройство работает на уровне L3 и использует IP-адреса для объединения сетей?", "opts": ["Коммутатор (switch)", "Маршрутизатор (router)", "Хаб (hub)", "Точка доступа (AP)"], "ans": 1, "expl": "Маршрутизаторы работают на уровне L3 и используют IP-адреса для объединения сетей (internetworking)."}, {"type": "mcq", "topic": "Вопрос 2", "q": "Что выполняет шлюз (gateway) при объединении сетей?", "opts": ["Фильтрацию по MAC-адресам", "Преобразование протоколов", "Усиление сигнала", "Назначение IP-адресов"], "ans": 1, "expl": "Шлюзы выполняют преобразование протоколов при объединении разнородных сетей."}, {"type": "mcq", "topic": "Вопрос 2", "q": "Какой технологией характеризуется MAN?", "opts": ["Bluetooth", "WiMAX и кабельное ТВ", "Zigbee", "LoRaWAN"], "ans": 1, "expl": "MAN (городская сеть) характеризуется технологиями WiMAX и кабельного ТВ."}, {"type": "mcq", "topic": "Вопрос 2", "q": "Что означает инкапсуляция в контексте стека протоколов?", "opts": ["Шифрование данных", "Оборачивание данных заголовком и трейлером", "Сжатие пакетов", "Маршрутизация данных"], "ans": 1, "expl": "Инкапсуляция — процесс, при котором данные оборачиваются заголовком (header) и трейлером (trailer) на каждом уровне."}, {"type": "tf", "topic": "Вопрос 2", "q": "PAN охватывает расстояние порядка метров и типичная технология — Bluetooth.", "ans": true, "expl": "Верно. PAN: ~метры, Bluetooth."}, {"type": "tf", "topic": "Вопрос 2", "q": "WAN охватывает территорию здания или кампуса.", "ans": false, "expl": "Неверно. WAN охватывает сотни-тысячи километров (операторы). Здание/кампус — это LAN."}, {"type": "tf", "topic": "Вопрос 2", "q": "NAT и туннелирование — методы объединения сетей (internetworking).", "ans": true, "expl": "Верно. Internetworking включает: маршрутизаторы, шлюзы, туннелирование, NAT."}, {"type": "tf", "topic": "Вопрос 2", "q": "В многоуровневой иерархии протоколов каждый уровень предоставляет услуги нижестоящему уровню.", "ans": false, "expl": "Неверно. Каждый уровень предоставляет услуги вышестоящему уровню, а не нижестоящему."}, {"type": "match", "topic": "Вопрос 2", "q": "Сопоставьте тип сети с его масштабом и характеристикой:", "pairs": [{"l": "PAN", "r": "~метры, Bluetooth"}, {"l": "LAN", "r": "Здание/кампус, 100 Мбит/с – 100 Гбит/с"}, {"l": "MAN", "r": "Город, WiMAX, кабельное ТВ"}, {"l": "WAN", "r": "Сотни-тысячи км, операторы"}], "expl": "PAN/LAN/MAN/WAN различаются по масштабу и характерным технологиям."}, {"type": "match", "topic": "Вопрос 2", "q": "Сопоставьте аспект проектирования сетей с его переводом:", "pairs": [{"l": "Надёжность", "r": "Reliability"}, {"l": "Масштабируемость", "r": "Scalability"}, {"l": "Безопасность", "r": "Security"}, {"l": "Управляемость", "r": "Manageability"}], "expl": "Ключевые аспекты: надёжность (reliability), масштабируемость (scalability), безопасность (security), QoS, управляемость (manageability)."}, {"type": "mcq", "topic": "Вопрос 3", "q": "Через что предоставляется служба (service) в модели OSI?", "opts": ["IP-адрес", "MAC-адрес", "SAP (Service Access Point)", "API"], "ans": 2, "expl": "Служба предоставляется через SAP (Service Access Point) — точку доступа к службе."}, {"type": "mcq", "topic": "Вопрос 3", "q": "Какой протокол является примером connection-oriented службы?", "opts": ["UDP", "IP", "TCP", "ICMP"], "ans": 2, "expl": "TCP — пример connection-oriented (с установлением соединения): setup → data → disconnect."}, {"type": "mcq", "topic": "Вопрос 3", "q": "Какая последовательность фаз характерна для connection-oriented службы?", "opts": ["data → setup → disconnect", "setup → data → disconnect", "connect → listen → send", "send → receive → disconnect"], "ans": 1, "expl": "Connection-oriented (как телефон): setup → data → disconnect."}, {"type": "mcq", "topic": "Вопрос 3", "q": "Какой примитив используется для ожидания входящего соединения?", "opts": ["CONNECT", "ACCEPT", "LISTEN", "RECEIVE"], "ans": 2, "expl": "LISTEN — примитив для ожидания входящего соединения. Полный набор: LISTEN, CONNECT, ACCEPT, SEND, RECEIVE, DISCONNECT."}, {"type": "mcq", "topic": "Вопрос 3", "q": "Служба — это взаимодействие...", "opts": ["Горизонтальное, между узлами", "Вертикальное, между уровнями одного узла", "Диагональное, между разными уровнями разных узлов", "Внешнее, между сетями"], "ans": 1, "expl": "Служба = вертикальное взаимодействие (между уровнями на одном узле). Протокол = горизонтальное (одинаковые уровни, разные узлы)."}, {"type": "tf", "topic": "Вопрос 3", "q": "Connectionless служба передаёт данные как независимые датаграммы, подобно почте.", "ans": true, "expl": "Верно. Connectionless = почта: датаграммы передаются независимо. Примеры: UDP, IP."}, {"type": "tf", "topic": "Вопрос 3", "q": "UDP является примером connection-oriented протокола.", "ans": false, "expl": "Неверно. UDP — пример connectionless (без установления соединения). TCP — connection-oriented."}, {"type": "tf", "topic": "Вопрос 3", "q": "Протокол — это горизонтальное взаимодействие между одинаковыми уровнями на разных узлах.", "ans": true, "expl": "Верно. Протокол = горизонтальное (peer-to-peer) взаимодействие между одинаковыми уровнями разных узлов."}, {"type": "tf", "topic": "Вопрос 3", "q": "Служба может быть только reliable (надёжной), без вариантов unreliable.", "ans": false, "expl": "Неверно. Служба может быть reliable или unreliable, подтверждаемой или неподтверждаемой."}, {"type": "match", "topic": "Вопрос 3", "q": "Сопоставьте понятие с его аналогией или характеристикой:", "pairs": [{"l": "Connection-oriented", "r": "Телефон: setup → data → disconnect"}, {"l": "Connectionless", "r": "Почта: независимые датаграммы"}, {"l": "Служба (service)", "r": "Вертикальное, между уровнями одного узла"}, {"l": "Протокол (protocol)", "r": "Горизонтальное, одинаковые уровни разных узлов"}], "expl": "Connection-oriented как телефон (TCP), connectionless как почта (UDP/IP). Служба вертикальна, протокол горизонтален."}, {"type": "match", "topic": "Вопрос 3", "q": "Сопоставьте примитив службы с его назначением:", "pairs": [{"l": "LISTEN", "r": "Ожидание входящего соединения"}, {"l": "CONNECT", "r": "Инициирование соединения"}, {"l": "ACCEPT", "r": "Принятие входящего соединения"}, {"l": "DISCONNECT", "r": "Разрыв соединения"}], "expl": "Основные примитивы: LISTEN, CONNECT, ACCEPT, SEND, RECEIVE, DISCONNECT."}, {"type": "mcq", "topic": "Вопрос 4", "q": "Сколько уровней в модели OSI?", "opts": ["4", "5", "6", "7"], "ans": 3, "expl": "Модель OSI содержит 7 уровней: физический, канальный, сетевой, транспортный, сеансовый, представления, прикладной."}, {"type": "mcq", "topic": "Вопрос 4", "q": "Сколько уровней в модели TCP/IP?", "opts": ["4", "5", "6", "7"], "ans": 0, "expl": "Модель TCP/IP содержит 4 уровня: link, internet, transport, application."}, {"type": "mcq", "topic": "Вопрос 4", "q": "Какой уровень OSI отвечает за кодирование, сжатие и шифрование?", "opts": ["L5 сеансовый", "L6 представления", "L7 прикладной", "L4 транспортный"], "ans": 1, "expl": "L6 (уровень представления) отвечает за кодирование, сжатие и шифрование данных."}, {"type": "mcq", "topic": "Вопрос 4", "q": "Какие единицы данных используются на канальном уровне (L2) OSI?", "opts": ["Биты", "Кадры (frames)", "Пакеты (packets)", "Сегменты (segments)"], "ans": 1, "expl": "L2 канальный: кадры (frames), MAC-адреса, обработка ошибок."}, {"type": "mcq", "topic": "Вопрос 4", "q": "Модель OSI является...", "opts": ["Описательной (descriptive)", "Нормативной (prescriptive)", "Гибридной", "Эмпирической"], "ans": 1, "expl": "OSI — нормативная (prescriptive) модель, разработанная ISO до создания протоколов. TCP/IP — описательная (descriptive)."}, {"type": "mcq", "topic": "Вопрос 4", "q": "Какой уровень OSI обеспечивает маршрутизацию пакетов?", "opts": ["L1 физический", "L2 канальный", "L3 сетевой", "L4 транспортный"], "ans": 2, "expl": "L3 сетевой уровень отвечает за пакеты, маршрутизацию и IP."}, {"type": "mcq", "topic": "Вопрос 4", "q": "Какая критика относится к модели TCP/IP?", "opts": ["Слишком много уровней", "Не разделяет службу, интерфейс и протокол", "Поздно вышла на рынок", "Уровни L5/L6 пусты"], "ans": 1, "expl": "Критика TCP/IP: не разделяет службу/интерфейс/протокол, не описывает не-IP сети, link не настоящий уровень, плохо для обучения."}, {"type": "mcq", "topic": "Вопрос 4", "q": "На каком уровне TCP/IP IP является единственным connectionless протоколом?", "opts": ["Link", "Internet (L3)", "Transport", "Application"], "ans": 1, "expl": "В TCP/IP на уровне internet (L3) — только connectionless (IP). OSI поддерживает и connection-oriented, и connectionless на L3 и L4."}, {"type": "tf", "topic": "Вопрос 4", "q": "Модель OSI была разработана организацией ISO.", "ans": true, "expl": "Верно. OSI: 7 уровней, разработана ISO, нормативная модель."}, {"type": "tf", "topic": "Вопрос 4", "q": "Модель TCP/IP была создана раньше модели OSI и является описательной (descriptive).", "ans": true, "expl": "Верно. TCP/IP — описательная модель (DoD), а OSI — нормативная. OSI вышла позже, что стало одной из причин критики."}, {"type": "tf", "topic": "Вопрос 4", "q": "На транспортном уровне (L4) OSI используются пакеты (packets).", "ans": false, "expl": "Неверно. На L4 (транспортный) используются сегменты (segments). Пакеты (packets) — на L3 (сетевой)."}, {"type": "tf", "topic": "Вопрос 4", "q": "Сеансовый уровень (L5) OSI отвечает за синхронизацию и контрольные точки.", "ans": true, "expl": "Верно. L5 сеансовый: управление сеансами, синхронизация, контрольные точки."}, {"type": "tf", "topic": "Вопрос 4", "q": "Одна из критик OSI состоит в том, что уровни L5 и L6 практически пусты.", "ans": true, "expl": "Верно. Критика OSI: поздно вышла, L5/L6 пусты, громоздкие реализации, протоколы не прижились."}, {"type": "match", "topic": "Вопрос 4", "q": "Сопоставьте уровень OSI с его единицей данных:", "pairs": [{"l": "L1 физический", "r": "Биты"}, {"l": "L2 канальный", "r": "Кадры (frames)"}, {"l": "L3 сетевой", "r": "Пакеты (packets)"}, {"l": "L4 транспортный", "r": "Сегменты (segments)"}], "expl": "Каждый уровень OSI оперирует своей единицей данных: биты → кадры → пакеты → сегменты."}, {"type": "match", "topic": "Вопрос 4", "q": "Сопоставьте уровень OSI с его функцией:", "pairs": [{"l": "L5 сеансовый", "r": "Сеансы, синхронизация, контрольные точки"}, {"l": "L6 представления", "r": "Кодирование, сжатие, шифрование"}, {"l": "L7 прикладной", "r": "HTTP, FTP, SMTP, DNS"}, {"l": "L3 сетевой", "r": "Маршрутизация, IP"}], "expl": "Верхние уровни OSI: L5 — сеансы, L6 — представление данных, L7 — прикладные протоколы."}, {"type": "match", "topic": "Вопрос 4", "q": "Сопоставьте модель с её характеристикой:", "pairs": [{"l": "OSI", "r": "7 уровней, ISO, нормативная (prescriptive)"}, {"l": "TCP/IP", "r": "4 уровня, DoD, описательная (descriptive)"}, {"l": "Критика OSI", "r": "Поздно вышла, L5/L6 пусты, громоздкая"}, {"l": "Критика TCP/IP", "r": "Не разделяет службу/интерфейс/протокол"}], "expl": "OSI и TCP/IP имеют разные подходы и разные недостатки."}, {"type": "mcq", "topic": "Вопрос 5", "q": "Какое поколение мобильной связи принесло цифровую передачу и SMS?", "opts": ["1G", "2G", "3G", "4G"], "ans": 1, "expl": "2G (GSM) — цифровая связь + SMS. 1G — аналог, 3G — интернет, 4G — широкополосный."}, {"type": "mcq", "topic": "Вопрос 5", "q": "Какой стандарт соответствует 3G?", "opts": ["GSM", "UMTS", "LTE", "WiMAX"], "ans": 1, "expl": "3G — UMTS (интернет). 2G — GSM, 4G — LTE."}, {"type": "mcq", "topic": "Вопрос 5", "q": "Какой метод доступа к среде используется в Wi-Fi 802.11?", "opts": ["CSMA/CD", "CSMA/CA", "TDMA", "FDMA"], "ans": 1, "expl": "Wi-Fi 802.11 использует CSMA/CA (Carrier Sense Multiple Access with Collision Avoidance)."}, {"type": "mcq", "topic": "Вопрос 5", "q": "Какие частоты используются в Wi-Fi 802.11?", "opts": ["900 МГц / 1.8 ГГц / 2.1 ГГц", "2.4 / 5 / 6 ГГц", "1 / 2 / 3 ГГц", "5 / 10 / 15 ГГц"], "ans": 1, "expl": "Wi-Fi 802.11 работает на частотах 2.4, 5 и 6 ГГц."}, {"type": "mcq", "topic": "Вопрос 5", "q": "Что отличает пассивные RFID-метки от активных?", "opts": ["Пассивные работают от батареи, активные — от поля считывателя", "Пассивные питаются от поля считывателя, активные имеют батарею", "Пассивные имеют больший радиус действия", "Разницы нет"], "ans": 1, "expl": "Пассивные RFID-метки питаются от электромагнитного поля считывателя, активные имеют собственную батарею."}, {"type": "mcq", "topic": "Вопрос 5", "q": "Какие технологии используются в сенсорных сетях?", "opts": ["Ethernet и GPON", "Zigbee и LoRaWAN", "WiMAX и DSL", "LTE и 5G"], "ans": 1, "expl": "Сенсорные сети: маломощные узлы + датчики → sink. Технологии: Zigbee, LoRaWAN."}, {"type": "mcq", "topic": "Вопрос 5", "q": "Что такое handover в мобильных сетях?", "opts": ["Установка нового соединения", "Передача абонента между базовыми станциями (сотами)", "Аутентификация пользователя", "Шифрование трафика"], "ans": 1, "expl": "Handover — передача обслуживания мобильного абонента от одной базовой станции к другой при перемещении между сотами."}, {"type": "tf", "topic": "Вопрос 5", "q": "5G характеризуется сверхнизкой задержкой (ultra-low latency).", "ans": true, "expl": "Верно. 5G — сверхнизкая задержка. 4G LTE — широкополосный."}, {"type": "tf", "topic": "Вопрос 5", "q": "1G — это цифровая мобильная связь с поддержкой SMS.", "ans": false, "expl": "Неверно. 1G — аналоговая связь. Цифровая + SMS — это 2G (GSM)."}, {"type": "tf", "topic": "Вопрос 5", "q": "Интернет использует архитектуру TCP/IP и включает access networks, backbone, ISP и IXP.", "ans": true, "expl": "Верно. Интернет: TCP/IP, access networks + backbone, ISP, IXP, ICANN."}, {"type": "tf", "topic": "Вопрос 5", "q": "RFID используется в логистике, системах контроля доступа и торговле.", "ans": true, "expl": "Верно. Применение RFID: логистика, доступ, торговля."}, {"type": "tf", "topic": "Вопрос 5", "q": "В сенсорных сетях данные от датчиков передаются на узел, называемый gateway.", "ans": false, "expl": "Неверно. Данные от датчиков передаются на узел sink (сток), а не gateway."}, {"type": "match", "topic": "Вопрос 5", "q": "Сопоставьте поколение мобильной связи с его характеристикой:", "pairs": [{"l": "1G", "r": "Аналоговая связь"}, {"l": "2G (GSM)", "r": "Цифровая + SMS"}, {"l": "3G (UMTS)", "r": "Мобильный интернет"}, {"l": "4G (LTE)", "r": "Широкополосный доступ"}, {"l": "5G", "r": "Сверхнизкая задержка"}], "expl": "Эволюция мобильных сетей: 1G аналог → 2G GSM цифра → 3G UMTS интернет → 4G LTE широкополосный → 5G сверхнизкая задержка."}, {"type": "match", "topic": "Вопрос 5", "q": "Сопоставьте тип сети с его ключевыми элементами:", "pairs": [{"l": "Интернет", "r": "ISP, IXP, ICANN, backbone"}, {"l": "Мобильная сеть", "r": "Соты (cells), базовые станции, handover"}, {"l": "RFID", "r": "Считыватель + метки (пассивные/активные)"}, {"l": "Сенсорная сеть", "r": "Маломощные узлы, датчики, sink"}], "expl": "Каждый тип сети имеет свою архитектуру и ключевые компоненты."}, {"type": "mcq", "topic": "Вопрос 6", "q": "Какая организация отвечает за стандарты RFC в Интернете?", "opts": ["ISO", "IEEE", "IETF", "ITU"], "ans": 2, "expl": "IETF (Internet Engineering Task Force) разрабатывает стандарты в виде RFC (Request for Comments)."}, {"type": "mcq", "topic": "Вопрос 6", "q": "Какая организация управляет распределением IP-адресов и AS?", "opts": ["IETF", "ICANN/IANA", "W3C", "IEEE"], "ans": 1, "expl": "ICANN → IANA отвечает за IP-адреса, номера автономных систем (AS) и параметры протоколов."}, {"type": "mcq", "topic": "Вопрос 6", "q": "Какой стандарт IEEE соответствует Ethernet?", "opts": ["802.11", "802.3", "802.15", "802.16"], "ans": 1, "expl": "IEEE 802.3 — Ethernet, 802.11 — Wi-Fi, 802.15 — Bluetooth/Zigbee, 802.16 — WiMAX."}, {"type": "mcq", "topic": "Вопрос 6", "q": "Какая организация разрабатывает стандарты HTML, CSS, XML?", "opts": ["IETF", "IEEE", "ISO", "W3C"], "ans": 3, "expl": "W3C (World Wide Web Consortium) разрабатывает стандарты HTML, CSS и XML."}, {"type": "mcq", "topic": "Вопрос 6", "q": "Какие серии стандартов разрабатывает ITU-T?", "opts": ["RFC", "V/X/G/H", "802.x", "ГОСТ Р"], "ans": 1, "expl": "ITU-T разрабатывает стандарты серий V, X, G и H. ITU-R занимается распределением спектра."}, {"type": "mcq", "topic": "Вопрос 6", "q": "Какой стандарт описывает систему управления информационной безопасностью (ISMS)?", "opts": ["NIST FIPS", "ISO 27001/27002", "IEEE 802.3", "ГОСТ Р"], "ans": 1, "expl": "ISO 27001/27002 описывает ISMS (Information Security Management System)."}, {"type": "mcq", "topic": "Вопрос 6", "q": "Что такое СОРМ в контексте российской стандартизации?", "opts": ["Стандарт кодирования данных", "Система оперативно-розыскных мероприятий", "Сертификат сетевого оборудования", "Система оценки рисков в менеджменте"], "ans": 1, "expl": "СОРМ — система оперативно-розыскных мероприятий, часть российского регулирования (наряду с Росстандарт ГОСТ Р и Минцифры)."}, {"type": "tf", "topic": "Вопрос 6", "q": "Ethernet и TCP/IP — примеры де-факто стандартов.", "ans": true, "expl": "Верно. Де-факто стандарты (на практике): Ethernet, TCP/IP. Де-юре (официальные): ISO, ITU."}, {"type": "tf", "topic": "Вопрос 6", "q": "IEEE 802.16 — это стандарт Wi-Fi.", "ans": false, "expl": "Неверно. IEEE 802.16 — это WiMAX. Wi-Fi — это 802.11."}, {"type": "tf", "topic": "Вопрос 6", "q": "IAB (Internet Architecture Board) входит в состав IETF.", "ans": true, "expl": "Верно. IAB находится внутри IETF."}, {"type": "tf", "topic": "Вопрос 6", "q": "ETSI — организация, разработавшая стандарты GSM.", "ans": true, "expl": "Верно. ETSI (European Telecommunications Standards Institute) разработала стандарты GSM."}, {"type": "tf", "topic": "Вопрос 6", "q": "W3C отвечает за распределение IP-адресов.", "ans": false, "expl": "Неверно. За IP-адреса отвечает ICANN/IANA. W3C разрабатывает веб-стандарты: HTML, CSS, XML."}, {"type": "match", "topic": "Вопрос 6", "q": "Сопоставьте стандарт IEEE 802.x с технологией:", "pairs": [{"l": "802.3", "r": "Ethernet"}, {"l": "802.11", "r": "Wi-Fi"}, {"l": "802.15", "r": "Bluetooth / Zigbee"}, {"l": "802.16", "r": "WiMAX"}], "expl": "Семейство IEEE 802: 802.3 Ethernet, 802.11 Wi-Fi, 802.15 WPAN (Bluetooth/Zigbee), 802.16 WiMAX."}, {"type": "match", "topic": "Вопрос 6", "q": "Сопоставьте организацию с её зоной ответственности:", "pairs": [{"l": "IETF", "r": "Стандарты RFC для Интернета"}, {"l": "ICANN / IANA", "r": "IP-адреса, AS, параметры протоколов"}, {"l": "W3C", "r": "HTML, CSS, XML"}, {"l": "ITU-T", "r": "Телеком-стандарты серий V/X/G/H"}], "expl": "Каждая организация отвечает за свою область стандартизации."}, {"type": "match", "topic": "Вопрос 6", "q": "Сопоставьте тип стандартизации с примером:", "pairs": [{"l": "Де-юре", "r": "ISO, ITU"}, {"l": "Де-факто", "r": "Ethernet, TCP/IP"}, {"l": "Безопасность", "r": "ISO 27001/27002 ISMS, NIST FIPS"}, {"l": "Россия", "r": "Росстандарт ГОСТ Р, Минцифры, СОРМ"}], "expl": "Стандарты бывают де-юре (официальные) и де-факто (сложившиеся на практике). Отдельно — безопасность и национальные стандарты."}]}, {"id": 2, "name": "Физический уровень сетевого стека", "questions": [{"n": 7, "title": "Теоретические основы передачи данных. Ряды Фурье. Сигналы с ограниченным спектром. Максимальная скорость передачи данных через канал.", "paragraphs": ["- **Ряд Фурье** (Fourier series) — любой периодический сигнал = сумма синусоид. Частота f = 1/T, гармоники: 2f, 3f, ... nf.\n- **Полоса пропускания** (bandwidth) — диапазон частот канала. Ограничение спектра вызывает **ISI** (межсимвольную интерференцию).\n- **Теорема Найквиста** (канал без шума): **C = 2B log₂V** бит/с, где B — полоса (Гц), V — число уровней сигнала.\n- **Теорема Шеннона** (канал с шумом): **C = B log₂(1 + S/N)** бит/с, где S/N — отношение сигнал/шум (**SNR**).\n- Шеннон задаёт теоретический предел, который нельзя превысить никаким кодированием."], "terms": [{"ru": "Ряд Фурье", "en": "Fourier series", "df": "разложение периодического сигнала в сумму синусоид кратных частот"}, {"ru": "Гармоника", "en": "harmonic", "df": "составляющая ряда Фурье с частотой, кратной фундаментальной"}, {"ru": "Полоса пропускания", "en": "bandwidth", "df": "диапазон частот, передаваемых каналом с допустимым затуханием (в Гц); в контексте сетей также используется как синоним скорости передачи данных (бит/с)"}, {"ru": "Теорема Найквиста", "en": "Nyquist theorem", "df": "максимальная скорость передачи по идеальному каналу: C = 2B log₂V"}, {"ru": "Теорема Шеннона", "en": "Shannon's theorem", "df": "теоретический предел скорости передачи по зашумлённому каналу: C = B log₂(1 + SNR)"}, {"ru": "SNR", "en": "Signal-to-Noise Ratio", "df": "отношение мощности полезного сигнала к мощности шума"}, {"ru": "Пропускная способность", "en": "channel capacity", "df": "максимальная скорость безошибочной передачи данных по каналу"}, {"ru": "Межсимвольная интерференция", "en": "ISI, Inter-Symbol Interference", "df": "искажение символов из-за наложения переходных процессов от соседних символов"}], "summary": ["Фурье: сигнал = сумма синусоид, f=1/T, гармоники nf", "Найквист (без шума): C = 2B log2(V) бит/с", "Шеннон (с шумом): C = B log2(1 + S/N) бит/с", "B = полоса пропускания (Гц), V = число уровней сигнала", "SNR = отношение сигнал/шум, предел Шеннона непревышаем", "ISI — межсимвольная интерференция из-за ограничения спектра"]}, {"n": 8, "title": "Проводниковые среды передачи информации: магнитные носители, витая пара, коаксиальный кабель, линии электропитания, волоконная оптика.", "paragraphs": ["- **Магнитные носители** (magnetic media) — физическая доставка дисков. При огромных объёмах может быть быстрее сети.", "- **Витая пара** (twisted pair) — самая распространённая среда в LAN. Скручивание снижает помехи и наводки. **UTP** Cat5e-Cat7, до 10 Гбит/с.", "- **Коаксиальный кабель** (coaxial cable) — центральный проводник + экран. Кабельное ТВ и DOCSIS.\n- **Линии электропитания** (PLC) — данные по электропроводке. Удобно, но шумно.\n- **Волоконная оптика** (fiber optic) — световые импульсы по стеклу. **SMF** — дальние (сотни км), **MMF** — короткие. Плюсы: Тбит/с, нечувствительность к EMI, низкое затухание."], "terms": [{"ru": "Витая пара", "en": "twisted pair", "df": "кабель из попарно скрученных проводников; основная среда для Ethernet"}, {"ru": "UTP", "en": "Unshielded Twisted Pair", "df": "неэкранированная витая пара; наиболее распространённый вариант"}, {"ru": "Перекрёстные наводки", "en": "crosstalk", "df": "нежелательный перенос сигнала между соседними проводниками"}, {"ru": "Коаксиальный кабель", "en": "coaxial cable", "df": "кабель с центральным проводником и экранирующей оплёткой"}, {"ru": "PLC", "en": "Power Line Communication", "df": "технология передачи данных по электрической сети"}, {"ru": "Волоконная оптика", "en": "fiber optics", "df": "технология передачи данных в виде световых сигналов по оптическому волокну"}, {"ru": "Одномодовое волокно", "en": "single-mode fiber, SMF", "df": "волокно с узким сердечником; для дальних расстояний"}, {"ru": "Многомодовое волокно", "en": "multimode fiber, MMF", "df": "волокно с широким сердечником; для коротких расстояний"}, {"ru": "Затухание", "en": "attenuation", "df": "уменьшение мощности сигнала по мере его распространения по среде"}, {"ru": "DOCSIS", "en": "Data Over Cable Service Interface Specification", "df": "стандарт широкополосного Интернета по коаксиальному кабелю"}], "summary": ["Магнитные носители: фургон с лентами > оптика по объёму", "Витая пара (UTP): Cat5e-Cat7, до 10 Гбит/с, снижает EMI", "Коаксиал: центр+экран+оплётка, кабельное ТВ, DOCSIS", "PLC — данные по электропроводке (высокий шум)", "Оптоволокно: свет по стеклу, Тбит/с, нет EMI", "SMF (одномод) — сотни км; MMF (многомод) — короткие"]}, {"n": 9, "title": "Беспроводная связь: электромагнитный спектр, радиосвязь, микроволновый диапазон, инфракрасный диапазон, видимый диапазон.", "paragraphs": ["Электромагнитный спектр охватывает все виды излучения — от радиоволн до гамма-лучей. Для беспроводной связи используется диапазон от 10 кГц до 300+ ГГц. Чем выше частота — тем больше полоса пропускания, но меньше дальность и проникающая способность.", "**Диапазоны беспроводной связи:**", "- **Радиоволны** (1 МГц – 1 ГГц):\n  - Волны LF/MF (Low/Medium Frequency) огибают рельеф земной поверхности и применяются для AM-радиовещания и морской связи.\n  - Волны HF (High Frequency, короткие волны) отражаются от ионосферы, что обеспечивает связь на тысячи километров.\n  - Диапазон VHF/UHF (Very/Ultra High Frequency) используется для FM-радио, телевидения и мобильных сетей.", "- **Микроволны** (1–300 ГГц):\n  - Микроволны распространяются по прямой линии (line-of-sight) и требуют прямой видимости между антеннами.\n  - В этом диапазоне работают Wi-Fi (2,4 и 5 ГГц), Bluetooth, сети 5G на миллиметровых волнах, радиорелейные линии и спутниковая связь.", "- **Инфракрасный диапазон** (IR — Infrared, 300 ГГц – 400 ТГц):\n  - ИК-излучение не проникает через стены, что ограничивает дальность, но повышает безопасность от перехвата.\n  - Применяется в пультах дистанционного управления и стандарте IrDA (Infrared Data Association).", "- **Видимый свет** (400–800 ТГц):\n  - Технология Li-Fi (Light Fidelity) передаёт данные через видимый свет со скоростью до Гбит/с.\n  - FSO (Free Space Optics) использует лазерные пучки для связи в прямой видимости на расстояние до нескольких километров."], "terms": [{"ru": "Электромагнитный спектр", "en": "electromagnetic spectrum", "df": "весь диапазон частот электромагнитного излучения"}, {"ru": "Прямая видимость", "en": "line-of-sight, LOS", "df": "условие распространения сигнала без препятствий между передатчиком и приёмником"}, {"ru": "Ионосфера", "en": "ionosphere", "df": "слой атмосферы, отражающий коротковолновые радиосигналы"}, {"ru": "Микроволновый диапазон", "en": "microwave band", "df": "диапазон частот 1–300 ГГц; используется в Wi-Fi, спутниковой и мобильной связи"}, {"ru": "IrDA", "en": "Infrared Data Association", "df": "стандарт беспроводной передачи данных в инфракрасном диапазоне"}, {"ru": "Li-Fi", "en": "Light Fidelity", "df": "технология беспроводной передачи данных с использованием видимого света"}, {"ru": "FSO", "en": "Free Space Optics", "df": "оптическая беспроводная связь через открытое пространство (лазерный луч)"}, {"ru": "Затухание в атмосфере", "en": "atmospheric attenuation", "df": "поглощение радиосигнала атмосферными газами и осадками"}], "summary": ["Радио (1 МГц-1 ГГц): LF/MF огибают, HF от ионосферы", "VHF/UHF = FM, ТВ, мобильные сети", "Микроволны (1-300 ГГц): line-of-sight, Wi-Fi, 5G mmWave", "ИК (300 ГГц-400 ТГц): IrDA, пульты, не через стены", "Li-Fi — видимый свет, до Гбит/с", "FSO — лазер в открытом пространстве, до неск. км"]}, {"n": 10, "title": "Спутниковая связь. Классификация спутников: геостационарные, средневысотные, низкоорбитальные. Спутники и оптоволокно.", "paragraphs": ["Спутник принимает сигнал от наземной станции (**uplink**), усиливает и ретранслирует обратно (**downlink**). Классификация по высоте орбиты:", "- **GEO** (35 786 км) — неподвижен над экватором, покрывает ~1/3 Земли. Задержка ~270 мс. Применение: телевещание (DTH), VSAT.\n- **MEO** (2 000-20 000 км) — задержка 35-85 мс. Примеры: GPS, ГЛОНАСС, Galileo.\n- **LEO** (160-2 000 км) — задержка 5-20 мс. Нужны большие **группировки** (constellation): Starlink (5000+), OneWeb (~650).\n- **Спутники vs оптоволокно:** оптоволокно быстрее и надёжнее при наличии кабеля. Спутники незаменимы в труднодоступных местах и на море."], "terms": [{"ru": "GEO", "en": "Geostationary Earth Orbit", "df": "геостационарная орбита; высота 35 786 км, спутник неподвижен относительно Земли"}, {"ru": "MEO", "en": "Medium Earth Orbit", "df": "среднеорбитальная орбита; высота 2 000–20 000 км"}, {"ru": "LEO", "en": "Low Earth Orbit", "df": "низкая околоземная орбита; высота 160–2 000 км"}, {"ru": "Задержка распространения", "en": "propagation delay", "df": "время прохождения сигнала от источника до приёмника"}, {"ru": "Восходящий канал", "en": "uplink", "df": "канал от наземной станции к спутнику"}, {"ru": "Нисходящий канал", "en": "downlink", "df": "канал от спутника к наземной станции"}, {"ru": "VSAT", "en": "Very Small Aperture Terminal", "df": "малая спутниковая антенна для двустороннего доступа в Интернет"}, {"ru": "Группировка спутников", "en": "satellite constellation", "df": "совокупность спутников, обеспечивающих совместное глобальное покрытие"}, {"ru": "DTH", "en": "Direct-to-Home", "df": "технология прямого спутникового телевещания на абонентские тарелки"}], "summary": ["GEO: 35786 км, неподвижен, задержка ~270 мс, 1/3 Земли", "MEO: 2000-20000 км, задержка 35-85 мс, GPS/ГЛОНАСС", "LEO: 160-2000 км, задержка 5-20 мс, Starlink >5000 спутн", "Uplink (Земля->спутник), Downlink (спутник->Земля)", "GEO = ТВ/VSAT; LEO = широкополосный Интернет", "Оптоволокно > спутник по скорости/задержке, но спутник в море/горах"]}, {"n": 11, "title": "Цифровая модуляция и мультиплексирование. Низкочастотная передача. Передача в полосе пропускания. Частотное уплотнение. Мультиплексирование с разделением времени. Кодовое разделение каналов.", "paragraphs": ["- **Baseband** (низкочастотная передача) — сигнал от 0 до f_max. Коды: NRZ, Manchester, 4B/5B.\n- **Passband** (в полосе пропускания) — перенос сигнала на несущую частоту.\n- Виды модуляции: **ASK** (амплитуда), **FSK** (частота), **PSK** (фаза), **QAM** (амплитуда + фаза, наивысшая эффективность: QAM-64, QAM-256).", "**Мультиплексирование** (multiplexing) — несколько источников на одном канале:\n- **FDM** (Frequency Division Multiplexing) — каждому своя полоса частот. Телефон, ТВ, ADSL.", "- **TDM** (Time Division Multiplexing) — каждому свой временной слот. E1: 32 канала x 64 кбит/с = **2,048 Мбит/с**.\n- **CDMA** (Code Division Multiple Access) — все на одной частоте, но с уникальным **расширяющим кодом** (spreading code). Применяется в 3G и GPS."], "terms": [{"ru": "Модуляция", "en": "modulation", "df": "процесс изменения параметров несущего сигнала в соответствии с передаваемыми данными"}, {"ru": "NRZ", "en": "Non-Return-to-Zero", "df": "линейный код, в котором сигнал не возвращается к нулю между битами"}, {"ru": "QAM", "en": "Quadrature Amplitude Modulation", "df": "квадратурная амплитудная модуляция; одновременное изменение амплитуды и фазы"}, {"ru": "FDM", "en": "Frequency Division Multiplexing", "df": "частотное разделение каналов"}, {"ru": "TDM", "en": "Time Division Multiplexing", "df": "временно́е разделение каналов"}, {"ru": "CDMA", "en": "Code Division Multiple Access", "df": "кодовое разделение множественного доступа"}, {"ru": "Расширяющий код", "en": "spreading code", "df": "псевдослучайная последовательность для расширения спектра сигнала в CDMA"}, {"ru": "Спектральная эффективность", "en": "spectral efficiency", "df": "количество бит/с на 1 Гц полосы пропускания"}], "summary": ["Baseband (от 0): NRZ, Manchester, 4B/5B", "Passband (несущая): ASK, FSK, PSK, QAM", "QAM = амплитуда+фаза, лучшая спектр. эффективность", "FDM — каждому своя частота (ADSL, кабельное ТВ)", "TDM — временные слоты; E1: 32 канала = 2.048 Мбит/с", "CDMA — все на одной частоте, ортогональные коды (3G, GPS)"]}, {"n": 12, "title": "Коммутируемая телефонная сеть общего пользования. Структура телефонной системы.", "paragraphs": ["**PSTN** (Public Switched Telephone Network) — традиционная телефонная сеть. Использует коммутацию каналов (circuit switching): при звонке выделяется фиксированный путь на всё время разговора.", "**Структура PSTN (от абонента к магистрали):**\n- Абонент подключён витой парой к ближайшей **АТС** (Автоматическая Телефонная Станция, в англ. — CO, Central Office) — оборудование в районе, которое коммутирует звонки. Эта линия от абонента до АТС называется **local loop** (последняя миля).\n- Местные АТС соединяются через **транзитные** станции.\n- Транзитные станции соединяются через **магистральные** узлы.", "**Оцифровка голоса — PCM** (Pulse Code Modulation, стандарт G.711):\n- Голос оцифровывается 8000 раз в секунду, каждый отсчёт = 8 бит.\n- Итого: 8000 × 8 = **64 кбит/с** на один голосовой канал.", "**Объединение каналов между станциями:**\n- **E1** (Европа): 30 голосовых каналов = **2,048 Мбит/с**.\n- **T1** (США): 24 голосовых канала = **1,544 Мбит/с**.", "**Сигнализация** (управление вызовами: набор номера, соединение, разрыв) идёт по отдельной сети **SS7** (Signaling System 7, ОКС-7).", "**Современность:** PSTN постепенно заменяется технологиями **VoIP** (Voice over IP) и **IMS** (IP Multimedia Subsystem)."], "terms": [{"ru": "PSTN", "en": "Public Switched Telephone Network", "df": "коммутируемая телефонная сеть общего пользования"}, {"ru": "Коммутация каналов", "en": "circuit switching", "df": "метод, при котором перед передачей данных резервируется выделенный канал"}, {"ru": "АТС", "en": "автоматическая телефонная станция) / CO (Central Office", "df": "узел коммутации, обслуживающий группу абонентов"}, {"ru": "PCM", "en": "Pulse Code Modulation", "df": "импульсно-кодовая модуляция; метод оцифровки аналогового голоса"}, {"ru": "SS7 / ОКС-7", "en": "Signaling System 7", "df": "протокол сигнализации для управления телефонными вызовами в PSTN"}, {"ru": "VoIP", "en": "Voice over IP", "df": "технология передачи голоса по IP-сетям"}, {"ru": "POTS", "en": "Plain Old Telephone Service", "df": "традиционная аналоговая телефонная служба"}], "summary": ["PSTN = коммутация каналов, 64 кбит/с на голос (G.711)", "PCM: 8000 отсч/с * 8 бит = 64 кбит/с", "Иерархия: абонентская линия -> АТС -> транзитная -> магистр", "E1 = 2.048 Мбит/с (30 каналов), T1 = 1.544 Мбит/с (24)", "Сигнализация: ОКС-7 (SS7) — отдельная сеть управления", "Миграция: VoIP, IMS (IP Multimedia Subsystem)"]}, {"n": 13, "title": "Мобильная телефонная система. Поколения мобильных телефонов: аналоговая и цифровая передача информации.", "paragraphs": ["**Принцип сотовой связи:**\nТерритория делится на зоны — **соты** (cells). В каждой соте стоит **базовая станция** (BS, Base Station), которая обслуживает телефоны в своей зоне по радиоканалу. Когда абонент перемещается из одной соты в другую, связь автоматически переключается на новую станцию — это называется **хэндовер** (handover). Базовые станции соединены с контроллерами и далее с ядром сети (core network), которое связано с PSTN и Интернетом.", "**Поколения мобильной связи:**", "- **1G** (1980-е) — только аналоговый голос, без передачи данных. Стандарты: AMPS (США), NMT (Скандинавия). Легко прослушивается.", "- **2G** (1991) — переход на цифру. Стандарт GSM (Global System for Mobile Communications) использует TDMA и FDMA. Появились SMS. Передача данных: GPRS (2,5G, до 114 кбит/с), EDGE (2,75G, до 384 кбит/с).", "- **3G** (2001) — мобильный Интернет. Стандарт UMTS (WCDMA): до 2 Мбит/с, с HSPA+ до 42 Мбит/с.", "- **4G LTE** (2009) — полностью пакетная IP-сеть (без коммутации каналов). Технологии: OFDMA + MIMO. Скорости: 150–1000 Мбит/с.", "- **5G** (2019) — три сценария использования:\n  - **eMBB** (enhanced Mobile Broadband) — высокая скорость, до 20 Гбит/с.\n  - **URLLC** (Ultra-Reliable Low-Latency) — сверхнизкая задержка, менее 1 мс.\n  - **mMTC** (massive Machine-Type Communications) — массовое подключение IoT-устройств.\n  - Технологии: миллиметровые волны, Massive MIMO, network slicing."], "terms": [{"ru": "Сота", "en": "cell", "df": "географическая зона, обслуживаемая одной базовой станцией"}, {"ru": "Хэндовер", "en": "handover / handoff", "df": "переключение соединения между базовыми станциями при движении абонента"}, {"ru": "GSM", "en": "Global System for Mobile Communications", "df": "стандарт цифровой сотовой связи 2G"}, {"ru": "TDMA", "en": "Time Division Multiple Access", "df": "множественный доступ с разделением по времени (используется в GSM)"}, {"ru": "OFDMA", "en": "Orthogonal Frequency Division Multiple Access", "df": "множественный доступ на основе ортогонального частотного мультиплексирования (LTE, 5G)"}, {"ru": "MIMO", "en": "Multiple Input Multiple Output", "df": "технология с несколькими передающими и принимающими антеннами"}, {"ru": "eMBB", "en": "enhanced Mobile Broadband", "df": "сценарий 5G для высокоскоростного мобильного Интернета"}, {"ru": "URLLC", "en": "Ultra-Reliable Low-Latency Communication", "df": "сценарий 5G для критически важных приложений с малой задержкой"}, {"ru": "mMTC", "en": "massive Machine-Type Communications", "df": "сценарий 5G для массового подключения устройств IoT"}, {"ru": "GPRS", "en": "General Packet Radio Service", "df": "технология пакетной передачи данных в сетях GSM (2,5G)"}], "summary": ["Сотовая сеть: соты + BS + хэндовер, ядро -> PSTN/интернет", "1G (1980-е) = аналог (AMPS, NMT), уязвимо", "2G (1991) = GSM (TDMA+FDMA), SMS, GPRS до 114 кбит/с", "3G (2001) = UMTS/WCDMA до 2 Мбит/с, HSPA+ до 42 Мбит/с", "4G LTE (2009) = OFDMA+MIMO, 150-1000 Мбит/с, пакетная IP", "5G (2019): eMBB до 20 Гбит/с, URLLC <1 мс, mMTC (IoT)", "5G: mmWave, Massive MIMO, network slicing"]}, {"n": 14, "title": "Характеристики физических каналов связи. Типы каналов связи.", "paragraphs": ["**Основные характеристики канала:**\n- **Полоса пропускания** (bandwidth, Гц) — диапазон частот канала.\n- **Пропускная способность** (throughput, бит/с) — реальная скорость передачи.\n- **Задержка** (latency) — время прохождения сигнала.\n- **Затухание** (attenuation) — ослабление сигнала.\n- **SNR** (Signal-to-Noise Ratio) — определяет предел по Шеннону. **BER** (Bit Error Rate) — доля ошибочных бит.", "**По типу сигнала:** аналоговые и цифровые.", "**По режиму передачи:**\n- **Симплекс** (simplex) — только в одном направлении.\n- **Полудуплекс** (half-duplex) — попеременно в обоих.\n- **Дуплекс** (full-duplex) — одновременно в обоих.", "**По среде:** проводные (витая пара, коаксиал, оптоволокно) и беспроводные (радио, ИК, спутник).", "**Дополнительно:** **замирания** (fading) в беспроводных каналах из-за **многолучевого распространения** (multipath). **Дисперсия** — уширение импульсов в оптоволокне. **Джиттер** (jitter) — вариация задержки."], "terms": [{"ru": "Полоса пропускания", "en": "bandwidth", "df": "диапазон частот, в котором канал обеспечивает передачу (в Гц)"}, {"ru": "Пропускная способность", "en": "throughput", "df": "реальная скорость передачи данных по каналу (бит/с)"}, {"ru": "Задержка / латентность", "en": "latency / delay", "df": "время от отправки до получения сигнала"}, {"ru": "Затухание", "en": "attenuation", "df": "уменьшение амплитуды/мощности сигнала при распространении по среде"}, {"ru": "SNR", "en": "Signal-to-Noise Ratio", "df": "отношение мощности сигнала к мощности шума"}, {"ru": "BER", "en": "Bit Error Rate", "df": "коэффициент ошибок по битам; доля ошибочно принятых бит"}, {"ru": "Симплекс", "en": "simplex", "df": "передача только в одном направлении"}, {"ru": "Полудуплекс", "en": "half-duplex", "df": "попеременная передача в двух направлениях"}, {"ru": "Дуплекс", "en": "full-duplex", "df": "одновременная двусторонняя передача"}, {"ru": "Замирание", "en": "fading", "df": "случайное изменение уровня сигнала в беспроводных каналах"}, {"ru": "Многолучевое распространение", "en": "multipath propagation", "df": "приход сигнала по нескольким путям с разными задержками; причина замираний и ISI"}, {"ru": "Дисперсия", "en": "dispersion", "df": "уширение светового импульса в оптоволокне из-за различных скоростей мод/длин волн"}, {"ru": "Джиттер", "en": "jitter", "df": "вариация задержки доставки пакетов во времени"}], "summary": ["Характеристики: полоса (Гц), throughput (бит/с), задержка", "Затухание, SNR, BER (доля ошибочных бит)", "Шеннон: C = B log2(1+SNR) — теоретический предел", "Simplex/half-duplex/full-duplex — режимы передачи", "Аналоговые (непрерывный) vs цифровые (дискретный) каналы", "Проводные (витая пара, коаксиал, оптика) vs беспроводные", "Fading = замирания (multipath), дисперсия, джиттер"]}], "quizzes": [{"type": "mcq", "topic": "Вопрос 7", "q": "Какова формула теоремы Найквиста для максимальной скорости передачи данных по идеальному каналу без шума?", "opts": ["C = B log₂(1 + S/N)", "C = 2B log₂V", "C = B log₂V", "C = 2B log₂(1 + S/N)"], "ans": 1, "expl": "Теорема Найквиста: C = 2B log₂V, где B — полоса пропускания (Гц), V — число различимых уровней сигнала."}, {"type": "mcq", "topic": "Вопрос 7", "q": "Какова формула теоремы Шеннона для зашумлённого канала?", "opts": ["C = 2B log₂V", "C = B log₂(S/N)", "C = B log₂(1 + S/N)", "C = 2B log₂(1 + S/N)"], "ans": 2, "expl": "Теорема Шеннона: C = B log₂(1 + S/N), где S/N — отношение сигнал/шум."}, {"type": "mcq", "topic": "Вопрос 7", "q": "Сколько максимально отсчётов в секунду можно передать через канал с полосой B Гц (по Найквисту)?", "opts": ["B отсчётов", "2B отсчётов", "B² отсчётов", "4B отсчётов"], "ans": 1, "expl": "Если сигнал ограничить полосой B Гц, то через канал можно передать не более 2B отсчётов в секунду."}, {"type": "mcq", "topic": "Вопрос 7", "q": "Что означает аббревиатура SNR?", "opts": ["Signal Noise Resistance", "Signal-to-Noise Ratio", "System Network Rate", "Spectral Nyquist Resolution"], "ans": 1, "expl": "SNR — Signal-to-Noise Ratio  "expl": "Определения из раздела терминологии Вопроса 7."}, {"type": "mcq", "topic": "Вопрос 8", "q": "Какие категории витой пары упоминаются для Ethernet со скоростями до 10 Гбит/с?", "opts": ["Cat3, Cat4, Cat5, Cat6", "Cat5e, Cat6, Cat6a, Cat7", "Cat5, Cat6, Cat7, Cat8", "Cat4, Cat5e, Cat6a, Cat8"], "ans": 1, "expl": "UTP используется в Ethernet категорий Cat5e, Cat6, Cat6a, Cat7 со скоростями до 10 Гбит/с."}, {"type": "mcq", "topic": "Вопрос 8", "q": "Что означает аббревиатура UTP?", "opts": ["Universal Twisted Pair", "Unshielded Twisted Pair", "Unified Transmission Protocol", "Ultra-Thin Polymer"], "ans": 1, "expl": "UTP — Unshielded Twisted Pair — неэкранированная витая пара."}, {"type": "mcq", "topic": "Вопрос 8", "q": "Какой тип волокна используется для дальних расстояний (до сотен километров)?", "opts": ["Многомодовое волокно (MMF)", "Одномодовое волокно (SMF)", "Пластиковое волокно (POF)", "Градиентное волокно"], "ans": 1, "expl": "Одномодовое волокно (single-mode fiber, SMF) используется для дальних расстояний (до сотен километров)."}, {"type": "mcq", "topic": "Вопрос 8", "q": "Что означает аббревиатура DOCSIS?", "opts": ["Data Over Cable Service Interface Specification", "Digital Optical Cable Signal Interface Standard", "Data Oriented Communication System for Internet Services", "Distributed Optical Channel Switching Interface System"], "ans": 0, "expl": "DOCSIS — Data Over Cable Service Interface Specification — стандарт широкополосного Интернета по коаксиальному кабелю."}, {"type": "mcq", "topic": "Вопрос 8", "q": "Что означает аббревиатура PLC в контексте передачи данных?", "opts": ["Programmable Logic Controller", "Power Line Communication", "Parallel Link Connection", "Physical Layer Coding"], "ans": 1, "expl": "PLC — Power Line Communication — технология передачи данных по электрической сети."}, {"type": "tf", "topic": "Вопрос 8", "q": "Скручивание проводников в витой паре снижает электромагнитные помехи (EMI) и перекрёстные наводки (crosstalk).", ерсия (dispersion) в контексте оптоволокна?", "opts": ["Рассеяние света в атмосфере", "Уширение импульсов в оптоволокне из-за различных скоростей мод", "Ослабление мощности сигнала", "Изменение частоты сигнала при передаче"], "ans": 1, "expl": "Дисперсия (dispersion) — уширение светового импульса в оптоволокне из-за различных скоростей мод/длин волн."}, {"type": "mcq", "topic": "Вопрос 14", "q": "Что является причиной замираний (fading) в беспроводных каналах?", "opts": ["Дисперсия в оптоволокне", "Многолучевое распространение (multipath propagation) и движение объектов", "Электромагнитные помехи от медных кабелей", "Квантование сигнала"], "ans": 1, "expl": "Уровень сигнала изменяется вследствие многолучевого распространения (multipath propagation) и движения объектов."}, {"type": "tf", "topic": "Вопрос 14", "q": "Симплексный канал поддерживает попеременную передачу в обоих направлениях.", "ans": false, "expl": "Симплекс — передача только в ОДНОМ направлении. Попеременная передача — это полудуплекс."}, {"type": "tf", "topic": "Вопрос 14", "q": "Каналы с замираниями (fading channels) характерны для беспроводных каналов.", "ans": true, "expl": "Каналы с замираниями — беспроводные каналы, в которых уровень сигнала изменяется."}, {"type": "tf", "topic": "Вопрос 14", "q": "EMI (электромагнитные помехи) характерны для оптоволоконных кабелей.", "ans": false, "expl": "EMI характерны для МЕДНЫХ кабелей, а не оптоволоконных."}, {"type": "tf", "topic": "Вопрос 14", "q": "Проводные каналы являются каналами с постоянными параметрами.", "ans": true, "expl": "Каналы с постоянными параметрами — проводные, каналы с замираниями — беспроводные."}, {"type": "match", "topic": "Вопрос 14", "q": "Сопоставьте режим передачи с описанием:", "pairs": [{"l": "Симплекс (simplex)", "r": "Передача только в одном направлении"}, {"l": "Полудуплекс (half-duplex)", "r": "Попеременная передача в обоих направлениях"}, {"l": "Дуплекс (full-duplex)", "r": "Одновременная двусторонняя передача"}], "expl": "Режимы передачи из Вопроса 14."}, {"type": "match", "topic": "Вопрос 14", "q": "Сопоставьте характеристику канала с её определением:", "pairs": [{"l": "Полоса пропускания (bandwidth)", "r": "Диапазон частот без значительного ослабления (Гц)"}, {"l": "Пропускная способность (throughput)", "r": "Реальная скорость передачи данных (бит/с)"}, {"l": "Задержка (latency)", "r": "Время прохождения сигнала по каналу"}, {"l": "Затухание (attenuation)", "r": "Ослабление мощности сигнала на единицу длины"}, {"l": "BER (Bit Error Rate)", "r": "Доля ошибочно принятых бит"}], "expl": "Основные характеристики физического канала связи из Вопроса 14."}, {"type": "match", "topic": "Вопрос 14", "q": "Сопоставьте дополнительную характеристику с описанием:", "pairs": [{"l": "Дисперсия (dispersion)", "r": "Уширение импульсов в оптоволокне"}, {"l": "Джиттер (jitter)", "r": "Вариация задержки доставки во времени"}, {"l": "Замирание (fading)", "r": "Случайное изменение уровня сигнала в беспроводных каналах"}, {"l": "Многолучевое распространение", "r": "Приход сигнала по нескольким путям с разными задержками"}], "expl": "Дополнительные характеристики из Вопроса 14."}]}, {"id": 3, "name": "Канальный уровень сетевого стека", "questions": [{"n": 15, "title": "Ключевые аспекты и особенности организации канального уровня. Сервисы, предоставляемые сетевому уровню. Формирование кадра. Обработка ошибок. Управление потоком.", "paragraphs": ["**Канальный уровень** (Data Link Layer, уровень 2 OSI) — отвечает за передачу данных между двумя соседними узлами, соединёнными напрямую. Он берёт пакет от сетевого уровня, оборачивает его в **кадр** (frame) — добавляет заголовок и трейлер — и отправляет через физическую среду.", "**Три класса сервисов для сетевого уровня:**\n- **Ненадёжная доставка без подтверждений** — кадры отправляются без проверки, потери не отслеживаются. Используется в надёжных каналах (например, Ethernet).\n- **Надёжная доставка без соединения** — каждый кадр подтверждается (ACK), но предварительное соединение не устанавливается. Используется в ненадёжных каналах (например, Wi-Fi).\n- **Надёжная доставка с соединением** — сначала устанавливается соединение, затем передача с подтверждениями, затем разрыв.", "**Формирование кадра** — как получатель понимает, где начинается и заканчивается кадр в потоке битов? Четыре метода:\n- **Счётчик символов** — в заголовке указана длина кадра.\n- **Флаговые байты + байт-стаффинг** (byte stuffing) — специальный байт-разделитель между кадрами. Если такой же байт встречается внутри данных, перед ним вставляется ESC-байт.\n- **Флаговые биты + бит-стаффинг** (bit stuffing) — разделитель 01111110. Чтобы он не появился случайно в данных, после пяти единиц подряд вставляется ноль. Используется в протоколе HDLC (High-level Data Link Control) — классический протокол канального уровня (ISO 13239), на основе которого построены PPP и Frame Relay.\n- **Нарушение физического кодирования** — использование недопустимых сигналов на линии как маркеров границ кадра.", "**Обработка ошибок** — два подхода:\n- **ARQ** (Automatic Repeat reQuest) — получатель обнаружил ошибку → запрашивает повтор.\n- **FEC** (Forward Error Correction) — получатель сам исправляет ошибку по избыточным битам, без повтора.", "**Управление потоком** (flow control) — не даёт быстрому отправителю переполнить буфер медленного получателя. Получатель сообщает отправителю, когда можно посылать следующие кадры."], "terms": [{"ru": "Канальный уровень", "en": "data link layer", "df": "второй уровень модели OSI, отвечает за передачу кадров между соседними узлами"}, {"ru": "Кадр", "en": "frame", "df": "единица данных канального уровня, содержит заголовок, полезную нагрузку и трейлер"}, {"ru": "Инкапсуляция", "en": "encapsulation", "df": "упаковка данных вышестоящего уровня в структуру нижестоящего уровня"}, {"ru": "Байт-стаффинг", "en": "byte stuffing", "df": "вставка escape-байта перед специальными символами внутри кадра"}, {"ru": "Бит-стаффинг", "en": "bit stuffing", "df": "вставка нулевого бита после пяти подряд идущих единиц"}, {"ru": "ARQ", "en": "Automatic Repeat reQuest", "df": "автоматический запрос повторной передачи при обнаружении ошибки"}, {"ru": "FEC", "en": "Forward Error Correction", "df": "упреждающая коррекция ошибок без запроса повтора"}, {"ru": "Управление потоком", "en": "flow control", "df": "механизм согласования скоростей отправителя и получателя"}], "summary": ["Канальный ур. (data link) = ур.2 OSI, кадры между соседними узлами", "3 сервиса: ненадёжн. без ACK, надёжн. без соед., надёжн. с соед.", "Формиров. кадра: счётчик, флаг+байт-стаффинг, бит-стаффинг, наруш. кодир.", "Бит-стаффинг (HDLC): после 5 единиц вставляется 0", "Ошибки: ARQ (запрос повтора) или FEC (упрежд. коррекция)", "Управл. потоком (flow control): обратная связь от получателя"]}, {"n": 16, "title": "Коды с исправлением ошибок. Коды с обнаружением ошибок.", "paragraphs": ["**Идея:** к данным добавляют лишние (избыточные) биты. Если их хватает только чтобы заметить ошибку — это **код с обнаружением**. Если хватает чтобы найти и исправить — это **код с исправлением** (FEC).", "**Кодовое расстояние Хэмминга** (Hamming distance) — в скольких битах различаются два допустимых кодовых слова.\n- Чтобы **обнаружить** d ошибок → расстояние ≥ d + 1.\n- Чтобы **исправить** d ошибок → расстояние ≥ 2d + 1.", "**Коды с исправлением ошибок (FEC):**\n- **Код Хэмминга** (Hamming code) — исправляет одиночные ошибки. Контрольные биты стоят на позициях-степенях двойки (1, 2, 4, 8…). Формула: для m информационных битов нужно r контрольных, где 2^r ≥ m + r + 1.\n- **Свёрточные коды** (convolutional codes) — кодер использует текущий и предыдущие биты (имеет «память»). Применяются при сильных помехах, например в Wi-Fi (802.11).\n- **Код Рида-Соломона** (Reed-Solomon) — работает с символами, а не отдельными битами. Хорошо справляется с пакетными ошибками. Используется в DSL и оптических сетях.", "**Коды с обнаружением ошибок:**\n- **Бит чётности** (parity bit) — один дополнительный бит; обнаруживает одиночную ошибку.\n- **Двумерный бит чётности** — биты организованы в матрицу с чётностью по строкам и столбцам. Может обнаружить и исправить одиночные ошибки.\n- **Контрольная сумма** (checksum) — сумма 16-битовых слов. Используется в TCP/IP.\n- **CRC** (Cyclic Redundancy Check) — деление сообщения на порождающий полином. Стандарты CRC-16 и CRC-32 обнаруживают все пакетные ошибки длиной до r бит. Самый распространённый метод в сетях."], "terms": [{"ru": "Избыточные биты", "en": "redundant bits", "df": "дополнительные биты, добавляемые для обнаружения/исправления ошибок"}, {"ru": "Кодовое расстояние Хэмминга", "en": "Hamming distance", "df": "число позиций, в которых два кодовых слова различаются"}, {"ru": "Код Хэмминга", "en": "Hamming code", "df": "линейный код с исправлением одиночных ошибок"}, {"ru": "Свёрточный код", "en": "convolutional code", "df": "код, в котором выходные символы зависят от текущего и предыдущих входных символов"}, {"ru": "Код Рида-Соломона", "en": "Reed-Solomon code", "df": "блочный код, работающий с символами, стойкий к пакетным ошибкам"}, {"ru": "Бит чётности", "en": "parity bit", "df": "контрольный бит, обеспечивающий чётное (или нечётное) число единиц"}, {"ru": "CRC", "en": "Cyclic Redundancy Check", "df": "циклический избыточный код, основанный на полиномиальном делении"}, {"ru": "Порождающий полином", "en": "generator polynomial", "df": "полином, на который делится сообщение при вычислении CRC"}, {"ru": "Пакетная ошибка", "en": "burst error", "df": "последовательность подряд идущих ошибочных битов"}], "summary": ["Хэмминг: обнаруж. d ошибок -> расст. d+1; исправл. d -> расст. 2d+1", "Код Хэмминга: контр. биты на 2^i; 2^r >= m+r+1", "Свёрточный код (convolutional): выход зависит от текущ.+предыд. битов", "Рид-Соломон (Reed-Solomon): блочный код на символах, DSL/оптика", "CRC: деление полинома в GF(2); CRC-32 ловит пакетн. ошибки до r бит", "Бит чётности (parity): 1 ошибка; 2D-parity: исправл. 1 ошибку"]}, {"n": 17, "title": "Элементарные протоколы: симплексный протокол «Утопия», симплексный протокол с ожиданием для канала без ошибок, симплексный протокол с ожиданием для зашумлённых каналов.", "paragraphs": ["Три учебных протокола канального уровня. Все — симплексные (данные идут только в одну сторону). Каждый следующий протокол добавляет одну новую возможность.", "**1. «Утопия» (Utopia)** — идеальный, нереальный протокол:\n- Канал без ошибок, получатель всегда готов принять.\n- Отправитель просто шлёт кадры один за другим без остановки.\n- Нет управления потоком, нет обработки ошибок.\n- На практике невозможен — служит отправной точкой.", "**2. Стоп-и-жди (stop-and-wait) для канала без ошибок:**\n- Проблема: получатель не успевает обработать — нужно управление потоком.\n- Решение: отправитель послал кадр → ждёт **ACK** от получателя → только потом шлёт следующий.\n- Ошибок в канале нет, поэтому обработка ошибок не нужна.", "**3. PAR (Positive Acknowledgement with Retransmission) для зашумлённых каналов:**\n- Проблема: кадры или ACK могут потеряться.\n- Решения (три механизма):\n  - **Нумерация кадров** (достаточно 1 бита: 0 и 1) — чтобы отличить новый кадр от дубликата.\n  - **Таймер** — если ACK не пришёл вовремя, кадр отправляется повторно.\n  - **Проверка дубликатов** — получатель видит повтор → отбрасывает, но снова шлёт ACK.\n- Это основа всех более сложных протоколов (скользящее окно)."], "terms": [{"ru": "Симплекс", "en": "simplex", "df": "передача данных только в одном направлении"}, {"ru": "Протокол «Утопия»", "en": "Utopia protocol", "df": "идеальный протокол без ошибок и без управления потоком"}, {"ru": "ACK", "en": "Acknowledgement", "df": "подтверждение успешного получения кадра"}, {"ru": "Стоп-и-жди", "en": "stop-and-wait", "df": "режим, при котором отправитель ждёт подтверждения перед отправкой следующего кадра"}, {"ru": "Таймер", "en": "timer/retransmission timer", "df": "механизм отсчёта времени ожидания подтверждения"}, {"ru": "PAR", "en": "Positive Acknowledgement with Retransmission", "df": "подтверждение с повторной передачей при отсутствии ACK"}, {"ru": "Дубликат кадра", "en": "duplicate frame", "df": "повторно переданный кадр с уже использованным номером последовательности"}, {"ru": "Зашумлённый канал", "en": "noisy channel", "df": "канал, в котором возможны искажения и потери битов"}], "summary": ["Утопия (Utopia): канал без ошибок, буфер inf, нет flow control", "Stop-and-wait без ошибок: отправил кадр -> жди ACK -> след. кадр", "PAR (зашумл. канал): нумерация 1 бит (0/1) + таймер + повтор", "Дубликат: получатель проверяет номер, отбрасывает повтор, шлёт ACK", "Все 3 протокола симплексные (simplex) - данные в одну сторону", "PAR - предшественник протоколов скользящего окна"]}, {"n": 18, "title": "Протоколы скользящего окна. Протокол однобитового скользящего окна. Протокол с возвратом на N. Протокол с выборочным повтором.", "paragraphs": ["**Идея скользящего окна** (sliding window): вместо того чтобы ждать ACK после каждого кадра (как в стоп-и-жди), отправитель может послать сразу несколько кадров подряд. «Окно» размером W — это сколько кадров можно отправить без подтверждения. Когда приходит ACK — окно сдвигается вперёд.", "**1. Однобитовое окно** (1-bit sliding window):\n- Окно = 1 у обоих сторон, эквивалент протокола PAR (не стоп-и-жди, так как есть нумерация кадров, таймер и обработка дубликатов).\n- Послал кадр 0 → ждёшь ACK → послал кадр 1 → ждёшь ACK.\n- Медленно, если канал длинный (много времени тратится на ожидание).", "**2. Go-Back-N (GBN)** — возврат на N:\n- Отправитель может послать до N кадров без подтверждения.\n- Получатель принимает кадры **только по порядку** (буфер = 1).\n- Если кадр потерялся — отправитель повторяет его **и все последующие**.\n- Недостаток: много лишних повторов при плохом канале.\n- Макс. размер окна: **2^n − 1** (n — число бит для нумерации).", "**3. Selective Repeat (SR)** — выборочный повтор:\n- Получатель **буферизует** кадры, пришедшие не по порядку.\n- Отправитель повторяет **только потерянный кадр**, а не все подряд.\n- **NAK** (Negative ACK) — получатель сообщает, какой именно кадр пропал → повтор без ожидания таймера.\n- Макс. размер окна: **2^(n−1)** (вдвое меньше, чем у GBN, иначе нельзя отличить новый кадр от повтора).", "**Сравнение:**\n- **1-bit (PAR)**: окно = 1, есть обработка ошибок, но медленно (ждём ACK после каждого кадра).\n- **GBN**: окно до 2^n−1, буфер получателя = 1, при ошибке повторяет всё начиная с потерянного.\n- **SR**: окно до 2^(n−1), буфер нужен и у отправителя и у получателя, но повторяет только потерянный кадр."], "terms": [{"ru": "Скользящее окно", "en": "sliding window", "df": "механизм, позволяющий передавать несколько кадров до получения подтверждения"}, {"ru": "Окно отправителя", "en": "sender window", "df": "множество кадров, разрешённых к отправке без подтверждения"}, {"ru": "Произведение пропускной способности на задержку", "en": "bandwidth-delay product", "df": "число бит «в полёте» в канале в данный момент"}, {"ru": "Возврат на N", "en": "Go-Back-N", "df": "стратегия, при которой повторяются N кадров начиная с ошибочного"}, {"ru": "Выборочный повтор", "en": "Selective Repeat", "df": "стратегия, при которой повторяется только конкретный утерянный кадр"}, {"ru": "NAK", "en": "Negative Acknowledgement", "df": "отрицательное подтверждение, сигнализирует об ошибке конкретного кадра"}, {"ru": "Буферизация не по порядку", "en": "out-of-order buffering", "df": "сохранение кадров, пришедших раньше ожидаемых"}, {"ru": "Номер последовательности", "en": "sequence number", "df": "порядковый номер кадра для идентификации и упорядочивания"}], "summary": ["Скольз. окно (sliding window): W кадров без подтверждения", "1-bit window = эквивалент PAR, неэфф. при больш. BD-product", "Go-Back-N: буфер получателя=1, повтор с ошибочного+все след.", "GBN: макс. окно = 2^n - 1 при n-бит нумерации", "Selective Repeat: буфер у получ., повтор только потерянного", "SR: макс. окно = 2^(n-1) при n-бит нумерации", "NAK (отриц. подтверждение) ускоряет повтор в SR"]}, {"n": 19, "title": "Примеры протоколов передачи данных: SONET, ADSL.", "paragraphs": ["**SONET / SDH** — стандарт передачи данных по оптоволокну. SONET используется в Америке, SDH — в Европе. Это одна и та же технология с разными названиями.", "**Что нужно знать о SONET:**\n- Все узлы синхронизированы по единому времени — поэтому называется «синхронная» сеть.\n- **OC** означает «Optical Carrier» — уровень скорости оптического канала. Число после OC показывает, во сколько раз скорость больше базовой.\n- Базовая скорость **OC-1 = 51,84 Мбит/с** (один фрейм = 810 байт × 8000 фреймов/с).\n- Чтобы получить более высокую скорость, несколько каналов OC-1 объединяются вместе:\n  - **OC-3** = 3 × OC-1 = **155 Мбит/с**\n  - **OC-12** = 12 × OC-1 = **622 Мбит/с**\n  - **OC-48** = 48 × OC-1 = **2,5 Гбит/с**\n  - **OC-192** = 192 × OC-1 = **10 Гбит/с**", "**ADSL** (Asymmetric Digital Subscriber Line) — технология, которая позволяет передавать Интернет по обычному телефонному проводу (медная витая пара).", "**Почему «асимметричная»:** скорость скачивания (downstream) выше, чем скорость отправки (upstream):\n- Скачивание (downstream): до **~8 Мбит/с**.\n- Отправка (upstream): до **~1 Мбит/с**.", "**Как работает ADSL (метод DMT — Discrete MultiTone):**\n- Провод может передавать частоты до 1,1 МГц. Эта полоса делится на **256 подканалов** (каждый шириной 4312,5 Гц).\n- Подканал 0 — оставлен для обычного телефона (**POTS** — Plain Old Telephone Service).\n- Подканалы 1–5 — защитная зона (чтобы голос и данные не мешали друг другу).\n- Подканалы 6–30 — для отправки данных (upstream).\n- Подканалы 31–255 — для скачивания данных (downstream) — их больше, поэтому скорость выше.\n- В каждом подканале используется модуляция **QAM**, причём количество бит подстраивается под качество линии на этой частоте.\n- **Сплиттер** (splitter) — фильтр, который стоит у абонента и разделяет голосовой сигнал (телефон) от высокочастотного (Интернет)."], "terms": [{"ru": "SONET/SDH", "en": "Synchronous Optical Network / Synchronous Digital Hierarchy", "df": "синхронные стандарты передачи данных по оптоволокну"}, {"ru": "STS-1 / OC-1", "en": "Synchronous Transport Signal / Optical Carrier", "df": "базовый уровень SONET, 51,84 Мбит/с"}, {"ru": "ADSL", "en": "Asymmetric Digital Subscriber Line", "df": "асимметричная цифровая абонентская линия по медной паре"}, {"ru": "DMT", "en": "Discrete MultiTone", "df": "многочастотное мультиплексирование с разделением полосы на подканалы"}, {"ru": "QAM", "en": "Quadrature Amplitude Modulation", "df": "квадратурная амплитудная модуляция"}, {"ru": "POTS", "en": "Plain Old Telephone Service", "df": "традиционная аналоговая телефония"}, {"ru": "Сплиттер", "en": "splitter", "df": "фильтр, разделяющий голосовой и высокочастотный трафик в ADSL"}, {"ru": "Нисходящий / восходящий поток", "en": "downstream / upstream", "df": "передача к пользователю / от пользователя"}], "summary": ["SONET: STS-1 = 810 байт * 8000 фр/с = 51.84 Мбит/с (OC-1)", "SONET мультиплекс: OC-3=155, OC-12=622, OC-48=2.5G, OC-192=10G", "SONET: синхронная передача, указатель (pointer) для расхождений", "ADSL: DMT - 256 подканалов по 4312.5 Гц до 1.1 МГц", "ADSL: down до ~8 Мбит/с, up до ~1 Мбит/с (асимметрия)", "ADSL подканалы: 0=POTS, 1-5=защита, 6-30=up, 31-255=down", "Каждый подканал - QAM, адаптация к качеству линии"]}, {"n": 20, "title": "Обобщённая задача коммутации. Коммутация каналов и пакетов. Маршрутизация.", "paragraphs": ["**Задача:** множество устройств хотят передавать данные друг другу через общую сеть. Как доставить данные от отправителя к получателю? Есть два принципиально разных подхода — **коммутация каналов** и **коммутация пакетов**.", "**1. Коммутация каналов** (circuit switching) — как телефонный звонок:\n- Перед передачей данных создаётся **выделенный путь** от отправителя до получателя.\n- Этот путь занят на всё время разговора, даже если никто не говорит.\n- Пример: традиционная телефонная сеть (PSTN).\n- Плюс: гарантированная скорость и постоянная задержка.\n- Минус: если линия молчит — ресурсы всё равно заняты (неэффективно).", "**2. Коммутация пакетов** (packet switching) — как почта:\n- Данные разрезаются на **пакеты**. Каждый пакет содержит адрес получателя.\n- Пакеты отправляются в сеть, и каждый промежуточный узел решает, куда его передать дальше.\n- Путь не резервируется — линии используются совместно многими пользователями.\n- Плюс: эффективно при неравномерной нагрузке, устойчиво к отказам.\n- Два варианта:\n  - **Виртуальные каналы** — путь выбирается один раз при установке соединения, все пакеты идут по нему (примеры: ATM, Frame Relay).\n  - **Дейтаграммы** — каждый пакет маршрутизируется независимо, может пойти разными путями (пример: IP).", "**Коммутация vs маршрутизация — в чём разница?**\n- **Коммутация** (switching) — это **механизм доставки**: как именно данные передаются через сеть (по выделенному каналу или пакетами).\n- **Маршрутизация** (routing) — это **выбор пути**: по какому маршруту пакет пойдёт от отправителя к получателю.\n- Маршрутизация нужна только при коммутации пакетов (при коммутации каналов путь выбирается один раз при установке соединения).\n- Алгоритмы маршрутизации бывают **статические** (таблица задана вручную, не меняется) и **динамические** (таблица обновляется автоматически при изменениях в сети).", "**Устройства:**\n- **Мосты и коммутаторы** (bridges, switches) — работают на канальном уровне (L2), перенаправляют кадры по MAC-адресам внутри одной сети.\n- **Маршрутизаторы** (routers) — работают на сетевом уровне (L3), выбирают путь между разными сетями по IP-адресам."], "terms": [{"ru": "Коммутация каналов", "en": "circuit switching", "df": "соединение с резервированием ресурсов на время сеанса"}, {"ru": "Коммутация пакетов", "en": "packet switching", "df": "передача независимых пакетов через разделяемую сеть"}, {"ru": "Виртуальный канал", "en": "virtual circuit", "df": "логический путь, установленный для групп
