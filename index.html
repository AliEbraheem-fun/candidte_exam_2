AC-адресам"}, {"ru": "Коммутатор", "en": "switch", "df": "многопортовый мост (L2) с аппаратной обработкой"}, {"ru": "STP / RSTP / MSTP", "en": "Spanning Tree Protocol, IEEE 802.1D/w/s", "df": "протоколы остовного дерева"}, {"ru": "BPDU", "en": "Bridge Protocol Data Unit", "df": "служебный кадр STP"}, {"ru": "Повторитель", "en": "repeater", "df": "устройство L1 для регенерации сигнала"}, {"ru": "Концентратор", "en": "hub", "df": "многопортовый повторитель (L1)"}, {"ru": "Маршрутизатор", "en": "router", "df": "устройство L3, передаёт пакеты по IP-адресам"}, {"ru": "Шлюз", "en": "gateway", "df": "устройство L4–L7 для преобразования протоколов"}, {"ru": "VLAN", "en": "Virtual LAN, IEEE 802.1Q", "df": "виртуальная локальная сеть"}], "summary": ["**L2-коммутация (bridging)** — пересылка кадров Ethernet/802.11 между сегментами **по MAC-адресам**; прозрачно для устройств", "**Мост** (bridge, IEEE 802.1D): принимает кадр → проверяет CRC → ищет MAC в **CAM-таблице** → пересылает", "Неизвестный/broadcast/multicast → **flooding** (на все порты кроме входного)", "**Backward learning**: «MAC X → порт k» с **age timer ~300 с**; таблица автоматическая", "**Петли в избыточной топологии** → broadcast-шторм, сеть «ложится»", "**STP** (802.1D, **Perlman 1985**): мосты обмениваются **BPDU**, выбирают **Root Bridge** (минимальный Bridge ID)", "Порты: **Root Port** (к Root), **Designated Port** (на сегменте), **Blocking** (слушает BPDU)", "Сходимость STP 30–50 с; **RSTP** (802.1w) <1 с; **MSTP** (802.1s) — отдельное дерево на VLAN", "**Устройства по уровням OSI**:", "**L1**: **repeater** (регенерация сигнала), **hub** (многопортовый, один collision/broadcast домен, CSMA/CD полудуплекс)", "**L2**: **bridge/switch** — каждый порт отдельный collision domain, full-duplex; разделяет коллизии, общий broadcast", "**L3**: **router** — по IP-адресам, **разделяет broadcast-домены**; **L3-switch** — аппаратный L3 в ASIC", "**L4–L7**: **gateway** — преобразование протоколов (SIP↔H.323, SMTP↔X.400, NAT, email)", "**VLAN** (IEEE 802.1Q) — логическое деление коммутатора на изолированные сети с отдельными broadcast-доменами", "**Тег 802.1Q** (4 байта, между SA и EtherType): **TPID 0x8100** (16б) + **PCP** 3б (8 приоритетов CoS, 802.1p) + **DEI** 1б + **VID** 12б (0–4095, до 4094 рабочих)", "Типы портов: **Access** (одна VLAN, нетегированные); **Trunk** (между коммутаторами, теги сохраняются); **Native VLAN** — нетегированная на транке", "**Q-in-Q (802.1ad)** — двойное тегирование (operator+customer); **VXLAN** (RFC 7348) — 24-битный VNI, L2 поверх IP/UDP, для ДЦ/облаков", "Режимы коммутатора: **Store-and-forward** (CRC, потом forward), **Cut-through** (forward сразу после адреса), **Fragment-free** (первые 64 байта)"]}], "quizzes": [{"type": "mcq", "topic": "Вопрос 21", "q": "Каков главный недостаток статического распределения канала (FDM/TDM)?", "opts": ["Высокая вероятность коллизий", "Сложность реализации", "Если станция молчит, её ресурс простаивает", "Низкая скорость переключения между каналами"], "ans": 2, "expl": "Недостаток статического распределения: если станция молчит, её ресурс простаивает."}, {"type": "tf", "topic": "Вопрос 21", "q": "Среди допущений динамического распределения каналов указана зависимость трафика между станциями.", "ans": false, "expl": "Одно из допущений — независимый трафик: станции генерируют кадры независимо друг от друга."}, {"type": "mcq", "topic": "Вопрос 22", "q": "Какова максимальная пропускная способность чистой ALOHA?", "opts": ["36,8%", "50%", "18,4%", "25%"], "ans": 2, "expl": "Максимальная пропускная способность чистой ALOHA — 18,4%."}, {"type": "tf", "topic": "Вопрос 22", "q": "Максимальная пропускная способность слотированной ALOHA вдвое выше, чем чистой ALOHA, и составляет 36,8%.", "ans": true, "expl": "Чистая ALOHA — 18,4%, слотированная ALOHA — 36,8%, что ровно вдвое больше."}, {"type": "mcq", "topic": "Вопрос 22", "q": "Какой протокол решает проблему скрытого узла в беспроводных сетях?", "opts": ["CSMA/CD", "Token Ring", "MACA (с использованием RTS/CTS)", "Побитовая карта"], "ans": 2, "expl": "MACA решает проблему скрытого узла: отправитель посылает RTS, получатель отвечает CTS."}, {"type": "mcq", "topic": "Вопрос 23", "q": "Каков минимальный размер кадра Ethernet?", "opts": ["32 байта", "46 байт", "64 байта", "128 байт"], "ans": 2, "expl": "Минимальный размер кадра Ethernet — 64 байта."}, {"type": "tf", "topic": "Вопрос 23", "q": "Классический Ethernet использовал Манчестерское кодирование и работал на скорости 100 Мбит/с.", "ans": false, "expl": "Классический Ethernet использовал Манчестерское кодирование, но работал на скорости 10 Мбит/с, а не 100."}, {"type": "mcq", "topic": "Вопрос 23", "q": "Какой метод используют коммутаторы Ethernet для построения таблиц MAC-адресов?", "opts": ["Протокол STP", "Самообучение (backward learning)", "Ручная настройка администратором", "Широковещательная рассылка ARP"], "ans": 1, "expl": "Коммутаторы используют самообучение (backward learning) для построения таблиц MAC-адресов."}, {"type": "mcq", "topic": "Вопрос 24", "q": "Какое кодирование используется в 10-гигабитном Ethernet?", "opts": ["Манчестерское кодирование", "4B/5B + MLT-3", "4D-PAM5", "64B/66B"], "ans": 3, "expl": "В 10-гигабитном Ethernet (10GbE) используется кодирование 64B/66B."}, {"type": "tf", "topic": "Вопрос 24", "q": "В 10-гигабитном Ethernet используется полудуплексный режим с CSMA/CD.", "ans": false, "expl": "10GbE работает только в полнодуплексном режиме, CSMA/CD не используется."}, {"type": "mcq", "topic": "Вопрос 24", "q": "Какой механизм применяется в полудуплексном Gigabit Ethernet для коротких кадров?", "opts": ["Байт-стаффинг", "Бит-стаффинг", "Расширение несущей (carrier extension до 512 байт)", "CRC-32 с удвоением"], "ans": 2, "expl": "В полудуплексном Gigabit Ethernet применяется расширение несущей (carrier extension до 512 байт)."}, {"type": "mcq", "topic": "Вопрос 25", "q": "Какой стандарт 802.11 поддерживает MIMO и обеспечивает скорость до 600 Мбит/с?", "opts": ["802.11b", "802.11a", "802.11n", "802.11ac"], "ans": 2, "expl": "802.11n использует MIMO + OFDM и обеспечивает скорость до 600 Мбит/с."}, {"type": "tf", "topic": "Вопрос 25", "q": "В кадре 802.11 содержится максимум два MAC-адреса.", "ans": false, "expl": "Кадр 802.11 содержит четыре MAC-адреса; четыре адреса необходимы при передаче между двумя BSS."}, {"type": "mcq", "topic": "Вопрос 25", "q": "Что такое NAV в контексте протокола MAC 802.11?", "opts": ["Протокол маршрутизации в беспроводной сети", "Счётчик виртуального занятия канала для механизма виртуального прослушивания", "Адрес точки доступа в ESS", "Формат заголовка кадра 802.11"], "ans": 1, "expl": "NAV (Network Allocation Vector) — счётчик виртуального занятия канала, используемый в механизме виртуального прослушивания."}, {"type": "mcq", "topic": "Вопрос 26", "q": "Какова максимальная пропускная способность WiMAX (802.16)?", "opts": ["11 Мбит/с", "54 Мбит/с", "70 Мбит/с", "600 Мбит/с"], "ans": 2, "expl": "Пропускная способность 802.16 (WiMAX) — до 70 Мбит/с."}, {"type": "tf", "topic": "Вопрос 26", "q": "Протокол MAC в 802.16 является децентрализованным и основан на конкуренции.", "ans": false, "expl": "Протокол MAC в 802.16 — централизованный, ориентированный на соединение."}, {"type": "mcq", "topic": "Вопрос 27", "q": "Сколько каналов используется при скачках частоты (FHSS) в Bluetooth?", "opts": ["23 канала", "40 каналов", "79 каналов", "256 каналов"], "ans": 2, "expl": "Bluetooth использует FHSS — скачки по 79 каналам, 1600 прыжков/с."}, {"type": "tf", "topic": "Вопрос 27", "q": "В пикосети Bluetooth может быть один ведущий и до 7 ведомых устройств.", "ans": true, "expl": "Пикосеть — один ведущий (master) и до 7 ведомых (slaves)."}, {"type": "mcq", "topic": "Вопрос 27", "q": "Какой тип соединения в Bluetooth предназначен для голосовых данных?", "opts": ["ACL (асинхронное)", "SCO (синхронное)", "L2CAP", "RFCOMM"], "ans": 1, "expl": "SCO (Synchronous Connection-Oriented) — синхронное соединение для голоса."}, {"type": "mcq", "topic": "Вопрос 28", "q": "Какой метод передачи данных от метки к считывателю используется в EPC Gen 2?", "opts": ["Амплитудная манипуляция (ASK)", "Частотная модуляция GFSK", "Обратная рассеянная модуляция (backscatter)", "Квадратурная амплитудная модуляция (QAM)"], "ans": 2, "expl": "Метка→считыватель: обратная рассеянная модуляция (backscatter) с кодированием FM0 или Миллера."}, {"type": "tf", "topic": "Вопрос 28", "q": "Длина электронного кода продукта (EPC) составляет 128 бит.", "ans": false, "expl": "EPC имеет длину 96 бит, а не 128."}, {"type": "mcq", "topic": "Вопрос 28", "q": "Какой протокол инвентаризации используется в EPC Gen 2 для идентификации меток?", "opts": ["Чистая ALOHA", "CSMA/CD", "Протокол Query/ACK с инвентаризацией слотов (Slotted ALOHA)", "Token Ring"], "ans": 2, "expl": "В EPC Gen 2 используется протокол Query/ACK с инвентаризацией слотов (Slotted ALOHA)."}, {"type": "mcq", "topic": "Вопрос 29", "q": "Какой протокол предотвращает петли при использовании мостов?", "opts": ["CSMA/CD", "IEEE 802.1Q", "STP (IEEE 802.1D) — протокол остовного дерева", "VLAN Trunking Protocol"], "ans": 2, "expl": "Для предотвращения петель используется протокол остовного дерева (STP, IEEE 802.1D)."}, {"type": "tf", "topic": "Вопрос 29", "q": "Шлюз (gateway) работает на уровнях 4-7 модели OSI и выполняет преобразование протоколов.", "ans": true, "expl": "Шлюз работает на уровнях 4-7 и осуществляет преобразование протоколов."}, {"type": "mcq", "topic": "Вопрос 29", "q": "Каков размер тега 802.1Q в кадре Ethernet?", "opts": ["2 байта", "4 байта", "8 байт", "12 байт"], "ans": 1, "expl": "Тег 802.1Q имеет размер 4 байта и содержит TPID, PCP, DEI и VID."}, {"type": "match", "topic": "Тема 4", "q": "Сопоставьте сетевые устройства и технологии с их уровнем или характеристикой.", "pairs": [{"l": "Повторитель (repeater)", "r": "Уровень 1 — усиливает сигнал"}, {"l": "Коммутатор (switch)", "r": "Многопортовый мост, каждый порт — отдельный домен коллизий"}, {"l": "Маршрутизатор (router)", "r": "Уровень 3 — маршрутизирует по IP"}, {"l": "Шлюз (gateway)", "r": "Уровни 4-7 — преобразует протоколы"}, {"l": "CSMA/CD", "r": "Ethernet — обнаружение коллизий"}, {"l": "CSMA/CA", "r": "802.11 — предотвращение коллизий"}, {"l": "FHSS", "r": "Bluetooth — скачки по 79 каналам"}], "expl": "Каждое устройство или технология связано с соответствующим уровнем OSI или ключевой характеристикой из материалов Темы 4."}]}, {"id": 5, "name": "Сетевой уровень", "questions": [{"n": 30, "title": "Проектирование сетевого уровня: Сервисы, предоставляемые транспортному уровню. Метод коммутации пакетов с ожиданием. Реализация сервиса без установления соединения.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Сетевой уровень** (network layer, L3) — третий уровень модели OSI и второй уровень стека TCP/IP; отвечает за **сквозную доставку пакетов** от исходного хоста к конечному через произвольное число промежуточных сетей и маршрутизаторов. В отличие от канального уровня, который работает между непосредственно соединёнными узлами, L3 оперирует **логической адресацией** (IP-адреса), независимой от физических технологий, и решает задачи маршрутизации, фрагментации, контроля перегрузки, объединения разнородных сетей. Услуги транспортному уровню могут предоставляться в двух парадигмах: **без соединения** (дейтаграммная) и **с соединением** (виртуальные каналы). Q30 рассматривает первый случай.", "<h3>Цели проектирования сетевого уровня</h3>", "При создании сетевого уровня разработчики ставят следующие цели:\n- Услуги должны быть **независимы** от технологии используемых нижних сетей.\n- Транспортный уровень должен быть **изолирован** от количества, типа и топологии маршрутизаторов на пути.\n- **Адресация**, предоставляемая транспортному уровню, должна следовать единой схеме, даже когда пакеты пересекают несколько разных LAN и WAN.", "Существуют две философии:\n- **Подход Интернета**: сеть предоставляет минимальную, ненадёжную, без установления соединения службу; всю надёжность реализуют конечные хосты на транспортном уровне (TCP). Принцип «end-to-end argument».\n- **Подход телекоммуникационных монополий**: сеть предоставляет надёжную службу с установлением соединения, гарантиями QoS и тарификацией (ATM, X.25, MPLS).", "<h3>Коммутация пакетов с ожиданием (store-and-forward)</h3>", "В пакетно-коммутируемой сети маршрутизатор работает по схеме **store-and-forward**:\n1. Принимает пакет полностью в буфер.\n2. Проверяет CRC канального уровня (если ошибка — пакет отбрасывается).\n3. Декрементирует TTL/Hop Limit; если 0 — отбрасывает и шлёт ICMP Time Exceeded.\n4. По адресу назначения в IP-заголовке находит запись в **таблице маршрутизации**, определяет исходящий интерфейс и следующий хоп.\n5. При необходимости фрагментирует пакет под MTU исходящей сети (только IPv4).\n6. Передаёт пакет на канальный уровень исходящего интерфейса.", "Это принципиально отличается от **коммутации каналов**, в которой данные идут непрерывным потоком по предварительно зарезервированной полосе без буферизации. Store-and-forward вносит ненулевую обработочную задержку (десятки мкс на узел), но обеспечивает **статистическое мультиплексирование** и устойчивость к отказам.", "Современные высокоскоростные маршрутизаторы используют **fast-path** на ASIC/NPU: типовые пакеты обрабатываются за единицы наносекунд, медленным CPU достаются только исключительные случаи (ARP, ошибки, IP-опции).", "<h3>Реализация сервиса без установления соединения</h3>", "В **дейтаграммной сети** (datagram subnet) — модель **Интернета**:\n- Никакого предварительного установления соединения нет.\n- Каждый пакет (дейтаграмма) самодостаточен и несёт **полный адрес получателя**.\n- Каждый маршрутизатор принимает решение **независимо** для каждой дейтаграммы; разные пакеты одного потока могут пойти разными путями (например, при изменении топологии или балансировке нагрузки).\n- Возможны **переупорядочение** доставки и **дубликаты**; гарантий времени доставки нет.\n- Принцип **«best effort»** — сеть «старается», но не обещает.", "Внутри маршрутизатора:\n- **Таблица маршрутизации** (routing table / forwarding table, FIB) — структура «префикс назначения → исходящий интерфейс + следующий хоп».\n- Выбор маршрута — по **longest prefix match** (самое длинное совпадение префикса).\n- Таблицы строятся протоколами маршрутизации (RIP, OSPF, BGP — Q33, Q41).", "**Преимущества** дейтаграммной модели:\n- **Простота** реализации: нет состояния соединения в маршрутизаторе.\n- **Устойчивость к отказам**: при выходе маршрутизатора из строя пакеты сами обходят его через альтернативные пути после обновления таблиц.\n- **Гибкость**: одно «соединение» может прозрачно балансироваться по нескольким каналам.\n- **Эффективность для bursty-трафика** — нет накладных расходов на установку и удержание соединения.", "**Недостатки**:\n- Нет гарантий QoS, доставки, упорядоченности, защиты от перегрузки — всё это перекладывается на транспортный уровень и приложение.\n- Каждый пакет несёт длинный полный адрес назначения (4 байта IPv4 / 16 байт IPv6) и метаданные.", "Самые яркие пример сервиса без соединения — **IP** (Internet Protocol), а на сетях ниже уровня IP — IPX (Novell, исторически), CLNP (OSI)."], "terms": [{"ru": "Сетевой уровень", "en": "network layer, L3", "df": "третий уровень OSI, обеспечивает сквозную пакетную доставку"}, {"ru": "Дейтаграмма", "en": "datagram", "df": "независимый пакет с полным адресом назначения"}, {"ru": "Дейтаграммная сеть", "en": "datagram subnet", "df": "сеть без установления соединения, основа Интернета"}, {"ru": "Store-and-forward", "en": "коммутация с ожиданием", "df": "пакет принимается целиком, проверяется, затем передаётся дальше"}, {"ru": "Коммутация каналов", "en": "circuit switching", "df": "выделение непрерывного пути (телефонные сети)"}, {"ru": "Таблица маршрутизации", "en": "routing table / FIB, Forwarding Information Base", "df": "определяет следующий узел для каждого адреса назначения"}], "summary": ["**Сетевой уровень** (L3) — сквозная доставка пакетов от исходного хоста к конечному через произвольное число сетей и маршрутизаторов", "Логическая адресация (IP) независима от физической технологии; задачи — маршрутизация, фрагментация, congestion, internetworking", "**Цели проектирования**: услуги независимы от нижних сетей; транспорт изолирован от числа/типа роутеров; единая адресация", "Две философии: **Интернет** (минимум, best-effort, надёжность на концах — end-to-end argument) vs **телеком-монополии** (надёжная служба с соединением, QoS, тарификация — ATM, X.25, MPLS)", "**Store-and-forward** в маршрутизаторе: принять пакет → CRC → декремент **TTL/Hop Limit** (если 0 — ICMP Time Exceeded) → поиск маршрута → фрагментация под MTU → передать на L2", "В отличие от **circuit switching**: данные не идут непрерывно; добавляется обработочная задержка, но появляется статистическое мультиплексирование", "Современные маршрутизаторы: **fast-path** на ASIC/NPU — наносекунды/пакет; CPU обрабатывает только исключения (ARP, ошибки, IP-опции)", "**Дейтаграммная сеть** (модель Интернета): нет предварительной установки", "Каждый пакет = самодостаточная дейтаграмма с полным адресом получателя", "Каждый маршрутизатор решает **независимо** — разные пакеты потока могут идти разными путями", "Возможны переупорядочение и дубликаты; нет гарантий времени; **best-effort**", "**Таблица маршрутизации (FIB)**: «префикс назначения → исходящий интерфейс + next-hop»", "Выбор маршрута по **longest prefix match** (самому длинному совпадающему префиксу)", "Таблицы строятся протоколами RIP/OSPF/BGP (Q33/Q41)", "Плюсы дейтаграмм: простота (нет state в роутере), устойчивость к отказам, гибкость, эффективность для bursty", "Минусы: нет гарантий QoS/порядка/защиты от перегрузки — всё на L4+; длинный полный адрес в каждом пакете", "Примеры: **IP** (главный), исторически IPX (Novell), CLNP (OSI)"]}, {"n": 31, "title": "Реализация сервиса с установлением соединения. Сравнение сетей виртуальных каналов и дейтаграммных сетей.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Виртуальный канал** (virtual circuit, VC) — реализация на сетевом уровне **сервиса с установлением соединения**: между отправителем и получателем заранее прокладывается логический путь, по которому потом идут все пакеты этого соединения. Это аналог телефонного звонка, но без резервирования физической полосы — отсюда «виртуальный». Подход исторически продвигался операторскими организациями (ITU-T) как замена коммутации каналов с лучшим использованием канала, при сохранении гарантий качества, упорядоченности и тарифицируемости.", "<h3>Принцип работы</h3>", "Установка VC:\n1. Источник посылает специальное сообщение **CALL REQUEST** через сеть.\n2. Каждый маршрутизатор по пути выбирает следующий хоп, выделяет **локальный идентификатор VCI** (Virtual Circuit Identifier) и заносит в **VC-таблицу** запись «(входной интерфейс, входной VCI) → (выходной интерфейс, выходной VCI)».\n3. Получатель подтверждает (CALL ACCEPT), сообщение проходит обратно по тому же пути и фиксирует канал.", "Передача данных:\n- Каждый пакет несёт **только короткий VCI** (несколько байт), а не полный адрес назначения.\n- Маршрутизатор делает простой lookup по VC-таблице, переписывает VCI и пересылает на нужный интерфейс. **Label swapping** — та же идея, что в MPLS.\n- Все пакеты одного VC идут по одному пути, в один и тот же интерфейс выхода → доставка **в порядке отправки**.", "Разрыв:\n- Сообщение **CLEAR REQUEST** проходит по пути и освобождает записи во всех маршрутизаторах.", "<h3>Три фазы соединения</h3>", "| Фаза | Действие |\n|---|---|\n| Setup | прокладка VC, выделение VCI, резервирование ресурсов (опционально) |\n| Data Transfer | пакеты идут по коротким VCI, гарантирован порядок |\n| Teardown | освобождение записей и ресурсов |", "<h3>Типичные реализации</h3>", "- **X.25** (1976) — классическая VC-сеть для телефонных модемов; включает уровни PLP, LAPB, X.21.\n- **Frame Relay** (1990-е) — упрощённый X.25, до 45 Мбит/с; **PVC** (Permanent VC) и **SVC** (Switched VC). Активно использовался для корпоративных WAN.\n- **ATM** (Asynchronous Transfer Mode, 1990-е) — амбициозный проект «единой сети для всего»; ячейки фиксированной длины 53 байта (5 заголовок + 48 данных); идентификаторы **VPI** + **VCI** (24 бита суммарно). Лежал в основе SDH и ранних магистралей UMTS.\n- **MPLS** (Multiprotocol Label Switching, RFC 3031) — современная промышленная реализация VC: 20-битная метка вставляется между L2 и L3 заголовками. Маршрутизатор пересылает пакеты по меткам (**label switching**), полностью игнорируя содержимое IP-заголовка для быстрой коммутации. Используется в Tier-1 операторских ядрах для L2/L3 VPN, Traffic Engineering, FRR (Fast Re-Route).", "<h3>Сравнение дейтаграммных сетей и VC</h3>", "| Критерий | Дейтаграммы (IP) | Виртуальные каналы (X.25/ATM/MPLS) |\n|---|---|---|\n| Установление соединения | не требуется | обязательно (call setup) |\n| Адресация в пакете | полный адрес назначения | короткий VCI/Label |\n| Состояние в маршрутизаторе | нет (только статические таблицы маршрутизации) | таблица VC на каждое соединение |\n| Маршрут пакетов | независимый для каждого пакета | фиксированный для всего VC |\n| Гарантия порядка | нет | да |\n| Резервирование ресурсов | нет (best-effort) | возможно (QoS) |\n| Поведение при отказе | пакеты автоматически обходят (после конвергенции) | разрыв VC, перестроение |\n| Накладные расходы заголовка | большие (IP-адрес 4/16 байт) | малые (метка 2–3 байта) |\n| Тарификация | сложно | просто (по соединению) |\n| Применение | Интернет | операторские магистрали, VPN |", "<h3>Можно ли получить лучшее из обоих миров</h3>", "**MPLS** — концептуальное «лучшее из обоих миров»: внутри MPLS-домена пересылка идёт по меткам (VC-стиль) с резервированием пути и QoS, а на границе с обычным IP — стандартная дейтаграммная маршрутизация. Это позволяет операторам строить виртуальные L2/L3 сети поверх общего ядра.", "Сетевой уровень Интернета — фундаментально дейтаграммный, но **на других уровнях** (TCP — транспорт с соединением; QUIC — соединение поверх UDP; VPN-туннели поверх IP) гарантии получены другими способами."], "terms": [{"ru": "Виртуальный канал", "en": "virtual circuit, VC", "df": "логический путь, установленный заранее для группы пакетов"}, {"ru": "VCI / VPI", "en": "Virtual Circuit / Path Identifier", "df": "короткие идентификаторы канала и пути в ATM"}, {"ru": "PVC / SVC", "en": "Permanent / Switched Virtual Circuit", "df": "постоянный/коммутируемый VC"}, {"ru": "ATM", "en": "Asynchronous Transfer Mode", "df": "технология на основе VC с ячейками фиксированного размера (53 байта)"}, {"ru": "MPLS", "en": "Multiprotocol Label Switching", "df": "коммутация по меткам, сочетает элементы VC и IP"}, {"ru": "QoS", "en": "Quality of Service", "df": "гарантии качества: задержка, пропускная способность, потери"}], "summary": ["**Виртуальный канал (VC)** — реализация сервиса L3 с установлением соединения; логический путь прокладывается заранее", "Аналог телефонного звонка, но без физической полосы → «виртуальный»", "Продвигался ITU-T как замена circuit switching с лучшей утилизацией + гарантиями", "**Три фазы**: **Setup** (CALL REQUEST/ACCEPT, выделение VCI, опционально резервирование ресурсов); **Data Transfer**; **Teardown** (CLEAR REQUEST)", "Каждый маршрутизатор имеет **VC-таблицу**: «(in-iface, in-VCI) → (out-iface, out-VCI)»", "Пакет несёт **только короткий VCI/Label** (несколько байт), не полный адрес", "**Label swapping** — переписывание метки на каждом хопе (та же идея, что в MPLS)", "Все пакеты одного VC идут одним путём → гарантирован порядок доставки", "**X.25** (1976) — классическая VC-сеть, уровни PLP/LAPB/X.21", "**Frame Relay** (1990-е): упрощённый X.25 до 45 Мбит/с; **PVC** (постоянный) и **SVC** (коммутируемый)", "**ATM** (Asynchronous Transfer Mode): ячейки **53 байта** (5 заголовок + 48 данных); **VPI + VCI** = 24 бита; SDH/UMTS магистрали", "**MPLS** (RFC 3031): **20-битная метка** между L2 и L3 заголовками; **label switching** в Tier-1 ядрах", "MPLS применения: **L2/L3 VPN**, **Traffic Engineering**, **FRR** (Fast Re-Route)", "**Сравнение Дейтаграммы vs VC**: setup — нет/да; адресация — полный/короткий VCI; state — нет/per-VC", "Маршрут — независим/фиксирован; порядок — нет/да; резервирование — нет/возможно; отказ — обход/разрыв", "Заголовки: большие (IP 4/16Б)/малые (метка 2–3Б); тарификация — сложно/просто", "**MPLS = лучшее из обоих миров**: внутри домена — VC-стиль с TE/QoS; на границе — обычный IP", "Альтернатива гарантиям VC на L3: TCP (L4), QUIC (поверх UDP), VPN-туннели"]}, {"n": 32, "title": "Алгоритмы маршрутизации: принцип оптимальности маршрута, алгоритм нахождения кратчайшего пути, заливка.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Маршрутизация** (routing) — процесс выбора путей для доставки пакетов от источника к получателю через сеть с несколькими промежуточными узлами. Цель — заполнить **таблицы пересылки** (FIB) маршрутизаторов так, чтобы доставка была быстрой, экономичной и устойчивой к отказам. Алгоритмы маршрутизации делятся на **неадаптивные** (static, заполняются вручную) и **адаптивные** (dynamic), которые в свою очередь делят на централизованные и распределённые, основанные на различных метриках: число хопов, задержка, доступная полоса, надёжность.", "<h3>Принцип оптимальности маршрута</h3>", "**Принцип оптимальности** (optimality principle), также известный как принцип Беллмана: если узел **B лежит на оптимальном пути из A в C**, то участок пути от **B до C тоже оптимален**. Иначе можно было бы заменить часть пути на ещё более короткую — противоречие.", "Прямое следствие: для каждого получателя D в сети существует **дерево кратчайших путей** (**sink tree**), корнем которого является D, а от каждого другого узла к нему ведёт единственный оптимальный путь. Это дерево не обязательно уникально (могут быть несколько равноценных путей — ECMP), но всегда существует. Все алгоритмы маршрутизации можно интерпретировать как **поиск sink tree** для каждого получателя.", "<h3>Алгоритм Дейкстры (Dijkstra, 1959)</h3>", "Классический алгоритм поиска кратчайших путей **от одного источника** ко всем остальным вершинам взвешенного графа с **неотрицательными весами рёбер**:", "1. Все вершины помечаются как «временные», расстояние до них = ∞, кроме источника s (расстояние = 0).\n2. Текущая рабочая вершина — s.\n3. Для каждой соседней с текущей временной вершины v: если dist(v) > dist(current) + w(current, v), обновить dist(v) и предшественника.\n4. Выбрать среди временных вершину с минимальным расстоянием — сделать её «постоянной» (она и есть текущая).\n5. Повторять, пока все вершины не станут постоянными.", "Сложность с двоичной кучей: O((V+E)·log V); с фибоначчиевой кучей: O(E + V·log V).", "**Применение**:\n- **OSPF** (Open Shortest Path First, RFC 2328) — каждый маршрутизатор по объявлениям LSA строит полный граф сети и запускает Дейкстру.\n- **IS-IS** (ISO 10589) — аналогично для оптического и операторского ядра.\n- **Bellman-Ford** — альтернатива для отрицательных весов и распределённого вычисления (используется в RIP).", "<h3>Заливка (flooding)</h3>", "**Flooding** — простейший алгоритм без знания топологии: маршрутизатор копирует пришедший пакет на **все исходящие интерфейсы, кроме того, с которого получил**. Гарантирует, что пакет дойдёт до всех узлов сети, причём **первая прибывшая копия** идёт по кратчайшему пути (поскольку других путей короче не существует).", "Проблема — экспоненциальное размножение пакетов. Защитные механизмы:\n- **TTL / Hop Limit** — счётчик, уменьшаемый на каждом узле; при 0 пакет уничтожается.\n- **Sequence number** — каждый источник нумерует свои пакеты; маршрутизатор помнит видимые номера и не пересылает повторы.\n- **Reverse-Path Forwarding** (RPF) — пакет пересылается только если он пришёл с интерфейса, который сам является кратчайшим путём к источнику (отбрасывает дубликаты).", "**Применения flooding**:\n- Распространение **LSA** в Link-State протоколах (OSPF, IS-IS).\n- Военные/тактические сети, где топология неизвестна, а надёжность важнее эффективности.\n- **Selective flooding** — заливка только в направлении приблизительно к назначению.\n- В Bluetooth Mesh — основной способ распространения сообщений.", "<h3>Метрики стоимости рёбер</h3>", "Веса рёбер могут отражать:\n- **Число хопов** (RIP) — простота, но не учитывает скорость каналов.\n- **Задержку** или **обратное значение пропускной способности** (OSPF default = 10⁸ / bw).\n- **Финансовую стоимость** (BGP MED).\n- **Текущую загрузку** — приводит к осцилляциям (Q36).", "<h3>Сравнение базовых алгоритмов</h3>", "| Алгоритм | Знание топологии | Вычисление | Использование |\n|---|---|---|---|\n| Static | вручную | нет | малые стабильные сети |\n| Flooding | не нужно | нет | LSA, экстренная доставка |\n| Дейкстра | полное (Link-State) | централизованное в каждом узле | OSPF, IS-IS |\n| Bellman-Ford | только соседи | распределённое | RIP, distance-vector |"], "terms": [{"ru": "Маршрутизация", "en": "routing", "df": "выбор пути пакета от отправителя к получателю"}, {"ru": "Принцип оптимальности", "en": "optimality principle", "df": "подпути оптимальных маршрутов тоже оптимальны"}, {"ru": "Sink tree", "en": "дерево кратчайших путей", "df": "дерево оптимальных путей от всех узлов к одному получателю"}, {"ru": "Алгоритм Дейкстры", "en": "Dijkstra's algorithm", "df": "алгоритм поиска кратчайших путей от одного источника на графе с неотрицательными весами"}, {"ru": "Заливка", "en": "flooding", "df": "рассылка пакета на все интерфейсы, кроме входящего"}, {"ru": "TTL / Hop Limit", "en": "Time to Live", "df": "счётчик переходов, ограничивающий время жизни пакета в сети"}, {"ru": "LSA", "en": "Link State Advertisement", "df": "объявление состояния линий"}, {"ru": "OSPF", "en": "Open Shortest Path First", "df": "протокол маршрутизации, использующий алгоритм Дейкстры"}, {"ru": "ECMP", "en": "Equal-Cost Multi-Path", "df": "балансировка по нескольким равноценным маршрутам"}], "summary": ["**Маршрутизация** = заполнение **FIB** так, чтобы доставка была быстрой и устойчивой", "Классификация: **неадаптивная** (static, вручную) vs **адаптивная** (dynamic); централизованная vs распределённая", "Метрики: число хопов, задержка, обратная полоса, надёжность, стоимость", "**Принцип оптимальности (Беллмана)**: если B на оптимальном пути из A в C, то участок B→C тоже оптимален", "Следствие: для каждого получателя D существует **дерево кратчайших путей (sink tree)** с корнем D", "ECMP — несколько равноценных путей; все алгоритмы маршрутизации = поиск sink tree", "**Алгоритм Дейкстры** (1959) — кратчайшие пути от одного источника, **неотрицательные веса**", "Шаги: dist=0 для s, ∞ для других; обновление соседей; выбор минимальной временной → постоянной", "Сложность: **O((V+E)·log V)** с двоичной кучей; O(E + V·log V) с фибоначчиевой", "Применение Дейкстры: **OSPF** (RFC 2328), **IS-IS** (ISO 10589)", "**Bellman-Ford** — альтернатива для отрицательных весов и распределённого вычисления (**RIP**)", "**Flooding (заливка)**: копировать пакет на все интерфейсы кроме входного — без знания топологии", "Заливка: первая копия идёт по кратчайшему пути; гарантирует доставку всем", "Защита от размножения: **TTL/Hop Limit**, **sequence number** (помнит видимые), **RPF** (Reverse-Path Forwarding)", "**RPF**: пересылать только если пакет пришёл с интерфейса, который сам — кратчайший путь к источнику", "Применения flooding: **распространение LSA** в OSPF/IS-IS, военные сети, Bluetooth Mesh, selective flooding", "Сравнение: static (вручную); flooding (без знания, для LSA); Дейкстра (полная топология, LS); Bellman-Ford (только соседи, DV)"]}, {"n": 33, "title": "Алгоритмы маршрутизации: маршрутизация по вектору расстояний, маршрутизация с учетом состояния линий, иерархическая маршрутизация.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "В адаптивной маршрутизации (Q32) сложились два фундаментальных семейства распределённых алгоритмов — **Distance Vector** (DV, по вектору расстояний) и **Link State** (LS, по состоянию линий), различающиеся **тем, какую информацию маршрутизатор знает о сети** и **как он её получает**. При росте сети к сотням тысяч узлов оба подхода не масштабируются, поэтому современные сети применяют **иерархическую маршрутизацию**, где внутри регионов работают LS или DV, а между регионами — отдельные протоколы (например, BGP в Интернете).", "<h3>Маршрутизация по вектору расстояний (Distance Vector)</h3>", "Каждый маршрутизатор хранит **вектор** — таблицу «получатель → (расстояние, следующий хоп)». Алгоритм работы:", "1. При старте маршрутизатор знает расстояние 0 до себя и стоимость связи с непосредственными соседями.\n2. Периодически (раз в 30 с для RIP) шлёт **всю свою таблицу** только **непосредственным соседям**.\n3. Получив вектор от соседа N, маршрутизатор для каждой цели D пересчитывает: dist_new(D) = cost(self, N) + N.dist(D); если меньше текущей, обновляет.", "Математически это распределённая версия алгоритма **Беллмана-Форда**.", "**Проблемы и решения**:\n- **Счёт до бесконечности** (count-to-infinity): при отказе линии маршрутизаторы постепенно увеличивают стоимость, обмениваясь устаревшими «хорошими» новостями. Сеть медленно (десятки циклов) сходится.\n- **Split horizon**: не сообщать маршрут на тот интерфейс, от которого он был получен.\n- **Poison reverse**: вместо умалчивания сообщать стоимость = ∞ — это активно «отравляет» неверные альтернативы.\n- **Triggered updates**: при изменении сразу шлётся новый вектор, не дожидаясь периодического обновления.\n- **Maximum metric** (RIP = 16) — искусственная «бесконечность» для ограничения зацикливания.", "**Применение**: **RIPv1/v2** (Routing Information Protocol, RFC 2453), **RIPng** для IPv6, **EIGRP** Cisco (расширенный DV с DUAL-алгоритмом, без count-to-infinity).", "<h3>Маршрутизация с учётом состояния линий (Link State)</h3>", "Каждый маршрутизатор узнаёт **полную карту сети** и сам вычисляет кратчайшие пути. Алгоритм:", "1. **Обнаружение соседей** через приветственные пакеты (**Hello**); установление соседских отношений.\n2. **Измерение стоимости** линий (по умолчанию — обратная пропускная способность).\n3. **Формирование LSA** (Link State Advertisement) — пакета со списком всех соседей и стоимостей.\n4. **Заливка LSA** (flooding) по всему домену маршрутизации, с подавлением дубликатов по sequence number.\n5. **Сборка LSDB** (Link State Database) — каждый маршрутизатор хранит идентичную полную базу.\n6. **Запуск алгоритма Дейкстры** локально → получение sink tree и таблицы пересылки.", "**Преимущества над DV**:\n- Быстрая сходимость (доли секунды), нет count-to-infinity.\n- Возможность аутентификации LSA.\n- Поддержка **ECMP**, отдельных метрик для типов трафика.\n- Маршрутизатор может верифицировать корректность LSDB.", "**Недостатки**:\n- Больший объём памяти (полная карта).\n- При изменениях много flooding-трафика.", "**Применение**: **OSPF** (Open Shortest Path First, RFC 2328 для IPv4, RFC 5340 OSPFv3 для IPv6), **IS-IS** (Intermediate System to IS, ISO 10589, в операторских ядрах).", "<h3>Иерархическая маршрутизация</h3>", "Когда сеть содержит миллионы маршрутов, плоская маршрутизация невозможна. Решение — **иерархия**:", "- Сеть разбивается на **регионы** (areas в OSPF) или **уровни** (level-1/2 в IS-IS).\n- Маршрутизатор внутри своего региона знает полную топологию региона, но для внешних регионов — только агрегированные суммарные маршруты.\n- На границах регионов работают **граничные маршрутизаторы** (ABR — Area Border Router в OSPF), агрегирующие префиксы.\n- Глобально Интернет делится на **автономные системы** (AS, Autonomous System) — группы маршрутизаторов под единым административным управлением. Внутри AS работают IGP (RIP, OSPF, IS-IS); между AS — **EGP**, на сегодня единственный — **BGP** (Border Gateway Protocol, RFC 4271).", "Экономия памяти: иерархия на k уровней сводит O(N) маршрутов к O(N^(1/k)) на каждом узле — теорема Кляйнрока-Кэмо. Цена — иногда неоптимальные маршруты (через выделенный шлюз).", "<h3>Сравнительная таблица</h3>", "| Свойство | Distance Vector | Link State |\n|---|---|---|\n| Что знает узел | расстояния через соседей | полную карту сети |\n| Что шлёт | свой вектор соседям | LSA всем (flooding) |\n| Алгоритм | Беллман-Форд | Дейкстра |\n| Сходимость | медленная (с COTI) | быстрая |\n| Память | малая | большая |\n| Сложность | низкая | средняя |\n| Примеры | RIP, EIGRP | OSPF, IS-IS |"], "terms": [{"ru": "Вектор расстояний", "en": "distance vector", "df": "подход, при котором маршрутизаторы обмениваются таблицами расстояний с соседями"}, {"ru": "Состояние линий", "en": "link state", "df": "подход, при котором каждый маршрутизатор знает полную карту сети"}, {"ru": "Счёт до бесконечности", "en": "count-to-infinity", "df": "медленная сходимость DV при отказе линии"}, {"ru": "LSA", "en": "Link State Advertisement", "df": "пакет с информацией о соседях и стоимостях линий"}, {"ru": "LSDB", "en": "Link State Database", "df": "база данных состояний линий у каждого маршрутизатора"}, {"ru": "OSPF", "en": "Open Shortest Path First", "df": "протокол маршрутизации на основе Link State"}, {"ru": "IS-IS", "en": "Intermediate System to IS", "df": "Link State протокол для операторских и магистральных сетей"}, {"ru": "AS", "en": "Autonomous System", "df": "автономная система, группа сетей под единым управлением"}, {"ru": "IGP / EGP", "en": "Interior / Exterior Gateway Protocol", "df": "внутренние / внешние протоколы маршрутизации"}, {"ru": "BGP", "en": "Border Gateway Protocol", "df": "протокол маршрутизации между автономными системами"}], "summary": ["Два семейства распределённых адаптивных алгоритмов: **Distance Vector (DV)** и **Link State (LS)**", "**DV (Distance Vector)**: каждый роутер хранит таблицу «получатель → (расстояние, next-hop)»", "DV алгоритм: периодически (RIP — 30 с) шлёт **всю таблицу только непосредственным соседям**", "Получив вектор от N: dist_new(D) = cost(self,N) + N.dist(D); если меньше — обновить", "Математически — распределённый **Беллман-Форд**", "**Count-to-infinity** — при отказе линии стоимость растёт постепенно, медленная сходимость", "Стабилизация DV: **split horizon** (не шлём маршрут на тот интерфейс, откуда получили); **poison reverse** (стоимость=∞)", "**Triggered updates** при изменении; **maximum metric** (RIP=16) — искусственная «бесконечность»", "DV применение: **RIPv1/v2** (RFC 2453), **RIPng** (IPv6), **EIGRP** Cisco (DUAL без COTI)", "**LS (Link State)**: каждый роутер знает **полную карту сети** и сам считает Dijkstra", "Алгоритм LS: 1) Hello → обнаружение соседей; 2) измерение стоимости; 3) формирование **LSA**; 4) **flooding LSA** с подавлением дубликатов", "5) Сборка **LSDB** (одинаковая у всех); 6) локальный Dijkstra → sink tree и FIB", "LS плюсы: быстрая сходимость (доли секунды), нет COTI, аутентификация LSA, ECMP, верификация", "LS минусы: больший объём памяти; flooding-трафик при изменениях", "LS применение: **OSPF** (RFC 2328 IPv4, RFC 5340 OSPFv3), **IS-IS** (ISO 10589)", "**Иерархическая маршрутизация** — плоская не масштабируется на миллионы маршрутов", "Разбивка на **areas** (OSPF) / **levels** (IS-IS); агрегированные маршруты вне региона", "Граничные роутеры: **ABR** (Area Border Router), **ASBR** (AS Boundary Router)", "Глобально Интернет = **AS** (Autonomous Systems); **IGP** внутри, **EGP=BGP** между", "Теорема Кляйнрока-Кэмо: иерархия на k уровней сводит O(N) к **O(N^(1/k))** — цена в неоптимальности"]}, {"n": 34, "title": "Алгоритмы маршрутизации: широковещательная маршрутизация, многоадресная рассылка, произвольная маршрутизация.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "Большинство сетевого трафика — **unicast** (один к одному), но сетевой уровень также поддерживает **специальные модели доставки**, отличающиеся числом и составом получателей: **broadcast** (всем узлам сети), **multicast** (заранее объявленной группе подписчиков), **anycast** (любому одному из набора узлов с общим адресом). Для каждой требуются особые алгоритмы маршрутизации: они должны минимизировать дублирование пакетов в сети при обеспечении гарантированной доставки.", "<h3>Широковещательная маршрутизация (broadcast routing)</h3>", "Задача — доставить пакет **всем хостам сети**. Способы:", "- **Множественные unicast** — отправитель шлёт копию каждому. Просто, но требует знать всех получателей и не масштабируется.\n- **Flooding** (Q32) — рассылка на все интерфейсы; гарантирует доставку, но создаёт O(2|E|) копий.\n- **Reverse-Path Forwarding (RPF)** (Dalal & Metcalfe, 1978) — маршрутизатор пересылает пакет дальше **только если он пришёл с интерфейса, который сам является кратчайшим путём к источнику**. Иначе — дубликат, отбрасывается. Гарантирует одну копию на узел, использует только обычную таблицу маршрутизации.\n- **Spanning Tree multicast** — заранее построенное **остовное дерево** с корнем-источником; пакет идёт только по рёбрам дерева. Самое эффективное, но требует поддержки протокола.", "В IPv4 широковещательный адрес — **255.255.255.255** (limited broadcast, не пересылается маршрутизатором) и **directed broadcast** (адрес сети с битами хоста = 1); в IPv6 broadcast как таковой удалён, заменён link-local multicast `ff02::1`.", "<h3>Многоадресная рассылка (multicast)</h3>", "Задача — доставить пакет **группе подписчиков**, которая может находиться в разных частях сети. Применения: IPTV, видеоконференции, биржевые котировки, обнаружение сервисов (mDNS), маршрутизирующие протоколы (OSPF Hello идёт multicast 224.0.0.5).", "**Адресация**:\n- IPv4: класс D, диапазон 224.0.0.0/4 (224.0.0.0 – 239.255.255.255).\n- IPv6: префикс **ff00::/8** с битом scope (link-local, site-local, organization, global).\n- **SSM** (Source-Specific Multicast, RFC 4607) — получатель указывает группу + источник, повышает безопасность.", "**Управление членством в группе** (между хостом и его маршрутизатором):\n- **IGMP** (Internet Group Management Protocol, v1/v2/v3) для IPv4.\n- **MLD** (Multicast Listener Discovery) — встроен в ICMPv6 для IPv6.", "**Построение деревьев распределения**:\n- **Source-based tree** (SPT, дерево от источника): отдельное дерево для каждого (S, G); оптимальные пути, но много состояния. Протокол **DVMRP** (Distance Vector Multicast Routing Protocol) использует RPF + pruning.\n- **Shared tree** (RPT, дерево с общей точкой rendezvous): один RP (Rendezvous Point) собирает данные всех источников и рассылает подписчикам. Меньше состояния, неоптимальные пути. Протокол **PIM-SM** (Protocol Independent Multicast, Sparse Mode) — стандарт де-факто; после первого пакета может переключиться на SPT для известных источников.\n- **PIM-DM** (Dense Mode) — для плотных сетей, использует flood-and-prune.\n- **MOSPF** — multicast-расширение OSPF.", "В операторских сетях существует **mLDP / RSVP-TE P2MP** на базе MPLS — отдельный механизм multicast в MPLS VPN.", "<h3>Произвольная маршрутизация (anycast)</h3>", "**Anycast** — один и тот же IP-адрес назначается нескольким географически разделённым узлам; сеть доставляет пакет **ближайшему по метрике маршрутизации**. Хосты «не знают», что общаются с разными серверами, и сеть автоматически балансирует нагрузку и локализует трафик.", "Реализация в Интернете — на уровне **BGP**: разные ASN объявляют один и тот же префикс, маршрутизаторы выбирают «ближайший» по AS_PATH/IGP-метрике.", "Применения:\n- **DNS root-серверы**: 13 «логических» адресов, но физически десятки тысяч anycast-инстансов по миру.\n- **CDN** — Cloudflare, Google, Akamai: один IP — много узлов.\n- **DDoS-резистентность**: атака на anycast-адрес распределяется по всем точкам.\n- **6to4 / Teredo** — anycast-релеи 192.88.99.1 (исторически).\n- IPv6 имеет встроенную поддержку anycast как первого класса.", "UDP-трафик к anycast «расщепляется» по узлам без проблем; TCP — рисковано, нужны устойчивые маршруты во время соединения (обычно работает, но соединения с anycast-провайдерами могут разрываться при изменении BGP).", "<h3>Сводка моделей доставки</h3>", "| Модель | Получатели | Состояние в маршрутизаторе | Протоколы |\n|---|---|---|---|\n| Unicast | один конкретный | таблица маршрутизации | RIP/OSPF/BGP |\n| Broadcast | все в сети | RPF / spanning tree | local |\n| Multicast | подписчики группы | (S, G) или (*, G) | IGMP/MLD + PIM/DVMRP |\n| Anycast | ближайший из набора | обычная unicast-маршрутизация | через BGP-анонсы |"], "terms": [{"ru": "Broadcast", "en": "широковещание", "df": "доставка пакета всем узлам сети"}, {"ru": "Multicast", "en": "многоадресная рассылка", "df": "доставка пакета определённой группе получателей"}, {"ru": "Anycast", "en": "произвольная маршрутизация", "df": "доставка ближайшему из узлов с одинаковым адресом"}, {"ru": "RPF", "en": "Reverse Path Forwarding", "df": "пересылка только если пакет пришёл с кратчайшего пути к источнику"}, {"ru": "Остовное дерево", "en": "spanning tree", "df": "дерево, покрывающее все узлы без петель"}, {"ru": "SPT / RPT", "en": "Source-based / shared Rendezvous Point Tree", "df": "деревья multicast от источника или через RP"}, {"ru": "DVMRP", "en": "Distance Vector Multicast Routing Protocol", "df": "протокол multicast с RPF + pruning"}, {"ru": "PIM-SM / PIM-DM", "en": "Protocol Independent Multicast, Sparse / Dense Mode", "df": "современные multicast-протоколы"}, {"ru": "IGMP / MLD", "en": "Internet Group Management / Multicast Listener Discovery", "df": "управление подпиской хостов"}, {"ru": "SSM", "en": "Source-Specific Multicast", "df": "multicast с указанием источника"}, {"ru": "CDN", "en": "Content Delivery Network", "df": "сеть доставки контента, часто использующая anycast"}], "summary": ["**Unicast** (1↔1) — основной; L3 также поддерживает специальные модели: broadcast, multicast, anycast", "**Broadcast routing** — доставить **всем узлам сети**", "Способы broadcast: множественные unicast (просто, не масштабируется); flooding (O(2|E|) копий); **RPF** (Dalal/Metcalfe 1978); **spanning tree multicast**", "**RPF**: пересылать только если пакет пришёл с интерфейса, кратчайшего к источнику; одна копия на узел", "IPv4 broadcast: **255.255.255.255** (limited, не маршрутизируется), directed broadcast (биты хоста = 1)", "IPv6 — нет broadcast; заменён link-local multicast **ff02::1**", "**Multicast** — доставить **группе подписчиков**; IPTV, видеоконф., биржевые котировки, mDNS, OSPF Hello (224.0.0.5)", "Адресация: **IPv4 класс D 224.0.0.0/4** (224.0.0.0–239.255.255.255); **IPv6 ff00::/8** с scope-битом", "**SSM** (Source-Specific Multicast, RFC 4607) — получатель указывает (G, S), безопаснее", "**Управление членством хост↔роутер**: **IGMP** v1/v2/v3 для IPv4; **MLD** v1/v2 встроен в ICMPv6", "**Source-based tree (SPT)** = дерево от источника, отдельное для каждого (S,G); оптимально, но много state", "**Shared tree (RPT)** через **RP** (Rendezvous Point); меньше state, неоптимально", "**DVMRP** — RPF + pruning; **PIM-SM** (Sparse Mode) — стандарт де-факто, RP, переключение на SPT", "**PIM-DM** (Dense Mode) — flood-and-prune для плотных сетей; **MOSPF** — multicast OSPF", "MPLS-multicast: **mLDP, RSVP-TE P2MP**; межоператорский — MBGP + MSDP", "**Anycast** — один IP назначен нескольким географически разнесённым узлам; доставка ближайшему", "Реализация в Интернете — на уровне **BGP**: разные ASN объявляют один префикс", "Применения: **DNS root-серверы** (13 логических — тысячи anycast-инстансов), **CDN** (Cloudflare/Akamai), DDoS-резистентность", "UDP к anycast — без проблем; TCP — рисковано (изменение BGP во время соединения)"]}, {"n": 35, "title": "Алгоритмы маршрутизации для мобильных хостов, маршрутизация в произвольных сетях.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "Классические алгоритмы маршрутизации предполагают **статическую** топологию: узлы стационарны, их адреса не меняются. Мобильные хосты и **ad-hoc-сети** нарушают это допущение: устройство может физически перемещаться между сетями (Mobile IP) или участвовать в сети без какой-либо фиксированной инфраструктуры (MANET). Это требует особых маршрутных протоколов, способных быстро реагировать на смену топологии при ограниченных ресурсах (батарея, эфир).", "<h3>Mobile IP — маршрутизация для мобильных хостов</h3>", "**Mobile IPv4** (RFC 5944) и **Mobile IPv6** (RFC 6275) решают задачу сохранения **постоянного IP-адреса** мобильного хоста при переходе между сетями. Без специальных мер при смене сети хост получил бы новый IP, и все его TCP-соединения разорвались бы.", "Архитектура:\n- **Home Address (HoA)** — постоянный IP мобильного устройства; принадлежит его «домашней сети».\n- **Home Agent (HA)** — маршрутизатор в домашней сети, знает текущее местоположение мобильного хоста.\n- **Foreign Agent (FA)** — маршрутизатор в посещаемой сети (в Mobile IPv4); в Mobile IPv6 эта роль не нужна — устройство само получает CoA по SLAAC.\n- **Care-of Address (CoA)** — временный адрес мобильного хоста в текущей чужой сети.\n- **Correspondent Node (CN)** — собеседник, общающийся с мобильным хостом.", "Процесс:\n1. Перемещаясь в новую сеть, хост получает CoA (по DHCP или SLAAC).\n2. Шлёт **Binding Update** домашнему агенту, привязывая HoA ↔ CoA.\n3. CN, ничего не зная о перемещении, отправляет пакет на HoA → пакет попадает в домашнюю сеть.\n4. HA перехватывает (proxy ARP) и **туннелирует** пакет (IPv4-in-IPv4 или IPv6-in-IPv6) на CoA.\n5. Мобильный хост получает пакет, декапсулирует и отвечает напрямую CN.", "**Проблема треугольной маршрутизации** (triangle routing): даже если CN находится рядом с мобильным устройством, входящие пакеты делают крюк через HA. Решение в Mobile IPv6 — **Route Optimization**: CN получает Binding и шлёт пакеты напрямую на CoA.", "Альтернативные подходы:\n- **Proxy Mobile IPv6** (PMIPv6, RFC 5213): мобильность реализуется сетью, устройство не знает о ней (используется в LTE EPC, Wi-Fi calling).\n- **HMIPv6** (Hierarchical) — иерархический Mobile IPv6 с MAP-роутерами для локального хэндовера.\n- **GTP** (GPRS Tunneling Protocol) — фактический стандарт мобильности в сетях 4G LTE, 5G.", "<h3>Маршрутизация в ad-hoc-сетях (MANET)</h3>", "**MANET** (Mobile Ad-hoc Network) — сеть из мобильных узлов без фиксированной инфраструктуры; каждый узел является и хостом, и маршрутизатором. Топология динамическая, ресурсы (батарея, эфир) ограничены. Применения: военные тактические сети, спасательные операции, VANET (автомобильные сети), IoT-меши.", "**Семейства протоколов**:", "- **Проактивные (table-driven)** — маршрутные таблицы поддерживаются постоянно, как в обычной сети, но с поправками на динамику:\n  - **DSDV** (Destination-Sequenced Distance Vector, Perkins-Bhagwat 1994) — DV с sequence number у каждой записи для подавления петель.\n  - **OLSR** (Optimized Link State Routing, RFC 3626) — оптимизация Link-State через **MPR** (Multipoint Relays), сокращающие flooding.\n  - Плюсы: маршрут доступен мгновенно. Минусы: постоянные накладные расходы даже при отсутствии трафика.", "- **Реактивные (on-demand)** — маршрут строится в момент возникновения потребности:\n  - **AODV** (Ad-hoc On-demand Distance Vector, RFC 3561): источник рассылает **RREQ** (Route Request) лавинообразно; получатель отвечает **RREP** (Route Reply) по обратному пути. При разрыве связи — **RERR** (Route Error). Никакого периодического трафика, но первый пакет ждёт.\n  - **DSR** (Dynamic Source Routing): полный маршрут вкладывается в заголовок (source routing), узлы кешируют известные маршруты.\n  - Плюсы: малые накладные расходы при низкой активности. Минусы: задержка установки маршрута, плохо масштабируется.", "- **Гибридные**:\n  - **ZRP** (Zone Routing Protocol): внутри **зоны** радиуса r (количество хопов) — проактивный обмен; между зонами — реактивный.\n  - **HSR** (Hierarchical State Routing) — иерархия кластеров.", "- **Geographic / Location-Based**:\n  - **GPSR** (Greedy Perimeter Stateless Routing): пакет пересылается соседу, который «ближе всех» к получателю по координатам GPS; обходит «дыры» по правилу правой руки.", "- **Energy-aware**: целевая функция учитывает остаточный заряд батареи и стоимость передачи (например, MTPR — Minimum Total Transmission Power Routing).", "<h3>VANET и сенсорные сети</h3>", "- **VANET** (Vehicular Ad-hoc Network) — частный случай MANET для автомобилей; стандарты **DSRC**/IEEE 802.11p, **C-V2X**. Требует низкой задержки (<100 мс) для безопасности дорожного движения.\n- **WSN** (Wireless Sensor Networks) — крайне ограниченные узлы, обычно используют простые протоколы LEACH (кластеризация с ротацией), Directed Diffusion, RPL (RFC 6550, основной протокол IoT-сетей по 6LoWPAN)."], "terms": [{"ru": "Треугольная маршрутизация", "en": "triangle routing", "df": "неоптимальный путь через домашний агент"}, {"ru": "MANET", "en": "Mobile Ad-hoc Network", "df": "самоорганизующаяся сеть без инфраструктуры"}, {"ru": "VANET", "en": "Vehicular Ad-hoc Network", "df": "автомобильная ad-hoc-сеть"}, {"ru": "WSN", "en": "Wireless Sensor Network", "df": "беспроводная сенсорная сеть"}, {"ru": "AODV", "en": "Ad hoc On-Demand Distance Vector", "df": "реактивный протокол (RREQ/RREP/RERR)"}, {"ru": "DSR", "en": "Dynamic Source Routing", "df": "реактивный протокол с маршрутом в заголовке пакета"}, {"ru": "ZRP", "en": "Zone Routing Protocol", "df": "гибридный протокол (зона/межзона)"}, {"ru": "MPR", "en": "Multipoint Relay", "df": "узел, ретранслирующий flooding в OLSR"}, {"ru": "RPL", "en": "Routing Protocol for Low-power and Lossy Networks, RFC 6550", "df": "основной IoT-протокол"}], "summary": ["Классические алгоритмы предполагают **статическую топологию**; мобильные хосты и **MANET** нарушают это", "**Mobile IPv4** (RFC 5944) и **Mobile IPv6** (RFC 6275) — сохраняют **постоянный IP** при переходе между сетями", "Без Mobile IP смена сети → новый IP → TCP-соединения разорваны", "**HoA** (Home Address) — постоянный IP в домашней сети", "**HA** (Home Agent) — роутер в домашней сети, знает текущее местоположение", "**FA** (Foreign Agent) — в посещаемой сети (Mobile IPv4); в IPv6 не нужен (SLAAC сам)", "**CoA** (Care-of Address) — временный адрес в чужой сети", "**CN** (Correspondent Node) — собеседник", "Процесс: 1) хост получает CoA по DHCP/SLAAC; 2) **Binding Update** к HA; 3) CN шлёт на HoA → домашняя сеть", "4) HA перехватывает (proxy ARP) → **туннелирует** (IP-in-IP) на CoA; 5) хост декапсулирует, отвечает напрямую CN", "**Triangle routing**: ответы CN идут через HA, даже если CN рядом → крюк", "**Mobile IPv6 Route Optimization**: CN получает Binding и шлёт напрямую на CoA", "Альтернативы: **PMIPv6** (RFC 5213, сетевая мобильность, в LTE EPC и Wi-Fi calling); HMIPv6; **GTP** — фактический стандарт в 4G/5G", "**MANET** (Mobile Ad-hoc Network): каждый узел = хост + роутер, нет инфраструктуры; ограниченные ресурсы (батарея)", "**Проактивные (table-driven)** MANET: **DSDV** (DV + sequence для подавления петель), **OLSR** (RFC 3626, LS + **MPR** Multipoint Relays)", "**Реактивные (on-demand)**: **AODV** (RFC 3561) — **RREQ → RREP → RERR**; **DSR** (source routing в заголовке); меньше overhead, задержка установки", "**Гибридные**: **ZRP** (зоны, проактив внутри, реактив снаружи), HSR (кластеры)", "**Geographic**: **GPSR** — пересылка соседу ближе к GPS-координатам получателя; обход «дыр» по правой руке", "**Energy-aware**: учёт батареи (MTPR); **VANET** (DSRC/802.11p, C-V2X, <100 мс); **WSN/IoT**: **RPL** (RFC 6550, 6LoWPAN)"]}, {"n": 36, "title": "Подходы к борьбе с перегрузкой: управление доступом, регулирование трафика, сброс нагрузки. Маршрутизация с учетом состояния трафика.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Перегрузка** (congestion) возникает, когда суммарная нагрузка, поступающая в маршрутизатор/сегмент сети, превышает доступную пропускную способность. Очереди в буферах растут, задержка увеличивается, при переполнении пакеты теряются. Без управления перегрузка приводит к **collapse сети**: эффективная пропускная способность падает почти до нуля (явление наблюдалось в ARPANET в 1986). Бороться можно на разных уровнях — со стороны источника (transport-уровень) и со стороны сети (network-уровень). Q36 описывает методы сетевого уровня, ортогональные TCP-механизмам (Q44).", "<h3>Контроль перегрузки vs управление потоком</h3>", "- **Flow control** защищает медленного получателя от быстрого отправителя (между двумя конкретными хостами).\n- **Congestion control** защищает **сеть в целом** от слишком большого числа активных потоков.\n- Эти задачи реализуются разными механизмами и обычно работают одновременно.", "<h3>Управление доступом (admission control)</h3>", "В сетях с QoS-гарантиями (ATM, MPLS-TE, IntServ) перед началом потока сеть проверяет, есть ли ресурсы:\n- Поток описывает свой профиль трафика (пиковая/средняя скорость, размер всплесков).\n- Маршрутизаторы по пути проверяют, могут ли они выделить запрошенную полосу без нарушения уже принятых обязательств.\n- Если не могут — отказ в установлении соединения; уже работающие потоки не страдают.", "Это аналог занятой телефонной линии: вы предпочитаете «short busy» неработающему сервису. В IntServ admission реализуется через **RSVP**, в ATM — через CAC (Connection Admission Control), в MPLS-TE — через signaling.", "<h3>Регулирование трафика (traffic shaping)</h3>", "**Shaping** — сглаживание скачков трафика на источнике или граничном устройстве, чтобы соответствовать договорённому профилю SLA. Два классических алгоритма:", "- **Leaky bucket** (дырявое ведро): пакеты входят с любой скоростью в буфер ёмкости B. Из буфера выходят со **строго постоянной скоростью** R, как капли из дырявого ведра. Если буфер переполнен — новые пакеты отбрасываются. На выходе абсолютно гладкий поток, всплесков нет.\n- **Token bucket** (маркерное ведро): в ведро ёмкости B токенов накапливаются с постоянной скоростью R. Каждая отправка пакета требует один токен (или столько, сколько байт в пакете). Если токены есть — пакет отправляется. **Допускается короткий всплеск** длительностью до B/R, после чего скорость возвращается к R. Более гибкая модель: соответствует природе bursty-трафика.", "Параметры (R, B) образуют **traffic profile** и используются в SLA для маркировки конформного/нет трафика.", "<h3>Сброс нагрузки (load shedding)</h3>", "Когда буфер заполнен, маршрутизатор вынужден **отбрасывать пакеты**. Стратегии:", "- **Tail drop** (drop-from-tail) — простейший: новые пакеты отбрасываются, когда буфер заполнен. Проблема: **глобальная синхронизация TCP** — множество потоков теряют пакеты одновременно, одновременно замедляются и потом снова разгоняются.\n- **Head drop** (drop-from-head) — отбрасывание старых пакетов; для VoIP может улучшить ситуацию.\n- **Priority-based**: пакеты с высоким DSCP сохраняются, низкоприоритетные отбрасываются.\n- **RED** (Random Early Detection, Floyd & Jacobson 1993): маршрутизатор начинает **случайно** отбрасывать пакеты с вероятностью, растущей с заполнением буфера, **до** реального переполнения. TCP-источники получают потери раньше и плавнее снижают скорость; нет синхронизации.\n- **WRED** (Weighted RED) — разные вероятности для разных классов.\n- **CoDel** (Controlled Delay, RFC 8289): целит не на длину очереди, а на её **задержку**; отбрасывает пакеты, если они стояли в очереди дольше порога. Эффективен против **bufferbloat** в домашних роутерах.\n- **PIE** (Proportional Integral controller Enhanced) — аналог CoDel для аппаратной реализации.", "<h3>Явная сигнализация перегрузки</h3>", "- **ECN** (Explicit Congestion Notification, RFC 3168) — вместо отбрасывания маршрутизатор помечает поле ECN в IP-заголовке (Congestion Experienced). TCP-получатель отражает это отправителю через ECE-флаг; отправитель снижает cwnd.\n- **Choke packets** — маршрутизатор отправляет специальный пакет источнику, прося замедлиться (исторический ICMP Source Quench, ныне устарел).\n- **Backpressure** — обратное давление в очередях канального уровня (PAUSE-кадры Ethernet).", "<h3>Маршрутизация с учётом состояния трафика</h3>", "Идея: маршрутизаторы выбирают пути не только по статической стоимости, но и по **текущей загрузке** каналов — обходя перегруженные участки.", "Проблемы:\n- **Осцилляции**: если все маршрутизаторы одновременно переключатся на свободный канал, он тоже перегрузится; через секунду опять переключение обратно. Сеть колеблется.\n- Решения: демпфирование (hysteresis), задержки обновлений, агрегация состояний.", "В современных сетях это реализуется через:\n- **MPLS-TE** с RSVP-TE и off-line системой управления (PCE, Path Computation Element).\n- **Segment Routing** + центральные SDN-контроллеры.\n- **Load-balancing** ECMP с flow-based хешированием (поток держится на одном пути, но новые распределяются).", "<h3>Сводка</h3>", "| Подход | Где работает | Когда применяется |\n|---|---|---|\n| Admission control | сеть, перед потоком | гарантии QoS, VoIP, видео |\n| Traffic shaping | источник / граница | соблюдение SLA |\n| Load shedding (drop) | маршрутизатор, очередь | заполнение буфера |\n| ECN | маршрутизатор + TCP | плавная регулировка без потерь |\n| Adaptive routing | контроль-плоскость | дата-центры, MPLS-TE |\n| TCP cwnd (Q44) | конечные хосты | глобально в Интернете |"], "terms": [{"ru": "Перегрузка", "en": "congestion", "df": "нагрузка на сеть превышает её пропускную способность"}, {"ru": "Управление доступом", "en": "admission control", "df": "отказ в допуске новых потоков при перегрузке"}, {"ru": "Leaky bucket", "en": "дырявое ведро", "df": "выравнивание трафика до постоянной скорости"}, {"ru": "Token bucket", "en": "маркерное ведро", "df": "ограничение средней скорости с допуском всплесков"}, {"ru": "Сброс нагрузки", "en": "load shedding", "df": "отбрасывание пакетов при переполнении буферов"}, {"ru": "RED / WRED", "en": "Random Early Detection", "df": "упреждающее случайное отбрасывание пакетов до переполнения"}, {"ru": "ECN", "en": "Explicit Congestion Notification", "df": "явная маркировка пакетов вместо отбрасывания"}, {"ru": "AQM", "en": "Active Queue Management", "df": "активное управление очередями"}], "summary": ["**Перегрузка** (congestion) — нагрузка > пропускной способности; задержки растут, потери; **collapse сети** (ARPANET 1986, эффективная пропускная ~1%)", "**Flow control** ≠ **congestion control**: первое защищает получателя, второе — сеть в целом; работают одновременно", "**Admission control** в QoS-сетях (ATM, MPLS-TE, IntServ): описать профиль (peak/avg/burst), сеть проверяет ресурсы, отказ или принять", "Реализации admission: **RSVP** в IntServ, **CAC** в ATM, signaling в MPLS-TE", "**Traffic shaping** — сглаживание трафика до согласованного профиля (R, B)", "**Leaky bucket** (дырявое ведро): пакеты входят в буфер B, выходят строго со скоростью R; на выходе абсолютно гладко", "**Token bucket** (маркерное ведро): токены копятся со скоростью R до B; **допускается всплеск длительностью B/R**; гибче для bursty", "Параметры (R, B) = **traffic profile** в SLA", "**Load shedding** (сброс): **tail drop** простой, но вызывает **глобальную синхронизацию TCP**", "**Head drop** для VoIP; **priority-based** по DSCP", "**RED** (Random Early Detection, Floyd/Jacobson 1993): случайные сбросы **до переполнения** с растущей вероятностью; нет синхронизации", "**WRED** — разные веса для классов; **CoDel** (RFC 8289) целит на **задержку в очереди** vs длину — борьба с **bufferbloat**", "**PIE** — аналог CoDel для hardware", "**ECN** (Explicit Congestion Notification, RFC 3168): маршрутизатор ставит CE в IP-заголовке вместо drop; получатель отражает через ECE → отправитель снижает cwnd", "**Choke packets** (исторический ICMP Source Quench, устарел); **backpressure** (Ethernet PAUSE-кадры)", "**Adaptive routing**: обход перегруженных каналов; **проблема осцилляций** — все переключаются на свободный → он перегружается; решение — hysteresis, демпфирование", "Современная реализация: **MPLS-TE + RSVP-TE + PCE**; **Segment Routing + SDN-контроллеры**; **ECMP** с flow-based хешированием", "Сводка: admission (новые потоки), shaping (граница), drop (буфер), ECN (без потерь), adaptive routing (контрол-плоскость), TCP cwnd (хосты)"]}, {"n": 37, "title": "Требования приложений. Формирование трафика. Диспетчеризация пакетов. Управление доступом. Интегральное обслуживание. Дифференцированное обслуживание.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Качество обслуживания** (QoS, Quality of Service) — набор механизмов, обеспечивающих заданные показатели передачи (полоса, задержка, джиттер, потери) для определённых классов трафика. Базовая «best-effort» Интернет-модель не различает пакеты и не даёт гарантий, что неприемлемо для голоса, видеоконференций, промышленных систем реального времени. IETF разработала две архитектуры обеспечения QoS — **IntServ** (Integrated Services, индивидуальные гарантии для каждого потока) и **DiffServ** (Differentiated Services, классы трафика). Поверх них работают четыре строительных кирпича: классификация и маркировка, **shaping/policing**, **scheduling** очередей и **admission control**.", "<h3>Требования приложений</h3>", "| Приложение | Полоса | Задержка | Джиттер | Потери |\n|---|---|---|---|---|\n| Email | низкая | не критична | не критичен | низкие |\n| Передача файлов | переменная | не критична | не критичен | низкие |\n| Веб-сёрфинг | средняя | низкая желательна | не критичен | средние |\n| Аудиостриминг | средняя (128–320 кбит/с) | средняя | низкий | низкие |\n| VoIP | низкая (10–80 кбит/с) | очень низкая (<150 мс) | очень низкий (<30 мс) | до 1% |\n| Видеоконференция | высокая | низкая | низкий | до 1% |\n| Live-видео | очень высокая | низкая | низкий | низкие |\n| Online gaming | средняя | очень низкая (<50 мс) | низкий | низкие |\n| Telemetry / IoT | очень низкая | переменная | переменный | переменные |", "<h3>Формирование трафика (traffic shaping/policing)</h3>", "Источник или граница сети ограничивают свой исходящий трафик в соответствии с согласованным профилем (R, B):", "- **Shaping** буферизует и сглаживает всплески, задерживая лишний трафик (leaky bucket / token bucket — Q36).\n- **Policing** дискретен: пакеты в пределах профиля помечаются «green», за пределами — «yellow» (можно отбросить при перегрузке) или «red» (отбросить сразу). Реализуется через **token-bucket meter** на входе.\n- **srTCM / trTCM** (single/two-rate Three-Color Marker, RFC 2697/2698) — алгоритмы для оценки и маркировки.", "<h3>Диспетчеризация пакетов (packet scheduling)</h3>", "Определяет, в каком порядке маршрутизатор отправляет пакеты из конкурирующих очередей:", "- **FIFO / FCFS** — простейший: первым пришёл, первым ушёл. Без дифференциации.\n- **PQ** (Priority Queuing) — несколько очередей по приоритетам, низкие обслуживаются только после исчерпания высоких. Риск **starvation** низкоприоритетного трафика.\n- **WRR** (Weighted Round Robin) — циклически каждой очереди по числу пакетов в раунде.\n- **WFQ** (Weighted Fair Queuing, Demers-Keshav-Shenker) — даёт каждому потоку полосу пропорционально его весу; основан на виртуальном времени; обеспечивает min-max fairness.\n- **CBQ** (Class-Based Queuing), **HTB** (Hierarchical Token Bucket) — иерархические схемы для деления полосы между классами и подгруппами.\n- **DRR** (Deficit Round Robin) — приближение WFQ с O(1) сложностью на пакет; стандарт в Linux tc.", "<h3>Управление доступом (admission control)</h3>", "Перед предоставлением гарантий новому потоку маршрутизатор проверяет, можно ли его впустить без нарушения уже принятых SLA. Если суммарная полоса всех текущих + нового потока < ресурс канала → допускаем; иначе — отказ (или предоставление best-effort). В IntServ реализуется в RSVP.", "<h3>IntServ — интегральное обслуживание</h3>", "**Integrated Services** (RFC 1633) — модель, обеспечивающая **индивидуальные гарантии для каждого потока** (per-flow QoS).", "- Приложение отправителя описывает поток (Tspec) и желаемые гарантии (Rspec): полоса, max-delay.\n- Сигнализация через **RSVP** (Resource Reservation Protocol, RFC 2205): получатель шлёт **Resv-сообщения** обратно к источнику; каждый маршрутизатор на пути резервирует ресурсы и хранит **per-flow state**.\n- Два класса сервисов:\n  - **Guaranteed Service** (RFC 2212) — жёсткие гарантии полосы и max-delay.\n  - **Controlled Load** (RFC 2211) — мягкие, «как при ненагруженной сети».\n- **Проблема масштабирования**: каждый ядро-маршрутизатор должен хранить состояние десятков миллионов потоков, что невозможно. IntServ нашёл применение только в локальных сетях и на границах операторских доменов.", "<h3>DiffServ — дифференцированное обслуживание</h3>", "**Differentiated Services** (RFC 2474, 2475) — масштабируемая альтернатива. Вместо per-flow состояния маршрутизаторы оперируют **классами** трафика:", "- В заголовке IP байт TOS/Traffic Class интерпретируется как **DSCP** (Differentiated Services Code Point, 6 бит), задающий код **класса** (PHB, Per-Hop Behavior).\n- **На границе** (edge router / classifier) пакеты классифицируются и маркируются DSCP-значением; внутри сети (core) — обрабатываются только по этому DSCP, без состояний потоков.\n- Стандартные PHB:\n  - **DF / BE** (Default / Best-Effort, DSCP 000000) — обычный трафик.\n  - **EF** (Expedited Forwarding, DSCP 101110, RFC 3246) — для трафика с низкой задержкой (голос, видео): обеспечивается приоритетной очередью + policing.\n  - **AF** (Assured Forwarding, RFC 2597) — четыре класса AF1x–AF4x, в каждом три уровня drop-precedence; гарантированная минимальная полоса.\n  - **CS** (Class Selector) — обратная совместимость с IP precedence.\n- **Bandwidth broker** или SDN-контроллер управляют SLA между доменами.", "Преимущества: O(1) состояний в ядре, лёгкое внедрение, эффективная агрегация.", "<h3>QoS в реальных сетях</h3>", "- Современные операторские сети используют DiffServ для классификации, MPLS-TE для резервирования путей, RSVP-TE для сигнализации.\n- В Wi-Fi 802.11e / WMM — четыре класса (AC_VO, VI, BE, BK), отображаемые на DSCP.\n- В Ethernet — 802.1p (3 бита в VLAN-теге PCP).\n- В 5G — **5QI** (5G QoS Identifier) и **Network Slicing** для логической изоляции потоков."], "terms": [{"ru": "QoS", "en": "Quality of Service", "df": "гарантии качества обслуживания в сети"}, {"ru": "SLA", "en": "Service Level Agreement", "df": "соглашение об уровне обслуживания"}, {"ru": "Джиттер", "en": "jitter", "df": "колебания задержки между пакетами"}, {"ru": "WFQ", "en": "Weighted Fair Queuing", "df": "диспетчеризация с распределением полосы по весам"}, {"ru": "IntServ", "en": "Integrated Services", "df": "архитектура QoS с индивидуальными гарантиями для потоков"}, {"ru": "RSVP", "en": "Resource Reservation Protocol", "df": "протокол резервирования ресурсов вдоль пути"}, {"ru": "DiffServ", "en": "Differentiated Services", "df": "архитектура QoS на основе классов трафика"}, {"ru": "DSCP", "en": "Differentiated Services Code Point", "df": "6-битное поле маркировки в заголовке IP"}, {"ru": "PHB", "en": "Per-Hop Behavior", "df": "поведение маршрутизатора для данного DSCP"}, {"ru": "EF", "en": "Expedited Forwarding", "df": "класс DiffServ для трафика с низкой задержкой"}, {"ru": "AF", "en": "Assured Forwarding", "df": "класс DiffServ с несколькими уровнями приоритета и потерь"}], "summary": ["**QoS** = механизмы для обеспечения полосы/задержки/джиттера/потерь; базовая best-effort модель не различает пакеты", "IETF: две архитектуры — **IntServ** (per-flow) и **DiffServ** (классы)", "Кирпичи QoS: классификация/маркировка, **shaping/policing**, **scheduling**, **admission control**", "**Требования приложений**: email/файлы — нечувствительны; VoIP — задержка <150 мс, джиттер <30 мс, потери <1%; видеоконф — высокая полоса; gaming — <50 мс; IoT — варьируется", "**Shaping**: буферизует, сглаживает (leaky/token bucket — Q36)", "**Policing**: дискретно — пакеты «green» (в профиле), «yellow» (отбросить при перегрузке), «red» (отбросить сразу)", "Стандарты: **srTCM/trTCM** (RFC 2697/2698) — Three-Color Marker", "**Scheduling**: **FIFO** (без дифференциации); **PQ** (приоритетные очереди — риск **starvation** низкоприоритетных)", "**WRR** (Weighted Round Robin) — по числу пакетов на класс; **WFQ** (Weighted Fair Queuing) — полоса пропорциональна весу, виртуальное время, min-max fairness", "**CBQ, HTB** (hierarchical) — иерархическое деление; **DRR** (Deficit Round Robin) — O(1) приближение WFQ, стандарт в Linux tc", "**Admission control** — перед потоком: суммарная полоса с новым < ресурс → допустить; иначе отказ или best-effort", "**IntServ** (RFC 1633) — **per-flow гарантии**; описание Tspec/Rspec", "Сигнализация **RSVP** (RFC 2205): получатель шлёт **Resv** обратно, каждый роутер хранит per-flow state", "IntServ классы: **Guaranteed Service** (RFC 2212, жёсткие гарантии) и **Controlled Load** (RFC 2211, мягкие)", "Проблема IntServ: не масштабируется (миллионы потоков в ядре) → только LAN и границы", "**DiffServ** (RFC 2474/2475) — масштабируемая: классы вместо потоков", "**DSCP** (6 бит в ToS/Traffic Class), **PHB** (Per-Hop Behavior); маркировка на edge, обработка в core без state", "Стандартные PHB: **DF/BE** (000000, обычный); **EF** (Expedited Forwarding, 101110, RFC 3246 — приоритет+policing); **AF** (Assured Forwarding, AF1x–AF4x с 3 уровнями drop, RFC 2597); **CS** (Class Selector, обратная совместимость)", "Применения: операторские сети — DiffServ + MPLS-TE + RSVP-TE; Wi-Fi **WMM/802.11e** (4 AC); Ethernet **802.1p** (3 бит в PCP); 5G **5QI** + Network Slicing"]}, {"n": 38, "title": "Объединение сетей. Различия сетей и способы объединения сетей. Туннелирование. Маршрутизация в объединённых сетях. Фрагментация пакетов.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Объединение сетей** (internetworking) — построение единой логической сети из множества физически разнородных сетей (Ethernet, Wi-Fi, оптика, спутник, ATM, MPLS), отличающихся технологиями, адресацией, MTU, поддержкой QoS, моделями доставки. Задача решается через **универсальный сетевой протокол IP**, который абстрагирует все эти различия за счёт логической адресации и маршрутизаторов. Internetworking — ключевая идея, превратившая ARPANET и его наследников в глобальный Интернет, состоящий сегодня из десятков тысяч AS.", "<h3>Различия объединяемых сетей</h3>", "Сети могут отличаться по:\n- **Технологии физического и канального уровней** (Ethernet, Wi-Fi, ATM, SONET, PPP, Frame Relay).\n- **Адресации** (MAC 48 бит, ATM AAL, IPv4 32 бит, IPv6 128 бит).\n- **MTU** — максимальному размеру пакета: Ethernet 1500, FDDI 4352, IPv6 минимум 1280, jumbo до 9000.\n- **Гарантиям**: best-effort vs гарантии VC.\n- **Поддержке broadcast/multicast**.\n- **Полудуплекс / дуплекс**.\n- **Шифрование**, **QoS**, **управление потоком**.", "<h3>Способы объединения на разных уровнях</h3>", "- **L1 — повторители**: просто продлевают физическую среду; не различают пакеты, не подходят для разных технологий.\n- **L2 — мосты/коммутаторы**: объединяют сети с одинаковым или похожим канальным уровнем (Ethernet ↔ Wi-Fi через AP), формируя один broadcast-домен. Не подходят для разнородных технологий.\n- **L3 — маршрутизаторы**: основное средство объединения, оперируют единым IP-протоколом, преобразуя L2-кадры на каждом сегменте.\n- **L4+ — шлюзы (gateways)**: преобразуют протоколы прикладного уровня — SIP↔H.323, SMTP↔X.400, NAT (L4) для адресной трансляции.", "<h3>Туннелирование</h3>", "**Tunneling** — приём, при котором пакет одного протокола **инкапсулируется** как полезная нагрузка пакета другого протокола, чтобы пройти через несовместимую транзитную сеть. На выходе из туннеля внешний заголовок снимается, и исходный пакет продолжает путь.", "Применения:\n- **IPv4-over-IPv6** и **IPv6-over-IPv4** (6in4, RFC 4213; 6to4, RFC 3056; Teredo, RFC 4380) — переход к IPv6.\n- **GRE** (Generic Routing Encapsulation, RFC 2784) — универсальная инкапсуляция любого L3-протокола в IP.\n- **L2TP** (Layer 2 Tunneling Protocol) — туннели уровня 2 поверх IP, для VPN.\n- **PPTP** (Point-to-Point Tunneling Protocol) — устаревший VPN.\n- **IPSec в туннельном режиме** — шифрованный туннель «шлюз–шлюз».\n- **VXLAN** (RFC 7348), **GENEVE**, **NVGRE** — L2-over-L4 туннели для дата-центров, преодолевают ограничение 4094 VLAN.\n- **MPLS** (Q31) — фактически тоже туннель: L3-пакет переносится по LSP, не «зная» о промежуточных маршрутизаторах.\n- **TLS/SSH-туннели** — на прикладном уровне.", "Цена туннелирования: дополнительные накладные расходы заголовков (20+8+24 байт для GRE), уменьшение эффективного MTU.", "<h3>Маршрутизация в объединённой сети</h3>", "Объединение работает за счёт того, что **все маршрутизаторы используют единый сетевой протокол** (IP). Маршрутизатор смотрит на IP-адрес назначения, по таблице маршрутизации находит исходящий интерфейс и следующий хоп, преобразует L2-инкапсуляцию (например, перепаковывает данные из Ethernet-кадра в PPP-кадр) и отправляет дальше. Хосты на концах используют только IP-уровень и выше — нижние различия скрыты.", "<h3>Фрагментация пакетов</h3>", "Если пакет больше MTU исходящего канала, он не пройдёт целиком. Возможные подходы:", "1. **Прозрачная фрагментация** (внутри сети): первый маршрутизатор-входа в субсеть с меньшим MTU дробит пакет, последний — собирает. Используется, например, в ATM (AAL5 SAR). Минусы: сложность маршрутизатора, требуется одна-и-та-же пара входа/выхода.\n2. **Сквозная фрагментация** (IPv4): любой маршрутизатор по пути может фрагментировать пакет; сборка происходит **только на конечном хосте-получателе** по полям Identification, MF, Fragment Offset. Минусы: нагрузка на получатель, рост вероятности потери (один потерянный фрагмент = весь пакет на повтор).\n3. **Запрет фрагментации** (IPv6 + IPv4 с DF=1): маршрутизаторы не фрагментируют; пакет, превышающий MTU, отбрасывается с ICMP «Packet Too Big» или «Fragmentation Needed». Источник применяет **Path MTU Discovery** (PMTUD, RFC 1191/8201): итеративно уменьшает размер пакета, пока не пройдёт.", "**Поля IPv4-фрагментации**:\n- **Identification** (16 бит) — одинаковый ID для всех фрагментов исходного пакета.\n- **DF** (Don't Fragment) — флаг запрета фрагментации.\n- **MF** (More Fragments) — флаг «есть ещё фрагменты»; у последнего = 0.\n- **Fragment Offset** (13 бит) — смещение фрагмента от начала исходных данных в **единицах по 8 байт**.", "**IPv6** упразднил промежуточную фрагментацию: фрагментировать может только источник через **Fragment Extension Header**. Это разгрузило маршрутизаторы. Минимальный MTU в IPv6 — 1280 байт (никакой канал не должен быть меньше).", "**Path MTU Discovery в IPv6** обязателен, иначе крупные TCP-сегменты могут вечно отбрасываться при «чёрной дыре» ICMPv6."], "terms": [{"ru": "Internetworking", "en": "объединение сетей", "df": "связывание разнородных сетей в единую систему через L3"}, {"ru": "Туннелирование", "en": "tunneling", "df": "инкапсуляция пакета одного протокола внутрь другого"}, {"ru": "MTU", "en": "Maximum Transmission Unit", "df": "максимальный размер пакета, допустимый в данной сети"}, {"ru": "Фрагментация", "en": "fragmentation", "df": "разбиение пакета на части при превышении MTU"}, {"ru": "DF", "en": "Don't Fragment", "df": "флаг в IPv4, запрещающий фрагментацию"}, {"ru": "MF", "en": "More Fragments", "df": "флаг IPv4 «есть ещё фрагменты»"}], "summary": ["**Internetworking** = единая логическая сеть из разнородных физических (Ethernet, Wi-Fi, ATM, MPLS, спутник) через **IP**", "Различия объединяемых сетей: технологии PHY/L2; адресация (MAC 48, ATM AAL, IPv4 32, IPv6 128); **MTU** (Ethernet 1500, FDDI 4352, IPv6 min 1280, jumbo 9000)", "Также: гарантии (best-effort vs VC); broadcast/multicast; дуплекс; шифрование; QoS", "**Способы объединения по уровням**: L1 — повторители (продлевают среду); L2 — мосты/коммутаторы (один broadcast-домен); **L3 — маршрутизаторы (основное)**; L4+ — шлюзы (преобразование протоколов, NAT)", "**Туннелирование** (tunneling): инкапсуляция пакета одного протокола в полезную нагрузку другого", "Применения: **6in4** (RFC 4213), **6to4** (RFC 3056), Teredo (RFC 4380) — IPv6 через IPv4", "**GRE** (RFC 2784) — универсальная инкапсуляция любого L3; **L2TP**, PPTP — VPN L2", "**IPSec туннельный режим** — шифрованный gateway-to-gateway; **VXLAN** (RFC 7348), GENEVE, NVGRE — L2 поверх UDP в ДЦ", "**MPLS** — тоже туннель; **TLS/SSH-туннели** — на L7", "Цена туннелей: дополнительные заголовки (20+8+24 для GRE
