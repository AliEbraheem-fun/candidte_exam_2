<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кандидатский экзамен — Блок 3</title>
<style>
:root{
  --bg:#0d1117;--sidebar:#161b22;--surface:#1c2128;--card:#21262d;
  --border:#30363d;--accent:#58a6ff;--accent2:#79c0ff;--purple:#bc8cff;
  --green:#3fb950;--orange:#e3b341;--red:#ff7b72;--pink:#f778ba;
  --text:#e6edf3;--muted:#7d8590;--muted2:#484f58;--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',system-ui,sans-serif;display:flex;height:100vh;height:100dvh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:270px;min-width:270px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:16px 14px 12px;border-bottom:1px solid var(--border)}
.logo-title{font-size:.95rem;font-weight:800;color:var(--accent);margin-bottom:2px}
.sidebar-header p{font-size:.75rem;color:var(--muted2)}
.nav-list{flex:1;overflow-y:auto;padding:6px 0}
.nav-list::-webkit-scrollbar{width:4px}
.nav-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.nav-item{display:flex;align-items:flex-start;gap:8px;padding:8px 14px;cursor:pointer;border-left:3px solid transparent;transition:background .12s;user-select:none}
.nav-item:hover{background:rgba(88,166,255,.06)}
.nav-item.active{background:rgba(88,166,255,.1);border-left-color:var(--accent)}
.nav-num{font-size:.68rem;font-weight:700;color:var(--muted2);background:var(--surface);border-radius:4px;padding:2px 6px;margin-top:1px;white-space:nowrap;flex-shrink:0}
.nav-item.active .nav-num{background:var(--accent);color:#000}
.nav-text{font-size:.78rem;line-height:1.35;color:var(--muted)}
.nav-item.active .nav-text{color:var(--text)}
.sidebar-footer{padding:10px 14px;border-top:1px solid var(--border);font-size:.75rem;color:var(--muted)}
.progress-mini{height:4px;background:var(--border);border-radius:99px;margin-top:5px;overflow:hidden}
.progress-mini-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* MAIN */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.topbar{position:sticky;top:0;background:rgba(13,17,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:8px 24px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:10}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-title{font-size:.88rem;color:var(--muted);max-width:500px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;gap:6px;align-items:center}
.btn-sm{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.78rem;cursor:pointer;transition:all .12s;user-select:none}
.btn-sm:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm.active-tab{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700}
.content{padding:24px;max-width:920px;width:100%;margin:0 auto;flex:1}

/* HOME */
.home-title{font-size:1.4rem;font-weight:800;margin-bottom:4px;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.home-sub{color:var(--muted);margin-bottom:24px;font-size:.85rem}
.topics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.topic-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;cursor:pointer;transition:all .15s;overflow:hidden}
.topic-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.topic-card-num{font-size:.68rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.topic-card-name{font-size:.95rem;font-weight:700;line-height:1.35;margin-bottom:8px}
.topic-card-info{font-size:.78rem;color:var(--muted);display:flex;gap:14px}
.topic-card-btns{display:flex;gap:6px;margin-top:12px}
.tc-btn{padding:5px 12px;border-radius:6px;font-size:.75rem;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:all .12s}
.tc-btn:hover{border-color:var(--accent);color:var(--accent)}
.tc-btn.primary{background:var(--accent);border-color:var(--accent);color:#000}

/* KEYWORD COLORS */
.kw{font-weight:600;border-radius:3px;padding:0 2px}
.kw-proto{color:#58a6ff}           /* protocols: TCP, UDP, IP, HTTP */
.kw-std{color:#3fb950}             /* standards: IEEE 802.x, RFC, ISO */
.kw-abbr{color:#bc8cff}            /* abbreviations: PAN, LAN, QoS */
.kw-concept{color:#e3b341}         /* key concepts in bold */
.kw-en{color:#79c0ff;font-style:italic;font-size:.88em} /* English in parens */
.kw-ru{color:#f778ba}              /* important Russian terms */

/* MARKDOWN LISTS */
.md-list{list-style:none;padding:0;margin:8px 0}
.md-list>li{padding:5px 10px;border-left:2px solid var(--accent);margin-bottom:4px;background:rgba(88,166,255,.03);border-radius:0 6px 6px 0;font-size:.9rem;line-height:1.6}
.md-sub{list-style:disc;padding-left:22px;margin:2px 0 6px}
.md-sub>li{padding:2px 0;font-size:.87rem;line-height:1.5;color:var(--muted)}
.md-sub>li .kw{color:inherit}
.md-sub>li .kw-concept{color:var(--orange)}
.md-sub>li .kw-proto{color:var(--accent)}
.md-sub>li .kw-std{color:var(--green)}

/* INLINE QUIZ */
.iq-section{margin-top:4px}
.iq-box{background:rgba(99,102,241,.04);border:1px solid rgba(88,166,255,.2);border-radius:var(--r);padding:14px 16px}
.iq-title{font-size:.72rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.iq-title::before{content:'';width:16px;height:2px;background:var(--accent);border-radius:99px;flex-shrink:0}
.iq-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.iq-q{font-size:.88rem;font-weight:500;line-height:1.5;margin-bottom:10px}
.iq-opts{display:flex;flex-direction:column;gap:5px}
.iq-opt{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:all .12s;user-select:none;font-size:.84rem;line-height:1.4}
.iq-opt:hover:not(.iq-dis){border-color:var(--accent)}
.iq-opt.iq-ok{border-color:var(--green);background:rgba(63,185,80,.08)}
.iq-opt.iq-no{border-color:var(--red);background:rgba(255,123,114,.06)}
.iq-opt.iq-dis{cursor:default;pointer-events:none;opacity:.7}
.iq-opt.iq-dis.iq-ok{opacity:1}
.iq-ltr{width:20px;height:20px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0}
.iq-opt.iq-ok .iq-ltr{background:var(--green);color:#000}
.iq-opt.iq-no .iq-ltr{background:var(--red);color:#000}
.iq-fb{margin-top:8px;padding:8px 10px;border-radius:6px;font-size:.82rem;line-height:1.45;display:none}
.iq-fb.show{display:block}
.iq-fb.iq-fb-ok{background:rgba(63,185,80,.06);border:1px solid rgba(63,185,80,.2);color:var(--green)}
.iq-fb.iq-fb-no{background:rgba(255,123,114,.04);border:1px solid rgba(255,123,114,.15);color:var(--red)}
.iq-tf{display:flex;gap:8px}
.iq-tf-btn{flex:1;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.88rem;font-weight:600;cursor:pointer;transition:all .12s}
.iq-tf-btn:hover:not(.iq-dis){border-color:var(--accent)}
.iq-tf-btn.iq-ok{border-color:var(--green);background:rgba(63,185,80,.08);color:var(--green)}
.iq-tf-btn.iq-no{border-color:var(--red);background:rgba(255,123,114,.06);color:var(--red)}
.iq-score{font-size:.78rem;color:var(--muted);margin-top:8px;text-align:right}

/* SUMMARY (write-on-paper) */
.sum-box{background:var(--surface);border:1px solid rgba(188,140,255,.3);border-left:3px solid var(--purple);border-radius:var(--r);padding:14px 16px;margin-top:4px}
.sum-title{font-size:.72rem;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sum-title::before{content:'';width:16px;height:2px;background:var(--purple);border-radius:99px;flex-shrink:0}
.sum-list{list-style:none;display:flex;flex-direction:column;gap:5px}
.sum-item{font-size:.84rem;line-height:1.45;color:var(--text);padding-left:14px;position:relative}
.sum-item::before{content:'›';position:absolute;left:0;color:var(--purple);font-weight:700}

/* QUESTION LIST */
.q-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.q-hdr{padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .12s;user-select:none}
.q-hdr:hover{background:rgba(88,166,255,.04)}
.q-badge{font-size:.68rem;font-weight:700;color:#000;background:var(--accent);border-radius:4px;padding:2px 8px;flex-shrink:0}
.q-ttl{font-size:.88rem;font-weight:600;line-height:1.35;flex:1}
.q-chev{color:var(--muted);transition:transform .2s;font-size:.8rem}
.q-chev.open{transform:rotate(180deg)}
.q-body{display:none;padding:0 18px 18px;border-top:1px solid var(--border);user-select:text;-webkit-user-select:text}
.q-body.visible{display:block;animation:slideIn .2s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ANSWER TEXT */
.a-section{margin-top:16px}
.a-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.a-label::before{content:'';width:16px;height:2px;background:var(--accent);border-radius:99px;flex-shrink:0}
.copy-btn{margin-left:auto;padding:2px 8px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:.7rem;cursor:pointer;transition:all .15s;user-select:none}
.copy-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.copy-btn.copied{background:var(--green);color:#fff;border-color:var(--green)}
.a-text{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r);padding:16px 18px;font-size:.9rem;line-height:1.8}
.a-text p{margin-bottom:8px}
.a-text p:last-child{margin-bottom:0}

/* TERMS GRID */
.t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:6px;margin-top:4px}
.t-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.t-ru{font-weight:700;font-size:.85rem;color:var(--orange)}
.t-en{font-size:.76rem;color:var(--accent);font-style:italic}
.t-df{font-size:.78rem;color:var(--muted);line-height:1.35}

/* QUIZ */
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px 28px;animation:slideIn .3s ease;margin-bottom:16px}
.qt-badge{padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:inline-block;margin-bottom:12px}
.badge-mcq{background:rgba(88,166,255,.15);color:var(--accent)}
.badge-tf{background:rgba(227,179,65,.15);color:var(--orange)}
.badge-match{background:rgba(63,185,80,.15);color:var(--green)}
.badge-fill{background:rgba(255,123,114,.15);color:var(--red)}
.q-text{font-size:1rem;font-weight:500;line-height:1.55;margin-bottom:18px}
.options{display:flex;flex-direction:column;gap:8px}
.option{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s;user-select:none}
.option:hover:not(.disabled){border-color:var(--accent);background:rgba(88,166,255,.08)}
.option.correct{border-color:var(--green);background:rgba(63,185,80,.1)}
.option.incorrect{border-color:var(--red);background:rgba(255,123,114,.08)}
.option.disabled{cursor:default;pointer-events:none}
.o-letter{width:24px;height:24px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.option.correct .o-letter{background:var(--green);color:#000}
.option.incorrect .o-letter{background:var(--red);color:#000}
.o-text{line-height:1.45;font-size:.88rem}
.tf-options{display:flex;gap:10px}
.tf-btn{flex:1;padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.95rem;font-weight:600;cursor:pointer;transition:all .15s}
.tf-btn:hover:not(.disabled){border-color:var(--accent)}
.tf-btn.correct{border-color:var(--green);background:rgba(63,185,80,.1);color:var(--green)}
.tf-btn.incorrect{border-color:var(--red);background:rgba(255,123,114,.08);color:var(--red)}
.tf-btn.disabled{cursor:default;pointer-events:none}
.match-container{display:flex;gap:14px}
.match-col{flex:1;display:flex;flex-direction:column;gap:6px}
.match-col h4{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.match-item{padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:.85rem;cursor:pointer;transition:all .15s;user-select:none}
.match-item:hover:not(.disabled):not(.matched-correct){border-color:var(--accent)}
.match-item.active{border-color:var(--accent);background:rgba(88,166,255,.15)}
.match-item.matched-correct{border-color:var(--green);background:rgba(63,185,80,.08);cursor:default}
.match-item.matched-wrong{border-color:var(--red);background:rgba(255,123,114,.06);cursor:default}
.fill-wrap{display:flex;flex-direction:column;gap:8px}
.fill-input{padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.95rem;outline:none}
.fill-input:focus{border-color:var(--accent)}
.fill-input.correct{border-color:var(--green)}
.fill-input.incorrect{border-color:var(--red)}
.feedback{margin-top:14px;padding:12px 14px;border-radius:8px;font-size:.85rem;line-height:1.55;display:none}
.feedback.show{display:block}
.feedback.correct-fb{background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.25)}
.feedback.incorrect-fb{background:rgba(255,123,114,.06);border:1px solid rgba(255,123,114,.2)}
.fb-title{font-weight:700;margin-bottom:3px}
.feedback.correct-fb .fb-title{color:var(--green)}
.feedback.incorrect-fb .fb-title{color:var(--red)}
.quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.quiz-progress{color:var(--muted);font-size:.82rem}
.btn-q{padding:7px 18px;border-radius:6px;border:none;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .12s}
.btn-q-p{background:var(--accent);color:#000}
.btn-q-p:hover{background:var(--accent2)}
.btn-q-p:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.btn-q-s{background:var(--surface);color:var(--text);border:1px solid var(--border)}

/* RESULTS */
.res-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:36px;text-align:center}
.sc-circle{width:110px;height:110px;border-radius:50%;border:4px solid var(--accent);display:flex;align-items:center;justify-content:center;flex-direction:column;margin:0 auto 18px;background:rgba(88,166,255,.08)}
.sc-num{font-size:2.2rem;font-weight:800;color:var(--accent2)}
.sc-tot{font-size:.82rem;color:var(--muted)}
.res-title{font-size:1.3rem;font-weight:700;margin-bottom:6px}
.res-sub{color:var(--muted);margin-bottom:18px}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.res-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px}
.res-n{font-size:1.4rem;font-weight:700}
.res-l{font-size:.75rem;color:var(--muted)}
.back-btn{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:.8rem;cursor:pointer;margin-bottom:16px;padding:3px 0;user-select:none}
.back-btn:hover{color:var(--accent)}

/* EXPAND ALL */
.expand-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}

/* MENU TOGGLE (mobile hamburger) */
.menu-toggle{display:none;background:var(--surface);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:6px;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;flex-shrink:0;padding:0}
.menu-toggle:hover,.menu-toggle:focus{border-color:var(--accent);color:var(--accent);outline:none}

/* SEARCH */
.search-wrap{position:relative;flex:1;max-width:360px;min-width:0}
.search-input{width:100%;padding:6px 28px 6px 30px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.82rem;outline:none;transition:border-color .12s;font-family:inherit}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--muted)}
.search-input::-webkit-search-cancel-button{display:none}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem;pointer-events:none}
.search-clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:0 6px;border-radius:4px;display:none}
.search-clear:hover{color:var(--text)}
.search-clear.show{display:block}

/* SEARCH RESULTS */
.sr-header{font-size:.85rem;color:var(--muted);margin-bottom:12px}
.sr-empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:.9rem;line-height:1.6}
.sr-list{display:flex;flex-direction:column;gap:8px}
.sr-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;cursor:pointer;transition:all .12s}
.sr-item:hover{border-color:var(--accent);background:rgba(88,166,255,.04);transform:translateY(-1px)}
.sr-topic{font-size:.68rem;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.sr-title{font-size:.9rem;font-weight:600;line-height:1.4;margin-bottom:4px}
.sr-snippet{font-size:.8rem;color:var(--muted);line-height:1.5}
.sr-snippet mark,.sr-title mark{background:rgba(227,179,65,.25);color:var(--orange);border-radius:2px;padding:0 2px}

/* SIDEBAR OVERLAY (mobile) */
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99;display:none;opacity:0;transition:opacity .2s}
.sidebar-overlay.show{display:block;opacity:1}

/* FLASH (after search jump) */
@keyframes flashHL{0%,100%{box-shadow:0 0 0 0 rgba(88,166,255,0)}30%,70%{box-shadow:0 0 0 3px rgba(88,166,255,.55)}}
.q-item.flash{animation:flashHL 1.6s ease}

/* SECTION HEADERS inside answers */
.a-text h3{font-size:.95rem;font-weight:700;color:var(--accent2);margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.a-text h3:first-child{margin-top:0}
.a-text h4{font-size:.85rem;font-weight:700;color:var(--purple);margin:12px 0 6px}

/* FIGURES + IMAGES + SVG inside answers */
.a-text figure{margin:14px 0;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center;overflow:hidden}
.a-text figure svg{max-width:100%;height:auto;display:block;margin:0 auto}
.a-text figure img{max-width:100%;height:auto;border-radius:6px;display:block;margin:0 auto;background:#fff}
.a-text figcaption{margin-top:10px;font-size:.78rem;color:var(--muted);line-height:1.5;font-style:italic}

/* INLINE TABLES inside answers */
.a-text table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.82rem;background:var(--card);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.a-text table th{background:var(--surface);text-align:left;padding:8px 10px;font-weight:700;color:var(--accent2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border)}
.a-text table td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text);line-height:1.5;vertical-align:top}
.a-text table tr:last-child td{border-bottom:none}

@media(max-width:720px){
  body{font-size:14px}

<script>
const TOPICS = [{"id": 1, "name": "Общие принципы построения сетей", "questions": [{"n": 1, "title": "Классификация компьютерных сетей. Сети в организациях. Использование сетей частными лицами. Использование беспроводных сетей.", "paragraphs": ["<h3>Определение и подход к классификации</h3>", "**Компьютерная сеть** (computer network) — совокупность связанных каналами передачи данных автономных вычислительных устройств, способных обмениваться информацией. Сети классифицируют по нескольким независимым критериям одновременно: **масштабу охвата**, **физической топологии**, **технологии передачи**, **праву собственности**, **типу среды** (проводная или беспроводная). Эти критерии ортогональны — одна и та же сеть может одновременно быть, например, LAN, звездообразной, проводной и частной.", "<h3>Классификация по масштабу</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Data_Networks_classification_by_spatial_scope.svg/500px-Data_Networks_classification_by_spatial_scope.svg.png\" alt=\"Классификация компьютерных сетей по пространственному охвату\" loading=\"lazy\"><figcaption>Классификация сетей по пространственному охвату: от BAN/PAN (метры) до WAN (континенты). По мере роста масштаба меняются технологии передачи, типичные задержки и стоимость канала.</figcaption></figure>", "- **PAN** (Personal Area Network) — персональная сеть, охватывает несколько метров вокруг пользователя. Соединение телефона с гарнитурой по Bluetooth, синхронизация ноутбука с принтером по USB, передача файлов между смартфонами.\n- **LAN** (Local Area Network) — локальная сеть, охватывает здание, этаж или кампус. Скорости 100 Мбит/с – 100 Гбит/с, низкая задержка (<1 мс), одно административное управление. Технологии: Ethernet (IEEE 802.3), Wi-Fi (IEEE 802.11).\n- **MAN** (Metropolitan Area Network) — муниципальная сеть, объединяет узлы в пределах города. Кабельное телевидение, городские точки обмена трафиком (IXP), WiMAX (IEEE 802.16).\n- **WAN** (Wide Area Network) — глобальная сеть, охватывает сотни и тысячи километров, обычно использует арендованные операторские каналы. Технологии: MPLS, Frame Relay, ATM, оптические магистрали SDH/SONET. Интернет — крупнейшая WAN.\n- **Межсетевое соединение** (internetwork) — объединение нескольких разнородных сетей (например, корпоративных LAN, WAN-каналов и публичного Интернета) через маршрутизаторы.", "<h3>Классификация по топологии</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/NetworkTopologies.svg/500px-NetworkTopologies.svg.png\" alt=\"Основные топологии сетей: шина, звезда, кольцо, полная сетка, дерево, гибридная\" loading=\"lazy\"><figcaption>Основные физические топологии сетей. На практике используются гибридные схемы (звёздно-шинные, иерархическое «дерево», частичная сетка).</figcaption></figure>", "- **Шина** (bus): все узлы подключены к общей среде передачи. Простая, но единственная точка отказа на самой шине и подверженность коллизиям. Использовалась в раннем Ethernet (10BASE2 на коаксиальном кабеле).\n- **Звезда** (star): узлы подключаются к центральному устройству — коммутатору. Доминирующая топология современного Ethernet. Отказ узла не влияет на остальных, но отказ центрального коммутатора фатален для всего сегмента.\n- **Кольцо** (ring): каждый узел соединён с двумя соседними; данные передаются по кругу. Token Ring, FDDI; токен-доступ полностью исключает коллизии.\n- **Полная сетка** (full mesh): каждый узел напрямую соединён с каждым. Используется в магистральных сетях операторов для отказоустойчивости. Стоимость растёт как *N(N−1)/2* каналов.\n- **Гибридная** (hybrid): сочетание базовых топологий — например иерархическое «дерево» в кампусных сетях или «звёздно-шинная» в крупных офисах.", "<h3>Классификация по технологии передачи</h3>", "- **Широковещательная рассылка** (broadcast) — один канал разделяется всеми узлами; сообщение получают все, фильтрация выполняется на приёмнике по адресу. Естественна для радиоэфира и общих шин.\n- **Коммутация пакетов** (packet switching) — данные разбиваются на пакеты, каждый маршрутизируется независимо. Эффективное статистическое мультиплексирование канала, основа Интернета.\n- **Коммутация каналов** (circuit switching) — выделение фиксированного канала на время сеанса связи. Классическая телефония (PSTN). Гарантия пропускной способности, но низкая утилизация при паузах в трафике.", "<h3>Классификация по собственности</h3>", "- **Частная** (private) — принадлежит одной организации, обычно изолирована от внешних сетей.\n- **Публичная** (public) — Интернет, инфраструктура общего пользования.\n- **Гибридная** (hybrid) — корпоративные сети, связанные через VPN-туннели поверх публичной сети (Site-to-Site IPSec, MPLS L3VPN).", "<h3>Сети в организациях</h3>", "В корпоративной среде сеть решает четыре основные задачи:\n- **Совместный доступ к ресурсам** — файловые серверы, принтеры, базы данных, единая аутентификация через Active Directory или LDAP.\n- **Внутренние коммуникации** — корпоративная почта, мессенджеры, видеоконференции (VoIP, Microsoft Teams).\n- **Электронная коммерция** — связь с поставщиками и клиентами через защищённые каналы, обработка платежей.\n- **Удалённая работа и связь филиалов** — VPN-доступ сотрудников из дома, объединение офисов через арендованные WAN-каналы или MPLS L3VPN.", "Типичная архитектура корпоративной сети — иерархическая: коммутаторы доступа на каждом этаже → уровень агрегации → ядро с маршрутизаторами и межсетевыми экранами → выход в Интернет через одного или нескольких ISP. Между офисами организуются защищённые туннели IPSec поверх Интернета или выделенные каналы.", "<h3>Сети у частных лиц</h3>", "Домашнее подключение к сети состоит из двух частей:\n- **«Последняя миля»** — канал от провайдера до квартиры. Варианты: ADSL по медной паре, DOCSIS по коаксиалу кабельного ТВ, GPON по оптике (FTTH), либо мобильный канал LTE/5G.\n- **Домашняя LAN** — Wi-Fi роутер с встроенным коммутатором; к нему подключаются проводные клиенты (ПК, smart-TV) и беспроводные (смартфоны, ноутбуки, устройства IoT).", "Основные сценарии использования: веб-сёрфинг, потоковое видео (Netflix, YouTube), онлайн-игры (где задержка важнее ширины канала), облачное резервное копирование, голосовое и видеообщение, умный дом (IoT-устройства, голосовые помощники).", "<h3>Беспроводные сети</h3>", "**Беспроводные сети** (wireless networks) используют электромагнитные волны (радиодиапазон, ИК, лазер) вместо физических кабелей. Они применяются там, где прокладка кабеля невозможна, экономически нецелесообразна или ограничивает мобильность пользователей: склады, стройки, мобильные сотрудники, удалённые регионы.", "Основные технологии группируются по масштабу применения:\n- **PAN**: Bluetooth (IEEE 802.15.1), Zigbee (IEEE 802.15.4), NFC, IrDA.\n- **LAN**: Wi-Fi семейства IEEE 802.11 (a/b/g/n/ac/ax).\n- **MAN**: WiMAX (IEEE 802.16) — устаревает; LTE в режиме фиксированного беспроводного доступа.\n- **WAN**: сотовые сети 3G (UMTS), 4G (LTE), 5G; спутниковая связь — геостационарная (GEO), средневысотная (MEO), низкоорбитальная (LEO — Starlink, OneWeb).", "Ключевые особенности беспроводной передачи, которые отличают её от проводной:\n- **Общая среда** → коллизии решаются по CSMA/CA (с предупреждением) вместо CSMA/CD (с обнаружением).\n- **Затухание сигнала** с расстоянием и многолучевое распространение — основа технологии MIMO и OFDM.\n- **Открытый эфир** → перехват сигнала тривиален, поэтому требуется шифрование на канальном уровне (WPA2, WPA3 для Wi-Fi; A5/x для GSM).\n- **Спектр** — ограниченный и регулируемый ресурс; ISM-диапазоны (2,4 ГГц, 5 ГГц) свободны, но переполнены."], "terms": [{"ru": "Компьютерная сеть", "en": "computer network", "df": "совокупность связанных каналами передачи данных автономных вычислительных устройств, способных обмениваться информацией"}, {"ru": "PAN", "en": "Personal Area Network", "df": "персональная сеть, охватывает несколько метров вокруг пользователя (Bluetooth, USB)"}, {"ru": "LAN", "en": "Local Area Network", "df": "локальная сеть, охватывает здание или кампус (Ethernet, Wi-Fi)"}, {"ru": "MAN", "en": "Metropolitan Area Network", "df": "муниципальная сеть, охватывает город (кабельное ТВ, WiMAX)"}, {"ru": "WAN", "en": "Wide Area Network", "df": "глобальная сеть, охватывает страну или континент (MPLS, оптические магистрали)"}, {"ru": "Широковещательная рассылка", "en": "broadcast", "df": "режим передачи, при котором сообщение доставляется всем узлам сети одновременно, фильтрация — на приёмнике по адресу"}, {"ru": "Коммутация пакетов", "en": "packet switching", "df": "метод передачи данных, при котором информация разбивается на пакеты и каждый маршрутизируется независимо"}, {"ru": "Коммутация каналов", "en": "circuit switching", "df": "метод передачи, при котором на время сеанса резервируется выделенный канал с гарантированной полосой"}, {"ru": "Топология", "en": "topology", "df": "физическая или логическая схема соединения узлов сети"}, {"ru": "Звёздная топология", "en": "star topology", "df": "все узлы подключены к одному центральному устройству (коммутатору)"}, {"ru": "Полная сетка", "en": "full mesh", "df": "топология, в которой каждый узел напрямую соединён с каждым; число каналов N(N−1)/2"}, {"ru": "Межсетевое соединение", "en": "internetwork / internet", "df": "объединение нескольких разнородных сетей в единую инфраструктуру через маршрутизаторы"}, {"ru": "«Последняя миля»", "en": "last mile", "df": "участок сети от точки присутствия провайдера до конечного абонента"}, {"ru": "Выделенный канал", "en": "leased line", "df": "арендуемый у оператора постоянный канал связи с гарантированной полосой пропускания"}, {"ru": "Широкополосное подключение", "en": "broadband connection", "df": "высокоскоростное подключение к Интернету (DSL, кабель, оптика)"}, {"ru": "Беспроводная сеть", "en": "wireless network", "df": "сеть, в которой данные передаются через электромагнитные волны без физических кабелей"}], "summary": ["**Компьютерная сеть** (computer network) — совокупность автономных вычислительных устройств, связанных каналами и обменивающихся данными", "Критерии классификации (ортогональны): масштаб, топология, технология передачи, собственность, среда", "**По масштабу**: PAN (метры, Bluetooth/USB), LAN (здание, **Ethernet 802.3**/Wi-Fi), MAN (город, DOCSIS/WiMAX), WAN (континент, MPLS/SDH), internetwork (объединение)", "**Топологии**: шина (10BASE2), звезда (совр. Ethernet), кольцо (Token Ring, FDDI), полная сетка (mesh, N(N−1)/2 каналов), гибридная", "**По технологии**: широковещание (broadcast — общая среда, фильтрация на приёмнике); коммутация пакетов (packet switching, статистическое мультиплексирование); коммутация каналов (circuit switching, PSTN)", "**По собственности**: частные, публичные (Интернет), гибридные (VPN/IPSec поверх Интернета, MPLS L3VPN)", "**Сети в организациях**: совместный доступ к ресурсам, корпоративная почта/VoIP, e-commerce, удалённая работа через VPN; иерархия доступ→агрегация→ядро→ISP", "**Сети у частных лиц**: «последняя миля» (ADSL/DOCSIS/GPON/LTE) + домашний Wi-Fi роутер; сценарии — стриминг, игры, IoT", "**Беспроводные сети**: используются для мобильности и там, где кабель невозможен (склады, удалённые регионы)", "Беспроводные технологии по масштабу: PAN — Bluetooth (**802.15.1**), Zigbee (**802.15.4**), NFC; LAN — Wi-Fi (**802.11 a/b/g/n/ac/ax**); WAN — 3G/4G/5G, спутники GEO/MEO/LEO", "Особенности беспроводной передачи: общая среда → **CSMA/CA** вместо CSMA/CD; затухание 1/r² и multipath → **MIMO**/**OFDM**", "Открытый эфир → шифрование на L2 (**WPA2/WPA3** в Wi-Fi, A5/x в GSM); спектр — регулируемый ресурс (**ISM** 2,4/5 ГГц)"]}, {"n": 2, "title": "Персональные, локальные, муниципальные, глобальные сети. Объединение сетей. Иерархия сетевых протоколов. Ключевые аспекты создания компьютерной сети.", "paragraphs": ["<h3>Введение</h3>", "Компьютерные сети классифицируют прежде всего по **масштабу охвата** (geographic scale) — от персональных, охватывающих несколько метров вокруг пользователя, до глобальных, простирающихся на континенты. Масштаб напрямую определяет используемые технологии, типичные задержки, стоимость канала и модель административного управления. Поверх отдельных сетей строятся **объединённые сети** (internetworks), а взаимодействие реализуется через **многоуровневую иерархию протоколов** (protocol hierarchy), обеспечивающую модульность и сокрытие сложности.", "<h3>Сети по масштабу</h3>", "- **PAN** (Personal Area Network) — персональная сеть радиусом до 10 м. Используется для соединения устройств одного пользователя: смартфон с гарнитурой по Bluetooth (IEEE 802.15.1), клавиатура и мышь, носимые устройства (smartwatch), NFC-платежи. Типичные скорости — единицы Мбит/с.\n- **LAN** (Local Area Network) — локальная сеть, охватывает здание или кампус. Скорости 100 Мбит/с – 100 Гбит/с, задержка <1 мс, единое административное управление. Технологии: Ethernet (IEEE 802.3) для проводных сегментов, Wi-Fi (IEEE 802.11) для беспроводных. Низкая стоимость порта, отсутствие операторских тарифов.\n- **MAN** (Metropolitan Area Network) — городская сеть, охватывает десятки километров. Примеры: кабельное телевидение по DOCSIS, городские сети FTTH/PON, муниципальные Wi-Fi, точки обмена трафиком (IXP). Стандарт IEEE 802.16 (WiMAX) исторически рассматривался как MAN-технология.\n- **WAN** (Wide Area Network) — глобальная сеть от сотен до десятков тысяч километров. Использует арендованные каналы операторов: SDH/SONET, MPLS, оптические DWDM-магистрали, спутниковые линии. Высокая стоимость, более высокие задержки (десятки мс), сложное многооператорское взаимодействие.\n- **Интернет** — крупнейшая объединённая сеть, состоящая из десятков тысяч **автономных систем** (AS), связанных через BGP-маршрутизацию.", "<h3>Объединение сетей</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/IP_stack_connections.svg/500px-IP_stack_connections.svg.png\" alt=\"Соединение узлов через уровни стека TCP/IP\" loading=\"lazy\"><figcaption>Логическая схема прохождения данных через уровни стека TCP/IP двух хостов: каждый уровень общается со своим одноимённым партнёром, физически данные передаются только по нижнему уровню.</figcaption></figure>", "**Объединение сетей** (internetworking) — построение единой логической сети из нескольких разнородных физических сетей. Ключевые механизмы:\n- **Маршрутизаторы** (routers, L3) — пересылают пакеты между сетями на основе сетевых адресов (IP). Принимают решения по таблице маршрутизации, могут менять канальный заголовок при переходе между технологиями.\n- **Шлюзы прикладного уровня** (application gateways) — выполняют преобразование на L7 между несовместимыми стеками (например, SMTP ↔ X.400, SIP ↔ H.323).\n- **Туннелирование** (tunneling) — упаковка пакета одного протокола в полезную нагрузку другого: IPv6-over-IPv4 (6in4), GRE, IPSec, VXLAN. Позволяет «протянуть» исходный протокол через несовместимую транзитную сеть.\n- **Трансляция адресов** (NAT, Network Address Translation) — подмена IP-адресов и портов на границе сетей; основной способ совместного использования одного публичного IPv4-адреса несколькими хостами.\n- **Мосты** (bridges, L2) — соединяют сегменты одной канальной технологии, формируя единый широковещательный домен.", "<h3>Иерархия сетевых протоколов</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/UDP_encapsulation.svg/500px-UDP_encapsulation.svg.png\" alt=\"Инкапсуляция данных при прохождении уровней стека TCP/IP\" loading=\"lazy\"><figcaption>Инкапсуляция (на примере UDP-датаграммы): данные приложения последовательно «упаковываются» в заголовки транспортного, сетевого и канального уровней (RFC 1122).</figcaption></figure>", "- **Многоуровневая архитектура** (layered architecture) — функции сети разбиты на уровни; каждый уровень использует услуги нижнего и предоставляет услуги верхнему. Между уровнями определён **интерфейс** (interface), внутри уровня — **протокол**, по которому общаются одноимённые уровни на разных узлах (одноранговые сущности, peers).\n- **Стек протоколов** (protocol stack) — конкретный набор протоколов всех уровней, например TCP/IP-стек (Ethernet → IP → TCP → HTTP).\n- **PDU** (Protocol Data Unit) — единица данных уровня; на разных уровнях имеет разные имена: бит (L1), кадр (L2, frame), пакет (L3, packet), сегмент/датаграмма (L4, segment/datagram), сообщение (L7).\n- **Инкапсуляция** (encapsulation) — при передаче вниз каждый уровень добавляет собственный **заголовок** (header), иногда **концевик** (trailer). При приёме — наоборот, обратная **декапсуляция**.\n- **Принцип сквозной аргументации** (end-to-end principle) — функции, требующие знания о приложении (например, гарантия доставки), должны реализовываться на концах, а не внутри сети.", "<h3>Ключевые аспекты построения сети</h3>", "При проектировании компьютерной сети учитываются:\n- **Надёжность** (reliability) — устойчивость к сбоям каналов и узлов; обеспечивается избыточностью путей, контрольными суммами, повторными передачами.\n- **Масштабируемость** (scalability) — способность расти без переработки архитектуры; обеспечивается иерархической адресацией (CIDR), агрегацией маршрутов, иерархией коммутаторов.\n- **Качество обслуживания** (QoS, Quality of Service) — гарантии полосы, задержки, джиттера, потерь; механизмы DiffServ, IntServ, приоритетные очереди, traffic shaping.\n- **Безопасность** (security) — конфиденциальность (шифрование TLS, IPSec), целостность (HMAC, FCS), аутентификация (802.1X, сертификаты), доступность (защита от DDoS).\n- **Управляемость** (manageability) — мониторинг (SNMP, NetFlow, telemetry), централизованное управление (SDN), автоматизация конфигурирования.\n- **Эффективность** (efficiency) — оптимальное использование канала (статистическое мультиплексирование пакетной коммутации), низкие накладные расходы заголовков.\n- **Совместимость и открытые стандарты** — взаимодействие оборудования разных производителей через документированные протоколы (RFC, IEEE 802)."], "terms": [{"ru": "PAN", "en": "Personal Area Network", "df": "персональная сеть; охватывает несколько метров вокруг пользователя (Bluetooth, NFC)"}, {"ru": "LAN", "en": "Local Area Network", "df": "локальная вычислительная сеть; охватывает здание или кампус (Ethernet, Wi-Fi)"}, {"ru": "MAN", "en": "Metropolitan Area Network", "df": "муниципальная сеть; охватывает город (DOCSIS, FTTH)"}, {"ru": "WAN", "en": "Wide Area Network", "df": "глобальная сеть; охватывает страну или континент (MPLS, SDH)"}, {"ru": "Объединение сетей", "en": "internetworking", "df": "построение единой логической сети из нескольких разнородных физических сетей"}, {"ru": "Маршрутизатор", "en": "router", "df": "сетевое устройство уровня 3, обеспечивающее передачу пакетов между разными сетями по IP-адресам"}, {"ru": "Шлюз", "en": "gateway", "df": "устройство, обеспечивающее преобразование протоколов при соединении сетей с различными стеками"}, {"ru": "Туннелирование", "en": "tunneling", "df": "инкапсуляция пакетов одного протокола внутри другого для передачи через несовместимую сеть"}, {"ru": "NAT", "en": "Network Address Translation", "df": "трансляция сетевых адресов на границе сетей"}, {"ru": "Уровень", "en": "layer", "df": "функциональный слой в многоуровневой архитектуре сети"}, {"ru": "Протокол", "en": "protocol", "df": "формализованный набор правил взаимодействия одноимённых уровней на разных узлах"}, {"ru": "Интерфейс", "en": "interface", "df": "границу между соседними уровнями на одном узле"}, {"ru": "Стек протоколов", "en": "protocol stack", "df": "конкретный набор протоколов, реализующих все уровни модели"}, {"ru": "PDU", "en": "Protocol Data Unit", "df": "единица данных протокола на конкретном уровне"}, {"ru": "Инкапсуляция", "en": "encapsulation", "df": "добавление служебного заголовка к данным на каждом уровне стека при передаче вниз"}, {"ru": "Одноранговая сущность", "en": "peer entity", "df": "реализация одного и того же уровня на разных узлах, взаимодействующая по протоколу"}, {"ru": "Качество обслуживания", "en": "QoS, Quality of Service", "df": "механизмы управления приоритетами трафика для обеспечения требуемых характеристик передачи"}, {"ru": "Принцип сквозной аргументации", "en": "end-to-end principle", "df": "концепция, согласно которой функции, требующие знаний о приложении, реализуются на концах соединения, а не в сети"}], "summary": ["Классификация по масштабу определяет технологии, задержки, стоимость канала и модель управления", "**PAN** (Personal Area Network) — радиус до 10 м, Bluetooth, NFC, смарт-часы, единицы Мбит/с", "**LAN** (Local Area Network) — здание/кампус, 100 Мбит/с–100 Гбит/с, RTT <1 мс, **IEEE 802.3** и **802.11**", "**MAN** (Metropolitan Area Network) — десятки км, DOCSIS, FTTH/PON, IXP, исторически WiMAX (**802.16**)", "**WAN** (Wide Area Network) — сотни–тысячи км, арендованные SDH/SONET, MPLS, DWDM, спутник; задержки десятки мс", "**Интернет** = объединение тысяч **AS** (Autonomous Systems), связанных по **BGP** (RFC 4271)", "**Объединение сетей** (internetworking) — единая логическая сеть из разнородных физических", "Механизмы: **маршрутизаторы** (L3, IP); **шлюзы прикладного уровня** (SMTP↔X.400); **туннелирование** (6in4, GRE, IPSec, VXLAN); **NAT**; **мосты** (L2)", "**Иерархия протоколов**: каждый уровень предоставляет услуги верхнему через **интерфейс** и общается с peer по **протоколу**", "**Стек протоколов** (protocol stack) — набор протоколов всех уровней, например Ethernet→IP→TCP→HTTP", "**PDU**: бит (L1), кадр/frame (L2), пакет/packet (L3), сегмент/segment (L4), сообщение (L7)", "**Инкапсуляция** (encapsulation) — добавление заголовка на каждом уровне при передаче вниз; обратное на приёме — декапсуляция", "**End-to-end principle** — сложная логика на концах, простое ядро", "**Ключевые аспекты построения сети**: надёжность (избыточность, CRC), масштабируемость (CIDR, агрегация), **QoS** (DiffServ/IntServ)", "Безопасность (TLS/IPSec, HMAC, 802.1X, защита от DDoS); управляемость (SNMP, NetFlow, SDN); эффективность; открытые стандарты (RFC, IEEE 802)"]}, {"n": 3, "title": "Службы на основе соединений и службы без установления соединения. Примитивы служб. Службы и протоколы.", "paragraphs": ["<h3>Определение службы</h3>", "**Служба** (service) — формальный набор операций (примитивов), которые нижний уровень многоуровневой архитектуры предоставляет вышестоящему уровню. Служба определяет **что** делает уровень, скрывая, **как** именно это реализовано. Доступ к службе осуществляется через **точку доступа к службе** (SAP, Service Access Point), уникально идентифицируемую внутри узла: например, в стеке TCP/IP роль SAP для транспортного уровня играет пара (IP-адрес, номер порта). Между соседними уровнями передаётся **IDU** (Interface Data Unit), которая состоит из управляющей информации интерфейса и собственно **SDU** (Service Data Unit) — полезной нагрузки, передаваемой через службу.", "<h3>Два класса служб</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/7/71/TCP_Three-Way_Handshake.svg/500px-TCP_Three-Way_Handshake.svg.png\" alt=\"Тройное рукопожатие TCP — установление соединения\" loading=\"lazy\"><figcaption>Тройное рукопожатие TCP (SYN → SYN+ACK → ACK) — типичный пример установления соединения для службы connection-oriented; служба без соединения (UDP) подобной фазы не имеет.</figcaption></figure>", "- **Служба с установлением соединения** (connection-oriented service) — модель телефонного звонка. Состоит из трёх фаз: установление соединения (рукопожатие), передача данных, разрыв соединения. Поток байтов сохраняет порядок, обе стороны хранят **состояние** (state) соединения. Примеры: TCP, виртуальные каналы X.25, MPLS LSP, ATM VC.\n- **Служба без установления соединения** (connectionless service) — модель почтового отправления. Каждое сообщение (**датаграмма**, datagram) содержит полный адрес и маршрутизируется независимо; разные датаграммы могут идти разными путями и прибывать не по порядку. Примеры: IP, UDP, IPX.", "Каждый из этих классов делится по гарантиям доставки:\n- **Надёжная служба** (reliable service) — гарантирует доставку всех данных без потерь, дубликатов и нарушения порядка через подтверждения (ACK) и повторные передачи. Реализация требует буферов и таймеров (TCP).\n- **Ненадёжная служба** (unreliable / best-effort service) — отправляет данные без подтверждений; потери компенсируются (если нужно) на верхних уровнях или приложением. Примеры: UDP, IP. Подходит для трафика, чувствительного к задержке (VoIP, видеоконференции), где повторная передача бесполезна.", "Типичные комбинации:\n- **Надёжная с соединением** — передача файлов, веб (TCP, HTTP).\n- **Надёжная без соединения** — заказное письмо: подтверждение есть, но соединение не нужно (редко используется на практике).\n- **Ненадёжная без соединения** — UDP, обычные дейтаграммы IP, трафик реального времени.\n- **Подтверждённая дейтаграмма** (acknowledged datagram) — SMS, некоторые протоколы IoT.", "<h3>Примитивы служб</h3>", "**Примитив службы** (service primitive) — элементарная операция, через которую вышестоящий уровень обращается к нижестоящему. Различают четыре типа примитивов:\n- **Request** — запрос от пользователя сервиса к поставщику (например, T-CONNECT.request).\n- **Indication** — уведомление противоположной стороне о входящем запросе (T-CONNECT.indication).\n- **Response** — ответ принимающей стороны (T-CONNECT.response).\n- **Confirm** — подтверждение исходному запрашивающему (T-CONNECT.confirm).", "Типичный набор примитивов сокет-подобного интерфейса для службы с соединением:\n- **LISTEN** — сервер готов принимать соединения (блокирует до прихода запроса).\n- **CONNECT** — клиент устанавливает соединение с сервером.\n- **ACCEPT** — сервер принимает входящий запрос.\n- **SEND** — передать блок данных по установленному соединению.\n- **RECEIVE** — получить данные (блокирует до прихода).\n- **DISCONNECT** — закрыть соединение.", "Для службы без соединения достаточно SEND и RECEIVE с явным адресом получателя в каждом примитиве (sendto/recvfrom в BSD-сокетах).", "<h3>Служба и протокол — два разных понятия</h3>", "| Аспект | Служба (service) | Протокол (protocol) |\n|---|---|---|\n| Направление | вертикально, между уровнями одного узла | горизонтально, между одноимёнными уровнями разных узлов |\n| Что описывает | **что** делает уровень — набор операций | **как** работает уровень — формат сообщений и правила |\n| Видимость | видна только соседним уровням | видна одноранговым сущностям (peers) |\n| Аналогия | API библиотеки | проводной протокол, формат сообщений |\n| Пример | TCP-сокеты (BSD API) | формат TCP-сегмента, состояния SYN_SENT, ESTABLISHED |", "Одна и та же служба может быть реализована разными протоколами (например, надёжная доставка реализуется TCP, SCTP или QUIC); и наоборот, один протокол может предоставлять разные службы (TCP даёт байтовый поток, а с использованием PSH-флага — границы сообщений)."], "terms": [{"ru": "Служба", "en": "service", "df": "набор операций, предоставляемых уровнем своему верхнему соседу; описывает **что** делает уровень"}, {"ru": "Протокол", "en": "protocol", "df": "формальный набор правил и форматов сообщений между одноранговыми сущностями разных узлов; описывает **как** работает уровень"}, {"ru": "SAP", "en": "Service Access Point", "df": "точка доступа к службе; адресуемая граница между уровнями на одном узле"}, {"ru": "SDU", "en": "Service Data Unit", "df": "блок данных, передаваемый через интерфейс службы; полезная нагрузка для протокола"}, {"ru": "PDU", "en": "Protocol Data Unit", "df": "единица данных протокола; SDU плюс заголовок данного уровня"}, {"ru": "Служба с установлением соединения", "en": "connection-oriented service", "df": "служба с фазами установления, передачи и разрыва соединения, сохраняющая состояние"}, {"ru": "Служба без установления соединения", "en": "connectionless service", "df": "служба, где каждое сообщение (датаграмма) маршрутизируется независимо"}, {"ru": "Соединение", "en": "connection", "df": "логический канал связи между двумя сторонами с сохранением состояния и упорядоченной доставкой"}, {"ru": "Датаграмма", "en": "datagram", "df": "самодостаточный пакет с полным адресом, маршрутизируемый независимо от других"}, {"ru": "Примитив службы", "en": "service primitive", "df": "элементарная операция интерфейса (LISTEN, CONNECT, SEND, RECEIVE и др.)"}, {"ru": "Надёжная служба", "en": "reliable service", "df": "служба с гарантией доставки всех данных без потерь и нарушения порядка через подтверждения"}, {"ru": "Ненадёжная служба", "en": "unreliable / best-effort service", "df": "служба без гарантий доставки, без подтверждений и повторных передач"}, {"ru": "TCP", "en": "Transmission Control Protocol", "df": "транспортный протокол, реализующий надёжную байт-потоковую службу с установлением соединения"}, {"ru": "UDP", "en": "User Datagram Protocol", "df": "транспортный протокол, реализующий ненадёжную службу без установления соединения"}, {"ru": "Одноранговая сущность", "en": "peer entity", "df": "реализация одного и того же уровня на разных узлах, взаимодействующая по протоколу"}], "summary": ["**Служба** (service) — набор операций, которые нижний уровень предоставляет верхнему; описывает **что**", "**Протокол** (protocol) — правила между peer-сущностями разных узлов; описывает **как**", "Доступ — через **SAP** (Service Access Point); в TCP/IP это пара (IP-адрес, порт)", "**SDU** — данные, передаваемые через интерфейс; **PDU** = SDU + заголовок этого уровня", "**Connection-oriented** (служба с соединением) — модель телефона: setup → данные → disconnect, упорядоченный поток, хранится state (TCP, X.25, MPLS LSP, ATM VC)", "**Connectionless** (без соединения) — модель почты: каждая **датаграмма** маршрутизируется независимо, возможен переупорядок (IP, UDP)", "**Надёжная служба** (reliable) — гарантия доставки через ACK + повторы + таймеры (TCP)", "**Ненадёжная / best-effort** — без подтверждений; компенсируется приложением (UDP, IP); подходит для VoIP/видео, где повтор бесполезен", "Комбинации: надёжная с соединением (HTTP/TCP), ненадёжная без соединения (UDP), подтверждённая дейтаграмма (SMS)", "**Примитивы службы** — элементарные операции интерфейса", "Четыре типа OSI: **Request** (запрос), **Indication** (уведомление peer), **Response** (ответ), **Confirm** (подтверждение запросившему)", "Сокет-подобные примитивы: **LISTEN**, **CONNECT**, **ACCEPT**, **SEND**, **RECEIVE**, **DISCONNECT**", "Для connectionless достаточно sendto/recvfrom с адресом получателя в каждом примитиве", "Разделение служба/протокол: служба — вертикально между уровнями одного узла; протокол — горизонтально между peer", "Одну службу можно реализовать разными протоколами (TCP, SCTP, QUIC); один протокол даёт разные службы"]}, {"n": 4, "title": "Эталонные модели ISO и TCP/IP. Сравнение эталонных моделей OSI и TCP. Критика моделей. Примеры сетей.", "paragraphs": ["<h3>Введение</h3>", "**Эталонная модель** (reference model) — концептуальная схема, разбивающая сетевое взаимодействие на иерархию уровней с чётко определёнными функциями и интерфейсами. В телекоммуникациях исторически сложились две основные модели: **OSI** (Open Systems Interconnection) — нормативная семиуровневая модель ISO, и **TCP/IP** — четырёхуровневая модель, фактически описывающая стек протоколов Интернета. OSI создавалась «сверху вниз» как теоретический каркас до появления протоколов; TCP/IP — «снизу вверх» как описание уже работающих RFC-протоколов.", "<h3>Семиуровневая модель OSI</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/OSI_Model_v1.svg/500px-OSI_Model_v1.svg.png\" alt=\"Семиуровневая эталонная модель OSI\" loading=\"lazy\"><figcaption>Семиуровневая эталонная модель OSI (ISO 7498): физический, канальный, сетевой, транспортный, сеансовый, представления и прикладной уровни.</figcaption></figure>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/2/28/Osi-vz-ip-model.svg/500px-Osi-vz-ip-model.svg.png\" alt=\"Сопоставление уровней модели OSI и стека TCP/IP\" loading=\"lazy\"><figcaption>Сопоставление семи уровней OSI с четырьмя уровнями TCP/IP: верхние три уровня OSI (Session, Presentation, Application) объединены в Application TCP/IP, а L1+L2 — в Link.</figcaption></figure>", "Модель OSI разработана **ISO** в 1984 г. (стандарт ISO 7498):\n- **L1 — Физический уровень** (physical) — передача отдельных битов по физической среде: уровни напряжений, импульсы света, радиоволны; характеристики кабеля и разъёмов. Стандарты: RS-232, V.35, 1000BASE-T PHY.\n- **L2 — Канальный уровень** (data link) — передача **кадров** между соседними узлами одной сети. Делится на подуровни **LLC** (Logical Link Control) и **MAC** (Media Access Control). Обнаружение ошибок (CRC), управление доступом к среде, физическая адресация. Примеры: Ethernet, PPP, HDLC.\n- **L3 — Сетевой уровень** (network) — маршрутизация **пакетов** между разными сетями. Логическая адресация (IP), фрагментация, протоколы маршрутизации. Примеры: IP, ICMP, OSPF, BGP.\n- **L4 — Транспортный уровень** (transport) — сквозная доставка данных между процессами; мультиплексирование по портам, контроль потока, надёжность (TCP), скорость (UDP).\n- **L5 — Сеансовый уровень** (session) — организация диалогов: установление сеансов, синхронизация, контрольные точки, восстановление после сбоя. Примеры: RPC, NetBIOS.\n- **L6 — Уровень представления** (presentation) — синтаксис данных: преобразование форматов (ASCII↔EBCDIC, big-endian↔little-endian), сжатие, шифрование. Стандарт ASN.1.\n- **L7 — Прикладной уровень** (application) — собственно протоколы приложений: HTTP, FTP, SMTP, DNS, SNMP.", "<h3>Четырёхуровневая модель TCP/IP</h3>", "Описана в RFC 1122. Складывалась эволюционно из проекта ARPANET (1970-е):\n- **Link / Host-to-network** — объединяет физический и канальный уровни OSI; конкретные технологии (Ethernet, Wi-Fi, PPP) не специфицируются моделью, лишь декларируется требование «доставить IP-пакет следующему узлу».\n- **Internet** (сетевой) — основной уровень; единственный протокол — **IP** (Internet Protocol). Только служба без установления соединения. Дополняется ICMP, ARP, IGMP.\n- **Transport** (транспортный) — два протокола: **TCP** (надёжный, с соединением) и **UDP** (ненадёжный, без соединения). Позже добавлены SCTP, QUIC.\n- **Application** (прикладной) — все верхние функции в одном слое: протоколы приложений плюс функции сеанса и представления OSI (например, TLS — это «представление» в OSI, но реализуется как библиотека приложения).", "Часто рисуют расширенный вариант с разделением Link на Physical и Data Link — получается «гибридная» пятиуровневая модель (используется в учебнике Таненбаума).", "<h3>Сравнение OSI и TCP/IP</h3>", "| Критерий | OSI | TCP/IP |\n|---|---|---|\n| Число уровней | 7 | 4 (или 5 в гибридной форме) |\n| Происхождение | теоретическая, нормативная | описательная, родилась из работающих протоколов |\n| Чёткое разделение служба/интерфейс/протокол | да, явно зафиксировано | смешано, нечёткое |\n| Сетевой уровень | оба режима (connection-oriented и connectionless) | только connectionless (IP) |\n| Транспортный уровень | оба режима | оба (TCP / UDP) |\n| Сеансовый и Presentation | отдельные L5, L6 | отсутствуют, функции в Application |\n| Канальный/физический | разделены | объединены в Link |\n| Универсальность | стек-независимая | привязана к IP-стеку |\n| Распространение протоколов | реальных нет (X.400, X.500 проиграли) | глобальный стандарт Интернета |", "<h3>Критика моделей</h3>", "**Критика OSI:**\n- **Плохой выбор времени** — стандарт появился, когда TCP/IP уже доминировал в исследовательских сетях, в коммерческих продуктах не закрепился.\n- **Плохая технология** — слишком сложная и многословная спецификация; например, отдельные уровни сеанса и представления оказались почти не востребованы.\n- **Плохие реализации** — первые OSI-стеки были громоздкими и медленными по сравнению с компактными реализациями TCP/IP.\n- **Политика** — продвигалась европейскими телеком-монополиями и министерствами, что вызывало сопротивление инженерного сообщества.", "**Критика TCP/IP:**\n- **Не разделяет понятия службы, интерфейса и протокола** — поэтому неудобна как общая методология описания произвольных сетей.\n- **Привязана к одному стеку** — модель описывает не «сетевые архитектуры вообще», а конкретный набор IP-протоколов.\n- **Уровень Host-to-network — не настоящий уровень**, а интерфейс к нижележащей сети; объединяет очень разнородные вещи (от витой пары до спутникового канала).\n- **Отсутствие сеансового и представления уровней** — функции «расплываются» по приложениям и библиотекам (TLS, ASN.1, кодирование).", "<h3>Итог и сферы применения</h3>", "На практике используется **гибридный подход**: для обучения и обсуждения архитектуры берётся семиуровневая нумерация OSI (откуда термины «L2-коммутатор», «L7-балансировщик»), а реально работающий стек — это TCP/IP. Современные сети редко вписываются в строгую иерархию: туннелирование (IP-в-IP, VXLAN), MPLS (между L2 и L3, «уровень 2,5»), QUIC (объединяет L4 и часть L7) — всё это нарушает чистоту любой эталонной модели, но обе модели по-прежнему служат полезным языком для проектирования и преподавания."], "terms": [{"ru": "Эталонная модель", "en": "reference model", "df": "концептуальная схема разбиения сетевого взаимодействия на уровни с определёнными функциями и интерфейсами"}, {"ru": "OSI", "en": "Open Systems Interconnection", "df": "эталонная семиуровневая модель ISO (ISO 7498), нормативная архитектура взаимодействия открытых систем"}, {"ru": "TCP/IP", "en": "Transmission Control Protocol / Internet Protocol", "df": "четырёхуровневая модель и одноимённый стек протоколов Интернета (RFC 1122)"}, {"ru": "Физический уровень", "en": "physical layer, L1", "df": "передача отдельных битов по физической среде, характеристики кабелей и сигналов"}, {"ru": "Канальный уровень", "en": "data link layer, L2", "df": "передача кадров между соседними узлами одной сети, обнаружение ошибок, управление доступом"}, {"ru": "MAC", "en": "Media Access Control", "df": "нижний подуровень L2, отвечающий за управление доступом к разделяемой среде"}, {"ru": "LLC", "en": "Logical Link Control", "df": "верхний подуровень L2, обеспечивающий единый интерфейс к сетевому уровню"}, {"ru": "Сетевой уровень", "en": "network layer, L3", "df": "маршрутизация пакетов между сетями, логическая адресация"}, {"ru": "Транспортный уровень", "en": "transport layer, L4", "df": "сквозная доставка данных между процессами, мультиплексирование по портам"}, {"ru": "Сеансовый уровень", "en": "session layer, L5", "df": "управление сеансами связи: установление, синхронизация, восстановление"}, {"ru": "Уровень представления", "en": "presentation layer, L6", "df": "преобразование форматов данных, сжатие, шифрование"}, {"ru": "Прикладной уровень", "en": "application layer, L7 OSI / L4 TCP/IP", "df": "протоколы приложений (HTTP, FTP, DNS, SMTP)"}, {"ru": "ISO", "en": "International Organization for Standardization", "df": "Международная организация по стандартизации, разработавшая модель OSI"}], "summary": ["**Эталонная модель** (reference model) — концептуальная иерархия уровней сетевого взаимодействия", "**OSI** (ISO 7498, 1984) — 7 уровней, нормативная, «сверху вниз», до протоколов", "**TCP/IP** (RFC 1122) — 4 уровня, описательная, «снизу вверх» из ARPANET", "**L1 физический** — биты, среды, разъёмы, напряжения (RS-232, 1000BASE-T PHY)", "**L2 канальный** — кадры, MAC+LLC, **CRC**, доступ к среде (Ethernet, PPP, HDLC)", "**L3 сетевой** — пакеты, маршрутизация, **IP**, ICMP, OSPF, BGP", "**L4 транспортный** — сквозная доставка между процессами, порты (TCP, UDP)", "**L5 сеансовый** — диалоги, синхронизация, контрольные точки (RPC, NetBIOS)", "**L6 представления** — синтаксис, ASCII↔EBCDIC, сжатие, шифрование, **ASN.1**", "**L7 прикладной** — HTTP, FTP, SMTP, DNS, SNMP", "**TCP/IP уровни**: Link (L1+L2), Internet (IP, только connectionless), Transport (TCP/UDP), Application (включает функции L5–L7)", "Гибридная пятиуровневая модель Таненбаума: Physical + Data Link + Network + Transport + Application", "**Критика OSI**: плохой timing (опоздала к TCP/IP), сложная, плохие реализации, политика телеком-монополий", "**Критика TCP/IP**: не разделяет служба/интерфейс/протокол; привязана к IP-стеку; Host-to-network — не уровень, а интерфейс", "**OSI vs TCP/IP**: OSI явно отделяет службу/протокол; OSI на L3 поддерживает оба режима, TCP/IP — только connectionless", "Итог: OSI — язык для обучения (термины L2/L7), TCP/IP — реально работающий де-факто стандарт; современные туннели/MPLS/QUIC ломают чистоту обеих"]}, {"n": 5, "title": "Примеры сетей: Интернет, мобильная телефонная сеть, беспроводные ЛВС: 802.11, RFID и сенсорные сети.", "paragraphs": ["<h3>Введение</h3>", "Несмотря на общую теоретическую базу, реальные сети сильно различаются по архитектуре, технологиям и задачам. Ниже рассматриваются пять характерных примеров, охватывающих разные масштабы (от персонального RFID-считывания до глобального Интернета) и разные типы трафика (от голосового потока до пакетов в несколько байтов).", "<h3>Интернет</h3>", "**Интернет** — глобальное объединение **автономных систем** (AS, Autonomous Systems) на базе стека TCP/IP, крупнейшая в истории человечества рукотворная инженерная система. Архитектурно это иерархия операторов разного уровня:\n- **Сеть доступа** (access network) — «последняя миля» к абоненту: ADSL/VDSL по медной паре, DOCSIS поверх кабельного ТВ, GPON/FTTH на оптике, мобильные LTE/5G, спутник (Starlink, OneWeb).\n- **Региональные провайдеры** (Tier-2 ISP) — покупают **транзит** (transit) у магистральных операторов и продают доступ конечным клиентам.\n- **Магистральные сети** (Tier-1 backbone) — крупнейшие операторы (Lumen/Level 3, NTT, Cogent, Telia), обменивающиеся трафиком на условиях бесплатного **пиринга** (peering) — они не покупают транзит ни у кого.\n- **IXP** (Internet Exchange Point) — физические площадки, где операторы напрямую соединяются для обмена трафиком, минуя транзит. Примеры: MSK-IX (Москва), DE-CIX (Франкфурт), AMS-IX (Амстердам).\n- **Маршрутизация между AS** — внешний протокол **BGP** (Border Gateway Protocol, RFC 4271); внутри AS — IGP-протоколы OSPF, IS-IS.\n- **Адресация и имена** — IP-адреса (IPv4/IPv6), доменные имена через DNS; глобально координируются **ICANN/IANA**.", "Архитектурные принципы Интернета:\n- **End-to-end argument** — сложная логика (надёжность, безопасность) на концах, сеть — простая и быстрая.\n- **Принцип «толстый край — тонкое ядро»** (smart edges, dumb core) — обратное классической телефонии.\n- **Универсальность IP** (everything over IP, IP over everything) — единый сетевой уровень над любой канальной технологией.", "<h3>Мобильная телефонная сеть</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/e/ee/Frequency_reuse.svg/500px-Frequency_reuse.svg.png\" alt=\"Пример частотного переиспользования в сотовой сети\" loading=\"lazy\"><figcaption>Принцип частотного переиспользования (frequency reuse): четыре частоты F1–F4 распределяются по соседним сотам так, что одинаковые частоты разделены безопасным расстоянием — это позволяет обслуживать миллионы абонентов в ограниченном спектре.</figcaption></figure>", "Сотовая сеть — **WAN-уровня инфраструктура**, обслуживающая голос и данные миллионов абонентов на больших территориях. Принцип построения — сотовый: территория делится на **соты** (cells), каждую обслуживает **базовая станция**. Соседние соты используют разные частоты, удалённые — могут переиспользовать одну и ту же частоту (**частотное переиспользование**, frequency reuse). Размер кластера повторения C = i² + ij + j² (типичные значения 3, 4, 7, 9, 12).", "Архитектурно состоит из:\n- **Радиоподсистема** (RAN, Radio Access Network) — базовые станции (BTS в GSM, NodeB в 3G, eNodeB в LTE, gNodeB в 5G) и их контроллеры (BSC, RNC). В 5G используется gNodeB с разделением на CU/DU/RU.\n- **Опорная сеть** (Core network) — коммутация, аутентификация, биллинг, маршрутизация: MSC и HLR в 2G, EPC в LTE (MME, S-GW, P-GW, HSS, PCRF), 5G Core (AMF, SMF, UPF, AUSF, UDM) в 5G — сервисно-ориентированная архитектура SBA.\n- **Подключение к ТФОП/Интернету** — шлюзы GMSC (к телефонии), P-GW/UPF (к пакетным сетям).", "Ключевые механизмы:\n- **Хэндовер** (handover/handoff) — переключение активного соединения от одной БС к другой при перемещении абонента. Soft handover в CDMA — связь с двумя БС одновременно; hard handover в GSM/LTE — разрыв-восстановление.\n- **Роуминг** (roaming) — обслуживание абонента в сети другого оператора по соглашению.\n- **Пейджинг** (paging) — поиск абонента в зоне регистрации при входящем вызове.\n- **Поколения сотовой связи**: 1G (аналоговые AMPS, NMT) → 2G (GSM, CDMA — цифровой голос и SMS, TDMA) → 3G (UMTS/WCDMA, EV-DO — мобильные данные до 42 Мбит/с) → 4G LTE (полностью IP-сеть, OFDMA, 100+ Мбит/с) → 5G NR (миллиметровые волны, массовый MIMO, пакетная задержка <1 мс, network slicing) → планируется 6G к 2030 г.", "<h3>Беспроводные ЛВС: IEEE 802.11</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Wireless_network.jpg/500px-Wireless_network.jpg\" alt=\"Подключение ноутбука к беспроводному маршрутизатору по Wi-Fi\" loading=\"lazy\"><figcaption>Беспроводная локальная сеть IEEE 802.11: клиент (ноутбук) подключается к точке доступа / маршрутизатору, которая обеспечивает мост с проводным сегментом и выход в Интернет.</figcaption></figure>", "Семейство стандартов **IEEE 802.11** определяет беспроводные локальные сети — **Wi-Fi** (товарный знак Wi-Fi Alliance). Работает в нелицензируемых ISM-диапазонах **2,4 ГГц** (802.11b/g/n), **5 ГГц** (802.11a/n/ac/ax), **6 ГГц** (802.11ax — Wi-Fi 6E, 802.11be — Wi-Fi 7).", "Два режима работы:\n- **Инфраструктурный** — клиенты подключаются через **точку доступа** (AP, Access Point), которая соединена с проводной LAN. Совокупность AP и её клиентов образует **BSS** (Basic Service Set); несколько BSS, объединённых через **DS** (Distribution System), образуют **ESS** (Extended Service Set) с единым SSID и поддержкой роуминга между AP.\n- **Ad-hoc / IBSS** (Independent BSS) — прямое соединение клиентов без AP. Используется редко (Wi-Fi Direct, экстренные сети).", "Особенности и механизмы:\n- **Метод доступа** — **CSMA/CA** (Carrier Sense Multiple Access with Collision Avoidance) с предотвращением коллизий, в отличие от CSMA/CD в Ethernet, поскольку радио-станция не может одновременно передавать и слушать (half-duplex по природе). Использует случайный backoff в окне contention window.\n- **Скрытый узел** (hidden terminal) — два клиента не «слышат» друг друга, но оба слышат AP; решается опционально через **RTS/CTS** (Request-to-Send / Clear-to-Send) обмен.\n- **Открытый узел** (exposed terminal) — обратная проблема: узел слышит чужую передачу и без необходимости откладывает свою.\n- **Шифрование и аутентификация** — WEP (взломан), WPA (TKIP), WPA2 (AES-CCMP, IEEE 802.11i), WPA3 (SAE — Simultaneous Authentication of Equals, защита от offline-атак).\n- **Поколения и скорости** — 802.11b (11 Мбит/с), 802.11g (54 Мбит/с), 802.11n / Wi-Fi 4 (600 Мбит/с, MIMO), 802.11ac / Wi-Fi 5 (6,9 Гбит/с, MU-MIMO), 802.11ax / Wi-Fi 6 (9,6 Гбит/с, OFDMA, BSS coloring), 802.11be / Wi-Fi 7 (до 46 Гбит/с, MLO — Multi-Link Operation).", "<h3>RFID — радиочастотная идентификация</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/RFID_Tags.jpg/500px-RFID_Tags.jpg\" alt=\"Различные форм-факторы RFID-меток\" loading=\"lazy\"><figcaption>RFID-метки разных форматов и частотных диапазонов: библиотечные наклейки, карты доступа, имплантируемые капсулы. Каждая метка содержит микрочип и антенну.</figcaption></figure>", "**RFID** (Radio Frequency Identification) — технология бесконтактной идентификации объектов с помощью радиосигнала. Система состоит из двух элементов: **метка** (tag, transponder) и **считыватель** (reader, interrogator). Метка содержит чип с идентификатором, память и антенну; считыватель излучает несущую и читает модулированный ответ.", "Классификация меток по источнику питания:\n- **Пассивные** (passive) — без батареи, питаются от радиочастотного поля считывателя (механизм backscatter — обратное рассеяние); самые дешёвые (~5 центов), но малая дальность (до нескольких метров) и слабая память. Используются в маркировке товаров (EPC Gen2 / UHF 860–960 МГц), пропусках, билетах.\n- **Полупассивные** (semi-passive / battery-assisted passive, BAP) — батарея питает только чип, ответ модулируется отражением сигнала. Бо́льшая дальность чтения, чем у пассивных.\n- **Активные** (active) — собственный источник питания, дальность до сотен метров, могут самостоятельно вести опрос (beaconing). Используются в логистике контейнеров, дорожных платежах (ЭРА-ГЛОНАСС, E-ZPass).", "Диапазоны частот:\n- **LF** (125–134 кГц) — иммобилайзеры автомобилей, чипирование животных, контроль доступа; короткая дальность, устойчивость к воде и металлу.\n- **HF** (13,56 МГц) — банковские карты, транспортные карты, **NFC** (Near Field Communication) — подмножество HF RFID для смартфонов; ISO/IEC 14443, 15693.\n- **UHF** (860–960 МГц) — логистика, маркировка товаров, EPC Class-1 Gen-2 (ISO/IEC 18000-63), дальность до 10+ м.\n- **SHF** (2,45 ГГц, 5,8 ГГц) — дорожные платежи, активные метки.", "Тесно связана с концепцией **EPC** (Electronic Product Code) и **Интернета вещей** (IoT, Internet of Things) — RFID-метка делает физический объект адресуемым в цифровом мире.", "<h3>Сенсорные сети</h3>", "**Сенсорная сеть** (WSN, Wireless Sensor Network) — беспроводная самоорганизующаяся сеть из множества маломощных узлов («мотов», motes), каждый из которых снабжён датчиками (температуры, влажности, вибрации, движения, освещённости), микроконтроллером, маломощным радиомодулем и батарейкой. Узлы передают измерения **многошаговой ретрансляцией** (multi-hop) к **sink-узлу** (шлюзу), который соединён с внешней сетью.", "Ключевые характеристики:\n- **Жёсткие ограничения по энергии** — основная метрика проектирования; узел должен работать годами от одной батарейки или собирать энергию из среды (energy harvesting).\n- **Низкая скорость** — десятки/сотни кбит/с, но пакеты маленькие (десятки байт).\n- **Самоорганизация** и устойчивость к выходу узлов из строя.", "Типичные технологии и стандарты: **IEEE 802.15.4** (физический и MAC), **Zigbee** (сетевой и прикладной поверх 802.15.4), **6LoWPAN** (IPv6 поверх 802.15.4), **LoRaWAN** и **NB-IoT** (для LPWAN — большой дальности и малых данных). Применения: мониторинг окружающей среды, точное земледелие, промышленный мониторинг (Industry 4.0), умный дом, военные системы наблюдения."], "terms": [{"ru": "ISP", "en": "Internet Service Provider", "df": "провайдер интернет-услуг; оператор, предоставляющий доступ в Интернет"}, {"ru": "IXP", "en": "Internet Exchange Point", "df": "точка обмена интернет-трафиком между провайдерами"}, {"ru": "AS", "en": "Autonomous System", "df": "автономная система; группа сетей под единым управлением с единой политикой маршрутизации"}, {"ru": "BGP", "en": "Border Gateway Protocol", "df": "протокол маршрутизации между автономными системами Интернета"}, {"ru": "Транзит", "en": "transit", "df": "платная услуга предоставления доступа ко всему Интернету через сеть оператора"}, {"ru": "Пиринг", "en": "peering", "df": "взаимный обмен трафиком между сетями, обычно без оплаты"}, {"ru": "ICANN", "en": "Internet Corporation for Assigned Names and Numbers", "df": "организация, координирующая адресное пространство и DNS Интернета"}, {"ru": "Сота / ячейка", "en": "cell", "df": "географическая зона, обслуживаемая одной базовой станцией сотовой сети"}, {"ru": "Базовая станция", "en": "base station, BS", "df": "стационарная радиостанция сотовой сети; BTS/NodeB/eNodeB/gNodeB в разных поколениях"}, {"ru": "Хэндовер", "en": "handover / handoff", "df": "переключение активного соединения мобильного устройства от одной базовой станции к другой"}, {"ru": "Роуминг", "en": "roaming", "df": "обслуживание абонента в сети другого оператора по соглашению"}, {"ru": "RAN", "en": "Radio Access Network", "df": "радиоподсистема сотовой сети"}, {"ru": "LTE", "en": "Long-Term Evolution", "df": "стандарт сетей 4G, полностью пакетная IP-архитектура"}, {"ru": "5G NR", "en": "New Radio", "df": "радиоинтерфейс пятого поколения сотовой связи"}, {"ru": "Точка доступа", "en": "access point, AP", "df": "устройство, обеспечивающее беспроводное подключение клиентов к проводной сети"}, {"ru": "BSS / ESS", "en": "Basic / Extended Service Set", "df": "базовый и расширенный набор обслуживания в 802.11"}, {"ru": "CSMA/CA", "en": "Carrier Sense Multiple Access with Collision Avoidance", "df": "метод доступа к беспроводной среде с обнаружением несущей и предотвращением коллизий"}, {"ru": "Скрытый узел", "en": "hidden terminal", "df": "проблема в радиосетях: два клиента не слышат друг друга, но оба слышат AP"}, {"ru": "WPA2 / WPA3", "en": "Wi-Fi Protected Access", "df": "стандарты шифрования и аутентификации Wi-Fi"}, {"ru": "RFID", "en": "Radio Frequency Identification", "df": "радиочастотная идентификация объектов с помощью меток"}, {"ru": "Пассивная RFID-метка", "en": "passive tag", "df": "метка без собственного питания, питающаяся от поля считывателя"}, {"ru": "Активная RFID-метка", "en": "active tag", "df": "метка с собственным источником питания и большой дальностью"}, {"ru": "EPC", "en": "Electronic Product Code", "df": "глобальный электронный код товара для RFID-маркировки"}, {"ru": "Сенсорная сеть", "en": "WSN, Wireless Sensor Network", "df": "беспроводная самоорганизующаяся сеть из маломощных узлов с датчиками"}, {"ru": "Sink-узел", "en": "sink node", "df": "шлюз сенсорной сети, собирающий данные с узлов и передающий во внешнюю сеть"}], "summary": ["**Интернет** — глобальное объединение **AS** на стеке TCP/IP; иерархия Tier-1 backbone → Tier-2 ISP → access", "**Транзит** (transit) платный, **пиринг** (peering) бесплатный; обмен в **IXP** (MSK-IX, DE-CIX, AMS-IX)", "Маршрутизация: **BGP** между AS (RFC 4271), **OSPF/IS-IS** внутри AS; **ICANN/IANA** — адреса и домены", "Принципы: end-to-end, smart edges/dumb core, IP over everything", "**Сотовая сеть**: соты + БС, частотное переиспользование N=i²+ij+j² (типично 3/7/12)", "Архитектура: **RAN** (BTS/NodeB/eNodeB/gNodeB) + Core (MSC/HLR → EPC: MME/S-GW/P-GW/HSS → 5GC: AMF/SMF/UPF)", "Механизмы: **хэндовер** (soft в CDMA, hard в GSM/LTE), роуминг, пейджинг, location update", "Поколения: **1G** (аналог, AMPS/NMT) → **2G GSM** (TDMA+FDMA, SMS) → **3G UMTS/WCDMA** → **4G LTE** (OFDMA, IP-only) → **5G NR** (mmWave, Massive MIMO, slicing)", "**IEEE 802.11 (Wi-Fi)** в ISM-полосах 2,4/5/6 ГГц; **CSMA/CA**, RTS/CTS для скрытого узла", "Режимы: инфраструктурный (AP + клиенты, **BSS**/**ESS** с DS), ad-hoc/IBSS", "Поколения Wi-Fi: 11b (11), 11g (54), 11n/Wi-Fi 4 (MIMO 600), 11ac/Wi-Fi 5 (MU-MIMO 6,9 Гбит/с), 11ax/Wi-Fi 6 (OFDMA, 9,6), 11be/Wi-Fi 7 (46 Гбит/с, MLO)", "Шифрование: WEP (взломан) → WPA-TKIP → **WPA2** (AES-CCMP, 802.11i) → **WPA3** (SAE)", "**RFID**: метка (tag) + считыватель (reader); метки **пассивные** (backscatter, ~5 центов), полупассивные (BAP), **активные** (батарея, сотни м)", "Диапазоны RFID: LF 125 кГц (иммобилайзеры), HF 13,56 МГц (NFC, ISO 14443), UHF 860–960 МГц (**EPC Gen 2**, ISO 18000-63), SHF 2,45 ГГц", "**Сенсорные сети (WSN)**: маломощные «моты» с датчиками, multi-hop к **sink-узлу**", "Стандарты: **IEEE 802.15.4** (PHY/MAC), Zigbee, 6LoWPAN (IPv6), LoRaWAN, NB-IoT; применение — мониторинг, Industry 4.0, умный дом"]}, {"n": 6, "title": "Стандартизация сетей. Отечественные и зарубежные организации по стандартизации: телекоммуникации, сеть Интернет, вопросы безопасности.", "paragraphs": ["<h3>Зачем нужна стандартизация</h3>", "**Стандартизация** (standardization) в телекоммуникациях обеспечивает **интероперабельность** (interoperability) оборудования и программного обеспечения разных производителей и стран: ноутбук Lenovo на Windows подключается к роутеру TP-Link, который передаёт пакеты через коммутатор Cisco и оптический канал Huawei — благодаря тому, что все они реализуют одни и те же открытые стандарты (Ethernet, IP, TLS). Без стандартов рынок распался бы на изолированные вендорские экосистемы. Стандартизация также снижает порог входа на рынок, ускоряет инновации и облегчает регулирование (распределение частот, экспортный контроль криптографии).", "<h3>Виды стандартов</h3>", "- **Де-юре стандарт** (de jure standard) — официально утверждённый уполномоченным органом по формальной многоэтапной процедуре с публичным обсуждением. Примеры: ISO/IEC 27001, ITU-T G.711, IEEE 802.3.\n- **Де-факто стандарт** (de facto standard) — сложился через широкое практическое применение без официального утверждения, но позже часто формализуется. Примеры: TCP/IP, PDF, PostScript, Ethernet (изначально DEC/Intel/Xerox, потом IEEE 802.3).\n- **Открытые стандарты** (open standards) — публично доступны, любой может реализовать. Большинство интернет-стандартов (RFC).\n- **Закрытые / проприетарные стандарты** (proprietary) — принадлежат компании, реализация требует лицензии. SMB до Microsoft Open Specifications, ранние версии Skype-протокола.", "<h3>Международные организации — телекоммуникации</h3>", "- **ITU** (International Telecommunication Union) — специализированное агентство ООН, основано в 1865 г. как International Telegraph Union; штаб-квартира в Женеве. Три сектора:\n  - **ITU-T** (Telecommunication Standardization Sector) — рекомендации по телефонной связи и передаче данных. Серии: G (передача и оптика — G.711 для PCM, G.652 для одномодового волокна), H (мультимедиа — H.264/H.265), V (модемы — V.34, V.92), X (сети данных — X.25, X.500), Y (NGN).\n  - **ITU-R** (Radiocommunication Sector) — распределение радиочастотного спектра, регламент радиосвязи (Radio Regulations), стандарты IMT-2000/IMT-Advanced/IMT-2020 (3G/4G/5G).\n  - **ITU-D** (Development Sector) — содействие развивающимся странам.\n- **ISO** (International Organization for Standardization) — основана в 1947 г., 169 стран-членов. Разработала модель **OSI** (ISO 7498), серию **ISO/IEC 27000*
