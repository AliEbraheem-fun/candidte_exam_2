ость** ниже, чем у выделенных каналов с эквивалентной средней нагрузкой.", "Цена: переменная задержка, возможны потери и переупорядочение, нужны буферы в узлах, надёжность обеспечивается верхними уровнями.", "<h3>Коммутация vs маршрутизация</h3>", "- **Коммутация** (switching, forwarding) — локальное действие узла: получить пакет на входном порту → определить выходной порт по таблице → переслать. Выполняется аппаратно/быстро.\n- **Маршрутизация** (routing) — глобальная задача: построить **таблицы пересылки** (forwarding table) на всех узлах так, чтобы пакеты доходили до получателя по разумным маршрутам. Выполняется протоколами маршрутизации (OSPF, BGP — Q33, Q41). В коммутации каналов аналог — выбор пути при установке соединения.\n- В коммутации пакетов маршрутизация решается **постоянно** (динамические алгоритмы); в VC-сетях — один раз при установке VC.", "<h3>Сетевые устройства</h3>", "- **Концентратор / хаб** (hub) — L1, повторитель сигнала на все порты; устарел.\n- **Мост / коммутатор** (bridge / switch) — L2, коммутация по MAC-адресам, обратное обучение, STP. Один **широковещательный домен**.\n- **Маршрутизатор** (router) — L3, коммутация по IP-адресам, разделяет широковещательные домены, соединяет разные сети.\n- **L3-коммутатор** — гибрид: аппаратно выполняет L3-маршрутизацию по простой таблице (для интенсивно используемых маршрутов внутри одной AS).\n- **Шлюз** (gateway) — L4–L7, преобразует протоколы (например, SIP↔H.323, SMTP↔X.400).", "<h3>Сравнительная таблица</h3>", "| Критерий | Коммутация каналов | Дейтаграммы | Виртуальные каналы |\n|---|---|---|---|\n| Установка соединения | да, на каждый сеанс | нет | да |\n| Адресация в пакете | нет (канал известен) | полный адрес | короткий VCI |\n| Маршрут | фиксированный | независим для каждого пакета | фиксированный для VC |\n| Гарантия порядка | да | нет | да |\n| Резервирование ресурсов | да | нет | возможно |\n| Поведение при отказе | разрыв соединения | автоматический обход | разрыв VC |\n| Примеры | PSTN, SDH | IP | ATM, MPLS, Frame Relay |"], "terms": [{"ru": "Коммутация", "en": "switching", "df": "задача соединения узлов сети через общие точки коммутации"}, {"ru": "Коммутация каналов", "en": "circuit switching", "df": "соединение с резервированием ресурсов на время сеанса"}, {"ru": "Коммутация сообщений", "en": "message switching", "df": "store-and-forward целыми сообщениями"}, {"ru": "Коммутация пакетов", "en": "packet switching", "df": "передача независимых пакетов через разделяемую сеть"}, {"ru": "Виртуальный канал", "en": "virtual circuit", "df": "логический путь, установленный для группы пакетов"}, {"ru": "Дейтаграмма", "en": "datagram", "df": "независимый пакет с полной адресной информацией"}, {"ru": "Маршрутизация", "en": "routing", "df": "построение таблиц пересылки во всей сети"}, {"ru": "ATM", "en": "Asynchronous Transfer Mode", "df": "технология передачи на основе виртуальных каналов и ячеек 53 байта"}, {"ru": "MPLS", "en": "Multiprotocol Label Switching", "df": "коммутация по меткам"}, {"ru": "Широковещательный домен", "en": "broadcast domain", "df": "область, в которой распространяется broadcast-трафик"}], "summary": ["**Коммутация** (switching) — соединить любую пару из N узлов через разделяемые узлы коммутации", "Три парадигмы: каналов (телефония), сообщений (телеграф), пакетов (Интернет)", "**Коммутация каналов** (circuit switching): фазы — **call setup → data → release**; путь резервируется на сеанс", "Реализации: PSTN, ISDN, оптические DWDM-каналы; мультиплекс — FDM, TDM, DWDM", "Плюсы каналов: гарантия полосы, постоянная задержка, нет потерь, прозрачность для любого трафика", "Минусы каналов: ресурсы заняты при молчании, долгий setup, плохая устойчивость к отказам", "**Коммутация сообщений** (message switching): целое сообщение, **store-and-forward**; жива в **DTN** и email (MTA)", "**Коммутация пакетов** (Дэвис/Бэран 1960-е): данные дробятся, заголовок с адресом, статистическое мультиплексирование", "**Дейтаграммная** (datagram, connectionless): полный адрес в каждом пакете, независимая маршрутизация (IP, IPX, CLNP) — Интернет", "**Виртуальные каналы** (VC, connection-oriented): локальные **VCI/Label**, путь устанавливается заранее (**X.25, Frame Relay, ATM, MPLS**)", "Плюсы пакетной коммутации: высокая утилизация, устойчивость к отказам, гибкость, дешевизна; цена — переменная задержка/потери", "**Коммутация (forwarding) vs маршрутизация (routing)**: первая — локальное действие узла по таблице; вторая — глобальная задача построения таблиц (OSPF, BGP)", "Forwarding выполняется аппаратно (ASIC/NPU); routing — динамическими протоколами", "**Сетевые устройства**: hub L1; bridge/switch L2 (MAC, общий broadcast); router L3 (IP, разделяет broadcast); L3-switch (аппаратный L3); gateway L4–L7", "Сравнение: каналы (setup да, гарантия порядка, ресурсы зарезервированы); дейтаграммы (нет setup, нет порядка); VC (setup да, короткий ID в пакете, порядок есть)"]}], "quizzes": [{"type": "mcq", "topic": "Вопрос 15", "q": "Какой метод формирования кадра используется в HDLC?", "opts": ["Счётчик символов в заголовке", "Флаговые байты с байт-стаффингом", "Флаговые биты с бит-стаффингом (после пяти единиц вставляется ноль)", "Нарушения физического кодирования"], "ans": 2, "expl": "В HDLC используются флаговые биты с бит-стаффингом: после пяти подряд идущих единиц вставляется ноль."}, {"type": "mcq", "topic": "Вопрос 15", "q": "Сколько классов сервисов канальный уровень предоставляет сетевому уровню?", "opts": ["Два: надёжная и ненадёжная доставка", "Три: ненадёжная без подтверждений, надёжная без установления соединения, надёжная с установлением соединения", "Четыре: с подтверждением, без подтверждения, с соединением, без соединения", "Один: надёжная доставка с подтверждениями"], "ans": 1, "expl": "Канальный уровень предоставляет три класса сервисов: ненадёжная доставка без подтверждений, надёжная без установления соединения и надёжная с установлением соединения."}, {"type": "tf", "topic": "Вопрос 15", "q": "Ненадёжная доставка без подтверждений применяется для каналов с низким уровнем ошибок, например Ethernet.", "ans": true, "expl": "Согласно материалу, ненадёжная доставка без подтверждений используется для каналов с низким уровнем ошибок, таких как Ethernet."}, {"type": "mcq", "topic": "Вопрос 16", "q": "Какое кодовое расстояние Хэмминга необходимо для исправления d ошибок?", "opts": ["d + 1", "2d", "2d + 1", "d + 2"], "ans": 2, "expl": "Для исправления d ошибок необходимо кодовое расстояние 2d+1."}, {"type": "tf", "topic": "Вопрос 16", "q": "Код Рида-Соломона работает на уровне отдельных битов, а не символов.", "ans": false, "expl": "Код Рида-Соломона — блочный код на символах (не битах), широко используется в DSL и оптических сетях."}, {"type": "mcq", "topic": "Вопрос 16", "q": "На чём основан циклический избыточный код (CRC)?", "opts": ["На подсчёте числа единиц в сообщении", "На суммировании 16-битовых слов", "На делении полинома сообщения на порождающий полином в поле GF(2)", "На умножении матриц чётности"], "ans": 2, "expl": "CRC основан на делении полинома сообщения на порождающий полином в поле GF(2)."}, {"type": "mcq", "topic": "Вопрос 17", "q": "Какой протокол является непосредственным предшественником протоколов скользящего окна?", "opts": ["Протокол «Утопия»", "Симплексный протокол с ожиданием для канала без ошибок", "Протокол PAR (Positive Acknowledgement with Retransmission)", "Протокол Go-Back-N"], "ans": 2, "expl": "Симплексный протокол с ожиданием для зашумлённых каналов (PAR) — непосредственный предшественник протоколов скользящего окна."}, {"type": "tf", "topic": "Вопрос 17", "q": "В протоколе «Утопия» присутствует управление потоком, но отсутствует обработка ошибок.", "ans": false, "expl": "В протоколе «Утопия» отсутствуют и управление потоком, и обработка ошибок — это полностью идеализированный протокол."}, {"type": "tf", "topic": "Вопрос 17", "q": "В протоколе PAR для нумерации кадров достаточно 1 бита (номера 0 или 1).", "ans": true, "expl": "Каждый кадр нумеруется, и для этого достаточно 1 бита: 0 или 1."}, {"type": "mcq", "topic": "Вопрос 18", "q": "Каков максимальный размер окна отправителя в протоколе Go-Back-N при n-битовой нумерации?", "opts": ["2^n", "2^(n-1)", "2^n - 1", "n - 1"], "ans": 2, "expl": "В протоколе Go-Back-N размер окна отправителя не более 2^n - 1 при n-битовой нумерации."}, {"type": "tf", "topic": "Вопрос 18", "q": "В протоколе с выборочным повтором (Selective Repeat) получатель принимает кадры строго по порядку и не буферизует кадры, пришедшие не по порядку.", "ans": false, "expl": "В Selective Repeat получатель буферизует кадры, пришедшие не по порядку. Именно получатель Go-Back-N принимает кадры строго по порядку."}, {"type": "mcq", "topic": "Вопрос 18", "q": "Что ускоряет повторную передачу в протоколе с выборочным повтором, не дожидаясь таймаута?", "opts": ["ACK", "NAK (отрицательное подтверждение)", "Двойной ACK", "Сигнал заглушки"], "ans": 1, "expl": "Отрицательное подтверждение (NAK) ускоряет повтор конкретного утерянного кадра, не дожидаясь таймаута."}, {"type": "mcq", "topic": "Вопрос 19", "q": "Какова скорость базового блока SONET — STS-1 (OC-1)?", "opts": ["10 Мбит/с", "51,84 Мбит/с", "155 Мбит/с", "622 Мбит/с"], "ans": 1, "expl": "Базовый блок SONET — STS-1/OC-1 обеспечивает скорость 51,84 Мбит/с."}, {"type": "tf", "topic": "Вопрос 19", "q": "В ADSL полоса до 1,1 МГц делится на 256 подканалов шириной 4312,5 Гц каждый.", "ans": true, "expl": "Согласно материалу, в DMT полоса до 1,1 МГц делится на 256 подканалов шириной 4312,5 Гц."}, {"type": "mcq", "topic": "Вопрос 19", "q": "Какие подканалы DMT в ADSL используются для нисходящего потока?", "opts": ["0-5", "6-30", "31-255", "1-255"], "ans": 2, "expl": "Подканалы 31-255 используются для нисходящего потока, 6-30 — для восходящего."}, {"type": "mcq", "topic": "Вопрос 20", "q": "Какой пример дейтаграммной сети приведён в материале?", "opts": ["ATM", "Frame Relay", "IP", "PSTN"], "ans": 2, "expl": "IP — пример дейтаграммной сети, где каждый пакет маршрутизируется независимо."}, {"type": "tf", "topic": "Вопрос 20", "q": "Коммутация каналов характеризуется неэффективным использованием ресурсов при пульсирующем трафике.", "ans": true, "expl": "Среди недостатков коммутации каналов указано неэффективное использование ресурсов при пульсирующем трафике."}, {"type": "match", "topic": "Тема 3", "q": "Сопоставьте понятия канального уровня с их определениями.", "pairs": [{"l": "Байт-стаффинг", "r": "Вставка escape-байта перед специальными символами внутри кадра"}, {"l": "Кодовое расстояние Хэмминга", "r": "Минимальное число позиций, в которых два допустимых кодовых слова различаются"}, {"l": "Протокол «Утопия»", "r": "Идеальный протокол без ошибок и без управления потоком"}, {"l": "Go-Back-N", "r": "Стратегия повтора всех кадров начиная с ошибочного"}, {"l": "NAK", "r": "Отрицательное подтверждение, сигнализирующее об ошибке конкретного кадра"}, {"l": "SONET", "r": "Стандарт синхронной передачи данных по оптоволокну"}, {"l": "DMT", "r": "Многочастотное мультиплексирование с разделением полосы на подканалы"}], "expl": "Каждое понятие связано с соответствующим определением из материалов Темы 3."}]}, {"id": 4, "name": "Подуровень управления доступом к среде", "questions": [{"n": 21, "title": "Проблема распределения канала. Статическое распределение канала. Допущения, связанные с динамическим распределением каналов.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Проблема распределения канала** (channel allocation problem) — центральная задача MAC-подуровня: множество **станций** разделяют общий физический канал (один кабель, одна радиочастота, общее оптоволокно), и нужно выработать правила, по которым они занимают его, чтобы избежать **коллизий** (collisions) — одновременных передач, искажающих сигналы. Все методы доступа делятся на два больших класса: **статическое** (детерминированное) распределение, при котором канал заранее разделён между станциями фиксированными долями, и **динамическое** (контентионное), при котором станции конкурируют за канал по ситуации.", "<h3>Статическое распределение канала</h3>", "Канал делится заранее равными долями между N станциями. Используются классические схемы мультиплексирования:", "- **FDM** (Frequency Division Multiplexing) — полоса B Гц разрезается на N поддиапазонов по B/N Гц; каждой станции — свой диапазон с защитными интервалами. Это аналог радиовещания: разные радиостанции на разных частотах.\n- **TDM** (Time Division Multiplexing) — время разрезается на повторяющиеся фреймы по N слотов; каждая станция передаёт только в свой слот.\n- **CDMA** — станции работают одновременно в одной полосе, разделяясь уникальными расширяющими кодами (Q11).", "Свойства статических схем:\n- **Детерминированная задержка** (≤ T_frame) и гарантированная доля канала B/N.\n- **Безболезненно** только при стабильной, равномерной и непрерывной нагрузке (классическая телефония).\n- **Плохо подходят для пульсирующего (bursty) трафика**: если станция временно молчит, её слот пустует — пропускная способность канала используется лишь на k/N долю, где k — число активно передающих. При N большом и редких передачах эффективность падает катастрофически.\n- Аналитически: для системы M/M/1 с λ запросов/с средняя задержка T = 1/(μC − λ); если разрезать на N подканалов C/N, задержка вырастает в N раз при той же суммарной нагрузке.", "Поэтому статика хороша для голосового трафика PSTN (постоянный поток 64 кбит/с) и не подходит для компьютерных данных, где **пульсирующий трафик** (bursty traffic) с пиковой скоростью, сильно превышающей среднюю, требует динамического разделения.", "<h3>Динамическое распределение канала</h3>", "В динамической схеме все станции потенциально равны, канал не закреплён. Станции пытаются передать, конкурируя или координируясь по протоколу MAC (ALOHA, CSMA, Token Passing, CSMA/CA — Q22).", "При анализе таких протоколов в учебнике Таненбаума приняты пять стандартных допущений:", "1. **Модель станций** — N независимых станций; каждая генерирует кадры в соответствии с пуассоновским потоком интенсивности λ/N (общая нагрузка λ кадров на время передачи).\n2. **Допущение об одном канале** — все станции делят один канал; в нём же передаются как данные, так и ACK; нет отдельного канала управления.\n3. **Допущение о коллизии** — две одновременные передачи всегда искажают друг друга, и обе должны быть повторены. Других ошибок (от шума) нет.\n4. **Время может быть** двух типов: **непрерывное** (станция может начать передачу в любой момент) или **слотированное** (передача только с начала каждого временного слота фиксированной длины). Слотирование удваивает максимальную пропускную способность ALOHA.\n5. **Прослушивание несущей** (carrier sensing):\n   - **С прослушиванием** — станция перед передачей определяет, занят ли канал (CSMA, Ethernet, Wi-Fi).\n   - **Без прослушивания** — станция передаёт «вслепую» (классическая ALOHA, спутниковые системы).", "Дополнительно различают:\n- **Мгновенное** (instantaneous) или **задержанное** (delayed) обнаружение коллизии;\n- **С обнаружением коллизий** (CD, Collision Detection) или **с их предотвращением** (CA, Collision Avoidance) в зависимости от способности станции одновременно передавать и слушать.", "Эти допущения позволяют сравнивать протоколы по аналитической эффективности и среднему времени задержки.", "<h3>Когда что применять</h3>", "- **Статическое деление** оптимально для **constant-bit-rate** потоков (голос, синхронные первичные группы PDH/SDH).\n- **Динамическое** — для **bursty data** (LAN, Wi-Fi, спутниковые VSAT-каналы), где сумма пиковых скоростей превышает мощность канала."], "terms": [{"ru": "Разделяемая среда", "en": "shared medium", "df": "физическая среда, используемая несколькими станциями одновременно"}, {"ru": "Подуровень MAC", "en": "Media Access Control", "df": "нижний подуровень канального уровня, отвечающий за доступ к среде"}, {"ru": "Статическое распределение", "en": "static allocation", "df": "заранее заданное деление канала между станциями"}, {"ru": "Динамическое распределение", "en": "dynamic / contention-based", "df": "конкурентный доступ к каналу"}, {"ru": "FDM", "en": "Frequency Division Multiplexing", "df": "частотное разделение канала"}, {"ru": "TDM", "en": "Time Division Multiplexing", "df": "временное разделение канала"}, {"ru": "Коллизия", "en": "collision", "df": "одновременная передача двух и более станций, приводящая к искажению сигнала"}, {"ru": "Пульсирующий трафик", "en": "bursty traffic", "df": "трафик с резкими периодическими всплесками активности"}, {"ru": "Прослушивание несущей", "en": "carrier sensing", "df": "определение занятости канала перед передачей"}, {"ru": "Слотирование", "en": "slotting", "df": "синхронизация передач началами фиксированных слотов"}], "summary": ["**Проблема распределения канала** — задача MAC-подуровня: как N станций делят общий физический ресурс без коллизий", "Два класса: **статическое** (детерминированное, заранее) и **динамическое** (контентионное, по ситуации)", "**Статика — FDM**: полоса B делится на N поддиапазонов с защитными интервалами (классическое радиовещание)", "**Статика — TDM**: время — N слотов в кадре, каждой станции свой слот", "**Статика — CDMA**: одна полоса, разделение ортогональными расширяющими кодами", "Свойства статики: детерминированная задержка ≤ T_frame, гарантированная доля B/N, нет коллизий", "Статика хороша при стабильной непрерывной нагрузке (голос PSTN, синхронные потоки PDH/SDH)", "Статика плоха при **bursty traffic**: если станция молчит, её слот пуст → утилизация k/N", "Аналитически M/M/1: при разрезании C на N подканалов задержка растёт в N раз", "**5 допущений Таненбаума** для динамических протоколов", "1. Модель N независимых станций с пуассоновским генератором кадров", "2. Один общий канал (включая ACK), без отдельного канала управления", "3. Допущение о коллизиях: две одновременные передачи всегда искажают друг друга; других ошибок нет", "4. Время: **непрерывное** (можно начать в любой момент) или **слотированное** (только с начала слота) — слотирование удваивает пропускную способность ALOHA", "5. **Прослушивание несущей** (carrier sensing) — с CS (CSMA, Ethernet, Wi-Fi) или без (ALOHA)", "Дополнительно: мгновенное vs задержанное обнаружение коллизии; **CD** vs **CA**", "Когда что: статика — для **CBR** (constant bit rate, голос); динамика — для bursty (LAN, Wi-Fi, VSAT)"]}, {"n": 22, "title": "Протоколы коллективного доступа. Система ALOHA. Протоколы множественного доступа с контролем несущей. Протоколы без столкновений. Протоколы с ограниченной конкуренцией. Протоколы беспроводных локальных сетей.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Протоколы множественного доступа** (multiple access / MAC protocols) — правила, по которым станции, разделяющие общий канал, координируют свои передачи. Все они решают одну задачу: достичь высокой пропускной способности без коллизий при разной нагрузке и при ограниченной возможности обмениваться управляющей информацией. Исторически развились пять семейств: случайный доступ (ALOHA), доступ с прослушиванием несущей (CSMA), коллизионная детекция (CSMA/CD), бесконкурентные методы (token, bitmap), гибриды (limited contention), и беспроводные варианты (MACA, CSMA/CA).", "<h3>ALOHA</h3>", "Норман Абрамсон, Гавайский университет, 1970 — первый протокол случайного множественного доступа для радиоканала ALOHANET.", "- **Pure ALOHA**: станция передаёт кадр сразу, как только он у неё появляется; при коллизии ждёт случайное время и повторяет. Время **«уязвимости» кадра** — 2·T_frame (любой кадр, начатый в этом окне, столкнётся). Аналитический максимум пропускной способности при пуассоновском потоке: **S = G·e⁻²ᴳ**, максимум **S_max ≈ 0,184 (18,4%)** при G=0,5.\n- **Slotted ALOHA**: ось времени разрезается на слоты длиной T_frame; передача только в начале слота. Окно уязвимости сокращается вдвое: **S = G·e⁻ᴳ**, **S_max ≈ 0,368 (36,8%)** при G=1.", "ALOHA до сих пор применяется в спутниковых VSAT-системах, RFID (EPC Gen2) и в каналах запроса сотовой связи (RACH).", "<h3>CSMA — множественный доступ с прослушиванием несущей</h3>", "Идея: перед передачей станция «слушает» эфир, не передаёт ли кто-то ещё. Это резко уменьшает вероятность коллизий, но не устраняет их (если две станции одновременно обнаружат свободу). Варианты:", "- **1-persistent CSMA**: если канал свободен — передаёт сразу; если занят — ждёт освобождения и передаёт немедленно. Жадный, при большой нагрузке — много коллизий. Основа Ethernet.\n- **Non-persistent CSMA**: если канал занят — ждёт случайное время, потом снова слушает. Меньше коллизий, выше средняя задержка.\n- **p-persistent CSMA** (для слотированных систем): если свободно — передаёт с вероятностью p, откладывает с вероятностью (1−p) на следующий слот. p подбирается под нагрузку.", "Пропускная способность CSMA сильно зависит от соотношения a = задержка_распространения / T_frame; при малых a достигает 0,8–0,9 (за вычетом коллизий).", "<h3>CSMA/CD — обнаружение коллизий</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/3/3f/Flowchart_CSMA-CD_media_access.svg\" alt=\"Блок-схема алгоритма CSMA/CD\" loading=\"lazy\"><figcaption>Блок-схема CSMA/CD: прослушать канал → передать → во время передачи проверить целостность сигнала → при коллизии послать jam → экспоненциальный откат и повтор. <em>Источник: Wikimedia Commons, CC BY-SA 4.0.</em></figcaption></figure>", "**CSMA/CD** (Carrier Sense Multiple Access with Collision Detection, IEEE 802.3) — расширение CSMA, в котором станция **продолжает слушать во время передачи**: при искажении напряжения на линии обнаруживается коллизия.", "- При коллизии: станция прекращает передачу → отправляет **jam-сигнал** (32-битный паттерн, гарантирующий обнаружение коллизии всеми) → ждёт по алгоритму **двоичного экспоненциального отката** (binary exponential backoff): после k-й коллизии (k ≤ 10) выбирает случайное число t из [0, 2ᵏ − 1] и ждёт t слотов длиной 51,2 мкс. После 16 коллизий подряд — отказ.\n- Требование: время передачи минимального кадра ≥ 2·τ_max, где τ_max — задержка распространения от края до края сегмента. Отсюда **минимальный размер кадра Ethernet 64 байта** для 10/100 Мбит/с (макс. длина сегмента ~2,5 км / 200 м).\n- В Wi-Fi не работает: в радиоканале мощность собственного передатчика на много порядков превышает входной сигнал, физически невозможно слушать во время передачи.", "<h3>Протоколы без столкновений</h3>", "Полностью исключают коллизии за счёт явной координации:\n- **Bit-map (basic bit-map protocol)**: каждому из N станций отведён слот в контентенционном фрейме; станция, имеющая данные, ставит «1» в свой слот. Затем все передают по порядку без коллизий. Эффективен при средней/высокой нагрузке.\n- **Двоичный обратный отсчёт** (binary countdown): станции с приоритетами по адресу побитово сравнивают свои идентификаторы; станция, у которой бит «0» в позиции «1» соседа, замолкает. Побеждает максимальный адрес. Эффективность близка к 100%.\n- **Передача маркера** (token passing): по логическому кольцу циркулирует специальный кадр-маркер, и только владеющая им станция может передавать. **Token Ring** (IEEE 802.5), **Token Bus** (802.4), **FDDI**. Гарантирует ограниченную задержку — критично для промышленных систем.", "<h3>Протоколы с ограниченной конкуренцией</h3>", "Гибрид: при малой нагрузке используют случайный доступ (быстрый), при большой переходят к детерминированному (стабильный). Пример — **адаптивный обход дерева** (adaptive tree walk): станции делятся на группы рекурсивно; при коллизии каждая группа делится надвое и опрашивается отдельно.", "<h3>Протоколы беспроводных ЛВС</h3>", "В радиоканале два специфических эффекта:\n- **Скрытый узел** (hidden terminal): станции A и C не слышат друг друга, но обе слышат точку доступа B; они одновременно передают на B → коллизия. Простое CSMA не помогает.\n- **Открытый узел** (exposed terminal): обратная ситуация — станция считает канал занятым из-за чужого, далёкого от её получателя сигнала, и зря отказывается передавать.", "Решения:\n- **MACA** (Multiple Access with Collision Avoidance, Karn 1990): перед передачей данных отправитель шлёт короткий **RTS** (Request To Send) с длительностью предстоящего обмена; получатель отвечает **CTS** (Clear To Send). Все услышавшие CTS молчат на это время.\n- **MACAW** (1994) — добавление ACK и подсчёт «справедливости».\n- **CSMA/CA** (Collision Avoidance), IEEE 802.11 DCF — практический протокол Wi-Fi:\n  - Перед передачей станция ждёт **DIFS** (DCF Inter-Frame Space, ~34 мкс в 11g/n) + случайный backoff в окне CW.\n  - Передаёт кадр; получатель ждёт **SIFS** (Short IFS, ~16 мкс) и шлёт **ACK**.\n  - При отсутствии ACK — удваивает CW (бинарный экспоненциальный откат), повтор.\n  - **NAV** (Network Allocation Vector) — виртуальное прослушивание через поле Duration в заголовках.\n  - **RTS/CTS** — опциональны, обычно активируются для кадров > порога (борьба со скрытым узлом)."], "terms": [{"ru": "MAC-протокол", "en": "Medium Access Control protocol", "df": "правила доступа к разделяемому каналу"}, {"ru": "CSMA", "en": "Carrier Sense Multiple Access", "df": "множественный доступ с прослушиванием несущей"}, {"ru": "CSMA/CD", "en": "Collision Detection", "df": "обнаружение коллизий, проводной Ethernet (IEEE 802.3)"}, {"ru": "CSMA/CA", "en": "Collision Avoidance", "df": "предотвращение коллизий, Wi-Fi (IEEE 802.11)"}, {"ru": "Двоичный экспоненциальный откат", "en": "binary exponential backoff", "df": "алгоритм ожидания после коллизии"}, {"ru": "Скрытый узел", "en": "hidden terminal", "df": "узел вне зоны слышимости отправителя, вызывающий коллизию у получателя"}, {"ru": "Открытый узел", "en": "exposed terminal", "df": "станция, ошибочно считающая канал занятым из-за чужой передачи"}, {"ru": "RTS/CTS", "en": "Request To Send / Clear To Send", "df": "резервирование канала перед передачей"}, {"ru": "NAV", "en": "Network Allocation Vector", "df": "виртуальный счётчик занятости канала в 802.11"}, {"ru": "DIFS / SIFS", "en": "DCF/Short Inter-Frame Spacing", "df": "межкадровые интервалы в Wi-Fi (SIFS < DIFS = выше приоритет)"}, {"ru": "DCF / PCF", "en": "Distributed / Point Coordination Function", "df": "режимы доступа 802.11"}], "summary": ["**MAC-протоколы** — правила доступа N станций к общему каналу; 5 семейств", "**Pure ALOHA** (Абрамсон 1970, ALOHANET): передача сразу, при коллизии — случайная задержка; окно уязвимости 2T_frame", "Pure ALOHA: **S = G·e⁻²ᴳ**, **S_max ≈ 0,184 (18,4%)** при G=0,5", "**Slotted ALOHA**: передача только с начала слота; **S = G·e⁻ᴳ**, **S_max ≈ 0,368 (36,8%)** при G=1", "ALOHA до сих пор: VSAT, RFID EPC Gen2, RACH в сотовой связи", "**CSMA** — слушать перед передачей; **1-persistent** (передаёт сразу при свободе, основа Ethernet); **non-persistent** (случайная задержка); **p-persistent** (с вероятностью p)", "Пропускная способность CSMA зависит от **a = τ_prop/T_frame**; при малых a достигает 0,8–0,9", "**CSMA/CD** (IEEE 802.3, Ethernet): слушать во время передачи; при коллизии — **jam-сигнал** (32 бит)", "**Двоичный экспоненциальный откат**: после k-й коллизии ожидание t ∈ [0, 2ᵏ−1] слотов (k≤10); 16 коллизий → отказ", "Минимум кадра Ethernet **64 байта** = 2τ_max при slot time 51,2 мкс на 10 Мбит/с", "В радио CSMA/CD не работает: свой передатчик заглушает прием", "**Bit-map / basic bit-map**: каждой станции свой слот для заявки → передачи без коллизий", "**Двоичный обратный отсчёт** (binary countdown): побитовое сравнение адресов, побеждает максимальный — эффективность ~100%", "**Token passing**: маркер по кольцу — Token Ring (**802.5**), Token Bus (**802.4**), FDDI; ограниченная задержка", "**Ограниченная конкуренция** — гибрид: при малой нагрузке случайный доступ, при большой — детерминированный (adaptive tree walk)", "**Беспроводные**: проблема **скрытого узла** (A,C не слышат друг друга, оба слышат B) — простое CSMA не помогает; **открытый узел** (зря отказывается передавать)", "**MACA** (Karn 1990): **RTS → CTS → Data**; CTS заставляет соседей молчать; **MACAW** + ACK", "**CSMA/CA** (802.11 DCF): DIFS (~34 мкс) → случайный backoff в CW → передача → SIFS (~16 мкс) → **ACK**; CW удваивается при потере", "**NAV** (Network Allocation Vector) — виртуальное прослушивание через поле Duration"]}, {"n": 23, "title": "Физический уровень сети Ethernet. Протокол подуровня управления доступом к среде в Ethernet. Производительность сети Ethernet. Коммутируемые сети Ethernet.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Ethernet** (IEEE 802.3) — семейство стандартов проводных локальных сетей, разработанное Робертом Меткалфом в Xerox PARC (1973) и доминирующее в LAN с 1980-х. Эволюционировало от 3 Мбит/с по коаксиальному кабелю в топологии «шина» до 400 Гбит/с по оптоволокну в коммутируемых дата-центрах. Сохраняет общий формат кадра и алгоритм MAC уже почти 50 лет — пример исключительной обратной совместимости.", "<h3>Физический уровень Ethernet</h3>", "- На физическом уровне определяются среда передачи, тип кодирования, скорости и максимальные дистанции.\n- **Эволюция сред**: коаксиал 10BASE5 (Thick, 500 м) / 10BASE2 (Thin, 185 м) → витая пара 10BASE-T (1990) → 100BASE-TX (1995) → 1000BASE-T (1999) → 10GBASE-T (2006) → 100GBASE-LR (оптика, 2010) → 400/800GBASE.\n- **Топология**: исторически «шина» (коаксиал), сейчас всегда «звезда»/«дерево» вокруг коммутаторов.\n- **Кодирование**: 10 Мбит/с — Манчестерское (50% избыточности), 100 Мбит/с — 4B/5B + MLT-3 / 4B/5B + NRZI (FX), 1 Гбит/с по меди — 4D-PAM5, 10 Гбит/с — 64B/66B, новые скорости — PAM-4 для 25/50/100/200 Гбит/с на полосу.\n- **Носители**: UTP Cat5e–Cat8 (до 100 м), MMF OM3–OM5 (300–550 м), SMF (десятки км), DAC/AOC для коротких соединений в дата-центрах.", "<h3>Подуровень MAC и формат кадра</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/1/13/Ethernet_Type_II_Frame_format.svg\" alt=\"Формат кадра Ethernet II\" loading=\"lazy\"><figcaption>Формат кадра Ethernet II: преамбула, SFD, MAC-адреса назначения и источника, EtherType, полезная нагрузка 46–1500 байт, FCS (CRC-32). <em>Источник: Wikimedia Commons, public domain.</em></figcaption></figure>", "В классическом полудуплексном Ethernet работает **CSMA/CD** (Q22): станция слушает канал → если свободен — передаёт → при обнаружении коллизии посылает jam-сигнал → ждёт по двоичному экспоненциальному откату → повторяет. CSMA/CD используется **только в полудуплексе**; в современных коммутируемых сетях c full-duplex портами он отключён.", "**Формат кадра Ethernet II** (DIX, доминирующий с 1980-х):", "| Поле | Длина | Назначение |\n|---|---|---|\n| Preamble | 7 байт (10101010×7) | синхронизация PHY |\n| SFD | 1 байт (10101011) | маркер начала |\n| Destination MAC | 6 байт | MAC-адрес получателя |\n| Source MAC | 6 байт | MAC-адрес отправителя |\n| EtherType | 2 байта | тип верхнего протокола (0x0800=IPv4, 0x86DD=IPv6, 0x0806=ARP, 0x8100=VLAN-tag) |\n| Payload | 46–1500 байт | полезная нагрузка |\n| FCS | 4 байта | контрольная сумма CRC-32 |", "- Если данных меньше 46 байт, кадр дополняется **padding**-нулями до минимума 64 байта (включая заголовки, без преамбулы).\n- **Jumbo frames** (до 9000 байт) — нестандартные большие кадры для дата-центров.\n- В альтернативном формате IEEE 802.3 поле EtherType заменяется длиной + 802.2 LLC/SNAP (используется реже).", "**Минимальный размер кадра** 64 байта продиктован CSMA/CD: время передачи минимального кадра должно быть ≥ 2·τ (двойной задержки распространения по самому длинному участку), иначе коллизия не обнаружится до завершения передачи. Это лежит в основе **slot time** 51,2 мкс (для 10 Мбит/с) и ограничения диаметра сегмента.", "<h3>Производительность Ethernet</h3>", "Эффективность классического CSMA/CD приближённо: **η ≈ 1 / (1 + 5a)**, где **a = τ_prop / T_frame** — отношение задержки распространения к времени передачи кадра. При a → 0 (большие кадры, короткий канал) η → 1; при a → ∞ — η → 0. С ростом скорости при фиксированной длине сегмента a растёт линейно, поэтому исторически каждое следующее поколение Ethernet требовало сокращения максимальной длины сегмента или перехода на full-duplex.", "В реальности на современном коммутируемом Ethernet эффективность близка к 100%, поскольку:\n- каждое link-соединение полнодуплексное, коллизий нет;\n- коммутатор просто буферизует кадры и пересылает их по адресу.", "<h3>Коммутируемый Ethernet</h3>", "- **Hub (концентратор)** — повторитель уровня L1; все его порты — единый **домен коллизий**, полудуплекс. Исторический, не выпускается с 2010-х.\n- **Switch (коммутатор)** — устройство L2: каждый порт — отдельный домен коллизий, полный дуплекс. CSMA/CD не нужен. Коммутатор пересылает кадр только на тот порт, за которым находится получатель.\n- **Backward learning** (обратное обучение): получив кадр на порту k от MAC-адреса X, коммутатор записывает в **CAM-таблицу** «MAC X → порт k». Записи имеют **age timer** (~300 с).\n- **Flooding**: если адрес назначения не найден в CAM или это broadcast/multicast — кадр копируется на все порты, кроме входного.\n- **STP** (Spanning Tree Protocol, IEEE 802.1D / RSTP 802.1w / MSTP 802.1s) — устраняет петли в избыточной топологии, отключая лишние линки.\n- **VLAN** (IEEE 802.1Q) — логическое разделение коммутатора на несколько изолированных сетей с отдельными broadcast-доменами; тэг 802.1Q (4 байта) после поля Source MAC.\n- **PoE** (Power over Ethernet, 802.3af/at/bt) — передача питания вместе с данными по витой паре (до 90 Вт).\n- **Link aggregation** (LACP, 802.3ad) — объединение нескольких физических линков в одну логическую с балансировкой."], "terms": [{"ru": "Ethernet", "en": "IEEE 802.3", "df": "семейство технологий проводных локальных сетей"}, {"ru": "Манчестерское кодирование", "en": "Manchester encoding", "df": "метод кодирования с переходом сигнала в середине бита; 10 Мбит/с Ethernet"}, {"ru": "FCS", "en": "Frame Check Sequence", "df": "контрольная сумма CRC-32 в конце кадра Ethernet"}, {"ru": "Домен коллизий", "en": "collision domain", "df": "сегмент сети, в котором станции могут столкнуться при передаче"}, {"ru": "Широковещательный домен", "en": "broadcast domain", "df": "область распространения broadcast-кадров"}, {"ru": "Hub / Switch", "en": "концентратор / коммутатор", "df": "устройства L1 и L2 соответственно"}, {"ru": "CAM-таблица", "en": "Content Addressable Memory", "df": "таблица соответствий «MAC ↔ порт» в коммутаторе"}, {"ru": "Обратное обучение", "en": "backward learning", "df": "коммутатор запоминает адреса отправителей из входящих кадров"}, {"ru": "STP / RSTP / MSTP", "en": "Spanning Tree Protocol", "df": "протоколы предотвращения петель"}, {"ru": "VLAN", "en": "Virtual LAN, IEEE 802.1Q", "df": "виртуальная локальная сеть, логическое разделение коммутатора"}, {"ru": "PoE", "en": "Power over Ethernet", "df": "подача питания по витой паре"}, {"ru": "LACP", "en": "Link Aggregation Control Protocol", "df": "объединение нескольких физических линков"}], "summary": ["**Ethernet** (IEEE 802.3, Меткалф/Xerox PARC 1973) — доминирующий стандарт LAN; формат кадра и MAC сохраняются ~50 лет", "Эволюция сред: коаксиал (10BASE5/2) → витая пара 10BASE-T → 100BASE-TX → 1000BASE-T → 10GBASE-T → оптика 100/400/800 Гбит/с", "Топология: исторически шина (коаксиал), сейчас всегда **звезда** вокруг коммутаторов", "Кодирование: 10 Мбит/с — **Манчестер** (50% избыточн.); 100 — **4B/5B + MLT-3**; 1 Гбит/с медь — **4D-PAM5**; 10 Гбит/с — **64B/66B**; 25+ Гбит/с — PAM-4", "В полудуплексе работает **CSMA/CD**; в современных коммутируемых full-duplex CSMA/CD отключён", "**Формат кадра Ethernet II (DIX)**: Preamble 7Б + SFD 1Б + DA 6Б + SA 6Б + EtherType 2Б + Payload 46–1500Б + **FCS (CRC-32) 4Б**", "EtherType: **0x0800=IPv4**, 0x86DD=IPv6, 0x0806=ARP, 0x8100=VLAN-tag", "Минимум кадра **64 байта** (с padding) диктуется CSMA/CD: T_frame ≥ 2τ; slot time 51,2 мкс на 10M", "**Jumbo frames** до 9000 байт — нестандарт для ДЦ", "Эффективность CSMA/CD: **η ≈ 1/(1+5a)**, где a = τ_prop/T_frame; падает с ростом скорости", "**Коммутируемый Ethernet**: hub L1 = один collision domain; **switch L2** = порт = collision domain + full-duplex", "**Backward learning**: «MAC X → порт k» в **CAM-таблицу** с age timer ~300 с", "**Flooding**: кадр на неизвестный/broadcast/multicast копируется на все порты", "**STP** (802.1D, Perlman 1985) предотвращает петли; RSTP (802.1w) <1с; MSTP (802.1s) — дерево на группу VLAN", "**VLAN** (802.1Q): 4-байтовый тег между SA и EtherType — логическое разделение, отдельные broadcast-домены", "**PoE** (802.3af/at/bt) — питание до 90 Вт по UTP; **LACP** (802.3ad) — link aggregation"]}, {"n": 24, "title": "Fast Ethernet. Gigabit Ethernet. 10-гигабитный Ethernet.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "С 1995 года скорость Ethernet увеличилась с 10 Мбит/с до 400 Гбит/с, при этом был сохранён **формат кадра** и MAC-протокол. Менялись только физический уровень (среда, кодирование) и режим работы (от полудуплекса с CSMA/CD к full-duplex коммутируемому). Линейка стандартов:  **Fast Ethernet** (100 Мбит/с, 1995) → **Gigabit Ethernet** (1 Гбит/с, 1998–1999) → **10 Gigabit Ethernet** (2002–2006) → 25/40/50/100/200/400 Гбит/с (2010–2020-е). Совместимость поддерживается через **MII-семейство интерфейсов** между MAC и PHY: MII, GMII, XGMII и т. д.", "<h3>Fast Ethernet (IEEE 802.3u, 1995)</h3>", "100 Мбит/с — десятикратный прорыв над классическим Ethernet, разработанный быстро на основе технологий FDDI.", "- **100BASE-TX** — 2 пары UTP Cat5 (одна на приём, одна на передачу) + кодирование **4B/5B + MLT-3** (каждые 4 бита кодируются 5-битным символом 4B/5B, затем линейное кодирование MLT-3 даёт 3 уровня сигнала, уменьшая частоту до 31,25 МГц). Дальность 100 м. Самый массовый вариант.\n- **100BASE-T4** — 4 пары Cat3 (для апгрейда старой проводки), кодирование 8B/6T. Не прижился.\n- **100BASE-FX** — MMF/SMF, длина волны 1310 нм, кодирование 4B/5B + NRZI. До 2 км по MMF, до 40 км по SMF (full-duplex).\n- **Auto-Negotiation** (802.3u clause 28) — обмен импульсами FLP (Fast Link Pulse), стороны выбирают наивысшую общую скорость и режим дуплекса.\n- Возможны и полудуплекс (с CSMA/CD), и full-duplex; диаметр полудуплексного сегмента сократился до ~200 м.", "<h3>Gigabit Ethernet (IEEE 802.3z / 802.3ab, 1998–1999)</h3>", "- **1000BASE-SX** (802.3z) — MMF 850 нм, 220–550 м (зависит от OM).\n- **1000BASE-LX** — SMF 1310 нм, до 5 км; MMF до 550 м.\n- **1000BASE-CX** — короткие медные сборки (25 м), вытеснен.\n- **1000BASE-T** (802.3ab) — 4 пары Cat5e, **все 4 пары работают одновременно в обе стороны** (echo cancellation), кодирование **4D-PAM5** (4-мерная PAM-5: символы по 5 уровней на каждой из 4 пар, скорость символов 125 МГц). Дальность 100 м. Стал основой современных LAN.\n- На оптике обычно используется кодирование **8B/10B** (20% избыточность).", "**Полудуплексный режим** на 1 Гбит/с потребовал двух «костылей»:\n- **Расширение несущей** (carrier extension) — короткие кадры дополняются специальными символами до 512 байт, чтобы slot time соответствовал 2·τ_max на гигабитной скорости.\n- **Frame bursting** — станция, выигравшая канал, может «выпустить очередь» нескольких кадров подряд без пауз, амортизируя накладные расходы расширения.", "На практике 1G работает только в full-duplex; полудуплексный 1 Гбит/с — редкая экзотика.", "<h3>10 Gigabit Ethernet (IEEE 802.3ae 2002 / 802.3an 2006)</h3>", "С 10G CSMA/CD окончательно отменён: 802.3ae поддерживает **только full-duplex**.", "- **10GBASE-SR** — MMF 850 нм, 26–300 м (OM3/OM4/OM5).\n- **10GBASE-LR** — SMF 1310 нм, до 10 км.\n- **10GBASE-ER / -ZR** — SMF 1550 нм, до 40/80 км.\n- **10GBASE-T** (802.3an) — Cat6a/Cat7, до 100 м; кодирование PAM-16 + LDPC FEC, высокое энергопотребление (~5 Вт на порт).\n- **10GBASE-CX4 / SFP+ DAC** — короткие медные DAC для дата-центров (до 10 м).\n- Линейное кодирование — **64B/66B** (всего 3% избыточности против 20% у 8B/10B), плюс scrambler.\n- Появились варианты **WAN PHY** (10GBASE-W) для совместимости с SONET OC-192 и **LAN PHY** (10GBASE-R).", "<h3>Дальнейшее развитие</h3>", "- **25/40/50/100GbE** (802.3ba/by/cd, 2010–2018) — параллельные оптические каналы, кодирование PAM-4 на полосу.\n- **200/400GbE** (802.3bs, 2017) — 8×50 Гбит/с PAM-4.\n- **800/1600GbE** (802.3df, 802.3dj, в разработке) — для гипермасштабных дата-центров.\n- **EEE** (Energy-Efficient Ethernet, 802.3az) — переход интерфейса в LPI-режим при простое.", "<h3>Сравнение характеристик</h3>", "| Поколение | Стандарт | Кодирование | Среда | Дальность |\n|---|---|---|---|---|\n| Fast (100M) | 802.3u | 4B/5B + MLT-3 | UTP Cat5 | 100 м |\n| Gigabit | 802.3ab | 4D-PAM5 | UTP Cat5e | 100 м |\n| Gigabit | 802.3z | 8B/10B | MMF/SMF | 550 м / 5 км |\n| 10G | 802.3an | PAM-16+LDPC | Cat6a | 100 м |\n| 10G | 802.3ae | 64B/66B | SMF (LR) | 10 км |\n| 100G | 802.3ba | 64B/66B PAM-4 | 4 пары SMF | 10 км |"], "terms": [{"ru": "Fast Ethernet", "en": "IEEE 802.3u", "df": "Ethernet 100 Мбит/с"}, {"ru": "Gigabit Ethernet", "en": "IEEE 802.3z/ab", "df": "Ethernet 1 Гбит/с"}, {"ru": "Автосогласование", "en": "Auto-Negotiation", "df": "автоматический выбор скорости и режима дуплекса"}, {"ru": "MLT-3", "en": "Multi-Level Transmission 3-level", "df": "кодирование 100BASE-TX"}, {"ru": "Расширение несущей", "en": "carrier extension", "df": "дополнение кадров до 512 байт для работы CSMA/CD на гигабитной скорости"}, {"ru": "Пакетная передача", "en": "frame bursting", "df": "отправка нескольких кадров подряд без пауз"}, {"ru": "DAC", "en": "Direct Attach Copper", "df": "короткие медные сборки для дата-центров"}, {"ru": "EEE", "en": "Energy-Efficient Ethernet, 802.3az", "df": "энергосбережение в простое"}], "summary": ["С 1995 г. скорость Ethernet выросла в 40000 раз; **формат кадра и MAC сохраняются**; меняется PHY и режим (full-duplex)", "Совместимость через **MII-семейство** интерфейсов MAC↔PHY: MII, GMII, XGMII", "**Fast Ethernet** (IEEE 802.3u, 1995): 100 Мбит/с", "**100BASE-TX** — 2 пары UTP Cat5, **4B/5B + MLT-3** (3 уровня, частота 31,25 МГц), 100 м", "100BASE-T4 (4 пары Cat3, 8B/6T, не прижился); **100BASE-FX** — MMF/SMF 1310 нм, 4B/5B+NRZI", "**Auto-Negotiation** (FLP) — автоматический выбор скорости и дуплекса", "**Gigabit Ethernet** (IEEE 802.3z/ab, 1998–99): 1 Гбит/с", "**1000BASE-SX** — MMF 850 нм, 220–550 м; **1000BASE-LX** — SMF 1310 нм, до 5 км", "**1000BASE-T** (802.3ab) — 4 пары Cat5e, **4D-PAM5** (5 уровней по 4 парам, echo cancellation), 100 м", "На оптике GbE — **8B/10B** (20% избыточн.)", "Полудуплекс 1G: **carrier extension** (короткие кадры до 512 байт) + **frame bursting**; на практике 1G только full-duplex", "**10GbE** (IEEE 802.3ae 2002 / 802.3an 2006): **только full-duplex**, CSMA/CD отменён", "**10GBASE-SR** — MMF 850 нм, 26–300 м; **10GBASE-LR** — SMF 1310 нм, до 10 км; ER/ZR — 1550 нм, 40/80 км", "**10GBASE-T** — Cat6a/7, **PAM-16 + LDPC FEC**, 100 м, ~5 Вт/порт", "10GbE кодирование **64B/66B** (3% избыточности) + scrambler; варианты WAN-PHY (под SONET OC-192) и LAN-PHY", "25/40/50/100GbE (802.3ba/by/cd) — параллельные оптические каналы + PAM-4; 200/400GbE (802.3bs) = 8×50 PAM-4", "**EEE** (Energy-Efficient Ethernet, 802.3az) — LPI-режим при простое"]}, {"n": 25, "title": "Стандарт 802.11: архитектура и стек протоколов, физический уровень, протокол подуровня управления доступом к среде, структура кадра, сервисы.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**IEEE 802.11**, торговая марка **Wi-Fi** — семейство стандартов беспроводных локальных сетей, определяющее физический уровень (PHY) и подуровень управления доступом к среде (MAC) для радиоканалов в безлицензионных диапазонах 2,4 / 5 / 6 ГГц. Первый стандарт принят в 1997 г.; на 2026 г. актуальны Wi-Fi 6 (802.11ax), Wi-Fi 6E и Wi-Fi 7 (802.11be). Wi-Fi доминирует в LAN-доступе для пользовательских устройств и интегрирован практически во все смартфоны, ноутбуки и IoT-устройства.", "<h3>Архитектура и режимы работы</h3>", "- **Станция** (STA) — любое 802.11-устройство (ноутбук, смартфон, AP).\n- **BSS** (Basic Service Set) — одна **точка доступа** (AP, Access Point) и связанные с ней STA. Идентифицируется **BSSID** = MAC-адрес AP.\n- **IBSS** (Independent BSS) — ad-hoc режим: станции общаются напрямую без AP.\n- **ESS** (Extended Service Set) — несколько BSS, объединённых через **DS** (Distribution System, обычно проводной Ethernet) и имеющих общий **SSID** (Service Set Identifier — человекочитаемое имя сети). В ESS возможен **роуминг** между AP.\n- **Mesh BSS** (802.11s) — самоорганизующаяся сетка AP с маршрутизацией HWMP.", "<h3>Физический уровень и поколения</h3>", "| Стандарт | Маркетинг | Полоса | Модуляция / макс. скорость |\n|---|---|---|---|\n| 802.11 (1997) | — | 2,4 ГГц | FHSS / DSSS, 1–2 Мбит/с |\n| 802.11b (1999) | — | 2,4 ГГц | HR-DSSS, 11 Мбит/с |\n| 802.11a (1999) | — | 5 ГГц | OFDM, 54 Мбит/с |\n| 802.11g (2003) | — | 2,4 ГГц | OFDM, 54 Мбит/с |\n| 802.11n (2009) | Wi-Fi 4 | 2,4 / 5 ГГц | OFDM+MIMO, 600 Мбит/с |\n| 802.11ac (2013) | Wi-Fi 5 | 5 ГГц | 256-QAM, MU-MIMO, 6,9 Гбит/с |\n| 802.11ax (2019) | Wi-Fi 6 / 6E | 2,4 / 5 / 6 ГГц | OFDMA, 1024-QAM, 9,6 Гбит/с |\n| 802.11be (2024) | Wi-Fi 7 | 2,4 / 5 / 6 ГГц | 4096-QAM, MLO, 46 Гбит/с |", "Ключевые методы PHY: **OFDM** (поднесущие через 312,5 кГц в 802.11a/g, до 78 кГц в HE-OFDM 802.11ax), **MIMO** до 8×8 в Wi-Fi 6, **MU-MIMO** для одновременной передачи нескольким клиентам, **OFDMA** для деления одного канала между клиентами в коротких передачах.", "<h3>Подуровень MAC</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/1/1d/Csma_ca.svg\" alt=\"Блок-схема CSMA/CA — алгоритм доступа Wi-Fi\" loading=\"lazy\"><figcaption>Алгоритм CSMA/CA: слушать канал → DIFS → случайный backoff в окне CW → передать → SIFS → ACK. При неудаче — удвоение CW. <em>Источник: Wikimedia Commons, jjgarcia.tsc, Attribution.</em></figcaption></figure>", "- Основной режим — **DCF** (Distributed Coordination Function) на основе **CSMA/CA**. Радио-станция физически не может слушать собственную передачу, поэтому коллизии не обнаруживаются, а избегаются.\n- Алгоритм передачи кадра:\n  1. Станция слушает канал и ждёт его освобождения.\n  2. Ждёт **DIFS** (~34 мкс в 802.11n/ac).\n  3. Случайный **backoff** ∈ [0, CW] слотов по 9 мкс (CW начинается с CW_min=15).\n  4. Передаёт кадр.\n  5. Получатель ждёт **SIFS** (~16 мкс) и отвечает **ACK**.\n  6. Если ACK не получен — CW удваивается до CW_max=1023; повтор.\n- **NAV** (Network Allocation Vector) — виртуальное прослушивание: каждое поле Duration в заголовке резервирует канал на указанное время; другие станции декрементируют NAV и не пытаются передавать, пока он не обнулится.\n- **RTS/CTS** — опциональный 4-этапный обмен (RTS→CTS→Data→ACK) для борьбы со скрытым узлом и для коротких кадров > порога RTS.\n- **PCF** (Point Coordination Function) — опциональный бесконкурентный режим: AP опрашивает (poll) станции по списку; вытеснен в 802.11e через **HCF** (Hybrid Coordination Function) и **EDCA** с четырьмя классами AC_VO/VI/BE/BK для QoS (WMM).\n- **Block ACK** (802.11n+) — одно подтверждение для серии до 64 кадров; снижает накладные расходы.", "<h3>Структура кадра</h3>", "Три типа кадров 802.11:\n- **Management**: Beacon (раз в 100 мс, объявление сети), Probe Request/Response (сканирование), Association/Reassociation/Disassociation, Authentication/Deauthentication.\n- **Control**: RTS, CTS, ACK, Block ACK, PS-Poll.\n- **Data**: переносят полезную нагрузку.", "Формат data-кадра:", "| Поле | Длина | Назначение |\n|---|---|---|\n| Frame Control | 2 Б | тип/подтип, ToDS/FromDS, флаги |\n| Duration/ID | 2 Б | время для NAV |\n| Address 1 | 6 Б | получатель (Receiver) |\n| Address 2 | 6 Б | отправитель (Transmitter) |\n| Address 3 | 6 Б | BSSID или адрес назначения в DS |\n| Sequence Control | 2 Б | номер последовательности и фрагмента |\n| Address 4 | 6 Б | (только в WDS, ToDS=FromDS=1) |\n| QoS Control / HT Control | 2 + 4 Б | в HT/VHT кадрах |\n| Payload | до 2304 Б | данные |\n| FCS | 4 Б | CRC-32 |", "Четыре адреса нужны, потому что кадр может проходить через AP: исходный отправитель, передатчик (предыдущий хоп — AP), получатель (следующий хоп — AP) и конечный адрес. В WDS между двумя AP задействованы все 4 адреса.", "<h3>Сервисы 802.11</h3>", "- **Аутентификация** (authentication) и **деаутентификация** — проверка подлинности станции.\n- **Ассоциация** / **реассоциация** / **диссоциация** — присоединение и переход между AP.\n- **Конфиденциальность** (privacy): эволюция WEP (RC4, взломан, **не использовать**) → **WPA/TKIP** → **WPA2/AES-CCMP** (текущий минимум) → **WPA3/SAE** (защита от офлайн-словарных атак, обязательная PMF — Protected Management Frames).\n- **Распределение** (distribution) — пересылка кадра внутри DS к нужному AP.\n- **Интеграция** (integration) — связь с проводной сетью через portal-функцию AP.\n- **MSDU delivery / QoS / Power management** — фрагментация, очереди приоритета, спящий режим клиента (PS-Poll)."], "terms": [{"ru": "STA / AP", "en": "Station / Access Point", "df": "клиент / точка доступа"}, {"ru": "BSS / IBSS / ESS", "en": "Basic / Independent / Extended Service Set", "df": "типы конфигураций"}, {"ru": "DS", "en": "Distribution System", "df": "обычно проводной Ethernet, соединяющий AP в ESS"}, {"ru": "CSMA/CA", "en": "Collision Avoidance", "df": "множественный доступ с предотвращением коллизий"}, {"ru": "NAV", "en": "Network Allocation Vector", "df": "виртуальный счётчик занятости канала"}, {"ru": "PMF", "en": "Protected Management Frames, 802.11w", "df": "защита служебных кадров"}, {"ru": "WDS", "en": "Wireless Distribution System", "df": "беспроводной мост между точками доступа"}, {"ru": "MLO", "en": "Multi-Link Operation, Wi-Fi 7", "df": "одновременная работа в нескольких диапазонах"}], "summary": ["**IEEE 802.11 / Wi-Fi** — беспроводная LAN в безлицензионных ISM 2,4 / 5 / 6 ГГц; с 1997 г.", "**Архитектура**: STA (станция), AP (точка доступа); **BSSID** = MAC точки", "**BSS** = AP + клиенты; **IBSS** = ad-hoc без AP; **ESS** = несколько BSS через **DS** (обычно Ethernet), общий **SSID**; **Mesh BSS** (802.11s, HWMP)", "Поколения: 11b (HR-DSSS 11 Мбит/с, 2,4); 11a (OFDM 54, 5); 11g (OFDM 54, 2,4); 11n=Wi-Fi 4 (MIMO 600); **11ac=Wi-Fi 5** (5 ГГц, 256-QAM, MU-MIMO 6,9 Гбит/с)", "**11ax=Wi-Fi 6/6E** (OFDMA, 1024-QAM, 9,6 Гбит/с, 2,4/5/6 ГГц); **11be=Wi-Fi 7** (4096-QAM, **MLO**, 46 Гбит/с)", "PHY: **OFDM** с поднесущими 312,5 кГц (11a/g) или 78 кГц (HE-OFDM); MIMO до **8×8** в Wi-Fi 6; MU-MIMO; OFDMA", "**MAC = CSMA/CA + DCF** (Distributed Coordination Function); радио не может слушать собственную передачу → коллизии избегаются", "Алгоритм: слушать → **DIFS** (~34 мкс) → backoff ∈ [0,CW] слотов по 9 мкс → передать → получатель **SIFS** (~16 мкс) + **ACK**; нет ACK → CW удваивается до 1023", "**NAV** (Network Allocation Vector) — виртуальное прослушивание через поле Duration в заголовках", "**RTS/CTS** опциональны для кадров > порога — борьба со скрытым узлом", "**PCF/HCF/EDCA** (802.11e): четыре класса AC_VO/VI/BE/BK для QoS (WMM)", "**Block ACK** (11n+) — одно подтверждение для серии до 64 кадров", "Три типа кадров: **Management** (Beacon каждые 100 мс, Probe, Assoc, Auth), **Control** (RTS/CTS/ACK/Block-ACK), **Data**", "Кадр data: FC 2Б + Dur 2Б + **4 адреса по 6Б** + Seq 2Б + QoS/HT 2+4Б + Payload до 2304Б + FCS 4Б CRC-32", "4 адреса: для WDS через AP — отправитель, передатчик (AP), получатель (AP), назначение", "**Сервисы**: аутентификация, ассоциация/реассоциация/диссоциация (роуминг в ESS), distribution, integration, MSDU delivery, QoS, power management", "Безопасность: WEP (взломан) → WPA-TKIP → **WPA2-AES-CCMP** (802.11i, минимум) → **WPA3-SAE** + обязательный **PMF** (802.11w)"]}, {"n": 26, "title": "Широкополосные беспроводные сети. Сравнение стандарта 802.16 с 802.11 и 3G. Стандарт 802.16: архитектура и стек протоколов, физический уровень, протокол подуровня MAC, структура кадра.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**IEEE 802.16**, торговое имя **WiMAX** (Worldwide Interoperability for Microwave Access) — семейство стандартов **широкополосного беспроводного доступа** (BWA, Broadband Wireless Access) MAN-уровня. Спроектирован как альтернатива и дополнение к проводному xDSL и кабельным сетям: одна базовая станция покрывает соту радиусом 5–30 км, обслуживая сотни абонентов (фиксированных и мобильных) со скоростями десятки–сотни Мбит/с. Исторически конкурировал с LTE (3GPP) за рынок 4G; по факту LTE/5G NR победили, и WiMAX сегодня используется лишь в нишевых сценариях. С академической точки зрения 802.16 интересен своей архитектурой централизованного MAC и поддержкой QoS на канальном уровне.", "<h3>Сравнение 802.16 с 802.11 и 3G</h3>", "| Критерий | 802.11 (Wi-Fi) | 802.16 (WiMAX) | 3G (UMTS) |\n|---|---|---|---|\n| Назначение | LAN, ~100 м | MAN, 5–50 км | WAN, сотовая телефония + данные |\n| Топология | случайные клиенты | точка-многоточка / mesh | сотовая |\n| MAC | конкурентный (CSMA/CA) | централизованный (TDMA + OFDMA) | централизованный |\n| QoS | best-effort + EDCA-классы | встроенная, 4–5 классов | встроенная (CS, PS) |\n| Поддержка мобильности | роуминг между AP | мобильный WiMAX (802.16e) | да, иерархический core |\n| Архитектура транспорта | пакетная (Ethernet over Wi-Fi) | полностью пакетная (IP) | каналы + пакеты PS |\n| Лицензия | без лицензии | лицензируемая (2,5/3,5 ГГц) | лицензируемая |", "WiMAX превзошёл Wi-Fi в дальности и QoS, превосходил 3G в скорости и пакетной архитектуре, но проиграл LTE из-за поддержки телеком-индустрией (3GPP-экосистема) и обратной совместимости с GSM/UMTS.", "<h3>Архитектура и стек протоколов</h3>", "- **BS** (Base Station) — мачта оператора, обслуживает соту, управляет всеми SS.\n- **SS** (Subscriber Station) — стационарный или мобильный абонент (CPE — Customer Premises Equipment).\n- **ASN** (Access Service Network) — кластер BS + ASN-GW.\n- **CSN** (Connectivity Service Network) — IP-ядро, AAA, биллинг, выход в Интернет.\n- Топология: **PMP** (Point-to-Multipoint) — звезда; **Mesh** — узлы пересылают трафик друг через друга.\n- Стек: PHY → MAC (Common Part Sublayer + Convergence Sublayer + Security Sublayer) → SLC/SSCS (для упаковки IP, ATM, Ethernet).", "<h3>Физический уровень</h3>", "- **802.16-2001** (исходный) — 10–66 ГГц, требует LOS, прямой широкополосный доступ для бизнеса.\n- **802.16-2004 / 802.16d** — 2–11 ГГц, NLOS-режим для фиксированных абонентов, **OFDM-256**.\n- **802.16e-2005** — мобильный WiMAX, **OFDMA** (512–2048 поднесущих), поддержка хэндовера, MIMO 2×2.\n- **802.16m / WirelessMAN-Advanced** — IMT-Advanced (4G): до 1 Гбит/с в фиксированном режиме, 100 Мбит/с мобильном; MIMO 4×4 и выше.\n- **Дуплексирование**: **TDD** (асимметричный трафик, проще распределить ресурсы) или **FDD** (две полосы).\n- **Адаптивная модуляция и кодирование** (AMC): BPSK → QPSK → 16-QAM → 64-QAM, в зависимости от SNR; FEC — свёрточный + Reed-Solomon, позже турбокоды и LDPC.", "<h3>Подуровень MAC</h3>", "В отличие от 802.11, MAC 802.16 **централизованный и ориентированный на соединение**:\n- BS полностью распределяет ресурсы (слоты времени и поднесущие OFDMA) между SS — нет конкуренции, нет коллизий в полезной фазе.\n- Каждое соединение между SS и BS получает **CID** (16-битный Connection Identifier); пакеты идут только по установленным соединениям.\n- Перед использованием канала SS выполняет **initial ranging** (синхронизация задержки и мощности) и аутентификацию.\n- **Класс QoS** назначается каждому соединению при создании:\n  - **UGS** (Unsolicited Grant Service) — постоянная скорость с фиксированными слотами, для VoIP (T1-эмуляция).\n  - **rtPS** (real-time Polling Service) — переменный битрейт реального времени (видео).\n  - **ertPS** (extended rtPS, в 802.16e) — для VoIP с подавлением пауз.\n  - **nrtPS** (non-real-time Polling Service) — гарантированная минимальная скорость без жёстких задержек (FTP).\n  - **BE** (Best Effort) — без гарантий (веб-трафик).\n- **Шифрование** — AES-CCM, ключи через PKMv2 (Privacy Key Management).\n- **ARQ + HARQ** — повторные передачи поверх FEC.", "<h3>Структура кадра OFDMA</h3>", "Кадр TDD длительностью обычно 5 мс делится на **subframes**:\n- **Преамбула** — синхронизация.\n- **FCH** (Frame Control Header) — параметры расположения карт.\n- **DL-MAP** и **UL-MAP** — карты, указывающие каждой SS, в каких «прямоугольниках» (время × поднесущие) на DL/UL ей разрешено принимать/передавать.\n- **DL-burst** — данные от BS к SS.\n- **TTG** (Transmit/Receive Transition Gap) — защитный интервал.\n- **UL-burst** — данные от SS к BS.\n- **RTG** — обратный защитный интервал.", "MAC PDU состоит из 6-байтового заголовка (тип, длина, CID, флаги шифрования и CRC) + полезная нагрузка + опциональный CRC; поддерживаются упаковка нескольких SDU в один PDU (packing) и фрагментация."], "terms": [{"ru": "WiMAX", "en": "Worldwide Interoperability for Microwave Access", "df": "коммерческое название 802.16"}, {"ru": "BWA", "en": "Broadband Wireless Access", "df": "широкополосный беспроводной доступ"}, {"ru": "BS", "en": "Base Station", "df": "базовая станция, управляет сетью"}, {"ru": "QoS", "en": "Quality of Service", "df": "гарантии качества обслуживания (приоритеты для голоса, видео и т.д.)"}, {"ru": "CID", "en": "Connection ID", "df": "идентификатор соединения в 802.16"}, {"ru": "OFDMA", "en": "OFDM Multiple Access", "df": "множественный доступ с распределением поднесущих"}, {"ru": "AMC", "en": "Adaptive Modulation and Coding", "df": "адаптивная модуляция и кодирование"}, {"ru": "LOS / NLOS", "en": "Line of Sight / Non-Line of Sight", "df": "прямая / непрямая видимость"}, {"ru": "PKMv2", "en": "Privacy Key Management", "df": "управление ключами WiMAX"}], "summary": ["**IEEE 802.16 / WiMAX** — широкополосный беспроводной доступ MAN-уровня (BWA)", "Соты 5–30 км, скорости десятки–сотни Мбит/с; конкурент xDSL/кабеля; проиграл LTE", "**vs 802.11**: больший радиус, лицензируемые частоты (2,5/3,5 ГГц), централизованный MAC, встроенный QoS", "**vs 3G UMTS**: выше пропускная способность, полностью **пакетная IP-архитектура**", "**Архитектура**: **BS** (Base Station) — мачта; **SS/CPE** — абонент; **ASN** (Access Service Network) + **CSN** (Connectivity SN, AAA/биллинг)", "Топологии: **PMP** (point-to-multipoint, звезда) и **Mesh**", "Стек: PHY → MAC (Common Part + Convergence + Security) → SLC/SSCS (IP, ATM, Ethernet)", "**802.16-2001** — 10–66 ГГц, LOS; **802.16d-2004** — 2–11 ГГц NLOS, OFDM-256", "**802.16e-2005** (мобильный): **OFDMA** 512–2048 поднесущих, хэндовер, MIMO 2×2", "**802.16m / WirelessMAN-Advanced** (IMT-Advanced 4G): до 1 Гбит/с фикс., 100 мобильн., MIMO 4×4", "**Дуплекс**: TDD (асимметричный трафик) или FDD; **AMC** — адаптивная BPSK→QPSK→16-QAM→64-QAM; FEC свёрточный+RS, затем турбо/LDPC", "**MAC централизованный и connection-oriented**: BS распределяет все ресурсы → нет коллизий", "Каждое соединение получает **CID** (16-бит); **initial ranging** для синхронизации", "**QoS-классы**: **UGS** (фикс. слоты VoIP/T1), **rtPS** (видео), **ertPS** (VoIP с подавлением пауз), **nrtPS** (FTP), **BE**", "Шифрование AES-CCM, ключи **PKMv2**; **ARQ + HARQ**", "**Структура кадра OFDMA** (TDD, обычно 5 мс): Preamble → FCH → **DL-MAP/UL-MAP** (карты ресурсов) → DL-burst → TTG → UL-burst → RTG", "MAC PDU: 6-байт заголовок (тип, длина, CID, флаги, CRC) + payload; поддержка packing и фрагментации"]}, {"n": 27, "title": "Архитектура Bluetooth: набор протоколов, уровень радиосвязи, уровень немодулированной передачи, структура кадра.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Bluetooth** (IEEE 802.15.1, в наше время стандартизирован Bluetooth SIG) — открытый стандарт беспроводной персональной сети (**WPAN**, Wireless Personal Area Network) для связи устройств на коротких расстояниях. Изначально (1998 г., Ericsson) задумывался как кабельная замена RS-232 и предназначался для гарнитур, мышей, клавиатур, обмена файлами между телефонами. Сегодня делится на две ветки: классический **Bluetooth BR/EDR** (для аудио, гарнитур, OPP) и **Bluetooth Low Energy (BLE)** — для маломощных устройств IoT (носимая электроника, медицинские датчики, маяки iBeacon). Все варианты работают в диапазоне **2,4 ГГц ISM** (2,400–2,485 ГГц).", "<h3>Архитектура и топология</h3>", "- **Пикосеть** (piconet) — базовая структура: один **master** и до **семи активных slave**. Master задаёт тактовый сигнал и последовательность скачков частоты; до 255 дополнительных slave могут быть в режиме «parked» — выключены, но синхронизированы.\n- **Scatternet** (рассеянная сеть) — устройство может одновременно участвовать в нескольких пикосетях (в одной как master, в другой как slave), образуя многошаговую сеть.\n- В **BLE** (4.x+) роли называются **Central** (=master) и **Peripheral** (=slave); связь чаще одна Peripheral → одна Central. **Mesh-надстройка** (Bluetooth Mesh, 2017) поверх BLE даёт топологию «многие-ко-многим» для умного дома.", "<h3>Стек протоколов</h3>", "| Уровень | Назначение |\n|---|---|\n| Application / Profiles | прикладные сценарии: A2DP (аудио), HFP (гарнитуры), HID (мышь/клавиатура), OPP (файлы), GATT (BLE-сервисы) |\n| Service Discovery (SDP / GATT) | обнаружение служб у соседних устройств |\n| RFCOMM | эмуляция последовательного порта (TS 07.10) |\n| L2CAP (Logical Link Control and Adaptation Protocol) | мультиплексирование, сегментация/сборка, QoS |\n| HCI (Host Controller Interface) | граница между «хостом» (ОС) и контроллером (чипом) |\n| LMP (Link Manager Protocol) | управление соединениями, аутентификация, шифрование, питание |\n| Baseband | синхронизация, формирование кадров, FH-расписание, ARQ |\n| Radio | передача и приём радиосигнала на 2,4 ГГц |", "В BLE стек упрощён: PHY → LL (Link Layer) → HCI → L2CAP → ATT/SMP → GATT/GAP → приложение.", "<h3>Уровень радиосвязи (Radio)</h3>", "- Диапазон 2,400–2,4835 ГГц.\n- Классический BR/EDR использует **FHSS** — частота меняется **1600 раз в секунду** псевдослучайно по 79 каналам шириной 1 МГц. Это снижает интерференцию с Wi-Fi и микроволновками, обеспечивает физический уровень разнесения и устойчивость к узкополосным помехам.\n- BLE использует **40 каналов** по 2 МГц (3 рекламных + 37 для соединений) и менее частые скачки.\n- Модуляция:\n  - **BR** (Basic Rate, 1 Мбит/с): GFSK (Gaussian Frequency Shift Keying).\n  - **EDR** (Enhanced Data Rate, 2 и 3 Мбит/с): π/4-DQPSK и 8-DPSK поверх GFSK-преамбулы.\n  - BLE: GFSK с модуляционным индексом 0,5 (LE 1M), LE 2M, LE Coded (S=8 — повышенная дальность с FEC).\n- Классы мощности: **Class 1** (100 мВт, ~100 м), **Class 2** (2,5 мВт, ~10 м — массовый вариант для смартфонов и гарнитур), **Class 3** (1 мВт, ~1 м). BLE — обычно 1–10 мВт.", "<h3>Уровень немодулированной передачи (Baseband)</h3>", "- Время разбивается на **слоты по 625 мкс**. Master передаёт в чётных слотах, slave — в нечётных; так реализуется TDD.\n- Пакет может занимать 1, 3 или 5 слотов (multi-slot packet).\n- Два типа логических соединений:\n  - **SCO** (Synchronous Connection-Oriented) — синхронный, симметричный, фиксированно резервированные слоты; используется для голоса (64 кбит/с). Нет повторов — потерянные кадры теряются (для речи это допустимо).\n  - **ACL** (Asynchronous Connectionless) — асинхронная передача данных с ARQ и FEC; master опрашивает slave-ов по очереди.\n- В BLE — **Connection Events** периодичностью 7,5–4000 мс с инкапсуляцией коротких пакетов.", "<h3>Структура кадра (BR/EDR)</h3>", "| Поле | Длина | Назначение |\n|---|---|---|\n| Access Code | 72 бит | идентификатор пикосети (из адреса master) |\n| Header | 54 бит (с защитой FEC 1/3) | AM_ADDR (3 бит, номер slave 1–7), TYPE (4 бит, тип пакета), FLOW, ARQN, SEQN (по 1 бит), HEC (8 бит) |\n| Payload | 0–2745 бит | данные, опционально с CRC-16 и FEC |", "Защита заголовка тройным повторением (FEC 1/3) делает его чрезвычайно надёжным даже на крайних дистанциях.", "<h3>Bluetooth Low Energy: ключевые отличия</h3>", "- Архитектура GATT — сервисы и характеристики, каждый со своим UUID.\n- Минимальная средняя мощность за счёт коротких рекламных пакетов и длительного сна.\n- BLE 5.0 — увеличенная дальность (Coded PHY), 2× скорость, рекламные «extended advertising».\n- BLE Mesh — Pub/Sub-модель сообщений поверх рекламных каналов."], "terms": [{"ru": "Bluetooth", "en": "IEEE 802.15.1, Bluetooth SIG", "df": "стандарт WPAN, 2,4 ГГц ISM"}, {"ru": "WPAN", "en": "Wireless Personal Area Network", "df": "беспроводная персональная сеть"}, {"ru": "ISM", "en": "Industrial, Scientific, Medical", "df": "нелицензируемый частотный диапазон"}, {"ru": "Пикосеть", "en": "piconet", "df": "базовая топология Bluetooth: 1 master + до 7 slave"}, {"ru": "Рассеянная сеть", "en": "scatternet", "df": "объединение нескольких пикосетей"}, {"ru": "FHSS", "en": "Frequency Hopping Spread Spectrum", "df": "скачкообразная перестройка частоты, 1600 hops/s"}, {"ru": "SCO", "en": "Synchronous Connection-Oriented", "df": "синхронное соединение для голоса"}, {"ru": "ACL", "en": "Asynchronous Connectionless", "df": "асинхронное соединение для данных"}, {"ru": "L2CAP", "en": "Logical Link Control and Adaptation Protocol", "df": "адаптация данных верхних уровней"}, {"ru": "LMP", "en": "Link Manager Protocol", "df": "протокол управления соединениями"}, {"ru": "HCI", "en": "Host Controller Interface", "df": "стандартный API между хостом и чипом"}, {"ru": "HEC", "en": "Header Error Check", "df": "контрольная сумма заголовка кадра"}, {"ru": "GFSK", "en": "Gaussian Frequency Shift Keying", "df": "частотная модуляция с гауссовой фильтрацией"}], "summary": ["**Bluetooth** (IEEE 802.15.1 / Bluetooth SIG) — **WPAN** на коротких дистанциях, **2,4 ГГц ISM** (2,400–2,485)", "С 1998 (Ericsson) — замена кабелю RS-232; гарнитуры, мыши, обмен файлами", "Две ветки: **BR/EDR** (аудио, гарнитуры, классика) и **BLE** (IoT, носимая электроника, маяки)", "**Пикосеть** (piconet): 1 master + до 7 активных slave (адрес AM_ADDR 3 бит) + до 255 parked", "**Scatternet** — устройство в нескольких пикосетях; **BLE Mesh** (2017) — многие-ко-многим", "В BLE: **Central** (=master) + **Peripheral** (=slave)", "**Стек**: Radio → Baseband → LMP → HCI → L2CAP → RFCOMM/SDP/OBEX → профили (A2DP, HFP, HID, OPP)", "BLE-стек: PHY → LL → HCI → L2CAP → ATT/SMP → **GATT/GAP** → приложение", "**Radio**: 2,400–2,4835 ГГц", "**BR/EDR — FHSS**: 79 каналов по 1 МГц, **1600 hops/s** — устойчиво к Wi-Fi/микроволновкам", "BLE: 40 каналов по 2 МГц (3 рекламных + 37 для соединений)", "Модуляция: **BR** 1 Мбит/с **GFSK**; **EDR** 2/3 Мбит/с — π/4-DQPSK и 8-DPSK; BLE — GFSK (LE 1M/2M/Coded)", "Классы мощности: **Class 1** (100 мВт, 100 м), **Class 2** (2,5 мВт, 10 м — основной), Class 3 (1 мВт, 1 м); BLE 1–10 мВт", "**Baseband**: слоты **625 мкс**, master в чётных / slave в нечётных (TDD); пакеты 1/3/5 слотов", "**SCO** (Synchronous Connection-Oriented) — голос 64 кбит/с, фикс. слоты, без повторов", "**ACL** (Asynchronous Connectionless) — данные с **ARQ + FEC**", "**Кадр BR/EDR**: Access Code 72 бит + **Header 54 бит** (FEC 1/3) + Payload 0–2745 бит", "Header содержит AM_ADDR 3 бит, TYPE 4 бит, FLOW/ARQN/SEQN по 1 бит, **HEC** 8 бит", "BLE: GATT-сервисы с UUID; BLE 5.0 — Coded PHY (дальность), 2× скорость, extended advertising"]}, {"n": 28, "title": "RFID. Архитектура и физический уровень EPC Gen 2. Уровень идентификации метки EPC Gen 2. Форматы сообщения идентификации метки.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**RFID** (Radio Frequency Identification, радиочастотная идентификация) — технология бесконтактной автоматической идентификации объектов с помощью радиосигнала. Система всегда содержит две стороны: **считыватель** (reader, interrogator) с антенной и **метку** (tag, transponder), несущую электронный идентификатор. RFID — старейшая массовая технология IoT: она используется в логистике, торговле, билетных системах, иммобилайзерах автомобилей, противоугонных метках, NFC-платежах, ветеринарных чипах. Самый распространённый стандарт UHF RFID — **EPC Gen 2** (Electronic Product Code Generation 2), он же ISO/IEC 18000-63.", "<h3>Классификация меток</h3>", "- **Пассивные** (passive) — нет собственного источника питания; чип получает энергию из радиочастотного поля считывателя через индукционную/выпрямительную схему. Дальность до 10 м (UHF), стоимость от 5 центов, объём памяти десятки–сотни бит. Массово применяются на товарах, билетах, пропусках.\n- **Полупассивные / Battery-Assisted Passive (BAP)** — батарея питает только чип, ответ идёт через модулированное отражение (backscatter). Лучшая чувствительность, дальность до 30 м.\n- **Активные** (active) — собственный передатчик и батарея; дальность сотни метров, могут инициировать связь. Используются для отслеживания грузовых контейнеров, дорожных платежей, RTLS.", "Классификация по частоте:\n- **LF** (125/134,2 кГц) — иммобилайзеры, доступ, ветеринарные чипы. Малая дальность, проникает через тело.\n- **HF** (13,56 МГц) — пропуски, ISO 14443 / NFC, библиотечные книги.\n- **UHF** (860–960 МГц) — логистика, торговля, основная область EPC Gen 2.\n- **SHF / Microwave** (2,45 ГГц) — дорожные платежи.", "<h3>Физический уровень EPC Gen 2</h3>", "- **Прямой канал** (Reader → Tag): амплитудная манипуляция **DSB-ASK / SSB-ASK / PR-ASK** с кодированием **PIE** (Pulse Interval Encoding), где «1» и «0» различаются длиной импульса между понижениями амплитуды. Несущая всегда присутствует (тоже даёт энергию метке).\n- **Обратный канал** (Tag → Reader): метка не генерирует собственный сигнал — она **переключает импеданс антенны** между «согласованным» и «рассогласованным», что меняет коэффициент отражения. Эта **backscatter-модуляция** очень энергоэффективна. Кодирование — **FM0** (биполярный двухфазный код) или **код Миллера** с подобставленным субнесущим М=2/4/8 для борьбы с помехами.\n- Скорости: ~26–128 кбит/с прямой канал, ~5–640 кбит/с обратный.", "<h3>Уровень идентификации меток (анти-коллизионный протокол)</h3>", "Один считыватель может одновременно «слышать» сотни меток в поле. Чтобы извлечь EPC из каждой без столкновений, EPC Gen 2 использует **Q-протокол** на основе слотированной ALOHA с динамическим окном:", "1. **Query(Q)** — считыватель объявляет раунд: 2^Q слотов.\n2. Каждая метка выбирает случайный слот в [0, 2^Q − 1]; в слоте 0 — отвечает, иначе — декрементирует счётчик при каждой команде QueryRep.\n3. Метка в активном слоте отвечает **RN16** — случайным 16-битным числом.\n4. Считыватель распознаёт RN16 и шлёт **ACK(RN16)**.\n5. Метка ответом передаёт **PC** (Protocol Control, 16 бит) + **EPC** (обычно 96 бит) + **CRC-16**.\n6. При коллизии или отсутствии ответа считыватель адаптирует Q (увеличивает при коллизиях, уменьшает при пустых слотах).", "Дополнительные операции: **Select** (фильтр по маске EPC), **Read/Write/Lock/Kill** для доступа к памяти; **Access Password** и **Kill Password** — простая защита.", "<h3>Форматы EPC (схемы идентификации)</h3>", "96-битный EPC структурируется по разным схемам в зависимости от назначения:", "- **SGTIN-96** (Serialized Global Trade Item Number) — отдельная единица товара: company prefix + item reference + serial number; уникальное продолжение штрихкода EAN/UPC.\n- **SSCC-96** (Serial Shipping Container Code) — паллеты, отгрузочные упаковки.\n- **SGLN-96** (Serialized Global Location Number) — конкретные местоположения: магазин, склад, полка.\n- **GRAI-96** (Global Returnable Asset Identifier) — возвратная тара, поддоны.\n- **GIAI-96** (Global Individual Asset Identifier) — внутренние активы организации.\n- **DoD-96** — формат министерства обороны США.", "Существуют и более длинные форматы (EPC-198 и т. д.) для большей серийной ёмкости.", "<h3>Применение и экосистема EPCglobal</h3>", "Стандарт EPC Gen 2 поддерживается отраслевой ассоциацией **GS1** (через **EPCglobal**). На его основе построены:\n- Розничная инвентаризация (Walmart, Zara).\n- Управление цепочками поставок и автоматизация складов.\n- Маркировка лекарств и алкоголя (трэйсабилити).\n- Электронные пропуска и билеты на транспорт.", "В России похожие применения регулируются системой маркировки **«Честный знак»** (Datamatrix-коды + RFID для отдельных категорий)."], "terms": [{"ru": "RFID", "en": "Radio Frequency Identification", "df": "радиочастотная идентификация"}, {"ru": "EPC Gen 2", "en": "ISO 18000-63", "df": "стандарт UHF RFID"}, {"ru": "EPC", "en": "Electronic Product Code", "df": "электронный код продукта, уникальный 96-битный идентификатор"}, {"ru": "NFC", "en": "Near Field Communication, ISO 14443", "df": "расширение HF RFID для смартфонов"}, {"ru": "ASK / PR-ASK", "en": "Amplitude Shift Keying", "df": "амплитудная манипуляция, прямой канал"}, {"ru": "PIE", "en": "Pulse Interval Encoding", "df": "кодирование интервалами импульсов"}, {"ru": "PC", "en": "Protocol Control", "df": "служебное поле в ответе метки"}], "summary": ["**RFID** (Radio Frequency Identification) — старейшая массовая технология IoT", "Система: **считыватель** (reader/interrogator) + **метка** (tag/transponder)", "**Пассивные** метки: нет батареи, питание из поля считывателя, до 10 м (UHF), от 5 центов", "**Полупассивные (BAP)**: батарея питает чип, ответ через backscatter; дальность до 30 м", "**Активные**: свой передатчик и батарея, сотни м (контейнеры, RTLS)", "Частоты: LF 125/134 кГц (иммобилайзеры, чипы животных); HF 13,56 МГц (**NFC**, ISO 14443, пропуски)", "**UHF 860–960 МГц** — EPC Gen 2 (логистика, торговля); SHF 2,45 ГГц (дорожные платежи)", "**EPC Gen 2** = ISO/IEC 18000-63; основной стандарт UHF RFID; поддерживается **GS1/EPCglobal**", "**Прямой канал (Reader → Tag)**: **DSB/SSB/PR-ASK** с **PIE** (Pulse Interval Encoding); несущая всегда есть (питает метку)", "**Обратный канал (Tag → Reader)**: **backscatter** — переключение импеданса антенны меняет коэффициент отражения", "Кодирование обратного канала: **FM0** или **код Миллера** (M=2/4/8 subcarrier)", "Скорости: ~26–128 кбит/с прямой, ~5–640 кбит/с обратный", "**Q-протокол** (анти-коллизионный) — слотированная ALOHA с динамическим окном", "**Query(Q)** → 2^Q слотов; метка выбирает слот ∈ [0, 2^Q−1]; в активном слоте шлёт **RN16**", "**ACK(RN16)** → метка передаёт **PC** (16 бит) + **EPC** (96 бит) + **CRC-16**", "Q адаптируется: больше при коллизиях, меньше при пустых слотах", "Команды: **Select** (фильтр), Read/Write/**Lock/Kill**; **Access Password / Kill Password**", "**Форматы EPC-96**: **SGTIN-96** (товар, продолжение EAN/UPC); **SSCC-96** (паллеты); SGLN-96 (место); GRAI-96 (возвратная тара); GIAI-96 (активы); DoD-96", "Применения: Walmart/Zara инвентарь, цепочки поставок, лекарства; в РФ — **«Честный знак»**"]}, {"n": 29, "title": "Коммутация на канальном уровне. Применение мостов. Повторители, концентраторы, мосты, коммутаторы, маршрутизаторы, шлюзы и виртуальные локальные сети.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Коммутация на канальном уровне** (Layer-2 switching, bridging) — пересылка кадров Ethernet/802.11 между сегментами одной локальной сети на основе **MAC-адресов**, без анализа верхних протоколов. В отличие от маршрутизации (L3, по IP), L2-коммутатор работает прозрачно для пользователей: устройства одного broadcast-домена не знают о его существовании, видят друг друга по тем же MAC-адресам и взаимно достижимы по ARP. Эта функция исторически развилась из устройств-**мостов** (bridges) 1980-х в современные **коммутаторы** (switches) — основу любой проводной LAN.", "<h3>Мосты, обратное обучение и STP</h3>", "**Мост** (bridge, IEEE 802.1D) принимает кадр на одном порту, проверяет его CRC, ищет MAC-адрес назначения в **таблице мостов** (CAM-table, MAC address table) и пересылает кадр в соответствующий порт. Если адрес неизвестен — кадр копируется на все порты, кроме входного (**flooding**). Если адрес broadcast/multicast — тоже flooding.", "**Алгоритм обратного обучения** (backward learning):\n- Кадр пришёл на порт k с MAC-адресом отправителя X → мост записывает «X ↔ порт k» в таблицу с таймером старения (обычно 300 с).\n- При устаревании запись удаляется.\n- Таблица строится автоматически и не требует ручной конфигурации.", "**Петли и STP**. Если у двух мостов есть два альтернативных пути, кадры начнут циркулировать вечно, ARP-«широковещание» рассылается лавинообразно, сеть «ложится». Решение — **Spanning Tree Protocol** (STP, IEEE 802.1D, Radia Perlman 1985):\n- Мосты обмениваются **BPDU** (Bridge Protocol Data Unit).\n- Выбирается **Root Bridge** — мост с наименьшим Bridge ID.\n- Каждый мост вычисляет кратчайший путь к Root и ставит соответствующий **Root Port**; на каждом сегменте выбирается **Designated Port**.\n- Остальные порты переводятся в **Blocking** — они блокируют пересылку, но слушают BPDU. Сеть превращается в покрывающее дерево.\n- Сходимость классического STP — 30–50 с; улучшенные **RSTP** (802.1w) сходятся за <1 с, **MSTP** (802.1s) поддерживает отдельное дерево для каждой группы VLAN.", "<h3>Сетевые устройства по уровням OSI</h3>", "| Устройство | OSI | Решение принимается по | Разделяет домены |\n|---|---|---|---|\n| Повторитель (repeater) | L1 | — (просто усиливает сигнал) | нет |\n| Концентратор (hub) | L1 | — (многопортовый повторитель) | один collision и broadcast домен |\n| Мост (bridge) / Коммутатор (switch) | L2 | MAC-адресу | разделяет collision; общий broadcast |\n| Маршрутизатор (router) | L3 | IP-адресу | разделяет broadcast |\n| L3-коммутатор | L3 | IP-адресу (аппаратно) | то же |\n| Шлюз (gateway) | L4–L7 | приложение/протокол | преобразует протоколы |", "- **Повторитель** (regenerator) — восстанавливает форму и амплитуду сигнала; продлевает дистанцию проводной линии (например, для длинного коаксиала). В современных сетях встроен в каждый коммутатор/трансивер.\n- **Концентратор** (hub) — устаревшее, многопортовый повторитель; все порты в одном collision-домене, обязательная полудуплексная работа с CSMA/CD.\n- **Коммутатор** (switch) — современный мост на десятки/сотни портов с аппаратной коммутацией (ASIC); каждый порт = отдельный collision-домен и full-duplex.\n- **Маршрутизатор** разделяет broadcast-домены: ARP, DHCP, NetBIOS не проходят между сетями без специальных relay-функций.\n- **Шлюз** (gateway) — общий термин для устройств, преобразующих протоколы или адреса (SIP-шлюз, NAT-шлюз, email-шлюз X.400↔SMTP).", "<h3>VLAN — виртуальные ЛВС</h3>", "**VLAN** (Virtual LAN, IEEE 802.1Q) — механизм логического разделения одного физического коммутатора (или серии связанных) на несколько изолированных сетей, каждая со своим **broadcast-доменом**. Устройства в разных VLAN не видят широковещательного трафика друг друга, и их соединение возможно только через маршрутизатор (или L3-коммутатор).", "**Тег 802.1Q** (4 байта, вставляется между Source MAC и EtherType):", "| Поле | Длина | Назначение |\n|---|---|---|\n| TPID (Tag Protocol Identifier) | 16 бит | всегда 0x8100, признак тегированного кадра |\n| PCP (Priority Code Point) | 3 бит | 8 уровней приоритета (CoS, 802.1p) |\n| DEI (Drop Eligible Indicator) | 1 бит | можно ли отбросить при перегрузке |\n| VID (VLAN ID) | 12 бит | номер VLAN, 0–4095 (0 и 4095 зарезервированы, 4094 используемых) |", "Типы портов:\n- **Access** — порт принадлежит одной VLAN; принимает и отдаёт нетегированные кадры, тег ставится/снимается коммутатором.\n- **Trunk** — порт между коммутаторами, переносит кадры нескольких VLAN, сохраняя теги.\n- **Native VLAN** — особая VLAN, кадры которой передаются по транку без тега.", "Дополнительные технологии:\n- **Q-in-Q (802.1ad)** — двойное тегирование для операторских сетей (VLAN провайдера поверх клиентского).\n- **VXLAN** (RFC 7348) — преодолевает ограничение 4094 VLAN через 24-битный VNI и инкапсуляцию L2-в-UDP; основа дата-центровых сетей и облаков.\n- **GVRP / MVRP** — протоколы динамического обмена информацией о VLAN.", "<h3>Алгоритм работы коммутатора (cut-through vs store-and-forward)</h3>", "- **Store-and-forward** — принять кадр целиком, проверить CRC, переслать. Гарантирует целостность, добавляет задержку.\n- **Cut-through** — начать пересылку сразу после прочтения адреса назначения; быстрее, но повреждённые кадры тоже пересылаются. Используется в дата-центрах с надёжной средой.\n- **Fragment-free** — гибрид: ждать первых 64 байт (чтобы исключить runt-кадры от коллизий), потом пересылать."], "terms": [{"ru": "Мост", "en": "bridge", "df": "устройство L2, соединяющее сегменты ЛВС по M
