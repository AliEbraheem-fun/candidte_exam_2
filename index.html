 оборачивается в **UDP/4500**; IKE детектирует NAT в IKE_SA_INIT и переходит на 4500", "**DPD** (Dead Peer Detection) — обнаружение мёртвого партнёра; **Group IPSec** (RFC 6407 GDOI) для multicast", "**Применения**: site-to-site, remote (Windows AlwaysOn, strongSwan), защита OSPF/BGP/RIPng, Mobile IPv6, SDN-контроллеры, **сотовые S1/N3** (gNB/eNB ↔ core)", "**vs альтернативы**: IPSec L3/прозрачен/сложен/гибкие алгоритмы; TLS/OpenVPN L4-7/нет/средне; **WireGuard** L3 UDP/прозрачен/просто/фиксированные алгоритмы/очень малый код"]}, {"n": 67, "title": "SSL / TLS.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**TLS** (Transport Layer Security, RFC 8446 для TLS 1.3) — самый распространённый в Интернете криптографический протокол: на нём держатся HTTPS, защищённая почта (SMTPS/IMAPS/POP3S), WebSocket Secure, gRPC, многие VPN. Работает поверх TCP (или UDP в варианте **DTLS**, и поверх UDP в QUIC где TLS-handshake интегрирован). TLS — преемник **SSL** (Netscape, 1995); SSL 2.0/3.0 и TLS 1.0/1.1 полностью **скомпрометированы** и запрещены к использованию (RFC 8996). Современные системы используют **TLS 1.2** и **TLS 1.3**.", "<h3>Что обеспечивает TLS</h3>", "- **Аутентификация сервера** через сертификаты X.509 (Q64) — клиент проверяет, что общается с заявленным доменом.\n- **Опциональная аутентификация клиента** (mTLS).\n- **Согласование шифров** — выбор криптоалгоритмов из совпадающего набора.\n- **Обмен ключами** — установление общего сессионного секрета.\n- **Конфиденциальность** и **целостность** данных приложения через AEAD.\n- **Защита от replay-атак** (sequence numbers, anti-replay в 0-RTT).\n- **Perfect Forward Secrecy** (PFS) — компрометация долгосрочного ключа сервера не раскрывает прошлые сессии.", "<h3>Архитектура: подпротоколы</h3>", "TLS логически делится на:\n- **Handshake Protocol** — устанавливает соединение, аутентифицирует, согласует ключи и шифры.\n- **Record Protocol** — обёртывает прикладные данные в зашифрованные TLS-записи (фрагментация, MAC/AEAD, шифрование).\n- **Alert Protocol** — уведомления об ошибках и предупреждениях.\n- **Change Cipher Spec** (только TLS 1.2-) — сигнал перехода на согласованный шифр.\n- **Application Data** — слой собственно данных приложения.", "<h3>TLS 1.2: handshake (исторический)</h3>", "Полное рукопожатие — **2-RTT**:\n1. **Client → Server**: `ClientHello` — версия, случайное число, поддерживаемые cipher suites, расширения (SNI, ALPN, supported curves).\n2. **Server → Client**: `ServerHello` + `Certificate` + `ServerKeyExchange` (для ECDHE/DHE) + `ServerHelloDone`.\n3. **Client → Server**: `ClientKeyExchange` + `ChangeCipherSpec` + `Finished`.\n4. **Server → Client**: `ChangeCipherSpec` + `Finished`.", "Cipher suite в TLS 1.2 — длинная строка вида `TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384`: обмен ключами + аутентификация + шифрование + хеш.", "<h3>TLS 1.3: handshake (современный)</h3>", "Радикально упрощён, всего **1-RTT**:\n1. **ClientHello**: версия, random, key shares (готовые DH-публичные точки для популярных групп), supported algorithms, signature algorithms, расширения.\n2. **ServerHello + EncryptedExtensions + Certificate + CertificateVerify + Finished**: всё после ServerHello уже зашифровано.\n3. **Client Finished**: клиент завершает.", "После этого можно отправлять Application Data.", "**0-RTT mode**: при возобновлении сессии (PSK, RFC 8446 §2.3) клиент может прислать данные прямо в первом сообщении, экономя круг RTT. Минус — данные **уязвимы к replay-атакам**, поэтому используется только для идемпотентных запросов (GET).", "Cipher suite в TLS 1.3 — только **AEAD-шифр + hash**: `TLS_AES_256_GCM_SHA384`, `TLS_CHACHA20_POLY1305_SHA256`, `TLS_AES_128_GCM_SHA256`, `TLS_AES_128_CCM_SHA256`. Алгоритм обмена ключами и подписи указываются отдельно через расширения и **обязательно ECDHE / DHE** — обеспечивает PFS.", "В TLS 1.3 удалены устаревшие или небезопасные элементы: RSA key exchange (без PFS), статический DH, MD5, SHA-1, CBC mode, MAC-then-encrypt, ChangeCipherSpec, renegotiation, compression (BREACH/CRIME).", "<h3>Алгоритмы и группы</h3>", "Современные стандарты (RFC 8446, NIST SP 800-52r2):\n- **Cipher**: AES-128-GCM, AES-256-GCM, ChaCha20-Poly1305.\n- **Подпись**: RSA-PSS (RSA-PKCS#1 v1.5 устаревает), ECDSA P-256/P-384, EdDSA (Ed25519).\n- **Key exchange**: X25519, X448, secp256r1, secp384r1, MODP DH 2048+, гибридные ML-KEM + X25519 (постквантовый).\n- **Hash**: SHA-256, SHA-384.", "<h3>Perfect Forward Secrecy</h3>", "**PFS** — гарантия, что компрометация долгосрочного ключа сервера в будущем не позволяет расшифровать **прошлые** записанные сессии. Достигается **эфемерным** Diffie-Hellman: ECDHE/DHE с однократно генерируемыми приватными ключами, которые уничтожаются сразу после сессии. В TLS 1.3 это **единственный** способ обмена ключами (статический RSA удалён).", "<h3>Расширения и важные функции</h3>", "- **SNI** (Server Name Indication, RFC 6066) — клиент сообщает желаемое имя хоста в ClientHello (открыто); сервер выбирает соответствующий сертификат. Позволяет хостинг множества HTTPS-сайтов на одном IP. **ECH** (Encrypted Client Hello, draft) шифрует SNI.\n- **ALPN** (Application-Layer Protocol Negotiation, RFC 7301) — выбор протокола приложения (h2, h3, http/1.1) внутри TLS.\n- **Session resumption**: Session IDs (TLS 1.2), Session Tickets (RFC 5077), Pre-Shared Keys (TLS 1.3).\n- **OCSP Stapling** — встраивание OCSP-ответа (Q64).\n- **HSTS / HPKP** — на прикладном уровне.", "<h3>Известные атаки и причины устаревания</h3>", "- **POODLE** (SSL 3.0, CBC padding oracle).\n- **BEAST** (TLS 1.0, CBC chained IV).\n- **CRIME / BREACH** (компрессия).\n- **Heartbleed** (CVE-2014-0160) — баг OpenSSL, чтение чужой памяти.\n- **Logjam** (короткий DH).\n- **FREAK** (downgrade на 40-битный RSA).\n- **Lucky 13**, **DROWN**, **ROBOT**.\nВсе эти атаки устранены в TLS 1.3 архитектурно или через обязательные ограничения.", "<h3>DTLS и QUIC</h3>", "- **DTLS** (Datagram TLS, RFC 9147 для 1.3) — TLS поверх UDP с явной нумерацией и повторами; применяется в VoIP (SRTP), WebRTC data channels, embedded.\n- **QUIC** (Q45) — встраивает TLS 1.3 как часть своей основы, что устраняет необходимость отдельного «TLS over QUIC».", "<h3>Применение TLS</h3>", "- **HTTPS** (HTTP over TLS) — порт 443.\n- **SMTPS / Submissions / IMAPS / POP3S / FTPS** — почтовые порты с TLS.\n- **DoT / DoH** — DNS over TLS / HTTPS.\n- **SSL VPN** — OpenVPN, AnyConnect, GlobalProtect.\n- **WebSocket Secure** (wss://).\n- **MQTT over TLS**, **gRPC**, **AMQP**, **Kafka SSL**.\n- **mTLS** в zero-trust архитектурах и service mesh (Istio, Linkerd)."], "terms": [{"ru": "AEAD", "en": "Authenticated Encryption with Associated Data", "df": "AES-GCM, ChaCha20-Poly1305, CCM"}, {"ru": "PFS", "en": "Perfect Forward Secrecy", "df": "совершенная прямая секретность"}], "summary": ["**TLS** (Transport Layer Security, **RFC 8446** для **TLS 1.3**) — основа HTTPS, защ. почты (SMTPS/IMAPS/POP3S), WS Secure, gRPC, многих VPN", "Работает поверх **TCP** (или UDP — **DTLS**, или интегрирован в **QUIC**)", "Преемник SSL (Netscape 1995); **SSL 2.0/3.0 и TLS 1.0/1.1 запрещены** (RFC 8996); современные — **TLS 1.2 и 1.3**", "**Что обеспечивает**: аутентификация сервера через X.509, опц. mTLS; согласование шифров; обмен ключами; конфиденциальность+целостность через **AEAD**; anti-replay; **PFS** (Perfect Forward Secrecy)", "**Архитектура — подпротоколы**: **Handshake** (установка); **Record** (обёртка данных с MAC/AEAD); **Alert** (ошибки); ChangeCipherSpec (только TLS 1.2-); Application Data", "**TLS 1.2 handshake — 2-RTT**: 1) ClientHello (версия, random, cipher suites, **SNI**/**ALPN**)", "2) ServerHello + Certificate + ServerKeyExchange (для ECDHE/DHE) + ServerHelloDone", "3) ClientKeyExchange + ChangeCipherSpec + Finished; 4) ChangeCipherSpec + Finished", "Cipher suite TLS 1.2: `TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384` (kex + auth + cipher + hash)", "**TLS 1.3 — 1-RTT**: 1) ClientHello (key shares заранее, supported groups, signature algorithms)", "2) ServerHello + EncryptedExtensions + Certificate + CertificateVerify + Finished (всё после ServerHello уже зашифровано); 3) Client Finished", "**0-RTT mode** при возобновлении (PSK): данные в первом сообщении; **уязвимы к replay-атакам** → только для **идемпотентных** GET", "Cipher TLS 1.3 — только **AEAD + hash**: `TLS_AES_256_GCM_SHA384`, `TLS_CHACHA20_POLY1305_SHA256`, `TLS_AES_128_GCM_SHA256`; **только ECDHE/DHE** → обязательный PFS", "Удалены в 1.3: RSA key exchange (без PFS), статический DH, MD5, SHA-1, **CBC**, MAC-then-encrypt, ChangeCipherSpec, renegotiation, compression (BREACH/CRIME)", "**Алгоритмы** (RFC 8446, NIST SP 800-52r2): AES-128/256-GCM, ChaCha20-Poly1305; подпись — **RSA-PSS, ECDSA P-256/384, Ed25519**", "Key exchange: **X25519, X448, secp256r1/384r1, MODP DH 2048+, гибрид ML-KEM + X25519** (PQC); hash — SHA-256/384", "**PFS** через эфемерный DH (ECDHE/DHE): однократные приватные ключи, удаляются после сессии; компрометация долгосрочного ключа не раскрывает прошлое", "**Расширения**: **SNI** (Server Name Indication, RFC 6066, имя хоста в открытом виде; **ECH** шифрует SNI); **ALPN** (RFC 7301, выбор h2/h3/http/1.1)", "**Session resumption**: Session IDs (1.2), **Session Tickets** (RFC 5077), **PSK** (1.3); **OCSP Stapling**; HSTS на L7", "**Атаки на устаревшие**: POODLE (SSL 3.0 CBC), BEAST (TLS 1.0 CBC), CRIME/BREACH (компрессия), **Heartbleed** (CVE-2014-0160), Logjam, FREAK, Lucky 13, DROWN, ROBOT — устранены в 1.3", "**DTLS** (RFC 9147 для 1.3) — TLS поверх UDP (VoIP/SRTP, WebRTC data channels, embedded); **QUIC** встраивает TLS 1.3 как основу", "Применение: HTTPS:443, SMTPS/IMAPS/POP3S/FTPS, **DoT/DoH**, OpenVPN/AnyConnect/GlobalProtect, WebSocket Secure, MQTT/gRPC/AMQP/Kafka, **mTLS** в Zero Trust и service mesh (Istio, Linkerd)"]}, {"n": 68, "title": "Протокол Диффи-Хеллмана.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Протокол Диффи-Хеллмана** (Diffie-Hellman, DH) — опубликованный Уитфилдом Диффи и Мартином Хеллманом в 1976 г. (статья «New Directions in Cryptography») алгоритм, впервые позволивший двум сторонам **получить общий секретный ключ через открытый канал**, не имея предварительно общих секретов. Это открытие положило начало **public-key криптографии** и до сих пор лежит в основе ключевых обменов в TLS, IPSec, SSH, Signal, WhatsApp, OpenVPN, WireGuard и многих других системах. За эту работу Диффи и Хеллман получили премию Тьюринга в 2015 г.", "<h3>Алгоритм классического DH</h3>", "**Публичные параметры** (известны всем, открыто согласовываются или фиксированы стандартом):\n- Большое простое число **p** (обычно ≥ 2048 бит).\n- **Примитивный корень** (generator) **g** по модулю p — порождающий элемент мультипликативной группы ℤp*.", "**Шаги протокола** (Алиса и Боб):\n1. **Алиса** выбирает случайное приватное число `a ∈ [1, p−2]`, вычисляет публичное `A = g^a mod p`, отправляет A Бобу.\n2. **Боб** выбирает случайное `b`, вычисляет `B = g^b mod p`, отправляет Алисе.\n3. **Алиса** вычисляет общий секрет: `K = B^a mod p = g^(ab) mod p`.\n4. **Боб** вычисляет: `K = A^b mod p = g^(ab) mod p`.\n5. **K = g^(ab) mod p** — одинаков у обеих сторон.", "Атакующий, наблюдающий за каналом, знает `g, p, A = g^a, B = g^b`, но **не может вычислить g^(ab)** без знания `a` или `b`. Это эквивалентно **задаче вычислительного Диффи-Хеллмана** (Computational Diffie-Hellman Problem, CDH), которая в свою очередь сводится к **задаче дискретного логарифмирования** (Discrete Logarithm Problem, DLP): по A найти a такое, что g^a = A mod p.", "<h3>Математическая стойкость</h3>", "DLP в ℤp* считается вычислительно трудной для достаточно больших p:\n- Лучший известный субэкспоненциальный алгоритм — **GNFS** (General Number Field Sieve), сложность примерно `L_p[1/3, (64/9)^(1/3)]`.\n- 2048-бит DH ≈ 112 бит симметричной стойкости (NIST).\n- 3072-бит DH ≈ 128 бит.\n- 7680-бит DH ≈ 192 бит.\n- 15360-бит DH ≈ 256 бит.", "Стандартные «именованные» группы — **MODP-2048**, **MODP-3072**, **MODP-4096**, **MODP-8192** (RFC 3526), **ffdhe2048/3072/4096/6144/8192** (RFC 7919). Использование коротких пользовательских групп без проверки уязвимо к **атаке Logjam**.", "<h3>Уязвимость классического DH: MITM</h3>", "Базовый DH **не аутентифицирует стороны**. Атакующий **Mallory** может перехватить и подменить ключи:\n1. Алиса → A, перехватывает Mallory → шлёт Бобу M_A = g^m.\n2. Боб → B, Mallory перехватывает → шлёт Алисе M_B = g^m'.\n3. Алиса делит ключ с Mallory (думая, что с Бобом). Боб — тоже с Mallory. Mallory читает и пересылает трафик в обе стороны.", "**Решения**:\n- Подпись эфемерных ключей долгосрочным закрытым ключом сервера, который проверен через X.509 (так делает TLS).\n- **STS** (Station-to-Station, Diffie-van Oorschot-Wiener 1992) — аутентифицированный DH.\n- **MQV / HMQV** — улучшенные протоколы.\n- **SIGMA** — основа IKEv2.", "<h3>Эллиптические кривые: ECDH</h3>", "**ECDH** (Elliptic Curve Diffie-Hellman) — то же самое, но в группе точек эллиптической кривой над конечным полем; роль умножения играет **скалярное умножение точки** P. Преимущества:\n- Гораздо **меньший размер ключа** при той же стойкости: **256 бит ECDH ≈ 128 бит** симметрии (≈ 3072 бит классического DH).\n- Быстрее и меньше места.", "Кривые:\n- **NIST P-256, P-384, P-521** (secp256r1 etc.) — стандарт FIPS 186, но подозреваются (Dual_EC_DRBG drama) в наличии backdoor от NSA — мнения разделились.\n- **Curve25519 / X25519** (Bernstein 2006, RFC 7748) — современный стандарт, простая, быстрая, безопасная. Используется в TLS 1.3, WireGuard, Signal, SSH.\n- **Curve448 / X448** — повышенная стойкость.\n- **secp256k1** — Bitcoin, Ethereum.\n- **brainpool-кривые** (RFC 5639) — европейские, без участия NSA.", "<h3>Эфемерные варианты — DHE и ECDHE</h3>", "**DHE / ECDHE** (Ephemeral) — DH с **одноразовыми** приватными ключами, генерируемыми заново на каждую сессию и удаляемыми сразу после.\n- Обеспечивает **Perfect Forward Secrecy**: компрометация долгосрочного ключа сервера в будущем не помогает расшифровать ранее записанные сессии.\n- Стандарт de facto: в TLS 1.3 это **единственный** способ обмена ключами.", "<h3>Применение и стандарты</h3>", "- **TLS 1.2 / 1.3** — ECDHE для обмена ключами.\n- **IPSec / IKEv2** — DH group в IKE_SA_INIT (Q66).\n- **SSH** — diffie-hellman-group14/16-sha256, curve25519-sha256.\n- **Signal Protocol / X3DH** — комбинирует три DH-обмена для асинхронной защищённой переписки.\n- **WhatsApp / iMessage / Wire** — используют X3DH + Double Ratchet.\n- **Noise Protocol Framework** (WireGuard) — все рукопожатия на DH+симметрия.\n- **JOSE / JWE** — для криптограмм веб-токенов.\n- **PGP / GPG (ECDH)** — для шифрования сообщений.", "<h3>Постквантовый DH</h3>", "Квантовые компьютеры с алгоритмом **Шора** способны эффективно решать задачу дискретного логарифмирования, ломая DH и ECDH за полиномиальное время. Поэтому идёт переход к:\n- **ML-KEM (Kyber, FIPS 203)** — постквантовый Key Encapsulation Mechanism.\n- **Гибридные конструкции**: ECDH X25519 + ML-KEM-768 одновременно (страховка от классических и квантовых атак). Уже включены в TLS 1.3 экспериментально (Chrome 2023+)."], "terms": [{"ru": "ECDH", "en": "Elliptic Curve DH", "df": "DH на эллиптических кривых"}, {"ru": "PFS", "en": "Perfect Forward Secrecy", "df": "совершенная прямая секретность"}], "summary": ["**Диффи-Хеллман (DH, 1976)** — впервые позволил получить общий секрет **через открытый канал** без предварительных секретов", "Основа всех современных key exchange (TLS, IPSec, SSH, Signal, WhatsApp, WireGuard); Тьюринговская премия 2015", "**Публичные параметры**: большое **простое p** (≥ 2048 бит) и **примитивный корень g** мод p (генератор ℤp*)", "**Шаги протокола** (Алиса и Боб):", "1) Алиса выбирает приватный **a ∈ [1, p−2]**, вычисляет **A = g^a mod p**, шлёт Бобу", "2) Боб выбирает приватный **b**, вычисляет **B = g^b mod p**, шлёт Алисе", "3) Алиса: K = B^a mod p = **g^(ab) mod p**; Боб: K = A^b mod p = **g^(ab) mod p**", "Атакующий знает g, p, A=g^a, B=g^b, но **не может найти g^(ab)** — это задача **CDH** (Computational DH)", "CDH сводится к **DLP** (Discrete Logarithm Problem): по A найти a", "**DLP в ℤp*** считается трудной; лучший алгоритм — **GNFS** (General Number Field Sieve), сложность L_p[1/3, (64/9)^(1/3)]", "**Стойкость** (NIST): **2048 бит DH ≈ 112 бит симм.**, 3072 ≈ 128, 7680 ≈ 192, 15360 ≈ 256", "**Стандартные группы**: **MODP-2048/3072/4096/8192** (RFC 3526), **ffdhe2048/3072/4096/6144/8192** (RFC 7919); короткие пользовательские → атака **Logjam**", "**Уязвимость классического DH: MITM** (нет аутентификации)", "Mallory: Алиса→A перехвачено, шлёт Бобу M_A=g^m; Боб→B перехвачено, шлёт Алисе M_B=g^m'; Mallory читает оба направления", "**Решения**: подпись эфемерных ключей долгосрочным sk сервера (через X.509 — так делает TLS); **STS** (Station-to-Station 1992); **MQV/HMQV**; **SIGMA** (основа IKEv2)", "**ECDH** (Elliptic Curve DH): в группе точек эллиптической кривой над конечным полем; скалярное умножение точки", "**256 бит ECDH ≈ 128 бит симм. ≈ 3072 бит классического DH** — гораздо меньше, быстрее", "Кривые: **NIST P-256/384/521** (подозрения Dual_EC_DRBG); **Curve25519 / X25519** (Bernstein 2006, RFC 7748 — TLS 1.3/WireGuard/Signal/SSH); **Curve448**; secp256k1 (Bitcoin); brainpool (RFC 5639, ЕС)", "**Эфемерные DHE/ECDHE**: одноразовые приватные ключи на каждую сессию → **Perfect Forward Secrecy**", "**В TLS 1.3 — единственный** способ обмена ключами (статический RSA удалён)", "Применения: TLS 1.2/1.3 (ECDHE); **IPSec/IKEv2** (DH group); SSH (curve25519-sha256); **Signal Protocol X3DH** (три DH-обмена) + Double Ratchet; WhatsApp/iMessage/Wire; **Noise** (WireGuard); JOSE/JWE; PGP/GPG", "**Квантовая угроза**: алгоритм **Шора** ломает DLP/ECC за полиномиальное время; переход на **ML-KEM (Kyber, FIPS 203)** + **гибрид X25519 + ML-KEM-768** (Chrome с 2023)"]}, {"n": 69, "title": "Отечественные (российские) стандарты.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "В России действует **самостоятельная криптографическая школа** со своим набором обязательных алгоритмов и регуляторов. Стандарты разрабатываются **ТК 26** (Технический комитет по стандартизации «Криптографическая защита информации») при участии Академии криптографии и ФСБ, утверждаются Росстандартом. **Применение российских стандартов обязательно** для государственных информационных систем (ГИС), значимых объектов критической информационной инфраструктуры (КИИ), систем обработки персональных данных (ИСПДн), финансового сектора, электронного документооборота с госструктурами и квалифицированной электронной подписи.", "<h3>Симметричное шифрование: ГОСТ Р 34.12-2015</h3>", "Действующий стандарт описывает два блочных шифра:", "**«Магма»** (наследник классического ГОСТ 28147-89):\n- Размер блока: **64 бита**.\n- Размер ключа: **256 бит**.\n- Архитектура: **сеть Фейстеля**, **32 раунда**.\n- 8 фиксированных таблиц подстановок (S-boxes).\n- Применяется в legacy-системах; для новых разработок ФСБ рекомендует «Кузнечик».", "**«Кузнечик»** (Grasshopper):\n- Размер блока: **128 бит**.\n- Размер ключа: **256 бит**.\n- Архитектура: **SPN** (Substitution-Permutation Network), **10 раундов**.\n- Современная замена «Магмы», по архитектуре близок к AES, но с другими S-box и линейным преобразованием.", "**Режимы работы** определены в **ГОСТ Р 34.13-2015**: ECB, CTR, OFB, CBC, CFB, MAC (имитозащита). Современное расширение — **CTR-ACPKM** и **MGM** (AEAD, аналог GCM); описаны в Р 1323565.1.026-2019.", "<h3>Хеш-функция: «Стрибог» / ГОСТ Р 34.11-2012</h3>", "**Streebog**:\n- Выход: **256 или 512 бит** (две версии).\n- Внутреннее состояние: 512 бит.\n- Конструкция Меркла-Дамгарда с компрессионной функцией на основе SPN.\n- Заменил устаревший **ГОСТ Р 34.11-94** (хеш на основе блочного шифра ГОСТ 28147-89), компрометированный.", "Применяется в ГОСТ Р 34.10-2012 (подпись), HMAC, PBKDF2-аналогах, для целостности ПО.", "<h3>Электронная подпись: ГОСТ Р 34.10-2012</h3>", "- Аналог **ECDSA** на **эллиптических кривых** над конечными полями GF(p).\n- Размеры подписи: **256** и **512 бит**.\n- Стандартизованные кривые описаны в ТК 26 (наборы параметров cryptoPro и Twisted Edwards).\n- Заменил **ГОСТ Р 34.10-2001** (тоже на ECC) и более старый ГОСТ Р 34.10-94 (DSA-аналог на DLP в Zp*).", "В ноябре 2018 г. утверждён **ГОСТ Р 34.10-2018** — изменения косметические.", "<h3>Протоколы и инфраструктура</h3>", "- **TLS-ГОСТ** (на базе TLS 1.2/1.3) — версии TLS с использованием ГОСТ-cipher suites; реализованы в КриптоПро CSP, ViPNet TLS Gateway.\n- **CMS / CAdES / XAdES / PAdES с ГОСТ** — для долговременных электронных подписей.\n- **IPSec-ГОСТ** — национальные адаптации IKEv2 + ESP.\n- **СМЭВ** (Система межведомственного электронного взаимодействия) использует ГОСТ-криптографию.\n- **PKI Минцифры** — реестр аккредитованных удостоверяющих центров (УЦ); квалифицированная ЭП («ГОСУСЛУГИ» → банки).", "<h3>Регулирование и сертификация</h3>", "- **СКЗИ** (Средство Криптографической Защиты Информации) — сертифицированное ФСБ программное или аппаратное средство.\n- **ФСБ России** — главный регулятор криптографии; ЛКЛ (Лицензирующий орган) выдаёт лицензии на разработку, производство, распространение, обслуживание СКЗИ.\n- **Классы защиты** СКЗИ (по нарастающей):\n  - **КС1** — защита от нарушителя без доступа к контролируемой зоне.\n  - **КС2** — с физическим доступом к рабочему месту.\n  - **КС3** — с доступом к ПО ОС.\n  - **КВ** — высокий уровень, защита от компетентного нарушителя.\n  - **КА** — высший, гос. тайна.\n- **ФСТЭК России** — регулятор технической защиты информации (не криптографии): сертификация средств защиты ИСПДн и КИИ, требования к 17/21 приказам.\n- **ГОСТ Р 57580.1/2** — стандарты ИБ финансовых организаций.", "<h3>Реализации (СКЗИ)</h3>", "- **КриптоПро CSP** — самый распространённый, совместим с Microsoft CryptoAPI и PKCS#11.\n- **ViPNet CSP / Coordinator / Client** — InfoTeCS, VPN и сертификация.\n- **Signal-COM CSP**, **Лисси CSP** — другие.\n- **МагПро КриптоПакет** — для Linux.\n- **Bouncy Castle с ГОСТ-аддоном** — открытый Java/.NET.", "<h3>Процесс стандартизации</h3>", "1. **ТК 26** разрабатывает проект (часто на основе академических работ Академии криптографии).\n2. **Публичное обсуждение** через сайт ТК 26.\n3. **Согласование** с ФСБ и Росстандартом.\n4. **Утверждение Росстандартом** как ГОСТ Р.\n5. Реализация в СКЗИ, сертификация ФСБ.", "<h3>Сравнение с международными аналогами</h3>", "| Назначение | Российский стандарт | Международный аналог |\n|---|---|---|\n| Блочный шифр (новый) | Кузнечик (ГОСТ Р 34.12-2015) | AES (FIPS 197) |\n| Блочный шифр (legacy) | Магма (ГОСТ 28147-89 / Р 34.12-2015) | 3DES |\n| Хеш | Стрибог (ГОСТ Р 34.11-2012) | SHA-2 / SHA-3 |\n| ЭП | ГОСТ Р 34.10-2012 | ECDSA / EdDSA |\n| Обмен ключей | VKO ГОСТ Р 34.10 | ECDH |\n| AEAD | MGM | GCM / ChaCha20-Poly1305 |"], "terms": [], "summary": ["В РФ самостоятельная криптошкола; стандарты — **ТК 26** при Академии криптографии/ФСБ, утв. **Росстандартом**", "Обязательны: ГИС (гос. инф. системы), значимые объекты КИИ, ИСПДн, финсектор, ЭДО с госструктурами, квалифиц. ЭП", "**Симметричное — ГОСТ Р 34.12-2015**: два блочных шифра", "**«Магма»** (наследник ГОСТ 28147-89): блок **64 бит**, ключ **256 бит**, сеть **Фейстеля**, **32 раунда**, 8 фикс. S-boxes; legacy", "**«Кузнечик» (Grasshopper)**: блок **128 бит**, ключ **256 бит**, **SPN**, **10 раундов**; современная замена; близок к AES архитектурно, другие S-box", "Режимы (**ГОСТ Р 34.13-2015**): ECB/CTR/OFB/CBC/CFB/MAC (имитозащита); расширения — **CTR-ACPKM** (смена ключа), **MGM** (AEAD, аналог GCM) — Р 1323565.1.026-2019", "**Хеш — «Стрибог» / ГОСТ Р 34.11-2012**: выход **256 или 512 бит**; внутреннее состояние 512; **Меркла-Дамгарда** с компрессией на SPN", "Заменил устаревший ГОСТ Р 34.11-94 (на блочном ГОСТ 28147-89); применяется в подписи, HMAC, целостности ПО", "**ЭП — ГОСТ Р 34.10-2012**: аналог **ECDSA** на эллиптических кривых над **GF(p)**", "Размеры подписи: **256 и 512 бит**; стандарт. кривые в ТК 26 (cryptoPro, Twisted Edwards)", "Заменил Р 34.10-2001 (тоже ECC) и Р 34.10-94 (DSA-аналог); в 2018 — косметические изменения", "**VKO** (Выработка ключа согласования) — российский аналог ECDH в ГОСТ", "**Протоколы**: **TLS-ГОСТ** (TLS 1.2/1.3 с ГОСТ cipher suites; КриптоПро CSP, ViPNet TLS Gateway)", "**CMS / CAdES / XAdES / PAdES с ГОСТ** — долговременные подписи; **IPSec-ГОСТ**; **СМЭВ** на ГОСТ; **PKI Минцифры** (реестр УЦ; КЭП через ГОСУСЛУГИ)", "**СКЗИ** (Средство Криптографической Защиты Информации) — сертифицированное ФСБ", "**ФСБ России** — главный регулятор криптографии; ЛКЛ — лицензии на разработку/производство/распространение/обслуживание", "**Классы защиты СКЗИ** (по нарастанию): **КС1** (без физ. доступа), **КС2** (с доступом к рабочему месту), **КС3** (доступ к ОС), **КВ** (компетентный нарушитель), **КА** (гос. тайна)", "**ФСТЭК России** — регулятор технической защиты (не криптографии); приказы 17/21 для ИСПДн/КИИ; **ГОСТ Р 57580.1/2** — банки", "**Реализации СКЗИ**: **КриптоПро CSP** (Microsoft CryptoAPI + PKCS#11), **ViPNet CSP/Coordinator/Client** (InfoTeCS), Signal-COM CSP, Лисси CSP, **МагПро КриптоПакет** (Linux), Bouncy Castle с ГОСТ-аддоном", "**Процесс**: ТК 26 разрабатывает → публичное обсуждение → согласование ФСБ/Росстандарт → утверждение ГОСТ Р → реализация в СКЗИ → сертификация ФСБ", "**Соответствия**: AES ↔ Кузнечик; 3DES ↔ Магма (legacy); SHA-2/3 ↔ Стрибог; ECDSA/EdDSA ↔ ГОСТ Р 34.10-2012; ECDH ↔ VKO; GCM/ChaCha20-Poly1305 ↔ MGM"]}, {"n": 70, "title": "Зарубежные стандарты.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "Зарубежные криптографические стандарты разрабатываются международными и национальными органами; их **де-факто принимает большинство стран мира**, кроме тех, где есть собственная криптосуверенная политика (РФ, КНР). Главным авторитетом является американский **NIST** (National Institute of Standards and Technology), публикующий стандарты в серии **FIPS** (Federal Information Processing Standard) и руководства **SP 800-x**. Открытый конкурсный процесс NIST с международным рецензированием дал миру **AES**, **SHA-3**, **PQC**-алгоритмы (Kyber, Dilithium). Параллельно действуют международные органы (**ISO/IEC**, **IETF**), европейские (**ETSI**, **BSI** Германия, **CESG** Великобритания), отраслевые (**CA/Browser Forum**, **OASIS**).", "<h3>Симметричное шифрование</h3>", "- **DES** (Data Encryption Standard, FIPS 46, 1977) — 64-битный блок, **56-битный ключ**. Сеть Фейстеля, 16 раундов. Был стандартом США 25 лет; в 1998 г. EFF Deep Crack за 56 ч; в 1999 г. — за 22 ч. **Устарел**.\n- **3DES** (Triple DES, FIPS 46-3) — три раунда DES с разными ключами; 168-битный ключ, эффективная стойкость **~112 бит** из-за **meet-in-the-middle**. Большой блок 64 бита создаёт уязвимости (Sweet32). **Выведен NIST в 2023** (последний срок переходного периода — 2023).\n- **AES** (Advanced Encryption Standard, FIPS 197, 2001) — победитель открытого конкурса 1997–2000, алгоритм **Rijndael** (Дамена и Раймана). Блок **128 бит**, ключи **128 / 192 / 256 бит**. Архитектура **SPN**. Поддерживается аппаратно (AES-NI на Intel/AMD, ARMv8). Современный мировой стандарт; используется в TLS, IPSec, BitLocker, FileVault, банкоматах.", "Альтернативные шифры (международные): **Camellia** (NTT, Mitsubishi; ISO/IEC 18033, RFC 3713), **SEED** (Корея), **Serpent**, **Twofish** (финалисты AES-конкурса), **Threefish** (Skein).", "**Поточные шифры**: **ChaCha20** (Bernstein 2008, RFC 8439), **Salsa20**. RC4 — устарел.", "**Режимы AEAD** в FIPS / NIST SP 800: **AES-GCM** (SP 800-38D), **AES-CCM** (SP 800-38C), **AES-OCB**, **AES-SIV** (для key wrapping), **AES-GCM-SIV** (nonce-misuse resistant).", "**Дисковое шифрование**: **AES-XTS** (IEEE 1619, SP 800-38E).", "<h3>Хеш-функции</h3>", "- **MD5** (RFC 1321) — 128 бит, **скомпрометирован** в 2004 (Wang). Не использовать для безопасности.\n- **SHA-1** (FIPS 180-1, 1995) — 160 бит. **Skompрометирован** атакой **SHAttered** (Google + CWI Amsterdam, 2017): найдена реальная коллизия. NIST запретил с 2030.\n- **SHA-2** (FIPS 180-4) — семейство **SHA-224 / SHA-256 / SHA-384 / SHA-512 / SHA-512/224 / SHA-512/256**. Конструкция Меркла-Дамгарда с компрессионной функцией Davies-Meyer. **Действующий стандарт**, повсеместно.\n- **SHA-3** (FIPS 202, 2015) — победитель открытого конкурса 2007–2012, алгоритм **Keccak** (Bertoni, Daemen, Peeters, Van Assche). **Sponge construction** — принципиально другая архитектура, не подвержена атакам Меркла-Дамгарда (length extension). Варианты: SHA3-224/256/384/512, SHAKE128/256 (XOF — Extendable Output Functions).\n- **BLAKE2 / BLAKE3** — высокопроизводительные альтернативы (Аумассон), активно используются в Linux, WireGuard, IPFS.", "<h3>Электронная подпись</h3>", "Стандарт **DSS** (Digital Signature Standard, FIPS 186):\n- **DSA** (Digital Signature Algorithm) — на DLP в ℤp*; исключён в **FIPS 186-5 (2023)**.\n- **RSA-подпись** — PKCS#1 v1.5 (устаревает) и **RSA-PSS** (рекомендуется), на основе факторизации.\n- **ECDSA** — Elliptic Curve DSA на стандартных кривых P-256, P-384, P-521.\n- **EdDSA** (RFC 8032) — детерминистичная подпись на Edwards curves: **Ed25519** и Ed448; рекомендован FIPS 186-5. Используется в SSH, OpenSSL 1.1.1+, OpenSSH, libsodium.", "<h3>Постквантовая криптография (PQC)</h3>", "С 2016 года NIST провёл международный конкурс **NIST PQC** на постквантовые стандарты, защищённые от квантового алгоритма Шора. В августе 2024 г. утверждены первые финальные стандарты:\n- **ML-KEM** (Module-Lattice-based KEM, FIPS 203) — на основе Kyber, для обмена ключами.\n- **ML-DSA** (Module-Lattice-based DSA, FIPS 204) — на основе Dilithium, для подписи.\n- **SLH-DSA** (Stateless Hash-based DSA, FIPS 205) — на основе SPHINCS+, hash-based подпись.\n- **FALCON** (FN-DSA, ожидается отдельный FIPS) — на основе NTRU-lattices, компактные подписи.", "В ходе стандартизации старт также взяли **гибридные** схемы (классическая + PQC одновременно) — уже в Chrome и Cloudflare для TLS.", "<h3>Процесс стандартизации NIST</h3>", "Эталонная модель открытого международного конкурса:\n1. **Объявление требований** (security, performance, side-channel).\n2. **Open call for proposals** — заявки от исследователей по всему миру.\n3. **Несколько раундов рецензирования** (5–8 лет) — публичные комментарии, тонкие криптоанализы; некоторые алгоритмы выбывают из-за найденных атак.\n4. **Отбор финалистов**.\n5. **Утверждение** одного победителя и публикация **FIPS**.\n6. **Рекомендации в SP 800-x** для внедрения.\n7. **CMVP / FIPS 140** — программа сертификации реализаций.", "Такая открытость дала AES, SHA-3, PQC высокую степень доверия в международном сообществе.", "<h3>Другие организации стандартизации</h3>", "- **ISO/IEC JTC 1/SC 27** — международные стандарты ИБ: ISO/IEC 27001, 18033 (шифры), 9797 (MAC), 10118 (хеши), 14888 (подписи).\n- **IETF** — RFC по криптопротоколам: TLS, IPSec, JOSE, COSE, ACME.\n- **ETSI** (European Telecommunications Standards Institute) — европейские стандарты, в т. ч. QKD (квантовое распределение ключей) и Quantum-Safe Cryptography.\n- **BSI** (Bundesamt für Sicherheit in der Informationstechnik, Германия) — рекомендации TR-02102 по криптографии для госсектора.\n- **ANSSI** (Франция) — RGS (Référentiel Général de Sécurité).\n- **CCCS** (Канада), **JCMVP** (Япония).\n- **CA/Browser Forum** — отраслевая ассоциация, контролирует Baseline Requirements для публичных TLS-CA.\n- **W3C / OASIS** — XML/Web-стандарты: XML Signature, XML Encryption, SAML.\n- **3GPP** — криптография в LTE/5G (SNOW 3G, AES, ZUC).", "<h3>Криптографическая политика и ограничения</h3>", "- **Wassenaar Arrangement** — экспортный контроль криптографии.\n- **FIPS 140-3** (преемник 140-2) — стандарт модулей криптозащиты.\n- **NSA Suite B / CNSA Suite** — алгоритмы для гос. систем США (AES-256, SHA-384, ECDH-P384, ECDSA-P384, RSA-3072).\n- **Common Criteria** (ISO/IEC 15408) — международные общие критерии.", "<h3>Сравнение с российскими стандартами</h3>", "| Назначение | Зарубежный | Российский |\n|---|---|---|\n| Симметричное шифрование | AES (FIPS 197) | Кузнечик (ГОСТ Р 34.12-2015) |\n| Поточный шифр | ChaCha20 | — |\n| Хеш | SHA-2 / SHA-3 | Стрибог (ГОСТ Р 34.11-2012) |\n| Подпись | RSA-PSS / ECDSA / EdDSA | ГОСТ Р 34.10-2012 |\n| Обмен ключей | ECDH X25519 | VKO ГОСТ Р 34.10 |\n| AEAD | GCM / ChaCha20-Poly1305 | MGM |\n| PQC | ML-KEM, ML-DSA, SLH-DSA, FALCON | в разработке |"], "terms": [{"ru": "FIPS", "en": "Federal Information Processing Standard", "df": "федеральный стандарт США"}], "summary": ["Главный авторитет — **NIST** (США); серия **FIPS** + руководства **SP 800-x**; открытый конкурсный процесс с международным рецензированием", "**ISO/IEC JTC 1/SC 27**, **IETF**, европейские (**ETSI, BSI** Германия, ANSSI Франция, **CESG**), отраслевые (**CA/Browser Forum**, OASIS), 3GPP", "**Симметричное — DES** (FIPS 46, 1977): 64/56 бит, Фейстель 16 раундов; **EFF Deep Crack 1998 — 56 ч**; устарел", "**3DES** (FIPS 46-3): 168 бит ключ, эффективно ~112 бит (meet-in-the-middle); 64-бит блок → **Sweet32**; **выведен NIST в 2023**", "**AES** (FIPS 197, 2001): победитель открытого конкурса 1997-2000, **Rijndael** (Дамена/Раймана); блок **128 бит**, ключи **128/192/256**; **SPN**; AES-NI (Intel/AMD/ARMv8)", "Альтернативы: **Camellia** (NTT, ISO 18033, RFC 3713), SEED (Корея), Serpent, Twofish, Threefish", "Поточные: **ChaCha20** (Bernstein 2008, RFC 8439), Salsa20; RC4 устарел", "**Режимы AEAD** (SP 800-38): **AES-GCM** (38D), AES-CCM (38C), AES-OCB, AES-SIV (key wrap), AES-GCM-SIV (nonce-misuse resistant); **AES-XTS** (IEEE 1619, диск)", "**Хеши — MD5** (RFC 1321, 128 бит, **сломан Wang 2004**); **SHA-1** (FIPS 180-1, 160 бит, **SHAttered 2017 Google+CWI**, NIST запретил с 2030)", "**SHA-2** (FIPS 180-4): SHA-224/**256**/384/**512** + SHA-512/224, SHA-512/256; Меркла-Дамгарда + Davies-Meyer; **действующий стандарт**", "**SHA-3** (FIPS 202, 2015, **Keccak** Bertoni/Daemen/Peeters/Van Assche): победитель открытого конкурса 2007-2012; **Sponge construction** не подвержена length extension; SHAKE128/256 (**XOF**)", "**BLAKE2/BLAKE3** (Аумассон) — высокопроизводительные; Linux/WireGuard/IPFS", "**ЭЦП — DSS** (FIPS 186): **DSA** (DLP в ℤp*, **исключён в FIPS 186-5 2023**); **RSA-PSS** (рекомендуется); **ECDSA** P-256/384/521; **EdDSA** (Ed25519/Ed448, RFC 8032, детерминистичный) — рекомендован FIPS 186-5", "**PQC NIST конкурс 2016-2024** — постквантовая криптография против Шора", "**FIPS 203 — ML-KEM** (Kyber, Module-Lattice KEM); **FIPS 204 — ML-DSA** (Dilithium); **FIPS 205 — SLH-DSA** (SPHINCS+, hash-based); **FALCON** (NTRU-lattice, отдельный FIPS)", "Гибриды classical+PQC уже в Chrome и Cloudflare для TLS", "**Процесс NIST**: 1) требования; 2) open call; 3) **5-8 лет рецензирования** (некоторые алгоритмы выбывают); 4) финалисты; 5) FIPS; 6) SP 800-x; 7) **CMVP/FIPS 140**", "**Другие**: **ISO/IEC** (18033 шифры, 9797 MAC, 10118 хеши, 14888 подписи); **IETF** RFC (TLS/IPSec/JOSE/COSE/ACME); ETSI (QKD, Quantum-Safe); BSI TR-02102; ANSSI RGS; CCCS, JCMVP", "Отраслевые: **CA/Browser Forum** Baseline Requirements; W3C/OASIS (XML Sig/Enc, SAML); **3GPP** (LTE/5G: SNOW 3G, AES, ZUC)", "**Политика и ограничения**: **Wassenaar Arrangement** (экспортный контроль); **FIPS 140-3**; **NSA Suite B / CNSA** (AES-256, SHA-384, ECDH-P384, ECDSA-P384, RSA-3072); **Common Criteria** (ISO/IEC 15408)", "**Соответствия зар./росс.**: AES↔Кузнечик; ChaCha20↔—; SHA-2/3↔Стрибог; RSA-PSS/ECDSA/EdDSA↔ГОСТ Р 34.10-2012; ECDH X25519↔VKO; GCM/ChaCha20-Poly1305↔MGM; ML-KEM/DSA↔в разработке"]}], "quizzes": []}];

function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}

function kwColor(s){
  // Restore <sub>/<sup>/<em>/<i> tags that were escaped by esc() so math notation renders
  s = s.replace(/&lt;(\/?)(sub|sup|em|i)&gt;/g, '<$1$2>');
  // Bold **...** → orange
  s = s.replace(/\*\*(.+?)\*\*/g, '<span class="kw kw-concept">$1</span>');
  // English in parens
  s = s.replace(/\(([A-Za-z][A-Za-z0-9\s\/\.\-\+,&;:]+?)\)/g, function(m, inner){
    return '(<span class="kw kw-en">'+inner+'</span>)';
  });
  // Protocols
  PROTOS.forEach(p => {
    const re = new RegExp('(?<![\\wА-Яа-яёЁ])(' + p.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&') + ')(?![\\wА-Яа-яёЁ])','g');
    s = s.replace(re, '<span class="kw kw-proto">$1</span>');
  });
  // Standards
  STDS.forEach(st => {
    const re = new RegExp('(?<![\\wА-Яа-яёЁ])(' + st.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&') + ')(?![\\wА-Яа-яёЁ])','g');
    s = s.replace(re, '<span class="kw kw-std">$1</span>');
  });
  // Abbreviations
  ABBRS.forEach(ab => {
    const re = new RegExp('(?<![\\wА-Яа-яёЁ"\\/])(' + ab.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&') + ')(?![\\wА-Яа-яёЁ])','g');
    s = s.replace(re, '<span class="kw kw-abbr">$1</span>');
  });
  return s;
}

function colorize(text){
  // Split into lines and process markdown lists
  const lines = text.split('\n');
  let html = '';
  let inUl = false, inSub = false;
  for (const raw of lines) {
    const line = raw.trimEnd();
    const subMatch = line.match(/^\s{2,}-\s+(.*)/);
    const topMatch = line.match(/^-\s+(.*)/);
    if (subMatch) {
      if (!inSub) { html += '<ul class="md-sub">'; inSub = true; }
      html += '<li>' + kwColor(esc(subMatch[1])) + '</li>';
    } else if (topMatch) {
      if (inSub) { html += '</ul>'; inSub = false; }
      if (!inUl) { html += '<ul class="md-list">'; inUl = true; }
      html += '<li>' + kwColor(esc(topMatch[1])) + '</li>';
    } else {
      if (inSub) { html += '</ul>'; inSub = false; }
      if (inUl) { html += '</ul>'; inUl = false; }
      html += kwColor(esc(line)) + ' ';
    }
  }
  if (inSub) html += '</ul>';
  if (inUl) html += '</ul>';
  return html.trim();
}

function mdTable(p){
  const lines = p.split('\n').map(l => l.trim()).filter(Boolean);
  if(lines.length < 2) return null;
  if(!/^\|.*\|\s*$/.test(lines[0])) return null;
  if(!/^\|?[\s:|-]+\|?\s*$/.test(lines[1]) || !lines[1].includes('-')) return null;
  const parseRow = (l) => l.replace(/^\|/, '').replace(/\|\s*$/, '').split('|').map(s => s.trim());
  const headers = parseRow(lines[0]);
  const rows = lines.slice(2).map(parseRow);
  let h = '<table><thead><tr>';
  headers.forEach(c => h += '<th>' + kwColor(esc(c)) + '</th>');
  h += '</tr></thead><tbody>';
  rows.forEach(r => {
    h += '<tr>';
    r.forEach(c => h += '<td>' + kwColor(esc(c)) + '</td>');
    h += '</tr>';
  });
  h += '</tbody></table>';
  return h;
}

// ─── INLINE QUIZ (per question) ───
function renderInlineQuiz(topic, qn, qi) {
  const prefix = `Вопрос ${qn}`;
  const qs = topic.quizzes.filter(q => q.topic === prefix);
  if (!qs.length) return '';
  const id = `iq_${topic.id}_${qi}`;
  let h = `<div class="a-section iq-section"><div class="iq-box"><div class="iq-title">Проверь себя (${qs.length})</div>`;
  qs.forEach((q, i) => {
    const uid = `${id}_${i}`;
    if (q.type === 'mcq') {
      const letters = 'ABCD';
      h += `<div class="iq-item" id="${uid}"><div class="iq-q">${esc(q.q)}</div><div class="iq-opts">`;
      q.opts.forEach((o, oi) => {
        h += `<div class="iq-opt" onclick="iqMCQ('${uid}',${oi},${q.ans})" id="${uid}_o${oi}"><div class="iq-ltr">${letters[oi]}</div><div>${esc(o)}</div></div>`;
      });
      h += `</div><div class="iq-fb" id="${uid}_fb">${esc(q.expl)}</div></div>`;
    } else if (q.type === 'tf') {
      h += `<div class="iq-item" id="${uid}"><div class="iq-q">${esc(q.q)}</div><div class="iq-tf">`;
      h += `<button class="iq-tf-btn" id="${uid}_t" onclick="iqTF('${uid}',true,${q.ans})">&#10004; Верно</button>`;
      h += `<button class="iq-tf-btn" id="${uid}_f" onclick="iqTF('${uid}',false,${q.ans})">&#10008; Неверно</button>`;
      h += `</div><div class="iq-fb" id="${uid}_fb">${esc(q.expl)}</div></div>`;
    } else if (q.type === 'match') {
      // Render match as a simpler "review pairs" display for inline
      h += `<div class="iq-item"><div class="iq-q">${esc(q.q)}</div>`;
      h += `<div class="t-grid">`;
      q.pairs.forEach(p => {
        h += `<div class="t-card"><div class="t-ru">${esc(p.l)}</div><div class="t-en">${esc(p.r)}</div></div>`;
      });
      h += `</div></div>`;
    }
  });
  h += `</div></div>`;
  return h;
}

function iqMCQ(uid, picked, correct) {
  const item = document.getElementById(uid);
  if (item.dataset.done) return;
  item.dataset.done = '1';
  item.querySelectorAll('.iq-opt').forEach(el => el.classList.add('iq-dis'));
  document.getElementById(`${uid}_o${picked}`).classList.add(picked === correct ? 'iq-ok' : 'iq-no');
  if (picked !== correct) document.getElementById(`${uid}_o${correct}`).classList.add('iq-ok');
  const fb = document.getElementById(`${uid}_fb`);
  fb.classList.add('show', picked === correct ? 'iq-fb-ok' : 'iq-fb-no');
}

function iqTF(uid, picked, correct) {
  const item = document.getElementById(uid);
  if (item.dataset.done) return;
  item.dataset.done = '1';
  document.querySelectorAll(`#${uid} .iq-tf-btn`).forEach(b => b.classList.add('iq-dis'));
  const clickedBtn = document.getElementById(`${uid}_${picked ? 't' : 'f'}`);
  const correctBtn = document.getElementById(`${uid}_${correct ? 't' : 'f'}`);
  clickedBtn.classList.add(picked === correct ? 'iq-ok' : 'iq-no');
  if (picked !== correct) correctBtn.classList.add('iq-ok');
  const fb = document.getElementById(`${uid}_fb`);
  fb.classList.add('show', picked === correct ? 'iq-fb-ok' : 'iq-fb-no');
}

function selMCQ(i){if(quizAnswered)return;quizAnswered=true;const q=quizQs[quizIdx],ok=i===q.ans;if(ok)quizScore++;quizResults.push({q:q.q,ok,expl:q.expl});document.querySelectorAll('.option').forEach(e=>e.classList.add('disabled'));document.getElementById('opt'+i).classList.add(ok?'correct':'incorrect');if(!ok)document.getElementById('opt'+q.ans).classList.add('correct');showFB(ok,q.expl);}
function selTF(v){if(quizAnswered)return;quizAnswered=true;const q=quizQs[quizIdx],ok=v===q.ans;if(ok)quizScore++;quizResults.push({q:q.q,ok,expl:q.expl});document.querySelectorAll('.tf-btn').forEach(b=>b.classList.add('disabled'));document.getElementById(v?'tfT':'tfF').classList.add(ok?'correct':'incorrect');if(!ok)document.getElementById(q.ans?'tfT':'tfF').classList.add('correct');showFB(ok,q.expl);}
function selML(i){if(matchState.matched.includes(i))return;document.querySelectorAll('.match-col:first-child .match-item').forEach(e=>e.classList.remove('active'));document.getElementById('ml'+i).classList.add('active');matchState.left=i;}
function selMR(ri){if(matchState.left===null)return;const sr=matchState.sr[ri];if(document.getElementById('mr'+ri).classList.contains('matched-correct'))return;const li=matchState.left,ok=matchState.pairs[li].r===sr.r;document.getElementById('ml'+li).classList.remove('active');if(ok){document.getElementById('ml'+li).classList.add('matched-correct');document.getElementById('mr'+ri).classList.add('matched-correct');matchState.matched.push(li);}else{document.getElementById('ml'+li).classList.add('matched-wrong');document.getElementById('mr'+ri).classList.add('matched-wrong');setTimeout(()=>{document.getElementById('ml'+li).classList.remove('matched-wrong');document.getElementById('mr'+ri).classList.remove('matched-wrong');},700);}matchState.left=null;if(matchState.matched.length===matchState.pairs.length){quizAnswered=true;quizScore++;quizResults.push({q:quizQs[quizIdx].q,ok:true,expl:quizQs[quizIdx].expl});showFB(true,quizQs[quizIdx].expl);}}
function chkFill(){if(quizAnswered)return;quizAnswered=true;const q=quizQs[quizIdx],inp=document.getElementById('fillIn'),v=inp.value.trim(),ok=v.toLowerCase().replace(/[^a-zа-яё0-9]/gi,'')===q.ans.toLowerCase().replace(/[^a-zа-яё0-9]/gi,'');if(ok)quizScore++;quizResults.push({q:q.q,ok,expl:q.expl});inp.classList.add(ok?'correct':'incorrect');inp.disabled=true;showFB(ok,q.expl+(ok?'':` Ответ: ${q.ans}`));}
function showFB(ok,expl){const fb=document.getElementById('fb');fb.className=`feedback show ${ok?'correct-fb':'incorrect-fb'}`;fb.innerHTML=`<div class="fb-title">${ok?'&#10004; Правильно!':'&#10008; Неправильно'}</div>${esc(expl)}`;document.getElementById('nxtBtn').disabled=false;}
function nxtQ(){quizIdx++;quizIdx>=quizQs.length?renderQuizResults():renderQuizUI();}

function renderQuizResults(){

// ─── SEARCH ───
let prevView=null, prevTopicIdx=-1, searchTimer=null, currentQuery='';

function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

function highlight(text,q){
  if(!q||!text)return esc(text||'');
  const lower=text.toLowerCase(), ql=q.toLowerCase();
  let out='', i=0;
  while(i<text.length){
    const m=lower.indexOf(ql,i);
    if(m<0){out+=esc(text.slice(i));break;}
    out+=esc(text.slice(i,m))+'<mark>'+esc(text.slice(m,m+ql.length))+'</mark>';
    i=m+ql.length;
  }
  return out;
}

function snippet(text,q,ctx){
  ctx=ctx||80;
  if(!text)return '';
  const lower=text.toLowerCase(), ql=q.toLowerCase();
  const i=lower.indexOf(ql);
  if(i<0)return esc(text.slice(0,160))+(text.length>160?'…':'');
  const s=Math.max(0,i-ctx), e=Math.min(text.length,i+ql.length+ctx);
  return (s>0?'…':'')+highlight(text.slice(s,e),q)+(e<text.length?'…':'');
}

function stripTags(s){return (s||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();}

function onSearch(v){
  clearTimeout(searchTimer);
  const q=v.trim();
  document.getElementById('searchClear').classList.toggle('show', q.length>0);
  searchTimer=setTimeout(()=>{
    if(q.length===0){
      if(view==='search'){
        currentQuery='';
        if(prevView==='review'&&prevTopicIdx>=0){topicIdx=prevTopicIdx;view='review';renderSidebar();renderReview();}
        else{goHome();}
      }
      return;
    }
    if(view!=='search'){prevView=view;prevTopicIdx=topicIdx;view='search';renderSidebar();}
    currentQuery=q;
    renderSearch(q);
  },180);
}

function clearSearch(){
  const inp=document.getElementById('searchInput');
  inp.value='';
  onSearch('');
  inp.focus();
}

function renderSearch(q){
  document.getElementById('topTitle').textContent=`Поиск: «${q}»`;
  document.getElementById('topRight').innerHTML=`<button class="btn-sm" onclick="goHome()">&#8962;</button>`;
  const ql=q.toLowerCase();
  const results=[];
  TOPICS.forEach((t,ti)=>{
    t.questions.forEach((qq,qi)=>{
      const inTitle=qq.title.toLowerCase().includes(ql);
      const allAns=stripTags((qq.paragraphs||[]).join(' '));
      const inAns=allAns.toLowerCase().includes(ql);
      const termHit=(qq.terms||[]).find(tm=>((tm.ru||'')+' '+(tm.en||'')+' '+(tm.df||'')).toLowerCase().includes(ql));
      const allSum=(qq.summary||[]).join(' ');
      const inSum=allSum.toLowerCase().includes(ql);
      if(inTitle||inAns||termHit||inSum){
        let snipText='', snipLabel='';
        if(inAns){snipText=allAns;snipLabel='ответ';}
        else if(inSum){snipText=allSum;snipLabel='шпаргалка';}
        else if(termHit){snipText=`${termHit.ru} (${termHit.en}) — ${termHit.df}`;snipLabel='термин';}
        results.push({ti,qi,topic:t,q:qq,snipText,snipLabel});
      }
    });
  });
  let h=`<div class="sr-header">${results.length===0?'Ничего не найдено':`Найдено: ${results.length} ${results.length===1?'результат':results.length<5?'результата':'результатов'}`}</div>`;
  if(results.length===0){
    h+=`<div class="sr-empty">По запросу «${esc(q)}» ничего не найдено.<br>Попробуйте другие ключевые слова.</div>`;
  }else{
    h+='<div class="sr-list">';
    results.forEach(r=>{
      h+=`<div class="sr-item" onclick="openSearchResult(${r.ti},${r.qi})">
        <div class="sr-topic">Тема ${r.topic.id} · Вопрос ${r.q.n}${r.snipLabel?' · '+r.snipLabel:''}</div>
        <div class="sr-title">${highlight(r.q.title,q)}</div>
        ${r.snipText?`<div class="sr-snippet">${snippet(r.snipText,q)}</div>`:''}
      </div>`;
    });
    h+='</div>';
  }
  document.getElementById('content').innerHTML=h;
  document.getElementById('mainArea').scrollTo({top:0});
}

function openSearchResult(ti,qi){
  document.getElementById('searchInput').value='';
  document.getElementById('searchClear').classList.remove('show');
  currentQuery='';
  topicIdx=ti;view='review';
  if(!reviewSeen[TOPICS[ti].id])reviewSeen[TOPICS[ti].id]=new Set();
  renderSidebar();renderReview();
  closeSidebar();
  setTimeout(()=>{
    const items=document.querySelectorAll('.q-item');
    const item=items[qi];
    if(item){
      const body=item.querySelector('.q-body');
      const chev=item.querySelector('.q-chev');
      body.classList.add('visible');
      chev.classList.add('open');
      item.classList.add('flash');
      item.scrollIntoView({behavior:'smooth',block:'start'});
      setTimeout(()=>item.classList.remove('flash'),1700);
    }
  },60);
}

init();
</script>
</body>
