<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кандидатский экзамен — Блок 3</title>
<style>
:root{
  --bg:#0d1117;--sidebar:#161b22;--surface:#1c2128;--card:#21262d;
  --border:#30363d;--accent:#58a6ff;--accent2:#79c0ff;--purple:#bc8cff;
  --green:#3fb950;--orange:#e3b341;--red:#ff7b72;--pink:#f778ba;
  --text:#e6edf3;--muted:#7d8590;--muted2:#484f58;--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',system-ui,sans-serif;display:flex;height:100vh;height:100dvh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:270px;min-width:270px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:16px 14px 12px;border-bottom:1px solid var(--border)}
.logo-title{font-size:.95rem;font-weight:800;color:var(--accent);margin-bottom:2px}
.sidebar-header p{font-size:.75rem;color:var(--muted2)}
.nav-list{flex:1;overflow-y:auto;padding:6px 0}
.nav-list::-webkit-scrollbar{width:4px}
.nav-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.nav-item{display:flex;align-items:flex-start;gap:8px;padding:8px 14px;cursor:pointer;border-left:3px solid transparent;transition:background .12s;user-select:none}
.nav-item:hover{background:rgba(88,166,255,.06)}
.nav-item.active{background:rgba(88,166,255,.1);border-left-color:var(--accent)}
.nav-num{font-size:.68rem;font-weight:700;color:var(--muted2);background:var(--surface);border-radius:4px;padding:2px 6px;margin-top:1px;white-space:nowrap;flex-shrink:0}
.nav-item.active .nav-num{background:var(--accent);color:#000}
.nav-text{font-size:.78rem;line-height:1.35;color:var(--muted)}
.nav-item.active .nav-text{color:var(--text)}
.sidebar-footer{padding:10px 14px;border-top:1px solid var(--border);font-size:.75rem;color:var(--muted)}
.progress-mini{height:4px;background:var(--border);border-radius:99px;margin-top:5px;overflow:hidden}
.progress-mini-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* MAIN */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.topbar{position:sticky;top:0;background:rgba(13,17,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:8px 24px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:10}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-title{font-size:.88rem;color:var(--muted);max-width:500px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;gap:6px;align-items:center}
.btn-sm{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.78rem;cursor:pointer;transition:all .12s;user-select:none}
.btn-sm:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm.active-tab{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700}
.content{padding:24px;max-width:920px;width:100%;margin:0 auto;flex:1}

/* HOME */
.home-title{font-size:1.4rem;font-weight:800;margin-bottom:4px;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.home-sub{color:var(--muted);margin-bottom:24px;font-size:.85rem}
.topics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.topic-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;cursor:pointer;transition:all .15s;overflow:hidden}
.topic-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.topic-card-num{font-size:.68rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.topic-card-name{font-size:.95rem;font-weight:700;line-height:1.35;margin-bottom:8px}
.topic-card-info{font-size:.78rem;color:var(--muted);display:flex;gap:14px}
.topic-card-btns{display:flex;gap:6px;margin-top:12px}
.tc-btn{padding:5px 12px;border-radius:6px;font-size:.75rem;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:all .12s}
.tc-btn:hover{border-color:var(--accent);color:var(--accent)}
.tc-btn.primary{background:var(--accent);border-color:var(--accent);color:#000}

/* KEYWORD COLORS */
.kw{font-weight:600;border-radius:3px;padding:0 2px}
.kw-proto{color:#58a6ff}           /* protocols: TCP, UDP, IP, HTTP */
.kw-std{color:#3fb950}             /* standards: IEEE 802.x, RFC, ISO */
.kw-abbr{color:#bc8cff}            /* abbreviations: PAN, LAN, QoS */
.kw-concept{color:#e3b341}         /* key concepts in bold */
.kw-en{color:#79c0ff;font-style:italic;font-size:.88em} /* English in parens */
.kw-ru{color:#f778ba}              /* important Russian terms */

/* MARKDOWN LISTS */
.md-list{list-style:none;padding:0;margin:8px 0}
.md-list>li{padding:5px 10px;border-left:2px solid var(--accent);margin-bottom:4px;background:rgba(88,166,255,.03);border-radius:0 6px 6px 0;font-size:.9rem;line-height:1.6}
.md-sub{list-style:disc;padding-left:22px;margin:2px 0 6px}
.md-sub>li{padding:2px 0;font-size:.87rem;line-height:1.5;color:var(--muted)}
.md-sub>li .kw{color:inherit}
.md-sub>li .kw-concept{color:var(--orange)}
.md-sub>li .kw-proto{color:var(--accent)}
.md-sub>li .kw-std{color:var(--green)}

/* INLINE QUIZ */
.iq-section{margin-top:4px}
.iq-box{background:rgba(99,102,241,.04);border:1px solid rgba(88,166,255,.2);border-radius:var(--r);padding:14px 16px}
.iq-title{font-size:.72rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.iq-title::before{content:'';width:16px;height:2px;background:var(--accent);border-radius:99px;flex-shrink:0}
.iq-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.iq-q{font-size:.88rem;font-weight:500;line-height:1.5;margin-bottom:10px}
.iq-opts{display:flex;flex-direction:column;gap:5px}
.iq-opt{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:all .12s;user-select:none;font-size:.84rem;line-height:1.4}
.iq-opt:hover:not(.iq-dis){border-color:var(--accent)}
.iq-opt.iq-ok{border-color:var(--green);background:rgba(63,185,80,.08)}
.iq-opt.iq-no{border-color:var(--red);background:rgba(255,123,114,.06)}
.iq-opt.iq-dis{cursor:default;pointer-events:none;opacity:.7}
.iq-opt.iq-dis.iq-ok{opacity:1}
.iq-ltr{width:20px;height:20px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0}
.iq-opt.iq-ok .iq-ltr{background:var(--green);color:#000}
.iq-opt.iq-no .iq-ltr{background:var(--red);color:#000}
.iq-fb{margin-top:8px;padding:8px 10px;border-radius:6px;font-size:.82rem;line-height:1.45;display:none}
.iq-fb.show{display:block}
.iq-fb.iq-fb-ok{background:rgba(63,185,80,.06);border:1px solid rgba(63,185,80,.2);color:var(--green)}
.iq-fb.iq-fb-no{background:rgba(255,123,114,.04);border:1px solid rgba(255,123,114,.15);color:var(--red)}
.iq-tf{display:flex;gap:8px}
.iq-tf-btn{flex:1;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.88rem;font-weight:600;cursor:pointer;transition:all .12s}
.iq-tf-btn:hover:not(.iq-dis){border-color:var(--accent)}
.iq-tf-btn.iq-ok{border-color:var(--green);background:rgba(63,185,80,.08);color:var(--green)}
.iq-tf-btn.iq-no{border-color:var(--red);background:rgba(255,123,114,.06);color:var(--red)}
.iq-score{font-size:.78rem;color:var(--muted);margin-top:8px;text-align:right}

/* SUMMARY (write-on-paper) */
.sum-box{background:var(--surface);border:1px solid rgba(188,140,255,.3);border-left:3px solid var(--purple);border-radius:var(--r);padding:14px 16px;margin-top:4px}
.sum-title{font-size:.72rem;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sum-title::before{content:'';width:16px;height:2px;background:var(--purple);border-radius:99px;flex-shrink:0}
.sum-list{list-style:none;display:flex;flex-direction:column;gap:5px}
.sum-item{font-size:.84rem;line-height:1.45;color:var(--text);padding-left:14px;position:relative}
.sum-item::before{content:'›';position:absolute;left:0;color:var(--purple);font-weight:700}

/* QUESTION LIST */
.q-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.q-hdr{padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .12s;user-select:none}
.q-hdr:hover{background:rgba(88,166,255,.04)}
.q-badge{font-size:.68rem;font-weight:700;color:#000;background:var(--accent);border-radius:4px;padding:2px 8px;flex-shrink:0}
.q-ttl{font-size:.88rem;font-weight:600;line-height:1.35;flex:1}
.q-chev{color:var(--muted);transition:transform .2s;font-size:.8rem}
.q-chev.open{transform:rotate(180deg)}
.q-body{display:none;padding:0 18px 18px;border-top:1px solid var(--border);user-select:text;-webkit-user-select:text}
.q-body.visible{display:block;animation:slideIn .2s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ANSWER TEXT */
.a-section{margin-top:16px}
.a-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.a-label::before{content:'';width:16px;height:2px;background:var(--accent);border-radius:99px;flex-shrink:0}
.copy-btn{margin-left:auto;padding:2px 8px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:.7rem;cursor:pointer;transition:all .15s;user-select:none}
.copy-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.copy-btn.copied{background:var(--green);color:#fff;border-color:var(--green)}
.a-text{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r);padding:16px 18px;font-size:.9rem;line-height:1.8}
.a-text p{margin-bottom:8px}
.a-text p:last-child{margin-bottom:0}

/* TERMS GRID */
.t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:6px;margin-top:4px}
.t-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.t-ru{font-weight:700;font-size:.85rem;color:var(--orange)}
.t-en{font-size:.76rem;color:var(--accent);font-style:italic}
.t-df{font-size:.78rem;color:var(--muted);line-height:1.35}

/* QUIZ */
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px 28px;animation:slideIn .3s ease;margin-bottom:16px}
.qt-badge{padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:inline-block;margin-bottom:12px}
.badge-mcq{background:rgba(88,166,255,.15);color:var(--accent)}
.badge-tf{background:rgba(227,179,65,.15);color:var(--orange)}
.badge-match{background:rgba(63,185,80,.15);color:var(--green)}
.badge-fill{background:rgba(255,123,114,.15);color:var(--red)}
.q-text{font-size:1rem;font-weight:500;line-height:1.55;margin-bottom:18px}
.options{display:flex;flex-direction:column;gap:8px}
.option{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s;user-select:none}
.option:hover:not(.disabled){border-color:var(--accent);background:rgba(88,166,255,.08)}
.option.correct{border-color:var(--green);background:rgba(63,185,80,.1)}
.option.incorrect{border-color:var(--red);background:rgba(255,123,114,.08)}
.option.disabled{cursor:default;pointer-events:none}
.o-letter{width:24px;height:24px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.option.correct .o-letter{background:var(--green);color:#000}
.option.incorrect .o-letter{background:var(--red);color:#000}
.o-text{line-height:1.45;font-size:.88rem}
.tf-options{display:flex;gap:10px}
.tf-btn{flex:1;padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.95rem;font-weight:600;cursor:pointer;transition:all .15s}
.tf-btn:hover:not(.disabled){border-color:var(--accent)}
.tf-btn.correct{border-color:var(--green);background:rgba(63,185,80,.1);color:var(--green)}
.tf-btn.incorrect{border-color:var(--red);background:rgba(255,123,114,.08);color:var(--red)}
.tf-btn.disabled{cursor:default;pointer-events:none}
.match-container{display:flex;gap:14px}
.match-col{flex:1;display:flex;flex-direction:column;gap:6px}
.match-col h4{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.match-item{padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:.85rem;cursor:pointer;transition:all .15s;user-select:none}
.match-item:hover:not(.disabled):not(.matched-correct){border-color:var(--accent)}
.match-item.active{border-color:var(--accent);background:rgba(88,166,255,.15)}
.match-item.matched-correct{border-color:var(--green);background:rgba(63,185,80,.08);cursor:default}
.match-item.matched-wrong{border-color:var(--red);background:rgba(255,123,114,.06);cursor:default}
.fill-wrap{display:flex;flex-direction:column;gap:8px}
.fill-input{padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.95rem;outline:none}
.fill-input:focus{border-color:var(--accent)}
.fill-input.correct{border-color:var(--green)}
.fill-input.incorrect{border-color:var(--red)}
.feedback{margin-top:14px;padding:12px 14px;border-radius:8px;font-size:.85rem;line-height:1.55;display:none}
.feedback.show{display:block}
.feedback.correct-fb{background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.25)}
.feedback.incorrect-fb{background:rgba(255,123,114,.06);border:1px solid rgba(255,123,114,.2)}
.fb-title{font-weight:700;margin-bottom:3px}
.feedback.correct-fb .fb-title{color:var(--green)}
.feedback.incorrect-fb .fb-title{color:var(--red)}
.quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.quiz-progress{color:var(--muted);font-size:.82rem}
.btn-q{padding:7px 18px;border-radius:6px;border:none;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .12s}
.btn-q-p{background:var(--accent);color:#000}
.btn-q-p:hover{background:var(--accent2)}
.btn-q-p:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.btn-q-s{background:var(--surface);color:var(--text);border:1px solid var(--border)}

/* RESULTS */
.res-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:36px;text-align:center}
.sc-circle{width:110px;height:110px;border-radius:50%;border:4px solid var(--accent);display:flex;align-items:center;justify-content:center;flex-direction:column;margin:0 auto 18px;background:rgba(88,166,255,.08)}
.sc-num{font-size:2.2rem;font-weight:800;color:var(--accent2)}
.sc-tot{font-size:.82rem;color:var(--muted)}
.res-title{font-size:1.3rem;font-weight:700;margin-bottom:6px}
.res-sub{color:var(--muted);margin-bottom:18px}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.res-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px}
.res-n{font-size:1.4rem;font-weight:700}
.res-l{font-size:.75rem;color:var(--muted)}
.back-btn{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:.8rem;cursor:pointer;margin-bottom:16px;padding:3px 0;user-select:none}
.back-btn:hover{color:var(--accent)}

/* EXPAND ALL */
.expand-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}

/* MENU TOGGLE (mobile hamburger) */
.menu-toggle{display:none;background:var(--surface);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:6px;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;flex-shrink:0;padding:0}
.menu-toggle:hover,.menu-toggle:focus{border-color:var(--accent);color:var(--accent);outline:none}

/* SEARCH */
.search-wrap{position:relative;flex:1;max-width:360px;min-width:0}
.search-input{width:100%;padding:6px 28px 6px 30px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.82rem;outline:none;transition:border-color .12s;font-family:inherit}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--muted)}
.search-input::-webkit-search-cancel-button{display:none}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem;pointer-events:none}
.search-clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:0 6px;border-radius:4px;display:none}
.search-clear:hover{color:var(--text)}
.search-clear.show{display:block}

/* SEARCH RESULTS */
.sr-header{font-size:.85rem;color:var(--muted);margin-bottom:12px}
.sr-empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:.9rem;line-height:1.6}
.sr-list{display:flex;flex-direction:column;gap:8px}
.sr-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;cursor:pointer;transition:all .12s}
.sr-item:hover{border-color:var(--accent);background:rgba(88,166,255,.04);transform:translateY(-1px)}
.sr-topic{font-size:.68rem;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.sr-title{font-size:.9rem;font-weight:600;line-height:1.4;margin-bottom:4px}
.sr-snippet{font-size:.8rem;color:var(--muted);line-height:1.5}
.sr-snippet mark,.sr-title mark{background:rgba(227,179,65,.25);color:var(--orange);border-radius:2px;padding:0 2px}

/* SIDEBAR OVERLAY (mobile) */
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99;display:none;opacity:0;transition:opacity .2s}
.sidebar-overlay.show{display:block;opacity:1}

/* FLASH (after search jump) */
@keyframes flashHL{0%,100%{box-shadow:0 0 0 0 rgba(88,166,255,0)}30%,70%{box-shadow:0 0 0 3px rgba(88,166,255,.55)}}
.q-item.flash{animation:flashHL 1.6s ease}

/* SECTION HEADERS inside answers */
.a-text h3{font-size:.95rem;font-weight:700;color:var(--accent2);margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.a-text h3:first-child{margin-top:0}
.a-text h4{font-size:.85rem;font-weight:700;color:var(--purple);margin:12px 0 6px}

/* FIGURES + IMAGES + SVG inside answers */
.a-text figure{margin:14px 0;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center;overflow:hidden}
.a-text figure svg{max-width:100%;height:auto;display:block;margin:0 auto}
.a-text figure img{max-width:100%;height:auto;border-radius:6px;display:block;margin:0 auto;background:#fff}
.a-text figcaption{margin-top:10px;font-size:.78rem;color:var(--muted);line-height:1.5;font-style:italic}

/* INLINE TABLES inside answers */
.a-text table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.82rem;background:var(--card);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.a-text table th{background:var(--surface);text-align:left;padding:8px 10px;font-weight:700;color:var(--accent2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border)}
.a-text table td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text);line-height:1.5;vertical-align:top}
.a-text table tr:last-child td{border-bottom:none}

@media(max-width:720px){
  body{font-size:14px}

<script>
const TOPICS = [{"id": 1, "name": "Общие принципы построения сетей", "questions": [{"n": 1, "title": "Классификация компьютерных сетей. Сети в организациях. Использование сетей частными лицами. Использование беспроводных сетей.", "paragraphs": ["<h3>Определение и подход к классификации</h3>", "**Компьютерная сеть** (computer network) — совокупность связанных каналами передачи данных автономных вычислительных устройств, способных обмениваться информацией. Сети классифицируют по нескольким независимым критериям одновременно: **масштабу охвата**, **физической топологии**, **технологии передачи**, **праву собственности**, **типу среды** (проводная или беспроводная). Эти критерии ортогональны — одна и та же сеть может одновременно быть, например, LAN, звездообразной, проводной и частной.", "<h3>Классификация по масштабу</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/6/6e/Data_Networks_classification_by_spatial_scope.svg\" alt=\"Классификация компьютерных сетей по пространственному охвату\" loading=\"lazy\"><figcaption>Классификация сетей по пространственному охвату: от BAN/PAN (метры) до WAN (континенты). По мере роста масштаба меняются технологии передачи, типичные задержки и стоимость канала. <em>Источник: Wikimedia Commons, автор Michel Bakni, CC BY-SA 4.0.</em></figcaption></figure>", "- **PAN** (Personal Area Network) — персональная сеть, охватывает несколько метров вокруг пользователя. Соединение телефона с гарнитурой по Bluetooth, синхронизация ноутбука с принтером по USB, передача файлов между смартфонами.\n- **LAN** (Local Area Network) — локальная сеть, охватывает здание, этаж или кампус. Скорости 100 Мбит/с – 100 Гбит/с, низкая задержка (<1 мс), одно административное управление. Технологии: Ethernet (IEEE 802.3), Wi-Fi (IEEE 802.11).\n- **MAN** (Metropolitan Area Network) — муниципальная сеть, объединяет узлы в пределах города. Кабельное телевидение, городские точки обмена трафиком (IXP), WiMAX (IEEE 802.16).\n- **WAN** (Wide Area Network) — глобальная сеть, охватывает сотни и тысячи километров, обычно использует арендованные операторские каналы. Технологии: MPLS, Frame Relay, ATM, оптические магистрали SDH/SONET. Интернет — крупнейшая WAN.\n- **Межсетевое соединение** (internetwork) — объединение нескольких разнородных сетей (например, корпоративных LAN, WAN-каналов и публичного Интернета) через маршрутизаторы.", "<h3>Классификация по топологии</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/9/97/NetworkTopologies.svg\" alt=\"Основные топологии сетей: шина, звезда, кольцо, полная сетка, дерево, гибридная\" loading=\"lazy\"><figcaption>Основные физические топологии сетей. На практике используются гибридные схемы (звёздно-шинные, иерархическое «дерево», частичная сетка). <em>Источник: Wikimedia Commons, общественное достояние.</em></figcaption></figure>", "- **Шина** (bus): все узлы подключены к общей среде передачи. Простая, но единственная точка отказа на самой шине и подверженность коллизиям. Использовалась в раннем Ethernet (10BASE2 на коаксиальном кабеле).\n- **Звезда** (star): узлы подключаются к центральному устройству — коммутатору. Доминирующая топология современного Ethernet. Отказ узла не влияет на остальных, но отказ центрального коммутатора фатален для всего сегмента.\n- **Кольцо** (ring): каждый узел соединён с двумя соседними; данные передаются по кругу. Token Ring, FDDI; токен-доступ полностью исключает коллизии.\n- **Полная сетка** (full mesh): каждый узел напрямую соединён с каждым. Используется в магистральных сетях операторов для отказоустойчивости. Стоимость растёт как *N(N−1)/2* каналов.\n- **Гибридная** (hybrid): сочетание базовых топологий — например иерархическое «дерево» в кампусных сетях или «звёздно-шинная» в крупных офисах.", "<h3>Классификация по технологии передачи</h3>", "- **Широковещательная рассылка** (broadcast) — один канал разделяется всеми узлами; сообщение получают все, фильтрация выполняется на приёмнике по адресу. Естественна для радиоэфира и общих шин.\n- **Коммутация пакетов** (packet switching) — данные разбиваются на пакеты, каждый маршрутизируется независимо. Эффективное статистическое мультиплексирование канала, основа Интернета.\n- **Коммутация каналов** (circuit switching) — выделение фиксированного канала на время сеанса связи. Классическая телефония (PSTN). Гарантия пропускной способности, но низкая утилизация при паузах в трафике.", "<h3>Классификация по собственности</h3>", "- **Частная** (private) — принадлежит одной организации, обычно изолирована от внешних сетей.\n- **Публичная** (public) — Интернет, инфраструктура общего пользования.\n- **Гибридная** (hybrid) — корпоративные сети, связанные через VPN-туннели поверх публичной сети (Site-to-Site IPSec, MPLS L3VPN).", "<h3>Сети в организациях</h3>", "В корпоративной среде сеть решает четыре основные задачи:\n- **Совместный доступ к ресурсам** — файловые серверы, принтеры, базы данных, единая аутентификация через Active Directory или LDAP.\n- **Внутренние коммуникации** — корпоративная почта, мессенджеры, видеоконференции (VoIP, Microsoft Teams).\n- **Электронная коммерция** — связь с поставщиками и клиентами через защищённые каналы, обработка платежей.\n- **Удалённая работа и связь филиалов** — VPN-доступ сотрудников из дома, объединение офисов через арендованные WAN-каналы или MPLS L3VPN.", "Типичная архитектура корпоративной сети — иерархическая: коммутаторы доступа на каждом этаже → уровень агрегации → ядро с маршрутизаторами и межсетевыми экранами → выход в Интернет через одного или нескольких ISP. Между офисами организуются защищённые туннели IPSec поверх Интернета или выделенные каналы.", "<h3>Сети у частных лиц</h3>", "Домашнее подключение к сети состоит из двух частей:\n- **«Последняя миля»** — канал от провайдера до квартиры. Варианты: ADSL по медной паре, DOCSIS по коаксиалу кабельного ТВ, GPON по оптике (FTTH), либо мобильный канал LTE/5G.\n- **Домашняя LAN** — Wi-Fi роутер с встроенным коммутатором; к нему подключаются проводные клиенты (ПК, smart-TV) и беспроводные (смартфоны, ноутбуки, устройства IoT).", "Основные сценарии использования: веб-сёрфинг, потоковое видео (Netflix, YouTube), онлайн-игры (где задержка важнее ширины канала), облачное резервное копирование, голосовое и видеообщение, умный дом (IoT-устройства, голосовые помощники).", "<h3>Беспроводные сети</h3>", "**Беспроводные сети** (wireless networks) используют электромагнитные волны (радиодиапазон, ИК, лазер) вместо физических кабелей. Они применяются там, где прокладка кабеля невозможна, экономически нецелесообразна или ограничивает мобильность пользователей: склады, стройки, мобильные сотрудники, удалённые регионы.", "Основные технологии группируются по масштабу применения:\n- **PAN**: Bluetooth (IEEE 802.15.1), Zigbee (IEEE 802.15.4), NFC, IrDA.\n- **LAN**: Wi-Fi семейства IEEE 802.11 (a/b/g/n/ac/ax).\n- **MAN**: WiMAX (IEEE 802.16) — устаревает; LTE в режиме фиксированного беспроводного доступа.\n- **WAN**: сотовые сети 3G (UMTS), 4G (LTE), 5G; спутниковая связь — геостационарная (GEO), средневысотная (MEO), низкоорбитальная (LEO — Starlink, OneWeb).", "Ключевые особенности беспроводной передачи, которые отличают её от проводной:\n- **Общая среда** → коллизии решаются по CSMA/CA (с предупреждением) вместо CSMA/CD (с обнаружением).\n- **Затухание сигнала** с расстоянием и многолучевое распространение — основа технологии MIMO и OFDM.\n- **Открытый эфир** → перехват сигнала тривиален, поэтому требуется шифрование на канальном уровне (WPA2, WPA3 для Wi-Fi; A5/x для GSM).\n- **Спектр** — ограниченный и регулируемый ресурс; ISM-диапазоны (2,4 ГГц, 5 ГГц) свободны, но переполнены."], "terms": [{"ru": "Компьютерная сеть", "en": "computer network", "df": "совокупность связанных каналами передачи данных автономных вычислительных устройств, способных обмениваться информацией"}, {"ru": "PAN", "en": "Personal Area Network", "df": "персональная сеть, охватывает несколько метров вокруг пользователя (Bluetooth, USB)"}, {"ru": "LAN", "en": "Local Area Network", "df": "локальная сеть, охватывает здание или кампус (Ethernet, Wi-Fi)"}, {"ru": "MAN", "en": "Metropolitan Area Network", "df": "муниципальная сеть, охватывает город (кабельное ТВ, WiMAX)"}, {"ru": "WAN", "en": "Wide Area Network", "df": "глобальная сеть, охватывает страну или континент (MPLS, оптические магистрали)"}, {"ru": "Широковещательная рассылка", "en": "broadcast", "df": "режим передачи, при котором сообщение доставляется всем узлам сети одновременно, фильтрация — на приёмнике по адресу"}, {"ru": "Коммутация пакетов", "en": "packet switching", "df": "метод передачи данных, при котором информация разбивается на пакеты и каждый маршрутизируется независимо"}, {"ru": "Коммутация каналов", "en": "circuit switching", "df": "метод передачи, при котором на время сеанса резервируется выделенный канал с гарантированной полосой"}, {"ru": "Топология", "en": "topology", "df": "физическая или логическая схема соединения узлов сети"}, {"ru": "Звёздная топология", "en": "star topology", "df": "все узлы подключены к одному центральному устройству (коммутатору)"}, {"ru": "Полная сетка", "en": "full mesh", "df": "топология, в которой каждый узел напрямую соединён с каждым; число каналов N(N−1)/2"}, {"ru": "Межсетевое соединение", "en": "internetwork / internet", "df": "объединение нескольких разнородных сетей в единую инфраструктуру через маршрутизаторы"}, {"ru": "«Последняя миля»", "en": "last mile", "df": "участок сети от точки присутствия провайдера до конечного абонента"}, {"ru": "Выделенный канал", "en": "leased line", "df": "арендуемый у оператора постоянный канал связи с гарантированной полосой пропускания"}, {"ru": "Широкополосное подключение", "en": "broadband connection", "df": "высокоскоростное подключение к Интернету (DSL, кабель, оптика)"}, {"ru": "Беспроводная сеть", "en": "wireless network", "df": "сеть, в которой данные передаются через электромагнитные волны без физических кабелей"}], "summary": ["По масштабу: PAN, LAN, MAN, WAN, internetwork", "Топологии: шина (bus), звезда (star), кольцо (ring), полная сетка (mesh), гибридная", "По технологии: broadcast vs packet switching", "Корпоративные: Ethernet, VPN, выделенные каналы", "Домашние: DSL, кабель, GPON + Wi-Fi роутер", "Беспроводные: Wi-Fi (802.11), Bluetooth, Zigbee, 3G/4G/5G"]}, {"n": 2, "title": "Персональные, локальные, муниципальные, глобальные сети. Объединение сетей. Иерархия сетевых протоколов. Ключевые аспекты создания компьютерной сети.", "paragraphs": ["<h3>Введение</h3>", "Компьютерные сети классифицируют прежде всего по **масштабу охвата** (geographic scale) — от персональных, охватывающих несколько метров вокруг пользователя, до глобальных, простирающихся на континенты. Масштаб напрямую определяет используемые технологии, типичные задержки, стоимость канала и модель административного управления. Поверх отдельных сетей строятся **объединённые сети** (internetworks), а взаимодействие реализуется через **многоуровневую иерархию протоколов** (protocol hierarchy), обеспечивающую модульность и сокрытие сложности.", "<h3>Сети по масштабу</h3>", "- **PAN** (Personal Area Network) — персональная сеть радиусом до 10 м. Используется для соединения устройств одного пользователя: смартфон с гарнитурой по Bluetooth (IEEE 802.15.1), клавиатура и мышь, носимые устройства (smartwatch), NFC-платежи. Типичные скорости — единицы Мбит/с.\n- **LAN** (Local Area Network) — локальная сеть, охватывает здание или кампус. Скорости 100 Мбит/с – 100 Гбит/с, задержка <1 мс, единое административное управление. Технологии: Ethernet (IEEE 802.3) для проводных сегментов, Wi-Fi (IEEE 802.11) для беспроводных. Низкая стоимость порта, отсутствие операторских тарифов.\n- **MAN** (Metropolitan Area Network) — городская сеть, охватывает десятки километров. Примеры: кабельное телевидение по DOCSIS, городские сети FTTH/PON, муниципальные Wi-Fi, точки обмена трафиком (IXP). Стандарт IEEE 802.16 (WiMAX) исторически рассматривался как MAN-технология.\n- **WAN** (Wide Area Network) — глобальная сеть от сотен до десятков тысяч километров. Использует арендованные каналы операторов: SDH/SONET, MPLS, оптические DWDM-магистрали, спутниковые линии. Высокая стоимость, более высокие задержки (десятки мс), сложное многооператорское взаимодействие.\n- **Интернет** — крупнейшая объединённая сеть, состоящая из десятков тысяч **автономных систем** (AS), связанных через BGP-маршрутизацию.", "<h3>Объединение сетей</h3>", "<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 320\" role=\"img\" aria-label=\"Объединение сетей через маршрутизаторы\"><rect x=\"0\" y=\"0\" width=\"640\" height=\"320\" fill=\"#1c2128\" rx=\"8\"/><text x=\"320\" y=\"28\" text-anchor=\"middle\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"16\" font-weight=\"700\">Объединение разнородных сетей</text><ellipse cx=\"110\" cy=\"160\" rx=\"80\" ry=\"55\" fill=\"none\" stroke=\"#58a6ff\" stroke-width=\"2\"/><text x=\"110\" y=\"135\" text-anchor=\"middle\" fill=\"#58a6ff\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"700\">LAN Ethernet</text><text x=\"110\" y=\"155\" text-anchor=\"middle\" fill=\"#7d8590\" font-family=\"sans-serif\" font-size=\"10\">Офис 1</text><circle cx=\"80\" cy=\"180\" r=\"4\" fill=\"#58a6ff\"/><circle cx=\"110\" cy=\"190\" r=\"4\" fill=\"#58a6ff\"/><circle cx=\"140\" cy=\"180\" r=\"4\" fill=\"#58a6ff\"/><ellipse cx=\"530\" cy=\"160\" rx=\"80\" ry=\"55\" fill=\"none\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"530\" y=\"135\" text-anchor=\"middle\" fill=\"#3fb950\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"700\">LAN Wi-Fi</text><text x=\"530\" y=\"155\" text-anchor=\"middle\" fill=\"#7d8590\" font-family=\"sans-serif\" font-size=\"10\">Офис 2</text><circle cx=\"500\" cy=\"180\" r=\"4\" fill=\"#3fb950\"/><circle cx=\"530\" cy=\"190\" r=\"4\" fill=\"#3fb950\"/><circle cx=\"560\" cy=\"180\" r=\"4\" fill=\"#3fb950\"/><rect x=\"220\" y=\"145\" width=\"40\" height=\"30\" fill=\"#e3b341\" rx=\"4\"/><text x=\"240\" y=\"165\" text-anchor=\"middle\" fill=\"#0d1117\" font-family=\"sans-serif\" font-size=\"11\" font-weight=\"700\">R1</text><rect x=\"380\" y=\"145\" width=\"40\" height=\"30\" fill=\"#e3b341\" rx=\"4\"/><text x=\"400\" y=\"165\" text-anchor=\"middle\" fill=\"#0d1117\" font-family=\"sans-serif\" font-size=\"11\" font-weight=\"700\">R2</text><line x1=\"190\" y1=\"160\" x2=\"220\" y2=\"160\" stroke=\"#e6edf3\" stroke-width=\"1.5\"/><line x1=\"260\" y1=\"160\" x2=\"380\" y2=\"160\" stroke=\"#e6edf3\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/><line x1=\"420\" y1=\"160\" x2=\"450\" y2=\"160\" stroke=\"#e6edf3\" stroke-width=\"1.5\"/><text x=\"320\" y=\"150\" text-anchor=\"middle\" fill=\"#7d8590\" font-family=\"sans-serif\" font-size=\"10\">WAN / MPLS / Интернет</text><text x=\"320\" y=\"190\" text-anchor=\"middle\" fill=\"#bc8cff\" font-family=\"sans-serif\" font-size=\"11\" font-style=\"italic\">маршрутизаторы L3 (IP)</text><text x=\"320\" y=\"260\" text-anchor=\"middle\" fill=\"#7d8590\" font-family=\"sans-serif\" font-size=\"11\">Туннель IPSec / GRE поверх Интернета</text><text x=\"320\" y=\"280\" text-anchor=\"middle\" fill=\"#7d8590\" font-family=\"sans-serif\" font-size=\"11\">или MPLS L3VPN для гарантированной полосы</text></svg><figcaption>Маршрутизаторы соединяют разнородные сети, скрывая различия канальных технологий за общим сетевым уровнем IP.</figcaption></figure>", "**Объединение сетей** (internetworking) — построение единой логической сети из нескольких разнородных физических сетей. Ключевые механизмы:\n- **Маршрутизаторы** (routers, L3) — пересылают пакеты между сетями на основе сетевых адресов (IP). Принимают решения по таблице маршрутизации, могут менять канальный заголовок при переходе между технологиями.\n- **Шлюзы прикладного уровня** (application gateways) — выполняют преобразование на L7 между несовместимыми стеками (например, SMTP ↔ X.400, SIP ↔ H.323).\n- **Туннелирование** (tunneling) — упаковка пакета одного протокола в полезную нагрузку другого: IPv6-over-IPv4 (6in4), GRE, IPSec, VXLAN. Позволяет «протянуть» исходный протокол через несовместимую транзитную сеть.\n- **Трансляция адресов** (NAT, Network Address Translation) — подмена IP-адресов и портов на границе сетей; основной способ совместного использования одного публичного IPv4-адреса несколькими хостами.\n- **Мосты** (bridges, L2) — соединяют сегменты одной канальной технологии, формируя единый широковещательный домен.", "<h3>Иерархия сетевых протоколов</h3>", "<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 340\" role=\"img\" aria-label=\"Иерархия протоколов и инкапсуляция\"><rect x=\"0\" y=\"0\" width=\"640\" height=\"340\" fill=\"#1c2128\" rx=\"8\"/><text x=\"320\" y=\"26\" text-anchor=\"middle\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"16\" font-weight=\"700\">Инкапсуляция: матрёшка заголовков</text><rect x=\"80\" y=\"60\" width=\"480\" height=\"40\" fill=\"none\" stroke=\"#bc8cff\" stroke-width=\"2\" rx=\"4\"/><text x=\"100\" y=\"85\" fill=\"#bc8cff\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"700\">L7</text><text x=\"320\" y=\"85\" text-anchor=\"middle\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"12\">HTTP / SMTP / DNS — данные приложения</text><rect x=\"100\" y=\"110\" width=\"460\" height=\"40\" fill=\"none\" stroke=\"#f778ba\" stroke-width=\"2\" rx=\"4\"/><text x=\"120\" y=\"135\" fill=\"#f778ba\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"700\">L4</text><rect x=\"150\" y=\"118\" width=\"60\" height=\"24\" fill=\"#f778ba\" opacity=\"0.3\" rx=\"2\"/><text x=\"180\" y=\"135\" text-anchor=\"middle\" fill=\"#f778ba\" font-family=\"sans-serif\" font-size=\"10\">TCP hdr</text><text x=\"400\" y=\"135\" text-anchor=\"middle\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"11\">сегмент: порт, seq, ack</text><rect x=\"120\" y=\"160\" width=\"440\" height=\"40\" fill=\"none\" stroke=\"#58a6ff\" stroke-width=\"2\" rx=\"4\"/><text x=\"140\" y=\"185\" fill=\"#58a6ff\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"700\">L3</text><rect x=\"170\" y=\"168\" width=\"60\" height=\"24\" fill=\"#58a6ff\" opacity=\"0.3\" rx=\"2\"/><text x=\"200\" y=\"185\" text-anchor=\"middle\" fill=\"#58a6ff\" font-family=\"sans-serif\" font-size=\"10\">IP hdr</text><text x=\"410\" y=\"185\" text-anchor=\"middle\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"11\">пакет: src/dst IP, TTL</text><rect x=\"140\" y=\"210\" width=\"420\" height=\"40\" fill=\"none\" stroke=\"#3fb950\" stroke-width=\"2\" rx=\"4\"/><text x=\"160\" y=\"235\" fill=\"#3fb950\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"700\">L2</text><rect x=\"190\" y=\"218\" width=\"60\" height=\"24\" fill=\"#3fb950\" opacity=\"0.3\" rx=\"2\"/><text x=\"220\" y=\"235\" text-anchor=\"middle\" fill=\"#3fb950\" font-family=\"sans-serif\" font-size=\"10\">MAC hdr</text><text x=\"420\" y=\"235\" text-anchor=\"middle\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"11\">кадр: src/dst MAC, FCS</text><rect x=\"160\" y=\"260\" width=\"400\" height=\"40\" fill=\"none\" stroke=\"#e3b341\" stroke-width=\"2\" rx=\"4\"/><text x=\"180\" y=\"285\" fill=\"#e3b341\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"700\">L1</text><text x=\"380\" y=\"285\" text-anchor=\"middle\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"11\">биты: напряжения, импульсы света, радиоволны</text><text x=\"320\" y=\"325\" text-anchor=\"middle\" fill=\"#7d8590\" font-family=\"sans-serif\" font-size=\"10\">Каждый уровень добавляет свой заголовок к PDU вышестоящего уровня</text></svg><figcaption>Принцип инкапсуляции: PDU каждого уровня становится полезной нагрузкой для уровня ниже, образуя «луковицу» заголовков.</figcaption></figure>", "- **Многоуровневая архитектура** (layered architecture) — функции сети разбиты на уровни; каждый уровень использует услуги нижнего и предоставляет услуги верхнему. Между уровнями определён **интерфейс** (interface), внутри уровня — **протокол**, по которому общаются одноимённые уровни на разных узлах (одноранговые сущности, peers).\n- **Стек протоколов** (protocol stack) — конкретный набор протоколов всех уровней, например TCP/IP-стек (Ethernet → IP → TCP → HTTP).\n- **PDU** (Protocol Data Unit) — единица данных уровня; на разных уровнях имеет разные имена: бит (L1), кадр (L2, frame), пакет (L3, packet), сегмент/датаграмма (L4, segment/datagram), сообщение (L7).\n- **Инкапсуляция** (encapsulation) — при передаче вниз каждый уровень добавляет собственный **заголовок** (header), иногда **концевик** (trailer). При приёме — наоборот, обратная **декапсуляция**.\n- **Принцип сквозной аргументации** (end-to-end principle) — функции, требующие знания о приложении (например, гарантия доставки), должны реализовываться на концах, а не внутри сети.", "<h3>Ключевые аспекты построения сети</h3>", "При проектировании компьютерной сети учитываются:\n- **Надёжность** (reliability) — устойчивость к сбоям каналов и узлов; обеспечивается избыточностью путей, контрольными суммами, повторными передачами.\n- **Масштабируемость** (scalability) — способность расти без переработки архитектуры; обеспечивается иерархической адресацией (CIDR), агрегацией маршрутов, иерархией коммутаторов.\n- **Качество обслуживания** (QoS, Quality of Service) — гарантии полосы, задержки, джиттера, потерь; механизмы DiffServ, IntServ, приоритетные очереди, traffic shaping.\n- **Безопасность** (security) — конфиденциальность (шифрование TLS, IPSec), целостность (HMAC, FCS), аутентификация (802.1X, сертификаты), доступность (защита от DDoS).\n- **Управляемость** (manageability) — мониторинг (SNMP, NetFlow, telemetry), централизованное управление (SDN), автоматизация конфигурирования.\n- **Эффективность** (efficiency) — оптимальное использование канала (статистическое мультиплексирование пакетной коммутации), низкие накладные расходы заголовков.\n- **Совместимость и открытые стандарты** — взаимодействие оборудования разных производителей через документированные протоколы (RFC, IEEE 802)."], "terms": [{"ru": "PAN", "en": "Personal Area Network", "df": "персональная сеть; охватывает несколько метров вокруг пользователя (Bluetooth, NFC)"}, {"ru": "LAN", "en": "Local Area Network", "df": "локальная вычислительная сеть; охватывает здание или кампус (Ethernet, Wi-Fi)"}, {"ru": "MAN", "en": "Metropolitan Area Network", "df": "муниципальная сеть; охватывает город (DOCSIS, FTTH)"}, {"ru": "WAN", "en": "Wide Area Network", "df": "глобальная сеть; охватывает страну или континент (MPLS, SDH)"}, {"ru": "Объединение сетей", "en": "internetworking", "df": "построение единой логической сети из нескольких разнородных физических сетей"}, {"ru": "Маршрутизатор", "en": "router", "df": "сетевое устройство уровня 3, обеспечивающее передачу пакетов между разными сетями по IP-адресам"}, {"ru": "Шлюз", "en": "gateway", "df": "устройство, обеспечивающее преобразование протоколов при соединении сетей с различными стеками"}, {"ru": "Туннелирование", "en": "tunneling", "df": "инкапсуляция пакетов одного протокола внутри другого для передачи через несовместимую сеть"}, {"ru": "NAT", "en": "Network Address Translation", "df": "трансляция сетевых адресов на границе сетей"}, {"ru": "Уровень", "en": "layer", "df": "функциональный слой в многоуровневой архитектуре сети"}, {"ru": "Протокол", "en": "protocol", "df": "формализованный набор правил взаимодействия одноимённых уровней на разных узлах"}, {"ru": "Интерфейс", "en": "interface", "df": "границу между соседними уровнями на одном узле"}, {"ru": "Стек протоколов", "en": "protocol stack", "df": "конкретный набор протоколов, реализующих все уровни модели"}, {"ru": "PDU", "en": "Protocol Data Unit", "df": "единица данных протокола на конкретном уровне"}, {"ru": "Инкапсуляция", "en": "encapsulation", "df": "добавление служебного заголовка к данным на каждом уровне стека при передаче вниз"}, {"ru": "Одноранговая сущность", "en": "peer entity", "df": "реализация одного и того же уровня на разных узлах, взаимодействующая по протоколу"}, {"ru": "Качество обслуживания", "en": "QoS, Quality of Service", "df": "механизмы управления приоритетами трафика для обеспечения требуемых характеристик передачи"}, {"ru": "Принцип сквозной аргументации", "en": "end-to-end principle", "df": "концепция, согласно которой функции, требующие знаний о приложении, реализуются на концах соединения, а не в сети"}], "summary": ["PAN ~10 м (Bluetooth), LAN — здание (100 Мбит-100 Гбит)", "MAN — город (WiMAX, кабельное ТВ), WAN — страны", "Internetworking: роутеры (L3) + шлюзы (gateway) + IP + туннелирование + NAT", "Стек протоколов: инкапсуляция (заголовок на каждом уровне)", "Аспекты сети: надёжность, масштабируемость, безопасность", "QoS — гарантия задержки/полосы; управляемость"]}, {"n": 3, "title": "Службы на основе соединений и службы без установления соединения. Примитивы служб. Службы и протоколы.", "paragraphs": ["<h3>Определение службы</h3>", "**Служба** (service) — формальный набор операций (примитивов), которые нижний уровень многоуровневой архитектуры предоставляет вышестоящему уровню. Служба определяет **что** делает уровень, скрывая, **как** именно это реализовано. Доступ к службе осуществляется через **точку доступа к службе** (SAP, Service Access Point), уникально идентифицируемую внутри узла: например, в стеке TCP/IP роль SAP для транспортного уровня играет пара (IP-адрес, номер порта). Между соседними уровнями передаётся **IDU** (Interface Data Unit), которая состоит из управляющей информации интерфейса и собственно **SDU** (Service Data Unit) — полезной нагрузки, передаваемой через службу.", "<h3>Два класса служб</h3>", "<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" aria-label=\"Сравнение служб с соединением и без соединения\"><rect x=\"0\" y=\"0\" width=\"640\" height=\"360\" fill=\"#1c2128\" rx=\"8\"/><text x=\"160\" y=\"26\" text-anchor=\"middle\" fill=\"#58a6ff\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"700\">Connection-oriented (TCP)</text><text x=\"480\" y=\"26\" text-anchor=\"middle\" fill=\"#e3b341\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"700\">Connectionless (UDP/IP)</text><line x1=\"60\" y1=\"50\" x2=\"60\" y2=\"340\" stroke=\"#58a6ff\" stroke-width=\"1.5\"/><line x1=\"260\" y1=\"50\" x2=\"260\" y2=\"340\" stroke=\"#58a6ff\" stroke-width=\"1.5\"/><text x=\"60\" y=\"48\" text-anchor=\"middle\" fill=\"#7d8590\" font-family=\"sans-serif\" font-size=\"10\">A</text><text x=\"260\" y=\"48\" text-anchor=\"middle\" fill=\"#7d8590\" font-family=\"sans-serif\" font-size=\"10\">B</text><line x1=\"60\" y1=\"70\" x2=\"260\" y2=\"90\" stroke=\"#58a6ff\" stroke-width=\"1.2\" marker-end=\"url(#a1)\"/><text x=\"160\" y=\"75\" text-anchor=\"middle\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"10\">SYN</text><line x1=\"260\" y1=\"100\" x2=\"60\" y2=\"120\" stroke=\"#58a6ff\" stroke-width=\"1.2\"/><text x=\"160\" y=\"105\" text-anchor=\"middle\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"10\">SYN+ACK</text><line x1=\"60\" y1=\"130\" x2=\"260\" y2=\"150\" stroke=\"#58a6ff\" stroke-width=\"1.2\"/><text x=\"160\" y=\"135\" text-anchor=\"middle\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"10\">ACK (соединение)</text><line x1=\"60\" y1=\"170\" x2=\"260\" y2=\"190\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"160\" y=\"175\" text-anchor=\"middle\" fill=\"#3fb950\" font-family=\"sans-serif\" font-size=\"10\">DATA seq=1</text><line x1=\"260\" y1=\"200\" x2=\"60\" y2=\"220\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"160\" y=\"205\" text-anchor=\"middle\" fill=\"#3fb950\" font-family=\"sans-serif\" font-size=\"10\">ACK</text><line x1=\"60\" y1=\"240\" x2=\"260\" y2=\"260\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"160\" y=\"245\" text-anchor=\"middle\" fill=\"#3fb950\" font-family=\"sans-serif\" font-size=\"10\">DATA seq=2</text><line x1=\"60\" y1=\"285\" x2=\"260\" y2=\"305\" stroke=\"#f778ba\" stroke-width=\"1.2\"/><text x=\"160\" y=\"290\" text-anchor=\"middle\" fill=\"#f778ba\" font-family=\"sans-serif\" font-size=\"10\">FIN (разрыв)</text><line x1=\"380\" y1=\"50\" x2=\"380\" y2=\"340\" stroke=\"#e3b341\" stroke-width=\"1.5\"/><line x1=\"580\" y1=\"50\" x2=\"580\" y2=\"340\" stroke=\"#e3b341\" stroke-width=\"1.5\"/><text x=\"380\" y=\"48\" text-anchor=\"middle\" fill=\"#7d8590\" font-family=\"sans-serif\" font-size=\"10\">A</text><text x=\"580\" y=\"48\" text-anchor=\"middle\" fill=\"#7d8590\" font-family=\"sans-serif\" font-size=\"10\">B</text><line x1=\"380\" y1=\"80\" x2=\"580\" y2=\"105\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"480\" y=\"85\" text-anchor=\"middle\" fill=\"#3fb950\" font-family=\"sans-serif\" font-size=\"10\">DATAGRAM 1</text><line x1=\"380\" y1=\"130\" x2=\"580\" y2=\"170\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"480\" y=\"138\" text-anchor=\"middle\" fill=\"#3fb950\" font-family=\"sans-serif\" font-size=\"10\">DATAGRAM 2 (другой путь)</text><line x1=\"380\" y1=\"200\" x2=\"580\" y2=\"215\" stroke=\"#ff7b72\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/><text x=\"480\" y=\"208\" text-anchor=\"middle\" fill=\"#ff7b72\" font-family=\"sans-serif\" font-size=\"10\">DATAGRAM 3 — потеряна</text><line x1=\"380\" y1=\"245\" x2=\"580\" y2=\"270\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"480\" y=\"253\" text-anchor=\"middle\" fill=\"#3fb950\" font-family=\"sans-serif\" font-size=\"10\">DATAGRAM 4</text><text x=\"480\" y=\"320\" text-anchor=\"middle\" fill=\"#7d8590\" font-family=\"sans-serif\" font-size=\"10\">нет рукопожатия, нет подтверждений</text></svg><figcaption>Слева — служба с установлением соединения: рукопожатие, упорядоченная доставка, подтверждения, разрыв. Справа — служба без соединения: датаграммы независимы, потеря не восстанавливается.</figcaption></figure>", "- **Служба с установлением соединения** (connection-oriented service) — модель телефонного звонка. Состоит из трёх фаз: установление соединения (рукопожатие), передача данных, разрыв соединения. Поток байтов сохраняет порядок, обе стороны хранят **состояние** (state) соединения. Примеры: TCP, виртуальные каналы X.25, MPLS LSP, ATM VC.\n- **Служба без установления соединения** (connectionless service) — модель почтового отправления. Каждое сообщение (**датаграмма**, datagram) содержит полный адрес и маршрутизируется независимо; разные датаграммы могут идти разными путями и прибывать не по порядку. Примеры: IP, UDP, IPX.", "Каждый из этих классов делится по гарантиям доставки:\n- **Надёжная служба** (reliable service) — гарантирует доставку всех данных без потерь, дубликатов и нарушения порядка через подтверждения (ACK) и повторные передачи. Реализация требует буферов и таймеров (TCP).\n- **Ненадёжная служба** (unreliable / best-effort service) — отправляет данные без подтверждений; потери компенсируются (если нужно) на верхних уровнях или приложением. Примеры: UDP, IP. Подходит для трафика, чувствительного к задержке (VoIP, видеоконференции), где повторная передача бесполезна.", "Типичные комбинации:\n- **Надёжная с соединением** — передача файлов, веб (TCP, HTTP).\n- **Надёжная без соединения** — заказное письмо: подтверждение есть, но соединение не нужно (редко используется на практике).\n- **Ненадёжная без соединения** — UDP, обычные дейтаграммы IP, трафик реального времени.\n- **Подтверждённая дейтаграмма** (acknowledged datagram) — SMS, некоторые протоколы IoT.", "<h3>Примитивы служб</h3>", "**Примитив службы** (service primitive) — элементарная операция, через которую вышестоящий уровень обращается к нижестоящему. Различают четыре типа примитивов:\n- **Request** — запрос от пользователя сервиса к поставщику (например, T-CONNECT.request).\n- **Indication** — уведомление противоположной стороне о входящем запросе (T-CONNECT.indication).\n- **Response** — ответ принимающей стороны (T-CONNECT.response).\n- **Confirm** — подтверждение исходному запрашивающему (T-CONNECT.confirm).", "Типичный набор примитивов сокет-подобного интерфейса для службы с соединением:\n- **LISTEN** — сервер готов принимать соединения (блокирует до прихода запроса).\n- **CONNECT** — клиент устанавливает соединение с сервером.\n- **ACCEPT** — сервер принимает входящий запрос.\n- **SEND** — передать блок данных по установленному соединению.\n- **RECEIVE** — получить данные (блокирует до прихода).\n- **DISCONNECT** — закрыть соединение.", "Для службы без соединения достаточно SEND и RECEIVE с явным адресом получателя в каждом примитиве (sendto/recvfrom в BSD-сокетах).", "<h3>Служба и протокол — два разных понятия</h3>", "| Аспект | Служба (service) | Протокол (protocol) |\n|---|---|---|\n| Направление | вертикально, между уровнями одного узла | горизонтально, между одноимёнными уровнями разных узлов |\n| Что описывает | **что** делает уровень — набор операций | **как** работает уровень — формат сообщений и правила |\n| Видимость | видна только соседним уровням | видна одноранговым сущностям (peers) |\n| Аналогия | API библиотеки | проводной протокол, формат сообщений |\n| Пример | TCP-сокеты (BSD API) | формат TCP-сегмента, состояния SYN_SENT, ESTABLISHED |", "Одна и та же служба может быть реализована разными протоколами (например, надёжная доставка реализуется TCP, SCTP или QUIC); и наоборот, один протокол может предоставлять разные службы (TCP даёт байтовый поток, а с использованием PSH-флага — границы сообщений)."], "terms": [{"ru": "Служба", "en": "service", "df": "набор операций, предоставляемых уровнем своему верхнему соседу; описывает **что** делает уровень"}, {"ru": "Протокол", "en": "protocol", "df": "формальный набор правил и форматов сообщений между одноранговыми сущностями разных узлов; описывает **как** работает уровень"}, {"ru": "SAP", "en": "Service Access Point", "df": "точка доступа к службе; адресуемая граница между уровнями на одном узле"}, {"ru": "SDU", "en": "Service Data Unit", "df": "блок данных, передаваемый через интерфейс службы; полезная нагрузка для протокола"}, {"ru": "PDU", "en": "Protocol Data Unit", "df": "единица данных протокола; SDU плюс заголовок данного уровня"}, {"ru": "Служба с установлением соединения", "en": "connection-oriented service", "df": "служба с фазами установления, передачи и разрыва соединения, сохраняющая состояние"}, {"ru": "Служба без установления соединения", "en": "connectionless service", "df": "служба, где каждое сообщение (датаграмма) маршрутизируется независимо"}, {"ru": "Соединение", "en": "connection", "df": "логический канал связи между двумя сторонами с сохранением состояния и упорядоченной доставкой"}, {"ru": "Датаграмма", "en": "datagram", "df": "самодостаточный пакет с полным адресом, маршрутизируемый независимо от других"}, {"ru": "Примитив службы", "en": "service primitive", "df": "элементарная операция интерфейса (LISTEN, CONNECT, SEND, RECEIVE и др.)"}, {"ru": "Надёжная служба", "en": "reliable service", "df": "служба с гарантией доставки всех данных без потерь и нарушения порядка через подтверждения"}, {"ru": "Ненадёжная служба", "en": "unreliable / best-effort service", "df": "служба без гарантий доставки, без подтверждений и повторных передач"}, {"ru": "TCP", "en": "Transmission Control Protocol", "df": "транспортный протокол, реализующий надёжную байт-потоковую службу с установлением соединения"}, {"ru": "UDP", "en": "User Datagram Protocol", "df": "транспортный протокол, реализующий ненадёжную службу без установления соединения"}, {"ru": "Одноранговая сущность", "en": "peer entity", "df": "реализация одного и того же уровня на разных узлах, взаимодействующая по протоколу"}], "summary": ["Connection-oriented (TCP) = телефон: setup-data-disconnect", "Connectionless (UDP/IP) = почта: датаграммы независимо", "Служба = вертикальный интерфейс между уровнями", "Протокол = горизонтальное правило между узлами", "SAP — точка доступа к службе", "Примитивы: LISTEN, CONNECT, ACCEPT, SEND, RECEIVE, DISCONNECT"]}, {"n": 4, "title": "Эталонные модели ISO и TCP/IP. Сравнение эталонных моделей OSI и TCP. Критика моделей. Примеры сетей.", "paragraphs": ["<h3>Введение</h3>", "**Эталонная модель** (reference model) — концептуальная схема, разбивающая сетевое взаимодействие на иерархию уровней с чётко определёнными функциями и интерфейсами. В телекоммуникациях исторически сложились две основные модели: **OSI** (Open Systems Interconnection) — нормативная семиуровневая модель ISO, и **TCP/IP** — четырёхуровневая модель, фактически описывающая стек протоколов Интернета. OSI создавалась «сверху вниз» как теоретический каркас до появления протоколов; TCP/IP — «снизу вверх» как описание уже работающих RFC-протоколов.", "<h3>Семиуровневая модель OSI</h3>", "<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 400\" role=\"img\" aria-label=\"Сравнение моделей OSI и TCP/IP\"><rect x=\"0\" y=\"0\" width=\"640\" height=\"400\" fill=\"#1c2128\" rx=\"8\"/><text x=\"160\" y=\"28\" text-anchor=\"middle\" fill=\"#58a6ff\" font-family=\"sans-serif\" font-size=\"16\" font-weight=\"700\">OSI — 7 уровней</text><text x=\"480\" y=\"28\" text-anchor=\"middle\" fill=\"#3fb950\" font-family=\"sans-serif\" font-size=\"16\" font-weight=\"700\">TCP/IP — 4 уровня</text><rect x=\"40\" y=\"50\" width=\"240\" height=\"40\" fill=\"#bc8cff\" opacity=\"0.25\" stroke=\"#bc8cff\" rx=\"4\"/><text x=\"60\" y=\"75\" fill=\"#bc8cff\" font-family=\"sans-serif\" font-size=\"11\" font-weight=\"700\">L7 Application</text><text x=\"260\" y=\"75\" text-anchor=\"end\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"10\">HTTP, SMTP, DNS</text><rect x=\"40\" y=\"95\" width=\"240\" height=\"40\" fill=\"#bc8cff\" opacity=\"0.15\" stroke=\"#bc8cff\" rx=\"4\"/><text x=\"60\" y=\"120\" fill=\"#bc8cff\" font-family=\"sans-serif\" font-size=\"11\" font-weight=\"700\">L6 Presentation</text><text x=\"260\" y=\"120\" text-anchor=\"end\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"10\">TLS, MIME, ASN.1</text><rect x=\"40\" y=\"140\" width=\"240\" height=\"40\" fill=\"#bc8cff\" opacity=\"0.1\" stroke=\"#bc8cff\" rx=\"4\"/><text x=\"60\" y=\"165\" fill=\"#bc8cff\" font-family=\"sans-serif\" font-size=\"11\" font-weight=\"700\">L5 Session</text><text x=\"260\" y=\"165\" text-anchor=\"end\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"10\">RPC, NetBIOS</text><rect x=\"40\" y=\"185\" width=\"240\" height=\"40\" fill=\"#f778ba\" opacity=\"0.25\" stroke=\"#f778ba\" rx=\"4\"/><text x=\"60\" y=\"210\" fill=\"#f778ba\" font-family=\"sans-serif\" font-size=\"11\" font-weight=\"700\">L4 Transport</text><text x=\"260\" y=\"210\" text-anchor=\"end\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"10\">TCP, UDP</text><rect x=\"40\" y=\"230\" width=\"240\" height=\"40\" fill=\"#58a6ff\" opacity=\"0.25\" stroke=\"#58a6ff\" rx=\"4\"/><text x=\"60\" y=\"255\" fill=\"#58a6ff\" font-family=\"sans-serif\" font-size=\"11\" font-weight=\"700\">L3 Network</text><text x=\"260\" y=\"255\" text-anchor=\"end\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"10\">IP, ICMP, OSPF</text><rect x=\"40\" y=\"275\" width=\"240\" height=\"40\" fill=\"#3fb950\" opacity=\"0.25\" stroke=\"#3fb950\" rx=\"4\"/><text x=\"60\" y=\"300\" fill=\"#3fb950\" font-family=\"sans-serif\" font-size=\"11\" font-weight=\"700\">L2 Data link</text><text x=\"260\" y=\"300\" text-anchor=\"end\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"10\">Ethernet MAC, PPP</text><rect x=\"40\" y=\"320\" width=\"240\" height=\"40\" fill=\"#e3b341\" opacity=\"0.25\" stroke=\"#e3b341\" rx=\"4\"/><text x=\"60\" y=\"345\" fill=\"#e3b341\" font-family=\"sans-serif\" font-size=\"11\" font-weight=\"700\">L1 Physical</text><text x=\"260\" y=\"345\" text-anchor=\"end\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"10\">кабель, оптика, радио</text><rect x=\"360\" y=\"50\" width=\"240\" height=\"135\" fill=\"#bc8cff\" opacity=\"0.2\" stroke=\"#bc8cff\" rx=\"4\"/><text x=\"380\" y=\"118\" fill=\"#bc8cff\" font-family=\"sans-serif\" font-size=\"11\" font-weight=\"700\">Application</text><text x=\"580\" y=\"118\" text-anchor=\"end\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"10\">HTTP, SMTP, DNS, TLS</text><rect x=\"360\" y=\"190\" width=\"240\" height=\"40\" fill=\"#f778ba\" opacity=\"0.25\" stroke=\"#f778ba\" rx=\"4\"/><text x=\"380\" y=\"215\" fill=\"#f778ba\" font-family=\"sans-serif\" font-size=\"11\" font-weight=\"700\">Transport</text><text x=\"580\" y=\"215\" text-anchor=\"end\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"10\">TCP, UDP</text><rect x=\"360\" y=\"235\" width=\"240\" height=\"40\" fill=\"#58a6ff\" opacity=\"0.25\" stroke=\"#58a6ff\" rx=\"4\"/><text x=\"380\" y=\"260\" fill=\"#58a6ff\" font-family=\"sans-serif\" font-size=\"11\" font-weight=\"700\">Internet</text><text x=\"580\" y=\"260\" text-anchor=\"end\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"10\">IP, ICMP</text><rect x=\"360\" y=\"280\" width=\"240\" height=\"80\" fill=\"#e3b341\" opacity=\"0.2\" stroke=\"#e3b341\" rx=\"4\"/><text x=\"380\" y=\"325\" fill=\"#e3b341\" font-family=\"sans-serif\" font-size=\"11\" font-weight=\"700\">Link / Host-to-net</text><text x=\"580\" y=\"325\" text-anchor=\"end\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"10\">Ethernet, Wi-Fi, PPP</text><text x=\"320\" y=\"392\" text-anchor=\"middle\" fill=\"#7d8590\" font-family=\"sans-serif\" font-size=\"10\">L5–L7 OSI ↔ один Application TCP/IP; L1+L2 OSI ↔ один Link TCP/IP</text></svg><figcaption>Семь уровней OSI и их соответствие четырём уровням TCP/IP. Прикладной уровень TCP/IP вбирает функции трёх верхних уровней OSI; канальный уровень не разделяется на физический и канальный.</figcaption></figure>", "Модель OSI разработана **ISO** в 1984 г. (стандарт ISO 7498):\n- **L1 — Физический уровень** (physical) — передача отдельных битов по физической среде: уровни напряжений, импульсы света, радиоволны; характеристики кабеля и разъёмов. Стандарты: RS-232, V.35, 1000BASE-T PHY.\n- **L2 — Канальный уровень** (data link) — передача **кадров** между соседними узлами одной сети. Делится на подуровни **LLC** (Logical Link Control) и **MAC** (Media Access Control). Обнаружение ошибок (CRC), управление доступом к среде, физическая адресация. Примеры: Ethernet, PPP, HDLC.\n- **L3 — Сетевой уровень** (network) — маршрутизация **пакетов** между разными сетями. Логическая адресация (IP), фрагментация, протоколы маршрутизации. Примеры: IP, ICMP, OSPF, BGP.\n- **L4 — Транспортный уровень** (transport) — сквозная доставка данных между процессами; мультиплексирование по портам, контроль потока, надёжность (TCP), скорость (UDP).\n- **L5 — Сеансовый уровень** (session) — организация диалогов: установление сеансов, синхронизация, контрольные точки, восстановление после сбоя. Примеры: RPC, NetBIOS.\n- **L6 — Уровень представления** (presentation) — синтаксис данных: преобразование форматов (ASCII↔EBCDIC, big-endian↔little-endian), сжатие, шифрование. Стандарт ASN.1.\n- **L7 — Прикладной уровень** (application) — собственно протоколы приложений: HTTP, FTP, SMTP, DNS, SNMP.", "<h3>Четырёхуровневая модель TCP/IP</h3>", "Описана в RFC 1122. Складывалась эволюционно из проекта ARPANET (1970-е):\n- **Link / Host-to-network** — объединяет физический и канальный уровни OSI; конкретные технологии (Ethernet, Wi-Fi, PPP) не специфицируются моделью, лишь декларируется требование «доставить IP-пакет следующему узлу».\n- **Internet** (сетевой) — основной уровень; единственный протокол — **IP** (Internet Protocol). Только служба без установления соединения. Дополняется ICMP, ARP, IGMP.\n- **Transport** (транспортный) — два протокола: **TCP** (надёжный, с соединением) и **UDP** (ненадёжный, без соединения). Позже добавлены SCTP, QUIC.\n- **Application** (прикладной) — все верхние функции в одном слое: протоколы приложений плюс функции сеанса и представления OSI (например, TLS — это «представление» в OSI, но реализуется как библиотека приложения).", "Часто рисуют расширенный вариант с разделением Link на Physical и Data Link — получается «гибридная» пятиуровневая модель (используется в учебнике Таненбаума).", "<h3>Сравнение OSI и TCP/IP</h3>", "| Критерий | OSI | TCP/IP |\n|---|---|---|\n| Число уровней | 7 | 4 (или 5 в гибридной форме) |\n| Происхождение | теоретическая, нормативная | описательная, родилась из работающих протоколов |\n| Чёткое разделение служба/интерфейс/протокол | да, явно зафиксировано | смешано, нечёткое |\n| Сетевой уровень | оба режима (connection-oriented и connectionless) | только connectionless (IP) |\n| Транспортный уровень | оба режима | оба (TCP / UDP) |\n| Сеансовый и Presentation | отдельные L5, L6 | отсутствуют, функции в Application |\n| Канальный/физический | разделены | объединены в Link |\n| Универсальность | стек-независимая | привязана к IP-стеку |\n| Распространение протоколов | реальных нет (X.400, X.500 проиграли) | глобальный стандарт Интернета |", "<h3>Критика моделей</h3>", "**Критика OSI:**\n- **Плохой выбор времени** — стандарт появился, когда TCP/IP уже доминировал в исследовательских сетях, в коммерческих продуктах не закрепился.\n- **Плохая технология** — слишком сложная и многословная спецификация; например, отдельные уровни сеанса и представления оказались почти не востребованы.\n- **Плохие реализации** — первые OSI-стеки были громоздкими и медленными по сравнению с компактными реализациями TCP/IP.\n- **Политика** — продвигалась европейскими телеком-монополиями и министерствами, что вызывало сопротивление инженерного сообщества.", "**Критика TCP/IP:**\n- **Не разделяет понятия службы, интерфейса и протокола** — поэтому неудобна как общая методология описания произвольных сетей.\n- **Привязана к одному стеку** — модель описывает не «сетевые архитектуры вообще», а конкретный набор IP-протоколов.\n- **Уровень Host-to-network — не настоящий уровень**, а интерфейс к нижележащей сети; объединяет очень разнородные вещи (от витой пары до спутникового канала).\n- **Отсутствие сеансового и представления уровней** — функции «расплываются» по приложениям и библиотекам (TLS, ASN.1, кодирование).", "<h3>Итог и сферы применения</h3>", "На практике используется **гибридный подход**: для обучения и обсуждения архитектуры берётся семиуровневая нумерация OSI (откуда термины «L2-коммутатор», «L7-балансировщик»), а реально работающий стек — это TCP/IP. Современные сети редко вписываются в строгую иерархию: туннелирование (IP-в-IP, VXLAN), MPLS (между L2 и L3, «уровень 2,5»), QUIC (объединяет L4 и часть L7) — всё это нарушает чистоту любой эталонной модели, но обе модели по-прежнему служат полезным языком для проектирования и преподавания."], "terms": [{"ru": "Эталонная модель", "en": "reference model", "df": "концептуальная схема разбиения сетевого взаимодействия на уровни с определёнными функциями и интерфейсами"}, {"ru": "OSI", "en": "Open Systems Interconnection", "df": "эталонная семиуровневая модель ISO (ISO 7498), нормативная архитектура взаимодействия открытых систем"}, {"ru": "TCP/IP", "en": "Transmission Control Protocol / Internet Protocol", "df": "четырёхуровневая модель и одноимённый стек протоколов Интернета (RFC 1122)"}, {"ru": "Физический уровень", "en": "physical layer, L1", "df": "передача отдельных битов по физической среде, характеристики кабелей и сигналов"}, {"ru": "Канальный уровень", "en": "data link layer, L2", "df": "передача кадров между соседними узлами одной сети, обнаружение ошибок, управление доступом"}, {"ru": "MAC", "en": "Media Access Control", "df": "нижний подуровень L2, отвечающий за управление доступом к разделяемой среде"}, {"ru": "LLC", "en": "Logical Link Control", "df": "верхний подуровень L2, обеспечивающий единый интерфейс к сетевому уровню"}, {"ru": "Сетевой уровень", "en": "network layer, L3", "df": "маршрутизация пакетов между сетями, логическая адресация"}, {"ru": "Транспортный уровень", "en": "transport layer, L4", "df": "сквозная доставка данных между процессами, мультиплексирование по портам"}, {"ru": "Сеансовый уровень", "en": "session layer, L5", "df": "управление сеансами связи: установление, синхронизация, восстановление"}, {"ru": "Уровень представления", "en": "presentation layer, L6", "df": "преобразование форматов данных, сжатие, шифрование"}, {"ru": "Прикладной уровень", "en": "application layer, L7 OSI / L4 TCP/IP", "df": "протоколы приложений (HTTP, FTP, DNS, SMTP)"}, {"ru": "ISO", "en": "International Organization for Standardization", "df": "Международная организация по стандартизации, разработавшая модель OSI"}], "summary": ["OSI = 7 уровней (нормативная, ISO) vs TCP/IP = 4 (описательная)", "L1 физический — биты, среда, разъёмы, напряжения", "L2 канальный — кадры, MAC, обнаружение ошибок", "L3 сетевой — пакеты, маршрутизация, IP-адресация", "L4 транспортный — сегменты, TCP/UDP, сквозная доставка", "L5 сеансовый — сеансы, синхронизация, контрольные точки", "L6 представления — кодирование, сжатие, шифрование", "L7 прикладной — HTTP, FTP, SMTP, DNS", "TCP/IP: link, internet, transport, application (нет L5/L6)", "Критика OSI: сложная, L5+L6 пусты, опоздала", "Критика TCP/IP: не описывает не-IP сети, слабая модель", "OSI — для обучения, TCP/IP — де-факто стандарт"]}, {"n": 5, "title": "Примеры сетей: Интернет, мобильная телефонная сеть, беспроводные ЛВС: 802.11, RFID и сенсорные сети.", "paragraphs": ["<h3>Введение</h3>", "Несмотря на общую теоретическую базу, реальные сети сильно различаются по архитектуре, технологиям и задачам. Ниже рассматриваются пять характерных примеров, охватывающих разные масштабы (от персонального RFID-считывания до глобального Интернета) и разные типы трафика (от голосового потока до пакетов в несколько байтов).", "<h3>Интернет</h3>", "<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 340\" role=\"img\" aria-label=\"Иерархия Интернета: Tier-1, Tier-2, ISP, абоненты\"><rect x=\"0\" y=\"0\" width=\"640\" height=\"340\" fill=\"#1c2128\" rx=\"8\"/><text x=\"320\" y=\"26\" text-anchor=\"middle\" fill=\"#e6edf3\" font-family=\"sans-serif\" font-size=\"16\" font-weight=\"700\">Иерархия Интернета</text><ellipse cx=\"320\" cy=\"80\" rx=\"180\" ry=\"32\" fill=\"none\" stroke=\"#ff7b72\" stroke-width=\"2\"/><text x=\"320\" y=\"78\" text-anchor=\"middle\" fill=\"#ff7b72\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"700\">Tier-1 backbone</text><text x=\"320\" y=\"95\" text-anchor=\"middle\" fill=\"#7d8590\" font-family=\"sans-serif\" font-size=\"10\">Level 3, NTT, Cogent — peering без оплаты</text><ellipse cx=\"180\" cy=\"170\" rx=\"110\" ry=\"28\" fill=\"none\" stroke=\"#e3b341\" stroke-width=\"2\"/><text x=\"180\" y=\"170\" text-anchor=\"middle\" fill=\"#e3b341\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"700\">Tier-2 (региональные)</text><text x=\"180\" y=\"186\" text-anchor=\"middle\" fill=\"#7d8590\" font-family=\"sans-serif\" font-size=\"9\">покупают transit у Tier-1</text><ellipse cx=\"460\" cy=\"170\" rx=\"110\" ry=\"28\" fill=\"none\" stroke=\"#bc8cff\" stroke-width=\"2\"/><text x=\"460\" y=\"170\" text-anchor=\"middle\" fill=\"#bc8cff\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"700\">IXP — обмен трафиком</text><text x=\"460\" y=\"186\" text-anchor=\"middle\" fill=\"#7d8590\" font-family=\"sans-serif\" font-size=\"9\">MSK-IX, DE-CIX, AMS-IX</text><line x1=\"240\" y1=\"100\" x2=\"180\" y2=\"142\" stroke=\"#e6edf3\" stroke-width=\"1\"/><line x1=\"400\" y1=\"100\" x2=\"460\" y2=\"142\" stroke=\"#e6edf3\" stroke-width=\"1\"/><ellipse cx=\"100\" cy=\"250\" rx=\"70\" ry=\"22\" fill=\"none\" stroke=\"#58a6ff\" stroke-width=\"2\"/><text x=\"100\" y=\"254\" text-anchor=\"middle\" fill=\"#58a6ff\" font-family=\"sans-serif\" font-size=\"11\" font-weight=\"700\">ISP (доступ)</text><ellipse cx=\"280\" cy=\"250\" rx=\"70\" ry=\"22\" fill=\"none\" stroke=\"#58a6ff\" stroke-width=\"2\"/><text x=\"280\" y=\"254\" text-anchor=\"middle\" fill=\"#58a6ff\" font-family=\"sans-serif\" font-size=\"11\" font-weight=\"700\">ISP</text><ellipse cx=\"460\" cy=\"250\" rx=\"70\" ry=\"22\" fill=\"none\" stroke=\"#58a6ff\" stroke-width=\"2\"/><text x=\"460\" y=\"254\" text-anchor=\"middle\" fill=\"#58a6ff\" font-family=\"sans-serif\" font-size=\"11\" font-weight=\"700\">ISP</text><line x1=\"120\" y1=\"195\" x2=\"100\" y2=\"228\" stroke=\"#e6edf3\" stroke-width=\"1\"/><line x1=\"200\" y1=\"195\" x2=\"280\" y2=\"228\" stroke=\"#e6edf3\" stroke-width=\"1\"/><line x1=\"450\" y1=\"195\" x2=\"460\" y2=\"228\" stroke=\"#e6edf3\" stroke-width=\"1\"/><rect x=\"40\" y=\"295\" width=\"80\" height=\"22\" fill=\"#3fb950\" opacity=\"0.3\" stroke=\"#3fb950\" rx=\"3\"/><text x=\"80\" y=\"310\" text-anchor=\"middle\" fill=\"#3fb950\" font-family=\"sans-serif\" font-size=\"10\">абоненты</text><rect x=\"220\" y=\"295\" width=\"100\" height=\"22\" fill=\"#3fb950\" opacity=\"0.3\" stroke=\"#3fb950\" rx=\"3\"/><text x=\"270\" y=\"310\" text-anchor=\"middle\" fill=\"#3fb950\" font-family=\"sans-serif\" font-size=\"10\">офисы (BGP)</text><rect x=\"400\" y=\"295\" width=\"120\" height=\"22\" fill=\"#3fb950\" opacity=\"0.3\" stroke=\"#3fb950\" rx=\"3\"/><text x=\"460\" y=\"310\" text-anchor=\"middle\" fill=\"#3fb950\" font-family=\"sans-serif\" font-size=\"10\">CDN, дата-центры</text><line x1=\"100\" y1=\"272\" x2=\"80\" y2=\"295\" stroke=\"#e6edf3\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/><line x1=\"280\" y1=\"272\" x2=\"270\" y2=\"295\" stroke=\"#e6edf3\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/><line x1=\"460\" y1=\"272\" x2=\"460\" y2=\"295\" stroke=\"#e6edf3\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/></svg><figcaption>Интернет как иерархия автономных систем: магистраль Tier-1, региональные Tier-2, локальные ISP; IXP — узлы обмена трафиком между равноправными участниками.</figcaption></figure>", "**Интернет** — глобальное объединение **автономных систем** (AS, Autonomous Systems) на базе стека TCP/IP. Архитектура:\n- **Сеть доступа** (access network) — «последняя миля» к абоненту: ADSL/VDSL, DOCSIS, GPON/FTTH, LTE/5G, спутник.\n- **Региональные провайдеры** (Tier-2 ISP) — покупают **транзит** (transit) у магистральных операторов и продают доступ конечным клиентам.\n- **Магистральные сети** (Tier-1 backbone) — крупнейшие операторы (Lumen/Level 3, NTT, Cogent, Telia), обменивающиеся трафиком на условиях бесплатного **пиринга** (peering).\n- **IXP** (Internet Exchange Point) — физические площадки, где операторы напрямую соединяются для обмена трафиком, минуя транзит. Примеры: MSK-IX (Москва), DE-CIX (Франкфурт), AMS-IX (Амстердам).\n- **Маршрутизация между AS** — внешний протокол **BGP** (Border Gateway Protocol).\n- **Адресация и имена** — IP-адреса (IPv4/IPv6), доменные имена через DNS; глобально координируются **ICANN/IANA**.", "<h3>Мобильная телефонная сеть</h3>", "Сотовая сеть — **WAN-уровня инфраструктура**, обслуживающая голос и данные миллионов абонентов. Принцип построения — сотовый: территория делится на **соты** (cells), каждую обслуживает **базовая станция**. Соседние соты используют разные частоты, удалённые могут переиспользовать одну и ту же частоту (**частотное переиспользование**, frequency reuse).", "Архитектурно состоит из:\n- **Радиоподсистема** (RAN, Radio Access Network) — базовые станции (BTS в GSM, NodeB в 3G, eNodeB в LTE, gNodeB в 5G) и их контроллеры.\n- **Опорная сеть** (Core network) — коммутация, аутентификация, биллинг, маршрутизация: MSC и HLR в 2G, EPC в LTE (MME, S-GW, P-GW), 5G Core (AMF, SMF, UPF) в 5G.\n- **Подключение к ТФОП/Интернету** — шлюзы GMSC, P-GW.", "Ключевые механизмы:\n- **Хэндовер** (handover/handoff) — переключение активного соединения мобильного устройства от одной БС к другой при перемещении абонента.\n- **Роуминг** (roaming) — обслуживание абонента в сети другого оператора по соглашению.\n- **Поколения**: 1G (аналоговые AMPS, NMT) → 2G (GSM, CDMA — цифровой голос и SMS) → 3G (UMTS/WCDMA — мобильные данные) → 4G LTE (полностью IP-сеть, 100+ Мбит/с) → 5G NR (миллиметровые волны, пакетная задержка <1 мс, network slicing).", "<h3>Беспроводные ЛВС: IEEE 802.11</h3>", "Семейство стандартов **IEEE 802.11** определяет беспроводные локальные сети — **Wi-Fi**. Работает в нелицензируемых ISM-диапазонах **2,4 ГГц** (802.11b/g/n), **5 ГГц** (802.11a/n/ac/ax), **6 ГГц** (802.11ax — Wi-Fi 6E, 802.11be — Wi-Fi 7).", "Два режима работы:\n- **Инфраструктурный** — клиенты подключаются через **точку доступа** (AP, Access Point), которая соединена с проводной LAN. Совокупность AP и её клиентов образует **BSS** (Basic Service Set); несколько BSS, объединённых через **DS** (Distribution System), образуют **ESS** (Extended Service Set) с единым SSID и роумингом.\n- **Ad-hoc / IBSS** — прямое соединение клиентов без AP.", "Особенности:\n- **Метод доступа** — **CSMA/CA** (с предотвращением коллизий, в отличие от CSMA/CD в Ethernet, поскольку радио-станция не может одновременно передавать и слушать).\n- **Скрытый узел** (hidden terminal) — два клиента не «слышат» друг друга, но оба слышат AP; решается опционально через RTS/CTS-обмен.\n- **Шифрование** — WEP (взломан), WPA, WPA2 (AES-CCMP), WPA3 (SAE).\n- **Скорости** — от 11 Мбит/с (802.11b) до 9,6 Гбит/с (802.11ax с MU-MIMO и OFDMA).", "<h3>RFID — радиочастотная идентификация</h3>", "**RFID** (Radio Frequency Identification) — технология бесконтактной идентификации объектов с помощью радиосигнала. Состоит из двух элементов: **метка** (tag) и **считыватель** (reader). Метка содержит чип с идентификатором и антенну.", "Классификация меток по источнику питания:\n- **Пассивные** (passive) — без батареи, питаются от радиочастотного поля считывателя; самые дешёвые (~5 центов), но малая дальность (до нескольких метров) и слабая память. Используются в маркировке товаров (EPC Gen2 / UHF 860–960 МГц), пропусках, билетах.\n- **Полупассивные** (semi-passive / battery-assisted) — батарея питает только чип, ответ модулируется отражением сигнала.\n- **Активные** (active) — собственный источник питания, дальность до сотен метров, может вести опрос. Используется в логистике контейнеров, дорожных платежах.", "Диапазоны частот: LF (125 кГц — иммобилайзеры, доступ),
