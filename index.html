 обеспечивает скорость до 600 Мбит/с?","opts":["802.11b","802.11a","802.11n","802.11ac"],"ans":2,"expl":"802.11n использует MIMO + OFDM и обеспечивает скорость до 600 Мбит/с."},{"type":"tf","topic":"Вопрос 25","q":"В кадре 802.11 содержится максимум два MAC-адреса.","ans":false,"expl":"Кадр 802.11 содержит четыре MAC-адреса; четыре адреса необходимы при передаче между двумя BSS."},{"type":"mcq","topic":"Вопрос 25","q":"Что такое NAV в контексте протокола MAC 802.11?","opts":["Протокол маршрутизации в беспроводной сети","Счётчик виртуального занятия канала для механизма виртуального прослушивания","Адрес точки доступа в ESS","Формат заголовка кадра 802.11"],"ans":1,"expl":"NAV (Network Allocation Vector) — счётчик виртуального занятия канала, используемый в механизме виртуального прослушивания."},{"type":"mcq","topic":"Вопрос 26","q":"Какова максимальная пропускная способность WiMAX (802.16)?","opts":["11 Мбит/с","54 Мбит/с","70 Мбит/с","600 Мбит/с"],"ans":2,"expl":"Пропускная способность 802.16 (WiMAX) — до 70 Мбит/с."},{"type":"tf","topic":"Вопрос 26","q":"Протокол MAC в 802.16 является децентрализованным и основан на конкуренции.","ans":false,"expl":"Протокол MAC в 802.16 — централизованный, ориентированный на соединение."},{"type":"mcq","topic":"Вопрос 27","q":"Сколько каналов используется при скачках частоты (FHSS) в Bluetooth?","opts":["23 канала","40 каналов","79 каналов","256 каналов"],"ans":2,"expl":"Bluetooth использует FHSS — скачки по 79 каналам, 1600 прыжков/с."},{"type":"tf","topic":"Вопрос 27","q":"В пикосети Bluetooth может быть один ведущий и до 7 ведомых устройств.","ans":true,"expl":"Пикосеть — один ведущий (master) и до 7 ведомых (slaves)."},{"type":"mcq","topic":"Вопрос 27","q":"Какой тип соединения в Bluetooth предназначен для голосовых данных?","opts":["ACL (асинхронное)","SCO (синхронное)","L2CAP","RFCOMM"],"ans":1,"expl":"SCO (Synchronous Connection-Oriented) — синхронное соединение для голоса."},{"type":"mcq","topic":"Вопрос 28","q":"Какой метод передачи данных от метки к считывателю используется в EPC Gen 2?","opts":["Амплитудная манипуляция (ASK)","Частотная модуляция GFSK","Обратная рассеянная модуляция (backscatter)","Квадратурная амплитудная модуляция (QAM)"],"ans":2,"expl":"Метка→считыватель: обратная рассеянная модуляция (backscatter) с кодированием FM0 или Миллера."},{"type":"tf","topic":"Вопрос 28","q":"Длина электронного кода продукта (EPC) составляет 128 бит.","ans":false,"expl":"EPC имеет длину 96 бит, а не 128."},{"type":"mcq","topic":"Вопрос 28","q":"Какой протокол инвентаризации используется в EPC Gen 2 для идентификации меток?","opts":["Чистая ALOHA","CSMA/CD","Протокол Query/ACK с инвентаризацией слотов (Slotted ALOHA)","Token Ring"],"ans":2,"expl":"В EPC Gen 2 используется протокол Query/ACK с инвентаризацией слотов (Slotted ALOHA)."},{"type":"mcq","topic":"Вопрос 29","q":"Какой протокол предотвращает петли при использовании мостов?","opts":["CSMA/CD","IEEE 802.1Q","STP (IEEE 802.1D) — протокол остовного дерева","VLAN Trunking Protocol"],"ans":2,"expl":"Для предотвращения петель используется протокол остовного дерева (STP, IEEE 802.1D)."},{"type":"tf","topic":"Вопрос 29","q":"Шлюз (gateway) работает на уровнях 4-7 модели OSI и выполняет преобразование протоколов.","ans":true,"expl":"Шлюз работает на уровнях 4-7 и осуществляет преобразование протоколов."},{"type":"mcq","topic":"Вопрос 29","q":"Каков размер тега 802.1Q в кадре Ethernet?","opts":["2 байта","4 байта","8 байт","12 байт"],"ans":1,"expl":"Тег 802.1Q имеет размер 4 байта и содержит TPID, PCP, DEI и VID."},{"type":"match","topic":"Тема 4","q":"Сопоставьте сетевые устройства и технологии с их уровнем или характеристикой.","pairs":[{"l":"Повторитель (repeater)","r":"Уровень 1 — усиливает сигнал"},{"l":"Коммутатор (switch)","r":"Многопортовый мост, каждый порт — отдельный домен коллизий"},{"l":"Маршрутизатор (router)","r":"Уровень 3 — маршрутизирует по IP"},{"l":"Шлюз (gateway)","r":"Уровни 4-7 — преобразует протоколы"},{"l":"CSMA/CD","r":"Ethernet — обнаружение коллизий"},{"l":"CSMA/CA","r":"802.11 — предотвращение коллизий"},{"l":"FHSS","r":"Bluetooth — скачки по 79 каналам"}],"expl":"Каждое устройство или технология связано с соответствующим уровнем OSI или ключевой характеристикой из материалов Темы 4."}]},{"id":5,"name":"Сетевой уровень","questions":[{"n":30,"title":"Проектирование сетевого уровня: Сервисы, предоставляемые транспортному уровню. Метод коммутации пакетов с ожиданием. Реализация сервиса без установления соединения.","paragraphs":["**Сетевой уровень** (network layer, L3) отвечает за доставку пакетов от отправителя к получателю через маршрутизаторы. Два варианта сервиса: **дейтаграммный** (без соединения) или **виртуальные каналы** (с соединением).","**1. Коммутация пакетов с ожиданием** (store-and-forward):\n- Маршрутизатор полностью принимает пакет в буфер, проверяет заголовок и передаёт дальше. Это отличается от **коммутации каналов** (circuit switching), где выделяется непрерывный путь без буферизации (как в телефонных сетях)","**2. Сервис без установления соединения** (дейтаграммная сеть):\n- Каждый пакет содержит полный адрес назначения и маршрутизируется независимо. Разные пакеты одного сообщения могут идти разными путями\n- Маршрутизатор выбирает следующий узел по **таблице маршрутизации** (routing table)\n- Плюсы: устойчивость к отказам, простота, адаптивность к изменениям топологии\n- **Интернет (IP)** построен на дейтаграммном сервисе"],"terms":[{"ru":"Store-and-forward","en":"коммутация с ожиданием","df":"пакет принимается целиком, проверяется, затем передаётся дальше"},{"ru":"Коммутация каналов","en":"circuit switching","df":"выделение непрерывного пути (телефонные сети)"},{"ru":"Дейтаграмма","en":"datagram","df":"независимый пакет с полным адресом назначения"},{"ru":"Таблица маршрутизации","en":"routing table","df":"определяет следующий узел для каждого адреса назначения"}],"summary":["","**Суть:** Сетевой уровень доставляет пакеты от источника к получателю через маршрутизаторы.","","**Сервисы транспортному уровню:**","- **Connectionless** (дейтаграммный) — каждый пакет независим. Пример: **IP**.","- **Connection-oriented** (виртуальные каналы) — путь устанавливается заранее. Пример: X.25, ATM, MPLS.","","**Требования к сервисам:**","1. Независимость от технологий нижних уровней.","2. Изоляция от числа, типа и топологии сетей.","3. Единые сетевые адреса.","","**Принципы проектирования:**","- Простота маршрутизаторов (интеллект на краях) — принцип Интернета.","- Отказоустойчивость.","- Масштабируемость.","","**Коммутация пакетов с промежуточным хранением (store-and-forward):**","- Маршрутизатор принимает весь пакет.","- Проверяет корректность.","- Выбирает выходной интерфейс по таблице маршрутизации.","- Передаёт дальше.","","**Для устного:** Интернет = дейтаграммный IP + умные конечные устройства."]},{"n":31,"title":"Реализация сервиса с установлением соединения. Сравнение сетей виртуальных каналов и дейтаграммных сетей.","paragraphs":["Сервис с установлением соединения на сетевом уровне реализуется через **виртуальные каналы** (virtual circuits, VC). В отличие от дейтаграммного сервиса (Q30), здесь перед передачей данных создаётся логический путь.","**1. Как работают виртуальные каналы:**\n- Перед передачей данных устанавливается логический путь от отправителя к получателю. Каждый маршрутизатор на этом пути резервирует запись в своей таблице и присваивает **VCI** (Virtual Circuit Identifier — короткий номер канала)\n- Все пакеты одного соединения идут строго по одному маршруту и приходят в правильном порядке. Маршрутизатору не нужно каждый раз искать путь — он просто пересылает по номеру VCI\n- Примеры технологий: **ATM** (Asynchronous Transfer Mode — ячейки по 53 байта), **Frame Relay** (коммутация кадров), **MPLS** (Multiprotocol Label Switching — коммутация по меткам)","**2. Три фазы работы VC:**\n- **Установка** — выбирается маршрут, каждый маршрутизатор выделяет ресурсы и VCI\n- **Передача данных** — пакеты идут по установленному пути\n- **Разрыв** — соединение закрывается, ресурсы на всех маршрутизаторах освобождаются","**3. Сравнение дейтаграммных сетей и виртуальных каналов:**\n- **Дейтаграммные (IP)**: не требуют установки соединения, устойчивы к отказам (пакеты обходят сбой), адаптивны к изменениям нагрузки. Но нет гарантий порядка доставки и качества\n- **Виртуальные каналы**: гарантируют **QoS** (Quality of Service — качество обслуживания: задержка, пропускная способность), упорядоченную доставку, меньшие накладные расходы (короткий VCI вместо полного адреса в каждом пакете)\n- Главный минус VC: при отказе любого маршрутизатора на пути все проходящие через него виртуальные каналы разрушаются"],"terms":[{"ru":"Виртуальный канал","en":"virtual circuit, VC","df":"логический путь, установленный заранее для группы пакетов"},{"ru":"VCI","en":"Virtual Circuit Identifier","df":"короткий идентификатор канала в заголовке пакета"},{"ru":"ATM","en":"Asynchronous Transfer Mode","df":"технология на основе VC с ячейками фиксированного размера (53 байта)"},{"ru":"MPLS","en":"Multiprotocol Label Switching","df":"коммутация по меткам, сочетает элементы VC и IP"},{"ru":"QoS","en":"Quality of Service","df":"гарантии качества: задержка, пропускная способность, потери"}],"summary":["","**Суть:** Два подхода к доставке пакетов.","","**Виртуальные каналы (virtual circuits):**","- Путь устанавливается при начале сеанса.","- Все пакеты идут по одному пути.","- В заголовке короткий **идентификатор канала**, не полный адрес.","- Таблицы маршрутизаторов содержат соединения.","- Пример: ATM, MPLS, Frame Relay.","","**Дейтаграммы:**","- Каждый пакет содержит полный адрес.","- Маршрут выбирается для каждого пакета независимо.","- Разные пакеты могут идти разными путями.","- Пример: IP (Интернет).","","**Сравнение:**","","| Критерий | Виртуальные каналы | Дейтаграммы |","|---|---|---|","| Установка | Нужна | Не нужна |","| Адресация | Короткая | Полная в каждом пакете |","| Путь | Фиксированный | Переменный |","| Отказоустойчивость | Низкая (разрыв VC) | Высокая |","| QoS | Легче реализовать | Сложнее |","","**Для устного:** Интернет выбрал дейтаграммы за простоту и отказоустойчивость."]},{"n":32,"title":"Алгоритмы маршрутизации: принцип оптимальности маршрута, алгоритм нахождения кратчайшего пути, заливка.","paragraphs":["Маршрутизация — это процесс выбора пути для пакета через сеть. Алгоритмы маршрутизации определяют, по какому маршруту пакет пойдёт от отправителя к получателю.","**1. Принцип оптимальности** (optimality principle):\n- Если узел B лежит на оптимальном пути из A в C, то участок пути от B до C тоже является оптимальным\n- Из этого следует, что для каждого получателя существует **дерево кратчайших путей** (sink tree) — дерево, в котором от каждого узла сети ведёт оптимальный путь к данному получателю. Все алгоритмы маршрутизации стремятся построить это дерево","**2. Алгоритм нахождения кратчайшего пути** — алгоритм Дейкстры (Dijkstra's algorithm):\n- Маршрутизатор использует этот алгоритм, чтобы построить sink tree — найти кратчайшие пути от себя ко всем остальным узлам сети\n- Работает пошагово: на каждом шаге выбирает ближайший ещё не обработанный узел и обновляет расстояния до его соседей. Веса рёбер (стоимость линий) должны быть неотрицательными\n- На практике используется в протоколе **OSPF** (Open Shortest Path First) — каждый маршрутизатор знает полную карту сети и строит кратчайшие пути алгоритмом Дейкстры","**3. Заливка** (flooding):\n- Простейший способ доставки: маршрутизатор пересылает входящий пакет на **все** свои интерфейсы, кроме того, откуда пакет пришёл\n- Без ограничений это приводит к бесконечному размножению пакетов. Защита: **TTL** (Time to Live — счётчик, уменьшается на 1 на каждом маршрутизаторе; при TTL=0 пакет уничтожается) или нумерация пакетов (маршрутизатор запоминает уже пересланные пакеты)\n- Гарантирует доставку по кратчайшему пути (первая копия всегда приходит быстрее остальных). Используется для рассылки обновлений маршрутизации и в ситуациях, когда надёжность важнее эффективности"],"terms":[{"ru":"Принцип оптимальности","en":"optimality principle","df":"подпути оптимальных маршрутов тоже оптимальны"},{"ru":"Sink tree","en":"дерево кратчайших путей","df":"дерево оптимальных путей от всех узлов к одному получателю"},{"ru":"Алгоритм Дейкстры","en":"Dijkstra's algorithm","df":"алгоритм поиска кратчайших путей от одного источника"},{"ru":"Заливка","en":"flooding","df":"рассылка пакета на все интерфейсы, кроме входящего"},{"ru":"TTL","en":"Time to Live","df":"счётчик переходов, ограничивающий время жизни пакета в сети"},{"ru":"OSPF","en":"Open Shortest Path First","df":"протокол маршрутизации, использующий алгоритм Дейкстры"}],"summary":["","**Суть:** Алгоритмы маршрутизации определяют пути пакетов через сеть.","","**Типы алгоритмов:**","- **Статические (неадаптивные)** — рассчитываются заранее, не меняются.","- **Динамические (адаптивные)** — реагируют на изменения топологии и нагрузки.","","**Принцип оптимальности:**","- Если оптимальный маршрут от A к C идёт через B, то оптимальный маршрут от B к C — подмножество этого маршрута.","- Следствие: оптимальные пути образуют **дерево** к каждому узлу (sink tree).","","**Кратчайший путь (Shortest Path):**","- Алгоритм **Дейкстры** — от одного узла ко всем.","- Алгоритм **Беллмана-Форда** — распределённый, может работать с отрицательными весами.","- Метрики: число переходов, задержка, пропускная способность, стоимость.","","**Заливка (Flooding):**","- Каждый полученный пакет отправляется во **все** выходные интерфейсы, кроме входного.","- Гарантирует доставку, если путь существует.","- Требует механизма остановки (TTL, последовательные номера).","- Применение: широковещательная рассылка, начальная настройка.","","**Для устного:** Dijkstra — OSPF; Bellman-Ford — RIP."]},{"n":33,"title":"Алгоритмы маршрутизации: маршрутизация по вектору расстояний, маршрутизация с учетом состояния линий, иерархическая маршрутизация.","paragraphs":["Существуют два основных подхода к построению таблиц маршрутизации: каждый маршрутизатор либо обменивается расстояниями с соседями, либо знает полную карту сети. При росте сети оба подхода плохо масштабируются, поэтому используется иерархия.","**1. Маршрутизация по вектору расстояний** (Distance Vector, DV):\n- Каждый маршрутизатор хранит таблицу: для каждого узла сети — расстояние до него и через какого соседа идти. Периодически он отправляет эту таблицу своим соседям\n- Сосед получает таблицу, сравнивает с собственной и обновляет, если нашёл более короткий путь. Этот процесс обмена и обновления — распределённая версия алгоритма **Беллмана-Форда** (Bellman-Ford), который находит кратчайшие пути путём последовательного улучшения оценок расстояний\n- Главный недостаток — **счёт до бесконечности** (count-to-infinity): при отказе линии маршрутизаторы медленно увеличивают стоимость, обмениваясь устаревшими данными. Решения: **split horizon** (не сообщать маршрут тому, от кого он получен) и **poison reverse** (сообщить бесконечную стоимость вместо молчания)\n- Протокол **RIP** (Routing Information Protocol) основан на этом подходе","**2. Маршрутизация с учётом состояния линий** (Link State, LS):\n- Каждый маршрутизатор самостоятельно узнаёт полную карту сети и строит кратчайшие пути. Работает в 4 шага:\n- Обнаруживает соседей и измеряет стоимость линий до них\n- Формирует пакет **LSA** (Link State Advertisement — объявление о состоянии линий), в котором перечисляет своих соседей и стоимости\n- Рассылает LSA всем маршрутизаторам сети методом **заливки** (flooding)\n- Когда каждый маршрутизатор получил LSA от всех остальных, он имеет полную карту сети и запускает **алгоритм Дейкстры** для построения кратчайших путей\n- Сходится быстрее DV и не имеет проблемы счёта до бесконечности. Протоколы: **OSPF** (Open Shortest Path First) и **IS-IS**","**3. Иерархическая маршрутизация:**\n- В большой сети (как Интернет) невозможно хранить маршруты ко всем узлам. Поэтому маршрутизаторы объединяются в **автономные системы** (AS — Autonomous System), каждая под единым управлением\n- Внутри своей AS маршрутизатор знает полную топологию (используя OSPF или RIP). Для других AS он знает только агрегированный маршрут — «чтобы попасть в AS X, отправляй на маршрутизатор Y»\n- Это значительно сокращает размер таблиц маршрутизации. Между AS используется протокол **BGP** (Border Gateway Protocol)"],"terms":[{"ru":"Вектор расстояний","en":"distance vector","df":"подход, при котором маршрутизаторы обмениваются таблицами расстояний с соседями"},{"ru":"Состояние линий","en":"link state","df":"подход, при котором каждый маршрутизатор знает полную карту сети"},{"ru":"Счёт до бесконечности","en":"count-to-infinity","df":"медленная сходимость DV при отказе линии"},{"ru":"LSA","en":"Link State Advertisement","df":"пакет с информацией о соседях и стоимостях линий"},{"ru":"RIP","en":"Routing Information Protocol","df":"протокол маршрутизации на основе DV"},{"ru":"OSPF","en":"Open Shortest Path First","df":"протокол маршрутизации на основе Link State"},{"ru":"AS","en":"Autonomous System","df":"автономная система, группа сетей под единым управлением"},{"ru":"BGP","en":"Border Gateway Protocol","df":"протокол маршрутизации между автономными системами"}],"summary":["","**Суть:** Два главных класса динамических алгоритмов.","","**Distance Vector Routing (маршрутизация по вектору расстояний):**","- Каждый маршрутизатор хранит **таблицу расстояний** до всех узлов.","- Периодически обменивается таблицами с **соседями**.","- Обновляет свою таблицу по формуле Беллмана-Форда.","- Проблемы: медленная сходимость, **count-to-infinity** при разрывах.","- Решения: split horizon, poison reverse.","- Пример: **RIP**.","","**Link State Routing (по состоянию линий):**","- Каждый маршрутизатор знает **топологию всей сети**.","- Рассылает свои связи всем (flooding).","- Строит граф и применяет **Dijkstra**.","- Быстрая сходимость, нет count-to-infinity.","- Больше нагрузки на CPU и память.","- Пример: **OSPF, IS-IS**.","","**Иерархическая маршрутизация:**","- Сеть делится на **регионы**.","- Внутри региона — полная информация о маршрутах.","- Между регионами — только агрегированная.","- Уменьшает размер таблиц маршрутизации.","- Пример: **автономные системы** (AS) в Интернете.","","**Для устного:** Distance Vector — проще, медленнее. Link State — сложнее, быстрее."]},{"n":34,"title":"Алгоритмы маршрутизации: широковещательная маршрутизация, многоадресная рассылка, произвольная маршрутизация.","paragraphs":["Помимо обычной доставки одному получателю (unicast), сетевой уровень поддерживает три других способа доставки: всем, группе или ближайшему.","**1. Широковещательная маршрутизация** (broadcast routing):\n- Задача — доставить один пакет **всем** узлам сети. Простой способ — заливка (flooding), но она создаёт множество дубликатов\n- **RPF** (Reverse Path Forwarding) — более эффективный метод: маршрутизатор пересылает пакет только если он пришёл с того интерфейса, который является кратчайшим путём к источнику. Если пакет пришёл с другого интерфейса — значит это дубликат, и он отбрасывается\n- Ещё эффективнее — построение **остовного дерева** (spanning tree): строится дерево, покрывающее все узлы без петель, и пакет рассылается только по ветвям этого дерева","**2. Многоадресная рассылка** (multicast):\n- Задача — доставить пакет не всем, а только определённой **группе** получателей (например, участникам видеоконференции)\n- Два подхода к построению дерева рассылки: **от источника** — для каждого отправителя строится своё дерево (протокол **DVMRP** — Distance Vector Multicast Routing Protocol), или **с общей точкой сбора** (**RP** — Rendezvous Point) — все отправители шлют данные на одну точку, откуда они расходятся к получателям (протокол **PIM-SM** — Protocol Independent Multicast, Sparse Mode)\n- **IGMP** (Internet Group Management Protocol) — протокол, с помощью которого хосты сообщают своему маршрутизатору, в каких multicast-группах они хотят участвовать","**3. Произвольная маршрутизация** (anycast):\n- Задача — доставить пакет **ближайшему** из нескольких узлов, имеющих один и тот же адрес. Сеть сама выбирает ближайший по метрике маршрутизации\n- Используется в **DNS** (запрос идёт к ближайшему серверу корневой зоны) и **CDN** (Content Delivery Network — контент доставляется с ближайшего сервера)"],"terms":[{"ru":"Broadcast","en":"широковещание","df":"доставка пакета всем узлам сети"},{"ru":"RPF","en":"Reverse Path Forwarding","df":"пересылка только если пакет пришёл с кратчайшего пути к источнику"},{"ru":"Остовное дерево","en":"spanning tree","df":"дерево, покрывающее все узлы без петель"},{"ru":"Multicast","en":"многоадресная рассылка","df":"доставка пакета определённой группе получателей"},{"ru":"DVMRP","en":"Distance Vector Multicast Routing Protocol","df":"протокол multicast с деревьями от источника"},{"ru":"PIM-SM","en":"Protocol Independent Multicast, Sparse Mode","df":"протокол multicast с общей точкой сбора (RP)"},{"ru":"IGMP","en":"Internet Group Management Protocol","df":"протокол управления членством хостов в multicast-группах"},{"ru":"Anycast","en":"произвольная маршрутизация","df":"доставка ближайшему из узлов с одинаковым адресом"}],"summary":["","**Суть:** Разные способы доставки одного сообщения нескольким получателям.","","**Широковещательная (broadcast):**","- Доставка **всем** узлам сети.","- Методы: заливка (flooding), reverse path forwarding (RPF), spanning tree.","- В IP ограничено локальной сетью (255.255.255.255).","","**Многоадресная (multicast):**","- Доставка **определённой группе** узлов.","- **IGMP** (Internet Group Management Protocol) — управление членством.","- **PIM** (Protocol Independent Multicast) — построение деревьев доставки.","- Адресация: IPv4 группы 224.0.0.0/4, IPv6 FF00::/8.","- Применение: IPTV, видеоконференции, обновление ПО.","","**Произвольная рассылка (anycast):**","- Доставка **ближайшему** из группы узлов.","- Используется для **DNS корневых серверов**, CDN (13 корневых DNS-серверов на самом деле сотни машин через anycast).","- Тот же IP-адрес назначен множеству узлов; маршрутизация выбирает ближайший.","","**Сравнение:**","","| Тип | Кому | Пример |","|---|---|---|","| Unicast | Одному | HTTP-запрос |","| Broadcast | Всем | ARP |","| Multicast | Группе | IPTV |","| Anycast | Ближайшему из группы | DNS root |","","**Для устного:** Anycast — хитрый способ балансировки через маршрутизацию."]},{"n":35,"title":"Алгоритмы маршрутизации для мобильных хостов, маршрутизация в произвольных сетях.","paragraphs":["**1. Mobile IP** (маршрутизация для мобильных хостов):\n- Проблема: когда устройство (например, ноутбук) перемещается в другую сеть, его IP-адрес меняется, и все соединения разрываются. Mobile IP решает это, сохраняя постоянный **домашний адрес**\n- В домашней сети устройства работает **домашний агент** (home agent) — специальный маршрутизатор, который знает, где сейчас находится устройство\n- Когда устройство попадает в чужую сеть, оно получает временный **care-of address** (адрес для пересылки) от **иностранного агента** (foreign agent) и сообщает его домашнему агенту\n- Пакеты, отправленные на домашний адрес, приходят к домашнему агенту, который **туннелирует** их (оборачивает в новый пакет) на care-of address\n- Недостаток: **треугольная маршрутизация** — даже если отправитель находится рядом с мобильным устройством, пакеты всё равно идут через домашний агент, что увеличивает задержку","**2. Маршрутизация в ad hoc-сетях** (произвольных сетях):\n- **Ad hoc-сеть** — это сеть без фиксированной инфраструктуры, где каждый узел одновременно является и хостом, и маршрутизатором. Топология постоянно меняется, так как узлы перемещаются\n- **Реактивные протоколы** — маршрут строится только когда он нужен. Пример: **AODV** (Ad hoc On-Demand Distance Vector) — отправитель рассылает запрос **RREQ** (Route Request) через всю сеть, получатель отвечает **RREP** (Route Reply) по обратному пути. Экономит ресурсы, но первый пакет ждёт дольше\n- **Проактивные протоколы** — таблицы маршрутизации поддерживаются постоянно, как в обычных сетях. Пример: **DSDV** (Destination-Sequenced Distance Vector). Маршрут доступен сразу, но постоянный обмен обновлениями расходует энергию и полосу\n- **Гибридные протоколы** — сочетают оба подхода. Пример: **ZRP** (Zone Routing Protocol) — внутри определённой зоны (близкие соседи) используется проактивная маршрутизация, а между зонами — реактивная"],"terms":[{"ru":"Домашний агент","en":"home agent","df":"маршрутизатор в домашней сети, перенаправляющий пакеты мобильному хосту"},{"ru":"Иностранный агент","en":"foreign agent","df":"маршрутизатор в посещаемой сети"},{"ru":"Треугольная маршрутизация","en":"triangle routing","df":"неоптимальный путь через домашний агент"},{"ru":"AODV","en":"Ad hoc On-Demand Distance Vector","df":"реактивный протокол, строит маршрут по запросу (RREQ/RREP)"},{"ru":"DSDV","en":"Destination-Sequenced Distance Vector","df":"проактивный протокол с постоянными таблицами"},{"ru":"ZRP","en":"Zone Routing Protocol","df":"гибридный протокол: проактивный внутри зоны, реактивный между зонами"}],"summary":["","**Суть:** Классические алгоритмы не работают, когда узлы двигаются.","","**Мобильные хосты:**","- Проблема: мобильный узел меняет сеть → меняется IP.","- **Mobile IP:**","- **Home Agent (HA)** — в домашней сети, знает текущее положение.","- **Foreign Agent (FA)** — в гостевой сети.","- **Care-of address** — временный адрес в гостевой сети.","- Пакеты идут в домашнюю сеть → HA перенаправляет (туннель) в гостевую.","","**Ad-hoc сети:**","- **Нет инфраструктуры** — узлы общаются напрямую.","- Топология **быстро меняется**.","- Узлы — одновременно и клиенты, и маршрутизаторы.","- Применение: военные, спасательные, IoT, mesh-сети.","","**Протоколы ad-hoc маршрутизации:**","- **AODV (Ad-hoc On-Demand Distance Vector)** — reactive, маршрут строится при необходимости.","- **DSR (Dynamic Source Routing)** — source routing.","- **OLSR** — proactive, link-state вариант.","- **DSDV** — proactive distance vector.","","**Категории:**","- **Proactive** — маршруты поддерживаются постоянно (дороже, но быстрее отклик).","- **Reactive** — маршрут ищется при запросе.","","**Для устного:** Mobile IP — для сотовых, AODV/DSR — для mesh."]},{"n":36,"title":"Подходы к борьбе с перегрузкой: управление доступом, регулирование трафика, сброс нагрузки. Маршрутизация с учетом состояния трафика.","paragraphs":["**Перегрузка** (congestion) возникает, когда в сеть поступает больше пакетов, чем она способна обработать. Буферы маршрутизаторов переполняются, пакеты теряются, задержки растут. Существуют четыре основных подхода к борьбе с перегрузкой.","**1. Управление доступом** (admission control):\n- Если сеть уже перегружена, новые потоки данных не допускаются до тех пор, пока нагрузка не снизится. Применяется в сетях с виртуальными каналами — маршрутизатор отказывает в установке нового VC, если ресурсов недостаточно","**2. Регулирование трафика** (traffic shaping):\n- Источник ограничивает скорость отправки пакетов, чтобы не создавать всплесков нагрузки\n- **Leaky bucket** (дырявое ведро) — пакеты поступают с любой скоростью, но выходят с постоянной фиксированной скоростью, как вода из дырки в ведре. Сглаживает всплески полностью\n- **Token bucket** (маркерное ведро) — в ведро с постоянной скоростью поступают маркеры (tokens). Чтобы отправить пакет, нужен маркер. Если маркеры накопились — допускается кратковременный всплеск; если кончились — отправка ждёт. Более гибкий, чем leaky bucket","**3. Сброс нагрузки** (load shedding):\n- Крайняя мера: при переполнении буферов маршрутизатор отбрасывает пакеты. Вопрос — какие пакеты отбрасывать первыми (старые или новые — зависит от приложения)\n- **RED** (Random Early Detection) — более умный подход: маршрутизатор начинает случайно отбрасывать пакеты **до** переполнения буфера. Это сигнализирует отправителям (через TCP) замедлить передачу, предотвращая полную перегрузку","**4. Маршрутизация с учётом состояния трафика:**\n- Маршрутизаторы выбирают пути не только по кратчайшему расстоянию, но и по текущей загрузке каналов — направляют трафик в обход перегруженных участков\n- Проблема: если все маршрутизаторы одновременно перенаправят трафик на один свободный канал, он тоже перегрузится. Это вызывает **осцилляции** — трафик переключается туда-сюда, и сеть становится нестабильной"],"terms":[{"ru":"Перегрузка","en":"congestion","df":"нагрузка на сеть превышает её пропускную способность"},{"ru":"Управление доступом","en":"admission control","df":"отказ в допуске новых потоков при перегрузке"},{"ru":"Leaky bucket","en":"дырявое ведро","df":"выравнивание трафика до постоянной скорости"},{"ru":"Token bucket","en":"маркерное ведро","df":"ограничение средней скорости с допуском всплесков"},{"ru":"Сброс нагрузки","en":"load shedding","df":"отбрасывание пакетов при переполнении буферов"},{"ru":"RED","en":"Random Early Detection","df":"упреждающее случайное отбрасывание пакетов до переполнения"}],"summary":["","**Суть:** Когда в сеть приходит больше пакетов, чем она может обработать, — перегрузка. Разные уровни борются по-разному.","","**Подходы:**","","**Управление доступом (admission control):**","- Не пускать новые соединения, если сеть перегружена.","- Используется в ATM, QoS-системах.","","**Формирование трафика (traffic shaping):**","- Ограничивать скорость источника.","- **Token bucket** — токены добавляются с фиксированной скоростью; пакет передаётся, если есть токен. Позволяет burst.","- **Leaky bucket** — строгое ограничение скорости.","","**Сброс нагрузки (load shedding):**","- Отбрасывание пакетов при переполнении буферов.","- **Random Early Detection (RED)** — начинает сбрасывать пакеты **до** переполнения.","- **ECN** — пометка пакетов вместо сброса.","","**Маршрутизация с учётом перегрузки:**","- Веса рёбер учитывают загрузку.","- Проблема: может привести к **осцилляциям** (трафик переключается туда-сюда).","","**Подходы по уровню:**","- **Канальный:** управление потоком кадров.","- **Сетевой:** выбор маршрутов.","- **Транспортный:** TCP congestion control.","","**Для устного:** Перегрузка (congestion) ≠ переполнение буфера получателя (flow control)."]},{"n":37,"title":"Требования приложений. Формирование трафика. Диспетчеризация пакетов. Управление доступом. Интегральное обслуживание. Дифференцированное обслуживание.","paragraphs":["Разные приложения предъявляют разные требования к сети. Для обеспечения качества обслуживания (**QoS** — Quality of Service) используются механизмы формирования трафика, диспетчеризации и две архитектуры QoS.","**1. Требования приложений:**\n- **VoIP и видеозвонки** чувствительны к задержке и **джиттеру** (jitter — колебания задержки): если пакеты приходят неравномерно, звук прерывается\n- **Передача файлов** чувствительна к надёжности — потеря данных недопустима, но задержка не критична\n- **Потоковое видео** требует стабильной полосы пропускания — иначе изображение замирает","**2. Формирование трафика** (traffic shaping):\n- Ограничивает скорость отправки, чтобы не перегружать сеть. Два алгоритма: **leaky bucket** (постоянная скорость выхода) и **token bucket** (допускает всплески) — подробнее в Q36","**3. Диспетчеризация пакетов** (packet scheduling):\n- Определяет, в каком порядке маршрутизатор отправляет пакеты из очередей. **WFQ** (Weighted Fair Queuing — взвешенное честное обслуживание) — каждый поток получает долю полосы пропорционально своему весу. Это гарантирует, что важный трафик (голос) не будет вытеснен менее важным (загрузка файлов)","**4. Управление доступом** (admission control):\n- Перед тем как допустить новый поток в сеть, проверяется, хватит ли ресурсов. Если сеть уже нагружена — новый поток отклоняется, чтобы не ухудшить качество для существующих потоков","**5. Интегральное обслуживание** (IntServ — Integrated Services):\n- Архитектура QoS, в которой каждый поток получает индивидуальные гарантии. Перед передачей данных приложение резервирует ресурсы на всём пути с помощью протокола **RSVP** (Resource Reservation Protocol)\n- Минус: плохо масштабируется — каждый маршрутизатор должен хранить состояние каждого потока, что невозможно в крупных сетях","**6. Дифференцированное обслуживание** (DiffServ — Differentiated Services):\n- Более масштабируемый подход: вместо индивидуальных гарантий пакеты делятся на **классы**. На входе в сеть пакет маркируется полем **DSCP** (Differentiated Services Code Point — 6 бит в заголовке IP), и маршрутизаторы обслуживают его по классу\n- **EF** (Expedited Forwarding) — класс для трафика с низкой задержкой (голос, видео)\n- **AF** (Assured Forwarding) — несколько уровней приоритета и вероятности отбрасывания для обычного трафика"],"terms":[{"ru":"QoS","en":"Quality of Service","df":"гарантии качества обслуживания в сети"},{"ru":"Джиттер","en":"jitter","df":"колебания задержки между пакетами"},{"ru":"WFQ","en":"Weighted Fair Queuing","df":"диспетчеризация с распределением полосы по весам"},{"ru":"IntServ","en":"Integrated Services","df":"архитектура QoS с индивидуальными гарантиями для потоков"},{"ru":"RSVP","en":"Resource Reservation Protocol","df":"протокол резервирования ресурсов вдоль пути"},{"ru":"DiffServ","en":"Differentiated Services","df":"архитектура QoS на основе классов трафика"},{"ru":"DSCP","en":"Differentiated Services Code Point","df":"6-битное поле маркировки в заголовке IP"},{"ru":"EF","en":"Expedited Forwarding","df":"класс DiffServ для трафика с низкой задержкой"},{"ru":"AF","en":"Assured Forwarding","df":"класс DiffServ с несколькими уровнями приоритета"}],"summary":["","**Суть:** QoS (Quality of Service) — механизмы обеспечения требуемых характеристик сервиса.","","**Требования приложений:**","- **Надёжность** — почта, файлы (нужна).","- **Задержка** — VoIP, игры (< 150 мс).","- **Джиттер** — видео/аудио (чем меньше, тем лучше).","- **Пропускная способность** — видео 4K, резервное копирование.","","**Формирование трафика (traffic shaping):**","- Token bucket, leaky bucket.","- Преобразует burst в плавный поток.","","**Диспетчеризация (scheduling):**","- **FIFO** — простая очередь.","- **Priority Queuing** — классы с приоритетами.","- **Weighted Fair Queuing (WFQ)** — справедливое распределение с весами.","","**Управление доступом:**","- Новое соединение принимается только если ресурсы позволяют.","","**Integrated Services (IntServ):**","- **Резервирование ресурсов** для каждого потока.","- Протокол **RSVP** (Resource Reservation Protocol).","- Каждый маршрутизатор хранит состояние потока.","- **Проблема:** не масштабируется.","","**Differentiated Services (DiffServ):**","- Классы трафика (DSCP в заголовке IP).","- Маршрутизаторы обрабатывают классы, не отдельные потоки.","- Масштабируется на крупные сети.","- Сегодня доминирует.","","**Для устного:** IntServ = гарантии, но сложно. DiffServ = классы трафика, работает в реальном Интернете."]},{"n":38,"title":"Объединение сетей. Различия сетей и способы объединения сетей. Туннелирование. Маршрутизация в объединённых сетях. Фрагментация пакетов.","paragraphs":["В реальном Интернете соединяются сети с разными технологиями, протоколами и ограничениями. Задача объединения сетей — обеспечить сквозную передачу данных несмотря на эти различия.","**1. Различия сетей и способы объединения:**\n- Сети различаются по технологии (Ethernet, Wi-Fi, ATM), адресации, максимальному размеру пакета, протоколам и качеству обслуживания\n- Объединение возможно на разных уровнях: повторители (L1) просто усиливают сигнал, мосты/коммутаторы (L2) соединяют по MAC-адресам, **маршрутизаторы** (L3) — основное средство объединения разнородных сетей, так как они работают с единым протоколом IP. **Шлюзы** (L4+) преобразуют протоколы на уровне приложений","**2. Туннелирование** (tunneling):\n- Когда пакет должен пройти через сеть с другим протоколом, его **инкапсулируют** — оборачивают целиком в пакет этой сети. На выходе из промежуточной сети внешняя обёртка снимается, и оригинальный пакет продолжает путь\n- Примеры: **6in4** (пакеты IPv6 передаются внутри IPv4 в сетях, ещё не поддерживающих IPv6), **VPN** (шифрованный туннель через публичный Интернет), **Mobile IP** (туннель от домашнего агента к мобильному устройству)","**3. Маршрутизация в объединённых сетях:**\n- Единый протокол **IP** позволяет маршрутизаторам принимать решения независимо от технологии нижележащей сети. Каждый маршрутизатор смотрит на IP-адрес назначения и пересылает пакет дальше по таблице маршрутизации","**4. Фрагментация пакетов:**\n- Каждая сеть имеет свой **MTU** (Maximum Transmission Unit — максимальный размер пакета). Если пакет больше MTU следующей сети, его нужно разбить на части — это и есть **фрагментация**\n- В **IPv4** фрагментировать может любой маршрутизатор на пути, а собирает фрагменты только получатель. Флаг **DF** (Don't Fragment) запрещает фрагментацию — если пакет не проходит, маршрутизатор отправляет ошибку отправителю\n- В **IPv6** маршрутизаторам фрагментировать запрещено. Отправитель сам определяет минимальный MTU вдоль всего пути с помощью **Path MTU Discovery** и отправляет пакеты подходящего размера"],"terms":[{"ru":"Объединение сетей","en":"internetworking","df":"связывание разнородных сетей в единую систему"},{"ru":"Туннелирование","en":"tunneling","df":"инкапсуляция пакета одного протокола внутрь другого"},{"ru":"MTU","en":"Maximum Transmission Unit","df":"максимальный размер пакета, допустимый в данной сети"},{"ru":"Фрагментация","en":"fragmentation","df":"разбиение пакета на части при превышении MTU"},{"ru":"DF","en":"Don't Fragment","df":"флаг в IPv4, запрещающий фрагментацию"}],"summary":["","**Суть:** Соединение разнородных сетей в единую систему.","","**Различия сетей:**","- Разные технологии (Ethernet vs Wi-Fi vs сотовая).","- Разные адреса (IPv4 vs IPv6).","- Разные MTU.","- Разные уровни надёжности и QoS.","","**Способы объединения:**","- **Маршрутизаторы (L3)** — основной способ в Интернете.","- **Шлюзы (gateways)** — с преобразованием протоколов.","- **Мосты (bridges, L2)** — для сетей на одном канальном уровне.","","**Туннелирование (tunneling):**","- Упаковка пакета одного протокола в пакет другого.","- Применение: передача IPv6 через IPv4, VPN (IPSec, L2TP, GRE).","- Пакет «внутри» не виден промежуточным сетям.","","**Маршрутизация в объединённых сетях:**","- **IGP** (Interior Gateway Protocol) — внутри автономной системы (OSPF, IS-IS, RIP).","- **EGP** (Exterior Gateway Protocol) — между AS (BGP).","","**Фрагментация:**","- При проходе через сеть с меньшим MTU пакет делится на фрагменты.","- Решается на сетевом уровне (IPv4) или на отправителе (IPv6 + Path MTU Discovery).","","**Для устного:** VPN — пример туннелирования + шифрования."]},{"n":39,"title":"Протокол IPv4. Формат IP-пакета. Схема IP-маршрутизации. Маски. Фрагментация IP-пакетов.","paragraphs":["**IPv4** (Internet Protocol version 4) — основной протокол сетевого уровня Интернета. Он отвечает за адресацию узлов и доставку пакетов от отправителя к получателю через маршрутизаторы.","**1. Формат IP-пакета** (заголовок IPv4, минимум 20 байт):\n- **Version** (4 бита) — версия протокола (4 для IPv4)\n- **IHL** (Internet Header Length, 4 бита) — длина заголовка в 32-битных словах (обычно 5 = 20 байт)\n- **ToS/DSCP** (8 бит) — тип обслуживания, используется для QoS (маркировка приоритета, см. Q37)\n- **Total Length** (16 бит) — полная длина пакета в байтах (заголовок + данные), максимум 65 535 байт\n- **Identification** (16 бит) — идентификатор пакета, одинаковый для всех его фрагментов\n- **Flags** (3 бита): **DF** (Don't Fragment — запрет фрагментации) и **MF** (More Fragments — есть ещё фрагменты)\n- **Fragment Offset** (13 бит) — смещение данного фрагмента от начала исходного пакета (в единицах по 8 байт)\n- **TTL** (Time to Live, 8 бит) — счётчик переходов: уменьшается на 1 на каждом маршрутизаторе, при 0 пакет уничтожается. Защищает от бесконечного зацикливания\n- **Protocol** (8 бит) — какой протокол внутри: 6 = TCP, 17 = UDP, 1 = ICMP\n- **Header Checksum** (16 бит) — контрольная сумма только заголовка (пересчитывается на каждом маршрутизаторе, т.к. TTL меняется)\n- **Source и Destination Address** — IP-адреса отправителя и получателя, по **32 бита** каждый (например, 192.168.1.1)","**2. Схема IP-маршрутизации и маски:**\n- IP-адрес делится на две части: **адрес сети** (network) и **адрес хоста** (host). **Маска подсети** (subnet mask) определяет, где проходит граница — например, маска 255.255.255.0 означает, что первые 24 бита — сеть, последние 8 — хост\n- **CIDR** (Classless Inter-Domain Routing — бесклассовая адресация) заменил старую классовую систему (классы A, B, C). Вместо фиксированных границ используется произвольная длина префикса: например, 10.0.0.0/24 означает 24 бита для сети\n- Маршрутизатор выбирает маршрут по принципу **longest prefix match** — из всех подходящих записей в таблице выбирается самая специфичная (с самым длинным совпадающим префиксом)","**3. Фрагментация IP-пакетов:**\n- Если пакет больше **MTU** (Maximum Transmission Unit) следующей сети, маршрутизатор разбивает его на фрагменты\n- Все фрагменты получают одинаковое поле **Identification**, чтобы получатель мог их собрать. У всех фрагментов, кроме последнего, установлен флаг **MF**. Поле **Fragment Offset** указывает позицию каждого фрагмента\n- Сборка фрагментов выполняется только получателем, а не промежуточными маршрутизаторами\n- Флаг **DF** запрещает фрагментацию — если пакет не проходит, маршрутизатор отправляет отправителю сообщение об ошибке (ICMP). Это используется в **Path MTU Discovery**"],"terms":[{"ru":"IPv4","en":"Internet Protocol version 4","df":"основной протокол сетевого уровня с 32-битными адресами"},{"ru":"IHL","en":"Internet Header Length","df":"длина заголовка в 32-битных словах"},{"ru":"TTL","en":"Time to Live","df":"счётчик переходов, защита от зацикливания"},{"ru":"Маска подсети","en":"subnet mask","df":"определяет границу между адресом сети и хоста"},{"ru":"CIDR","en":"Classless Inter-Domain Routing","df":"бесклассовая адресация с произвольной длиной префикса /N"},{"ru":"MTU","en":"Maximum Transmission Unit","df":"максимальный размер пакета в данной сети"},{"ru":"DF","en":"Don't Fragment","df":"флаг запрета фрагментации"},{"ru":"MF","en":"More Fragments","df":"флаг: за этим фрагментом следуют ещё"}],"summary":["","**Суть:** IPv4 — основной протокол сетевого уровня в Интернете.","","**Формат IP-пакета (заголовок, 20 байт минимум):**","- **Version (4 бит)** — 4.","- **IHL** — длина заголовка в 32-битных словах.","- **Type of Service / DSCP** — приоритет (QoS).","- **Total Length** — общая длина пакета.","- **Identification, Flags, Fragment Offset** — для фрагментации.","- **TTL** — время жизни (уменьшается каждым маршрутизатором).","- **Protocol** — какой протокол в payload (TCP=6, UDP=17, ICMP=1).","- **Header Checksum** — проверка заголовка.","- **Source IP, Destination IP** — по 32 бит.","- **Options** (опционально).","","**Схема IP-маршрутизации:**","- Маршрутизатор смотрит destination IP.","- Ищет в **таблице маршрутизации** — самое длинное совпадение префикса (longest prefix match).","- Пересылает на следующий hop или локально.","","**Маски подсети:**","- Адрес = префикс сети + хост.","- **CIDR** (Classless Inter-Domain Routing): `192.168.1.0/24` — 24 бита сети.","- Старая классовая адресация (A, B, C) заменена CIDR в 1993.","","**Фрагментация:**","- Если пакет больше MTU следующей сети — делится на фрагменты.","- Сборка — **только на получателе**.","- Поля: Identification (одинаковый у всех фрагментов), Fragment Offset, MF-флаг (More Fragments).","- Проблема: потеря одного фрагмента → пересылка всего пакета. Поэтому в IPv6 фрагментируется только отправитель (Path MTU Discovery).","","**Для устного:** IPv4 адреса заканчиваются — отсюда переход на IPv6 и NAT."]},{"n":40,"title":"Протокол IPv6. Управляющие протоколы Интернета. Коммутация меток и MPLS.","paragraphs":["**1. Протокол IPv6:**\n- IPv6 создан для замены IPv4, у которого закончились адреса. Адрес IPv6 имеет длину **128 бит** (вместо 32 у IPv4), что даёт практически неограниченное количество адресов\n- Заголовок IPv6 имеет **фиксированную длину 40 байт** (в IPv4 длина переменная). Основные поля: **Version** (6), **Traffic Class** (приоритет, аналог ToS/DSCP), **Flow Label** (20 бит — метка потока для идентификации связанных пакетов), **Payload Length** (длина данных), **Next Header** (какой протокол или расширенный заголовок следующий), **Hop Limit** (аналог TTL), адреса отправителя и получателя (по 128 бит)\n- Ключевые отличия от IPv4: нет контрольной суммы заголовка (экономит время на маршрутизаторах), нет фрагментации маршрутизаторами (только отправитель), дополнительные функции реализуются через цепочку **расширенных заголовков** (extension headers)","**2. Управляющие протоколы Интернета:**\n- **ICMP** (Internet Control Message Protocol) — протокол диагностики и сообщений об ошибках. Используется командами **ping** (проверка доступности) и **traceroute** (определение маршрута)\n- **ARP** (Address Resolution Protocol) — определяет MAC-адрес устройства по его IP-адресу в локальной сети. Работает только в IPv4\n- **DHCP** (Dynamic Host Configuration Protocol) — автоматически назначает IP-адрес, маску, шлюз и DNS-сервер устройствам при подключении к сети\n- **ICMPv6** — версия ICMP для IPv6, включает в себя **NDP** (Neighbor Discovery Protocol — протокол обнаружения соседей), который заменяет ARP и часть функций DHCP в IPv6","**3. Коммутация меток и MPLS:**\n- **MPLS** (Multiprotocol Label Switching) — технология, ускоряющая передачу пакетов. Вместо анализа IP-адреса на каждом маршрутизаторе пакеты пересылаются по короткой **метке** (label, 20 бит), вставленной между канальным и IP-заголовком\n- На входе в MPLS-сеть пограничный маршрутизатор **LER** (Label Edge Router) анализирует IP-адрес и присваивает метку. Внутри сети транзитные маршрутизаторы **LSR** (Label Switching Router) просто заменяют метку и пересылают пакет — это быстрее, чем анализ IP\n- Путь пакета через MPLS-сеть называется **LSP** (Label Switched Path). MPLS используется для **Traffic Engineering** (управление распределением трафика по каналам) и для построения **VPN** (виртуальных частных сетей)"],"terms":[{"ru":"ICMP","en":"Internet Control Message Protocol","df":"протокол диагностики и ошибок (ping, traceroute)"},{"ru":"ARP","en":"Address Resolution Protocol","df":"определение MAC-адреса по IP-адресу"},{"ru":"DHCP","en":"Dynamic Host Configuration Protocol","df":"автоматическое назначение IP-адресов"},{"ru":"NDP","en":"Neighbor Discovery Protocol","df":"обнаружение соседей в IPv6, заменяет ARP"},{"ru":"MPLS","en":"Multiprotocol Label Switching","df":"коммутация пакетов по меткам вместо IP-адресов"},{"ru":"LER","en":"Label Edge Router","df":"пограничный маршрутизатор, присваивает метку на входе в MPLS"},{"ru":"LSR","en":"Label Switching Router","df":"транзитный маршрутизатор, пересылает по метке"},{"ru":"LSP","en":"Label Switched Path","df":"путь пакета через MPLS-сеть"}],"summary":["","**Суть:** IPv6 — замена IPv4 с огромным адресным пространством. MPLS — технология быстрой коммутации.","","**IPv6:**","- Адрес **128 бит** (2^128 ≈ 3.4·10^38 адресов).","- Запись: `2001:db8::1` (16-битные группы, ::, сжатие нулей).","- **Упрощённый заголовок** (40 байт фикс.): нет фрагментации в маршрутизаторах, нет checksum.","- **Расширенные заголовки** (extension headers) — опции вынесены.","- Встроенный **IPSec** (опционально).","- **Автоконфигурация (SLAAC)** — устройство генерирует адрес само.","- Нет широковещания — только multicast и anycast.","","**Управляющие протоколы Интернета:**","- **ICMP** (Internet Control Message Protocol) — сообщения об ошибках, ping, traceroute.","- **ICMPv6** — аналог + **NDP** (Neighbor Discovery, замена ARP).","- **ARP** (Address Resolution Protocol) — IP → MAC в IPv4.","- **DHCP** — автоматическая настройка.","- **IGMP/MLD** — управление multicast.","","**MPLS (Multiprotocol Label Switching):**","- Добавляет **метку (label)** между L2 и L3.","- Маршрутизатор принимает решения по метке, а не по IP → быстрее.","- **FEC** (Forwarding Equivalence Class) — группа пакетов с одинаковой обработкой.","- Поддерживает **traffic engineering** и **VPN**.","- Используется у операторов связи.","","**Для устного:** IPv6 внедряется медленно из-за NAT. MPLS — основа операторских VPN."]},{"n":41,"title":"Протокол внутреннего шлюза OSPF. Протокол внешнего шлюза BGP. Многоадресная рассылка в Интернете. Мобильный IP.","paragraphs":["Маршрутизация в Интернете делится на два уровня: внутри автономной системы (AS) и между автономными системами. Дополнительно рассматриваются многоадресная рассылка и мобильный IP.","**1. OSPF** (Open Shortest Path First) — внутренний протокол маршрутизации (**IGP** — Interior Gateway Protocol):\n- Алгоритм **Link State**: каждый маршрутизатор знает полную топологию сети и строит кратчайшие пути алгоритмом **Дейкстры**\n- Для масштабирования крупных сетей OSPF делит AS на **зоны** (areas). **Area 0** — магистральная зона (backbone), через которую связаны все остальные зоны\n- **ABR** (Area Border Router) — маршрутизатор, соединяющий две зоны. **ASBR** (Autonomous System Boundary Router) — маршрутизатор на границе с другой AS\n- Поддерживает **ECMP** (Equal-Cost Multi-Path) — балансировку трафика по нескольким равноценным маршрутам, а также аутентификацию обновлений","**2. BGP** (Border Gateway Protocol) — внешний протокол маршрутизации (**EGP** — Exterior Gateway Protocol):\n- Тип алгоритма — **path-vector**: каждый маршрут содержит полный список AS на пути (**AS_PATH**), что позволяет обнаруживать и предотвращать петли\n- BGP-сессии работают поверх **TCP** (порт 179) — надёжная доставка обновлений\n- **eBGP** (external BGP) — сессии между разными AS; **iBGP** (internal BGP) — сессии внутри одной AS\n- Выбор маршрута по **политикам** через атрибуты: **LOCAL_PREF** (предпочтение внутри AS), **MED** (подсказка соседней AS), **COMMUNITY** (группировка маршрутов)","**3. Многоадресная рассылка в Интернете:**\n- **IGMP** (Internet Group Management Protocol) — хосты сообщают локальному маршрутизатору о подписке на multicast-группу\n- **PIM-DM** (Protocol Independent Multicast, Dense Mode) — для плотных сетей: заливка во все стороны, затем обрезка ветвей без получателей\n- **PIM-SM** (Sparse Mode) — для редких получателей: трафик идёт только запросившим, через общую **точку рандеву** (**RP** — Rendezvous Point)","**4. Мобильный IP:**\n- У мобильного устройства есть постоянный **домашний адрес** (home address) в домашней сети\n- Перемещаясь в чужую сеть, устройство получает временный **care-of address** и регистрирует его у **домашнего агента** (home agent)\n- Пакеты на домашний адрес перехватывает домашний агент и **туннелирует** их (IP-в-IP инкапсуляция) на care-of address\n- **Mobile IPv6** добавляет **Route Optimization** — отправитель может доставлять пакеты напрямую мобильному устройству, минуя домашнего агента. Это решает проблему «треугольной маршрутизации»"],"terms":[{"ru":"OSPF","en":"Open Shortest Path First","df":"протокол внутренней маршрутизации на основе Link State"},{"ru":"IGP","en":"Interior Gateway Protocol","df":"протокол маршрутизации внутри автономной системы"},{"ru":"ABR","en":"Area Border Router","df":"маршрутизатор OSPF на границе двух зон"},{"ru":"ECMP","en":"Equal-Cost Multi-Path","df":"балансировка по нескольким равноценным маршрутам"},{"ru":"BGP","en":"Border Gateway Protocol","df":"протокол маршрутизации между автономными системами"}],"summary":["","**Суть:** Основные протоколы маршрутизации Интернета и поддержка мобильности.","","**OSPF (Open Shortest Path First, RFC 2328):**","- **Link-state** алгоритм внутри автономной системы (IGP).","- Разбивает AS на **области (areas)** для масштабирования.","- **Area 0 (backbone)** — магистральная область.","- Типы маршрутизаторов: internal, backbone, ABR, ASBR.","- Быстрая сходимость, поддержка ECMP.","","**BGP (Border Gateway Protocol, RFC 4271):**","- **Path-vector** алгоритм **между** автономными системами (EGP).","- Связка TCP порт 179.","- Маршрутизация на **политике**, не только кратчайшему пути (важны экономические соглашения).","- **AS_PATH** — список пройденных AS (защита от циклов).","- Уязвимость: **BGP hijacking** (захват префиксов).","","**Многоадресная рассылка в Интернете:**","- **IGMP** — присоединение хостов к группам.","- **PIM** (Protocol Independent Multicast):","- **PIM Dense Mode** — flood + prune, для плотных групп.","- **PIM Sparse Mode** — явное присоединение, для разреженных.","- Адреса 224.0.0.0/4.","","**Mobile IP (RFC 5944 для IPv4, RFC 6275 для IPv6):**","- Мобильный узел сохраняет свой **home address** при перемещении.","- **Home Agent** — перенаправляет пакеты.","- **Care-of Address** — текущий адрес в гостевой сети.","- Для IPv6 — встроенная поддержка через Mobile IPv6.","","**Для устного:** OSPF внутри компании, BGP между провайдерами. BGP — «клей» Интернета."]}],"quizzes":[{"type":"mcq","topic":"Вопрос 30","q":"Какой принцип лежит в основе работы маршрутизаторов при коммутации пакетов с ожиданием (store-and-forward)?","opts":["Маршрутизатор полностью принимает пакет, сохраняет в буфере, проверяет и затем передаёт дальше","Маршрутизатор передаёт пакет сразу по мере поступления битов без буферизации","Маршрутизатор отправляет пакет на все порты одновременно","Маршрутизатор передаёт только заголовок, а данные идут напрямую"],"ans":0,"expl":"Store-and-forward означает, что маршрутизатор полностью принимает пакет, сохраняет его в буфере, проверяет целостность и корректность заголовка и только затем передаёт на следующий узел."},{"type":"tf","topic":"Вопрос 30","q":"В дейтаграммной сети каждый пакет снабжается полным адресом получателя и маршрутизируется независимо.","ans":true,"expl":"Верно. В дейтаграммной сети каждый пакет снабжается полным адресом получателя и маршрутизируется независимо на основе текущих таблиц маршрутизации."},{"type":"mcq","topic":"Вопрос 30","q":"На каком типе сервиса построен Интернет (IP)?","opts":["Сервис с виртуальными каналами","Дейтаграммный сервис (без установления соединения)","Коммутация каналов","Сервис с гарантированной доставкой"],"ans":1,"expl":"Интернет (IP) построен на дейтаграммном сервисе (без установления соединения)."},{"type":"mcq","topic":"Вопрос 31","q":"Какие технологии являются примерами реализации виртуальных каналов?","opts":["ATM, Frame Relay, MPLS","Ethernet, Wi-Fi, Bluetooth","HTTP, FTP, SMTP","TCP, UDP, SCTP"],"ans":0,"expl":"Примеры технологий на основе виртуальных каналов: ATM, Frame Relay, MPLS."},{"type":"tf","topic":"Вопрос 31","q":"В сетях виртуальных каналов при отказе маршрутизатора все проходящие через него VC разрушаются.","ans":true,"expl":"Верно. Сети виртуальных каналов уязвимы к отказам промежуточных узлов — при отказе маршрутизатора все проходящие через него VC разрушаются."},{"type":"mcq","topic":"Вопрос 31","q":"Сколько фаз имеет установка виртуального канала?","opts":["Две: установка и передача данных","Три: установка, передача данных, разрыв","Четыре: обнаружение, установка, передача, разрыв","Одна: передача данных"],"ans":1,"expl":"Установка виртуального канала проходит три фазы: установка (маршрут выбирается, ресурсы резервируются, VCI назначаются), передача данных и разрыв (ресурсы освобождаются)."},{"type":"mcq","topic":"Вопрос 32","q":"Какова сложность алгоритма Дейкстры с использованием приоритетной очереди?","opts":["O(N²)","O(N log N)","O((N+E) log N)","O(N³)"],"ans":2,"expl":"Алгоритм Дейкстры работает за O(N²) или O((N+E) log N) с приоритетной очередью."},{"type":"tf","topic":"Вопрос 32","q":"При заливке (flooding) маршрутизатор пересылает пакет только на один выбранный интерфейс.","ans":false,"expl":"Неверно. При заливке маршрутизатор пересылает пакет на все интерфейсы, кроме входного."},{"type":"mcq","topic":"Вопрос 33","q":"Какая проблема характерна для маршрутизации по вектору расстояний (Distance Vector)?","opts":["Проблема заливки (flooding problem)","Проблема счёта до бесконечности (count-to-infinity)","Проблема фрагментации пакетов","Проблема петель на канальном уровне"],"ans":1,"expl":"Недостаток Distance Vector — «проблема счёта до бесконечности», решаемая split horizon и poison reverse."},{"type":"tf","topic":"Вопрос 33","q":"Протоколы OSPF и IS-IS основаны на маршрутизации с учётом состояния линий (Link State).","ans":true,"expl":"Верно. Протоколы OSPF и IS-IS основаны на LS (Link State)."},{"type":"mcq","topic":"Вопрос 34","q":"Что такое Reverse Path Forwarding (RPF)?","opts":["Пересылка пакета только если он пришёл с интерфейса кратчайшего пути к источнику","Отправка пакета обратно отправителю","Построение обратного маршрута от получателя к отправителю","Фрагментация пакета по обратному пути"],"ans":0,"expl":"RPF: пересылка только если пакет пришёл с интерфейса кратчайшего пути к источнику."},{"type":"tf","topic":"Вопрос 34","q":"Произвольная маршрутизация (anycast) доставляет пакет всем узлам с одинаковым адресом.","ans":false,"expl":"Неверно. Anycast — доставка ближайшему из узлов с одинаковым адресом, а не всем."},{"type":"mcq","topic":"Вопрос 35","q":"Какой протокол является реактивным протоколом маршрутизации в ad hoc-сетях?","opts":["DSDV","AODV","ZRP","OSPF"],"ans":1,"expl":"AODV — реактивный протокол, строит маршруты по требованию через RREQ/RREP."},{"type":"tf","topic":"Вопрос 35","q":"В Mobile IP домашний агент туннелирует пакеты иностранному агенту.","ans":true,"expl":"Верно. Домашний агент туннелирует пакеты иностранному агенту."},{"type":"mcq","topic":"Вопрос 36","q":"Какой алгоритм формирования трафика допускает всплески в пределах накопленного запаса?","opts":["Алгоритм «дырявого ведра» (leaky bucket)","Алгоритм «маркерного ведра» (token bucket)","Алгоритм RED","Алгоритм AIMD"],"ans":1,"expl":"Token bucket допускает всплески в пределах накопленного запаса, в отличие от leaky bucket с постоянной скоростью."},{"type":"tf","topic":"Вопрос 36","q":"RED (Random Early Detection) — это алгоритм упреждающего случайного сброса пакетов.","ans":true,"expl":"Верно. RED — упреждающий случайный сброс пакетов при приближении к переполнению буферов."},{"type":"mcq","topic":"Вопрос 37","q":"Какая архитектура QoS резервирует ресурсы для отдельных потоков с помощью протокола RSVP?","opts":["DiffServ","IntServ","MPLS","WFQ"],"ans":1,"expl":"IntServ (Integrated Services) — QoS с гарантиями для отдельных потоков через RSVP. Плохо масштабируется."},{"type":"mcq","topic":"Вопрос 38","q":"Какое утверждение верно о фрагментации в IPv6?","opts":["Фрагментация выполняется маршрутизаторами","Фрагментация маршрутизаторами запрещена; отправитель определяет MTU пути","Фрагментация не поддерживается вообще","Фрагментация выполняется получателем"],"ans":1,"expl":"В IPv6 фрагментация маршрутизаторами запрещена; отправитель определяет MTU пути (Path MTU Discovery)."},{"type":"mcq","topic":"Вопрос 39","q":"Какой принцип используется маршрутизатором для выбора записи в таблице маршрутизации IPv4?","opts":["First match","Longest prefix match","Random match","Shortest prefix match"],"ans":1,"expl":"Маршрутизатор применяет маску подсети к адресу назначения и выбирает запись по принципу longest prefix match."},{"type":"tf","topic":"Вопрос 39","q":"Поле Fragment Offset в IPv4 измеряется в единицах по 8 байт.","ans":true,"expl":"Верно. Fragment Offset — смещение в единицах по 8 байт."},{"type":"mcq","topic":"Вопрос 40","q":"Какова длина адреса в IPv6?","opts":["32 бита","64 бита","128 бит","256 бит"],"ans":2,"expl":"IPv6: адрес 128 бит, заголовок 40 байт фиксированной длины."},{"type":"tf","topic":"Вопрос 40","q":"В MPLS метка имеет размер 20 бит и вставляется между IP- и канальным заголовком.","ans":true,"expl":"Верно. Между IP- и канальным заголовком вставляется метка (20 бит)."},{"type":"mcq","topic":"Вопрос 41","q":"По какому протоколу и порту устанавливаются BGP-сессии?","opts":["UDP, порт 53","TCP, порт 179","TCP, порт 80","UDP, порт 520"],"ans":1,"expl":"BGP-сессии устанавливаются по TCP (порт 179)."},{"type":"tf","topic":"Вопрос 41","q":"В OSPF Area 0 является магистральной зоной.","ans":true,"expl":"Верно. OSPF поддерживает иерархию зон, Area 0 — магистральная."},{"type":"match","topic":"Темы 30–41","q":"Сопоставьте протокол/алгоритм с его описанием.","pairs":[{"left":"Алгоритм Дейкстры","right":"Поиск кратчайших путей от одного источника"},{"left":"AODV","right":"Реактивный протокол маршрутизации в ad hoc-сетях"},{"left":"BGP","right":"Протокол внешней маршрутизации (path-vector)"},{"left":"Token bucket","right":"Формирование трафика с допуском всплесков"},{"left":"IGMP","right":"Протокол управления членством в группах"}],"expl":"Дейкстра — кратчайшие пути; AODV — реактивный протокол ad hoc; BGP — внешняя маршрутизация (path-vector); Token bucket — допускает всплески; IGMP — членство в multicast-группах."}]},{"id":6,"name":"Транспортный уровень сетевого стека","questions":[{"n":42,"title":"Транспортный сервис. Услуги, предоставляемые верхним уровням. Сокеты Беркли. Программирование сокета.","paragraphs":["**Транспортный уровень** занимает промежуточное положение между сетевым уровнем (который доставляет пакеты между хостами) и прикладным уровнем (который работает с данными пользователя). Его главная задача — обеспечить связь не между машинами, а между **процессами** на этих машинах. Сетевой уровень знает только IP-адреса, а транспортный уровень добавляет понятие **порта**, чтобы данные попали именно в нужное приложение.","**Услуги, предоставляемые верхним уровням.** Транспортный уровень предлагает прикладному уровню два принципиально разных типа сервиса. Первый — **надёжный байтовый поток с установлением соединения** (connection-oriented). Данные гарантированно доходят в правильном порядке, без потерь и дублирования. Приложение видит непрерывный поток байтов и не думает о пакетах. Это обеспечивает TCP. Второй — **ненадёжная передача отдельных датаграмм без соединения** (connectionless). Каждое сообщение отправляется независимо, без гарантий доставки и порядка, зато с минимальными накладными расходами. Это обеспечивает UDP.","Выбор между сервисами зависит от приложения. Веб-страницы, файлы и почта требуют надёжности и используют TCP. DNS-запросы, потоковое видео и онлайн-игры ценят скорость и допускают потери — они используют UDP.","**Примитивы транспортного сервиса** — это набор операций, которые транспортный уровень предоставляет приложениям. В абстрактной модели это: **LISTEN** (ожидать входящее соединение), **CONNECT** (установить соединение), **SEND** (отправить данные), **RECEIVE** (получить данные), **DISCONNECT** (разорвать соединение). Конкретная реализация этих примитивов — это API сокетов.","**Сокеты Беркли (Berkeley Sockets)** — стандартный программный интерфейс для сетевого взаимодействия, появившийся в BSD Unix в 1983 году. Сокет — это **конечная точка коммуникации**, идентифицируемая парой (IP-адрес, порт). Через сокеты приложение может как отправлять, так и получать данные по сети. Этот API стал де-факто стандартом и используется практически во всех операционных системах.","**Программирование TCP-сокета** происходит по следующей схеме. Сервер вызывает **socket()**, чтобы создать сокет, указывая семейство адресов (например, AF_INET для IPv4) и тип (SOCK_STREAM для TCP). Затем вызывает **bind()**, чтобы привязать сокет к конкретному порту. После этого вызывает **listen()**, чтобы перевести сокет в режим ожидания входящих соединений. Когда клиент подключается, сервер вызывает **accept()**, который создаёт **новый сокет** специально для этого клиента, а исходный продолжает слушать. Далее сервер использует **recv()** и **send()** для обмена данными и **close()** для завершения.","Клиент действует проще: вызывает **socket()** для создания сокета, затем **connect()** для установки соединения с сервером по его IP и порту. После этого обменивается данными через **send()** и **recv()** и закрывает соединение через **close()**.","**Программирование UDP-сокета** отличается тем, что соединение не устанавливается. Создаётся сокет с типом SOCK_DGRAM. Вместо connect/accept используются **sendto()** и **recvfrom()**, где каждый раз явно указывается адрес получателя. Каждая датаграмма отправляется независимо.","**Блокирующий и неблокирующий режимы.** По умолчанию сокеты работают в **блокирующем** режиме: вызов recv() приостанавливает программу, пока данные не придут. Это просто, но не масштабируется — сервер с тысячами клиентов не может выделить отдельный поток на каждого. Решение — **мультиплексирование ввода-вывода** (I/O multiplexing): один поток следит за множеством сокетов одновременно.","**Системные вызовы для мультиплексирования:** **select()** — старый, переносимый, но ограничен (обычно до 1024 дескрипторов). **poll()** — снимает ограничение на количество, но требует линейного перебора. **epoll()** (Linux) и **kqueue** (BSD/macOS) — современные механизмы, эффективно обрабатывающие десятки тысяч соединений."],"terms":[{"ru":"Сокет","en":"Socket","df":"конечная точка сетевой коммуникации, идентифицируемая парой (IP, порт)"},{"ru":"TSAP","en":"Transport Service Access Point","df":"точка доступа к транспортному сервису (порт)"},{"ru":"Мультиплексирование","en":"I/O Multiplexing","df":"наблюдение за множеством сокетов одним потоком"}],"summary":["","**Суть:** Транспортный уровень обеспечивает связь между **процессами** через **порты**.","","**Услуги верхним уровням:**","- **Надёжный байтовый поток с соединением** — TCP.","- **Ненадёжные датаграммы без соединения** — UDP.","","**Примитивы (абстрактные):**","- LISTEN, CONNECT, SEND, RECEIVE, DISCONNECT.","","**Сокеты Беркли (Berkeley Sockets, 1983):**","- Стандартный API для сетевого программирования.","- Сокет = конечная точка (IP, порт).","- Адресные семейства: AF_INET (IPv4), AF_INET6.","- Типы: SOCK_STREAM (TCP), SOCK_DGRAM (UDP).","","**TCP-сервер:**","1. `socket()` — создать.","2. `bind()` — привязать к порту.","3. `listen()` — режим прослушивания.","4. `accept()` — принять соединение (новый сокет).","5. `recv()` / `send()` — обмен.","6. `close()`.","","**TCP-клиент:**","1. `socket()`.","2. `connect()`.","3. `send()` / `recv()`.","4. `close()`.","","**UDP:** `socket()` → `bind()` → `sendto()` / `recvfrom()`.","","**Масштабирование:**","- По умолчанию блокирующий режим.","- Для тысяч соединений: **select()**, **poll()**, **epoll()** (Linux), **kqueue** (BSD).","","**Для устного:** epoll — современный способ обслуживать миллионы соединений."]},{"n":43,"title":"Базовые элементы транспортных протоколов: адресация, установка и разрыв соединения, контроль ошибок и управление потоком данных, мультиплексирование, восстановление после сбоев.","paragraphs":["Для того чтобы транспортный протокол мог надёжно передавать данные между процессами, он должен решить ряд фундаментальных задач. Эти задачи одинаковы для любого транспортного протокола, хотя каждый решает их по-своему.","**1. Адресация (Addressing).** Сетевой уровень доставляет пакет до хоста по IP-адресу, но на хосте работает множество процессов. Транспортный уровень должен указать, какому именно процессу предназначены данные. Для этого используется **порт** — 16-битное число, также называемое **TSAP** (Transport Service Access Point). Полный транспортный адрес — это пара (IP-адрес, порт). Известные сервисы имеют фиксированные порты: HTTP — 80, HTTPS — 443, DNS — 53.","**2. Установка соединения (Connection Establishment).** Перед передачей данных стороны должны согласовать параметры: начальные номера последовательностей, размеры буферов, максимальный размер сегмента. Главная проблема — **дубликаты из старых соединений**, которые ещё могут бродить по сети.","Решение — **трёхэтапное рукопожатие** (three-way handshake). На первом шаге клиент отправляет серверу сегмент с флагом SYN и случайным начальным номером последовательности (ISN). Случайность ISN защищает от старых дубликатов и от подделки соединения. На втором шаге сервер отвечает сегментом с флагами SYN и ACK: сообщает свой ISN и подтверждает клиентский. На третьем шаге клиент подтверждает ISN сервера. Три шага нужны, чтобы обе стороны убедились, что их номера приняты.","**3. Разрыв соединения (Connection Release).** TCP — дуплексный протокол, поэтому каждое направление потока закрывается **отдельно**. Одна сторона может прекратить отправку, послав FIN, но продолжать получать данные — это **полузакрытие** (half-close). Полный разрыв требует четырёх сегментов: первая сторона отправляет FIN, вторая подтверждает ACK-ом, затем вторая отправляет свой FIN, и первая подтверждает ACK-ом.","После отправки последнего ACK инициатор входит в состояние **TIME_WAIT** на 2·MSL. Это нужно, чтобы последний ACK мог быть повторён при потере, и чтобы все старые сегменты соединения исчезли из сети.","**4. Контроль ошибок (Error Control).** Сеть может терять, повреждать и переупорядочивать пакеты. Транспортный протокол справляется через комбинацию механизмов: **контрольная сумма** обнаруживает повреждения, **номера последовательностей** выявляют потери и восстанавливают порядок, **подтверждения** (ACK) сообщают об успешном получении, а **таймаут повторной передачи** (RTO) запускает повтор, если подтверждение не пришло вовремя.","**5. Управление потоком данных (Flow Control).** Эта задача защищает **медленного получателя** от быстрого отправителя. Если отправитель шлёт данные быстрее, чем получатель обрабатывает, буфер переполнится и данные потеряются. Решение — **скользящее окно**: получатель в каждом ACK сообщает размер своего свободного буфера (поле Window Size). Отправитель не посылает больше данных, чем позволяет окно. Важно не путать с контролем перегрузки: поток защищает получателя, перегрузка — сеть.","**6. Мультиплексирование и демультиплексирование.** На одном хосте работают десятки приложений, и все пользуются одним сетевым интерфейсом. **Мультиплексирование** на стороне отправителя объединяет данные от разных процессов в общий поток. **Демультиплексирование** на стороне получателя направляет данные нужному процессу по номеру порта. В TCP демультиплексирование использует четвёрку (srcIP, srcPort, dstIP, dstPort), в UDP — только пару (dstIP, dstPort).","**7. Восстановление после сбоев (Crash Recovery).** Если сервер упал и перезагрузился посередине соединения, клиент не знает, был ли обработан последний сегмент. Если данные получены, но ACK не отправлен — клиент пошлёт повторно и они обработаются дважды. Если ACK отправлен, но данные не обработаны — они потеряются. Полностью прозрачное восстановление **невозможно** на транспортном уровне, потому что протокол не знает, что приложение успело сделать до сбоя. На практике нужно участие прикладного уровня — идемпотентные операции или журналирование."],"terms":[{"ru":"TSAP","en":"Transport Service Access Point","df":"точка доступа к транспортному сервису (порт)"},{"ru":"ISN","en":"Initial Sequence Number","df":"случайный начальный номер последовательности"},{"ru":"Полузакрытие","en":"Half-close","df":"одна сторона закрыла свой поток, но продолжает получать данные"},{"ru":"RTO","en":"Retransmission Timeout","df":"время ожидания подтверждения перед повторной передачей"}],"summary":["","**Суть:** Семь фундаментальных задач любого транспортного протокола.","","**1. Адресация:**","- Порт (16 бит) = **TSAP** (Transport Service Access Point).","- Полный адрес = (IP, порт).","- Стандартные порты: 80 (HTTP), 443 (HTTPS), 53 (DNS).","","**2. Установка соединения — three-way handshake:**","- Клиент → SYN (ISN_c).","- Сервер → SYN + ACK (ISN_s, ACK ISN_c+1).","- Клиент → ACK.","- Случайный ISN защищает от дубликатов.","","**3. Разрыв соединения:**","- FIN → ACK → FIN → ACK (4 сегмента, каждое направление независимо).","- Состояние **TIME_WAIT** 2·MSL — чтобы дубликаты исчезли.","","**4. Контроль ошибок:**","- **Checksum** — повреждения.","- **Sequence numbers** — потери и порядок.","- **ACK** — подтверждения.","- **RTO (Retransmission Timeout)** — повторная передача.","","**5. Управление потоком:**","- Скользящее окно, **Window Size** — сколько готов принять получатель.","- Защищает **медленного получателя**.","- ≠ контроль перегрузки (защита сети).","","**6. Мультиплексирование:**","- Один канал сети делится между многими процессами по портам.","- **TCP:** четвёрка (srcIP, srcPort, dstIP, dstPort).","- **UDP:** пара (dstIP, dstPort).","","**7. Восстановление после сбоев:**","- Если сервер упал и перезагрузился — клиент не знает, обработан ли последний запрос.","- Полностью прозрачное восстановление **невозможно** на транспортном уровне.","- Нужен прикладной уровень (идемпотентность, журналы).","","**Для устного:** TCP решает все 7 задач. UDP — только адресацию и мультиплексирование."]},{"n":44,"title":"Контроль перегрузки. Выделение требуемой пропускной способности. Регулирование скорости отправки. Проблемы беспроводного соединения.","paragraphs":["**Что такое перегрузка.** Перегрузка (congestion) возникает, когда в сеть поступает больше пакетов, чем она способна обработать. Маршрутизаторы начинают отбрасывать пакеты, задержки растут, а полезная пропускная способность падает. В тяжёлых случаях возникает **коллапс перегрузки** — сеть загружена повторными передачами, но полезных данных почти не проходит.","Важно различать две задачи. **Управление потоком** (flow control) защищает **получателя** от переполнения его буфера. **Контроль перегрузки** (congestion control) защищает **сеть** от перегрузки маршрутизаторов. TCP решает обе одновременно через два окна: **rwnd** (receive window — сколько готов принять получатель) и **cwnd** (congestion window — сколько позволяет сеть). Отправитель может иметь в сети не более **min(cwnd, rwnd)** байт неподтверждённых данных.","**Выделение требуемой пропускной способности.** Идеальный алгоритм должен обеспечить **эффективность** (использовать всю доступную полосу) и **справедливость** (делить её поровну). Теоретическая модель — **max-min fairness**: нельзя увеличить долю одного потока, не уменьшив долю потока, который получает меньше или столько же. TCP приближается к этому через **AIMD** (Additive Increase, Multiplicative Decrease): при успехе окно растёт на фиксированную величину, при потере — уменьшается вдвое. Математически доказано, что AIMD приводит к справедливому распределению полосы между конкурирующими потоками.","**Регулирование скорости отправки.** TCP нащупывает доступную пропускную способность, постепенно увеличивая скорость, пока не обнаружит потерю пакета. Этот процесс состоит из нескольких фаз.","**Slow Start (медленный старт).** В начале соединения TCP не знает пропускную способность пути. Окно cwnd начинается с одного MSS и **удваивается** с каждым RTT — рост экспоненциальный. Название обманчиво: «медленным» он называется лишь по сравнению с тем, как раньше отправляли сразу всё окно. Рост продолжается до порога **ssthresh**.","**Congestion Avoidance (предотвращение перегрузки).** После ssthresh TCP переключается на **линейный рост**: cwnd увеличивается на один MSS за каждый RTT. Это позволяет аккуратно нащупать предел, не вызывая резкой перегрузки.","**Реакция на потерю.** TCP считает потерю пакета сигналом перегрузки. При таймауте (тяжёлый случай): ssthresh = cwnd/2, cwnd сбрасывается в 1 MSS, начинается slow start заново. При получении **трёх дублирующих ACK** (более мягкий сигнал) срабатывает **Fast Retransmit** — сегмент передаётся немедленно. За ним следует **Fast Recovery** (TCP Reno): cwnd уменьшается вдвое, и TCP сразу переходит в congestion avoidance, минуя slow start.","**TCP Cubic** (стандарт Linux) использует **кубическую функцию** для роста окна. Это эффективнее на каналах с большим произведением полосы на задержку (bandwidth-delay product), так как позволяет быстрее восстановить скорость после потери.","**Эффективная скорость** TCP приблизительно равна min(cwnd, rwnd) / RTT.","**Проблемы беспроводного соединения.** TCP спроектирован для проводных сетей, где потеря пакета почти всегда означает перегрузку. В беспроводных сетях ситуация иная: потери вызваны **помехами, замиранием сигнала и сменой базовой станции** (handover), а не переполнением маршрутизаторов. Но TCP не различает причину — он снижает cwnd при любой потере, хотя сеть не перегружена. В результате TCP на беспроводных каналах работает значительно хуже, чем мог бы.","**Решения.** **Explicit Loss Notification (ELN)** — базовая станция сообщает TCP, что потеря не от перегрузки, и TCP не снижает окно. **Split TCP** — соединение разделяется на проводной участок с обычным TCP и беспроводной с адаптированным протоколом. **Локальная повторная передача** на канальном уровне — беспроводное звено само исправляет потери до того, как TCP их заметит. **ECN** (Explicit Congestion Notification) — маршрутизаторы помечают пакеты при начале перегрузки, позволяя TCP реагировать до потери."],"terms":[{"ru":"AIMD","en":"Additive Increase, Multiplicative Decrease","df":"аддитивный рост, мультипликативное снижение — принцип справедливого деления полосы"},{"ru":"ssthresh","en":"Slow Start Threshold","df":"порог перехода от экспоненциального к линейному росту cwnd"},{"ru":"ECN","en":"Explicit Congestion Notification","df":"явное уведомление о перегрузке от маршрутизатора"},{"ru":"BDP","en":"Bandwidth-Delay Product","df":"произведение полосы на задержку — объём данных в полёте"}],"summary":["","**Суть:** Контроль перегрузки защищает **сеть** (не путать с flow control, защищающим получателя).","","**Перегрузка:** пакетов поступает больше, чем сеть может обработать. Пакеты теряются, задержки растут. Тяжёлый случай — **коллапс перегрузки**.","","**Два окна в TCP:**","- **rwnd** (receive window) — защита получателя.","- **cwnd** (congestion window) — защита сети.","- Отправитель посылает не больше **min(cwnd, rwnd)** байт.","","**Выделение пропускной способности:**","- **Max-min fairness** — нельзя увеличить долю одного потока, не уменьшив долю потока, получающего меньше.","- **AIMD (Additive Increase, Multiplicative Decrease)** — TCP растёт на 1, при потере уменьшается вдвое. Математически даёт справедливость.","","**Регулирование скорости (фазы TCP):**","- **Slow Start** — cwnd растёт экспоненциально (×2 за RTT) до ssthresh.","- **Congestion Avoidance** — линейный рост (+1 MSS за RTT).","- **Fast Retransmit** — после 3 дупл. ACK повтор сразу.","- **Fast Recovery** (TCP Reno) — cwnd/2, без сброса в 1.","- **TCP Cubic** (Linux) — кубическая функция роста для быстрых каналов.","","**Формула эффективной скорости:** min(cwnd, rwnd) / RTT.","","**Беспроводные соединения:**","- В беспроводных потери — от **помех**, не от перегрузки.","- TCP снижает cwnd → **неэффективно**.","- Решения:","- **ELN** (Explicit Loss Notification) — базовая станция сообщает причину.","- **Split TCP** — два соединения (проводное + беспроводное).","- **ECN** (Explicit Congestion Notification) — пометка пакетов вместо сброса.","- Локальные повторные передачи на канальном уровне.","","**Для устного:** Flow control (rwnd) vs Congestion control (cwnd) — разные задачи."]},{"n":45,"title":"Основы UDP. Вызов удалённой процедуры. Транспортные протоколы реального масштаба времени.","paragraphs":["**UDP** (User Datagram Protocol) — протокол транспортного уровня **без установления соединения**. Он не гарантирует доставку, порядок и целостность данных, зато минимизирует задержки и накладные расходы. По сути, UDP — это тонкая надстройка над IP, добавляющая только адресацию по портам и необязательную контрольную сумму.","**Заголовок UDP** занимает всего **8 байт** и содержит четыре поля: порт отправителя, порт получателя, длину датаграммы и контрольную сумму. Для сравнения, заголовок TCP — минимум 20 байт. Простота заголовка — ключевое преимущество UDP.","**Применение UDP:** DNS-запросы (короткие, идемпотентные), DHCP (клиент ещё не имеет IP-адреса), потоковое видео и аудио, онлайн-игры — везде, где **скорость важнее надёжности** и допустима потеря отдельных пакетов.","**Вызов удалённой процедуры (RPC).** RPC (Remote Procedure Call) — это механизм, позволяющий программе вызывать процедуру на удалённом узле так, как если бы она была локальной. Цель — скрыть от разработчика детали сетевого взаимодействия.","Работает RPC следующим обр
