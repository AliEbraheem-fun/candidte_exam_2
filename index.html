<script>
const TOPICS = [{"id":1,"name":"Общие принципы построения сетей","questions":[{"n":1,"title":"Классификация компьютерных сетей. Сети в организациях. Использование сетей частными лицами. Использование беспроводных сетей.","paragraphs":["**Классификация по масштабу:** PAN, LAN, MAN, WAN, **межсетевые соединения** (internetworks).","**Классификация по топологии:** шина (bus), звезда (star), кольцо (ring), полная сетка (full mesh), гибридная.","**По технологии передачи:** **широковещательная рассылка** (broadcast) и **коммутация пакетов** (packet switching).","**Сети в организациях:**\n- Совместный доступ к серверам, принтерам, БД. Обычно Ethernet + VPN между офисами.","**Сети частных лиц:**\n- Интернет, стриминг, игры. Подключение через DSL / кабель / GPON + Wi-Fi роутер.","**Беспроводные сети** (wireless networks):\n- Технологии: Wi-Fi (802.11), Bluetooth, Zigbee, 3G/4G/5G.\n- Важны там, где прокладка кабеля невозможна (склады, стройки, удалённые регионы)."],"terms":[{"ru":"Широковещательная рассылка","en":"broadcast","df":"режим передачи, при котором сообщение доставляется всем узлам сети одновременно"},{"ru":"Коммутация пакетов","en":"packet switching","df":"метод передачи данных, при котором информация разбивается на пакеты и каждый маршрутизируется независимо"},{"ru":"Топология","en":"topology","df":"физическая или логическая схема соединения узлов сети"},{"ru":"Межсетевое соединение","en":"internetwork / internet","df":"объединение нескольких разнородных сетей в единую инфраструктуру"},{"ru":"Выделенный канал","en":"leased line","df":"арендуемый у оператора постоянный канал связи с гарантированной полосой пропускания"},{"ru":"Широкополосное подключение","en":"broadband connection","df":"высокоскоростное подключение к Интернету (DSL, кабель, оптика)"}],"summary":["","**Суть:** Компьютерная сеть — система связанных устройств для обмена данными и совместного использования ресурсов.","","**Классификация по масштабу:**","- **PAN** (Personal Area Network) — до 10 м (Bluetooth, USB).","- **LAN** (Local) — здание, офис (Ethernet, Wi-Fi).","- **MAN** (Metropolitan) — город.","- **WAN** (Wide) — страны, континенты (Интернет).","","**По архитектуре:** клиент-сервер (банк, веб) и одноранговая (peer-to-peer, BitTorrent).","**По топологии:** звезда, шина, кольцо, ячеистая (mesh), дерево.","**По среде:** проводные и беспроводные.","","**Применение в организациях:** совместный доступ к ресурсам (файлы, принтеры), централизованное управление, корпоративная почта, VoIP.","**Частные лица:** Интернет, соцсети, стриминг, онлайн-игры, IoT (умный дом).","**Беспроводные:** мобильность, но требуют шифрования (WPA2/WPA3), аутентификации, планирования покрытия.","","**Для устного:** PAN < LAN < MAN < WAN. Переход от проводных к беспроводным — главный тренд."]},{"n":2,"title":"Персональные, локальные, муниципальные, глобальные сети. Объединение сетей. Иерархия сетевых протоколов. Ключевые аспекты создания компьютерной сети.","paragraphs":["**Типы сетей по масштабу:**\n- **PAN** (Personal Area Network) — несколько метров, Bluetooth. Связь телефона, ноутбука, гарнитуры.\n- **LAN** (Local Area Network) — здание/кампус, 100 Мбит/с – 100 Гбит/с, низкая задержка.\n- **MAN** (Metropolitan Area Network) — город. Пример: кабельное ТВ, WiMAX.\n- **WAN** (Wide Area Network) — сотни/тысячи км, инфраструктура операторов связи.","**Объединение сетей** (internetworking):\n- **Маршрутизаторы** (routers, L3) — передача пакетов между сетями по IP-адресам.\n- **Шлюзы** (gateways) — преобразование протоколов между несовместимыми стеками.\n- Также используются **туннелирование** (tunneling) и **NAT**.","**Иерархия протоколов:**\n- Многоуровневая архитектура: каждый уровень использует услуги нижнего и предоставляет услуги верхнему.\n- **Стек протоколов** (protocol stack) — набор протоколов всех уровней.\n- **Инкапсуляция** (encapsulation) — данные оборачиваются заголовком на каждом уровне.","**Ключевые аспекты создания сети:**\n- **Надёжность** (reliability), **масштабируемость** (scalability), **безопасность** (security), **QoS** (Quality of Service), **управляемость** (manageability)."],"terms":[{"ru":"PAN","en":"Personal Area Network","df":"персональная сеть; охватывает несколько метров вокруг пользователя"},{"ru":"LAN","en":"Local Area Network","df":"локальная вычислительная сеть; охватывает здание или кампус"},{"ru":"MAN","en":"Metropolitan Area Network","df":"муниципальная сеть; охватывает город"},{"ru":"WAN","en":"Wide Area Network","df":"глобальная сеть; охватывает страну или континент"},{"ru":"Маршрутизатор","en":"router","df":"сетевое устройство уровня 3, обеспечивающее передачу пакетов между разными сетями по IP-адресам"},{"ru":"Шлюз","en":"gateway","df":"устройство, обеспечивающее преобразование протоколов при соединении сетей с различными стеками"},{"ru":"Туннелирование","en":"tunneling","df":"инкапсуляция пакетов одного протокола внутри другого для передачи через несовместимую сеть"},{"ru":"Инкапсуляция","en":"encapsulation","df":"добавление служебного заголовка к данным на каждом уровне стека"},{"ru":"Стек протоколов","en":"protocol stack","df":"набор протоколов, реализующих все уровни сетевой модели"},{"ru":"Качество обслуживания","en":"QoS, Quality of Service","df":"механизмы управления приоритетами трафика для обеспечения требуемых характеристик передачи"}],"summary":["","**Суть:** Сети разных масштабов соединяются маршрутизаторами в единую структуру — Интернет.","","**Типы сетей:** PAN (человек), LAN (здание), MAN (город), WAN (мир).","**Объединение:** через **маршрутизаторы** (router) и **шлюзы** (gateway) с помощью маршрутизации.","","**Иерархия протоколов (уровни):**","- Каждый уровень решает свою задачу и предоставляет сервис верхнему.","- **OSI** — 7 уровней (эталон).","- **TCP/IP** — 4–5 уровней (практика).","","**Ключевые аспекты проектирования:**","1. Требования и масштаб (сколько пользователей, какой трафик).","2. Топология.","3. Адресация и маршрутизация.","4. Пропускная способность и QoS.","5. Безопасность.","6. Отказоустойчивость.","7. Администрирование и мониторинг.","8. Стоимость.","","**Для устного:** Уровни нужны, чтобы разделить сложность. Маршрутизатор работает на сетевом уровне (L3)."]},{"n":3,"title":"Службы на основе соединений и службы без установления соединения. Примитивы служб. Службы и протоколы.","paragraphs":["**Служба** (service) — набор операций, которые нижний уровень предоставляет верхнему через **SAP** (Service Access Point).","**Два класса служб:**\n- **С установлением соединения** (connection-oriented) — как телефон: соединение → данные → разрыв. Упорядоченная доставка. Пример: TCP.\n- **Без установления соединения** (connectionless) — как почта: каждая **датаграмма** идёт независимо, порядок не гарантирован. Пример: UDP, IP.\n- Обе могут быть **надёжными** (reliable) или **ненадёжными** (unreliable).","**Примитивы служб** (service primitives) — элементарные операции:\n- LISTEN, CONNECT, ACCEPT, RECEIVE, SEND, DISCONNECT.","**Служба vs протокол:**\n- **Служба** — интерфейс между уровнями на одном узле (вертикально).\n- **Протокол** — правила между одноимёнными уровнями на разных узлах (горизонтально)."],"terms":[{"ru":"Служба","en":"service","df":"интерфейс, предоставляемый нижним уровнем верхнему на одном узле"},{"ru":"Протокол","en":"protocol","df":"набор правил взаимодействия одноимённых уровней на разных узлах сети"},{"ru":"SAP","en":"Service Access Point","df":"точка доступа к службе; место, где вышестоящий уровень обращается к нижестоящему"},{"ru":"Соединение","en":"connection","df":"логический канал связи между двумя сторонами с сохранением состояния"},{"ru":"Датаграмма","en":"datagram","df":"самодостаточный пакет, маршрутизируемый независимо"},{"ru":"Примитив службы","en":"service primitive","df":"элементарная операция интерфейса (SEND, RECEIVE, CONNECT и др.)"},{"ru":"Надёжная служба","en":"reliable service","df":"служба с гарантией доставки всех данных без потерь и дублирования"},{"ru":"TCP","en":"Transmission Control Protocol","df":"протокол транспортного уровня с установлением соединения"},{"ru":"UDP","en":"User Datagram Protocol","df":"протокол транспортного уровня без установления соединения"}],"summary":["","**Суть:** Уровень предлагает верхнему уровню **сервис** (что делает). Протокол описывает, **как** одноранговые сущности реализуют этот сервис.","","**Connection-oriented (с соединением):**","- Сначала установка сеанса (setup) → передача → разрыв (teardown).","- Гарантирует надёжность и порядок.","- Пример: **TCP**, телефон.","","**Connectionless (без соединения):**","- Каждый пакет независим.","- Нет гарантий.","- Пример: **UDP**, IP, почта.","","**Примитивы сервиса (абстрактные операции):**","- **LISTEN** — ждать соединение.","- **CONNECT** — установить.","- **SEND / RECEIVE** — отправить/получить.","- **DISCONNECT** — разорвать.","- Другой вариант: request, indication, response, confirm.","","**Сервис vs протокол:** сервис — **что** предоставляется (интерфейс); протокол — **как** это реализуется (обмен сообщениями).","","**Для устного:** TCP = connection-oriented + надёжный. UDP = connectionless + быстрый."]},{"n":4,"title":"Эталонные модели ISO и TCP/IP. Сравнение эталонных моделей OSI и TCP. Критика моделей. Примеры сетей.","paragraphs":["**Модель OSI** (7 уровней, нормативная — создана до протоколов):\n- L1 **Физический** (physical) — биты по среде (кабель, радио).\n- L2 **Канальный** (data link) — кадры между соседними узлами, MAC.\n- L3 **Сетевой** (network) — маршрутизация пакетов, IP.\n- L4 **Транспортный** (transport) — сквозная доставка, TCP/UDP.\n- L5 **Сеансовый** (session) — управление сеансами.\n- L6 **Представления** (presentation) — форматы, шифрование.\n- L7 **Прикладной** (application) — HTTP, FTP, SMTP, DNS.","**Модель TCP/IP** (4 уровня, описательная — объясняет уже работающие протоколы):\n- Link → Internet → Transport → Application.","**Сравнение:**\n- OSI чётко разделяет **службу**, **интерфейс**, **протокол**; в TCP/IP они смешаны.\n- OSI: уровни сеанса и представления есть; в TCP/IP их нет (функции — в прикладном уровне).\n- TCP/IP: только connectionless на сетевом (IP), оба варианта на транспортном (TCP, UDP).","**Критика OSI:** появилась поздно (TCP/IP уже победил), уровни 5-6 пусты на практике, реализации громоздкие.","**Критика TCP/IP:** не разделяет службу/интерфейс/протокол, не универсальна (только IP), канальный уровень — не настоящий уровень.","**Итог:** OSI используется для обучения (нумерация L1-L7), TCP/IP — практическая основа Интернета."],"terms":[{"ru":"OSI","en":"Open Systems Interconnection","df":"эталонная семиуровневая модель взаимодействия открытых систем (ISO)"},{"ru":"Физический уровень","en":"physical layer","df":"уровень 1; передача битов по физической среде"},{"ru":"Канальный уровень","en":"data link layer","df":"уровень 2; передача кадров между узлами одной сети"},{"ru":"Сетевой уровень","en":"network layer","df":"уровень 3; маршрутизация пакетов между сетями"},{"ru":"Транспортный уровень","en":"transport layer","df":"уровень 4; сквозная доставка данных между приложениями"},{"ru":"Сеансовый уровень","en":"session layer","df":"уровень 5; управление сеансами связи"},{"ru":"Уровень представления","en":"presentation layer","df":"уровень 6; преобразование форматов данных, шифрование"},{"ru":"Прикладной уровень","en":"application layer","df":"уровень 7 (OSI) / уровень 4 (TCP/IP); протоколы приложений (HTTP, FTP, DNS)"},{"ru":"Де-факто стандарт","en":"de facto standard","df":"стандарт, сложившийся в результате широкого практического применения, а не формального утверждения"}],"summary":["","**Суть:** Две эталонные модели уровней: теоретическая OSI и практическая TCP/IP.","","**Модель OSI (7 уровней):**","1. Физический (биты).","2. Канальный (кадры, MAC).","3. Сетевой (пакеты, IP).","4. Транспортный (сегменты, TCP/UDP).","5. Сеансовый.","6. Представительский.","7. Прикладной.","","**Модель TCP/IP (4 уровня):** Канальный → Сетевой (Интернет) → Транспортный → Прикладной. Сеансовый и представительский объединены в прикладной.","","**Сравнение:**","- OSI более строгая и концептуальная, но сложная.","- TCP/IP менее чёткая, но реально работает (на ней Интернет).","- OSI изначально без встроенной безопасности.","","**Критика OSI:** плохой тайминг (стандарт вышел поздно), сложность, плохая реализация. **Критика TCP/IP:** нечёткое разделение уровней, зависимость от TCP.","","**Примеры сетей:** домашняя Wi-Fi LAN, офис LAN, городская MAN, Интернет (WAN), сотовые сети, Bluetooth PAN.","","**Для устного:** OSI учат, TCP/IP используют."]},{"n":5,"title":"Примеры сетей: Интернет, мобильная телефонная сеть, беспроводные ЛВС: 802.11, RFID и сенсорные сети.","paragraphs":["**Интернет:**\n- Глобальная сеть на TCP/IP. Состоит из сетей доступа (access networks) и магистралей (backbone).\n- Провайдеры (**ISP**) обмениваются трафиком через **IXP** (Internet Exchange Point). Адресами управляет **ICANN**.","**Мобильная телефонная сеть:**\n- Территория делится на **соты** (cells), в каждой — **базовая станция** (BS).\n- При перемещении — **хэндовер** (handover). Поколения: 1G (аналог), 2G (GSM), 3G (UMTS), 4G (LTE), 5G.","**Wi-Fi (IEEE 802.11):**\n- Диапазоны 2,4 / 5 / 6 ГГц. **Точки доступа** (AP) подключены к проводной сети. Метод доступа — **CSMA/CA**.","**RFID** (Radio Frequency Identification):\n- Бесконтактная идентификация. Метки: пассивные (питание от считывателя) и активные (свой источник).","**Сенсорные сети** (sensor networks):\n- Маломощные узлы с датчиками, передают данные к **sink**-узлу. Протоколы: Zigbee, LoRaWAN."],"terms":[{"ru":"ISP","en":"Internet Service Provider","df":"провайдер интернет-услуг; оператор, предоставляющий доступ в Интернет"},{"ru":"IXP","en":"Internet Exchange Point","df":"точка обмена интернет-трафиком между провайдерами"},{"ru":"Сота / ячейка","en":"cell","df":"географическая зона, обслуживаемая одной базовой станцией сотовой сети"},{"ru":"Хэндовер","en":"handover / handoff","df":"переключение мобильного устройства от одной базовой станции к другой"},{"ru":"Точка доступа","en":"access point, AP","df":"устройство, обеспечивающее беспроводное подключение к проводной сети"},{"ru":"CSMA/CA","en":"Carrier Sense Multiple Access with Collision Avoidance","df":"метод доступа к беспроводной среде с обнаружением несущей и предотвращением коллизий"},{"ru":"RFID","en":"Radio Frequency Identification","df":"радиочастотная идентификация объектов с помощью меток"},{"ru":"Сенсорная сеть","en":"sensor network / WSN — Wireless Sensor Network","df":"беспроводная сеть из множества маломощных устройств с датчиками"},{"ru":"ICANN","en":"Internet Corporation for Assigned Names and Numbers","df":"организация, управляющая доменными именами и IP-адресами Интернета"}],"summary":["","**Суть:** Разные типы сетей решают разные задачи.","","**Интернет:**","- Глобальная «сеть сетей».","- IP-маршрутизация.","- Протоколы: TCP/IP, HTTP, DNS.","","**Мобильная сеть (сотовая):**","- Территория делится на **соты** с базовыми станциями.","- Мобильность (handover), SIM/eSIM-аутентификация.","- Поколения 1G–5G.","","**Wi-Fi (802.11):**","- Беспроводная локальная сеть.","- **Точки доступа (AP)** + клиенты.","- CSMA/CA, шифрование WPA2/WPA3.","","**RFID** (Radio-Frequency Identification):","- Метки с идентификаторами + считыватели.","- Обычно **пассивные** (используют энергию сигнала считывателя).","- Применение: пропуска, логистика, магазины.","","**Сенсорные/IoT сети:**","- Множество маломощных узлов + шлюзы.","- Энергоэффективность, надёжность.","- Протоколы: Zigbee, LoRa, 6LoWPAN.","","**Для устного:** все эти сети входят в «Интернет вещей» (IoT)."]},{"n":6,"title":"Стандартизация сетей. Отечественные и зарубежные организации по стандартизации: телекоммуникации, сеть Интернет, вопросы безопасности.","paragraphs":["Стандартизация в телекоммуникациях обеспечивает совместимость оборудования и протоколов разных производителей и стран. Стандарты делятся на два типа:\n- **Де-юре** (de jure) — официально утверждённые органами стандартизации (ISO, ITU).\n- **Де-факто** (de facto) — сложившиеся через широкое практическое применение (Ethernet, TCP/IP).","**1. Телекоммуникации — международные организации:**\n- **ITU** (International Telecommunication Union) — агентство ООН по телекоммуникациям.\n  - **ITU-T** — стандарты телефонных сетей и передачи данных (серии рекомендаций V, X, G, H).\n  - **ITU-R** — распределение радиочастотного спектра.\n- **ISO** (International Organization for Standardization) — разработала модель OSI, серию ISO/IEC 27000 (информационная безопасность).\n- **IEEE** (Institute of Electrical and Electronics Engineers) — стандарты локальных и беспроводных сетей:\n  - 802.3 (Ethernet), 802.11 (Wi-Fi), 802.15 (Bluetooth/Zigbee), 802.16 (WiMAX).","**2. Интернет:**\n- **IETF** (Internet Engineering Task Force) — открытое сообщество инженеров, публикует стандарты в виде документов **RFC** (Request for Comments).\n  - **IAB** (Internet Architecture Board) — комитет внутри IETF, определяет архитектурные принципы Интернета и осуществляет надзор за функцией IANA.\n- **ICANN** (Internet Corporation for Assigned Names and Numbers) — независимая некоммерческая организация, управляет доменными именами и координирует систему DNS.\n  - **IANA** (Internet Assigned Numbers Authority) — функция внутри ICANN, управляет IP-адресами, номерами AS и параметрами протоколов по политикам IETF.\n- **W3C** (World Wide Web Consortium) — стандарты Веба (HTML, CSS, XML).","**3. Безопасность:**\n- **ISO/IEC 27001, 27002** — системы управления информационной безопасностью (ISMS).\n- **NIST** (National Institute of Standards and Technology, США) — стандарты FIPS в области криптографии и кибербезопасности.\n- **ETSI** (European Telecommunications Standards Institute) — стандарты для европейского рынка (GSM, TISPAN).","**4. Россия:**\n- **Росстандарт** — ГОСТ Р (национальные стандарты).\n- **Минцифры** — регулирование в сфере ИТ и связи.\n- **СОРМ** — технические требования к операторам связи для обеспечения оперативно-розыскных мероприятий."],"terms":[{"ru":"Стандарт де-юре","en":"de jure standard","df":"официально утверждённый стандарт уполномоченной организацией"},{"ru":"Стандарт де-факто","en":"de facto standard","df":"стандарт, сложившийся в результате широкого применения без официального утверждения"},{"ru":"ITU","en":"International Telecommunication Union","df":"Международный союз электросвязи; агентство ООН по телекоммуникациям"},{"ru":"ISO","en":"International Organization for Standardization","df":"Международная организация по стандартизации"},{"ru":"IEEE","en":"Institute of Electrical and Electronics Engineers","df":"Институт инженеров электротехники и электроники"},{"ru":"IETF","en":"Internet Engineering Task Force","df":"организация, разрабатывающая интернет-стандарты в форме RFC"},{"ru":"RFC","en":"Request for Comments","df":"документ с техническими спецификациями протоколов Интернета"},{"ru":"NIST","en":"National Institute of Standards and Technology","df":"Национальный институт стандартов и технологий США"},{"ru":"ETSI","en":"European Telecommunications Standards Institute","df":"Европейский институт телекоммуникационных стандартов"}],"summary":["","**Суть:** Стандартизация нужна для совместимости оборудования разных производителей.","","**Зачем нужна:** interoperability, compatibility, безопасность.","","**Телекоммуникации:**","- **ITU-T** (Международный союз электросвязи).","- **ETSI** (Европейский институт).","- **IEEE 802** (Wi-Fi, Ethernet).","- **3GPP** (сотовые стандарты).","","**Интернет:**","- **IETF** (RFC — стандарты Интернета).","- **ICANN/IANA** (доменные имена, номера портов).","- **W3C** (веб-стандарты, HTML, CSS).","","**Безопасность:**","- **ISO/IEC** (серия 27000 — управление ИБ).","- **NIST** (США, FIPS-стандарты: AES, SHA).","- **IETF Security RFCs**.","","**Российские:**","- **Росстандарт** — ГОСТы.","- **ФСБ** — лицензирование криптографии.","- **ФСТЭК** — техническая защита информации.","","**Для устного:** IEEE → сети, IETF → Интернет, NIST → криптография, ФСБ/ФСТЭК → Россия."]}],"quizzes":[{"type":"mcq","topic":"Вопрос 1","q":"Какой тип сети охватывает масштаб города?","opts":["PAN","LAN","MAN","WAN"],"ans":2,"expl":"MAN (Metropolitan Area Network) охватывает город. PAN — метры, LAN — здание/кампус, WAN — сотни-тысячи км."},{"type":"mcq","topic":"Вопрос 1","q":"Какая топология соединяет каждый узел с каждым?","opts":["Шина (bus)","Звезда (star)","Кольцо (ring)","Полная сетка (full mesh)"],"ans":3,"expl":"Полная сетка (full mesh) — топология, где каждый узел соединён с каждым другим."},{"type":"mcq","topic":"Вопрос 1","q":"Какой стандарт соответствует технологии Wi-Fi?","opts":["802.3","802.11","802.15","802.16"],"ans":1,"expl":"Wi-Fi — это семейство стандартов IEEE 802.11."},{"type":"mcq","topic":"Вопрос 1","q":"Какая технология НЕ относится к беспроводным сетям?","opts":["Bluetooth","Zigbee","GPON","5G"],"ans":2,"expl":"GPON — оптоволоконная (проводная) технология для домашних сетей. Bluetooth, Zigbee и 5G — беспроводные."},{"type":"mcq","topic":"Вопрос 1","q":"Какие два основных подхода к передаче данных различают по технологии?","opts":["Аналоговый и цифровой","Broadcast и packet switching","Проводной и беспроводной","Синхронный и асинхронный"],"ans":1,"expl":"По технологии передачи сети делятся на broadcast (широковещательные) и packet switching (с коммутацией пакетов)."},{"type":"mcq","topic":"Вопрос 1","q":"Какая технология НЕ характерна для корпоративных сетей?","opts":["Ethernet","VPN","Выделенные каналы","Zigbee"],"ans":3,"expl":"Корпоративные сети используют Ethernet, VPN, выделенные каналы и централизованное управление. Zigbee — технология для сенсорных/IoT-сетей."},{"type":"tf","topic":"Вопрос 1","q":"DSL, кабельный Интернет и GPON — типичные технологии домашних сетей.","ans":true,"expl":"Верно. Домашние сети используют DSL, кабельный Интернет, GPON + беспроводной маршрутизатор."},{"type":"tf","topic":"Вопрос 1","q":"Беспроводные сети особенно важны там, где прокладка кабеля невозможна: склады, стройплощадки, удалённые регионы.","ans":true,"expl":"Верно. Именно эти примеры приводятся: склады, стройплощадки, удалённые регионы."},{"type":"tf","topic":"Вопрос 1","q":"Гибридная топология — это разновидность классификации сетей по масштабу.","ans":false,"expl":"Неверно. Гибридная — это классификация по топологии, а не по масштабу. По масштабу: PAN, LAN, MAN, WAN."},{"type":"tf","topic":"Вопрос 1","q":"Bluetooth относится к технологиям корпоративных сетей.","ans":false,"expl":"Неверно. Bluetooth — беспроводная технология (наряду с Wi-Fi, Zigbee, 3G/4G/5G). Корпоративные сети: Ethernet, VPN, выделенные каналы."},{"type":"match","topic":"Вопрос 1","q":"Сопоставьте тип сети с его характеристикой:","pairs":[{"l":"Корпоративная","r":"Ethernet, VPN, централизованное управление"},{"l":"Домашняя","r":"DSL, кабельный Интернет, GPON"},{"l":"Беспроводная","r":"Wi-Fi, Bluetooth, Zigbee, 3G/4G/5G"},{"l":"По топологии","r":"Шина, звезда, кольцо, полная сетка"}],"expl":"Каждый тип сети имеет свои характерные технологии и признаки классификации."},{"type":"mcq","topic":"Вопрос 2","q":"Какова типичная скорость передачи данных в LAN?","opts":["1–10 Мбит/с","100 Мбит/с – 100 Гбит/с","1–10 Гбит/с только","До 1 Мбит/с"],"ans":1,"expl":"LAN: здание/кампус, скорости от 100 Мбит/с до 100 Гбит/с."},{"type":"mcq","topic":"Вопрос 2","q":"Какое устройство работает на уровне L3 и использует IP-адреса для объединения сетей?","opts":["Коммутатор (switch)","Маршрутизатор (router)","Хаб (hub)","Точка доступа (AP)"],"ans":1,"expl":"Маршрутизаторы работают на уровне L3 и используют IP-адреса для объединения сетей (internetworking)."},{"type":"mcq","topic":"Вопрос 2","q":"Что выполняет шлюз (gateway) при объединении сетей?","opts":["Фильтрацию по MAC-адресам","Преобразование протоколов","Усиление сигнала","Назначение IP-адресов"],"ans":1,"expl":"Шлюзы выполняют преобразование протоколов при объединении разнородных сетей."},{"type":"mcq","topic":"Вопрос 2","q":"Какой технологией характеризуется MAN?","opts":["Bluetooth","WiMAX и кабельное ТВ","Zigbee","LoRaWAN"],"ans":1,"expl":"MAN (городская сеть) характеризуется технологиями WiMAX и кабельного ТВ."},{"type":"mcq","topic":"Вопрос 2","q":"Что означает инкапсуляция в контексте стека протоколов?","opts":["Шифрование данных","Оборачивание данных заголовком и трейлером","Сжатие пакетов","Маршрутизация данных"],"ans":1,"expl":"Инкапсуляция — процесс, при котором данные оборачиваются заголовком (header) и трейлером (trailer) на каждом уровне."},{"type":"tf","topic":"Вопрос 2","q":"PAN охватывает расстояние порядка метров и типичная технология — Bluetooth.","ans":true,"expl":"Верно. PAN: ~метры, Bluetooth."},{"type":"tf","topic":"Вопрос 2","q":"WAN охватывает территорию здания или кампуса.","ans":false,"expl":"Неверно. WAN охватывает сотни-тысячи километров (операторы). Здание/кампус — это LAN."},{"type":"tf","topic":"Вопрос 2","q":"NAT и туннелирование — методы объединения сетей (internetworking).","ans":true,"expl":"Верно. Internetworking включает: маршрутизаторы, шлюзы, туннелирование, NAT."},{"type":"tf","topic":"Вопрос 2","q":"В многоуровневой иерархии протоколов каждый уровень предоставляет услуги нижестоящему уровню.","ans":false,"expl":"Неверно. Каждый уровень предоставляет услуги вышестоящему уровню, а не нижестоящему."},{"type":"match","topic":"Вопрос 2","q":"Сопоставьте тип сети с его масштабом и характеристикой:","pairs":[{"l":"PAN","r":"~метры, Bluetooth"},{"l":"LAN","r":"Здание/кампус, 100 Мбит/с – 100 Гбит/с"},{"l":"MAN","r":"Город, WiMAX, кабельное ТВ"},{"l":"WAN","r":"Сотни-тысячи км, операторы"}],"expl":"PAN/LAN/MAN/WAN различаются по масштабу и характерным технологиям."},{"type":"match","topic":"Вопрос 2","q":"Сопоставьте аспект проектирования сетей с его переводом:","pairs":[{"l":"Надёжность","r":"Reliability"},{"l":"Масштабируемость","r":"Scalability"},{"l":"Безопасность","r":"Security"},{"l":"Управляемость","r":"Manageability"}],"expl":"Ключевые аспекты: надёжность (reliability), масштабируемость (scalability), безопасность (security), QoS, управляемость (manageability)."},{"type":"mcq","topic":"Вопрос 3","q":"Через что предоставляется служба (service) в модели OSI?","opts":["IP-адрес","MAC-адрес","SAP (Service Access Point)","API"],"ans":2,"expl":"Служба предоставляется через SAP (Service Access Point) — точку доступа к службе."},{"type":"mcq","topic":"Вопрос 3","q":"Какой протокол является примером connection-oriented службы?","opts":["UDP","IP","TCP","ICMP"],"ans":2,"expl":"TCP — пример connection-oriented (с установлением соединения): setup → data → disconnect."},{"type":"mcq","topic":"Вопрос 3","q":"Какая последовательность фаз характерна для connection-oriented службы?","opts":["data → setup → disconnect","setup → data → disconnect","connect → listen → send","send → receive → disconnect"],"ans":1,"expl":"Connection-oriented (как телефон): setup → data → disconnect."},{"type":"mcq","topic":"Вопрос 3","q":"Какой примитив используется для ожидания входящего соединения?","opts":["CONNECT","ACCEPT","LISTEN","RECEIVE"],"ans":2,"expl":"LISTEN — примитив для ожидания входящего соединения. Полный набор: LISTEN, CONNECT, ACCEPT, SEND, RECEIVE, DISCONNECT."},{"type":"mcq","topic":"Вопрос 3","q":"Служба — это взаимодействие...","opts":["Горизонтальное, между узлами","Вертикальное, между уровнями одного узла","Диагональное, между разными уровнями разных узлов","Внешнее, между сетями"],"ans":1,"expl":"Служба = вертикальное взаимодействие (между уровнями на одном узле). Протокол = горизонтальное (одинаковые уровни, разные узлы)."},{"type":"tf","topic":"Вопрос 3","q":"Connectionless служба передаёт данные как независимые датаграммы, подобно почте.","ans":true,"expl":"Верно. Connectionless = почта: датаграммы передаются независимо. Примеры: UDP, IP."},{"type":"tf","topic":"Вопрос 3","q":"UDP является примером connection-oriented протокола.","ans":false,"expl":"Неверно. UDP — пример connectionless (без установления соединения). TCP — connection-oriented."},{"type":"tf","topic":"Вопрос 3","q":"Протокол — это горизонтальное взаимодействие между одинаковыми уровнями на разных узлах.","ans":true,"expl":"Верно. Протокол = горизонтальное (peer-to-peer) взаимодействие между одинаковыми уровнями разных узлов."},{"type":"tf","topic":"Вопрос 3","q":"Служба может быть только reliable (надёжной), без вариантов unreliable.","ans":false,"expl":"Неверно. Служба может быть reliable или unreliable, подтверждаемой или неподтверждаемой."},{"type":"match","topic":"Вопрос 3","q":"Сопоставьте понятие с его аналогией или характеристикой:","pairs":[{"l":"Connection-oriented","r":"Телефон: setup → data → disconnect"},{"l":"Connectionless","r":"Почта: независимые датаграммы"},{"l":"Служба (service)","r":"Вертикальное, между уровнями одного узла"},{"l":"Протокол (protocol)","r":"Горизонтальное, одинаковые уровни разных узлов"}],"expl":"Connection-oriented как телефон (TCP), connectionless как почта (UDP/IP). Служба вертикальна, протокол горизонтален."},{"type":"match","topic":"Вопрос 3","q":"Сопоставьте примитив службы с его назначением:","pairs":[{"l":"LISTEN","r":"Ожидание входящего соединения"},{"l":"CONNECT","r":"Инициирование соединения"},{"l":"ACCEPT","r":"Принятие входящего соединения"},{"l":"DISCONNECT","r":"Разрыв соединения"}],"expl":"Основные примитивы: LISTEN, CONNECT, ACCEPT, SEND, RECEIVE, DISCONNECT."},{"type":"mcq","topic":"Вопрос 4","q":"Сколько уровней в модели OSI?","opts":["4","5","6","7"],"ans":3,"expl":"Модель OSI содержит 7 уровней: физический, канальный, сетевой, транспортный, сеансовый, представления, прикладной."},{"type":"mcq","topic":"Вопрос 4","q":"Сколько уровней в модели TCP/IP?","opts":["4","5","6","7"],"ans":0,"expl":"Модель TCP/IP содержит 4 уровня: link, internet, transport, application."},{"type":"mcq","topic":"Вопрос 4","q":"Какой уровень OSI отвечает за кодирование, сжатие и шифрование?","opts":["L5 сеансовый","L6 представления","L7 прикладной","L4 транспортный"],"ans":1,"expl":"L6 (уровень представления) отвечает за кодирование, сжатие и шифрование данных."},{"type":"mcq","topic":"Вопрос 4","q":"Какие единицы данных используются на канальном уровне (L2) OSI?","opts":["Биты","Кадры (frames)","Пакеты (packets)","Сегменты (segments)"],"ans":1,"expl":"L2 канальный: кадры (frames), MAC-адреса, обработка ошибок."},{"type":"mcq","topic":"Вопрос 4","q":"Модель OSI является...","opts":["Описательной (descriptive)","Нормативной (prescriptive)","Гибридной","Эмпирической"],"ans":1,"expl":"OSI — нормативная (prescriptive) модель, разработанная ISO до создания протоколов. TCP/IP — описательная (descriptive)."},{"type":"mcq","topic":"Вопрос 4","q":"Какой уровень OSI обеспечивает маршрутизацию пакетов?","opts":["L1 физический","L2 канальный","L3 сетевой","L4 транспортный"],"ans":2,"expl":"L3 сетевой уровень отвечает за пакеты, маршрутизацию и IP."},{"type":"mcq","topic":"Вопрос 4","q":"Какая критика относится к модели TCP/IP?","opts":["Слишком много уровней","Не разделяет службу, интерфейс и протокол","Поздно вышла на рынок","Уровни L5/L6 пусты"],"ans":1,"expl":"Критика TCP/IP: не разделяет службу/интерфейс/протокол, не описывает не-IP сети, link не настоящий уровень, плохо для обучения."},{"type":"mcq","topic":"Вопрос 4","q":"На каком уровне TCP/IP IP является единственным connectionless протоколом?","opts":["Link","Internet (L3)","Transport","Application"],"ans":1,"expl":"В TCP/IP на уровне internet (L3) — только connectionless (IP). OSI поддерживает и connection-oriented, и connectionless на L3 и L4."},{"type":"tf","topic":"Вопрос 4","q":"Модель OSI была разработана организацией ISO.","ans":true,"expl":"Верно. OSI: 7 уровней, разработана ISO, нормативная модель."},{"type":"tf","topic":"Вопрос 4","q":"Модель TCP/IP была создана раньше модели OSI и является описательной (descriptive).","ans":true,"expl":"Верно. TCP/IP — описательная модель (DoD), а OSI — нормативная. OSI вышла позже, что стало одной из причин критики."},{"type":"tf","topic":"Вопрос 4","q":"На транспортном уровне (L4) OSI используются пакеты (packets).","ans":false,"expl":"Неверно. На L4 (транспортный) используются сегменты (segments). Пакеты (packets) — на L3 (сетевой)."},{"type":"tf","topic":"Вопрос 4","q":"Сеансовый уровень (L5) OSI отвечает за синхронизацию и контрольные точки.","ans":true,"expl":"Верно. L5 сеансовый: управление сеансами, синхронизация, контрольные точки."},{"type":"tf","topic":"Вопрос 4","q":"Одна из критик OSI состоит в том, что уровни L5 и L6 практически пусты.","ans":true,"expl":"Верно. Критика OSI: поздно вышла, L5/L6 пусты, громоздкие реализации, протоколы не прижились."},{"type":"match","topic":"Вопрос 4","q":"Сопоставьте уровень OSI с его единицей данных:","pairs":[{"l":"L1 физический","r":"Биты"},{"l":"L2 канальный","r":"Кадры (frames)"},{"l":"L3 сетевой","r":"Пакеты (packets)"},{"l":"L4 транспортный","r":"Сегменты (segments)"}],"expl":"Каждый уровень OSI оперирует своей единицей данных: биты → кадры → пакеты → сегменты."},{"type":"match","topic":"Вопрос 4","q":"Сопоставьте уровень OSI с его функцией:","pairs":[{"l":"L5 сеансовый","r":"Сеансы, синхронизация, контрольные точки"},{"l":"L6 представления","r":"Кодирование, сжатие, шифрование"},{"l":"L7 прикладной","r":"HTTP, FTP, SMTP, DNS"},{"l":"L3 сетевой","r":"Маршрутизация, IP"}],"expl":"Верхние уровни OSI: L5 — сеансы, L6 — представление данных, L7 — прикладные протоколы."},{"type":"match","topic":"Вопрос 4","q":"Сопоставьте модель с её характеристикой:","pairs":[{"l":"OSI","r":"7 уровней, ISO, нормативная (prescriptive)"},{"l":"TCP/IP","r":"4 уровня, DoD, описательная (descriptive)"},{"l":"Критика OSI","r":"Поздно вышла, L5/L6 пусты, громоздкая"},{"l":"Критика TCP/IP","r":"Не разделяет службу/интерфейс/протокол"}],"expl":"OSI и TCP/IP имеют разные подходы и разные недостатки."},{"type":"mcq","topic":"Вопрос 5","q":"Какое поколение мобильной связи принесло цифровую передачу и SMS?","opts":["1G","2G","3G","4G"],"ans":1,"expl":"2G (GSM) — цифровая связь + SMS. 1G — аналог, 3G — интернет, 4G — широкополосный."},{"type":"mcq","topic":"Вопрос 5","q":"Какой стандарт соответствует 3G?","opts":["GSM","UMTS","LTE","WiMAX"],"ans":1,"expl":"3G — UMTS (интернет). 2G — GSM, 4G — LTE."},{"type":"mcq","topic":"Вопрос 5","q":"Какой метод доступа к среде используется в Wi-Fi 802.11?","opts":["CSMA/CD","CSMA/CA","TDMA","FDMA"],"ans":1,"expl":"Wi-Fi 802.11 использует CSMA/CA (Carrier Sense Multiple Access with Collision Avoidance)."},{"type":"mcq","topic":"Вопрос 5","q":"Какие частоты используются в Wi-Fi 802.11?","opts":["900 МГц / 1.8 ГГц / 2.1 ГГц","2.4 / 5 / 6 ГГц","1 / 2 / 3 ГГц","5 / 10 / 15 ГГц"],"ans":1,"expl":"Wi-Fi 802.11 работает на частотах 2.4, 5 и 6 ГГц."},{"type":"mcq","topic":"Вопрос 5","q":"Что отличает пассивные RFID-метки от активных?","opts":["Пассивные работают от батареи, активные — от поля считывателя","Пассивные питаются от поля считывателя, активные имеют батарею","Пассивные имеют больший радиус действия","Разницы нет"],"ans":1,"expl":"Пассивные RFID-метки питаются от электромагнитного поля считывателя, активные имеют собственную батарею."},{"type":"mcq","topic":"Вопрос 5","q":"Какие технологии используются в сенсорных сетях?","opts":["Ethernet и GPON","Zigbee и LoRaWAN","WiMAX и DSL","LTE и 5G"],"ans":1,"expl":"Сенсорные сети: маломощные узлы + датчики → sink. Технологии: Zigbee, LoRaWAN."},{"type":"mcq","topic":"Вопрос 5","q":"Что такое handover в мобильных сетях?","opts":["Установка нового соединения","Передача абонента между базовыми станциями (сотами)","Аутентификация пользователя","Шифрование трафика"],"ans":1,"expl":"Handover — передача обслуживания мобильного абонента от одной базовой станции к другой при перемещении между сотами."},{"type":"tf","topic":"Вопрос 5","q":"5G характеризуется сверхнизкой задержкой (ultra-low latency).","ans":true,"expl":"Верно. 5G — сверхнизкая задержка. 4G LTE — широкополосный."},{"type":"tf","topic":"Вопрос 5","q":"1G — это цифровая мобильная связь с поддержкой SMS.","ans":false,"expl":"Неверно. 1G — аналоговая связь. Цифровая + SMS — это 2G (GSM)."},{"type":"tf","topic":"Вопрос 5","q":"Интернет использует архитектуру TCP/IP и включает access networks, backbone, ISP и IXP.","ans":true,"expl":"Верно. Интернет: TCP/IP, access networks + backbone, ISP, IXP, ICANN."},{"type":"tf","topic":"Вопрос 5","q":"RFID используется в логистике, системах контроля доступа и торговле.","ans":true,"expl":"Верно. Применение RFID: логистика, доступ, торговля."},{"type":"tf","topic":"Вопрос 5","q":"В сенсорных сетях данные от датчиков передаются на узел, называемый gateway.","ans":false,"expl":"Неверно. Данные от датчиков передаются на узел sink (сток), а не gateway."},{"type":"match","topic":"Вопрос 5","q":"Сопоставьте поколение мобильной связи с его характеристикой:","pairs":[{"l":"1G","r":"Аналоговая связь"},{"l":"2G (GSM)","r":"Цифровая + SMS"},{"l":"3G (UMTS)","r":"Мобильный интернет"},{"l":"4G (LTE)","r":"Широкополосный доступ"},{"l":"5G","r":"Сверхнизкая задержка"}],"expl":"Эволюция мобильных сетей: 1G аналог → 2G GSM цифра → 3G UMTS интернет → 4G LTE широкополосный → 5G сверхнизкая задержка."},{"type":"match","topic":"Вопрос 5","q":"Сопоставьте тип сети с его ключевыми элементами:","pairs":[{"l":"Интернет","r":"ISP, IXP, ICANN, backbone"},{"l":"Мобильная сеть","r":"Соты (cells), базовые станции, handover"},{"l":"RFID","r":"Считыватель + метки (пассивные/активные)"},{"l":"Сенсорная сеть","r":"Маломощные узлы, датчики, sink"}],"expl":"Каждый тип сети имеет свою архитектуру и ключевые компоненты."},{"type":"mcq","topic":"Вопрос 6","q":"Какая организация отвечает за стандарты RFC в Интернете?","opts":["ISO","IEEE","IETF","ITU"],"ans":2,"expl":"IETF (Internet Engineering Task Force) разрабатывает стандарты в виде RFC (Request for Comments)."},{"type":"mcq","topic":"Вопрос 6","q":"Какая организация управляет распределением IP-адресов и AS?","opts":["IETF","ICANN/IANA","W3C","IEEE"],"ans":1,"expl":"ICANN → IANA отвечает за IP-адреса, номера автономных систем (AS) и параметры протоколов."},{"type":"mcq","topic":"Вопрос 6","q":"Какой стандарт IEEE соответствует Ethernet?","opts":["802.11","802.3","802.15","802.16"],"ans":1,"expl":"IEEE 802.3 — Ethernet, 802.11 — Wi-Fi, 802.15 — Bluetooth/Zigbee, 802.16 — WiMAX."},{"type":"mcq","topic":"Вопрос 6","q":"Какая организация разрабатывает стандарты HTML, CSS, XML?","opts":["IETF","IEEE","ISO","W3C"],"ans":3,"expl":"W3C (World Wide Web Consortium) разрабатывает стандарты HTML, CSS и XML."},{"type":"mcq","topic":"Вопрос 6","q":"Какие серии стандартов разрабатывает ITU-T?","opts":["RFC","V/X/G/H","802.x","ГОСТ Р"],"ans":1,"expl":"ITU-T разрабатывает стандарты серий V, X, G и H. ITU-R занимается распределением спектра."},{"type":"mcq","topic":"Вопрос 6","q":"Какой стандарт описывает систему управления информационной безопасностью (ISMS)?","opts":["NIST FIPS","ISO 27001/27002","IEEE 802.3","ГОСТ Р"],"ans":1,"expl":"ISO 27001/27002 описывает ISMS (Information Security Management System)."},{"type":"mcq","topic":"Вопрос 6","q":"Что такое СОРМ в контексте российской стандартизации?","opts":["Стандарт кодирования данных","Система оперативно-розыскных мероприятий","Сертификат сетевого оборудования","Система оценки рисков в менеджменте"],"ans":1,"expl":"СОРМ — система оперативно-розыскных мероприятий, часть российского регулирования (наряду с Росстандарт ГОСТ Р и Минцифры)."},{"type":"tf","topic":"Вопрос 6","q":"Ethernet и TCP/IP — примеры де-факто стандартов.","ans":true,"expl":"Верно. Де-факто стандарты (на практике): Ethernet, TCP/IP. Де-юре (официальные): ISO, ITU."},{"type":"tf","topic":"Вопрос 6","q":"IEEE 802.16 — это стандарт Wi-Fi.","ans":false,"expl":"Неверно. IEEE 802.16 — это WiMAX. Wi-Fi — это 802.11."},{"type":"tf","topic":"Вопрос 6","q":"IAB (Internet Architecture Board) входит в состав IETF.","ans":true,"expl":"Верно. IAB находится внутри IETF."},{"type":"tf","topic":"Вопрос 6","q":"ETSI — организация, разработавшая стандарты GSM.","ans":true,"expl":"Верно. ETSI (European Telecommunications Standards Institute) разработала стандарты GSM."},{"type":"tf","topic":"Вопрос 6","q":"W3C отвечает за распределение IP-адресов.","ans":false,"expl":"Неверно. За IP-адреса отвечает ICANN/IANA. W3C разрабатывает веб-стандарты: HTML, CSS, XML."},{"type":"match","topic":"Вопрос 6","q":"Сопоставьте стандарт IEEE 802.x с технологией:","pairs":[{"l":"802.3","r":"Ethernet"},{"l":"802.11","r":"Wi-Fi"},{"l":"802.15","r":"Bluetooth / Zigbee"},{"l":"802.16","r":"WiMAX"}],"expl":"Семейство IEEE 802: 802.3 Ethernet, 802.11 Wi-Fi, 802.15 WPAN (Bluetooth/Zigbee), 802.16 WiMAX."},{"type":"match","topic":"Вопрос 6","q":"Сопоставьте организацию с её зоной ответственности:","pairs":[{"l":"IETF","r":"Стандарты RFC для Интернета"},{"l":"ICANN / IANA","r":"IP-адреса, AS, параметры протоколов"},{"l":"W3C","r":"HTML, CSS, XML"},{"l":"ITU-T","r":"Телеком-стандарты серий V/X/G/H"}],"expl":"Каждая организация отвечает за свою область стандартизации."},{"type":"match","topic":"Вопрос 6","q":"Сопоставьте тип стандартизации с примером:","pairs":[{"l":"Де-юре","r":"ISO, ITU"},{"l":"Де-факто","r":"Ethernet, TCP/IP"},{"l":"Безопасность","r":"ISO 27001/27002 ISMS, NIST FIPS"},{"l":"Россия","r":"Росстандарт ГОСТ Р, Минцифры, СОРМ"}],"expl":"Стандарты бывают де-юре (официальные) и де-факто (сложившиеся на практике). Отдельно — безопасность и национальные стандарты."}]},{"id":2,"name":"Физический уровень сетевого стека","questions":[{"n":7,"title":"Теоретические основы передачи данных. Ряды Фурье. Сигналы с ограниченным спектром. Максимальная скорость передачи данных через канал.","paragraphs":["- **Ряд Фурье** (Fourier series) — любой периодический сигнал = сумма синусоид. Частота f = 1/T, гармоники: 2f, 3f, ... nf.\n- **Полоса пропускания** (bandwidth) — диапазон частот канала. Ограничение спектра вызывает **ISI** (межсимвольную интерференцию).\n- **Теорема Найквиста** (канал без шума): **C = 2B log₂V** бит/с, где B — полоса (Гц), V — число уровней сигнала.\n- **Теорема Шеннона** (канал с шумом): **C = B log₂(1 + S/N)** бит/с, где S/N — отношение сигнал/шум (**SNR**).\n- Шеннон задаёт теоретический предел, который нельзя превысить никаким кодированием."],"terms":[{"ru":"Ряд Фурье","en":"Fourier series","df":"разложение периодического сигнала в сумму синусоид кратных частот"},{"ru":"Гармоника","en":"harmonic","df":"составляющая ряда Фурье с частотой, кратной фундаментальной"},{"ru":"Полоса пропускания","en":"bandwidth","df":"диапазон частот, передаваемых каналом с допустимым затуханием (в Гц); в контексте сетей также используется как синоним скорости передачи данных (бит/с)"},{"ru":"Теорема Найквиста","en":"Nyquist theorem","df":"максимальная скорость передачи по идеальному каналу: C = 2B log₂V"},{"ru":"Теорема Шеннона","en":"Shannon's theorem","df":"теоретический предел скорости передачи по зашумлённому каналу: C = B log₂(1 + SNR)"},{"ru":"SNR","en":"Signal-to-Noise Ratio","df":"отношение мощности полезного сигнала к мощности шума"},{"ru":"Пропускная способность","en":"channel capacity","df":"максимальная скорость безошибочной передачи данных по каналу"},{"ru":"Межсимвольная интерференция","en":"ISI, Inter-Symbol Interference","df":"искажение символов из-за наложения переходных процессов от соседних символов"}],"summary":["","**Суть:** Сигнал можно представить как сумму синусоид (Фурье). Канал ограничивает полосу → есть предел скорости.","","**Ряды Фурье:** любой периодический сигнал = сумма синусоид разных частот. Полезно для анализа спектра.","","**Сигналы с ограниченным спектром (band-limited):** реальный канал пропускает только определённую полосу частот **B** (Гц).","","**Теорема Найквиста (идеальный канал, без шума):**","- R_max = **2B · log₂(M)** бит/с","- B — полоса, M — число уровней сигнала.","","**Формула Шеннона-Хартли (реальный канал с шумом):**","- C = **B · log₂(1 + SNR)** бит/с","- SNR — отношение сигнал/шум.","","**Следствия:**","- Увеличение полосы B → больше скорость.","- Увеличение SNR → больше скорость (но логарифмически).","- Нельзя превысить C без ошибок.","","**Для устного:** Найквист = без шума; Шеннон = с шумом. SNR часто измеряют в дБ (SNR_dB = 10·log₁₀(SNR))."]},{"n":8,"title":"Проводниковые среды передачи информации: магнитные носители, витая пара, коаксиальный кабель, линии электропитания, волоконная оптика.","paragraphs":["- **Магнитные носители** (magnetic media) — физическая доставка дисков. При огромных объёмах может быть быстрее сети.","- **Витая пара** (twisted pair) — самая распространённая среда в LAN. Скручивание снижает помехи и наводки. **UTP** Cat5e-Cat7, до 10 Гбит/с.","- **Коаксиальный кабель** (coaxial cable) — центральный проводник + экран. Кабельное ТВ и DOCSIS.\n- **Линии электропитания** (PLC) — данные по электропроводке. Удобно, но шумно.\n- **Волоконная оптика** (fiber optic) — световые импульсы по стеклу. **SMF** — дальние (сотни км), **MMF** — короткие. Плюсы: Тбит/с, нечувствительность к EMI, низкое затухание."],"terms":[{"ru":"Витая пара","en":"twisted pair","df":"кабель из попарно скрученных проводников; основная среда для Ethernet"},{"ru":"UTP","en":"Unshielded Twisted Pair","df":"неэкранированная витая пара; наиболее распространённый вариант"},{"ru":"Перекрёстные наводки","en":"crosstalk","df":"нежелательный перенос сигнала между соседними проводниками"},{"ru":"Коаксиальный кабель","en":"coaxial cable","df":"кабель с центральным проводником и экранирующей оплёткой"},{"ru":"PLC","en":"Power Line Communication","df":"технология передачи данных по электрической сети"},{"ru":"Волоконная оптика","en":"fiber optics","df":"технология передачи данных в виде световых сигналов по оптическому волокну"},{"ru":"Одномодовое волокно","en":"single-mode fiber, SMF","df":"волокно с узким сердечником; для дальних расстояний"},{"ru":"Многомодовое волокно","en":"multimode fiber, MMF","df":"волокно с широким сердечником; для коротких расстояний"},{"ru":"Затухание","en":"attenuation","df":"уменьшение мощности сигнала по мере его распространения по среде"},{"ru":"DOCSIS","en":"Data Over Cable Service Interface Specification","df":"стандарт широкополосного Интернета по коаксиальному кабелю"}],"summary":["","**Суть:** Разные физические среды для передачи битов.","","**Магнитные носители (флешки, HDD):**","- Дешёвые за ГБ, **большая задержка** (физическая перевозка).","- Подходят для больших объёмов.","","**Витая пара (UTP, STP):**","- **Стандарт Ethernet** (~100 м на сегмент).","- Дешевая, массовая.","- Категории: Cat5e, Cat6, Cat7.","","**Коаксиальный кабель:**","- Лучше экранирован.","- Кабельное ТВ, старый Ethernet (10BASE2).","","**Линии электропитания (PLC, Power-Line Communication):**","- Передача по электропроводке.","- Удобно, но шумно и нестабильно.","","**Волоконная оптика (fiber):**","- **Огромная полоса** (терабиты/с).","- Большая дальность (десятки км).","- Малое затухание, иммунитет к электромагнитным помехам.","- **Single-mode** (дальние) и **multi-mode** (локальные).","- Дороже, сложнее монтаж.","","**Для устного:** Оптоволокно — для магистралей, витая пара — для офисов."]},{"n":9,"title":"Беспроводная связь: электромагнитный спектр, радиосвязь, микроволновый диапазон, инфракрасный диапазон, видимый диапазон.","paragraphs":["Электромагнитный спектр охватывает все виды излучения — от радиоволн до гамма-лучей. Для беспроводной связи используется диапазон от 10 кГц до 300+ ГГц. Чем выше частота — тем больше полоса пропускания, но меньше дальность и проникающая способность.","**Диапазоны беспроводной связи:**","- **Радиоволны** (1 МГц – 1 ГГц):\n  - Волны LF/MF (Low/Medium Frequency) огибают рельеф земной поверхности и применяются для AM-радиовещания и морской связи.\n  - Волны HF (High Frequency, короткие волны) отражаются от ионосферы, что обеспечивает связь на тысячи километров.\n  - Диапазон VHF/UHF (Very/Ultra High Frequency) используется для FM-радио, телевидения и мобильных сетей.","- **Микроволны** (1–300 ГГц):\n  - Микроволны распространяются по прямой линии (line-of-sight) и требуют прямой видимости между антеннами.\n  - В этом диапазоне работают Wi-Fi (2,4 и 5 ГГц), Bluetooth, сети 5G на миллиметровых волнах, радиорелейные линии и спутниковая связь.","- **Инфракрасный диапазон** (IR — Infrared, 300 ГГц – 400 ТГц):\n  - ИК-излучение не проникает через стены, что ограничивает дальность, но повышает безопасность от перехвата.\n  - Применяется в пультах дистанционного управления и стандарте IrDA (Infrared Data Association).","- **Видимый свет** (400–800 ТГц):\n  - Технология Li-Fi (Light Fidelity) передаёт данные через видимый свет со скоростью до Гбит/с.\n  - FSO (Free Space Optics) использует лазерные пучки для связи в прямой видимости на расстояние до нескольких километров."],"terms":[{"ru":"Электромагнитный спектр","en":"electromagnetic spectrum","df":"весь диапазон частот электромагнитного излучения"},{"ru":"Прямая видимость","en":"line-of-sight, LOS","df":"условие распространения сигнала без препятствий между передатчиком и приёмником"},{"ru":"Ионосфера","en":"ionosphere","df":"слой атмосферы, отражающий коротковолновые радиосигналы"},{"ru":"Микроволновый диапазон","en":"microwave band","df":"диапазон частот 1–300 ГГц; используется в Wi-Fi, спутниковой и мобильной связи"},{"ru":"IrDA","en":"Infrared Data Association","df":"стандарт беспроводной передачи данных в инфракрасном диапазоне"},{"ru":"Li-Fi","en":"Light Fidelity","df":"технология беспроводной передачи данных с использованием видимого света"},{"ru":"FSO","en":"Free Space Optics","df":"оптическая беспроводная связь через открытое пространство (лазерный луч)"},{"ru":"Затухание в атмосфере","en":"atmospheric attenuation","df":"поглощение радиосигнала атмосферными газами и осадками"}],"summary":["","**Суть:** Беспроводная передача использует электромагнитные волны разных частот.","","**Электромагнитный спектр (по частоте):** радио → микроволны → ИК → видимый свет → УФ → рентген → гамма.","","**Радиодиапазон (до ~1 ГГц):**","- Большая дальность, хорошее прохождение через препятствия.","- AM/FM, старые сотовые, Wi-Fi (2.4 ГГц — нижняя граница).","","**Микроволновый (1–300 ГГц):**","- Высокие скорости, направленные антенны.","- Требуют **прямой видимости** (line-of-sight).","- Сотовая связь, спутники, современный Wi-Fi (5 ГГц, 6 ГГц), 5G.","","**Инфракрасный (ИК):**","- Короткая дистанция (метры).","- Прямая видимость, не проходит через стены.","- Пульты, IrDA (устарел).","","**Видимый свет (VLC, Li-Fi):**","- Модуляция LED-светильников.","- Очень высокая потенциальная полоса.","- Нужна видимость.","","**Для устного:** Чем выше частота → выше скорость, но меньше дальность и хуже прохождение через препятствия."]},{"n":10,"title":"Спутниковая связь. Классификация спутников: геостационарные, средневысотные, низкоорбитальные. Спутники и оптоволокно.","paragraphs":["Спутник принимает сигнал от наземной станции (**uplink**), усиливает и ретранслирует обратно (**downlink**). Классификация по высоте орбиты:","- **GEO** (35 786 км) — неподвижен над экватором, покрывает ~1/3 Земли. Задержка ~270 мс. Применение: телевещание (DTH), VSAT.\n- **MEO** (2 000-20 000 км) — задержка 35-85 мс. Примеры: GPS, ГЛОНАСС, Galileo.\n- **LEO** (160-2 000 км) — задержка 5-20 мс. Нужны большие **группировки** (constellation): Starlink (5000+), OneWeb (~650).\n- **Спутники vs оптоволокно:** оптоволокно быстрее и надёжнее при наличии кабеля. Спутники незаменимы в труднодоступных местах и на море."],"terms":[{"ru":"GEO","en":"Geostationary Earth Orbit","df":"геостационарная орбита; высота 35 786 км, спутник неподвижен относительно Земли"},{"ru":"MEO","en":"Medium Earth Orbit","df":"среднеорбитальная орбита; высота 2 000–20 000 км"},{"ru":"LEO","en":"Low Earth Orbit","df":"низкая околоземная орбита; высота 160–2 000 км"},{"ru":"Задержка распространения","en":"propagation delay","df":"время прохождения сигнала от источника до приёмника"},{"ru":"Восходящий канал","en":"uplink","df":"канал от наземной станции к спутнику"},{"ru":"Нисходящий канал","en":"downlink","df":"канал от спутника к наземной станции"},{"ru":"VSAT","en":"Very Small Aperture Terminal","df":"малая спутниковая антенна для двустороннего доступа в Интернет"},{"ru":"Группировка спутников","en":"satellite constellation","df":"совокупность спутников, обеспечивающих совместное глобальное покрытие"},{"ru":"DTH","en":"Direct-to-Home","df":"технология прямого спутникового телевещания на абонентские тарелки"}],"summary":["","**Суть:** Спутники ретранслируют сигналы, обеспечивая покрытие там, где инфраструктура недоступна.","","**Геостационарные (GEO):**","- Высота **~35 786 км**.","- «Висят» над одной точкой Земли.","- **Задержка ~240 мс** (большая!).","- Широкое покрытие 1/3 Земли одним спутником.","- Применение: ТВ, телефония, Интернет в удалённых регионах.","","**Среднеорбитальные (MEO):**","- Высота 5 000–20 000 км.","- Компромисс между задержкой и числом спутников.","- Применение: **GPS/ГЛОНАСС** (~20 000 км).","","**Низкоорбитальные (LEO):**","- Высота 500–2 000 км.","- **Малая задержка** (20–40 мс).","- Нужно много спутников для покрытия (тысячи).","- **Starlink**, OneWeb, Iridium.","","**Спутники vs оптоволокно:**","- Оптоволокно лучше по **пропускной способности** и задержке на фиксированных маршрутах.","- Спутники лучше по **доступности** (нет инфраструктуры), быстрое развёртывание, мобильность, резерв.","- Часто **дополняют** друг друга.","","**Для устного:** Starlink — LEO-революция. GPS — MEO. GEO — ТВ."]},{"n":11,"title":"Цифровая модуляция и мультиплексирование. Низкочастотная передача. Передача в полосе пропускания. Частотное уплотнение. Мультиплексирование с разделением времени. Кодовое разделение каналов.","paragraphs":["- **Baseband** (низкочастотная передача) — сигнал от 0 до f_max. Коды: NRZ, Manchester, 4B/5B.\n- **Passband** (в полосе пропускания) — перенос сигнала на несущую частоту.\n- Виды модуляции: **ASK** (амплитуда), **FSK** (частота), **PSK** (фаза), **QAM** (амплитуда + фаза, наивысшая эффективность: QAM-64, QAM-256).","**Мультиплексирование** (multiplexing) — несколько источников на одном канале:\n- **FDM** (Frequency Division Multiplexing) — каждому своя полоса частот. Телефон, ТВ, ADSL.","- **TDM** (Time Division Multiplexing) — каждому свой временной слот. E1: 32 канала x 64 кбит/с = **2,048 Мбит/с**.\n- **CDMA** (Code Division Multiple Access) — все на одной частоте, но с уникальным **расширяющим кодом** (spreading code). Применяется в 3G и GPS."],"terms":[{"ru":"Модуляция","en":"modulation","df":"процесс изменения параметров несущего сигнала в соответствии с передаваемыми данными"},{"ru":"NRZ","en":"Non-Return-to-Zero","df":"линейный код, в котором сигнал не возвращается к нулю между битами"},{"ru":"QAM","en":"Quadrature Amplitude Modulation","df":"квадратурная амплитудная модуляция; одновременное изменение амплитуды и фазы"},{"ru":"FDM","en":"Frequency Division Multiplexing","df":"частотное разделение каналов"},{"ru":"TDM","en":"Time Division Multiplexing","df":"временно́е разделение каналов"},{"ru":"CDMA","en":"Code Division Multiple Access","df":"кодовое разделение множественного доступа"},{"ru":"Расширяющий код","en":"spreading code","df":"псевдослучайная последовательность для расширения спектра сигнала в CDMA"},{"ru":"Спектральная эффективность","en":"spectral efficiency","df":"количество бит/с на 1 Гц полосы пропускания"}],"summary":["","**Суть:** Как биты превращаются в сигнал и как многим пользователям делить канал.","","**Цифровая модуляция:** биты → изменения параметров несущей волны.","- **ASK** — амплитудная.","- **FSK** — частотная.","- **PSK** — фазовая.","- **QAM** — квадратурная (амплитуда + фаза), высокая скорость.","","**Baseband (низкочастотная передача):** передача цифрового сигнала напрямую, без несущей. Ethernet.","","**Passband (в полосе пропускания):** сигнал переносится на несущую частоту. Радио, Wi-Fi.","","**Мультиплексирование (разделение канала):**","","**FDM (Frequency-Division Multiplexing):**","- Делит **полосу** на подканалы разных частот.","- Пример: радио (каждая станция — своя частота).","","**TDM (Time-Division Multiplexing):**","- Делит **время** на слоты.","- Пример: T1/E1, GSM.","","**CDMA (Code-Division Multiple Access):**","- Все пользователи работают **одновременно** на всей полосе.","- Разделение через **коды расширения спектра** (ортогональные).","- Пример: 3G, GPS.","","**Для устного:** FDM — по частоте, TDM — по времени, CDMA — по кодам."]},{"n":12,"title":"Коммутируемая телефонная сеть общего пользования. Структура телефонной системы.","paragraphs":["**PSTN** (Public Switched Telephone Network) — традиционная телефонная сеть. Использует коммутацию каналов (circuit switching): при звонке выделяется фиксированный путь на всё время разговора.","**Структура PSTN (от абонента к магистрали):**\n- Абонент подключён витой парой к ближайшей **АТС** (Автоматическая Телефонная Станция, в англ. — CO, Central Office) — оборудование в районе, которое коммутирует звонки. Эта линия от абонента до АТС называется **local loop** (последняя миля).\n- Местные АТС соединяются через **транзитные** станции.\n- Транзитные станции соединяются через **магистральные** узлы.","**Оцифровка голоса — PCM** (Pulse Code Modulation, стандарт G.711):\n- Голос оцифровывается 8000 раз в секунду, каждый отсчёт = 8 бит.\n- Итого: 8000 × 8 = **64 кбит/с** на один голосовой канал.","**Объединение каналов между станциями:**\n- **E1** (Европа): 30 голосовых каналов = **2,048 Мбит/с**.\n- **T1** (США): 24 голосовых канала = **1,544 Мбит/с**.","**Сигнализация** (управление вызовами: набор номера, соединение, разрыв) идёт по отдельной сети **SS7** (Signaling System 7, ОКС-7).","**Современность:** PSTN постепенно заменяется технологиями **VoIP** (Voice over IP) и **IMS** (IP Multimedia Subsystem)."],"terms":[{"ru":"PSTN","en":"Public Switched Telephone Network","df":"коммутируемая телефонная сеть общего пользования"},{"ru":"Коммутация каналов","en":"circuit switching","df":"метод, при котором перед передачей данных резервируется выделенный канал"},{"ru":"АТС","en":"автоматическая телефонная станция) / CO (Central Office","df":"узел коммутации, обслуживающий группу абонентов"},{"ru":"PCM","en":"Pulse Code Modulation","df":"импульсно-кодовая модуляция; метод оцифровки аналогового голоса"},{"ru":"SS7 / ОКС-7","en":"Signaling System 7","df":"протокол сигнализации для управления телефонными вызовами в PSTN"},{"ru":"VoIP","en":"Voice over IP","df":"технология передачи голоса по IP-сетям"},{"ru":"POTS","en":"Plain Old Telephone Service","df":"традиционная аналоговая телефонная служба"}],"summary":["","**Суть:** Традиционная телефонная сеть с коммутацией каналов (circuit switching).","","**PSTN (Public Switched Telephone Network):**","- Соединение устанавливается **коммутированием** — выделенный канал на всё время разговора.","- Разработана для голоса, но работает и для данных (модемы, факсы).","","**Структура (иерархия):**","1. **Абонентская линия (local loop)** — от квартиры до местной АТС (медная витая пара, 2 провода).","2. **Местная АТС (local exchange)** — коммутирует вызовы в районе.","3. **Магистральные соединения (trunks)** — между АТС, высокая ёмкость (оптика).","4. **Транзитные/узловые станции** — для дальних и международных вызовов.","5. **Система сигнализации** (SS7) — установка/разрыв соединений, маршрутизация.","6. **План нумерации** — правила набора (коды стран, городов).","","**Особенности:**","- Выделенный канал → **гарантированное качество**.","- Неэффективно для пакетных данных.","- Постепенно вытесняется IP-телефонией (VoIP).","","**Для устного:** PSTN = circuit switching. Интернет = packet switching."]},{"n":13,"title":"Мобильная телефонная система. Поколения мобильных телефонов: аналоговая и цифровая передача информации.","paragraphs":["**Принцип сотовой связи:**\nТерритория делится на зоны — **соты** (cells). В каждой соте стоит **базовая станция** (BS, Base Station), которая обслуживает телефоны в своей зоне по радиоканалу. Когда абонент перемещается из одной соты в другую, связь автоматически переключается на новую станцию — это называется **хэндовер** (handover). Базовые станции соединены с контроллерами и далее с ядром сети (core network), которое связано с PSTN и Интернетом.","**Поколения мобильной связи:**","- **1G** (1980-е) — только аналоговый голос, без передачи данных. Стандарты: AMPS (США), NMT (Скандинавия). Легко прослушивается.","- **2G** (1991) — переход на цифру. Стандарт GSM (Global System for Mobile Communications) использует TDMA и FDMA. Появились SMS. Передача данных: GPRS (2,5G, до 114 кбит/с), EDGE (2,75G, до 384 кбит/с).","- **3G** (2001) — мобильный Интернет. Стандарт UMTS (WCDMA): до 2 Мбит/с, с HSPA+ до 42 Мбит/с.","- **4G LTE** (2009) — полностью пакетная IP-сеть (без коммутации каналов). Технологии: OFDMA + MIMO. Скорости: 150–1000 Мбит/с.","- **5G** (2019) — три сценария использования:\n  - **eMBB** (enhanced Mobile Broadband) — высокая скорость, до 20 Гбит/с.\n  - **URLLC** (Ultra-Reliable Low-Latency) — сверхнизкая задержка, менее 1 мс.\n  - **mMTC** (massive Machine-Type Communications) — массовое подключение IoT-устройств.\n  - Технологии: миллиметровые волны, Massive MIMO, network slicing."],"terms":[{"ru":"Сота","en":"cell","df":"географическая зона, обслуживаемая одной базовой станцией"},{"ru":"Хэндовер","en":"handover / handoff","df":"переключение соединения между базовыми станциями при движении абонента"},{"ru":"GSM","en":"Global System for Mobile Communications","df":"стандарт цифровой сотовой связи 2G"},{"ru":"TDMA","en":"Time Division Multiple Access","df":"множественный доступ с разделением по времени (используется в GSM)"},{"ru":"OFDMA","en":"Orthogonal Frequency Division Multiple Access","df":"множественный доступ на основе ортогонального частотного мультиплексирования (LTE, 5G)"},{"ru":"MIMO","en":"Multiple Input Multiple Output","df":"технология с несколькими передающими и принимающими антеннами"},{"ru":"eMBB","en":"enhanced Mobile Broadband","df":"сценарий 5G для высокоскоростного мобильного Интернета"},{"ru":"URLLC","en":"Ultra-Reliable Low-Latency Communication","df":"сценарий 5G для критически важных приложений с малой задержкой"},{"ru":"mMTC","en":"massive Machine-Type Communications","df":"сценарий 5G для массового подключения устройств IoT"},{"ru":"GPRS","en":"General Packet Radio Service","df":"технология пакетной передачи данных в сетях GSM (2,5G)"}],"summary":["","**Суть:** Сотовая связь разделяет территорию на соты с базовыми станциями.","","**Принцип:**","- **Соты (cells)** — зоны покрытия базовых станций.","- **Частотное повторение** между сотами.","- **Handover** — передача соединения при движении абонента.","","**Поколения:**","","**1G (аналоговое, 1980е):**","- AMPS, NMT.","- Только голос, аналоговая передача.","- Низкая ёмкость, слабая защита.","","**2G (цифровое, 1990е):**","- **GSM** (Европа), CDMA (США).","- Цифровой голос + **SMS** + базовые данные (GPRS, EDGE).","- Шифрование.","","**3G (2000е):**","- **UMTS**, CDMA2000.","- Скорости ~1–10 Мбит/с.","- Видеозвонки, мобильный Интернет.","","**4G / LTE (2010е):**","- **Только IP** (all-IP network).","- Высокая пропускная способность (десятки/сотни Мбит/с).","- **VoLTE** — голос по IP.","- Меньшая задержка.","","**5G (с 2019):**","- Скорости гигабиты/с.","- **Очень низкая задержка** (< 10 мс).","- Массовый IoT, **network slicing** (выделение виртуальных сетей).","","**Для устного:** 1G аналог → 2G цифра → 3G данные → 4G all-IP → 5G IoT/низкая задержка."]},{"n":14,"title":"Характеристики физических каналов связи. Типы каналов связи.","paragraphs":["**Основные характеристики канала:**\n- **Полоса пропускания** (bandwidth, Гц) — диапазон частот канала.\n- **Пропускная способность** (throughput, бит/с) — реальная скорость передачи.\n- **Задержка** (latency) — время прохождения сигнала.\n- **Затухание** (attenuation) — ослабление сигнала.\n- **SNR** (Signal-to-Noise Ratio) — определяет предел по Шеннону. **BER** (Bit Error Rate) — доля ошибочных бит.","**По типу сигнала:** аналоговые и цифровые.","**По режиму передачи:**\n- **Симплекс** (simplex) — только в одном направлении.\n- **Полудуплекс** (half-duplex) — попеременно в обоих.\n- **Дуплекс** (full-duplex) — одновременно в обоих.","**По среде:** проводные (витая пара, коаксиал, оптоволокно) и беспроводные (радио, ИК, спутник).","**Дополнительно:** **замирания** (fading) в беспроводных каналах из-за **многолучевого распространения** (multipath). **Дисперсия** — уширение импульсов в оптоволокне. **Джиттер** (jitter) — вариация задержки."],"terms":[{"ru":"Полоса пропускания","en":"bandwidth","df":"диапазон частот, в котором канал обеспечивает передачу (в Гц)"},{"ru":"Пропускная способность","en":"throughput","df":"реальная скорость передачи данных по каналу (бит/с)"},{"ru":"Задержка / латентность","en":"latency / delay","df":"время от отправки до получения сигнала"},{"ru":"Затухание","en":"attenuation","df":"уменьшение амплитуды/мощности сигнала при распространении по среде"},{"ru":"SNR","en":"Signal-to-Noise Ratio","df":"отношение мощности сигнала к мощности шума"},{"ru":"BER","en":"Bit Error Rate","df":"коэффициент ошибок по битам; доля ошибочно принятых бит"},{"ru":"Симплекс","en":"simplex","df":"передача только в одном направлении"},{"ru":"Полудуплекс","en":"half-duplex","df":"попеременная передача в двух направлениях"},{"ru":"Дуплекс","en":"full-duplex","df":"одновременная двусторонняя передача"},{"ru":"Замирание","en":"fading","df":"случайное изменение уровня сигнала в беспроводных каналах"},{"ru":"Многолучевое распространение","en":"multipath propagation","df":"приход сигнала по нескольким путям с разными задержками; причина замираний и ISI"},{"ru":"Дисперсия","en":"dispersion","df":"уширение светового импульса в оптоволокне из-за различных скоростей мод/длин волн"},{"ru":"Джиттер","en":"jitter","df":"вариация задержки доставки пакетов во времени"}],"summary":["","**Суть:** Любой физический канал описывается набором параметров и делится по типу и направлению.","","**Ключевые характеристики:**","- **Полоса пропускания (bandwidth)** — диапазон частот.","- **Пропускная способность (capacity)** — максимальная скорость, бит/с.","- **Затухание (attenuation)** — ослабление сигнала с расстоянием.","- **Шум и помехи (noise, interference)**.","- **Задержка (latency)** и **джиттер** (вариация задержки).","- **Вероятность битовой ошибки (BER)**.","- **Искажения/дисперсия (distortion, dispersion)**.","- **Отношение сигнал/шум (SNR)**.","- **Надёжность/доступность**.","","**Типы по среде:**","- **Проводные (guided):** витая пара, коаксиал, оптика, PLC.","- **Беспроводные (unguided):** радио, микроволны, спутник, ИК, видимый.","","**По направлению:**","- **Simplex** — только в одну сторону (радиовещание).","- **Half-duplex** — по очереди (рация).","- **Full-duplex** — одновременно в обе стороны (телефон, Ethernet).","","**По числу получателей:**","- **Point-to-point** — один-к-одному.","- **Broadcast** — один-ко-многим.","","**Для устного:** Формула Шеннона C = B·log₂(1+SNR) связывает полосу и SNR с пропускной способностью."]}],"quizzes":[{"type":"mcq","topic":"Вопрос 7","q":"Какова формула теоремы Найквиста для максимальной скорости передачи данных по идеальному каналу без шума?","opts":["C = B log₂(1 + S/N)","C = 2B log₂V","C = B log₂V","C = 2B log₂(1 + S/N)"],"ans":1,"expl":"Теорема Найквиста: C = 2B log₂V, где B — полоса пропускания (Гц), V — число различимых уровней сигнала."},{"type":"mcq","topic":"Вопрос 7","q":"Какова формула теоремы Шеннона для зашумлённого канала?","opts":["C = 2B log₂V","C = B log₂(S/N)","C = B log₂(1 + S/N)","C = 2B log₂(1 + S/N)"],"ans":2,"expl":"Теорема Шеннона: C = B log₂(1 + S/N), где S/N — отношение сигнал/шум."},{"type":"mcq","topic":"Вопрос 7","q":"Сколько максимально отсчётов в секунду можно передать через канал с полосой B Гц (по Найквисту)?","opts":["B отсчётов","2B отсчётов","B² отсчётов","4B отсчётов"],"ans":1,"expl":"Если сигнал ограничить полосой B Гц, то через канал можно передать не более 2B отсчётов в секунду."},{"type":"mcq","topic":"Вопрос 7","q":"Что означает аббревиатура SNR?","opts":["Signal Noise Resistance","Signal-to-Noise Ratio","System Network Rate","Spectral Nyquist Resolution"],"ans":1,"expl":"SNR — Signal-to-Noise Ratio — отношение мощности полезного сигнала к мощности шума."},{"type":"mcq","topic":"Вопрос 7","q":"Что такое ISI (Inter-Symbol Interference)?","opts":["Отражение сигнала от ионосферы","Искажение символов из-за наложения переходных процессов от соседних символов","Помехи от соседних кабелей","Шум квантования при оцифровке"],"ans":1,"expl":"ISI — Inter-Symbol Interference — межсимвольная интерференция — искажение символов из-за наложения переходных процессов от соседних символов."},{"type":"tf","topic":"Вопрос 7","q":"Ряд Фурье позволяет представить любой периодический сигнал как сумму синусоид различных частот.","ans":true,"expl":"Любой периодический сигнал может быть представлен как сумма синусоид различных частот — разложение в ряд Фурье."},{"type":"tf","topic":"Вопрос 7","q":"Фундаментальная частота сигнала с периодом T равна f = T/2.","ans":false,"expl":"Фундаментальная частота равна f = 1/T, а не T/2."},{"type":"tf","topic":"Вопрос 7","q":"На практике реальные системы работают значительно ниже предела Шеннона.","ans":true,"expl":"Из текста: «На практике реальные системы работают значительно ниже предела Шеннона»."},{"type":"tf","topic":"Вопрос 7","q":"Увеличение числа уровней сигнала V повышает скорость передачи, но снижает требования к помехозащищённости.","ans":false,"expl":"Увеличение числа уровней повышает скорость, однако УСИЛИВАЕТ (а не снижает) требования к помехозащищённости."},{"type":"match","topic":"Вопрос 7","q":"Сопоставьте термин с определением:","pairs":[{"l":"Ряд Фурье (Fourier series)","r":"Разложение периодического сигнала в сумму синусоид кратных частот"},{"l":"Гармоника (harmonic)","r":"Составляющая ряда Фурье с частотой, кратной фундаментальной"},{"l":"Полоса пропускания (bandwidth)","r":"Диапазон частот, передаваемых каналом с допустимым затуханием"},{"l":"Пропускная способность (channel capacity)","r":"Максимальная скорость безошибочной передачи данных по каналу"}],"expl":"Определения из раздела терминологии Вопроса 7."},{"type":"mcq","topic":"Вопрос 8","q":"Какие категории витой пары упоминаются для Ethernet со скоростями до 10 Гбит/с?","opts":["Cat3, Cat4, Cat5, Cat6","Cat5e, Cat6, Cat6a, Cat7","Cat5, Cat6, Cat7, Cat8","Cat4, Cat5e, Cat6a, Cat8"],"ans":1,"expl":"UTP используется в Ethernet категорий Cat5e, Cat6, Cat6a, Cat7 со скоростями до 10 Гбит/с."},{"type":"mcq","topic":"Вопрос 8","q":"Что означает аббревиатура UTP?","opts":["Universal Twisted Pair","Unshielded Twisted Pair","Unified Transmission Protocol","Ultra-Thin Polymer"],"ans":1,"expl":"UTP — Unshielded Twisted Pair — неэкранированная витая пара."},{"type":"mcq","topic":"Вопрос 8","q":"Какой тип волокна используется для дальних расстояний (до сотен километров)?","opts":["Многомодовое волокно (MMF)","Одномодовое волокно (SMF)","Пластиковое волокно (POF)","Градиентное волокно"],"ans":1,"expl":"Одномодовое волокно (single-mode fiber, SMF) используется для дальних расстояний (до сотен километров)."},{"type":"mcq","topic":"Вопрос 8","q":"Что означает аббревиатура DOCSIS?","opts":["Data Over Cable Service Interface Specification","Digital Optical Cable Signal Interface Standard","Data Oriented Communication System for Internet Services","Distributed Optical Channel Switching Interface System"],"ans":0,"expl":"DOCSIS — Data Over Cable Service Interface Specification — стандарт широкополосного Интернета по коаксиальному кабелю."},{"type":"mcq","topic":"Вопрос 8","q":"Что означает аббревиатура PLC в контексте передачи данных?","opts":["Programmable Logic Controller","Power Line Communication","Parallel Link Connection","Physical Layer Coding"],"ans":1,"expl":"PLC — Power Line Communication — технология передачи данных по электрической сети."},{"type":"tf","topic":"Вопрос 8","q":"Скручивание проводников в витой паре снижает электромагнитные помехи (EMI) и перекрёстные наводки (crosstalk).","ans":true,"expl":"Скручивание двух проводников снижает EMI и crosstalk — прямая цитата из текста."},{"type":"tf","topic":"Вопрос 8","q":"Коаксиальный кабель обеспечивает худшую защиту от помех, чем витая пара.","ans":false,"expl":"Коаксиальный кабель обеспечивает ЛУЧШУЮ (не худшую) защиту от помех, чем витая пара."},{"type":"tf","topic":"Вопрос 8","q":"Волоконно-оптический кабель нечувствителен к электромагнитным помехам.","ans":true,"expl":"Среди преимуществ оптоволокна: нечувствительность к электромагнитным помехам."},{"type":"tf","topic":"Вопрос 8","q":"Многомодовое волокно (MMF) используется для дальних расстояний, а одномодовое (SMF) — для коротких.","ans":false,"expl":"Наоборот: SMF — для дальних расстояний, MMF — для коротких."},{"type":"match","topic":"Вопрос 8","q":"Сопоставьте среду передачи с её ключевой характеристикой:","pairs":[{"l":"Витая пара (UTP)","r":"Наиболее распространённая среда передачи в локальных сетях"},{"l":"Коаксиальный кабель","r":"Применяется в кабельном ТВ и широкополосном Интернете (DOCSIS)"},{"l":"Волоконная оптика","r":"Передаёт данные в виде световых импульсов, пропускная способность Тбит/с"},{"l":"Линии электропитания (PLC)","r":"Передача данных по существующей электрической проводке"},{"l":"Магнитные носители","r":"Используются для переноса очень больших объёмов данных физически"}],"expl":"Характеристики проводниковых сред передачи из Вопроса 8."},{"type":"match","topic":"Вопрос 8","q":"Сопоставьте аббревиатуру с расшифровкой:","pairs":[{"l":"SMF","r":"Single-Mode Fiber"},{"l":"MMF","r":"Multimode Fiber"},{"l":"UTP","r":"Unshielded Twisted Pair"},{"l":"DOCSIS","r":"Data Over Cable Service Interface Specification"},{"l":"PLC","r":"Power Line Communication"}],"expl":"Расшифровки аббревиатур из раздела терминологии Вопроса 8."},{"type":"mcq","topic":"Вопрос 9","q":"На каких частотах работает Wi-Fi?","opts":["1,8 и 3,6 ГГц","2,4 и 5 ГГц","900 МГц и 1,8 ГГц","5 и 10 ГГц"],"ans":1,"expl":"В микроволновом диапазоне работают Wi-Fi (2,4 и 5 ГГц)."},{"type":"mcq","topic":"Вопрос 9","q":"Какой диапазон частот относится к микроволнам?","opts":["10 кГц – 1 МГц","1 МГц – 1 ГГц","1–300 ГГц","300 ГГц – 400 ТГц"],"ans":2,"expl":"Микроволны (microwave band) — диапазон частот 1–300 ГГц."},{"type":"mcq","topic":"Вопрос 9","q":"Какой диапазон частот соответствует инфракрасному излучению?","opts":["1 МГц – 1 ГГц","1–300 ГГц","300 ГГц – 400 ТГц","400–800 ТГц"],"ans":2,"expl":"Инфракрасный диапазон (IR): 300 ГГц – 400 ТГц."},{"type":"mcq","topic":"Вопрос 9","q":"Что означает аббревиатура FSO?","opts":["Fiber Signal Output","Free Space Optics","Frequency Selective Operation","Full Spectrum Oscillator"],"ans":1,"expl":"FSO — Free Space Optics — оптическая беспроводная связь через открытое пространство (лазерный луч)."},{"type":"mcq","topic":"Вопрос 9","q":"Какой диапазон частот используется для беспроводной связи?","opts":["От 1 Гц до 1 кГц","От 10 кГц до 300+ ГГц","От 1 МГц до 10 ГГц","От 100 ГГц до 1 ТГц"],"ans":1,"expl":"Для беспроводной связи используется диапазон от 10 кГц до 300+ ГГц."},{"type":"mcq","topic":"Вопрос 9","q":"Какова частота видимого света?","opts":["1–300 ГГц","300 ГГц – 400 ТГц","400–800 ТГц","800 ТГц – 1 ПГц"],"ans":2,"expl":"Видимый свет: 400–800 ТГц."},{"type":"tf","topic":"Вопрос 9","q":"Чем выше частота электромагнитного излучения, тем больше полоса пропускания, но меньше дальность и проникающая способность.","ans":true,"expl":"Прямая цитата: «Чем выше частота — тем больше полоса пропускания, но меньше дальность и проникающая способность»."},{"type":"tf","topic":"Вопрос 9","q":"ИК-излучение свободно проникает через стены.","ans":false,"expl":"ИК-излучение НЕ проникает через стены — это ограничивает дальность, но повышает безопасность."},{"type":"tf","topic":"Вопрос 9","q":"Волны HF (короткие волны) отражаются от ионосферы, что обеспечивает связь на тысячи километров.","ans":true,"expl":"Волны HF отражаются от ионосферы, обеспечивая связь на тысячи километров."},{"type":"tf","topic":"Вопрос 9","q":"Технология Li-Fi передаёт данные через инфракрасный свет.","ans": с?","opts":["eMBB","URLLC","mMTC","MIMO"],"ans":1,"expl":"URLLC (Ultra-Reliable Low-Latency Communication) — сверхнадёжная связь с малой задержкой, <1 мс."},{"type":"tf","topic":"Вопрос 13","q":"Первое поколение мобильной связи (1G) использовало цифровую передачу голоса.","ans":false,"expl":"1G — аналоговые системы. Передача голоса осуществлялась в аналоговой форме."},{"type":"tf","topic":"Вопрос 13","q":"GSM использует TDMA и FDMA.","ans":true,"expl":"Стандарт GSM использует TDMA и FDMA."},{"type":"tf","topic":"Вопрос 13","q":"4G LTE — это полностью пакетная IP-архитектура с отказом от коммутации каналов.","ans":true,"expl":"4G LTE — полностью пакетная IP-архитектура, отказ от коммутации каналов."},{"type":"tf","topic":"Вопрос 13","q":"EDGE (2,75G) обеспечивает скорость до 114 кбит/с.","ans":false,"expl":"EDGE — до 384 кбит/с. 114 кбит/с — это скорость GPRS (2,5G)."},{"type":"tf","topic":"Вопрос 13","q":"5G начало внедряться в 2019 году.","ans":true,"expl":"Пятое поколение (5G, 2019)."},{"type":"match","topic":"Вопрос 13","q":"Сопоставьте поколение мобильной связи с его годом и технологией:","pairs":[{"l":"1G (1980-е)","r":"Аналоговые системы: AMPS, NMT, TACS"},{"l":"2G (1991)","r":"Цифровая передача: GSM, TDMA/FDMA"},{"l":"3G (2001)","r":"UMTS (WCDMA), до 2 Мбит/с"},{"l":"4G LTE (2009)","r":"OFDMA, MIMO, до 150–1000 Мбит/с"},{"l":"5G (2019)","r":"eMBB до 20 Гбит/с, URLLC <1 мс, mMTC"}],"expl":"Хронология поколений мобильной связи из Вопроса 13."},{"type":"match","topic":"Вопрос 13","q":"Сопоставьте сценарий 5G с его назначением:","pairs":[{"l":"eMBB","r":"Расширенный мобильный широкополосный доступ, до 20 Гбит/с"},{"l":"URLLC","r":"Сверхнадёжная связь с малой задержкой, <1 мс"},{"l":"mMTC","r":"Массовое подключение устройств IoT"},{"l":"Network slicing","r":"Виртуализация сети для создания изолированных логических сетей"}],"expl":"Сценарии и технологии 5G из Вопроса 13."},{"type":"mcq","topic":"Вопрос 14","q":"Что означает аббревиатура BER?","opts":["Bandwidth Err
