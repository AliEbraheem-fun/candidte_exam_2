or Range","Bit Error Rate","Binary Encoding Ratio","Broadband Efficiency Rating"],"ans":1,"expl":"BER — Bit Error Rate — коэффициент ошибок по битам; доля ошибочно принятых бит."},{"type":"mcq","topic":"Вопрос 14","q":"Какой режим передачи обеспечивает одновременную передачу в обоих направлениях?","opts":["Симплекс","Полудуплекс","Дуплекс (full-duplex)","Мультиплекс"],"ans":2,"expl":"Дуплекс (full-duplex) — одновременная передача в обоих направлениях."},{"type":"mcq","topic":"Вопрос 14","q":"Что такое джиттер (jitter)?","opts":["Уменьшение мощности сигнала","Изменение задержки во времени","Уширение импульсов в оптоволокне","Перенос сигнала между соседними проводниками"],"ans":1,"expl":"Джиттер (jitter) — изменение задержки во времени, критичное для голоса и видео."},{"type":"mcq","topic":"Вопрос 14","q":"Что такое дисперсия (dispersion) в контексте оптоволокна?","opts":["Рассеяние света в атмосфере","Уширение импульсов в оптоволокне из-за различных скоростей мод","Ослабление мощности сигнала","Изменение частоты сигнала при передаче"],"ans":1,"expl":"Дисперсия (dispersion) — уширение светового импульса в оптоволокне из-за различных скоростей мод/длин волн."},{"type":"mcq","topic":"Вопрос 14","q":"Что является причиной замираний (fading) в беспроводных каналах?","opts":["Дисперсия в оптоволокне","Многолучевое распространение (multipath propagation) и движение объектов","Электромагнитные помехи от медных кабелей","Квантование сигнала"],"ans":1,"expl":"Уровень сигнала изменяется вследствие многолучевого распространения (multipath propagation) и движения объектов."},{"type":"tf","topic":"Вопрос 14","q":"Симплексный канал поддерживает попеременную передачу в обоих направлениях.","ans":false,"expl":"Симплекс — передача только в ОДНОМ направлении. Попеременная передача — это полудуплекс."},{"type":"tf","topic":"Вопрос 14","q":"Каналы с замираниями (fading channels) характерны для беспроводных каналов.","ans":true,"expl":"Каналы с замираниями — беспроводные каналы, в которых уровень сигнала изменяется."},{"type":"tf","topic":"Вопрос 14","q":"EMI (электромагнитные помехи) характерны для оптоволоконных кабелей.","ans":false,"expl":"EMI характерны для МЕДНЫХ кабелей, а не оптоволоконных."},{"type":"tf","topic":"Вопрос 14","q":"Проводные каналы являются каналами с постоянными параметрами.","ans":true,"expl":"Каналы с постоянными параметрами — проводные, каналы с замираниями — беспроводные."},{"type":"match","topic":"Вопрос 14","q":"Сопоставьте режим передачи с описанием:","pairs":[{"l":"Симплекс (simplex)","r":"Передача только в одном направлении"},{"l":"Полудуплекс (half-duplex)","r":"Попеременная передача в обоих направлениях"},{"l":"Дуплекс (full-duplex)","r":"Одновременная двусторонняя передача"}],"expl":"Режимы передачи из Вопроса 14."},{"type":"match","topic":"Вопрос 14","q":"Сопоставьте характеристику канала с её определением:","pairs":[{"l":"Полоса пропускания (bandwidth)","r":"Диапазон частот без значительного ослабления (Гц)"},{"l":"Пропускная способность (throughput)","r":"Реальная скорость передачи данных (бит/с)"},{"l":"Задержка (latency)","r":"Время прохождения сигнала по каналу"},{"l":"Затухание (attenuation)","r":"Ослабление мощности сигнала на единицу длины"},{"l":"BER (Bit Error Rate)","r":"Доля ошибочно принятых бит"}],"expl":"Основные характеристики физического канала связи из Вопроса 14."},{"type":"match","topic":"Вопрос 14","q":"Сопоставьте дополнительную характеристику с описанием:","pairs":[{"l":"Дисперсия (dispersion)","r":"Уширение импульсов в оптоволокне"},{"l":"Джиттер (jitter)","r":"Вариация задержки доставки во времени"},{"l":"Замирание (fading)","r":"Случайное изменение уровня сигнала в беспроводных каналах"},{"l":"Многолучевое распространение","r":"Приход сигнала по нескольким путям с разными задержками"}],"expl":"Дополнительные характеристики из Вопроса 14."}]},{"id":3,"name":"Канальный уровень сетевого стека","questions":[{"n":15,"title":"Ключевые аспекты и особенности организации канального уровня. Сервисы, предоставляемые сетевому уровню. Формирование кадра. Обработка ошибок. Управление потоком.","paragraphs":["**Канальный уровень** (Data Link Layer, уровень 2 OSI) — отвечает за передачу данных между двумя соседними узлами, соединёнными напрямую. Он берёт пакет от сетевого уровня, оборачивает его в **кадр** (frame) — добавляет заголовок и трейлер — и отправляет через физическую среду.","**Три класса сервисов для сетевого уровня:**\n- **Ненадёжная доставка без подтверждений** — кадры отправляются без проверки, потери не отслеживаются. Используется в надёжных каналах (например, Ethernet).\n- **Надёжная доставка без соединения** — каждый кадр подтверждается (ACK), но предварительное соединение не устанавливается. Используется в ненадёжных каналах (например, Wi-Fi).\n- **Надёжная доставка с соединением** — сначала устанавливается соединение, затем передача с подтверждениями, затем разрыв.","**Формирование кадра** — как получатель понимает, где начинается и заканчивается кадр в потоке битов? Четыре метода:\n- **Счётчик символов** — в заголовке указана длина кадра.\n- **Флаговые байты + байт-стаффинг** (byte stuffing) — специальный байт-разделитель между кадрами. Если такой же байт встречается внутри данных, перед ним вставляется ESC-байт.\n- **Флаговые биты + бит-стаффинг** (bit stuffing) — разделитель 01111110. Чтобы он не появился случайно в данных, после пяти единиц подряд вставляется ноль. Используется в протоколе HDLC (High-level Data Link Control) — классический протокол канального уровня (ISO 13239), на основе которого построены PPP и Frame Relay.\n- **Нарушение физического кодирования** — использование недопустимых сигналов на линии как маркеров границ кадра.","**Обработка ошибок** — два подхода:\n- **ARQ** (Automatic Repeat reQuest) — получатель обнаружил ошибку → запрашивает повтор.\n- **FEC** (Forward Error Correction) — получатель сам исправляет ошибку по избыточным битам, без повтора.","**Управление потоком** (flow control) — не даёт быстрому отправителю переполнить буфер медленного получателя. Получатель сообщает отправителю, когда можно посылать следующие кадры."],"terms":[{"ru":"Канальный уровень","en":"data link layer","df":"второй уровень модели OSI, отвечает за передачу кадров между соседними узлами"},{"ru":"Кадр","en":"frame","df":"единица данных канального уровня, содержит заголовок, полезную нагрузку и трейлер"},{"ru":"Инкапсуляция","en":"encapsulation","df":"упаковка данных вышестоящего уровня в структуру нижестоящего уровня"},{"ru":"Байт-стаффинг","en":"byte stuffing","df":"вставка escape-байта перед специальными символами внутри кадра"},{"ru":"Бит-стаффинг","en":"bit stuffing","df":"вставка нулевого бита после пяти подряд идущих единиц"},{"ru":"ARQ","en":"Automatic Repeat reQuest","df":"автоматический запрос повторной передачи при обнаружении ошибки"},{"ru":"FEC","en":"Forward Error Correction","df":"упреждающая коррекция ошибок без запроса повтора"},{"ru":"Управление потоком","en":"flow control","df":"механизм согласования скоростей отправителя и получателя"}],"summary":["","**Суть:** Канальный уровень превращает «сырую» физическую линию в надёжный канал для передачи кадров.","","**Функции:**","1. **Кадрирование (framing)** — разбиение потока битов на кадры.","2. **MAC-адресация** — идентификация устройств в локальной сети.","3. **Управление доступом к среде** (MAC-подуровень).","4. **Обработка ошибок** (CRC, подтверждения).","5. **Управление потоком** (flow control).","","**Сервисы сетевому уровню:**","- **Unreliable connectionless** — без соединения, без гарантий (Ethernet).","- **Acknowledged connectionless** — без соединения, но с подтверждениями (Wi-Fi).","- **Reliable connection-oriented** — с соединением и гарантиями (редко).","","**Формирование кадра:**","- Заголовок (header) + полезная нагрузка (payload) + трейлер (trailer).","- Методы определения границ: подсчёт символов, байтовые флаги с экранированием, битовые флаги, нарушение кодирования.","- Трейлер обычно содержит **CRC** (контрольная сумма).","","**Обработка ошибок:**","- **Обнаружение** — CRC, checksum.","- **Исправление** — FEC (forward error correction) или **ARQ** (повторная передача).","","**Управление потоком:**","- **ACK** — подтверждения.","- **Окна** (windows) — сколько кадров можно послать без подтверждения.","- **Пауза** — остановка отправителя при переполнении буфера.","","**Для устного:** Канальный уровень = между физическим и сетевым. Работает на уровне одного сегмента сети."]},{"n":16,"title":"Коды с исправлением ошибок. Коды с обнаружением ошибок.","paragraphs":["**Идея:** к данным добавляют лишние (избыточные) биты. Если их хватает только чтобы заметить ошибку — это **код с обнаружением**. Если хватает чтобы найти и исправить — это **код с исправлением** (FEC).","**Кодовое расстояние Хэмминга** (Hamming distance) — в скольких битах различаются два допустимых кодовых слова.\n- Чтобы **обнаружить** d ошибок → расстояние ≥ d + 1.\n- Чтобы **исправить** d ошибок → расстояние ≥ 2d + 1.","**Коды с исправлением ошибок (FEC):**\n- **Код Хэмминга** (Hamming code) — исправляет одиночные ошибки. Контрольные биты стоят на позициях-степенях двойки (1, 2, 4, 8…). Формула: для m информационных битов нужно r контрольных, где 2^r ≥ m + r + 1.\n- **Свёрточные коды** (convolutional codes) — кодер использует текущий и предыдущие биты (имеет «память»). Применяются при сильных помехах, например в Wi-Fi (802.11).\n- **Код Рида-Соломона** (Reed-Solomon) — работает с символами, а не отдельными битами. Хорошо справляется с пакетными ошибками. Используется в DSL и оптических сетях.","**Коды с обнаружением ошибок:**\n- **Бит чётности** (parity bit) — один дополнительный бит; обнаруживает одиночную ошибку.\n- **Двумерный бит чётности** — биты организованы в матрицу с чётностью по строкам и столбцам. Может обнаружить и исправить одиночные ошибки.\n- **Контрольная сумма** (checksum) — сумма 16-битовых слов. Используется в TCP/IP.\n- **CRC** (Cyclic Redundancy Check) — деление сообщения на порождающий полином. Стандарты CRC-16 и CRC-32 обнаруживают все пакетные ошибки длиной до r бит. Самый распространённый метод в сетях."],"terms":[{"ru":"Избыточные биты","en":"redundant bits","df":"дополнительные биты, добавляемые для обнаружения/исправления ошибок"},{"ru":"Кодовое расстояние Хэмминга","en":"Hamming distance","df":"число позиций, в которых два кодовых слова различаются"},{"ru":"Код Хэмминга","en":"Hamming code","df":"линейный код с исправлением одиночных ошибок"},{"ru":"Свёрточный код","en":"convolutional code","df":"код, в котором выходные символы зависят от текущего и предыдущих входных символов"},{"ru":"Код Рида-Соломона","en":"Reed-Solomon code","df":"блочный код, работающий с символами, стойкий к пакетным ошибкам"},{"ru":"Бит чётности","en":"parity bit","df":"контрольный бит, обеспечивающий чётное (или нечётное) число единиц"},{"ru":"CRC","en":"Cyclic Redundancy Check","df":"циклический избыточный код, основанный на полиномиальном делении"},{"ru":"Порождающий полином","en":"generator polynomial","df":"полином, на который делится сообщение при вычислении CRC"},{"ru":"Пакетная ошибка","en":"burst error","df":"последовательность подряд идущих ошибочных битов"}],"summary":["","**Суть:** Добавляем избыточные биты к данным, чтобы обнаружить или исправить искажения.","","**Коды обнаружения ошибок (error-detecting):**","- **Бит чётности (parity bit)** — простейший, ловит нечётное число ошибок.","- **Контрольная сумма (checksum)** — сумма байтов (IP, UDP, TCP).","- **CRC (Cyclic Redundancy Check)** — полиномиальная арифметика, очень эффективна, используется в Ethernet и Wi-Fi.","- При обнаружении ошибки кадр **отбрасывается**, запрашивается повторная передача (ARQ).","","**Коды исправления ошибок (error-correcting, FEC):**","- Добавляют больше избыточности, позволяя **восстановить** исходные данные без повторной передачи.","- **Код Хэмминга** — простой, исправляет 1 ошибку.","- **Рида-Соломона** — исправляет несколько ошибок, используется в CD/DVD, QR, спутниках.","- **Свёрточные коды**, **Turbo**, **LDPC** — современные, для беспроводной связи (Wi-Fi, 5G).","","**Выбор метода:**","- Низкий BER, возможна повторная передача → **обнаружение + ARQ** (дешевле).","- Высокий BER или real-time (нельзя ждать) → **FEC**.","","**Для устного:** ARQ = обнаружение + повтор. FEC = исправление без повтора. Часто комбинируют."]},{"n":17,"title":"Элементарные протоколы: симплексный протокол «Утопия», симплексный протокол с ожиданием для канала без ошибок, симплексный протокол с ожиданием для зашумлённых каналов.","paragraphs":["Три учебных протокола канального уровня. Все — симплексные (данные идут только в одну сторону). Каждый следующий протокол добавляет одну новую возможность.","**1. «Утопия» (Utopia)** — идеальный, нереальный протокол:\n- Канал без ошибок, получатель всегда готов принять.\n- Отправитель просто шлёт кадры один за другим без остановки.\n- Нет управления потоком, нет обработки ошибок.\n- На практике невозможен — служит отправной точкой.","**2. Стоп-и-жди (stop-and-wait) для канала без ошибок:**\n- Проблема: получатель не успевает обработать — нужно управление потоком.\n- Решение: отправитель послал кадр → ждёт **ACK** от получателя → только потом шлёт следующий.\n- Ошибок в канале нет, поэтому обработка ошибок не нужна.","**3. PAR (Positive Acknowledgement with Retransmission) для зашумлённых каналов:**\n- Проблема: кадры или ACK могут потеряться.\n- Решения (три механизма):\n  - **Нумерация кадров** (достаточно 1 бита: 0 и 1) — чтобы отличить новый кадр от дубликата.\n  - **Таймер** — если ACK не пришёл вовремя, кадр отправляется повторно.\n  - **Проверка дубликатов** — получатель видит повтор → отбрасывает, но снова шлёт ACK.\n- Это основа всех более сложных протоколов (скользящее окно)."],"terms":[{"ru":"Симплекс","en":"simplex","df":"передача данных только в одном направлении"},{"ru":"Протокол «Утопия»","en":"Utopia protocol","df":"идеальный протокол без ошибок и без управления потоком"},{"ru":"ACK","en":"Acknowledgement","df":"подтверждение успешного получения кадра"},{"ru":"Стоп-и-жди","en":"stop-and-wait","df":"режим, при котором отправитель ждёт подтверждения перед отправкой следующего кадра"},{"ru":"Таймер","en":"timer/retransmission timer","df":"механизм отсчёта времени ожидания подтверждения"},{"ru":"PAR","en":"Positive Acknowledgement with Retransmission","df":"подтверждение с повторной передачей при отсутствии ACK"},{"ru":"Дубликат кадра","en":"duplicate frame","df":"повторно переданный кадр с уже использованным номером последовательности"},{"ru":"Зашумлённый канал","en":"noisy channel","df":"канал, в котором возможны искажения и потери битов"}],"summary":["","**Суть:** Простейшие протоколы для иллюстрации принципов.","","**Протокол «Утопия»:**","- Идеальный канал: без ошибок, бесконечная скорость получателя.","- Отправитель просто посылает кадры без подтверждений.","- На практике невозможен.","","**Stop-and-wait для безошибочного канала:**","- Добавлено **управление потоком**.","- Отправитель посылает кадр и **ждёт ACK** от получателя.","- Защищает медленного получателя от быстрого отправителя.","- **Проблема:** канал почти не используется (1 кадр за RTT).","","**Stop-and-wait для зашумлённого канала:**","- Добавлены: **CRC**, **таймауты**, **повторная передача**, **номера последовательности**.","- Номер последовательности 1 бит (**alternating bit protocol**) — чтобы различать новый кадр и повтор.","- Если ACK потерялся — отправитель повторяет кадр, получатель узнаёт дубликат по номеру и отбрасывает.","","**Для устного:** Эволюция: Утопия → stop-and-wait (ACK) → stop-and-wait + CRC + таймаут (надёжность) → sliding window (эффективность)."]},{"n":18,"title":"Протоколы скользящего окна. Протокол однобитового скользящего окна. Протокол с возвратом на N. Протокол с выборочным повтором.","paragraphs":["**Идея скользящего окна** (sliding window): вместо того чтобы ждать ACK после каждого кадра (как в стоп-и-жди), отправитель может послать сразу несколько кадров подряд. «Окно» размером W — это сколько кадров можно отправить без подтверждения. Когда приходит ACK — окно сдвигается вперёд.","**1. Однобитовое окно** (1-bit sliding window):\n- Окно = 1 у обоих сторон, эквивалент протокола PAR (не стоп-и-жди, так как есть нумерация кадров, таймер и обработка дубликатов).\n- Послал кадр 0 → ждёшь ACK → послал кадр 1 → ждёшь ACK.\n- Медленно, если канал длинный (много времени тратится на ожидание).","**2. Go-Back-N (GBN)** — возврат на N:\n- Отправитель может послать до N кадров без подтверждения.\n- Получатель принимает кадры **только по порядку** (буфер = 1).\n- Если кадр потерялся — отправитель повторяет его **и все последующие**.\n- Недостаток: много лишних повторов при плохом канале.\n- Макс. размер окна: **2^n − 1** (n — число бит для нумерации).","**3. Selective Repeat (SR)** — выборочный повтор:\n- Получатель **буферизует** кадры, пришедшие не по порядку.\n- Отправитель повторяет **только потерянный кадр**, а не все подряд.\n- **NAK** (Negative ACK) — получатель сообщает, какой именно кадр пропал → повтор без ожидания таймера.\n- Макс. размер окна: **2^(n−1)** (вдвое меньше, чем у GBN, иначе нельзя отличить новый кадр от повтора).","**Сравнение:**\n- **1-bit (PAR)**: окно = 1, есть обработка ошибок, но медленно (ждём ACK после каждого кадра).\n- **GBN**: окно до 2^n−1, буфер получателя = 1, при ошибке повторяет всё начиная с потерянного.\n- **SR**: окно до 2^(n−1), буфер нужен и у отправителя и у получателя, но повторяет только потерянный кадр."],"terms":[{"ru":"Скользящее окно","en":"sliding window","df":"механизм, позволяющий передавать несколько кадров до получения подтверждения"},{"ru":"Окно отправителя","en":"sender window","df":"множество кадров, разрешённых к отправке без подтверждения"},{"ru":"Произведение пропускной способности на задержку","en":"bandwidth-delay product","df":"число бит «в полёте» в канале в данный момент"},{"ru":"Возврат на N","en":"Go-Back-N","df":"стратегия, при которой повторяются N кадров начиная с ошибочного"},{"ru":"Выборочный повтор","en":"Selective Repeat","df":"стратегия, при которой повторяется только конкретный утерянный кадр"},{"ru":"NAK","en":"Negative Acknowledgement","df":"отрицательное подтверждение, сигнализирует об ошибке конкретного кадра"},{"ru":"Буферизация не по порядку","en":"out-of-order buffering","df":"сохранение кадров, пришедших раньше ожидаемых"},{"ru":"Номер последовательности","en":"sequence number","df":"порядковый номер кадра для идентификации и упорядочивания"}],"summary":["","**Суть:** Скользящее окно — несколько неподтверждённых кадров «в полёте», что даёт высокую эффективность.","","**Однобитовое скользящее окно:**","- Окно размером 1.","- По сути эквивалентно stop-and-wait.","","**Go-Back-N:**","- Окно отправителя размером **N**.","- Получатель принимает кадры **только по порядку**.","- При потере кадра K: получатель отбрасывает K, K+1, K+2... Отправитель **пересылает все** кадры начиная с K.","- Просто, но неэффективно при потерях.","","**Selective Repeat (выборочный повтор):**","- Получатель **буферизует** внепорядковые кадры.","- Пересылаются только **потерянные** кадры.","- Эффективнее, но сложнее (нужны большие буферы).","- Размер окна ≤ половине числа возможных номеров последовательности.","","**Сравнение:**","- **Go-Back-N** — простой получатель, сложный отправитель, плохо при потерях.","- **Selective Repeat** — оптимальный, но сложный.","","**Для устного:** TCP использует вариант Selective Repeat с опцией SACK."]},{"n":19,"title":"Примеры протоколов передачи данных: SONET, ADSL.","paragraphs":["**SONET / SDH** — стандарт передачи данных по оптоволокну. SONET используется в Америке, SDH — в Европе. Это одна и та же технология с разными названиями.","**Что нужно знать о SONET:**\n- Все узлы синхронизированы по единому времени — поэтому называется «синхронная» сеть.\n- **OC** означает «Optical Carrier» — уровень скорости оптического канала. Число после OC показывает, во сколько раз скорость больше базовой.\n- Базовая скорость **OC-1 = 51,84 Мбит/с** (один фрейм = 810 байт × 8000 фреймов/с).\n- Чтобы получить более высокую скорость, несколько каналов OC-1 объединяются вместе:\n  - **OC-3** = 3 × OC-1 = **155 Мбит/с**\n  - **OC-12** = 12 × OC-1 = **622 Мбит/с**\n  - **OC-48** = 48 × OC-1 = **2,5 Гбит/с**\n  - **OC-192** = 192 × OC-1 = **10 Гбит/с**","**ADSL** (Asymmetric Digital Subscriber Line) — технология, которая позволяет передавать Интернет по обычному телефонному проводу (медная витая пара).","**Почему «асимметричная»:** скорость скачивания (downstream) выше, чем скорость отправки (upstream):\n- Скачивание (downstream): до **~8 Мбит/с**.\n- Отправка (upstream): до **~1 Мбит/с**.","**Как работает ADSL (метод DMT — Discrete MultiTone):**\n- Провод может передавать частоты до 1,1 МГц. Эта полоса делится на **256 подканалов** (каждый шириной 4312,5 Гц).\n- Подканал 0 — оставлен для обычного телефона (**POTS** — Plain Old Telephone Service).\n- Подканалы 1–5 — защитная зона (чтобы голос и данные не мешали друг другу).\n- Подканалы 6–30 — для отправки данных (upstream).\n- Подканалы 31–255 — для скачивания данных (downstream) — их больше, поэтому скорость выше.\n- В каждом подканале используется модуляция **QAM**, причём количество бит подстраивается под качество линии на этой частоте.\n- **Сплиттер** (splitter) — фильтр, который стоит у абонента и разделяет голосовой сигнал (телефон) от высокочастотного (Интернет)."],"terms":[{"ru":"SONET/SDH","en":"Synchronous Optical Network / Synchronous Digital Hierarchy","df":"синхронные стандарты передачи данных по оптоволокну"},{"ru":"STS-1 / OC-1","en":"Synchronous Transport Signal / Optical Carrier","df":"базовый уровень SONET, 51,84 Мбит/с"},{"ru":"ADSL","en":"Asymmetric Digital Subscriber Line","df":"асимметричная цифровая абонентская линия по медной паре"},{"ru":"DMT","en":"Discrete MultiTone","df":"многочастотное мультиплексирование с разделением полосы на подканалы"},{"ru":"QAM","en":"Quadrature Amplitude Modulation","df":"квадратурная амплитудная модуляция"},{"ru":"POTS","en":"Plain Old Telephone Service","df":"традиционная аналоговая телефония"},{"ru":"Сплиттер","en":"splitter","df":"фильтр, разделяющий голосовой и высокочастотный трафик в ADSL"},{"ru":"Нисходящий / восходящий поток","en":"downstream / upstream","df":"передача к пользователю / от пользователя"}],"summary":["","**Суть:** SONET — для магистралей, ADSL — для абонентов по телефонной паре.","","**SONET/SDH (Synchronous Optical Network):**","- Стандарт для оптических магистралей.","- **Синхронная** передача — все узлы синхронизированы.","- **Иерархия скоростей:** OC-1 (51.84 Мбит/с), OC-3, OC-12, OC-48 (2.5 Гбит/с), OC-192 (10 Гбит/с), OC-768 (40 Гбит/с).","- Встроенные механизмы **защиты** (автопереключение на резервное кольцо).","- Используется в опорных сетях телекома.","","**ADSL (Asymmetric Digital Subscriber Line):**","- Широкополосный доступ по обычной **медной телефонной паре**.","- **Асимметрия:** download быстрее, чем upload (до 24/3 Мбит/с у ADSL2+).","- **Разделение полос:** низкие частоты для голоса, высокие для данных → можно одновременно звонить и серфить.","- **DMT-модуляция** (Discrete Multi-Tone) — сотни поднесущих, как в OFDM.","- VDSL/VDSL2 — более быстрые варианты.","","**Для устного:** SONET = магистрали (оптика), ADSL = «последняя миля» к абоненту (медь)."]},{"n":20,"title":"Обобщённая задача коммутации. Коммутация каналов и пакетов. Маршрутизация.","paragraphs":["**Задача:** множество устройств хотят передавать данные друг другу через общую сеть. Как доставить данные от отправителя к получателю? Есть два принципиально разных подхода — **коммутация каналов** и **коммутация пакетов**.","**1. Коммутация каналов** (circuit switching) — как телефонный звонок:\n- Перед передачей данных создаётся **выделенный путь** от отправителя до получателя.\n- Этот путь занят на всё время разговора, даже если никто не говорит.\n- Пример: традиционная телефонная сеть (PSTN).\n- Плюс: гарантированная скорость и постоянная задержка.\n- Минус: если линия молчит — ресурсы всё равно заняты (неэффективно).","**2. Коммутация пакетов** (packet switching) — как почта:\n- Данные разрезаются на **пакеты**. Каждый пакет содержит адрес получателя.\n- Пакеты отправляются в сеть, и каждый промежуточный узел решает, куда его передать дальше.\n- Путь не резервируется — линии используются совместно многими пользователями.\n- Плюс: эффективно при неравномерной нагрузке, устойчиво к отказам.\n- Два варианта:\n  - **Виртуальные каналы** — путь выбирается один раз при установке соединения, все пакеты идут по нему (примеры: ATM, Frame Relay).\n  - **Дейтаграммы** — каждый пакет маршрутизируется независимо, может пойти разными путями (пример: IP).","**Коммутация vs маршрутизация — в чём разница?**\n- **Коммутация** (switching) — это **механизм доставки**: как именно данные передаются через сеть (по выделенному каналу или пакетами).\n- **Маршрутизация** (routing) — это **выбор пути**: по какому маршруту пакет пойдёт от отправителя к получателю.\n- Маршрутизация нужна только при коммутации пакетов (при коммутации каналов путь выбирается один раз при установке соединения).\n- Алгоритмы маршрутизации бывают **статические** (таблица задана вручную, не меняется) и **динамические** (таблица обновляется автоматически при изменениях в сети).","**Устройства:**\n- **Мосты и коммутаторы** (bridges, switches) — работают на канальном уровне (L2), перенаправляют кадры по MAC-адресам внутри одной сети.\n- **Маршрутизаторы** (routers) — работают на сетевом уровне (L3), выбирают путь между разными сетями по IP-адресам."],"terms":[{"ru":"Коммутация каналов","en":"circuit switching","df":"соединение с резервированием ресурсов на время сеанса"},{"ru":"Коммутация пакетов","en":"packet switching","df":"передача независимых пакетов через разделяемую сеть"},{"ru":"Виртуальный канал","en":"virtual circuit","df":"логический путь, установленный для группы пакетов"},{"ru":"Дейтаграмма","en":"datagram","df":"независимый пакет с полной адресной информацией"},{"ru":"Маршрутизация","en":"routing","df":"выбор пути пересылки пакета в сети"},{"ru":"ATM","en":"Asynchronous Transfer Mode","df":"технология передачи на основе виртуальных каналов и ячеек фиксированного размера"}],"summary":["","**Суть:** Коммутация — доставка данных от источника к получателю через промежуточные узлы.","","**Коммутация каналов (circuit switching):**","- Выделенный **путь и ресурсы** на всё время сеанса.","- Предсказуемая задержка и пропускная способность.","- Неэффективно при пачечном (bursty) трафике — ресурсы простаивают.","- Пример: PSTN (телефон).","","**Коммутация пакетов (packet switching):**","- Данные делятся на **пакеты**, каждый передаётся независимо.","- Пакеты совместно используют линии (статистическое мультиплексирование).","- Эффективно, но задержка и потери **переменны**.","- Пример: Интернет.","","**Сравнение:**","","| Критерий | Circuit | Packet |","|---|---|---|","| Ресурсы | Выделены заранее | Общие |","| Задержка | Постоянная | Переменная |","| Эффективность | Низкая при burst | Высокая |","| Надёжность | Высокая | Зависит от протокола |","","**Маршрутизация:**","- Выбор **пути** и следующего узла для пакета.","- Алгоритмы: Dijkstra, Bellman-Ford, link-state, distance vector.","- Политики: кратчайший путь, минимальная задержка, политический (BGP).","","**Для устного:** Интернет выбрал пакетную коммутацию за эффективность."]}],"quizzes":[{"type":"mcq","topic":"Вопрос 15","q":"Какой метод формирования кадра используется в HDLC?","opts":["Счётчик символов в заголовке","Флаговые байты с байт-стаффингом","Флаговые биты с бит-стаффингом (после пяти единиц вставляется ноль)","Нарушения физического кодирования"],"ans":2,"expl":"В HDLC используются флаговые биты с бит-стаффингом: после пяти подряд идущих единиц вставляется ноль."},{"type":"mcq","topic":"Вопрос 15","q":"Сколько классов сервисов канальный уровень предоставляет сетевому уровню?","opts":["Два: надёжная и ненадёжная доставка","Три: ненадёжная без подтверждений, надёжная без установления соединения, надёжная с установлением соединения","Четыре: с подтверждением, без подтверждения, с соединением, без соединения","Один: надёжная доставка с подтверждениями"],"ans":1,"expl":"Канальный уровень предоставляет три класса сервисов: ненадёжная доставка без подтверждений, надёжная без установления соединения и надёжная с установлением соединения."},{"type":"tf","topic":"Вопрос 15","q":"Ненадёжная доставка без подтверждений применяется для каналов с низким уровнем ошибок, например Ethernet.","ans":true,"expl":"Согласно материалу, ненадёжная доставка без подтверждений используется для каналов с низким уровнем ошибок, таких как Ethernet."},{"type":"mcq","topic":"Вопрос 16","q":"Какое кодовое расстояние Хэмминга необходимо для исправления d ошибок?","opts":["d + 1","2d","2d + 1","d + 2"],"ans":2,"expl":"Для исправления d ошибок необходимо кодовое расстояние 2d+1."},{"type":"tf","topic":"Вопрос 16","q":"Код Рида-Соломона работает на уровне отдельных битов, а не символов.","ans":false,"expl":"Код Рида-Соломона — блочный код на символах (не битах), широко используется в DSL и оптических сетях."},{"type":"mcq","topic":"Вопрос 16","q":"На чём основан циклический избыточный код (CRC)?","opts":["На подсчёте числа единиц в сообщении","На суммировании 16-битовых слов","На делении полинома сообщения на порождающий полином в поле GF(2)","На умножении матриц чётности"],"ans":2,"expl":"CRC основан на делении полинома сообщения на порождающий полином в поле GF(2)."},{"type":"mcq","topic":"Вопрос 17","q":"Какой протокол является непосредственным предшественником протоколов скользящего окна?","opts":["Протокол «Утопия»","Симплексный протокол с ожиданием для канала без ошибок","Протокол PAR (Positive Acknowledgement with Retransmission)","Протокол Go-Back-N"],"ans":2,"expl":"Симплексный протокол с ожиданием для зашумлённых каналов (PAR) — непосредственный предшественник протоколов скользящего окна."},{"type":"tf","topic":"Вопрос 17","q":"В протоколе «Утопия» присутствует управление потоком, но отсутствует обработка ошибок.","ans":false,"expl":"В протоколе «Утопия» отсутствуют и управление потоком, и обработка ошибок — это полностью идеализированный протокол."},{"type":"tf","topic":"Вопрос 17","q":"В протоколе PAR для нумерации кадров достаточно 1 бита (номера 0 или 1).","ans":true,"expl":"Каждый кадр нумеруется, и для этого достаточно 1 бита: 0 или 1."},{"type":"mcq","topic":"Вопрос 18","q":"Каков максимальный размер окна отправителя в протоколе Go-Back-N при n-битовой нумерации?","opts":["2^n","2^(n-1)","2^n - 1","n - 1"],"ans":2,"expl":"В протоколе Go-Back-N размер окна отправителя не более 2^n - 1 при n-битовой нумерации."},{"type":"tf","topic":"Вопрос 18","q":"В протоколе с выборочным повтором (Selective Repeat) получатель принимает кадры строго по порядку и не буферизует кадры, пришедшие не по порядку.","ans":false,"expl":"В Selective Repeat получатель буферизует кадры, пришедшие не по порядку. Именно получатель Go-Back-N принимает кадры строго по порядку."},{"type":"mcq","topic":"Вопрос 18","q":"Что ускоряет повторную передачу в протоколе с выборочным повтором, не дожидаясь таймаута?","opts":["ACK","NAK (отрицательное подтверждение)","Двойной ACK","Сигнал заглушки"],"ans":1,"expl":"Отрицательное подтверждение (NAK) ускоряет повтор конкретного утерянного кадра, не дожидаясь таймаута."},{"type":"mcq","topic":"Вопрос 19","q":"Какова скорость базового блока SONET — STS-1 (OC-1)?","opts":["10 Мбит/с","51,84 Мбит/с","155 Мбит/с","622 Мбит/с"],"ans":1,"expl":"Базовый блок SONET — STS-1/OC-1 обеспечивает скорость 51,84 Мбит/с."},{"type":"tf","topic":"Вопрос 19","q":"В ADSL полоса до 1,1 МГц делится на 256 подканалов шириной 4312,5 Гц каждый.","ans":true,"expl":"Согласно материалу, в DMT полоса до 1,1 МГц делится на 256 подканалов шириной 4312,5 Гц."},{"type":"mcq","topic":"Вопрос 19","q":"Какие подканалы DMT в ADSL используются для нисходящего потока?","opts":["0-5","6-30","31-255","1-255"],"ans":2,"expl":"Подканалы 31-255 используются для нисходящего потока, 6-30 — для восходящего."},{"type":"mcq","topic":"Вопрос 20","q":"Какой пример дейтаграммной сети приведён в материале?","opts":["ATM","Frame Relay","IP","PSTN"],"ans":2,"expl":"IP — пример дейтаграммной сети, где каждый пакет маршрутизируется независимо."},{"type":"tf","topic":"Вопрос 20","q":"Коммутация каналов характеризуется неэффективным использованием ресурсов при пульсирующем трафике.","ans":true,"expl":"Среди недостатков коммутации каналов указано неэффективное использование ресурсов при пульсирующем трафике."},{"type":"match","topic":"Тема 3","q":"Сопоставьте понятия канального уровня с их определениями.","pairs":[{"l":"Байт-стаффинг","r":"Вставка escape-байта перед специальными символами внутри кадра"},{"l":"Кодовое расстояние Хэмминга","r":"Минимальное число позиций, в которых два допустимых кодовых слова различаются"},{"l":"Протокол «Утопия»","r":"Идеальный протокол без ошибок и без управления потоком"},{"l":"Go-Back-N","r":"Стратегия повтора всех кадров начиная с ошибочного"},{"l":"NAK","r":"Отрицательное подтверждение, сигнализирующее об ошибке конкретного кадра"},{"l":"SONET","r":"Стандарт синхронной передачи данных по оптоволокну"},{"l":"DMT","r":"Многочастотное мультиплексирование с разделением полосы на подканалы"}],"expl":"Каждое понятие связано с соответствующим определением из материалов Темы 3."}]},{"id":4,"name":"Подуровень управления доступом к среде","questions":[{"n":21,"title":"Проблема распределения канала. Статическое распределение канала. Допущения, связанные с динамическим распределением каналов.","paragraphs":["**Проблема:** несколько устройств (станций) подключены к одному общему каналу связи (например, один кабель или одна радиочастота). Если два устройства передают одновременно — сигналы накладываются и данные портятся. Это называется **коллизия** (collision). Как разделить канал, чтобы этого не происходило?","**Статическое распределение** — канал делится заранее, каждому устройству выделяется своя часть:\n- **FDM** (Frequency Division Multiplexing) — каждой станции своя полоса частот (как разные радиостанции на разных частотах).\n- **TDM** (Time Division Multiplexing) — каждой станции свой временной слот (станция 1 передаёт в слот 1, станция 2 — в слот 2, и т.д.).\n- Недостаток: если станция ничего не передаёт — её частота / слот всё равно занята и пустует.","**Динамическое распределение** — канал не делится заранее. Станции сами решают, когда передавать, и разрешают конфликты по правилам протокола. Это эффективнее при неравномерной нагрузке.","Допущения для анализа динамических протоколов:\n- Станции генерируют кадры **независимо** друг от друга.\n- Канал **один** — общий для всех.\n- **Коллизии наблюдаемы** — можно определить, что произошло столкновение.\n- Время бывает **непрерывное** (передача в любой момент) или **слотированное** (только в начале слота).\n- Осведомлённость о коллизии бывает **мгновенная** или **задержанная**."],"terms":[{"ru":"Разделяемая среда","en":"shared medium","df":"физическая среда, используемая несколькими станциями одновременно"},{"ru":"FDM","en":"Frequency Division Multiplexing","df":"частотное разделение канала"},{"ru":"TDM","en":"Time Division Multiplexing","df":"временное разделение канала"},{"ru":"Коллизия","en":"collision","df":"одновременная передача двух и более станций, приводящая к искажению сигнала"},{"ru":"Пульсирующий трафик","en":"bursty traffic","df":"трафик с резкими периодическими всплесками активности"}],"summary":["","**Суть:** Когда несколько устройств делят одну среду, нужен способ распределения.","","**Статическое распределение:**","- Ресурс фиксированно делится (FDM, TDM).","- **Просто**, но **неэффективно** при пачечном трафике — если пользователь молчит, его слот простаивает.","- Хорошо для постоянного трафика (телефония).","","**Динамическое распределение:**","- Ресурс выделяется **по требованию**.","- Эффективнее для пакетного трафика.","","**Допущения моделей динамического распределения:**","1. **Модель станции:** N независимых станций.","2. **Единый канал:** все используют один канал.","3. **Коллизии:** если две станции передают одновременно → столкновение.","4. **Время:** слотовое (дискретное) или непрерывное.","5. **Прослушивание канала (CSMA):** станция может или не может слышать, занят ли канал.","6. **Задержка распространения** и обратная связь.","","**Для устного:** Статика проще, но простаивает. Динамика эффективнее, но нужен протокол разрешения конфликтов."]},{"n":22,"title":"Протоколы коллективного доступа. Система ALOHA. Протоколы множественного доступа с контролем несущей. Протоколы без столкновений. Протоколы с ограниченной конкуренцией. Протоколы беспроводных локальных сетей.","paragraphs":["Все протоколы решают одну задачу: как несколько станций делят один общий канал без хаоса.","**1. ALOHA** (первый протокол случайного доступа, 1970):\n- **Чистая ALOHA** (Pure ALOHA) — станция передаёт когда хочет; если коллизия — ждёт случайное время и повторяет. Макс. эффективность **18,4%**\n- **Слотированная ALOHA** (Slotted ALOHA) — передача только в начале временного слота. Макс. эффективность **36,8%** (вдвое лучше, т.к. меньше шансов на столкновение)","**2. CSMA** (Carrier Sense Multiple Access) — «слушай перед передачей»:\n- **1-упорный** (1-persistent) — если канал занят, ждёт и передаёт сразу при освобождении. Жадный, много коллизий. Основа Ethernet\n- **Ненастойчивый** (non-persistent) — если канал занят, ждёт случайное время, потом снова слушает. Меньше коллизий, но выше задержка\n- **p-настойчивый** (p-persistent) — при свободном канале передаёт с вероятностью p, откладывает с вероятностью (1−p). Компромисс между первыми двумя","**3. CSMA/CD** (Collision Detection) — проводной Ethernet (IEEE 802.3):\n- Станция слушает канал **во время** своей передачи — если сигнал искажён, значит коллизия\n- При коллизии: стоп → **jam signal** (сигнал заглушки) → ожидание по **двоичному экспоненциальному откату** (binary exponential backoff): после k-й коллизии ждёт случайное число слотов от 0 до 2^min(k,10)−1\n- После 16 коллизий подряд — передача отменяется\n- В Wi-Fi не работает: станция не может одновременно передавать и слушать в эфире","**4. Протоколы без столкновений** (collision-free) — коллизии исключены по конструкции:\n- **Побитовая карта** (bitmap) — станции по очереди объявляют намерение; затем передают без конфликтов\n- **Передача маркера** (token passing) — специальный кадр-маркер ходит по кольцу (Token Ring); только владелец маркера может передавать\n- **Двоичный обратный отсчёт** (binary countdown) — станции сравнивают адреса побитово; побеждает наибольший номер","**5. Протоколы с ограниченной конкуренцией** (limited contention):\n- Гибрид: при малой нагрузке — конкуренция (быстро), при большой — детерминированный доступ (стабильно)\n- Пример: **адаптивное дерево** (adaptive tree walk) — станции делятся на группы рекурсивно, пока не останется одна","**6. Протоколы беспроводных ЛВС** (wireless LAN):\n- **Проблема скрытого узла** (hidden terminal): станции A и C не слышат друг друга, но обе передают на B → коллизия на B. Обычный CSMA не помогает\n- **MACA** (Karn, 1990) — решение: отправитель шлёт **RTS** (Request To Send), получатель отвечает **CTS** (Clear To Send) → все слышащие CTS молчат\n- **CSMA/CA** (Collision Avoidance) — протокол Wi-Fi (IEEE 802.11), развитие MACA:\n  - Коллизии **предотвращаются**, а не обнаруживаются (в эфире обнаружение невозможно)\n  - Перед передачей станция ждёт интервал **DIFS** (DCF Inter-Frame Spacing), затем случайный откат (backoff)\n  - Получатель подтверждает приём кадром **ACK** (после короткого интервала **SIFS**)\n  - **RTS/CTS — опционален**: по умолчанию Wi-Fi использует только прослушивание канала; RTS/CTS включают для борьбы со скрытыми узлами"],"terms":[{"ru":"CSMA","en":"Carrier Sense Multiple Access","df":"множественный доступ с прослушиванием несущей"},{"ru":"CSMA/CD","en":"Collision Detection","df":"обнаружение коллизий, проводной Ethernet"},{"ru":"CSMA/CA","en":"Collision Avoidance","df":"предотвращение коллизий, Wi-Fi"},{"ru":"Двоичный экспоненциальный откат","en":"binary exponential backoff","df":"алгоритм ожидания после коллизии"},{"ru":"Скрытый узел","en":"hidden terminal","df":"узел вне зоны слышимости отправителя, вызывающий коллизию у получателя"},{"ru":"RTS/CTS","en":"Request To Send / Clear To Send","df":"резервирование канала перед передачей"},{"ru":"DIFS/SIFS","en":"DCF/Short Inter-Frame Spacing","df":"межкадровые интервалы в Wi-Fi (SIFS < DIFS = выше приоритет)"}],"summary":["","**Суть:** Правила, по которым станции решают, когда можно передавать.","","**ALOHA (1970, Гавайи):**","- **Чистый ALOHA:** передают когда хотят; коллизии частые. Максимум 18% эффективности.","- **Слотовый ALOHA:** передачи только в начале слота. Максимум 37%.","","**CSMA (Carrier Sense Multiple Access):**","- **Слушай перед передачей** (listen before talk).","- **1-persistent:** когда канал свободен — сразу передаёт.","- **Non-persistent:** ждёт случайное время.","- **p-persistent:** с вероятностью p.","","**CSMA/CD (Collision Detection):**","- **Слушать во время передачи** — если коллизия, прервать и послать jamming.","- Retries с экспоненциальной отсрочкой (binary exponential backoff).","- Основа классического Ethernet.","","**CSMA/CA (Collision Avoidance):**","- Нельзя слушать во время передачи в Wi-Fi (проблема скрытого узла).","- Избежание коллизий: случайное ожидание + опциональные **RTS/CTS** (Request to Send / Clear to Send).","- Wi-Fi (802.11).","","**Беспроводные ЛВС:**","- **Скрытый узел** — две станции не слышат друг друга, но обе слышат AP.","- **Засвеченный узел** — слышат передачу, которая им не мешает.","- Решение: RTS/CTS резервирует канал.","","**Для устного:** Ethernet = CSMA/CD, Wi-Fi = CSMA/CA."]},{"n":23,"title":"Физический уровень сети Ethernet. Протокол подуровня управления доступом к среде в Ethernet. Производительность сети Ethernet. Коммутируемые сети Ethernet.","paragraphs":["**1. Физический уровень** (Physical Layer):\n- **Ethernet** стандартизирован IEEE (стандарт IEEE 802.3) и определяет передачу данных в проводных локальных сетях\n- На физическом уровне задаются: тип среды передачи, способ кодирования сигнала и скорость передачи\n- Эволюция: коаксиальный кабель с топологией «шина» (10BASE5, 10BASE2) → **витая пара** с топологией «звезда» (10BASE-T) → Fast Ethernet (100 Мбит/с) → Gigabit Ethernet (1 Гбит/с) → 10 Gigabit и выше\n- В классическом Ethernet используется **Манчестерское кодирование** (Manchester encoding) — в середине каждого бита происходит переход сигнала, что обеспечивает синхронизацию приёмника с передатчиком\n- Передача осуществляется электрическими сигналами (витая пара) или оптическими сигналами (оптоволокно)","**2. Подуровень MAC** (Media Access Control — управление доступом к среде):\n- MAC — это подуровень канального уровня, который управляет доступом устройств к общей среде передачи\n- В классическом Ethernet используется метод **CSMA/CD** (Carrier Sense Multiple Access with Collision Detection): станция слушает канал → если свободен — передаёт → при обнаружении коллизии прекращает передачу → ждёт случайное время по алгоритму **двоичного экспоненциального отката** (binary exponential backoff) и повторяет попытку\n- CSMA/CD применяется только в режиме **полудуплекса** (half-duplex)\n- Минимальный размер кадра — **64 байта**. Это нужно, чтобы передатчик успел обнаружить коллизию до окончания передачи\n- **Формат кадра Ethernet:** преамбула (7 Б) + SFD (1 Б) для синхронизации, MAC-адреса получателя и отправителя (по 6 Б), тип/длина (2 Б), данные (46–1500 Б), **FCS** — контрольная сумма CRC-32 (4 Б)\n- Если данных меньше 46 байт, кадр дополняется нулями (**padding**) до минимальных 64 байт","**3. Производительность Ethernet:**\n- Эффективность зависит от двух факторов: размера кадра и длины сети (задержки распространения)\n- Формула: **Эффективность ≈ 1 / (1 + 5a)**, где a = время распространения сигнала / время передачи кадра\n- При маленьком a (большие кадры, короткий кабель) эффективность близка к 100%. При большом a (маленькие кадры, длинный кабель) эффективность падает\n- При высокой нагрузке число коллизий увеличивается и пропускная способность снижается","**4. Коммутируемый Ethernet** (switched Ethernet):\n- Изначально использовались **концентраторы** (hub) — они передают сигнал на все порты и создают один общий **домен коллизий** (collision domain)\n- Современные сети используют **коммутаторы** (switch) — они передают кадры только на нужный порт, создавая отдельный домен коллизий для каждого порта\n- При этом **широковещательный домен** (broadcast domain) остаётся общим, если не используется VLAN\n- В режиме **полного дуплекса** (full duplex) станция одновременно передаёт и принимает данные. Коллизий нет, и CSMA/CD не используется\n- Коммутатор узнаёт расположение устройств через **обратное обучение** (backward learning): запоминает MAC-адрес отправителя и номер порта. Если адрес назначения неизвестен — выполняется **flooding** (рассылка на все порты)\n- **VLAN** (IEEE 802.1Q, Virtual LAN) позволяет логически разделить сеть на изолированные сегменты с отдельными broadcast domains, что повышает безопасность и управляемость"],"terms":[{"ru":"Ethernet","en":"IEEE 802.3","df":"семейство технологий проводных локальных сетей"},{"ru":"Манчестерское кодирование","en":"Manchester encoding","df":"метод кодирования с переходом сигнала в середине бита"},{"ru":"Домен коллизий","en":"collision domain","df":"сегмент сети, в котором станции могут столкнуться при передаче"},{"ru":"Широковещательный домен","en":"broadcast domain","df":"сегмент сети, в котором распространяются broadcast-кадры"},{"ru":"Коммутатор","en":"switch","df":"устройство канального уровня, направляющее кадры на конкретный порт"},{"ru":"Обратное обучение","en":"backward learning","df":"коммутатор запоминает адреса отправителей из входящих кадров"},{"ru":"VLAN","en":"Virtual LAN","df":"виртуальная локальная сеть, логическое разделение коммутатора на сегменты"},{"ru":"FCS","en":"Frame Check Sequence","df":"контрольная сумма CRC-32 в конце кадра Ethernet"}],"summary":["","**Суть:** Ethernet — доминирующий проводной стандарт локальных сетей (IEEE 802.3).","","**Физический уровень:**","- Изначально коаксиальный кабель (10BASE5, 10BASE2).","- Сейчас **витая пара** (Cat5e/6/7) и оптика.","- **10BASE-T** (10 Мбит/с), **100BASE-TX** (100 Мбит/с), **1000BASE-T** (гигабит).","- Топология: **звезда** через коммутатор.","","**MAC-уровень:**","- **CSMA/CD** (в классическом разделяемом Ethernet; в коммутируемом не нужен).","- **MAC-адреса** 48 бит (6 байт), уникальные.","- **Формат кадра:** преамбула + SFD + DA + SA + Type/Length + Data + CRC.","- Минимальный размер кадра 64 байта (для детекции коллизий), максимальный 1518 байт.","","**Производительность:**","- Разделяемый Ethernet деградирует при высокой загрузке.","- Коммутируемый Ethernet (full-duplex) — каждое соединение изолировано, нет коллизий.","- Масштабирование до 10/40/100 Гбит/с.","","**Для устного:** Современный Ethernet — full-duplex через коммутаторы, CSMA/CD практически не используется."]},{"n":24,"title":"Fast Ethernet. Gigabit Ethernet. 10-гигабитный Ethernet.","paragraphs":["С ростом скоростей Ethernet менялись среда передачи, методы кодирования и правила доступа к каналу.","**1. Fast Ethernet** (IEEE 802.3u) — скорость **100 Мбит/с**:\n- **100BASE-TX** — наиболее распространённый вариант. Использует 2 пары витой пары категории 5, кодирование **4B/5B + MLT-3** (каждые 4 бита данных кодируются 5-битным символом, затем линейное кодирование MLT-3 снижает частоту сигнала)\n- **100BASE-FX** — использует многомодовое оптоволокно (MMF), дальность до 2 км в полном дуплексе\n- Поддерживает **автосогласование** (Auto-Negotiation) — устройства автоматически выбирают лучшую общую скорость и режим дуплекса\n- Работает как в полудуплексе (с CSMA/CD), так и в полном дуплексе","**2. Gigabit Ethernet** (IEEE 802.3z / 802.3ab) — скорость **1 Гбит/с**:\n- **1000BASE-SX** — короткая волна (850 нм), многомодовое волокно (MMF), дальность до 550 м\n- **1000BASE-LX** — длинная волна (1310 нм), одномодовое волокно (SMF), дальность до 5 км\n- **1000BASE-T** — медная витая пара категории 5e, использует все 4 пары одновременно, кодирование **4D-PAM5** (импульсно-амплитудная модуляция с 5 уровнями), дальность до 100 м\n- В режиме полудуплекса применяется **расширение несущей** (carrier extension): короткие кадры дополняются до 512 байт, чтобы CSMA/CD мог работать на гигабитной скорости\n- **Пакетная передача** (frame bursting) позволяет отправлять несколько коротких кадров подряд без пауз, что повышает эффективность\n- На практике почти всегда используется полный дуплекс, поэтому CSMA/CD фактически не применяется","**3. 10-гигабитный Ethernet** (IEEE 802.3ae / 802.3an) — скорость **10 Гбит/с**:\n- Работает **только в полном дуплексе** — CSMA/CD полностью исключён\n- **10GBASE-SR** — многомодовое волокно (850 нм), дальность до 300 м\n- **10GBASE-LR** — одномодовое волокно (1310 нм), дальность до 10 км\n- **10GBASE-T** — медная витая пара категории 6a, дальность до 100 м\n- Кодирование: **64B/66B** — более эффективное, чем 8B/10B (всего 3% избыточности вместо 20%)\n- Применяется в центрах обработки данных и магистральных каналах"],"terms":[{"ru":"Fast Ethernet","en":"IEEE 802.3u","df":"Ethernet 100 Мбит/с"},{"ru":"Gigabit Ethernet","en":"IEEE 802.3z/ab","df":"Ethernet 1 Гбит/с"},{"ru":"10GbE","en":"10 Gigabit Ethernet","df":"Ethernet 10 Гбит/с, только полный дуплекс"},{"ru":"Автосогласование","en":"Auto-Negotiation","df":"автоматический выбор скорости и режима дуплекса"},{"ru":"Расширение несущей","en":"carrier extension","df":"дополнение кадров до 512 байт для работы CSMA/CD на гигабитной скорости"},{"ru":"Пакетная передача","en":"frame bursting","df":"отправка нескольких кадров подряд без пауз"}],"summary":["","**Суть:** Эволюция скорости Ethernet в 10 раз при сохранении обратной совместимости.","","**Fast Ethernet (100 Мбит/с, IEEE 802.3u, 1995):**","- Варианты: **100BASE-TX** (витая пара Cat5), **100BASE-FX** (оптика).","- Те же форматы кадра и MAC-протокол.","- Auto-negotiation со скоростью 10 Мбит/с.","","**Gigabit Ethernet (1 Гбит/с, IEEE 802.3z/ab, 1998–1999):**","- **1000BASE-T** (витая пара Cat5e, до 100 м) — массовый.","- **1000BASE-SX/LX** (оптика) — на большие расстояния.","- Full-duplex (без CSMA/CD) — основной режим.","- **Jumbo frames** — кадры до 9000 байт для эффективности.","","**10-гигабитный Ethernet (10 Гбит/с, IEEE 802.3ae, 2002):**","- Только full-duplex, только коммутаторы.","- Применяется в дата-центрах и магистралях.","- Варианты: 10GBASE-T (витая пара), 10GBASE-SR/LR/ER (оптика).","","**Дальнейшее:** 40G, 100G, 200G, 400G, 800G — для ЦОД и магистралей.","","**Для устного:** Скорость х10 каждое поколение."]},{"n":25,"title":"Стандарт 802.11: архитектура и стек протоколов, физический уровень, протокол подуровня управления доступом к среде, структура кадра, сервисы.","paragraphs":["Стандарт IEEE 802.11 (Wi-Fi) определяет работу беспроводных локальных сетей. Он охватывает два нижних уровня модели OSI: физический уровень и подуровень MAC канального уровня.","**1. Архитектура:**\n- **BSS** (Basic Service Set) — базовая ячейка сети: одна **точка доступа** (AP, Access Point) и подключённые к ней станции. Это инфраструктурный режим\n- Несколько BSS объединяются через **систему распределения** (DS, Distribution System — обычно проводной Ethernet) в **ESS** (Extended Service Set). Это позволяет станциям перемещаться между точками доступа без потери соединения (**роуминг**)\n- В режиме **ad hoc** (IBSS, Independent BSS) станции общаются напрямую друг с другом без точки доступа","**2. Физический уровень:**\n- Оригинальный 802.11 (1997) работал на частоте 2,4 ГГц с технологиями **FHSS** (скачкообразная перестройка частоты) и **DSSS** (расширение спектра прямой последовательностью) на скорости до 2 Мбит/с\n- **802.11b** — 2,4 ГГц, улучшенный DSSS, до **11 Мбит/с**\n- **802.11a** — 5 ГГц, **OFDM** (ортогональное частотное мультиплексирование), до **54 Мбит/с**\n- **802.11g** — 2,4 ГГц, OFDM, до **54 Мбит/с**, совместим с 802.11b\n- **802.11n** (Wi-Fi 4) — 2,4 и 5 ГГц, **MIMO** (несколько антенн) + OFDM, до **600 Мбит/с**\n- **802.11ac** (Wi-Fi 5) — 5 ГГц, **MU-MIMO** (Multi-User MIMO — одновременная передача нескольким устройствам), до **6,9 Гбит/с**\n- **802.11ax** (Wi-Fi 6/6E) — 2,4, 5 и **6 ГГц**, **OFDMA** (Orthogonal Frequency Division Multiple Access — распределение поднесущих между пользователями) + MU-MIMO, до **9,6 Гбит/с**","**3. Подуровень MAC** (управление доступом к среде):\n- Основной метод — **DCF** (Distributed Coordination Function), основанный на **CSMA/CA** (предотвращение коллизий). В беспроводных сетях невозможно обнаружить коллизию во время передачи, поэтому коллизии предотвращаются заранее\n- Порядок работы: станция слушает канал → если свободен в течение **DIFS** (DCF Inter-Frame Spacing — межкадровый интервал для обычных данных) → выполняет случайный откат (backoff) → передаёт кадр → получатель ждёт **SIFS** (Short Inter-Frame Spacing — короткий интервал для ACK) и отправляет **ACK** (подтверждение приёма). Если ACK не получен — коллизия, окно ожидания удваивается\n- **NAV** (Network Allocation Vector) — виртуальное прослушивание канала: станции узнают из заголовков, сколько времени канал будет занят, и не пытаются передавать\n- **RTS/CTS** — опциональный механизм борьбы со **скрытым узлом** (hidden terminal). По умолчанию не используется\n- **PCF** (Point Coordination Function) — опциональный бесконкурентный режим: точка доступа поочерёдно опрашивает станции","**4. Структура кадра:**\n- Три типа кадров: **управляющие** (beacon — маяк, периодически объявляет сеть; association — подключение; authentication — проверка подлинности), **контрольные** (RTS, CTS, ACK) и **кадры данных** (несут полезную нагрузку)\n- Формат кадра данных: Frame Control (управление кадром, 2 Б) → Duration/ID (длительность, 2 Б) → **4 MAC-адреса** (по 6 Б) → Sequence Control (номер последовательности, 2 Б) → данные (до 2304 Б) → FCS (Frame Check Sequence — контрольная сумма CRC-32, 4 Б)\n- **Почему 4 адреса?** В проводной сети кадр идёт напрямую от источника к назначению. В Wi-Fi кадр проходит через точку доступа, поэтому нужны адреса: отправитель, получатель, передатчик (AP) и конечный пункт. Все 4 адреса используются при передаче между двумя точками доступа в режиме **WDS** (Wireless Distribution System — беспроводной мост между AP)","**5. Сервисы:**\n- **Ассоциация** (association) — станция подключается к точке доступа и регистрируется в сети\n- **Реассоциация** (reassociation) — станция переходит к другой точке доступа при роуминге\n- **Диссоциация** (disassociation) — разрыв связи между станцией и AP\n- **Аутентификация** (authentication) — проверка подлинности станции. Эволюция безопасности: **WEP** (Wired Equivalent Privacy — устаревший, легко взламывается) → **WPA** (Wi-Fi Protected Access, использует TKIP — Temporal Key Integrity Protocol) → **WPA2** (использует шифрование **AES-CCMP** — текущий стандарт) → **WPA3** (использует **SAE** — Simultaneous Authentication of Equals, защита от офлайн-атак по словарю)\n- **Распределение** (distribution) — маршрутизация кадров внутри DS к нужной точке доступа\n- **Интеграция** (integration) — связь Wi-Fi сети с проводной сетью (Ethernet)"],"terms":[{"ru":"BSS","en":"Basic Service Set","df":"базовая ячейка Wi-Fi: точка доступа + станции"},{"ru":"ESS","en":"Extended Service Set","df":"несколько BSS, объединённых через DS"},{"ru":"AP","en":"Access Point","df":"точка доступа"},{"ru":"CSMA/CA","en":"Collision Avoidance","df":"множественный доступ с предотвращением коллизий"},{"ru":"DCF","en":"Distributed Coordination Function","df":"распределённая координация доступа на основе CSMA/CA"},{"ru":"NAV","en":"Network Allocation Vector","df":"виртуальный счётчик занятости канала"},{"ru":"OFDM","en":"Orthogonal Frequency Division Multiplexing","df":"ортогональное частотное мультиплексирование"},{"ru":"OFDMA","en":"OFDM Multiple Access","df":"распределение поднесущих OFDM между несколькими пользователями"},{"ru":"MIMO","en":"Multiple Input Multiple Output","df":"передача через несколько антенн одновременно"},{"ru":"MU-MIMO","en":"Multi-User MIMO","df":"одновременная передача нескольким устройствам"},{"ru":"FHSS","en":"Frequency Hopping Spread Spectrum","df":"скачкообразная перестройка частоты"},{"ru":"DSSS","en":"Direct Sequence Spread Spectrum","df":"расширение спектра прямой последовательностью"},{"ru":"PCF","en":"Point Coordination Function","df":"централизованный опрос станций точкой доступа"},{"ru":"WEP","en":"Wired Equivalent Privacy","df":"первый протокол безопасности Wi-Fi (устаревший, взломан)"},{"ru":"WPA2","en":"Wi-Fi Protected Access 2","df":"текущий стандарт безопасности, шифрование AES-CCMP"},{"ru":"WDS","en":"Wireless Distribution System","df":"беспроводной мост между точками доступа"},{"ru":"FCS","en":"Frame Check Sequence","df":"контрольная сумма CRC-32 в конце кадра"}],"summary":["","**Суть:** 802.11 — стандарт беспроводных локальных сетей (Wi-Fi).","","**Архитектура:**","- **BSS (Basic Service Set)** — базовая ячейка.","- **Infrastructure mode:** клиенты + **точка доступа (AP)**.","- **Ad-hoc mode:** клиенты соединяются напрямую.","- **ESS** — несколько BSS, объединённых через distribution system (обычно Ethernet).","","**Физический уровень (эволюция):**","- **802.11a:** 5 ГГц, OFDM, 54 Мбит/с.","- **802.11b:** 2.4 ГГц, DSSS, 11 Мбит/с.","- **802.11g:** 2.4 ГГц, OFDM, 54 Мбит/с.","- **802.11n (Wi-Fi 4):** MIMO, 600 Мбит/с.","- **802.11ac (Wi-Fi 5):** 5 ГГц, ~ 6.9 Гбит/с.","- **802.11ax (Wi-Fi 6/6E):** OFDMA.","- **802.11be (Wi-Fi 7):** до ~40 Гбит/с.","","**MAC-подуровень:**","- **CSMA/CA** + случайный backoff.","- Опциональные **RTS/CTS** против скрытого узла.","- **DCF** (Distributed Coordination) и **PCF** (Point Coordination).","- Подтверждения каждого кадра.","","**Формат кадра:** Frame Control + Duration + 4 адреса + SeqCtrl + Data + FCS.","","**Службы:** ассоциация, аутентификация, шифрование (WPA2/WPA3), роуминг, доставка данных.","","**Для устного:** WPA2 = AES, WPA3 — новейший с защитой от брута."]},{"n":26,"title":"Широкополосные беспроводные сети. Сравнение стандарта 802.16 с 802.11 и 3G. Стандарт 802.16: архитектура и стек протоколов, физический уровень, протокол подуровня MAC, структура кадра.","paragraphs":["**IEEE 802.16**, известный под коммерческим названием **WiMAX** (Worldwide Interoperability for Microwave Access), — это стандарт широкополосного беспроводного доступа. В отличие от Wi-Fi (802.11), он рассчитан на большие расстояния (до 50 км) и скорости до 70 Мбит/с.","**Сравнение с 802.11 и 3G:**\n- По сравнению с **802.11 (Wi-Fi)**: значительно больший радиус действия, встроенная поддержка **QoS** (Quality of Service — гарантии качества для голоса и видео), централизованное управление доступом от базовой станции\n- По сравнению с **3G**: более высокая пропускная способность и **пакетная архитектура** (данные передаются пакетами, как в Интернете), в отличие от канальной архитектуры 3G (выделенный канал на каждый звонок)","**1. Архитектура:**\n- Сеть строится вокруг **BS** (Base Station — базовая станция), которая управляет всеми абонентскими станциями (SS — Subscriber Station) в своей зоне\n- Топология: **точка-многоточка** (одна BS обслуживает множество SS) или **ячеистая** (mesh — станции могут передавать данные друг через друга)\n- Дуплексирование: **TDD** (Time Division Duplex — передача и приём по очереди во времени) или **FDD** (Frequency Division Duplex — передача и приём на разных частотах)","**2. Физический уровень:**\n- Два диапазона частот: **10–66 ГГц** при прямой видимости (**LOS** — Line of Sight) и **2–11 ГГц** без прямой видимости (**NLOS** — Non-Line of Sight)\n- Используется **OFDM/OFDMA** (распределение поднесущих между пользователями) с **адаптивной модуляцией**: станция автоматически выбирает модуляцию в зависимости от качества сигнала — от **BPSK** (самая надёжная, низкая скорость) до **64-QAM** (самая быстрая, но требует хороший сигнал)","**3. Протокол MAC:**\n- MAC в 802.16 **централизованный** — базовая станция полностью контролирует, когда и сколько каждая станция может передавать. Это отличается от Wi-Fi, где станции конкурируют самостоятельно\n- MAC **ориентирован на соединение**: перед передачей данных создаётся виртуальное соединение с идентификатором **CID** (Connection ID)\n- Четыре класса **QoS**: **UGS** (постоянный поток, например VoIP), **rtPS** (потоковое видео в реальном времени), **nrtPS** (передача файлов, допускает задержки), **BE** (Best Effort — обычные данные без гарантий)","**4. Структура кадра:**\n- Кадр делится на две части: **DL** (Downlink — от BS к абонентам) и **UL** (Uplink — от абонентов к BS)\n- В начале кадра — **преамбула** для синхронизации, затем **DL-MAP** и **UL-MAP** — карты, которые сообщают каждой станции, в какой момент времени и на каких частотах ей можно передавать\n- Заголовок MAC содержит: **CID** (идентификатор соединения), **LEN** (длина данных), **CI** (индикатор CRC), **EC** (индикатор шифрования) и тип заголовка"],"terms":[{"ru":"WiMAX","en":"Worldwide Interoperability for Microwave Access","df":"коммерческое название 802.16"},{"ru":"BS","en":"Base Station","df":"базовая станция, управляет сетью"},{"ru":"SS","en":"Subscriber Station","df":"абонентская станция"},{"ru":"QoS","en":"Quality of Service","df":"гарантии качества обслуживания (приоритеты для голоса, видео и т.д.)"},{"ru":"OFDMA","en":"OFDM Multiple Access","df":"множественный доступ с распределением поднесущих"},{"ru":"LOS / NLOS","en":"Line of Sight / Non-Line of Sight","df":"прямая / непрямая видимость"},{"ru":"CID","en":"Connection ID","df":"идентификатор соединения в 802.16"}],"summary":["","**Суть:** 802.16 (WiMAX) — стандарт широкополосного беспроводного доступа для MAN.","","**802.16 (WiMAX):**","- Архитектура: базовая станция + абонентские терминалы.","- Физ. уровень: OFDM/OFDMA, адаптивная модуляция.","- **MAC с планированием** (не CSMA) — централизованное распределение ресурсов.","- **QoS** по классам трафика.","- Поддержка мобильности (802.16e).","","**Сравнение:**","","| Критерий | 802.11 (Wi-Fi) | 802.16 (WiMAX) | 3G |","|---|---|---|---|","| Масштаб | LAN, до ~100 м | MAN, до ~50 км | WAN |","| MAC | CSMA/CA | Планирование | Планирование |","| Мобильность | Ограничена | Поддерживается | Полная |","| Применение | Офис, дом | Беспроводной ШПД | Моб. Интернет + голос |","","**На практике:** WiMAX проиграл LTE (4G), который теперь доминирует.","","**Для устного:** 802.16 — пример «того, что не взлетело»; идеи перешли в LTE."]},{"n":27,"title":"Архитектура Bluetooth: набор протоколов, уровень радиосвязи, уровень немодулированной передачи, структура кадра.","paragraphs":["**Bluetooth** (IEEE 802.15.1) — это стандарт беспроводной персональной сети (**WPAN** — Wireless Personal Area Network) для связи устройств на коротких расстояниях (от 1 до 100 м). Работает на частоте **2,4 ГГц** в нелицензируемом диапазоне **ISM** (Industrial, Scientific, Medical).","**1. Архитектура и топология:**\n- Базовая единица сети — **пикосеть** (piconet): одно ведущее устройство (**master**) и до 7 ведомых (**slave**). Master управляет всей коммуникацией и задаёт расписание передачи\n- Несколько пикосетей могут пересекаться, образуя **рассеянную сеть** (scatternet). Одно устройство может быть slave в одной пикосети и master в другой","**2. Стек протоколов:**\n- **Радиоуровень** (Radio) — отвечает за передачу и приём радиосигнала\n- **Baseband** (уровень немодулированной передачи) — управляет синхронизацией, скачками частоты и формированием кадров\n- **LMP** (Link Manager Protocol) — устанавливает и настраивает соединения между устройствами (аутентификация, шифрование, управление мощностью)\n- **L2CAP** (Logical Link Control and Adaptation Protocol) — мультиплексирует данные от верхних уровней и адаптирует размер пакетов\n- Выше располагаются **профили** — стандартные сценарии использования: **RFCOMM** (эмуляция последовательного порта), **SDP** (Service Discovery Protocol — обнаружение доступных сервисов), **OBEX** (обмен файлами)","**3. Уровень радиосвязи** (Radio Layer):\n- Bluetooth использует **FHSS** (Frequency Hopping Spread Spectrum) — частота меняется 1600 раз в секунду по 79 каналам шириной 1 МГц. Это снижает помехи от других устройств в том же диапазоне\n- Три класса мощности: **Класс 1** (100 мВт, до 100 м), **Класс 2** (2,5 мВт, до 10 м — самый распространённый), **Класс 3** (1 мВт, до 1 м)\n- Модуляция — **GFSK** (Gaussian Frequency Shift Keying — частотная манипуляция с гауссовым фильтром)","**4. Уровень немодулированной передачи** (Baseband):\n- Время делится на слоты по **625 мкс**. Master и slave передают в чередующихся слотах (master — в чётных, slave — в нечётных)\n- Два типа соединений: **SCO** (Synchronous Connection-Oriented) — синхронное соединение с фиксированной полосой для голоса (64 кбит/с), и **ACL** (Asynchronous Connectionless) — асинхронное соединение для передачи данных с подтверждением и повтором при ошибках","**5. Структура кадра:**\n- **Код доступа** (72 бита) — идентифицирует пикосеть (каждая пикосеть имеет уникальный код, формируемый из адреса master)\n- **Заголовок** (54 бита) содержит: **AM_ADDR** (3 бита — адрес slave в пикосети, от 1 до 7), **тип** пакета (4 бита), **SEQN** (1 бит — номер последовательности), **ARQN** (1 бит — подтверждение приёма предыдущего пакета), **HEC** (Header Error Check — 8-битная контрольная сумма заголовка)\n- **Полезная нагрузка** (payload) — от 0 до 2745 бит в зависимости от типа пакета (пакет может занимать 1, 3 или 5 слотов)"],"terms":[{"ru":"WPAN","en":"Wireless Personal Area Network","df":"беспроводная персональная сеть"},{"ru":"ISM","en":"Industrial, Scientific, Medical","df":"нелицензируемый частотный диапазон"},{"ru":"Пикосеть","en":"piconet","df":"базовая топология Bluetooth: 1 master + до 7 slave"},{"ru":"Рассеянная сеть","en":"scatternet","df":"объединение нескольких пикосетей"},{"ru":"FHSS","en":"Frequency Hopping Spread Spectrum","df":"скачкообразная перестройка частоты"},{"ru":"GFSK","en":"Gaussian Frequency Shift Keying","df":"метод модуляции Bluetooth"},{"ru":"SCO","en":"Synchronous Connection-Oriented","df":"синхронное соединение для голоса"},{"ru":"ACL","en":"Asynchronous Connectionless","df":"асинхронное соединение для данных"},{"ru":"LMP","en":"Link Manager Protocol","df":"протокол управления соединениями"},{"ru":"L2CAP","en":"Logical Link Control and Adaptation Protocol","df":"адаптация данных верхних уровней"},{"ru":"HEC","en":"Header Error Check","df":"контрольная сумма заголовка кадра"},{"ru":"GFSK","en":"Gaussian Frequency Shift Keying","df":"частотная модуляция с гауссовой фильтрацией"}],"summary":["","**Суть:** Bluetooth — стандарт PAN для короткой радиосвязи между устройствами.","","**Архитектура:**","- **Piconet** — 1 **master** + до 7 **slave**.","- **Scatternet** — объединение нескольких piconet через общие узлы.","- Диапазон 2.4 ГГц (ISM).","- Дальность: класс 1 (~100 м), класс 2 (~10 м), класс 3 (~1 м).","","**Стек протоколов:**","1. **Радиоуровень** — модуляция (GFSK/DQPSK).","2. **Baseband** — слоты, frequency hopping (1600 переключений/сек).","3. **Link Manager** — соединения, аутентификация, шифрование.","4. **L2CAP** — мультиплексирование, сегментация.","5. **Профили:** A2DP (аудио), HID (мышь/клавиатура), HFP (гарнитура), OBEX (файлы).","","**Формат кадра:** Access Code + Header + Payload.","","**Версии:**","- **Classic** (до 3 Мбит/с) — для аудио и файлов.","- **BLE (Bluetooth Low Energy)** — с 4.0, для IoT, малое энергопотребление.","- **5.x** — выше скорость и дальность.","","**Для устного:** Bluetooth Classic — аудио; BLE — IoT и носимые устройства."]},{"n":28,"title":"RFID. Архитектура и физический уровень EPC Gen 2. Уровень идентификации метки EPC Gen 2. Форматы сообщения идентификации метки.","paragraphs":["**RFID** (Radio Frequency Identification — радиочастотная идентификация) — это технология, которая позволяет автоматически идентифицировать объекты с помощью радиосигналов. Система состоит из **считывателей** (readers) и **меток** (tags), прикреплённых к объектам.","**1. Типы меток:**\n- **Пассивные** — не имеют собственного питания, получают энергию от радиосигнала считывателя. Дальность до 5 м, дешёвые, используются массово (например, в магазинах)\n- **Полупассивные** (semi-passive) — имеют батарею для питания микросхемы, но для передачи данных используют энергию считывателя. Дальность больше, чем у пассивных\n- **Активные** — имеют собственный передатчик и батарею, дальность до 100 м. Дороже, применяются для отслеживания крупных объектов","**2. Физический уровень EPC Gen 2:**\n- **EPC Gen 2** (Electronic Product Code Generation 2, также ISO 18000-6C) — основной стандарт для пассивных **UHF** (Ultra High Frequency) RFID-меток, работающих в диапазоне **860–960 МГц**\n- Связь от считывателя к метке: модуляция **ASK** (Amplitude Shift Keying — амплитудная манипуляция) с кодированием **PIE** (Pulse Interval Encoding — кодирование интервалами между импульсами)\n- Связь от метки к считывателю: **обратная рассеянная модуляция** (backscatter) — метка не генерирует свой сигнал, а отражает сигнал считывателя, модулируя отражение. Кодирование — **FM0** (двухфазное) или **кодирование Миллера** (Miller encoding)","**3. Уровень идентификации (протокол Query/ACK):**\n- Считыватель использует протокол на основе **Slotted ALOHA** для опроса множества меток без коллизий\n- Процесс: считыватель отправляет команду **Query(Q)**, где Q задаёт количество слотов → метка выбирает случайный слот и отвечает числом **RN16** (случайное 16-битное число) → считыватель подтверждает получение командой **ACK(RN16)** → метка отправляет свой полный идентификатор: **EPC** (96 бит) + **PC** (Protocol Control — параметры протокола) + **CRC-16** (контрольная сумма)","**4. Форматы сообщения идентификации (форматы EPC):**\n- **SGTIN-96** (Serialized Global Trade Item Number) — для идентификации товаров (аналог штрих-кода, но с уникальным серийным номером каждой единицы)\n- **SSCC-96** (Serial Shipping Container Code) — для идентификации транспортных контейнеров и упаковок\n- **SGLN-96** (Serialized Global Location Number) — для идентификации мест (склад, полка, зона)\n- **GRAI-96** (Global Returnable Asset Identifier) — для идентификации многоразовых активов (поддоны, контейнеры)"],"terms":[{"ru":"RFID","en":"Radio Frequency Identification","df":"радиочастотная идентификация"},{"ru":"EPC","en":"Electronic Product Code","df":"электронный код продукта, уникальный 96-битный идентификатор"},{"ru":"UHF","en":"Ultra High Frequency","df":"ультравысокие частоты (860–960 МГц для RFID)"},{"ru":"ASK","en":"Amplitude Shift Keying","df":"амплитудная манипуляция"},{"ru":"PIE","en":"Pulse Interval Encoding","df":"кодирование интервалами импульсов"},{"ru":"SGTIN-96","en":"Serialized Global Trade Item Number","df":"формат EPC для торговых единиц"}],"summary":["","**Суть:** RFID — радиочастотная идентификация меток без контакта.","","**Архитектура:**","- **Метки (tags)** — хранят уникальный идентификатор.","- **Считыватели (readers)** — излучают радиосигнал и получают ответы меток.","- **Сервер** — обрабатывает данные.","","**Типы меток:**","- **Пассивные** — без батареи, питание от поля считывателя (короткая дистанция).","- **Полуактивные** — с батареей для чипа, но передача от поля.","- **Активные** — с собственным питанием, большая дальность.","","**EPC Gen 2 (ISO 18000-6C):**","- Стандарт UHF RFID (860–960 МГц).","- Пассивные метки, дальность до ~10 м.","- Применяется в розничной торговле, логистике.","","**Физический уровень EPC Gen 2:**","- Amplitude-Shift Keying (ASK).","- **Обратный рассеянный сигнал (backscatter)** — метка модулирует отражённый сигнал.","","**Уровень идентификации:**","- Считыватель шлёт запрос, несколько меток отвечают.","- **Анти-коллизия:** Q-алгоритм (аналог слотового ALOHA).","- Идентификация по EPC-коду (96 бит).","","**Применение:** инвентаризация, пропуска, логистика, NFC-платежи.","","**Для устного:** RFID — основа «интернета вещей» для физических объектов."]},{"n":29,"title":"Коммутация на канальном уровне. Применение мостов. Повторители, концентраторы, мосты, коммутаторы, маршрутизаторы, шлюзы и виртуальные локальные сети.","paragraphs":["**Коммутация** (switching) на канальном уровне — это процесс пересылки кадров внутри локальной сети на основе MAC-адресов. В отличие от маршрутизации (L3, по IP-адресам), коммутация работает на уровне L2 и не требует анализа сетевых адресов.","**1. Мосты и коммутация:**\n- **Мост** (bridge) — это устройство канального уровня (L2), которое соединяет два сегмента локальной сети. Мост принимает кадр, смотрит на MAC-адрес назначения и решает, нужно ли пересылать его в другой сегмент\n- Мост узнаёт расположение устройств через **обратное обучение** (backward learning): когда приходит кадр, мост запоминает, с какого порта пришёл MAC-адрес отправителя. Со временем строится таблица «MAC-адрес → порт»\n- Если в сети несколько мостов, могут возникнуть **петли** — кадры будут бесконечно циркулировать. Для предотвращения петель используется **STP** (Spanning Tree Protocol, IEEE 802.1D) — он отключает избыточные пути, оставляя только древовидную структуру","**2. Сетевые устройства по уровням OSI:**\n- **Повторитель** (repeater) — работает на уровне L1 (физический). Просто усиливает и регенерирует ослабленный сигнал, чтобы увеличить дальность передачи\n- **Концентратор** (hub) — тоже L1, по сути многопортовый повторитель. Принимает сигнал с одного порта и повторяет его на все остальные порты. Вся сеть — один домен коллизий\n- **Мост** (bridge) — L2 (канальный). Разделяет сеть на отдельные домены коллизий, пересылая кадры по MAC-адресам\n- **Коммутатор** (switch) — тоже L2, по сути многопортовый мост. Каждый порт — отдельный домен коллизий, что значительно повышает производительность\n- **Маршрутизатор** (router) — L3 (сетевой). Передаёт пакеты между разными сетями на основе IP-адресов. Разделяет широковещательные домены\n- **Шлюз** (gateway) — работает на уровнях L4–L7. Преобразует протоколы между несовместимыми сетями (например, между электронной почтой разных форматов)","**3. VLAN** (Virtual LAN, IEEE 802.1Q):\n- VLAN позволяет логически разделить один физический коммутатор на несколько изолированных сетей с отдельными **широковещательными доменами** (broadcast domains). Устройства в разных VLAN не видят широковещательный трафик друг друга\n- Для этого в кадр Ethernet вставляется **тег 802.1Q** (4 байта): **TPID** (Tag Protocol Identifier — идентификатор протокола, всегда 0x8100), **PCP** (Priority Code Point — приоритет, 3 бита), **DEI** (Drop Eligible Indicator — можно ли отбросить кадр, 1 бит), **VID** (VLAN ID — номер VLAN, 12 бит, до 4094 VLAN)\n- Трафик между VLAN не может передаваться напрямую — он должен проходить через **маршрутизатор** (L3). **Транковые порты** (trunk ports) передают кадры нескольких VLAN между коммутаторами, сохраняя теги 802.1Q"],"terms":[{"ru":"Мост","en":"bridge","df":"устройство L2, соединяющее сегменты ЛВС по MAC-адресам"},{"ru":"STP","en":"Spanning Tree Protocol, IEEE 802.1D","df":"протокол остовного дерева для предотвращения петель"},{"ru":"Повторитель","en":"repeater","df":"устройство L1 для регенерации сигнала"},{"ru":"Концентратор","en":"hub","df":"многопортовый повторитель (L1)"},{"ru":"Коммутатор","en":"switch","df":"многопортовый мост (L2)"},{"ru":"Маршрутизатор","en":"router","df":"устройство L3, передаёт пакеты по IP-адресам"},{"ru":"Шлюз","en":"gateway","df":"устройство L4–L7 для преобразования протоколов"},{"ru":"VLAN","en":"Virtual LAN","df":"виртуальная локальная сеть, логическое разделение на broadcast domains"},{"ru":"Транковый порт","en":"trunk port","df":"порт коммутатора, передающий кадры нескольких VLAN с тегами"},{"ru":"VLAN","en":"Virtual LAN","df":"виртуальная ЛВС"}],"summary":["","**Суть:** Сетевые устройства работают на разных уровнях OSI.","","**L1 (физический):**","- **Повторитель (repeater)** — усиливает сигнал.","- **Концентратор (hub)** — многопортовый повторитель, передаёт на все порты.","- Одна коллизионная и одна широковещательная область.","","**L2 (канальный):**","- **Мост (bridge)** — соединяет два сегмента, фильтрует по MAC.","- **Коммутатор (switch)** — многопортовый мост с аппаратной обработкой.","- Каждый порт — отдельная коллизионная область.","- Учат MAC-адреса в таблицу коммутации.","","**L3 (сетевой):**","- **Маршрутизатор (router)** — соединяет разные сети, маршрутизирует по IP.","- Каждый интерфейс — отдельная широковещательная область.","","**L4+ (прикладной):**","- **Шлюз (gateway)** — преобразует данные между протоколами (VoIP-шлюз, почтовый шлюз).","","**Применение мостов:**","- Разделение сегментов → меньше коллизий.","- Объединение сетей с разной физикой.","- Фильтрация трафика.","","**Для устного:** Hub → Switch → Router — иерархия по уровням."]}],"quizzes":[{"type":"mcq","topic":"Вопрос 21","q":"Каков главный недостаток статического распределения канала (FDM/TDM)?","opts":["Высокая вероятность коллизий","Сложность реализации","Если станция молчит, её ресурс простаивает","Низкая скорость переключения между каналами"],"ans":2,"expl":"Недостаток статического распределения: если станция молчит, её ресурс простаивает."},{"type":"tf","topic":"Вопрос 21","q":"Среди допущений динамического распределения каналов указана зависимость трафика между станциями.","ans":false,"expl":"Одно из допущений — независимый трафик: станции генерируют кадры независимо друг от друга."},{"type":"mcq","topic":"Вопрос 22","q":"Какова максимальная пропускная способность чистой ALOHA?","opts":["36,8%","50%","18,4%","25%"],"ans":2,"expl":"Максимальная пропускная способность чистой ALOHA — 18,4%."},{"type":"tf","topic":"Вопрос 22","q":"Максимальная пропускная способность слотированной ALOHA вдвое выше, чем чистой ALOHA, и составляет 36,8%.","ans":true,"expl":"Чистая ALOHA — 18,4%, слотированная ALOHA — 36,8%, что ровно вдвое больше."},{"type":"mcq","topic":"Вопрос 22","q":"Какой протокол решает проблему скрытого узла в беспроводных сетях?","opts":["CSMA/CD","Token Ring","MACA (с использованием RTS/CTS)","Побитовая карта"],"ans":2,"expl":"MACA решает проблему скрытого узла: отправитель посылает RTS, получатель отвечает CTS."},{"type":"mcq","topic":"Вопрос 23","q":"Каков минимальный размер кадра Ethernet?","opts":["32 байта","46 байт","64 байта","128 байт"],"ans":2,"expl":"Минимальный размер кадра Ethernet — 64 байта."},{"type":"tf","topic":"Вопрос 23","q":"Классический Ethernet использовал Манчестерское кодирование и работал на скорости 100 Мбит/с.","ans":false,"expl":"Классический Ethernet использовал Манчестерское кодирование, но работал на скорости 10 Мбит/с, а не 100."},{"type":"mcq","topic":"Вопрос 23","q":"Какой метод используют коммутаторы Ethernet для построения таблиц MAC-адресов?","opts":["Протокол STP","Самообучение (backward learning)","Ручная настройка администратором","Широковещательная рассылка ARP"],"ans":1,"expl":"Коммутаторы используют самообучение (backward learning) для построения таблиц MAC-адресов."},{"type":"mcq","topic":"Вопрос 24","q":"Какое кодирование используется в 10-гигабитном Ethernet?","opts":["Манчестерское кодирование","4B/5B + MLT-3","4D-PAM5","64B/66B"],"ans":3,"expl":"В 10-гигабитном Ethernet (10GbE) используется кодирование 64B/66B."},{"type":"tf","topic":"Вопрос 24","q":"В 10-гигабитном Ethernet используется полудуплексный режим с CSMA/CD.","ans":false,"expl":"10GbE работает только в полнодуплексном режиме, CSMA/CD не используется."},{"type":"mcq","topic":"Вопрос 24","q":"Какой механизм применяется в полудуплексном Gigabit Ethernet для коротких кадров?","opts":["Байт-стаффинг","Бит-стаффинг","Расширение несущей (carrier extension до 512 байт)","CRC-32 с удвоением"],"ans":2,"expl":"В полудуплексном Gigabit Ethernet применяется расширение несущей (carrier extension до 512 байт)."},{"type":"mcq","topic":"Вопрос 25","q":"Какой стандарт 802.11 поддерживает MIMO и
