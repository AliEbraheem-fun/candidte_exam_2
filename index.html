 постоянного тока. По этой же линии работают xDSL.\n- **Местная АТС** (CO, Central Office; русск. **АТС**, автоматическая телефонная станция) — оконечный узел, к которому подключены тысячи абонентов района. Здесь происходит оцифровка голоса и первичная коммутация.\n- **Узловые / транзитные АТС** (toll office, tandem office) — соединяют группы местных АТС в пределах региона.\n- **Междугородные центры коммутации** (primary, sectional, regional centers) — иерархические уровни для дальней связи.\n- **Международные шлюзы** (international gateway exchange) — связь с PSTN других стран по подводным кабелям и через спутники.", "Между АТС каналы объединяются в **транковые линии**: исторически медь, сегодня преимущественно оптика, поверх которой передаётся TDM-иерархия (PDH/SDH).", "<h3>Оцифровка голоса: PCM</h3>", "**PCM** (Pulse Code Modulation, импульсно-кодовая модуляция, стандарт **ITU-T G.711**):\n- Полоса голоса 300–3400 Гц.\n- Частота дискретизации **8 000 Гц** (по теореме Котельникова/Найквиста — вдвое выше максимальной частоты сигнала).\n- Каждый отсчёт квантуется в **8 бит** по нелинейной шкале (μ-закон в Северной Америке/Японии, A-закон в Европе/России) — нелинейность улучшает SNR при малых амплитудах.\n- Скорость: 8 000 × 8 = **64 кбит/с** на голосовой канал — это базовый «канал DS-0».", "Современные кодеки голоса (G.729 — 8 кбит/с, AMR-WB, Opus) сжимают речь без потери качества в 4–8 раз и применяются в VoIP.", "<h3>Транковая иерархия</h3>", "Каналы 64 кбит/с агрегируются мультиплексированием с разделением времени:", "- **E1** (Европа, ITU-T G.703): 32 слота × 64 кбит/с = **2,048 Мбит/с**. Слоты 0 и 16 — служебные (синхронизация и сигнализация), 30 — голосовые.\n- **T1** (США, Япония): 24 слота × 64 кбит/с + биты синхронизации = **1,544 Мбит/с**.\n- Дальше — PDH (E2=8 Мбит/с, E3=34, E4=140) и SDH (STM-1=155 Мбит/с, STM-16=2,5 Гбит/с, STM-64=10 Гбит/с) поверх оптики.", "<h3>Сигнализация</h3>", "Управление вызовами — установление, разрыв, набор номера, тарификация — выделено в **отдельную сеть сигнализации**:\n- Исторически **CAS** (Channel Associated Signaling) — сигналы в служебных битах самого канала (R1/R2).\n- Современный стандарт — **SS7** (Signaling System 7, в России **ОКС-7**, ITU-T Q.700) — пакетная сеть, независимая от каналов разговора. Уровни: MTP1–3, SCCP, TCAP, ISUP (для управления вызовами), MAP (для роуминга в GSM).\n- SS7 также обеспечивает услуги интеллектуальной сети (IN): переадресация, freephone (800-номера), CallerID, портация номера (MNP).", "<h3>Современное состояние и переход на IP</h3>", "PSTN постепенно замещается:\n- **VoIP** (Voice over IP) — пакетная передача голоса по IP с кодеками G.711/G.729/Opus, протоколами **SIP** (Session Initiation Protocol, RFC 3261) и **RTP** (Real-time Transport Protocol).\n- **IMS** (IP Multimedia Subsystem) — стандартизованная 3GPP архитектура мультимедиа-сервисов поверх IP для сотовых операторов; основа VoLTE и VoNR.\n- Многие национальные операторы (BT, Telekom, Ростелеком) объявили **All-IP transition** — отключение TDM-инфраструктуры в 2025–2030 гг."], "terms": [{"ru": "PSTN / ТФОП", "en": "Public Switched Telephone Network", "df": "коммутируемая телефонная сеть общего пользования"}, {"ru": "Коммутация каналов", "en": "circuit switching", "df": "метод, при котором перед передачей данных резервируется выделенный канал"}, {"ru": "АТС / CO", "en": "Central Office", "df": "узел коммутации, обслуживающий группу абонентов"}, {"ru": "Транзитная / междугородная АТС", "en": "toll exchange", "df": "узел коммутации более высокого уровня иерархии"}, {"ru": "PCM", "en": "Pulse Code Modulation", "df": "импульсно-кодовая модуляция; метод оцифровки аналогового голоса"}, {"ru": "SS7 / ОКС-7", "en": "Signaling System 7", "df": "протокол сигнализации для управления телефонными вызовами в PSTN"}, {"ru": "VoIP", "en": "Voice over IP", "df": "технология передачи голоса по IP-сетям"}, {"ru": "IMS", "en": "IP Multimedia Subsystem", "df": "архитектура мультимедиа-услуг поверх IP, основа VoLTE"}, {"ru": "SIP", "en": "Session Initiation Protocol", "df": "протокол сигнализации VoIP"}, {"ru": "POTS", "en": "Plain Old Telephone Service", "df": "традиционная аналоговая телефонная служба"}], "summary": ["**PSTN/ТФОП** — глобальная сеть с **коммутацией каналов**: на время разговора резервируется путь 64 кбит/с", "Архитектурно — антипод пакетного Интернета; стандартизация — **ITU-T**", "Иерархия: **абонентский шлейф** (local loop, медь 5–7 км, аналог 300–3400 Гц, питание −48 В) → **местная АТС** (CO) → транзитная → междугородная → международный шлюз", "По абонентскому шлейфу также работают **xDSL** (ADSL/VDSL)", "Транки между АТС: исторически медь, ныне оптика с PDH/SDH", "**PCM** (G.711): полоса 300–3400 Гц, дискретизация **8000 Гц** (Котельников), 8 бит/отсчёт = **64 кбит/с** (канал **DS-0**)", "Нелинейное квантование: **μ-закон** (США/Япония), **A-закон** (Европа/Россия) — улучшает SNR при малых амплитудах", "Современные кодеки: G.729 (8 кбит/с), AMR-WB, Opus — сжатие в 4–8 раз", "**E1** = 32×64 кбит/с = **2,048 Мбит/с** (слоты 0/16 служебные, 30 голосовых); **T1** = 1,544 Мбит/с", "Дальше PDH (E2/E3/E4) и SDH: STM-1 = 155 Мбит/с, STM-16 = 2,5 Гбит/с, STM-64 = 10 Гбит/с", "**Сигнализация — отдельная сеть**: исторически **CAS** (в служебных битах); современный — **SS7/ОКС-7** (ITU-T Q.700)", "Уровни SS7: MTP1-3, SCCP, **TCAP**, **ISUP** (вызовы), **MAP** (роуминг GSM)", "SS7 даёт IN-услуги: переадресация, freephone 800, CallerID, MNP (портация)", "Миграция: **VoIP** (SIP RFC 3261, RTP, кодеки G.711/729/Opus)", "**IMS** (IP Multimedia Subsystem) — архитектура 3GPP для VoLTE/VoNR", "All-IP transition: BT, Telekom, Ростелеком отключают TDM в 2025–2030 гг."]}, {"n": 13, "title": "Мобильная телефонная система. Поколения мобильных телефонов: аналоговая и цифровая передача информации.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Мобильная (сотовая) телефонная система** (cellular telephone system) — радиосеть, обеспечивающая голосовую связь и передачу данных абонентам, свободно перемещающимся в зоне обслуживания. Архитектурная основа — **сотовый принцип**: территория разбивается на относительно небольшие зоны-**соты** (cells), каждую из которых обслуживает своя стационарная **базовая станция**. Соседние соты используют разные частоты, удалённые могут переиспользовать одну и ту же — отсюда возможность обслуживать миллионы абонентов в ограниченном спектре.", "<h3>Принцип сотовой структуры</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/e/ee/Frequency_reuse.svg\" alt=\"Гексагональная структура сот и принцип повторного использования частот\" loading=\"lazy\"><figcaption>Принцип частотного переиспользования в сотовой сети: гексагональные соты сгруппированы в кластеры (здесь N=7); цвет показывает группу частот. Кластер периодически повторяется по сетке. <em>Источник: Wikimedia Commons, CC BY-SA 2.5.</em></figcaption></figure>", "- **Соты** идеализируются гексагонами (на практике форма зависит от рельефа и помех). Радиус — от 50 м (фемто-соты в офисах) до 30 км (макро-соты в сельской местности).\n- **Кластер** (cluster) — группа соседних сот, между которыми распределён весь набор частот; обычно N = 3, 7 или 12 (выводится из формулы N = i² + ij + j²).\n- **Коэффициент переиспользования** 1/N — доля общего спектра, доступная в одной соте; меньший N даёт больше частот на соту, но усиливает помехи от ко-канальных сот.\n- **Секторизация** — антенны с лучом 120° или 60° делят соту на сектора, утраивая число каналов.\n- **Иерархия сот** — макро/микро/пико/фемто-соты накладываются для управления плотностью трафика (HetNet).", "<h3>Архитектура сети</h3>", "- **RAN** (Radio Access Network) — радиоподсистема: базовые станции (BTS в GSM, NodeB в 3G, eNodeB в LTE, gNodeB в 5G) и их контроллеры (BSC, RNC).\n- **Опорная сеть** (Core Network) — коммутация, маршрутизация, аутентификация, биллинг. В 2G — **MSC** (Mobile Switching Center), реестры **HLR** (Home Location Register) и **VLR** (Visitor Location Register). В LTE — **EPC** (Evolved Packet Core): MME, S-GW, P-GW, HSS. В 5G — сервис-ориентированная архитектура: AMF, SMF, UPF, AUSF, UDM.\n- **Аутентификация и идентификация** через **SIM/USIM/eSIM** карту, хранящую **IMSI** и ключ Ki.\n- **Шлюзы** к ТФОП (GMSC) и к интернету (P-GW/UPF).", "<h3>Ключевые механизмы</h3>", "- **Хэндовер** (handover/handoff) — переключение активного соединения от одной БС к другой при движении абонента или ухудшении сигнала. **Hard handover** (GSM) — «break-before-make»; **soft handover** (CDMA) — «make-before-break», одновременная связь с несколькими БС.\n- **Роуминг** (roaming) — обслуживание абонента в сети другого оператора по межоператорскому соглашению; в GSM координируется через MAP/SS7.\n- **Регистрация местоположения** (location update) — телефон уведомляет сеть при переходе в новую LA (Location Area).\n- **Пейджинг** — поиск телефона при входящем вызове во всех сотах LA.\n- **Управление мощностью** (power control) — минимизация излучаемой мощности абонентом и БС для уменьшения помех и экономии батареи.", "<h3>Поколения мобильной связи</h3>", "- **1G** (1980-е) — **аналоговый** голос с FM-модуляцией. Стандарты **AMPS** (США, 800 МГц), **NMT-450/900** (Скандинавия), TACS (UK). Только голос, легко прослушивается, низкая ёмкость сети.\n- **2G** (1991) — переход на **цифру**. Стандарт **GSM** (Global System for Mobile Communications, ETSI) использует TDMA по 8 слотов на несущей шириной 200 кГц + FDMA в диапазонах 900/1800 МГц; голос кодирует Full-Rate codec (13 кбит/с). Появились **SMS**, шифрование A5/1, аутентификация по SIM. Альтернатива: **IS-95 / cdmaOne** (CDMA). Эволюция данных: **GPRS** (2,5G, пакетный режим до 114 кбит/с), **EDGE** (2,75G, до 384 кбит/с).\n- **3G** (2001) — мобильный широкополосный интернет. **UMTS / WCDMA** (3GPP, 5 МГц несущая, CDMA), до 2 Мбит/с; **HSPA/HSPA+** — до 42 Мбит/с. В США распространение получил **CDMA2000 EV-DO**.\n- **4G LTE** (Long-Term Evolution, 2009) — полностью пакетная **IP-only** сеть. **OFDMA** на нисходящем, SC-FDMA на восходящем канале, **MIMO** до 4×4. Полосы 1,4–20 МГц, агрегация несущих в LTE-Advanced. Скорости 100 Мбит/с – 1 Гбит/с. Голос: **VoLTE** через IMS (SIP/RTP).\n- **5G NR** (New Radio, 2019, 3GPP Rel-15+) — две полосы: **FR1** до 7,125 ГГц и **FR2** (mmWave 24–52 ГГц). Технологии: **Massive MIMO** (256+ антенн), beamforming, гибкая нумерология OFDM (Δf 15/30/60/120 кГц), **network slicing** (виртуальные сети под задачи). Три сценария ITU-R IMT-2020:\n  - **eMBB** (enhanced Mobile Broadband) — пиковая скорость до 20 Гбит/с.\n  - **URLLC** (Ultra-Reliable Low-Latency Communication) — задержка <1 мс, надёжность 99,999%; для промышленной автоматизации, V2X.\n  - **mMTC** (massive Machine-Type Communications) — до 1 млн устройств/км² для IoT.\n- **6G** (исследования; ожидается ~2030): субтерагерц (100–300 ГГц), интегрированные сенсорика и связь (ISAC), AI-RAN."], "terms": [{"ru": "Сота", "en": "cell", "df": "географическая зона, обслуживаемая одной базовой станцией"}, {"ru": "Кластер", "en": "cluster", "df": "группа сот, в которой разнесён весь спектр; коэффициент переиспользования 1/N"}, {"ru": "Базовая станция", "en": "BTS/NodeB/eNodeB/gNodeB", "df": "стационарная радиостанция сотовой сети"}, {"ru": "Хэндовер", "en": "handover / handoff", "df": "переключение соединения между базовыми станциями при движении абонента"}, {"ru": "Роуминг", "en": "roaming", "df": "обслуживание абонента в сети другого оператора"}, {"ru": "EPC", "en": "Evolved Packet Core", "df": "ядро сети LTE (MME, S-GW, P-GW, HSS)"}, {"ru": "GSM", "en": "Global System for Mobile Communications", "df": "стандарт цифровой сотовой связи 2G"}, {"ru": "MIMO / Massive MIMO", "en": "Multiple Input Multiple Output", "df": "технология с несколькими передающими и принимающими антеннами"}], "summary": ["**Сотовая система** — радиосеть для мобильных абонентов; территория делится на **соты** с **БС**", "Соседние соты — разные частоты, удалённые переиспользуют → ёмкость на ограниченном спектре", "**Кластер** N сот = i²+ij+j² (типично 3/7/12); коэффициент переиспользования 1/N", "Радиус соты: 50 м (фемто-офис) до 30 км (макро-село); **секторизация** (120°/60° антенны)", "**HetNet**: макро/микро/пико/фемто наложены для управления плотностью трафика", "**RAN** = BS + контроллеры (BSC в GSM, RNC в 3G); **Core**: 2G — MSC/HLR/VLR; LTE — **EPC** (MME/S-GW/P-GW/HSS); 5G — AMF/SMF/UPF/AUSF/UDM (SBA)", "Аутентификация через **SIM/USIM/eSIM**: хранит **IMSI** и ключ Ki; шлюзы GMSC (→ТФОП), P-GW/UPF (→интернет)", "**Хэндовер**: hard (GSM/LTE, break-before-make), soft (CDMA, make-before-make, связь с несколькими БС)", "Роуминг (MAP/SS7), location update (LA), пейджинг, **power control**", "**1G** (1980-е): аналог FM, **AMPS** (США, 800 МГц), **NMT** 450/900, TACS; только голос, прослушивается", "**2G GSM** (1991, ETSI): цифра, **TDMA 8 слотов на 200 кГц** + FDMA 900/1800 МГц, Full-Rate 13 кбит/с, **SMS**, A5/1, SIM", "Альтернатива 2G — **IS-95/cdmaOne** (CDMA); данные: **GPRS** (2,5G, 114 кбит/с), **EDGE** (2,75G, 384 кбит/с)", "**3G UMTS/WCDMA** (3GPP, 2001, 5 МГц несущая): 2 Мбит/с; **HSPA+** до 42 Мбит/с; в США — CDMA2000 EV-DO", "**4G LTE** (2009): IP-only, **OFDMA** down + SC-FDMA up, **MIMO 4×4**, полосы 1,4–20 МГц + carrier aggregation; голос — **VoLTE** через IMS", "**5G NR** (Rel-15+, 2019): FR1 <7,125 ГГц + FR2 mmWave 24–52 ГГц; **Massive MIMO** 256+, beamforming, гибкая нумерология", "Сценарии IMT-2020: **eMBB** (до 20 Гбит/с), **URLLC** (<1 мс, 99,999%, V2X), **mMTC** (1 млн устр./км² IoT); **network slicing**", "**6G** (~2030): субтерагерц 100–300 ГГц, ISAC (сенсорика+связь), AI-RAN"]}, {"n": 14, "title": "Характеристики физических каналов связи. Типы каналов связи.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Физический канал связи** (physical communication channel) — материальная или нематериальная среда, по которой передаётся сигнал, переносящий информацию, и тракт оборудования (передатчик, среда, приёмник), вносящий в этот сигнал собственные искажения. Канал характеризуется набором количественных параметров, определяющих его **информационную ёмкость**, надёжность и применимость для тех или иных задач, а также классифицируется по среде, направлению передачи, типу сигнала и способу мультиплексирования.", "<h3>Ключевые количественные характеристики</h3>", "- **Полоса пропускания** (bandwidth, B, в Гц) — диапазон частот, в котором канал имеет приемлемое затухание (обычно по уровню −3 дБ). Это «сырая» физическая ширина полосы; именно она входит в формулы Найквиста и Шеннона. В сетевом жаргоне «bandwidth» иногда употребляется и как синоним пропускной способности (в бит/с) — это путаница, которой следует избегать.\n- **Пропускная способность** (channel capacity, C, бит/с) — максимальная достижимая скорость безошибочной передачи; теоретически ограничена C = B·log₂(1+SNR).\n- **Реальная пропускная способность / goodput** (throughput) — фактическая скорость доставки полезных данных приложению; всегда меньше C из-за заголовков, повторов, контроля перегрузки.\n- **Задержка / латентность** (latency / delay): складывается из четырёх компонент:\n  - задержка распространения (propagation delay) = длина / скорость распространения;\n  - задержка передачи (transmission delay) = размер пакета / скорость канала;\n  - задержка обработки в узлах;\n  - задержка ожидания в очередях.\n- **Джиттер** (jitter) — статистический разброс задержки во времени; критичен для VoIP и видео.\n- **Затухание** (attenuation) — уменьшение мощности сигнала; в дБ: 10·log₁₀(P_in/P_out). В кабелях измеряется в дБ/км, зависит от частоты.\n- **SNR** (Signal-to-Noise Ratio, отношение сигнал/шум) — определяет шенноновский потолок; в дБ.\n- **BER** (Bit Error Rate, коэффициент битовых ошибок) — доля ошибочно принятых битов; для оптики 10⁻¹² – 10⁻¹⁵, для радио 10⁻³ – 10⁻⁶ до коррекции FEC.\n- **Произведение полосы на задержку** (bandwidth-delay product, BDP) — объём данных «в полёте» в канале; определяет минимально необходимое окно для полной утилизации канала. BDP = C · RTT.\n- **Симметрия** — равны ли скорости в двух направлениях (симметричный/асимметричный канал, как ADSL).", "<h3>Классификация по режиму передачи</h3>", "- **Симплекс** (simplex) — передача только в одном направлении (радио- и телевещание).\n- **Полудуплекс** (half-duplex) — двусторонняя, но поочерёдная передача; пример — рация. Wi-Fi одного канала тоже работает полудуплексно.\n- **Дуплекс / полный дуплекс** (full-duplex) — одновременная передача в обе стороны: либо две физические линии, либо два разных диапазона (**FDD**, Frequency Division Duplex), либо разделение во времени с короткими интервалами (**TDD**, Time Division Duplex). Современный коммутируемый Ethernet и LTE/5G — дуплексные.", "<h3>Классификация по типу сигнала и среде</h3>", "- **Аналоговый канал** — переносит непрерывный сигнал (телефонная пара POTS, аналоговое ТВ).\n- **Цифровой канал** — переносит дискретные символы; внутри может быть аналоговая физика, но интерфейс цифровой.\n- **Проводные среды**: витая пара, коаксиал, оптоволокно, линии электропитания (PLC).\n- **Беспроводные среды**: радио, микроволны, ИК, видимый свет, лазер (FSO).\n- **Спутниковые** — отдельная категория с большими задержками распространения.", "<h3>Физические искажения и эффекты</h3>", "- **Замирание** (fading) — случайное изменение амплитуды сигнала в беспроводном канале. **Большое масштабное** (large-scale) — от тени и расстояния; **малое масштабное** (small-scale, Рэлеевское/Райсовское) — от многолучевости.\n- **Многолучевое распространение** (multipath propagation) — приход сигнала по нескольким путям с разными задержками; вызывает замирания и **межсимвольную интерференцию** (ISI). Решения: эквалайзер, OFDM, MIMO.\n- **Доплеровский сдвиг** — сдвиг частоты при движении приёмника/передатчика.\n- **Дисперсия** (dispersion) в оптоволокне — уширение светового импульса из-за разных скоростей мод (модовая дисперсия в MMF) или длин волн (хроматическая, поляризационная в SMF).\n- **Тепловой шум** (Johnson–Nyquist noise) — фундаментальный шум сопротивлений: P_N = kTB.\n- **Перекрёстные наводки** (crosstalk, NEXT/FEXT) в витой паре.\n- **Внешние помехи** (EMI) — наводки от соседних кабелей и устройств.", "<h3>Стандартные параметры типовых каналов</h3>", "| Канал | Полоса/скорость | Задержка | BER (типичный) |\n|---|---|---|---|\n| POTS (телефония) | 3 кГц / до 56 кбит/с | <10 мс | 10⁻⁵ |\n| ADSL2+ | 1 МГц / до 24 Мбит/с | 20–40 мс | 10⁻⁷ |\n| Cat6 Ethernet | до 250 МГц / 10 Гбит/с | <1 мс | 10⁻¹² |\n| SMF на 1550 нм | ТГц / 100+ Гбит/с | ~5 мс/1000 км | 10⁻¹⁵ |\n| LTE | 1,4–20 МГц / до 1 Гбит/с | 20–40 мс | 10⁻³ до FEC |\n| GEO-спутник | сотни МГц | 270 мс RTT | 10⁻⁶ |"], "terms": [{"ru": "Полоса пропускания", "en": "bandwidth", "df": "диапазон частот, в котором канал обеспечивает передачу (в Гц)"}, {"ru": "Пропускная способность", "en": "channel capacity", "df": "теоретический максимум скорости; для goodput используется **throughput**"}, {"ru": "Задержка / латентность", "en": "latency / delay", "df": "время от отправки до получения сигнала; состоит из propagation/transmission/processing/queueing"}, {"ru": "Джиттер", "en": "jitter", "df": "вариация задержки доставки пакетов во времени"}, {"ru": "Затухание", "en": "attenuation", "df": "уменьшение амплитуды/мощности сигнала при распространении по среде"}, {"ru": "SNR", "en": "Signal-to-Noise Ratio", "df": "отношение мощности сигнала к мощности шума, в дБ"}, {"ru": "BER", "en": "Bit Error Rate", "df": "коэффициент ошибок по битам; доля ошибочно принятых бит"}, {"ru": "BDP", "en": "Bandwidth-Delay Product", "df": "произведение полосы канала на RTT, объём «бит в полёте»"}, {"ru": "Симплекс", "en": "simplex", "df": "передача только в одном направлении"}, {"ru": "Полудуплекс", "en": "half-duplex", "df": "попеременная передача в двух направлениях"}, {"ru": "Дуплекс", "en": "full-duplex", "df": "одновременная двусторонняя передача"}, {"ru": "FDD / TDD", "en": "Frequency / Time Division Duplex", "df": "дуплекс через частотное / временное разделение"}, {"ru": "Замирание", "en": "fading", "df": "случайное изменение уровня сигнала в беспроводных каналах"}, {"ru": "Многолучевое распространение", "en": "multipath propagation", "df": "приход сигнала по нескольким путям с разными задержками; причина замираний и ISI"}, {"ru": "Доплеровский сдвиг", "en": "Doppler shift", "df": "изменение частоты при относительном движении"}, {"ru": "Дисперсия", "en": "dispersion", "df": "уширение светового импульса в оптоволокне из-за различных скоростей мод/длин волн"}, {"ru": "Тепловой шум", "en": "thermal noise, Johnson–Nyquist", "df": "шум сопротивлений; P = kTB"}], "summary": ["**Физический канал** — среда + тракт оборудования, вносящий искажения; характеристики определяют ёмкость и применимость", "**Полоса пропускания** (B, Гц) — по уровню −3 дБ; входит в Найквиста/Шеннона; ≠ пропускной способности в бит/с", "**Пропускная способность** C (бит/с) = B·log₂(1+SNR); реальный **throughput/goodput** меньше (заголовки, повторы, congestion)", "**Задержка** = распространение (длина/v) + передача (размер/скорость) + обработка + очереди", "**Джиттер** — статистический разброс задержки; критичен для VoIP/видео", "**Затухание** (attenuation) в дБ: 10·log₁₀(P_in/P_out); в кабеле дБ/км", "**SNR** в дБ — определяет шенноновский потолок; **BER** — доля ошибочных бит", "BER типично: 10⁻¹²÷10⁻¹⁵ оптика, 10⁻³÷10⁻⁶ радио до FEC", "**BDP** (Bandwidth-Delay Product) = C·RTT — объём «в полёте», минимальное окно для полной утилизации", "Симметрия канала: ADSL — асимметричный, Ethernet — симметричный", "**Режимы передачи**: симплекс (радио/ТВ-вещание), полудуплекс (рация, Wi-Fi одного канала), дуплекс", "Дуплекс: две линии, **FDD** (две частоты — LTE), **TDD** (временное разделение — TD-LTE, 5G TDD)", "По сигналу: аналоговые (POTS, аналог. ТВ) vs цифровые (внутри может быть аналог)", "По среде: проводные (витая пара, коаксиал, оптика, PLC) vs беспроводные (радио, ИК, видимый, FSO) vs спутниковые", "**Замирания** (fading): large-scale (тень/расстояние); small-scale (Рэлеевское/Райсовское из multipath)", "**Multipath** → замирания + ISI; борьба — эквалайзер, **OFDM**, **MIMO**", "**Доплер** при движении; **дисперсия** в волокне (модовая MMF, хроматическая/поляризационная SMF)", "**Тепловой шум** Джонсона-Найквиста: P_N = kTB; **crosstalk** (NEXT/FEXT) в UTP; EMI снаружи", "Типовые: POTS 3 кГц/56k/RTT<10мс; ADSL2+ 24 Мбит/20–40мс; Cat6 10 Гбит; SMF Тбит/5 мс на 1000 км; GEO 270 мс RTT"]}], "quizzes": [{"type": "mcq", "topic": "Вопрос 7", "q": "Какова формула теоремы Найквиста для максимальной скорости передачи данных по идеальному каналу без шума?", "opts": ["C = B log₂(1 + S/N)", "C = 2B log₂V", "C = B log₂V", "C = 2B log₂(1 + S/N)"], "ans": 1, "expl": "Теорема Найквиста: C = 2B log₂V, где B — полоса пропускания (Гц), V — число различимых уровней сигнала."}, {"type": "mcq", "topic": "Вопрос 7", "q": "Какова формула теоремы Шеннона для зашумлённого канала?", "opts": ["C = 2B log₂V", "C = B log₂(S/N)", "C = B log₂(1 + S/N)", "C = 2B log₂(1 + S/N)"], "ans": 2, "expl": "Теорема Шеннона: C = B log₂(1 + S/N), где S/N — отношение сигнал/шум."}, {"type": "mcq", "topic": "Вопрос 7", "q": "Сколько максимально отсчётов в секунду можно передать через канал с полосой B Гц (по Найквисту)?", "opts": ["B отсчётов", "2B отсчётов", "B² отсчётов", "4B отсчётов"], "ans": 1, "expl": "Если сигнал ограничить полосой B Гц, то через канал можно передать не более 2B отсчётов в секунду."}, {"type": "mcq", "topic": "Вопрос 7", "q": "Что означает аббревиатура SNR?", "opts": ["Signal Noise Resistance", "Signal-to-Noise Ratio", "System Network Rate", "Spectral Nyquist Resolution"], "ans": 1, "expl": "SNR — Signal-to-Noise Ratio — отношение мощности полезного сигнала к мощности шума."}, {"type": "mcq", "topic": "Вопрос 7", "q": "Что такое ISI (Inter-Symbol Interference)?", "opts": ["Отражение сигнала от ионосферы", "Искажение символов из-за наложения переходных процессов от соседних символов", "Помехи от соседних кабелей", "Шум квантования при оцифровке"], "ans": 1, "expl": "ISI — Inter-Symbol Interference — межсимвольная интерференция — искажение символов из-за наложения переходных процессов от соседних символов."}, {"type": "tf", "topic": "Вопрос 7", "q": "Ряд Фурье позволяет представить любой периодический сигнал как сумму синусоид различных частот.", "ans": true, "expl": "Любой периодический сигнал может быть представлен как сумма синусоид различных частот — разложение в ряд Фурье."}, {"type": "tf", "topic": "Вопрос 7", "q": "Фундаментальная частота сигнала с периодом T равна f = T/2.", "ans": false, "expl": "Фундаментальная частота равна f = 1/T, а не T/2."}, {"type": "tf", "topic": "Вопрос 7", "q": "На практике реальные системы работают значительно ниже предела Шеннона.", "ans": true, "expl": "Из текста: «На практике реальные системы работают значительно ниже предела Шеннона»."}, {"type": "tf", "topic": "Вопрос 7", "q": "Увеличение числа уровней сигнала V повышает скорость передачи, но снижает требования к помехозащищённости.", "ans": false, "expl": "Увеличение числа уровней повышает скорость, однако УСИЛИВАЕТ (а не снижает) требования к помехозащищённости."}, {"type": "match", "topic": "Вопрос 7", "q": "Сопоставьте термин с определением:", "pairs": [{"l": "Ряд Фурье (Fourier series)", "r": "Разложение периодического сигнала в сумму синусоид кратных частот"}, {"l": "Гармоника (harmonic)", "r": "Составляющая ряда Фурье с частотой, кратной фундаментальной"}, {"l": "Полоса пропускания (bandwidth)", "r": "Диапазон частот, передаваемых каналом с допустимым затуханием"}, {"l": "Пропускная способность (channel capacity)", "r": "Максимальная скорость безошибочной передачи данных по каналу"}], "expl": "Определения из раздела терминологии Вопроса 7."}, {"type": "mcq", "topic": "Вопрос 8", "q": "Какие категории витой пары упоминаются для Ethernet со скоростями до 10 Гбит/с?", "opts": ["Cat3, Cat4, Cat5, Cat6", "Cat5e, Cat6, Cat6a, Cat7", "Cat5, Cat6, Cat7, Cat8", "Cat4, Cat5e, Cat6a, Cat8"], "ans": 1, "expl": "UTP используется в Ethernet категорий Cat5e, Cat6, Cat6a, Cat7 со скоростями до 10 Гбит/с."}, {"type": "mcq", "topic": "Вопрос 8", "q": "Что означает аббревиатура UTP?", "opts": ["Universal Twisted Pair", "Unshielded Twisted Pair", "Unified Transmission Protocol", "Ultra-Thin Polymer"], "ans": 1, "expl": "UTP — Unshielded Twisted Pair — неэкранированная витая пара."}, {"type": "mcq", "topic": "Вопрос 8", "q": "Какой тип волокна используется для дальних расстояний (до сотен километров)?", "opts": ["Многомодовое волокно (MMF)", "Одномодовое волокно (SMF)", "Пластиковое волокно (POF)", "Градиентное волокно"], "ans": 1, "expl": "Одномодовое волокно (single-mode fiber, SMF) используется для дальних расстояний (до сотен километров)."}, {"type": "mcq", "topic": "Вопрос 8", "q": "Что означает аббревиатура DOCSIS?", "opts": ["Data Over Cable Service Interface Specification", "Digital Optical Cable Signal Interface Standard", "Data Oriented Communication System for Internet Services", "Distributed Optical Channel Switching Interface System"], "ans": 0, "expl": "DOCSIS — Data Over Cable Service Interface Specification — стандарт широкополосного Интернета по коаксиальному кабелю."}, {"type": "mcq", "topic": "Вопрос 8", "q": "Что означает аббревиатура PLC в контексте передачи данных?", "opts": ["Programmable Logic Controller", "Power Line Communication", "Parallel Link Connection", "Physical Layer Coding"], "ans": 1, "expl": "PLC — Power Line Communication — технология передачи данных по электрической сети."}, {"type": "tf", "topic": "Вопрос 8", "q": "Скручивание проводников в витой паре снижает электромагнитные помехи (EMI) и перекрёстные наводки (crosstalk).", "ans": true, "expl": "Скручивание двух проводников снижает EMI и crosstalk — прямая цитата из текста."}, {"type": "tf", "topic": "Вопрос 8", "q": "Коаксиальный кабель обеспечивает худшую защиту от помех, чем витая пара.", "ans": false, "expl": "Коаксиальный кабель обеспечивает ЛУЧШУЮ (не худш ью 8 бит (не 16)."}, {"type": "tf", "topic": "Вопрос 12", "q": "Скорость потока E1 составляет 2,048 Мбит/с.", "ans": true, "expl": "E1 (Европа): 2,048 Мбит/с."}, {"type": "match", "topic": "Вопрос 12", "q": "Сопоставьте аббревиатуру с расшифровкой:", "pairs": [{"l": "PSTN", "r": "Public Switched Telephone Network"}, {"l": "PCM", "r": "Pulse Code Modulation"}, {"l": "SS7 / ОКС-7", "r": "Signaling System 7"}, {"l": "POTS", "r": "Plain Old Telephone Service"}, {"l": "VoIP", "r": "Voice over IP"}], "expl": "Расшифровки аббревиатур из раздела терминологии Вопроса 12."}, {"type": "match", "topic": "Вопрос 12", "q": "Сопоставьте стандарт с его характеристиками:", "pairs": [{"l": "E1 (Европа)", "r": "2,048 Мбит/с, 30 голосовых каналов"}, {"l": "T1 (США)", "r": "1,544 Мбит/с, 24 канала"}, {"l": "G.711 (PCM)", "r": "8000 отсчётов/с, 8 бит, 64 кбит/с"}], "expl": "Параметры стандартов цифровой телефонии из Вопроса 12."}, {"type": "mcq", "topic": "Вопрос 13", "q": "Какой стандарт мобильной связи относится к поколению 2G?", "opts": ["AMPS", "GSM", "UMTS", "LTE"], "ans": 1, "expl": "2G (1991) — стандарт GSM (Global System for Mobile Communications)."}, {"type": "mcq", "topic": "Вопрос 13", "q": "Какая технология множественного доступа используется в 4G LTE?", "opts": ["TDMA", "CDMA", "OFDMA", "FDMA"], "ans": 2, "expl": "В 4G LTE применяется OFDMA (Orthogonal Frequency Division Multiple Access) и MIMO-антенны."}, {"type": "mcq", "topic": "Вопрос 13", "q": "Какова максимальная скорость GPRS (2,5G)?", "opts": ["56 кбит/с", "114 кбит/с", "384 кбит/с", "2 Мбит/с"], "ans": 1, "expl": "GPRS — 2,5G, до 114 кбит/с."}, {"type": "mcq", "topic": "Вопрос 13", "q": "Какова максимальная скорость HSPA+?", "opts": ["2 Мбит/с", "14 Мбит/с", "42 Мбит/с", "150 Мбит/с"], "ans": 2, "expl": "HSPA+ — до 42 Мбит/с."}, {"type": "mcq", "topic": "Вопрос 13", "q": "Какой сценарий 5G обеспечивает скорость до 20 Гбит/с?", "opts": ["URLLC", "mMTC", "eMBB", "Network slicing"], "ans": 2, "expl": "eMBB (enhanced Mobile Broadband) — до 20 Гбит/с."}, {"type": "mcq", "topic": "Вопрос 13", "q": "Какой год считается началом 4G LTE?", "opts": ["2001", "2005", "2009", "2012"], "ans": 2, "expl": "4G LTE — 2009 год."}, {"type": "mcq", "topic": "Вопрос 13", "q": "Что такое хэндовер (handover)?", "opts": ["Подключение устройства к сети впервые", "Переключение обслуживающей базовой станции при движении абонента", "Отключение устройства от сети", "Передача данных между двумя мобильными устройствами"], "ans": 1, "expl": "Хэндовер (handover) — переключение обслуживающей базовой станции без прерывания связи."}, {"type": "mcq", "topic": "Вопрос 13", "q": "Какой сценарий 5G предназначен для сверхнадёжной связи с задержкой менее 1 мс?", "opts": ["eMBB", "URLLC", "mMTC", "MIMO"], "ans": 1, "expl": "URLLC (Ultra-Reliable Low-Latency Communication) — сверхнадёжная связь с малой задержкой, <1 мс."}, {"type": "tf", "topic": "Вопрос 13", "q": "Первое поколение мобильной связи (1G) использовало цифровую передачу голоса.", "ans": false, "expl": "1G — аналоговые системы. Передача голоса осуществлялась в аналоговой форме."}, {"type": "tf", "topic": "Вопрос 13", "q": "GSM использует TDMA и FDMA.", "ans": true, "expl": "Стандарт GSM использует TDMA и FDMA."}, {"type": "tf", "topic": "Вопрос 13", "q": "4G LTE — это полностью пакетная IP-архитектура с отказом от коммутации каналов.", "ans": true, "expl": "4G LTE — полностью пакетная IP-архитектура, отказ от коммутации каналов."}, {"type": "tf", "topic": "Вопрос 13", "q": "EDGE (2,75G) обеспечивает скорость до 114 кбит/с.", "ans": false, "expl": "EDGE — до 384 кбит/с. 114 кбит/с — это скорость GPRS (2,5G)."}, {"type": "tf", "topic": "Вопрос 13", "q": "5G начало внедряться в 2019 году.", "ans": true, "expl": "Пятое поколение (5G, 2019)."}, {"type": "match", "topic": "Вопрос 13", "q": "Сопоставьте поколение мобильной связи с его годом и технологией:", "pairs": [{"l": "1G (1980-е)", "r": "Аналоговые системы: AMPS, NMT, TACS"}, {"l": "2G (1991)", "r": "Цифровая передача: GSM, TDMA/FDMA"}, {"l": "3G (2001)", "r": "UMTS (WCDMA), до 2 Мбит/с"}, {"l": "4G LTE (2009)", "r": "OFDMA, MIMO, до 150–1000 Мбит/с"}, {"l": "5G (2019)", "r": "eMBB до 20 Гбит/с, URLLC <1 мс, mMTC"}], "expl": "Хронология поколений мобильной связи из Вопроса 13."}, {"type": "match", "topic": "Вопрос 13", "q": "Сопоставьте сценарий 5G с его назначением:", "pairs": [{"l": "eMBB", "r": "Расширенный мобильный широкополосный доступ, до 20 Гбит/с"}, {"l": "URLLC", "r": "Сверхнадёжная связь с малой задержкой, <1 мс"}, {"l": "mMTC", "r": "Массовое подключение устройств IoT"}, {"l": "Network slicing", "r": "Виртуализация сети для создания изолированных логических сетей"}], "expl": "Сценарии и технологии 5G из Вопроса 13."}, {"type": "mcq", "topic": "Вопрос 14", "q": "Что означает аббревиатура BER?", "opts": ["Bandwidth Error Range", "Bit Error Rate", "Binary Encoding Ratio", "Broadband Efficiency Rating"], "ans": 1, "expl": "BER — Bit Error Rate — коэффициент ошибок по битам; доля ошибочно принятых бит."}, {"type": "mcq", "topic": "Вопрос 14", "q": "Какой режим передачи обеспечивает одновременную передачу в обоих направлениях?", "opts": ["Симплекс", "Полудуплекс", "Дуплекс (full-duplex)", "Мультиплекс"], "ans": 2, "expl": "Дуплекс (full-duplex) — одновременная передача в обоих направлениях."}, {"type": "mcq", "topic": "Вопрос 14", "q": "Что такое джиттер (jitter)?", "opts": ["Уменьшение мощности сигнала", "Изменение задержки во времени", "Уширение импульсов в оптоволокне", "Перенос сигнала между соседними проводниками"], "ans": 1, "expl": "Джиттер (jitter) — изменение задержки во времени, критичное для голоса и видео."}, {"type": "mcq", "topic": "Вопрос 14", "q": "Что такое дисперсия (dispersion) в контексте оптоволокна?", "opts": ["Рассеяние света в атмосфере", "Уширение импульсов в оптоволокне из-за различных скоростей мод", "Ослабление мощности сигнала", "Изменение частоты сигнала при передаче"], "ans": 1, "expl": "Дисперсия (dispersion) — уширение светового импульса в оптоволокне из-за различных скоростей мод/длин волн."}, {"type": "mcq", "topic": "Вопрос 14", "q": "Что является причиной замираний (fading) в беспроводных каналах?", "opts": ["Дисперсия в оптоволокне", "Многолучевое распространение (multipath propagation) и движение объектов", "Электромагнитные помехи от медных кабелей", "Квантование сигнала"], "ans": 1, "expl": "Уровень сигнала изменяется вследствие многолучевого распространения (multipath propagation) и движения объектов."}, {"type": "tf", "topic": "Вопрос 14", "q": "Симплексный канал поддерживает попеременную передачу в обоих направлениях.", "ans": false, "expl": "Симплекс — передача только в ОДНОМ направлении. Попеременная передача — это полудуплекс."}, {"type": "tf", "topic": "Вопрос 14", "q": "Каналы с замираниями (fading channels) характерны для беспроводных каналов.", "ans": true, "expl": "Каналы с замираниями — беспроводные каналы, в которых уровень сигнала изменяется."}, {"type": "tf", "topic": "Вопрос 14", "q": "EMI (электромагнитные помехи) характерны для оптоволоконных кабелей.", "ans": false, "expl": "EMI характерны для МЕДНЫХ кабелей, а не оптоволоконных."}, {"type": "tf", "topic": "Вопрос 14", "q": "Проводные каналы являются каналами с постоянными параметрами.", "ans": true, "expl": "Каналы с постоянными параметрами — проводные, каналы с замираниями — беспроводные."}, {"type": "match", "topic": "Вопрос 14", "q": "Сопоставьте режим передачи с описанием:", "pairs": [{"l": "Симплекс (simplex)", "r": "Передача только в одном направлении"}, {"l": "Полудуплекс (half-duplex)", "r": "Попеременная передача в обоих направлениях"}, {"l": "Дуплекс (full-duplex)", "r": "Одновременная двусторонняя передача"}], "expl": "Режимы передачи из Вопроса 14."}, {"type": "match", "topic": "Вопрос 14", "q": "Сопоставьте характеристику канала с её определением:", "pairs": [{"l": "Полоса пропускания (bandwidth)", "r": "Диапазон частот без значительного ослабления (Гц)"}, {"l": "Пропускная способность (throughput)", "r": "Реальная скорость передачи данных (бит/с)"}, {"l": "Задержка (latency)", "r": "Время прохождения сигнала по каналу"}, {"l": "Затухание (attenuation)", "r": "Ослабление мощности сигнала на единицу длины"}, {"l": "BER (Bit Error Rate)", "r": "Доля ошибочно принятых бит"}], "expl": "Основные характеристики физического канала связи из Вопроса 14."}, {"type": "match", "topic": "Вопрос 14", "q": "Сопоставьте дополнительную характеристику с описанием:", "pairs": [{"l": "Дисперсия (dispersion)", "r": "Уширение импульсов в оптоволокне"}, {"l": "Джиттер (jitter)", "r": "Вариация задержки доставки во времени"}, {"l": "Замирание (fading)", "r": "Случайное изменение уровня сигнала в беспроводных каналах"}, {"l": "Многолучевое распространение", "r": "Приход сигнала по нескольким путям с разными задержками"}], "expl": "Дополнительные характеристики из Вопроса 14."}]}, {"id": 3, "name": "Канальный уровень сетевого стека", "questions": [{"n": 15, "title": "Ключевые аспекты и особенности организации канального уровня. Сервисы, предоставляемые сетевому уровню. Формирование кадра. Обработка ошибок. Управление потоком.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Канальный уровень** (Data Link Layer, L2 модели OSI) превращает «сырую» битовую последовательность физического уровня в **надёжный канал между двумя непосредственно соединёнными узлами**. Он скрывает от сетевого уровня шумы, ошибки и переменную пропускную способность канала, предоставляя ему услугу передачи пакетов в виде дискретных **кадров** (frames). Канальный уровень обычно делится на два подуровня: **LLC** (Logical Link Control, IEEE 802.2) — единый интерфейс к L3 и контроль соединения, и **MAC** (Media Access Control) — управление доступом к разделяемой среде. Основные функции уровня: формирование кадров (framing), обнаружение/коррекция ошибок, управление потоком, адресация (MAC-адреса) и управление доступом.", "<h3>Сервисы, предоставляемые сетевому уровню</h3>", "Канальный уровень может предложить три класса служб:", "- **Ненадёжная доставка без подтверждений** (unacknowledged connectionless) — кадры просто шлются, потерянные не восстанавливаются. Используется на высоконадёжных каналах (Ethernet, оптика), а также для трафика реального времени, где повторная передача бесполезна (голос).\n- **Надёжная доставка без соединения** (acknowledged connectionless) — каждый кадр получает индивидуальное подтверждение (ACK), но логического соединения не устанавливается. Применяется в шумных средах: 802.11 Wi-Fi.\n- **Надёжная доставка с соединением** (acknowledged connection-oriented) — три фазы: установление соединения, передача нумерованных кадров с подтверждениями, разрыв. Гарантирует доставку каждого кадра ровно один раз и в правильном порядке. Пример: классический HDLC NRM, LLC Type 2.", "<h3>Формирование кадра (framing)</h3>", "Поскольку физический уровень оперирует только битами, канальному нужно разметить поток на границы кадров. Четыре основных метода:", "- **Счётчик символов** (character count) — поле в заголовке указывает длину кадра в байтах. Уязвимо: одна ошибка в счётчике рассинхронизирует все последующие кадры.\n- **Флаговые байты + байт-стаффинг** (byte/character stuffing) — кадр обрамлён специальным **FLAG**-байтом. Если такой байт встречается внутри полезной нагрузки, перед ним вставляется **ESC**-байт; ESC внутри — тоже экранируется. Применяется в **PPP** (Point-to-Point Protocol, RFC 1662) — байт 0x7E как FLAG, 0x7D как ESC.\n- **Флаговые биты + бит-стаффинг** (bit stuffing) — разделитель **01111110** (0x7E). Чтобы такой паттерн не возник в данных, передатчик после **пяти подряд идущих единиц** вставляет «0», а приёмник его удаляет. Используется в **HDLC** (High-level Data Link Control, ISO 13239) — родительском протоколе для PPP в HDLC-режиме, Frame Relay, LAPB, LAPD.\n- **Нарушения физического кодирования** (coding violations) — резервируются «запрещённые» комбинации линейного кода (например, в 4B/5B символы JK для начала кадра, TR — для конца). Используется в IEEE 802.3, 802.5.", "Часто комбинируется несколько методов: Ethernet использует 7-байтовую **преамбулу** для синхронизации, байт **SFD** (Start Frame Delimiter, 0xAB) как маркер начала и поле длины — для конца.", "<h3>Обработка ошибок</h3>", "Два подхода:\n- **FEC** (Forward Error Correction) — упреждающая коррекция: к данным добавляют избыточные биты, позволяющие приёмнику самостоятельно исправить часть ошибок без обращения к отправителю. Подходит для каналов с большой задержкой (спутник, DTN) или односторонней связи. Используются коды Хэмминга, Рида-Соломона, свёрточные, LDPC, турбокоды.\n- **ARQ** (Automatic Repeat reQuest) — обнаружение ошибки (CRC, чётность) + запрос повторной передачи через подтверждения/таймеры. Подходит для двусторонних каналов с умеренной задержкой. Варианты: Stop-and-Wait, Go-Back-N, Selective Repeat (см. Q17–Q18).", "В современных системах применяется **Hybrid ARQ** (HARQ): сначала FEC пытается исправить, при неудаче — ARQ запрашивает повтор.", "<h3>Управление потоком</h3>", "**Flow control** не позволяет быстрому отправителю переполнить буферы медленного получателя. Реализации:\n- **Обратная связь от приёмника** (feedback-based) — приёмник явно сообщает, сколько ещё кадров он может принять (XON/XOFF, кадры RR/RNR в HDLC, окно в TCP). Базовый механизм скользящего окна.\n- **Управление по скорости** (rate-based) — отправителю заранее назначен максимальный темп; обратной связи нет (применяется в ATM).\n- **Аппаратное управление потоком** Ethernet (IEEE 802.3x) — кадры **PAUSE** заставляют партнёра приостановить передачу на заданное число квантов.", "Управление потоком тесно связано, но отлично от **контроля перегрузки** (congestion control): первое защищает конкретного получателя, второе — сеть в целом (Q44).", "<h3>Дополнительные функции и адресация</h3>", "- **Адресация** на L2 — **MAC-адреса** (48 бит в Ethernet, 64 бит в Bluetooth/802.15.4). Адрес назначения может быть **unicast**, **multicast** (групповая рассылка) или **broadcast** (FF:FF:FF:FF:FF:FF).\n- **Демультиплексирование** в верхний уровень — поле EtherType/SNAP-LLC.\n- **Управление доступом** к разделяемой среде (CSMA/CD, CSMA/CA, Token Passing) — функция MAC-подуровня (Q21–Q22)."], "terms": [{"ru": "Канальный уровень", "en": "data link layer", "df": "второй уровень модели OSI, отвечает за передачу кадров между соседними узлами"}, {"ru": "Кадр", "en": "frame", "df": "единица данных канального уровня, содержит заголовок, полезную нагрузку и трейлер"}, {"ru": "LLC", "en": "Logical Link Control", "df": "верхний подуровень канального уровня, единый интерфейс к L3"}, {"ru": "MAC", "en": "Media Access Control", "df": "нижний подуровень, управляет доступом к разделяемой среде"}, {"ru": "Инкапсуляция", "en": "encapsulation", "df": "упаковка данных вышестоящего уровня в структуру нижестоящего уровня"}, {"ru": "Байт-стаффинг", "en": "byte stuffing", "df": "вставка escape-байта перед специальными символами внутри кадра (PPP)"}, {"ru": "Бит-стаффинг", "en": "bit stuffing", "df": "вставка нулевого бита после пяти подряд идущих единиц (HDLC)"}, {"ru": "HDLC", "en": "High-level Data Link Control", "df": "стандарт канального уровня ISO 13239, родитель PPP и Frame Relay"}, {"ru": "PPP", "en": "Point-to-Point Protocol", "df": "RFC 1661/1662, протокол точка-точка"}, {"ru": "ARQ", "en": "Automatic Repeat reQuest", "df": "автоматический запрос повторной передачи при обнаружении ошибки"}, {"ru": "FEC", "en": "Forward Error Correction", "df": "упреждающая коррекция ошибок без запроса повтора"}, {"ru": "HARQ", "en": "Hybrid ARQ", "df": "комбинация FEC и ARQ"}, {"ru": "Управление потоком", "en": "flow control", "df": "механизм согласования скоростей отправителя и получателя"}, {"ru": "PAUSE-кадр", "en": "IEEE 802.3x", "df": "Ethernet-механизм приостановки передачи партнёром"}], "summary": ["**Канальный уровень** (L2 OSI) — превращает «сырые» биты PHY в надёжный канал между соседними узлами в виде кадров", "Делится на два подуровня: **LLC** (IEEE 802.2, интерфейс к L3) и **MAC** (управление доступом к среде)", "Функции: framing, error control, flow control, MAC-адресация, доступ к среде", "**Три сервиса для L3**: ненадёжный без ACK (Ethernet, оптика, real-time); надёжный без соединения с покадровым ACK (Wi-Fi); надёжный с соединением (HDLC NRM, LLC Type 2)", "**Framing — 4 метода**: счётчик символов (хрупкий); флаг + **байт-стаффинг** (PPP, 0x7E=FLAG, 0x7D=ESC); флаг + **бит-стаффинг**; нарушения кодирования", "Бит-стаффинг **HDLC** (ISO 13239): флаг 01111110, после 5 единиц вставляется 0; используется в Frame Relay, LAPB, LAPD", "Ethernet: 7-байт **преамбула** + **SFD** (0xAB) + длина — комбинация методов", "**Обработка ошибок**: **FEC** (упреждающая, Хэмминг/RS/LDPC/Turbo — для спутника/DTN); **ARQ** (повтор по таймеру — Stop-and-Wait, GBN, SR); **HARQ** = FEC+ARQ (LTE/5G/Wi-Fi)", "**Flow control**: feedback-based (XON/XOFF, RR/RNR HDLC, окно TCP); rate-based (ATM); **PAUSE-кадры 802.3x**", "Flow control ≠ congestion control: первый защищает получателя, второй — сеть", "**MAC-адресация**: 48 бит (Ethernet, OUI+NIC), 64 бит (BT/802.15.4); типы — unicast, multicast, broadcast FF:FF:FF:FF:FF:FF", "Демультиплексирование в L3 через поле **EtherType** или SNAP-LLC"]}, {"n": 16, "title": "Коды с исправлением ошибок. Коды с обнаружением ошибок.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "Каналы связи всегда вносят искажения: тепловой шум переворачивает отдельные биты, импульсные помехи разрушают целые пакеты битов (**пакетная ошибка**, burst error), затухание ухудшает SNR. **Помехоустойчивое кодирование** (error-control coding) — добавление к данным избыточных битов таким образом, чтобы приёмник мог либо **обнаружить** (detect), либо **исправить** (correct) часть ошибок без обращения к отправителю. Все коды основаны на простой идее: из всех 2ⁿ возможных n-битовых слов «разрешёнными» (codewords) объявляются лишь 2ᵏ, разнесённые в пространстве так, чтобы любая малая ошибка переводила разрешённое слово в неразрешённое.", "<h3>Кодовое расстояние Хэмминга</h3>", "**Расстояние Хэмминга** (Hamming distance) d(x, y) между двумя двоичными словами — число позиций, в которых они различаются. Минимальное расстояние кода d_min определяет его корректирующие свойства:", "- Чтобы **обнаружить** d ошибок → d_min ≥ d + 1 (после d искажений слово ещё не совпадёт ни с каким другим разрешённым).\n- Чтобы **исправить** t ошибок → d_min ≥ 2t + 1 (искажённое слово ближе к исходному, чем к любому другому).", "Например, для исправления одной ошибки нужно d_min = 3; для исправления двух — d_min = 5. Стоимость — **избыточность** r/n (доля контрольных битов).", "<h3>Коды с исправлением ошибок (FEC)</h3>", "- **Код Хэмминга (n, k)** (Hamming code, 1950) — классический линейный (7,4)-код: 4 информационных + 3 контрольных бита, d_min = 3, исправляет одну ошибку. Контрольные биты стоят на позициях-степенях двойки (1, 2, 4, …); каждый отвечает за чётность определённого подмножества позиций. Общая формула: для m информационных бит требуется r контрольных, где 2^r ≥ m + r + 1.\n- **Расширенный код Хэмминга** — добавляет общий бит чётности, доводя d_min до 4: исправляет одну, обнаруживает две ошибки (SEC-DED, используется в ECC-памяти серверов).\n- **Циклические коды БЧХ** (BCH) и **Рида-Соломона** (Reed-Solomon, RS(n, k)) — работают над байтами/символами, исправляют (n−k)/2 символьных ошибок, отлично справляются с **пакетными ошибками**. Применяются в CD/DVD/Blu-ray, QR-кодах, DVB-T, спутниковых каналах, RAID-6.\n- **Свёрточные коды** (convolutional codes) — кодер с памятью: выходные биты — линейные комбинации текущих и нескольких предыдущих входных. Декодирование алгоритмом Витерби. Используются в GSM, Wi-Fi, спутниковой связи.\n- **Турбокоды** (Turbo, 1993) — параллельная конкатенация двух свёрточных кодеров с перемежением; итеративное декодирование. Стандарт UMTS, LTE.\n- **LDPC** (Low-Density Parity-Check, Gallager 1960, ревизия 1996) — длинные блочные коды с разреженной матрицей проверок, итеративное «message passing» декодирование. Приближаются к шенноновскому пределу на 0,1–0,5 дБ; используются в Wi-Fi 5/6, 5G NR (data channels), DVB-S2, 10GBASE-T.\n- **Polar-коды** (Arıkan 2009) — единственные коды с доказанным достижением шенноновского предела при n→∞; стандарт для управляющих каналов 5G NR.", "<h3>Коды с обнаружением ошибок</h3>", "- **Бит чётности** (parity bit) — один дополнительный бит, делающий общее число единиц чётным (even parity) или нечётным (odd parity). Обнаруживает любое нечётное число ошибок, бессилен против чётного.\n- **Двумерная чётность** (block parity / two-dimensional parity) — биты в матрице, чётность по строкам и столбцам. Обнаруживает все одиночные, двойные, тройные ошибки и большинство пакетных; может исправить одиночную ошибку (пересечение «плохой» строки и «плохого» столбца).\n- **Контрольная сумма** (checksum) — арифметическая сумма всех слов по модулю 2¹⁶ с инверсией (Internet checksum, RFC 1071). Используется в IP, TCP, UDP. Слабая защита (не ловит перестановки слов и парные ошибки), но дёшева в реализации.\n- **CRC** (Cyclic Redundancy Check, циклический избыточный код) — деление сообщения как многочлена над GF(2) на фиксированный **порождающий полином** g(x). Остаток (длиной r бит) — контрольная сумма CRC. Свойства CRC длины r:\n  - обнаруживает **все одиночные** и **все двойные** ошибки;\n  - обнаруживает все пакетные ошибки длины ≤ r;\n  - обнаруживает все ошибки нечётной кратности (если g(x) делится на x+1);\n  - вероятность пропуска пакетной ошибки длины > r ≈ 2⁻ʳ.\n  Стандартные полиномы: **CRC-16-CCITT** (g(x)=x¹⁶+x¹²+x⁵+1) — HDLC, X.25; **CRC-32 (IEEE 802.3)** — Ethernet, ZIP; **CRC-32C** — iSCSI, SCTP. Аппаратно реализуется простым сдвиговым регистром с XOR-обратными связями — критически важная характеристика для гигабитных скоростей.", "<h3>Когда что применять</h3>", "| Канал | Типичный выбор |\n|---|---|\n| Проводной Ethernet | CRC-32 (обнаружение) + ARQ на уровне TCP |\n| Wi-Fi, LTE/5G | CRC + свёрточный/турбо/LDPC + HARQ |\n| Спутник, DVB | RS + свёрточный (конкатенация) или LDPC |\n| Память DRAM | Hamming SEC-DED |\n| CD/DVD/QR | Reed-Solomon (стойкий к пакетным ошибкам — царапинам) |"], "terms": [{"ru": "Избыточные биты", "en": "redundant bits", "df": "дополнительные биты, добавляемые для обнаружения/исправления ошибок"}, {"ru": "Кодовое расстояние Хэмминга", "en": "Hamming distance", "df": "число позиций, в которых два кодовых слова различаются"}, {"ru": "Кодовое слово", "en": "codeword", "df": "допустимая комбинация из множества 2ᵏ разрешённых"}, {"ru": "Скорость кода", "en": "code rate", "df": "отношение k/n информационных бит к общему числу"}, {"ru": "Код Хэмминга", "en": "Hamming code", "df": "линейный код с исправлением одиночных ошибок (SEC), SEC-DED — с обнаружением двойных"}, {"ru": "БЧХ / Рида-Соломона", "en": "BCH / Reed-Solomon", "df": "циклические блочные коды, RS работает над символами"}, {"ru": "Свёрточный код", "en": "convolutional code", "df": "код с памятью; декодируется алгоритмом Витерби"}, {"ru": "Турбокоды", "en": "turbo codes", "df": "итеративные коды, близкие к пределу Шеннона (UMTS, LTE)"}, {"ru": "LDPC", "en": "Low-Density Parity-Check", "df": "длинные блочные коды с разреженной матрицей; Wi-Fi 6, 5G, DVB-S2"}, {"ru": "Бит чётности", "en": "parity bit", "df": "контрольный бит, обеспечивающий чётное (или нечётное) число единиц"}, {"ru": "CRC", "en": "Cyclic Redundancy Check", "df": "циклический избыточный код, основанный на полиномиальном делении"}, {"ru": "Порождающий полином", "en": "generator polynomial", "df": "полином, на который делится сообщение при вычислении CRC"}, {"ru": "Пакетная ошибка", "en": "burst error", "df": "последовательность подряд идущих ошибочных битов"}, {"ru": "HARQ", "en": "Hybrid ARQ", "df": "комбинация FEC и повторных передач"}], "summary": ["**Помехоустойчивое кодирование** — добавление избыточных бит, чтобы обнаружить/исправить ошибки; из 2ⁿ слов разрешены 2ᵏ", "**Расстояние Хэмминга** d(x,y) — число позиций различий; d_min определяет свойства кода", "Обнаружение d ошибок: **d_min ≥ d+1**; исправление t ошибок: **d_min ≥ 2t+1**", "Избыточность r/n — цена коррекции; для исправления 1 ошибки d_min=3, для 2 ошибок d_min=5", "**Код Хэмминга (n,k)** (1950): контрольные биты на позициях степеней 2 (1,2,4...), **2ʳ ≥ m+r+1**", "Расширенный Хэмминга (**SEC-DED**) — d_min=4, исправляет 1 + обнаруживает 2; в ECC-памяти серверов", "**Рида-Соломона (n,k)** — циклические коды над символами, исправляют (n−k)/2; CD/DVD/QR/DVB-T/RAID-6, отлично с пакетными", "**Свёрточные** — кодер с памятью, декодирование **Витерби**; GSM, Wi-Fi, спутник", "**Турбокоды** (1993) — параллельные свёрточные + перемежение, итеративное декодирование; UMTS, LTE", "**LDPC** (Gallager 1960, ревизия 1996) — разреженная матрица проверок, итер. message passing; Wi-Fi 5/6, **5G NR data**, DVB-S2, 10GBASE-T", "**Polar-коды** (Arıkan 2009) — доказанно достигают предела Шеннона; **5G NR control channels**", "**Бит чётности** (parity) — обнаруживает любое нечётное число ошибок", "**Двумерная чётность** (2D-parity) — может исправить 1 ошибку (пересечение «плохой» строки и столбца)", "**Internet checksum** (RFC 1071) — арифметическая сумма по mod 2¹⁶; в IP/TCP/UDP; слабая", "**CRC** — деление полинома над GF(2) на порождающий g(x); остаток r бит", "Свойства CRC длины r: все одиночные/двойные/нечётные ошибки; все пакетные ≤ r; пакетная > r с вероятностью пропуска ≈ 2⁻ʳ", "Стандарты: **CRC-16-CCITT** (HDLC/X.25), **CRC-32 IEEE 802.3** (Ethernet/ZIP), CRC-32C (iSCSI/SCTP)", "Применение: проводной Ethernet — CRC-32 + ARQ TCP; Wi-Fi/LTE — CRC+турбо/LDPC+HARQ; DRAM — Hamming SEC-DED; CD/QR — RS"]}, {"n": 17, "title": "Элементарные протоколы: симплексный протокол «Утопия», симплексный протокол с ожиданием для канала без ошибок, симплексный протокол с ожиданием для зашумлённых каналов.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "Чтобы пошагово показать механику канального уровня, в учебнике Таненбаума рассматривается серия **трёх простейших симплексных протоколов**, каждый из которых добавляет ровно одну новую возможность по сравнению с предыдущим. Симплексные — значит данные передаются только в одну сторону (от отправителя к получателю), хотя для управления могут идти короткие подтверждения в обратном направлении. На этих учебных протоколах последовательно вводятся понятия **управления потоком**, **подтверждений**, **таймера повторной передачи** и **нумерации кадров**, которые лежат в основе всех реальных протоколов скользящего окна (Q18), TCP и HDLC.", "<h3>1. Протокол «Утопия» (Utopia, unrestricted simplex protocol)</h3>", "Идеальный мысленный эксперимент:\n- Канал **без ошибок**, бит передаётся без искажений.\n- Получатель **бесконечно быстрый** и всегда готов принимать.\n- Не нужны ни ACK, ни таймеры, ни нумерация.", "Отправитель в цикле берёт пакет у сетевого уровня, упаковывает в кадр и отдаёт физическому уровню. Получатель в цикле принимает кадр и отдаёт пакет наверх. Алгоритм состоит буквально из двух операторов в каждом узле.", "**Зачем нужен:** базовая точка отсчёта, демонстрирующая, что́ исчезает, если канал идеален. В реальности недостижим — даже у самых надёжных каналов есть конечная BER и буферы конечной длины.", "<h3>2. Стоп-и-жди для канала без ошибок (simplex stop-and-wait)</h3>", "Снимается допущение о бесконечной скорости получателя — теперь он может **переполниться**:", "- Отправитель посылает один кадр и **блокируется**, ожидая короткое подтверждение **ACK** от получателя.\n- Получатель, прочитав и обработав кадр, отправляет ACK.\n- Только после получения ACK отправитель посылает следующий кадр.", "Так появляется **управление потоком** (flow control): темп задаёт получатель. Канал по-прежнему предполагается безошибочным, поэтому ACK не несёт номера и не теряется — нет нужды в таймере и нумерации.", "**Эффективность** — низкая: канал простаивает в течение RTT после каждого кадра. Коэффициент использования U = T_frame / (T_frame + RTT). При длинных каналах (спутник) — менее 1%.", "<h3>3. PAR для зашумлённых каналов (Positive Acknowledgement with Retransmission)</h3>", "Теперь канал может **искажать и терять кадры и ACK**. Возникают три новые проблемы и три механизма их решения:", "- **Потеря кадра**: получатель ничего не получает → не отправляет ACK. Решение — **таймер повторной передачи** (retransmission timer): отправитель запускает таймер при отправке; если ACK не пришёл к моменту срабатывания — кадр посылается повторно.\n- **Потеря ACK**: получатель кадр принял, но ACK потерялся. Отправитель по таймеру шлёт дубликат, который надо отличить от нового. Решение — **нумерация кадров**, для stop-and-wait достаточно **одного бита** (0/1): после успешного приёма получатель ждёт кадр с противоположным номером, повтор с тем же номером — дубликат.\n- **Обработка дубликата**: получатель видит дубликат → не передаёт пакет наверх (чтобы не было повторов в приложении), но обязательно **снова отправляет ACK** (иначе отправитель будет вечно посылать тот же кадр).", "Этот протокол также называют **ABP** (Alternating Bit Protocol) — из-за чередующихся номеров 0/1. Он — простейший пример **скользящего окна с окном W=1** (Q18) и доказуемо корректен при любых сочетаниях потерь, дубликатов и переупорядочения, если только конечный таймер достаточно велик.", "<h3>Эволюция учебных протоколов</h3>", "| Протокол | Канал | Управление потоком | Обработка ошибок | Нумерация |\n|---|---|---|---|---|\n| Утопия | идеальный | нет | нет | нет |\n| Stop-and-Wait (без ошибок) | без ошибок | да (по ACK) | нет | нет |\n| PAR (Stop-and-Wait зашумлённый) | с ошибками/потерями | да | да (таймер + ретрансмит) | 1 бит |", "Дальнейшее обобщение — **скользящее окно** размером W > 1, позволяющее иметь несколько неподтверждённых кадров «в полёте» и улучшающее использование канала (см. Q18)."], "terms": [{"ru": "Симплекс", "en": "simplex", "df": "передача данных только в одном направлении"}, {"ru": "Протокол «Утопия»", "en": "Utopia protocol", "df": "идеальный протокол без ошибок и без управления потоком"}, {"ru": "ACK", "en": "Acknowledgement", "df": "подтверждение успешного получения кадра"}, {"ru": "Стоп-и-жди", "en": "stop-and-wait", "df": "режим, при котором отправитель ждёт подтверждения перед отправкой следующего кадра"}, {"ru": "Управление потоком", "en": "flow control", "df": "механизм согласования темпа отправителя и получателя"}, {"ru": "Таймер повторной передачи", "en": "retransmission timer", "df": "таймер ожидания ACK"}, {"ru": "PAR", "en": "Positive Acknowledgement with Retransmission", "df": "подтверждение с повторной передачей при отсутствии ACK"}, {"ru": "ABP", "en": "Alternating Bit Protocol", "df": "простейший протокол с однобитовой нумерацией, эквивалент Stop-and-Wait с обработкой ошибок"}, {"ru": "Дубликат кадра", "en": "duplicate frame", "df": "повторно переданный кадр с уже использованным номером последовательности"}, {"ru": "Зашумлённый канал", "en": "noisy channel", "df": "канал, в котором возможны искажения и потери битов"}, {"ru": "Эффективность использования канала", "en": "link utilization", "df": "доля времени, в которой канал занят полезной передачей"}], "summary": ["Три учебных симплексных протокола Таненбаума, каждый добавляет одну функцию", "**Симплекс** — данные в одну сторону (короткие ACK назад допустимы)", "**1. «Утопия»** (Utopia, unrestricted simplex): канал идеальный, получатель бесконечно быстрый", "Утопия: нет ACK, нет таймеров, нет нумерации; 2 строки кода — базовая точка отсчёта", "**2. Stop-and-Wait для канала без ошибок**: отправил кадр → ждёт **ACK** → следующий", "Появляется **flow control** — темп задаёт получатель; нет нумерации, нет таймера", "Эффективность: **U = T_frame / (T_frame + RTT)**; на спутнике <1%", "**3. PAR** (Positive Acknowledgement with Retransmission) для зашумлённого канала", "Новые проблемы: потеря кадра, потеря ACK, дубликат — три механизма решения", "**Таймер повторной передачи** — при отсутствии ACK кадр посылается заново", "**Нумерация 1 бит (0/1)** для отличия дубликата от нового кадра", "Дубликат: получатель отбрасывает, но **обязательно повторно шлёт ACK**", "PAR = **ABP** (Alternating Bit Protocol); простейший случай скользящего окна W=1", "Доказуемо корректен при любых потерях/дубликатах при достаточно большом таймере", "Сравнительная таблица: Утопия (без ошибок, без flow) → S&W (flow по ACK) → PAR (+ таймер + 1-бит нумерация)", "Дальнейшее обобщение — скользящее окно W>1 для лучшей утилизации (Q18)"]}, {"n": 18, "title": "Протоколы скользящего окна. Протокол однобитового скользящего окна. Протокол с возвратом на N. Протокол с выборочным повтором.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Протокол скользящего окна** (sliding window protocol) — обобщение схемы Stop-and-Wait, в котором отправитель может иметь несколько неподтверждённых кадров «в полёте» одновременно. Это позволяет полностью утилизировать длинные или быстрые каналы, где время кругового обхода RTT в десятки раз превышает время передачи одного кадра. Все современные надёжные протоколы канального и транспортного уровней — HDLC, TCP, SCTP, QUIC — построены на этой идее. Учебно рассматриваются три варианта: однобитовое окно (эквивалент PAR), **Go-Back-N** и **Selective Repeat**, различающиеся стратегией восстановления после ошибок.", "<h3>Базовая механика скользящего окна</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/3/32/Sliding_Window.svg\" alt=\"Диаграмма работы протокола скользящего окна\" loading=\"lazy\"><figcaption>Принцип работы скользящего окна: отправитель ведёт окно отправленных, но ещё не подтверждённых кадров; получатель — окно ожидаемых кадров. При получении ACK окно «скользит» вперёд. <em>Источник: Wikimedia Commons, Alexander Krivács Schrøder, CC BY-SA 3.0.</em></figcaption></figure>", "- Каждому кадру присваивается **номер последовательности** (sequence number) длиной n бит → всего 2ⁿ возможных номеров.\n- **Окно отправителя** — диапазон номеров, которые он имеет право отправить без подтверждения. Размер окна обозначим W_s.\n- **Окно получателя** — диапазон номеров, которые он готов принять. Размер W_r.\n- При приходе ACK окно отправителя «сдвигается» к большим номерам.\n- Для полной утилизации канала нужно W_s ≥ 1 + 2·BDP / размер_кадра, где BDP = пропускная способность × RTT.\n- **Кумулятивное подтверждение** (cumulative ACK): ACK с номером n означает «получены все кадры до n−1 включительно».\n- **Piggybacking** — встраивание ACK в попутный кадр данных в обратном направлении (экономия трафика).", "<h3>1. Однобитовое скользящее окно (1-bit sliding window)</h3>", "- W_s = W_r = 1, номер кадра — 1 бит (значения 0 и 1).\n- Эквивалент протокола PAR / Alternating Bit Protocol (Q17), переписанный в каноническом стиле скользящего окна.\n- Идеален для очень коротких или односторонних дуплексных каналов; страдает на длинных каналах: при W = 1 эффективность не превышает T_frame / (T_frame + RTT).", "<h3>2. Go-Back-N (GBN, «возврат на N»)</h3>", "- W_s до 2ⁿ − 1, W_r = 1: получатель **отбрасывает любые кадры, пришедшие не по порядку**, и держит только указатель на ожидаемый номер.\n- Отправитель ведёт **общий таймер** на самый старый неподтверждённый кадр. Если кадр потерян, ACK не приходит к таймеру → отправитель **повторяет потерянный кадр и все последующие**, уже находящиеся в окне.\n- Подтверждения **кумулятивные**: ACK n подтверждает все кадры < n.\n- Достоинства: простая реализация на получателе (нет буфера); подходит для каналов с малой вероятностью ошибки.\n- Недостатки: при высокой BER пропускная способность катастрофически падает — каждый одиночный сбой влечёт повтор всего окна.\n- **Ограничение размера окна:** W_s ≤ 2ⁿ − 1. Если разрешить 2ⁿ, отправитель не сможет отличить полный круг номеров: вернувшийся кадр 0 после ACK на все 2ⁿ кадров неотличим от нового.\n- Применяется в HDLC, исторических ARPANET-протоколах, GSM RLC AM, отчасти TCP до появления SACK.", "<h3>3. Selective Repeat (SR, «выборочный повтор»)</h3>", "- W_s, W_r > 1: и отправитель, и получатель ведут буферы.\n- Получатель **буферизует кадры, пришедшие не по порядку**; при получении пропущенного — отдаёт наверх весь непрерывный префикс.\n- Отправитель повторяет **только потерянные кадры**, отслеживая ACK для каждого индивидуально.\n- **NAK** (Negative Acknowledgement) — опционально: получатель явно сообщает, что определённый кадр потерян, не дожидаясь таймера, ускоряя восстановление.\n- **Ограничение размера окна:** W_s + W_r ≤ 2ⁿ; при равных окнах — **W ≤ 2ⁿ⁻¹**. Иначе после потери ACK получатель не сможет отличить совершенно новый кадр с тем же номером от запоздавшего дубликата.\n- Достоинства: высокая эффективность при значительных BER; используется в практически всех современных надёжных протоколах.\n- Недостатки: сложнее реализация (управление буферами на обеих сторонах).\n- В TCP появилось как опция **SACK** (Selective Acknowledgment, RFC 2018): получатель сообщает, какие именно блоки байтов он принял, позволяя отправителю выборочно перепосылать.", "<h3>Сравнение</h3>", "| Параметр | 1-bit (Stop-and-Wait) | Go-Back-N | Selective Repeat |\n|---|---|---|---|\n| Размер W_s | 1 | до 2ⁿ−1 | до 2ⁿ⁻¹ |\n| Размер W_r | 1 | 1 | до 2ⁿ⁻¹ |\n| Буфер у получателя | нет | нет | да |\n| Повтор при ошибке | один кадр | весь хвост окна | только потерянный |\n| Сложность реализации | минимальная | средняя | высокая |\n| Эффективность при высокой BER | низкая | низкая | высокая |"], "terms": [{"ru": "Скользящее окно", "en": "sliding window", "df": "механизм, позволяющий передавать несколько кадров до получения подтверждения"}, {"ru": "Окно отправителя", "en": "sender window, W_s", "df": "множество кадров, разрешённых к отправке без подтверждения"}, {"ru": "Окно получателя", "en": "receiver window, W_r", "df": "множество кадров, которые получатель готов принять"}, {"ru": "Номер последовательности", "en": "sequence number", "df": "порядковый номер кадра для идентификации и упорядочивания"}, {"ru": "Произведение пропускной способности на задержку", "en": "bandwidth-delay product, BDP", "df": "число бит «в полёте» в канале в данный момент"}, {"ru": "Возврат на N", "en": "Go-Back-N", "df": "стратегия, при которой повторяются N кадров начиная с ошибочного"}, {"ru": "Выборочный повтор", "en": "Selective Repeat", "df": "стратегия, при которой повторяется только конкретный утерянный кадр"}, {"ru": "Кумулятивное подтверждение", "en": "cumulative ACK", "df": "ACK n подтверждает все кадры до n−1 включительно"}, {"ru": "SACK", "en": "Selective Acknowledgment, RFC 2018", "df": "выборочное подтверждение в TCP"}, {"ru": "NAK", "en": "Negative Acknowledgement", "df": "отрицательное подтверждение, сигнализирует об ошибке конкретного кадра"}, {"ru": "Буферизация не по порядку", "en": "out-of-order buffering", "df": "сохранение кадров, пришедших раньше ожидаемых"}], "summary": ["**Скользящее окно** — отправитель имеет несколько неподтверждённых кадров «в полёте»; основа HDLC, TCP, SCTP, QUIC", "Кадры нумеруются: **n бит = 2ⁿ номеров**; окно W_s (отправитель), W_r (получатель)", "При ACK окно сдвигается к большим номерам", "Для полной утилизации: **W_s ≥ 1 + 2·BDP/размер_кадра**, BDP = C·RTT", "**Кумулятивное подтверждение**: ACK n = «приняты все < n»", "**Piggybacking** — встраивание ACK в попутный data-кадр обратного направления", "**1. Однобитовое окно** (W_s=W_r=1) — эквивалент PAR/ABP в каноническом виде", "1-bit неэффективно на длинных каналах — те же T_frame/(T_frame+RTT)", "**2. Go-Back-N (GBN)**: W_s до 2ⁿ−1, **W_r=1** — получатель отбрасывает всё не по порядку", "GBN: общий таймер на старейший неподтверждённый; при потере — **повтор кадра и всего хвоста окна**", "GBN: простой получатель (нет буфера); катастрофическое падение при высокой BER", "GBN ограничение окна: **W_s ≤ 2ⁿ−1** (иначе дубликат неотличим от нового)", "Применения GBN: HDLC, ARPANET, GSM RLC AM, TCP до SACK", "**3. Selective Repeat (SR)**: W_s, W_r > 1, **буферизация не по порядку**", "SR: повторяется **только потерянный кадр**, индивидуальные ACK", "**NAK** — отрицательное подтверждение, ускоряет повтор, не дожидаясь таймера", "SR ограничение окна: **W_s + W_r ≤ 2ⁿ**; при равных — **W ≤ 2ⁿ⁻¹**", "SR в TCP реализован как опция **SACK** (RFC 2018) — приёмник сообщает блоки полученных байт", "Сравнение: 1-bit (мин. сложн., низк. эффективность); GBN (простой получатель, плохо при ошибках); SR (сложно, высок. эффективность)"]}, {"n": 19, "title": "Примеры протоколов передачи данных: SONET, ADSL.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**SONET** и **ADSL** — две классические технологии физического и канального уровней, иллюстрирующие два полюса телеком-инфраструктуры. SONET — высокоскоростная **магистральная** оптическая иерархия с жёсткой синхронизацией всех узлов, разработанная в эпоху телефонных монополий и до сих пор широко применяющаяся между операторами. ADSL — **абонентская** технология «последней мили», превратившая старую медную телефонную пару в цифровой широкополосный канал. Обе они стандартизированы ITU-T и опираются на TDM/частотное мультиплексирование соответственно.", "<h3>SONET / SDH</h3>", "**SONET** (Synchronous Optical Network, ANSI T1.105) и **SDH** (Synchronous Digital Hierarchy, ITU-T G.707) — это родственные стандарты синхронной оптической передачи: SONET принят в Северной Америке, SDH — в Европе и большей части мира; они взаимно совместимы на уровне фреймов и используют один и тот же физический уровень.", "Ключевые черты:\n- **Синхронность**: все узлы сети используют единый высокоточный тактовый сигнал (PRC — Primary Reference Clock, точность ≤10⁻¹¹), что упрощает мультиплексирование и демультиплексирование низкоскоростных потоков в высокоскоростные.\n- **Иерархия скоростей** строится из базового кадра **STS-1** (Synchronous Transport Signal) / OC-1 (Optical Carrier) = **51,84 Мбит/с**. Кадр — матрица 9 строк × 90 столбцов = 810 байт, посылается каждые 125 мкс (8000 кадров/с).\n- Старшие уровни получаются **байт-перемежением** базовых:", "| SONET | SDH | Скорость |\n|---|---|---|\n| OC-1 / STS-1 | — | 51,84 Мбит/с |\n| OC-3 / STS-3 | STM-1 | 155,52 Мбит/с |\n| OC-12 / STS-12 | STM-4 | 622,08 Мбит/с |\n| OC-48 / STS-48 | STM-16 | 2,488 Гбит/с |\n| OC-192 / STS-192 | STM-64 | 9,953 Гбит/с |\n| OC-768 / STS-768 | STM-256 | 39,813 Гбит/с |", "- **Структура кадра** делится на **Section, Line и Path overhead** (служебные байты для управления, аварийной сигнализации, контроля производительности) и **полезную нагрузку SPE** (Synchronous Payload Envelope), где «плавающим указателем» размещается контейнер VC (Virtual Container) с пользовательскими данными.\n- **Кольцевая топология** с механизмами **APS** (Automatic Protection Switching): **UPSR** (Unidirectional Path Switched Ring) и **BLSR** (Bidirectional Line Switched Ring) обеспечивают переключение на резерв за **<50 мс** при разрыве оптоволокна.\n- Поверх SONET/SDH переносятся: PDH-каналы (E1/T1, E3/T3), ATM-ячейки, **GFP** (Generic Framing Procedure) — обёртка для Ethernet (EoS, Ethernet over SDH), а также MPLS.\n- В современных операторских сетях SDH постепенно вытесняется **OTN** (Optical Transport Network, ITU-T G.709), который добавляет FEC (Reed-Solomon) и поддерживает 100/400/800 Гбит/с.", "<h3>ADSL</h3>", "**ADSL** (Asymmetric Digital Subscriber Line, ITU-T G.992.x) — технология широкополосного абонентского доступа по обычной медной телефонной паре. «Асимметричная» — потому что скорость downstream (к пользователю) намного превышает скорость upstream (от пользователя), что соответствует типичному веб-трафику.", "Принцип:\n- Витая пара физически поддерживает полосу до ~1,1 МГц, тогда как голос занимает всего 0–4 кГц. Свободный высокочастотный диапазон используется для данных.\n- Полоса 0–1104 кГц делится методом **DMT** (Discrete MultiTone) на **256 поднесущих** шириной по 4,3125 кГц:\n  - Поднесущая 0 — POTS (голос).\n  - Поднесущие 1–5 — защитные.\n  - Поднесущие 6–30 — upstream.\n  - Поднесущие 31–255 — downstream (отсюда асимметрия).\n- В каждой поднесущей применяется **QAM** с **bit-loading**: число бит на символ (2–15) индивидуально подстраивается под измеренный SNR данной частоты. Линии с локальными помехами «отключают» проблемные поднесущие.\n- **Сплиттер** (splitter, microfilter) — у абонента и на АТС; пассивный фильтр, разделяющий голос (НЧ) и данные (ВЧ).\n- **DSLAM** (Digital Subscriber Line Access Multiplexer) на АТС агрегирует трафик от сотен абонентов в магистральные каналы (ATM/Ethernet).", "Скорости:\n- **ADSL G.992.1**: downstream до 8 Мбит/с, upstream до 1 Мбит/с (на дистанции до ~5 км).\n- **ADSL2+ G.992.5**: расширение полосы до 2,2 МГц, до **24 Мбит/с** downstream.\n- **VDSL2 G.993.2** (Very-high-speed): полоса до 30 МГц, **100 Мбит/с** на 300 м.\n- **G.fast G.9701**: полоса до 212 МГц, **1 Гбит/с** на коротких линиях (до 100 м).", "Семейство xDSL включает асимметричные (ADSL, VDSL) и симметричные (SDSL, HDSL) варианты. Сейчас xDSL постепенно вытесняется оптикой FTTH (GPON, XGS-PON).", "<h3>Сравнение SONET и ADSL</h3>", "| Критерий | SONET/SDH | ADSL |\n|---|---|---|\n| Назначение | магистраль | последняя миля |\n| Среда | оптика (SMF) | медная пара |\n| Скорости | 50 Мбит/с – 40 Гбит/с | до 24 Мбит/с (ADSL2+) |\n| Мультиплексирование | TDM, синхронное | DMT (256 поднесущих, FDM) |\n| Симметрия | полностью симметрично | асимметрично |\n| Защита | <50 мс APS | нет (UPS у абонента) |"], "terms": [{"ru": "SONET", "en": "Synchronous Optical Network", "df": "североамериканский синхронный оптический стандарт (ANSI T1.105)"}, {"ru": "SDH", "en": "Synchronous Digital Hierarchy", "df": "европейский аналог (ITU-T G.707), совместим с SONET"}, {"ru": "STS-1 / OC-1", "en": "Synchronous Transport Signal / Optical Carrier", "df": "базовый уровень SONET, 51,84 Мбит/с"}, {"ru": "STM-1", "en": "Synchronous Transport Module", "df": "базовый уровень SDH, 155,52 Мбит/с"}, {"ru": "SPE", "en": "Synchronous Payload Envelope", "df": "конверт полезной нагрузки SONET"}, {"ru": "VC", "en": "Virtual Container", "df": "контейнер пользовательских данных в SDH"}, {"ru": "APS", "en": "Automatic Protection Switching", "df": "автоматическое переключение на резерв при сбое; цель <50 мс"}, {"ru": "OTN", "en": "Optical Transport Network, G.709", "df": "современный оптический транспортный стандарт с FEC"}, {"ru": "ADSL", "en": "Asymmetric Digital Subscriber Line", "df": "асимметричная цифровая абонентская линия по медной паре"}, {"ru": "DMT", "en": "Discrete MultiTone", "df": "многочастотное мультиплексирование с разделением полосы на 256 поднесущих"}, {"ru": "QAM", "en": "Quadrature Amplitude Modulation", "df": "квадратурная амплитудная модуляция"}, {"ru": "POTS", "en": "Plain Old Telephone Service", "df": "традиционная аналоговая телефония"}, {"ru": "Сплиттер / микрофильтр", "en": "splitter", "df": "фильтр, разделяющий голосовой и высокочастотный трафик в ADSL"}, {"ru": "DSLAM", "en": "DSL Access Multiplexer", "df": "мультиплексор xDSL на АТС"}, {"ru": "Нисходящий / восходящий поток", "en": "downstream / upstream", "df": "передача к пользователю / от пользователя"}], "summary": ["**SONET** (ANSI) и **SDH** (ITU-T G.707) — синхронная оптическая иерархия; родственны, фреймово совместимы", "Синхронность: единый высокоточный тактовый сигнал **PRC** (точность ≤10⁻¹¹)", "**Базовый кадр STS-1 / OC-1** = **51,84 Мбит/с**; матрица 9×90 = 810 байт каждые 125 мкс (8000 кадров/с)", "Иерархия: OC-1=51,84; **OC-3/STM-1=155,52**; OC-12/STM-4=622; OC-48/STM-16=2,5 Гбит/с; **OC-192/STM-64=10 Гбит/с**; OC-768=40 Гбит/с", "Структура: **Section / Line / Path overhead** + **SPE** (Synchronous Payload Envelope) с указателем на **VC** (Virtual Container)", "Топология — кольцо с **APS** (Automatic Protection Switching): **UPSR**, **BLSR** — переключение **<50 мс** при разрыве оптики", "Поверх SONET/SDH: PDH (E1/T1/E3), ATM, **GFP** для Ethernet over SDH (EoS), MPLS", "Преемник — **OTN** (ITU-T G.709): FEC Reed-Solomon, 100/400/800 Гбит/с", "**ADSL** (ITU-T G.992.x) — асимметричный широкополосный доступ по медной паре", "Полоса витой пары до ~1,1 МГц; голос 0–4 кГц; ВЧ-диапазон — для данных", "**DMT** (Discrete MultiTone): **256 поднесущих × 4,3125 кГц**", "Распределение поднесущих: 0=POTS, 1–5=защита, 6–30=upstream, **31–255=downstream** (отсюда асимметрия)", "В каждой поднесущей **QAM с bit-loading** (2–15 бит/символ, индивидуально под SNR)", "Оборудование: **сплиттер/microfilter** (пассивный фильтр голос/данные), **DSLAM** на АТС агрегирует трафик", "Скорости: ADSL G.992.1 — 8/1 Мбит/с (5 км); **ADSL2+** G.992.5 — 2,2 МГц, до **24 Мбит/с** down", "**VDSL2** G.993.2 — 30 МГц, 100 Мбит/с на 300 м; **G.fast** G.9701 — 212 МГц, **1 Гбит/с** на 100 м", "Сравнение: SONET — магистраль/оптика/симметрия/<50мс APS; ADSL — last mile/медь/асимметрия"]}, {"n": 20, "title": "Обобщённая задача коммутации. Коммутация каналов и пакетов. Маршрутизация.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Коммутация** (switching) — фундаментальная задача телекоммуникационной сети: соединить любую пару из N узлов так, чтобы каждый мог обмениваться данными с каждым, не прокладывая прямой кабель «каждый-с-каждым» (что требовало бы N(N−1)/2 каналов). Решение — **разделяемые узлы коммутации** (коммутаторы, маршрутизаторы), которые принимают входящие данные и направляют их к адресату. Существуют три исторические парадигмы: **коммутация каналов** (телефония), **коммутация сообщений** (телеграф, store-and-forward) и **коммутация пакетов** (Интернет, ARPANET); современные сети комбинируют их.", "<h3>Коммутация каналов</h3>", "**Circuit switching** — модель телефонного звонка. Перед обменом данными между источником и получателем устанавливается **выделенный физический или логический канал** с гарантированной полосой пропускания, который удерживается на всё время сеанса и освобождается после.", "Этапы: **установление соединения** (call setup, сигнализация) → **передача данных** → **разрыв** (release).", "- Реализации: классическая PSTN, ISDN, оптические сети с DWDM-каналами.\n- **Достоинства:** гарантированные полоса, постоянная задержка, отсутствие потерь, прозрачная для любого типа трафика.\n- **Недостатки:** ресурсы заняты, даже когда никто не передаёт (низкая утилизация); долгая фаза установки; плохая устойчивость к отказам (при разрыве канала надо устанавливать заново).\n- **Мультиплексирование**: FDM (старые аналоговые системы), TDM (E1/T1, SDH), DWDM на оптике.", "<h3>Коммутация сообщений</h3>", "**Message switching** — данные передаются целиком как одно сообщение, узлы хранят его до полной приёмки, потом пересылают дальше (**store-and-forward**). Применялась в ранних телеграфных сетях. Сегодня в чистом виде не используется, но идея жива в **DTN** (Q47) и системах **email** (MTA сохраняет письмо до доставки).", "<h3>Коммутация пакетов</h3>", "**Packet switching** (Дэвис, Бэран, 1960-е) — данные дробятся на **пакеты** фиксированного или ограниченного размера, каждый содержит заголовок с адресом и метаданными. Пакеты передаются независимо, **статистически мультиплексируясь** на общих каналах. Узел коммутации полностью принимает пакет, проверяет CRC и пересылает дальше — это та же модель store-and-forward, но на маленьких единицах.", "Два подвида:", "- **Дейтаграммная коммутация** (datagram, connectionless): каждый пакет содержит **полный адрес получателя** и маршрутизируется независимо; разные пакеты одного потока могут идти разными путями и приходить не по порядку. Примеры: **IP**, IPX, CLNP. Это основная парадигма Интернета.\n- **Виртуальные каналы** (virtual circuit, connection-oriented): перед передачей строится логический путь, каждый узел запоминает его и присваивает короткий **локальный идентификатор** (VCI/VPI, label); пакеты несут только этот идентификатор. Примеры: **X.25**, **Frame Relay**, **ATM**, **MPLS** (label switching).", "<h3>Преимущества пакетной коммутации</h3>", "- **Высокая утилизация канала** за счёт статистического мультиплексирования.\n- **Устойчивость к отказам** — пакеты могут обходить вышедшие из строя узлы.\n- **Гибкость** — поддержка разнородного трафика без переконфигурации.\n- **Стоим
