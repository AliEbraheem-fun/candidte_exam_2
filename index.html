— реализация на МКС (2008).\n- **DSN** NASA с поддержкой Bundle.\n- **N4N** Network for Nature.\n- Российская **ИНТЭК**, проекты «Сфера» — спутниковая связь с использованием DTN-принципов."], "terms": [{"ru": "DTN", "en": "Delay-Tolerant Network / Disruption-Tolerant Network", "df": "сеть, устойчивая к задержкам и разрывам"}, {"ru": "IPN", "en": "InterPlaNetary Internet", "df": "концепция межпланетной сети"}, {"ru": "EID", "en": "Endpoint Identifier", "df": "адрес узла в DTN (например, ipn:1.0)"}], "summary": ["**DTN** (Delay/Disruption-Tolerant Network) — для сред, где сквозной путь **никогда не существует одновременно**", "Концепция **IPN** (InterPlaNetary Internet, Винтон Серф + NASA): связь с Марсом 4–24 мин/сторону, прерывания часами", "Стандарт: **Bundle Protocol** (RFC 5050 BPv6 → **RFC 9171 BPv7**)", "Применения: межпланетные миссии (Curiosity, Perseverance, DSN), военные сети, удалённые регионы, сенсоры с мобильными носителями (животные/дроны/корабли), disaster recovery, UWSN, mobile mules", "**Store-Carry-Forward** — отказ от модели сквозного пути", "Узел: получает bundle → **сохраняет в энергонезависимом storage** → **несёт** (физически если мобилен) → при возможности передаёт следующему", "Путь = последовательность **контактов** (contacts) — окон связи", "Bundle-узлы — **overlay поверх обычных протоколов** (TCP/UDP/Bluetooth/Lasercomms) через **convergence layers**", "**Bundle** = единица передачи, от байтов до ГБ", "Структура: **Primary Block** (версия, флаги, **EID источника/назначения/отчёта/custodian**, метка времени, lifetime, fragment offset); **Payload Block**; **Extension Blocks** (BPSec, bundle age)", "**EID** (Endpoint Identifier): `ipn:1.0` (Compressed Bundle Header Encoding) или `dtn://node1/app`", "**Custody Transfer** — передача «опеки» для надёжности при крайней нестабильности", "A → B с просьбой принять custody → B сохраняет, отвечает **Custody Signal** → A удаляет копию; B → следующий и т.д.", "Аналог hop-by-hop надёжности; при потере custodian копия гарантированно в надёжном хранилище", "**Алгоритмы маршрутизации DTN**:", "**Epidemic Routing** — копировать при каждой встрече (надёжно, дорого); **Spray-and-Wait** — ограниченное число копий", "**PRoPHET** — по истории встреч, вероятность доставки; **Contact Graph Routing (CGR)** — расписание орбит, для космоса (детерминистично)", "**BPSec** (RFC 9172/9173/9174): **BIB** (Integrity Block, HMAC/подписи); **BCB** (Confidentiality Block, шифрование payload); hop-by-hop и end-to-end", "DTN vs TCP/IP: путь — необязательный/сквозной; RTT — минуты-сутки/мс-сек; надёжность — hop-by-hop custody / end-to-end TCP; state — в каждом узле / на концах; адресация — EID / IP", "Внедрения: **DTN-on-ISS** (2008), NASA DSN с BP, российская ИНТЭК / «Сфера»"]}], "quizzes": [{"type": "mcq", "topic": "Вопрос 42", "q": "Какие два основных транспортных сервиса предоставляет транспортный уровень?", "opts": ["TCP (надёжный, с соединением) и UDP (ненадёжный, без соединения)", "HTTP и FTP", "IP и ICMP", "OSPF и BGP"], "ans": 0, "expl": "Два сервиса транспортного уровня: TCP (надёжный, с соединением) и UDP (ненадёжный, без соединения)."}, {"type": "mcq", "topic": "Вопрос 42", "q": "Какова последовательность вызовов сокетов Беркли для TCP-сервера?", "opts": ["socket() → connect() → send()/recv() → close()", "socket() → bind() → listen() → accept() → recv()/send() → close()", "socket() → sendto()/recvfrom() → close()", "bind() → socket() → accept() → listen() → close()"], "ans": 1, "expl": "TCP-сервер: socket() → bind() → listen() → accept() → recv()/send() → close()."}, {"type": "tf", "topic": "Вопрос 42", "q": "Порт — это 32-битный идентификатор процесса на транспортном уровне.", "ans": false, "expl": "Неверно. Порт — это 16-битный идентификатор процесса."}, {"type": "mcq", "topic": "Вопрос 43", "q": "Какова процедура установки TCP-соединения?", "opts": ["SYN → ACK → FIN", "SYN → SYN+ACK → ACK (трёхстороннее рукопожатие)", "FIN → ACK → FIN → ACK", "SYN → RST → ACK"], "ans": 1, "expl": "Установка TCP-соединения: трёхстороннее рукопожатие (SYN → SYN+ACK → ACK) с случайными ISN."}, {"type": "tf", "topic": "Вопрос 43", "q": "Разрыв TCP-соединения выполняется в четыре шага: FIN → ACK → FIN → ACK.", "ans": true, "expl": "Верно. Разрыв: четырёхшаговый (FIN → ACK → FIN → ACK)."}, {"type": "mcq", "topic": "Вопрос 43", "q": "Какой диапазон портов относится к well-known ports?", "opts": ["0–65535", "0–1023", "1024–49151", "49152–65535"], "ans": 1, "expl": "Well-known ports: 0–1023."}, {"type": "mcq", "topic": "Вопрос 44", "q": "Как растёт окно перегрузки (cwnd) в фазе медленного старта TCP?", "opts": ["Линейно", "Экспоненциально", "Логарифмически", "Не растёт"], "ans": 1, "expl": "Медленный старт: cwnd растёт экспоненциально до ssthresh."}, {"type": "tf", "topic": "Вопрос 44", "q": "При алгоритме AIMD в случае потери пакета cwnd делится на 2.", "ans": true, "expl": "Верно. AIMD: при потере cwnd делится на 2; при успехе — +1 MSS за RTT."}, {"type": "mcq", "topic": "Вопрос 44", "q": "Почему TCP плохо работает в беспроводных сетях?", "opts": ["Беспроводные сети не поддерживают TCP", "TCP ошибочно уменьшает cwnd из-за потерь от помех, а не перегрузки", "Беспроводные сети слишком быстрые для TCP", "TCP не поддерживает мультиплексирование в беспроводных сетях"], "ans": 1, "expl": "Высокий уровень ошибок из-за помех (не перегрузки). TCP ошибочно уменьшает cwnd. Решения: Explicit Loss Notification, TCP Westwood, SNOOP."}, {"type": "mcq", "topic": "Вопрос 45", "q": "Каков размер каждого поля заголовка UDP?", "opts": ["4 байта", "2 байта", "8 байт", "1 байт"], "ans": 1, "expl": "Заголовок UDP: порт источника, порт назначения, длина, контрольная сумма — по 2 байта каждое."}, {"type": "tf", "topic": "Вопрос 45", "q": "Протокол RTP работает поверх UDP и добавляет sequence number, timestamp, SSRC и payload type.", "ans": true, "expl": "Верно. RTP работает поверх UDP, добавляет sequence number, timestamp, SSRC, payload type."}, {"type": "mcq", "topic": "Вопрос 45", "q": "Что делает клиентский stub при RPC?", "opts": ["Маршализирует параметры для передачи на удалённый хост", "Выполняет процедуру локально", "Устанавливает TCP-соединение", "Шифрует данные"], "ans": 0, "expl": "Клиентский stub маршализирует параметры; серверный — демаршализирует и вызывает процедуру."}, {"type": "mcq", "topic": "Вопрос 46", "q": "Каков минимальный размер заголовка TCP?", "opts": ["8 байт", "16 байт", "20 байт", "40 байт"], "ans": 2, "expl": "Заголовок TCP имеет минимальный размер 20 байт."}, {"type": "tf", "topic": "Вопрос 46", "q": "В TCP fast retransmit выполняется после получения 3 дублирующих ACK.", "ans": true, "expl": "Верно. Fast retransmit — повторная передача после 3 дублирующих ACK."}, {"type": "mcq", "topic": "Вопрос 46", "q": "Какое состояние TCP-соединения наступает после разрыва и длится 2·MSL?", "opts": ["CLOSE_WAIT", "FIN_WAIT_1", "TIME_WAIT", "LAST_ACK"], "ans": 2, "expl": "TIME_WAIT — состояние ожидания исчезновения дубликатов, длится 2·MSL."}, {"type": "mcq", "topic": "Вопрос 47", "q": "Какой принцип лежит в основе DTN (Delay-Tolerant Networks)?", "opts": ["Store-and-forward", "Store-and-carry-and-forward", "Cut-through switching", "Circuit switching"], "ans": 1, "expl": "DTN использует принцип store-and-carry-and-forward: узел хранит сообщение до появления следующего узла."}, {"type": "tf", "topic": "Вопрос 47", "q": "Механизм custody transfer в DTN означает, что промежуточный узел принимает ответственность за бандл.", "ans": true, "expl": "Верно. Custody transfer — промежуточный узел принимает ответственность за доставку бандла."}, {"type": "match", "topic": "Темы 42–47", "q": "Сопоставьте термин с его определением.", "pairs": [{"left": "ISN", "right": "Начальный порядковый номер TCP"}, {"left": "SACK", "right": "Выборочное подтверждение сегментов"}, {"left": "RPC", "right": "Вызов удалённой процедуры"}, {"left": "EID", "right": "Адрес узла в DTN"}, {"left": "cwnd", "right": "Окно перегрузки TCP"}], "expl": "ISN — начальный порядковый номер; SACK — выборочное подтверждение; RPC — вызов удалённой процедуры; EID — Endpoint Identifier в DTN; cwnd — congestion window."}]}, {"id": 7, "name": "Прикладной уровень сетевого стека", "questions": [{"n": 48, "title": "DNS.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**DNS** (Domain Name System, RFC 1034/1035, 1987) — глобальная **распределённая иерархическая база данных**, преобразующая удобные для человека **доменные имена** (`example.com`) в **IP-адреса** (`93.184.216.34`) и другие машиночитаемые записи. Без DNS Интернет был бы невозможен в нынешнем виде: пользователи и приложения не должны помнить миллиарды IP, а серверы могут переезжать без смены имени. DNS — это не просто справочник адресов: он также хранит почтовые маршруты (MX), сертификаты безопасности (TLSA, CAA), записи аутентификации почты (SPF, DKIM, DMARC), сервисные записи (SRV) и множество другого.", "<h3>Иерархия имён и серверов</h3>", "Имена в DNS — иерархия точек, читается справа налево:\n- **`.`** (root, корень) — невидимая точка после TLD.\n- **TLD** (Top-Level Domain): generic — `.com`, `.org`, `.net`, `.info`; country-code (ccTLD) — `.ru`, `.de`, `.cn`; брендовые — `.google`, `.apple`.\n- **SLD** (Second-Level Domain): `example` в `example.com`.\n- **Subdomains**: `www`, `mail`, `api` в `api.example.com`.", "Соответственно иерархизированы серверы:\n- **Корневые серверы (root)** — 13 логических идентификаторов `a.root-servers.net` – `m.root-servers.net`, каждый физически развёрнут как сотни anycast-инстансов по миру. Знают, где TLD-серверы.\n- **TLD-серверы** — для каждой зоны верхнего уровня; знают, где SLD-серверы. Управляются регистратурами (Verisign для `.com`, Координационный центр доменов `.ru`).\n- **Авторитативные серверы** — содержат записи конкретного домена.", "Пространство имён разбито на **зоны** — единицы делегирования; каждая зона управляется одним владельцем, имеет первичный (master) сервер и нескольких вторичных (slave), синхронизируемых через **AXFR/IXFR**.", "<h3>Разрешение имён: рекурсивные и итеративные запросы</h3>", "- **Рекурсивный запрос**: клиент просит сервер «дай мне финальный ответ»; сервер сам обращается к корневым, TLD и авторитативным, собирает ответ и возвращает. Так работают **резолверы** ISP (8.8.8.8 Google, 1.1.1.1 Cloudflare, 77.88.8.8 Yandex.DNS).\n- **Итеративный запрос**: сервер возвращает ссылку «спроси у того-то»; клиент сам идёт дальше. Так общаются между собой авторитативные серверы.", "Пример разрешения `www.example.com`:\n1. Клиент → стаб-резолвер → ISP-резолвер.\n2. ISP-резолвер → root → «иди к TLD `.com`».\n3. ISP-резолвер → TLD `.com` → «иди к авторитативу example.com (NS-запись)».\n4. ISP-резолвер → авторитатив example.com → IP-адрес 93.184.216.34.\n5. ISP-резолвер кеширует и возвращает клиенту.", "<h3>Типы записей ресурсов (Resource Records, RR)</h3>", "| Тип | Назначение |\n|---|---|\n| A | IPv4-адрес домена |\n| AAAA | IPv6-адрес |\n| CNAME | каноническое имя (псевдоним) |\n| MX | почтовый сервер с приоритетом |\n| NS | авторитативный сервер зоны |\n| SOA | параметры зоны (Start of Authority): первичный NS, e-mail админа, серийный номер, refresh, retry, expire, minimum TTL |\n| PTR | обратное преобразование IP→имя (в зоне `in-addr.arpa` / `ip6.arpa`) |\n| TXT | произвольный текст; используется для SPF, DKIM, DMARC, верификации |\n| SRV | сервисная запись (хост:порт для конкретного сервиса, например `_sip._tcp`) |\n| CAA | Certificate Authority Authorization — какому CA разрешено выпускать сертификаты для этого домена |\n| TLSA | DANE — связка домена с TLS-сертификатом |\n| DNSKEY / DS / RRSIG / NSEC / NSEC3 | записи DNSSEC |\n| HTTPS / SVCB | новые записи для HTTP/3 и сервисов (RFC 9460) |", "Каждая запись имеет **TTL** — время жизни в кэше резолвера; уменьшение TTL ускоряет распространение изменений, но увеличивает нагрузку на авторитативные серверы.", "<h3>Транспорт DNS</h3>", "- Стандартно **UDP**, **порт 53**; короткие запросы и ответы (исторически до 512 байт).\n- **TCP/53** — для ответов больше 512 байт, для AXFR/IXFR (передача зон), при срабатывании TC-флага.\n- **DNS-over-TLS (DoT)**, TCP/853 (RFC 7858) — шифрование.\n- **DNS-over-HTTPS (DoH)**, HTTPS (RFC 8484) — шифрование + защита от блокировок.\n- **DNS-over-QUIC (DoQ)**, UDP/853 (RFC 9250) — современный.\n- **EDNS0** (RFC 6891) — расширение, позволяющее ответы > 512 байт по UDP.", "<h3>DNSSEC и безопасность</h3>", "Классический DNS уязвим к **подделке ответов** (cache poisoning, Kaminsky attack 2008). **DNSSEC** (DNS Security Extensions, RFC 4033–4035) добавляет цифровые подписи:\n- Зона подписывается **ZSK** (Zone Signing Key); каждая RR-set имеет **RRSIG**.\n- Открытые ключи зон публикуются в **DNSKEY**.\n- Цепочка доверия через **DS-записи** в родительской зоне.\n- **NSEC / NSEC3** — отрицательные ответы (доказательство несуществования имени).\n- Корневая зона подписана с 2010 г.", "Параллельно: **rate limiting**, **DNS Cookies** (RFC 7873), **QNAME minimization** (RFC 9156) против утечек, **Encrypted Client Hello (ECH)** против цензуры.", "<h3>Использование DNS в современной инфраструктуре</h3>", "- **CDN**: возврат разных A-записей в зависимости от местоположения клиента (geographical DNS).\n- **Anycast** root и TLD-серверов.\n- **Service discovery**: SRV, DNS-SD (mDNS).\n- **Email-аутентификация**: SPF, DKIM, DMARC в TXT.\n- **Health checks** и **load balancing** через короткие TTL."], "terms": [{"ru": "DNS", "en": "Domain Name System", "df": "глобальная иерархическая база имён"}, {"ru": "Доменное имя / FQDN", "en": "Fully Qualified Domain Name", "df": "полное имя с точкой в конце"}, {"ru": "RR", "en": "Resource Record", "df": "запись ресурса в DNS"}, {"ru": "TTL", "en": "Time To Live", "df": "время жизни кэшированной записи"}], "summary": ["**DNS** (Domain Name System, RFC 1034/1035, 1987) — глобальная распределённая иерархическая БД, имя ↔ IP и др. записи", "Хранит также MX (почта), TLSA/CAA (безопасность), SPF/DKIM/DMARC (аутентификация почты), SRV (сервисы)", "**Иерархия имён**: `.` (root) → **TLD** (`.com`/`.org`/`.ru` — generic/ccTLD/brand) → **SLD** (example) → subdomains", "**Корневые серверы** — 13 логических `a-m.root-servers.net`, физически — тысячи anycast-инстансов", "**TLD-серверы**: Verisign (.com), Координационный центр доменов .ru; **авторитативные** — у владельца домена", "**Зона** — единица делегирования; master + slaves, синхронизация **AXFR/IXFR**", "**Рекурсивный запрос**: резолвер ищет сам (8.8.8.8 Google, 1.1.1.1 Cloudflare, 77.88.8.8 Yandex)", "**Итеративный**: сервер возвращает ссылку «спроси у того-то»; так общаются авторитативы", "Пример: stub → ISP-резолвер → root → TLD `.com` → авторитатив example.com → IP → кэш", "**Типы RR**: **A** (IPv4), **AAAA** (IPv6), **CNAME** (alias), **MX** (mail+приоритет), **NS** (авторитатив), **SOA** (Start of Authority: первичный NS, refresh/retry/expire/min TTL)", "**PTR** (reverse, в `in-addr.arpa`/`ip6.arpa`), **TXT** (SPF/DKIM/DMARC/верификация), **SRV** (хост:порт сервиса), **CAA** (разрешённые CA), **TLSA** (DANE), **HTTPS/SVCB** (RFC 9460)", "Каждая запись имеет **TTL** — баланс свежести и нагрузки", "**Транспорт**: **UDP/53** (короткие, до 512Б); **TCP/53** (>512Б, AXFR, TC-флаг)", "Шифрованные: **DoT** TCP/853 (RFC 7858), **DoH** HTTPS (RFC 8484), **DoQ** UDP/853 (RFC 9250); **EDNS0** (RFC 6891) — ответы >512Б по UDP", "Уязвимость классики — **cache poisoning** (Kaminsky 2008)", "**DNSSEC** (RFC 4033-4035): подписи RR-set через **ZSK**, открытые ключи в **DNSKEY**, цепочка через **DS** в родительской зоне", "**NSEC/NSEC3** — отрицательные ответы; корневая зона подписана с 2010 г.", "Доп. защиты: rate limiting, DNS Cookies (RFC 7873), **QNAME minimization** (RFC 9156), Encrypted Client Hello", "Современное: geographical DNS для CDN, anycast root/TLD, service discovery (SRV, DNS-SD/mDNS), health checks через короткие TTL"]}, {"n": 49, "title": "Архитектура электронной почты.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Электронная почта** (electronic mail, email) — одно из первых и до сих пор наиболее широко используемых интернет-приложений, предлагающее асинхронный обмен текстовыми сообщениями с возможностью вложений. Архитектура почты — пример классической **многокомпонентной системы**, где разные функции выполняют разные программы: пользовательский клиент, передающие серверы, доставщик в ящик и сервер хранения. Современная экосистема стандартизирована серией RFC: RFC 5321 (SMTP), RFC 5322 (формат сообщения), RFC 2045–2049 (MIME), RFC 3501/9051 (IMAP), RFC 1939 (POP3), RFC 7208 (SPF), RFC 6376 (DKIM), RFC 7489 (DMARC).", "<h3>Базовые компоненты</h3>", "- **MUA / UA** (Mail User Agent, User Agent) — клиентская программа пользователя: Outlook, Thunderbird, Mail.app, K-9 Mail, веб-клиенты (Gmail, Mail.ru). Составление сообщений, чтение почты, поиск, фильтры.\n- **MSA** (Mail Submission Agent) — серверный компонент, принимающий **отправку** от UA (порт 587 с обязательной аутентификацией, RFC 6409).\n- **MTA** (Message Transfer Agent) — серверный компонент, **передающий почту между серверами** по SMTP (порт 25 между MTA). Примеры: Postfix, Exim, Sendmail, Microsoft Exchange.\n- **MDA** (Mail Delivery Agent) — кладёт принятое письмо в **почтовый ящик** конкретного пользователя: procmail, dovecot-lda, или встроенный в MTA.\n- **MS / MRA** (Mail Store / Mail Retrieval Agent) — сервер хранения и доступа: dovecot, Cyrus IMAP, Exchange. Клиенты забирают почту по **POP3** или **IMAP** (Q50).\n- **Smart host** — выделенный исходящий relay для домена.", "<h3>Путь письма (полный цикл)</h3>", "1. Пользователь пишет письмо в **MUA** Alice → MUA устанавливает TLS-соединение к **MSA** alice@example.com (587 STARTTLS) и аутентифицируется (SMTP AUTH, PLAIN/LOGIN поверх TLS).\n2. **MSA** проверяет SPF/DKIM/DMARC исходящего домена, помещает в очередь и **передаёт через DNS MX-запись** домена получателя в **MTA** bob@destination.com (25 SMTP, обычно с STARTTLS, MTA-STS, DANE для безопасности).\n3. Между MTA могут быть **промежуточные relay** (антиспам-шлюзы, корпоративные шлюзы): они проверяют контент, антивирус, добавляют **Received** заголовки.\n4. Принимающий **MTA destination.com** проверяет: SPF (разрешён ли IP-источник для домена From), DKIM (подпись DKIM-Signature), DMARC (политика домена), reputation, content filters.\n5. Прошедшее письмо передаётся **MDA** → раскладывается в **почтовый ящик** Боба (Maildir на ФС, либо в БД).\n6. Bob в любой удобный момент открывает **MUA**, тот по **IMAP/POP3** забирает или синхронизирует письмо с сервера.", "<h3>Формат сообщения (RFC 5322)</h3>", "Сообщение — текст ASCII (исходно 7-битный), состоит из **заголовка** + пустой строки + **тела**:", "```\nFrom: Alice <alice@example.com>\nTo: Bob <bob@destination.com>\nCc: charlie@destination.com\nSubject: Test mail\nDate: Tue, 14 May 2026 12:00:00 +0300\nMessage-ID: <random@example.com>\nReceived: from mail.example.com (...); ...\nMIME-Version: 1.0\nContent-Type: text/plain; charset=UTF-8", "Hello, Bob!\n```", "Стандартные поля:\n- **From / Sender / Reply-To / To / Cc / Bcc / Subject / Date / Message-ID** — основные.\n- **Received** — добавляется каждым MTA на пути (трассировка для диагностики).\n- **Return-Path** — envelope-отправитель из SMTP MAIL FROM.\n- **In-Reply-To / References** — для тредов.\n- **X-*** — пользовательские (исторически).\n- **DKIM-Signature, Authentication-Results** — аутентификация.", "**Envelope** (SMTP-уровень, `MAIL FROM` / `RCPT TO`) и **header From** — разные сущности; envelope используется SMTP, header — отображается пользователю.", "<h3>MIME — расширения для не-ASCII и вложений</h3>", "Исходный RFC 822 ограничивал контент 7-битным ASCII. **MIME** (Multipurpose Internet Mail Extensions, RFC 2045–2049) добавил:\n- **Content-Type** — MIME-тип (`text/plain; charset=UTF-8`, `image/jpeg`, `multipart/mixed`, `application/pdf`).\n- **Content-Transfer-Encoding** — кодировка: `7bit`, `8bit`, **base64** (двоичные данные → ASCII, +33% размер), **quoted-printable** (текст с не-ASCII символами с минимальным расширением).\n- **multipart/mixed** — несколько частей в одном письме (текст + вложения).\n- **multipart/alternative** — несколько форматов одного контента (text/plain + text/html).\n- **Content-Disposition** — `inline` или `attachment`.", "Заголовки с не-ASCII символами кодируются по **RFC 2047** (`=?UTF-8?B?...?=`).", "<h3>Хранение почты</h3>", "- **mbox** — все письма одного ящика в одном файле, разделённые `From `-строкой. Простой, но требует блокировки, проблемен с большим объёмом.\n- **Maildir** — каждое письмо в отдельном файле; директории `new/`, `cur/`, `tmp/`. Без блокировок, удобно для concurrent access.\n- **БД-хранилища** (Cyrus, Exchange, Gmail) — собственные форматы.", "<h3>Безопасность электронной почты</h3>", "Email спроектирован в эпоху доверенных сетей, поэтому современная безопасность — это «надстройка»:\n- **STARTTLS** — оппортунистическое шифрование SMTP.\n- **MTA-STS** (RFC 8461), **DANE/TLSA** (RFC 7672) — принудительный TLS.\n- **SPF** (Sender Policy Framework) — TXT-запись с разрешёнными IP-источниками.\n- **DKIM** (DomainKeys Identified Mail) — криптографическая подпись писем.\n- **DMARC** (Domain-based Message Authentication, Reporting, Conformance) — политика на основе SPF + DKIM + ARC.\n- **S/MIME** и **PGP/GPG** — end-to-end шифрование и подписи.\n- Антиспам: байесовские фильтры, SpamAssassin, reputation services, greylisting.", "<h3>Современные тенденции</h3>", "- Доминирование облачных провайдеров (Google Workspace, Microsoft 365).\n- Внутренние корпоративные шлюзы для DLP, антифишинга.\n- **JMAP** (RFC 8620) — современная альтернатива IMAP на JSON-RPC поверх HTTP.\n- Постепенный отказ от POP3 в пользу IMAP/JMAP."], "terms": [{"ru": "MUA / UA", "en": "Mail User Agent", "df": "почтовый клиент пользователя"}, {"ru": "MSA", "en": "Mail Submission Agent", "df": "серверная точка отправки (порт 587)"}, {"ru": "MTA", "en": "Message Transfer Agent", "df": "сервер передачи почты по SMTP"}, {"ru": "MDA", "en": "Mail Delivery Agent", "df": "программа доставки в ящик"}], "summary": ["**Электронная почта** — асинхронный обмен сообщениями; стандарты: RFC 5321 (SMTP), 5322 (формат), 2045-2049 (MIME), 9051 (IMAP), 1939 (POP3), 7208 (SPF), 6376 (DKIM), 7489 (DMARC)", "**MUA/UA** — клиент пользователя (Outlook, Thunderbird, Gmail web)", "**MSA** (Mail Submission Agent) — принимает отправку от UA, **порт 587** с обязательной аутентификацией (RFC 6409)", "**MTA** (Message Transfer Agent) — пересылает по SMTP **порт 25** между серверами; Postfix, Exim, Sendmail, Exchange", "**MDA** (Mail Delivery Agent) — кладёт письмо в ящик (procmail, dovecot-lda)", "**MS/MRA** — сервер хранения, доступ по **POP3/IMAP** (dovecot, Cyrus IMAP)", "**Путь письма**: MUA → MSA (587 STARTTLS + AUTH) → MTA получателя (25 через DNS MX, STARTTLS + MTA-STS/DANE) → [антиспам relay] → MDA → ящик → клиент по IMAP/POP3", "**Формат RFC 5322**: заголовок + пустая строка + тело (ASCII 7-bit исторически)", "Заголовки: **From / Sender / Reply-To / To / Cc / Bcc / Subject / Date / Message-ID**", "**Received** добавляется каждым MTA (трассировка); **Return-Path** = envelope MAIL FROM; **In-Reply-To / References** — треды; **DKIM-Signature, Authentication-Results**", "**Envelope** (SMTP, MAIL FROM/RCPT TO) ≠ **Header From** (отображается пользователю)", "**MIME** (RFC 2045-2049): **Content-Type** (`text/plain; charset=UTF-8`, `multipart/mixed`, `application/pdf`)", "**Content-Transfer-Encoding**: 7bit, 8bit, **base64** (+33%, бинарные), **quoted-printable** (текст с не-ASCII)", "**multipart/mixed** (текст+вложения), **multipart/alternative** (text/plain + text/html); Content-Disposition: inline/attachment", "Заголовки с не-ASCII — RFC 2047 (`=?UTF-8?B?...?=`)", "**Хранение**: **mbox** (один файл, разделитель `From `); **Maildir** (`new/cur/tmp/`, без блокировок); БД (Cyrus, Exchange, Gmail)", "**Безопасность**: STARTTLS (оппортунистический), **MTA-STS** (RFC 8461), **DANE/TLSA** (RFC 7672) — принудительный TLS", "**SPF** (TXT с разрешёнными IP), **DKIM** (подпись), **DMARC** (политика + ARC); **S/MIME** и **PGP/GPG** — end-to-end", "Антиспам: байесовские фильтры, SpamAssassin, reputation, greylisting; **JMAP** (RFC 8620) — современная альтернатива IMAP на JSON-RPC"]}, {"n": 50, "title": "SMTP, POP3, IMAP.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "Электронная почта обслуживается тремя ключевыми протоколами прикладного уровня: **SMTP** (Simple Mail Transfer Protocol) — для **передачи** почты от клиента к серверу и между серверами; **POP3** (Post Office Protocol v3) — простое **скачивание** писем с сервера; **IMAP** (Internet Message Access Protocol) — синхронизированное **управление** почтой на сервере с нескольких устройств. SMTP — «push»-протокол (отправитель толкает письмо), POP3/IMAP — «pull» (клиент забирает). Все три — текстовые, command-response, поверх TCP.", "<h3>SMTP — Simple Mail Transfer Protocol</h3>", "RFC 5321 (Extended SMTP, ESMTP — расширенная версия RFC 2821). Используется в двух ролях:", "- **Submission** (MUA → MSA): порт **587** (RFC 6409), обязательна аутентификация (SMTP AUTH с SASL: PLAIN/LOGIN/CRAM-MD5/OAUTHBEARER, поверх STARTTLS).\n- **Relay** (MTA → MTA): порт **25**, без обязательной аутентификации (но всё чаще обязательный TLS + SPF/DKIM/DMARC проверки).\n- Устаревший: порт **465** для прямого SMTPS (deprecated в RFC 2487, восстановлен в RFC 8314 как Submissions).", "Диалог SMTP (упрощённо):\n```\nS: 220 mail.example.com ESMTP Postfix\nC: EHLO client.example.com\nS: 250-mail.example.com Hello, [PIPELINING/SIZE/STARTTLS/AUTH PLAIN LOGIN/8BITMIME...]\nC: STARTTLS\nS: 220 Ready to start TLS\n... TLS handshake ...\nC: EHLO client.example.com\nC: AUTH PLAIN <base64-encoded credentials>\nS: 235 Authentication successful\nC: MAIL FROM:<alice@example.com>\nS: 250 OK\nC: RCPT TO:<bob@destination.com>\nS: 250 OK\nC: DATA\nS: 354 End data with <CR><LF>.<CR><LF>\nC: From: ...\nC: To: ...\nC: Subject: ...\nC: \nC: Hello, Bob!\nC: .\nS: 250 OK: queued as ABC123\nC: QUIT\nS: 221 Bye\n```", "Ключевые команды: `HELO/EHLO`, `STARTTLS`, `AUTH`, `MAIL FROM`, `RCPT TO`, `DATA`, `RSET`, `NOOP`, `QUIT`, `VRFY`, `EXPN` (последние две обычно отключены ради безопасности).", "Расширения ESMTP: `8BITMIME`, `SIZE`, `PIPELINING`, `CHUNKING/BDAT`, `STARTTLS`, `AUTH`, `DSN` (Delivery Status Notification), `SMTPUTF8` (международные адреса).", "Коды ответов:\n- **2xx** — успех (250 OK, 354 Start mail input).\n- **3xx** — промежуточный (требуется ввод).\n- **4xx** — временная ошибка, попробуйте позже (Greylisting часто возвращает 451).\n- **5xx** — постоянная ошибка (550 User unknown).", "<h3>POP3 — Post Office Protocol v3</h3>", "RFC 1939. Простейший «забрал-удалил». Порт **110** (TLS на 995 — POP3S, RFC 8314).", "Команды (минимальный набор):\n- `USER username`, `PASS password` (или `AUTH`, или `APOP`).\n- `STAT` — кол-во и общий размер сообщений.\n- `LIST [n]` — список сообщений.\n- `RETR n` — скачать сообщение.\n- `DELE n` — пометить на удаление.\n- `RSET` — отменить пометки.\n- `TOP n l` — заголовки и первые l строк.\n- `UIDL` — уникальные идентификаторы (для «leave on server»).\n- `QUIT` — переход в UPDATE-фазу, физическое удаление помеченных.", "Модель работы — три фазы: AUTHORIZATION → TRANSACTION → UPDATE. По умолчанию письма удаляются с сервера после скачивания, что плохо для multi-device.", "Минусы: нет папок, поиска, флагов прочтено/удалено, push-уведомлений. Сегодня вытесняется IMAP/JMAP.", "<h3>IMAP — Internet Message Access Protocol</h3>", "RFC 9051 (IMAP4rev2). Существенно сложнее POP3, но обеспечивает **серверное хранилище** и синхронизацию. Порт **143** (TLS на 993 — IMAPS).", "Возможности:\n- Письма остаются на сервере; клиент работает с ним как с **удалённой файловой системой**.\n- **Папки** (mailboxes/folders): INBOX, Sent, Drafts, Trash, пользовательские.\n- **Флаги**: `\\Seen`, `\\Answered`, `\\Flagged`, `\\Deleted`, `\\Draft`, custom keywords.\n- **Селективная загрузка**: скачать только заголовки или только нужную часть multipart (например, без вложения).\n- **Серверный поиск** (SEARCH FROM, SUBJECT, BODY, SINCE).\n- **IDLE** (RFC 2177) — push-уведомления, сервер сам шлёт обновления.\n- **CONDSTORE/QRESYNC** — эффективная синхронизация.\n- **MOVE** — атомарное перемещение между папками.\n- **Подключение нескольких устройств**, синхронное состояние.", "Команды (теги-команды-параметры):\n```\na001 LOGIN user pass\na002 SELECT INBOX\na003 FETCH 1:10 (UID FLAGS ENVELOPE BODY[HEADER])\na004 SEARCH UNSEEN\na005 STORE 5 +FLAGS (\\Seen)\na006 IDLE\n+ idling\n... server pushes EXISTS, EXPUNGE ...\nDONE\na007 LOGOUT\n```", "<h3>Сравнение протоколов</h3>", "| Свойство | POP3 | IMAP |\n|---|---|---|\n| Письма после скачивания | удаляются | остаются |\n| Папки | нет | да |\n| Поиск на сервере | нет | да |\n| Multi-device | плохо | хорошо |\n| Push (IDLE) | нет | да |\n| Состояние (флаги) | нет | да |\n| Сложность реализации | низкая | высокая |\n| Сетевой трафик | минимальный | больше |", "<h3>Схемы доставки</h3>", "1. **Прямая (одноуровневая)**: MUA → MSA → MTA получателя → MS → IMAP/POP3 → MUA получателя.\n2. **Через антиспам-шлюз**: добавляется промежуточный MTA на входе или выходе.\n3. **Корпоративная**: множество MTA, релеи, content gateway, шифрование, DLP.", "<h3>Защита соединений</h3>", "- **STARTTLS** (RFC 3207 для SMTP, RFC 2595 для IMAP/POP) — апгрейд открытого соединения до TLS.\n- **Implicit TLS** — сразу TLS на специальных портах: **Submissions 465**, **IMAPS 993**, **POP3S 995** (рекомендуется в RFC 8314).\n- **MTA-STS** и **DANE/TLSA** — принудительное использование TLS на MTA-уровне.", "<h3>Современные альтернативы</h3>", "- **JMAP** (RFC 8620, 2019) — JSON-RPC поверх HTTPS, объединяющее IMAP, контакты, календарь. Быстрее, проще, лучше для мобильных.\n- Web-интерфейсы Gmail/Outlook — собственные API, не IMAP."], "terms": [{"ru": "SMTP", "en": "RFC 5321", "df": "протокол отправки и ретрансляции почты"}, {"ru": "POP3", "en": "RFC 1939", "df": "простой протокол получения с удалением"}, {"ru": "IMAP / IMAP4rev2", "en": "RFC 9051", "df": "продвинутый протокол управления почтой на сервере"}, {"ru": "DSN", "en": "Delivery Status Notification", "df": "уведомление о статусе доставки"}], "summary": ["Три ключевых протокола: **SMTP** push (отправитель толкает); **POP3 и IMAP** pull (клиент забирает); все три текстовые, command-response, поверх TCP", "**SMTP** (RFC 5321, ESMTP) — две роли:", "**Submission** (MUA→MSA): **порт 587** (RFC 6409), обязательная **AUTH** (SASL: PLAIN/LOGIN/CRAM-MD5/OAUTHBEARER) под STARTTLS", "**Relay** (MTA→MTA): **порт 25**, без обязательной AUTH (но TLS + SPF/DKIM/DMARC); порт **465** = SMTPS/Submissions (RFC 8314)", "**Команды SMTP**: `EHLO`, `STARTTLS`, `AUTH`, **`MAIL FROM`**, **`RCPT TO`**, **`DATA`** (до `<CR><LF>.<CR><LF>`), `RSET`, `QUIT`; `VRFY`/`EXPN` отключают", "**Расширения ESMTP**: 8BITMIME, SIZE, PIPELINING, CHUNKING/BDAT, STARTTLS, AUTH, **DSN** (Delivery Status), SMTPUTF8", "**Коды**: **2xx** успех (250 OK, 354 Start data); 3xx промежуточный (331); **4xx** временно (451 greylisting); **5xx** постоянно (550 User unknown)", "**POP3** (RFC 1939) — простой «забрал-удалил»; **порт 110** (TLS на **995** — POP3S)", "**Команды POP3**: USER/PASS, STAT, LIST, **RETR n** (скачать), **DELE n** (на удаление), RSET, TOP, UIDL (UID для leave-on-server), QUIT", "Три фазы POP3: AUTHORIZATION → TRANSACTION → UPDATE; по умолчанию удаляет → плохо для multi-device", "Минусы POP3: нет папок, поиска, флагов, push; вытесняется IMAP/JMAP", "**IMAP** (RFC 9051 IMAP4rev2) — серверное хранение; **порт 143** (TLS на **993** — IMAPS)", "Возможности IMAP: **папки** (INBOX/Sent/Drafts/Trash), **флаги** (\\Seen/\\Answered/\\Flagged/\\Deleted/\\Draft), селективная загрузка частей MIME, серверный SEARCH", "**IDLE** (RFC 2177) — push-уведомления; **CONDSTORE/QRESYNC** — эффективная синхронизация; **MOVE** атомарный; multi-device синхронно", "Команды IMAP: tag + command — LOGIN, SELECT, **FETCH** (UID, FLAGS, ENVELOPE, BODY), SEARCH, **STORE** (+/-FLAGS), MOVE, IDLE, LOGOUT", "**Сравнение POP3 vs IMAP**: удаление/остаются; нет/есть папки; нет/есть search; плохо/хорошо для multi-device; нет/есть push; нет/есть флаги", "Защита: **STARTTLS** (RFC 3207 SMTP, RFC 2595 IMAP/POP) — апгрейд; **Implicit TLS** на 465/993/995; **MTA-STS** + **DANE** обязательные TLS", "**JMAP** (RFC 8620, 2019) — JSON-RPC поверх HTTPS, объединяет IMAP+контакты+календарь; быстрее, проще, для мобильных"]}, {"n": 51, "title": "WWW. HTTP.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**WWW** (World Wide Web) — глобальная распределённая гипертекстовая система, созданная Тимом Бернерсом-Ли в CERN (1989–1991) и ставшая «убийственным приложением» Интернета. WWW определяется тремя китами: **URI/URL** (унифицированная адресация ресурсов), **HTML** (язык разметки документов с гиперссылками) и **HTTP** (протокол передачи гипертекста). Современный Web эволюционировал от простых статических страниц к интерактивным приложениям (SPA), API (REST/GraphQL/gRPC-Web), мультимедиа-стримингу, и фактически стал универсальной платформой для большинства цифровых сервисов.", "<h3>Архитектура WWW</h3>", "Классическая **клиент-серверная** модель:\n- **Клиент** — **браузер** (Chrome, Firefox, Safari, Edge), реже мобильное приложение или CLI-инструмент (curl, wget). Запрашивает ресурсы по URL, отрисовывает HTML/CSS, исполняет JavaScript, обрабатывает события.\n- **Сервер** — веб-сервер (nginx, Apache, IIS, Caddy) либо application framework (Node.js, Django, Flask, Spring) принимает HTTP-запросы, отдаёт статику или генерирует динамический контент.\n- Между ними — Интернет с CDN, proxies, load balancers, WAF.", "**URL/URI** (RFC 3986): `scheme://[user:pass@]host[:port]/path?query#fragment`. Например: `https://example.com:443/blog/post?id=42#comments`.", "**HTML** (HyperText Markup Language) — текстовая декларативная разметка с тегами; современный HTML5 + CSS3 + JavaScript ES202x составляют веб-платформу.", "<h3>Типы веб-страниц</h3>", "- **Статические** — готовые HTML-файлы на диске, отдаются без обработки. Быстро, кешируется, идеально для контента.\n- **Серверно-генерируемые** (SSR — Server-Side Rendering) — PHP/Node/Python/Ruby формирует HTML под запрос (БД, шаблоны). Wordpress, классический Django.\n- **Клиентско-генерируемые** (CSR — Client-Side Rendering, SPA — Single-Page Application) — сервер отдаёт минимальный HTML и большой JS-бандл; всё рендерится в браузере по AJAX-запросам к API (React, Vue, Angular).\n- **Гибридные** (Next.js, Nuxt, SvelteKit) — SSR при первом запросе, SPA-навигация далее.\n- **PWA** (Progressive Web Apps) — веб-приложения с offline-режимом, push-уведомлениями.", "<h3>HTTP — Hypertext Transfer Protocol</h3>", "Текстовый stateless протокол запрос-ответ поверх TCP (HTTP/1.x, /2) или поверх QUIC (HTTP/3). Порты **80** (HTTP) / **443** (HTTPS).", "**Структура запроса**:\n```\nGET /index.html HTTP/1.1\nHost: example.com\nUser-Agent: Mozilla/5.0 ...\nAccept: text/html,application/xhtml+xml\nAccept-Language: ru,en\nAccept-Encoding: gzip, br\nCookie: session=abc123\n```", "**Структура ответа**:\n```\nHTTP/1.1 200 OK\nDate: Tue, 14 May 2026 12:00:00 GMT\nServer: nginx/1.24\nContent-Type: text/html; charset=UTF-8\nContent-Length: 1234\nSet-Cookie: session=abc123; Secure; HttpOnly\nCache-Control: max-age=3600", "<html>...</html>\n```", "**Методы**: GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS, TRACE, CONNECT (для туннелирования через прокси).", "**Коды статуса**:\n- **1xx** — информация (100 Continue, 101 Switching Protocols).\n- **2xx** — успех (200 OK, 201 Created, 204 No Content, 206 Partial Content).\n- **3xx** — перенаправление (301 Moved Permanently, 302 Found, 304 Not Modified, 307 Temporary Redirect, 308 Permanent Redirect).\n- **4xx** — ошибка клиента (400 Bad Request, 401 Unauthorized, 403 Forbidden, 404 Not Found, 408 Timeout, 429 Too Many Requests).\n- **5xx** — ошибка сервера (500 Internal Server Error, 502 Bad Gateway, 503 Service Unavailable, 504 Gateway Timeout).", "**Ключевые заголовки**: `Content-Type`, `Content-Length`, `Cache-Control`, `Cookie`/`Set-Cookie`, `Authorization`, `ETag`/`If-None-Match`, `Range`, `Accept-Encoding`, `Content-Encoding`, `User-Agent`, `Referer`, `Origin`, `Host`.", "<h3>Версии HTTP</h3>", "| Версия | Год | Транспорт | Ключевые особенности |\n|---|---|---|---|\n| HTTP/0.9 | 1991 | TCP | только GET, без заголовков |\n| HTTP/1.0 (RFC 1945) | 1996 | TCP | заголовки, статусы, новое соединение на каждый запрос |\n| HTTP/1.1 (RFC 7230–7235, 9110–9112) | 1997/2014/2022 | TCP | Keep-Alive (persistent), Host header (для virtual hosting), pipelining, chunked transfer, Range |\n| HTTP/2 (RFC 9113) | 2015 | TCP+TLS | бинарный фрейминг, мультиплексирование потоков, **HPACK** сжатие заголовков, Server Push |\n| HTTP/3 (RFC 9114) | 2022 | QUIC (UDP+TLS 1.3) | устраняет **HOL blocking** на уровне потоков, 0/1-RTT handshake, миграция соединения |", "**Head-of-Line (HOL) blocking** в HTTP/1.1 — pipelined запросы блокируются медленным ответом; в HTTP/2 — на TCP-уровне (потеря пакета блокирует все потоки); в HTTP/3 — устранён, так как QUIC мультиплексирует на уровне UDP-датаграмм.", "**Server Push** в HTTP/2 (на практике отключён в браузерах из-за неэффективности).", "<h3>REST и веб-API</h3>", "**REST** (Representational State Transfer, Roy Fielding 2000) — архитектурный стиль:\n- Ресурсы идентифицируются URL.\n- Состояние ресурса передаётся представлением (JSON, XML).\n- HTTP-методы — действия: GET (read), POST (create), PUT (update full), PATCH (partial), DELETE (remove).\n- **Stateless** — каждый запрос самодостаточен.\n- **Cacheable** — ответы могут кешироваться.\n- **HATEOAS** — гипермедиа как двигатель состояния (редко на практике).", "Альтернативы REST: **SOAP** (XML-based, тяжёлый), **gRPC** (бинарный, HTTP/2), **GraphQL** (Facebook 2015, query language), **JSON-RPC**.", "<h3>Cookies, сессии, аутентификация</h3>", "HTTP без состояния, поэтому сессии хранятся через:\n- **Cookies** (RFC 6265) — серверный `Set-Cookie`, клиент шлёт обратно `Cookie`. Атрибуты `Secure`, `HttpOnly`, `SameSite` для безопасности.\n- **JWT** — самоподписанные токены в заголовке Authorization.\n- **OAuth 2.0 / OIDC** — делегированная авторизация.\n- **Basic / Digest / Bearer / mTLS** — схемы аутентификации.", "<h3>Веб-поиск</h3>", "- **Краулеры (spiders)** обходят страницы по ссылкам, уважая `robots.txt`.\n- Строится **инвертированный индекс** (слово → список документов).\n- Ранжирование: **PageRank** (Brin & Page 1998) — оценка важности по графу ссылок; современные алгоритмы добавляют сотни сигналов и ML.\n- **SEO** (Search Engine Optimization) — практики повышения видимости.", "<h3>Современные дополнения веба</h3>", "- **WebSocket** (RFC 6455) — двусторонний канал поверх HTTP-апгрейда.\n- **Server-Sent Events** (SSE) — однонаправленный push.\n- **WebRTC** — браузерные P2P для видеоконференций.\n- **WebAssembly** (WASM) — низкоуровневый код в браузере, рядом с JS.\n- **HTTP/3** + **TLS 1.3** + **0-RTT** — максимально быстрый старт страницы."], "terms": [{"ru": "WWW", "en": "World Wide Web", "df": "глобальная гипертекстовая система"}, {"ru": "URI / URL / URN", "en": "Uniform Resource Identifier / Locator / Name", "df": "адрес ресурса"}, {"ru": "HTML", "en": "HyperText Markup Language", "df": "язык разметки"}, {"ru": "CSS", "en": "Cascading Style Sheets", "df": "таблицы стилей"}, {"ru": "HOL Blocking", "en": "Head-Of-Line", "df": "блокировка очереди из-за одного потерянного пакета"}, {"ru": "CORS", "en": "Cross-Origin Resource Sharing", "df": "политика разделения origin"}], "summary": ["**WWW** (Тим Бернерс-Ли, CERN, 1989-91) — три кита: **URI/URL** + **HTML** + **HTTP**", "Клиент-серверная архитектура: **браузер** ↔ Интернет (CDN/proxies/LB/WAF) ↔ **веб-сервер** (nginx, Apache, IIS, Caddy) / framework (Node/Django/Spring)", "**URL/URI** (RFC 3986): `scheme://[user:pass@]host[:port]/path?query#fragment`", "**HTML5 + CSS3 + JavaScript ES202x** — современная веб-платформа", "**Типы страниц**: **статические** (готовый HTML); **SSR** (Wordpress, Django); **CSR/SPA** (React/Vue/Angular, AJAX к API); **гибридные** (Next.js/Nuxt); **PWA**", "**HTTP** — текстовый stateless запрос-ответ; HTTP/1.x и /2 поверх **TCP**, HTTP/3 поверх **QUIC**; порты **HTTP=80, HTTPS=443**", "**Методы**: **GET**, **POST**, **PUT**, **DELETE**, PATCH, HEAD, OPTIONS, TRACE, CONNECT (туннелирование)", "**Коды**: **1xx** инфо (101 Switching); **2xx** успех (200 OK, 201 Created, 204, 206 Partial); **3xx** redirect (301/302/304/307/308)", "**4xx** клиент (**400** Bad Request, **401** Unauthorized, **403** Forbidden, **404** Not Found, **429** Too Many); **5xx** сервер (**500** Internal, **502** Bad Gateway, 503, 504)", "Заголовки: Content-Type, Content-Length, Cache-Control, **Cookie/Set-Cookie**, Authorization, **ETag/If-None-Match**, Range, Accept-Encoding, Host", "**Версии HTTP**: 0.9 (1991), **1.0** (RFC 1945, новое соед. на запрос), **1.1** (Keep-Alive, Host для virtual hosting, pipelining, chunked, Range)", "**HTTP/2** (RFC 9113, 2015) — TCP+TLS, бинарный фрейминг, **мультиплексирование потоков**, **HPACK** сжатие заголовков, Server Push (отключён)", "**HTTP/3** (RFC 9114, 2022) — поверх **QUIC** (UDP+TLS 1.3); устраняет **HOL blocking** на L4, **0/1-RTT** handshake, миграция соединения", "**REST** (Fielding 2000): ресурсы по URL, представления (JSON/XML), HTTP-методы как действия; stateless, cacheable, HATEOAS (редко)", "Альтернативы REST: **SOAP** (XML-based, тяжёлый), **gRPC** (бинарный, HTTP/2 + ProtoBuf), **GraphQL** (Facebook 2015), **JSON-RPC**", "**Cookies** (RFC 6265): Set-Cookie от сервера → Cookie от клиента; атрибуты **Secure**, **HttpOnly**, **SameSite**", "Аутентификация: **JWT** в Authorization; **OAuth 2.0 / OIDC**; Basic/Digest/Bearer/mTLS", "**Веб-поиск**: краулеры (по `robots.txt`) → **инвертированный индекс** → **PageRank** (Brin & Page 1998) + ML-сигналы", "Современные API браузера: **WebSocket** (RFC 6455), **SSE** (Server-Sent Events), **WebRTC** (P2P видео), **WebAssembly** (WASM); **CORS** для cross-origin"]}, {"n": 52, "title": "CDN. P2P.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "Современный Интернет передаёт огромные объёмы контента — потокового видео (Netflix, YouTube — более 60% трафика), обновлений ПО, веб-страниц с тяжёлыми ассетами, файлов. Доставлять всё это с одного «origin» сервера для миллионов клиентов по всему миру невозможно физически (полоса, задержка, отказоустойчивость). Решения — **CDN** (Content Delivery Network), где контент реплицируется на распределённую сеть **edge-серверов** ближе к пользователям, и **P2P** (Peer-to-Peer), где сами пользователи раздают контент друг другу. Обе технологии радикально снизили стоимость доставки и сделали возможным современный медиа-Интернет.", "<h3>Server Farm и Load Balancer</h3>", "Базовая ступень масштабирования — **серверная ферма**:\n- Кластер идентичных серверов, обслуживающих один сервис.\n- Перед ними — **load balancer** (NGINX, HAProxy, AWS ALB, F5 BIG-IP), распределяющий запросы по **алгоритмам**: Round Robin, Least Connections, Weighted, IP-Hash, Least Response Time.\n- **L4-балансировщик** (TCP/UDP уровень, например LVS) пересылает пакеты по 4-кортежу.\n- **L7-балансировщик** анализирует HTTP-заголовки, может маршрутизировать по URL/cookie, обрывать TLS.\n- **Health checks** автоматически выводят неработающие узлы.\n- Дополняется **горизонтальным шардингом** баз данных, **stateless**-приложениями, кешированием в Memcached/Redis.", "Серверная ферма решает масштаб **в одном дата-центре**, но не помогает с глобальной задержкой и пиковой нагрузкой.", "<h3>Web Proxy и кеширование</h3>", "**Веб-прокси** — промежуточный сервер между клиентами и Интернетом:\n- **Forward proxy** (Squid) — на стороне корпоративной сети, кеширует ответы для общих ресурсов, фильтрует трафик.\n- **Reverse proxy** (NGINX перед origin) — на стороне сервиса, кеширует ответы, разгружая origin.\n- **Cache-Control** заголовки (`max-age`, `s-maxage`, `public/private`, `no-store`) и **ETag/Last-Modified** для условных запросов определяют поведение кеша.", "<h3>CDN — Content Delivery Network</h3>", "**CDN** — глобальная иерархия кеширующих edge-серверов, размещённых в десятках/сотнях **PoP** (Points of Presence) по всему миру, обычно непосредственно на IXP и в дата-центрах операторов. Цели:\n- **Низкая задержка** доставки (физически ближе к пользователю).\n- **Высокая пропускная способность** (суммарно терабиты/с).\n- **Защита origin** от пиков и DDoS.\n- **Гибкость** (edge computing, A/B, security headers).", "Принцип:\n- Контент **реплицируется**/кешируется на edge.\n- При запросе клиента **DNS** (на основе геолокации и BGP-метрик) или **anycast** направляет к ближайшему PoP.\n- Edge либо отдаёт из кеша, либо запрашивает у origin и кеширует.\n- **Cache invalidation** через API CDN или короткие TTL.", "Архитектурно CDN бывают:\n- **Pull CDN** — кеширует по запросу (Cloudflare, default).\n- **Push CDN** — контент загружается заранее (для статичных сайтов, S3 + CloudFront).", "Примеры: **Akamai** (старейший, корпоративный), **Cloudflare** (массовый, anycast), **Amazon CloudFront**, **Google CDN**, **Fastly** (edge VCL/WASM), **Bunny.net**, **CDN77**, **Selectel** (РФ), **VK CDN**.", "CDN сегодня — **полноценная edge-платформа**: TLS termination, WAF, DDoS-mitigation, Image Optimization, video streaming (HLS/DASH с ABR — Q53), Edge Workers (Cloudflare Workers, AWS Lambda@Edge, Fastly Compute@Edge).", "<h3>P2P — одноранговые сети</h3>", "В **P2P** (Peer-to-Peer) архитектуре нет фиксированного сервера: каждый узел («пир», peer) одновременно — клиент и сервер, потребитель и поставщик ресурса. Свойства:\n- **Масштабируемость**: пропускная способность системы растёт с числом участников (каждый новый peer приносит свою upload-bandwidth).\n- **Отказоустойчивость**: исчезновение узлов не «убивает» систему.\n- **Цена**: владельцу контента не нужно платить за серверный трафик.\n- **Сложности**: NAT, изменчивость пиров (churn), доверие, поиск контента.", "Эволюция P2P:\n- **Napster** (1999) — центральный индекс + P2P-передача файлов. Закрыт по суду.\n- **Gnutella** (2000) — полностью децентрализованный поиск через flooding запросов.\n- **FastTrack** (Kazaa) — гибрид с supernodes.\n- **eDonkey/eMule** — хеш-идентификаторы.\n- **BitTorrent** (Bram Cohen 2001) — доминирующий, идея tit-for-tat и chunks.\n- **Skype** (исторически) — P2P-VoIP с supernodes.\n- **IPFS** (InterPlanetary File System) — content-addressable распределённое хранилище.\n- Современно: **WebTorrent** (для браузеров), **libp2p** (стек для блокчейнов), **Hypercore** (Beaker Browser).", "<h3>BitTorrent в деталях</h3>", "Идея:\n- Файл разбивается на **piece**'ы фиксированного размера (обычно 256 КБ – 2 МБ); каждый piece хешируется SHA-1; список хешей — в **.torrent**-файле или magnet-link.\n- **Tracker** (или DHT) ведёт список пиров для каждого торрента.\n- Клиент подключается к нескольким пирам параллельно, обменивается информацией о доступных pieces (bitfield), запрашивает недостающие.\n- Стратегия **rarest-first** — приоритет редким piece'ам; **tit-for-tat** — взаимные обмены; **optimistic unchoking** — пробные раздачи незнакомым пирам.", "Современные расширения:\n- **DHT** (Distributed Hash Table, Kademlia) — поиск пиров без центрального трекера.\n- **Peer Exchange (PEX)** — пиры обмениваются списками друг друга.\n- **Magnet-link** — URI с info-hash, не нужен .torrent-файл.\n- **uTP** — congestion-control с приоритетом для других соединений.\n- **WebSeed** (HTTP fallback).", "<h3>CDN vs P2P</h3>", "| Свойство | CDN | P2P |\n|---|---|---|\n| Управление | централизованное | распределённое |\n| Гарантии | SLA, надёжность | best-effort |\n| Стоимость для владельца | подписка | минимальная (сами пиры) |\n| Подходит для | live, premium video, веб | большие статические файлы, обновления |\n| Контроль контента | да | сложно |\n| Защита от пиратства | сильная | слабая |", "В реальности они **дополняют** друг друга: например, Spotify исторически комбинировал CDN и P2P для уменьшения нагрузки."], "terms": [{"ru": "CDN", "en": "Content Delivery Network", "df": "сеть доставки контента"}, {"ru": "Edge Server / PoP", "en": "Point of Presence", "df": "граничный сервер CDN"}, {"ru": "P2P", "en": "Peer-to-Peer", "df": "одноранговая (пиринговая) сеть"}, {"ru": "DHT", "en": "Distributed Hash Table", "df": "распределённая хэш-таблица для поиска пиров"}], "summary": ["**Server Farm** — кластер серверов + **Load Balancer** (NGINX/HAProxy/AWS ALB/F5)", "Алгоритмы LB: Round Robin, Least Connections, Weighted, IP-Hash, Least Response Time", "**L4-балансировщик** (TCP/UDP, LVS) — по 4-кортежу; **L7** — по HTTP-заголовкам, URL, cookie, TLS termination", "Health checks, шардинг БД, stateless apps, кэширование Memcached/Redis; ферма решает scale в одном ДЦ, не глобально", "**Web Proxy**: **Forward proxy** (Squid в корп. сети, фильтрация); **Reverse proxy** (NGINX перед origin, защита/кэш)", "**Cache-Control** (max-age, s-maxage, public/private, no-store) + **ETag/Last-Modified** — управление кэшем", "**CDN** (Content Delivery Network) — иерархия **edge-серверов** в десятках/сотнях **PoP** (Points of Presence), часто на IXP", "Цели CDN: низкая задержка, terabit-полоса, защита origin от пиков/DDoS, edge computing/A/B", "**Принцип**: контент реплицируется на edge; **DNS** (geo+BGP) или **anycast** направляет к ближайшему PoP; cache miss → origin", "**Pull CDN** (по запросу, default Cloudflare) vs **Push CDN** (заранее, S3 + CloudFront)", "Примеры: **Akamai** (старейший), **Cloudflare** (anycast), Amazon CloudFront, Google CDN, Fastly (VCL/WASM), Bunny.net, Selectel/VK CDN (РФ)", "Современный CDN = edge-платформа: TLS termination, **WAF**, DDoS-mitigation, Image Optimization, HLS/DASH streaming, **Edge Workers** (Cloudflare Workers, Lambda@Edge)", "**P2P** (Peer-to-Peer): каждый узел = клиент + сервер; пропускная способность **растёт с числом участников**; нет фиксированного сервера", "Свойства: масштабируемость, отказоустойчивость, бесплатно для владельца контента; сложности — NAT, churn (изменчивость), доверие, поиск", "Эволюция P2P: **Napster** (1999, центральный индекс) → **Gnutella** (flooding) → FastTrack (Kazaa, supernodes) → eDonkey/eMule → **BitTorrent** (Cohen 2001)", "**BitTorrent**: файл → **piece**ы (256 КБ – 2 МБ, SHA-1); .torrent или magnet → **tracker/DHT** → пиры → bitfield + запросы", "Стратегии: **rarest-first**, **tit-for-tat**, **optimistic unchoking** для незнакомцев", "Расширения: **DHT** (Kademlia, без трекера), Peer Exchange (PEX), **Magnet-link** (info-hash без .torrent), **uTP** (congestion-aware), WebSeed", "Современные P2P: **IPFS** (content-addressable), **WebTorrent**, **libp2p** (блокчейн), Hypercore", "**CDN vs P2P**: централизованное/распределённое; SLA/best-effort; подписка/бесплатно; live-video/большие файлы; контроль/слабый. Часто дополняют друг друга (Spotify исторически)"]}, {"n": 53, "title": "Цифровое аудио и видео.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "Цифровое **аудио и видео** — основа современного интернет-трафика (60–80% по объёму). Передача мультимедиа отличается от обычных данных требованиями: высокая пропускная способность, низкая задержка для интерактивных сценариев, устойчивость к потерям без повторной передачи (потерянный кадр уже не нужен через 100 мс), массовость аудитории (один live-стрим — миллионы зрителей). Это породило **специальные протоколы** (RTP, SRTP, WebRTC), **алгоритмы сжатия** (кодеки: H.264, H.265, AV1, AAC, Opus) и **методы доставки** (HLS, MPEG-DASH с ABR).", "<h3>Цифровое аудио</h3>", "- **PCM** (Pulse Code Modulation) — базовая дискретизация: частота дискретизации × разрядность × каналы.\n  - Телефонное качество: 8 000 Гц × 8 бит = 64 кбит/с (G.711).\n  - CD: 44 100 Гц × 16 бит × 2 = **1,411 Мбит/с**.\n  - Hi-Res: 96/192 кГц × 24 бит.\n- **Кодеки с потерями** (lossy):\n  - **MP3** (MPEG-1 Layer 3) — исторический стандарт, 96–320 кбит/с.\n  - **AAC** (Advanced Audio Coding) — в iTunes, YouTube, потоковом радио; лучше MP3 при той же скорости.\n  - **Opus** (RFC 6716) — оптимизирован под VoIP и стриминг, 6–512 кбит/с, переменный, разработан Xiph.Org. WebRTC, Discord, YouTube Live.\n  - **G.722 / G.729 / AMR / AMR-WB** — VoIP-кодеки в сотовой связи.\n- **Lossless**: FLAC, ALAC, WavPack — без потерь, сжатие ×0,5–0,7.", "<h3>Цифровое видео</h3>", "Видео — последовательность **кадров** (frames), обычно 24–60 fps. Сырое HD-видео 1920×1080 × 24 бит × 30 fps ≈ 1,5 Гбит/с — компрессия обязательна.", "**Кодеки**:\n- **H.264 / AVC** (MPEG-4 Part 10, 2003) — самый распространённый, поддерживается всеми устройствами; типичные битрейты 1–10 Мбит/с для HD.\n- **H.265 / HEVC** (2013) — в 2 раза эффективнее H.264, требует лицензий; используется в 4K-стриминге.\n- **VP9** (Google) — открытый аналог HEVC, YouTube.\n- **AV1** (AOMedia 2018) — открытый и без роялти, ещё на 30% эффективнее HEVC; Netflix, YouTube, Twitch.\n- **H.266 / VVC** (2020), **AV2** — поколения следующего уровня.", "**Типы кадров** в современных кодеках:\n- **I-кадр (Intra-coded)** — ключевой, кодируется самостоятельно (как JPEG); полностью восстановим без других кадров. Большой размер.\n- **P-кадр (Predicted)** — предсказан из предыдущего I/P; кодируются только различия.\n- **B-кадр (Bidirectional)** — предсказан из обоих соседей (предыдущего и следующего); самый компактный, но добавляет задержку.", "Группа кадров между двумя I-кадрами — **GOP** (Group of Pictures); короткие GOP лучше для seek, длинные — для эффективности сжатия.", "Контейнеры: **MP4** (ISOBMFF), **MKV**, **WebM**, **MPEG-TS** (для бродкаста), **FLV** (устарел).", "<h3>Потоковая передача сохранённых файлов (VoD)</h3>", "**Streaming stored media** — пользователь смотрит видео, не дожидаясь полной загрузки. Современные технологии — **ABR** (Adaptive Bitrate Streaming):\n- Видео разбивается на короткие **сегменты** (2–10 с) в нескольких качествах (например, 240p, 480p, 720p, 1080p, 4K).\n- **Манифест** (m3u8 для HLS, .mpd для DASH) описывает доступные варианты.\n- Клиент скачивает по HTTP/HTTPS и **динамически переключается** между качествами в зависимости от полосы, состояния буфера и CPU.", "Основные стандарты:\n- **HLS** (HTTP Live Streaming, Apple, RFC 8216) — манифест .m3u8, сегменты в .ts или fMP4.\n- **MPEG-DASH** (ISO/IEC 23009-1) — открытый, fMP4-сегменты, .mpd-манифест.\n- **CMAF** (Common Media Application Format) — общий формат сегментов для HLS и DASH.\n- **Low-Latency HLS / Low-Latency DASH** — короткие сегменты + chunked transfer для задержки 2–4 с.", "Эти протоколы работают по обычному HTTP/HTTPS → легко кешируются на CDN.", "<h3>Live streaming</h3>", "**Реальное живое вещание**:\n- **RTMP** (Adobe, исторически) — публикация от стримера на сервер, низкая задержка.\n- **WebRTC** — для интерактивных трансляций с задержкой < 1 с.\n- **SRT** (Secure Reliable Transport) — современная замена RTMP, ARQ + FEC, низкая задержка.\n- **RTP / RTCP** — для классических VoIP/Видеоконференций (Q45).\n- ABR-формы для массовой раздачи: **LL-HLS**, **LL-DASH** (2–4 с задержки).", "<h3>Конференции в реальном времени</h3>", "Двусторонняя интерактивная коммуникация (VoIP, видеозвонок):\n- **SIP** (RFC 3261) — сигнализация: установка/завершение сессии, согласование медиа-параметров через **SDP** (Session Description Protocol).\n- **H.323** — устаревшая альтернатива SIP, ещё используется в корпоративных системах видеоконференцсвязи.\n- **RTP/SRTP** — собственно медиапоток (Q45).\n- **STUN/TURN/ICE** — обход NAT.\n- **WebRTC** (W3C/IETF) — стандарт браузерных P2P-видеозвонков без плагинов: getUserMedia, RTCPeerConnection, RTCDataChannel; основа Zoom Web, Google Meet, Discord, многих корпоративных решений.\n- **IMS / VoLTE / VoNR** — операторские стандарты на базе SIP+RTP.", "<h3>Проблемы и решения</h3>", "- **Джиттер** (jitter) — нестабильность задержки → **jitter buffer** на приёмнике сглаживает; для интерактивного аудио буфер 30–100 мс.\n- **Потери пакетов** — нельзя ждать повтор, поэтому **FEC** (Forward Error Correction), **PLC** (Packet Loss Concealment — приёмник «придумывает» потерянное), **interleaving** разбивают пачки потерь.\n- **Эхо** — **AEC** (Acoustic Echo Cancellation).\n- **Подавление шума** — **NS** (Noise Suppression) и DNN-фильтры.\n- **Конкуренция за полосу** — ABR для VoD, congestion-aware кодеки (Opus с переменным битрейтом).\n- **Задержка end-to-end**: целевые значения для VoIP ≤ 150 мс (ITU-T G.114), видеоконференций ≤ 200 мс, live-стриминга 1–10 с (ABR), VoD — не критично.", "<h3>Цифровое ТВ и broadcast</h3>", "- **DVB-T/T2** (Европа), **ATSC** (США), **ISDB** (Япония), **DTMB** (Китай) — наземное цифровое ТВ.\n- **DVB-S/S2** — спутниковое.\n- **DVB-C/C2** — кабельное.\n- **IPTV** — операторская доставка ТВ через IP (часто multicast)."], "terms": [{"ru": "GOP", "en": "Group of Pictures", "df": "группа кадров между I-кадрами"}, {"ru": "ABR", "en": "Adaptive Bitrate Streaming", "df": "адаптивный битрейт"}, {"ru": "HLS", "en": "HTTP Live Streaming", "df": "стандарт Apple"}, {"ru": "MPEG-DASH", "en": "Dynamic Adaptive Streaming over HTTP", "df": "стандарт ABR ISO"}], "summary": ["Мультимедиа — **60-80% интернет-трафика**; требует низкой задержки, устойчивости к потерям без повтора, массовости", "**Цифровое аудио — PCM**: частота × разрядность × каналы", "Телефон: 8 кГц × 8 бит = **64 кбит/с** (G.711); CD: 44,1 кГц × 16 бит × 2 = **1,411 Мбит/с**; Hi-Res 96/192 кГц × 24 бит", "**Кодеки lossy**: **MP3** (96-320 кбит/с), **AAC** (iTunes/YouTube, лучше MP3); **Opus** (RFC 6716, Xiph, 6-512 кбит/с, WebRTC/Discord)", "VoIP: G.722, G.729, AMR/AMR-WB; lossless: FLAC, ALAC, WavPack (×0,5-0,7)", "**Цифровое видео**: сырое 1920×1080 × 24бит × 30fps ≈ 1,5 Гбит/с → компрессия обязательна", "**Кодеки**: **H.264/AVC** (MPEG-4 Part 10, 2003, 1-10 Мбит/с HD); **H.265/HEVC** (×2 эффективнее H.264, лицензии, 4K); **VP9** (Google open); **AV1** (AOMedia 2018, без роялти, +30%); H.266/VVC, AV2", "**Типы кадров**: **I** (Intra, ключевой, как JPEG); **P** (Predicted, разности от предыдущего); **B** (Bidirectional, из обоих соседей, компактный, +задержка)", "**GOP** (Group of Pictures) — группа между I-кадрами; короткий GOP лучше seek, длинный — сжатие", "Контейнеры: **MP4** (ISOBMFF), MKV, **WebM**, MPEG-TS (broadcast), FLV (устарел)", "**VoD streaming — ABR** (Adaptive Bitrate): видео разбивается на **сегменты 2-10 с** в нескольких качествах (240p..4K)", "**Манифест** (m3u8 для HLS, .mpd для DASH); клиент динамически переключает качество по полосе/буферу/CPU", "Стандарты: **HLS** (Apple, RFC 8216, .m3u8 + .ts/fMP4); **MPEG-DASH** (ISO/IEC 23009-1, fMP4); **CMAF** (общий формат)", "**LL-HLS / LL-DASH** — задержка 2-4 с через короткие сегменты + chunked transfer; работают по HTTP/HTTPS → кэшируются на CDN", "**Live**: **RTMP** (Adobe, исторически); **SRT** (ARQ+FEC); **WebRTC** (<1 с); RTP/RTCP", "**Конференции**: **SIP** (RFC 3261) сигнализация + **SDP** (Session Description Protocol); H.323 устаревший; RTP/SRTP — медиа", "**STUN/TURN/ICE** — обход NAT; **WebRTC** (W3C/IETF) — браузерный P2P: getUserMedia, RTCPeerConnection, RTCDataChannel; основа Zoom Web, Meet, Discord; IMS/VoLTE/VoNR — операторы", "**Проблемы и решения**: **джиттер** → **jitter buffer** 30-100 мс; **потери** → FEC, **PLC** (Packet Loss Concealment), interleaving; эхо → AEC; шум → NS/DNN", "Целевые задержки: VoIP ≤150 мс (G.114), видеоконф. ≤200 мс, live 1-10 с, VoD не критично", "**Цифровое ТВ**: DVB-T/T2 (Европа), ATSC (США), ISDB (Япония), DTMB (Китай); DVB-S/S2 (спутник), DVB-C (кабель); **IPTV** часто multicast"]}, {"n": 54, "title": "FTP.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**FTP** (File Transfer Protocol, RFC 959, 1985) — один из старейших протоколов прикладного уровня Интернета (предшественник HTTP), предназначенный для передачи файлов и навигации по файловой системе удалённого сервера. Архитектурная особенность — использование **двух TCP-соединений**: одного для команд (control channel) и отдельного для каждого файла или листинга (data channel). FTP исторически широко применялся для размещения веб-контента и зеркалирования архивов; сегодня вытеснен более безопасными SFTP/SCP и HTTPS-API, но всё ещё встречается в инфраструктуре, embedded-системах и legacy-системах. Знание FTP — обязательный академический материал из-за его архитектурной особенности (out-of-band signaling) и истории.", "<h3>Архитектура: двухканальная модель</h3>", "FTP использует две параллельные TCP-сессии:", "- **Control Connection** — управляющее соединение:\n  - **Порт 21** на сервере.\n  - Постоянное на время всей FTP-сессии.\n  - Текстовые команды (Telnet NVT, ASCII), четырёхбуквенные имена.\n  - Серверные ответы — трёхзначные коды + текст.\n- **Data Connection** — соединение данных:\n  - Открывается **отдельно** для **каждой** передачи файла, листинга директории, потоковой загрузки.\n  - Закрывается по окончании передачи.\n  - Порт зависит от режима (active / passive).", "Раздельность каналов исторически связана с поддержкой полудуплексных терминалов и упрощением парсинга, но создаёт проблемы с NAT и firewall.", "<h3>Активный и пассивный режимы</h3>", "**Active mode** (PORT):\n1. Клиент открывает локальный порт N и шлёт серверу команду `PORT 192,168,1,5,P1,P2` (адрес и порт N = P1×256 + P2).\n2. **Сервер** инициирует TCP-соединение с локального порта 20 к клиенту:N.\n3. Проблема: входящие соединения на клиента почти всегда блокируются NAT и firewall, поэтому active режим работает редко.", "**Passive mode** (PASV):\n1. Клиент шлёт команду `PASV`.\n2. Сервер открывает случайный порт и сообщает его клиенту в ответе `227 Entering Passive Mode (h1,h2,h3,h4,p1,p2)`.\n3. **Клиент** инициирует TCP-соединение к серверу.\n4. Работает через NAT клиента; стандарт на практике.\n5. **EPSV / EPRT** — расширения IPv6 (RFC 2428).", "<h3>Основные команды и ответы</h3>", "| Команда | Назначение |\n|---|---|\n| USER user / PASS pwd | аутентификация |\n| ACCT | дополнительная учётная запись (редко) |\n| PWD | print working directory |\n| CWD path | change working directory |\n| CDUP | подняться на уровень вверх |\n| LIST [path] | листинг (расширенный, человекочитаемый) |\n| NLST [path] | имена файлов |\n| MLSD / MLST | машиночитаемый листинг (RFC 3659) |\n| RETR file | retrieve — скачать файл |\n| STOR file | store — загрузить файл |\n| APPE file | append |\n| DELE file | удалить файл |\n| RNFR + RNTO | переименование |\n| MKD / RMD | создать / удалить директорию |\n| TYPE A / I | режим ASCII / Image (binary) |\n| MODE / STRU | редкие настройки |\n| PORT / PASV / EPSV | согласование data-channel |\n| REST n | resume — продолжить с offset |\n| ABOR | прервать текущую передачу |\n| STAT / NOOP | состояние / keepalive |\n| QUIT | завершить сессию |", "**Ответы сервера** — трёхзначные коды + текст; первая цифра — категория:\n- **1xx** — положительный предварительный (110, 125 Data connection already open).\n- **2xx** — успех (200 OK, 220 Service ready, 226 Closing data connection, transfer complete).\n- **3xx** — промежуточный (331 User OK, need password; 350 Requested file action pending).\n- **4xx** — временная ошибка (425 Can't open data connection; 450 File busy).\n- **5xx** — постоянная (530 Login incorrect; 550 File not found).", "<h3>Типы передачи</h3>", "- **ASCII (TYPE A)** — текст с конверсией line-endings между ОС (CRLF↔LF); сегодня почти всегда используется только I.\n- **Image / Binary (TYPE I)** — байт-в-байт; стандарт по умолчанию для всех файлов.", "<h3>Безопасность и преемники</h3>", "Базовый FTP **передаёт логин, пароль и данные в открытом виде** — фундаментальная проблема. Решения:", "- **FTPS** (FTP Secure / FTP over TLS, RFC 4217) — стандартный FTP с STARTTLS на control channel (`AUTH TLS`); существует «explicit» (порт 21 + STARTTLS) и «implicit» (порт 990 сразу TLS) варианты. Сохраняет двухканальную архитектуру и связанные проблемы с NAT.\n- **SFTP** (SSH File Transfer Protocol) — **отдельный протокол** поверх SSH, не имеет общего кода с FTP, несмотря на похожее имя. Один канал, всё шифровано, отлично работает через NAT. Стандартный выбор.\n- **SCP** — простой файловый transfer поверх SSH (устарел в пользу SFTP).\n- **HTTPS + REST/WebDAV** — для веб-API передачи.\n- **rsync over SSH** — для синхронизации больших каталогов.\n- **AWS S3 / Azure Blob / S3-compatible API** — облачное хранение.", "<h3>Аутентификация: anonymous FTP</h3>", "Исторически массово использовался **anonymous FTP**: имя пользователя `anonymous`, пароль — любой (обычно e-mail). На таких серверах хостились публичные архивы (программы, документация, ftp.gnu.org, ftp.debian.org). Сейчас почти полностью вытеснен HTTPS."], "terms": [{"ru": "FTP", "en": "RFC 959", "df": "протокол передачи файлов на TCP"}], "summary": ["**FTP** (File Transfer Protocol, RFC 959, 1985) — старейший прикладной протокол; передача файлов; вытеснен SFTP/HTTPS, но академически важен", "**Архитектурная особенность — два TCP-соединения** (out-of-band signaling)", "**Control Connection**: **порт 21** на сервере, постоянное на сессию, ASCII-команды (Telnet NVT), 4-буквенные имена", "**Data Connection**: открывается **отдельно для каждой передачи** (файл/листинг), закрывается по окончании", "Раздельность каналов создаёт **проблемы с NAT и firewall**", "**Active mode (PORT)**: клиент шлёт `PORT h1,h2,h3,h4,p1,p2`; **сервер инициирует соединение от порта 20** к клиенту:N", "Active не работает через NAT клиента (входящие блокируются firewall)", "**Passive mode (PASV)**: клиент шлёт `PASV` → сервер отвечает `227 Entering Passive Mode (h,p1,p2)` → **клиент инициирует** к серверу", "Passive работает через NAT клиента — стандарт на практике; **EPSV/EPRT** (RFC 2428) — расширения IPv6", "**Команды аутентификации**: `USER user`, `PASS pwd`, ACCT (редко)", "**Навигация**: `PWD`, `CWD path`, `CDUP`; `LIST [path]` (human-readable), `NLST` (имена), **`MLSD/MLST`** (машиночитаемый, RFC 3659)", "**Файловые операции**: **`RETR file`** (скачать), **`STOR file`** (загрузить), `APPE` (append), `DELE`, `RNFR + RNTO` (rename), MKD/RMD", "**`TYPE A`** — ASCII (с конверсией CRLF↔LF); **`TYPE I`** — Image/Binary (по умолчанию)", "**`REST n`** — resume с offset; `ABOR` — прервать; `STAT/NOOP`; `QUIT`", "**Коды ответов**: **1xx** preliminary (125 Data conn ready); **2xx** OK (220 Service, 226 Transfer complete); **3xx** intermediate (331 User OK, need pass)", "**4xx** temp (425, 450); **5xx** permanent (**530 Login incorrect**, **550 File not found**)", "Фундаментальная проблема: **логин/пароль/данные передаются в открытом виде**", "Решения: **FTPS** (FTP+TLS, RFC 4217) — `AUTH TLS` explicit (порт 21) или implicit (порт 990); сохраняет двухканальность", "**SFTP** — **отдельный протокол поверх SSH** (не FTP!); один канал, всё шифровано, дружит с NAT — стандартный выбор", "**SCP** (устарел), **HTTPS+REST/WebDAV**, **rsync over SSH**, AWS S3/Azure Blob; **anonymous FTP** (anonymous + email) — публичные архивы (ftp.gnu.org, ftp.debian.org), почти всё вытеснено HTTPS"]}, {"n": 55, "title": "ICMP. Ping. Traceroute.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**ICMP** (Internet Control Message Protocol, RFC 792) — вспомогательный протокол сетевого уровня, технически встроенный в IP, для **сигнализации об ошибках и диагностики**. ICMP не переносит пользовательский трафик; его сообщения используются маршрутизаторами и хостами для обратной связи о проблемах доставки и для активной проверки достижимости. На ICMP базируются классические диагностические утилиты **ping** и **traceroute** — первый инструмент любого сетевого инженера. В IPv6 функциональность расширена в **ICMPv6**, включающем **NDP** (Neighbor Discovery), который заменяет ARP, и **MLD** (multicast).", "<h3>Положение ICMP в стеке</h3>", "- **Протокол IP-номер 1** для IPv4 (значение в поле Protocol IP-заголовка).\n- **Протокол IP-номер 58** для IPv6 (ICMPv6).\n- Несмотря на работу прямо поверх IP, ICMP логически относится к сетевому уровню; некоторые источники считают его «частью» уровня сетевого.", "<h3>Формат сообщения ICMP</h3>", "| Поле | Длина | Назначение |\n|---|---|---|\n| Type | 8 бит | категория сообщения |\n| Code | 8 бит | подкатегория |\n| Checksum | 16 бит | контрольная сумма |\n| Rest of Header | 32 бит | зависит от типа (ID/Seq для echo и т. д.) |\n| Data | переменная | в сообщениях об ошибках — IP-заголовок + первые 8 байт исходного пакета |", "<h3>Основные типы ICMP (IPv4)</h3>", "**Сообщения об ошибках**:\n- **Type 3 — Destination Unreachable**: с кодами 0=Net Unreachable, 1=Host Unreachable, 3=Port Unreachable, 4=**Fragmentation Needed and DF set** (используется в PMTUD), 13=Communication Administratively Prohibited.\n- **Type 11 — Time Exceeded**: 0=TTL expired (используется traceroute), 1=Fragment reassembly timeout.\n- **Type 12 — Parameter Problem**: неверный заголовок.\n- **Type 5 — Redirect**: лучший маршрут известен (сегодня обычно отключают по безопасности).\n- **Type 4 — Source Quench**: устарел, не используется.", "**Запросы/ответы (диагностика)**:\n- **Type 8 / Type 0 — Echo Request / Echo Reply**: ping.\n- **Type 13 / Type 14 — Timestamp Request / Reply**.\n- **Type 17 / Type 18 — Address Mask Request / Reply** (устарели).\n- **Type 9 / Type 10 — Router Advertisement / Solicitation** (исторически; в IPv6 переработаны).", "<h3>Утилита ping</h3>", "Самый известный диагностический инструмент: проверяет достижимость хоста и измеряет RTT.", "Принцип:\n1. Источник шлёт **ICMP Echo Request (Type 8)** с произвольной payload и идентификатором/sequence-number.\n2. Целевой хост отвечает **ICMP Echo Reply (Type 0)** с той же payload и идентификатором.\n3. Источник измеряет время round-trip; формирует статистику серии пакетов.", "Параметры: число пакетов (`-c N`), размер payload (`-s N`), интервал (`-i N`), TTL (`-t N`), DF (`-M do` в Linux), интервал «зонда».", "Полезно для:\n- Проверки L3-доступности.\n- Измерения RTT и его флуктуаций (джиттера).\n- Выявления потерь и MTU (с `-M do`).\n- Path MTU Discovery вручную.", "Часть фаерволов блокирует ICMP, поэтому отсутствие ответа ≠ хост недоступен.", "<h3>Утилита traceroute / tracert</h3>", "Показывает **последовательность маршрутизаторов** на пути к целевому хосту.", "Принцип:\n1. Отправляются пакеты с возрастающим TTL: 1, 2, 3, …\n2. Маршрутизатор, у которого TTL после декремента становится 0, отбрасывает пакет и шлёт обратно **ICMP Time Exceeded (Type 11)**.\n3. По обратным сообщениям и их временам прихода реконструируется список хопов.\n4. Когда пакет достигает цели, она отвечает либо ICMP (если ping-зонд), либо ICMP Port Unreachable (если UDP на высокий порт), либо TCP-RST/SYN-ACK.", "Варианты реализации:\n- **Unix traceroute**: по умолчанию UDP с высокими портами (33434+); работает там, где ICMP echo блокируется, но требует ответа ICMP Port Unreachable.\n- **Windows tracert**: ICMP Echo Request с возрастающим TTL.\n- **TCP traceroute** (tcptraceroute, hping3): использует TCP SYN — проходит через большинство firewall'ов.\n- **mtr** (My TraceRoute) — гибрид ping+traceroute, непрерывно обновляет статистику.", "**Ограничения**:\n- Маршрутизаторы могут не отвечать ICMP (firewall, rate-limiting).\n- Асимметричные пути: traceroute показывает forward path; обратный путь может отличаться.\n- Тоннели MPLS могут «скрываться» (если LSR с TTL-pipe-режимом).\n- Anycast: разные пакеты могут попасть к разным узлам.", "<h3>ICMPv6</h3>", "**ICMPv6** (RFC 4443) — расширенная версия для IPv6, объединяющая в себе функции:\n- Сообщений об ошибках (Type 1–4): Destination Unreachable, Packet Too Big (вместо IPv4 Fragmentation Needed), Time Exceeded, Parameter Problem.\n- Запросов Echo (Type 128/129).\n- **NDP** (Neighbor Discovery Protocol, RFC 4861): Router Solicitation / Advertisement (Type 133/134), Neighbor Solicitation / Advertisement (Type 135/136), Redirect (Type 137) — заменяют ARP, ICMP Router Discovery, IGMP-redirect.\n- **MLD** (Multicast Listener Discovery, аналог IGMP, Type 130–132).", "ICMPv6 нельзя слишком агрессивно блокировать в firewall'ах: без NDP и Packet Too Big стек IPv6 ломается. Рекомендации — RFC 4890.", "<h3>Безопасность и злоупотребления</h3>", "- **Ping flood**, **Smurf attack** (ICMP echo на broadcast от подделанного адреса), **Ping of Death** — старые DoS-атаки.\n- **ICMP tunneling** — туннелирование данных в payload Echo для обхода firewall.\n- **Path MTU Discovery blackhole** — фаервол блокирует ICMP «Fragmentation Needed», и TCP-соединения с большими пакетами молча умирают.\n- Поэтому полное блокирование ICMP — плохая практика; нужно блокировать целево."], "terms": [{"ru": "ICMP", "en": "Internet Control Message Protocol, RFC 792", "df": "протокол управляющих сообщений"}, {"ru": "ICMPv6", "en": "RFC 4443", "df": "аналог для IPv6"}, {"ru": "RTT", "en": "Round-Trip Time", "df": "время кругового обхода"}, {"ru": "NDP", "en": "Neighbor Discovery Protocol", "df": "обнаружение соседей в IPv6"}, {"ru": "PMTUD", "en": "Path MTU Discovery", "df": "определение MTU по ICMP-сообщениям"}], "summary": ["**ICMP** (Internet Control Message Protocol, RFC 792) — вспомогательный протокол сетевого уровня для **сигнализации об ошибках и диагностики**", "Не переносит пользовательских данных; используется маршрутизаторами и хостами", "**Protocol number 1** для IPv4, **58** для IPv6 (ICMPv6); логически часть L3", "**Формат ICMP**: **Type** 8б + **Code** 8б + Checksum 16б + Rest of Header 32б + Data", "В сообщениях об ошибках Data содержит IP-заголовок + первые 8 байт исходного пакета (порты L4)", "**Сообщения об ошибках (IPv4)**: **Type 3 Destination Unreachable** (Code 0=Net, 1=Host, 3=Port, **4=Fragmentation Needed + DF**, 13=Admin Prohibited)", "**Type 11 Time Exceeded** (Code 0=TTL expired — основа traceroute; 1=Reassembly timeout)", "Type 12 Parameter Problem; Type 5 Redirect (обычно отключают по безопасности); Type 4 Source Quench (устарел)", "**Запросы/ответы**: **Type 8 Echo Request / Type 0 Echo Reply** (ping); Type 13/14 Timestamp; Type 17/18 Address Mask (устарели)", "**ping**: ICMP Echo Request (Type 8) → Echo Reply (Type 0); измеряет **RTT** и потери", "Параметры ping: `-c N` (число), `-s N` (размер), `-i N` (интервал), `-t N` (TTL), `-M do` (DF для PMTUD)", "Применение: L3-достижимость, RTT/джиттер, PMTUD вручную; firewall может блокировать ICMP → нет ответа ≠ хост недоступен", "**traceroute / tracert**: пакеты с возрастающим TTL=1,2,3...; роутер возвращает **ICMP Time Exceeded (Type 11)**", "По обратным сообщениям реконструируется список хопов; цель отвечает ICMP/ICMP-Port-Unreachable/TCP-RST", "**Unix traceroute**: UDP на высокие порты 33434+ (нужен ICMP Port Unreachable от цели)", "**Windows tracert**: ICMP Echo Request с возрастающим TTL; **tcptraceroute/hping3**: TCP SYN (проходит firewall); **mtr** — ping+traceroute непрерывно", "Ограничения: rate-limit/firewall на роутерах, асимметричные пути (forward path), MPLS-туннели скрываются, anycast → разные узлы", "**ICMPv6** (RFC 4443): Type 1-4 (Destination Unreachable, **Packet Too Big** вместо Frag Needed, Time Exceeded, Parameter Problem); Echo 128/129", "**NDP** (RFC 4861, Type 133-137): Router/Neighbor Solicitation/Advertisement, Redirect — заменяет ARP, ICMP Router Discovery; **MLD** Type 130-132 (аналог IGMP)", "ICMPv6 нельзя жёстко блокировать (без NDP/PTB IPv6 ломается, RFC 4890); атаки: **Ping flood**, **Smurf**, Ping of Death, ICMP tunneling, **PMTUD blackhole** (молчат большие пакеты)"]}], "quizzes": [{"type": "mcq", "topic": "Вопрос 48", "q": "На каком порту работает протокол DNS?", "opts": ["80", "53", "25", "443"], "ans": 1, "expl": "Протокол DNS работает по UDP/TCP на порту 53."}, {"type": "mcq", "topic": "Вопрос 48", "q": "Какой тип записи DNS используется для обратного преобразования адреса в имя?", "opts": ["A", "MX", "CNAME", "PTR"], "ans": 3, "expl": "PTR — запись обратного преобразования адреса в имя."}, {"type": "tf", "topic": "Вопрос 48", "q": "TCP используется в DNS при ответах размером более 512 байт и при передаче зон (AXFR).", "ans": true, "expl": "TCP используется при ответах размером более 512 байт и при передаче зон (AXFR)."}, {"type": "mcq", "topic": "Вопрос 49", "q": "Какой стандарт определяет формат сообщений электронной почты?", "opts": ["RFC 959", "RFC 5322", "RFC 792", "RFC 4301"], "ans": 1, "expl": "Формат сообщений электронной почты определён стандартом RFC 5322."}, {"type": "tf", "topic": "Вопрос 49", "q": "Агент доставки сообщений (MDA) передаёт сообщения между почтовыми серверами по протоколу SMTP.", "ans": false, "expl": "MTA (агент передачи сообщений) передаёт сообщения между серверами по SMTP. MDA осуществляет окончательную доставку в почтовый ящик пользователя."}, {"type": "mcq", "topic": "Вопрос 50", "q": "На каком порту работает SMTP для межсерверной связи?", "opts": ["587", "110", "25", "143"], "ans": 2, "expl": "SMTP работает по TCP на порту 25 для межсерверной связи и 587 для отправки клиентом."}, {"type": "tf", "topic": "Вопрос 50", "q": "Протокол IMAP хранит сообщения на сервере и поддерживает папки, частичную загрузку и поиск на сервере.", "ans": true, "expl": "IMAP — более мощный протокол, при котором сообщения хранятся на сервере; поддерживает папки, частичную загрузку, поиск на сервере и синхронизацию нескольких клиентов."}, {"type": "mcq", "topic": "Вопрос 51", "q": "Какой протокол лежит в основе HTTP/3?", "opts": ["TCP", "SCTP", "QUIC (UDP)", "DCCP"], "ans": 2, "expl": "HTTP/3 работает поверх протокола QUIC (UDP), устраняя блокировку очереди (HOL blocking)."}, {"type": "tf", "topic": "Вопрос 51", "q": "HTTP/2 использует мультиплексирование в рамках одного TCP-соединения и сжатие заголовков (HPACK).", "ans": true, "expl": "HTTP/2 использует мультиплексирование в рамках одного TCP-соединения и сжатие заголовков (HPACK)."}, {"type": "mcq", "topic": "Вопрос 52", "q": "Как CDN направляет пользователя к ближайшему серверу?", "opts": ["ARP-перенаправление", "DNS-перенаправление", "ICMP Redirect", "BGP-перенаправление"], "ans": 1, "expl": "CDN использует DNS-перенаправление: DNS-запрос пользователя разрешается в IP ближайшего узла CDN."}, {"type": "tf", "topic": "Вопрос 52", "q": "В BitTorrent трекер (tracker) или DHT обеспечивают поиск пиров.", "ans": true, "expl": "Трекер (tracker) или DHT (Distributed Hash Table) обеспечивают поиск пиров в BitTorrent."}, {"type": "mcq", "topic": "Вопрос 53", "q": "Какова частота дискретизации стандарта CD (PCM)?", "opts": ["22050 Гц", "48000 Гц", "44100 Гц", "96000 Гц"], "ans": 2, "expl": "Стандарт CD — 44100 Гц, 16 бит, 2 канала (1,4 Мбит/с)."}, {"type": "tf", "topic": "Вопрос 53", "q": "Джиттер (jitter) — это потеря пакетов при передаче медиаданных.", "ans": false, "expl": "Джиттер (jitter) — это вариация задержки, а не потеря пакетов. Он компенсируется буфером воспроизведения (playout buffer)."}, {"type": "mcq", "topic": "Вопрос 54", "q": "На какой порт устанавливается управляющее соединение FTP?", "opts": ["20", "21", "22", "23"], "ans": 1, "expl": "Управляющее соединение FTP устанавливается на порт 21 сервера."}, {"type": "tf", "topic": "Вопрос 54", "q": "В пассивном режиме FTP (PASV) сервер инициирует соединение данных к клиенту.", "ans": false, "expl": "В пассивном режиме (PASV) клиент сам подключается к серверу. В активном режиме сервер инициирует соединение данных с клиентом."}, {"type": "mcq", "topic": "Вопрос 55", "q": "Какой тип сообщения ICMP используется утилитой traceroute при истечении TTL?", "opts": ["Echo Reply (тип 0)", "Destination Unreachable (тип 3)", "Redirect (тип 5)", "Time Exceeded (тип 11)"], "ans": 3, "expl": "При TTL=0 маршрутизатор отбрасывает пакет и возвращает ICMP Time Exceeded (тип 11)."}, {"type": "match", "topic": "Тема 7 — Сопоставление", "q": "Сопоставьте протокол/технологию с их назначением:", "pairs": [["DNS", "Преобразование доменных имён в IP-адреса"], ["SMTP", "Передача почты между серверами (порт 25)"], ["IMAP", "Управление почтой на сервере (папки, поиск)"], ["RTP", "Передача медиаданных реального времени"], ["FTP", "Передача файлов (два TCP-соединения: порт 21 + данные)"], ["ICMP", "Сигнализация об ошибках и диагностика сети"]], "expl": "Каждый протокол имеет своё чёткое назначение в стеке TCP/IP."}]},
