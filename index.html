* (информационная безопасность), ISO 9001 (менеджмент качества). Часто работает совместно с **IEC** (International Electrotechnical Commission).\n- **IEEE** (Institute of Electrical and Electronics Engineers) — профессиональная инженерная ассоциация (США), стандарты локальных и беспроводных сетей:\n  - 802.1 (мосты, VLAN), 802.3 (Ethernet), 802.11 (Wi-Fi), 802.15 (Bluetooth, Zigbee), 802.16 (WiMAX), 802.1X (port-based authentication).", "<h3>Организации в области Интернета</h3>", "Интернет управляется не централизованным регулятором, а **экосистемой коллегиальных организаций** (multi-stakeholder model):\n- **ISOC** (Internet Society) — некоммерческая зонтичная организация, поддерживающая IETF.\n- **IETF** (Internet Engineering Task Force) — открытое сообщество инженеров; публикует стандарты в виде документов **RFC** (Request for Comments). Принцип: «rough consensus and running code» — приоритет работающим реализациям над теорией. Стадии стандартизации: Internet-Draft → Proposed Standard → Internet Standard.\n- **IAB** (Internet Architecture Board) — комитет, определяет архитектурные принципы Интернета и осуществляет надзор за функциями IANA.\n- **IRTF** (Internet Research Task Force) — исследовательский параллельный орган IETF.\n- **ICANN** (Internet Corporation for Assigned Names and Numbers) — независимая некоммерческая организация (Калифорния), управляет корневой зоной DNS, аккредитует регистраторов доменных имён, координирует распределение адресного пространства.\n- **IANA** (Internet Assigned Numbers Authority) — функция внутри ICANN, ведёт реестры IP-адресов, номеров AS, портов, параметров протоколов; делегирует блоки **RIR** (Regional Internet Registries): ARIN (Северная Америка), RIPE NCC (Европа, Россия, Ближний Восток), APNIC (Азия), LACNIC, AFRINIC.\n- **W3C** (World Wide Web Consortium) — стандарты Веба: HTML, CSS, XML, DOM, SVG, WebAssembly. Основан Тимом Бернерсом-Ли в 1994 г.\n- **WHATWG** (Web Hypertext Application Technology Working Group) — поддерживает «живой стандарт» HTML параллельно с W3C.", "<h3>Организации в области безопасности</h3>", "- **ISO/IEC 27001, 27002** — стандарты систем управления информационной безопасностью (**ISMS**, Information Security Management System). 27001 — требования к ISMS, 27002 — кодекс практик.\n- **NIST** (National Institute of Standards and Technology, США) — федеральное агентство, выпускает стандарты **FIPS** (Federal Information Processing Standards) в области криптографии (FIPS 197 — AES, FIPS 186 — DSS), а также серии SP 800-xx (Cybersecurity Framework, post-quantum cryptography). Решения NIST имеют международное влияние.\n- **NSA / CISA** (США) — рекомендации Suite B (с 2015 г. CNSA), руководства по безопасности.\n- **CIS** (Center for Internet Security) — CIS Controls, CIS Benchmarks (best-practice конфигурации систем).\n- **PCI SSC** (PCI Security Standards Council) — **PCI DSS** для индустрии платёжных карт.\n- **OWASP** (Open Web Application Security Project) — открытый проект безопасности веб-приложений (OWASP Top 10, ASVS, ZAP).", "<h3>Региональные организации</h3>", "- **ETSI** (European Telecommunications Standards Institute) — европейские телеком-стандарты: **GSM** (исторически), DECT, TETRA, TISPAN, NFV — основной разработчик стандартов виртуализации сетевых функций.\n- **3GPP** (3rd Generation Partnership Project) — консорциум семи региональных организаций (ETSI, ARIB/TTC Япония, TTA Корея, ATIS США, CCSA Китай, TSDSI Индия). Разрабатывает спецификации сотовой связи 3G/4G/5G/6G в виде Releases (Rel-15 — первый 5G, Rel-18 — 5G-Advanced).\n- **ANSI** (American National Standards Institute) — координатор стандартов в США.\n- **CEN/CENELEC** — европейские органы стандартизации.", "<h3>Отечественные организации (Россия)</h3>", "- **Росстандарт** (Федеральное агентство по техническому регулированию и метрологии) — публикует национальные стандарты **ГОСТ Р**; часто адаптирует международные ISO/IEC.\n- **Минцифры России** (Министерство цифрового развития, связи и массовых коммуникаций) — государственное регулирование в сфере ИТ и связи, лицензирование операторов.\n- **Роскомнадзор** — надзор в сфере связи, информационных технологий и массовых коммуникаций, регулирование персональных данных.\n- **ФСБ России** — регулирование криптографических средств, лицензирование СКЗИ.\n- **ФСТЭК России** — техническая защита информации, сертификация средств защиты, требования к ИСПДн и КИИ.\n- **ТК 26** (Технический комитет по стандартизации «Криптографическая защита информации») — отечественные криптостандарты ГОСТ 34.10-2018 (ЭЦП), ГОСТ 34.11-2018 (хеш «Стрибог»), ГОСТ 34.12-2018 (блочные шифры «Кузнечик», «Магма»).\n- **СОРМ** (Система оперативно-розыскных мероприятий) — комплекс технических требований к операторам связи для обеспечения доступа уполномоченных органов к трафику (СОРМ-1 — телефония, СОРМ-2 — Интернет, СОРМ-3 — DPI).\n- **НИИ Радио, ЦНИИС** — отраслевые НИИ.", "<h3>Жизненный цикл стандарта</h3>", "Типичный путь от идеи до промышленного использования:\n- **Working Group / Draft** — формирование рабочей группы, обсуждение драфта.\n- **Public review** — публичное обсуждение, замечания.\n- **Approval** — голосование членов организации.\n- **Publication** — официальная публикация.\n- **Implementation** — реализация в продуктах, тесты на совместимость (plugfests, interop events).\n- **Revision / Withdrawal** — пересмотр или отзыв устаревших стандартов."], "terms": [{"ru": "Стандарт де-юре", "en": "de jure standard", "df": "официально утверждённый стандарт уполномоченной организацией по формальной процедуре"}, {"ru": "Стандарт де-факто", "en": "de facto standard", "df": "стандарт, сложившийся в результате широкого применения без официального утверждения"}, {"ru": "Открытый стандарт", "en": "open standard", "df": "публично доступная спецификация, которую любой может реализовать без лицензионных отчислений"}, {"ru": "Интероперабельность", "en": "interoperability", "df": "способность систем разных производителей работать совместно благодаря общим стандартам"}, {"ru": "ITU", "en": "International Telecommunication Union", "df": "Международный союз электросвязи; специализированное агентство ООН по телекоммуникациям"}, {"ru": "ISO", "en": "International Organization for Standardization", "df": "Международная организация по стандартизации; разработчик OSI и серии 27000"}, {"ru": "IEC", "en": "International Electrotechnical Commission", "df": "Международная электротехническая комиссия, часто работает совместно с ISO"}, {"ru": "IEEE", "en": "Institute of Electrical and Electronics Engineers", "df": "Институт инженеров электротехники и электроники; стандарты семейства 802"}, {"ru": "IETF", "en": "Internet Engineering Task Force", "df": "открытое сообщество, разрабатывающее интернет-стандарты в форме RFC"}, {"ru": "RFC", "en": "Request for Comments", "df": "документ IETF с технической спецификацией протокола или информационным содержанием"}, {"ru": "IAB", "en": "Internet Architecture Board", "df": "Совет по архитектуре Интернета, надзорный орган IETF"}, {"ru": "ICANN", "en": "Internet Corporation for Assigned Names and Numbers", "df": "организация, координирующая адресное пространство и систему DNS"}, {"ru": "IANA", "en": "Internet Assigned Numbers Authority", "df": "функция внутри ICANN, ведущая реестры IP-адресов, портов, AS, параметров протоколов"}, {"ru": "RIR", "en": "Regional Internet Registry", "df": "региональный интернет-регистратор: ARIN, RIPE NCC, APNIC, LACNIC, AFRINIC"}, {"ru": "W3C", "en": "World Wide Web Consortium", "df": "Консорциум Всемирной паутины; стандарты HTML, CSS, XML, SVG"}, {"ru": "3GPP", "en": "3rd Generation Partnership Project", "df": "международный консорциум разработчиков стандартов сотовой связи 3G–5G"}, {"ru": "ETSI", "en": "European Telecommunications Standards Institute", "df": "Европейский институт телекоммуникационных стандартов"}, {"ru": "NIST", "en": "National Institute of Standards and Technology", "df": "Национальный институт стандартов и технологий США; выпускает FIPS и SP 800"}, {"ru": "FIPS", "en": "Federal Information Processing Standards", "df": "федеральные стандарты обработки информации США (FIPS 197 — AES)"}, {"ru": "ISMS", "en": "Information Security Management System", "df": "система управления информационной безопасностью (ISO/IEC 27001)"}, {"ru": "PCI DSS", "en": "Payment Card Industry Data Security Standard", "df": "стандарт безопасности данных индустрии платёжных карт"}], "summary": ["**Стандартизация** обеспечивает **интероперабельность** оборудования разных производителей", "**Де-юре** — официально утверждённые (ISO/IEC 27001, ITU-T G.711, IEEE 802.3)", "**Де-факто** — сложившиеся (TCP/IP, PDF, ранний Ethernet)", "Открытые (без лицензий) vs проприетарные (SMB, ранний Skype)", "**ITU** (МСЭ, агентство ООН с 1865 г., Женева): **ITU-T** (G/H/V/X/Y серии — G.711, H.264, X.25), **ITU-R** (спектр, IMT-2000/Advanced/2020), **ITU-D**", "**ISO** (1947): OSI (ISO 7498), серия **ISO/IEC 27000** (ИБ), часто с IEC", "**IEEE**: 802.1 (мосты, VLAN), **802.3** (Ethernet), **802.11** (Wi-Fi), 802.15 (Bluetooth/Zigbee), 802.16 (WiMAX), 802.1X (аутентификация)", "**Интернет — multi-stakeholder**: **ISOC** → **IETF** (RFC, «rough consensus and running code»; стадии Internet-Draft → Proposed → Internet Standard)", "**IAB** — архитектура; **IRTF** — исследования; **ICANN** управляет корневой зоной DNS; **IANA** ведёт реестры IP/портов/AS", "**RIR**: ARIN (Сев. Америка), **RIPE NCC** (Европа/Россия), APNIC, LACNIC, AFRINIC", "**W3C** (Тим Бернерс-Ли, 1994) — HTML/CSS/XML/SVG; **WHATWG** — живой стандарт HTML", "**Безопасность**: **NIST** (FIPS 197 — AES, SP 800-xx), **ISO/IEC 27001/27002** (**ISMS**), **PCI DSS**, OWASP Top 10", "**ETSI** — GSM, DECT, NFV; **3GPP** — 3G/4G/5G/6G (Rel-15 = первый 5G, Rel-18 = 5G-Advanced); ANSI, CEN/CENELEC", "**Россия — Росстандарт** (**ГОСТ Р**), **Минцифры**, **Роскомнадзор**, **ФСБ** (СКЗИ), **ФСТЭК** (КИИ, ИСПДн)", "**ТК 26**: ГОСТ 34.10-2018 (ЭЦП), 34.11-2018 («Стрибог»), 34.12-2018 («Кузнечик»/«Магма»)", "**СОРМ** (СОРМ-1 — телефония, СОРМ-2 — Интернет, СОРМ-3 — DPI); НИИ Радио, ЦНИИС", "Жизненный цикл: Working Group → Draft → Public Review → Approval → Publication → Implementation (plugfests) → Revision/Withdrawal"]}], "quizzes": []}, {"id": 2, "name": "Физический уровень сетевого стека", "questions": [{"n": 7, "title": "Теоретические основы передачи данных. Ряды Фурье. Сигналы с ограниченным спектром. Максимальная скорость передачи данных через канал.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "Любой сигнал, передаваемый по каналу связи, можно описать либо во временной области (зависимостью амплитуды от времени), либо в частотной области (спектром — набором гармонических составляющих). Этот переход между двумя описаниями — основа всей теории передачи данных. Он позволяет связать **физические свойства канала** (полосу пропускания и уровень шума) с **максимальной достижимой скоростью передачи информации**, что формализуется фундаментальными теоремами Найквиста и Шеннона.", "<h3>Ряды Фурье и спектральное представление</h3>", "**Ряд Фурье** (Fourier series) — представление любого периодического сигнала g(t) с периодом T в виде бесконечной суммы синусоид с частотами, кратными фундаментальной f = 1/T:", "g(t) = ½·c + Σ aₙ·sin(2πnft) + Σ bₙ·cos(2πnft).", "- **Фундаментальная (основная) частота** f₁ = 1/T соответствует первой гармонике.\n- **Гармоники** (harmonics) с частотами 2f, 3f, …, nf — высшие составляющие, формирующие точную форму сигнала; чем «острее» переходы, тем больше гармоник нужно для верного восстановления.\n- Для непериодических сигналов используется **преобразование Фурье** (Fourier transform), дающее непрерывный спектр G(f).\n- На приёмнике достаточно знать амплитуды и фазы гармоник, чтобы полностью восстановить исходный сигнал.", "<h3>Сигналы с ограниченным спектром</h3>", "**Сигнал с ограниченным спектром** (band-limited signal) — функция времени, амплитудный спектр которой строго равен нулю за пределами некоторой максимальной частоты F_max, то есть занимает конечную полосу частот [0, F_max] (или [−F_max, F_max] в двустороннем спектре). Эквивалентное определение через преобразование Фурье: G(f) = 0 при |f| > F_max.", "В физической реальности абсолютно ограниченных сигналов не существует — полная локализация в частотной области требует бесконечной длительности во времени (следствие принципа неопределённости Гейзенберга для пары «время–частота»). На практике сигнал называют ограниченным по спектру, если энергия за пределами F_max пренебрежимо мала (например, ниже −40 дБ). Несмотря на эту идеализацию, концепция фундаментальна для радиотехники, обработки аудио и цифровой связи — на ней основаны теорема Котельникова о дискретизации (требует частоту дискретизации ≥ 2F_max), вся теория цифро-аналогового и аналого-цифрового преобразования, а также вычисление пропускной способности по Найквисту и Шеннону.", "Физический канал ведёт себя как фильтр: он пропускает гармоники только в определённом диапазоне частот, называемом **полосой пропускания** (bandwidth, B). Гармоники вне полосы либо сильно ослабляются, либо подавляются полностью. В результате:", "- Резкие фронты прямоугольного импульса «сглаживаются» — высокочастотные гармоники потеряны.\n- При высокой скорости передачи символы «расплываются» во времени, накладываясь на соседние, — возникает **межсимвольная интерференция** (ISI, Inter-Symbol Interference).\n- Чтобы уменьшить ISI, применяют фильтры, формирующие импульс приподнятого косинуса (raised cosine pulse), у которого спектр строго ограничен, а отклики в моменты соседних символов равны нулю.\n- Граничная частота канала по уровню −3 дБ (срез на половине мощности) — практическая мера B.", "<h3>Теорема Найквиста (канал без шума)</h3>", "В 1924 г. **Г. Найквист** (Harry Nyquist) показал, что в идеальном бесшумном канале с полосой B Гц можно передавать максимум **2B символов в секунду** без ISI. Если каждый символ кодирует log₂V бит (V — число различимых уровней сигнала), то максимальная скорость:", "**C = 2B · log₂V (бит/с).**", "- Например, при B = 3000 Гц (полоса телефонного канала) и V = 4 уровнях получаем C = 12 000 бит/с.\n- Удвоение числа уровней V даёт лишь линейный прирост — нельзя бесконечно увеличивать V, не наталкиваясь на шум.", "<h3>Теорема Шеннона (канал с шумом)</h3>", "**К. Шеннон** (Claude Shannon, 1948) обобщил результат на реальные каналы с **аддитивным белым гауссовским шумом** (AWGN). Пропускная способность зависит не только от полосы, но и от **отношения сигнал/шум** (SNR, Signal-to-Noise Ratio):", "**C = B · log₂(1 + S/N) (бит/с),**", "где S — мощность сигнала, N — мощность шума. SNR обычно выражают в децибелах: SNR(дБ) = 10·log₁₀(S/N).", "- Пример: телефонный канал B = 3 кГц, SNR = 30 дБ (=1000) → C ≈ 3000·log₂(1001) ≈ **30 кбит/с**. Именно этим пределом ограничены модемы V.34.\n- При SNR = 0 дБ (S = N) пропускная способность падает до B бит/с.\n- Шеннон задаёт **теоретический предел**, превзойти его не может никакая схема кодирования; современные коды (LDPC, турбокоды) приближаются к нему на сотые доли децибела.", "<h3>Сравнение Найквиста и Шеннона</h3>", "| Теорема | Канал | Формула | Что ограничивает |\n|---|---|---|---|\n| Найквист | идеальный, без шума | C = 2B·log₂V | число различимых уровней V (амплитуд) |\n| Шеннон | реальный, AWGN | C = B·log₂(1+S/N) | мощность шума N |", "На практике скорость определяется **меньшим** из двух пределов; обычно реальные системы упираются именно в шенноновский потолок."], "terms": [{"ru": "Ряд Фурье", "en": "Fourier series", "df": "разложение периодического сигнала в сумму синусоид кратных частот"}, {"ru": "Преобразование Фурье", "en": "Fourier transform", "df": "обобщение ряда Фурье на непериодические сигналы"}, {"ru": "Гармоника", "en": "harmonic", "df": "составляющая ряда Фурье с частотой, кратной фундаментальной"}, {"ru": "Фундаментальная частота", "en": "fundamental frequency", "df": "частота первой гармоники f = 1/T"}, {"ru": "Полоса пропускания", "en": "bandwidth", "df": "диапазон частот, передаваемых каналом с допустимым затуханием (в Гц); в контексте сетей также используется как синоним скорости передачи данных (бит/с)"}, {"ru": "Сигнал с ограниченным спектром", "en": "band-limited signal", "df": "сигнал, амплитудный спектр которого равен нулю за пределами максимальной частоты F_max; идеализация, лежащая в основе теоремы дискретизации и формул Найквиста/Шеннона"}, {"ru": "Теорема Найквиста", "en": "Nyquist theorem", "df": "максимальная скорость передачи по идеальному каналу: C = 2B log₂V"}, {"ru": "Теорема Шеннона", "en": "Shannon's theorem", "df": "теоретический предел скорости передачи по зашумлённому каналу: C = B log₂(1 + SNR)"}, {"ru": "SNR", "en": "Signal-to-Noise Ratio", "df": "отношение мощности полезного сигнала к мощности шума, измеряется в дБ"}, {"ru": "AWGN", "en": "Additive White Gaussian Noise", "df": "модель канала с аддитивным белым гауссовским шумом"}, {"ru": "Пропускная способность", "en": "channel capacity", "df": "максимальная скорость безошибочной передачи данных по каналу"}, {"ru": "Межсимвольная интерференция", "en": "ISI, Inter-Symbol Interference", "df": "искажение символов из-за наложения переходных процессов от соседних символов"}], "summary": ["Сигнал описывается во временной (g(t)) и частотной (G(f)) областях — переход через Фурье", "**Ряд Фурье**: g(t) = ½c + Σ aₙ sin(2πnft) + Σ bₙ cos(2πnft); сумма синусоид с частотами кратными f=1/T", "**Фундаментальная частота** f₁ = 1/T (первая гармоника); **гармоники** nf — высшие составляющие", "**Преобразование Фурье** — обобщение для непериодических сигналов (непрерывный спектр)", "**Сигнал с ограниченным спектром** (band-limited): G(f) = 0 при |f| > F_max", "Абсолютно ограниченных не существует (принцип неопределённости); практически — энергия вне F_max < −40 дБ", "Канал = фильтр с **полосой пропускания** B (Гц); граница по уровню −3 дБ", "Резкие фронты сглаживаются (теряются ВЧ-гармоники) → **межсимвольная интерференция (ISI)** — наложение соседних символов", "Снижение ISI: фильтр приподнятого косинуса (raised cosine) — нули в моменты соседних символов", "**Теорема Найквиста** (1924, идеальный канал без шума): максимум **2B символов/с**", "Формула Найквиста: **C = 2B · log₂V** (бит/с), V — число различимых уровней", "Пример: B=3 кГц, V=4 → C=12 кбит/с; рост V — лишь линейный прирост, упор в шум", "**Теорема Шеннона** (1948) для канала с **AWGN** (аддитивный белый гауссовский шум)", "Формула Шеннона: **C = B · log₂(1 + S/N)** (бит/с); SNR(дБ)=10·log₁₀(S/N)", "Пример: B=3 кГц, SNR=30 дБ → C≈30 кбит/с (предел модемов V.34)", "Шеннон — непревышаемый теоретический предел; LDPC и турбокоды подходят на сотые дБ", "Найквист ограничивает V (амплитуды); Шеннон ограничивает мощностью шума; реальный канал упирается в Шеннона"]}, {"n": 8, "title": "Проводниковые среды передачи информации: магнитные носители, витая пара, коаксиальный кабель, линии электропитания, волоконная оптика.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Проводниковая (направляющая) среда передачи** (guided medium) — физический канал, по которому сигнал распространяется внутри материальной среды: электромагнитной волной в металлическом проводнике или световой волной в оптическом волокне. От выбора среды зависят полоса пропускания, дальность без ретрансляторов, помехоустойчивость и стоимость прокладки.", "<h3>Магнитные носители</h3>", "**Магнитные носители** (magnetic media) — нетривиальный, но иногда оптимальный «канал»: данные записывают на ленты/диски и физически доставляют адресату курьером. Для больших объёмов пропускная способность «грузовика, гружёного дисками» (sneakernet) превосходит любую сеть: 1000 жёстких дисков по 18 ТБ, доставленных за 24 ч, дают эффективную скорость ≈ **1,7 Тбит/с** при околонулевой стоимости бита. Так перемещают петабайты при загрузке данных в облачные сервисы (AWS Snowmobile, Azure Data Box).", "<h3>Витая пара</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/0/0e/Optical_fiber_types.svg\" alt=\"Типы оптических волокон: одномодовое и многомодовое (step-index и graded-index)\" loading=\"lazy\"><figcaption>Сравнение профилей показателя преломления и распространения лучей в одномодовом и многомодовом (step-index/graded-index) волокнах. <em>Источник: Wikimedia Commons, CC BY-SA 3.0.</em></figcaption></figure>", "**Витая пара** (twisted pair) — два изолированных медных провода, скрученных в спираль. Скрутка минимизирует наводки: внешнее магнитное поле возбуждает противофазные ЭДС в соседних витках, и они взаимно компенсируются. Это самая массовая среда для LAN и телефонных абонентских линий.", "- **UTP** (Unshielded Twisted Pair) — без экрана; категории **Cat3** (10 Мбит/с, телефония), **Cat5e** (1 Гбит/с до 100 м), **Cat6/6a** (10 Гбит/с до 55/100 м), **Cat7/8** (40 Гбит/с в дата-центрах).\n- **STP / FTP / S/FTP** — экранированные варианты для электромагнитно-зашумлённых сред.\n- Стандартный разъём — **RJ-45**, разводка по схемам **T568A/T568B**.\n- Главный паразитный эффект — **перекрёстные наводки** (crosstalk): **NEXT** (Near-End) и **FEXT** (Far-End).", "<h3>Коаксиальный кабель</h3>", "**Коаксиальный кабель** (coaxial cable) — центральный медный проводник, окружённый изолятором, экраном-оплёткой и внешней оболочкой. За счёт замкнутого экрана имеет лучшую помехозащищённость, чем UTP, и полосу в сотни МГц.", "- **50-омный** — Ethernet 10BASE5 «Yellow Cable» и 10BASE2 «Thin Ethernet» (исторически).\n- **75-омный** — кабельное ТВ и **DOCSIS** (Data Over Cable Service Interface Specification): современный DOCSIS 3.1 даёт до 10 Гбит/с downstream по существующей кабельной инфраструктуре.", "<h3>Линии электропитания (PLC)</h3>", "**PLC** (Power Line Communication) — наложение высокочастотного сигнала данных поверх сетевого напряжения 50/60 Гц. Бытовые стандарты **HomePlug AV2**, **G.hn** дают 1–2 Гбит/с по обычной электропроводке квартиры. Минусы: высокий уровень шумов от двигателей и блоков питания, регуляторные ограничения на электромагнитное излучение проводки.", "<h3>Волоконная оптика</h3>", "**Оптическое волокно** (optical fiber) — тонкая стеклянная нить из кварца, по которой свет распространяется за счёт **полного внутреннего отражения** от границы сердечника (core) и оболочки (cladding) с меньшим показателем преломления. Сегодня — основа всех магистральных и большинства абонентских (FTTH) сетей.", "Типы волокон:\n- **Одномодовое (SMF, Single-Mode Fiber)** — узкий сердечник (диаметр 8–10 мкм); распространяется одна основная мода. Лазерный источник 1310/1550 нм, дальность десятки–сотни км без ретранслятора, скорости 10–800 Гбит/с на канал, до **десятков Тбит/с** при **WDM** (Wavelength Division Multiplexing).\n- **Многомодовое (MMF, Multimode Fiber)** — широкий сердечник (50/62,5 мкм); одновременно распространяется множество мод, которые приходят с разной задержкой → **модовая дисперсия**. Светодиод/VCSEL 850 нм, дальность до сотен метров, дешевле, используется в дата-центрах (OM3/OM4/OM5).", "Источники света: **светодиод** (LED) для MMF и **полупроводниковый лазер** (VCSEL, DFB) для SMF. Приёмники — **PIN-фотодиоды** или **лавинные фотодиоды** (APD). Усиление без преобразования в электричество — **EDFA** (Erbium-Doped Fiber Amplifier).", "Преимущества оптики:\n- Огромная полоса пропускания — десятки ТГц на одно волокно.\n- Малое затухание (~0,2 дБ/км на 1550 нм) → длинные пролёты.\n- Нечувствительность к электромагнитным помехам и грозам.\n- Безопасность: отвод оптического сигнала сложно осуществить незаметно.\n- Малый вес и низкая стоимость материала (кварц = песок).", "Недостатки: хрупкость, дорогие сварные соединения, односторонняя передача (нужно две жилы для дуплекса либо WDM)."], "terms": [{"ru": "Витая пара", "en": "twisted pair", "df": "кабель из попарно скрученных проводников; основная среда для Ethernet"}, {"ru": "UTP / STP / FTP", "en": "Unshielded/Shielded/Foiled Twisted Pair", "df": "неэкранированная и экранированные витые пары"}, {"ru": "Перекрёстные наводки", "en": "crosstalk, NEXT/FEXT", "df": "паразитный перенос сигнала между соседними проводниками"}, {"ru": "Коаксиальный кабель", "en": "coaxial cable", "df": "кабель с центральным проводником и экранирующей оплёткой"}, {"ru": "DOCSIS", "en": "Data Over Cable Service Interface Specification", "df": "стандарт широкополосного Интернета по коаксиальному кабелю"}, {"ru": "PLC", "en": "Power Line Communication", "df": "передача данных по электрической сети, стандарты HomePlug AV2, G.hn"}, {"ru": "Оптическое волокно", "en": "optical fiber", "df": "стеклянная нить, передающая свет за счёт полного внутреннего отражения"}, {"ru": "Одномодовое волокно", "en": "single-mode fiber, SMF", "df": "волокно с узким сердечником (8–10 мкм), для дальних расстояний"}, {"ru": "Многомодовое волокно", "en": "multimode fiber, MMF", "df": "волокно с широким сердечником (50/62,5 мкм) для коротких расстояний"}, {"ru": "Полное внутреннее отражение", "en": "total internal reflection", "df": "принцип удержания света в сердечнике волокна"}, {"ru": "Дисперсия", "en": "dispersion", "df": "уширение оптического импульса (модовая, хроматическая, поляризационная)"}, {"ru": "WDM / DWDM", "en": "Wavelength Division Multiplexing", "df": "мультиплексирование по длинам волн, десятки каналов в одном волокне"}, {"ru": "EDFA", "en": "Erbium-Doped Fiber Amplifier", "df": "оптический усилитель на эрбиевом волокне"}, {"ru": "Затухание", "en": "attenuation", "df": "уменьшение мощности сигнала по мере его распространения по среде"}, {"ru": "FTTH", "en": "Fiber to the Home", "df": "доведение оптики до квартиры абонента"}], "summary": ["**Проводниковая среда** (guided medium) — сигнал распространяется внутри материала (металл/стекло)", "**Магнитные носители** — sneakernet: грузовик с дисками может дать ~1,7 Тбит/с (AWS Snowmobile, Azure Data Box)", "**Витая пара** (twisted pair): два изолированных медных провода скручены; скрутка компенсирует наводки", "**UTP** категории: Cat3 (10 Мбит/с, телефон), **Cat5e** (1 Гбит/с до 100 м), **Cat6/6a** (10 Гбит/с 55/100 м), Cat7/8 (40 Гбит/с)", "STP/FTP/S/FTP — экранированные; разъём **RJ-45**, разводка T568A/B; паразиты — **NEXT**/**FEXT** (crosstalk)", "**Коаксиальный кабель**: центр + изолятор + экран + оболочка; помехоустойчивость лучше UTP", "50 Ом — Ethernet 10BASE5/10BASE2; 75 Ом — кабельное ТВ и **DOCSIS 3.1** (до 10 Гбит/с downstream)", "**PLC** (Power Line Communication) — данные поверх 50/60 Гц; HomePlug AV2, G.hn до 1–2 Гбит/с, высокий шум", "**Оптоволокно**: свет в кварцевой нити, **полное внутреннее отражение** от границы core/cladding", "**SMF** (одномод, диаметр 8–10 мкм): лазер 1310/1550 нм, десятки–сотни км, 10–800 Гбит/с/канал, **WDM** — десятки Тбит/с", "**MMF** (многомод, 50/62,5 мкм): VCSEL/LED 850 нм, сотни метров; **модовая дисперсия** ограничивает дальность; OM3/OM4/OM5 в ДЦ", "Источники: LED (MMF), VCSEL/DFB-лазер (SMF); приёмники PIN и **APD**; усилители **EDFA** (без оптоэлектронного преобразования)", "Затухание SMF ~0,2 дБ/км на 1550 нм; нечувствительность к EMI и грозам", "Преимущества оптики: ТГц полоса, малое затухание, помехозащищённость, безопасность от прослушки, лёгкость", "Недостатки: хрупкость, дорогие сварки, для дуплекса нужны две жилы или WDM", "**Дисперсия**: модовая (MMF), хроматическая и поляризационная (SMF) — уширение импульса", "**FTTH** (Fiber to the Home) — оптика до квартиры абонента"]}, {"n": 9, "title": "Беспроводная связь: электромагнитный спектр, радиосвязь, микроволновый диапазон, инфракрасный диапазон, видимый диапазон.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Беспроводная связь** (wireless communication) — передача информации без направляющей среды, через **электромагнитные волны**, распространяющиеся в свободном пространстве. Информацию переносит модулированная **несущая волна**, занимающая часть **электромагнитного спектра** — непрерывного диапазона частот от единиц Гц до экзагерц. Выбор диапазона определяет дальность, ширину полосы, проникающую способность через препятствия и регуляторные ограничения.", "<h3>Электромагнитный спектр</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/c/cf/EM_Spectrum_Properties_edit.svg\" alt=\"Электромагнитный спектр с указанием диапазонов, длин волн и частот\" loading=\"lazy\"><figcaption>Электромагнитный спектр: радиоволны → микроволны → инфракрасное → видимое → ультрафиолет → рентген → гамма. Связь использует частоты примерно от 10 кГц до 300 ГГц (радио и микроволны) и оптические окна. <em>Источник: Wikimedia Commons, CC BY-SA 3.0.</em></figcaption></figure>", "Между частотой f, длиной волны λ и скоростью света c действует соотношение **c = f · λ**. Полоса частот определяет максимальную информационную ёмкость (теорема Шеннона), но в спектре существуют **«окна прозрачности»** — диапазоны с малым поглощением атмосферой и **«линии поглощения»** (например, кислород на 60 ГГц, водяной пар на 22 ГГц), где связь практически невозможна.", "Регулирование спектра: распределение частот между службами и странами координирует **МСЭ** (ITU-R) на Всемирных конференциях радиосвязи (WRC). Существуют **лицензируемые** полосы (сотовая связь, ТВ) и **безлицензионные** **ISM-диапазоны** (Industrial, Scientific, Medical: 2,4 ГГц, 5 ГГц, 900 МГц) и **U-NII** (5 ГГц, 6 ГГц).", "<h3>Радиосвязь (3 кГц – 300 МГц)</h3>", "- **VLF/LF** (3–300 кГц) — длинные волны, огибают Землю, применяются для подводной связи (Omega) и стандартов времени.\n- **MF** (300 кГц – 3 МГц) — средние волны, AM-радиовещание; распространение поверхностной волной до сотен км днём.\n- **HF** (3–30 МГц) — короткие волны, **отражаются от ионосферы** (D, E, F-слои), что обеспечивает связь на тысячи километров без ретрансляторов. Используются для радиолюбительской связи, морской и авиационной связи через океаны.\n- **VHF** (30–300 МГц) — FM-радиовещание (88–108 МГц), аналоговое и цифровое ТВ, авиадиспетчерская связь.", "Радиоволны хорошо проникают через стены, всенаправлены, но широковещательны → подвержены интерференции и перехвату.", "<h3>Микроволновый диапазон (300 МГц – 300 ГГц)</h3>", "- **UHF** (300 МГц – 3 ГГц) — сотовая связь (700/800/900/1800/2100 МГц), GPS (1,575 ГГц), Wi-Fi 2,4 ГГц, DECT.\n- **SHF** (3–30 ГГц) — Wi-Fi 5/6 ГГц, спутниковая связь C/Ku/Ka-диапазонов, радиорелейные линии, радар.\n- **EHF** (30–300 ГГц, «миллиметровые волны») — 5G NR FR2 (24–52 ГГц), 802.11ad/ay (60 ГГц, WiGig), автомобильный радар (77 ГГц).", "Особенности:\n- Распространение **только в прямой видимости** (LOS, Line-of-Sight) — для дальней связи нужны направленные **параболические антенны** (КПД 50–70%, узкая диаграмма).\n- Сильное поглощение влагой → деградация в дождь (rain fade) на Ka-диапазоне и mmWave.\n- Огромная полоса → высокие скорости (десятки Гбит/с в mmWave).", "<h3>Инфракрасный диапазон (300 ГГц – 400 ТГц)</h3>", "**ИК-излучение** не проникает через непрозрачные предметы и стёкла, что даёт **естественную изоляцию между помещениями**. Применения:\n- Пульты дистанционного управления (около 38 кГц промодулированная несущая ~940 нм).\n- **IrDA** (Infrared Data Association) — устаревший стандарт для PDA и принтеров.\n- Дальняя связь между зданиями по узкому ИК-лучу (FSO, см. ниже).", "<h3>Видимый диапазон (400–790 ТГц, длины волн 380–750 нм)</h3>", "Видимый свет занимает узкую «октаву» спектра между ИК и УФ: от красного (≈400 ТГц, 750 нм) до фиолетового (≈790 ТГц, 380 нм). Колоссальная полоса (сотни ТГц) делает его привлекательным для связи, но распространение строго в прямой видимости и при отсутствии преград.", "- **Li-Fi** (Light Fidelity) — модуляция светодиодного освещения помещений; скорости до 10 Гбит/с в лабораторных условиях.\n- **FSO** (Free Space Optics) — лазерные линии связи «здание–здание»: до 10 Гбит/с на расстояниях до нескольких километров; полностью свободны от радиолицензирования, но чувствительны к туману и качанию опор.\n- **Лазерная межспутниковая связь** — Starlink V2, LCRD: десятки Гбит/с между спутниками LEO.\n- **Волоконно-оптическая связь** использует ближний ИК и видимый диапазон (850 нм, 1310 нм, 1550 нм) — это уже направляющая среда.", "<h3>Ультрафиолет, рентген и гамма-излучение — почему не используются для связи</h3>", "Выше видимого диапазона электромагнитное излучение становится **ионизирующим**: фотоны имеют достаточно энергии (>3 эВ), чтобы выбивать электроны из атомов, повреждая живые ткани и материалы. Это делает его непригодным для массовой связи. Для полноты картины:", "- **Ультрафиолет** (UV, 790 ТГц – 30 ПГц, длины волн 10–380 нм) — почти полностью поглощается атмосферой (озоновый слой). Применяется для бактерицидной обработки, лито­графии, спектроскопии. В связи — экспериментальные **NLOS UV-каналы** в «солнечно-слепой» полосе (200–280 нм), где фоновое излучение Солнца поглощается атмосферой и не мешает приёму.\n- **Рентгеновское излучение** (X-rays, 30 ПГц – 30 ЭГц, длины волн 0,01–10 нм) — медицина (рентгенография, КТ), материаловедение (рентгеновская дифракция), астрономия. Для связи практически непригодно: трудно генерировать управляемо, требует тяжёлой защиты, ионизирует материалы. Экспериментально NASA в 2019 г. демонстрировала **XCOM** — рентгеновскую связь со спутником через космос (через ионосферу радиоволны затухают, а рентген проходит).\n- **Гамма-излучение** (gamma rays, >30 ЭГц, длины волн <0,01 нм) — испускается ядерными процессами. Используется в стерилизации, лучевой терапии, исследовании ядер. Для связи неприменимо: рассеивается материей, ионизирует, и направленная модуляция технически крайне сложна.", "Энергия фотона E = hf растёт линейно с частотой, поэтому при переходе от радио (~10⁻⁶ эВ) к гамма (~10⁶ эВ) меняется фундаментальный режим взаимодействия с веществом — от нагрева к ионизации.", "<h3>Ключевые эффекты беспроводного канала</h3>", "- **Затухание** в свободном пространстве: мощность убывает как 1/r² (обратный квадрат расстояния).\n- **Многолучевое распространение** (multipath): сигнал приходит несколькими путями → замирания и ISI; борьба — OFDM, эквалайзеры, MIMO.\n- **Доплеровский сдвиг** для движущихся приёмников.\n- **Затухание в атмосфере**: дождь, туман, газы."], "terms": [{"ru": "Электромагнитный спектр", "en": "electromagnetic spectrum", "df": "весь диапазон частот электромагнитного излучения"}, {"ru": "Несущая волна", "en": "carrier wave", "df": "гармонический сигнал, на котором модулируется информация"}, {"ru": "Длина волны", "en": "wavelength, λ", "df": "пространственный период волны; λ = c/f"}, {"ru": "Прямая видимость", "en": "line-of-sight, LOS", "df": "условие распространения сигнала без препятствий между передатчиком и приёмником"}, {"ru": "Ионосфера", "en": "ionosphere", "df": "слой атмосферы 60–1000 км, отражающий коротковолновые радиосигналы"}, {"ru": "ISM-диапазон", "en": "Industrial, Scientific, Medical", "df": "безлицензионные полосы для Wi-Fi, Bluetooth"}, {"ru": "Миллиметровые волны", "en": "mmWave", "df": "30–300 ГГц; используются в 5G NR FR2, 802.11ad"}, {"ru": "Микроволновый диапазон", "en": "microwave band", "df": "диапазон частот 1–300 ГГц; используется в Wi-Fi, спутниковой и мобильной связи"}, {"ru": "IrDA", "en": "Infrared Data Association", "df": "стандарт беспроводной передачи данных в инфракрасном диапазоне"}, {"ru": "Видимый диапазон", "en": "visible light", "df": "узкая полоса 380–750 нм (400–790 ТГц); используется в Li-Fi, FSO, оптоволокне"}, {"ru": "Ультрафиолет", "en": "ultraviolet, UV", "df": "10–380 нм; ионизирующее излучение; для связи — экспериментальные NLOS UV-каналы в солнечно-слепой полосе 200–280 нм"}, {"ru": "Рентгеновское излучение", "en": "X-rays", "df": "длины волн 0,01–10 нм; в связи практически не используется (демонстрация NASA XCOM)"}, {"ru": "Гамма-излучение", "en": "gamma rays", "df": "длины волн <0,01 нм; для связи неприменимо"}, {"ru": "Ионизирующее излучение", "en": "ionizing radiation", "df": "излучение с энергией фотонов выше ~3 эВ, способное выбивать электроны из атомов"}, {"ru": "Li-Fi", "en": "Light Fidelity", "df": "технология беспроводной передачи данных с использованием видимого света"}, {"ru": "FSO", "en": "Free Space Optics", "df": "оптическая беспроводная связь через открытое пространство (лазерный луч)"}, {"ru": "Затухание в атмосфере", "en": "atmospheric attenuation", "df": "поглощение радиосигнала атмосферными газами и осадками"}, {"ru": "Многолучевое распространение", "en": "multipath propagation", "df": "приход сигнала по нескольким путям, причина замираний"}, {"ru": "ITU-R", "en": "International Telecommunication Union, Radio sector", "df": "орган, координирующий распределение радиочастот"}], "summary": ["**Беспроводная связь** — передача через ЭМ-волны без направляющей среды; информацию несёт модулированная **несущая**", "c = f·λ; полоса определяет шенноновскую ёмкость; **окна прозрачности** vs линии поглощения (O₂ на 60 ГГц, H₂O на 22 ГГц)", "**ITU-R** через WRC координирует распределение спектра; **лицензируемые** (сотовая, ТВ) vs **ISM** (2,4/5 ГГц) и U-NII (5/6 ГГц)", "**VLF/LF** (3–300 кГц) — подводная связь, эталоны времени; **MF** (0,3–3 МГц) — AM-радио, поверхностная волна", "**HF** (3–30 МГц) — короткие, **отражение от ионосферы** (слои D/E/F), тысячи км без ретрансляторов (радиолюбители, морская/авиа)", "**VHF** (30–300 МГц) — FM (88–108 МГц), ТВ, авиадиспетчер; радио проникает через стены, но широковещательное", "**UHF** (0,3–3 ГГц) — сотовая (700–2100 МГц), GPS (1,575 ГГц), Wi-Fi 2,4 ГГц, DECT", "**SHF** (3–30 ГГц) — Wi-Fi 5/6 ГГц, спутники C/Ku/Ka, радиорелейка, радар", "**EHF / mmWave** (30–300 ГГц) — 5G FR2 (24–52 ГГц), 802.11ad/ay (60 ГГц, WiGig), автомобильный радар 77 ГГц", "Микроволны: **LOS** (прямая видимость), параболические антенны, поглощение в дождь (rain fade на Ka/mmWave)", "**Инфракрасный** (0,3–400 ТГц): не проникает через стёкла → естественная изоляция; пульты ~940 нм/38 кГц, **IrDA**, FSO", "**Видимый** (400–790 ТГц, 380–750 нм): **Li-Fi** (модуляция LED, до 10 Гбит/с), **FSO** (лазер, до неск. км), межспутниковые лазерные ISL", "**UV/рентген/гамма** — ионизирующие (E>3 эВ), не используются для связи; экспериментально NLOS UV в солнечно-слепой полосе 200–280 нм, NASA XCOM (рентген со спутника)", "Эффекты канала: затухание 1/r² в свободном пространстве; **multipath** → замирания + ISI → OFDM, MIMO, эквалайзеры", "**Доплеровский сдвиг** для движущихся; атмосферное затухание (дождь, туман, газы)"]}, {"n": 10, "title": "Спутниковая связь. Классификация спутников: геостационарные, средневысотные, низкоорбитальные. Спутники и оптоволокно.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Спутниковая связь** (satellite communication) — радиосвязь между двумя или более наземными точками через активный или пассивный **ретранслятор** (repeater) на околоземной орбите. Наземная станция отправляет сигнал по **восходящей линии** (uplink), спутник принимает его, усиливает, преобразует несущую частоту и ретранслирует обратно по **нисходящей линии** (downlink). Современные спутники несут несколько **транспондеров** (transponders) — независимых приёмо-передающих трактов, каждый со своей полосой (типично 36 МГц для классической C-полосы), а наиболее продвинутые аппараты имеют **бортовые процессоры обработки сигнала** (on-board processing) и **межспутниковые лазерные линии связи** (МСЛ, Inter-Satellite Link, ISL).", "<h3>Классификация по высоте орбиты</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/b/b4/Comparison_satellite_navigation_orbits.svg\" alt=\"Сравнение спутниковых орбит: НОО, СОО, ГСО\" loading=\"lazy\"><figcaption>Сравнение основных орбит в масштабе: НОО (МКС, Iridium, Starlink), СОО (GPS, ГЛОНАСС, Galileo), ГСО (геостационарные спутники связи и вещания). <em>Источник: Wikimedia Commons, cmglee, CC BY-SA 3.0.</em></figcaption></figure>", "- **Геостационарная орбита** (ГСО, GEO, Geostationary Earth Orbit) — высота **35 786 км** над экватором. Период обращения 24 ч, спутник «висит» неподвижно относительно Земли. Один аппарат покрывает ≈1/3 поверхности планеты; три равноотстоящих геостационарных спутника дают почти глобальное покрытие (кроме приполярных областей). **Задержка распространения** (propagation delay) туда-обратно ≈ 270 мс — критический минус для интерактивных приложений (IP-телефония, игры). Используется для **спутникового телевещания** (DTH, Direct-to-Home), малых земных станций (VSAT), морской и авиационной связи (Inmarsat). Полосы: C (4/6 ГГц), Ku (12/14 ГГц), Ka (20/30 ГГц).\n- **Средневысотная орбита** (СОО, MEO, Medium Earth Orbit) — 2 000–20 000 км, периоды обращения 2–12 ч. Задержка 35–85 мс, зона покрытия одного аппарата шире, чем у низкой орбиты. Главное применение — **глобальные навигационные системы** (ГНСС, GNSS, Global Navigation Satellite Systems): GPS (≈20 200 км), ГЛОНАСС (≈19 100 км), Galileo (≈23 200 км), BeiDou. Также интернет-операторы O3b mPOWER (8 062 км).\n- **Низкая околоземная орбита** (НОО, LEO, Low Earth Orbit) — 160–2 000 км, период обращения ≈ 90–120 мин. Малая задержка (5–20 мс) и низкая требуемая мощность передатчика, но каждый аппарат виден из конкретной точки на Земле всего 5–15 минут → необходимы **группировки спутников** (созвездия, constellations) из сотен и тысяч аппаратов и непрерывная **эстафетная передача** (хэндовер, handover) между ними. Примеры: **Starlink** (>6 000 аппаратов), **OneWeb** (~650), **Iridium NEXT** (66 рабочих + резервные), **Kuiper** (Amazon, в развёртывании).", "<h3>Распределение спектра и частотные диапазоны</h3>", "| Диапазон | Полоса (ГГц) | Применение | Особенности |\n|---|---|---|---|\n| L | 1–2 | Inmarsat, GPS, спутниковое радио | малая полоса, проникает через листву |\n| C | 4/6 | классическая ГСО, ТВ | устойчив к дождю |\n| X | 7/8 | военные системы | защищённый |\n| Ku | 12/14 | спутниковое ТВ (DTH), VSAT | страдает от **дождевого ослабления** (rain fade) |\n| Ka | 20/30 | широкополосный доступ (Viasat) | большая полоса, сильное затухание в дождь |", "<h3>Спутники и оптоволокно</h3>", "- **Оптоволокно** (optical fiber) обеспечивает на много порядков большую пропускную способность (десятки Тбит/с на волокно) при задержке, ограниченной только скоростью света в стекле (≈5 мс на 1000 км). Доминирует на магистралях и там, где кабель уже проложен.\n- **Спутниковые каналы** незаменимы там, где прокладка кабеля экономически не оправдана или невозможна: морские и воздушные суда, удалённые посёлки, научные экспедиции, экстренная связь при разрушении наземной инфраструктуры. Себестоимость передачи бита через геостационарный спутник исторически была существенно выше, чем по оптике, но низкоорбитальные группировки эту разницу радикально сократили.\n- **Гибридные схемы**: магистральные операторы используют спутниковые каналы как резерв подводных кабелей.", "<h3>Дополнительные технические аспекты</h3>", "- **Передающая мощность** (transmit power) ограничена солнечными батареями (десятки кВт у крупных геостационарных аппаратов).\n- **Антенны**: на спутнике — **фазированные антенные решётки** (phased arrays) с электронным управлением лучом (**формирование диаграммы направленности**, beamforming); на земле — параболические зеркальные антенны для геостационарных спутников, плоские антенны с фазированной решёткой для низкоорбитальных группировок (абонентские терминалы Starlink).\n- **Стратосферные платформы связи** (HAPS, High-Altitude Platform Station) — самолёты или дирижабли на высоте ≈20 км, выполняющие роль «псевдо-спутников» (проект Google Loon, альянс HAPS).\n- **Регуляторика**: распределение частот и орбитальных позиций ГСО координирует **МСЭ** (Международный союз электросвязи, ITU); орбитальные позиции на геостационарной дуге — ограниченный международный ресурс."], "terms": [{"ru": "Спутниковая связь", "en": "satellite communication", "df": "радиосвязь между наземными точками через ретранслятор на околоземной орбите"}, {"ru": "Геостационарная орбита", "en": "ГСО, GEO, Geostationary Earth Orbit", "df": "круговая экваториальная орбита высотой 35 786 км; спутник неподвижен относительно земной поверхности"}, {"ru": "Средневысотная орбита", "en": "СОО, MEO, Medium Earth Orbit", "df": "орбита высотой 2 000–20 000 км; используется глобальными навигационными системами"}, {"ru": "Низкая околоземная орбита", "en": "НОО, LEO, Low Earth Orbit", "df": "орбита высотой 160–2 000 км; малая задержка, требует группировки из многих аппаратов"}, {"ru": "Транспондер", "en": "transponder", "df": "приёмо-передающий тракт спутника с собственной полосой частот (типично 36 МГц)"}, {"ru": "Восходящая линия", "en": "uplink", "df": "канал передачи от наземной станции к спутнику"}, {"ru": "Нисходящая линия", "en": "downlink", "df": "канал передачи от спутника к наземной станции"}, {"ru": "Задержка распространения", "en": "propagation delay", "df": "время прохождения сигнала от источника до приёмника; для ГСО RTT ≈ 270 мс"}, {"ru": "Малая земная станция", "en": "VSAT, Very Small Aperture Terminal", "df": "наземная антенна с малым диаметром (≤2,4 м) для двустороннего спутникового доступа"}, {"ru": "Группировка спутников", "en": "созвездие, satellite constellation", "df": "совокупность спутников, обеспечивающих совместное глобальное или зональное покрытие"}, {"ru": "Эстафетная передача", "en": "хэндовер, handover", "df": "переключение абонента между спутниками при их движении по орбите"}, {"ru": "Спутниковое телевещание", "en": "DTH, Direct-to-Home", "df": "прямое вещание со спутника на абонентские параболические антенны"}, {"ru": "Глобальная навигационная спутниковая система", "en": "ГНСС, GNSS", "df": "система определения координат: GPS, ГЛОНАСС, Galileo, BeiDou"}, {"ru": "Межспутниковая линия связи", "en": "МСЛ, ISL, Inter-Satellite Link", "df": "линия связи между двумя спутниками, обычно лазерная"}, {"ru": "Дождевое ослабление", "en": "rain fade", "df": "деградация Ku/Ka-сигнала из-за поглощения водяными каплями"}, {"ru": "Стратосферная платформа связи", "en": "HAPS, High-Altitude Platform Station", "df": "летательный аппарат на высоте ≈20 км, играющий роль «псевдо-спутника»"}, {"ru": "Фазированная антенная решётка", "en": "phased array antenna", "df": "антенна с электронным управлением направлением луча без механического поворота"}], "summary": ["**Спутниковая связь** — радиосвязь между точками через ретранслятор на орбите; **uplink** ↑ + **downlink** ↓", "Несколько **транспондеров** (тип. 36 МГц в C-полосе); современные — on-board processing и лазерные **МСЛ/ISL**", "**GEO** (35 786 км, экватор, T=24 ч): «висит», 1/3 Земли с одного, 3 спутника — почти глобально (кроме полюсов)", "GEO задержка RTT ≈ **270 мс** → плохо для интерактива; применение: DTH-ТВ, **VSAT**, Inmarsat", "**MEO** (2 000–20 000 км): RTT 35–85 мс; **ГНСС**: GPS (20 200), ГЛОНАСС (19 100), Galileo (23 200), BeiDou; O3b mPOWER", "**LEO** (160–2 000 км, T≈90–120 мин): RTT 5–20 мс, низкая мощность, виден 5–15 мин → нужны созвездия и **хэндовер**", "LEO примеры: **Starlink** (>6000), OneWeb (~650), Iridium NEXT (66), Amazon Kuiper", "Частоты: L (1–2 ГГц, Inmarsat/GPS), C (4/6, ГСО ТВ, устойчив к дождю), X (7/8, военные)", "Ku (12/14, DTH, страдает от **rain fade**), **Ka** (20/30, широкополосный Viasat, большая полоса, сильное затухание)", "**Оптоволокно**: десятки Тбит/с, задержка ~5 мс/1000 км → доминирует на магистралях", "Спутник незаменим: суда, самолёты, удалённые посёлки, экстренная связь; LEO сильно сократили разрыв с оптикой", "Гибрид: спутник как резерв подводных кабелей", "Антенны: на спутнике — **phased arrays** с beamforming; на земле — параболика (GEO) или плоские фазированные (Starlink-терминал)", "**HAPS** (стратосферные платформы, ~20 км, Google Loon) — «псевдо-спутники»", "ITU координирует частоты и орбитальные позиции ГСО — ограниченный ресурс"]}, {"n": 11, "title": "Цифровая модуляция и мультиплексирование. Низкочастотная передача. Передача в полосе пропускания. Частотное уплотнение. Мультиплексирование с разделением времени. Кодовое разделение каналов.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "На физическом уровне решаются две взаимодополняющие задачи. **Цифровая модуляция** (digital modulation) — преобразование потока битов в физический (электрический, оптический, радио) сигнал, пригодный для передачи через конкретный канал. **Мультиплексирование** (multiplexing) — совместное использование одного физического ресурса (полосы частот, времени, среды) несколькими логическими потоками от разных источников. Модуляция отвечает на вопрос «**как** упаковать биты в сигнал», мультиплексирование — «**как** разделить общий канал между N пользователями». Без модуляции данные нельзя передать; без мультиплексирования инфраструктура связи была бы экономически нежизнеспособной (для каждой пары абонентов пришлось бы прокладывать отдельный кабель).", "Существуют три принципиальных способа разделения ресурса канала — по частоте (FDM), по времени (TDM) и по коду (CDMA); они могут комбинироваться (например, **OFDMA** в LTE/5G — FDM + TDM, **GSM** — FDM + TDM).", "<h3>Низкочастотная передача</h3>", "При **низкочастотной передаче** (baseband) сигнал занимает полосу от нуля (постоянной составляющей) до некоторой f<sub>max</sub>, без переноса на несущую. Применяется в проводных каналах с ограниченной дальностью — внутри ЛВС, шин и устройств: Ethernet (10BASE-T/100BASE-TX/1000BASE-T), USB, RS-232, шины SATA/PCIe. Главная задача — **линейное кодирование** (line coding), обеспечивающее достаточное число переходов уровня для извлечения тактового сигнала на приёмнике (clock recovery) и спектр, согласованный с возможностями кабеля.", "<h4>NRZ — Non-Return-to-Zero</h4>", "Простейший линейный код: «1» кодируется одним постоянным уровнем напряжения (например, +V), «0» — другим (−V в биполярной NRZ, или 0 В в униполярной). За время одного бита сигнал не возвращается к нулю — отсюда название. Если в потоке идут 1010101…, переходы между уровнями происходят на каждой границе бита, и приёмник легко восстанавливает тактовый сигнал. Но если приходит длинная серия одинаковых битов (например, 0000000…), сигнал держится на одном уровне, и приёмник теряет синхронизацию — его внутренний тактовый генератор постепенно «уплывает» (clock drift). Вторая проблема — **постоянная составляющая** (DC offset): если в данных больше нулей, чем единиц (или наоборот), у сигнала появляется ненулевой средний уровень, что мешает работе трансформаторной развязки и AC-связи в кабелях. NRZ применяется на коротких прямых линиях (RS-232, шинные интерфейсы) и как «внутренний» код для последующих преобразований.", "<h4>NRZI — Non-Return-to-Zero Inverted</h4>", "Кодирование **по переходам, а не по уровням**: значение бита определяется наличием или отсутствием перехода уровня в начале битового интервала. По соглашению **IEEE**: «1» = переход (изменение уровня), «0» = отсутствие перехода (уровень сохраняется). Это автоматически решает проблему длинных серий **единиц** — каждая «1» создаёт переход, по которому приёмник синхронизирует такт. Длинные серии **нулей** остаются проблемой, поэтому NRZI обычно комбинируют с кодом, исключающим много нулей подряд: например, в **FDDI** и **100BASE-TX** перед NRZI применяется **4B/5B** (никогда нет более 3 нулей подряд), а в **USB 1.1/2.0** — **bit stuffing** (вставка обратного бита после шести единиц подряд, чтобы NRZI давал переход — в USB конвенция инвертированная: «0» = переход, «1» = нет). NRZI ценен тем, что нечувствителен к инверсии полярности кабеля — приёмник видит только наличие переходов.", "<h4>Манчестерское кодирование</h4>", "**Самосинхронизирующийся** код: каждый битовый интервал делится на две равные половины, и в его **середине** обязательно происходит переход уровня. Направление этого перехода кодирует значение бита. По соглашению **IEEE 802.3** (Ethernet 10BASE-T): переход «низкий → высокий» в середине = «1», переход «высокий → низкий» = «0» (в оригинальной конвенции Дж. Э. Томаса — обратное). На границе битов уровень при необходимости «подстраивается» (тоже переходом), чтобы обеспечить нужное направление в середине следующего бита.", "Главное достоинство — **гарантированный переход в каждом бите**, благодаря чему приёмник никогда не теряет тактовую синхронизацию, как бы ни выглядели данные. Сигнал также автоматически **DC-сбалансирован**: за один бит проводится равное время на «верху» и «низу», средняя составляющая = 0. Цена — **удвоение требуемой полосы**: эффективная скорость в символах (бод) в два раза выше скорости в битах. Для 10 Мбит/с Ethernet это означало полосу ≈10 МГц при битовой скорости 10 Мбит/с. Из-за такой неэффективности Manchester заменили в Fast Ethernet более экономными блочными кодами (4B/5B). **Дифференциальное манчестерское кодирование** — вариант, где направление переходов в середине одинаково, а **отсутствие или наличие** перехода на границе бита кодирует значение (применялось в Token Ring).", "<h4>Прочие линейные коды</h4>", "- **Биполярный код AMI** (Alternate Mark Inversion) — «1» чередует положительный и отрицательный импульсы, «0» — нулевой уровень. Три уровня (+, 0, −) → нет постоянной составляющей. Длинные нули остаются проблемой; модификация **HDB3** (E1) принудительно вставляет специальные паттерны нарушения полярности при 4 нулях подряд, чтобы гарантировать переходы.\n- **Блочные коды**: **4B/5B** (Fast Ethernet 100BASE-TX, FDDI) кодирует 4 бита 5-битным символом, исключая длинные нулевые серии; **8B/10B** (Gigabit Ethernet, SATA, PCIe Gen1/2) даёт строго DC-сбалансированный поток ценой 25% избыточности; **64B/66B** (10G Ethernet) снижает избыточность до 3%, добавляя 2-битный синхрозаголовок.\n- **Многоуровневая PAM** (Pulse Amplitude Modulation): **PAM-5** в **1000BASE-T** использует 5 уровней (включая один «псевдоуровень» для упреждающей коррекции ошибок) и передаёт 2 бита на символ по витой паре Cat5e с символьной частотой 125 МГц по 4 парам одновременно → 1 Гбит/с. В 10GBASE-T применяется **PAM-16**, в 2.5G/5GBASE-T — PAM-16 на сниженной частоте.", "Скорость в символах называется **бодом** (baud rate); скорость в битах = бод × log₂V, где V — число различимых уровней или состояний.", "<h3>Передача в полосе пропускания</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/6/6f/Rectangular_constellation_for_QAM.svg\" alt=\"Прямоугольное созвездие квадратурной амплитудной модуляции (QAM)\" loading=\"lazy\"><figcaption>Прямоугольное созвездие 64-QAM: каждая точка соответствует комбинации амплитуды и фазы, кодирующей 6 битов. Чем плотнее созвездие, тем выше требования к SNR. <em>Источник: Wikimedia Commons, CC BY-SA 4.0.</em></figcaption></figure>", "При **передаче в полосе пропускания** (passband transmission) биты модулируют гармоническую **несущую** (carrier) частоты f<sub>c</sub>, и спектр сигнала сосредоточен в полосе [f<sub>c</sub> − B/2, f<sub>c</sub> + B/2]. Это необходимо в трёх случаях: (1) когда канал не пропускает низкие частоты — все радиоканалы и беспроводные среды (электромагнитное излучение требует антенну размером λ/2 → радиочастоты); (2) когда несколько источников делят одну среду по FDM — нужно сдвинуть каждый поток на свою несущую; (3) когда канал имеет полосовую (а не низкочастотную) АЧХ — например, телефонная линия 300–3400 Гц.", "Базовые виды модуляции:", "- **Амплитудная манипуляция** (ASK, Amplitude Shift Keying) — биты меняют амплитуду несущей. Простейший вариант OOK (On-Off Keying) применяется в оптических линиях связи. Уязвима к замираниям сигнала.\n- **Частотная манипуляция** (FSK, Frequency Shift Keying) — биты меняют частоту. Использовалась в модемах Bell 103/V.21 (300 бит/с); GFSK — в Bluetooth.\n- **Фазовая манипуляция** (PSK, Phase Shift Keying) — биты меняют фазу: **BPSK** (2 фазы, 1 бит/символ), **QPSK** (4 фазы, 2 бита/символ), 8-PSK (3 бита/символ). QPSK — основа спутниковой связи и ранних модемов V.22.\n- **Квадратурная амплитудная модуляция** (QAM, Quadrature Amplitude Modulation) — одновременная модуляция амплитуды и фазы; представляется **созвездием** (constellation) точек в плоскости синфазной (I) и квадратурной (Q) составляющих. **16-QAM** — 4 бита/символ, **64-QAM** — 6, **256-QAM** — 8, **1024-QAM** (Wi-Fi 6) — 10, **4096-QAM** (Wi-Fi 7, кабельный DOCSIS 4.0) — 12. Чем плотнее созвездие — тем больше бит/с/Гц, но тем выше требуется отношение сигнал/шум (SNR).", "**Спектральная эффективность** (spectral efficiency) измеряется в бит/с/Гц; для n-QAM при идеальном фильтре равна log₂(n). Зависимость BER от **Eb/N₀** (отношения энергии бита к спектральной плотности шума) задаёт практический потолок.", "На приёмнике помимо демодуляции выполняются: **синхронизация несущей** (carrier recovery), **тактовая синхронизация** (symbol timing recovery), **эквализация** для компенсации искажений канала.", "<h3>Частотное уплотнение (FDM)</h3>", "В **частотном уплотнении** (FDM, Frequency Division Multiplexing) общая полоса канала делится на несколько неперекрывающихся **поддиапазонов** (sub-bands), и каждый назначается одному логическому каналу. Все источники передают одновременно, но на разных несущих. Между соседними каналами оставляются **защитные интервалы** (guard bands), предотвращающие взаимные помехи из-за неидеальности фильтров.", "Классический пример (по Таненбауму): объединение N телефонных каналов по 4 кГц в групповой сигнал — каждому абоненту сдвиг на свою несущую через смеситель, на приёмной стороне — банк полосовых фильтров и обратные демодуляторы.", "- **AM/FM-радио и аналоговое ТВ** — миллионы FDM-каналов в эфире, распределение частот координирует МСЭ.\n- **ADSL** использует **DMT** (Discrete MultiTone) — 256 поднесущих по 4,3125 кГц в полосе до 1,1 МГц, каждая модулируется QAM независимо в зависимости от шума на своей частоте.\n- **WDM/DWDM** (Wavelength Division Multiplexing) — оптический FDM по длинам волн; типично 80–160 каналов по 50–100 ГГц в C-полосе (1530–1565 нм); каждый канал несёт 100–800 Гбит/с.\n- **FDMA** (Frequency Division Multiple Access) — динамическое FDM на множество абонентов, исторически основа аналоговой сотовой связи (AMPS).", "**OFDM** (Orthogonal FDM) — современное развитие: поднесущие выбираются взаимно **ортогональными** (расстояние Δf = 1/T, где T — длительность символа), и их спектральные «лепестки» могут перекрываться без интерференции. Защитные интервалы между поднесущими не нужны → высокая спектральная эффективность. Кроме того, OFDM прекрасно борется с **межсимвольной интерференцией** (ISI) в многолучевом канале через циклический префикс. Лежит в основе **Wi-Fi 802.11a/g/n/ac/ax**, **LTE**, **5G NR**, **DVB-T**, **DAB**, **DSL**.", "<h3>Мультиплексирование с разделением времени (TDM)</h3>", "В **мультиплексировании с разделением времени** (TDM, Time Division Multiplexing) каждый источник получает периодически повторяющийся **временной слот** (time slot) в общем канале. N слотов формируют **кадр** (frame), а кадры повторяются с фиксированной частотой. Все источники должны быть синхронизированы общим тактом.", "- **Синхронный TDM** (STDM, synchronous TDM) — слоты жёстко закреплены за источниками; даже если источник молчит, его слот пустует, и пропускная способность теряется. Применяется в телефонии и магистральных каналах.\n- **Статистический TDM** (statistical / asynchronous TDM) — слоты выделяются динамически только активным источникам; повышает утилизацию, но требует мультиплексирования адресов. Концептуально близок к пакетной коммутации.\n- **Цифровая телефония** — основа TDM: голос дискретизируется на 8 кГц с 8 битами/отсчёт по PCM → **64 кбит/с** на канал. Это число определило всю иерархию TDM.\n- **Иерархия PDH** (Plesiochronous Digital Hierarchy): **E1** (европейский стандарт) = 32 слота × 64 кбит/с = **2,048 Мбит/с** (30 голосовых каналов + 2 служебных); **E2** = 4 × E1 = 8,448 Мбит/с; **E3** = 34,368 Мбит/с; **E4** = 139,264 Мбит/с. Американский **T1** = 24 × 64 кбит/с = **1,544 Мбит/с**.\n- **Иерархия SDH/SONET** (Synchronous Digital Hierarchy) пришла на смену PDH в магистральных оптических сетях: **STM-1** = 155,52 Мбит/с, **STM-4** = 622 Мбит/с, **STM-16** = 2,488 Гбит/с, **STM-64** = 9,953 Гбит/с, **STM-256** = 39,8 Гбит/с. Жёсткая синхронизация от атомных часов.\n- **TDMA** (Time Division Multiple Access) — динамическое распределение слотов между мобильными абонентами; основа **GSM** (8 слотов в кадре 4,615 мс), DECT, ZigBee.", "<h3>Кодовое разделение каналов (CDMA)</h3>", "В **кодовом разделении каналов** (CDMA, Code Division Multiple Access) все станции передают одновременно в одной и той же полосе, но каждая **умножает свои биты на уникальную псевдослучайную последовательность** (chipping code, расширяющий код) длиной L бит/чипов. Спектр сигнала расширяется в L раз — это **расширение спектра прямой последовательностью** (DSSS, Direct Sequence Spread Spectrum). На приёмнике принятая смесь сигналов **коррелируется** с тем же расширяющим кодом нужного абонента: его сигнал восстанавливается, а сигналы остальных станций оказываются взаимно ортогональными (или почти ортогональными) и подавляются как шум.", "- **Ортогональные коды Уолша–Адамара** длины 2<sup>k</sup> обеспечивают полную развязку при синхронной передаче (нисходящий канал базовой станции). **Коды Голда** и **М-последовательности** псевдослучайны и используются в асинхронном восходящем канале и в GPS.\n- **Выигрыш обработки** (processing gain) G = L = T<sub>b</sub>/T<sub>c</sub> (отношение длительности бита к длительности чипа); для cdmaOne G = 64, что эквивалентно усилению SNR на 18 дБ.\n- **Near-far problem**: ближайший к базовой станции передатчик «глушит» дальние; решается жёстким **контролем мощности** на 800 раз/с.\n- **Soft handover** («мягкий хэндовер»): абонент может одновременно поддерживать связь с несколькими сотами, что снижает обрывы при переключении.\n- Применения: **cdmaOne/IS-95** и **CDMA2000** (3G в США/Корее), восходящий канал **UMTS** (W-CDMA), все спутники **GPS** (каждый спутник имеет свой Gold-код), **802.11b** в части CCK.", "<h3>Гибридные схемы и сравнение</h3>", "| Метод | Что разделяется | Гибкость | Пример |\n|---|---|---|---|\n| FDM | частота | низкая (фиксированные полосы) | AM/FM-радио, DWDM |\n| TDM | время | средняя (слоты) | E1/SDH, GSM |\n| CDMA | код | высокая (статистическое перекрытие) | cdmaOne, GPS |\n| OFDM | ортогональные поднесущие | очень высокая | Wi-Fi, LTE, 5G |\n| OFDMA | поднесущие × время | максимальная | LTE/5G NR (Resource Block) |", "**OFDMA** (Orthogonal FDMA), используемый в LTE и 5G, — комбинация частотного и временного деления: каждому пользователю выделяется подмножество поднесущих в подмножестве временных слотов, формирующее **Resource Block** (12 поднесущих × 7 OFDM-символов). Это позволяет адаптивно распределять ресурс с гранулярностью килогерц/миллисекунд."], "terms": [{"ru": "Цифровая модуляция", "en": "digital modulation", "df": "процесс изменения параметров несущего сигнала в соответствии с передаваемыми цифровыми данными"}, {"ru": "Демодуляция", "en": "demodulation", "df": "обратное преобразование сигнала в биты на приёмнике"}, {"ru": "Мультиплексирование", "en": "multiplexing", "df": "совместное использование одного физического канала несколькими логическими потоками"}, {"ru": "Низкочастотная передача", "en": "baseband", "df": "передача сигнала без переноса на несущую; полоса от нуля до f<sub>max</sub>"}, {"ru": "Передача в полосе пропускания", "en": "passband transmission", "df": "передача с модуляцией несущей; сигнал сосредоточен вокруг частоты f<sub>c</sub>"}, {"ru": "Несущая", "en": "carrier", "df": "гармонический сигнал f<sub>c</sub>, модулируемый битами"}, {"ru": "Линейный код", "en": "line coding", "df": "способ кодирования битов в форму электрического сигнала на физическом уровне"}, {"ru": "NRZ / NRZI", "en": "Non-Return-to-Zero / Inverted", "df": "линейные коды, в которых сигнал не возвращается к нулю между битами"}, {"ru": "Манчестерский код", "en": "Manchester encoding", "df": "самосинхронизирующийся код с переходом в середине каждого бита"}, {"ru": "PAM", "en": "Pulse Amplitude Modulation", "df": "амплитудно-импульсная модуляция; PAM-5 в 1000BASE-T кодирует 2 бита на символ"}, {"ru": "Скорость в бодах", "en": "baud rate", "df": "число символов в секунду; связана со скоростью в битах как Rb = baud × log₂V"}, {"ru": "Амплитудная манипуляция", "en": "ASK, Amplitude Shift Keying", "df": "модуляция изменением амплитуды; частный случай OOK"}, {"ru": "Частотная манипуляция", "en": "FSK, Frequency Shift Keying", "df": "модуляция изменением частоты несущей"}, {"ru": "Фазовая манипуляция", "en": "PSK, Phase Shift Keying", "df": "модуляция изменением фазы; BPSK/QPSK/8-PSK"}, {"ru": "Квадратурная амплитудная модуляция", "en": "QAM, Quadrature Amplitude Modulation", "df": "одновременное изменение амплитуды и фазы"}, {"ru": "Созвездие", "en": "constellation", "df": "представление точек QAM/PSK на плоскости синфазной (I) и квадратурной (Q) составляющих"}, {"ru": "Спектральная эффективность", "en": "spectral efficiency", "df": "количество бит/с на 1 Гц полосы пропускания; для n-QAM = log₂(n)"}, {"ru": "Частотное уплотнение", "en": "FDM, Frequency Division Multiplexing", "df": "разделение канала на неперекрывающиеся поддиапазоны"}, {"ru": "Защитный интервал", "en": "guard band", "df": "частотный зазор между соседними FDM-каналами для предотвращения помех"}, {"ru": "OFDM", "en": "Orthogonal Frequency Division Multiplexing", "df": "мультиплексирование на ортогональных поднесущих; основа Wi-Fi, LTE, 5G"}, {"ru": "DMT", "en": "Discrete MultiTone", "df": "реализация OFDM в ADSL: 256 поднесущих с независимой QAM"}, {"ru": "WDM / DWDM", "en": "Wavelength Division Multiplexing", "df": "оптическое FDM по длинам волн"}, {"ru": "Временное уплотнение", "en": "TDM, Time Division Multiplexing", "df": "разделение канала на временные слоты"}, {"ru": "Синхронный TDM", "en": "STDM", "df": "слоты жёстко закреплены за источниками"}, {"ru": "Кадр TDM", "en": "TDM frame", "df": "последовательность слотов, повторяющаяся с фиксированной частотой"}, {"ru": "PDH", "en": "Plesiochronous Digital Hierarchy", "df": "иерархия скоростей: E1 = 2,048 Мбит/с (Европа), T1 = 1,544 Мбит/с (США)"}, {"ru": "SDH / SONET", "en": "Synchronous Digital Hierarchy", "df": "синхронная иерархия: STM-1 = 155,52 Мбит/с, STM-64 ≈ 10 Гбит/с"}, {"ru": "TDMA", "en": "Time Division Multiple Access", "df": "множественный доступ с временным разделением; основа GSM"}, {"ru": "Кодовое разделение каналов", "en": "CDMA, Code Division Multiple Access", "df": "все станции передают в одной полосе с уникальными расширяющими кодами"}, {"ru": "DSSS", "en": "Direct Sequence Spread Spectrum", "df": "расширение спектра прямой псевдослучайной последовательностью"}, {"ru": "Расширяющий код", "en": "chipping code / spreading code", "df": "последовательность чипов, на которую умножается бит данных"}, {"ru": "Коды Уолша–Адамара", "en": "Walsh–Hadamard codes", "df": "ортогональные расширяющие коды для синхронного CDMA"}, {"ru": "Выигрыш обработки", "en": "processing gain", "df": "отношение полосы расширенного сигнала к полосе данных; G = T<sub>b</sub>/T<sub>c</sub>"}, {"ru": "Soft handover", "en": "мягкий хэндовер", "df": "одновременное удержание связи с несколькими базовыми станциями в CDMA"}, {"ru": "OFDMA", "en": "Orthogonal FDMA", "df": "комбинация OFDM и TDM в LTE/5G; ресурс распределяется блоками частоты × времени"}], "summary": ["**Модуляция** — преобразование битов в физический сигнал; **мультиплексирование** — деление общего канала", "**Baseband** (низкочастотная): полоса от 0 до f<sub>max</sub>, без несущей; LAN, USB, диски", "Линейные коды: **NRZ** (1=high/0=low, теряет синхро при длинных сериях); **NRZI** (переход=1, USB)", "**Манчестер**: переход в середине бита (↑=1, ↓=0), самосинхронизация, но 2 перехода/бит (10BASE-T)", "Блочные коды: **4B/5B** (Fast Ethernet), **8B/10B** (Gigabit), **64B/66B** (10G) — гарантируют переходы при минимальной избыточности", "**Passband**: модуляция несущей f<sub>c</sub> — биты меняют параметры синусоиды", "**ASK** (амплитуда; OOK в оптике), **FSK** (частота; Bell 103, BT GFSK), **PSK** (фаза; BPSK/QPSK/8-PSK)", "**QAM** = амплитуда + фаза, **созвездие** в (I,Q): 16-QAM=4 бит, 64=6, 256=8, **1024-QAM** (Wi-Fi 6)=10, **4096-QAM** (Wi-Fi 7)=12", "Спектральная эффективность n-QAM = log₂(n) бит/с/Гц при идеальном фильтре", "**FDM** (Frequency Division Multiplexing) — поддиапазоны + защитные интервалы; AM/FM, аналоговое ТВ, ADSL (DMT 256 поднесущих), WDM", "**OFDM** — ортогональные поднесущие, перекрывающиеся лепестки, защитных интервалов нет; Wi-Fi (802.11a+), LTE, **5G NR**, DVB-T", "**TDM** (Time Division): циклические слоты в кадре; синхронный (закреплены) vs статистический (по запросу)", "TDM иерархия: **E1** = 32×64 кбит/с = **2,048 Мбит/с** (Европа); **T1** = 24×64 = 1,544 Мбит/с; STM-1 = 155,52 Мбит/с (SDH)", "**CDMA** (Code Division): все на одной полосе одновременно, умножение на ортогональный chipping code (**DSSS**)", "Коды **Уолша–Адамара**; применения: cdmaOne/CDMA2000, UMTS uplink, GPS (свой код у каждого спутника)", "Плюсы CDMA: soft handover, устойчивость к узкополосным помехам; минусы: near-far problem, контроль мощности", "**OFDMA** (LTE/5G) — гибрид: пользователь получает подмножество поднесущих в подмножестве слотов (Resource Block)"]}, {"n": 12, "title": "Коммутируемая телефонная сеть общего пользования. Структура телефонной системы.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**PSTN** (Public Switched Telephone Network), русск. **ТФОП** (телефонная сеть общего пользования) — глобальная иерархическая сеть, обеспечивающая голосовую связь между абонентами с помощью **коммутации каналов** (circuit switching). При установлении соединения через всю сеть резервируется фиксированный путь с гарантированной полосой 64 кбит/с, который удерживается на всё время разговора и освобождается после отбоя. Это исторически первая глобальная цифровая сеть, в основе которой лежат стандарты ITU-T, и архитектурный антипод пакетного Интернета.", "<h3>Структура PSTN</h3>", "Иерархия от абонента к магистрали:", "- **Абонентский шлейф** (subscriber loop / **local loop**) — медная витая пара от телефонного аппарата до ближайшей АТС, длиной обычно до 5–7 км. По ней передаётся аналоговый сигнал в полосе ~300–3400 Гц и питание −48 В постоянного тока. По этой же линии работают xDSL.\n- **Местная АТС** (CO, Central Office; русск. **АТС**, автоматическая телефонная станция) — оконечный узел, к которому подключены тысячи абонентов района. Здесь происходит оцифровка голоса и первичная коммутация.\n- **Узловые / транзитные АТС** (toll office, tandem office) — соединяют группы местных АТС в пределах региона.\n- **Междугородные центры коммутации** (primary, sectional, regional centers) — иерархические уровни для дальней связи.\n- **Международные шлюзы** (international gateway exchange) — связь с PSTN других стран по подводным кабелям и через спутники.", "Между АТС каналы объединяются в **транковые линии**: исторически медь, сегодня преимущественно оптика, поверх которой передаётся TDM-иерархия (PDH/SDH).", "<h3>Оцифровка голоса: PCM</h3>", "**PCM** (Pulse Code Modulation, импульсно-кодовая модуляция, стандарт **ITU-T G.711**):\n- Полоса голоса 300–3400 Гц.\n- Частота дискретизации **8 000 Гц** (по теореме Котельникова/Найквиста — вдвое выше максимальной частоты сигнала).\n- Каждый отсчёт квантуется в **8 бит** по нелинейной шкале (μ-закон в Северной Америке/Японии, A-закон в Европе/России) — нелинейность улучшает SNR при малых амплитудах.\n- Скорость: 8 000 × 8 = **64 кбит/с** на голосовой канал — это базовый «канал DS-0».", "Современные кодеки голоса (G.729 — 8 кбит/с, AMR-WB, Opus) сжимают речь без потери качества в 4–8 раз и применяются в VoIP.", "<h3>Транковая иерархия</h3>", "Каналы 64 кбит/с агрегируются мультиплексированием с разделением времени:", "- **E1** (Европа, ITU-T G.703): 32 слота × 64 кбит/с = **2,048 Мбит/с**. Слоты 0 и 16 — служебные (синхронизация и сигнализация), 30 — голосовые.\n- **T1** (США, Япония): 24 слота × 64 кбит/с + биты синхронизации = **1,544 Мбит/с**.\n- Дальше — PDH (E2=8 Мбит/с, E3=34, E4=140) и SDH (STM-1=155 Мбит/с, STM-16=2,5 Гбит/с, STM-64=10 Гбит/с) поверх оптики.", "<h3>Сигнализация</h3>", "Управление вызовами — установление, разрыв, набор номера, тарификация — выделено в **отдельную сеть сигнализации**:\n- Исторически **CAS** (Channel Associated Signaling) — сигналы в служебных битах самого канала (R1/R2).\n- Современный стандарт — **SS7** (Signaling System 7, в России **ОКС-7**, ITU-T Q.700) — пакетная сеть, независимая от каналов разговора. Уровни: MTP1–3, SCCP, TCAP, ISUP (для управления вызовами), MAP (для роуминга в GSM).\n- SS7 также обеспечивает услуги интеллектуальной сети (IN): переадресация, freephone (800-номера), CallerID, портация номера (MNP).", "<h3>Современное состояние и переход на IP</h3>", "PSTN постепенно замещается:\n- **VoIP** (Voice over IP) — пакетная передача голоса по IP с кодеками G.711/G.729/Opus, протоколами **SIP** (Session Initiation Protocol, RFC 3261) и **RTP** (Real-time Transport Protocol).\n- **IMS** (IP Multimedia Subsystem) — стандартизованная 3GPP архитектура мультимедиа-сервисов поверх IP для сотовых операторов; основа VoLTE и VoNR.\n- Многие национальные операторы (BT, Telekom, Ростелеком) объявили **All-IP transition** — отключение TDM-инфраструктуры в 2025–2030 гг."], "terms": [{"ru": "PSTN / ТФОП", "en": "Public Switched Telephone Network", "df": "коммутируемая телефонная сеть общего пользования"}, {"ru": "Коммутация каналов", "en": "circuit switching", "df": "метод, при котором перед передачей данных резервируется выделенный канал"}, {"ru": "АТС / CO", "en": "Central Office", "df": "узел коммутации, обслуживающий группу абонентов"}, {"ru": "Транзитная / междугородная АТС", "en": "toll exchange", "df": "узел коммутации более высокого уровня иерархии"}, {"ru": "PCM", "en": "Pulse Code Modulation", "df": "импульсно-кодовая модуляция; метод оцифровки аналогового голоса"}, {"ru": "SS7 / ОКС-7", "en": "Signaling System 7", "df": "протокол сигнализации для управления телефонными вызовами в PSTN"}, {"ru": "VoIP", "en": "Voice over IP", "df": "технология передачи голоса по IP-сетям"}, {"ru": "IMS", "en": "IP Multimedia Subsystem", "df": "архитектура мультимедиа-услуг поверх IP, основа VoLTE"}, {"ru": "SIP", "en": "Session Initiation Protocol", "df": "протокол сигнализации VoIP"}, {"ru": "POTS", "en": "Plain Old Telephone Service", "df": "традиционная аналоговая телефонная служба"}], "summary": ["**PSTN/ТФОП** — глобальная сеть с **коммутацией каналов**: на время разговора резервируется путь 64 кбит/с", "Архитектурно — антипод пакетного Интернета; стандартизация — **ITU-T**", "Иерархия: **абонентский шлейф** (local loop, медь 5–7 км, аналог 300–3400 Гц, питание −48 В) → **местная АТС** (CO) → транзитная → междугородная → международный шлюз", "По абонентскому шлейфу также работают **xDSL** (ADSL/VDSL)", "Транки между АТС: исторически медь, ныне оптика с PDH/SDH", "**PCM** (G.711): полоса 300–3400 Гц, дискретизация **8000 Гц** (Котельников), 8 бит/отсчёт = **64 кбит/с** (канал **DS-0**)", "Нелинейное квантование: **μ-закон** (США/Япония), **A-закон** (Европа/Россия) — улучшает SNR при малых амплитудах", "Современные кодеки: G.729 (8 кбит/с), AMR-WB, Opus — сжатие в 4–8 раз", "**E1** = 32×64 кбит/с = **2,048 Мбит/с** (слоты 0/16 служебные, 30 голосовых); **T1** = 1,544 Мбит/с", "Дальше PDH (E2/E3/E4) и SDH: STM-1 = 155 Мбит/с, STM-16 = 2,5 Гбит/с, STM-64 = 10 Гбит/с", "**Сигнализация — отдельная сеть**: исторически **CAS** (в служебных битах); современный — **SS7/ОКС-7** (ITU-T Q.700)", "Уровни SS7: MTP1-3, SCCP, **TCAP**, **ISUP** (вызовы), **MAP** (роуминг GSM)", "SS7 даёт IN-услуги: переадресация, freephone 800, CallerID, MNP (портация)", "Миграция: **VoIP** (SIP RFC 3261, RTP, кодеки G.711/729/Opus)", "**IMS** (IP Multimedia Subsystem) — архитектура 3GPP для VoLTE/VoNR", "All-IP transition: BT, Telekom, Ростелеком отключают TDM в 2025–2030 гг."]}, {"n": 13, "title": "Мобильная телефонная система. Поколения мобильных телефонов: аналоговая и цифровая передача информации.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Мобильная (сотовая) телефонная система** (cellular telephone system) — радиосеть, обеспечивающая голосовую связь и передачу данных абонентам, свободно перемещающимся в зоне обслуживания. Архитектурная основа — **сотовый принцип**: территория разбивается на относительно небольшие зоны-**соты** (cells), каждую из которых обслуживает своя стационарная **базовая станция**. Соседние соты используют разные частоты, удалённые могут переиспользовать одну и ту же — отсюда возможность обслуживать миллионы абонентов в ограниченном спектре.", "<h3>Принцип сотовой структуры</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/e/ee/Frequency_reuse.svg\" alt=\"Гексагональная структура сот и принцип повторного использования частот\" loading=\"lazy\"><figcaption>Принцип частотного переиспользования в сотовой сети: гексагональные соты сгруппированы в кластеры (здесь N=7); цвет показывает группу частот. Кластер периодически повторяется по сетке. <em>Источник: Wikimedia Commons, CC BY-SA 2.5.</em></figcaption></figure>", "- **Соты** идеализируются гексагонами (на практике форма зависит от рельефа и помех). Радиус — от 50 м (фемто-соты в офисах) до 30 км (макро-соты в сельской местности).\n- **Кластер** (cluster) — группа соседних сот, между которыми распределён весь набор частот; обычно N = 3, 7 или 12 (выводится из формулы N = i² + ij + j²).\n- **Коэффициент переиспользования** 1/N — доля общего спектра, доступная в одной соте; меньший N даёт больше частот на соту, но усиливает помехи от ко-канальных сот.\n- **Секторизация** — антенны с лучом 120° или 60° делят соту на сектора, утраивая число каналов.\n- **Иерархия сот** — макро/микро/пико/фемто-соты накладываются для управления плотностью трафика (HetNet).", "<h3>Архитектура сети</h3>", "- **RAN** (Radio Access Network) — радиоподсистема: базовые станции (BTS в GSM, NodeB в 3G, eNodeB в LTE, gNodeB в 5G) и их контроллеры (BSC, RNC).\n- **Опорная сеть** (Core Network) — коммутация, маршрутизация, аутентификация, биллинг. В 2G — **MSC** (Mobile Switching Center), реестры **HLR** (Home Location Register) и **VLR** (Visitor Location Register). В LTE — **EPC** (Evolved Packet Core): MME, S-GW, P-GW, HSS. В 5G — сервис-ориентированная архитектура: AMF, SMF, UPF, AUSF, UDM.\n- **Аутентификация и идентификация** через **SIM/USIM/eSIM** карту, хранящую **IMSI** и ключ Ki.\n- **Шлюзы** к ТФОП (GMSC) и к интернету (P-GW/UPF).", "<h3>Ключевые механизмы</h3>", "- **Хэндовер** (handover/handoff) — переключение активного соединения от одной БС к другой при движении абонента или ухудшении сигнала. **Hard handover** (GSM) — «break-before-make»; **soft handover** (CDMA) — «make-before-break», одновременная связь с несколькими БС.\n- **Роуминг** (roaming) — обслуживание абонента в сети другого оператора по межоператорскому соглашению; в GSM координируется через MAP/SS7.\n- **Регистрация местоположения** (location update) — телефон уведомляет сеть при переходе в новую LA (Location Area).\n- **Пейджинг** — поиск телефона при входящем вызове во всех сотах LA.\n- **Управление мощностью** (power control) — минимизация излучаемой мощности абонентом и БС для уменьшения помех и экономии батареи.", "<h3>Поколения мобильной связи</h3>", "- **1G** (1980-е) — **аналоговый** голос с FM-модуляцией. Стандарты **AMPS** (США, 800 МГц), **NMT-450/900** (Скандинавия), TACS (UK). Только голос, легко прослушивается, низкая ёмкость сети.\n- **2G** (1991) — переход на **цифру**. Стандарт **GSM** (Global System for Mobile Communications, ETSI) использует TDMA по 8 слотов на несущей шириной 200 кГц + FDMA в диапазонах 900/1800 МГц; голос кодирует Full-Rate codec (13 кбит/с). Появились **SMS**, шифрование A5/1, аутентификация по SIM. Альтернатива: **IS-95 / cdmaOne** (CDMA). Эволюция данных: **GPRS** (2,5G, пакетный режим до 114 кбит/с), **EDGE** (2,75G, до 384 кбит/с).\n- **3G** (2001) — мобильный широкополосный интернет. **UMTS / WCDMA** (3GPP, 5 МГц несущая, CDMA), до 2 Мбит/с; **HSPA/HSPA+** — до 42 Мбит/с. В США распространение получил **CDMA2000 EV-DO**.\n- **4G LTE** (Long-Term Evolution, 2009) — полностью пакетная **IP-only** сеть. **OFDMA** на нисходящем, SC-FDMA на восходящем канале, **MIMO** до 4×4. Полосы 1,4–20 МГц, агрегация несущих в LTE-Advanced. С
