ы пакетов"}, {"ru": "Дейтаграмма", "en": "datagram", "df": "независимый пакет с полной адресной информацией"}, {"ru": "Маршрутизация", "en": "routing", "df": "выбор пути пересылки пакета в сети"}, {"ru": "ATM", "en": "Asynchronous Transfer Mode", "df": "технология передачи на основе виртуальных каналов и ячеек фиксированного размера"}], "summary": ["Коммутация каналов (circuit sw.): выдел. путь, гарант. полоса, пост. задержка", "Коммут. каналов: неэфф. при пульсирующем трафике (PSTN)", "Коммут. пакетов: виртуальные каналы (ATM) или дейтаграммы (IP)", "Дейтаграмма: каждый пакет маршрутизируется независимо", "Маршрутизация: статическая (фикс. таблицы) и динамическая", "Канальный ур.: мосты/коммутаторы; сетевой ур.: маршрутизаторы"]}], "quizzes": [{"type": "mcq", "topic": "Вопрос 15", "q": "Какой метод формирования кадра используется в HDLC?", "opts": ["Счётчик символов в заголовке", "Флаговые байты с байт-стаффингом", "Флаговые биты с бит-стаффингом (после пяти единиц вставляется ноль)", "Нарушения физического кодирования"], "ans": 2, "expl": "В HDLC используются флаговые биты с бит-стаффингом: после пяти подряд идущих единиц вставляется ноль."}, {"type": "mcq", "topic": "Вопрос 15", "q": "Сколько классов сервисов канальный уровень предоставляет сетевому уровню?", "opts": ["Два: надёжная и ненадёжная доставка", "Три: ненадёжная без подтверждений, надёжная без установления соединения, надёжная с установлением соединения", "Четыре: с подтверждением, без подтверждения, с соединением, без соединения", "Один: надёжная доставка с подтверждениями"], "ans": 1, "expl": "Канальный уровень предоставляет три класса сервисов: ненадёжная доставка без подтверждений, надёжная без установления соединения и надёжная с установлением соединения."}, {"type": "tf", "topic": "Вопрос 15", "q": "Ненадёжная доставка без подтверждений применяется для каналов с низким уровнем ошибок, например Ethernet.", "ans": true, "expl": "Согласно материалу, ненадёжная доставка без подтверждений используется для каналов с низким уровнем ошибок, таких как Ethernet."}, {"type": "mcq", "topic": "Вопрос 16", "q": "Какое кодовое расстояние Хэмминга необходимо для исправления d ошибок?", "opts": ["d + 1", "2d", "2d + 1", "d + 2"], "ans": 2, "expl": "Для исправления d ошибок необходимо кодовое расстояние 2d+1."}, {"type": "tf", "topic": "Вопрос 16", "q": "Код Рида-Соломона работает на уровне отдельных битов, а не символов.", "ans": false, "expl": "Код Рида-Соломона — блочный код на символах (не битах), широко используется в DSL и оптических сетях."}, {"type": "mcq", "topic": "Вопрос 16", "q": "На чём основан циклический избыточный код (CRC)?", "opts": ["На подсчёте числа единиц в сообщении", "На суммировании 16-битовых слов", "На делении полинома сообщения на порождающий полином в поле GF(2)", "На умножении матриц чётности"], "ans": 2, "expl": "CRC основан на делении полинома сообщения на порождающий полином в поле GF(2)."}, {"type": "mcq", "topic": "Вопрос 17", "q": "Какой протокол является непосредственным предшественником протоколов скользящего окна?", "opts": ["Протокол «Утопия»", "Симплексный протокол с ожиданием для канала без ошибок", "Протокол PAR (Positive Acknowledgement with Retransmission)", "Протокол Go-Back-N"], "ans": 2, "expl": "Симплексный протокол с ожиданием для зашумлённых каналов (PAR) — непосредственный предшественник протоколов скользящего окна."}, {"type": "tf", "topic": "Вопрос 17", "q": "В протоколе «Утопия» присутствует управление потоком, но отсутствует обработка ошибок.", "ans": false, "expl": "В протоколе «Утопия» отсутствуют и управление потоком, и обработка ошибок — это полностью идеализированный протокол."}, {"type": "tf", "topic": "Вопрос 17", "q": "В протоколе PAR для нумерации кадров достаточно 1 бита (номера 0 или 1).", "ans": true, "expl": "Каждый кадр нумеруется, и для этого достаточно 1 бита: 0 или 1."}, {"type": "mcq", "topic": "Вопрос 18", "q": "Каков максимальный размер окна отправителя в протоколе Go-Back-N при n-битовой нумерации?", "opts": ["2^n", "2^(n-1)", "2^n - 1", "n - 1"], "ans": 2, "expl": "В протоколе Go-Back-N размер окна отправителя не более 2^n - 1 при n-битовой нумерации."}, {"type": "tf", "topic": "Вопрос 18", "q": "В протоколе с выборочным повтором (Selective Repeat) получатель принимает кадры строго по порядку и не буферизует кадры, пришедшие не по порядку.", "ans": false, "expl": "В Selective Repeat получатель буферизует кадры, пришедшие не по порядку. Именно получатель Go-Back-N принимает кадры строго по порядку."}, {"type": "mcq", "topic": "Вопрос 18", "q": "Что ускоряет повторную передачу в протоколе с выборочным повтором, не дожидаясь таймаута?", "opts": ["ACK", "NAK (отрицательное подтверждение)", "Двойной ACK", "Сигнал заглушки"], "ans": 1, "expl": "Отрицательное подтверждение (NAK) ускоряет повтор конкретного утерянного кадра, не дожидаясь таймаута."}, {"type": "mcq", "topic": "Вопрос 19", "q": "Какова скорость базового блока SONET — STS-1 (OC-1)?", "opts": ["10 Мбит/с", "51,84 Мбит/с", "155 Мбит/с", "622 Мбит/с"], "ans": 1, "expl": "Базовый блок SONET — STS-1/OC-1 обеспечивает скорость 51,84 Мбит/с."}, {"type": "tf", "topic": "Вопрос 19", "q": "В ADSL полоса до 1,1 МГц делится на 256 подканалов шириной 4312,5 Гц каждый.", "ans": true, "expl": "Согласно материалу, в DMT полоса до 1,1 МГц делится на 256 подканалов шириной 4312,5 Гц."}, {"type": "mcq", "topic": "Вопрос 19", "q": "Какие подканалы DMT в ADSL используются для нисходящего потока?", "opts": ["0-5", "6-30", "31-255", "1-255"], "ans": 2, "expl": "Подканалы 31-255 используются для нисходящего потока, 6-30 — для восходящего."}, {"type": "mcq", "topic": "Вопрос 20", "q": "Какой пример дейтаграммной сети приведён в материале?", "opts": ["ATM", "Frame Relay", "IP", "PSTN"], "ans": 2, "expl": "IP — пример дейтаграммной сети, где каждый пакет маршрутизируется независимо."}, {"type": "tf", "topic": "Вопрос 20", "q": "Коммутация каналов характеризуется неэффективным использованием ресурсов при пульсирующем трафике.", "ans": true, "expl": "Среди недостатков коммутации каналов указано неэффективное использование ресурсов при пульсирующем трафике."}, {"type": "match", "topic": "Тема 3", "q": "Сопоставьте понятия канального уровня с их определениями.", "pairs": [{"l": "Байт-стаффинг", "r": "Вставка escape-байта перед специальными символами внутри кадра"}, {"l": "Кодовое расстояние Хэмминга", "r": "Минимальное число позиций, в которых два допустимых кодовых слова различаются"}, {"l": "Протокол «Утопия»", "r": "Идеальный протокол без ошибок и без управления потоком"}, {"l": "Go-Back-N", "r": "Стратегия повтора всех кадров начиная с ошибочного"}, {"l": "NAK", "r": "Отрицательное подтверждение, сигнализирующее об ошибке конкретного кадра"}, {"l": "SONET", "r": "Стандарт синхронной передачи данных по оптоволокну"}, {"l": "DMT", "r": "Многочастотное мультиплексирование с разделением полосы на подканалы"}], "expl": "Каждое понятие связано с соответствующим определением из материалов Темы 3."}]}, {"id": 4, "name": "Подуровень управления доступом к среде", "questions": [{"n": 21, "title": "Проблема распределения канала. Статическое распределение канала. Допущения, связанные с динамическим распределением каналов.", "paragraphs": ["**Проблема:** несколько устройств (станций) подключены к одному общему каналу связи (например, один кабель или одна радиочастота). Если два устройства передают одновременно — сигналы накладываются и данные портятся. Это называется **коллизия** (collision). Как разделить канал, чтобы этого не происходило?", "**Статическое распределение** — канал делится заранее, каждому устройству выделяется своя часть:\n- **FDM** (Frequency Division Multiplexing) — каждой станции своя полоса частот (как разные радиостанции на разных частотах).\n- **TDM** (Time Division Multiplexing) — каждой станции свой временной слот (станция 1 передаёт в слот 1, станция 2 — в слот 2, и т.д.).\n- Недостаток: если станция ничего не передаёт — её частота / слот всё равно занята и пустует.", "**Динамическое распределение** — канал не делится заранее. Станции сами решают, когда передавать, и разрешают конфликты по правилам протокола. Это эффективнее при неравномерной нагрузке.", "Допущения для анализа динамических протоколов:\n- Станции генерируют кадры **независимо** друг от друга.\n- Канал **один** — общий для всех.\n- **Коллизии наблюдаемы** — можно определить, что произошло столкновение.\n- Время бывает **непрерывное** (передача в любой момент) или **слотированное** (только в начале слота).\n- Осведомлённость о коллизии бывает **мгновенная** или **задержанная**."], "terms": [{"ru": "Разделяемая среда", "en": "shared medium", "df": "физическая среда, используемая несколькими станциями одновременно"}, {"ru": "FDM", "en": "Frequency Division Multiplexing", "df": "частотное разделение канала"}, {"ru": "TDM", "en": "Time Division Multiplexing", "df": "временное разделение канала"}, {"ru": "Коллизия", "en": "collision", "df": "одновременная передача двух и более станций, приводящая к искажению сигнала"}, {"ru": "Пульсирующий трафик", "en": "bursty traffic", "df": "трафик с резкими периодическими всплесками активности"}], "summary": ["Статич. распред.: FDM (по частоте), TDM (по времени) - простой ресурса", "Динамич. распред.: N станций конкурируют за 1 канал", "Допущения: независ. трафик, 1 канал, наблюд. коллизии", "Непрерывное или слотированное время передачи", "Мгновенная или задержанная осведомлённость о коллизии", "Статич. неэфф.: если станция молчит, её слот/полоса простаивает"]}, {"n": 22, "title": "Протоколы коллективного доступа. Система ALOHA. Протоколы множественного доступа с контролем несущей. Протоколы без столкновений. Протоколы с ограниченной конкуренцией. Протоколы беспроводных локальных сетей.", "paragraphs": ["Все протоколы решают одну задачу: как несколько станций делят один общий канал без хаоса.", "**1. ALOHA** (первый протокол случайного доступа, 1970):\n- **Чистая ALOHA** (Pure ALOHA) — станция передаёт когда хочет; если коллизия — ждёт случайное время и повторяет. Макс. эффективность **18,4%**\n- **Слотированная ALOHA** (Slotted ALOHA) — передача только в начале временного слота. Макс. эффективность **36,8%** (вдвое лучше, т.к. меньше шансов на столкновение)", "**2. CSMA** (Carrier Sense Multiple Access) — «слушай перед передачей»:\n- **1-упорный** (1-persistent) — если канал занят, ждёт и передаёт сразу при освобождении. Жадный, много коллизий. Основа Ethernet\n- **Ненастойчивый** (non-persistent) — если канал занят, ждёт случайное время, потом снова слушает. Меньше коллизий, но выше задержка\n- **p-настойчивый** (p-persistent) — при свободном канале передаёт с вероятностью p, откладывает с вероятностью (1−p). Компромисс между первыми двумя", "**3. CSMA/CD** (Collision Detection) — проводной Ethernet (IEEE 802.3):\n- Станция слушает канал **во время** своей передачи — если сигнал искажён, значит коллизия\n- При коллизии: стоп → **jam signal** (сигнал заглушки) → ожидание по **двоичному экспоненциальному откату** (binary exponential backoff): после k-й коллизии ждёт случайное число слотов от 0 до 2^min(k,10)−1\n- После 16 коллизий подряд — передача отменяется\n- В Wi-Fi не работает: станция не может одновременно передавать и слушать в эфире", "**4. Протоколы без столкновений** (collision-free) — коллизии исключены по конструкции:\n- **Побитовая карта** (bitmap) — станции по очереди объявляют намерение; затем передают без конфликтов\n- **Передача маркера** (token passing) — специальный кадр-маркер ходит по кольцу (Token Ring); только владелец маркера может передавать\n- **Двоичный обратный отсчёт** (binary countdown) — станции сравнивают адреса побитово; побеждает наибольший номер", "**5. Протоколы с ограниченной конкуренцией** (limited contention):\n- Гибрид: при малой нагрузке — конкуренция (быстро), при большой — детерминированный доступ (стабильно)\n- Пример: **адаптивное дерево** (adaptive tree walk) — станции делятся на группы рекурсивно, пока не останется одна", "**6. Протоколы беспроводных ЛВС** (wireless LAN):\n- **Проблема скрытого узла** (hidden terminal): станции A и C не слышат друг друга, но обе передают на B → коллизия на B. Обычный CSMA не помогает\n- **MACA** (Karn, 1990) — решение: отправитель шлёт **RTS** (Request To Send), получатель отвечает **CTS** (Clear To Send) → все слышащие CTS молчат\n- **CSMA/CA** (Collision Avoidance) — протокол Wi-Fi (IEEE 802.11), развитие MACA:\n  - Коллизии **предотвращаются**, а не обнаруживаются (в эфире обнаружение невозможно)\n  - Перед передачей станция ждёт интервал **DIFS** (DCF Inter-Frame Spacing), затем случайный откат (backoff)\n  - Получатель подтверждает приём кадром **ACK** (после короткого интервала **SIFS**)\n  - **RTS/CTS — опционален**: по умолчанию Wi-Fi использует только прослушивание канала; RTS/CTS включают для борьбы со скрытыми узлами"], "terms": [{"ru": "CSMA", "en": "Carrier Sense Multiple Access", "df": "множественный доступ с прослушиванием несущей"}, {"ru": "CSMA/CD", "en": "Collision Detection", "df": "обнаружение коллизий, проводной Ethernet"}, {"ru": "CSMA/CA", "en": "Collision Avoidance", "df": "предотвращение коллизий, Wi-Fi"}, {"ru": "Двоичный экспоненциальный откат", "en": "binary exponential backoff", "df": "алгоритм ожидания после коллизии"}, {"ru": "Скрытый узел", "en": "hidden terminal", "df": "узел вне зоны слышимости отправителя, вызывающий коллизию у получателя"}, {"ru": "RTS/CTS", "en": "Request To Send / Clear To Send", "df": "резервирование канала перед передачей"}, {"ru": "DIFS/SIFS", "en": "DCF/Short Inter-Frame Spacing", "df": "межкадровые интервалы в Wi-Fi (SIFS < DIFS = выше приоритет)"}], "summary": ["Чистая ALOHA: макс. 18.4%; слотированная ALOHA: макс. 36.8%", "CSMA: прослушивание несущей; варианты: 1-persistent, non-p, p-p", "CSMA/CD (Ethernet): обнаруж. коллизии + двоичный эксп. откат", "Без столкновений: битовая карта, Token Ring, двоичн. обр. отсчёт", "Огранич. конкуренция: малая нагр.->конкуренция, высокая->детерм.", "MACA: RTS->CTS, решает проблему скрытого узла (hidden terminal)", "802.11 CSMA/CA построен на основе MACA"]}, {"n": 23, "title": "Физический уровень сети Ethernet. Протокол подуровня управления доступом к среде в Ethernet. Производительность сети Ethernet. Коммутируемые сети Ethernet.", "paragraphs": ["**1. Физический уровень** (Physical Layer):\n- **Ethernet** стандартизирован IEEE (стандарт IEEE 802.3) и определяет передачу данных в проводных локальных сетях\n- На физическом уровне задаются: тип среды передачи, способ кодирования сигнала и скорость передачи\n- Эволюция: коаксиальный кабель с топологией «шина» (10BASE5, 10BASE2) → **витая пара** с топологией «звезда» (10BASE-T) → Fast Ethernet (100 Мбит/с) → Gigabit Ethernet (1 Гбит/с) → 10 Gigabit и выше\n- В классическом Ethernet используется **Манчестерское кодирование** (Manchester encoding) — в середине каждого бита происходит переход сигнала, что обеспечивает синхронизацию приёмника с передатчиком\n- Передача осуществляется электрическими сигналами (витая пара) или оптическими сигналами (оптоволокно)", "**2. Подуровень MAC** (Media Access Control — управление доступом к среде):\n- MAC — это подуровень канального уровня, который управляет доступом устройств к общей среде передачи\n- В классическом Ethernet используется метод **CSMA/CD** (Carrier Sense Multiple Access with Collision Detection): станция слушает канал → если свободен — передаёт → при обнаружении коллизии прекращает передачу → ждёт случайное время по алгоритму **двоичного экспоненциального отката** (binary exponential backoff) и повторяет попытку\n- CSMA/CD применяется только в режиме **полудуплекса** (half-duplex)\n- Минимальный размер кадра — **64 байта**. Это нужно, чтобы передатчик успел обнаружить коллизию до окончания передачи\n- **Формат кадра Ethernet:** преамбула (7 Б) + SFD (1 Б) для синхронизации, MAC-адреса получателя и отправителя (по 6 Б), тип/длина (2 Б), данные (46–1500 Б), **FCS** — контрольная сумма CRC-32 (4 Б)\n- Если данных меньше 46 байт, кадр дополняется нулями (**padding**) до минимальных 64 байт", "**3. Производительность Ethernet:**\n- Эффективность зависит от двух факторов: размера кадра и длины сети (задержки распространения)\n- Формула: **Эффективность ≈ 1 / (1 + 5a)**, где a = время распространения сигнала / время передачи кадра\n- При маленьком a (большие кадры, короткий кабель) эффективность близка к 100%. При большом a (маленькие кадры, длинный кабель) эффективность падает\n- При высокой нагрузке число коллизий увеличивается и пропускная способность снижается", "**4. Коммутируемый Ethernet** (switched Ethernet):\n- Изначально использовались **концентраторы** (hub) — они передают сигнал на все порты и создают один общий **домен коллизий** (collision domain)\n- Современные сети используют **коммутаторы** (switch) — они передают кадры только на нужный порт, создавая отдельный домен коллизий для каждого порта\n- При этом **широковещательный домен** (broadcast domain) остаётся общим, если не используется VLAN\n- В режиме **полного дуплекса** (full duplex) станция одновременно передаёт и принимает данные. Коллизий нет, и CSMA/CD не используется\n- Коммутатор узнаёт расположение устройств через **обратное обучение** (backward learning): запоминает MAC-адрес отправителя и номер порта. Если адрес назначения неизвестен — выполняется **flooding** (рассылка на все порты)\n- **VLAN** (IEEE 802.1Q, Virtual LAN) позволяет логически разделить сеть на изолированные сегменты с отдельными broadcast domains, что повышает безопасность и управляемость"], "terms": [{"ru": "Ethernet", "en": "IEEE 802.3", "df": "семейство технологий проводных локальных сетей"}, {"ru": "Манчестерское кодирование", "en": "Manchester encoding", "df": "метод кодирования с переходом сигнала в середине бита"}, {"ru": "Домен коллизий", "en": "collision domain", "df": "сегмент сети, в котором станции могут столкнуться при передаче"}, {"ru": "Широковещательный домен", "en": "broadcast domain", "df": "сегмент сети, в котором распространяются broadcast-кадры"}, {"ru": "Коммутатор", "en": "switch", "df": "устройство канального уровня, направляющее кадры на конкретный порт"}, {"ru": "Обратное обучение", "en": "backward learning", "df": "коммутатор запоминает адреса отправителей из входящих кадров"}, {"ru": "VLAN", "en": "Virtual LAN", "df": "виртуальная локальная сеть, логическое разделение коммутатора на сегменты"}, {"ru": "FCS", "en": "Frame Check Sequence", "df": "контрольная сумма CRC-32 в конце кадра Ethernet"}], "summary": ["Ethernet (802.3): 10 Мбит/с, Манчестерское кодирование", "Кадр: преамбула 7Б + SFD 1Б + MAC*2 6+6Б + тип 2Б + данные 46-1500Б + FCS 4Б", "Мин. размер кадра = 64 байта; MAC использует CSMA/CD", "Откат при k-й коллизии: случайн. 0..2^min(k,10)-1 слотов", "Коммутатор: каждый порт = отдельн. домен коллизий", "Самообучение (backward learning): запись MAC+порт", "VLAN (802.1Q): логическая сегментация сети"]}, {"n": 24, "title": "Fast Ethernet. Gigabit Ethernet. 10-гигабитный Ethernet.", "paragraphs": ["С ростом скоростей Ethernet менялись среда передачи, методы кодирования и правила доступа к каналу.", "**1. Fast Ethernet** (IEEE 802.3u) — скорость **100 Мбит/с**:\n- **100BASE-TX** — наиболее распространённый вариант. Использует 2 пары витой пары категории 5, кодирование **4B/5B + MLT-3** (каждые 4 бита данных кодируются 5-битным символом, затем линейное кодирование MLT-3 снижает частоту сигнала)\n- **100BASE-FX** — использует многомодовое оптоволокно (MMF), дальность до 2 км в полном дуплексе\n- Поддерживает **автосогласование** (Auto-Negotiation) — устройства автоматически выбирают лучшую общую скорость и режим дуплекса\n- Работает как в полудуплексе (с CSMA/CD), так и в полном дуплексе", "**2. Gigabit Ethernet** (IEEE 802.3z / 802.3ab) — скорость **1 Гбит/с**:\n- **1000BASE-SX** — короткая волна (850 нм), многомодовое волокно (MMF), дальность до 550 м\n- **1000BASE-LX** — длинная волна (1310 нм), одномодовое волокно (SMF), дальность до 5 км\n- **1000BASE-T** — медная витая пара категории 5e, использует все 4 пары одновременно, кодирование **4D-PAM5** (импульсно-амплитудная модуляция с 5 уровнями), дальность до 100 м\n- В режиме полудуплекса применяется **расширение несущей** (carrier extension): короткие кадры дополняются до 512 байт, чтобы CSMA/CD мог работать на гигабитной скорости\n- **Пакетная передача** (frame bursting) позволяет отправлять несколько коротких кадров подряд без пауз, что повышает эффективность\n- На практике почти всегда используется полный дуплекс, поэтому CSMA/CD фактически не применяется", "**3. 10-гигабитный Ethernet** (IEEE 802.3ae / 802.3an) — скорость **10 Гбит/с**:\n- Работает **только в полном дуплексе** — CSMA/CD полностью исключён\n- **10GBASE-SR** — многомодовое волокно (850 нм), дальность до 300 м\n- **10GBASE-LR** — одномодовое волокно (1310 нм), дальность до 10 км\n- **10GBASE-T** — медная витая пара категории 6a, дальность до 100 м\n- Кодирование: **64B/66B** — более эффективное, чем 8B/10B (всего 3% избыточности вместо 20%)\n- Применяется в центрах обработки данных и магистральных каналах"], "terms": [{"ru": "Fast Ethernet", "en": "IEEE 802.3u", "df": "Ethernet 100 Мбит/с"}, {"ru": "Gigabit Ethernet", "en": "IEEE 802.3z/ab", "df": "Ethernet 1 Гбит/с"}, {"ru": "10GbE", "en": "10 Gigabit Ethernet", "df": "Ethernet 10 Гбит/с, только полный дуплекс"}, {"ru": "Автосогласование", "en": "Auto-Negotiation", "df": "автоматический выбор скорости и режима дуплекса"}, {"ru": "Расширение несущей", "en": "carrier extension", "df": "дополнение кадров до 512 байт для работы CSMA/CD на гигабитной скорости"}, {"ru": "Пакетная передача", "en": "frame bursting", "df": "отправка нескольких кадров подряд без пауз"}], "summary": ["Fast Ethernet: 100 Мбит/с; 100BASE-TX: UTP кат.5, 4B/5B+MLT-3", "Gigabit Ethernet: 1 Гбит/с; carrier extension до 512 байт", "1000BASE-SX (MMF 850нм), 1000BASE-LX (SMF 1310нм)", "1000BASE-T: 4 пары UTP кат.5e, кодирование 4D-PAM5", "10GbE: 10 Гбит/с, только полный дуплекс, без CSMA/CD", "10GBASE-SR (MMF 300м), 10GBASE-LR (SMF 10км), 10GBASE-T (100м)", "10GbE кодирование: 64B/66B"]}, {"n": 25, "title": "Стандарт 802.11: архитектура и стек протоколов, физический уровень, протокол подуровня управления доступом к среде, структура кадра, сервисы.", "paragraphs": ["Стандарт IEEE 802.11 (Wi-Fi) определяет работу беспроводных локальных сетей. Он охватывает два нижних уровня модели OSI: физический уровень и подуровень MAC канального уровня.", "**1. Архитектура:**\n- **BSS** (Basic Service Set) — базовая ячейка сети: одна **точка доступа** (AP, Access Point) и подключённые к ней станции. Это инфраструктурный режим\n- Несколько BSS объединяются через **систему распределения** (DS, Distribution System — обычно проводной Ethernet) в **ESS** (Extended Service Set). Это позволяет станциям перемещаться между точками доступа без потери соединения (**роуминг**)\n- В режиме **ad hoc** (IBSS, Independent BSS) станции общаются напрямую друг с другом без точки доступа", "**2. Физический уровень:**\n- Оригинальный 802.11 (1997) работал на частоте 2,4 ГГц с технологиями **FHSS** (скачкообразная перестройка частоты) и **DSSS** (расширение спектра прямой последовательностью) на скорости до 2 Мбит/с\n- **802.11b** — 2,4 ГГц, улучшенный DSSS, до **11 Мбит/с**\n- **802.11a** — 5 ГГц, **OFDM** (ортогональное частотное мультиплексирование), до **54 Мбит/с**\n- **802.11g** — 2,4 ГГц, OFDM, до **54 Мбит/с**, совместим с 802.11b\n- **802.11n** (Wi-Fi 4) — 2,4 и 5 ГГц, **MIMO** (несколько антенн) + OFDM, до **600 Мбит/с**\n- **802.11ac** (Wi-Fi 5) — 5 ГГц, **MU-MIMO** (Multi-User MIMO — одновременная передача нескольким устройствам), до **6,9 Гбит/с**\n- **802.11ax** (Wi-Fi 6/6E) — 2,4, 5 и **6 ГГц**, **OFDMA** (Orthogonal Frequency Division Multiple Access — распределение поднесущих между пользователями) + MU-MIMO, до **9,6 Гбит/с**", "**3. Подуровень MAC** (управление доступом к среде):\n- Основной метод — **DCF** (Distributed Coordination Function), основанный на **CSMA/CA** (предотвращение коллизий). В беспроводных сетях невозможно обнаружить коллизию во время передачи, поэтому коллизии предотвращаются заранее\n- Порядок работы: станция слушает канал → если свободен в течение **DIFS** (DCF Inter-Frame Spacing — межкадровый интервал для обычных данных) → выполняет случайный откат (backoff) → передаёт кадр → получатель ждёт **SIFS** (Short Inter-Frame Spacing — короткий интервал для ACK) и отправляет **ACK** (подтверждение приёма). Если ACK не получен — коллизия, окно ожидания удваивается\n- **NAV** (Network Allocation Vector) — виртуальное прослушивание канала: станции узнают из заголовков, сколько времени канал будет занят, и не пытаются передавать\n- **RTS/CTS** — опциональный механизм борьбы со **скрытым узлом** (hidden terminal). По умолчанию не используется\n- **PCF** (Point Coordination Function) — опциональный бесконкурентный режим: точка доступа поочерёдно опрашивает станции", "**4. Структура кадра:**\n- Три типа кадров: **управляющие** (beacon — маяк, периодически объявляет сеть; association — подключение; authentication — проверка подлинности), **контрольные** (RTS, CTS, ACK) и **кадры данных** (несут полезную нагрузку)\n- Формат кадра данных: Frame Control (управление кадром, 2 Б) → Duration/ID (длительность, 2 Б) → **4 MAC-адреса** (по 6 Б) → Sequence Control (номер последовательности, 2 Б) → данные (до 2304 Б) → FCS (Frame Check Sequence — контрольная сумма CRC-32, 4 Б)\n- **Почему 4 адреса?** В проводной сети кадр идёт напрямую от источника к назначению. В Wi-Fi кадр проходит через точку доступа, поэтому нужны адреса: отправитель, получатель, передатчик (AP) и конечный пункт. Все 4 адреса используются при передаче между двумя точками доступа в режиме **WDS** (Wireless Distribution System — беспроводной мост между AP)", "**5. Сервисы:**\n- **Ассоциация** (association) — станция подключается к точке доступа и регистрируется в сети\n- **Реассоциация** (reassociation) — станция переходит к другой точке доступа при роуминге\n- **Диссоциация** (disassociation) — разрыв связи между станцией и AP\n- **Аутентификация** (authentication) — проверка подлинности станции. Эволюция безопасности: **WEP** (Wired Equivalent Privacy — устаревший, легко взламывается) → **WPA** (Wi-Fi Protected Access, использует TKIP — Temporal Key Integrity Protocol) → **WPA2** (использует шифрование **AES-CCMP** — текущий стандарт) → **WPA3** (использует **SAE** — Simultaneous Authentication of Equals, защита от офлайн-атак по словарю)\n- **Распределение** (distribution) — маршрутизация кадров внутри DS к нужной точке доступа\n- **Интеграция** (integration) — связь Wi-Fi сети с проводной сетью (Ethernet)"], "terms": [{"ru": "BSS", "en": "Basic Service Set", "df": "базовая ячейка Wi-Fi: точка доступа + станции"}, {"ru": "ESS", "en": "Extended Service Set", "df": "несколько BSS, объединённых через DS"}, {"ru": "AP", "en": "Access Point", "df": "точка доступа"}, {"ru": "CSMA/CA", "en": "Collision Avoidance", "df": "множественный доступ с предотвращением коллизий"}, {"ru": "DCF", "en": "Distributed Coordination Function", "df": "распределённая координация доступа на основе CSMA/CA"}, {"ru": "NAV", "en": "Network Allocation Vector", "df": "виртуальный счётчик занятости канала"}, {"ru": "OFDM", "en": "Orthogonal Frequency Division Multiplexing", "df": "ортогональное частотное мультиплексирование"}, {"ru": "OFDMA", "en": "OFDM Multiple Access", "df": "распределение поднесущих OFDM между несколькими пользователями"}, {"ru": "MIMO", "en": "Multiple Input Multiple Output", "df": "передача через несколько антенн одновременно"}, {"ru": "MU-MIMO", "en": "Multi-User MIMO", "df": "одновременная передача нескольким устройствам"}, {"ru": "FHSS", "en": "Frequency Hopping Spread Spectrum", "df": "скачкообразная перестройка частоты"}, {"ru": "DSSS", "en": "Direct Sequence Spread Spectrum", "df": "расширение спектра прямой последовательностью"}, {"ru": "PCF", "en": "Point Coordination Function", "df": "централизованный опрос станций точкой доступа"}, {"ru": "WEP", "en": "Wired Equivalent Privacy", "df": "первый протокол безопасности Wi-Fi (устаревший, взломан)"}, {"ru": "WPA2", "en": "Wi-Fi Protected Access 2", "df": "текущий стандарт безопасности, шифрование AES-CCMP"}, {"ru": "WDS", "en": "Wireless Distribution System", "df": "беспроводной мост между точками доступа"}, {"ru": "FCS", "en": "Frame Check Sequence", "df": "контрольная сумма CRC-32 в конце кадра"}], "summary": ["BSS = станции + AP; ESS = неск. BSS через DS; ad hoc = без AP", "802.11b: 2.4ГГц DSSS 11Мбит/с; 802.11a: 5ГГц OFDM 54Мбит/с", "802.11n: MIMO+OFDM до 600 Мбит/с; 802.11ac: MU-MIMO неск. Гбит/с", "MAC = CSMA/CA: DIFS -> случ. откат -> передача -> ACK обязат.", "NAV (Network Allocation Vector) = виртуальн. прослушивание канала", "Кадр: 4 MAC-адреса, тело до 2312 байт, FCS CRC-32", "Сервисы: ассоциация, аутентификация WPA2/WPA3, доставка"]}, {"n": 26, "title": "Широкополосные беспроводные сети. Сравнение стандарта 802.16 с 802.11 и 3G. Стандарт 802.16: архитектура и стек протоколов, физический уровень, протокол подуровня MAC, структура кадра.", "paragraphs": ["**IEEE 802.16**, известный под коммерческим названием **WiMAX** (Worldwide Interoperability for Microwave Access), — это стандарт широкополосного беспроводного доступа. В отличие от Wi-Fi (802.11), он рассчитан на большие расстояния (до 50 км) и скорости до 70 Мбит/с.", "**Сравнение с 802.11 и 3G:**\n- По сравнению с **802.11 (Wi-Fi)**: значительно больший радиус действия, встроенная поддержка **QoS** (Quality of Service — гарантии качества для голоса и видео), централизованное управление доступом от базовой станции\n- По сравнению с **3G**: более высокая пропускная способность и **пакетная архитектура** (данные передаются пакетами, как в Интернете), в отличие от канальной архитектуры 3G (выделенный канал на каждый звонок)", "**1. Архитектура:**\n- Сеть строится вокруг **BS** (Base Station — базовая станция), которая управляет всеми абонентскими станциями (SS — Subscriber Station) в своей зоне\n- Топология: **точка-многоточка** (одна BS обслуживает множество SS) или **ячеистая** (mesh — станции могут передавать данные друг через друга)\n- Дуплексирование: **TDD** (Time Division Duplex — передача и приём по очереди во времени) или **FDD** (Frequency Division Duplex — передача и приём на разных частотах)", "**2. Физический уровень:**\n- Два диапазона частот: **10–66 ГГц** при прямой видимости (**LOS** — Line of Sight) и **2–11 ГГц** без прямой видимости (**NLOS** — Non-Line of Sight)\n- Используется **OFDM/OFDMA** (распределение поднесущих между пользователями) с **адаптивной модуляцией**: станция автоматически выбирает модуляцию в зависимости от качества сигнала — от **BPSK** (самая надёжная, низкая скорость) до **64-QAM** (самая быстрая, но требует хороший сигнал)", "**3. Протокол MAC:**\n- MAC в 802.16 **централизованный** — базовая станция полностью контролирует, когда и сколько каждая станция может передавать. Это отличается от Wi-Fi, где станции конкурируют самостоятельно\n- MAC **ориентирован на соединение**: перед передачей данных создаётся виртуальное соединение с идентификатором **CID** (Connection ID)\n- Четыре класса **QoS**: **UGS** (постоянный поток, например VoIP), **rtPS** (потоковое видео в реальном времени), **nrtPS** (передача файлов, допускает задержки), **BE** (Best Effort — обычные данные без гарантий)", "**4. Структура кадра:**\n- Кадр делится на две части: **DL** (Downlink — от BS к абонентам) и **UL** (Uplink — от абонентов к BS)\n- В начале кадра — **преамбула** для синхронизации, затем **DL-MAP** и **UL-MAP** — карты, которые сообщают каждой станции, в какой момент времени и на каких частотах ей можно передавать\n- Заголовок MAC содержит: **CID** (идентификатор соединения), **LEN** (длина данных), **CI** (индикатор CRC), **EC** (индикатор шифрования) и тип заголовка"], "terms": [{"ru": "WiMAX", "en": "Worldwide Interoperability for Microwave Access", "df": "коммерческое название 802.16"}, {"ru": "BS", "en": "Base Station", "df": "базовая станция, управляет сетью"}, {"ru": "SS", "en": "Subscriber Station", "df": "абонентская станция"}, {"ru": "QoS", "en": "Quality of Service", "df": "гарантии качества обслуживания (приоритеты для голоса, видео и т.д.)"}, {"ru": "OFDMA", "en": "OFDM Multiple Access", "df": "множественный доступ с распределением поднесущих"}, {"ru": "LOS / NLOS", "en": "Line of Sight / Non-Line of Sight", "df": "прямая / непрямая видимость"}, {"ru": "CID", "en": "Connection ID", "df": "идентификатор соединения в 802.16"}], "summary": ["802.16 (WiMAX): до 50 км, до 70 Мбит/с, поддержка QoS", "vs 802.11: больший радиус, централиз. управление", "vs 3G: выше пропускная способность, пакетная архитектура", "Физ. ур.: 10-66 ГГц (LOS) или 2-11 ГГц (NLOS), OFDM/OFDMA", "Модуляция адаптивная: BPSK, QPSK, 16-QAM, 64-QAM", "MAC централизованный; QoS классы: UGS, rtPS, nrtPS, BE", "Кадр: преамбула + DL-MAP/UL-MAP; заголовок с CID"]}, {"n": 27, "title": "Архитектура Bluetooth: набор протоколов, уровень радиосвязи, уровень немодулированной передачи, структура кадра.", "paragraphs": ["**Bluetooth** (IEEE 802.15.1) — это стандарт беспроводной персональной сети (**WPAN** — Wireless Personal Area Network) для связи устройств на коротких расстояниях (от 1 до 100 м). Работает на частоте **2,4 ГГц** в нелицензируемом диапазоне **ISM** (Industrial, Scientific, Medical).", "**1. Архитектура и топология:**\n- Базовая единица сети — **пикосеть** (piconet): одно ведущее устройство (**master**) и до 7 ведомых (**slave**). Master управляет всей коммуникацией и задаёт расписание передачи\n- Несколько пикосетей могут пересекаться, образуя **рассеянную сеть** (scatternet). Одно устройство может быть slave в одной пикосети и master в другой", "**2. Стек протоколов:**\n- **Радиоуровень** (Radio) — отвечает за передачу и приём радиосигнала\n- **Baseband** (уровень немодулированной передачи) — управляет синхронизацией, скачками частоты и формированием кадров\n- **LMP** (Link Manager Protocol) — устанавливает и настраивает соединения между устройствами (аутентификация, шифрование, управление мощностью)\n- **L2CAP** (Logical Link Control and Adaptation Protocol) — мультиплексирует данные от верхних уровней и адаптирует размер пакетов\n- Выше располагаются **профили** — стандартные сценарии использования: **RFCOMM** (эмуляция последовательного порта), **SDP** (Service Discovery Protocol — обнаружение доступных сервисов), **OBEX** (обмен файлами)", "**3. Уровень радиосвязи** (Radio Layer):\n- Bluetooth использует **FHSS** (Frequency Hopping Spread Spectrum) — частота меняется 1600 раз в секунду по 79 каналам шириной 1 МГц. Это снижает помехи от других устройств в том же диапазоне\n- Три класса мощности: **Класс 1** (100 мВт, до 100 м), **Класс 2** (2,5 мВт, до 10 м — самый распространённый), **Класс 3** (1 мВт, до 1 м)\n- Модуляция — **GFSK** (Gaussian Frequency Shift Keying — частотная манипуляция с гауссовым фильтром)", "**4. Уровень немодулированной передачи** (Baseband):\n- Время делится на слоты по **625 мкс**. Master и slave передают в чередующихся слотах (master — в чётных, slave — в нечётных)\n- Два типа соединений: **SCO** (Synchronous Connection-Oriented) — синхронное соединение с фиксированной полосой для голоса (64 кбит/с), и **ACL** (Asynchronous Connectionless) — асинхронное соединение для передачи данных с подтверждением и повтором при ошибках", "**5. Структура кадра:**\n- **Код доступа** (72 бита) — идентифицирует пикосеть (каждая пикосеть имеет уникальный код, формируемый из адреса master)\n- **Заголовок** (54 бита) содержит: **AM_ADDR** (3 бита — адрес slave в пикосети, от 1 до 7), **тип** пакета (4 бита), **SEQN** (1 бит — номер последовательности), **ARQN** (1 бит — подтверждение приёма предыдущего пакета), **HEC** (Header Error Check — 8-битная контрольная сумма заголовка)\n- **Полезная нагрузка** (payload) — от 0 до 2745 бит в зависимости от типа пакета (пакет может занимать 1, 3 или 5 слотов)"], "terms": [{"ru": "WPAN", "en": "Wireless Personal Area Network", "df": "беспроводная персональная сеть"}, {"ru": "ISM", "en": "Industrial, Scientific, Medical", "df": "нелицензируемый частотный диапазон"}, {"ru": "Пикосеть", "en": "piconet", "df": "базовая топология Bluetooth: 1 master + до 7 slave"}, {"ru": "Рассеянная сеть", "en": "scatternet", "df": "объединение нескольких пикосетей"}, {"ru": "FHSS", "en": "Frequency Hopping Spread Spectrum", "df": "скачкообразная перестройка частоты"}, {"ru": "GFSK", "en": "Gaussian Frequency Shift Keying", "df": "метод модуляции Bluetooth"}, {"ru": "SCO", "en": "Synchronous Connection-Oriented", "df": "синхронное соединение для голоса"}, {"ru": "ACL", "en": "Asynchronous Connectionless", "df": "асинхронное соединение для данных"}, {"ru": "LMP", "en": "Link Manager Protocol", "df": "протокол управления соединениями"}, {"ru": "L2CAP", "en": "Logical Link Control and Adaptation Protocol", "df": "адаптация данных верхних уровней"}, {"ru": "HEC", "en": "Header Error Check", "df": "контрольная сумма заголовка кадра"}, {"ru": "GFSK", "en": "Gaussian Frequency Shift Keying", "df": "частотная модуляция с гауссовой фильтрацией"}], "summary": ["Bluetooth (802.15.1): 2.4 ГГц ISM, FHSS 79 каналов, 1600 прыж/с", "Пикосеть: 1 master + до 7 slaves; scatternet = неск. пикосетей", "Классы мощности: 1(100мВт,100м), 2(2.5мВт,10м), 3(1мВт,1м)", "Модуляция GFSK; слот = 625 мкс", "SCO (синхронное, голос) и ACL (асинхронное, данные)", "Кадр: код доступа 72б + заголовок 54б + нагрузка 0-2745б", "Стек: Radio->Baseband->LMP->L2CAP->профили (RFCOMM,SDP,OBEX)"]}, {"n": 28, "title": "RFID. Архитектура и физический уровень EPC Gen 2. Уровень идентификации метки EPC Gen 2. Форматы сообщения идентификации метки.", "paragraphs": ["**RFID** (Radio Frequency Identification — радиочастотная идентификация) — это технология, которая позволяет автоматически идентифицировать объекты с помощью радиосигналов. Система состоит из **считывателей** (readers) и **меток** (tags), прикреплённых к объектам.", "**1. Типы меток:**\n- **Пассивные** — не имеют собственного питания, получают энергию от радиосигнала считывателя. Дальность до 5 м, дешёвые, используются массово (например, в магазинах)\n- **Полупассивные** (semi-passive) — имеют батарею для питания микросхемы, но для передачи данных используют энергию считывателя. Дальность больше, чем у пассивных\n- **Активные** — имеют собственный передатчик и батарею, дальность до 100 м. Дороже, применяются для отслеживания крупных объектов", "**2. Физический уровень EPC Gen 2:**\n- **EPC Gen 2** (Electronic Product Code Generation 2, также ISO 18000-6C) — основной стандарт для пассивных **UHF** (Ultra High Frequency) RFID-меток, работающих в диапазоне **860–960 МГц**\n- Связь от считывателя к метке: модуляция **ASK** (Amplitude Shift Keying — амплитудная манипуляция) с кодированием **PIE** (Pulse Interval Encoding — кодирование интервалами между импульсами)\n- Связь от метки к считывателю: **обратная рассеянная модуляция** (backscatter) — метка не генерирует свой сигнал, а отражает сигнал считывателя, модулируя отражение. Кодирование — **FM0** (двухфазное) или **кодирование Миллера** (Miller encoding)", "**3. Уровень идентификации (протокол Query/ACK):**\n- Считыватель использует протокол на основе **Slotted ALOHA** для опроса множества меток без коллизий\n- Процесс: считыватель отправляет команду **Query(Q)**, где Q задаёт количество слотов → метка выбирает случайный слот и отвечает числом **RN16** (случайное 16-битное число) → считыватель подтверждает получение командой **ACK(RN16)** → метка отправляет свой полный идентификатор: **EPC** (96 бит) + **PC** (Protocol Control — параметры протокола) + **CRC-16** (контрольная сумма)", "**4. Форматы сообщения идентификации (форматы EPC):**\n- **SGTIN-96** (Serialized Global Trade Item Number) — для идентификации товаров (аналог штрих-кода, но с уникальным серийным номером каждой единицы)\n- **SSCC-96** (Serial Shipping Container Code) — для идентификации транспортных контейнеров и упаковок\n- **SGLN-96** (Serialized Global Location Number) — для идентификации мест (склад, полка, зона)\n- **GRAI-96** (Global Returnable Asset Identifier) — для идентификации многоразовых активов (поддоны, контейнеры)"], "terms": [{"ru": "RFID", "en": "Radio Frequency Identification", "df": "радиочастотная идентификация"}, {"ru": "EPC", "en": "Electronic Product Code", "df": "электронный код продукта, уникальный 96-битный идентификатор"}, {"ru": "UHF", "en": "Ultra High Frequency", "df": "ультравысокие частоты (860–960 МГц для RFID)"}, {"ru": "ASK", "en": "Amplitude Shift Keying", "df": "амплитудная манипуляция"}, {"ru": "PIE", "en": "Pulse Interval Encoding", "df": "кодирование интервалами импульсов"}, {"ru": "SGTIN-96", "en": "Serialized Global Trade Item Number", "df": "формат EPC для торговых единиц"}], "summary": ["RFID: считыватели (readers) + метки (tags) по радио", "Пассивные метки: 0-5 м, питание от поля; активные: до 100 м", "EPC Gen 2: пассивные UHF 860-960 МГц (ISO 18000-6C)", "Считыватель->метка: ASK+PIE; метка->считыватель: backscatter+FM0", "Протокол: Query(Q)->RN16->ACK(RN16)->EPC 96 бит + PC+CRC-16", "Форматы: SGTIN-96(товар), SSCC-96(контейнер), SGLN-96(место)"]}, {"n": 29, "title": "Коммутация на канальном уровне. Применение мостов. Повторители, концентраторы, мосты, коммутаторы, маршрутизаторы, шлюзы и виртуальные локальные сети.", "paragraphs": ["**Коммутация** (switching) на канальном уровне — это процесс пересылки кадров внутри локальной сети на основе MAC-адресов. В отличие от маршрутизации (L3, по IP-адресам), коммутация работает на уровне L2 и не требует анализа сетевых адресов.", "**1. Мосты и коммутация:**\n- **Мост** (bridge) — это устройство канального уровня (L2), которое соединяет два сегмента локальной сети. Мост принимает кадр, смотрит на MAC-адрес назначения и решает, нужно ли пересылать его в другой сегмент\n- Мост узнаёт расположение устройств через **обратное обучение** (backward learning): когда приходит кадр, мост запоминает, с какого порта пришёл MAC-адрес отправителя. Со временем строится таблица «MAC-адрес → порт»\n- Если в сети несколько мостов, могут возникнуть **петли** — кадры будут бесконечно циркулировать. Для предотвращения петель используется **STP** (Spanning Tree Protocol, IEEE 802.1D) — он отключает избыточные пути, оставляя только древовидную структуру", "**2. Сетевые устройства по уровням OSI:**\n- **Повторитель** (repeater) — работает на уровне L1 (физический). Просто усиливает и регенерирует ослабленный сигнал, чтобы увеличить дальность передачи\n- **Концентратор** (hub) — тоже L1, по сути многопортовый повторитель. Принимает сигнал с одного порта и повторяет его на все остальные порты. Вся сеть — один домен коллизий\n- **Мост** (bridge) — L2 (канальный). Разделяет сеть на отдельные домены коллизий, пересылая кадры по MAC-адресам\n- **Коммутатор** (switch) — тоже L2, по сути многопортовый мост. Каждый порт — отдельный домен коллизий, что значительно повышает производительность\n- **Маршрутизатор** (router) — L3 (сетевой). Передаёт пакеты между разными сетями на основе IP-адресов. Разделяет широковещательные домены\n- **Шлюз** (gateway) — работает на уровнях L4–L7. Преобразует протоколы между несовместимыми сетями (например, между электронной почтой разных форматов)", "**3. VLAN** (Virtual LAN, IEEE 802.1Q):\n- VLAN позволяет логически разделить один физический коммутатор на несколько изолированных сетей с отдельными **широковещательными доменами** (broadcast domains). Устройства в разных VLAN не видят широковещательный трафик друг друга\n- Для этого в кадр Ethernet вставляется **тег 802.1Q** (4 байта): **TPID** (Tag Protocol Identifier — идентификатор протокола, всегда 0x8100), **PCP** (Priority Code Point — приоритет, 3 бита), **DEI** (Drop Eligible Indicator — можно ли отбросить кадр, 1 бит), **VID** (VLAN ID — номер VLAN, 12 бит, до 4094 VLAN)\n- Трафик между VLAN не может передаваться напрямую — он должен проходить через **маршрутизатор** (L3). **Транковые порты** (trunk ports) передают кадры нескольких VLAN между коммутаторами, сохраняя теги 802.1Q"], "terms": [{"ru": "Мост", "en": "bridge", "df": "устройство L2, соединяющее сегменты ЛВС по MAC-адресам"}, {"ru": "STP", "en": "Spanning Tree Protocol, IEEE 802.1D", "df": "протокол остовного дерева для предотвращения петель"}, {"ru": "Повторитель", "en": "repeater", "df": "устройство L1 для регенерации сигнала"}, {"ru": "Концентратор", "en": "hub", "df": "многопортовый повторитель (L1)"}, {"ru": "Коммутатор", "en": "switch", "df": "многопортовый мост (L2)"}, {"ru": "Маршрутизатор", "en": "router", "df": "устройство L3, передаёт пакеты по IP-адресам"}, {"ru": "Шлюз", "en": "gateway", "df": "устройство L4–L7 для преобразования протоколов"}, {"ru": "VLAN", "en": "Virtual LAN", "df": "виртуальная локальная сеть, логическое разделение на broadcast domains"}, {"ru": "Транковый порт", "en": "trunk port", "df": "порт коммутатора, передающий кадры нескольких VLAN с тегами"}, {"ru": "VLAN", "en": "Virtual LAN", "df": "виртуальная ЛВС"}], "summary": ["Мост (bridge): ур.2, пересылка по MAC, обратное обучение", "STP (802.1D): протокол остовного дерева против петель", "Повторитель/хаб=ур.1; мост/коммутатор=ур.2; роутер=ур.3", "Шлюз (gateway) = ур.4-7, преобразование протоколов", "Коммутатор = многопортовый мост, порт = домен коллизий", "VLAN (802.1Q): тег 4Б (TPID,PCP,DEI,VID), изол. broadcast домены", "Между VLAN трафик маршрутизируется на ур.3; транковые порты"]}], "quizzes": [{"type": "mcq", "topic": "Вопрос 21", "q": "Каков главный недостаток статического распределения канала (FDM/TDM)?", "opts": ["Высокая вероятность коллизий", "Сложность реализации", "Если станция молчит, её ресурс простаивает", "Низкая скорость переключения между каналами"], "ans": 2, "expl": "Недостаток статического распределения: если станция молчит, её ресурс простаивает."}, {"type": "tf", "topic": "Вопрос 21", "q": "Среди допущений динамического распределения каналов указана зависимость трафика между станциями.", "ans": false, "expl": "Одно из допущений — независимый трафик: станции генерируют кадры независимо друг от друга."}, {"type": "mcq", "topic": "Вопрос 22", "q": "Какова максимальная пропускная способность чистой ALOHA?", "opts": ["36,8%", "50%", "18,4%", "25%"], "ans": 2, "expl": "Максимальная пропускная способность чистой ALOHA — 18,4%."}, {"type": "tf", "topic": "Вопрос 22", "q": "Максимальная пропускная способность слотированной ALOHA вдвое выше, чем чистой ALOHA, и составляет 36,8%.", "ans": true, "expl": "Чистая ALOHA — 18,4%, слотированная ALOHA — 36,8%, что ровно вдвое больше."}, {"type": "mcq", "topic": "Вопрос 22", "q": "Какой протокол решает проблему скрытого узла в беспроводных сетях?", "opts": ["CSMA/CD", "Token Ring", "MACA (с использованием RTS/CTS)", "Побитовая карта"], "ans": 2, "expl": "MACA решает проблему скрытого узла: отправитель посылает RTS, получатель отвечает CTS."}, {"type": "mcq", "topic": "Вопрос 23", "q": "Каков минимальный размер кадра Ethernet?", "opts": ["32 байта", "46 байт", "64 байта", "128 байт"], "ans": 2, "expl": "Минимальный размер кадра Ethernet — 64 байта."}, {"type": "tf", "topic": "Вопрос 23", "q": "Классический Ethernet использовал Манчестерское кодирование и работал на скорости 100 Мбит/с.", "ans": false, "expl": "Классический Ethernet использовал Манчестерское кодирование, но работал на скорости 10 Мбит/с, а не 100."}, {"type": "mcq", "topic": "Вопрос 23", "q": "Какой метод используют коммутаторы Ethernet для построения таблиц MAC-адресов?", "opts": ["Протокол STP", "Самообучение (backward learning)", "Ручная настройка администратором", "Широковещательная рассылка ARP"], "ans": 1, "expl": "Коммутаторы используют самообучение (backward learning) для построения таблиц MAC-адресов."}, {"type": "mcq", "topic": "Вопрос 24", "q": "Какое кодирование используется в 10-гигабитном Ethernet?", "opts": ["Манчестерское кодирование", "4B/5B + MLT-3", "4D-PAM5", "64B/66B"], "ans": 3, "expl": "В 10-гигабитном Ethernet (10GbE) используется кодирование 64B/66B."}, {"type": "tf", "topic": "Вопрос 24", "q": "В 10-гигабитном Ethernet используется полудуплексный режим с CSMA/CD.", "ans": false, "expl": "10GbE работает только в полнодуплексном режиме, CSMA/CD не используется."}, {"type": "mcq", "topic": "Вопрос 24", "q": "Какой механизм применяется в полудуплексном Gigabit Ethernet для коротких кадров?", "opts": ["Байт-стаффинг", "Бит-стаффинг", "Расширение несущей (carrier extension до 512 байт)", "CRC-32 с удвоением"], "ans": 2, "expl": "В полудуплексном Gigabit Ethernet применяется расширение несущей (carrier extension до 512 байт)."}, {"type": "mcq", "topic": "Вопрос 25", "q": "Какой стандарт 802.11 поддерживает MIMO и обеспечивает скорость до 600 Мбит/с?", "opts": ["802.11b", "802.11a", "802.11n", "802.11ac"], "ans": 2, "expl": "802.11n использует MIMO + OFDM и обеспечивает скорость до 600 Мбит/с."}, {"type": "tf", "topic": "Вопрос 25", "q": "В кадре 802.11 содержится максимум два MAC-адреса.", "ans": false, "expl": "Кадр 802.11 содержит четыре MAC-адреса; четыре адреса необходимы при передаче между двумя BSS."}, {"type": "mcq", "topic": "Вопрос 25", "q": "Что такое NAV в контексте протокола MAC 802.11?", "opts": ["Протокол маршрутизации в беспроводной сети", "Счётчик виртуального занятия канала для механизма виртуального прослушивания", "Адрес точки доступа в ESS", "Формат заголовка кадра 802.11"], "ans": 1, "expl": "NAV (Network Allocation Vector) — счётчик виртуального занятия канала, используемый в механизме виртуального прослушивания."}, {"type": "mcq", "topic": "Вопрос 26", "q": "Какова максимальная пропускная способность WiMAX (802.16)?", "opts": ["11 Мбит/с", "54 Мбит/с", "70 Мбит/с", "600 Мбит/с"], "ans": 2, "expl": "Пропускная способность 802.16 (WiMAX) — до 70 Мбит/с."}, {"type": "tf", "topic": "Вопрос 26", "q": "Протокол MAC в 802.16 является децентрализованным и основан на конкуренции.", "ans": false, "expl": "Протокол MAC в 802.16 — централизованный, ориентированный на соединение."}, {"type": "mcq", "topic": "Вопрос 27", "q": "Сколько каналов используется при скачках частоты (FHSS) в Bluetooth?", "opts": ["23 канала", "40 каналов", "79 каналов", "256 каналов"], "ans": 2, "expl": "Bluetooth использует FHSS — скачки по 79 каналам, 1600 прыжков/с."}, {"type": "tf", "topic": "Вопрос 27", "q": "В пикосети Bluetooth может быть один ведущий и до 7 ведомых устройств.", "ans": true, "expl": "Пикосеть — один ведущий (master) и до 7 ведомых (slaves)."}, {"type": "mcq", "topic": "Вопрос 27", "q": "Какой тип соединения в Bluetooth предназначен для голосовых данных?", "opts": ["ACL (асинхронное)", "SCO (синхронное)", "L2CAP", "RFCOMM"], "ans": 1, "expl": "SCO (Synchronous Connection-Oriented) — синхронное соединение для голоса."}, {"type": "mcq", "topic": "Вопрос 28", "q": "Какой метод передачи данных от метки к считывателю используется в EPC Gen 2?", "opts": ["Амплитудная манипуляция (ASK)", "Частотная модуляция GFSK", "Обратная рассеянная модуляция (backscatter)", "Квадратурная амплитудная модуляция (QAM)"], "ans": 2, "expl": "Метка→считыватель: обратная рассеянная модуляция (backscatter) с кодированием FM0 или Миллера."}, {"type": "tf", "topic": "Вопрос 28", "q": "Длина электронного кода продукта (EPC) составляет 128 бит.", "ans": false, "expl": "EPC имеет длину 96 бит, а не 128."}, {"type": "mcq", "topic": "Вопрос 28", "q": "Какой протокол инвентаризации используется в EPC Gen 2 для идентификации меток?", "opts": ["Чистая ALOHA", "CSMA/CD", "Протокол Query/ACK с инвентаризацией слотов (Slotted ALOHA)", "Token Ring"], "ans": 2, "expl": "В EPC Gen 2 используется протокол Query/ACK с инвентаризацией слотов (Slotted ALOHA)."}, {"type": "mcq", "topic": "Вопрос 29", "q": "Какой протокол предотвращает петли при использовании мостов?", "opts": ["CSMA/CD", "IEEE 802.1Q", "STP (IEEE 802.1D) — протокол остовного дерева", "VLAN Trunking Protocol"], "ans": 2, "expl": "Для предотвращения петель используется протокол остовного дерева (STP, IEEE 802.1D)."}, {"type": "tf", "topic": "Вопрос 29", "q": "Шлюз (gateway) работает на уровнях 4-7 модели OSI и выполняет преобразование протоколов.", "ans": true, "expl": "Шлюз работает на уровнях 4-7 и осуществляет преобразование протоколов."}, {"type": "mcq", "topic": "Вопрос 29", "q": "Каков размер тега 802.1Q в кадре Ethernet?", "opts": ["2 байта", "4 байта", "8 байт", "12 байт"], "ans": 1, "expl": "Тег 802.1Q имеет размер 4 байта и содержит TPID, PCP, DEI и VID."}, {"type": "match", "topic": "Тема 4", "q": "Сопоставьте сетевые устройства и технологии с их уровнем или характеристикой.", "pairs": [{"l": "Повторитель (repeater)", "r": "Уровень 1 — усиливает сигнал"}, {"l": "Коммутатор (switch)", "r": "Многопортовый мост, каждый порт — отдельный домен коллизий"}, {"l": "Маршрутизатор (router)", "r": "Уровень 3 — маршрутизирует по IP"}, {"l": "Шлюз (gateway)", "r": "Уровни 4-7 — преобразует протоколы"}, {"l": "CSMA/CD", "r": "Ethernet — обнаружение коллизий"}, {"l": "CSMA/CA", "r": "802.11 — предотвращение коллизий"}, {"l": "FHSS", "r": "Bluetooth — скачки по 79 каналам"}], "expl": "Каждое устройство или технология связано с соответствующим уровнем OSI или ключевой характеристикой из материалов Темы 4."}]}, {"id": 5, "name": "Сетевой уровень", "questions": [{"n": 30, "title": "Проектирование сетевого уровня: Сервисы, предоставляемые транспортному уровню. Метод коммутации пакетов с ожиданием. Реализация сервиса без установления соединения.", "paragraphs": ["**Сетевой уровень** (network layer, L3) отвечает за доставку пакетов от отправителя к получателю через маршрутизаторы. Два варианта сервиса: **дейтаграммный** (без соединения) или **виртуальные каналы** (с соединением).", "**1. Коммутация пакетов с ожиданием** (store-and-forward):\n- Маршрутизатор полностью принимает пакет в буфер, проверяет заголовок и передаёт дальше. Это отличается от **коммутации каналов** (circuit switching), где выделяется непрерывный путь без буферизации (как в телефонных сетях)", "**2. Сервис без установления соединения** (дейтаграммная сеть):\n- Каждый пакет содержит полный адрес назначения и маршрутизируется независимо. Разные пакеты одного сообщения могут идти разными путями\n- Маршрутизатор выбирает следующий узел по **таблице маршрутизации** (routing table)\n- Плюсы: устойчивость к отказам, простота, адаптивность к изменениям топологии\n- **Интернет (IP)** построен на дейтаграммном сервисе"], "terms": [{"ru": "Store-and-forward", "en": "коммутация с ожиданием", "df": "пакет принимается целиком, проверяется, затем передаётся дальше"}, {"ru": "Коммутация каналов", "en": "circuit switching", "df": "выделение непрерывного пути (телефонные сети)"}, {"ru": "Дейтаграмма", "en": "datagram", "df": "независимый пакет с полным адресом назначения"}, {"ru": "Таблица маршрутизации", "en": "routing table", "df": "определяет следующий узел для каждого адреса назначения"}], "summary": ["Store-and-forward: маршрутизатор принимает пакет целиком, потом передаёт", "Дейтаграмма (datagram) = пакет с полным адресом, без соединения", "Дейтаграммная сеть: нет состояния, каждый пакет независимо", "Маршрутизация по таблице (routing table) на каждом узле", "Интернет (IP) построен на дейтаграммном сервисе", "Устойчивость: пакеты обходят вышедший из строя узел"]}, {"n": 31, "title": "Реализация сервиса с установлением соединения. Сравнение сетей виртуальных каналов и дейтаграммных сетей.", "paragraphs": ["Сервис с установлением соединения на сетевом уровне реализуется через **виртуальные каналы** (virtual circuits, VC). В отличие от дейтаграммного сервиса (Q30), здесь перед передачей данных создаётся логический путь.", "**1. Как работают виртуальные каналы:**\n- Перед передачей данных устанавливается логический путь от отправителя к получателю. Каждый маршрутизатор на этом пути резервирует запись в своей таблице и присваивает **VCI** (Virtual Circuit Identifier — короткий номер канала)\n- Все пакеты одного соединения идут строго по одному маршруту и приходят в правильном порядке. Маршрутизатору не нужно каждый раз искать путь — он просто пересылает по номеру VCI\n- Примеры технологий: **ATM** (Asynchronous Transfer Mode — ячейки по 53 байта), **Frame Relay** (коммутация кадров), **MPLS** (Multiprotocol Label Switching — коммутация по меткам)", "**2. Три фазы работы VC:**\n- **Установка** — выбирается маршрут, каждый маршрутизатор выделяет ресурсы и VCI\n- **Передача данных** — пакеты идут по установленному пути\n- **Разрыв** — соединение закрывается, ресурсы на всех маршрутизаторах освобождаются", "**3. Сравнение дейтаграммных сетей и виртуальных каналов:**\n- **Дейтаграммные (IP)**: не требуют установки соединения, устойчивы к отказам (пакеты обходят сбой), адаптивны к изменениям нагрузки. Но нет гарантий порядка доставки и качества\n- **Виртуальные каналы**: гарантируют **QoS** (Quality of Service — качество обслуживания: задержка, пропускная способность), упорядоченную доставку, меньшие накладные расходы (короткий VCI вместо полного адреса в каждом пакете)\n- Главный минус VC: при отказе любого маршрутизатора на пути все проходящие через него виртуальные каналы разрушаются"], "terms": [{"ru": "Виртуальный канал", "en": "virtual circuit, VC", "df": "логический путь, установленный заранее для группы пакетов"}, {"ru": "VCI", "en": "Virtual Circuit Identifier", "df": "короткий идентификатор канала в заголовке пакета"}, {"ru": "ATM", "en": "Asynchronous Transfer Mode", "df": "технология на основе VC с ячейками фиксированного размера (53 байта)"}, {"ru": "MPLS", "en": "Multiprotocol Label Switching", "df": "коммутация по меткам, сочетает элементы VC и IP"}, {"ru": "QoS", "en": "Quality of Service", "df": "гарантии качества: задержка, пропускная способность, потери"}], "summary": ["VC: установка → передача → разрыв; VCI вместо адреса", "Примеры VC-сетей: ATM (ячейки 53 байта), Frame Relay, MPLS", "VC: гарантия QoS, упорядоченность, малые накладные расходы", "VC уязвимы: отказ маршрутизатора = все VC разрушены", "Дейтаграмма: устойчивость к отказам, адаптивность, без установки", "VCI — короткий идентификатор канала в заголовке пакета"]}, {"n": 32, "title": "Алгоритмы маршрутизации: принцип оптимальности маршрута, алгоритм нахождения кратчайшего пути, заливка.", "paragraphs": ["Маршрутизация — это процесс выбора пути для пакета через сеть. Алгоритмы маршрутизации определяют, по какому маршруту пакет пойдёт от отправителя к получателю.", "**1. Принцип оптимальности** (optimality principle):\n- Если узел B лежит на оптимальном пути из A в C, то участок пути от B до C тоже является оптимальным\n- Из этого следует, что для каждого получателя существует **дерево кратчайших путей** (sink tree) — дерево, в котором от каждого узла сети ведёт оптимальный путь к данному получателю. Все алгоритмы маршрутизации стремятся построить это дерево", "**2. Алгоритм нахождения кратчайшего пути** — алгоритм Дейкстры (Dijkstra's algorithm):\n- Маршрутизатор использует этот алгоритм, чтобы построить sink tree — найти кратчайшие пути от себя ко всем остальным узлам сети\n- Работает пошагово: на каждом шаге выбирает ближайший ещё не обработанный узел и обновляет расстояния до его соседей. Веса рёбер (стоимость линий) должны быть неотрицательными\n- На практике используется в протоколе **OSPF** (Open Shortest Path First) — каждый маршрутизатор знает полную карту сети и строит кратчайшие пути алгоритмом Дейкстры", "**3. Заливка** (flooding):\n- Простейший способ доставки: маршрутизатор пересылает входящий пакет на **все** свои интерфейсы, кроме того, откуда пакет пришёл\n- Без ограничений это приводит к бесконечному размножению пакетов. Защита: **TTL** (Time to Live — счётчик, уменьшается на 1 на каждом маршрутизаторе; при TTL=0 пакет уничтожается) или нумерация пакетов (маршрутизатор запоминает уже пересланные пакеты)\n- Гарантирует доставку по кратчайшему пути (первая копия всегда приходит быстрее остальных). Используется для рассылки обновлений маршрутизации и в ситуациях, когда надёжность важнее эффективности"], "terms": [{"ru": "Принцип оптимальности", "en": "optimality principle", "df": "подпути оптимальных маршрутов тоже оптимальны"}, {"ru": "Sink tree", "en": "дерево кратчайших путей", "df": "дерево оптимальных путей от всех узлов к одному получателю"}, {"ru": "Алгоритм Дейкстры", "en": "Dijkstra's algorithm", "df": "алгоритм поиска кратчайших путей от одного источника"}, {"ru": "Заливка", "en": "flooding", "df": "рассылка пакета на все интерфейсы, кроме входящего"}, {"ru": "TTL", "en": "Time to Live", "df": "счётчик переходов, ограничивающий время жизни пакета в сети"}, {"ru": "OSPF", "en": "Open Shortest Path First", "df": "протокол маршрутизации, использующий алгоритм Дейкстры"}], "summary": ["Принцип оптимальности: подпуть оптимального пути оптимален", "Sink tree = дерево кратчайших путей ко всем узлам", "Дейкстра (Dijkstra): O(N²) или O((N+E)logN) с очередью", "Заливка (flooding): пакет на все порты кроме входного", "TTL ограничивает циркуляцию при заливке", "Заливка гарантирует доставку по кратчайшему пути"]}, {"n": 33, "title": "Алгоритмы маршрутизации: маршрутизация по вектору расстояний, маршрутизация с учетом состояния линий, иерархическая маршрутизация.", "paragraphs": ["Существуют два основных подхода к построению таблиц маршрутизации: каждый маршрутизатор либо обменивается расстояниями с соседями, либо знает полную карту сети. При росте сети оба подхода плохо масштабируются, поэтому используется иерархия.", "**1. Маршрутизация по вектору расстояний** (Distance Vector, DV):\n- Каждый маршрутизатор хранит таблицу: для каждого узла сети — расстояние до него и через какого соседа идти. Периодически он отправляет эту таблицу своим соседям\n- Сосед получает таблицу, сравнивает с собственной и обновляет, если нашёл более короткий путь. Этот процесс обмена и обновления — распределённая версия алгоритма **Беллмана-Форда** (Bellman-Ford), который находит кратчайшие пути путём последовательного улучшения оценок расстояний\n- Главный недостаток — **счёт до бесконечности** (count-to-infinity): при отказе линии маршрутизаторы медленно увеличивают стоимость, обмениваясь устаревшими данными. Решения: **split horizon** (не сообщать маршрут тому, от кого он получен) и **poison reverse** (сообщить бесконечную стоимость вместо молчания)\n- Протокол **RIP** (Routing Information Protocol) основан на этом подходе", "**2. Маршрутизация с учётом состояния линий** (Link State, LS):\n- Каждый маршрутизатор самостоятельно узнаёт полную карту сети и строит кратчайшие пути. Работает в 4 шага:\n- Обнаруживает соседей и измеряет стоимость линий до них\n- Формирует пакет **LSA** (Link State Advertisement — объявление о состоянии линий), в котором перечисляет своих соседей и стоимости\n- Рассылает LSA всем маршрутизаторам сети методом **заливки** (flooding)\n- Когда каждый маршрутизатор получил LSA от всех остальных, он имеет полную карту сети и запускает **алгоритм Дейкстры** для построения кратчайших путей\n- Сходится быстрее DV и не имеет проблемы счёта до бесконечности. Протоколы: **OSPF** (Open Shortest Path First) и **IS-IS**", "**3. Иерархическая маршрутизация:**\n- В большой сети (как Интернет) невозможно хранить маршруты ко всем узлам. Поэтому маршрутизаторы объединяются в **автономные системы** (AS — Autonomous System), каждая под единым управлением\n- Внутри своей AS маршрутизатор знает полную топологию (используя OSPF или RIP). Для других AS он знает только агрегированный маршрут — «чтобы попасть в AS X, отправляй на маршрутизатор Y»\n- Это значительно сокращает размер таблиц маршрутизации. Между AS используется протокол **BGP** (Border Gateway Protocol)"], "terms": [{"ru": "Вектор расстояний", "en": "distance vector", "df": "подход, при котором маршрутизаторы обмениваются таблицами расстояний с соседями"}, {"ru": "Состояние линий", "en": "link state", "df": "подход, при котором каждый маршрутизатор знает полную карту сети"}, {"ru": "Счёт до бесконечности", "en": "count-to-infinity", "df": "медленная сходимость DV при отказе линии"}, {"ru": "LSA", "en": "Link State Advertisement", "df": "пакет с информацией о соседях и стоимостях линий"}, {"ru": "RIP", "en": "Routing Information Protocol", "df": "протокол маршрутизации на основе DV"}, {"ru": "OSPF", "en": "Open Shortest Path First", "df": "протокол маршрутизации на основе Link State"}, {"ru": "AS", "en": "Autonomous System", "df": "автономная система, группа сетей под единым управлением"}, {"ru": "BGP", "en": "Border Gateway Protocol", "df": "протокол маршрутизации между автономными системами"}], "summary": ["DV (Distance Vector): Беллман-Форд, рассылка таблиц соседям", "DV проблема: count-to-infinity; решение: split horizon", "RIP основан на DV; OSPF и IS-IS — на Link State", "LS: обнаружение соседей → LSA заливкой → Дейкстра на каждом", "LS сходится быстрее, нет счёта до бесконечности", "Иерархия: AS (автономные системы), внутри — полная топология"]}, {"n": 34, "title": "Алгоритмы маршрутизации: широковещательная маршрутизация, многоадресная рассылка, произвольная маршрутизация.", "paragraphs": ["Помимо обычной доставки одному получателю (unicast), сетевой уровень поддерживает три других способа доставки: всем, группе или ближайшему.", "**1. Широковещательная маршрутизация** (broadcast routing):\n- Задача — доставить один пакет **всем** узлам сети. Простой способ — заливка (flooding), но она создаёт множество дубликатов\n- **RPF** (Reverse Path Forwarding) — более эффективный метод: маршрутизатор пересылает пакет только если он пришёл с того интерфейса, который является кратчайшим путём к источнику. Если пакет пришёл с другого интерфейса — значит это дубликат, и он отбрасывается\n- Ещё эффективнее — построение **остовного дерева** (spanning tree): строится дерево, покрывающее все узлы без петель, и пакет рассылается только по ветвям этого дерева", "**2. Многоадресная рассылка** (multicast):\n- Задача — доставить пакет не всем, а только определённой **группе** получателей (например, участникам видеоконференции)\n- Два подхода к построению дерева рассылки: **от источника** — для каждого отправителя строится своё дерево (протокол **DVMRP** — Distance Vector Multicast Routing Protocol), или **с общей точкой сбора** (**RP** — Rendezvous Point) — все отправители шлют данные на одну точку, откуда они расходятся к получателям (протокол **PIM-SM** — Protocol Independent Multicast, Sparse Mode)\n- **IGMP** (Internet Group Management Protocol) — протокол, с помощью которого хосты сообщают своему маршрутизатору, в каких multicast-группах они хотят участвовать", "**3. Произвольная маршрутизация** (anycast):\n- Задача — доставить пакет **ближайшему** из нескольких узлов, имеющих один и тот же адрес. Сеть сама выбирает ближайший по метрике маршрутизации\n- Используется в **DNS** (запрос идёт к ближайшему серверу корневой зоны) и **CDN** (Content Delivery Network — контент доставляется с ближайшего сервера)"], "terms": [{"ru": "Broadcast", "en": "широковещание", "df": "доставка пакета всем узлам сети"}, {"ru": "RPF", "en": "Reverse Path Forwarding", "df": "пересылка только если пакет пришёл с кратчайшего пути к источнику"}, {"ru": "Остовное дерево", "en": "spanning tree", "df": "дерево, покрывающее все узлы без петель"}, {"ru": "Multicast", "en": "многоадресная рассылка", "df": "доставка пакета определённой группе получателей"}, {"ru": "DVMRP", "en": "Distance Vector Multicast Routing Protocol", "df": "протокол multicast с деревьями от источника"}, {"ru": "PIM-SM", "en": "Protocol Independent Multicast, Sparse Mode", "df": "протокол multicast с общей точкой сбора (RP)"}, {"ru": "IGMP", "en": "Internet Group Management Protocol", "df": "протокол управления членством хостов в multicast-группах"}, {"ru": "Anycast", "en": "произвольная маршрутизация", "df": "доставка ближайшему из узлов с одинаковым адресом"}], "summary": ["Broadcast: RPF — пересылка если пришёл с кратчайшего пути", "Эффективнее RPF — построение остовного дерева (spanning tree)", "Multicast: деревья от источника (DVMRP) или RP (PIM-SM)", "IGMP — управление членством в multicast-группах", "Anycast: доставка ближайшему из узлов с одним адресом", "Anycast используется в DNS и CDN"]}, {"n": 35, "title": "Алгоритмы маршрутизации для мобильных хостов, маршрутизация в произвольных сетях.", "paragraphs": ["**1. Mobile IP** (маршрутизация для мобильных хостов):\n- Проблема: когда устройство (например, ноутбук) перемещается в другую сеть, его IP-адрес меняется, и все соединения разрываются. Mobile IP решает это, сохраняя постоянный **домашний адрес**\n- В домашней сети устройства работает **домашний агент** (home agent) — специальный маршрутизатор, который знает, где сейчас находится устройство\n- Когда устройство попадает в чужую сеть, оно получает временный **care-of address** (адрес для пересылки) от **иностранного агента** (foreign agent) и сообщает его домашнему агенту\n- Пакеты, отправленные на домашний адрес, приходят к домашнему агенту, который **туннелирует** их (оборачивает в новый пакет) на care-of address\n- Недостаток: **треугольная маршрутизация** — даже если отправитель находится рядом с мобильным устройством, пакеты всё равно идут через домашний агент, что увеличивает задержку", "**2. Маршрутизация в ad hoc-сетях** (произвольных сетях):\n- **Ad hoc-сеть** — это сеть без фиксированной инфраструктуры, где каждый узел одновременно является и хостом, и маршрутизатором. Топология постоянно меняется, так как узлы перемещаются\n- **Реактивные протоколы** — маршрут строится только когда он нужен. Пример: **AODV** (Ad hoc On-Demand Distance Vector) — отправитель рассылает запрос **RREQ** (Route Request) через всю сеть, получатель отвечает **RREP** (Route Reply) по обратному пути. Экономит ресурсы, но первый пакет ждёт дольше\n- **Проактивные протоколы** — таблицы маршрутизации поддерживаются постоянно, как в обычных сетях. Пример: **DSDV** (Destination-Sequenced Distance Vector). Маршрут доступен сразу, но постоянный обмен обновлениями расходует энергию и полосу\n- **Гибридные протоколы** — сочетают оба подхода. Пример: **ZRP** (Zone Routing Protocol) — внутри определённой зоны (близкие соседи) используется проактивная маршрутизация, а между зонами — реактивная"], "terms": [{"ru": "Домашний агент", "en": "home agent", "df": "маршрутизатор в домашней сети, перенаправляющий пакеты мобильному хосту"}, {"ru": "Иностранный агент", "en": "foreign agent", "df": "маршрутизатор в посещаемой сети"}, {"ru": "Треугольная маршрутизация", "en": "triangle routing", "df": "неоптимальный путь через домашний агент"}, {"ru": "AODV", "en": "Ad hoc On-Demand Distance Vector", "df": "реактивный протокол, строит маршрут по запросу (RREQ/RREP)"}, {"ru": "DSDV", "en": "Destination-Sequenced Distance Vector", "df": "проактивный протокол с постоянными таблицами"}, {"ru": "ZRP", "en": "Zone Routing Protocol", "df": "гибридный протокол: проактивный внутри зоны, реактивный между зонами"}], "summary": ["Mobile IP: домашний агент + care-of address в чужой сети", "Домашний агент туннелирует пакеты иностранному агенту", "Проблема треугольной маршрутизации (triangle routing)", "Ad hoc: узлы = маршрутизаторы, нет инфраструктуры", "AODV — реактивный (RREQ/RREP по требованию)", "DSDV — проактивный; ZRP — гибрид (зоны)"]}, {"n": 36, "title": "Подходы к борьбе с перегрузкой: управление доступом, регулирование трафика, сброс нагрузки. Маршрутизация с учетом состояния трафика.", "paragraphs": ["**Перегрузка** (congestion) возникает, когда в сеть поступает больше пакетов, чем она способна обработать. Буферы маршрутизаторов переполняются, пакеты теряются, задержки растут. Существуют четыре основных подхода к борьбе с перегрузкой.", "**1. Управление доступом** (admission control):\n- Если сеть уже перегружена, новые потоки данных не допускаются до тех пор, пока нагрузка не снизится. Применяется в сетях с виртуальными каналами — маршрутизатор отказывает в установке нового VC, если ресурсов недостаточно", "**2. Регулирование трафика** (traffic shaping):\n- Источник ограничивает скорость отправки пакетов, чтобы не создавать всплесков нагрузки\n- **Leaky bucket** (дырявое ведро) — пакеты поступают с любой скоростью, но выходят с постоянной фиксированной скоростью, как вода из дырки в ведре. Сглаживает всплески полностью\n- **Token bucket** (маркерное ведро) — в ведро с постоянной скоростью поступают маркеры (tokens). Чтобы отправить пакет, нужен маркер. Если маркеры накопились — допускается кратковременный всплеск; если кончились — отправка ждёт. Более гибкий, чем leaky bucket", "**3. Сброс нагрузки** (load shedding):\n- Крайняя мера: при переполнении буферов маршрутизатор отбрасывает пакеты. Вопрос — какие пакеты отбрасывать первыми (старые или новые — зависит от приложения)\n- **RED** (Random Early Detection) — более умный подход: маршрутизатор начинает случайно отбрасывать пакеты **до** переполнения буфера. Это сигнализирует отправителям (через TCP) замедлить передачу, предотвращая полную перегрузку", "**4. Маршрутизация с учётом состояния трафика:**\n- Маршрутизаторы выбирают пути не только по кратчайшему расстоянию, но и по текущей загрузке каналов — направляют трафик в обход перегруженных участков\n- Проблема: если все маршрутизаторы одновременно перенаправят трафик на один свободный канал, он тоже перегрузится. Это вызывает **осцилляции** — трафик переключается туда-сюда, и сеть становится нестабильной"], "terms": [{"ru": "Перегрузка", "en": "congestion", "df": "нагрузка на сеть превышает её пропускную способность"}, {"ru": "Управление доступом", "en": "admission control", "df": "отказ в допуске новых потоков при перегрузке"}, {"ru": "Leaky bucket", "en": "дырявое ведро", "df": "выравнивание трафика до постоянной скорости"}, {"ru": "Token bucket", "en": "маркерное ведро", "df": "ограничение средней скорости с допуском всплесков"}, {"ru": "Сброс нагрузки", "en": "load shedding", "df": "отбрасывание пакетов при переполнении буферов"}, {"ru": "RED", "en": "Random Early Detection", "df": "упреждающее случайное отбрасывание пакетов до переполнения"}], "summary": ["Admission control: не пускать новые потоки при перегрузке", "Leaky bucket: постоянная скорость, без всплесков", "Token bucket: допускает всплески в пределах запаса токенов", "Load shedding: отбрасывание пакетов при переполнении буфера", "RED: упреждающий случайный сброс до переполнения", "Маршрутизация по нагрузке — нестабильность при перераспределении"]}, {"n": 37, "title": "Требования приложений. Формирование трафика. Диспетчеризация пакетов. Управление доступом. Интегральное обслуживание. Дифференцированное обслуживание.", "paragraphs": ["Разные приложения предъявляют разные требования к сети. Для обеспечения качества обслуживания (**QoS** — Quality of Service) используются механизмы формирования трафика, диспетчеризации и две архитектуры QoS.", "**1. Требования приложений:**\n- **VoIP и видеозвонки** чувствительны к задержке и **джиттеру** (jitter — колебания задержки): если пакеты приходят неравномерно, звук прерывается\n- **Передача файлов** чувствительна к надёжности — потеря данных недопустима, но задержка не критична\n- **Потоковое видео** требует стабильной полосы пропускания — иначе изображение замирает", "**2. Формирование трафика** (traffic shaping):\n- Ограничивает скорость отправки, чтобы не перегружать сеть. Два алгоритма: **leaky bucket** (постоянная скорость выхода) и **token bucket** (допускает всплески) — подробнее в Q36", "**3. Диспетчеризация пакетов** (packet scheduling):\n- Определяет, в каком порядке маршрутизатор отправляет пакеты из очередей. **WFQ** (Weighted Fair Queuing — взвешенное честное обслуживание) — каждый поток получает долю полосы пропорционально своему весу. Это гарантирует, что важный трафик (голос) не будет вытеснен менее важным (загрузка файлов)", "**4. Управление доступом** (admission control):\n- Перед тем как допустить новый поток в сеть, проверяется, хватит ли ресурсов. Если сеть уже нагружена — новый поток отклоняется, чтобы не ухудшить качество для существующих потоков", "**5. Интегральное обслуживание** (IntServ — Integrated Services):\n- Архитектура QoS, в которой каждый поток получает индивидуальные гарантии. Перед передачей данных приложение резервирует ресурсы на всём пути с помощью протокола **RSVP** (Resource Reservation Protocol)\n- Минус: плохо масштабируется — каждый маршрутизатор должен хранить состояние каждого потока, что невозможно в крупных сетях", "**6. Дифференцированное обслуживание** (DiffServ — Differentiated Services):\n- Более масштабируемый подход: вместо индивидуальных гарантий пакеты делятся на **классы**. На входе в сеть пакет маркируется полем **DSCP** (Differentiated Services Code Point — 6 бит в заголовке IP), и маршрутизаторы обслуживают его по классу\n- **EF** (Expedited Forwarding) — класс для трафика с низкой задержкой (голос, видео)\n- **AF** (Assured Forwarding) — несколько уровней приоритета и вероятности отбрасывания для обычного трафика"], "terms": [{"ru": "QoS", "en": "Quality of Service", "df": "гарантии качества обслуживания в сети"}, {"ru": "Джиттер", "en": "jitter", "df": "колебания задержки между пакетами"}, {"ru": "WFQ", "en": "Weighted Fair Queuing", "df": "диспетчеризация с распределением полосы по весам"}, {"ru": "IntServ", "en": "Integrated Services", "df": "архитектура QoS с индивидуальными гарантиями для потоков"}, {"ru": "RSVP", "en": "Resource Reservation Protocol", "df": "протокол резервирования ресурсов вдоль пути"}, {"ru": "DiffServ", "en": "Differentiated Services", "df": "архитектура QoS на основе классов трафика"}, {"ru": "DSCP", "en": "Differentiated Services Code Point", "df": "6-битное поле маркировки в заголовке IP"}, {"ru": "EF", "en": "Expedited Forwarding", "df": "класс DiffServ для трафика с низкой задержкой"}, {"ru": "AF", "en": "Assured Forwarding", "df": "класс DiffServ с несколькими уровнями приоритета"}], "summary": ["VoIP/видео: чувствительны к задержке и джиттеру", "WFQ: доля полосы пропорционально весу потока", "IntServ: QoS для потоков через RSVP; плохо масштабируется", "DiffServ: маркировка DSCP, обслуживание по классу", "EF = низкая задержка; AF = несколько уровней приоритета", "Traffic shaping: leaky bucket и token bucket"]}, {"n": 38, "title": "Объединение сетей. Различия сетей и способы объединения сетей. Туннелирование. Маршрутизация в объединённых сетях. Фрагментация пакетов.", "paragraphs": ["В реальном Интернете соединяются сети с разными технологиями, протоколами и ограничениями. Задача объединения сетей — обеспечить сквозную передачу данных несмотря на эти различия.", "**1. Различия сетей и способы объединения:**\n- Сети различаются по технологии (Ethernet, Wi-Fi, ATM), адресации, максимальному размеру пакета, протоколам и качеству обслуживания\n- Объединение возможно на разных уровнях: повторители (L1) просто усиливают сигнал, мосты/коммутаторы (L2) соединяют по MAC-адресам, **маршрутизаторы** (L3) — основное средство объединения разнородных сетей, так как они работают с единым протоколом IP. **Шлюзы** (L4+) преобразуют протоколы на уровне приложений", "**2. Туннелирование** (tunneling):\n- Когда пакет должен пройти через сеть с другим протоколом, его **инкапсулируют** — оборачивают целиком в пакет этой сети. На выходе из промежуточной сети внешняя обёртка снимается, и оригинальный пакет продолжает путь\n- Примеры: **6in4** (пакеты IPv6 передаются внутри IPv4 в сетях, ещё не поддерживающих IPv6), **VPN** (шифрованный туннель через публичный Интернет), **Mobile IP** (туннель от домашнего агента к мобильному устройству)", "**3. Маршрутизация в объединённых сетях:**\n- Единый протокол **IP** позволяет маршрутизаторам принимать решения независимо от технологии нижележащей сети. Каждый маршрутизатор смотрит на IP-адрес назначения и пересылает пакет дальше по таблице маршрутизации", "**4. Фрагментация пакетов:**\n- Каждая сеть имеет свой **MTU** (Maximum Transmission Unit — максимальный размер пакета). Если пакет больше MTU следующей сети, его нужно разбить на части — это и есть **фрагментация**\n- В **IPv4** фрагментировать может любой маршрутизатор на пути, а собирает фрагменты только получатель. Флаг **DF** (Don't Fragment) запрещает фрагментацию — если пакет не проходит, м
