* (информационная безопасность), ISO 9001 (менеджмент качества). Часто работает совместно с **IEC** (International Electrotechnical Commission).\n- **IEEE** (Institute of Electrical and Electronics Engineers) — профессиональная инженерная ассоциация (США), стандарты локальных и беспроводных сетей:\n  - 802.1 (мосты, VLAN), 802.3 (Ethernet), 802.11 (Wi-Fi), 802.15 (Bluetooth, Zigbee), 802.16 (WiMAX), 802.1X (port-based authentication).", "<h3>Организации в области Интернета</h3>", "Интернет управляется не централизованным регулятором, а **экосистемой коллегиальных организаций** (multi-stakeholder model):\n- **ISOC** (Internet Society) — некоммерческая зонтичная организация, поддерживающая IETF.\n- **IETF** (Internet Engineering Task Force) — открытое сообщество инженеров; публикует стандарты в виде документов **RFC** (Request for Comments). Принцип: «rough consensus and running code» — приоритет работающим реализациям над теорией. Стадии стандартизации: Internet-Draft → Proposed Standard → Internet Standard.\n- **IAB** (Internet Architecture Board) — комитет, определяет архитектурные принципы Интернета и осуществляет надзор за функциями IANA.\n- **IRTF** (Internet Research Task Force) — исследовательский параллельный орган IETF.\n- **ICANN** (Internet Corporation for Assigned Names and Numbers) — независимая некоммерческая организация (Калифорния), управляет корневой зоной DNS, аккредитует регистраторов доменных имён, координирует распределение адресного пространства.\n- **IANA** (Internet Assigned Numbers Authority) — функция внутри ICANN, ведёт реестры IP-адресов, номеров AS, портов, параметров протоколов; делегирует блоки **RIR** (Regional Internet Registries): ARIN (Северная Америка), RIPE NCC (Европа, Россия, Ближний Восток), APNIC (Азия), LACNIC, AFRINIC.\n- **W3C** (World Wide Web Consortium) — стандарты Веба: HTML, CSS, XML, DOM, SVG, WebAssembly. Основан Тимом Бернерсом-Ли в 1994 г.\n- **WHATWG** (Web Hypertext Application Technology Working Group) — поддерживает «живой стандарт» HTML параллельно с W3C.", "<h3>Организации в области безопасности</h3>", "- **ISO/IEC 27001, 27002** — стандарты систем управления информационной безопасностью (**ISMS**, Information Security Management System). 27001 — требования к ISMS, 27002 — кодекс практик.\n- **NIST** (National Institute of Standards and Technology, США) — федеральное агентство, выпускает стандарты **FIPS** (Federal Information Processing Standards) в области криптографии (FIPS 197 — AES, FIPS 186 — DSS), а также серии SP 800-xx (Cybersecurity Framework, post-quantum cryptography). Решения NIST имеют международное влияние.\n- **NSA / CISA** (США) — рекомендации Suite B (с 2015 г. CNSA), руководства по безопасности.\n- **CIS** (Center for Internet Security) — CIS Controls, CIS Benchmarks (best-practice конфигурации систем).\n- **PCI SSC** (PCI Security Standards Council) — **PCI DSS** для индустрии платёжных карт.\n- **OWASP** (Open Web Application Security Project) — открытый проект безопасности веб-приложений (OWASP Top 10, ASVS, ZAP).", "<h3>Региональные организации</h3>", "- **ETSI** (European Telecommunications Standards Institute) — европейские телеком-стандарты: **GSM** (исторически), DECT, TETRA, TISPAN, NFV — основной разработчик стандартов виртуализации сетевых функций.\n- **3GPP** (3rd Generation Partnership Project) — консорциум семи региональных организаций (ETSI, ARIB/TTC Япония, TTA Корея, ATIS США, CCSA Китай, TSDSI Индия). Разрабатывает спецификации сотовой связи 3G/4G/5G/6G в виде Releases (Rel-15 — первый 5G, Rel-18 — 5G-Advanced).\n- **ANSI** (American National Standards Institute) — координатор стандартов в США.\n- **CEN/CENELEC** — европейские органы стандартизации.", "<h3>Отечественные организации (Россия)</h3>", "- **Росстандарт** (Федеральное агентство по техническому регулированию и метрологии) — публикует национальные стандарты **ГОСТ Р**; часто адаптирует международные ISO/IEC.\n- **Минцифры России** (Министерство цифрового развития, связи и массовых коммуникаций) — государственное регулирование в сфере ИТ и связи, лицензирование операторов.\n- **Роскомнадзор** — надзор в сфере связи, информационных технологий и массовых коммуникаций, регулирование персональных данных.\n- **ФСБ России** — регулирование криптографических средств, лицензирование СКЗИ.\n- **ФСТЭК России** — техническая защита информации, сертификация средств защиты, требования к ИСПДн и КИИ.\n- **ТК 26** (Технический комитет по стандартизации «Криптографическая защита информации») — отечественные криптостандарты ГОСТ 34.10-2018 (ЭЦП), ГОСТ 34.11-2018 (хеш «Стрибог»), ГОСТ 34.12-2018 (блочные шифры «Кузнечик», «Магма»).\n- **СОРМ** (Система оперативно-розыскных мероприятий) — комплекс технических требований к операторам связи для обеспечения доступа уполномоченных органов к трафику (СОРМ-1 — телефония, СОРМ-2 — Интернет, СОРМ-3 — DPI).\n- **НИИ Радио, ЦНИИС** — отраслевые НИИ.", "<h3>Жизненный цикл стандарта</h3>", "Типичный путь от идеи до промышленного использования:\n- **Working Group / Draft** — формирование рабочей группы, обсуждение драфта.\n- **Public review** — публичное обсуждение, замечания.\n- **Approval** — голосование членов организации.\n- **Publication** — официальная публикация.\n- **Implementation** — реализация в продуктах, тесты на совместимость (plugfests, interop events).\n- **Revision / Withdrawal** — пересмотр или отзыв устаревших стандартов."], "terms": [{"ru": "Стандарт де-юре", "en": "de jure standard", "df": "официально утверждённый стандарт уполномоченной организацией по формальной процедуре"}, {"ru": "Стандарт де-факто", "en": "de facto standard", "df": "стандарт, сложившийся в результате широкого применения без официального утверждения"}, {"ru": "Открытый стандарт", "en": "open standard", "df": "публично доступная спецификация, которую любой может реализовать без лицензионных отчислений"}, {"ru": "Интероперабельность", "en": "interoperability", "df": "способность систем разных производителей работать совместно благодаря общим стандартам"}, {"ru": "ITU", "en": "International Telecommunication Union", "df": "Международный союз электросвязи; специализированное агентство ООН по телекоммуникациям"}, {"ru": "ISO", "en": "International Organization for Standardization", "df": "Международная организация по стандартизации; разработчик OSI и серии 27000"}, {"ru": "IEC", "en": "International Electrotechnical Commission", "df": "Международная электротехническая комиссия, часто работает совместно с ISO"}, {"ru": "IEEE", "en": "Institute of Electrical and Electronics Engineers", "df": "Институт инженеров электротехники и электроники; стандарты семейства 802"}, {"ru": "IETF", "en": "Internet Engineering Task Force", "df": "открытое сообщество, разрабатывающее интернет-стандарты в форме RFC"}, {"ru": "RFC", "en": "Request for Comments", "df": "документ IETF с технической спецификацией протокола или информационным содержанием"}, {"ru": "IAB", "en": "Internet Architecture Board", "df": "Совет по архитектуре Интернета, надзорный орган IETF"}, {"ru": "ICANN", "en": "Internet Corporation for Assigned Names and Numbers", "df": "организация, координирующая адресное пространство и систему DNS"}, {"ru": "IANA", "en": "Internet Assigned Numbers Authority", "df": "функция внутри ICANN, ведущая реестры IP-адресов, портов, AS, параметров протоколов"}, {"ru": "RIR", "en": "Regional Internet Registry", "df": "региональный интернет-регистратор: ARIN, RIPE NCC, APNIC, LACNIC, AFRINIC"}, {"ru": "W3C", "en": "World Wide Web Consortium", "df": "Консорциум Всемирной паутины; стандарты HTML, CSS, XML, SVG"}, {"ru": "3GPP", "en": "3rd Generation Partnership Project", "df": "международный консорциум разработчиков стандартов сотовой связи 3G–5G"}, {"ru": "ETSI", "en": "European Telecommunications Standards Institute", "df": "Европейский институт телекоммуникационных стандартов"}, {"ru": "NIST", "en": "National Institute of Standards and Technology", "df": "Национальный институт стандартов и технологий США; выпускает FIPS и SP 800"}, {"ru": "FIPS", "en": "Federal Information Processing Standards", "df": "федеральные стандарты обработки информации США (FIPS 197 — AES)"}, {"ru": "ISMS", "en": "Information Security Management System", "df": "система управления информационной безопасностью (ISO/IEC 27001)"}, {"ru": "PCI DSS", "en": "Payment Card Industry Data Security Standard", "df": "стандарт безопасности данных индустрии платёжных карт"}], "summary": ["**Стандартизация** обеспечивает **интероперабельность** оборудования разных производителей", "**Де-юре** — официально утверждённые (ISO/IEC 27001, ITU-T G.711, IEEE 802.3)", "**Де-факто** — сложившиеся (TCP/IP, PDF, ранний Ethernet)", "Открытые (без лицензий) vs проприетарные (SMB, ранний Skype)", "**ITU** (МСЭ, агентство ООН с 1865 г., Женева): **ITU-T** (G/H/V/X/Y серии — G.711, H.264, X.25), **ITU-R** (спектр, IMT-2000/Advanced/2020), **ITU-D**", "**ISO** (1947): OSI (ISO 7498), серия **ISO/IEC 27000** (ИБ), часто с IEC", "**IEEE**: 802.1 (мосты, VLAN), **802.3** (Ethernet), **802.11** (Wi-Fi), 802.15 (Bluetooth/Zigbee), 802.16 (WiMAX), 802.1X (аутентификация)", "**Интернет — multi-stakeholder**: **ISOC** → **IETF** (RFC, «rough consensus and running code»; стадии Internet-Draft → Proposed → Internet Standard)", "**IAB** — архитектура; **IRTF** — исследования; **ICANN** управляет корневой зоной DNS; **IANA** ведёт реестры IP/портов/AS", "**RIR**: ARIN (Сев. Америка), **RIPE NCC** (Европа/Россия), APNIC, LACNIC, AFRINIC", "**W3C** (Тим Бернерс-Ли, 1994) — HTML/CSS/XML/SVG; **WHATWG** — живой стандарт HTML", "**Безопасность**: **NIST** (FIPS 197 — AES, SP 800-xx), **ISO/IEC 27001/27002** (**ISMS**), **PCI DSS**, OWASP Top 10", "**ETSI** — GSM, DECT, NFV; **3GPP** — 3G/4G/5G/6G (Rel-15 = первый 5G, Rel-18 = 5G-Advanced); ANSI, CEN/CENELEC", "**Россия — Росстандарт** (**ГОСТ Р**), **Минцифры**, **Роскомнадзор**, **ФСБ** (СКЗИ), **ФСТЭК** (КИИ, ИСПДн)", "**ТК 26**: ГОСТ 34.10-2018 (ЭЦП), 34.11-2018 («Стрибог»), 34.12-2018 («Кузнечик»/«Магма»)", "**СОРМ** (СОРМ-1 — телефония, СОРМ-2 — Интернет, СОРМ-3 — DPI); НИИ Радио, ЦНИИС", "Жизненный цикл: Working Group → Draft → Public Review → Approval → Publication → Implementation (plugfests) → Revision/Withdrawal"]}], "quizzes": [{"type": "mcq", "topic": "Вопрос 1", "q": "Какой тип сети охватывает масштаб города?", "opts": ["PAN", "LAN", "MAN", "WAN"], "ans": 2, "expl": "MAN (Metropolitan Area Network) охватывает город. PAN — метры, LAN — здание/кампус, WAN — сотни-тысячи км."}, {"type": "mcq", "topic": "Вопрос 1", "q": "Какая топология соединяет каждый узел с каждым?", "opts": ["Шина (bus)", "Звезда (star)", "Кольцо (ring)", "Полная сетка (full mesh)"], "ans": 3, "expl": "Полная сетка (full mesh) — топология, где каждый узел соединён с каждым другим."}, {"type": "mcq", "topic": "Вопрос 1", "q": "Какой стандарт соответствует технологии Wi-Fi?", "opts": ["802.3", "802.11", "802.15", "802.16"], "ans": 1, "expl": "Wi-Fi — это семейство стандартов IEEE 802.11."}, {"type": "mcq", "topic": "Вопрос 1", "q": "Какая технология НЕ относится к беспроводным сетям?", "opts": ["Bluetooth", "Zigbee", "GPON", "5G"], "ans": 2, "expl": "GPON — оптоволоконная (проводная) технология для домашних сетей. Bluetooth, Zigbee и 5G — беспроводные."}, {"type": "mcq", "topic": "Вопрос 1", "q": "Какие два основных подхода к передаче данных различают по технологии?", "opts": ["Аналоговый и цифровой", "Broadcast и packet switching", "Проводной и беспроводной", "Синхронный и асинхронный"], "ans": 1, "expl": "По технологии передачи сети делятся на broadcast (широковещательные) и packet switching (с коммутацией пакетов)."}, {"type": "mcq", "topic": "Вопрос 1", "q": "Какая технология НЕ характерна для корпоративных сетей?", "opts": ["Ethernet", "VPN", "Выделенные каналы", "Zigbee"], "ans": 3, "expl": "Корпоративные сети используют Ethernet, VPN, выделенные каналы и централизованное управление. Zigbee — технология для сенсорных/IoT-сетей."}, {"type": "tf", "topic": "Вопрос 1", "q": "DSL, кабельный Интернет и GPON — типичные технологии домашних сетей.", "ans": true, "expl": "Верно. Домашние сети используют DSL, кабельный Интернет, GPON + беспроводной маршрутизатор."}, {"type": "tf", "topic": "Вопрос 1", "q": "Беспроводные сети особенно важны там, где прокладка кабеля невозможна: склады, стройплощадки, удалённые регионы.", "ans": true, "expl": "Верно. Именно эти примеры приводятся: склады, стройплощадки, удалённые регионы."}, {"type": "tf", "topic": "Вопрос 1", "q": "Гибридная топология — это разновидность классификации сетей по масштабу.", "ans": false, "expl": "Неверно. Гибридная — это классификация по топологии, а не по масштабу. По масштабу: PAN, LAN, MAN, WAN."}, {"type": "tf", "topic": "Вопрос 1", "q": "Bluetooth относится к технологиям корпоративных сетей.", "ans": false, "expl": "Неверно. Bluetooth — беспроводная технология (наряду с Wi-Fi, Zigbee, 3G/4G/5G). Корпоративные сети: Ethernet, VPN, выделенные каналы."}, {"type": "match", "topic": "Вопрос 1", "q": "Сопоставьте тип сети с его характеристикой:", "pairs": [{"l": "Корпоративная", "r": "Ethernet, VPN, централизованное управление"}, {"l": "Домашняя", "r": "DSL, кабельный Интернет, GPON"}, {"l": "Беспроводная", "r": "Wi-Fi, Bluetooth, Zigbee, 3G/4G/5G"}, {"l": "По топологии", "r": "Шина, звезда, кольцо, полная сетка"}], "expl": "Каждый тип сети имеет свои характерные технологии и признаки классификации."}, {"type": "mcq", "topic": "Вопрос 2", "q": "Какова типичная скорость передачи данных в LAN?", "opts": ["1–10 Мбит/с", "100 Мбит/с – 100 Гбит/с", "1–10 Гбит/с только", "До 1 Мбит/с"], "ans": 1, "expl": "LAN: здание/кампус, скорости от 100 Мбит/с до 100 Гбит/с."}, {"type": "mcq", "topic": "Вопрос 2", "q": "Какое устройство работает на уровне L3 и использует IP-адреса для объединения сетей?", "opts": ["Коммутатор (switch)", "Маршрутизатор (router)", "Хаб (hub)", "Точка доступа (AP)"], "ans": 1, "expl": "Маршрутизаторы работают на уровне L3 и используют IP-адреса для объединения сетей (internetworking)."}, {"type": "mcq", "topic": "Вопрос 2", "q": "Что выполняет шлюз (gateway) при объединении сетей?", "opts": ["Фильтрацию по MAC-адресам", "Преобразование протоколов", "Усиление сигнала", "Назначение IP-адресов"], "ans": 1, "expl": "Шлюзы выполняют преобразование протоколов при объединении разнородных сетей."}, {"type": "mcq", "topic": "Вопрос 2", "q": "Какой технологией характеризуется MAN?", "opts": ["Bluetooth", "WiMAX и кабельное ТВ", "Zigbee", "LoRaWAN"], "ans": 1, "expl": "MAN (городская сеть) характеризуется технологиями WiMAX и кабельного ТВ."}, {"type": "mcq", "topic": "Вопрос 2", "q": "Что означает инкапсуляция в контексте стека протоколов?", "opts": ["Шифрование данных", "Оборачивание данных заголовком и трейлером", "Сжатие пакетов", "Маршрутизация данных"], "ans": 1, "expl": "Инкапсуляция — процесс, при котором данные оборачиваются заголовком (header) и трейлером (trailer) на каждом уровне."}, {"type": "tf", "topic": "Вопрос 2", "q": "PAN охватывает расстояние порядка метров и типичная технология — Bluetooth.", "ans": true, "expl": "Верно. PAN: ~метры, Bluetooth."}, {"type": "tf", "topic": "Вопрос 2", "q": "WAN охватывает территорию здания или кампуса.", "ans": false, "expl": "Неверно. WAN охватывает сотни-тысячи километров (операторы). Здание/кампус — это LAN."}, {"type": "tf", "topic": "Вопрос 2", "q": "NAT и туннелирование — методы объединения сетей (internetworking).", "ans": true, "expl": "Верно. Internetworking включает: маршрутизаторы, шлюзы, туннелирование, NAT."}, {"type": "tf", "topic": "Вопрос 2", "q": "В многоуровневой иерархии протоколов каждый уровень предоставляет услуги нижестоящему уровню.", "ans": false, "expl": "Неверно. Каждый уровень предоставляет услуги вышестоящему уровню, а не нижестоящему."}, {"type": "match", "topic": "Вопрос 2", "q": "Сопоставьте тип сети с его масштабом и характеристикой:", "pairs": [{"l": "PAN", "r": "~метры, Bluetooth"}, {"l": "LAN", "r": "Здание/кампус, 100 Мбит/с – 100 Гбит/с"}, {"l": "MAN", "r": "Город, WiMAX, кабельное ТВ"}, {"l": "WAN", "r": "Сотни-тысячи км, операторы"}], "expl": "PAN/LAN/MAN/WAN различаются по масштабу и характерным технологиям."}, {"type": "match", "topic": "Вопрос 2", "q": "Сопоставьте аспект проектирования сетей с его переводом:", "pairs": [{"l": "Надёжность", "r": "Reliability"}, {"l": "Масштабируемость", "r": "Scalability"}, {"l": "Безопасность", "r": "Security"}, {"l": "Управляемость", "r": "Manageability"}], "expl": "Ключевые аспекты: надёжность (reliability), масштабируемость (scalability), безопасность (security), QoS, управляемость (manageability)."}, {"type": "mcq", "topic": "Вопрос 3", "q": "Через что предоставляется служба (service) в модели OSI?", "opts": ["IP-адрес", "MAC-адрес", "SAP (Service Access Point)", "API"], "ans": 2, "expl": "Служба предоставляется через SAP (Service Access Point) — точку доступа к службе."}, {"type": "mcq", "topic": "Вопрос 3", "q": "Какой протокол является примером connection-oriented службы?", "opts": ["UDP", "IP", "TCP", "ICMP"], "ans": 2, "expl": "TCP — пример connection-oriented (с установлением соединения): setup → data → disconnect."}, {"type": "mcq", "topic": "Вопрос 3", "q": "Какая последовательность фаз характерна для connection-oriented службы?", "opts": ["data → setup → disconnect", "setup → data → disconnect", "connect → listen → send", "send → receive → disconnect"], "ans": 1, "expl": "Connection-oriented (как телефон): setup → data → disconnect."}, {"type": "mcq", "topic": "Вопрос 3", "q": "Какой примитив используется для ожидания входящего соединения?", "opts": ["CONNECT", "ACCEPT", "LISTEN", "RECEIVE"], "ans": 2, "expl": "LISTEN — примитив для ожидания входящего соединения. Полный набор: LISTEN, CONNECT, ACCEPT, SEND, RECEIVE, DISCONNECT."}, {"type": "mcq", "topic": "Вопрос 3", "q": "Служба — это взаимодействие...", "opts": ["Горизонтальное, между узлами", "Вертикальное, между уровнями одного узла", "Диагональное, между разными уровнями разных узлов", "Внешнее, между сетями"], "ans": 1, "expl": "Служба = вертикальное взаимодействие (между уровнями на одном узле). Протокол = горизонтальное (одинаковые уровни, разные узлы)."}, {"type": "tf", "topic": "Вопрос 3", "q": "Connectionless служба передаёт данные как независимые датаграммы, подобно почте.", "ans": true, "expl": "Верно. Connectionless = почта: датаграммы передаются независимо. Примеры: UDP, IP."}, {"type": "tf", "topic": "Вопрос 3", "q": "UDP является примером connection-oriented протокола.", "ans": false, "expl": "Неверно. UDP — пример connectionless (без установления соединения). TCP — connection-oriented."}, {"type": "tf", "topic": "Вопрос 3", "q": "Протокол — это горизонтальное взаимодействие между одинаковыми уровнями на разных узлах.", "ans": true, "expl": "Верно. Протокол = горизонтальное (peer-to-peer) взаимодействие между одинаковыми уровнями разных узлов."}, {"type": "tf", "topic": "Вопрос 3", "q": "Служба может быть только reliable (надёжной), без вариантов unreliable.", "ans": false, "expl": "Неверно. Служба может быть reliable или unreliable, подтверждаемой или неподтверждаемой."}, {"type": "match", "topic": "Вопрос 3", "q": "Сопоставьте понятие с его аналогией или характеристикой:", "pairs": [{"l": "Connection-oriented", "r": "Телефон: setup → data → disconnect"}, {"l": "Connectionless", "r": "Почта: независимые датаграммы"}, {"l": "Служба (service)", "r": "Вертикальное, между уровнями одного узла"}, {"l": "Протокол (protocol)", "r": "Горизонтальное, одинаковые уровни разных узлов"}], "expl": "Connection-oriented как телефон (TCP), connectionless как почта (UDP/IP). Служба вертикальна, протокол горизонтален."}, {"type": "match", "topic": "Вопрос 3", "q": "Сопоставьте примитив службы с его назначением:", "pairs": [{"l": "LISTEN", "r": "Ожидание входящего соединения"}, {"l": "CONNECT", "r": "Инициирование соединения"}, {"l": "ACCEPT", "r": "Принятие входящего соединения"}, {"l": "DISCONNECT", "r": "Разрыв соединения"}], "expl": "Основные примитивы: LISTEN, CONNECT, ACCEPT, SEND, RECEIVE, DISCONNECT."}, {"type": "mcq", "topic": "Вопрос 4", "q": "Сколько уровней в модели OSI?", "opts": ["4", "5", "6", "7"], "ans": 3, "expl": "Модель OSI содержит 7 уровней: физический, канальный, сетевой, транспортный, сеансовый, представления, прикладной."}, {"type": "mcq", "topic": "Вопрос 4", "q": "Сколько уровней в модели TCP/IP?", "opts": ["4", "5", "6", "7"], "ans": 0, "expl": "Модель TCP/IP содержит 4 уровня: link, internet, transport, application."}, {"type": "mcq", "topic": "Вопрос 4", "q": "Какой уровень OSI отвечает за кодирование, сжатие и шифрование?", "opts": ["L5 сеансовый", "L6 представления", "L7 прикладной", "L4 транспортный"], "ans": 1, "expl": "L6 (уровень представления) отвечает за кодирование, сжатие и шифрование данных."}, {"type": "mcq", "topic": "Вопрос 4", "q": "Какие единицы данных используются на канальном уровне (L2) OSI?", "opts": ["Биты", "Кадры (frames)", "Пакеты (packets)", "Сегменты (segments)"], "ans": 1, "expl": "L2 канальный: кадры (frames), MAC-адреса, обработка ошибок."}, {"type": "mcq", "topic": "Вопрос 4", "q": "Модель OSI является...", "opts": ["Описательной (descriptive)", "Нормативной (prescriptive)", "Гибридной", "Эмпирической"], "ans": 1, "expl": "OSI — нормативная (prescriptive) модель, разработанная ISO до создания протоколов. TCP/IP — описательная (descriptive)."}, {"type": "mcq", "topic": "Вопрос 4", "q": "Какой уровень OSI обеспечивает маршрутизацию пакетов?", "opts": ["L1 физический", "L2 канальный", "L3 сетевой", "L4 транспортный"], "ans": 2, "expl": "L3 сетевой уровень отвечает за пакеты, маршрутизацию и IP."}, {"type": "mcq", "topic": "Вопрос 4", "q": "Какая критика относится к модели TCP/IP?", "opts": ["Слишком много уровней", "Не разделяет службу, интерфейс и протокол", "Поздно вышла на рынок", "Уровни L5/L6 пусты"], "ans": 1, "expl": "Критика TCP/IP: не разделяет службу/интерфейс/протокол, не описывает не-IP сети, link не настоящий уровень, плохо для обучения."}, {"type": "mcq", "topic": "Вопрос 4", "q": "На каком уровне TCP/IP IP является единственным connectionless протоколом?", "opts": ["Link", "Internet (L3)", "Transport", "Application"], "ans": 1, "expl": "В TCP/IP на уровне internet (L3) — только connectionless (IP). OSI поддерживает и connection-oriented, и connectionless на L3 и L4."}, {"type": "tf", "topic": "Вопрос 4", "q": "Модель OSI была разработана организацией ISO.", "ans": true, "expl": "Верно. OSI: 7 уровней, разработана ISO, нормативная модель."}, {"type": "tf", "topic": "Вопрос 4", "q": "Модель TCP/IP была создана раньше модели OSI и является описательной (descriptive).", "ans": true, "expl": "Верно. TCP/IP — описательная модель (DoD), а OSI — нормативная. OSI вышла позже, что стало одной из причин критики."}, {"type": "tf", "topic": "Вопрос 4", "q": "На транспортном уровне (L4) OSI используются пакеты (packets).", "ans": false, "expl": "Неверно. На L4 (транспортный) используются сегменты (segments). Пакеты (packets) — на L3 (сетевой)."}, {"type": "tf", "topic": "Вопрос 4", "q": "Сеансовый уровень (L5) OSI отвечает за синхронизацию и контрольные точки.", "ans": true, "expl": "Верно. L5 сеансовый: управление сеансами, синхронизация, контрольные точки."}, {"type": "tf", "topic": "Вопрос 4", "q": "Одна из критик OSI состоит в том, что уровни L5 и L6 практически пусты.", "ans": true, "expl": "Верно. Критика OSI: поздно вышла, L5/L6 пусты, громоздкие реализации, протоколы не прижились."}, {"type": "match", "topic": "Вопрос 4", "q": "Сопоставьте уровень OSI с его единицей данных:", "pairs": [{"l": "L1 физический", "r": "Биты"}, {"l": "L2 канальный", "r": "Кадры (frames)"}, {"l": "L3 сетевой", "r": "Пакеты (packets)"}, {"l": "L4 транспортный", "r": "Сегменты (segments)"}], "expl": "Каждый уровень OSI оперирует своей единицей данных: биты → кадры → пакеты → сегменты."}, {"type": "match", "topic": "Вопрос 4", "q": "Сопоставьте уровень OSI с его функцией:", "pairs": [{"l": "L5 сеансовый", "r": "Сеансы, синхронизация, контрольные точки"}, {"l": "L6 представления", "r": "Кодирование, сжатие, шифрование"}, {"l": "L7 прикладной", "r": "HTTP, FTP, SMTP, DNS"}, {"l": "L3 сетевой", "r": "Маршрутизация, IP"}], "expl": "Верхние уровни OSI: L5 — сеансы, L6 — представление данных, L7 — прикладные протоколы."}, {"type": "match", "topic": "Вопрос 4", "q": "Сопоставьте модель с её характеристикой:", "pairs": [{"l": "OSI", "r": "7 уровней, ISO, нормативная (prescriptive)"}, {"l": "TCP/IP", "r": "4 уровня, DoD, описательная (descriptive)"}, {"l": "Критика OSI", "r": "Поздно вышла, L5/L6 пусты, громоздкая"}, {"l": "Критика TCP/IP", "r": "Не разделяет службу/интерфейс/протокол"}], "expl": "OSI и TCP/IP имеют разные подходы и разные недостатки."}, {"type": "mcq", "topic": "Вопрос 5", "q": "Какое поколение мобильной связи принесло цифровую передачу и SMS?", "opts": ["1G", "2G", "3G", "4G"], "ans": 1, "expl": "2G (GSM) — цифровая связь + SMS. 1G — аналог, 3G — интернет, 4G — широкополосный."}, {"type": "mcq", "topic": "Вопрос 5", "q": "Какой стандарт соответствует 3G?", "opts": ["GSM", "UMTS", "LTE", "WiMAX"], "ans": 1, "expl": "3G — UMTS (интернет). 2G — GSM, 4G — LTE."}, {"type": "mcq", "topic": "Вопрос 5", "q": "Какой метод доступа к среде используется в Wi-Fi 802.11?", "opts": ["CSMA/CD", "CSMA/CA", "TDMA", "FDMA"], "ans": 1, "expl": "Wi-Fi 802.11 использует CSMA/CA (Carrier Sense Multiple Access with Collision Avoidance)."}, {"type": "mcq", "topic": "Вопрос 5", "q": "Какие частоты используются в Wi-Fi 802.11?", "opts": ["900 МГц / 1.8 ГГц / 2.1 ГГц", "2.4 / 5 / 6 ГГц", "1 / 2 / 3 ГГц", "5 / 10 / 15 ГГц"], "ans": 1, "expl": "Wi-Fi 802.11 работает на частотах 2.4, 5 и 6 ГГц."}, {"type": "mcq", "topic": "Вопрос 5", "q": "Что отличает пассивные RFID-метки от активных?", "opts": ["Пассивные работают от батареи, активные — от поля считывателя", "Пассивные питаются от поля считывателя, активные имеют батарею", "Пассивные имеют больший радиус действия", "Разницы нет"], "ans": 1, "expl": "Пассивные RFID-метки питаются от электромагнитного поля считывателя, активные имеют собственную батарею."}, {"type": "mcq", "topic": "Вопрос 5", "q": "Какие технологии используются в сенсорных сетях?", "opts": ["Ethernet и GPON", "Zigbee и LoRaWAN", "WiMAX и DSL", "LTE и 5G"], "ans": 1, "expl": "Сенсорные сети: маломощные узлы + датчики → sink. Технологии: Zigbee, LoRaWAN."}, {"type": "mcq", "topic": "Вопрос 5", "q": "Что такое handover в мобильных сетях?", "opts": ["Установка нового соединения", "Передача абонента между базовыми станциями (сотами)", "Аутентификация пользователя", "Шифрование трафика"], "ans": 1, "expl": "Handover — передача обслуживания мобильного абонента от одной базовой станции к другой при перемещении между сотами."}, {"type": "tf", "topic": "Вопрос 5", "q": "5G характеризуется сверхнизкой задержкой (ultra-low latency).", "ans": true, "expl": "Верно. 5G — сверхнизкая задержка. 4G LTE — широкополосный."}, {"type": "tf", "topic": "Вопрос 5", "q": "1G — это цифровая мобильная связь с поддержкой SMS.", "ans": false, "expl": "Неверно. 1G — аналоговая связь. Цифровая + SMS — это 2G (GSM)."}, {"type": "tf", "topic": "Вопрос 5", "q": "Интернет использует архитектуру TCP/IP и включает access networks, backbone, ISP и IXP.", "ans": true, "expl": "Верно. Интернет: TCP/IP, access networks + backbone, ISP, IXP, ICANN."}, {"type": "tf", "topic": "Вопрос 5", "q": "RFID используется в логистике, системах контроля доступа и торговле.", "ans": true, "expl": "Верно. Применение RFID: логистика, доступ, торговля."}, {"type": "tf", "topic": "Вопрос 5", "q": "В сенсорных сетях данные от датчиков передаются на узел, называемый gateway.", "ans": false, "expl": "Неверно. Данные от датчиков передаются на узел sink (сток), а не gateway."}, {"type": "match", "topic": "Вопрос 5", "q": "Сопоставьте поколение мобильной связи с его характеристикой:", "pairs": [{"l": "1G", "r": "Аналоговая связь"}, {"l": "2G (GSM)", "r": "Цифровая + SMS"}, {"l": "3G (UMTS)", "r": "Мобильный интернет"}, {"l": "4G (LTE)", "r": "Широкополосный доступ"}, {"l": "5G", "r": "Сверхнизкая задержка"}], "expl": "Эволюция мобильных сетей: 1G аналог → 2G GSM цифра → 3G UMTS интернет → 4G LTE широкополосный → 5G сверхнизкая задержка."}, {"type": "match", "topic": "Вопрос 5", "q": "Сопоставьте тип сети с его ключевыми элементами:", "pairs": [{"l": "Интернет", "r": "ISP, IXP, ICANN, backbone"}, {"l": "Мобильная сеть", "r": "Соты (cells), базовые станции, handover"}, {"l": "RFID", "r": "Считыватель + метки (пассивные/активные)"}, {"l": "Сенсорная сеть", "r": "Маломощные узлы, датчики, sink"}], "expl": "Каждый тип сети имеет свою архитектуру и ключевые компоненты."}, {"type": "mcq", "topic": "Вопрос 6", "q": "Какая организация отвечает за стандарты RFC в Интернете?", "opts": ["ISO", "IEEE", "IETF", "ITU"], "ans": 2, "expl": "IETF (Internet Engineering Task Force) разрабатывает стандарты в виде RFC (Request for Comments)."}, {"type": "mcq", "topic": "Вопрос 6", "q": "Какая организация управляет распределением IP-адресов и AS?", "opts": ["IETF", "ICANN/IANA", "W3C", "IEEE"], "ans": 1, "expl": "ICANN → IANA отвечает за IP-адреса, номера автономных систем (AS) и параметры протоколов."}, {"type": "mcq", "topic": "Вопрос 6", "q": "Какой стандарт IEEE соответствует Ethernet?", "opts": ["802.11", "802.3", "802.15", "802.16"], "ans": 1, "expl": "IEEE 802.3 — Ethernet, 802.11 — Wi-Fi, 802.15 — Bluetooth/Zigbee, 802.16 — WiMAX."}, {"type": "mcq", "topic": "Вопрос 6", "q": "Какая организация разрабатывает стандарты HTML, CSS, XML?", "opts": ["IETF", "IEEE", "ISO", "W3C"], "ans": 3, "expl": "W3C (World Wide Web Consortium) разрабатывает стандарты HTML, CSS и XML."}, {"type": "mcq", "topic": "Вопрос 6", "q": "Какие серии стандартов разрабатывает ITU-T?", "opts": ["RFC", "V/X/G/H", "802.x", "ГОСТ Р"], "ans": 1, "expl": "ITU-T разрабатывает стандарты серий V, X, G и H. ITU-R занимается распределением спектра."}, {"type": "mcq", "topic": "Вопрос 6", "q": "Какой стандарт описывает систему управления информационной безопасностью (ISMS)?", "opts": ["NIST FIPS", "ISO 27001/27002", "IEEE 802.3", "ГОСТ Р"], "ans": 1, "expl": "ISO 27001/27002 описывает ISMS (Information Security Management System)."}, {"type": "mcq", "topic": "Вопрос 6", "q": "Что такое СОРМ в контексте российской стандартизации?", "opts": ["Стандарт кодирования данных", "Система оперативно-розыскных мероприятий", "Сертификат сетевого оборудования", "Система оценки рисков в менеджменте"], "ans": 1, "expl": "СОРМ — система оперативно-розыскных мероприятий, часть российского регулирования (наряду с Росстандарт ГОСТ Р и Минцифры)."}, {"type": "tf", "topic": "Вопрос 6", "q": "Ethernet и TCP/IP — примеры де-факто стандартов.", "ans": true, "expl": "Верно. Де-факто стандарты (на практике): Ethernet, TCP/IP. Де-юре (официальные): ISO, ITU."}, {"type": "tf", "topic": "Вопрос 6", "q": "IEEE 802.16 — это стандарт Wi-Fi.", "ans": false, "expl": "Неверно. IEEE 802.16 — это WiMAX. Wi-Fi — это 802.11."}, {"type": "tf", "topic": "Вопрос 6", "q": "IAB (Internet Architecture Board) входит в состав IETF.", "ans": true, "expl": "Верно. IAB находится внутри IETF."}, {"type": "tf", "topic": "Вопрос 6", "q": "ETSI — организация, разработавшая стандарты GSM.", "ans": true, "expl": "Верно. ETSI (European Telecommunications Standards Institute) разработала стандарты GSM."}, {"type": "tf", "topic": "Вопрос 6", "q": "W3C отвечает за распределение IP-адресов.", "ans": false, "expl": "Неверно. За IP-адреса отвечает ICANN/IANA. W3C разрабатывает веб-стандарты: HTML, CSS, XML."}, {"type": "match", "topic": "Вопрос 6", "q": "Сопоставьте стандарт IEEE 802.x с технологией:", "pairs": [{"l": "802.3", "r": "Ethernet"}, {"l": "802.11", "r": "Wi-Fi"}, {"l": "802.15", "r": "Bluetooth / Zigbee"}, {"l": "802.16", "r": "WiMAX"}], "expl": "Семейство IEEE 802: 802.3 Ethernet, 802.11 Wi-Fi, 802.15 WPAN (Bluetooth/Zigbee), 802.16 WiMAX."}, {"type": "match", "topic": "Вопрос 6", "q": "Сопоставьте организацию с её зоной ответственности:", "pairs": [{"l": "IETF", "r": "Стандарты RFC для Интернета"}, {"l": "ICANN / IANA", "r": "IP-адреса, AS, параметры протоколов"}, {"l": "W3C", "r": "HTML, CSS, XML"}, {"l": "ITU-T", "r": "Телеком-стандарты серий V/X/G/H"}], "expl": "Каждая организация отвечает за свою область стандартизации."}, {"type": "match", "topic": "Вопрос 6", "q": "Сопоставьте тип стандартизации с примером:", "pairs": [{"l": "Де-юре", "r": "ISO, ITU"}, {"l": "Де-факто", "r": "Ethernet, TCP/IP"}, {"l": "Безопасность", "r": "ISO 27001/27002 ISMS, NIST FIPS"}, {"l": "Россия", "r": "Росстандарт ГОСТ Р, Минцифры, СОРМ"}], "expl": "Стандарты бывают де-юре (официальные) и де-факто (сложившиеся на практике). Отдельно — безопасность и национальные стандарты."}]}, {"id": 2, "name": "Физический уровень сетевого стека", "questions": [{"n": 7, "title": "Теоретические основы передачи данных. Ряды Фурье. Сигналы с ограниченным спектром. Максимальная скорость передачи данных через канал.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "Любой сигнал, передаваемый по каналу связи, можно описать либо во временной области (зависимостью амплитуды от времени), либо в частотной области (спектром — набором гармонических составляющих). Этот переход между двумя описаниями — основа всей теории передачи данных. Он позволяет связать **физические свойства канала** (полосу пропускания и уровень шума) с **максимальной достижимой скоростью передачи информации**, что формализуется фундаментальными теоремами Найквиста и Шеннона.", "<h3>Ряды Фурье и спектральное представление</h3>", "**Ряд Фурье** (Fourier series) — представление любого периодического сигнала g(t) с периодом T в виде бесконечной суммы синусоид с частотами, кратными фундаментальной f = 1/T:", "g(t) = ½·c + Σ aₙ·sin(2πnft) + Σ bₙ·cos(2πnft).", "- **Фундаментальная (основная) частота** f₁ = 1/T соответствует первой гармонике.\n- **Гармоники** (harmonics) с частотами 2f, 3f, …, nf — высшие составляющие, формирующие точную форму сигнала; чем «острее» переходы, тем больше гармоник нужно для верного восстановления.\n- Для непериодических сигналов используется **преобразование Фурье** (Fourier transform), дающее непрерывный спектр G(f).\n- На приёмнике достаточно знать амплитуды и фазы гармоник, чтобы полностью восстановить исходный сигнал.", "<h3>Сигналы с ограниченным спектром</h3>", "**Сигнал с ограниченным спектром** (band-limited signal) — функция времени, амплитудный спектр которой строго равен нулю за пределами некоторой максимальной частоты F_max, то есть занимает конечную полосу частот [0, F_max] (или [−F_max, F_max] в двустороннем спектре). Эквивалентное определение через преобразование Фурье: G(f) = 0 при |f| > F_max.", "В физической реальности абсолютно ограниченных сигналов не существует — полная локализация в частотной области требует бесконечной длительности во времени (следствие принципа неопределённости Гейзенберга для пары «время–частота»). На практике сигнал называют ограниченным по спектру, если энергия за пределами F_max пренебрежимо мала (например, ниже −40 дБ). Несмотря на эту идеализацию, концепция фундаментальна для радиотехники, обработки аудио и цифровой связи — на ней основаны теорема Котельникова о дискретизации (требует частоту дискретизации ≥ 2F_max), вся теория цифро-аналогового и аналого-цифрового преобразования, а также вычисление пропускной способности по Найквисту и Шеннону.", "Физический канал ведёт себя как фильтр: он пропускает гармоники только в определённом диапазоне частот, называемом **полосой пропускания** (bandwidth, B). Гармоники вне полосы либо сильно ослабляются, либо подавляются полностью. В результате:", "- Резкие фронты прямоугольного импульса «сглаживаются» — высокочастотные гармоники потеряны.\n- При высокой скорости передачи символы «расплываются» во времени, накладываясь на соседние, — возникает **межсимвольная интерференция** (ISI, Inter-Symbol Interference).\n- Чтобы уменьшить ISI, применяют фильтры, формирующие импульс приподнятого косинуса (raised cosine pulse), у которого спектр строго ограничен, а отклики в моменты соседних символов равны нулю.\n- Граничная частота канала по уровню −3 дБ (срез на половине мощности) — практическая мера B.", "<h3>Теорема Найквиста (канал без шума)</h3>", "В 1924 г. **Г. Найквист** (Harry Nyquist) показал, что в идеальном бесшумном канале с полосой B Гц можно передавать максимум **2B символов в секунду** без ISI. Если каждый символ кодирует log₂V бит (V — число различимых уровней сигнала), то максимальная скорость:", "**C = 2B · log₂V (бит/с).**", "- Например, при B = 3000 Гц (полоса телефонного канала) и V = 4 уровнях получаем C = 12 000 бит/с.\n- Удвоение числа уровней V даёт лишь линейный прирост — нельзя бесконечно увеличивать V, не наталкиваясь на шум.", "<h3>Теорема Шеннона (канал с шумом)</h3>", "**К. Шеннон** (Claude Shannon, 1948) обобщил результат на реальные каналы с **аддитивным белым гауссовским шумом** (AWGN). Пропускная способность зависит не только от полосы, но и от **отношения сигнал/шум** (SNR, Signal-to-Noise Ratio):", "**C = B · log₂(1 + S/N) (бит/с),**", "где S — мощность сигнала, N — мощность шума. SNR обычно выражают в децибелах: SNR(дБ) = 10·log₁₀(S/N).", "- Пример: телефонный канал B = 3 кГц, SNR = 30 дБ (=1000) → C ≈ 3000·log₂(1001) ≈ **30 кбит/с**. Именно этим пределом ограничены модемы V.34.\n- При SNR = 0 дБ (S = N) пропускная способность падает до B бит/с.\n- Шеннон задаёт **теоретический предел**, превзойти его не может никакая схема кодирования; современные коды (LDPC, турбокоды) приближаются к нему на сотые доли децибела.", "<h3>Сравнение Найквиста и Шеннона</h3>", "| Теорема | Канал | Формула | Что ограничивает |\n|---|---|---|---|\n| Найквист | идеальный, без шума | C = 2B·log₂V | число различимых уровней V (амплитуд) |\n| Шеннон | реальный, AWGN | C = B·log₂(1+S/N) | мощность шума N |", "На практике скорость определяется **меньшим** из двух пределов; обычно реальные системы упираются именно в шенноновский потолок."], "terms": [{"ru": "Ряд Фурье", "en": "Fourier series", "df": "разложение периодического сигнала в сумму синусоид кратных частот"}, {"ru": "Преобразование Фурье", "en": "Fourier transform", "df": "обобщение ряда Фурье на непериодические сигналы"}, {"ru": "Гармоника", "en": "harmonic", "df": "составляющая ряда Фурье с частотой, кратной фундаментальной"}, {"ru": "Фундаментальная частота", "en": "fundamental frequency", "df": "частота первой гармоники f = 1/T"}, {"ru": "Полоса пропускания", "en": "bandwidth", "df": "диапазон частот, передаваемых каналом с допустимым затуханием (в Гц); в контексте сетей также используется как синоним скорости передачи данных (бит/с)"}, {"ru": "Сигнал с ограниченным спектром", "en": "band-limited signal", "df": "сигнал, амплитудный спектр которого равен нулю за пределами максимальной частоты F_max; идеализация, лежащая в основе теоремы дискретизации и формул Найквиста/Шеннона"}, {"ru": "Теорема Найквиста", "en": "Nyquist theorem", "df": "максимальная скорость передачи по идеальному каналу: C = 2B log₂V"}, {"ru": "Теорема Шеннона", "en": "Shannon's theorem", "df": "теоретический предел скорости передачи по зашумлённому каналу: C = B log₂(1 + SNR)"}, {"ru": "SNR", "en": "Signal-to-Noise Ratio", "df": "отношение мощности полезного сигнала к мощности шума, измеряется в дБ"}, {"ru": "AWGN", "en": "Additive White Gaussian Noise", "df": "модель канала с аддитивным белым гауссовским шумом"}, {"ru": "Пропускная способность", "en": "channel capacity", "df": "максимальная скорость безошибочной передачи данных по каналу"}, {"ru": "Межсимвольная интерференция", "en": "ISI, Inter-Symbol Interference", "df": "искажение символов из-за наложения переходных процессов от соседних символов"}], "summary": ["Сигнал описывается во временной (g(t)) и частотной (G(f)) областях — переход через Фурье", "**Ряд Фурье**: g(t) = ½c + Σ aₙ sin(2πnft) + Σ bₙ cos(2πnft); сумма синусоид с частотами кратными f=1/T", "**Фундаментальная частота** f₁ = 1/T (первая гармоника); **гармоники** nf — высшие составляющие", "**Преобразование Фурье** — обобщение для непериодических сигналов (непрерывный спектр)", "**Сигнал с ограниченным спектром** (band-limited): G(f) = 0 при |f| > F_max", "Абсолютно ограниченных не существует (принцип неопределённости); практически — энергия вне F_max < −40 дБ", "Канал = фильтр с **полосой пропускания** B (Гц); граница по уровню −3 дБ", "Резкие фронты сглаживаются (теряются ВЧ-гармоники) → **межсимвольная интерференция (ISI)** — наложение соседних символов", "Снижение ISI: фильтр приподнятого косинуса (raised cosine) — нули в моменты соседних символов", "**Теорема Найквиста** (1924, идеальный канал без шума): максимум **2B символов/с**", "Формула Найквиста: **C = 2B · log₂V** (бит/с), V — число различимых уровней", "Пример: B=3 кГц, V=4 → C=12 кбит/с; рост V — лишь линейный прирост, упор в шум", "**Теорема Шеннона** (1948) для канала с **AWGN** (аддитивный белый гауссовский шум)", "Формула Шеннона: **C = B · log₂(1 + S/N)** (бит/с); SNR(дБ)=10·log₁₀(S/N)", "Пример: B=3 кГц, SNR=30 дБ → C≈30 кбит/с (предел модемов V.34)", "Шеннон — непревышаемый теоретический предел; LDPC и турбокоды подходят на сотые дБ", "Найквист ограничивает V (амплитуды); Шеннон ограничивает мощностью шума; реальный канал упирается в Шеннона"]}, {"n": 8, "title": "Проводниковые среды передачи информации: магнитные носители, витая пара, коаксиальный кабель, линии электропитания, волоконная оптика.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Проводниковая (направляющая) среда передачи** (guided medium) — физический канал, по которому сигнал распространяется внутри материальной среды: электромагнитной волной в металлическом проводнике или световой волной в оптическом волокне. От выбора среды зависят полоса пропускания, дальность без ретрансляторов, помехоустойчивость и стоимость прокладки.", "<h3>Магнитные носители</h3>", "**Магнитные носители** (magnetic media) — нетривиальный, но иногда оптимальный «канал»: данные записывают на ленты/диски и физически доставляют адресату курьером. Для больших объёмов пропускная способность «грузовика, гружёного дисками» (sneakernet) превосходит любую сеть: 1000 жёстких дисков по 18 ТБ, доставленных за 24 ч, дают эффективную скорость ≈ **1,7 Тбит/с** при околонулевой стоимости бита. Так перемещают петабайты при загрузке данных в облачные сервисы (AWS Snowmobile, Azure Data Box).", "<h3>Витая пара</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/0/0e/Optical_fiber_types.svg\" alt=\"Типы оптических волокон: одномодовое и многомодовое (step-index и graded-index)\" loading=\"lazy\"><figcaption>Сравнение профилей показателя преломления и распространения лучей в одномодовом и многомодовом (step-index/graded-index) волокнах. <em>Источник: Wikimedia Commons, CC BY-SA 3.0.</em></figcaption></figure>", "**Витая пара** (twisted pair) — два изолированных медных провода, скрученных в спираль. Скрутка минимизирует наводки: внешнее магнитное поле возбуждает противофазные ЭДС в соседних витках, и они взаимно компенсируются. Это самая массовая среда для LAN и телефонных абонентских линий.", "- **UTP** (Unshielded Twisted Pair) — без экрана; категории **Cat3** (10 Мбит/с, телефония), **Cat5e** (1 Гбит/с до 100 м), **Cat6/6a** (10 Гбит/с до 55/100 м), **Cat7/8** (40 Гбит/с в дата-центрах).\n- **STP / FTP / S/FTP** — экранированные варианты для электромагнитно-зашумлённых сред.\n- Стандартный разъём — **RJ-45**, разводка по схемам **T568A/T568B**.\n- Главный паразитный эффект — **перекрёстные наводки** (crosstalk): **NEXT** (Near-End) и **FEXT** (Far-End).", "<h3>Коаксиальный кабель</h3>", "**Коаксиальный кабель** (coaxial cable) — центральный медный проводник, окружённый изолятором, экраном-оплёткой и внешней оболочкой. За счёт замкнутого экрана имеет лучшую помехозащищённость, чем UTP, и полосу в сотни МГц.", "- **50-омный** — Ethernet 10BASE5 «Yellow Cable» и 10BASE2 «Thin Ethernet» (исторически).\n- **75-омный** — кабельное ТВ и **DOCSIS** (Data Over Cable Service Interface Specification): современный DOCSIS 3.1 даёт до 10 Гбит/с downstream по существующей кабельной инфраструктуре.", "<h3>Линии электропитания (PLC)</h3>", "**PLC** (Power Line Communication) — наложение высокочастотного сигнала данных поверх сетевого напряжения 50/60 Гц. Бытовые стандарты **HomePlug AV2**, **G.hn** дают 1–2 Гбит/с по обычной электропроводке квартиры. Минусы: высокий уровень шумов от двигателей и блоков питания, регуляторные ограничения на электромагнитное излучение проводки.", "<h3>Волоконная оптика</h3>", "**Оптическое волокно** (optical fiber) — тонкая стеклянная нить из кварца, по которой свет распространяется за счёт **полного внутреннего отражения** от границы сердечника (core) и оболочки (cladding) с меньшим показателем преломления. Сегодня — основа всех магистральных и большинства абонентских (FTTH) сетей.", "Типы волокон:\n- **Одномодовое (SMF, Single-Mode Fiber)** — узкий сердечник (диаметр 8–10 мкм); распространяется одна основная мода. Лазерный источник 1310/1550 нм, дальность десятки–сотни км без ретранслятора, скорости 10–800 Гбит/с на канал, до **десятков Тбит/с** при **WDM** (Wavelength Division Multiplexing).\n- **Многомодовое (MMF, Multimode Fiber)** — широкий сердечник (50/62,5 мкм); одновременно распространяется множество мод, которые приходят с разной задержкой → **модовая дисперсия**. Светодиод/VCSEL 850 нм, дальность до сотен метров, дешевле, используется в дата-центрах (OM3/OM4/OM5).", "Источники света: **светодиод** (LED) для MMF и **полупроводниковый лазер** (VCSEL, DFB) для SMF. Приёмники — **PIN-фотодиоды** или **лавинные фотодиоды** (APD). Усиление без преобразования в электричество — **EDFA** (Erbium-Doped Fiber Amplifier).", "Преимущества оптики:\n- Огромная полоса пропускания — десятки ТГц на одно волокно.\n- Малое затухание (~0,2 дБ/км на 1550 нм) → длинные пролёты.\n- Нечувствительность к электромагнитным помехам и грозам.\n- Безопасность: отвод оптического сигнала сложно осуществить незаметно.\n- Малый вес и низкая стоимость материала (кварц = песок).", "Недостатки: хрупкость, дорогие сварные соединения, односторонняя передача (нужно две жилы для дуплекса либо WDM)."], "terms": [{"ru": "Витая пара", "en": "twisted pair", "df": "кабель из попарно скрученных проводников; основная среда для Ethernet"}, {"ru": "UTP / STP / FTP", "en": "Unshielded/Shielded/Foiled Twisted Pair", "df": "неэкранированная и экранированные витые пары"}, {"ru": "Перекрёстные наводки", "en": "crosstalk, NEXT/FEXT", "df": "паразитный перенос сигнала между соседними проводниками"}, {"ru": "Коаксиальный кабель", "en": "coaxial cable", "df": "кабель с центральным проводником и экранирующей оплёткой"}, {"ru": "DOCSIS", "en": "Data Over Cable Service Interface Specification", "df": "стандарт широкополосного Интернета по коаксиальному кабелю"}, {"ru": "PLC", "en": "Power Line Communication", "df": "передача данных по электрической сети, стандарты HomePlug AV2, G.hn"}, {"ru": "Оптическое волокно", "en": "optical fiber", "df": "стеклянная нить, передающая свет за счёт полного внутреннего отражения"}, {"ru": "Одномодовое волокно", "en": "single-mode fiber, SMF", "df": "волокно с узким сердечником (8–10 мкм), для дальних расстояний"}, {"ru": "Многомодовое волокно", "en": "multimode fiber, MMF", "df": "волокно с широким сердечником (50/62,5 мкм) для коротких расстояний"}, {"ru": "Полное внутреннее отражение", "en": "total internal reflection", "df": "принцип удержания света в сердечнике волокна"}, {"ru": "Дисперсия", "en": "dispersion", "df": "уширение оптического импульса (модовая, хроматическая, поляризационная)"}, {"ru": "WDM / DWDM", "en": "Wavelength Division Multiplexing", "df": "мультиплексирование по длинам волн, десятки каналов в одном волокне"}, {"ru": "EDFA", "en": "Erbium-Doped Fiber Amplifier", "df": "оптический усилитель на эрбиевом волокне"}, {"ru": "Затухание", "en": "attenuation", "df": "уменьшение мощности сигнала по мере его распространения по среде"}, {"ru": "FTTH", "en": "Fiber to the Home", "df": "доведение оптики до квартиры абонента"}], "summary": ["**Проводниковая среда** (guided medium) — сигнал распространяется внутри материала (металл/стекло)", "**Магнитные носители** — sneakernet: грузовик с дисками может дать ~1,7 Тбит/с (AWS Snowmobile, Azure Data Box)", "**Витая пара** (twisted pair): два изолированных медных провода скручены; скрутка компенсирует наводки", "**UTP** категории: Cat3 (10 Мбит/с, телефон), **Cat5e** (1 Гбит/с до 100 м), **Cat6/6a** (10 Гбит/с 55/100 м), Cat7/8 (40 Гбит/с)", "STP/FTP/S/FTP — экранированные; разъём **RJ-45**, разводка T568A/B; паразиты — **NEXT**/**FEXT** (crosstalk)", "**Коаксиальный кабель**: центр + изолятор + экран + оболочка; помехоустойчивость лучше UTP", "50 Ом — Ethernet 10BASE5/10BASE2; 75 Ом — кабельное ТВ и **DOCSIS 3.1** (до 10 Гбит/с downstream)", "**PLC** (Power Line Communication) — данные поверх 50/60 Гц; HomePlug AV2, G.hn до 1–2 Гбит/с, высокий шум", "**Оптоволокно**: свет в кварцевой нити, **полное внутреннее отражение** от границы core/cladding", "**SMF** (одномод, диаметр 8–10 мкм): лазер 1310/1550 нм, десятки–сотни км, 10–800 Гбит/с/канал, **WDM** — десятки Тбит/с", "**MMF** (многомод, 50/62,5 мкм): VCSEL/LED 850 нм, сотни метров; **модовая дисперсия** ограничивает дальность; OM3/OM4/OM5 в ДЦ", "Источники: LED (MMF), VCSEL/DFB-лазер (SMF); приёмники PIN и **APD**; усилители **EDFA** (без оптоэлектронного преобразования)", "Затухание SMF ~0,2 дБ/км на 1550 нм; нечувствительность к EMI и грозам", "Преимущества оптики: ТГц полоса, малое затухание, помехозащищённость, безопасность от прослушки, лёгкость", "Недостатки: хрупкость, дорогие сварки, для дуплекса нужны две жилы или WDM", "**Дисперсия**: модовая (MMF), хроматическая и поляризационная (SMF) — уширение импульса", "**FTTH** (Fiber to the Home) — оптика до квартиры абонента"]}, {"n": 9, "title": "Беспроводная связь: электромагнитный спектр, радиосвязь, микроволновый диапазон, инфракрасный диапазон, видимый диапазон.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Беспроводная связь** (wireless communication) — передача информации без направляющей среды, через **электромагнитные волны**, распространяющиеся в свободном пространстве. Информацию переносит модулированная **несущая волна**, занимающая часть **электромагнитного спектра** — непрерывного диапазона частот от единиц Гц до экзагерц. Выбор диапазона определяет дальность, ширину полосы, проникающую способность через препятствия и регуляторные ограничения.", "<h3>Электромагнитный спектр</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/c/cf/EM_Spectrum_Properties_edit.svg\" alt=\"Электромагнитный спектр с указанием диапазонов, длин волн и частот\" loading=\"lazy\"><figcaption>Электромагнитный спектр: радиоволны → микроволны → инфракрасное → видимое → ультрафиолет → рентген → гамма. Связь использует частоты примерно от 10 кГц до 300 ГГц (радио и микроволны) и оптические окна. <em>Источник: Wikimedia Commons, CC BY-SA 3.0.</em></figcaption></figure>", "Между частотой f, длиной волны λ и скоростью света c действует соотношение **c = f · λ**. Полоса частот определяет максимальную информационную ёмкость (теорема Шеннона), но в спектре существуют **«окна прозрачности»** — диапазоны с малым поглощением атмосферой и **«линии поглощения»** (например, кислород на 60 ГГц, водяной пар на 22 ГГц), где связь практически невозможна.", "Регулирование спектра: распределение частот между службами и странами координирует **МСЭ** (ITU-R) на Всемирных конференциях радиосвязи (WRC). Существуют **лицензируемые** полосы (сотовая связь, ТВ) и **безлицензионные** **ISM-диапазоны** (Industrial, Scientific, Medical: 2,4 ГГц, 5 ГГц, 900 МГц) и **U-NII** (5 ГГц, 6 ГГц).", "<h3>Радиосвязь (3 кГц – 300 МГц)</h3>", "- **VLF/LF** (3–300 кГц) — длинные волны, огибают Землю, применяются для подводной связи (Omega) и стандартов времени.\n- **MF** (300 кГц – 3 МГц) — средние волны, AM-радиовещание; распространение поверхностной волной до сотен км днём.\n- **HF** (3–30 МГц) — короткие волны, **отражаются от ионосферы** (D, E, F-слои), что обеспечивает связь на тысячи километров без ретрансляторов. Используются для радиолюбительской связи, морской и авиационной связи через океаны.\n- **VHF** (30–300 МГц) — FM-радиовещание (88–108 МГц), аналоговое и цифровое ТВ, авиадиспетчерская связь.", "Радиоволны хорошо проникают через стены, всенаправлены, но широковещательны → подвержены интерференции и перехвату.", "<h3>Микроволновый диапазон (300 МГц – 300 ГГц)</h3>", "- **UHF** (300 МГц – 3 ГГц) — сотовая связь (700/800/900/1800/2100 МГц), GPS (1,575 ГГц), Wi-Fi 2,4 ГГц, DECT.\n- **SHF** (3–30 ГГц) — Wi-Fi 5/6 ГГц, спутниковая связь C/Ku/Ka-диапазонов, радиорелейные линии, радар.\n- **EHF** (30–300 ГГц, «миллиметровые волны») — 5G NR FR2 (24–52 ГГц), 802.11ad/ay (60 ГГц, WiGig), автомобильный радар (77 ГГц).", "Особенности:\n- Распространение **только в прямой видимости** (LOS, Line-of-Sight) — для дальней связи нужны направленные **параболические антенны** (КПД 50–70%, узкая диаграмма).\n- Сильное поглощение влагой → деградация в дождь (rain fade) на Ka-диапазоне и mmWave.\n- Огромная полоса → высокие скорости (десятки Гбит/с в mmWave).", "<h3>Инфракрасный диапазон (300 ГГц – 400 ТГц)</h3>", "**ИК-излучение** не проникает через непрозрачные предметы и стёкла, что даёт **естественную изоляцию между помещениями**. Применения:\n- Пульты дистанционного управления (около 38 кГц промодулированная несущая ~940 нм).\n- **IrDA** (Infrared Data Association) — устаревший стандарт для PDA и принтеров.\n- Дальняя связь между зданиями по узкому ИК-лучу (FSO, см. ниже).", "<h3>Видимый диапазон (400–790 ТГц, длины волн 380–750 нм)</h3>", "Видимый свет занимает узкую «октаву» спектра между ИК и УФ: от красного (≈400 ТГц, 750 нм) до фиолетового (≈790 ТГц, 380 нм). Колоссальная полоса (сотни ТГц) делает его привлекательным для связи, но распространение строго в прямой видимости и при отсутствии преград.", "- **Li-Fi** (Light Fidelity) — модуляция светодиодного освещения помещений; скорости до 10 Гбит/с в лабораторных условиях.\n- **FSO** (Free Space Optics) — лазерные линии связи «здание–здание»: до 10 Гбит/с на расстояниях до нескольких километров; полностью свободны от радиолицензирования, но чувствительны к туману и качанию опор.\n- **Лазерная межспутниковая связь** — Starlink V2, LCRD: десятки Гбит/с между спутниками LEO.\n- **Волоконно-оптическая связь** использует ближний ИК и видимый диапазон (850 нм, 1310 нм, 1550 нм) — это уже направляющая среда.", "<h3>Ультрафиолет, рентген и гамма-излучение — почему не используются для связи</h3>", "Выше видимого диапазона электромагнитное излучение становится **ионизирующим**: фотоны имеют достаточно энергии (>3 эВ), чтобы выбивать электроны из атомов, повреждая живые ткани и материалы. Это делает его непригодным для массовой связи. Для полноты картины:", "- **Ультрафиолет** (UV, 790 ТГц – 30 ПГц, длины волн 10–380 нм) — почти полностью поглощается атмосферой (озоновый слой). Применяется для бактерицидной обработки, лито­графии, спектроскопии. В связи — экспериментальные **NLOS UV-каналы** в «солнечно-слепой» полосе (200–280 нм), где фоновое излучение Солнца поглощается атмосферой и не мешает приёму.\n- **Рентгеновское излучение** (X-rays, 30 ПГц – 30 ЭГц, длины волн 0,01–10 нм) — медицина (рентгенография, КТ), материаловедение (рентгеновская дифракция), астрономия. Для связи практически непригодно: трудно генерировать управляемо, требует тяжёлой защиты, ионизирует материалы. Экспериментально NASA в 2019 г. демонстрировала **XCOM** — рентгеновскую связь со спутником через космос (через ионосферу радиоволны затухают, а рентген проходит).\n- **Гамма-излучение** (gamma rays, >30 ЭГц, длины волн <0,01 нм) — испускается ядерными процессами. Используется в стерилизации, лучевой терапии, исследовании ядер. Для связи неприменимо: рассеивается материей, ионизирует, и направленная модуляция технически крайне сложна.", "Энергия фотона E = hf растёт линейно с частотой, поэтому при переходе от радио (~10⁻⁶ эВ) к гамма (~10⁶ эВ) меняется фундаментальный режим взаимодействия с веществом — от нагрева к ионизации.", "<h3>Ключевые эффекты беспроводного канала</h3>", "- **Затухание** в свободном пространстве: мощность убывает как 1/r² (обратный квадрат расстояния).\n- **Многолучевое распространение** (multipath): сигнал приходит несколькими путями → замирания и ISI; борьба — OFDM, эквалайзеры, MIMO.\n- **Доплеровский сдвиг** для движущихся приёмников.\n- **Затухание в атмосфере**: дождь, туман, газы."], "terms": [{"ru": "Электромагнитный спектр", "en": "electromagnetic spectrum", "df": "весь диапазон частот электромагнитного излучения"}, {"ru": "Несущая волна", "en": "carrier wave", "df": "гармонический сигнал, на котором модулируется информация"}, {"ru": "Длина волны", "en": "wavelength, λ", "df": "пространственный период волны; λ = c/f"}, {"ru": "Прямая видимость", "en": "line-of-sight, LOS", "df": "условие распространения сигнала без препятствий между передатчиком и приёмником"}, {"ru": "Ионосфера", "en": "ionosphere", "df": "слой атмосферы 60–1000 км, отражающий коротковолновые радиосигналы"}, {"ru": "ISM-диапазон", "en": "Industrial, Scientific, Medical", "df": "безлицензионные полосы для Wi-Fi, Bluetooth"}, {"ru": "Миллиметровые волны", "en": "mmWave", "df": "30–300 ГГц; используются в 5G NR FR2, 802.11ad"}, {"ru": "Микроволновый диапазон", "en": "microwave band", "df": "диапазон частот 1–300 ГГц; используется в Wi-Fi, спутниковой и мобильной связи"}, {"ru": "IrDA", "en": "Infrared Data Association", "df": "стандарт беспроводной передачи данных в инфракрасном диапазоне"}, {"ru": "Видимый диапазон", "en": "visible light", "df": "узкая полоса 380–750 нм (400–790 ТГц); используется в Li-Fi, FSO, оптоволокне"}, {"ru": "Ультрафиолет", "en": "ultraviolet, UV", "df": "10–380 нм; ионизирующее излучение; для связи — экспериментальные NLOS UV-каналы в солнечно-слепой полосе 200–280 нм"}, {"ru": "Рентгеновское излучение", "en": "X-rays", "df": "длины волн 0,01–10 нм; в связи практически не используется (демонстрация NASA XCOM)"}, {"ru": "Гамма-излучение", "en": "gamma rays", "df": "длины волн <0,01 нм; для связи неприменимо"}, {"ru": "Ионизирующее излучение", "en": "ionizing radiation", "df": "излучение с энергией фотонов выше ~3 эВ, способное выбивать электроны из атомов"}, {"ru": "Li-Fi", "en": "Light Fidelity", "df": "технология беспроводной передачи данных с использованием видимого света"}, {"ru": "FSO", "en": "Free Space Optics", "df": "оптическая беспроводная связь через открытое пространство (лазерный луч)"}, {"ru": "Затухание в атмосфере", "en": "atmospheric attenuation", "df": "поглощение радиосигнала атмосферными газами и осадками"}, {"ru": "Многолучевое распространение", "en": "multipath propagation", "df": "приход сигнала по нескольким путям, причина замираний"}, {"ru": "ITU-R", "en": "International Telecommunication Union, Radio sector", "df": "орган, координирующий распределение радиочастот"}], "summary": ["**Беспроводная связь** — передача через ЭМ-волны без направляющей среды; информацию несёт модулированная **несущая**", "c = f·λ; полоса определяет шенноновскую ёмкость; **окна прозрачности** vs линии поглощения (O₂ на 60 ГГц, H₂O на 22 ГГц)", "**ITU-R** через WRC координирует распределение спектра; **лицензируемые** (сотовая, ТВ) vs **ISM** (2,4/5 ГГц) и U-NII (5/6 ГГц)", "**VLF/LF** (3–300 кГц) — подводная связь, эталоны времени; **MF** (0,3–3 МГц) — AM-радио, поверхностная волна", "**HF** (3–30 МГц) — короткие, **отражение от ионосферы** (слои D/E/F), тысячи км без ретрансляторов (радиолюбители, морская/авиа)", "**VHF** (30–300 МГц) — FM (88–108 МГц), ТВ, авиадиспетчер; радио проникает через стены, но широковещательное", "**UHF** (0,3–3 ГГц) — сотовая (700–2100 МГц), GPS (1,575 ГГц), Wi-Fi 2,4 ГГц, DECT", "**SHF** (3–30 ГГц) — Wi-Fi 5/6 ГГц, спутники C/Ku/Ka, радиорелейка, радар", "**EHF / mmWave** (30–300 ГГц) — 5G FR2 (24–52 ГГц), 802.11ad/ay (60 ГГц, WiGig), автомобильный радар 77 ГГц", "Микроволны: **LOS** (прямая видимость), параболические антенны, поглощение в дождь (rain fade на Ka/mmWave)", "**Инфракрасный** (0,3–400 ТГц): не проникает через стёкла → естественная изоляция; пульты ~940 нм/38 кГц, **IrDA**, FSO", "**Видимый** (400–790 ТГц, 380–750 нм): **Li-Fi** (модуляция LED, до 10 Гбит/с), **FSO** (лазер, до неск. км), межспутниковые лазерные ISL", "**UV/рентген/гамма** — ионизирующие (E>3 эВ), не используются для связи; экспериментально NLOS UV в солнечно-слепой полосе 200–280 нм, NASA XCOM (рентген со спутника)", "Эффекты канала: затухание 1/r² в свободном пространстве; **multipath** → замирания + ISI → OFDM, MIMO, эквалайзеры", "**Доплеровский сдвиг** для движущихся; атмосферное затухание (дождь, туман, газы)"]}, {"n": 10, "title": "Спутниковая связь. Классификация спутников: геостационарные, средневысотные, низкоорбитальные. Спутники и оптоволокно.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Спутниковая связь** (satellite communication) — радиосвязь между двумя или более наземными точками через активный или пассивный **ретранслятор** (repeater) на околоземной орбите. Наземная станция отправляет сигнал по **восходящей линии** (uplink), спутник принимает его, усиливает, преобразует несущую частоту и ретранслирует обратно по **нисходящей линии** (downlink). Современные спутники несут несколько **транспондеров** (transponders) — независимых приёмо-передающих трактов, каждый со своей полосой (типично 36 МГц для классической C-полосы), а наиболее продвинутые аппараты имеют **бортовые процессоры обработки сигнала** (on-board processing) и **межспутниковые лазерные линии связи** (МСЛ, Inter-Satellite Link, ISL).", "<h3>Классификация по высоте орбиты</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/b/b4/Comparison_satellite_navigation_orbits.svg\" alt=\"Сравнение спутниковых орбит: НОО, СОО, ГСО\" loading=\"lazy\"><figcaption>Сравнение основных орбит в масштабе: НОО (МКС, Iridium, Starlink), СОО (GPS, ГЛОНАСС, Galileo), ГСО (геостационарные спутники связи и вещания). <em>Источник: Wikimedia Commons, cmglee, CC BY-SA 3.0.</em></figcaption></figure>", "- **Геостационарная орбита** (ГСО, GEO, Geostationary Earth Orbit) — высота **35 786 км** над экватором. Период обращения 24 ч, спутник «висит» неподвижно относительно Земли. Один аппарат покрывает ≈1/3 поверхности планеты; три равноотстоящих геостационарных спутника дают почти глобальное покрытие (кроме приполярных областей). **Задержка распространения** (propagation delay) туда-обратно ≈ 270 мс — критический минус для интерактивных приложений (IP-телефония, игры). Используется для **спутникового телевещания** (DTH, Direct-to-Home), малых земных станций (VSAT), морской и авиационной связи (Inmarsat). Полосы: C (4/6 ГГц), Ku (12/14 ГГц), Ka (20/30 ГГц).\n- **Средневысотная орбита** (СОО, MEO, Medium Earth Orbit) — 2 000–20 000 км, периоды обращения 2–12 ч. Задержка 35–85 мс, зона покрытия одного аппарата шире, чем у низкой орбиты. Главное применение — **глобальные навигационные системы** (ГНСС, GNSS, Global Navigation Satellite Systems): GPS (≈20 200 км), ГЛОНАСС (≈19 100 км), Galileo (≈23 200 км), BeiDou. Также интернет-операторы O3b mPOWER (8 062 км).\n- **Низкая околоземная орбита** (НОО, LEO, Low Earth Orbit) — 160–2 000 км, период обращения ≈ 90–120 мин. Малая задержка (5–20 мс) и низкая требуемая мощность передатчика, но каждый аппарат виден из конкретной точки на Земле всего 5–15 минут → необходимы **группировки спутников** (созвездия, constellations) из сотен и тысяч аппаратов и непрерывная **эстафетная передача** (хэндовер, handover) между ними. Примеры: **Starlink** (>6 000 аппаратов), **OneWeb** (~650), **Iridium NEXT** (66 рабочих + резервные), **Kuiper** (Amazon, в развёртывании).", "<h3>Распределение спектра и частотные диапазоны</h3>", "| Диапазон | Полоса (ГГц) | Применение | Особенности |\n|---|---|---|---|\n| L | 1–2 | Inmarsat, GPS, спутниковое радио | малая полоса, проникает через листву |\n| C | 4/6 | классическая ГСО, ТВ | устойчив к дождю |\n| X | 7/8 | военные системы | защищённый |\n| Ku | 12/14 | спутниковое ТВ (DTH), VSAT | страдает от **дождевого ослабления** (rain fade) |\n| Ka | 20/30 | широкополосный доступ (Viasat) | большая полоса, сильное затухание в дождь |", "<h3>Спутники и оптоволокно</h3>", "- **Оптоволокно** (optical fiber) обеспечивает на много порядков большую пропускную способность (десятки Тбит/с на волокно) при задержке, ограниченной только скоростью света в стекле (≈5 мс на 1000 км). Доминирует на магистралях и там, где кабель уже проложен.\n- **Спутниковые каналы** незаменимы там, где прокладка кабеля экономически не оправдана или невозможна: морские и воздушные суда, удалённые посёлки, научные экспедиции, экстренная связь при разрушении наземной инфраструктуры. Себестоимость передачи бита через геостационарный спутник исторически была существенно выше, чем по оптике, но низкоорбитальные группировки эту разницу радикально сократили.\n- **Гибридные схемы**: магистральные операторы используют спутниковые каналы как резерв подводных кабелей.", "<h3>Дополнительные технические аспекты</h3>", "- **Передающая мощность** (transmit power) ограничена солнечными батареями (десятки кВт у крупных геостационарных аппаратов).\n- **Антенны**: на спутнике — **фазированные антенные решётки** (phased arrays) с электронным управлением лучом (**формирование диаграммы направленности**, beamforming); на земле — параболические зеркальные антенны для геостационарных спутников, плоские антенны с фазированной решёткой для низкоорбитальных группировок (абонентские терминалы Starlink).\n- **Стратосферные платформы связи** (HAPS, High-Altitude Platform Station) — самолёты или дирижабли на высоте ≈20 км, выполняющие роль «псевдо-спутников» (проект Google Loon, альянс HAPS).\n- **Регуляторика**: распределение частот и орбитальных позиций ГСО координирует **МСЭ** (Международный союз электросвязи, ITU); орбитальные позиции на геостационарной дуге — ограниченный международный ресурс."], "terms": [{"ru": "Спутниковая связь", "en": "satellite communication", "df": "радиосвязь между наземными точками через ретранслятор на околоземной орбите"}, {"ru": "Геостационарная орбита", "en": "ГСО, GEO, Geostationary Earth Orbit", "df": "круговая экваториальная орбита высотой 35 786 км; спутник неподвижен относительно земной поверхности"}, {"ru": "Средневысотная орбита", "en": "СОО, MEO, Medium Earth Orbit", "df": "орбита высотой 2 000–20 000 км; используется глобальными навигационными системами"}, {"ru": "Низкая околоземная орбита", "en": "НОО, LEO, Low Earth Orbit", "df": "орбита высотой 160–2 000 км; малая задержка, требует группировки из многих аппаратов"}, {"ru": "Транспондер", "en": "transponder", "df": "приёмо-передающий тракт спутника с собственной полосой частот (типично 36 МГц)"}, {"ru": "Восходящая линия", "en": "uplink", "df": "канал передачи от наземной станции к спутнику"}, {"ru": "Нисходящая линия", "en": "downlink", "df": "канал передачи от спутника к наземной станции"}, {"ru": "Задержка распространения", "en": "propagation delay", "df": "время прохождения сигнала от источника до приёмника; для ГСО RTT ≈ 270 мс"}, {"ru": "Малая земная станция", "en": "VSAT, Very Small Aperture Terminal", "df": "наземная антенна с малым диаметром (≤2,4 м) для двустороннего спутникового доступа"}, {"ru": "Группировка спутников", "en": "созвездие, satellite constellation", "df": "совокупность спутников, обеспечивающих совместное глобальное или зональное покрытие"}, {"ru": "Эстафетная передача", "en": "хэндовер, handover", "df": "переключение абонента между спутниками при их движении по орбите"}, {"ru": "Спутниковое телевещание", "en": "DTH, Direct-to-Home", "df": "прямое вещание со спутника на абонентские параболические антенны"}, {"ru": "Глобальная навигационная спутниковая система", "en": "ГНСС, GNSS", "df": "система определения координат: GPS, ГЛОНАСС, Galileo, BeiDou"}, {"ru": "Межспутниковая линия связи", "en": "МСЛ, ISL, Inter-Satellite Link", "df": "линия связи между двумя спутниками, обычно лазерная"}, {"ru": "Дождевое ослабление", "en": "rain fade", "df": "деградация Ku/Ka-сигнала из-за поглощения водяными каплями"}, {"ru": "Стратосферная платформа связи", "en": "HAPS, High-Altitude Platform Station", "df": "летательный аппарат на высоте ≈20 км, играющий роль «псевдо-спутника»"}, {"ru": "Фазированная антенная решётка", "en": "phased array antenna", "df": "антенна с электронным управлением направлением луча без механического поворота"}], "summary": ["**Спутниковая связь** — радиосвязь между точками через ретранслятор на орбите; **uplink** ↑ + **downlink** ↓", "Несколько **транспондеров** (тип. 36 МГц в C-полосе); современные — on-board processing и лазерные **МСЛ/ISL**", "**GEO** (35 786 км, экватор, T=24 ч): «висит», 1/3 Земли с одного, 3 спутника — почти глобально (кроме полюсов)", "GEO задержка RTT ≈ **270 мс** → плохо для интерактива; применение: DTH-ТВ, **VSAT**, Inmarsat", "**MEO** (2 000–20 000 км): RTT 35–85 мс; **ГНСС**: GPS (20 200), ГЛОНАСС (19 100), Galileo (23 200), BeiDou; O3b mPOWER", "**LEO** (160–2 000 км, T≈90–120 мин): RTT 5–20 мс, низкая мощность, виден 5–15 мин → нужны созвездия и **хэндовер**", "LEO примеры: **Starlink** (>6000), OneWeb (~650), Iridium NEXT (66), Amazon Kuiper", "Частоты: L (1–2 ГГц, Inmarsat/GPS), C (4/6, ГСО ТВ, устойчив к дождю), X (7/8, военные)", "Ku (12/14, DTH, страдает от **rain fade**), **Ka** (20/30, широкополосный Viasat, большая полоса, сильное затухание)", "**Оптоволокно**: десятки Тбит/с, задержка ~5 мс/1000 км → доминирует на магистралях", "Спутник незаменим: суда, самолёты, удалённые посёлки, экстренная связь; LEO сильно сократили разрыв с оптикой", "Гибрид: спутник как резерв подводных кабелей", "Антенны: на спутнике — **phased arrays** с beamforming; на земле — параболика (GEO) или плоские фазированные (Starlink-терминал)", "**HAPS** (стратосферные платформы, ~20 км, Google Loon) — «псевдо-спутники»", "ITU координирует частоты и орбитальные позиции ГСО — ограниченный ресурс"]}, {"n": 11, "title": "Цифровая модуляция и мультиплексирование. Низкочастотная передача. Передача в полосе пропускания. Частотное уплотнение. Мультиплексирование с разделением времени. Кодовое разделение каналов.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Модуляция** (modulation) — преобразование цифровых битов в физический сигнал, пригодный для передачи по каналу. **Мультиплексирование** (multiplexing) — совместное использование одного физического канала несколькими логическими потоками. Эти две задачи — фундамент любого физического уровня: модуляция определяет, **как** биты упаковываются в один поток, а мультиплексирование — **как** разделить общий ресурс канала между несколькими источниками.", "<h3>Низкочастотная (baseband) передача</h3>", "При **baseband-передаче** сигнал занимает полосу от 0 (постоянной составляющей) до некоторой f_max, без переноса на несущую. Применяется в проводных LAN, дисковых интерфейсах, USB. Биты кодируются **линейными кодами**:", "- **NRZ** (Non-Return-to-Zero) — «1» = высокий уровень, «0» = низкий; нет переходов при длинных сериях одинаковых бит → теряется тактовая синхронизация.\n- **NRZI** (NRZ-Inverted) — переход уровня кодирует «1», отсутствие — «0»; используется в USB.\n- **Манчестерский код** (Manchester) — переход в середине каждого бита: ↑ = «1», ↓ = «0»; самосинхронизация, но 2 перехода на бит → удваивает требуемую полосу. Применялся в 10BASE-T.\n- **4B/5B**, **8B/10B**, **64B/66B** — блочные коды, гарантирующие достаточное число переходов при минимальной избыточности (для Fast/Gigabit/10G Ethernet).", "<h3>Передача в полосе пропускания (passband)</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/6/6f/Rectangular_constellation_for_QAM.svg\" alt=\"Прямоугольное созвездие квадратурной амплитудной модуляции (QAM)\" loading=\"lazy\"><figcaption>Прямоугольное созвездие 64-QAM: каждая точка соответствует комбинации амплитуды и фазы, кодирующей 6 битов. Чем плотнее созвездие, тем выше требования к SNR. <em>Источник: Wikimedia Commons, CC BY-SA 4.0.</em></figcaption></figure>", "При **passband-передаче** биты модулируют **несущую** частоту f_c. Базовые виды:", "- **ASK** (Amplitude Shift Keying, амплитудная манипуляция) — биты меняют амплитуду несущей. Простейший вариант OOK (On-Off Keying) — оптические линии связи.\n- **FSK** (Frequency Shift Keying) — биты меняют частоту. Устаревшие модемы Bell 103, Bluetooth (GFSK).\n- **PSK** (Phase Shift Keying) — биты меняют фазу: BPSK (2 фазы, 1 бит/символ), QPSK (4 фазы, 2 бита), 8-PSK.\n- **QAM** (Quadrature Amplitude Modulation) — одновременная модуляция амплитуды и фазы, представляется **созвездием** точек в (I, Q)-плоскости. **16-QAM** — 4 бита/символ, **64-QAM** — 6, **256-QAM** — 8, **1024-QAM** (Wi-Fi 6) — 10, **4096-QAM** (Wi-Fi 7) — 12. Чем плотнее созвездие — тем больше скорость, но тем выше требуемое SNR.", "Спектральная эффективность измеряется в бит/с/Гц; для модуляции n-QAM достигает log₂(n) при идеальном фильтре.", "<h3>FDM — частотное разделение каналов</h3>", "В **FDM** (Frequency Division Multiplexing) полоса канала делится на несколько неперекрывающихся **поддиапазонов**, каждый назначен одному потоку. Между соседними каналами оставляются **защитные интервалы** (guard bands), предотвращающие взаимные помехи. Примеры: AM/FM-радио, аналоговое ТВ, ADSL (DMT — 256 поднесущих), пассивная оптика **WDM** (по длинам волн).", "**OFDM** (Orthogonal FDM) — частный случай: поднесущие выбраны ортогональными, защитные интервалы не нужны, спектральные «лепестки» перекрываются. Лежит в основе Wi-Fi (с 802.11a), LTE, 5G NR, DVB-T.", "<h3>TDM — временное разделение каналов</h3>", "В **TDM** (Time Division Multiplexing) каждый поток получает периодически повторяющийся **временной слот** в общем канале. Слоты собираются в **кадр**.", "- **Синхронный TDM** (STDM) — слоты жёстко закреплены за источниками; пустой источник «тратит» свой слот.\n- **Статистический TDM** (Asynchronous TDM) — слоты выделяются по запросу. Близко к идее пакетной коммутации.\n- **Иерархия PDH/SDH**: **E1** (Европа) — 32 слота × 64 кбит/с = **2,048 Мбит/с**; **T1** (США/Япония) — 24 слота × 64 кбит/с = 1,544 Мбит/с; **STM-1** (SDH) = 155,52 Мбит/с.", "<h3>CDMA — кодовое разделение каналов</h3>", "В **CDMA** (Code Division Multiple Access) все станции передают одновременно в одной и той же полосе, но **умножают свои биты на уникальную псевдослучайную последовательность** (расширяющий код, chipping code). На приёмнике сигнал коррелируется с тем же кодом — он восстанавливается, а сигналы других станций воспринимаются как шум (метод **DSSS**, Direct Sequence Spread Spectrum).", "- **Ортогональные коды Уолша–Адамара** обеспечивают полную развязку при синхронной передаче.\n- Применяется в стандарте **cdmaOne/CDMA2000** (3G в США), в восходящем канале **UMTS**, в **GPS** (каждый спутник имеет свой код).\n- Преимущества: «мягкий» хэндовер, устойчивость к узкополосным помехам, низкая обнаруживаемость; недостатки — сложность синхронизации и контроля мощности (near-far problem).", "**OFDMA** (Orthogonal FDMA), используемый в LTE и 5G, — комбинация частотного и временного деления: каждому пользователю выделяется подмножество поднесущих в подмножестве временных слотов (Resource Block)."], "terms": [{"ru": "Модуляция", "en": "modulation", "df": "процесс изменения параметров несущего сигнала в соответствии с передаваемыми данными"}, {"ru": "Демодуляция", "en": "demodulation", "df": "обратное преобразование сигнала в биты на приёмнике"}, {"ru": "NRZ / NRZI", "en": "Non-Return-to-Zero / Inverted", "df": "линейные коды, в которых сигнал не возвращается к нулю между битами"}, {"ru": "Манчестерский код", "en": "Manchester encoding", "df": "самосинхронизирующийся код с переходом в середине каждого бита"}, {"ru": "QAM", "en": "Quadrature Amplitude Modulation", "df": "квадратурная амплитудная модуляция; одновременное изменение амплитуды и фазы"}, {"ru": "Созвездие", "en": "constellation", "df": "представление точек QAM/PSK на (I, Q)-плоскости"}, {"ru": "FDM", "en": "Frequency Division Multiplexing", "df": "частотное разделение каналов"}, {"ru": "OFDM", "en": "Orthogonal FDM", "df": "мультиплексирование на ортогональных поднесущих"}, {"ru": "TDM", "en": "Time Division Multiplexing", "df": "временно́е разделение каналов"}, {"ru": "PDH / SDH", "en": "Plesiochronous/Synchronous Digital Hierarchy", "df": "иерархия скоростей TDM (E1, T1, STM-1)"}, {"ru": "WDM / DWDM", "en": "Wavelength Division Multiplexing", "df": "частотное мультиплексирование оптических длин волн"}, {"ru": "CDMA", "en": "Code Division Multiple Access", "df": "кодовое разделение множественного доступа"}, {"ru": "DSSS", "en": "Direct Sequence Spread Spectrum", "df": "расширение спектра прямой последовательностью"}, {"ru": "Расширяющий код", "en": "spreading code / chipping code", "df": "псевдослучайная последовательность для расширения спектра сигнала в CDMA"}, {"ru": "Спектральная эффективность", "en": "spectral efficiency", "df": "бит/с на 1 Гц полосы пропускания"}, {"ru": "Спектральная эффективность", "en": "spectral efficiency", "df": "количество бит/с на 1 Гц полосы пропускания"}], "summary": ["**Модуляция** — преобразование битов в физический сигнал; **мультиплексирование** — деление общего канала", "**Baseband** (низкочастотная): полоса от 0 до f_max, без несущей; LAN, USB, диски", "Линейные коды: **NRZ** (1=high/0=low, теряет синхро при длинных сериях); **NRZI** (переход=1, USB)", "**Манчестер**: переход в середине бита (↑=1, ↓=0), самосинхронизация, но 2 перехода/бит (10BASE-T)", "Блочные коды: **4B/5B** (Fast Ethernet), **8B/10B** (Gigabit), **64B/66B** (10G) — гарантируют переходы при минимальной избыточности", "**Passband**: модуляция несущей f_c — биты меняют параметры синусоиды", "**ASK** (амплитуда; OOK в оптике), **FSK** (частота; Bell 103, BT GFSK), **PSK** (фаза; BPSK/QPSK/8-PSK)", "**QAM** = амплитуда + фаза, **созвездие** в (I,Q): 16-QAM=4 бит, 64=6, 256=8, **1024-QAM** (Wi-Fi 6)=10, **4096-QAM** (Wi-Fi 7)=12", "Спектральная эффективность n-QAM = log₂(n) бит/с/Гц при идеальном фильтре", "**FDM** (Frequency Division Multiplexing) — поддиапазоны + защитные интервалы; AM/FM, аналоговое ТВ, ADSL (DMT 256 поднесущих), WDM", "**OFDM** — ортогональные поднесущие, перекрывающиеся лепестки, защитных интервалов нет; Wi-Fi (802.11a+), LTE, **5G NR**, DVB-T", "**TDM** (Time Division): циклические слоты в кадре; синхронный (закреплены) vs статистический (по запросу)", "TDM иерархия: **E1** = 32×64 кбит/с = **2,048 Мбит/с** (Европа); **T1** = 24×64 = 1,544 Мбит/с; STM-1 = 155,52 Мбит/с (SDH)", "**CDMA** (Code Division): все на одной полосе одновременно, умножение на ортогональный chipping code (**DSSS**)", "Коды **Уолша–Адамара**; применения: cdmaOne/CDMA2000, UMTS uplink, GPS (свой код у каждого спутника)", "Плюсы CDMA: soft handover, устойчивость к узкополосным помехам; минусы: near-far problem, контроль мощности", "**OFDMA** (LTE/5G) — гибрид: пользователь получает подмножество поднесущих в подмножестве слотов (Resource Block)"]}, {"n": 12, "title": "Коммутируемая телефонная сеть общего пользования. Структура телефонной системы.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**PSTN** (Public Switched Telephone Network), русск. **ТФОП** (телефонная сеть общего пользования) — глобальная иерархическая сеть, обеспечивающая голосовую связь между абонентами с помощью **коммутации каналов** (circuit switching). При установлении соединения через всю сеть резервируется фиксированный путь с гарантированной полосой 64 кбит/с, который удерживается на всё время разговора и освобождается после отбоя. Это исторически первая глобальная цифровая сеть, в основе которой лежат стандарты ITU-T, и архитектурный антипод пакетного Интернета.", "<h3>Структура PSTN</h3>", "Иерархия от абонента к магистрали:", "- **Абонентский шлейф** (subscriber loop / **local loop**) — медная витая пара от телефонного аппарата до ближайшей АТС, длиной обычно до 5–7 км. По ней передаётся аналоговый сигнал в полосе ~300–3400 Гц и питание −48 В
