ские программы.","paragraphs":["**Классификация атак.** Атаки делятся на две большие группы. **Пассивные атаки** — злоумышленник только слушает и читает данные, не меняя их. Их трудно обнаружить, но легко предотвратить шифрованием. **Активные атаки** — злоумышленник меняет данные, блокирует работу или подменяет участников связи. Их легче обнаружить, но сложнее предотвратить.","**Атаки отказа в обслуживании (DoS).** Цель — сделать сервис недоступным для пользователей. Это не кража данных, а вывод системы из строя.","**DoS (Denial of Service).** Атака с одного источника. Злоумышленник посылает много запросов, сервер не справляется и перестаёт отвечать легитимным пользователям.","**DDoS (Distributed DoS).** Распределённая атака с тысяч компьютеров одновременно. Источники — **ботнет** (сеть заражённых машин). Современные DDoS-атаки достигают сотен гигабит в секунду.","**Конкретные техники.** **SYN flood** — посылка множества TCP SYN-пакетов, сервер держит полуоткрытые соединения в памяти. **UDP flood** — заливка UDP-пакетами. **Amplification attack** (атака с усилением) — посылка маленького запроса на сервер (например, DNS), который отвечает большим ответом на адрес жертвы; коэффициент усиления может быть 50–100x.","**Атаки перехвата и перенаправления трафика.**","**Sniffing (перехват).** Пассивная атака. Злоумышленник слушает трафик в сети. В открытой Wi-Fi сети без шифрования это особенно просто. Защита — TLS, VPN.","**Man-in-the-Middle (MITM, человек посередине).** Активная атака. Злоумышленник встаёт между двумя участниками, читает и меняет сообщения. Стороны не знают об этом. Защита — шифрование с проверкой сертификатов.","**ARP spoofing.** Злоумышленник отправляет ложные ARP-ответы в локальной сети и подменяет MAC-адрес шлюза. Весь трафик идёт через него.","**DNS spoofing (cache poisoning).** Подмена DNS-ответов. Пользователь думает, что зашёл на банковский сайт, а попадает на поддельный.","**IP spoofing.** Подмена IP-адреса отправителя в пакете. Используется в DDoS и при обходе фильтров.","**Session hijacking (перехват сессии).** Кража идентификатора сессии (например, cookie) и использование его для доступа от имени пользователя.","**Вредоносное ПО (malware).** Программы, созданные для вреда. Их классифицируют по способу распространения и функциям.","**Вирусы (viruses).** Прикрепляются к файлу-носителю (программе, документу). Когда пользователь запускает заражённый файл, вирус активируется и заражает другие файлы. Нужен **хост-файл** для распространения. Бывают файловые, загрузочные, макровирусы (в документах Word/Excel).","**Сетевые черви (worms).** Сами распространяются по сети без участия пользователя. Не нужен хост-файл. Используют уязвимости операционной системы или приложений. Примеры: Morris Worm (1988), Conficker (2008), WannaCry (2017). Черви могут за часы заразить миллионы машин.","**Троянские программы (trojans).** Маскируются под полезные программы. Пользователь сам их запускает, думая, что это что-то нужное (например, взломанная версия платной программы). Внутри — вредоносный код. Сами не распространяются — полагаются на обман пользователя. Виды: **backdoor** (открывает злоумышленнику доступ к компьютеру), **dropper** (устанавливает другое вредоносное ПО), **downloader** (скачивает вирусы из Интернета).","**Шпионские программы (spyware).** Следят за пользователем. Виды: **keylogger** (записывает нажатия клавиш — пароли, сообщения), **screen grabber** (делает скриншоты), **adware** (показывает рекламу), **stalkerware** (следит за геолокацией, звонками, SMS). Часто устанавливаются вместе с бесплатными программами.","**Другие виды вредоносного ПО.** **Rootkit** — скрывает присутствие злоумышленника, работает на уровне ядра ОС. **Ransomware (вымогатель)** — шифрует файлы и требует выкуп. **Cryptojacker** — использует ресурсы компьютера для майнинга криптовалют. **Botnet agent** — превращает компьютер в часть ботнета."],"terms":[{"ru":"DoS/DDoS","en":"Denial of Service","df":"атака отказа в обслуживании (с одного или многих источников)"},{"ru":"MITM","en":"Man-in-the-Middle","df":"атака «человек посередине» — перехват связи"},{"ru":"Botnet","en":"Botnet","df":"сеть заражённых компьютеров под управлением злоумышленника"},{"ru":"Keylogger","en":"Keylogger","df":"шпионская программа, записывающая нажатия клавиш"},{"ru":"Ransomware","en":"Ransomware","df":"вымогатель — шифрует файлы и требует выкуп"}],"summary":["","**Суть:** Атаки бывают пассивные (слушать) и активные (менять/блокировать).","","**DoS/DDoS:**","- **DoS (Denial of Service)** — отказ в обслуживании, с одного источника.","- **DDoS** — с **ботнета** (тысяч заражённых машин).","- Техники: SYN flood, UDP flood, amplification (усиление через DNS/NTP).","","**Перехват и перенаправление трафика:**","- **Sniffing** — пассивное прослушивание.","- **MITM (Man-in-the-Middle)** — злоумышленник между сторонами.","- **ARP spoofing** — подмена MAC в локальной сети.","- **DNS spoofing** — подмена DNS-ответов.","- **IP spoofing** — подмена IP-источника.","- **Session hijacking** — кража cookie/сессии.","","**Вредоносные программы (malware):**","","**Вирус:**","- Прикрепляется к **файлу-носителю**.","- Активируется при запуске файла.","- Типы: файловые, макровирусы (Word/Excel).","","**Червь (worm):**","- **Сам распространяется** по сети.","- Использует уязвимости ОС.","- Примеры: Morris, Conficker, WannaCry.","","**Троян (Trojan):**","- Маскируется под полезную программу.","- Пользователь сам запускает.","- Типы: backdoor, dropper, downloader.","","**Spyware (шпионские):**","- **Keylogger** — записывает клавиатуру.","- **Screen grabber**, **stalkerware** (геолокация), **adware**.","","**Другие:**","- **Rootkit** — скрывает злоумышленника в ядре ОС.","- **Ransomware** — шифрует файлы, требует выкуп.","- **Cryptojacker** — майнит криптовалюту за счёт жертвы.","","**Для устного:** Вирус нужен хост-файл, червь сам лезет в сеть."]},{"n":58,"title":"Классификация методов обеспечения информационной безопасности. Политика безопасности.","paragraphs":["**Классификация методов защиты информации.** Методы защиты делят на четыре большие категории. Важно: ни одна категория не работает в одиночку. Надёжная защита всегда комбинирует несколько методов — это принцип **глубокой защиты** (defense in depth).","**1. Организационные (административные) методы.** Это правила, процедуры и документы. Самый важный элемент — **политика безопасности**. Сюда же входят: обучение сотрудников, должностные инструкции, план реагирования на инциденты, регламенты доступа к информации. Этот метод основа — без правил техника сама по себе не защищает.","**2. Технические (программно-аппаратные) методы.** Программные и аппаратные средства защиты. **Межсетевой экран (firewall)** — фильтрует трафик. **Антивирус** — ищет и удаляет вирусы. **IDS/IPS** — обнаружение и предотвращение вторжений. **VPN** — защищённый туннель. **Системы контроля доступа** (СКУД) — управляют, кто и куда может войти. **DLP** (Data Loss Prevention) — защита от утечки данных.","**3. Криптографические методы.** Математические методы защиты. **Шифрование** — делает данные нечитаемыми без ключа. **Электронная подпись** — подтверждает авторство и целостность. **Хеш-функции** — контроль целостности. **Протоколы** TLS, IPSec, SSH. Криптография часто используется внутри технических средств, но выделяется в отдельную категорию из-за своей специфики.","**4. Физические методы.** Защита помещений и оборудования. Замки, сейфы, охрана, видеонаблюдение, контроль доступа в помещение, защита от пожара и затопления. Также сюда относится защита от **побочных электромагнитных излучений и наводок** (ПЭМИН) — злоумышленник может перехватывать информацию по излучению от компьютера.","**Политика безопасности (Security Policy)** — главный документ в организации по вопросам информационной безопасности. Это формальный документ, утверждённый руководством, который отвечает на ключевые вопросы.","**Что защищать?** Список информационных активов: базы данных, серверы, документы, интеллектуальная собственность. Для каждого актива определяется уровень критичности.","**От кого защищать?** Это **модель угроз** и **модель нарушителя**. Внешние хакеры, конкуренты, недовольные сотрудники, иностранные спецслужбы — все имеют разные возможности и мотивы.","**Как защищать?** Конкретные технические и организационные меры: пароли минимум 12 символов, обязательная смена каждые 90 дней, двухфакторная аутентификация для админов, шифрование дисков ноутбуков, обязательный антивирус, ежемесячные обновления ПО.","**Кто отвечает?** Роли и ответственность. Администратор безопасности отвечает за настройку средств защиты. Руководитель подразделения — за соблюдение политики в своём отделе. Пользователь — за безопасность своего рабочего места.","**Что делать при инциденте?** План реагирования: кого уведомить, как локализовать проблему, как восстановить работу, как провести расследование, как оповестить регуляторов (требование законов).","**Подходы к политике.** Существует два крайних подхода. **Всё запрещено, кроме разрешённого** (default deny) — безопаснее, но неудобнее. **Всё разрешено, кроме запрещённого** (default allow) — удобнее, но рискованнее. В серьёзных системах обычно применяют первый подход.","**Международный стандарт.** **ISO/IEC 27001** — стандарт системы менеджмента информационной безопасности (ISMS, Information Security Management System). Описывает, как разработать политику, внедрить, контролировать и постоянно улучшать. Сертификация по этому стандарту подтверждает, что организация правильно управляет безопасностью. Сопутствующий стандарт **ISO/IEC 27002** содержит практические рекомендации по конкретным мерам.","**Российские требования.** В России применение средств защиты в госорганах и критической инфраструктуре регулируется **ФСТЭК** (техническая защита) и **ФСБ** (криптография). Базовые документы: **ФЗ-152** (персональные данные), **ФЗ-149** (информация), **ФЗ-63** (электронная подпись), **ФЗ-187** (критическая инфраструктура)."],"terms":[{"ru":"Политика безопасности","en":"Security Policy","df":"главный документ с правилами работы с информацией"},{"ru":"ISMS","en":"Information Security Management System","df":"система менеджмента информационной безопасности"},{"ru":"ISO/IEC 27001","en":"ISO/IEC 27001","df":"международный стандарт управления ИБ"},{"ru":"DLP","en":"Data Loss Prevention","df":"защита от утечки данных"},{"ru":"Defense in depth","en":"Defense in Depth","df":"глубокая многоуровневая защита"}],"summary":["","**Суть:** Четыре категории методов + политика как главный документ.","","**4 категории методов:**","","1. **Организационные:** правила, процедуры, обучение, политика безопасности.","2. **Технические:** firewall, антивирус, IDS/IPS, VPN, DLP.","3. **Криптографические:** шифрование, подпись, хеш, протоколы (TLS, IPSec).","4. **Физические:** замки, охрана, видеонаблюдение, защита от ПЭМИН.","","**Принцип:** **Defense in depth** — комбинация методов.","","**Политика безопасности (Security Policy):**","- Главный формальный документ, утверждённый руководством.","- Отвечает на 5 вопросов:","","1. **Что защищать?** Информационные активы с уровнями критичности.","2. **От кого?** Модель угроз и нарушителя.","3. **Как?** Конкретные меры (пароли 12+ символов, 2FA, шифрование дисков).","4. **Кто отвечает?** Роли (админ, руководитель, пользователь).","5. **Что делать при инциденте?** План реагирования.","","**Два подхода:**","- **Default deny** — всё запрещено, кроме разрешённого (безопаснее).","- **Default allow** — всё разрешено, кроме запрещённого.","","**Международный стандарт:**","- **ISO/IEC 27001** — система управления ИБ (**ISMS**).","- **ISO/IEC 27002** — практические рекомендации.","","**Россия:**","- **ФСТЭК** — техническая защита.","- **ФСБ** — криптография.","- ФЗ-152 (ПДн), ФЗ-63 (ЭП), ФЗ-187 (КИИ).","","**Для устного:** Политика без технических средств — бумага. Техника без политики — хаос."]},{"n":59,"title":"Антивирусная защита. Сканирование сигнатур. Метод контроля целостности. Сканирование подозрительных команд. Отслеживание поведения программ.","paragraphs":["**Антивирус** — программа для поиска и удаления вредоносного ПО. Современные антивирусы защищают не только от вирусов, но и от червей, троянов, шпионов, вымогателей. Используют четыре основных метода обнаружения. На практике антивирус комбинирует все методы для максимальной эффективности.","**1. Сканирование сигнатур (сигнатурный анализ).** Самый старый и классический метод. **Сигнатура** — это короткая уникальная последовательность байтов, характерная для конкретного вируса. Антивирус имеет **базу данных сигнатур** (сотни миллионов записей) и сканирует файлы в поисках совпадений.","**Преимущество.** Очень быстрый метод. Почти нет ложных срабатываний — если сигнатура совпала, это точно вирус.","**Недостаток.** Работает только против **известных** вирусов. Для новой угрозы сигнатуры ещё нет. Поэтому базу надо обновлять каждый день. Кроме того, **полиморфные вирусы** меняют свой код при каждом заражении — сигнатурный анализ их плохо ловит.","**2. Метод контроля целостности.** Антивирус создаёт базу **контрольных сумм** (хешей) для всех важных файлов системы: ядра ОС, системных библиотек, исполняемых файлов. Периодически пересчитывает хеши и сравнивает с сохранёнными значениями.","**Принцип.** Если файл изменился без ведома пользователя — это подозрительно. Возможно, вирус заразил его.","**Применение.** Особенно эффективен против вирусов, которые модифицируют системные файлы, и против руткитов. Также используется в системах контроля целостности (HIDS) — например, Tripwire.","**Ограничение.** Не обнаруживает новые файлы (они не были в базе), не работает против файлов, которые могут законно меняться.","**3. Сканирование подозрительных команд (эвристический анализ).** Антивирус анализирует **код программы** и ищет подозрительные инструкции и конструкции. Например: попытка записать что-то в загрузочный сектор диска, самомодификация кода, обращение к системным функциям необычным образом, попытка получить повышенные привилегии, подмена обработчиков прерываний.","**Принцип.** Каждая подозрительная команда добавляет программе «очки подозрительности». Если их накопилось много — программа помечается как подозрительная.","**Преимущество.** Может обнаружить **неизвестные вирусы** по их поведенческим признакам (zero-day защита).","**Недостаток.** Возможны **ложные срабатывания** — легитимная программа может использовать подобные команды (например, установщики, драйверы).","**4. Отслеживание поведения программ (поведенческий анализ).** Самый современный метод. Антивирус **запускает программу** (часто в **песочнице, sandbox** — изолированной виртуальной среде) и наблюдает, что она делает в реальном времени.","**Признаки вредоносной активности.** Попытка зашифровать множество файлов за короткое время (типично для ransomware). Соединение с известными командно-контрольными серверами (C2). Попытка установиться в автозагрузку. Массовое отправление писем. Попытка считать пароли из браузера. Попытка отключить антивирус.","**Sandbox.** Подозрительный файл запускается в виртуальной среде, где он не может навредить реальной системе. Антивирус наблюдает его действия. Если они вредоносные — файл блокируется.","**Преимущество.** Эффективен против любых вирусов, включая неизвестные. Ловит угрозы, которые прошли другие фильтры.","**Недостаток.** Ресурсоёмкий — запуск в sandbox требует CPU и памяти. Продвинутые вирусы умеют **обнаруживать sandbox** и не проявлять активности в нём.","**Дополнительные методы.**","**Облачный анализ.** Подозрительный файл отправляется на сервер антивируса, где его проверяют мощные инструменты и ML-модели. База сигнатур в облаке обновляется мгновенно, без ожидания обновления локальной базы.","**Машинное обучение.** Современные антивирусы используют нейросети, обученные на миллионах образцов вирусов и чистых программ. Могут обнаруживать угрозы, которые не подходят ни под одну сигнатуру.","**Компоненты антивируса.**","**Монитор реального времени (on-access scanner)** — постоянно проверяет все открываемые, создаваемые и изменяемые файлы.","**Сканер по запросу (on-demand scanner)** — проверяет файлы и диски, когда пользователь запускает сканирование вручную.","**Обновление баз** — ежедневное (иногда почасовое) скачивание новых сигнатур.","**Карантин** — изоляция подозрительных файлов. Они не удаляются сразу — пользователь может восстановить, если это ложное срабатывание.","**Известные антивирусы.** Kaspersky, ESET, Bitdefender, Avast, Symantec, Trend Micro, Microsoft Defender (встроен в Windows 10/11). Среди отечественных — Kaspersky и Dr.Web."],"terms":[{"ru":"Сигнатура","en":"Signature","df":"уникальный фрагмент кода, идентифицирующий вирус"},{"ru":"Контроль целостности","en":"Integrity Check","df":"проверка неизменности файлов через хеши"},{"ru":"Эвристика","en":"Heuristics","df":"поиск подозрительных команд в коде программы"},{"ru":"Песочница","en":"Sandbox","df":"изолированная среда для безопасного запуска подозрительного кода"},{"ru":"Zero-day","en":"Zero-day","df":"уязвимость или вирус, о котором ещё не знают разработчики защиты"}],"summary":["","**Суть:** Четыре основных метода обнаружения вредоносного ПО.","","**1. Сканирование сигнатур:**","- База данных **уникальных фрагментов** известных вирусов.","- Быстро, мало ложных срабатываний.","- **Минус:** только известные вирусы. Полиморфные вирусы обходят.","","**2. Метод контроля целостности:**","- База **контрольных сумм (хешей)** системных файлов.","- Периодическая проверка — если файл изменился, тревога.","- Эффективен против руткитов и модификаций.","- **Минус:** не видит новых файлов.","- Пример: **Tripwire**.","","**3. Сканирование подозрительных команд (эвристика):**","- Анализ **кода** программы.","- Подозрительно: запись в загрузочный сектор, самомодификация, подмена прерываний, попытка повышения привилегий.","- **Плюс:** ловит **zero-day** (неизвестные).","- **Минус:** ложные срабатывания (легитимные установщики).","","**4. Отслеживание поведения программ:**","- Запуск в **sandbox** (песочнице).","- Наблюдение: попытки зашифровать файлы (ransomware!), соединение с C2-серверами, запись в автозагрузку.","- **Плюс:** лучший против новых угроз.","- **Минус:** ресурсоёмко; продвинутые вирусы обнаруживают sandbox.","","**Дополнительно:**","- **Облачный анализ** — проверка на серверах антивируса.","- **Машинное обучение** — нейросети на миллионах образцов.","","**Компоненты антивируса:**","- **Монитор** — проверяет всё в реальном времени.","- **Сканер** — по запросу.","- **Обновления баз** — ежедневно.","- **Карантин** — изоляция подозрительных.","","**Известные:** Kaspersky, ESET, Bitdefender, Avast, Dr.Web, Microsoft Defender.","","**Для устного:** Современный антивирус комбинирует все 4 метода."]},{"n":60,"title":"Сетевые экраны: типы, реализация, архитектура. Сети VPN на основе шифрования.","paragraphs":["**Сетевой экран (firewall, межсетевой экран)** — система, которая фильтрует сетевой трафик между сетями. Стоит на границе (например, между локальной сетью и Интернетом). Пропускает разрешённый трафик, блокирует всё остальное. Главный инструмент периметровой защиты.","**Типы сетевых экранов (по принципу работы).**","**1. Пакетный фильтр (Packet Filter).** Самый простой тип. Работает на **сетевом и транспортном уровнях** (L3–L4). Проверяет каждый пакет по правилам: IP-адрес отправителя и получателя, порт, протокол (TCP/UDP/ICMP), флаги TCP. Работает **без состояния (stateless)** — не помнит предыдущие пакеты. Минус: не понимает контекст соединения; может пропустить пакет, якобы относящийся к существующему соединению, которого на самом деле нет.","**2. Фильтр с отслеживанием состояния (Stateful Firewall).** Следит за **активными соединениями** (таблица состояний). Когда клиент открывает TCP-соединение к серверу, firewall записывает это в таблицу. Ответные пакеты пропускает автоматически. Значительно умнее пакетного фильтра. Сегодня — базовый тип.","**3. Прокси-шлюз прикладного уровня (Application-level Gateway).** Работает на **прикладном уровне** (L7). Понимает конкретные протоколы: HTTP, FTP, SMTP, DNS. Может проверять содержимое пакетов, блокировать опасные команды (например, FTP PUT), фильтровать по URL. Самая глубокая проверка. Минус — медленный, требует отдельного прокси на каждый протокол.","**4. Next-Generation Firewall (NGFW).** Современный тип, объединяет функции: stateful firewall + IDS/IPS + фильтр приложений + анализ шифрованного трафика (SSL inspection) + контроль пользователей (не только IP, но и логин). Сегодня стандарт корпоративных решений. Примеры: Palo Alto, Fortinet, Cisco Firepower.","**Реализация сетевых экранов.**","**Программный firewall.** Устанавливается на компьютер или сервер (например, Windows Firewall, iptables/nftables в Linux, pf во FreeBSD). Защищает только этот хост.","**Аппаратный firewall.** Отдельное устройство с оптимизированным железом (ASIC) для высокой пропускной способности. Ставится на границе сети. Примеры: Cisco ASA, Palo Alto, Check Point.","**Облачный (виртуальный) firewall.** Работает как виртуальная машина или SaaS. Защищает облачные ресурсы (AWS, Azure). Примеры: AWS Security Groups, Cloudflare.","**Архитектуры развёртывания.**","**Screening router (экранирующий маршрутизатор).** Простейшая схема. Один маршрутизатор с firewall между Интернетом и локальной сетью. Дёшево, но одна точка отказа и нет зоны для публичных серверов.","**Dual-homed gateway.** Хост с двумя сетевыми картами: одна в Интернет, другая в локальную сеть. Весь трафик идёт через него. Используется как proxy.","**Screened subnet (DMZ).** Самая распространённая архитектура. Два firewall создают три зоны: **внутренняя сеть** (защищённая), **DMZ** (Demilitarized Zone — демилитаризованная зона), **внешняя сеть** (Интернет). В DMZ ставят публичные серверы — веб-сервер, почтовый сервер. Если DMZ взломают, внутренняя сеть останется защищённой вторым firewall.","**Сети VPN на основе шифрования.**","**VPN (Virtual Private Network, виртуальная частная сеть)** — технология, создающая **защищённый туннель** через небезопасную сеть (Интернет). Данные между точками шифруются и передаются как будто по отдельному частному каналу.","**Типы VPN.**","**Site-to-Site VPN (межофисный).** Соединяет две локальные сети (например, два офиса). VPN-шлюзы на границах сетей шифруют трафик. Сотрудники двух офисов работают, как в единой сети.","**Remote Access VPN (клиентский).** Отдельный сотрудник из дома подключается к корпоративной сети через VPN-клиент. Работает как будто он в офисе.","**Протоколы VPN.**","**IPSec.** Стандарт для VPN на сетевом уровне. Используется преимущественно для site-to-site.","**OpenVPN.** Открытый протокол на основе SSL/TLS. Популярен для remote access.","**WireGuard.** Новый, очень простой и быстрый протокол (2020). Встроен в Linux kernel.","**L2TP/IPSec.** L2TP (туннелирование) + IPSec (шифрование).","**PPTP.** Старый протокол, небезопасен, не рекомендуется.","**SSTP.** От Microsoft, поверх TLS.","**Как VPN обеспечивает безопасность.** **Шифрование** (AES, ChaCha20) — данные нечитаемы. **Аутентификация** (сертификаты, предобщий ключ) — только легитимные стороны. **Целостность** (HMAC) — нельзя подменить данные в пути. **Защита от повтора** — записанный пакет нельзя воспроизвести.","**Связь с другими темами.** VPN использует криптографию (Q62–68). IPSec работает на сетевом уровне. Firewall часто встроен в тот же узел, что и VPN-шлюз."],"terms":[{"ru":"Firewall","en":"Firewall","df":"межсетевой экран — фильтрует трафик между сетями"},{"ru":"Stateful","en":"Stateful Firewall","df":"firewall с отслеживанием состояния соединений"},{"ru":"DMZ","en":"Demilitarized Zone","df":"демилитаризованная зона — сегмент сети для публичных серверов"},{"ru":"NGFW","en":"Next-Generation Firewall","df":"современный firewall с функциями IDS/IPS и анализа приложений"},{"ru":"VPN","en":"Virtual Private Network","df":"виртуальная частная сеть — защищённый туннель через Интернет"}],"summary":["","**Суть:** Firewall фильтрует трафик; VPN создаёт защищённый туннель.","","**Типы firewall:**","","1. **Packet filter (L3-L4, stateless):** правила по IP, порту, протоколу. Не помнит соединения.","2. **Stateful firewall:** отслеживает активные соединения.","3. **Application-level gateway (L7):** понимает HTTP/FTP/SMTP. Может блокировать по содержимому. Медленный.","4. **NGFW (Next-Generation Firewall):** stateful + IDS/IPS + анализ приложений + SSL inspection. **Современный стандарт** (Palo Alto, Fortinet, Cisco Firepower).","","**Реализация:**","- **Программный:** Windows Firewall, iptables/nftables.","- **Аппаратный:** Cisco ASA, Palo Alto.","- **Облачный:** AWS Security Groups, Cloudflare.","","**Архитектуры:**","- **Screening router** — один маршрутизатор, простая схема.","- **Dual-homed gateway** — хост с двумя сетевыми картами.","- **Screened subnet (DMZ)** — два firewall, три зоны: внутренняя / **DMZ** (публичные серверы) / внешняя. **Стандарт**.","","**VPN (Virtual Private Network):**","- Защищённый **туннель** через небезопасную сеть.","- Шифрование + аутентификация + целостность + anti-replay.","","**Типы VPN:**","- **Site-to-Site** — между офисами.","- **Remote Access** — сотрудник из дома.","","**Протоколы VPN:**","- **IPSec** — сетевой уровень, для site-to-site.","- **OpenVPN** — поверх SSL/TLS.","- **WireGuard** — новый, быстрый.","- **L2TP/IPSec** — старое сочетание.","- **SSTP** — от Microsoft.","- **PPTP** — устарел, небезопасен.","","**Для устного:** Firewall фильтрует, VPN шифрует и инкапсулирует."]},{"n":61,"title":"Прокси-серверы. Функции прокси-сервера. Прокси-серверы прикладного уровня и уровня соединений. Системы обнаружения вторжений и системы обнаружения атак.","paragraphs":["**Прокси-сервер** — промежуточный сервер между клиентом и целевым сервером. Клиент посылает запросы не напрямую, а через прокси. Прокси перенаправляет запросы и возвращает ответы.","**Функции прокси-сервера.**","**1. Кэширование.** Прокси хранит часто запрашиваемые ресурсы (страницы, файлы, изображения). Если много пользователей запрашивают одно и то же, прокси отдаёт из кэша. Это быстрее и экономит трафик.","**2. Фильтрация контента.** Прокси может блокировать запрещённые сайты по URL, по категориям (социальные сети, развлечения), по ключевым словам. Используется в корпоративных сетях и образовательных учреждениях.","**3. Анонимность.** Целевой сервер видит IP-адрес прокси, а не пользователя. Полезно для защиты приватности.","**4. Логирование.** Прокси записывает все запросы — кто, когда, куда ходил. Используется для аудита и расследования инцидентов.","**5. Контроль доступа.** Прокси может требовать аутентификацию перед доступом к Интернету.","**6. Балансировка нагрузки** (у reverse proxy). Распределяет запросы между несколькими серверами.","**7. Проверка безопасности.** Антивирусная проверка скачиваемых файлов, защита от вредоносных сайтов.","**Прокси-серверы прикладного уровня (Application-level Proxy).** Работают на **уровне 7 OSI** (HTTP, FTP, SMTP). Полностью понимают протокол. Могут анализировать содержимое, фильтровать по URL, проверять методы (GET, POST), блокировать определённые команды.","**Особенности.** Для каждого протокола нужен **отдельный прокси** (HTTP-прокси не работает с FTP). Максимальная глубина проверки. Более медленные, потому что полностью парсят протокол.","**Примеры.** Squid (HTTP/HTTPS прокси), корпоративные веб-фильтры (Blue Coat, McAfee Web Gateway).","**Прокси-серверы уровня соединений (Circuit-level Proxy).** Работают на **уровне 5 OSI** (транспортный/сеансовый). Они не понимают содержимое, но управляют **TCP-соединениями**.","**Принцип работы.** Клиент подключается к прокси, прокси подключается к серверу, далее данные просто проксируются байт в байт. Прокси контролирует только **кто с кем соединяется**, но не **что передаётся**.","**Преимущества.** Быстрее прикладных прокси (не парсят содержимое). Работают с любым TCP-протоколом, не только с HTTP.","**Применение.** Для защиты внутренней сети, когда не нужен глубокий контроль содержимого. Классический пример — **SOCKS** (Socket Secure, RFC 1928). SOCKS v5 поддерживает TCP и UDP, аутентификацию. Используется в Tor, в обходе файрволов.","**Forward vs Reverse proxy.**","**Forward proxy.** На стороне **клиента**. Работает от имени клиентов, фильтрует исходящие запросы. Пример: корпоративный прокси для доступа в Интернет.","**Reverse proxy.** На стороне **сервера**. Клиенты видят только прокси, не настоящий сервер. Используется для балансировки нагрузки, SSL-терминации, кэширования. Примеры: Nginx, HAProxy, Cloudflare.","**Системы обнаружения вторжений (IDS) и системы предотвращения вторжений (IPS).**","**IDS (Intrusion Detection System).** Система, которая следит за сетью или хостом и **обнаруживает** подозрительную активность. Она только уведомляет администратора, но не блокирует автоматически. Работает **в режиме прослушивания** (out-of-band), не стоит в основном потоке трафика.","**IPS (Intrusion Prevention System).** Развитие IDS. Не только обнаруживает, но и **блокирует** атаки автоматически (сбрасывает соединения, добавляет в чёрный список, перенастраивает firewall). Стоит **в потоке трафика** (inline) — может его остановить.","**Методы обнаружения.**","**Сигнатурный анализ.** База данных известных атак и эксплойтов. Если трафик совпадает с сигнатурой — тревога. Быстрый, мало ложных срабатываний. Минус — не ловит новые атаки.","**Аномальный анализ (поведенческий).** Система изучает, что такое «нормальный» трафик (baseline) — обычные паттерны, объёмы, часы работы. Если видит отклонение (новый порт, необычный объём, трафик в 3 часа ночи) — тревога. Может поймать новые атаки, но больше ложных срабатываний.","**Policy-based.** Тревога на основе правил политики безопасности.","**Типы по расположению.**","**NIDS/NIPS (Network-based).** Стоит в сети, анализирует весь сетевой трафик через зеркалируемые порты коммутатора (SPAN) или TAP. Примеры: Snort, Suricata, Zeek (бывший Bro).","**HIDS/HIPS (Host-based).** Установлен на конкретном хосте. Следит за файлами, процессами, системными вызовами, входами в систему, логами ОС. Примеры: OSSEC, Tripwire, Wazuh.","**Система обнаружения атак (SOC, Security Operations Center).** Более широкое понятие. SOC — это центр мониторинга безопасности с людьми (аналитиками), процессами и технологиями (в том числе SIEM, IDS/IPS). Работает 24/7, реагирует на инциденты.","**Отличия firewall от IDS/IPS.** Firewall фильтрует трафик по **правилам** (IP, порт) — кто с кем может общаться. IDS/IPS анализирует **содержимое** пакетов и ищет **признаки атак**. Это разные задачи, и обычно используются вместе."],"terms":[{"ru":"Application-level proxy","en":"Application-level Proxy","df":"прокси прикладного уровня (L7), понимает протокол"},{"ru":"Circuit-level proxy","en":"Circuit-level Proxy","df":"прокси уровня соединений (L5), проксирует TCP без разбора содержимого"},{"ru":"SOCKS","en":"SOCKS","df":"протокол circuit-level прокси (RFC 1928)"},{"ru":"IDS","en":"Intrusion Detection System","df":"система обнаружения вторжений (уведомляет)"},{"ru":"IPS","en":"Intrusion Prevention System","df":"система предотвращения вторжений (блокирует)"}],"summary":["","**Суть:** Прокси — посредник; IDS/IPS — обнаружение и предотвращение вторжений.","","**Функции прокси:**","1. **Кэширование** — экономия трафика.","2. **Фильтрация контента** — блокировка сайтов.","3. **Анонимность** — скрытие IP клиента.","4. **Логирование** — аудит.","5. **Контроль доступа** — аутентификация.","6. **Балансировка нагрузки** (reverse proxy).","7. **Безопасность** — проверка файлов.","","**Прокси прикладного уровня (Application-level, L7):**","- Понимает протокол (HTTP, FTP, SMTP).","- Анализирует содержимое, блокирует команды, фильтрует по URL.","- Для каждого протокола свой прокси.","- Медленный, но глубокий анализ.","- Пример: **Squid**, Blue Coat.","","**Прокси уровня соединений (Circuit-level, L5):**","- Не понимает содержимое.","- Управляет **TCP-соединениями**.","- Клиент → прокси → сервер: данные проксируются байт в байт.","- Быстрее, работает с любым TCP.","- Пример: **SOCKS v5** (RFC 1928), используется в Tor.","","**Forward vs Reverse:**","- **Forward** — на стороне клиента (корпоративный).","- **Reverse** — на стороне сервера (Nginx, HAProxy).","","**IDS (Intrusion Detection System):**","- **Обнаруживает** атаки, уведомляет админа.","- **Out-of-band** — не стоит в основном потоке.","","**IPS (Intrusion Prevention System):**","- Обнаружение + **блокировка**.","- **Inline** — стоит в потоке трафика.","","**Методы:**","- **Сигнатурный** — база известных атак (быстро, точно).","- **Аномальный** — отклонение от нормы (ловит новое, больше ложных срабатываний).","","**Типы:**","- **NIDS/NIPS** — сетевой (Snort, Suricata).","- **HIDS/HIPS** — хостовой (OSSEC, Tripwire).","","**Отличие от firewall:** Firewall — по правилам (IP/порт), IDS — **по содержимому** (признаки атак).","","**Для устного:** Обычно firewall + IDS/IPS + антивирус работают вместе."]},{"n":62,"title":"Криптографические методы защиты информации. Шифрование. Симметричные и асимметричные алгоритмы шифрования. Односторонние функции. Криптоанализ.","paragraphs":["**Криптография** — наука о защите информации с помощью математических методов. Главные задачи: **шифрование** (данные нечитаемы для посторонних), **электронная подпись** (проверка авторства), **хеширование** (контроль целостности), **обмен ключами** в небезопасном канале.","**Основные понятия.** **Открытый текст (plaintext)** — данные до шифрования. **Шифротекст (ciphertext)** — данные после шифрования. **Ключ (key)** — секретный параметр. **Алгоритм (cipher)** — способ преобразования.","**Принцип Керкгоффса (1883).** Алгоритм должен быть **открыт и известен**. Секретным должен быть только ключ. Это позволяет публично проверить стойкость алгоритма. Принцип «безопасность через неизвестность» (security through obscurity) считается ненадёжным.","**Шифрование.** Преобразование открытого текста в шифротекст при помощи ключа так, чтобы без ключа обратное преобразование было практически невозможно. Два главных класса: симметричное и асимметричное.","**Симметричные алгоритмы шифрования.** Один ключ используется и для шифрования, и для расшифрования. Отправитель и получатель должны заранее договориться об этом ключе.","**Преимущества.** Очень быстрые (мегабайты в секунду). Подходят для шифрования больших объёмов данных.","**Недостаток.** Проблема **распределения ключей**. Как передать секретный ключ получателю, если канал небезопасен?","**Типы симметричных шифров.** **Блочные шифры** — шифруют данные блоками фиксированного размера (64 или 128 бит). Примеры: DES, 3DES, AES, Кузнечик, Магма. **Поточные шифры** — шифруют поток по одному биту или байту, генерируя псевдослучайную последовательность. Примеры: RC4 (устарел), ChaCha20, Salsa20.","**Режимы работы блочных шифров.** **ECB** (Electronic Codebook) — простой, но небезопасный: одинаковые блоки дают одинаковый шифротекст. **CBC** (Cipher Block Chaining) — каждый блок зашифрованного XOR-ится с предыдущим. **CTR** (Counter) — превращает блочный шифр в поточный. **GCM** (Galois/Counter Mode) — CTR + проверка целостности, современный стандарт.","**Алгоритмы.** **DES** — 56 бит, устарел. **3DES** — медленный, устарел. **AES** — 128/192/256 бит, мировой стандарт. **ГОСТ 28147-89** — 256 бит, российский старый. **Кузнечик** — современный российский (ГОСТ Р 34.12-2015). **ChaCha20** — быстрый современный.","**Асимметричные алгоритмы шифрования (с открытым ключом).** У каждого пользователя **два ключа**: **открытый (public)** и **закрытый (private)**. Они связаны математически. Что зашифровано одним, расшифровывается только другим.","**Как работает.** Если Алиса хочет получать зашифрованные сообщения, она публикует открытый ключ. Боб шифрует сообщение её открытым ключом. Расшифровать может только Алиса — своим закрытым ключом.","**Преимущество.** Не нужно заранее обмениваться секретным ключом. Открытый ключ можно публиковать.","**Недостаток.** В 100–1000 раз медленнее симметричного. Поэтому на практике используют **гибридный подход**: асимметричным шифрованием передают симметричный ключ, а данные шифруют симметрично. Так работают TLS, S/MIME, PGP.","**Алгоритмы.** **RSA** — самый известный, основан на сложности факторизации больших чисел. **ECC** (Elliptic Curve Cryptography) — на эллиптических кривых, короткие ключи при той же стойкости. **ElGamal** — на проблеме дискретного логарифма.","**Односторонние функции (one-way functions).** Функция f такая, что по x легко вычислить y = f(x), но по y практически невозможно найти x. Это фундамент всей асимметричной криптографии.","**Примеры односторонних функций.** **Факторизация.** Перемножить два простых числа p и q легко: n = p×q. Разложить обратно большое n на p и q — экспоненциально трудно. На этом основан RSA. **Дискретный логарифм.** Вычислить g^x mod p легко. По g^x mod p найти x — трудно. На этом основан Диффи-Хеллман и DSA. **Задача эллиптических кривых.** Аналог дискретного логарифма в группе точек эллиптической кривой.","**Hash-функции — односторонние функции.** Из данных вычисляется короткий хеш. Обратно восстановить данные невозможно. Но хеш-функции не используются для шифрования, а для целостности и подписи.","**Trapdoor функции (с лазейкой).** Односторонние функции, обратное преобразование которых становится лёгким, если знать **секретный параметр (лазейку)**. В RSA лазейка — закрытый ключ.","**Криптоанализ.** Наука о **взломе шифров** — нахождении открытого текста или ключа без легального знания ключа.","**Модели атак.**","**Атака на шифротекст (ciphertext-only).** У злоумышленника только шифротексты. Самая трудная атака.","**Атака на известный открытый текст (known-plaintext).** Знает пары (открытый текст, шифротекст). Цель — найти ключ. Была применена при взломе Энигмы в WWII.","**Атака на выбранный открытый текст (chosen-plaintext).** Может шифровать произвольные сообщения (доступ к шифратору) и наблюдать результат.","**Атака на выбранный шифротекст (chosen-ciphertext).** Может расшифровать произвольные шифротексты.","**Методы криптоанализа.**","**Brute force (полный перебор).** Перебор всех возможных ключей. Защита — длинный ключ (для AES-128 требуется 2^128 попыток, что практически невозможно).","**Частотный анализ.** Для старых шифров замены: в русском тексте чаще всего буквы «о» и «е». Анализируя частоты символов в шифротексте, можно угадать замены. Против современных шифров не работает.","**Дифференциальный и линейный криптоанализ.** Математические методы анализа блочных шифров. Современные шифры (AES) к ним устойчивы.","**Атаки по побочным каналам (side-channel).** Анализ **физических побочных эффектов**: время вычисления, потребление энергии, электромагнитное излучение. Могут выдать ключ без взлома самого алгоритма.","**Социальная инженерия.** Обман пользователя, чтобы он сам раскрыл пароль или ключ. Зачастую проще, чем математический взлом."],"terms":[{"ru":"Plaintext","en":"Открытый текст","df":"данные до шифрования"},{"ru":"Ciphertext","en":"Шифротекст","df":"данные после шифрования"},{"ru":"Односторонняя функция","en":"One-way Function","df":"легко вычислить в одну сторону, практически невозможно в обратную"},{"ru":"Trapdoor","en":"Trapdoor Function","df":"односторонняя функция с секретной лазейкой"},{"ru":"Криптоанализ","en":"Cryptanalysis","df":"наука о взломе шифров"}],"summary":["","**Суть:** Математические методы защиты информации.","","**Принцип Керкгоффса:** алгоритм **открыт**, секретен только **ключ**.","","**Симметричное шифрование:**","- **Один ключ** для шифрования и расшифрования.","- Быстрое (мегабайты/с).","- **Проблема:** передача ключа.","- Типы:","- **Блочные** (AES, ГОСТ) — блоки 128 бит.","- **Поточные** (ChaCha20, RC4) — побитно/побайтно.","- Режимы блочных: **ECB** (небезопасно), **CBC**, **CTR**, **GCM** (с целостностью).","","**Асимметричное (с открытым ключом):**","- **Пара ключей:** public и private.","- Шифруют одним — расшифровывают другим.","- В 100–1000 раз **медленнее** симметричного.","- **Гибридный подход:** асимметрично передают симметричный ключ, затем шифруют данные симметрично (так делает TLS).","- Алгоритмы: **RSA** (факторизация), **ECC** (эллиптические кривые), **ElGamal** (дискретный логарифм).","","**Односторонние функции (one-way):**","- По x легко вычислить y = f(x).","- По y практически невозможно найти x.","- Фундамент асимметричной криптографии.","- Примеры:","- **Факторизация:** p × q легко, но n → (p,q) экспоненциально. RSA.","- **Дискретный логарифм:** g^x mod p легко, обратно трудно. DH, DSA.","- **Эллиптические кривые:** аналог в группе точек.","- **Trapdoor (с лазейкой):** обратное становится лёгким с секретом (в RSA — закрытый ключ).","","**Криптоанализ** — наука о взломе.","","**Модели атак:**","- **Ciphertext-only** — только шифротексты.","- **Known-plaintext** — пары (plaintext, ciphertext). Взлом Энигмы.","- **Chosen-plaintext** — может шифровать что угодно.","- **Chosen-ciphertext** — может расшифровывать.","","**Методы:**","- **Brute force** — полный перебор.","- **Частотный анализ** — для старых шифров замены.","- **Дифференциальный, линейный** — для блочных (AES устойчив).","- **Side-channel** — побочные каналы (время, энергия, ЭМ-излучение).","- **Социальная инженерия** — обман.","","**Для устного:** Керкгоффс → открытые алгоритмы → публичный анализ стойкости."]},{"n":63,"title":"Электронная подпись: с симметричным ключом, с открытым ключом, профили сообщений. Парадокс дней рождений.","paragraphs":["**Электронная (цифровая) подпись** — криптографическое средство, которое доказывает: (1) документ создал конкретный человек, (2) документ не изменялся после подписания. Три главных свойства: **аутентичность** (подписал именно владелец ключа), **целостность** (документ не изменился), **неотказуемость** (отправитель не может сказать «это не я»).","**Подпись с симметричным ключом.** Исторически первая идея подписи. Использует симметричный ключ, общий между отправителем и получателем. Часто реализуется через **MAC** (Message Authentication Code) — код аутентификации сообщения.","**Принцип.** Отправитель и получатель заранее договариваются о секретном ключе K. Отправитель вычисляет MAC = f(message, K) и отправляет (message, MAC). Получатель пересчитывает MAC и сравнивает.","**Типы MAC.** **HMAC** (Hash-based MAC) — использует хеш-функцию (HMAC-SHA256). **CMAC** — на основе блочного шифра.","**Преимущества.** Быстро. Гарантирует аутентичность и целостность.","**Недостаток.** **Нет неотказуемости.** Получатель знает тот же ключ, что и отправитель, — значит, получатель сам мог подделать сообщение. Это не настоящая подпись в юридическом смысле.","**Решение через доверенного посредника.** Стороны могут использовать сервер-арбитра, который хранит ключи всех пользователей и подтверждает подлинность. Схема сложная и требует доверия к арбитру.","**Подпись с открытым ключом.** Настоящая цифровая подпись. Основана на **асимметричной криптографии**, но ключи используются **наоборот**: подписывают **закрытым** ключом, проверяют **открытым**.","**Процесс подписания.** Шаг 1: вычисляется **хеш** документа (короткая сводка фиксированной длины) — **профиль сообщения** (message digest). Шаг 2: хеш шифруется закрытым ключом отправителя. Результат — электронная подпись. Шаг 3: подпись прикладывается к документу.","**Процесс проверки.** Получатель вычисляет хеш документа сам. Расшифровывает подпись открытым ключом отправителя — получает исходный хеш. Сравнивает два хеша. Если совпадают — подпись верна.","**Преимущество.** Обеспечивает **неотказуемость**. Только владелец закрытого ключа мог создать подпись. Открытый ключ известен всем, но им нельзя подписать — только проверить.","**Алгоритмы подписи с открытым ключом.** **RSA signature** — самый классический. **DSA** (Digital Signature Algorithm) — стандарт NIST. **ECDSA** — DSA на эллиптических кривых, используется в Bitcoin, TLS. **Ed25519** — современный, быстрый. **ГОСТ Р 34.10-2012** — российский стандарт на эллиптических кривых.","**Профили (дайджесты) сообщений.** Это термин из Tanenbaum. **Профиль сообщения (message digest)** — результат применения хеш-функции к документу. Короткая сводка фиксированной длины, независимо от размера документа.","**Зачем нужен профиль.** Почему бы не шифровать **весь документ** закрытым ключом? Ответ: это слишком медленно. Документ может быть большим (мегабайты), а асимметричное шифрование в 100–1000 раз медленнее симметричного. Поэтому шифруют не сам документ, а его **хеш** (32–64 байта) — получается быстрая «подпись документа».","**Требования к хеш-функции для подписи.**","**Одностороннее (one-way).** По хешу нельзя восстановить документ.","**Детерминированное.** Тот же документ всегда даёт тот же хеш.","**Чувствительность к изменениям.** Любое изменение — совершенно другой хеш.","**Стойкость к коллизиям.** Практически невозможно найти два разных документа с одинаковым хешем.","**Алгоритмы хеширования.** **MD5** (128 бит) — сломан, не использовать. **SHA-1** (160 бит) — устарел. **SHA-256, SHA-512** (SHA-2) — современные. **SHA-3** (Keccak) — новейший. **ГОСТ Р 34.11-2012 (Стрибог)** — 256 или 512 бит, российский.","**Парадокс дней рождений.** Если в комнате 23 человека, вероятность, что у двоих совпадают дни рождения, — **больше 50%**. Это неинтуитивно: кажется, должно быть ~183 человека (половина от 365). Но тут сравниваются **все пары**, а не одна конкретная дата с каждым.","**Математика.** Для n людей и d возможных дат вероятность **хоть какого-то** совпадения ≈ 1 − e^(−n²/2d). При d = 365 и n = 23 вероятность > 50%. При n = 50 — 97%.","**Применение в криптографии — атака дня рождения (birthday attack).** Это атака на хеш-функции. Если хеш имеет **n бит**, злоумышленнику нужно перебрать не 2^n, а только около **2^(n/2)** вариантов, чтобы найти **коллизию** (два разных документа с одинаковым хешем).","**Почему так.** Представим, что мы генерируем случайные документы и считаем их хеши. Как только количество сгенерированных ≈ корень из числа возможных хешей, вероятность коллизии уже ≈ 50%. Это и есть парадокс дней рождений.","**Пример опасности.** MD5 даёт 128 бит. Казалось бы, 2^128 попыток. Но из-за парадокса реально — 2^64. Это достижимо современными компьютерами. Поэтому MD5 небезопасен для подписи.","**Следствие для выбора хеша.** Чтобы хеш был стойким к коллизиям, его длина должна быть **в 2 раза** больше нужной стойкости. Для стойкости 128 бит — хеш 256 бит (SHA-256). Для стойкости 256 бит — хеш 512 бит (SHA-512).","**Практический сценарий атаки.** Злоумышленник готовит два документа: «честный контракт» и «мошеннический контракт». Перебирает небольшие незаметные изменения (пробелы, переводы строк) до тех пор, пока хеши не совпадут. Даёт жертве подписать «честный» — подпись подходит и к «мошенническому»."],"terms":[{"ru":"MAC","en":"Message Authentication Code","df":"код аутентификации сообщения на симметричном ключе (HMAC)"},{"ru":"Профиль сообщения","en":"Message Digest","df":"результат хеш-функции от документа; короткая сводка"},{"ru":"Электронная подпись","en":"Digital Signature","df":"криптографическое подтверждение авторства и целостности"},{"ru":"Коллизия","en":"Collision","df":"два разных сообщения с одинаковым хешем"},{"ru":"Парадокс дней рождений","en":"Birthday Paradox","df":"совпадение находится за 2^(n/2) попыток вместо 2^n"}],"summary":["","**Суть:** Подпись доказывает авторство и целостность документа.","","**Три гарантии:**","1. **Аутентичность** — автор именно тот.","2. **Целостность** — документ не изменён.","3. **Неотказуемость** — автор не откажется.","","**Подпись с симметричным ключом:**","- **MAC (Message Authentication Code)** на общем ключе.","- **HMAC** = HMAC-SHA256 — на хеш-функции.","- Плюсы: быстро.","- **Минус:** нет неотказуемости — получатель знает тот же ключ и мог подделать сам.","- Решение через доверенного арбитра (сложно).","","**Подпись с открытым ключом:**","- Асимметричная криптография **наоборот**.","- **Подписывают закрытым**, **проверяют открытым**.","","**Процесс подписания:**","1. Вычисляется **хеш (профиль)** документа.","2. Хеш шифруется **закрытым** ключом автора.","3. Подпись прикладывается к документу.","","**Процесс проверки:**","1. Получатель считает хеш документа.","2. Расшифровывает подпись **открытым** ключом автора.","3. Сравнивает два хеша. Совпали → подпись верна.","","**Профили (message digest):**","- **Зачем нужен хеш:** документ может быть большим; асимметрия в 100–1000 раз медленнее → шифруют не сам документ, а его короткий хеш.","- Требования к хешу: односторонний, детерминированный, чувствительный к изменениям, стойкий к коллизиям.","- Алгоритмы: **SHA-256, SHA-512, SHA-3, Стрибог**. MD5 и SHA-1 устарели.","","**Алгоритмы подписи:** RSA signature, **DSA**, **ECDSA**, **Ed25519**, **ГОСТ Р 34.10-2012**.","","**Парадокс дней рождений:**","- В комнате **23 человека** → вероятность совпадения ДР > 50%.","- Формула: для n людей и d дат P ≈ 1 − e^(−n²/2d).","- Интуиция обманывает: сравниваются **все пары**, не одна фиксированная дата.","","**Атака дня рождения:**","- Хеш n бит → коллизия находится за **2^(n/2)**, не 2^n.","- Пример: MD5 (128 бит) → коллизия за 2^64 операций (возможно сегодня).","- **Следствие:** для стойкости 128 бит нужен хеш 256 бит.","","**Практический сценарий атаки:** злоумышленник готовит два документа — честный и мошеннический — перебирает микроизменения до совпадения хешей. Жертва подписывает честный, но подпись подходит и к мошенническому.","","**Для устного:** Подпись = хеш + асимметричное шифрование закрытым ключом."]},{"n":64,"title":"Сертификат открытого ключа. Формат X.509. Удостоверяющий центр. Инфраструктура систем с открытым ключом.","paragraphs":["**Проблема.** Асимметричная криптография требует, чтобы у всех были открытые ключи других участников. Но как убедиться, что открытый ключ действительно принадлежит тому, кому мы думаем? Например, когда вы заходите на сайт банка — как вы знаете, что ключ сайта настоящий, а не злоумышленника, устроившего MITM?","**Сертификат открытого ключа.** Это электронный документ, который связывает **открытый ключ** с **владельцем** (человеком, сайтом, организацией, устройством). Сертификат подписан цифровой подписью **удостоверяющего центра** — доверенной третьей стороны.","**Идея.** Если мы заранее доверяем удостоверяющему центру и знаем его открытый ключ, мы можем проверить подпись на любом сертификате и быть уверены в его содержании. Так доверие к одному органу «переносится» на все выданные им сертификаты.","**Формат X.509.** Международный стандарт формата сертификатов (ITU-T X.509, обновлённый в RFC 5280). Применяется в TLS/HTTPS, S/MIME, IPSec, SSH, программах для подписания кода. Это самый распространённый формат сертификатов в мире.","**Структура сертификата X.509 v3.**","**Version** — версия формата (обычно v3).","**Serial Number** — уникальный номер, выданный удостоверяющим центром.","**Signature Algorithm** — алгоритм, которым подписан сертификат (например, SHA-256 с RSA).","**Issuer** — удостоверяющий центр, выпустивший сертификат. В формате DN (Distinguished Name): C=US, O=DigiCert Inc, CN=DigiCert Global CA.","**Validity** — период действия: от даты и до даты. После истечения сертификат недействителен.","**Subject** — владелец сертификата. В формате DN: C=RU, O=example.com, CN=www.example.com.","**Subject Public Key Info** — сам открытый ключ и алгоритм (RSA, ECC).","**Extensions** — расширения X.509 v3. Важные: **Subject Alternative Name (SAN)** — список альтернативных имён (доменов), для которых действителен сертификат. **Key Usage** — назначение (подпись, шифрование, аутентификация). **CRL Distribution Point** — URL списка отозванных сертификатов. **Authority Information Access** — URL OCSP-сервера для онлайн-проверки.","**Signature** — цифровая подпись удостоверяющего центра на всех предыдущих полях.","**Как это работает для сайта.** Браузер заходит на https://banka.ru. Сайт присылает свой сертификат. Сертификат подписан CA. Браузер имеет **хранилище доверенных корневых CA** (встроено в ОС или сам браузер). Браузер проверяет: (1) подпись CA верна, (2) CA находится в хранилище доверенных, (3) сертификат не просрочен, (4) имя в сертификате совпадает с доменом сайта, (5) сертификат не отозван. Если все проверки пройдены — соединение безопасно.","**Удостоверяющий центр (Certificate Authority, CA).** Это доверенная организация, которая **выпускает сертификаты** и **гарантирует их достоверность**. Центр проверяет, что запрашивающий действительно владеет доменом или является указанной организацией, и только потом подписывает сертификат.","**Задачи CA.** Регистрация запросов на сертификаты (CSR — Certificate Signing Request). Проверка личности и прав запрашивающего. Выпуск сертификата с подписью. Публикация списка отозванных сертификатов. Поддержка инфраструктуры.","**Известные коммерческие CA.** DigiCert, Sectigo, GlobalSign, GoDaddy. **Бесплатный CA:** Let's Encrypt (с 2015 года бесплатные сертификаты для HTTPS, изменили ландшафт веба).","**Иерархия CA.** Обычно есть **корневой CA** (root CA), которому доверены все. Его корневой сертификат встроен в ОС и браузеры. Корневой CA обычно **не выпускает сертификаты конечным пользователям напрямую** — слишком важный и защищается в специальных хранилищах. Вместо этого он подписывает сертификаты **промежуточных CA (intermediate CA)**, которые уже выдают сертификаты пользователям.","**Зачем иерархия.** Если промежуточный CA скомпрометирован, можно отозвать только его, не трогая корневой. Корневой CA можно хранить в оффлайне (HSM-устройства) для максимальной защиты.","**Цепочка доверия (chain of trust).** Браузер проверяет весь путь: сертификат сайта → промежуточный CA → корневой CA (доверенный изначально).","**Инфраструктура открытых ключей (PKI, Public Key Infrastructure).** Полная система, которая обеспечивает работу с сертификатами.","**Компоненты PKI.**","**Certificate Authority (CA).** Выдаёт сертификаты.","**Registration Authority (RA).** Принимает заявки и проверяет личность. Может быть частью CA или отдельной организацией.","**Certificate Repository (Directory).** Хранилище сертификатов, доступное публично. Обычно LDAP или HTTP.","**Certificate Revocation List (CRL).** Список отозванных сертификатов. Если закрытый ключ украден или владелец изменил данные, сертификат отзывают до истечения срока. Клиенты должны скачивать CRL периодически.","**OCSP (Online Certificate Status Protocol).** Современная альтернатива CRL. Клиент делает онлайн-запрос: «Этот сертификат действителен?» Получает быстрый ответ. **OCSP Stapling** — сервер сам прикладывает OCSP-ответ к сертификату, чтобы клиент не делал отдельный запрос.","**Политика сертификации (CP, Certificate Policy).** Документ, описывающий правила работы CA: кому выдавать, как проверять, сроки, процедуры.","**Типы сертификатов по уровню проверки.**","**DV (Domain Validation).** Проверен только домен (владелец подтвердил контроль над ним, например, через специальный DNS TXT-запись). Самый простой и быстрый. Let's Encrypt выдаёт DV-сертификаты бесплатно за минуты.","**OV (Organization Validation).** Проверена и организация. Нужны документы.","**EV (Extended Validation).** Расширенная проверка: юридическое лицо, физический офис, контакты. Дорогой, выдаётся за неделю. Раньше показывал зелёную строку в браузере с названием организации."],"terms":[{"ru":"CA","en":"Certificate Authority","df":"удостоверяющий центр — выпускает и подписывает сертификаты"},{"ru":"X.509","en":"X.509","df":"международный стандарт формата сертификатов (RFC 5280)"},{"ru":"PKI","en":"Public Key Infrastructure","df":"инфраструктура открытых ключей — полная система работы с сертификатами"},{"ru":"CRL","en":"Certificate Revocation List","df":"список отозванных сертификатов"},{"ru":"OCSP","en":"Online Certificate Status Protocol","df":"протокол онлайн-проверки статуса сертификата"},{"ru":"CSR","en":"Certificate Signing Request","df":"запрос на подпись сертификата, который отправляется в CA"}],"summary":["","**Суть:** Сертификат связывает открытый ключ с владельцем через подпись доверенного CA.","","**Проблема:** как убедиться, что открытый ключ настоящий?","","**Сертификат:** электронный документ, связывающий ключ с владельцем, подписанный **удостоверяющим центром (CA)**.","","**Формат X.509 (RFC 5280):**","","| Поле | Назначение |","|---|---|","| Version | Версия (v3) |","| Serial Number | Уникальный номер |","| Signature Algorithm | Алгоритм подписи (SHA-256 + RSA) |","| Issuer | Кто выпустил (CA) в формате DN |","| Validity | Период действия |","| Subject | Владелец в формате DN |","| Subject Public Key Info | Открытый ключ |","| Extensions | SAN, Key Usage, CRL DP, AIA |","| Signature | Подпись CA |","","**Удостоверяющий центр (Certificate Authority, CA):**","- Выпускает сертификаты, проверяя личность.","- Коммерческие: DigiCert, Sectigo, GlobalSign.","- Бесплатный: **Let's Encrypt**.","","**Иерархия CA:**","- **Root CA** — самый верх, доверен изначально, встроен в ОС/браузеры. Хранится в оффлайне (HSM).","- **Intermediate CA** — подписан root, выпускает конечные сертификаты.","- Если intermediate скомпрометирован, можно отозвать только его.","- **Цепочка доверия:** сертификат сайта → intermediate → root.","","**PKI (Public Key Infrastructure):**","- **CA** — выдача.","- **RA (Registration Authority)** — проверка личности.","- **Certificate Repository** — публичное хранилище.","- **CRL (Certificate Revocation List)** — список отозванных.","- **OCSP (Online Certificate Status Protocol)** — онлайн-проверка статуса.","- **OCSP Stapling** — сервер сам прикладывает OCSP-ответ.","","**Типы проверки:**","- **DV (Domain Validation)** — только домен (Let's Encrypt).","- **OV (Organization Validation)** — организация проверена.","- **EV (Extended Validation)** — полная проверка юрлица.","","**Для устного:** HTTPS работает, потому что браузер имеет список доверенных root CA."]},{"n":65,"title":"Аутентификация, авторизация, аудит. Аутентификация на основе одноразового пароля. Аутентификация на основе сертификатов. Аутентификация информации.","paragraphs":["**Три A (AAA)** — Authentication, Authorization, Accounting. Это три связанных, но разных понятия. Их часто путают.","**Аутентификация (Authentication)** — **кто вы?** Проверка личности. Пользователь доказывает, что он тот, за кого себя выдаёт.","**Авторизация (Authorization)** — **что вам разрешено?** Проверка прав после аутентификации. Решает, к каким ресурсам пользователь имеет доступ.","**Аудит (Accounting, Audit)** — **что вы сделали?** Запись всех действий в журналах для последующего контроля.","**Аутентификация** использует три **фактора**.","**1. Что вы знаете (knowledge).** Пароль, PIN-код, секретный вопрос.","**2. Что у вас есть (possession).** Смартфон, аппаратный токен, смарт-карта, ключ от дома.","**3. Что вы есть (inherence).** Биометрия: отпечаток пальца, лицо, голос, радужная оболочка.","**Многофакторная аутентификация (MFA, 2FA).** Использование двух или более факторов одновременно. Например: пароль + код из SMS (знание + обладание). Значительно безопаснее, чем один фактор. Даже если пароль украли, нужен ещё и телефон.","**Аутентификация на основе одноразового пароля (OTP — One-Time Password).** Пароль действителен только один раз. Даже если злоумышленник перехватит его, он не сможет использовать повторно.","**Два типа OTP.**","**HOTP (HMAC-based OTP, RFC 4226).** Пароли генерируются на основе **счётчика** и общего секретного ключа. При каждом использовании счётчик увеличивается. Клиент и сервер синхронизируют счётчики.","**TOTP (Time-based OTP, RFC 6238).** Пароль зависит от **текущего времени** и секретного ключа. Каждые 30 секунд генерируется новый код. Это то, что используют Google Authenticator, Microsoft Authenticator, Authy.","**Способы доставки OTP.** **Приложение-аутентификатор** (TOTP) — самый безопасный. **SMS** — удобно, но уязвимо к перехвату и SIM-swap атакам. **Email** — проще всего украсть. **Аппаратные токены** (RSA SecurID, YubiKey) — дорогие, но очень надёжные.","**Аутентификация на основе сертификатов.** Использует **цифровые сертификаты X.509** вместо паролей. Пользователь имеет закрытый ключ (обычно на смарт-карте или USB-токене), а соответствующий открытый ключ и сертификат хранятся в системе.","**Как работает.** Сервер посылает клиенту случайный **запрос (challenge)**. Клиент подписывает его своим закрытым ключом. Сервер проверяет подпись открытым ключом из сертификата клиента. Если подпись верна и сертификат действителен — аутентификация успешна.","**Преимущества.** Нет передачи паролей по сети. Нельзя украсть пароль фишингом. Высокая стойкость.","**Недостатки.** Сложная инфраструктура (нужна PKI). Закрытый ключ нужно безопасно хранить и не потерять.","**Применение.** Вход в корпоративную сеть (Windows с Active Directory), банковские системы (квалифицированная электронная подпись в России), VPN, TLS mutual authentication (когда и сервер, и клиент имеют сертификаты).","**Протоколы аутентификации.**","**Kerberos** — использует доверенный сервер (**KDC** — Key Distribution Center) и **билеты** (tickets). Применяется в Active Directory (Windows).","**RADIUS** (RFC 2865) — централизованная AAA для VPN, Wi-Fi (802.1X), сетевого оборудования.","**TACACS+** — аналог RADIUS от Cisco, разделяет AAA на три отдельные функции.","**OAuth 2.0** (RFC 6749) — авторизация, часто используется для SSO. Строго говоря, это протокол авторизации, а не аутентификации.","**OpenID Connect** — аутентификация поверх OAuth 2.0.","**SAML** (Security Assertion Markup Language) — XML-протокол для SSO в корпоративных средах.","**LDAP** (Lightweight Directory Access Protocol) — протокол для доступа к каталогам; часто используется для хранения учётных записей и их проверки.","**Аутентификация информации (authentication of information).** Это проверка **подлинности самих данных**, а не пользователя. Нужно удостовериться: (1) данные пришли от того, кого мы ждём (аутентичность источника), (2) данные не изменены в пути (целостность).","**Способы аутентификации информации.**","**MAC (Message Authentication Code).** Симметричный ключ. Отправитель добавляет HMAC к сообщению, получатель пересчитывает и сравнивает. Гарантирует аутентичность и целостность, но не неотказуемость.","**Цифровая подпись.** Асимметричный ключ. Даёт все три свойства: аутентичность, целостность, неотказуемость. Используется в TLS, S/MIME, PGP.","**Хеш-функции с секретом.** Как HMAC.","**Протоколы с аутентификацией.** TLS обеспечивает аутентификацию сервера (через сертификат) и опционально клиента. IPSec обеспечивает аутентификацию сетевых пакетов через AH или ESP.","**Авторизация — модели.**","**DAC (Discretionary Access Control).** Владелец ресурса сам решает, кому дать доступ. Пример: файлы в Linux (chmod).","**MAC (Mandatory Access Control).** Доступ определяется системной политикой, пользователь не может её изменить. Применяется в военных системах с уровнями секретности (секретно, совершенно секретно).","**RBAC (Role-Based Access Control).** Права даются **ролям**, а не пользователям. Самая распространённая модель в корпорациях.","**ABAC (Attribute-Based Access Control).** Доступ определяется по атрибутам: кто пользователь, какой ресурс, время, место. Более гибкая, но сложнее.","**Аудит.** Запись всех действий в **журналы (logs)**: кто, когда, что сделал.","**Зачем.** Расследование инцидентов, обнаружение атак, соответствие законам (GDPR, 152-ФЗ), контроль сотрудников.","**Инструменты.** **SIEM** (Security Information and Event Management) — системы для сбора и анализа логов: Splunk, ELK Stack, ArcSight. Они обнаруживают подозрительные паттерны и уведомляют аналитиков."],"terms":[{"ru":"AAA","en":"Authentication, Authorization, Accounting","df":"три компонента управления доступом"},{"ru":"MFA","en":"Multi-Factor Authentication","df":"многофакторная аутентификация (два и более фактора)"},{"ru":"OTP","en":"One-Time Password","df":"одноразовый пароль; HOTP (счётчик), TOTP (время)"},{"ru":"Kerberos","en":"Kerberos","df":"протокол аутентификации через KDC и билеты"},{"ru":"RADIUS","en":"RADIUS","df":"централизованный AAA-протокол для сетевого оборудования"},{"ru":"RBAC","en":"Role-Based Access Control","df":"управление доступом на основе ролей"}],"summary":["","**Суть:** AAA — Authentication, Authorization, Accounting.","","**Три A:**","- **Authentication** — **кто** вы?","- **Authorization** — **что** вам разрешено?","- **Audit** — **что** вы сделали?","","**Три фактора аутентификации:**","1. **Знание** — пароль, PIN.","2. **Обладание** — токен, телефон, смарт-карта.","3. **Биометрия** — отпечаток, лицо, голос.","","**MFA (Multi-Factor):** два+ фактора. Даже украденный пароль не поможет без второго фактора.","","**OTP (One-Time Password):**","- Пароль действителен **один раз**.","- **HOTP (RFC 4226)** — на основе счётчика.","- **TOTP (RFC 6238)** — на основе **времени** (каждые 30 сек). Google Authenticator.","- Способы доставки: приложение (безопасно), SMS (уязвимо к перехвату), аппаратный токен (надёжно).","","**Аутентификация на основе сертификатов:**","- Клиент имеет **закрытый ключ** (на смарт-карте/USB).","- Сервер шлёт **challenge** — клиент подписывает своим ключом.","- Сервер проверяет подпись открытым ключом из сертификата.","- **Mutual TLS** — обе стороны с сертификатами.","- Применение: корпоративные сети, банки, квалифицированная ЭП в России.","","**Протоколы аутентификации:**","- **Kerberos** — билеты, **KDC** (Key Distribution Center). Active Directory.","- **RADIUS** — централизованный AAA для VPN, Wi-Fi 802.1X.","- **TACACS+** — от Cisco.","- **OAuth 2.0** — авторизация (RFC 6749), основа SSO.","- **OpenID Connect** — аутентификация поверх OAuth 2.0.","- **SAML** — XML, корпоративный SSO.","- **LDAP** — протокол каталогов.","","**Аутентификация информации:**","- Проверка подлинности **самих данных** (не пользователя).","- **MAC/HMAC** — симметричный ключ. Целостность + аутентичность.","- **Цифровая подпись** — асимметрично. Все три свойства + неотказуемость.","- TLS обеспечивает auth сервера (обязательно) и клиента (опционально).","","**Модели авторизации:**","- **DAC** — владелец решает (Linux).","- **MAC** — системная политика (военные).","- **RBAC** — на основе ролей (корпорации). **Самая распространённая**.","- **ABAC** — по атрибутам (гибкая).","","**Аудит:**","- Логи действий: кто, когда, что.","- **SIEM** (Splunk, ELK Stack, ArcSight) — сбор и анализ.","","**Для устного:** AAA = кто + что можно + что сделал."]},{"n":66,"title":"Криптографические протоколы. Протокол IPSec. Особенности.","paragraphs":["**IPSec** (Internet Protocol Security) — это набор протоколов для защиты IP-трафика. Работает на **сетевом уровне**. Добавляет к IP-пакетам шифрование и проверку целостности. Главное применение — VPN между офисами или между сотрудником и офисом.","**Что IPSec обеспечивает.** **Конфиденциальность** — пакеты зашифрованы, их не могут прочитать. **Целостность** — пакеты не были изменены в пути. **Аутентификация** — пакет пришёл от того, от кого ожидается. **Защита от повтора (anti-replay)** — злоумышленник не может записать пакет и отправить его снова.","**Два протокола IPSec.**","**AH (Authentication Header).** Обеспечивает только **аутентификацию и целостность**, но не шифрование. Добавляет заголовок с хешем. Редко используется отдельно, так как не скрывает данные.","**ESP (Encapsulating Security Payload).** Обеспечивает **шифрование + аутентификацию + целостность**. Используется в большинстве VPN. ESP — главный протокол IPSec.","**Два режима работы.**","**Транспортный режим (Transport Mode).** Шифруются только **данные** IP-пакета. IP-заголовок остаётся видимым. Используется между двумя конечными хостами (end-to-end).","**Туннельный режим (Tunnel Mode).** Весь исходный IP-пакет шифруется целиком и помещается внутрь нового IP-пакета. Используется между VPN-шлюзами (например, между двумя офисами). Злоумышленник видит только, что пакет идёт между шлюзами — внутренние адреса скрыты.","**IKE (Internet Key Exchange)** — протокол, который обе стороны используют для согласования параметров: какие алгоритмы шифрования использовать, какие ключи, на какое время. Есть две версии: **IKEv1** (старая) и **IKEv2** (современная, быстрее и надёжнее).","**Security Association (SA).** Это «соединение» в IPSec. Описывает параметры защиты между двумя сторонами: алгоритм, ключ, время жизни. SA однонаправленное — для двустороннего обмена нужно два SA. Идентифицируется тройкой: SPI (Security Parameter Index), IP-адрес получателя, протокол (AH или ESP).","**SPD и SAD.** **SPD** (Security Policy Database) — база правил: какой трафик защищать. **SAD** (Security Association Database) — база активных SA с ключами и параметрами.","**Алгоритмы в IPSec.** Шифрование: AES, 3DES, ChaCha20. Хеш для целостности: HMAC-SHA256, HMAC-SHA1. Обмен ключами: Диффи-Хеллман (в IKE).","**Преимущества IPSec.** Работает на сетевом уровне — прозрачно для приложений. Не надо менять программы. Защищает весь трафик, а не только веб (как TLS).","**Недостатки.** Сложный в настройке. Проблемы с NAT (решается через NAT-T — NAT Traversal). Зависит от ОС."],"terms":[{"ru":"IPSec","en":"Internet Protocol Security","df":"набор протоколов для защиты IP-трафика"},{"ru":"AH","en":"Authentication Header","df":"протокол IPSec для аутентификации и целостности (без шифрования)"},{"ru":"ESP","en":"Encapsulating Security Payload","df":"протокол IPSec для шифрования + аутентификации"},{"ru":"IKE","en":"Internet Key Exchange","df":"протокол согласования ключей и параметров IPSec"},{"ru":"SA","en":"Security Association","df":"защищённое соединение с параметрами шифрования"}],"summary":["","**Суть:** IPSec — защита IP-трафика на **сетевом уровне**.","","**Что даёт:**","- **Конфиденциальность** (шифрование).","- **Целостность**.","- **Аутентификация**.","- **Защита от повтора (anti-replay)**.","","**Два протокола:**","- **AH (Authentication Header)** — только аутентификация + целостность, **без шифрования**. Редко используется отдельно.","- **ESP (Encapsulating Security Payload)** — шифрование + аутентификация. **Основной**.","","**Два режима:**","- **Transport mode:** шифруются только **данные** IP-пакета, заголовок виден. Между двумя хостами (end-to-end).","- **Tunnel mode:** **весь** IP-пакет упаковывается в новый. Между шлюзами (site-to-site VPN). Внутренние адреса скрыты.","","**IKE (Internet Key Exchange):**","- Согласование параметров: алгоритмы, ключи, срок.","- **IKEv1** — старая, **IKEv2** — современная.","","**Security Association (SA):**","- «Соединение» в IPSec.","- Параметры: алгоритм, ключ, время жизни.","- **Однонаправленное** — для двустороннего обмена нужно 2 SA.","- Идентифицируется: SPI + dst IP + протокол.","","**Базы:**","- **SPD (Security Policy Database)** — правила: какой трафик защищать.","- **SAD (Security Association Database)** — активные SA.","","**Алгоритмы:**","- Шифрование: **AES, 3DES, ChaCha20**.","- Целостность: **HMAC-SHA256, HMAC-SHA1**.","- Обмен ключами: **Диффи-Хеллман**.","","**Плюсы:** прозрачен для приложений, защищает весь трафик.","**Минусы:** сложная настройка, проблема с NAT (решается **NAT-T**).","","**Для устного:** IPSec — основа корпоративных VPN. ESP tunnel mode между офисами."]},{"n":67,"title":"Криптографические протоколы. Протокол SSL (TLS). Особенности.","paragraphs":["**SSL** (Secure Sockets Layer) и **TLS** (Transport Layer Security) — протоколы для защищённого обмена данными в сети. Работают поверх **TCP**, ниже прикладного уровня (HTTP, SMTP, FTP). SSL — старое название, TLS — современное. На практике все говорят TLS, а SSL считается устаревшим.","**Зачем нужен TLS.** Без TLS данные передаются в открытом виде. Любой между отправителем и получателем (провайдер, злоумышленник в Wi-Fi) может их прочитать. TLS решает три задачи: **шифрование** (данные нечитаемы), **аутентификация** (сервер настоящий), **целостность** (данные не изменены).","**История версий.** **SSL 2.0** (1995) — небезопасен, запрещён. **SSL 3.0** (1996) — атака POODLE, устарел. **TLS 1.0** (1999) — устарел, больше не поддерживается. **TLS 1.1** (2006) — устарел. **TLS 1.2** (2008) — самая распространённая, всё ещё активно используется. **TLS 1.3** (2018) — современная, значительно быстрее и безопаснее.","**Как работает TLS 1.2 — рукопожатие (handshake).**","**Шаг 1. ClientHello.** Клиент посылает серверу список поддерживаемых алгоритмов (cipher suites), случайное число, версию TLS.","**Шаг 2. ServerHello.** Сервер выбирает один cipher suite, посылает своё случайное число и **сертификат X.509**.","**Шаг 3. Проверка сертификата.** Клиент проверяет сертификат сервера: подпись CA, срок действия, совпадение имени с доменом.","**Шаг 4. Обмен ключами.** Клиент и сервер согласуют общий **симметричный ключ** (master secret). Используется протокол Диффи-Хеллмана или RSA.","**Шаг 5. Finished.** Обе стороны подтверждают готовность. Дальше данные шифруются симметричным ключом.","**TLS 1.3 — главные улучшения.**","**Быстрее.** Рукопожатие занимает 1 RTT вместо 2 (в TLS 1.2). Есть режим 0-RTT для повторных соединений.","**Безопаснее.** Удалены старые слабые алгоритмы: RSA для обмена ключами, 3DES, MD5, SHA-1. Только **Forward Secrecy** (через Диффи-Хеллмана). Forward Secrecy означает: если злоумышленник украдёт закрытый ключ сервера, он не сможет расшифровать старые записанные сессии.","**Проще.** Меньше вариантов cipher suites — меньше ошибок при настройке.","**Два уровня TLS.** **Record Protocol** — нижний уровень. Разбивает данные на блоки, шифрует, добавляет MAC. **Handshake Protocol** — верхний уровень. Отвечает за рукопожатие.","**Применение TLS.** **HTTPS** (HTTP поверх TLS) — порт 443. **SMTPS** — почта. **IMAPS, POP3S** — получение почты. **FTPS** — FTP. **OpenVPN** — использует TLS.","**Гибридный подход.** TLS использует **асимметричную криптографию** только на этапе рукопожатия (для обмена ключами и проверки сертификата). Сами данные шифруются **симметрично** (быстрее).","**Известные атаки на TLS (и защита).** POODLE (против SSL 3.0) — отказ от SSL. BEAST (против CBC в TLS 1.0) — переход на TLS 1.2+. Heartbleed (2014) — уязвимость в OpenSSL, исправлена. Для защиты: использовать только TLS 1.2 и 1.3, обновлять библиотеки."],"terms":[{"ru":"TLS","en":"Transport Layer Security","df":"протокол защищённой передачи данных поверх TCP"},{"ru":"SSL","en":"Secure Sockets Layer","df":"устаревший предшественник TLS"},{"ru":"Handshake","en":"Рукопожатие","df":"начальное согласование параметров и ключей"},{"ru":"Cipher suite","en":"Cipher Suite","df":"комбинация алгоритмов шифрования, обмена ключами, хеширования"},{"ru":"Forward Secrecy","en":"Forward Secrecy","df":"свойство, при котором компрометация ключа не раскрывает старые сессии"}],"summary":["","**Суть:** Защита соединений поверх TCP. SSL устарел, сейчас TLS.","","**Что даёт:** шифрование + аутентификация + целостность.","","**История версий:**","- SSL 2.0/3.0 — небезопасны.","- TLS 1.0/1.1 — устарели.","- **TLS 1.2** (2008) — массовая.","- **TLS 1.3** (2018) — современная.","","**TLS 1.2 — рукопожатие:**","1. **ClientHello** — список cipher suites, случайное число, версия.","2. **ServerHello** — выбранный cipher suite, сертификат X.509, своё число.","3. **Проверка сертификата** клиентом (подпись CA, срок, имя, отзыв).","4. **Обмен ключами** — Диффи-Хеллман или RSA → общий **master secret**.","5. **Finished** — обе стороны подтверждают. Дальше шифрование.","","**TLS 1.3 — улучшения:**","- **1 RTT** вместо 2; **0-RTT** для повторных соединений.","- Только **Forward Secrecy** (через ECDHE).","- Удалены слабые алгоритмы: RSA key exchange, 3DES, MD5, SHA-1.","- Меньше cipher suites — меньше ошибок.","","**Forward Secrecy:** компрометация долгосрочного ключа сервера не раскрывает старые сессии.","","**Два уровня TLS:**","- **Record Protocol** — шифрование данных, разбиение на блоки.","- **Handshake Protocol** — согласование.","","**Применение:**","- **HTTPS** (443), **SMTPS** (465), **IMAPS** (993), **POP3S** (995), **FTPS**, **OpenVPN**.","","**Гибридный подход:** асимметрия в handshake + симметрия для данных.","","**Атаки и защита:**","- **POODLE** против SSL 3.0 → отказ от SSL.","- **BEAST** против CBC в TLS 1.0 → переход на 1.2+.","- **Heartbleed** (2014) — баг OpenSSL.","- Защита: только TLS 1.2/1.3, обновление библиотек.","","**Для устного:** TLS 1.3 — быстрее (1 RTT) и безопаснее (только FS)."]},{"n":68,"title":"Криптографические протоколы. Схема Диффи-Хеллмана.","paragraphs":["**Протокол Диффи-Хеллмана** (Diffie-Hellman, DH) — протокол, который позволяет двум сторонам **согласовать общий секретный ключ** через открытый (небезопасный) канал. Гениально то, что подслушивающий не может вычислить этот ключ, даже если слышит весь обмен.","**Предложен** Уитфилдом Диффи и Мартином Хеллманом в 1976 году. Это была первая практическая схема асимметричной криптографии.","**Зачем нужен.** Главная проблема симметричного шифрования — как передать ключ? Если у двух людей ещё нет общего ключа, они не могут обмениваться данными безопасно. Диффи-Хеллман решает эту проблему.","**Идея — аналогия с красками.** Алиса и Боб хотят общий секретный цвет. Они договариваются о публичном цвете (например, жёлтый). Алиса берёт свой секретный цвет (красный) и смешивает с жёлтым — получает оранжевый, посылает Бобу. Боб берёт свой секретный (синий) и смешивает с жёлтым — получает зелёный, посылает Алисе. Алиса добавляет к полученному зелёному свой красный, Боб добавляет к оранжевому свой синий. Оба получают **один и тот же цвет**. Подслушивающий видит жёлтый, оранжевый, зелёный, но не может вычислить красный или синий, потому что «разделить смесь» практически невозможно.","**Математически.** Используется модульная арифметика.","**Шаг 1. Публичные параметры.** Выбираются большое простое число p и число g (generator, генератор группы). Эти числа публичны — любой их знает.","**Шаг 2. Секретные ключи.** Алиса выбирает случайное число a (секретное), Боб — b (секретное).","**Шаг 3. Публичные ключи.** Алиса вычисляет A = g^a mod p и посылает Бобу. Боб вычисляет B = g^b mod p и посылает Алисе.","**Шаг 4. Общий секрет.** Алиса вычисляет K = B^a mod p. Боб вычисляет K = A^b mod p. Получается одно и то же число: K = g^(ab) mod p. Это и есть их общий секретный ключ.","**Почему это безопасно.** Подслушивающий знает p, g, A, B. Чтобы найти K, ему нужно решить **проблему дискретного логарифма**: по A = g^a mod p найти a. Для больших p (2048 бит и более) это практически невозможно даже на суперкомпьютерах.","**Уязвимость — атака MITM.** Чистый Диффи-Хеллман **не защищает от атаки «человек посередине»**. Злоумышленник Ева может вставить себя между Алисой и Бобом, заменить их публичные ключи своими, и согласовать разные ключи с обоими. Они будут думать, что разговаривают друг с другом, но на самом деле с Евой.","**Решение.** Чтобы защититься от MITM, публичные ключи нужно **аутентифицировать** — например, подписывать цифровой подписью. Так делает TLS: DH-обмен комбинируется с сертификатом сервера.","**ECDH (Elliptic Curve Diffie-Hellman).** Вариант Диффи-Хеллмана на эллиптических кривых. Тот же принцип, но в группе точек кривой. Преимущество — меньше ключ при той же стойкости: 256-битный ECDH ≈ 3072-битный классический DH.","**Forward Secrecy.** Диффи-Хеллман часто используется в режиме **эфемерных ключей** (DHE, ECDHE): a и b — новые для каждой сессии, потом удаляются. Это обеспечивает Forward Secrecy: если долгосрочный ключ сервера украден, старые сессии остаются защищёнными.","**Применение.** TLS 1.3 (обязательно), IPSec (IKE), SSH, WireGuard VPN, Signal (мессенджер)."],"terms":[{"ru":"Диффи-Хеллман","en":"Diffie-Hellman","df":"протокол согласования общего ключа через открытый канал"},{"ru":"ECDH","en":"Elliptic Curve Diffie-Hellman","df":"вариант DH на эллиптических кривых — короткие ключи"},{"ru":"DHE/ECDHE","en":"Ephemeral DH/ECDH","df":"эфемерные (временные) ключи для Forward Secrecy"},{"ru":"Дискретный логарифм","en":"Discrete Logarithm","df":"математическая задача, на сложности которой основана безопасность DH"}],"summary":["","**Суть:** Протокол согласования общего секрета через открытый канал.","","**Предложен:** Уитфилд Диффи и Мартин Хеллман, 1976. Первая практическая схема асимметричной крип
