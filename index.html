корости 100 Мбит/с – 1 Гбит/с. Голос: **VoLTE** через IMS (SIP/RTP).\n- **5G NR** (New Radio, 2019, 3GPP Rel-15+) — две полосы: **FR1** до 7,125 ГГц и **FR2** (mmWave 24–52 ГГц). Технологии: **Massive MIMO** (256+ антенн), beamforming, гибкая нумерология OFDM (Δf 15/30/60/120 кГц), **network slicing** (виртуальные сети под задачи). Три сценария ITU-R IMT-2020:\n  - **eMBB** (enhanced Mobile Broadband) — пиковая скорость до 20 Гбит/с.\n  - **URLLC** (Ultra-Reliable Low-Latency Communication) — задержка <1 мс, надёжность 99,999%; для промышленной автоматизации, V2X.\n  - **mMTC** (massive Machine-Type Communications) — до 1 млн устройств/км² для IoT.\n- **6G** (исследования; ожидается ~2030): субтерагерц (100–300 ГГц), интегрированные сенсорика и связь (ISAC), AI-RAN."], "terms": [{"ru": "Сота", "en": "cell", "df": "географическая зона, обслуживаемая одной базовой станцией"}, {"ru": "Кластер", "en": "cluster", "df": "группа сот, в которой разнесён весь спектр; коэффициент переиспользования 1/N"}, {"ru": "Базовая станция", "en": "BTS/NodeB/eNodeB/gNodeB", "df": "стационарная радиостанция сотовой сети"}, {"ru": "Хэндовер", "en": "handover / handoff", "df": "переключение соединения между базовыми станциями при движении абонента"}, {"ru": "Роуминг", "en": "roaming", "df": "обслуживание абонента в сети другого оператора"}, {"ru": "EPC", "en": "Evolved Packet Core", "df": "ядро сети LTE (MME, S-GW, P-GW, HSS)"}, {"ru": "GSM", "en": "Global System for Mobile Communications", "df": "стандарт цифровой сотовой связи 2G"}, {"ru": "MIMO / Massive MIMO", "en": "Multiple Input Multiple Output", "df": "технология с несколькими передающими и принимающими антеннами"}], "summary": ["**Сотовая система** — радиосеть для мобильных абонентов; территория делится на **соты** с **БС**", "Соседние соты — разные частоты, удалённые переиспользуют → ёмкость на ограниченном спектре", "**Кластер** N сот = i²+ij+j² (типично 3/7/12); коэффициент переиспользования 1/N", "Радиус соты: 50 м (фемто-офис) до 30 км (макро-село); **секторизация** (120°/60° антенны)", "**HetNet**: макро/микро/пико/фемто наложены для управления плотностью трафика", "**RAN** = BS + контроллеры (BSC в GSM, RNC в 3G); **Core**: 2G — MSC/HLR/VLR; LTE — **EPC** (MME/S-GW/P-GW/HSS); 5G — AMF/SMF/UPF/AUSF/UDM (SBA)", "Аутентификация через **SIM/USIM/eSIM**: хранит **IMSI** и ключ Ki; шлюзы GMSC (→ТФОП), P-GW/UPF (→интернет)", "**Хэндовер**: hard (GSM/LTE, break-before-make), soft (CDMA, make-before-make, связь с несколькими БС)", "Роуминг (MAP/SS7), location update (LA), пейджинг, **power control**", "**1G** (1980-е): аналог FM, **AMPS** (США, 800 МГц), **NMT** 450/900, TACS; только голос, прослушивается", "**2G GSM** (1991, ETSI): цифра, **TDMA 8 слотов на 200 кГц** + FDMA 900/1800 МГц, Full-Rate 13 кбит/с, **SMS**, A5/1, SIM", "Альтернатива 2G — **IS-95/cdmaOne** (CDMA); данные: **GPRS** (2,5G, 114 кбит/с), **EDGE** (2,75G, 384 кбит/с)", "**3G UMTS/WCDMA** (3GPP, 2001, 5 МГц несущая): 2 Мбит/с; **HSPA+** до 42 Мбит/с; в США — CDMA2000 EV-DO", "**4G LTE** (2009): IP-only, **OFDMA** down + SC-FDMA up, **MIMO 4×4**, полосы 1,4–20 МГц + carrier aggregation; голос — **VoLTE** через IMS", "**5G NR** (Rel-15+, 2019): FR1 <7,125 ГГц + FR2 mmWave 24–52 ГГц; **Massive MIMO** 256+, beamforming, гибкая нумерология", "Сценарии IMT-2020: **eMBB** (до 20 Гбит/с), **URLLC** (<1 мс, 99,999%, V2X), **mMTC** (1 млн устр./км² IoT); **network slicing**", "**6G** (~2030): субтерагерц 100–300 ГГц, ISAC (сенсорика+связь), AI-RAN"]}, {"n": 14, "title": "Характеристики физических каналов связи. Типы каналов связи.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Физический канал связи** (physical communication channel) — материальная или нематериальная среда, по которой передаётся сигнал, переносящий информацию, и тракт оборудования (передатчик, среда, приёмник), вносящий в этот сигнал собственные искажения. Канал характеризуется набором количественных параметров, определяющих его **информационную ёмкость**, надёжность и применимость для тех или иных задач, а также классифицируется по среде, направлению передачи, типу сигнала и способу мультиплексирования.", "<h3>Ключевые количественные характеристики</h3>", "- **Полоса пропускания** (bandwidth, B, в Гц) — диапазон частот, в котором канал имеет приемлемое затухание (обычно по уровню −3 дБ). Это «сырая» физическая ширина полосы; именно она входит в формулы Найквиста и Шеннона. В сетевом жаргоне «bandwidth» иногда употребляется и как синоним пропускной способности (в бит/с) — это путаница, которой следует избегать.\n- **Пропускная способность** (channel capacity, C, бит/с) — максимальная достижимая скорость безошибочной передачи; теоретически ограничена C = B·log₂(1+SNR).\n- **Реальная пропускная способность / goodput** (throughput) — фактическая скорость доставки полезных данных приложению; всегда меньше C из-за заголовков, повторов, контроля перегрузки.\n- **Задержка / латентность** (latency / delay): складывается из четырёх компонент:\n  - задержка распространения (propagation delay) = длина / скорость распространения;\n  - задержка передачи (transmission delay) = размер пакета / скорость канала;\n  - задержка обработки в узлах;\n  - задержка ожидания в очередях.\n- **Джиттер** (jitter) — статистический разброс задержки во времени; критичен для VoIP и видео.\n- **Затухание** (attenuation) — уменьшение мощности сигнала; в дБ: 10·log₁₀(P_in/P_out). В кабелях измеряется в дБ/км, зависит от частоты.\n- **SNR** (Signal-to-Noise Ratio, отношение сигнал/шум) — определяет шенноновский потолок; в дБ.\n- **BER** (Bit Error Rate, коэффициент битовых ошибок) — доля ошибочно принятых битов; для оптики 10⁻¹² – 10⁻¹⁵, для радио 10⁻³ – 10⁻⁶ до коррекции FEC.\n- **Произведение полосы на задержку** (bandwidth-delay product, BDP) — объём данных «в полёте» в канале; определяет минимально необходимое окно для полной утилизации канала. BDP = C · RTT.\n- **Симметрия** — равны ли скорости в двух направлениях (симметричный/асимметричный канал, как ADSL).", "<h3>Классификация по режиму передачи</h3>", "- **Симплекс** (simplex) — передача только в одном направлении (радио- и телевещание).\n- **Полудуплекс** (half-duplex) — двусторонняя, но поочерёдная передача; пример — рация. Wi-Fi одного канала тоже работает полудуплексно.\n- **Дуплекс / полный дуплекс** (full-duplex) — одновременная передача в обе стороны: либо две физические линии, либо два разных диапазона (**FDD**, Frequency Division Duplex), либо разделение во времени с короткими интервалами (**TDD**, Time Division Duplex). Современный коммутируемый Ethernet и LTE/5G — дуплексные.", "<h3>Классификация по типу сигнала и среде</h3>", "- **Аналоговый канал** — переносит непрерывный сигнал (телефонная пара POTS, аналоговое ТВ).\n- **Цифровой канал** — переносит дискретные символы; внутри может быть аналоговая физика, но интерфейс цифровой.\n- **Проводные среды**: витая пара, коаксиал, оптоволокно, линии электропитания (PLC).\n- **Беспроводные среды**: радио, микроволны, ИК, видимый свет, лазер (FSO).\n- **Спутниковые** — отдельная категория с большими задержками распространения.", "<h3>Физические искажения и эффекты</h3>", "- **Замирание** (fading) — случайное изменение амплитуды сигнала в беспроводном канале. **Большое масштабное** (large-scale) — от тени и расстояния; **малое масштабное** (small-scale, Рэлеевское/Райсовское) — от многолучевости.\n- **Многолучевое распространение** (multipath propagation) — приход сигнала по нескольким путям с разными задержками; вызывает замирания и **межсимвольную интерференцию** (ISI). Решения: эквалайзер, OFDM, MIMO.\n- **Доплеровский сдвиг** — сдвиг частоты при движении приёмника/передатчика.\n- **Дисперсия** (dispersion) в оптоволокне — уширение светового импульса из-за разных скоростей мод (модовая дисперсия в MMF) или длин волн (хроматическая, поляризационная в SMF).\n- **Тепловой шум** (Johnson–Nyquist noise) — фундаментальный шум сопротивлений: P_N = kTB.\n- **Перекрёстные наводки** (crosstalk, NEXT/FEXT) в витой паре.\n- **Внешние помехи** (EMI) — наводки от соседних кабелей и устройств.", "<h3>Стандартные параметры типовых каналов</h3>", "| Канал | Полоса/скорость | Задержка | BER (типичный) |\n|---|---|---|---|\n| POTS (телефония) | 3 кГц / до 56 кбит/с | <10 мс | 10⁻⁵ |\n| ADSL2+ | 1 МГц / до 24 Мбит/с | 20–40 мс | 10⁻⁷ |\n| Cat6 Ethernet | до 250 МГц / 10 Гбит/с | <1 мс | 10⁻¹² |\n| SMF на 1550 нм | ТГц / 100+ Гбит/с | ~5 мс/1000 км | 10⁻¹⁵ |\n| LTE | 1,4–20 МГц / до 1 Гбит/с | 20–40 мс | 10⁻³ до FEC |\n| GEO-спутник | сотни МГц | 270 мс RTT | 10⁻⁶ |"], "terms": [{"ru": "Полоса пропускания", "en": "bandwidth", "df": "диапазон частот, в котором канал обеспечивает передачу (в Гц)"}, {"ru": "Пропускная способность", "en": "channel capacity", "df": "теоретический максимум скорости; для goodput используется **throughput**"}, {"ru": "Задержка / латентность", "en": "latency / delay", "df": "время от отправки до получения сигнала; состоит из propagation/transmission/processing/queueing"}, {"ru": "Джиттер", "en": "jitter", "df": "вариация задержки доставки пакетов во времени"}, {"ru": "Затухание", "en": "attenuation", "df": "уменьшение амплитуды/мощности сигнала при распространении по среде"}, {"ru": "SNR", "en": "Signal-to-Noise Ratio", "df": "отношение мощности сигнала к мощности шума, в дБ"}, {"ru": "BER", "en": "Bit Error Rate", "df": "коэффициент ошибок по битам; доля ошибочно принятых бит"}, {"ru": "BDP", "en": "Bandwidth-Delay Product", "df": "произведение полосы канала на RTT, объём «бит в полёте»"}, {"ru": "Симплекс", "en": "simplex", "df": "передача только в одном направлении"}, {"ru": "Полудуплекс", "en": "half-duplex", "df": "попеременная передача в двух направлениях"}, {"ru": "Дуплекс", "en": "full-duplex", "df": "одновременная двусторонняя передача"}, {"ru": "FDD / TDD", "en": "Frequency / Time Division Duplex", "df": "дуплекс через частотное / временное разделение"}, {"ru": "Замирание", "en": "fading", "df": "случайное изменение уровня сигнала в беспроводных каналах"}, {"ru": "Многолучевое распространение", "en": "multipath propagation", "df": "приход сигнала по нескольким путям с разными задержками; причина замираний и ISI"}, {"ru": "Доплеровский сдвиг", "en": "Doppler shift", "df": "изменение частоты при относительном движении"}, {"ru": "Дисперсия", "en": "dispersion", "df": "уширение светового импульса в оптоволокне из-за различных скоростей мод/длин волн"}, {"ru": "Тепловой шум", "en": "thermal noise, Johnson–Nyquist", "df": "шум сопротивлений; P = kTB"}], "summary": ["**Физический канал** — среда + тракт оборудования, вносящий искажения; характеристики определяют ёмкость и применимость", "**Полоса пропускания** (B, Гц) — по уровню −3 дБ; входит в Найквиста/Шеннона; ≠ пропускной способности в бит/с", "**Пропускная способность** C (бит/с) = B·log₂(1+SNR); реальный **throughput/goodput** меньше (заголовки, повторы, congestion)", "**Задержка** = распространение (длина/v) + передача (размер/скорость) + обработка + очереди", "**Джиттер** — статистический разброс задержки; критичен для VoIP/видео", "**Затухание** (attenuation) в дБ: 10·log₁₀(P_in/P_out); в кабеле дБ/км", "**SNR** в дБ — определяет шенноновский потолок; **BER** — доля ошибочных бит", "BER типично: 10⁻¹²÷10⁻¹⁵ оптика, 10⁻³÷10⁻⁶ радио до FEC", "**BDP** (Bandwidth-Delay Product) = C·RTT — объём «в полёте», минимальное окно для полной утилизации", "Симметрия канала: ADSL — асимметричный, Ethernet — симметричный", "**Режимы передачи**: симплекс (радио/ТВ-вещание), полудуплекс (рация, Wi-Fi одного канала), дуплекс", "Дуплекс: две линии, **FDD** (две частоты — LTE), **TDD** (временное разделение — TD-LTE, 5G TDD)", "По сигналу: аналоговые (POTS, аналог. ТВ) vs цифровые (внутри может быть аналог)", "По среде: проводные (витая пара, коаксиал, оптика, PLC) vs беспроводные (радио, ИК, видимый, FSO) vs спутниковые", "**Замирания** (fading): large-scale (тень/расстояние); small-scale (Рэлеевское/Райсовское из multipath)", "**Multipath** → замирания + ISI; борьба — эквалайзер, **OFDM**, **MIMO**", "**Доплер** при движении; **дисперсия** в волокне (модовая MMF, хроматическая/поляризационная SMF)", "**Тепловой шум** Джонсона-Найквиста: P_N = kTB; **crosstalk** (NEXT/FEXT) в UTP; EMI снаружи", "Типовые: POTS 3 кГц/56k/RTT<10мс; ADSL2+ 24 Мбит/20–40мс; Cat6 10 Гбит; SMF Тбит/5 мс на 1000 км; GEO 270 мс RTT"]}], "quizzes": []}, {"id": 3, "name": "Канальный уровень сетевого стека", "questions": [{"n": 15, "title": "Ключевые аспекты и особенности организации канального уровня. Сервисы, предоставляемые сетевому уровню. Формирование кадра. Обработка ошибок. Управление потоком.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Канальный уровень** (Data Link Layer, L2 модели OSI) превращает «сырую» битовую последовательность физического уровня в **надёжный канал между двумя непосредственно соединёнными узлами**. Он скрывает от сетевого уровня шумы, ошибки и переменную пропускную способность канала, предоставляя ему услугу передачи пакетов в виде дискретных **кадров** (frames). Канальный уровень обычно делится на два подуровня: **LLC** (Logical Link Control, IEEE 802.2) — единый интерфейс к L3 и контроль соединения, и **MAC** (Media Access Control) — управление доступом к разделяемой среде. Основные функции уровня: формирование кадров (framing), обнаружение/коррекция ошибок, управление потоком, адресация (MAC-адреса) и управление доступом.", "<h3>Сервисы, предоставляемые сетевому уровню</h3>", "Канальный уровень может предложить три класса служб:", "- **Ненадёжная доставка без подтверждений** (unacknowledged connectionless) — кадры просто шлются, потерянные не восстанавливаются. Используется на высоконадёжных каналах (Ethernet, оптика), а также для трафика реального времени, где повторная передача бесполезна (голос).\n- **Надёжная доставка без соединения** (acknowledged connectionless) — каждый кадр получает индивидуальное подтверждение (ACK), но логического соединения не устанавливается. Применяется в шумных средах: 802.11 Wi-Fi.\n- **Надёжная доставка с соединением** (acknowledged connection-oriented) — три фазы: установление соединения, передача нумерованных кадров с подтверждениями, разрыв. Гарантирует доставку каждого кадра ровно один раз и в правильном порядке. Пример: классический HDLC NRM, LLC Type 2.", "<h3>Формирование кадра (framing)</h3>", "Поскольку физический уровень оперирует только битами, канальному нужно разметить поток на границы кадров. Четыре основных метода:", "- **Счётчик символов** (character count) — поле в заголовке указывает длину кадра в байтах. Уязвимо: одна ошибка в счётчике рассинхронизирует все последующие кадры.\n- **Флаговые байты + байт-стаффинг** (byte/character stuffing) — кадр обрамлён специальным **FLAG**-байтом. Если такой байт встречается внутри полезной нагрузки, перед ним вставляется **ESC**-байт; ESC внутри — тоже экранируется. Применяется в **PPP** (Point-to-Point Protocol, RFC 1662) — байт 0x7E как FLAG, 0x7D как ESC.\n- **Флаговые биты + бит-стаффинг** (bit stuffing) — разделитель **01111110** (0x7E). Чтобы такой паттерн не возник в данных, передатчик после **пяти подряд идущих единиц** вставляет «0», а приёмник его удаляет. Используется в **HDLC** (High-level Data Link Control, ISO 13239) — родительском протоколе для PPP в HDLC-режиме, Frame Relay, LAPB, LAPD.\n- **Нарушения физического кодирования** (coding violations) — резервируются «запрещённые» комбинации линейного кода (например, в 4B/5B символы JK для начала кадра, TR — для конца). Используется в IEEE 802.3, 802.5.", "Часто комбинируется несколько методов: Ethernet использует 7-байтовую **преамбулу** для синхронизации, байт **SFD** (Start Frame Delimiter, 0xAB) как маркер начала и поле длины — для конца.", "<h3>Обработка ошибок</h3>", "Два подхода:\n- **FEC** (Forward Error Correction) — упреждающая коррекция: к данным добавляют избыточные биты, позволяющие приёмнику самостоятельно исправить часть ошибок без обращения к отправителю. Подходит для каналов с большой задержкой (спутник, DTN) или односторонней связи. Используются коды Хэмминга, Рида-Соломона, свёрточные, LDPC, турбокоды.\n- **ARQ** (Automatic Repeat reQuest) — обнаружение ошибки (CRC, чётность) + запрос повторной передачи через подтверждения/таймеры. Подходит для двусторонних каналов с умеренной задержкой. Варианты: Stop-and-Wait, Go-Back-N, Selective Repeat (см. Q17–Q18).", "В современных системах применяется **Hybrid ARQ** (HARQ): сначала FEC пытается исправить, при неудаче — ARQ запрашивает повтор.", "<h3>Управление потоком</h3>", "**Flow control** не позволяет быстрому отправителю переполнить буферы медленного получателя. Реализации:\n- **Обратная связь от приёмника** (feedback-based) — приёмник явно сообщает, сколько ещё кадров он может принять (XON/XOFF, кадры RR/RNR в HDLC, окно в TCP). Базовый механизм скользящего окна.\n- **Управление по скорости** (rate-based) — отправителю заранее назначен максимальный темп; обратной связи нет (применяется в ATM).\n- **Аппаратное управление потоком** Ethernet (IEEE 802.3x) — кадры **PAUSE** заставляют партнёра приостановить передачу на заданное число квантов.", "Управление потоком тесно связано, но отлично от **контроля перегрузки** (congestion control): первое защищает конкретного получателя, второе — сеть в целом (Q44).", "<h3>Дополнительные функции и адресация</h3>", "- **Адресация** на L2 — **MAC-адреса** (48 бит в Ethernet, 64 бит в Bluetooth/802.15.4). Адрес назначения может быть **unicast**, **multicast** (групповая рассылка) или **broadcast** (FF:FF:FF:FF:FF:FF).\n- **Демультиплексирование** в верхний уровень — поле EtherType/SNAP-LLC.\n- **Управление доступом** к разделяемой среде (CSMA/CD, CSMA/CA, Token Passing) — функция MAC-подуровня (Q21–Q22)."], "terms": [{"ru": "Канальный уровень", "en": "data link layer", "df": "второй уровень модели OSI, отвечает за передачу кадров между соседними узлами"}, {"ru": "Кадр", "en": "frame", "df": "единица данных канального уровня, содержит заголовок, полезную нагрузку и трейлер"}, {"ru": "LLC", "en": "Logical Link Control", "df": "верхний подуровень канального уровня, единый интерфейс к L3"}, {"ru": "MAC", "en": "Media Access Control", "df": "нижний подуровень, управляет доступом к разделяемой среде"}, {"ru": "Инкапсуляция", "en": "encapsulation", "df": "упаковка данных вышестоящего уровня в структуру нижестоящего уровня"}, {"ru": "Байт-стаффинг", "en": "byte stuffing", "df": "вставка escape-байта перед специальными символами внутри кадра (PPP)"}, {"ru": "Бит-стаффинг", "en": "bit stuffing", "df": "вставка нулевого бита после пяти подряд идущих единиц (HDLC)"}, {"ru": "HDLC", "en": "High-level Data Link Control", "df": "стандарт канального уровня ISO 13239, родитель PPP и Frame Relay"}, {"ru": "PPP", "en": "Point-to-Point Protocol", "df": "RFC 1661/1662, протокол точка-точка"}, {"ru": "ARQ", "en": "Automatic Repeat reQuest", "df": "автоматический запрос повторной передачи при обнаружении ошибки"}, {"ru": "FEC", "en": "Forward Error Correction", "df": "упреждающая коррекция ошибок без запроса повтора"}, {"ru": "HARQ", "en": "Hybrid ARQ", "df": "комбинация FEC и ARQ"}, {"ru": "Управление потоком", "en": "flow control", "df": "механизм согласования скоростей отправителя и получателя"}, {"ru": "PAUSE-кадр", "en": "IEEE 802.3x", "df": "Ethernet-механизм приостановки передачи партнёром"}], "summary": ["**Канальный уровень** (L2 OSI) — превращает «сырые» биты PHY в надёжный канал между соседними узлами в виде кадров", "Делится на два подуровня: **LLC** (IEEE 802.2, интерфейс к L3) и **MAC** (управление доступом к среде)", "Функции: framing, error control, flow control, MAC-адресация, доступ к среде", "**Три сервиса для L3**: ненадёжный без ACK (Ethernet, оптика, real-time); надёжный без соединения с покадровым ACK (Wi-Fi); надёжный с соединением (HDLC NRM, LLC Type 2)", "**Framing — 4 метода**: счётчик символов (хрупкий); флаг + **байт-стаффинг** (PPP, 0x7E=FLAG, 0x7D=ESC); флаг + **бит-стаффинг**; нарушения кодирования", "Бит-стаффинг **HDLC** (ISO 13239): флаг 01111110, после 5 единиц вставляется 0; используется в Frame Relay, LAPB, LAPD", "Ethernet: 7-байт **преамбула** + **SFD** (0xAB) + длина — комбинация методов", "**Обработка ошибок**: **FEC** (упреждающая, Хэмминг/RS/LDPC/Turbo — для спутника/DTN); **ARQ** (повтор по таймеру — Stop-and-Wait, GBN, SR); **HARQ** = FEC+ARQ (LTE/5G/Wi-Fi)", "**Flow control**: feedback-based (XON/XOFF, RR/RNR HDLC, окно TCP); rate-based (ATM); **PAUSE-кадры 802.3x**", "Flow control ≠ congestion control: первый защищает получателя, второй — сеть", "**MAC-адресация**: 48 бит (Ethernet, OUI+NIC), 64 бит (BT/802.15.4); типы — unicast, multicast, broadcast FF:FF:FF:FF:FF:FF", "Демультиплексирование в L3 через поле **EtherType** или SNAP-LLC"]}, {"n": 16, "title": "Коды с исправлением ошибок. Коды с обнаружением ошибок.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "Каналы связи всегда вносят искажения: тепловой шум переворачивает отдельные биты, импульсные помехи разрушают целые пакеты битов (**пакетная ошибка**, burst error), затухание ухудшает SNR. **Помехоустойчивое кодирование** (error-control coding) — добавление к данным избыточных битов таким образом, чтобы приёмник мог либо **обнаружить** (detect), либо **исправить** (correct) часть ошибок без обращения к отправителю. Все коды основаны на простой идее: из всех 2ⁿ возможных n-битовых слов «разрешёнными» (codewords) объявляются лишь 2ᵏ, разнесённые в пространстве так, чтобы любая малая ошибка переводила разрешённое слово в неразрешённое.", "<h3>Кодовое расстояние Хэмминга</h3>", "**Расстояние Хэмминга** (Hamming distance) d(x, y) между двумя двоичными словами — число позиций, в которых они различаются. Минимальное расстояние кода d_min определяет его корректирующие свойства:", "- Чтобы **обнаружить** d ошибок → d_min ≥ d + 1 (после d искажений слово ещё не совпадёт ни с каким другим разрешённым).\n- Чтобы **исправить** t ошибок → d_min ≥ 2t + 1 (искажённое слово ближе к исходному, чем к любому другому).", "Например, для исправления одной ошибки нужно d_min = 3; для исправления двух — d_min = 5. Стоимость — **избыточность** r/n (доля контрольных битов).", "<h3>Коды с исправлением ошибок (FEC)</h3>", "- **Код Хэмминга (n, k)** (Hamming code, 1950) — классический линейный (7,4)-код: 4 информационных + 3 контрольных бита, d<sub>min</sub> = 3, исправляет одну ошибку. Контрольные биты стоят на позициях-степенях двойки (1, 2, 4, …); каждый отвечает за чётность определённого подмножества позиций. Общая формула: для m информационных бит требуется r контрольных, где 2<sup>r</sup> ≥ m + r + 1.\n- **Расширенный код Хэмминга** — добавляет общий бит чётности, доводя d_min до 4: исправляет одну, обнаруживает две ошибки (SEC-DED, используется в ECC-памяти серверов).\n- **Циклические коды БЧХ** (BCH) и **Рида-Соломона** (Reed-Solomon, RS(n, k)) — работают над байтами/символами, исправляют (n−k)/2 символьных ошибок, отлично справляются с **пакетными ошибками**. Применяются в CD/DVD/Blu-ray, QR-кодах, DVB-T, спутниковых каналах, RAID-6.\n- **Свёрточные коды** (convolutional codes) — кодер с памятью: выходные биты — линейные комбинации текущих и нескольких предыдущих входных. Декодирование алгоритмом Витерби. Используются в GSM, Wi-Fi, спутниковой связи.\n- **Турбокоды** (Turbo, 1993) — параллельная конкатенация двух свёрточных кодеров с перемежением; итеративное декодирование. Стандарт UMTS, LTE.\n- **LDPC** (Low-Density Parity-Check, Gallager 1960, ревизия 1996) — длинные блочные коды с разреженной матрицей проверок, итеративное «message passing» декодирование. Приближаются к шенноновскому пределу на 0,1–0,5 дБ; используются в Wi-Fi 5/6, 5G NR (data channels), DVB-S2, 10GBASE-T.\n- **Polar-коды** (Arıkan 2009) — единственные коды с доказанным достижением шенноновского предела при n→∞; стандарт для управляющих каналов 5G NR.", "<h3>Коды с обнаружением ошибок</h3>", "- **Бит чётности** (parity bit) — один дополнительный бит, делающий общее число единиц чётным (even parity) или нечётным (odd parity). Обнаруживает любое нечётное число ошибок, бессилен против чётного.\n- **Двумерная чётность** (block parity / two-dimensional parity) — биты в матрице, чётность по строкам и столбцам. Обнаруживает все одиночные, двойные, тройные ошибки и большинство пакетных; может исправить одиночную ошибку (пересечение «плохой» строки и «плохого» столбца).\n- **Контрольная сумма** (checksum) — арифметическая сумма всех слов по модулю 2¹⁶ с инверсией (Internet checksum, RFC 1071). Используется в IP, TCP, UDP. Слабая защита (не ловит перестановки слов и парные ошибки), но дёшева в реализации.\n- **CRC** (Cyclic Redundancy Check, циклический избыточный код) — деление сообщения как многочлена над GF(2) на фиксированный **порождающий полином** g(x). Остаток (длиной r бит) — контрольная сумма CRC. Свойства CRC длины r:\n  - обнаруживает **все одиночные** и **все двойные** ошибки;\n  - обнаруживает все пакетные ошибки длины ≤ r;\n  - обнаруживает все ошибки нечётной кратности (если g(x) делится на x+1);\n  - вероятность пропуска пакетной ошибки длины > r ≈ 2⁻ʳ.\n  Стандартные полиномы: **CRC-16-CCITT** (g(x)=x¹⁶+x¹²+x⁵+1) — HDLC, X.25; **CRC-32 (IEEE 802.3)** — Ethernet, ZIP; **CRC-32C** — iSCSI, SCTP. Аппаратно реализуется простым сдвиговым регистром с XOR-обратными связями — критически важная характеристика для гигабитных скоростей.", "<h3>Когда что применять</h3>", "| Канал | Типичный выбор |\n|---|---|\n| Проводной Ethernet | CRC-32 (обнаружение) + ARQ на уровне TCP |\n| Wi-Fi, LTE/5G | CRC + свёрточный/турбо/LDPC + HARQ |\n| Спутник, DVB | RS + свёрточный (конкатенация) или LDPC |\n| Память DRAM | Hamming SEC-DED |\n| CD/DVD/QR | Reed-Solomon (стойкий к пакетным ошибкам — царапинам) |"], "terms": [{"ru": "Избыточные биты", "en": "redundant bits", "df": "дополнительные биты, добавляемые для обнаружения/исправления ошибок"}, {"ru": "Кодовое расстояние Хэмминга", "en": "Hamming distance", "df": "число позиций, в которых два кодовых слова различаются"}, {"ru": "Кодовое слово", "en": "codeword", "df": "допустимая комбинация из множества 2ᵏ разрешённых"}, {"ru": "Скорость кода", "en": "code rate", "df": "отношение k/n информационных бит к общему числу"}, {"ru": "Код Хэмминга", "en": "Hamming code", "df": "линейный код с исправлением одиночных ошибок (SEC), SEC-DED — с обнаружением двойных"}, {"ru": "БЧХ / Рида-Соломона", "en": "BCH / Reed-Solomon", "df": "циклические блочные коды, RS работает над символами"}, {"ru": "Свёрточный код", "en": "convolutional code", "df": "код с памятью; декодируется алгоритмом Витерби"}, {"ru": "Турбокоды", "en": "turbo codes", "df": "итеративные коды, близкие к пределу Шеннона (UMTS, LTE)"}, {"ru": "LDPC", "en": "Low-Density Parity-Check", "df": "длинные блочные коды с разреженной матрицей; Wi-Fi 6, 5G, DVB-S2"}, {"ru": "Бит чётности", "en": "parity bit", "df": "контрольный бит, обеспечивающий чётное (или нечётное) число единиц"}, {"ru": "CRC", "en": "Cyclic Redundancy Check", "df": "циклический избыточный код, основанный на полиномиальном делении"}, {"ru": "Порождающий полином", "en": "generator polynomial", "df": "полином, на который делится сообщение при вычислении CRC"}, {"ru": "Пакетная ошибка", "en": "burst error", "df": "последовательность подряд идущих ошибочных битов"}, {"ru": "HARQ", "en": "Hybrid ARQ", "df": "комбинация FEC и повторных передач"}], "summary": ["**Помехоустойчивое кодирование** — добавление избыточных бит, чтобы обнаружить/исправить ошибки; из 2ⁿ слов разрешены 2ᵏ", "**Расстояние Хэмминга** d(x,y) — число позиций различий; d<sub>min</sub> определяет свойства кода", "Обнаружение d ошибок: **d<sub>min</sub> ≥ d+1**; исправление t ошибок: **d<sub>min</sub> ≥ 2t+1**", "Избыточность r/n — цена коррекции; для исправления 1 ошибки d<sub>min</sub>=3, для 2 ошибок d<sub>min</sub>=5", "**Код Хэмминга (n,k)** (1950): контрольные биты на позициях степеней 2 (1,2,4...), **2<sup>r</sup> ≥ m+r+1**", "Расширенный Хэмминга (**SEC-DED**) — d<sub>min</sub>=4, исправляет 1 + обнаруживает 2; в ECC-памяти серверов", "**Рида-Соломона (n,k)** — циклические коды над символами, исправляют (n−k)/2; CD/DVD/QR/DVB-T/RAID-6, отлично с пакетными", "**Свёрточные** — кодер с памятью, декодирование **Витерби**; GSM, Wi-Fi, спутник", "**Турбокоды** (1993) — параллельные свёрточные + перемежение, итеративное декодирование; UMTS, LTE", "**LDPC** (Gallager 1960, ревизия 1996) — разреженная матрица проверок, итер. message passing; Wi-Fi 5/6, **5G NR data**, DVB-S2, 10GBASE-T", "**Polar-коды** (Arıkan 2009) — доказанно достигают предела Шеннона; **5G NR control channels**", "**Бит чётности** (parity) — обнаруживает любое нечётное число ошибок", "**Двумерная чётность** (2D-parity) — может исправить 1 ошибку (пересечение «плохой» строки и столбца)", "**Internet checksum** (RFC 1071) — арифметическая сумма по mod 2¹⁶; в IP/TCP/UDP; слабая", "**CRC** — деление полинома над GF(2) на порождающий g(x); остаток r бит", "Свойства CRC длины r: все одиночные/двойные/нечётные ошибки; все пакетные ≤ r; пакетная > r с вероятностью пропуска ≈ 2⁻ʳ", "Стандарты: **CRC-16-CCITT** (HDLC/X.25), **CRC-32 IEEE 802.3** (Ethernet/ZIP), CRC-32C (iSCSI/SCTP)", "Применение: проводной Ethernet — CRC-32 + ARQ TCP; Wi-Fi/LTE — CRC+турбо/LDPC+HARQ; DRAM — Hamming SEC-DED; CD/QR — RS"]}, {"n": 17, "title": "Элементарные протоколы: симплексный протокол «Утопия», симплексный протокол с ожиданием для канала без ошибок, симплексный протокол с ожиданием для зашумлённых каналов.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "Чтобы пошагово показать механику канального уровня, в учебнике Таненбаума рассматривается серия **трёх простейших симплексных протоколов**, каждый из которых добавляет ровно одну новую возможность по сравнению с предыдущим. Симплексные — значит данные передаются только в одну сторону (от отправителя к получателю), хотя для управления могут идти короткие подтверждения в обратном направлении. На этих учебных протоколах последовательно вводятся понятия **управления потоком**, **подтверждений**, **таймера повторной передачи** и **нумерации кадров**, которые лежат в основе всех реальных протоколов скользящего окна (Q18), TCP и HDLC.", "<h3>1. Протокол «Утопия» (Utopia, unrestricted simplex protocol)</h3>", "Идеальный мысленный эксперимент:\n- Канал **без ошибок**, бит передаётся без искажений.\n- Получатель **бесконечно быстрый** и всегда готов принимать.\n- Не нужны ни ACK, ни таймеры, ни нумерация.", "Отправитель в цикле берёт пакет у сетевого уровня, упаковывает в кадр и отдаёт физическому уровню. Получатель в цикле принимает кадр и отдаёт пакет наверх. Алгоритм состоит буквально из двух операторов в каждом узле.", "**Зачем нужен:** базовая точка отсчёта, демонстрирующая, что́ исчезает, если канал идеален. В реальности недостижим — даже у самых надёжных каналов есть конечная BER и буферы конечной длины.", "<h3>2. Стоп-и-жди для канала без ошибок (simplex stop-and-wait)</h3>", "Снимается допущение о бесконечной скорости получателя — теперь он может **переполниться**:", "- Отправитель посылает один кадр и **блокируется**, ожидая короткое подтверждение **ACK** от получателя.\n- Получатель, прочитав и обработав кадр, отправляет ACK.\n- Только после получения ACK отправитель посылает следующий кадр.", "Так появляется **управление потоком** (flow control): темп задаёт получатель. Канал по-прежнему предполагается безошибочным, поэтому ACK не несёт номера и не теряется — нет нужды в таймере и нумерации.", "**Эффективность** — низкая: канал простаивает в течение RTT после каждого кадра. Коэффициент использования U = T<sub>frame</sub> / (T<sub>frame</sub> + RTT). При длинных каналах (спутник) — менее 1%.", "<h3>3. PAR для зашумлённых каналов (Positive Acknowledgement with Retransmission)</h3>", "Теперь канал может **искажать и терять кадры и ACK**. Возникают три новые проблемы и три механизма их решения:", "- **Потеря кадра**: получатель ничего не получает → не отправляет ACK. Решение — **таймер повторной передачи** (retransmission timer): отправитель запускает таймер при отправке; если ACK не пришёл к моменту срабатывания — кадр посылается повторно.\n- **Потеря ACK**: получатель кадр принял, но ACK потерялся. Отправитель по таймеру шлёт дубликат, который надо отличить от нового. Решение — **нумерация кадров**, для stop-and-wait достаточно **одного бита** (0/1): после успешного приёма получатель ждёт кадр с противоположным номером, повтор с тем же номером — дубликат.\n- **Обработка дубликата**: получатель видит дубликат → не передаёт пакет наверх (чтобы не было повторов в приложении), но обязательно **снова отправляет ACK** (иначе отправитель будет вечно посылать тот же кадр).", "Этот протокол также называют **ABP** (Alternating Bit Protocol) — из-за чередующихся номеров 0/1. Он — простейший пример **скользящего окна с окном W=1** (Q18) и доказуемо корректен при любых сочетаниях потерь, дубликатов и переупорядочения, если только конечный таймер достаточно велик.", "<h3>Эволюция учебных протоколов</h3>", "| Протокол | Канал | Управление потоком | Обработка ошибок | Нумерация |\n|---|---|---|---|---|\n| Утопия | идеальный | нет | нет | нет |\n| Stop-and-Wait (без ошибок) | без ошибок | да (по ACK) | нет | нет |\n| PAR (Stop-and-Wait зашумлённый) | с ошибками/потерями | да | да (таймер + ретрансмит) | 1 бит |", "Дальнейшее обобщение — **скользящее окно** размером W > 1, позволяющее иметь несколько неподтверждённых кадров «в полёте» и улучшающее использование канала (см. Q18)."], "terms": [{"ru": "Симплекс", "en": "simplex", "df": "передача данных только в одном направлении"}, {"ru": "Протокол «Утопия»", "en": "Utopia protocol", "df": "идеальный протокол без ошибок и без управления потоком"}, {"ru": "ACK", "en": "Acknowledgement", "df": "подтверждение успешного получения кадра"}, {"ru": "Стоп-и-жди", "en": "stop-and-wait", "df": "режим, при котором отправитель ждёт подтверждения перед отправкой следующего кадра"}, {"ru": "Управление потоком", "en": "flow control", "df": "механизм согласования темпа отправителя и получателя"}, {"ru": "Таймер повторной передачи", "en": "retransmission timer", "df": "таймер ожидания ACK"}, {"ru": "PAR", "en": "Positive Acknowledgement with Retransmission", "df": "подтверждение с повторной передачей при отсутствии ACK"}, {"ru": "ABP", "en": "Alternating Bit Protocol", "df": "простейший протокол с однобитовой нумерацией, эквивалент Stop-and-Wait с обработкой ошибок"}, {"ru": "Дубликат кадра", "en": "duplicate frame", "df": "повторно переданный кадр с уже использованным номером последовательности"}, {"ru": "Зашумлённый канал", "en": "noisy channel", "df": "канал, в котором возможны искажения и потери битов"}, {"ru": "Эффективность использования канала", "en": "link utilization", "df": "доля времени, в которой канал занят полезной передачей"}], "summary": ["Три учебных симплексных протокола Таненбаума, каждый добавляет одну функцию", "**Симплекс** — данные в одну сторону (короткие ACK назад допустимы)", "**1. «Утопия»** (Utopia, unrestricted simplex): канал идеальный, получатель бесконечно быстрый", "Утопия: нет ACK, нет таймеров, нет нумерации; 2 строки кода — базовая точка отсчёта", "**2. Stop-and-Wait для канала без ошибок**: отправил кадр → ждёт **ACK** → следующий", "Появляется **flow control** — темп задаёт получатель; нет нумерации, нет таймера", "Эффективность: **U = T<sub>frame</sub> / (T<sub>frame</sub> + RTT)**; на спутнике <1%", "**3. PAR** (Positive Acknowledgement with Retransmission) для зашумлённого канала", "Новые проблемы: потеря кадра, потеря ACK, дубликат — три механизма решения", "**Таймер повторной передачи** — при отсутствии ACK кадр посылается заново", "**Нумерация 1 бит (0/1)** для отличия дубликата от нового кадра", "Дубликат: получатель отбрасывает, но **обязательно повторно шлёт ACK**", "PAR = **ABP** (Alternating Bit Protocol); простейший случай скользящего окна W=1", "Доказуемо корректен при любых потерях/дубликатах при достаточно большом таймере", "Сравнительная таблица: Утопия (без ошибок, без flow) → S&W (flow по ACK) → PAR (+ таймер + 1-бит нумерация)", "Дальнейшее обобщение — скользящее окно W>1 для лучшей утилизации (Q18)"]}, {"n": 18, "title": "Протоколы скользящего окна. Протокол однобитового скользящего окна. Протокол с возвратом на N. Протокол с выборочным повтором.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Протокол скользящего окна** (sliding window protocol) — обобщение схемы Stop-and-Wait, в котором отправитель может иметь несколько неподтверждённых кадров «в полёте» одновременно. Это позволяет полностью утилизировать длинные или быстрые каналы, где время кругового обхода RTT в десятки раз превышает время передачи одного кадра. Все современные надёжные протоколы канального и транспортного уровней — HDLC, TCP, SCTP, QUIC — построены на этой идее. Учебно рассматриваются три варианта: однобитовое окно (эквивалент PAR), **Go-Back-N** и **Selective Repeat**, различающиеся стратегией восстановления после ошибок.", "<h3>Базовая механика скользящего окна</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/3/32/Sliding_Window.svg\" alt=\"Диаграмма работы протокола скользящего окна\" loading=\"lazy\"><figcaption>Принцип работы скользящего окна: отправитель ведёт окно отправленных, но ещё не подтверждённых кадров; получатель — окно ожидаемых кадров. При получении ACK окно «скользит» вперёд. <em>Источник: Wikimedia Commons, Alexander Krivács Schrøder, CC BY-SA 3.0.</em></figcaption></figure>", "- Каждому кадру присваивается **номер последовательности** (sequence number) длиной n бит → всего 2ⁿ возможных номеров.\n- **Окно отправителя** — диапазон номеров, которые он имеет право отправить без подтверждения. Размер окна обозначим W<sub>s</sub>.\n- **Окно получателя** — диапазон номеров, которые он готов принять. Размер W<sub>r</sub>.\n- При приходе ACK окно отправителя «сдвигается» к большим номерам.\n- Для полной утилизации канала нужно W<sub>s</sub> ≥ 1 + 2·BDP / размер_кадра, где BDP = пропускная способность × RTT.\n- **Кумулятивное подтверждение** (cumulative ACK): ACK с номером n означает «получены все кадры до n−1 включительно».\n- **Piggybacking** — встраивание ACK в попутный кадр данных в обратном направлении (экономия трафика).", "<h3>1. Однобитовое скользящее окно (1-bit sliding window)</h3>", "- W<sub>s</sub> = W<sub>r</sub> = 1, номер кадра — 1 бит (значения 0 и 1).\n- Эквивалент протокола PAR / Alternating Bit Protocol (Q17), переписанный в каноническом стиле скользящего окна.\n- Идеален для очень коротких или односторонних дуплексных каналов; страдает на длинных каналах: при W = 1 эффективность не превышает T<sub>frame</sub> / (T<sub>frame</sub> + RTT).", "<h3>2. Go-Back-N (GBN, «возврат на N»)</h3>", "- W<sub>s</sub> до 2ⁿ − 1, W<sub>r</sub> = 1: получатель **отбрасывает любые кадры, пришедшие не по порядку**, и держит только указатель на ожидаемый номер.\n- Отправитель ведёт **общий таймер** на самый старый неподтверждённый кадр. Если кадр потерян, ACK не приходит к таймеру → отправитель **повторяет потерянный кадр и все последующие**, уже находящиеся в окне.\n- Подтверждения **кумулятивные**: ACK n подтверждает все кадры < n.\n- Достоинства: простая реализация на получателе (нет буфера); подходит для каналов с малой вероятностью ошибки.\n- Недостатки: при высокой BER пропускная способность катастрофически падает — каждый одиночный сбой влечёт повтор всего окна.\n- **Ограничение размера окна:** W<sub>s</sub> ≤ 2ⁿ − 1. Если разрешить 2ⁿ, отправитель не сможет отличить полный круг номеров: вернувшийся кадр 0 после ACK на все 2ⁿ кадров неотличим от нового.\n- Применяется в HDLC, исторических ARPANET-протоколах, GSM RLC AM, отчасти TCP до появления SACK.", "<h3>3. Selective Repeat (SR, «выборочный повтор»)</h3>", "- W<sub>s</sub>, W<sub>r</sub> > 1: и отправитель, и получатель ведут буферы.\n- Получатель **буферизует кадры, пришедшие не по порядку**; при получении пропущенного — отдаёт наверх весь непрерывный префикс.\n- Отправитель повторяет **только потерянные кадры**, отслеживая ACK для каждого индивидуально.\n- **NAK** (Negative Acknowledgement) — опционально: получатель явно сообщает, что определённый кадр потерян, не дожидаясь таймера, ускоряя восстановление.\n- **Ограничение размера окна:** W<sub>s</sub> + W<sub>r</sub> ≤ 2ⁿ; при равных окнах — **W ≤ 2ⁿ⁻¹**. Иначе после потери ACK получатель не сможет отличить совершенно новый кадр с тем же номером от запоздавшего дубликата.\n- Достоинства: высокая эффективность при значительных BER; используется в практически всех современных надёжных протоколах.\n- Недостатки: сложнее реализация (управление буферами на обеих сторонах).\n- В TCP появилось как опция **SACK** (Selective Acknowledgment, RFC 2018): получатель сообщает, какие именно блоки байтов он принял, позволяя отправителю выборочно перепосылать.", "<h3>Сравнение</h3>", "| Параметр | 1-bit (Stop-and-Wait) | Go-Back-N | Selective Repeat |\n|---|---|---|---|\n| Размер W<sub>s</sub> | 1 | до 2ⁿ−1 | до 2ⁿ⁻¹ |\n| Размер W<sub>r</sub> | 1 | 1 | до 2ⁿ⁻¹ |\n| Буфер у получателя | нет | нет | да |\n| Повтор при ошибке | один кадр | весь хвост окна | только потерянный |\n| Сложность реализации | минимальная | средняя | высокая |\n| Эффективность при высокой BER | низкая | низкая | высокая |"], "terms": [{"ru": "Скользящее окно", "en": "sliding window", "df": "механизм, позволяющий передавать несколько кадров до получения подтверждения"}, {"ru": "Окно отправителя", "en": "sender window, W<sub>s</sub>", "df": "множество кадров, разрешённых к отправке без подтверждения"}, {"ru": "Окно получателя", "en": "receiver window, W<sub>r</sub>", "df": "множество кадров, которые получатель готов принять"}, {"ru": "Номер последовательности", "en": "sequence number", "df": "порядковый номер кадра для идентификации и упорядочивания"}, {"ru": "Произведение пропускной способности на задержку", "en": "bandwidth-delay product, BDP", "df": "число бит «в полёте» в канале в данный момент"}, {"ru": "Возврат на N", "en": "Go-Back-N", "df": "стратегия, при которой повторяются N кадров начиная с ошибочного"}, {"ru": "Выборочный повтор", "en": "Selective Repeat", "df": "стратегия, при которой повторяется только конкретный утерянный кадр"}, {"ru": "Кумулятивное подтверждение", "en": "cumulative ACK", "df": "ACK n подтверждает все кадры до n−1 включительно"}, {"ru": "SACK", "en": "Selective Acknowledgment, RFC 2018", "df": "выборочное подтверждение в TCP"}, {"ru": "NAK", "en": "Negative Acknowledgement", "df": "отрицательное подтверждение, сигнализирует об ошибке конкретного кадра"}, {"ru": "Буферизация не по порядку", "en": "out-of-order buffering", "df": "сохранение кадров, пришедших раньше ожидаемых"}], "summary": ["**Скользящее окно** — отправитель имеет несколько неподтверждённых кадров «в полёте»; основа HDLC, TCP, SCTP, QUIC", "Кадры нумеруются: **n бит = 2ⁿ номеров**; окно W<sub>s</sub> (отправитель), W<sub>r</sub> (получатель)", "При ACK окно сдвигается к большим номерам", "Для полной утилизации: **W<sub>s</sub> ≥ 1 + 2·BDP/размер_кадра**, BDP = C·RTT", "**Кумулятивное подтверждение**: ACK n = «приняты все < n»", "**Piggybacking** — встраивание ACK в попутный data-кадр обратного направления", "**1. Однобитовое окно** (W<sub>s</sub>=W<sub>r</sub>=1) — эквивалент PAR/ABP в каноническом виде", "1-bit неэффективно на длинных каналах — те же T<sub>frame</sub>/(T<sub>frame</sub>+RTT)", "**2. Go-Back-N (GBN)**: W<sub>s</sub> до 2ⁿ−1, **W<sub>r</sub>=1** — получатель отбрасывает всё не по порядку", "GBN: общий таймер на старейший неподтверждённый; при потере — **повтор кадра и всего хвоста окна**", "GBN: простой получатель (нет буфера); катастрофическое падение при высокой BER", "GBN ограничение окна: **W<sub>s</sub> ≤ 2ⁿ−1** (иначе дубликат неотличим от нового)", "Применения GBN: HDLC, ARPANET, GSM RLC AM, TCP до SACK", "**3. Selective Repeat (SR)**: W<sub>s</sub>, W<sub>r</sub> > 1, **буферизация не по порядку**", "SR: повторяется **только потерянный кадр**, индивидуальные ACK", "**NAK** — отрицательное подтверждение, ускоряет повтор, не дожидаясь таймера", "SR ограничение окна: **W<sub>s</sub> + W<sub>r</sub> ≤ 2ⁿ**; при равных — **W ≤ 2ⁿ⁻¹**", "SR в TCP реализован как опция **SACK** (RFC 2018) — приёмник сообщает блоки полученных байт", "Сравнение: 1-bit (мин. сложн., низк. эффективность); GBN (простой получатель, плохо при ошибках); SR (сложно, высок. эффективность)"]}, {"n": 19, "title": "Примеры протоколов передачи данных: SONET, ADSL.", "paragraphs": ["<h3>Общая идея</h3>", "SONET и ADSL — две классические технологии нижних уровней сети. Они служат разным целям. **SONET** — это «магистраль»: высокоскоростная оптическая связь между городами и операторами связи. **ADSL** — это «последняя миля»: способ дать конкретной квартире доступ в интернет по обычной телефонной паре. Запомнить главное противопоставление: оптика и магистраль против медной пары и абонента.", "<h3>SONET</h3>", "**SONET** (Synchronous Optical Network) — стандарт оптической передачи на магистральных линиях, разработанный в США. В Европе и большинстве стран применяется его близнец **SDH** (Synchronous Digital Hierarchy). Стандарты совместимы; на практике их часто называют общим термином SDH.", "Главное свойство — **синхронность**: все узлы работают по единому очень точному тактовому сигналу (от атомных часов оператора связи). Благодаря этому можно легко «вкладывать» множество медленных потоков в один быстрый канал и обратно — без сложной буферизации.", "Скорости в SONET/SDH идут «лесенкой» — каждая следующая ступень примерно в 4 раза быстрее. Достаточно помнить три уровня:", "- **STM-1** ≈ 155 Мбит/с — базовая ступень SDH;\n- **STM-16** ≈ 2,5 Гбит/с — типовая магистраль среднего оператора;\n- **STM-64** ≈ 10 Гбит/с — крупные магистрали.", "Кадр повторяется каждые 125 микросекунд. Это «магическое» число унаследовано из цифровой телефонии (8000 голосовых отсчётов в секунду).", "SONET-сети обычно собирают **кольцом**. Если оптоволокно где-то рвётся, трафик автоматически идёт в обход — переключение занимает меньше 50 миллисекунд и пользователь почти ничего не замечает. Этот механизм называется **APS** (Automatic Protection Switching).", "Сегодня SONET постепенно сменяется более новым стандартом **OTN** (Optical Transport Network), у которого скорости выше (100, 400, 800 Гбит/с) и встроенная коррекция ошибок.", "<h3>ADSL</h3>", "**ADSL** (Asymmetric Digital Subscriber Line) — способ передавать интернет по той же телефонной паре, по которой работает обычный городской телефон. «Асимметричная» означает, что скорость **к абоненту** (загрузка из сети) намного выше скорости **от абонента**. Это удобно, потому что типичный пользователь больше скачивает, чем отдаёт.", "Идея очень простая. Обычный голос на телефоне использует только низкие частоты (0–4 кГц). Но медный кабель физически способен пропускать намного больше — примерно до 1 МГц. ADSL использует всё, что выше голосового диапазона, под передачу данных. Голос и интернет идут одновременно по одной паре проводов и не мешают друг другу.", "Чтобы эффективно использовать эту широкую полосу, её «нарезают» на много узких частотных дорожек (поднесущих). На каждой передают независимый сигнал. Если на какой-то частоте есть помеха, эту дорожку просто пропускают. Эта техника называется **DMT** (Discrete MultiTone). Большая часть дорожек отдана под загрузку из интернета, меньшая — под отдачу; отсюда и асимметрия.", "В квартире у абонента стоит **сплиттер** (или микрофильтр) — пассивный фильтр, который разделяет голос и данные: один провод идёт в телефон, другой в роутер. На стороне оператора стоит **DSLAM** — устройство, собирающее данные с множества абонентских линий и передающее их дальше в сеть.", "Скорости эволюционировали: обычный ADSL давал ~8 Мбит/с вниз, **ADSL2+** — до 24 Мбит/с, **VDSL2** — до 100 Мбит/с (но только на коротких линиях), **G.fast** — до 1 Гбит/с (десятки метров). Сейчас ADSL и его потомки постепенно вытесняются оптикой непосредственно до дома (**FTTH** — Fiber to the Home, например **GPON**).", "<h3>Сравнение SONET и ADSL</h3>", "| Критерий | SONET / SDH | ADSL |\n|---|---|---|\n| Где используется | магистрали между городами и операторами | домашний доступ в интернет |\n| Среда | оптика | старая телефонная медная пара |\n| Скорости | от 155 Мбит/с до десятков Гбит/с | до 24 Мбит/с (ADSL2+) |\n| Принцип | синхронные временные слоты (TDM) | разные частоты для голоса и данных |\n| Симметрия | одинаково в обе стороны | вниз быстрее, чем вверх |"], "terms": [{"ru": "SONET", "en": "Synchronous Optical Network", "df": "американский стандарт синхронной оптической передачи на магистралях"}, {"ru": "SDH", "en": "Synchronous Digital Hierarchy", "df": "европейский близнец SONET; стандарты совместимы"}, {"ru": "STM-1", "en": "Synchronous Transport Module", "df": "базовая ступень SDH, около 155 Мбит/с"}, {"ru": "APS", "en": "Automatic Protection Switching", "df": "автопереключение трафика в обход разрыва оптики (быстрее 50 мс)"}, {"ru": "OTN", "en": "Optical Transport Network", "df": "современный оптический стандарт, идущий на смену SDH"}, {"ru": "Магистраль", "en": "backbone", "df": "высокоскоростные каналы между городами и операторами связи"}, {"ru": "«Последняя миля»", "en": "last mile", "df": "участок сети от оборудования провайдера до конкретного абонента"}, {"ru": "ADSL", "en": "Asymmetric Digital Subscriber Line", "df": "широкополосный доступ по обычной телефонной паре; вниз быстрее, чем вверх"}, {"ru": "DMT", "en": "Discrete MultiTone", "df": "деление полосы на много узких частотных дорожек"}, {"ru": "Сплиттер / микрофильтр", "en": "splitter", "df": "фильтр у абонента, разделяющий голос и данные"}, {"ru": "DSLAM", "en": "DSL Access Multiplexer", "df": "устройство оператора, собирающее данные с множества ADSL-линий"}, {"ru": "Нисходящий поток", "en": "downstream", "df": "передача из сети к абоненту (загрузка)"}, {"ru": "Восходящий поток", "en": "upstream", "df": "передача от абонента в сеть (отдача)"}, {"ru": "FTTH", "en": "Fiber to the Home", "df": "оптика непосредственно до квартиры; преемник xDSL"}], "summary": ["**SONET** и **ADSL** — две классические технологии нижних уровней сети, для разных задач", "**SONET** — оптическая магистраль между городами и операторами; в Европе аналог — **SDH** (совместимы)", "Главное свойство SONET — **синхронность**: все узлы работают по единому очень точному тактовому сигналу", "Базовая ступень **STM-1 ≈ 155 Мбит/с**; **STM-16 ≈ 2,5 Гбит/с**; **STM-64 ≈ 10 Гбит/с**", "Кадр повторяется каждые **125 мкс** (наследие цифровой телефонии — 8000 голосовых отсчётов/с)", "Топология — **кольцо**; при обрыве трафик идёт в обход за <50 мс (механизм **APS**)", "Современная замена SONET/SDH — **OTN** (100/400/800 Гбит/с со встроенным FEC)", "**ADSL** — широкополосный доступ по обычной телефонной паре; «асимметричная» = вниз быстрее, чем вверх", "Идея: голос занимает 0–4 кГц, а медный кабель пропускает до ~1 МГц; верхняя часть полосы — под данные", "Голос и интернет идут одновременно по одной паре, не мешая друг другу", "Полосу нарезают на много узких частотных «дорожек» (поднесущих) — это **DMT** (Discrete MultiTone)", "Большинство дорожек отдано под загрузку (downstream), меньшая часть — под отдачу (upstream)", "Оборудование: дома — **сплиттер** (разделяет голос и данные), у оператора — **DSLAM** (собирает множество линий)", "Скорости: ADSL ≈ 8 Мбит/с → ADSL2+ ≈ 24 → VDSL2 ≈ 100 (короткие линии) → G.fast ≈ 1 Гбит/с (десятки метров)", "Сейчас xDSL вытесняется оптикой до дома — **FTTH/GPON**", "Главный контраст: SONET — оптика, магистраль, симметрия, очень быстро; ADSL — медь, последняя миля, асимметрия"]}, {"n": 20, "title": "Обобщённая задача коммутации. Коммутация каналов и пакетов. Маршрутизация.", "paragraphs": ["<h3>Общая идея</h3>", "В большой сети неразумно протягивать отдельный провод между каждой парой пользователей — это были бы сотни миллионов кабелей. Вместо этого ставят промежуточные **узлы коммутации** (коммутаторы и маршрутизаторы), через которые данные путешествуют от отправителя к получателю. Способов организовать это путешествие исторически сложилось два главных: **коммутация каналов** (как телефонный звонок) и **коммутация пакетов** (как Интернет).", "<h3>Коммутация каналов</h3>", "**Коммутация каналов** (circuit switching) — модель обычного телефонного звонка. Перед обменом данными между двумя абонентами устанавливается выделенный канал с гарантированной полосой. Этот канал удерживается на всё время разговора и освобождается, когда абоненты вешают трубку. Передача проходит в три фазы: **установление соединения, передача данных, разрыв**.", "Главный плюс — стабильность: пока канал установлен, скорость и задержка не меняются, потерь нет. Главный минус — расточительность: канал занят, даже когда никто ничего не говорит. Так работала традиционная телефонная сеть (PSTN), ISDN, оптические магистрали с выделенными длинами волн.", "<h3>Коммутация сообщений</h3>", "Историческое промежуточное звено — **коммутация сообщений** (message switching). Сообщение целиком передаётся от узла к узлу: каждый узел принимает его полностью, сохраняет у себя и потом пересылает дальше. Такая модель **store-and-forward** работала в телеграфных сетях; сегодня её прямой потомок — электронная почта (письмо хранится у каждого почтового сервера, пока не будет доставлено).", "<h3>Коммутация пакетов</h3>", "**Коммутация пакетов** (packet switching, идея Пола Бэрана и Дональда Дэвиса, 1960-е) — основной подход в современных сетях. Данные разбиваются на небольшие **пакеты**; каждый пакет получает заголовок с адресом получателя и идёт через сеть самостоятельно. На общих каналах пакеты разных пользователей чередуются, что и даёт ключевое преимущество — высокую утилизацию: канал свободен ровно тогда, когда никому не нужен.", "Внутри пакетной коммутации различают две схемы:", "- **Дейтаграммы** (datagram) — каждый пакет несёт полный адрес получателя и идёт самостоятельно. Разные пакеты одного разговора могут пройти разными путями и прийти не по порядку. Это модель Интернета (протокол **IP**).\n- **Виртуальные каналы** (virtual circuit) — перед передачей по сети «прокладывается» логический путь, и все пакеты идут по нему. В заголовке вместо полного адреса — короткий идентификатор маршрута. Так работали **X.25, Frame Relay, ATM**; современный пример — **MPLS** в магистральных сетях операторов.", "За удобство пакетной коммутации платят переменной задержкой и возможными потерями; восстановление утраченного — задача верхних уровней (TCP).", "<h3>Коммутация и маршрутизация</h3>", "Самое простое и точное различие — по **масштабу**:", "- **Коммутация** (switching) — перемещение данных от одного устройства к другому **внутри одной сети**. Этим занимается коммутатор Ethernet в офисе: он передаёт кадры между компьютерами в пределах локальной сети, опираясь на MAC-адреса.\n- **Маршрутизация** (routing) — нахождение пути для данных **между разными сетями**. Этим занимается маршрутизатор: он соединяет вашу домашнюю сеть с сетью провайдера, а через неё — со всем остальным Интернетом, ориентируясь по IP-адресам.", "То есть коммутатор «знает» все устройства своей сети, а маршрутизатор «знает» соседние сети и умеет передавать пакеты в правильную из них. Вместе они образуют основу любой передачи данных — от веб-сёрфинга до голосовой связи и видеотрансляций.", "На практике у этих задач есть и более тонкое внутреннее разделение. **Пересылка (forwarding)** — это локальное действие одного узла «пакет пришёл; в какой порт его выслать?»; решается мгновенно по таблице пересылки. **Протоколы маршрутизации** (OSPF, BGP — см. Q33, Q41) — фоновая работа: они обмениваются информацией между маршрутизаторами и наполняют эти таблицы так, чтобы пакеты шли разумным путём.", "<h3>Сравнение каналов и пакетов</h3>", "| Критерий | Коммутация каналов | Коммутация пакетов |\n|---|---|---|\n| Аналогия | телефонный звонок | почтовая открытка |\n| Установка соединения | обязательна | не нужна (для дейтаграмм) |\n| Гарантия полосы и задержки | да | нет |\n| Утилизация канала | низкая (молчание тоже занимает ресурс) | высокая |\n| Поведение при отказе | разрыв соединения | пакеты автоматически обходят |\n| Главные примеры | телефонная сеть, SDH | Интернет (IP), MPLS |"], "terms": [{"ru": "Коммутация", "en": "switching", "df": "задача соединения узлов сети через общие промежуточные точки"}, {"ru": "Коммутация каналов", "en": "circuit switching", "df": "выделенный канал на время сеанса; модель телефонного звонка"}, {"ru": "Коммутация сообщений", "en": "message switching", "df": "передача сообщений целиком по принципу store-and-forward; историческая модель"}, {"ru": "Коммутация пакетов", "en": "packet switching", "df": "данные разбиваются на пакеты, каждый идёт через сеть самостоятельно; основа Интернета"}, {"ru": "Дейтаграмма", "en": "datagram", "df": "независимый пакет с полным адресом получателя"}, {"ru": "Виртуальный канал", "en": "virtual circuit", "df": "заранее проложенный логический путь, по которому идут все пакеты потока"}, {"ru": "Маршрутизация", "en": "routing", "df": "глобальная задача наполнения таблиц пересылки в узлах сети"}, {"ru": "Пересылка", "en": "forwarding", "df": "локальное действие одного узла: «куда послать этот пакет дальше»"}, {"ru": "Таблица пересылки", "en": "forwarding table", "df": "таблица в узле, отображающая адрес получателя на выходной порт"}, {"ru": "MPLS", "en": "Multiprotocol Label Switching", "df": "современный пример виртуальных каналов в магистральных сетях"}], "summary": ["**Коммутация** (switching) — общая задача: соединить любые два узла большой сети, не протягивая отдельный провод между каждой парой", "Решение — поставить промежуточные **узлы коммутации**, через которые данные идут от отправителя к получателю", "Два главных подхода: **коммутация каналов** (как телефонный звонок) и **коммутация пакетов** (как Интернет)", "**Коммутация каналов** (circuit switching): перед обменом данными прокладывается выделенный канал на всё время сеанса", "Три фазы: установление соединения → передача → разрыв; так работала телефонная сеть (PSTN), ISDN, оптические магистрали", "Плюс — стабильность: гарантированная полоса, постоянная задержка, нет потерь; минус — расточительность (канал занят даже при молчании)", "**Коммутация сообщений** (message switching) — историческая модель: сообщение целиком идёт от узла к узлу (**store-and-forward**); сегодня живёт в электронной почте", "**Коммутация пакетов** (packet switching, Бэран и Дэвис, 1960-е): данные дробятся на маленькие пакеты, каждый идёт через сеть самостоятельно", "Главный плюс — высокая утилизация: пакеты разных пользователей чередуются на общих каналах", "**Дейтаграммы** (datagram) — каждый пакет несёт полный адрес и идёт независимо; разные пути и переупорядочение возможны; это модель Интернета (IP)", "**Виртуальные каналы** (virtual circuit) — заранее прокладывается логический путь, в заголовке только короткий ID маршрута; так работают X.25, Frame Relay, ATM, **MPLS**", "Цена пакетной коммутации — переменная задержка и возможные потери; восстановление — задача TCP", "**Коммутация vs маршрутизация** по масштабу: коммутация — внутри одной сети; маршрутизация — между разными сетями", "Коммутатор работает с MAC-адресами и кадрами в пределах LAN; маршрутизатор — с IP-адресами и пакетами между сетями", "Внутри маршрутизации различают **пересылку (forwarding)** — локальная операция узла по таблице — и **протоколы маршрутизации** (OSPF, BGP), которые эти таблицы наполняют", "Запомнить контраст: коммутация каналов = стабильность ценой ресурсов; коммутация пакетов = эффективность ценой непостоянства"]}], "quizzes": []}, {"id": 4, "name": "Подуровень управления доступом к среде", "questions": [{"n": 21, "title": "Проблема распределения канала. Статическое распределение канала. Допущения, связанные с динамическим распределением каналов.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Проблема распределения канала** (channel allocation problem) — центральная задача MAC-подуровня: множество **станций** разделяют общий физический канал (один кабель, одна радиочастота, общее оптоволокно), и нужно выработать правила, по которым они занимают его, чтобы избежать **коллизий** (collisions) — одновременных передач, искажающих сигналы. Все методы доступа делятся на два больших класса: **статическое** (детерминированное) распределение, при котором канал заранее разделён между станциями фиксированными долями, и **динамическое** (контентионное), при котором станции конкурируют за канал по ситуации.", "<h3>Статическое распределение канала</h3>", "Канал делится заранее равными долями между N станциями. Используются классические схемы мультиплексирования:", "- **FDM** (Frequency Division Multiplexing) — полоса B Гц разрезается на N поддиапазонов по B/N Гц; каждой станции — свой диапазон с защитными интервалами. Это аналог радиовещания: разные радиостанции на разных частотах.\n- **TDM** (Time Division Multiplexing) — время разрезается на повторяющиеся фреймы по N слотов; каждая станция передаёт только в свой слот.\n- **CDMA** — станции работают одновременно в одной полосе, разделяясь уникальными расширяющими кодами (Q11).", "Свойства статических схем:\n- **Детерминированная задержка** (≤ T<sub>frame</sub>) и гарантированная доля канала B/N.\n- **Безболезненно** только при стабильной, равномерной и непрерывной нагрузке (классическая телефония).\n- **Плохо подходят для пульсирующего (bursty) трафика**: если станция временно молчит, её слот пустует — пропускная способность канала используется лишь на k/N долю, где k — число активно передающих. При N большом и редких передачах эффективность падает катастрофически.\n- Аналитически: для системы M/M/1 с λ запросов/с средняя задержка T = 1/(μC − λ); если разрезать на N подканалов C/N, задержка вырастает в N раз при той же суммарной нагрузке.", "Поэтому статика хороша для голосового трафика PSTN (постоянный поток 64 кбит/с) и не подходит для компьютерных данных, где **пульсирующий трафик** (bursty traffic) с пиковой скоростью, сильно превышающей среднюю, требует динамического разделения.", "<h3>Динамическое распределение канала</h3>", "В динамической схеме все станции потенциально равны, канал не закреплён. Станции пытаются передать, конкурируя или координируясь по протоколу MAC (ALOHA, CSMA, Token Passing, CSMA/CA — Q22).", "При анализе таких протоколов в учебнике Таненбаума приняты пять стандартных допущений:", "1. **Модель станций** — N независимых станций; каждая генерирует кадры в соответствии с пуассоновским потоком интенсивности λ/N (общая нагрузка λ кадров на время передачи).\n2. **Допущение об одном канале** — все станции делят один канал; в нём же передаются как данные, так и ACK; нет отдельного канала управления.\n3. **Допущение о коллизии** — две одновременные передачи всегда искажают друг друга, и обе должны быть повторены. Других ошибок (от шума) нет.\n4. **Время может быть** двух типов: **непрерывное** (станция может начать передачу в любой момент) или **слотированное** (передача только с начала каждого временного слота фиксированной длины). Слотирование удваивает максимальную пропускную способность ALOHA.\n5. **Прослушивание несущей** (carrier sensing):\n   - **С прослушиванием** — станция перед передачей определяет, занят ли канал (CSMA, Ethernet, Wi-Fi).\n   - **Без прослушивания** — станция передаёт «вслепую» (классическая ALOHA, спутниковые системы).", "Дополнительно различают:\n- **Мгновенное** (instantaneous) или **задержанное** (delayed) обнаружение коллизии;\n- **С обнаружением коллизий** (CD, Collision Detection) или **с их предотвращением** (CA, Collision Avoidance) в зависимости от способности станции одновременно передавать и слушать.", "Эти допущения позволяют сравнивать протоколы по аналитической эффективности и среднему времени задержки.", "<h3>Когда что применять</h3>", "- **Статическое деление** оптимально для **constant-bit-rate** потоков (голос, синхронные первичные группы PDH/SDH).\n- **Динамическое** — для **bursty data** (LAN, Wi-Fi, спутниковые VSAT-каналы), где сумма пиковых скоростей превышает мощность канала."], "terms": [{"ru": "Разделяемая среда", "en": "shared medium", "df": "физическая среда, используемая несколькими станциями одновременно"}, {"ru": "Подуровень MAC", "en": "Media Access Control", "df": "нижний подуровень канального уровня, отвечающий за доступ к среде"}, {"ru": "Статическое распределение", "en": "static allocation", "df": "заранее заданное деление канала между станциями"}, {"ru": "Динамическое распределение", "en": "dynamic / contention-based", "df": "конкурентный доступ к каналу"}, {"ru": "FDM", "en": "Frequency Division Multiplexing", "df": "частотное разделение канала"}, {"ru": "TDM", "en": "Time Division Multiplexing", "df": "временное разделение канала"}, {"ru": "Коллизия", "en": "collision", "df": "одновременная передача двух и более станций, приводящая к искажению сигнала"}, {"ru": "Пульсирующий трафик", "en": "bursty traffic", "df": "трафик с резкими периодическими всплесками активности"}, {"ru": "Прослушивание несущей", "en": "carrier sensing", "df": "определение занятости канала перед передачей"}, {"ru": "Слотирование", "en": "slotting", "df": "синхронизация передач началами фиксированных слотов"}], "summary": ["**Проблема распределения канала** — задача MAC-подуровня: как N станций делят общий физический ресурс без коллизий", "Два класса: **статическое** (детерминированное, заранее) и **динамическое** (контентионное, по ситуации)", "**Статика — FDM**: полоса B делится на N поддиапазонов с защитными интервалами (классическое радиовещание)", "**Статика — TDM**: время — N слотов в кадре, каждой станции свой слот", "**Статика — CDMA**: одна полоса, разделение ортогональными расширяющими кодами", "Свойства статики: детерминированная задержка ≤ T<sub>frame</sub>, гарантированная доля B/N, нет коллизий", "Статика хороша при стабильной непрерывной нагрузке (голос PSTN, синхронные потоки PDH/SDH)", "Статика плоха при **bursty traffic**: если станция молчит, её слот пуст → утилизация k/N", "Аналитически M/M/1: при разрезании C на N подканалов задержка растёт в N раз", "**5 допущений Таненбаума** для динамических протоколов", "1. Модель N независимых станций с пуассоновским генератором кадров", "2. Один общий канал (включая ACK), без отдельного канала управления", "3. Допущение о коллизиях: две одновременные передачи всегда искажают друг друга; других ошибок нет", "4. Время: **непрерывное** (можно начать в любой момент) или **слотированное** (только с начала слота) — слотирование удваивает пропускную способность ALOHA", "5. **Прослушивание несущей** (carrier sensing) — с CS (CSMA, Ethernet, Wi-Fi) или без (ALOHA)", "Дополнительно: мгновенное vs задержанное обнаружение коллизии; **CD** vs **CA**", "Когда что: статика — для **CBR** (constant bit rate, голос); динамика — для bursty (LAN, Wi-Fi, VSAT)"]}, {"n": 22, "title": "Протоколы коллективного доступа. Система ALOHA. Протоколы множественного доступа с контролем несущей. Протоколы без столкновений. Протоколы с ограниченной конкуренцией. Протоколы беспроводных локальных сетей.", "paragraphs": ["<h3>Определение / Общая суть</h3>", "**Протоколы множественного доступа** (multiple access / MAC protocols) — правила, по которым станции, разделяющие общий канал, координируют свои передачи. Все они решают одну задачу: достичь высокой пропускной способности без коллизий при разной нагрузке и при ограниченной возможности обмениваться управляющей информацией. Исторически развились пять семейств: случайный доступ (ALOHA), доступ с прослушиванием несущей (CSMA), коллизионная детекция (CSMA/CD), бесконкурентные методы (token, bitmap), гибриды (limited contention), и беспроводные варианты (MACA, CSMA/CA).", "<h3>ALOHA</h3>", "Норман Абрамсон, Гавайский университет, 1970 — первый протокол случайного множественного доступа для радиоканала ALOHANET.", "- **Pure ALOHA**: станция передаёт кадр сразу, как только он у неё появляется; при коллизии ждёт случайное время и повторяет. Время **«уязвимости» кадра** — 2·T<sub>frame</sub> (любой кадр, начатый в этом окне, столкнётся). Аналитический максимум пропускной способности при пуассоновском потоке: **S = G·e⁻²ᴳ**, максимум **S_max ≈ 0,184 (18,4%)** при G=0,5.\n- **Slotted ALOHA**: ось времени разрезается на слоты длиной T<sub>frame</sub>; передача только в начале слота. Окно уязвимости сокращается вдвое: **S = G·e⁻ᴳ**, **S<sub>max</sub> ≈ 0,368 (36,8%)** при G=1.", "ALOHA до сих пор применяется в спутниковых VSAT-системах, RFID (EPC Gen2) и в каналах запроса сотовой связи (RACH).", "<h3>CSMA — множественный доступ с прослушиванием несущей</h3>", "Идея: перед передачей станция «слушает» эфир, не передаёт ли кто-то ещё. Это резко уменьшает вероятность коллизий, но не устраняет их (если две станции одновременно обнаружат свободу). Варианты:", "- **1-persistent CSMA**: если канал свободен — передаёт сразу; если занят — ждёт освобождения и передаёт немедленно. Жадный, при большой нагрузке — много коллизий. Основа Ethernet.\n- **Non-persistent CSMA**: если канал занят — ждёт случайное время, потом снова слушает. Меньше коллизий, выше средняя задержка.\n- **p-persistent CSMA** (для слотированных систем): если свободно — передаёт с вероятностью p, откладывает с вероятностью (1−p) на следующий слот. p подбирается под нагрузку.", "Пропускная способность CSMA сильно зависит от соотношения a = задержка_распространения / T<sub>frame</sub>; при малых a достигает 0,8–0,9 (за вычетом коллизий).", "<h3>CSMA/CD — обнаружение коллизий</h3>", "<figure><img src=\"https://upload.wikimedia.org/wikipedia/commons/3/3f/Flowchart_CSMA-CD_media_access.svg\" alt=\"Блок-схема алгоритма CSMA/CD\" loading=\"lazy\"><figcaption>Блок-схема CSMA/CD: прослушать канал → передать → во время передачи проверить целостность сигнала → при коллизии послать jam → экспоненциальный откат и повтор. <em>Источник: Wikimedia Commons, CC BY-SA 4.0.</em></figcaption></figure>", "**CSMA/CD** (Carrier Sense Multiple Access with Collision Detection, IEEE 802.3) — расширение CSMA, в котором станция **продолжает слушать во время передачи**: при искажении напряжения на линии обнаруживается коллизия.", "- При коллизии: станция прекращает передачу → отправляет **jam-сигнал** (32-битный паттерн, гарантирующий обнаружение коллизии всеми) → ждёт по алгоритму **двоичного экспоненциального отката** (binary exponential backoff): после k-й коллизии (k ≤ 10) выбирает случайное число t из [0, 2ᵏ − 1] и ждёт t слотов длиной 51,2 мкс. После 16 коллизий подряд — отказ.\n- Требование: время передачи минимального кадра ≥ 2·τ<sub>max</sub>, где τ<sub>max</sub> — задержка распространения от края до края сегмента. Отсюда **минимальный размер кадра Ethernet 64 байта** для 10/100 Мбит/с (макс. длина сегмента ~2,5 км / 200 м).\n- В Wi-Fi не работает: в радиоканале мощность собственного передатчика на много порядков превышает входной сигнал, физически невозможно слушать во время передачи.", "<h3>Протоколы без столкновений</h3>", "Полностью исключают коллизии за счёт явной координации:\n- **Bit-map (basic bit-map protocol)**: каждому из N станций отведён слот в контентенционном фрейме; станция, имеющая данные, ставит «1» в свой слот. Затем все передают по порядку без коллизий. Эффективен при средней/высокой нагрузке.\n- **Двоичный обратный отсчёт** (binary countdown): станции с приоритетами по адресу побитово сравнивают свои идентификаторы; станция, у которой бит «0» в позиции «1» соседа, замолкает. Побеждает максимальный адрес. Эффективность близка к 100%.\n- **Передача маркера** (token passing): по логическому кольцу циркулирует специальный кадр-маркер, и только владеющая им станция может передавать. **Token Ring** (IEEE 802.5), **Token Bus** (802.4), **FDDI**. Гарантирует ограниченную задержку — критично для промышленных систем.", "<h3>Протоколы с ограниченной конкуренцией</h3>", "Гибрид: при малой нагрузке используют случайный доступ (быстрый), при большой переходят к детерминированному (стабильный). Пример — **адаптивный обход дерева** (adaptive tree walk): станции делятся на группы рекурсивно; при коллизии каждая группа делится надвое и опрашивается отдельно.", "<h3>Протоколы беспроводных ЛВС</h3>", "В беспроводной сети все знакомые механизмы доступа работают плохо, потому что радиосигнал распространяется не одинаково для всех. Возникают два специфических явления, которые проще всего понять на простом примере.", "<h4>Скрытый узел (hidden terminal)</h4>", "Представьте три устройства, выстроенные в линию: компьютер **A**, точка доступа **B** в середине, компьютер **C** с другого края. **A** и **C** оба находятся в зоне действия точки **B**, но друг от друга слишком далеко — их радиосигналы не достают.", "Что произойдёт, если оба захотят что-то отправить на точку доступа?", "- **A** слушает эфир. Тишина (от **C** ничего не слышно). **A** начинает передачу к **B**.\n- **C** одновременно слушает эфир. Тоже тишина (от **A** ничего не слышно). **C** тоже начинает передачу к **B**.\n- На точке **B** оба сигнала смешиваются → **коллизия**, точка не понимает ни одного из них.", "Это и есть **скрытый узел**: **A** «спрятан» от **C** (и наоборот), и обычный приём «послушай эфир и говори, если тихо» (CSMA) их не спасает.", "<h4>Открытый узел (exposed terminal)</h4>", "Это противоположная неприятность. Та же линия из узлов; теперь **B** уже что-то передаёт **A**. Станция **C** слышит эту передачу и думает: «канал занят, помолчу». Но **C** на самом деле хотела передавать не **B**, а другому узлу **D**, который вообще далеко от **A** и **B** и им бы не помешал. Получается, **C** зря молчит — пропускная способность сети теряется.", "<h4>Решение проблемы скрытого узла: RTS / CTS</h4>", "Идея: вместо того чтобы решать по тишине эфира, спросить разрешения у получателя.", "Перед передачей реальных данных отправитель шлёт короткое сообщение **RTS** («Request To Send», «можно передать?»). Получатель, если готов, отвечает коротким **CTS** («Clear To Send», «можно»). И вот тут ключевой момент: **CTS слышат все, кто находится рядом с получателем** — в том числе скрытые узлы. Они понимают: «получатель сейчас будет занят, я молчу столько-то времени» — и не пытаются передавать. Скрытый узел больше не мешает.", "Этот приём впервые предложил **MACA** (Multiple Access with Collision Avoidance, Karn 1990). Более поздний **MACAW** (1994) добавил подтверждение приёма (ACK) и «справедливость» между станциями. Сейчас этот механизм используется как опция в Wi-Fi (обычно включается только для больших кадров).", "<h4>CSMA/CA — что реально используется в Wi-Fi</h4>", "В обычной работе Wi-Fi полагается на упрощённую схему **CSMA/CA** (Carrier Sense Multiple Access with **Collision Avoidance**, IEEE 802.11). Ключевая идея — не пытаться ловить коллизию (как в Ethernet это делает CSMA/CD), а постараться её **избежать** заранее.", "Алгоритм по шагам:", "1. Станция, желающая передать, слушает эфир.\n2. Если эфир свободен — ждёт небольшую фиксированную паузу (**DIFS**), потом ещё **случайное** число микрослотов (**backoff**, чтобы две станции, ждавшие одновременно, не «прыгнули» в эфир в один и тот же момент).\n3. Если эфир за это время остался свободным — передаёт кадр.\n4. Получатель проверяет кадр; если всё в порядке, через очень короткую паузу (**SIFS**) шлёт **ACK**.\n5. Если отправитель не получил ACK — считает, что произошла коллизия. Удваивает диапазон случайной задержки (**бинарный экспоненциальный откат**) и пробует снова.", "ACK здесь обязательны, потому что в радиоэфире отправитель **не может сам обнаружить** коллизию (его собственный сигнал глушит приёмник). Единственный способ узнать, что передача удалась, — получить подтверждение от приёмника.", "Опционально в начале обмена можно использовать тот же RTS/CTS — это включается, когда кадры большие и стоимость коллизии особенно высока (или когда сеть страдает от скрытых узлов)."], "terms": [{"ru": "MAC-протокол", "en": "Medium Access Control protocol", "df": "правила доступа к разделяемому каналу"}, {"ru": "CSMA", "en": "Carrier Sense Multiple Access", "df": "множественный доступ с прослушиванием несущей"}, {"ru": "CSMA/CD", "en": "Collision Detection", "df": "обнаружение коллизий, проводной Ethernet (IEEE 802.3)"}, {"ru": "CSMA/CA", "en": "Collision Avoidance", "df": "предотвращение коллизий, Wi-Fi (IEEE 802.11)"}, {"ru": "Двоичный экспоненциальный откат", "en": "binary exponential backoff", "df": "алгоритм ожидания после коллизии"}, {"ru": "Скрытый узел", "en": "hidden terminal", "df": "узел вне зоны слышимости отправителя, вызывающий коллизию у получателя"}, {"ru": "Открытый узел", "en": "exposed terminal", "df": "станция, ошибочно считающая канал занятым из-за чужой передачи"}, {"ru": "RTS/CTS", "en": "Request To Send / Clear To Send", "df": "резервирование канала перед передачей"}, {"ru": "NAV", "en": "Network Allocation Vector", "df": "виртуальный счётчик занятости канала в 802.11"}, {"ru": "DIFS / SIFS", "en": "DCF/Short Inter-Frame Spacing", "df": "межкадровые интервалы в Wi-Fi (SIFS < DIFS = выше приоритет)"}, {"ru": "DCF / PCF", "en": "Distributed / Point Coordination Function", "df": "режимы доступа 802.11"}], "summary": ["**MAC-протоколы** — правила доступа N станций к общему каналу; 5 семейств", "**Pure ALOHA** (Абрамсон 1970, ALOHANET): передача сразу, при коллизии — случайная задержка; окно уязвимости 2T<sub>frame</sub>", "Pure ALOHA: **S = G·e⁻²ᴳ**, **S<sub>max</sub> ≈ 0,184 (18,4%)** при G=0,5", "**Slotted ALOHA**: передача только с начала слота; **S = G·e⁻ᴳ**, **S<sub>max</sub> ≈ 0,368 (36,8%)** при G=1", "ALOHA до сих пор: VSAT, RFID EPC Gen2, RACH в сотовой связи", "**CSMA** — слушать перед передачей; **1-persistent** (передаёт сразу при свободе, основа Ethernet); **non-persistent** (случайная задержка); **p-persistent** (с вероятностью p)", "Пропускная способность CSMA зависит от **a = τ<sub>prop</sub>/T<sub>frame</sub>**; при малых a достигает 0,8–0,9", "**CSMA/CD** (IEEE 802.3, Ethernet): слушать во время передачи; при коллизии — **jam-сигнал** (32 бит)", "**Двоичный экспоненциальный откат**: после k-й коллизии ожидание t ∈ [0, 2ᵏ−1] слотов (k≤10); 16 коллизий → отказ", "Минимум кадра Ethernet **64 байта** = 2τ<sub>max</sub> при slot time 51,2 мкс на 10 Мбит/с", "В радио CSMA/CD не работает: свой передатчик заглушает прием", "**Bit-map / basic bit-map**: каждой станции свой слот для заявки → передачи без коллизий", "**Двоичный обратный отсчёт** (binary countdown): побитовое сравнение адресов, побеждает максимальный — эффективность ~100%", "**Token passing**: маркер по кольцу — Token Ring (**802.5**), Token Bus (**802.4**), FDDI; ограниченная задержка", "**Ограниченная конкуренция** — гибрид: при малой нагрузке случайный доступ, при большой — детерминированный (adaptive tree walk)", "**Беспроводные**: проблема **скрытого узла** (A,C не слышат друг друга, оба слышат B) — простое CSMA не помогает; **открытый узел** (зря отказывается передавать)", "**MACA** (Karn 1990): **RTS → CTS → Data**; CTS заставляет соседей молчать; **MACAW** + ACK", "**CSMA/CA** (802.11 DCF): DIFS (~34 мкс) → случайный backoff в CW → передача → SIFS (~16 мкс) → **ACK**; CW удваивается при потере", "**NAV** (Network Allocation Vector) — виртуальное прослушивание через поле Duration"]}, {"n": 23, "title": "Физический уровень сети Ethernet. Протокол подуровня управления доступом к среде в Ethernet. Производительность сети Ethernet. Коммутируемые сети Ethernet.", "paragraphs": ["<h3>Общая идея</h3>", "**Ethernet** (стандарт **IEEE 802.3**) — самая распространённая технология проводных локальных сетей. Её разработал Роберт Меткалф в исследовательском центре Xerox PARC в 1973 году. За пятьдесят лет скорости Ethernet выросли в десятки тысяч раз — с первых 3 Мбит/с по толстому коаксиальному кабелю до сотен Гбит/с по оптоволокну. Но при этом **формат кадра и базовые правила доступа практически не изменились** — поэтому старое и новое оборудование уживается между собой.", "В этом вопросе важно разделить два «Ethernet»: первоначальный — с общим кабелем, борьбой за эфир и коллизиями, и современный — коммутируемый, без коллизий вообще.", "<h3>Физический уровень сети Ethernet</h3>", "Физический уровень определяет, по чему именно передаются биты и к
